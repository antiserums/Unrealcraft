    title: "Montages: sections and slots"
    brief: "An Animation Montage is an asset that joins several animations into one sequence that gameplay code can start at any time, for example an attack. You can split a montage into named sections and jump between them while the game runs. A montage plays through a Slot, which is a named place in the Animation Blueprint where the montage is allowed to take over the pose. In this quest you build a montage with three sections, give it a Slot, and control it from the Character Blueprint."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-montage-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-montage-editor-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-slots-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Animation/Montage/MontageJumptoSection"
    checklist:
      - "Open a project made from the Third Person template, or create one. In the Content Browser, right-click any Animation Sequence of the mannequin, for example a jump, and choose Create, then Create AnimMontage. Name the new asset AM_Attack. If you have an attack animation of your own, use that."
      - "Open the montage. Drag two more Animation Sequences from the Asset Browser into the same Slot track, so that the three animations play one after the other."
      - "Right-click the Montage track and create three Montage Sections named Start, Loop and End. Place one section header at the start of each animation."
      - "In the Montage Sections panel, click Clear to remove the existing links. Then link Start to Loop, and link Loop to Loop, so that the middle part repeats."
      - "Open Window > Anim Slot Manager. Add a Slot named FullBody, and set the Slot track of the montage to DefaultGroup.FullBody. Save the Skeleton, because Slots are stored on it."
      - "Open the Animation Blueprint that the character uses (ABP_Unarmed in the current template, ABP_Manny or ABP_Quinn in older versions). In its AnimGraph, add a Slot node just before the Output Pose node, after the locomotion and any other nodes. Set its Slot Name to FullBody."
      - "In BP_ThirdPersonCharacter, use a Play Montage node with the character's Mesh to play AM_Attack when a key is pressed. On a second key, call Montage Jump to Section with the Section Name set to End."
    done_when: "Send two screenshots: one of the Montage Sections panel that shows the links from Start to Loop and from Loop to Loop, and one of the Blueprint graph with Play Montage and Montage Jump to Section. Add one sentence that says what happens when you press the second key."
    xp: 115
    verify_type: screenshot
    quiz:
      - q: "Where do you set the default order in which Montage Sections play?"
        choices: ["In the Montage Sections panel", "In the Anim Slot Manager", "In the Timing track", "In the Character Blueprint Class Defaults"]
        answer_index: 0
        explain: "The Montage Sections panel is where you link each section to the next one. Clear unlinks them first."
