    specializations: [animation]
    subjects: [animation-blueprint, slots, montage, sequencer]
    required_spine: false
    required: false
    title: "Slots v2: groups, interruption and Sequencer"
    brief: "A Slot is a named place in the AnimGraph where a montage, or an animation from a cinematic, can take over the pose. Slots belong to groups, and the group matters: when a new montage starts in a group, the montage that was already playing in that group stops. In this quest you organize slots into a group, limit one slot to the upper body, test how one montage interrupts another, and send an animation from Sequencer into a slot."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-slots-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-blueprint-blend-nodes-in-unreal-engine"
    extra_urls: []
    checklist:
      - "Open a project made from the Third Person template, or create one. Duplicate the Animation Blueprint that the character uses (ABP_Unarmed in the current template, ABP_Manny or ABP_Quinn in older versions), open the copy, and set it as the Anim Class of the Mesh in BP_ThirdPersonCharacter. From the Animation Blueprint, open Window > Anim Slot Manager. Add two slots named FullBody and UpperBody. Add a group named Actions, move both slots into it, and save."
      - "In the AnimGraph, add a Slot node after the State Machine and set its Slot Name to FullBody."
      - "Add a second Slot node and set it to UpperBody. Connect it to a Layered blend per bone node that uses a Branch Filter on spine_01, so that only the upper body plays the slot animation."
      - "Select the FullBody Slot node and enable Always Update Source Pose in its Details panel. With this setting on, the pose that goes into the Slot node keeps updating while a montage plays over it. With it off, that source pose is not updated during the montage. Write down in one line which behavior you need for your character."
      - "Make two montages from any two Animation Sequences of the mannequin, both in the group Actions: AM_Reload on the slot UpperBody and AM_Emote on the slot FullBody. In BP_ThirdPersonCharacter, play each one from its own key press event. Play AM_Reload, and then play AM_Emote before the first one ends. Confirm that the reload stops."
      - "Create a Level Sequence, add the character from the level to it, and add an Animation track with any animation. Right-click the animation section, open Properties, find Slot Name and type FullBody."
    done_when: "Send a screenshot of the Anim Slot Manager that shows both slots in the Actions group, a screenshot of the AnimGraph with both Slot nodes, and a short video clip (30 seconds or less) or two screenshots of AM_Emote interrupting AM_Reload."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Where are Slots and Slot Groups actually stored?"
        choices: ["On the Skeleton asset", "On the Animation Blueprint", "On each Montage", "In Project Settings"]
        answer_index: 0
        explain: "Slots are stored on the Skeleton. The Anim Slot Manager edits the Skeleton no matter which animation editor you open it from."
      - q: "A Slot node has no montage playing on it. What does it output?"
        choices: ["The reference pose", "Nothing, the graph pauses", "The incoming source pose, passed through", "The last montage frame"]
        answer_index: 2
        explain: "Slots pass through the incoming pose when nothing is inserted. They only override once an animation starts playing on the slot."
      - q: "What does enabling Always Update Source Pose on a Slot node change?"
        choices: ["The montage loops", "The slot ignores its group", "The slot works in Sequencer", "The incoming pose keeps evaluating even while the slot is overriding it"]
        answer_index: 3
        explain: "By default an overridden source pose stops evaluating. Always Update Source Pose keeps it evaluating."
      - q: "Two montages use slots in the same Slot Group. You play the second while the first is running. What happens?"
        choices: ["Both play at once", "The second one is ignored", "The first is stopped and the most recent one plays", "They blend 50/50"]
        answer_index: 2
        explain: "Playing a montage on a slot in the same group as an active one stops the active one. This is how reload can be interrupted by an attack."
      - q: "One montage plays animation on several slots at the same time. What rule applies?"
        choices: ["All slots must be in the same Slot Group", "Each slot must be in a different group", "Only DefaultSlot may be used", "The montage must be additive"]
        answer_index: 0
        explain: "A single Montage can play on multiple slots, but they must all be within the same Slot Group."
      - q: "By default, what slot and group exist on every Skeleton?"
        choices: ["FullBody and Actions", "DefaultSlot and DefaultGroup", "UpperBody and DefaultGroup", "None until you add them"]
        answer_index: 1
        explain: "All Skeletons start with a Slot named DefaultSlot and a group named DefaultGroup."
      - q: "How do you make a Sequencer animation section play through a specific slot in the Animation Blueprint?"
        choices: ["Add a Slot track to the sequence", "Right-click the section and set Properties > Slot Name", "Enable Always Update Source Pose", "Bake the animation to a montage first"]
        answer_index: 1
        explain: "In the Animation Track, right-click the section and set Slot Name under Properties. The animation is then inserted into that slot."
      - q: "Why put an upper-body Slot together with a Layered blend per bone node?"
        choices: ["Slots cannot play without it", "So the montage only affects chosen bones and works no matter the locomotion state", "It makes the montage loop", "It changes the Slot Group"]
        answer_index: 1
        explain: "The doc shows an Upper Body Slot with Layered blend per bone so reload or shoot animations only affect the upper body during any locomotion."
    flavors:
      _default: {why: "Slots are the doors through which montages and cinematics enter your animation graph."}
      animation: {why: "Slot groups give you interruption rules for free; use them on purpose.", do: "Add a third slot Additive in its own group and play an additive flinch that does not stop the reload."}

  - id: AQ44
