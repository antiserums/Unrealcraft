      - q: "Where do you set the default order in which Montage Sections play?"
        choices: ["In the Montage Sections panel", "In the Anim Slot Manager", "In the Timing track", "In the Character Blueprint Class Defaults"]
        answer_index: 0
        explain: "The Montage Sections panel is where you link each section to the next one. Clear unlinks them first."
      - q: "You put two Animation Sequences in the same Slot track and they overlap in time. What does the documentation say?"
        choices: ["The later one gets a lower blend weight", "They will interfere with each other, so do not overlap them", "The editor merges them into one sequence", "The first one is muted automatically"]
        answer_index: 1
        explain: "Sequences on the same Slot that play at the same time interfere with one another. Keep them in order without overlap."
