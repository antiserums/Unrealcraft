    specializations: [animation]
    subjects: [ik, ik-rig, full-body-ik, solvers]
    required_spine: false
    required: false
    title: "Full Body IK inside the IK Rig: bone settings"
    brief: "Full Body IK, or FBIK, is a solver that reaches for several goals at the same time, for example both hands and both feet, and moves the whole body to do it. Without extra rules the result often looks wrong: the hips turn too much, or a knee bends the wrong way. Bone settings are per-bone rules, such as stiffness and rotation limits, that keep the pose believable. In this quest you build an FBIK solver inside an IK Rig and tune it with bone settings."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/ik-rig-solvers-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/auto-retargeting-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create an IK Rig named IK_FBIK for the UE5 Mannequin. In the toolbar, click Auto Create IK and look at what it made: an FBIK solver, goals and bone settings."
      - "Delete that result and build your own. Click Add New Solver and choose Full Body IK, and set pelvis as its root. Then add IK Goals on hand_l, hand_r, foot_l and foot_r, and connect all four to the solver."
      - "Drag the hand_r goal far to the front. The pelvis rotates too much. Select the FBIK solver, right-click pelvis and choose Add Settings to Selected Bone. Raise Rotation Stiffness until the hips stay calm."
      - "Add bone settings on foot_l. Set the Limit of the Z axis to Limited with Min -50 and Max 40, as in the example from the documentation. Move the foot goal and check the ankle."
      - "Add bone settings on calf_l. Enable Use Preferred Angles and raise the Z angle, so that the knee bends the right way when the foot goal comes close to the hip."
      - "On the solver, set Root Behavior to Pin to Input, then to Pre Pull, then to Free. Note how the pelvis moves in each mode."
      - "Raise Mass Multiplier to 5 and watch the goals stop reaching their targets. Then raise Iterations until they reach them again."
    done_when: "Send screenshots of the Hierarchy that show the bone settings under pelvis, foot_l and calf_l, and of the Details of the FBIK solver. Add three lines that say which Root Behavior you kept, what Mass Multiplier did, and what the Z limit on the ankle fixed."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "How is Full Body IK different from Limb IK in the IK Rig?"
        choices: ["FBIK works on two bones only", "FBIK accepts several goals that all influence the whole body, and supports bone limits, stiffness and preferred angles", "FBIK cannot have a root bone", "FBIK is cheaper than Limb IK"]
        answer_index: 1
        explain: "FBIK is a multi-goal solver. Unlike Limb IK it can reach for several goals at once and lets you add per-bone settings."
      - q: "How do you create a per-bone setting for FBIK?"
        choices: ["Select the solver, right-click the bone, Add Settings to Selected Bone", "Double-click the bone in the viewport", "Add a second FBIK solver on that bone", "Set the bone as an IK Goal"]
        answer_index: 0
        explain: "With the Full Body IK solver selected, right-click a bone and choose Add Settings to Selected Bone. The setting then appears under the bone in the Hierarchy."
