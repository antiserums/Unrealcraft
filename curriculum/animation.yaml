    title: Spline tail rig
    brief: "A spline is a smooth curve that passes through or near a few points. In a rig, you can place a long chain of bones, such as a tail, a rope or a tentacle, along a spline. The animator then moves only a few controls and the whole chain bends smoothly. In this quest you build a tail rig with four controls, one spline, and a node that fits the bones onto the curve."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/control-rig-spline-rigging-in-unreal-engine"
