        choices: ["Makes it move freely", "Doubles its rotation", "Completely locks the bone from movement", "Turns on stretching"]
        answer_index: 2
        explain: "Rotation and Position Stiffness go from 0 (completely free) to 1 (completely locked). The page uses it to stop the pelvis rotating too aggressively."
      - q: "The ankle twists into an impossible angle. Which bone setting does the source use to fix this?"
        choices: ["Set the Z axis Limit to Limited with a Min and Max range", "Raise Mass Multiplier", "Set Root Behavior to Free", "Enable Allow Stretch"]
        answer_index: 0
        explain: "Limits let you set each axis to Free, Limited or Locked. The example sets Z to Limited with Min -50 and Max 40 to correct the ankle."
      - q: "A large character will not reach its goals. What does the page recommend?"
        choices: ["Lower Iterations to 1", "Increase Mass Multiplier and also increase Iterations so the solve converges", "Remove the root bone", "Use Limb IK instead"]
        answer_index: 1
        explain: "Mass Multiplier fixes severe convergence problems, common on larger characters. Increasing it requires more Iterations to converge."
