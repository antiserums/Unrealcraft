  - id: AQ52
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [sequencer, control-rig, constraints, space-switching]
    required_spine: false
    required: false
    title: "Constraints and space switching for contact"
    brief: "Animation looks fake very quickly when a hand does not stay on the object it holds, or when the eyes do not look at their target. A constraint solves this: it makes one control follow another object without any change to the rig. Space switching is a related tool that changes what a control moves relative to, for example the body or the world. In this quest you constrain a hand to a cup, make the head look at the cup, and switch the space of the other hand."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-constraint-tools-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-editor-mode-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/re-parent-control-rig-controls-in-real-time-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a Level Sequence that has a Control Rig track, in Animation Mode. To make one, drag the Control Rig asset CR_Mannequin_Body from the Content Browser into the level and save the sequence that opens. Place a small prop in the level, for example a cylinder that you name SM_Cup, and add it to the sequence."
      - "Select the IK control of the hand, click Add Constraint (+), choose Parent, and pick SM_Cup with the eyedropper. Move the playhead and confirm that the hand follows the cup. Look at the Constraints section, and at the compensating keys that were created in Sequencer to keep the hand in place."
      - "Move the cup after the constraint exists, so that the hand jumps suddenly. Put the playhead on the constraint key, right-click the constraint and choose Compensate Key. Confirm that the jump is gone."
      - "Add a LookAt constraint from the head control to the cup. Edit the Axis in the context menu of the constraint so that the face points at the cup correctly."
      - "Select the control of the other hand. With the Spaces section open, press Tab in the viewport and switch the control to World at frame 20. Move the body control and confirm that this hand stays in place."
      - "Click Bake... in Spaces and bake the hand back to Parent with Reduce Keys turned on. Then right-click the parent constraint and choose Bake for it as well."
    done_when: "Send two screenshots. The first shows the Animation panel with the Constraints list containing a Parent and a LookAt constraint, and the hand holding the cup. The second shows the track of the hand control with the colored space keys before baking. Add one line that says why you compensated a key."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "How do you create a constraint in Animation Mode?"
        choices: ["Select the parent first, then the child, then press C", "Select the child controls, click Add Constraint (+), pick a type and click the parent with the eyedropper", "Drag the child onto the parent in the Outliner", "Right-click the parent and choose Constrain Selected"]
        answer_index: 1
        explain: "You select the controls to constrain (child), click Add Constraint (+), choose a type, and the cursor becomes an eyedropper to pick the parent in the viewport."
      - q: "What are compensating keyframes for?"
        choices: ["To slow down the parent", "To lock the child from editing", "To store the parent's scale", "To keep the child at its current visual position when the constraint activates"]
        answer_index: 3
        explain: "Most constraints create compensating keyframes that maintain the current visual position of the child when the constraint activates."
      - q: "Two Parent constraints are active on the same control. Which one wins?"
        choices: ["The oldest one", "The one lower in the list, which has higher priority", "Neither; they blend 50/50", "The one higher in the list"]
        answer_index: 1
        explain: "Constraints are hierarchical: new ones are placed lower on the list and override those above, when they animate the same channels."
      - q: "The hand pops when the constraint activates because you moved the parent later. What is the fix?"
        choices: ["Delete and re-create the constraint", "Disable Maintain Offset", "Put the playhead on the constraint key and use Compensate Key", "Enable Dynamic Offset"]
        answer_index: 2
        explain: "Compensate Key re-creates the compensating keyframes for the new parent location; the playhead must be at the constraint key."
      - q: "Which statement about a Parent Constraint is true?"
        choices: ["Scale is not included by default; enable Scaling in the constraint entry", "Scale is included by default", "It follows only rotation", "It cannot be baked"]
        answer_index: 0
        explain: "By default, scale is not included in a Parent Constraint. Right-click the entry and enable Scaling to include it."
      - q: "How does the LookAt constraint handle roll?"
        choices: ["With an up vector like other aim tools", "Roll is always locked to zero", "Roll copies the parent's roll", "You animate the roll axis manually, which avoids flipping"]
        answer_index: 3
        explain: "LookAt does not use up vectors. You animate the roll axis by hand, which also helps avoid rotation flipping."
      - q: "In Space Switching, which element type does the page recommend for custom spaces?"
        choices: ["Bones", "Nulls", "Controls, to avoid cyclical rig errors", "Sockets"]
        answer_index: 2
        explain: "You can use Bones, Controls or Nulls, but the page recommends Controls to avoid cyclical re-parenting errors."
      - q: "When you switch a control to a new space in Sequencer, what is created automatically?"
        choices: ["A space keyframe plus compensating Transform keyframes", "A new Control Rig track", "A constraint entry", "A pose asset"]
        answer_index: 0
        explain: "Selecting a space creates a space keyframe for that control and compensating Transform keyframes that keep its visual position."
    flavors:
      _default: {why: "Hands on props and eyes on targets are where animation looks fake first. Constraints solve this without rig changes."}
      animation: {why: "Contact and pick-up moments are daily work; space switching keeps IK hands stable without extra keys.", do: "Animate a two-hand carry: both hands parent-constrained to the prop, then bake."}
      cinematics: {why: "Eye lines and hand contact sell a shot.", do: "LookAt a moving Cine Camera Actor with the head control."}

  - id: AQ53
    rank: 2
