  - id: AQ37
    rank: 4
    difficulty: master
    specializations: [animation]
    subjects: [ml-deformer, deformation, morph-targets, machine-learning]
    required_spine: false
    required: false
    title: ML Deformer
    brief: "The ML Deformer uses machine learning to give a game character detailed muscle and skin movement, like in films, at a cost that a game can afford. You train it with examples: an animation of many different poses, and a Geometry Cache, a file that stores how the high quality mesh should look in every one of those poses. The trained model then corrects the normal mesh while the game runs. In this quest you train a small model, test it, reduce its memory use, and add it to a character."
    time_min: 150
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/ml-deformer-framework-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-use-the-machine-learning-deformer-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/ml-deformer-sample-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Enable the two plugins ML Deformer Framework and ML Deformer Neural Morph Model in Edit > Plugins, and restart the editor."
      - "Get training data: a Skeletal Mesh, an Animation Sequence of random poses and a matching Geometry Cache (an .abc file). If you have no data of your own from a 3D program, use Epic's ML Deformer Sample from Fab, which contains all three."
      - "If you import an Alembic file yourself, use these settings: set Import Type to Geometry Cache, turn Flatten Tracks off, set Compressed Position Precision to 0.001, and turn Store Imported Vertex Numbers on."
      - "Create MLD_Character with the Neural Morph Model: in the Add menu choose Animation, then Deformers, then ML Deformer. Assign the Skeletal Mesh, the Anim Sequence and the Geometry Cache. Enable Draw Deltas and move through 10 frames to check that the two meshes line up."
      - "In Network Inputs, click Add All Animated Bones, and then remove the twist, roll and helper bones. Set Mode to Local. Train first with a small Num Iterations, between 1000 and 3000."
      - "Switch to Testing mode. Compare Weight 0 with Weight 1, and show the Activations heat map. Then raise Delta Zero Threshold until the value GPU Memory (Morph Targets) drops and you still see no loss in quality."
      - "Make an Actor Blueprint named BP_MLCharacter with a Skeletal Mesh component that uses the trained mesh. Add an MLDeformer component and assign MLD_Character to it. Set the Mesh Deformer of the mesh to DefaultMLDeformerGraph. You must enable Show Engine and Plugin Content to find this asset."
    done_when: "Send screenshots of the deltas debug view, of the heat map in Testing mode, of the Statistics section before and after your Delta Zero Threshold change, and of the Blueprint components. Add 5 lines that say which bones you removed and why, and give one case where you would NOT use the ML Deformer."
    xp: 120
    verify_type: screenshot
    quiz:
      - q: "Which three inputs does ML Deformer training need?"
        choices: ["A Skeletal Mesh, an Animation Sequence of varied poses, and a Geometry Cache with the target deformations", "A Static Mesh, a Material and a Texture", "A Control Rig, a Physics Asset and a Blend Space", "Two Skeletal Meshes and a Pose Asset"]
        answer_index: 0
        explain: "Training uses a Skeletal Mesh, an Animation Sequence covering a wide range of motion, and a Geometry Cache (from an Alembic file) that holds the desired deformations."
      - q: "What does the trained ML Deformer produce at runtime with the Neural Morph Model?"
        choices: ["A new Skeleton", "Morph Targets that approximate the high quality deformation on top of linear skinning", "Cloth simulation", "A physics ragdoll"]
        answer_index: 1
        explain: "The framework trains a model to make Morph Target selections that approximate the offline deformation. Linear skinning still runs, and the deltas are added by the deformer."
      - q: "Which model does Epic recommend by default for skin and muscle deformation on characters?"
        choices: ["Vertex Delta Model", "Nearest Neighbor Model", "Neural Morph Model", "Geometry Cache Model"]
        answer_index: 2
        explain: "The Neural Morph Model is the general model for character deformation and is recommended by default. Nearest Neighbor targets cloth and is experimental. Vertex Delta is an example only."
      - q: "The Vertex Delta Model is listed in the editor. When should you use it?"
        choices: ["For production cloth", "For mobile only", "When you have fewer than 1000 frames", "Never in production; it is a GPU example model with no compression"]
        answer_index: 3
        explain: "Vertex Delta is a simplified GPU-only example of the Neural Morph global mode without engine morph targets or compression. It should only be a reference for custom models."
      - q: "Neural Morph Mode Local versus Global: which statement is correct per the source?"
        choices: ["Global needs the least training data", "Local trains one network per bone, needs less data, and gives sparser morph targets; Global considers all bones together and needs more data", "Local is slower on the GPU", "Global is the default mode"]
        answer_index: 1
        explain: "Local is the default, learns around individual joints and produces sparse morph targets that run faster. Global learns coordinated movement but needs more data, best with randomized poses."
      - q: "Your training Animation Sequence and Geometry Cache have different frame counts. What happens?"
        choices: ["The editor fixes it automatically", "Only the first frame is used", "Training results will be wrong; both must match in frame rate, frame count, poses per frame and vertex count", "The Geometry Cache is ignored"]
        answer_index: 2
        explain: "Each training pair must run at the same frame rate, have the same number of frames with the same pose on each frame, and matching vertex counts. Mismatches are listed as a troubleshooting cause."
      - q: "Why should you remove twist and helper bones from the Network Inputs?"
        choices: ["They crash the trainer", "Only bone rotations are used, and fewer well-chosen bones give better results; helper bones do not add useful deformation signal", "They are not skinned", "The GPU cannot store them"]
        answer_index: 1
        explain: "Training only uses the rotation of the listed bones. Epic recommends the minimum set of bones the deformation depends on and excluding twist, roll and helper bones."
      - q: "Which setting has one of the most significant effects on runtime memory and performance?"
        choices: ["Delta Zero Threshold", "Learning Rate", "Label Height", "Mesh Spacing"]
        answer_index: 0
        explain: "Delta Zero Threshold drops small deltas from the morph targets. The page says setting a functional value has one of the most significant effects on runtime memory and performance. Tune it before Compression Level."
      - q: "What minimum amount of training data does the troubleshooting table suggest for an average character?"
        choices: ["100 frames", "At least 3000 frames, with 7500 or more for good results", "Exactly 10 poses", "One frame per bone"]
        answer_index: 1
        explain: "The Neural Morph troubleshooting says to use at minimum 3000 frames for average characters, and at least 7500 for good results."
      - q: "In the Blueprint, you added the MLDeformer component but nothing deforms in game. What else is required?"
        choices: ["A Physics Asset", "Enable root motion", "A second Skeletal Mesh", "Set a Deformer Graph in the Skeletal Mesh Component's Mesh Deformer property, for example DefaultMLDeformerGraph"]
        answer_index: 3
        explain: "The setup adds the MLDeformer component with the asset, then sets the mesh component's Mesh Deformer to a Deformer Graph. Setting the graph in the ML Deformer asset alone does not add it to the component."
      - q: "While debugging a PIE actor from the ML Deformer editor, which heat map mode works?"
        choices: ["Ground Truth only", "Activations only, because there is no live ground truth in the game", "Both modes", "Neither, heat maps are training only"]
        answer_index: 1
        explain: "When debugging a live PIE actor, only the Activations heat map mode works because there is no ground truth Geometry Cache for the game pose."
      - q: "Where do you check the GPU cost of the ML Deformer at runtime?"
        choices: ["Stat Unit", "The Rewind Debugger", "Unreal Insights, Morph Target item in the GPU section, and the GPU Memory (Morph Targets) statistic in the asset", "Shader Complexity view"]
        answer_index: 2
        explain: "The page points to Unreal Insights' Morph Target GPU item and the MLDeformerComponent CPU section. In the asset, GPU Memory (Morph Targets) is called the most consequential statistic."
    flavors:
      _default: {why: "Film-quality muscle and skin at game frame rates is now possible. Know what it costs and what data it needs."}
      animation: {why: "The ML Deformer sits after your animation. Bad range of motion in training shows up as broken shoulders in game.", do: "Add one Bone Group (for example left and right clavicle) and show the difference on the upper back."}
      tech_art: {why: "You will own the Maya or Houdini data generation and the Alembic import settings."}
      cinematics: {why: "Close-up hero shots are where the ML Deformer pays off. Know which characters deserve it."}

  - id: AQ38
    rank: 4
    difficulty: master
    specializations: [animation]
    subjects: [chaos-cloth, clothing, simulation, physics]
    required_spine: false
    required: false
    title: Chaos Cloth on a character
    brief: "Cloth simulation makes a cape, a skirt or a coat move by physics, so that it swings and follows the character. Unreal does this with its Chaos Cloth system. You control the cloth by painting masks on the mesh: values that say how far each point of the cloth is allowed to move. Good masks and good collision keep the cloth from passing through the body. In this quest you turn a cape into cloth, paint its masks, tune the settings, and fix one clipping problem."
    time_min: 150
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/clothing-tool-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/clothing-tool-in-unreal-engine---properties-reference"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/panel-cloth-editor-overview"
    checklist:
      - "Open a project made from the Third Person template, or create one. Use a character whose cape, skirt or coat has its own material section, for example your own character or a free one from Fab, Epic's asset store. If you have none, you can practice on a copy of SKM_Manny_Simple: use one of its material sections as the cloth, and later paint the Max Distance mask so that only a small area, such as the lower back, is allowed to move."
      - "In the Skeletal Mesh Editor, click Section Selection and select the cape section. Right-click it and choose Create Cloth Asset from Selection. Name the asset CA_Cape and set the Physics Asset of the character, which is used for collision."
      - "Right-click the section again and choose Apply Clothing Asset, then CA_Cape. Open Window > Clothing and click Activate Cloth Paint."
      - "Create a Max Distance mask. Paint the value 0 along the shoulders, so the cloth stays fixed there. Then use the Gradient tool to go down to a large value at the hem, the bottom edge of the cape. Hold H to preview the cloth."
      - "Add a Backstop Distance mask so that the cape cannot pass into the back of the character. Then tune these Config values: Damping, Gravity Scale and Collision Thickness. Set Wind Method to Accurate."
      - "Play the character with a run animation and a turn for about 20 seconds, and take screenshots or record a short video clip of the cloth moving. Fix one clipping problem, a place where the cloth goes through the body, by changing a mask and not the mesh."
      - "Read the overview page of the Panel Cloth Editor in Epic's documentation. Write 3 lines about when you would use the Dataflow-based cloth asset in place of this legacy (older) tool."
    done_when: "Send screenshots of the Clothing panel with your masks and of the Config values you changed. Also send a short video clip (30 seconds or less), or two screenshots, of the cloth moving while the character runs and turns. Add 5 lines that say what each mask does, how you fixed the clipping, and your note about the Panel Cloth Editor."
    xp: 120
    verify_type: screenshot
    quiz:
      - q: "Which solver runs clothing in Unreal Engine, and what is its advantage per the page?"
        choices: ["PhysX APEX; it needs a DCC plugin", "Chaos Cloth; a low-level particle solver with direct access to the simulation data", "Niagara; it runs on the GPU", "Havok Cloth; it is precomputed"]
        answer_index: 1
        explain: "Unreal uses the Chaos Cloth solver, a low-level clothing solver for the particle simulation. Direct access to simulation data keeps integrations lightweight and extensible."
      - q: "Where do you start when creating a cloth asset from part of a Skeletal Mesh?"
        choices: ["In the Content Browser, Add > Physics > Cloth", "In the Animation Blueprint", "In Project Settings > Physics", "In the Skeletal Mesh Editor, click Section Selection, select the material section, right-click and choose Create Cloth Asset from Selection"]
        answer_index: 3
        explain: "Section Selection lets you pick the material section. The right-click context menu then offers Create Cloth Asset from Selection, and later Apply Clothing Asset."
      - q: "What is the Remove from Mesh option for when creating a cloth asset?"
        choices: ["It deletes the Skeletal Mesh", "Use it when a separate low-poly section drives a high-poly render mesh, so the driver section is not rendered", "It removes the Physics Asset", "It disables collision"]
        answer_index: 1
        explain: "Remove from Mesh controls whether the selected section is left behind. Enable it when driving a high-poly mesh with a low-poly one."
      - q: "What does the Physics Asset field do when creating a cloth asset?"
        choices: ["It provides collision for the cloth simulation", "It sets the cloth material", "It bakes the cloth to bones", "It sets the wind direction"]
        answer_index: 0
        explain: "The Physics Asset is used to extract collisions. The reference notes it exports spheres and sphylls and supports up to 32 convex faces or 5 boxes."
      - q: "What are the paint controls in the cloth paint tool?"
        choices: ["Left mouse paints, Shift plus left mouse erases, H previews the cloth", "Right mouse paints, Ctrl erases, P previews", "Space paints, Backspace erases", "Left mouse paints, Delete erases, F previews"]
        answer_index: 0
        explain: "The page lists Paint as Left Mouse Button, Erase as Shift plus Left Mouse Button, and Cloth Preview as H."
      - q: "A Paint Value of 100 on a Max Distance mask means what?"
        choices: ["The vertex is locked", "The vertex can move one meter from its animated position", "100 percent stiffness", "The vertex is removed from the simulation"]
        answer_index: 1
        explain: "A value of 0 means the skinned vertex cannot move. A value of 100 allows it to move one meter from its original position."
      - q: "How do you paint a gradient from the shoulders to the hem?"
        choices: ["Paint with the Brush twice", "Use Fill with a Threshold", "Left-click the start value (green), Ctrl plus left-click the end value (red), then press Enter", "Hold H and drag"]
        answer_index: 2
        explain: "The Gradient tool marks the start value with a green dot on left-click, the end value with a red dot on Ctrl plus left-click, and applies the gradient when you press Enter."
      - q: "What does Backstop Distance do?"
        choices: ["It sets the cloth thickness", "It offsets from Max Distance to limit movement, so cloth cannot push inward past a point", "It is the spring to the animated pose", "It controls wind lift"]
        answer_index: 1
        explain: "Backstop Distance is the offset used from any point on the cloth to limit movement within the Max Distance. Backstop Radius adds a sphere region the cloth cannot enter."
      - q: "An animator wants cloth to follow the keyed animation more closely in a cutscene, controlled at runtime. Which mask target and mechanism?"
        choices: ["Max Distance, set to 0", "Backstop Radius, set high", "Self Collision Radius", "Anim Drive Multiplier, which drives springs toward the animated position and can be scaled at runtime through the interactor on the Skeletal Mesh Component"]
        answer_index: 3
        explain: "Anim Drive Multiplier drives springs that pull cloth to its animated position. Blueprints can set it at runtime through the interactor; the runtime value multiplies the painted values."
      - q: "You have two Max Distance masks. Can both be active?"
        choices: ["Yes, they add together", "No, you can keep several masks but only one per Target can be assigned at a time", "Yes, if they have different names", "No, the second is deleted"]
        answer_index: 1
        explain: "You can have multiples of each Target but only one of each can be assigned at a time. This lets you test setups non-destructively."
      - q: "Which Config change makes cloth stretchier and bouncier, per the reference?"
        choices: ["Lower Solver Frequency", "Higher Gravity Scale", "Higher Collision Thickness", "Wind Method set to Legacy"]
        answer_index: 0
        explain: "Solver Frequency is the frequency of the position solver, where lower values lead to stretchier, bouncier cloth."
      - q: "The Panel Cloth Editor (Chaos Cloth Panel node editor) differs from the legacy tool in which way?"
        choices: ["The cloth asset is separate from the Skeletal Mesh, built with a Dataflow graph, used through a Chaos Cloth component, at a slightly higher rendering cost", "It uses a different physics solver", "It cannot use a Physics Asset", "It bakes cloth into the draped pose"]
        answer_index: 0
        explain: "Both use the same Chaos solver. The panel editor builds a separate, non-destructive cloth asset via Dataflow, reusable across characters through a Chaos Cloth component, but rendering it as its own component adds draw-call overhead."
    flavors:
      _default: {why: "Cloth sells a character in motion. Masks and collision decide if it looks alive or breaks through the body."}
      animation: {why: "You will paint masks and tune configs so cloth reads with the animation, not against it.", do: "Set Anim Drive Multiplier from a Blueprint at runtime and show the cape stiffening during a montage."}
      tech_art: {why: "Cloth cost and collision setup are yours to budget. Know both the legacy tool and the panel editor."}
      cinematics: {why: "Anim Drive is your friend when the director wants the cape to hit a mark."}

  - id: AQ39
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [animation-blueprint, blend-space, locomotion]
    required_spine: false
    required: false
    title: "2D Blend Space: smoothing and analysis"
    brief: "A Blend Space is an asset that mixes several animations based on one or two values. In a 2D Blend Space you place animations on a graph with two axes, here Direction and Speed, and Unreal blends the nearest ones for any point on the graph. Almost every character movement system is built on one. In this quest you create a 2D Blend Space, let Unreal place the animations by analysis, and tune its smoothing."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blend-spaces-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blend-spaces-in-animation-blueprints-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/automatic-blend-space-creation-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a 2D Blend Space asset named BS_Strafe for the Mannequin skeleton. To do this, click Add, then Animation, then Blend Space."
      - "In Asset Details, name the horizontal axis Direction with a range from -180 to 180. Name the vertical axis Speed with a range from 0 to 600."
      - "Set both Axis Functions to Locomotion. Choose Rightward Speed for the horizontal axis and Forward Speed for the vertical axis. Set Bone/Socket 1 and Bone/Socket 2 to the two foot bones."
      - "Drag idle, walk and run animations onto the graph and watch the analysis place them. If you see red triangles, which are very thin, fix them by moving the samples."
      - "On the Speed axis, set Smoothing Time to 0.2 and Smoothing Type to Spring Damper. Hold Ctrl and move the mouse in the graph, and watch the second crosshair follow with a delay."
      - "Set Notify Trigger Mode to Highest Weighted Animation, so that only the strongest animation fires its notifies."
      - "Duplicate the Animation Blueprint that the character uses (ABP_Unarmed in the current template, ABP_Manny or ABP_Quinn in older versions) and open the copy. In its AnimGraph, add BS_Strafe as a Blendspace Player node. Drive its Direction and Speed inputs from variables."
    done_when: "Send a screenshot of the Blend Graph with Show Triangulation turned on and your samples placed. Also send a screenshot of Asset Details that shows the axis names, Smoothing Time and Notify Trigger Mode."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Use Grid is disabled by default. What does the Blend Space use instead to blend between samples?"
        choices: ["Triangulation", "Nearest sample only", "A curve table", "Additive layers"]
        answer_index: 0
        explain: "By default the Blend Space uses triangulation. The legacy grid mode is only for special cases such as Wrap Input."
      - q: "You want an input value outside the axis range to loop to the other side, like an angle. Which axis property does this?"
        choices: ["Snap to Grid", "Grid Divisions", "Wrap Input", "Axis to Scale Animation"]
        answer_index: 2
        explain: "Wrap Input treats the axis as circular. The docs warn that the animations at both ends must be similar or you get popping."
      - q: "Smoothing Type is Spring Damper and Damping Ratio is set below 1. What happens?"
        choices: ["The blend becomes instant", "The value overshoots the target, which can look more natural", "Smoothing is disabled", "Only the vertical axis is smoothed"]
        answer_index: 1
        explain: "A Damping Ratio under 1 gives overshoot. The docs say this can make some motions look more natural."
      - q: "Weight Speed is set to 2.0. How fast can one sample go from weight zero to weight one?"
        choices: ["In 2 seconds", "In 1 second", "In half a second", "Instantly"]
        answer_index: 2
        explain: "Weight Speed 2.0 means a sample can change its weight from 0 to 1 in half a second. Do not combine it with Smoothing Time."
      - q: "Which Notify Trigger Mode fires notifies only from the sample that has the most weight?"
        choices: ["All Animations", "None", "First Sample", "Highest Weighted Animation"]
        answer_index: 3
        explain: "Highest Weighted Animation only triggers the notifies of the strongest sample. All Animations fires them all; None fires nothing."
      - q: "A triangle in the Blend Graph turns red. What does this mean?"
        choices: ["The sample uses the wrong skeleton", "The triangulation is very thin and the samples should be moved", "Root motion is missing", "The axis range is too large"]
        answer_index: 1
        explain: "Red triangles show very thin triangulation between points. This often happens after Blend Space Analysis and you should adjust the samples."
      - q: "Where can Blend Space Analysis NOT be used?"
        choices: ["On Aim Offset assets", "On 1D Blend Spaces", "On Blend Space nodes created inside an Animation Blueprint", "On Blend Spaces with Wrap Input"]
        answer_index: 2
        explain: "The docs state that Blend Space Analysis cannot be used for Blend Space nodes created in Animation Blueprints. It works on assets."
      - q: "You want a Blend Space node whose sample time is set by a normalized 0 to 1 float from your graph instead of playing by itself. Which node do you use?"
        choices: ["Blendspace Player", "Blendspace Evaluator", "Blend Space Graph", "Aim Offset Player"]
        answer_index: 1
        explain: "The Blendspace Evaluator has its sample time controlled externally with a 0 to 1 value. By default it teleports to that time and does not advance."
    flavors:
      _default: {why: "A well-tuned 2D Blend Space is the base of almost every locomotion system."}
      animation: {why: "Sample placement, smoothing and notify mode decide if your locomotion feels solid.", do: "Try Preferred Triangulation Direction set to Radial and compare with Tangential."}

  - id: AQ40
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [animation-blueprint, aim-offset, additive]
    required_spine: false
    required: false
    title: "Aim Offset v2: mesh space additive done right"
    brief: "An Aim Offset lets a character look or aim in any direction without a separate animation for each angle. It is a kind of Blend Space made of additive poses, which are poses stored as a difference from a base pose and then added on top of other animations. With the Mesh Space setting, the aim direction stays correct even when the body below is leaning. In this quest you prepare 9 aim poses, build an Aim Offset from them, and use it in an Animation Blueprint."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/aim-offset-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blend-spaces-in-animation-blueprints-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/automatic-blend-space-creation-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Prepare 9 aim poses: center, up, down, left, right and the 4 corners."
      - "If you have no aim poses, make simple ones. Open the idle animation of the mannequin, pause it, and rotate a spine bone in the Skeleton Tree so that the upper body leans in one direction. Click Create Asset in the toolbar, choose Create Animation, then Current Pose, and save it with a clear name such as Aim_Up."
      - "Do this for all 9 poses, with no rotation for the center pose. Then open the Animation Sequence of each pose."
      - "In each sequence, set Additive Anim Type to Mesh Space and set Base Pose Type to Selected animation frame. Set Base Pose Animation to the center pose, which aims forward, and set Ref Frame Index to 0."
      - "Create an Aim Offset named AO_Aim for the same skeleton. To do this, click Add, then Animation, then Aim Offset. Set Preview Base Pose to the center pose."
      - "Set both Axis Functions to Orientation. For the horizontal axis choose Axis Yaw, and for the vertical axis choose Axis Pitch. Set Bone/Socket to the bone of the hand that holds the weapon, set Bone Facing Axis to +X and Bone Right Axis to +Y."
      - "Drag the 9 poses into the graph and let the analysis place them. If needed, correct the axis ranges so that they go from -90 to 90."
      - "Duplicate the Animation Blueprint that the character uses (ABP_Unarmed in the current template, ABP_Manny or ABP_Quinn in older versions) and open the copy. In its AnimGraph, add AO_Aim as a player node after the State Machine. Drive its Yaw and Pitch inputs with property access from the base aim rotation of the pawn."
      - "Set LOD Threshold on the Aim Offset node to 2, so the node stops running on the simpler, far away versions of the mesh."
    done_when: "Send a screenshot of the Aim Offset graph with all 9 samples placed, and a screenshot of the AnimGraph that shows the Aim Offset node with Yaw and Pitch bound and LOD Threshold set."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What kind of animations does an Aim Offset accept as samples?"
        choices: ["Any looping animation", "Only additive animations", "Only root motion animations", "Only Pose Assets"]
        answer_index: 1
        explain: "Aim Offsets are Blend Spaces whose samples must be additive. The docs say Aim Offsets only accept animations that are additive."
      - q: "Why must Additive Anim Type be Mesh Space and not Local Space for aim poses?"
        choices: ["Local Space is slower to evaluate", "Mesh Space applies rotations in the space of the Skeletal Mesh Component, so aiming up still points up when the base pose leans", "Local Space cannot be previewed", "Mesh Space uses fewer bones"]
        answer_index: 1
        explain: "With Local Space, a leaning base pose skews the up-aim. Mesh Space applies the offset rotations consistently regardless of the preceding bone."
      - q: "Which Asset Details property lets you preview the additive samples on a real base animation?"
        choices: ["Preview Base Pose", "Start Position", "Axis to Scale Animation", "Per Bone Overrides"]
        answer_index: 0
        explain: "Preview Base Pose sets the base animation to play so the additive behaviour is shown correctly in the editor."
      - q: "The docs warn about one axis of aiming that can look wrong while the character runs. Which axis, and what is one suggested fix?"
        choices: ["Pitch; disable smoothing", "Roll; add more samples", "Pitch; use Local Space additive", "Yaw; limit the side-to-side extremes to when the character is stationary, or let the character rotation handle yaw"]
        answer_index: 3
        explain: "Side-to-side (yaw) extremes can break during locomotion. Limit the incoming yaw in the Animation Blueprint, or aim only up and down and let the actor rotate."
      - q: "For automatic placement of aim poses, which Axis Function do the docs recommend for both axes?"
        choices: ["Locomotion", "Velocity", "Orientation", "Root Motion"]
        answer_index: 2
        explain: "The Aim Offset example sets both Horizontal and Vertical Axis Function to Orientation, with Yaw and Pitch as the axes."
      - q: "LOD Threshold on the Aim Offset node is set to 2. What happens when the component is at LOD 3?"
        choices: ["The node still runs", "The node is disabled", "The node runs at half rate", "The node switches to Local Space"]
        answer_index: 1
        explain: "LOD Threshold is the maximum LOD the node may run on. At LOD 3 it is disabled. A value of -1 always runs."
      - q: "What must be connected to an Aim Offset node besides the Yaw and Pitch values?"
        choices: ["A Base Pose", "An Inertialization node", "A Slot", "A Blend Profile"]
        answer_index: 0
        explain: "Aim Offset nodes receive an input pose. You connect a Base Pose, usually the same animation used as the base or a State Machine with a similar pose."
      - q: "In the additive setup, what value does the doc use for Ref Frame Index?"
        choices: ["1", "The last frame", "0", "The middle frame"]
        answer_index: 2
        explain: "Base Pose Type is Selected animation frame with Ref Frame Index 0, using the same base animation as the Preview Base Pose."
    flavors:
      _default: {why: "Aim Offsets are how characters look and aim at things without a new animation per angle."}
      animation: {why: "Wrong additive settings are the most common reason an aim system looks broken.", do: "Add a lean to the base pose and compare Local Space vs Mesh Space with a screenshot of each."}

  - id: AQ41
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [animation-blueprint, blend-nodes, inertialization]
    required_spine: false
    required: false
    title: "Blend Poses by bool, int and enum"
    brief: "Characters often need a different pose depending on a value, for example crouched or not, or which weapon they hold. The Blend Poses nodes do this: they take a bool (true or false), an int (a whole number) or an enum (a list of named options) and blend to the pose that matches the value. In this quest you add these nodes to an Animation Blueprint, set how long each blend takes, and watch the poses switch in the preview."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-blueprint-blend-nodes-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/graphing-in-animation-blueprints-in-unreal-engine"
    extra_urls: []
    checklist:
      - "Open a project made from the Third Person template, or create one. Duplicate the Animation Blueprint that the character uses (ABP_Unarmed in the current template, ABP_Manny or ABP_Quinn in older versions) and open the copy. Create an enum named E_Stance with the values Unarmed, Rifle and Pistol. Then, in the Animation Blueprint, create a variable named Stance of that type."
      - "Add a Blend Poses by Enum node after the locomotion State Machine. Connect Stance to Active Enum Value. Add a pose input for each stance by right-clicking the node and choosing Add Blend Pin. Connect the locomotion to the first input, and any two different animations of the mannequin, as Sequence Players, to the other two."
      - "In the Details panel, show the Blend Time pins, and set a different Blend Time for each pose: 0.1, 0.3 and 0.5."
      - "Add a Blend Poses by bool node for IsCrouched. Place an Inertialization node after it, close to the Output Pose."
      - "Add a Blend Multi node with three inputs, and drive it with a float variable named Alpha."
      - "In the Anim Preview Editor, change Stance and IsCrouched. Watch how the pulsing pose links change to show which pose is active."
    done_when: "Send a screenshot of the AnimGraph that shows the Blend Poses by Enum, Blend Poses by bool and Inertialization nodes with their pins connected. Also send a screenshot of the Details panel of one blend node that shows the Blend Time values."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "On a standard Blend node with Alpha 0, which pose wins?"
        choices: ["Pose B", "Pose A", "Both equally", "Neither, the node outputs the reference pose"]
        answer_index: 1
        explain: "Alpha 0 favours the primary (A) pose and Alpha 1 favours the secondary (B) pose."
      - q: "How do you add another input pose to a Blend Poses by int node?"
        choices: ["Compile the graph twice", "Drag a second pose onto the node", "Change the Transition Type", "Right-click the node and select Add Blend Pin"]
        answer_index: 3
        explain: "Nodes that accept more than two poses get extra pins with Add Blend Pin from the right-click menu. Remove Blend Pin removes one."
      - q: "What does the Blend Time value on a Blend Poses by bool node control?"
        choices: ["How long the true pose plays", "How long it takes to blend into that pose", "The play rate of the pose", "The LOD threshold"]
        answer_index: 1
        explain: "Each pose input has a Blend Time float that sets how long the blend into that pose takes."
      - q: "An inertial blend has started. What happens to the source (outgoing) pose?"
        choices: ["It keeps evaluating until the blend ends", "It is no longer evaluated at all", "It is evaluated at half rate", "It becomes additive"]
        answer_index: 1
        explain: "Once an inertial blend activates, the source pose is no longer evaluated. Traditional crossfades evaluate both poses for the whole transition."
      - q: "Your graph requests an inertial blend but there is no Inertialization or Dead Blending node. What does the docs say happens?"
        choices: ["The engine adds one automatically", "The blend becomes a normal crossfade silently", "A runtime error is logged in the Message Log", "The Animation Blueprint fails to compile"]
        answer_index: 2
        explain: "A missing Inertialization node with a pending request logs a runtime error in the Message Log panel."
      - q: "Why does the doc suggest placing a single Inertialization node close to the Output Pose?"
        choices: ["One node can handle many inertial blend requests, which can remove standard blends and improve performance", "It must be the last node before IK", "Only one Inertialization node is allowed per graph", "It stops notifies from firing"]
        answer_index: 0
        explain: "A single Inertialization node handles many requests. Deferring it closer to the Output Pose can reduce or remove standard blends."
      - q: "A source animation had an Anim Notify late in its clip. After inertial blending begins, what happens to that notify?"
        choices: ["It fires as usual", "It no longer triggers, because the source is not evaluated any more", "It fires twice", "It fires on the target animation instead"]
        answer_index: 1
        explain: "Because the source pose stops evaluating, its notifies no longer trigger. You may need to refactor notify-based logic."
      - q: "What is a key difference between the Dead Blending node and the Inertialization node?"
        choices: ["Dead Blending is production ready and Inertialization is experimental", "Dead Blending works only on additive poses", "Inertialization requires a Blend Profile", "Dead Blending predicts future poses of the outgoing animation and respects transition blend curves, but is experimental"]
        answer_index: 3
        explain: "Dead Blending predicts the outgoing pose and takes blend curves into account, but is experimental and not recommended for shipping."
    flavors:
      _default: {why: "Switching poses by a value is the everyday way to build stance, weapon and crouch systems."}
      animation: {why: "Blend times and inertialization decide if a stance change looks snappy or mushy.", do: "Use a Blend Profile on the Blend Poses by Enum node so the legs blend faster than the arms."}

  - id: AQ42
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [animation-blueprint, blend-mask, blend-profile, skeleton]
    required_spine: false
    required: false
    title: "Blend Masks and Blend Profiles"
    brief: "A Blend Mask is a list of values from 0 to 1 for each bone, which says how much of an animation is applied to that bone. With it you can play an animation on the upper body only. A Blend Profile is a similar list that makes some bones blend faster or slower than others during a transition. Both are saved on the Skeleton, so you can use them again in many places. In this quest you create one of each and use them in an Animation Blueprint."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blend-masks-and-blend-profiles-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-blueprint-blend-nodes-in-unreal-engine"
    extra_urls: []
    checklist:
      - "Open a project made from the Third Person template, or create one. Open the Mannequin Skeletal Mesh, for example SKM_Manny_Simple. In the Skeleton Tree, open Options and choose Add Blend Mask. Name the mask BM_UpperBody."
      - "Right-click the bone spine_01 and use Recursively Set Blend Scales to set it and all the bones below it to 1. Set the pelvis and the leg bones to 0."
      - "Duplicate the Animation Blueprint that the character uses (ABP_Unarmed in the current template, ABP_Manny or ABP_Quinn in older versions) and open the copy. Add a Layered blend per bone node. Set its Blend Mode to Blend Mask and pick BM_UpperBody. Connect the locomotion as the base pose, and connect a Slot node as the blend pose, so that a montage played on that slot shows on the upper body only."
      - "Go back to the Skeleton Tree, open Options and choose Add Time Blend Profile. Name it Profile_LegsFast. Set the pelvis and the upper body bones to 1.0 and the leg bones to 0.5."
      - "In the State Machine of the Animation Blueprint, select a transition rule, for example the one from Idle to the walk and run state, and set its Blend Profile to Profile_LegsFast. Also set the same profile on a Blend Poses by bool node."
      - "Play in the editor. Compare how the character stops with the profile and without it."
    done_when: "Send a screenshot of the Skeleton Tree that shows the Blend column with the BM_UpperBody values, a screenshot of the Details panel of the Layered blend per bone node with Blend Mode set to Blend Mask, and a screenshot of the Details panel of a transition rule with Profile_LegsFast assigned."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Where are Blend Masks and Blend Profiles stored?"
        choices: ["In the Animation Blueprint", "In the Skeletal Mesh material", "In the Skeleton asset", "In each Animation Sequence"]
        answer_index: 2
        explain: "Both are stored in the Skeleton asset. Editing them edits the Skeleton."
      - q: "A bone has a Blend Mask value of 0. What happens to animation on that bone in a Layered blend per bone using the mask?"
        choices: ["Animation plays at full strength", "No animation from the blend pose plays on that bone", "The bone is hidden", "The bone blends at double speed"]
        answer_index: 1
        explain: "Values go from 0 to 1. A value of 0 means no animation plays on that bone; 1 means 100 percent."
      - q: "Which Blend Mode must you set on the Layered blend per bone node to use a Blend Mask?"
        choices: ["Blend Mask", "Branch Filter", "Mesh Space", "Additive"]
        answer_index: 0
        explain: "Set Blend Mode to Blend Mask, then pick your mask in the Blend Masks property. Branch Filter is the default alternative."
      - q: "What is the quickest way to set the same blend value on a bone and all its children?"
        choices: ["Type the value on each bone", "Use the Anim Slot Manager", "Enable Snap to Grid", "Right-click the bone and select Recursively Set Blend Scales"]
        answer_index: 3
        explain: "Recursively Set Blend Scales applies the value across a bone and all of its children in one step."
      - q: "In a Time Blend Profile, what does a value of 0.5 on the leg bones do when the base blend time is 2 seconds?"
        choices: ["Legs blend over 4 seconds", "Legs do not blend at all", "Legs blend over 1 second", "Legs blend instantly"]
        answer_index: 2
        explain: "Time profiles multiply the base blend time. 0.5 halves it, so legs blend in 1 second while bones at 1.0 use the full 2 seconds."
      - q: "In a Weight Blend Profile, which value makes a bone blend twice as fast?"
        choices: ["0.5", "0.0", "2.0", "1.0"]
        answer_index: 2
        explain: "Weight profiles use a factor: 1.0 is normal speed and higher numbers are faster, so 2.0 is twice as fast. This is the opposite of Time profiles."
      - q: "Which of these can NOT take a Blend Profile according to the docs?"
        choices: ["A State Machine transition rule", "Blend Poses by int", "An Animation Montage blend in/out", "A Blendspace Player node"]
        answer_index: 3
        explain: "Blend Profiles apply to Blend Poses by bool/int/enum, State Machine transitions and Montages. Blend Space players are not in the list."
      - q: "You do not see a column to edit Blend Mask values in the Skeleton Tree. What does the docs suggest?"
        choices: ["Recompile the Animation Blueprint", "Right-click the property header and enable Blend Profile", "Reimport the Skeletal Mesh", "Switch to the Animation Sequence editor"]
        answer_index: 1
        explain: "The Blend column may be hidden. Right-click the header of the Skeleton Tree and enable Blend Profile to show it."
    flavors:
      _default: {why: "Masks and profiles are reusable rules that make partial-body and per-bone blends clean."}
      animation: {why: "Feet that plant firmly on stop come from a Blend Profile, not from more keyframes.", do: "Make a second mask BM_Head for a look-at layer and test it with an additive nod."}

  - id: AQ43
    rank: 2
