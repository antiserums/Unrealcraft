    required: false
    title: "Additive fixes with FK Control Rig and layered rigs"
    brief: "In real projects, most animation fixes are small changes on top of an existing animation, not new animations. Sequencer can create an FK Control Rig for any skeletal mesh, which gives you one control for each bone. In Additive mode, your keys are added on top of the animation that is already playing. In this quest you add a small head tilt over a walk, bake an animation to a rig to fix one frame, and save the result as a new Animation Sequence."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/fk-control-rig-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animating-with-control-rig-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/motion-blending-tools-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/control-rig-forwards-solve-and-backwards-solve-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a Level Sequence in which a mannequin Skeletal Mesh Actor plays a walk animation on its Animation track. To make one, drag SKM_Manny_Simple into the level, create a Level Sequence named LS_ClipBlend, add the actor, and add a walk clip. On the character track, click Add (+) Track, then Control Rig, then FK Control Rig."
      - "Right-click the FK Control Rig track and enable Additive. Select the head bone in the viewport and set a key at frame 0, then a key with a small head tilt at frame 20, and a key back at the first pose at frame 40. Play the sequence: the tilt is added on top of the walk."
      - "Right-click the FK track and use Select Bones Or Curves To Animate. Hide every bone except the spine, the neck, the head and the arms."
      - "Duplicate the character in a second sequence named LS_BakeFix. Right-click the Skeletal Mesh track and choose Edit With FK Control Rig. Enable Reduce Keys with a small Tolerance, and click Create."
      - "Fix one bad frame on the baked FK rig, for example an elbow that jumps. Then right-click the Skeletal Mesh track and choose Bake Animation Sequence. Save the result as AS_Walk_Fixed."
      - "Now try a layered track. Drag the Control Rig asset CR_Mannequin_Body into the level, which opens a new sequence with a Control Rig track, and set two or three keys on a control. Right-click the Control Rig track and choose Convert To Layered. Check that your keys are now applied on top of an animation clip."
    done_when: "Send two screenshots. The first shows LS_ClipBlend with the Additive FK Control Rig track and the head tilt keys over the walk clip. The second shows the Content Browser with AS_Walk_Fixed next to the source clip. Add one line about additive and bake, and when you would choose each."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is an FK Control Rig?"
        choices: ["A rig asset you must build in the Control Rig editor", "A rig that only works with the mannequin", "An Animation Blueprint node", "A procedurally generated rig that can be added to any Skeletal Mesh in Sequencer"]
        answer_index: 3
        explain: "FK Control Rigs are procedurally generated and can be added to any Skeletal Mesh in Sequencer, with or without a Control Rig asset."
      - q: "You want your FK edits to add on top of the playing clip instead of replacing it. What do you do?"
        choices: ["Right-click the FK Control Rig track and select Additive", "Set the clip Weight to 0", "Delete the Animation track", "Set the track Order to 0"]
        answer_index: 0
        explain: "Right-click the FK Control Rig track and select Additive; edits then apply cumulatively to the base animation."
      - q: "Which command bakes the current animation onto an FK Control Rig for overriding fixes?"
        choices: ["Bake Transform in Actions", "Convert To Layered on the track", "Edit With FK Control Rig on the Skeletal Mesh track", "Create Linked Animation Sequence"]
        answer_index: 2
        explain: "Right-click the Skeletal Mesh track and select Edit With FK Control Rig, which opens the bake dialog."
      - q: "In the bake dialog, what does Warm Up Frames do?"
        choices: ["Adds empty frames to the start of the clip", "Slows the bake for accuracy", "Evaluates frames before baking so post-process Animation Blueprint effects can settle", "Heats the GPU shaders"]
        answer_index: 2
        explain: "Warm Up Frames is the number of frames evaluated before baking, useful when post-process Animation Blueprint effects need time to settle."
      - q: "Reduce Keys is on. What does a higher Tolerance do?"
        choices: ["Keeps more keys", "Removes more keys, allowing more deviation from the original curve", "Disables the simplify step", "Changes the frame rate"]
        answer_index: 1
        explain: "The higher the Tolerance, the more the filtered curve may deviate from the original, so more keyframes are removed."
      - q: "After fixing the animation on the FK rig, how do you get an Animation Sequence asset back?"
        choices: ["Export the level", "Save the Level Sequence as an animation", "Use Restore Pre-Animated State", "Right-click the Skeletal Mesh track and choose Bake Animation Sequence or Create Linked Animation Sequence"]
        answer_index: 3
        explain: "The page says to right-click the Skeletal Mesh track and select Bake Animation Sequence or Create Linked Animation Sequence."
      - q: "The FK bone list is huge. How do you show only the bones you need?"
        choices: ["Right-click the FK track > Select Bones Or Curves To Animate", "Collapse the track", "Delete the extra bones from the skeleton", "Use the Anim Outliner search"]
        answer_index: 0
