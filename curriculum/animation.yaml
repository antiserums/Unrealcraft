      - "Add a second Use cached pose LocomotionCache, then a Slot node set to DefaultGroup.UpperBody. Connect it to Blend Poses 0."
      - "In the node Details, expand Layer Setup, add one entry: Bone Name spine_01, Blend Depth 1, and check Mesh Space Rotation Blend."
      - "In the Character Blueprint, on a key press, check Montage Is Playing first, then Montage Play AM_UpperWave only if it is not playing."
      - "Play in editor: walk and press the key. The legs keep walking while the upper body plays the montage."
