    title: Physics Asset basics
    brief: "A Physics Asset gives a Skeletal Mesh simple collision shapes, called bodies, that are attached to its bones and linked by joints called constraints. Unreal uses it for character collision, hit reactions and ragdolls, where the character goes limp and falls under physics. In this quest you explore the mannequin's Physics Asset and then make the character fall as a ragdoll when you press a key."
