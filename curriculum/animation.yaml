    quiz:
      - q: "Which two blend modes can you pick on a Layered blend per bone node?"
        choices: ["Additive or Override", "Branch Filter or Blend Mask", "Local or Mesh", "Sync Group or Graph"]
        answer_index: 1
        explain: "The node's Details panel lets you choose Branch Filter (a list of bones and depths) or Blend Mask (a mask stored on the Skeleton)."
      - q: "In a Branch Filter you set Bone Name to spine_01 and Blend Depth to 0. What weight do the bones get?"
        choices: ["Weight 1 on spine_01 and all of its child bones", "Weight 0.5 on spine_01, weight 1 on its children", "Weight 1 only on spine_01, 0 on children", "The blend is disabled"]
        answer_index: 0
        explain: "A Blend Depth of 0 applies a blend weight of 1 to the named bone and all connected child bones."
      - q: "What does a negative Blend Depth do?"
        choices: ["It blends the parent bones instead", "It doubles the blend speed", "It disables the Blend Poses on those bones and favors the Base Pose", "It is not allowed and shows an error"]
        answer_index: 2
