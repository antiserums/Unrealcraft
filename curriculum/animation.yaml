    title: "Body Mover and Limb IK: hips that follow the feet"
    brief: "When a foot must step up onto something, the leg alone cannot make the pose look right. The hips have to move too, so an IK Rig has a solver (a part that calculates the pose) named Body Mover, which moves and turns the pelvis based on where the feet are, before a Limb IK solver bends each leg to reach its goal. In this quest you build an IK Rig with these solvers, put them in the right order, and also add a Pole Solver that controls the direction of a knee."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/ik-rig-solvers-in-unreal-engine"
    backup_url: null
