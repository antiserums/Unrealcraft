  - id: AQ26
    rank: 3
    difficulty: expert
    specializations: [animation]
    subjects: [control-rig, ik, full-body-ik]
    required_spine: false
    required: true
    title: Full Body IK in Control Rig
    brief: "Full Body IK, often written FBIK, is a way to pose a character by moving only a few points, such as the hands, the feet and the head. The solver then moves the whole body so that it reaches those points, instead of bending only one arm or one leg. Control Rig is the Unreal tool where you build such rigs with a graph of nodes. In this quest you build a Full Body IK rig for the mannequin and tune how stiff the pelvis is and how the knee and ankle are allowed to bend."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/control-rig-full-body-ik-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/control-rig-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-create-control-rigs-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/control-rig-forwards-solve-and-backwards-solve-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Enable the FullBodyIK plugin in Edit > Plugins, and then restart the editor."
      - "Create a Control Rig named CR_Manny_FBIK for the mannequin skeletal mesh. Add controls, the handles you move in the viewport, for the head, both hands and both feet."
      - "In the rig graph, right-click and add the node Full Body IK from the Hierarchy category. Connect it to the Forwards Solve node, and set its Root to the pelvis bone."
      - "Add one Effector for each control. An effector is a point that the body tries to reach. Set the Bone of each effector, and connect a Get Transform node of the matching control to it."
      - "Move a hand control in the viewport and watch the body follow. Then add a Bone Setting for the pelvis and set both Rotation Stiffness and Position Stiffness to 0.8."
      - "Add a Bone Setting for one knee. Enable Use Preferred Angles and set a preferred angle so that the knee bends in the correct direction."
      - "Add a Limit on one axis of an ankle: set it to Limited, with Min -70 and Max 70. Compare the pose before and after."
    done_when: "Send two screenshots. The first shows the rig graph with the Full Body IK node, its effectors and at least two Bone Settings visible. The second shows the viewport with a hand control pulled far away and the body following in a natural pose."
    xp: 180
    verify_type: screenshot
    quiz:
      - q: "Which plugin must be enabled before the Full Body IK node is available?"
        choices: ["FullBodyIK", "IKRig", "MotionWarping", "ControlRigSolvers"]
        answer_index: 0
        explain: "The page says to enable the FullBodyIK plugin in Edit > Plugins and restart the editor."
      - q: "Where do you find the Full Body IK node in the Control Rig graph context menu?"
        choices: ["Solvers > Full Body IK", "Animation > IK", "Hierarchy > Full Body IK", "Constraints > FBIK"]
        answer_index: 2
        explain: "You right-click the graph and select Hierarchy > Full Body IK, then connect it to Forwards Solve."
      - q: "For a typical full-body setup, which bone is the Root of the FBIK node?"
        choices: ["The head bone", "The hips or pelvis bone", "The skeleton root bone at the feet", "The spine top bone"]
        answer_index: 1
        explain: "The page says the Root will likely be the hips or pelvis bone in typical full-body setups."
      - q: "What is an Effector in the FBIK node?"
        choices: ["A bone excluded from the solve", "A debug drawing helper", "A global stiffness value for the whole chain", "An endpoint bone of a chain, driven by a control's transform"]
        answer_index: 3
        explain: "Each Effector has a Bone (an endpoint of the IK chain) and a Transform, usually from a Get Transform node of the matching control."
      - q: "A Bone Setting has Rotation Stiffness set to 1. What happens to that bone?"
        choices: ["It is completely locked from rotating", "It rotates freely", "It stretches to reach the effector", "It is removed from the solve"]
        answer_index: 0
        explain: "Stiffness 0 means free movement, and 1 completely locks the bone."
      - q: "The knees look stiff and do not bend enough. Which setting does the page recommend first?"
        choices: ["Increase Mass Multiplier", "Enable Use Preferred Angles and set a preferred angle on the knee", "Set Root Behavior to Free", "Disable Allow Stretch"]
        answer_index: 1
        explain: "Preferred Angles prioritize joints rotating along a specific axis; the example sets 45 on Z for the mannequin knee."
      - q: "Which Limit setting lets a bone axis move only inside a Min/Max range?"
        choices: ["Free", "Locked", "Limited", "Clamped"]
        answer_index: 2
        explain: "Free allows free movement, Locked disables the axis, and Limited uses the Min/Max properties for a range."
      - q: "You want some bones to have no influence at all from FBIK. What does the page recommend?"
        choices: ["Set Position Alpha to 0 on every effector", "Set all their stiffness values to 1", "Delete the bones from the skeleton", "Add them to Excluded Bones instead of making them fully stiff or locked"]
        answer_index: 3
        explain: "The page says excluding bones is recommended rather than using Bone Settings to make bones fully stiff or locked."
      - q: "What is the trade-off when you increase Iterations on the FBIK node?"
        choices: ["Effectors converge better, but CPU cost goes up", "Bones stretch more", "The root bone becomes locked", "Debug lines become larger"]
        answer_index: 0
        explain: "Increasing Iterations helps effectors converge on their goals, but also increases the CPU cost of the FBIK chain."
      - q: "Which Root Behavior locks the root bone to the input pose and suits low-distance, partial-body setups?"
        choices: ["Free", "Pre Pull", "Pin to Input", "Start Solve from Input Pose"]
        answer_index: 2
        explain: "Pin to Input locks the root translation and rotation to the input pose; Pre Pull translates root and children to help long reaches."
    flavors:
      _default: {why: "FBIK is how a rig reaches a target with the whole body, not one limb at a time."}
      animation: {why: "Ground alignment, reaching and holding props all start with a good FBIK setup.", do: "Add a foot Bone Setting with limits so the ankle stays natural when the foot control is raised."}
      tech_art: {why: "Bone Settings and iterations are the knobs that decide rig cost and stability.", do: "Test Mass Multiplier 0 and 5 and note how many Iterations each needs to converge."}

  - id: AQ27
    rank: 3
    difficulty: expert
    specializations: [animation]
    subjects: [motion-warping, root-motion, montage, blueprint]
    required_spine: false
    required: true
    title: "Motion Warping: reach the target"
    brief: "Motion Warping changes the root motion of an animation while the game runs, so that the character ends exactly at a target you choose. Without it, a vault or a jump onto a ledge always covers the same distance and often misses the object. In this quest you add a warping window to a montage and make the character reach a Target Point in the level from different start positions."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/motion-warping-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/root-motion-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-montage-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/working-with-plugins-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open Edit, then Plugins, enable the Motion Warping plugin and restart the editor."
      - "Pick an animation with root motion, such as a vault, a mantle or a punch. If you have none, make one: duplicate a jump animation of the mannequin, open the copy and select the root bone in the Skeleton Tree. Press Key in the toolbar at the first frame, then move the root bone about 200 units forward at the last frame and press Key again."
      - "Open the animation and turn on Enable Root Motion in the Asset Details panel, where it is written as one word, EnableRootMotion."
      - "Create a montage named AM_Vault from the animation: right-click the animation, choose Create, then Create AnimMontage."
      - "In the montage, right-click the Notifies track, choose Add Notify State..., then Motion Warping. Stretch this window so that it covers the part of the move where the character reaches for the target."
      - "Select the notify. In its Details panel, set Root Motion Modifier to Skew Warp and set Warp Target Name to VaultTarget."
      - "Place a Target Point actor in the level. Then open BP_ThirdPersonCharacter and add a Motion Warping component to it. In the Animation Blueprint that the character uses, click Class Defaults and set Root Motion Mode to Root Motion from Montages Only, and make sure the AnimGraph has a Slot 'DefaultSlot' node before Output Pose."
      - "On an input action, do three things in this order: get the location of the Target Point, call Add or Update Warp Target from Transform with the Name VaultTarget, and then use Play Montage to play AM_Vault."
      - "Move the Target Point to a new place and test again. Then set Rotation Type to Facing and compare the result."
    done_when: "Send a short video clip (30 seconds or less), or two screenshots, that show the character warping to the Target Point from two different start positions. Also send a screenshot of the Details panel of the Motion Warping notify."
    xp: 180
    verify_type: screenshot
    quiz:
      - q: "What does Motion Warping change during a montage?"
        choices: ["The mesh scale", "The character's root motion, so it aligns to a target", "The animation blend time", "The skeleton reference pose"]
        answer_index: 1
        explain: "Motion Warping dynamically adjusts a character's root motion to align to targets."
      - q: "How do you create a Motion Warping window inside a montage?"
        choices: ["Add a Section named Warp", "Add a Curve named Warp", "Right-click the Notifies track > Add Notify State... > Motion Warping", "Enable Warp in the Asset Details"]
        answer_index: 2
        explain: "Motion Warping windows are Anim Notify States with a start and end time on the Notifies track."
      - q: "What must be true about the animation before Motion Warping can work?"
        choices: ["It must be additive", "It must have Root Motion enabled", "It must be a Blend Space", "It must have sync markers"]
        answer_index: 1
        explain: "The example says to open the Animation Asset and enable EnableRootMotion before starting."
      - q: "Which Root Motion Modifier matches the animation's location and rotation at the end of the warping window?"
        choices: ["Scale", "Skew Warp", "Facing", "Static"]
        answer_index: 1
        explain: "Skew Warp warps root motion so it matches the target location and rotation at the end of the window; Scale only scales the motion uniformly."
      - q: "The Blueprint sets a warp target but nothing happens. Which mismatch is the most likely cause?"
        choices: ["The Warp Target Name in the montage does not match the Name on Add or Update Warp Target", "The montage has no sections", "The Target Point is not rotated", "The component is not under the Movement category"]
        answer_index: 0
        explain: "The name on the node must match the Warp Target Name you defined in the montage notify."
      - q: "Where is the Motion Warping component found when you click (+) Add in the Components panel?"
        choices: ["Under Animation", "Under Physics", "Under Rendering", "Under Movement"]
        answer_index: 3
        explain: "The page says to locate Motion Warping under the Movement category."
      - q: "Rotation Type is set to Facing. What does the character do?"
        choices: ["Matches the rotation of the warp target", "Rotates to face the warp target", "Ignores rotation", "Rotates twice as fast"]
        answer_index: 1
        explain: "Default matches the target's rotation; Facing rotates the character to face the target."
      - q: "A warping window lasts 2 seconds and Warp Rotation Time Multiplier is 0.5. When is the final rotation reached?"
        choices: ["After 4 seconds", "After 2 seconds", "After 1 second", "Immediately"]
        answer_index: 2
        explain: "The page gives exactly this example: with 0.5, the final rotation is reached in one second."
      - q: "You want to create a warping window from Blueprint instead of a notify in the montage. Which node do you use?"
        choices: ["Add Root Motion Modifier Skew Warp", "Remove Warp Target", "Play Montage", "Split Struct Pin"]
        answer_index: 0
        explain: "Add Root Motion Modifier Skew Warp generates a warping window with Start Time, End Time and Warp Target Name from Blueprint."
      - q: "Which Warp Point Anim Provider defines the warp point from a bone in the animation?"
        choices: ["None", "Static", "Transform", "Bone"]
        answer_index: 3
        explain: "Static uses a user-defined transform on the notify; Bone uses the bone named in Warp Point Anim Bone Name."
    flavors:
      _default: {why: "Vaults, mantles and finishers only look right when the character lands exactly on the target."}
      animation: {why: "One montage can fit many ledge heights and distances when the warp window is placed well.", do: "Try a second warp window in the same montage and give it a different Warp Target Name."}
      gameplay_design: {why: "Interaction design depends on the player reaching the exact spot every time.", do: "Set Ignore ZAxis on and off and note which feels better for a ground target."}

  - id: AQ28
    rank: 3
    difficulty: expert
    specializations: [animation]
    subjects: [animation-blueprint, linked-anim-layers, architecture]
    required_spine: false
    required: true
    title: Linked Anim Layers
    brief: "In a big project, one Animation Blueprint for everything becomes very large, and only one person can work on it at a time. Linked Anim Layers solve this. An Animation Layer Interface is a list of named layers, such as FullBody and UpperBody, and different Animation Blueprints can each fill in those layers. The game can then swap which Animation Blueprint fills a layer while it runs, for example when the character picks up a rifle. In this quest you create an interface with three layers and swap the upper body layer with a key press."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-blueprint-linking-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-blueprints-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-blueprint-editor-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create an Animation Layer Interface named ALI_Character: in the Content Browser click Add, then Animation, then Animation Layer Interface (the documentation page calls this menu item Animation Interface). Add three layers named FullBody, UpperBody and IK."
      - "Give the UpperBody layer and the IK layer a pose input. Put all three layers in one Group, and give the Group a name that is not the default name."
      - "Create a new Animation Blueprint for the mannequin Skeleton and name it ABP_Base. In Class Settings, add ALI_Character under Interfaces. In the My Blueprint panel, open the FullBody layer and put a walk or run Sequence Player in it. Leave the UpperBody and IK layers as they are, so that they pass their input pose through. In BP_ThirdPersonCharacter, select the Mesh and set Anim Class to ABP_Base. If you have an Animation Blueprint of your own, you can use that instead."
      - "Drag the three layers into the AnimGraph in this order: FullBody, then UpperBody, then IK. Connect them one after the other, and connect the last one to Output Pose."
      - "Create a second Animation Blueprint named ABP_Rifle that also implements ALI_Character. In its UpperBody layer, put a different animation, for example a jump or fall pose of the mannequin, or an aim offset if you have one."
      - "In BP_ThirdPersonCharacter, add a key press event that calls Link Anim Class Layers. Use the Mesh as Target and ABP_Rifle as In Class."
      - "Press Play and press the key. Confirm that the upper body changes while the base locomotion keeps running."
    done_when: "Send a screenshot of the list of layers in ALI_Character, a screenshot of the AnimGraph of ABP_Base with the three layer nodes, and screenshots of the game view before and after Link Anim Class Layers."
    xp: 180
    verify_type: screenshot
    quiz:
      - q: "What is the main difference between a Linked Anim Graph and a Linked Anim Layer?"
        choices: ["Linked Anim Graph links a specific AnimBP; Linked Anim Layer uses a shared Animation Layer Interface", "Linked Anim Layer cannot have pose inputs", "Linked Anim Graph only works with templates", "There is no difference"]
        answer_index: 0
        explain: "Linked Anim Graphs reference one Animation Blueprint. Linked Anim Layers require an Animation Layer Interface that defines preset layers."
      - q: "Where do you create an Animation Layer Interface asset?"
        choices: ["Add > Blueprint > Interface", "Add > Animation > Animation Interface", "Inside the AnimBP Class Settings", "Add > Animation > Anim Layer"]
        answer_index: 1
        explain: "In the Content Browser, click Add (+) then Animation > Animation Interface."
      - q: "Layers share the same non-default Group name in the interface. What does that mean?"
        choices: ["They cannot be linked", "They are read-only", "They share the same Animation Instance", "They play at the same time"]
        answer_index: 2
        explain: "The page says layers under the same non-default Group name share the same Animation Instance, and recommends a new shared name."
      - q: "How do you bind the interface to an Animation Blueprint?"
        choices: ["Drag the interface into the AnimGraph", "Set it as the parent class", "Assign it in the Skeleton asset", "Class Settings > Interfaces > Add, then select the interface"]
        answer_index: 3
        explain: "You select Class Settings and use the Add dropdown in the Interfaces section."
      - q: "What is the role of the Base Animation Blueprint in this system?"
        choices: ["It holds every weapon's logic", "It is assigned to the character and holds the overall layer structure, not necessarily the layer logic", "It replaces the Skeleton", "It stores the montages"]
        answer_index: 1
        explain: "The base contains the general structure of the linked layers; the true logic can come from other linked AnimBPs."
      - q: "Which Blueprint node swaps in a specific AnimBP's layer logic at runtime?"
        choices: ["Set Anim Instance Class", "Play Montage", "Link Anim Class Layers", "Linked Anim Graph"]
        answer_index: 2
        explain: "Link Anim Class Layers takes the Skeletal Mesh as Target and the specific AnimBP as In Class."
      - q: "Why does the page recommend Linked Anim Layers for a live-service project?"
        choices: ["They render faster", "New animation logic can be added or removed as separate AnimBPs, with multi-user work and memory savings", "They do not need a Skeleton", "They remove the need for state machines"]
        answer_index: 1
        explain: "Separating logic into layers enables collaboration and only loads the AnimBPs that are linked and used."
      - q: "A weapon AnimBP does not need to override a certain layer. What should you do in that layer?"
        choices: ["Connect nothing to its output pose", "Delete the layer from the interface", "Copy the base graph into it", "Set its group to default"]
        answer_index: 0
        explain: "The Fortnite example says: if a weapon does not need to override some states, do not connect anything to the output pose in that Layer."
      - q: "How do you expose a variable from a linked AnimBP as a pin on the Linked Anim Graph node?"
        choices: ["Make it a local variable", "Enable Instance Editable on the variable", "Add it to the Event Graph", "Rename it with an underscore"]
        answer_index: 1
        explain: "Like making a Blueprint variable public: select the variable and enable Instance Editable."
      - q: "What is special about an Animation Blueprint Template?"
        choices: ["It can only contain one node", "It runs on the server only", "It always uses the UE5 mannequin skeleton", "It references no specific Skeleton, so it cannot directly reference animations and must use exposed variables"]
        answer_index: 3
        explain: "Templates are created by clicking Template instead of picking a Skeleton; you expose properties like the Sequence Player's Sequence as variables."
    flavors:
      _default: {why: "Big projects split animation logic into layers so many people can work without breaking one giant AnimBP."}
      animation: {why: "Weapons, vehicles and states each get their own AnimBP that plugs into the base graph.", do: "Add a third AnimBP (ABP_Pistol) and switch between Rifle and Pistol with two keys."}
      programming: {why: "Layer linking is the animation side of modular, loadable gameplay code.", do: "Store the AnimBP class on the weapon actor and pass it to Link Anim Class Layers on equip."}

  - id: AQ29
