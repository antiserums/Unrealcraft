        answer_index: 1
        explain: "The applying page uses Set Constraint Profile for All with the Profile Name. Default if Not Found keeps current settings for bones not in the profile."
      - q: "What does Enable Shock Propagation do, per the constraint reference?"
        choices: ["Breaks the joint when a force threshold is passed", "Adds bounce when a limit is violated", "Increases the parent's mass for the last solver iteration to stiffen chains; meant for world constraints and ragdolls", "Disables collision between constrained bodies"]
        answer_index: 2
        explain: "The reference says shock propagation stiffens joint chains but can add energy down the chain. It is intended for world constraints and ragdoll physics."
    flavors:
      _default: {why: "Good constraint limits are the difference between a believable ragdoll and a tangle of limbs."}
      animation: {why: "Profiles let you switch between loose and stiff joints from gameplay without a second physics asset.", do: "Make a second profile CP_Loose with soft limits and write 3 lines on when you would switch between them."}

  - id: AQ74
    rank: 2
