        choices: ["The later one gets a lower blend weight", "They will interfere with each other, so do not overlap them", "The editor merges them into one sequence", "The first one is muted automatically"]
        answer_index: 1
        explain: "Sequences on the same Slot that play at the same time interfere with one another. Keep them in order without overlap."
      - q: "A reload montage is playing. You play an attack montage that uses a Slot in the same Slot Group. What happens?"
        choices: ["Both play together on the same bones", "The attack waits until the reload finishes", "The reload montage is stopped and the attack plays", "The engine logs an error and plays nothing"]
        answer_index: 2
        explain: "Playing a montage on a Slot in the same group as a running montage stops the active one. This is how montages interrupt each other."
      - q: "You add a new Slot in the Anim Slot Manager. Which asset changes and must be saved?"
        choices: ["The Animation Montage", "The Animation Blueprint", "The Skeletal Mesh", "The Skeleton asset"]
        answer_index: 3
        explain: "Slots are stored on the Skeleton asset. Creating or changing Slots edits the Skeleton, no matter which editor you are in."
      - q: "Which Play Montage output pin fires when the montage finishes playing and is fully blended out?"
        choices: ["On Blend Out", "On Completed", "On Interrupted", "On Notify End"]
        answer_index: 1
