# Unrealcraft — Animation specialization, all ranks. IDs AQ1…
# Difficulty tiers: novice (rank 0) · apprentice (1) · adept (2) · expert (3) · master (4).
# Every URL was checked against the live UE 5.8 docs when written.

quests:
  - id: AQ9
    rank: 0
    difficulty: novice
    specializations: [animation]
    subjects: [skeletal-mesh, animation-sequence, actors]
    required_spine: false
    required: false
    taster: true
    title: Play an animation on a mesh
    brief: "A Skeletal Mesh is a 3D model that has bones inside it, so it can be animated. An Animation Sequence is one recorded movement, such as a run or an idle, that plays on those bones. In this quest you place a mannequin in a level and make it play one animation in a loop. This is the simplest way to see an animation in Unreal, and you do not need any Blueprint for it."
    time_min: 25
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/skeletal-mesh-actors-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/skeletal-mesh-assets-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-sequences-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. In the Content Browser, the panel that shows all your project files, find the asset named SKM_Quinn_Simple or SKM_Manny_Simple."
      - "Drag the Skeletal Mesh from the Content Browser into the Level Viewport. Unreal creates a Skeletal Mesh Actor for you. Move it to an empty spot in the level."
      - "With the actor selected, look at the Details panel and find the Animation section. Set Animation Mode to Use Animation Asset, which means the actor plays one animation that you choose."
      - "Set Anim to Play to one animation from the folder Content/Characters/Mannequins/Anims. For example, you can pick an idle or a run."
      - "Turn on Looping so the animation repeats. Then press Play and watch the mesh animate in the level."
      - "Try one more thing: drag a different Material onto the actor. If the mesh looks wrong, open that Material and enable the option Used with Skeletal Mesh."
    done_when: "Send a screenshot taken in Play mode that shows your Skeletal Mesh Actor in the middle of the animation. Also send a second screenshot of its Details panel that shows Animation Mode and Anim to Play."
    xp: 30
    verify_type: screenshot
    quiz:
      - q: "What are the two basic ways to animate a Skeletal Mesh Actor?"
        choices: ["A Material and a Texture", "An Animation Blueprint, or a single Animation Asset", "A Static Mesh and a Physics Asset", "A Level Sequence only"]
        answer_index: 1
        explain: "You can use an Animation Blueprint to play and blend many animations, or use one Animation Asset to play a single sequence once or in a loop."
      - q: "What is the quickest way to place a Skeletal Mesh Actor in a level?"
        choices: ["Write a Blueprint that spawns it", "Import it again from FBX", "Drag it from the Content Browser into the Level Viewport", "Right-click the level and pick Add Skeleton"]
        answer_index: 2
        explain: "The docs say the quickest way is to drag the mesh from the Content Browser into the Level Viewport, then set its Transform."
      - q: "You drag a Material onto a Skeletal Mesh Actor and it does not render correctly. What must you enable in the Material?"
        choices: ["Two Sided", "Used with Static Lighting", "Cast Shadows", "Used with Skeletal Mesh"]
        answer_index: 3
        explain: "A Material needs the Used with Skeletal Mesh option enabled before it can be used on a Skeletal Mesh."
      - q: "Why does a Skeletal Mesh Actor not collide with objects like a Static Mesh does?"
        choices: ["It needs a Physics Asset made for it", "Skeletal Meshes can never collide", "It needs a Nav Mesh", "It collides only when it has an Animation Blueprint"]
        answer_index: 0
        explain: "Normal collision does not work with Skeletal Mesh Actors. They need a Physics Asset created for them (Create > Physics Asset > Create and Assign)."
      - q: "Which property do you set so a mesh plays one Animation Sequence without an Animation Blueprint?"
        choices: ["Anim Class", "Animation Mode set to Use Animation Asset, then Anim to Play", "Skeleton", "Preview Pose Asset"]
        answer_index: 1
        explain: "Set Animation Mode to Use Animation Asset and choose the sequence in Anim to Play. Anim Class is for Animation Blueprints."
    flavors:
      _default: {why: "Placing a mesh and playing one animation is the first step of every animation task."}
      animation: {why: "You will do this many times to check an animation in a real scene with real lighting.", do: "Also test the same animation with Looping off and note what pose the mesh stops in."}
      cinematics: {why: "A Skeletal Mesh Actor playing a loop is the simplest background character for a shot."}
      gameplay_design: {why: "Quick animation previews help you judge timing before any Blueprint work."}

  - id: AQ10
    rank: 0
    difficulty: novice
    specializations: [animation]
    subjects: [skeletal-mesh, skeleton, animation-sequence]
    required_spine: false
    required: false
    taster: true
    title: "Skeleton, mesh, animation: three assets"
    brief: "An animated character in Unreal is made of three different assets that work together. The Skeleton holds the list of bones, the Skeletal Mesh holds the visible 3D model that is attached to those bones, and the Animation Sequence holds a movement recorded for that Skeleton. Many animation problems happen because people mix these up. In this quest you open all three assets and see how they point to each other."
    time_min: 25
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/skeletons-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/skeletal-mesh-assets-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-sequences-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/skeletal-mesh-animation-system-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open the folder Content/Characters/Mannequins. Find the Skeleton asset, one Skeletal Mesh (its name starts with SKM_) and one Animation Sequence."
      - "Double-click the Skeleton asset to open it. Look at the Skeleton Tree, which is the list of all bones. Find the root bone, the pelvis bone and one hand bone."
      - "Open the Skeletal Mesh asset. In its Asset Details panel, find the Skeleton property. Notice that it points to the same Skeleton asset you just opened."
      - "Open the Animation Sequence. In its Asset Details panel, find the Skeleton property again and see which Skeleton it uses."
      - "Write 3 short lines: one that says what the Skeletal Mesh holds, one that says what the Skeleton holds, and one that says what the Animation Sequence holds."
      - "Bonus: in the Skeleton Editor, open Window > Anim Notifies or Window > Anim Curves. Notice that this data is stored on the Skeleton."
    done_when: "Send a screenshot of the Skeleton Tree with the three bones named, and add your 3 lines that say what each asset holds and how the assets are linked."
    xp: 30
    verify_type: writeup
    quiz:
      - q: "What does a Skeletal Mesh asset contain?"
        choices: ["Only the animation keyframes", "The visual mesh and the skeleton bone data used to animate it", "Only Materials", "The Animation Blueprint logic"]
        answer_index: 1
        explain: "The Skeletal Mesh is the foundation asset. It holds the geometric model and the skeleton with bone data. The skeleton is also saved as a separate Skeleton asset."
      - q: "Why can one Animation Sequence be used on several different Skeletal Meshes?"
        choices: ["Because sequences store vertex positions", "Because Unreal converts them automatically each time", "Because each sequence is tied to a Skeleton, and any mesh that uses that Skeleton can play it", "Because they are tied to a Material"]
        answer_index: 2
        explain: "Animation Sequences are tied to a specific Skeleton. Meshes that share that Skeleton can share the animations."
      - q: "During FBX import you leave the Skeleton field empty. What happens?"
        choices: ["The import fails", "A new Skeleton asset is created from the imported character", "The mesh is imported as a Static Mesh", "The last used Skeleton is picked"]
        answer_index: 1
        explain: "Leaving the Skeleton field empty creates a new Skeleton asset based on the skinned character being imported."
      - q: "Two meshes want to share one Skeleton asset. What must be the same on both?"
        choices: ["Bone names and their hierarchy order", "The number of vertices", "The Material slots", "The animation length"]
        answer_index: 0
        explain: "Sharing works only if bone names and hierarchy order are consistent. The second mesh may add extra bones but cannot rename or reorder the existing ones."
      - q: "You add an Animation Notify inside an Animation Sequence. Where is that notify data stored?"
        choices: ["In the Level", "In the Skeletal Mesh", "In the Material", "On the Skeleton asset, as shared data"]
        answer_index: 3
        explain: "Skeletons store animation-specific data such as notifies. When you create one in a sequence, it is added to the Skeleton as shared data."
    flavors:
      _default: {why: "Most animation problems come from mixing up these three assets. Know which one holds what."}
      animation: {why: "Every retarget, notify and curve depends on the Skeleton. Understanding the link saves hours later.", do: "Open the Skeleton Editor toolbar and find the Retarget Manager. Read the Manage Compatible Skeletons section."}
      tech_art: {why: "Pipelines and naming rules for bones start here."}
      programming: {why: "Code that plays or swaps animations has to reference the right asset type."}

  - id: AQ11
    rank: 0
    difficulty: novice
    specializations: [animation]
    subjects: [mannequin, third-person-template, project-content]
    required_spine: false
    required: false
    taster: true
    title: The Mannequins
    brief: "The mannequins are the two test characters that come with Unreal, named Quinn and Manny. Almost every tutorial uses them, so it helps to know where their meshes, animations and other parts are stored in the project. In this quest you look through the mannequin folders and change the player character from Quinn to Manny."
    time_min: 25
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/third-person-template-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/control-rig-in-unreal-engine"
    checklist:
      - "Create a new project from the Third Person template (choose Games, then Third Person). Press Play once and move around with the WASD keys and Space."
      - "Open the folder Content/Characters. Find the UE5 mannequins Quinn and Manny, and note which one the template uses by default."
      - "Open the folder Content/Characters/Mannequins/Anims. Count how many animation sets there are, and open one animation from each set."
      - "Open the Blueprint Content/ThirdPerson/Blueprints/BP_ThirdPersonCharacter. Select the Mesh component, and change its Skeletal Mesh property to SKM_Manny_Simple."
      - "In the Animation section, check that Animation Mode is set to Use Animation Blueprint and that Anim Class is set to ABP_Unarmed. Quinn and Manny share one skeleton, so the same Animation Blueprint works for both. Click Compile, save the Blueprint, and press Play."
      - "Open the folder Content/Characters/Mannequins/Rigs and find the Control Rig assets CR_Mannequin_Body and CR_Mannequin_FootIK. In older versions the second one is named CR_Mannequin_BasicFootIK. Read on the documentation page what each one is used for."
    done_when: "Send a screenshot taken in Play mode with Manny as the player character, and a screenshot of the Anims folder. Add one line that names the two Control Rig assets you found in the Rigs folder."
    xp: 30
    verify_type: screenshot
    quiz:
      - q: "Which mannequin does the UE5 Third Person template use by default?"
        choices: ["Manny", "The legacy UE4 mannequin", "Quinn", "A MetaHuman"]
        answer_index: 2
        explain: "The template starts with the feminine UE5 mannequin, Quinn. Manny is the male mannequin and is also included."
      - q: "Where are the mannequin animations stored in the template?"
        choices: ["Content/Characters/Mannequins/Anims", "Content/LevelPrototyping", "Content/ThirdPerson/Blueprints", "Engine/Content/Animations"]
        answer_index: 0
        explain: "Animations for the mannequins are in Content/Characters/Mannequins/Anims, sorted into sets such as Unarmed, Pistol and Rifle. Quinn and Manny share one skeleton, so both use the same animations."
      - q: "To swap the player mesh to Manny, which Blueprint do you edit?"
        choices: ["ABP_Unarmed", "BP_ThirdPersonCharacter in Content/ThirdPerson/Blueprints", "CR_Mannequin_Body", "The Level Blueprint"]
        answer_index: 1
        explain: "You open BP_ThirdPersonCharacter, select the Mesh component, and change its Skeletal Mesh. The Animation Blueprint stays the same, because both mannequins share one skeleton."
      - q: "What is the foot IK Control Rig of the mannequin (CR_Mannequin_FootIK) used for?"
        choices: ["Changing the mannequin's LODs", "Adjusting the feet to the terrain with IK", "Playing the run animation", "Spawning physics cubes"]
        answer_index: 1
        explain: "The Animation Blueprint of the template runs this Control Rig to move the feet so that they match the ground. Older versions name it CR_Mannequin_BasicFootIK."
      - q: "What is CR_Mannequin_Body for?"
        choices: ["Posing and animating the mannequin directly in the editor", "Importing FBX files", "Controlling the camera distance", "Setting the mannequin's Materials"]
        answer_index: 0
        explain: "CR_Mannequin_Body is a Control Rig asset you can use to pose and animate the mannequin in the editor."
    flavors:
      _default: {why: "Almost every tutorial starts from the mannequins. Knowing where their parts live saves time."}
      animation: {why: "Manny and Quinn are your free test characters. Their skeleton and animations are the base for retargeting and rigs.", do: "Open the LOD Data Asset in Content/Characters/Mannequins/Meshes and note how many LODs the mannequin has."}
      gameplay_design: {why: "Prototyping a mechanic is faster when you know which template assets you can reuse."}
      cinematics: {why: "The mannequin plus CR_Mannequin_Body is a quick way to pose a stand-in character in a shot."}

  - id: AQ12
    rank: 1
    difficulty: apprentice
    specializations: [animation]
    subjects: [fbx, import, skeletal-mesh, pipeline]
    required_spine: false
    required: true
    title: Import a skeletal mesh
    brief: "Characters are usually made in another 3D program and saved as an FBX file, a common file format for 3D models and animations. To use the character in Unreal you import that file, and the import settings decide things like its size and which Skeleton it uses. Wrong settings can cause problems that you only notice much later. In this quest you import a mesh and an animation, and you see when Unreal creates a new Skeleton and when it reuses one."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/fbx-skeletal-mesh-pipeline-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/importing-skeletal-meshes-using-fbx-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/importing-assets-using-interchange-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/fbx-import-options-reference-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/fbx-animation-pipeline-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Get an FBX file of a rigged character (a character that has bones) and one animation for it. If you have none, export one from Unreal: right-click SKM_Manny_Simple, choose Asset Actions, then Export, and export one animation the same way."
      - "Make a folder named Content/Import_Test. Click Import in the Content Browser and pick the mesh FBX file."
      - "The import window opens. In current versions it is named Interchange Pipeline Configuration, and older versions show a window named FBX Import Options. The settings you need are in both. Leave Skeleton empty and keep Create Physics Asset turned on. Find the scale settings, Convert Scene Unit and the uniform scale (named Offset Uniform Scale in the new window and Import Uniform Scale in the old one), then click Import."
      - "Open the new Skeletal Mesh in the editor. Check that its size matches the mannequin, and check the list of bones in the Skeleton Tree."
      - "Now import the animation FBX file on its own. This time set Skeleton to the Skeleton you just created. Confirm that an Animation Sequence asset appears."
      - "Import the mesh a second time into another folder, but now select the existing Skeleton in the dropdown. Notice that Unreal does not create a new Skeleton asset this time."
    done_when: "Send a screenshot of the Content Browser that shows the imported Skeletal Mesh, Skeleton, Physics Asset and Animation Sequence. Also send a screenshot of the imported mesh standing next to the mannequin in a level at the correct size."
    xp: 115
    verify_type: screenshot
    quiz:
      - q: "Where is the pivot point of an imported Skeletal Mesh?"
        choices: ["At the center of the mesh bounds", "At the scene origin of the FBX file", "At the root bone of the skeleton", "At the first vertex"]
        answer_index: 2
        explain: "The pivot of a Skeletal Mesh is always at the root bone. Where the root sits in the DCC scene does not matter; it acts as if it were at the origin."
      - q: "How many animations can one FBX file carry for a Skeletal Mesh in the standard FBX pipeline?"
        choices: ["One animation per file", "Up to 10", "Unlimited, always", "None; animations need a separate format"]
        answer_index: 0
        explain: "The FBX pipeline currently supports a single animation for each Skeletal Mesh per file. Multiple morph targets are fine in one file."
      - q: "You import an animation FBX on its own, with no mesh. What must you set?"
        choices: ["Create Physics Asset", "An existing Skeleton", "Import Mesh LODs", "Force Front XAxis"]
        answer_index: 1
        explain: "When importing an animation by itself you must specify an existing Skeleton. The docs stress this with a warning."
      - q: "What does Create PhysicsAsset do during import?"
        choices: ["Adds collision to the Material", "Creates a Nav Mesh", "Generates a Physics Asset, mostly spheres with a capsule at the root", "Bakes the animation into the mesh"]
        answer_index: 2
        explain: "With Create PhysicsAsset on, a new Physics Asset is generated. It is made mostly of spheres, with a capsule for the root, and free rotation on the constraints."
      - q: "Your imported character is 100 times too small. Which option converts FBX units to centimeters?"
        choices: ["Import Rotation", "Preserve Smoothing Group", "Use T0 As Ref Pose", "Convert Scene Unit"]
        answer_index: 3
        explain: "Convert Scene Unit converts the FBX units into Unreal's unit, centimeters. Import Uniform Scale can also scale the mesh by a factor."
      - q: "You leave the Skeleton field empty when importing a mesh named SK_Hero. What is the new Skeleton asset called?"
        choices: ["SK_Hero_Skeleton (the mesh name with Skeleton appended)", "Skeleton_01", "SK_Hero_Rig", "It is not named until you rename it"]
        answer_index: 0
        explain: "If no existing Skeleton is selected, a new one is created and named after the Skeletal Mesh with Skeleton appended."
    flavors:
      _default: {why: "Every animated character enters Unreal through this door. Bad import settings cause bugs that show up much later."}
      animation: {why: "Wrong scale, a duplicated Skeleton or a missing Physics Asset will break retargeting and physics later. Get the import right first.", do: "Reimport the animation with Animation Length set to Set Range and a shorter Frame Import Range. Compare the length in the Asset Details."}
      tech_art: {why: "You will write the import rules for the team. You have to know what each option does."}
      cinematics: {why: "Characters and props from outside the engine come in through FBX. Wrong scale ruins a shot."}

  - id: AQ13
    rank: 1
    difficulty: apprentice
    specializations: [animation]
    subjects: [animation-sequence, editor, additive, root-motion, curves]
    required_spine: false
    required: true
    title: Inside the Animation Sequence editor
    brief: "When you double-click an Animation Sequence, it opens in its own editor. This is where you look closely at one animation and change the settings that decide how it behaves in the game, such as its speed and whether it moves the character forward. In this quest you take a tour of that editor and try its main settings on a run animation."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-sequence-editor-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-sequences-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-curves-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-editors-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a run animation of the mannequin. In the current template the run animations have Jog in their names. Find the six areas of the editor: Toolbar, Asset Details / Skeleton Tree, Viewport, Details / Preview Scene Settings, Asset Editor, and Asset Browser."
      - "In Asset Details, set Rate Scale to 0.5 and press play to see the animation at half speed. Then set it back to 1. Also read the values of Number of Sampled Frames and Target Frame Rate."
      - "Find the setting Additive Anim Type and read its options. Leave it on No additive."
      - "Find the setting Enable Root Motion. In the Asset Details panel it is written as one word, EnableRootMotion. Turn it on, watch what changes in the viewport, and then turn it off again. Also read the options of Root Motion Root Lock."
      - "Select a bone in the Skeleton Tree and rotate it a little in the viewport. Press Key in the Toolbar and see the additive track appear in the timeline. Then undo the change."
      - "In the timeline, open the menu of the Curves track and choose Add Curve..., then Create Curve, and name the curve TestCurve. Open Window > Anim Curves to see it. Delete the curve afterwards and save the Skeleton."
    done_when: "Send a screenshot of the editor with the six areas labeled, and a screenshot of Asset Details that shows Rate Scale, Additive Anim Type and Enable Root Motion (EnableRootMotion). Add one line that says what the Key button does."
    xp: 115
    verify_type: screenshot
    quiz:
      - q: "What does Rate Scale control in an Animation Sequence?"
        choices: ["The number of bones", "The playback speed; 1 is default, lower is slower", "The size of the mesh", "The frame rate of the import"]
        answer_index: 1
        explain: "Rate Scale is the playback speed. 1 is the default, lower values play slower and higher values play faster."
      - q: "Which Additive Anim Type is the most common for additive animation?"
        choices: ["Local Space", "Mesh Space", "No additive", "World Space"]
        answer_index: 0
        explain: "Local Space is the most common option. Mesh Space applies the delta in component space and is required for Aim Offsets."
      - q: "What does the Key button in the Toolbar do?"
        choices: ["Locks the asset", "Exports the current frame", "Adds a keyframe of the current pose as an additive layer in the timeline", "Creates a new Skeleton"]
        answer_index: 2
        explain: "Key adds a keyframe of the current pose to the Asset Editor as an additive layer. After you move a bone, this saves the change in an additive track."
      - q: "What does EnableRootMotion do?"
        choices: ["Deletes the root bone", "Allows root motion data to be extracted from the animation", "Plays the animation in reverse", "Locks all bones in place"]
        answer_index: 1
        explain: "EnableRootMotion allows extraction of root motion data so it can move the character instead of only moving the root bone in place."
      - q: "What is the difference between Linear and Step interpolation?"
        choices: ["Linear is faster to compute; Step is slower", "Linear only works on curves", "Step is smoother", "Linear eases between keyframes; Step holds a value until the next keyframe"]
        answer_index: 3
        explain: "Linear interpolation eases between keyframes. Step keeps the value until the next keyframe is reached, with no blending."
      - q: "You create an Animation Curve in a sequence. Which asset must you also save?"
        choices: ["The Skeletal Mesh", "The Level", "The Skeleton asset, because curves are stored on it", "The Physics Asset"]
        answer_index: 2
        explain: "Animation Curves are stored on the Skeleton asset. Creating a curve edits the Skeleton, so you must save it."
    flavors:
      _default: {why: "This editor is where you inspect and fix every animation. Its settings decide how the clip behaves in the game."}
      animation: {why: "Additive type, root motion and rate scale are settings you will change every week. Learn where they are and what they do.", do: "Use the Record button to record the mesh during playback and save it as a new sequence. Compare its frame count with the original."}
      cinematics: {why: "Edit In Sequencer starts from this editor. Knowing the playback settings avoids surprises in a shot."}
      tech_art: {why: "Curves and compression settings on a sequence drive materials and memory cost."}

  - id: AQ14
    rank: 1
    difficulty: apprentice
    specializations: [animation]
    subjects: [animation-blueprint, animgraph, event-graph]
    required_spine: false
    required: true
    title: Your first Animation Blueprint
    brief: "An Animation Blueprint is an asset that decides which animation a character plays at each moment. It has two main graphs: the AnimGraph, which builds the final pose of the character, and the Event Graph, which holds normal Blueprint logic. Every animated character in a game uses one. In this quest you create your first Animation Blueprint, make it play one animation, and assign it to a mesh in the level."
    time_min: 55
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-blueprints-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/graphing-in-animation-blueprints-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-blueprint-editor-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. In the Content Browser, click Add (+), then Animation, then Animation Blueprint. Pick the mannequin Skeleton and name the new asset ABP_First."
      - "Open ABP_First. Find these panels in the editor: Toolbar, Viewport, My Blueprint, Graph, Details and Anim Preview Editor."
      - "In the AnimGraph, drag an idle Animation Sequence from the Asset Browser into the graph. This creates a Sequence Player node. Connect it to the Output Pose node and click Compile."
      - "Watch the link between the two nodes pulse, which shows that the pose is flowing. Change the sequence to a run animation and click Compile again."
      - "Open the Event Graph and look at the events that are already there. Do not add any logic yet."
      - "Place a Skeletal Mesh Actor in the level. In its Details panel, set Animation Mode to Use Animation Blueprint and set Anim Class to ABP_First. Then press Play."
    done_when: "Send a screenshot of the AnimGraph with the Sequence Player connected to Output Pose and a green compile icon. Also send a screenshot in Play mode that shows the actor animated by ABP_First."
    xp: 120
    verify_type: screenshot
    quiz:
      - q: "Which two ways can you create an Animation Blueprint?"
        choices: ["Only from the Level Blueprint", "Add (+) > Animation > Animation Blueprint, or right-click a Skeletal Mesh > Create > Anim Blueprint", "Only by importing an FBX", "From the Physics Asset Editor"]
        answer_index: 1
        explain: "Both paths work. In both cases the Animation Blueprint targets a Skeleton."
      - q: "An Animation Blueprint is created but the character does not use it. What is missing?"
        choices: ["Set Animation Mode to Use Animation Blueprint and Anim Class to the ABP on the Skeletal Mesh", "A Physics Asset", "A Level Sequence", "Enable Root Motion"]
        answer_index: 0
        explain: "An Animation Blueprint does nothing until it is assigned. Set Animation Mode to Use Animation Blueprint and Anim Class to your asset."
      - q: "What happens when you connect a Sequence Player to Output Pose and compile?"
        choices: ["The animation plays once and stops", "Nothing until you press Play in the level", "The animation plays indefinitely in the preview", "The Blueprint fails to compile"]
        answer_index: 2
        explain: "The Sequence Player continuously plays the animation. After Compile you see it loop in the viewport."
      - q: "How is the AnimGraph different from a normal Event Graph?"
