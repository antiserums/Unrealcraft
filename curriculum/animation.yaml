        choices: ["It only works in Sequencer", "Retarget Pose must be the first op in the stack", "It needs an IK goal", "It is disabled on LOD 0"]
        answer_index: 1
        explain: "The page states that Retarget Pose must be the first op in the stack for it to work as expected, and only one copy of the op can be used."
      - q: "When you retarget from the Content Browser with Retarget Animation Assets, what does Auto Generate Retargeter do by default?"
        choices: ["It is off, so you must pick an IK Retargeter", "It only works for Mannequin to MetaHuman", "It renames the exported assets", "It creates IK Rigs and an IK Retargeter for the two meshes automatically"]
        answer_index: 3
        explain: "Auto Generate Retargeter is enabled by default. It creates IK Rig assets and an IK Retargeter for the source and target. Turn it off to use your own retargeter."
      - q: "You batch-retarget an Animation Blueprint. Which export option also retargets the sequences it references?"
        choices: ["Overwrite Existing Files", "Include Referenced Assets", "Export Retarget Assets", "Add Prefix"]
        answer_index: 1
        explain: "Include Referenced Assets duplicates and retargets animation assets referenced by the input, for example sequences in an animation blueprint or blendspace."
      - q: "What replaced Retarget Profiles for state-driven changes (for example IsHoldingWeapon) inside one retarget asset?"
        choices: ["Override Sets, applied on the Retarget Pose From Mesh node", "A second IK Retargeter per state", "Anim Notifies", "Bone Filters"]
        answer_index: 0
        explain: "Override Sets define state-driven variations in a single retarget asset. They are assigned at runtime on the Retarget Pose From Mesh node and replace the former Retarget Profiles workflow."
    flavors:
      _default: {why: "Retargeting one clip is easy. Retargeting a whole library for many characters without hand fixes is the real skill."}
      animation: {why: "You will own the retargeter for every character in the project. It must be repeatable.", do: "Set a per-op LOD threshold so an expensive op is skipped at LOD 2 or higher, and show it."}
      tech_art: {why: "Batch export and override sets are pipeline tools. You will script them."}
      cinematics: {why: "Mocap on new characters goes through this retargeter before it reaches Sequencer."}

  - id: AQ34
    rank: 4
    difficulty: master
    specializations: [animation]
    subjects: [performance, animation-budget-allocator, uro, skeletal-mesh-lods, optimization]
    required_spine: false
    required: true
    title: Animation budget for a crowd
    brief: "Every animated character costs a little computer time on each frame. With fifty characters on screen, this cost can become larger than the time you have for one frame, and the game slows down. An animation budget is a time limit that you set on purpose, and Unreal has tools that keep animation work inside it. In this quest you measure a crowd of 50 characters, make their Animation Blueprint cheaper, turn on the Animation Budget Allocator, set up LODs (simpler versions of the mesh for far distances), and compare the numbers before and after."
    time_min: 150
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-budget-allocator-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-optimization-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/skeletal-mesh-lods-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/working-with-modular-characters-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Set up the crowd assets: duplicate SKM_Manny_Simple and name the copy SK_CrowdCharacter, duplicate ABP_Unarmed and name the copy ABP_Crowd, and make a Character Blueprint named BP_CrowdCharacter whose Mesh uses SK_CrowdCharacter with ABP_Crowd as its Anim Class. Spawn 50 or more copies of BP_CrowdCharacter, for example with a loop in the Level Blueprint that calls Spawn Actor from Class in a grid. Type stat unit in the console to show the frame times, and note the game thread time."
      - "In ABP_Crowd, open Class Settings, find the Optimization section and enable Warn About Blueprint Usage. Move the Event Graph logic into a Thread Safe function that uses Property Access. Continue until the AnimGraph nodes show the Fast Path lightning icon."
      - "Enable the Animation Budget Allocator plugin. In BP_CrowdCharacter, select the Mesh and set its Component Class to SkeletalMeshComponentBudgeted, turn on Auto Calculate Significance, and call Enable Animation Budget at Begin Play."
      - "Run the game with the console command a.Budget.Debug.Enabled 1, and turn on Stat, then Advanced, then AnimationBudgetAllocator. Take a screenshot of the graph and of the numbers shown over each mesh."
      - "Open the file Config/DefaultScalability.ini and add a value for a.Budget.BudgetMs for each quality level. Each level has its own section, so you write four sections: [ViewDistanceQuality@0], [ViewDistanceQuality@1], [ViewDistanceQuality@2] and [ViewDistanceQuality@3], each with its own a.Budget.BudgetMs line below it. Test two of the levels."
      - "Open SK_CrowdCharacter, set Number of LODs to 4 and click Apply Changes. Add Bones to Prioritize on the face or the hands with a high Weight of Prioritization, and click Regenerate LOD."
      - "Compare stat unit before and after your changes, and write the numbers down."
    done_when: "Send screenshots of the budget graph with the overlay, of the Compiler Results with no Blueprint usage warnings, and of the LOD settings, and a table with the stat unit numbers before and after. Add 5 lines about what gave the biggest improvement and one thing you would not do on a hero character."
    xp: 250
    verify_type: writeup
    quiz:
      - q: "Which three optimizations does the Animation Budget Allocator apply when it is over budget?"
        choices: ["Stops ticking some components in favor of a Leader Pose Component, lowers update rate, and chooses whether to interpolate", "Reduces LOD, lowers texture quality, and disables notifies", "Disables root motion, physics and morph targets", "Removes bones, merges meshes and lowers frame rate"]
        answer_index: 0
        explain: "The page lists these three targeted areas: stop ticking components (favoring a Leader Pose Component), update at a lower rate, and choose whether or not to interpolate."
      - q: "What must the character's mesh component be for the budget allocator to manage it?"
        choices: ["A Static Mesh Component", "A SkeletalMeshComponentBudgeted component class", "A Poseable Mesh Component", "Any component with Tick disabled"]
        answer_index: 1
        explain: "You must set the mesh's Component Class to SkeletalMeshComponentBudgeted, or set it in C++ with SetDefaultSubobjectClass, then enable Auto Register with Budget Allocator."
      - q: "A mesh overlay shows the number 5 and the letter I. What does that mean?"
        choices: ["LOD 5 and inactive", "5 ms of work and idle", "5 bones and invisible", "It ticks every 5 frames and is interpolating between frames"]
        answer_index: 3
        explain: "The number is the update rate: 5 means the mesh ticks every five frames. I means interpolating between frames; Hi and Lo show whether expensive logic is running."
      - q: "What is the default value of a.Budget.BudgetMs?"
        choices: ["0.1", "2.5", "1.0", "16.6"]
        answer_index: 2
        explain: "a.Budget.BudgetMs defaults to 1.0 millisecond of skeletal mesh work. The example scalability ini scales it from 1.0 at quality 0 to 2.5 at quality 3."
      - q: "Where does Epic recommend setting the budget for each platform?"
        choices: ["In the Animation Blueprint Class Settings", "In scalability settings, for example DefaultScalability.ini under [ViewDistanceQuality@N]", "In the Skeletal Mesh asset LOD Info", "Hard-coded in BeginPlay"]
        answer_index: 1
        explain: "The page recommends driving the cvars from the platform scalability settings, with an example DefaultScalability.ini that sets a.Budget.BudgetMs per ViewDistanceQuality level."
      - q: "You set a.Budget.MinQuality to 0.5. What is the trade-off?"
        choices: ["No trade-off, it only affects the debug graph", "Interpolation is disabled", "The system may go over its time budget to keep enough components ticking", "All meshes drop to LOD 1"]
        answer_index: 2
        explain: "MinQuality is NumComponentsTickingThisFrame divided by NumComponentsThatWeNeedToTick. If it is not 0.0, the allocator can potentially go over the time budget."
      - q: "What happens to Update Rate Optimization (URO) when a component registers with the budget allocator?"
        choices: ["URO is disabled and the budgeter controls the tick rate", "URO runs at double speed", "URO must be enabled first", "Nothing changes"]
        answer_index: 0
        explain: "RegisterComponent disables the default tick function and disables URO, and re-routes the parallel anim tasks to the budgeter."
      - q: "Per the Animation Optimization page, what is generally the most expensive part of an Animation Blueprint?"
        choices: ["The Output Pose node", "Blend Space evaluation", "Anim notify states", "The Event Graph logic, which runs each tick on the Game Thread"]
        answer_index: 3
        explain: "The Event Graph is evaluated every Tick sequentially on the Game Thread. Moving that logic into Thread Safe functions lets it run on worker threads."
      - q: "A Blend Space node lost its lightning icon after you added a Multiply on the input float. Why?"
        choices: ["The Blend Space asset is corrupt", "Any Blueprint logic on the pin stops Fast Path, so the node now calls into the Blueprint VM", "Multiply is not thread safe", "The lightning icon only shows in Debug builds"]
        answer_index: 1
        explain: "Fast Path copies member variables directly. If any calculation is added, the node can no longer use Fast Path and the icon is removed after compile."
      - q: "Why can a character with root motion driving movement not use parallel animation updates?"
        choices: ["Character movement is not multi-threaded, so the update must run on the game thread", "Root motion is always on the render thread", "Root motion needs a Leader Pose Component", "Parallel updates only work with URO"]
        answer_index: 0
        explain: "The page says that if root motion is required for character movement, the parallel update cannot be performed because character movement is not multi-threaded."
      - q: "The LOD generator removed the detail on the hands. What is the documented fix?"
        choices: ["Add the hand bones to Bones to Prioritize with a high Weight of Prioritization, then Regenerate LOD", "Enable Volumetric Correction", "Import LOD 0 again", "Lower the Termination Criterion to 0"]
        answer_index: 0
        explain: "Bones to Prioritize keeps geometry skinned to those bones from being optimized. The page uses a high weight like 5,000 and then Regenerate LOD."
      - q: "The team wants the cheapest modular crowd character on the game thread and accepts no physics. Which method does the modular characters page rank lowest on game thread cost?"
        choices: ["Copy Pose from Mesh", "Skeletal Mesh Merge", "Leader Pose Component", "Separate Animation Blueprints per part"]
        answer_index: 2
        explain: "The chart shows Leader Pose Component with minimum setup and game thread cost, but high render thread cost and no physics. Skeletal Mesh Merge has low render cost but more setup."
    flavors:
      _default: {why: "Fifty animated characters can eat a frame. A master knows how to spend milliseconds on purpose."}
      animation: {why: "You must ship crowds that still look alive. The budget allocator decides who gets the frames.", do: "Set bNeverSkip or Always Tick on the player mesh and prove in the overlay that it stays at rate 1 under load."}
      programming: {why: "Thread safe updates and the budgeter API are your side of the deal."}
      tech_art: {why: "LOD settings and scalability ini files are tools you will maintain."}

  - id: AQ35
    rank: 4
    difficulty: master
    specializations: [animation]
    subjects: [control-rig, modular-rigging, rigging]
    required_spine: false
    required: true
    title: Modular Control Rig
    brief: "A Control Rig gives a character controls that an animator can grab and move. Building one by hand takes a long time. A Modular Control Rig is built from ready-made parts called modules, such as a spine, an arm or a leg, that you drop onto the skeleton. Each module connects to a socket, a point on the skeleton where it attaches. In this quest you build a full rig from modules, repair a broken connection, and create a module of your own."
    time_min: 150
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/modular-control-rigs-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/control-rig-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Enable the Control Rig Modules plugin: open Edit > Plugins, look in the Animation category, enable it and restart the editor."
      - "Create CR_Modular_Hero: in the Add menu choose Animation, then Control Rig, then Control Rig, and choose ModularRig. Set the Preview Mesh to the mannequin, for example SKM_Manny_Simple, or to a character of your own."
      - "Drag the Spine module onto the unresolved socket. Then add Neck, both Legs, both Feet, Shoulders and Arms. For the fingers, select all finger sockets at once and drop one Finger module on them."
      - "Delete the modules of the left arm. Build them again by selecting the modules of the right arm and using Mirror in the Module Hierarchy."
      - "Make one connector unresolved on purpose, for example by renaming a bone or removing a socket. Then fix it with Use Selected or with the hierarchy dropdown. Take a screenshot of the red none before the fix and another one after the fix."
      - "Create your own module. Make a new Control Rig, choose Switch to Rig Module, and set its Name, Icon and Description. Add one Secondary connector with a Type Rule, and then add your module to CR_Modular_Hero."
      - "Drag CR_Modular_Hero into a level. Set keys for 3 poses in Sequencer, the animation timeline tool of Unreal, and take a screenshot of each pose."
    done_when: "Send screenshots of the finished Module Hierarchy, of the unresolved connector before and after the fix, and of the Class Settings of your custom module. Also send the screenshots of your 3 poses in Sequencer, or a short video clip (30 seconds or less) of them. Add 4 lines about what your module does and how its connectors resolve."
    xp: 250
    verify_type: screenshot
    quiz:
      - q: "What is a Module in the Modular Control Rig framework?"
        choices: ["A Control Rig component for a body part, such as an Arm or Spine, that rigs that part and creates its controls", "A Skeletal Mesh section", "A Sequencer track", "A Physics Asset body"]
        answer_index: 0
        explain: "A Module is a pre-built Control Rig component that represents a part of the body. Modules connect together to form a complete rig."
      - q: "Is the Control Rig Modules plugin required to build a Modular Control Rig?"
        choices: ["Yes, the ModularRig option does not appear without it", "Yes, it contains the Control Rig editor", "No, it only adds icons", "No, but it contains the pre-configured Modules used in the example workflow"]
        answer_index: 3
        explain: "The page says the plugin is not required, but it holds the pre-configured example Modules and is recommended for getting started. It can be loaded and unloaded as needed."
      - q: "Which hierarchy element types can a socket resolve to?"
        choices: ["Bones, Controls and Nulls", "Only Bones", "Materials and Sockets", "Curves and Bones"]
        answer_index: 0
        explain: "A socket can resolve to Bones, Controls or Nulls. Connectors can carry rules that limit which of these types they accept."
      - q: "In the viewport you see a circle with a small gray dot inside. What is it?"
        choices: ["A resolved connector", "A mirrored module", "An unresolved socket", "A socket with multiple connectors"]
        answer_index: 2
        explain: "A large gray circle inside means resolved. A small gray dot means unresolved. A number means several connectors resolved to the same socket."
      - q: "How do you add a Finger module to all fingers in one step?"
        choices: ["Drop the module on the Spine socket", "Select all finger sockets, then drop one Finger module on one of them", "Use Duplicate five times", "Set Type to Finger in Class Settings"]
        answer_index: 1
        explain: "The workflow selects each finger socket, then drags one Finger module onto one of the selected sockets to create multiple modules at the same time."
      - q: "You mirror the right leg modules but the new connectors do not resolve. What is the likely cause?"
        choices: ["Mirroring only works on arms", "Mirror Axis must be Z", "The plugin is disabled", "The sockets for the left side do not exist on the mesh"]
        answer_index: 3
        explain: "The page notes that sockets need to exist for the mirrored module connectors to resolve properly."
      - q: "Which is a valid way to resolve a connector that shows a red none?"
        choices: ["Recompile the Skeletal Mesh", "Select the element in the viewport and press Use Selected, or pick it from the hierarchy dropdown, or run Auto Resolve", "Rename the module", "Delete the Primary connector"]
        answer_index: 1
        explain: "Unresolved connectors can be fixed with the Use Selected arrow, the hierarchy dropdown (filtered by rules), or Auto Resolve which re-runs the Connector Event."
      - q: "How many Primary connectors can one module have, and what should it resolve to?"
        choices: ["One, and it should resolve to a socket on the Skeletal Mesh", "As many as needed, resolving to Bones", "Two, one per side", "None, only Secondary connectors exist"]
        answer_index: 0
        explain: "A module has exactly one Primary connector, created automatically when the rig is converted to a module. It resolves first and should target a socket with the Socket Type Rule."
      - q: "A Secondary connector is marked Optional. What does that mean?"
        choices: ["It resolves to a random bone", "It is deleted on save", "The module works even if the connector never resolves", "It only resolves in Sequencer"]
        answer_index: 2
        explain: "If a Secondary Connector is Optional, it does not have to resolve for the module to work properly."
      - q: "A Foot module needs to change the Leg module's logic to add a foot roll. Which feature is made for this?"
        choices: ["Pre and Post Forwards Solve", "Module Metadata at Root scope", "Mirroring", "The Connector Event"]
        answer_index: 0
        explain: "Pre and Post Forwards Solve let a module run logic before or after the forwards solve, for example a Foot module editing a Leg module to create a foot roll setup."
      - q: "In which order do modules execute?"
        choices: ["Alphabetically by name", "In parallel on several threads", "In module tree order from root to leaf, such as Spine, Leg, Foot, on one thread", "Leaf to root"]
        answer_index: 2
        explain: "Modules run in the order they appear in the module tree, root to leaf, all on the same thread sequentially. The graph cannot be multithreaded."
      - q: "Your studio wants a different Root module for all new modular rigs. What does the page recommend?"
        choices: ["Edit the Root module inside the Control Rig plugin folder", "Create a new Root module in your project and set it as Default Root Module in Project Settings > Control Rig", "Rename the plugin module", "Set the root in each rig's Preview Mesh"]
        answer_index: 1
        explain: "The Default Root Module setting lives in Project Settings under Control Rig. Epic recommends creating a new Root Module in your project instead of editing the plugin asset."
    flavors:
      _default: {why: "Building a full rig from modules takes minutes instead of days. A master also knows how to author the modules."}
      animation: {why: "You will rig new characters and fix rigs that others built. Connectors and rules are the language.", do: "Add Get Module Metadata to your custom module to read a global control size from the Root scope."}
      cinematics: {why: "Modular rigs work in Sequencer like any Control Rig. You can animate a new character the same day it arrives."}
      tech_art: {why: "Module authoring is a rigging pipeline. Rules and metadata keep it consistent across characters."}

  - id: AQ36
    rank: 4
