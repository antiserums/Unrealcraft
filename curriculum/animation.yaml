    required_spine: false
    required: false
    title: "Constraint limits and constraint profiles"
    brief: "In a Physics Asset, a constraint is the joint between two bodies, and its limits say how far the joint may bend and twist. With good limits, a ragdoll falls like a real body. With bad limits, the arms and legs fold in impossible ways. A constraint profile is a saved set of constraint settings that you can switch to while the game runs. In this quest you turn the elbow into a hinge, copy it to the other arm, and create a stiffer profile that you apply from a Blueprint."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/editing-physics-asset-constraints-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/physics-constraint-reference-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/physics-damping-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-a-physics-constraint-profile-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/applying-a-physics-constraint-profile-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/troubleshooting-common-physics-asset-errors-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open the Physics Asset of the mannequin (PA_Mannequin in the folder Characters/Mannequins/Rigs), or the one of your own character. In the Skeleton Tree, open Options and enable Show Constraints. Select the constraint of the left elbow."
      - "Use the 1, 2 and 3 keys to switch Swing1, Swing2 and Twist between Limited and Locked. Make a hinge, which means one of them is Limited and the other two are Locked. Set the limit angle to about 120 degrees. Rotate the constraint so that the green arc matches the way a real elbow bends."
      - "Copy the constraint with Ctrl+C. Select the constraint of the right elbow and paste with Ctrl+V."
      - "Simulate with No Gravity first to check the alignment, and then simulate normally. If the ragdoll shakes, add a small amount of Linear Damping and Angular Damping on the bodies."
      - "Open Window > Profiles. Under Constraint Profiles, click New and name the profile CP_Stiff. Select both arm constraints and press Assign. Set Limit Stiffness and Limit Damping to stiffer values."
      - "Create an Actor Blueprint named BP_RagdollPawn with a Skeletal Mesh Component that uses SKM_Manny_Simple. Set the collision of the component to Collision Enabled, and set it to ignore the Pawn channel. On BeginPlay, call Set Constraint Profile for All with CP_Stiff. Then call Set All Bodies Below Simulate Physics with the bone spine_01, New Simulate on and Include Self on. Place the Blueprint in a level, press Play and compare with the default profile."
    done_when: "Send a screenshot of the elbow constraint with its arc in the viewport and the Details panel. Also send a screenshot of the Profiles tab that shows CP_Stiff assigned, and a screenshot of the Blueprint graph that applies it."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "In the Physics Asset Editor, what do the 1, 2 and 3 keys do with a constraint selected?"
        choices: ["Switch between Body, Constraint and Simulate modes", "Change the viewport camera", "Switch Swing1, Swing2 and Twist between Limited and Locked", "Cycle the Current Profile"]
        answer_index: 2
        explain: "The page says 1, 2 and 3 toggle Swing1, Swing2 and Twist between Limited and Locked. The 4 key cycles which one is limited."
      - q: "You deleted the shoulder constraint by mistake. What does the page say about recreating it?"
        choices: ["Constraints are only created when a body is generated, so you must remove and recreate the upper arm body, which also affects the elbow constraint", "Right-click the bone and choose Add Constraint", "Press Ctrl+Z at any time later", "Duplicate the other shoulder constraint"]
        answer_index: 0
        explain: "There is no easy way to recreate a constraint. They are made only when a body is generated and only upstream, so you rebuild bodies down the chain."
      - q: "How do you copy limits from one constraint to several others?"
        choices: ["Drag the constraint onto the others", "Assign them all to a profile named Copy", "Use the Tools tab > Regenerate Bodies", "Select the source, Ctrl+C, select the targets, Ctrl+V"]
        answer_index: 3
        explain: "The page describes copying constraint properties with Ctrl+C and pasting to selected constraints with Ctrl+V."
      - q: "How is Damping on a Physics Constraint different from Damping on a Physics Body?"
        choices: ["Constraint damping is always stronger", "Constraint damping works only on Limited motions and only when the motion goes past its limit", "Body damping only affects rotation", "There is no difference"]
        answer_index: 1
        explain: "The Physics Damping page says constraint damping acts only on Limited motions when a motion tries to exceed its limit. Body damping is a constant drag."
      - q: "Per the Physics Damping page, what does a Limit Stiffness of 50000 do compared to the default 50?"
        choices: ["50000 completely deflects the motion; 50 barely affects it", "50000 makes the joint break", "50000 disables the limit", "Both look the same in play"]
        answer_index: 0
        explain: "The page says the default 50 barely affects motion, 5000 bounces back into the limit, and 50000 completely deflects it."
      - q: "Your ragdoll flies apart with wild movement. What is the usual cause and fix?"
        choices: ["Too much mass; lower Mass in KG", "The constraint profile is missing; create one", "Gravity is too strong; lower the world gravity", "Two colliding bodies interpenetrate; disable collision between them or move or scale them apart"]
        answer_index: 3
        explain: "The troubleshooting page calls this Exploding. Interpenetrating bodies that collide get huge forces. Disable their collision or fix their placement."
      - q: "Which node applies a constraint profile to a Skeletal Mesh Component at runtime?"
