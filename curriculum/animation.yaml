      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/ik-rig-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create an IK Rig named IK_BodyMover for the UE5 Mannequin or for your own two-legged character. To create it, click Add (+), then Animation, then IK Rig."
      - "Select foot_l and foot_r, right-click and choose New IK Goal. When Unreal asks for a Solver, pick Limb IK. Set thigh_l and thigh_r as the root of each Limb IK: right-click the bone and choose Set Root Bone on Selected Solver."
      - "In the Solver Stack, click Add New Solver and add Body Mover. Set pelvis as its root bone. Connect both foot goals to it: right-click each goal and choose Connect Goal to Selected Solver."
      - "Drag Body Mover to the top of the Solver Stack, so that it is calculated first. Read the numbers next to the solver names, which show the order."
      - "In the viewport, drag one foot goal 40 cm up and watch the pelvis move. Select Body Mover and set Rotation Alpha to 0. Compare how much the body leans before and after."
      - "Add a Pole Solver for the left leg. Set thigh_l as its root and foot_l as its end. Then create an IK Goal on calf_l, the first child of the root, to use as the pole vector, the point that the knee turns toward. Move it and watch the knee turn."
      - "Right-click a twist bone, for example thigh_twist_01_l, and choose Exclude Selected Bone From Solve. Note that its icon changes."
    done_when: "Send two screenshots of the IK Rig editor: one of the Solver Stack with Body Mover first, two Limb IK solvers and a Pole Solver, and one of the viewport with one foot goal raised and the pelvis following. Add two lines that say what Rotation Alpha 0 on Body Mover changed, and which bone you excluded and why."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What does a Body Mover solver need before it works?"
        choices: ["A root bone and at least two IK Goals", "Only one IK Goal on the pelvis", "A Control Rig asset", "A Pole Solver above it in the stack"]
        answer_index: 0
        explain: "Body Mover requires a root bone and at least two connected IK Goals, usually the feet. It can take more goals for creatures with many legs."
      - q: "Where should Body Mover sit in the Solver Stack, and why?"
        choices: ["Last, so it can undo the other solvers", "Anywhere, solvers run in parallel", "First, so Limb IK or Full Body IK can compensate after the body moved", "Between the two Limb IK solvers"]
        answer_index: 2
        explain: "Body Mover is meant for ground alignment and should be the first solver. The other solvers then evaluate after it in sequence."
      - q: "A humanoid leans strangely toward a raised foot goal. Which Body Mover setting fixes this per the source?"
        choices: ["Influence Multiplier to 10", "Rotation Alpha to 0", "Reach Precision to 0", "Enable Limit on the pelvis"]
        answer_index: 1
        explain: "The page says setting Rotation Alpha to 0 on humanoid characters resolves the unnatural lean toward the offset goal. Quadrupeds may keep the root rotation."
      - q: "How many bones must a Limb IK chain have at minimum?"
        choices: ["Two", "Four", "Any number, even one", "Three"]
        answer_index: 3
        explain: "Limb IK requires at least three bones in the chain, for example thigh, calf and foot, to work correctly."
      - q: "You set Max Iterations and Pull Distribution on a Limb IK for a normal thigh > calf > foot chain. What happens?"
        choices: ["The chain converges faster", "The chain stretches", "Nothing, these settings only matter for chains with more than 3 bones", "The solver turns off"]
        answer_index: 2
        explain: "The Limb IK Details settings are only valid when the chain has more than three bones. A normal humanoid leg is not affected by them."
      - q: "For a Pole Solver, where must the IK Goal that acts as the pole vector be created?"
        choices: ["On the end bone (the foot)", "On the root bone (the thigh)", "On the pelvis", "On the first child bone of the root (the middle joint)"]
        answer_index: 3
        explain: "The Pole Solver needs a root and an end bone, plus a goal on the first child of the root. In a three-bone chain that is the middle joint, like the knee."
      - q: "What does Exclude Selected Bone From Solve do?"
        choices: ["Deletes the bone from the skeleton", "The bone is ignored by all solvers, which can fix bad poses or simplify a chain", "Locks the bone in world space", "Removes the bone only from the retarget chain"]
        answer_index: 1
