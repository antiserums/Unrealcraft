  - id: AQ15
    rank: 1
    difficulty: apprentice
    specializations: [animation]
    subjects: [animation-blueprint, state-machine, transitions, locomotion]
    required_spine: false
    required: true
    title: "State machine: idle to walk"
    brief: "A state machine is a way to organize animations into states, such as Idle and Walk, with rules that say when to change from one state to another. This is how characters switch smoothly between standing and moving. In this quest you build the smallest useful state machine: two states and two transitions that depend on how fast the character moves."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/state-machines-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/transition-rules-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-get-animation-variables-in-animation-blueprints-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. In the Content Browser, click Add (+), then Animation, then Animation Blueprint. Pick the mannequin Skeleton and name the new asset ABP_Locomotion. If you already have a simple Animation Blueprint of your own for this Skeleton, you can use that instead."
      - "In the AnimGraph, right-click and choose State Machines, then Add New State Machine. Name it Locomotion and connect it to the Output Pose node."
      - "Double-click the state machine to open it. Drag from the Entry node and choose Add State, and name the state Idle. Open the state, put the idle animation inside, and connect it to the state's Output Pose."
      - "Add a second state named Walk that contains a walk or run animation. Create one transition from Idle to Walk and one transition from Walk to Idle, because each transition only goes in one direction."
      - "In the Event Graph, start from Event Blueprint Update Animation. Use Try Get Pawn Owner, cast the result to BP_ThirdPersonCharacter, get Character Movement, get Velocity, and then use Vector Length XY. Promote the result to a variable named Speed."
      - "Open the transition rule from Idle to Walk and make it true when Speed > 10. Make the rule from Walk to Idle true when Speed <= 10. Then click Compile."
      - "Assign the Animation Blueprint to the Mesh component of BP_ThirdPersonCharacter, using the Anim Class property. Press Play and walk around. Then set the Duration of the Idle to Walk transition to 0.2 and compare how the change looks."
    done_when: "Send a screenshot of the state machine graph that shows Idle, Walk and both transitions, and a screenshot of one transition rule that uses Speed. Also send a short video clip (30 seconds or less), or two screenshots, of the character idle and walking in Play mode."
    xp: 125
    verify_type: screenshot
    quiz:
      - q: "How do you add a State Machine to an Animation Blueprint?"
        choices: ["Add (+) > Animation > State Machine in the Content Browser", "Right-click in the Anim Graph, choose State Machines > Add New State Machine, connect it to Output Pose", "Drag a Skeleton into the Event Graph", "Enable it in Class Settings"]
        answer_index: 1
        explain: "State Machines are created inside the Anim Graph from the right-click menu. Then connect the node to Output Pose."
      - q: "What is the Entry point used for?"
        choices: ["Defining the default state, usually idle in a locomotion setup", "Stopping the animation", "Importing animations", "Connecting to the Event Graph"]
        answer_index: 0
        explain: "Every State Machine starts with an entry point. The state connected to it is active by default. For locomotion this is usually idle."
      - q: "You made one transition from Idle to Walk. The character walks but never returns to idle. Why?"
        choices: ["The Skeleton is wrong", "Transitions are one direction only; you also need a Walk to Idle transition", "The animation is not looping", "State Machines allow only one transition"]
        answer_index: 1
        explain: "Transitions are single-direction. To go back and forth you need one transition for each direction."
      - q: "What must a transition rule output?"
        choices: ["A pose", "A float speed", "A boolean; true lets the state change", "A Montage"]
        answer_index: 2
        explain: "Transition rule logic ends with a boolean. When it is true, the state machine can transition to the next state."
      - q: "How do the docs get a Speed value for locomotion?"
        choices: ["From the mesh bounds", "From the animation's Rate Scale", "From the camera distance", "Get Velocity from the Character Movement component, then Vector Length XY"]
        answer_index: 3
        explain: "Speed comes from the movement component's velocity. Vector Length XY isolates forward and lateral speed."
      - q: "What does the state property Always Reset on Entry do?"
        choices: ["Deletes the state's animation", "Blocks all transitions into the state", "Makes the animations in the state restart from the beginning each time the state is entered", "Resets the whole Animation Blueprint"]
        answer_index: 2
        explain: "With Always Reset on Entry the state's sequence players restart at the start time. If disabled, they continue where they left off."
    flavors:
      _default: {why: "Idle to walk is the smallest real locomotion system. Everything larger is built the same way."}
      animation: {why: "States, transitions and rules are the daily language of gameplay animation. Master the small case first.", do: "Add a Conduit or a State Alias and write one line on when it helps."}
      programming: {why: "You will expose variables like Speed and IsFalling for animators. See how they are consumed."}
      gameplay_design: {why: "Transition duration and thresholds change how the character feels. Try a few values."}

