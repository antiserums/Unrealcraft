    quiz:
      - q: "What is a Module in the Modular Control Rig framework?"
        choices: ["A Control Rig component for a body part, such as an Arm or Spine, that rigs that part and creates its controls", "A Skeletal Mesh section", "A Sequencer track", "A Physics Asset body"]
        answer_index: 0
        explain: "A Module is a pre-built Control Rig component that represents a part of the body. Modules connect together to form a complete rig."
      - q: "Is the Control Rig Modules plugin required to build a Modular Control Rig?"
        choices: ["Yes, the ModularRig option does not appear without it", "Yes, it contains the Control Rig editor", "No, it only adds icons", "No, but it contains the pre-configured Modules used in the example workflow"]
        answer_index: 3
        explain: "The page says the plugin is not required, but it holds the pre-configured example Modules and is recommended for getting started. It can be loaded and unloaded as needed."
      - q: "Which hierarchy element types can a socket resolve to?"
        choices: ["Bones, Controls and Nulls", "Only Bones", "Materials and Sockets", "Curves and Bones"]
        answer_index: 0
        explain: "A socket can resolve to Bones, Controls or Nulls. Connectors can carry rules that limit which of these types they accept."
      - q: "In the viewport you see a circle with a small gray dot inside. What is it?"
        choices: ["A resolved connector", "A mirrored module", "An unresolved socket", "A socket with multiple connectors"]
        answer_index: 2
        explain: "A large gray circle inside means resolved. A small gray dot means unresolved. A number means several connectors resolved to the same socket."
      - q: "How do you add a Finger module to all fingers in one step?"
        choices: ["Drop the module on the Spine socket", "Select all finger sockets, then drop one Finger module on one of them", "Use Duplicate five times", "Set Type to Finger in Class Settings"]
        answer_index: 1
        explain: "The workflow selects each finger socket, then drags one Finger module onto one of the selected sockets to create multiple modules at the same time."
      - q: "You mirror the right leg modules but the new connectors do not resolve. What is the likely cause?"
        choices: ["Mirroring only works on arms", "Mirror Axis must be Z", "The plugin is disabled", "The sockets for the left side do not exist on the mesh"]
        answer_index: 3
        explain: "The page notes that sockets need to exist for the mirrored module connectors to resolve properly."
      - q: "Which is a valid way to resolve a connector that shows a red none?"
        choices: ["Recompile the Skeletal Mesh", "Select the element in the viewport and press Use Selected, or pick it from the hierarchy dropdown, or run Auto Resolve", "Rename the module", "Delete the Primary connector"]
        answer_index: 1
        explain: "Unresolved connectors can be fixed with the Use Selected arrow, the hierarchy dropdown (filtered by rules), or Auto Resolve which re-runs the Connector Event."
      - q: "How many Primary connectors can one module have, and what should it resolve to?"
        choices: ["One, and it should resolve to a socket on the Skeletal Mesh", "As many as needed, resolving to Bones", "Two, one per side", "None, only Secondary connectors exist"]
        answer_index: 0
        explain: "A module has exactly one Primary connector, created automatically when the rig is converted to a module. It resolves first and should target a socket with the Socket Type Rule."
      - q: "A Secondary connector is marked Optional. What does that mean?"
        choices: ["It resolves to a random bone", "It is deleted on save", "The module works even if the connector never resolves", "It only resolves in Sequencer"]
        answer_index: 2
        explain: "If a Secondary Connector is Optional, it does not have to resolve for the module to work properly."
      - q: "A Foot module needs to change the Leg module's logic to add a foot roll. Which feature is made for this?"
        choices: ["Pre and Post Forwards Solve", "Module Metadata at Root scope", "Mirroring", "The Connector Event"]
        answer_index: 0
        explain: "Pre and Post Forwards Solve let a module run logic before or after the forwards solve, for example a Foot module editing a Leg module to create a foot roll setup."
      - q: "In which order do modules execute?"
        choices: ["Alphabetically by name", "In parallel on several threads", "In module tree order from root to leaf, such as Spine, Leg, Foot, on one thread", "Leaf to root"]
        answer_index: 2
        explain: "Modules run in the order they appear in the module tree, root to leaf, all on the same thread sequentially. The graph cannot be multithreaded."
      - q: "Your studio wants a different Root module for all new modular rigs. What does the page recommend?"
        choices: ["Edit the Root module inside the Control Rig plugin folder", "Create a new Root module in your project and set it as Default Root Module in Project Settings > Control Rig", "Rename the plugin module", "Set the root in each rig's Preview Mesh"]
        answer_index: 1
        explain: "The Default Root Module setting lives in Project Settings under Control Rig. Epic recommends creating a new Root Module in your project instead of editing the plugin asset."
    flavors:
      _default: {why: "Building a full rig from modules takes minutes instead of days. A master also knows how to author the modules."}
      animation: {why: "You will rig new characters and fix rigs that others built. Connectors and rules are the language.", do: "Add Get Module Metadata to your custom module to read a global control size from the Root scope."}
      cinematics: {why: "Modular rigs work in Sequencer like any Control Rig. You can animate a new character the same day it arrives."}
      tech_art: {why: "Module authoring is a rigging pipeline. Rules and metadata keep it consistent across characters."}

