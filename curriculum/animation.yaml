    required_spine: false
    required: false
    title: "IK goals in the retargeter: floor, stride and override sets"
    brief: "After a retarget, feet often slide or sink into the floor, and the steps can be too long or too short for the new character. IK goals in the retargeter fix this: they pull the feet to the right place after the rotations are copied. An override set is a named group of setting changes that you can turn on while the game runs. In this quest you add a floor constraint and stride warping (changing the length of the steps), put one setting into an override set, and control it from an Animation Blueprint."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/retargeting-operation-stack-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/ik-rig-animation-retargeting-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open an IK Retargeter between two characters. If you have none, make one: create an IK Rig for SKM_Manny_Simple and one for SKM_Quinn_Simple, and use Auto Create Retarget Chains in each. Then create an IK Retargeter with Manny as the source and Quinn as the target, and click Add Default Ops."
      - "In the IK Rig of the target, give the LeftLeg and RightLeg chains an IK Goal, using Add Chain and Goal with Limb IK."
      - "In the retargeter, select Run IK Rig. Confirm that Enable IK is on for both leg chains, and that the goals are drawn when Draw Final Goals is on."
      - "Under Run IK Rig, add a Floor Constraint sub-op. On both leg chains, turn Enable Floor Constraint on and set Alpha to 1. Enable Use Foot, and adjust Heel Offset and Toe Offset until the feet stop sinking into the floor in a walk animation."
      - "Add a Stride Warp IK Goals sub-op. Set Direction Source to Goals and Forward Direction to Y, and enable it on the leg chains. Set Warp Forwards to 0.7 and then to 1.3, and watch the length of the steps."
      - "Add a Speed Plant IK Goals sub-op. Read its settings, and write down which animation curve it needs and which Blend Method you would pick for a run. Leave the op disabled if your animations have no speed curve."
      - "Open Override Sets and create a set named OS_LongStride. Right-click the Stride Warp op and add Warp Forwards to the set with the value 1.3. Turn the set on and off in the editor."
      - "Open Variables and add a Float variable named StrideScale. Bind it to Warp Forwards inside OS_LongStride."
      - "Create an Animation Blueprint for the target character. In its AnimGraph, add a Retarget Pose From Mesh node and set the retargeter on it. Add OS_LongStride to Override Set to Apply, and connect a variable to the StrideScale pin. To test it, make a Character Blueprint in which the source mesh plays an animation and the target mesh is a child component of it with this Animation Blueprint. Press Play and change the value."
    done_when: "Send screenshots of the Run IK Rig sub-stack with Floor Constraint and Stride Warp, of the Override Sets panel with OS_LongStride, and of the Retarget Pose From Mesh node with the override set and the StrideScale pin. Add three lines: the heel and toe offsets you used, the Warp Forwards value that looked right, and what Speed Planting needs to work."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "When do you typically need IK goals on retarget chains, per the source?"
        choices: ["Always, every chain must have one", "Only for extra IK adjustments such as Speed Planting, Stride Warping or Blend to Source", "Only for the pelvis", "Only when exporting"]
        answer_index: 1
        explain: "The page says you typically do not need IK goals unless the retarget needs additional IK adjustments like Speed Planting, Stride Warping or Blend to Source."
      - q: "Enable IK is off on a chain that has an IK goal. What happens?"
        choices: ["The IK is skipped completely", "The chain is deleted", "The goal moves to the source", "The IK still evaluates, but the goal is set to the input bone location from the FK pass"]
        answer_index: 3
        explain: "With Enable IK disabled the IK still runs, but the goal is placed at the bone location from the FK pass, so it has no retargeted offset."
      - q: "Where is the floor for the Floor Constraint sub-op?"
        choices: ["The XY plane at Z = 0", "The lowest bone of the source", "The pelvis height", "The capsule bottom"]
        answer_index: 0
        explain: "The floor is assumed to be the XY plane where Z = 0. Use Foot and Use Toes refine the contact using a foot plane instead of a point."
      - q: "Warp Forwards is set to 0.7 on Stride Warp. What is the result?"
        choices: ["Longer strides", "Wider stance", "Smaller strides", "No change, 1 is required"]
        answer_index: 2
        explain: "Values lower than 1 create smaller strides along the forward direction and values higher than 1 increase stride length."
      - q: "Which Direction Source does the page recommend for a quadruped?"
        choices: ["Goals", "Pelvis", "Root", "Chain"]
        answer_index: 3
        explain: "Goals fits characters with a vertical spine like bipeds. Chain uses bone positions in retarget chains and is best for horizontal spines like quadrupeds."
      - q: "What does Speed Planting use to decide the source foot is not moving?"
        choices: ["A speed curve named in Speed Curve Name, compared against Speed Threshold", "The root motion", "A line trace", "The Floor Constraint"]
        answer_index: 0
        explain: "Speed Planting reads an animation curve named in Speed Curve Name. When the bone speed drops below Speed Threshold the target goal stops moving."
      - q: "Which Blend Method only blends out of planted states and tracks fast motion without looking mushy?"
        choices: ["Spring", "Move Towards", "Critical Damping", "Linear"]
        answer_index: 1
        explain: "Move Towards tracks fast motion more accurately and only blends out of planted states. Spring uses a critically damped spring to blend both in and out."
      - q: "A variable is bound to an op property inside an override set and connected on the Retarget Pose From Mesh node, but nothing changes. What is the most likely cause?"
        choices: ["Variables only work in Python", "The variable must be an array", "The override set is not active on the node", "The op needs Draw Final Goals on"]
        answer_index: 2
        explain: "A variable only applies to the bound property when its override set is active. You add the set name to Override Set to Apply on the node. Arrays, maps and sets cannot be used as variables."
    flavors:
      _default: {why: "IK goals turn a retarget from 'close enough' into planted feet and controlled strides, and override sets make it change at runtime."}
      animation: {why: "Floor Constraint and Stride Warp fix the two most visible retarget faults: sinking feet and wrong stride.", do: "Add a Blend to Source sub-op on the hand chains and compare Translation Alpha 1 vs 0 on a prop-holding clip."}
      gameplay_design: {why: "Override sets driven by gameplay state (IsHoldingWeapon, IsEmote) replace hand-made animation variants.", do: "Make a second override set toggled by a Bool from the character Blueprint."}

  - id: AQ71
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [distance-matching, animation-blueprint, curves, locomotion]
    required_spine: false
    required: false
    title: "Distance Matching: land on the ground"
    brief: "Distance Matching picks the frame of an animation from a distance and not from time. For a landing, the distance is how far the character is above the ground, so the legs reach for the floor at the right moment from any fall height. The animation needs a curve that stores this distance for every frame. In this quest you add that curve to a landing animation with a modifier, and build an Animation Blueprint that chooses the pose from the distance to the ground."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/distance-matching-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-compression-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/root-motion-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Enable the Animation Locomotion Library plugin: open Edit > Plugins, look in the Animation category, enable it and restart the editor."
      - "You need a landing animation in which the root bone moves down to the ground. If you have none, make one: duplicate the land animation of the mannequin, open the copy and select the root bone in the Skeleton Tree. Move it about 100 units up at the first frame and press Key in the toolbar. Then go to the last frame and press Key with the root at its normal height."
      - "Open the landing animation and turn on Enable Root Motion in Asset Details. Then open Window, then Animation Data Modifiers. Add a Distance Curve Modifier with Axis set to Z, Stop at End turned on, and Curve Name set to DistanceToGround. Click Apply All Modifiers."
      - "Create a Curve Compression Settings asset named CCS_UniformIndexable: click Add, then Animation, then Advanced. Set its Codec to Uniform Indexable. Assign it to the landing animation under Compression in Asset Details."
      - "Create an Animation Blueprint named ABP_DistanceLand. Add a Sequence Evaluator node with the landing animation and connect it to Output Pose. On Explicit Time, choose Dynamic Value. Turn off Should Loop and Teleport to Explicit Time. Set Start Position to 0 and Reinitialization Behavior to Explicit Time."
      - "In the Details panel of the node, under Functions, find On Update, click +Create Binding and name the function DistanceMatching. Inside it, add a Distance Match to Target node and then Convert to Sequence Evaluator. Add a float variable named DistanceToGround, and set Distance Curve Name to DistanceToGround."
      - "Compile. In the preview viewport, open Scene Setup and change Floor Height Offset. Watch the legs reach for the ground at different distances."
    done_when: "Send two screenshots: one of the graph of the DistanceMatching function, and one of the preview viewport at two different Floor Height Offset values that shows two different poses."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What drives an Animation Sequence in Distance Matching instead of time?"
        choices: ["A calculated distance variable read against an animation curve", "The montage play rate", "The character's capsule radius", "A random seed per frame"]
        answer_index: 0
        explain: "Distance Matching selects poses by a distance value. The Animation Blueprint searches the distance curve and outputs the matching pose."
      - q: "Which plugin must be enabled before you can use the Distance Matching nodes?"
        choices: ["Motion Warping", "Animation Locomotion Library", "Pose Search", "Control Rig"]
        answer_index: 1
        explain: "The page lists the Animation Locomotion Library plugin as the first prerequisite. Enable it and restart the editor."
      - q: "Where do you generate the distance curve for a sequence?"
        choices: ["Curve Editor > Add Curve", "Asset Details > Root Motion > Bake Curve", "Window > Animation Data Modifiers > Add Modifier > Distance Curve Modifier", "Right-click the animation > Create > Distance Curve"]
        answer_index: 2
        explain: "The Distance Curve Modifier is an Animation Data Modifier. You add it in that window and press Apply All Modifiers."
      - q: "You are distance matching a landing animation. Which Axis setting does the page recommend?"
        choices: ["XY, because the character moves forward", "None, the axis does not matter for landings", "All axes", "Z, because the distance is a change in height"]
        answer_index: 3
        explain: "The page says Z is useful for land animations. XY is for locomotion transitions like stop, start and pivot."
      - q: "What does the Stop at End property do on the Distance Curve Modifier?"
        choices: ["Stops the animation from looping", "Removes the last keyframe", "Freezes the root bone at the end", "Declares the character stopped only on the last frame of the sequence"]
        answer_index: 3
        explain: "With Stop at End, the curve marks the character as stopped only on the final frame. Use it when the character could otherwise be counted as stopped earlier."
      - q: "Distance matching reads the curve at runtime. What compression does it need?"
        choices: ["A Bone Compression Settings asset with Least Destructive", "No compression at all", "A Curve Compression Settings asset with the Uniform Indexable codec", "The default Engine compression"]
        answer_index: 2
        explain: "The page says you must use a Uniform Indexable Curve Compression Settings asset instead of the default compression so the distance curve can be read at runtime."
      - q: "Which nodes go inside the Sequence Evaluator's On Update anim node function?"
        choices: ["Play Montage and Get Anim Instance", "Distance Match to Target and Convert to Sequence Evaluator", "Blend Poses by Bool and Inertialization", "Set Play Rate and Sequence Player"]
        answer_index: 1
        explain: "The workflow creates a Distance Match to Target node and converts the node reference with Convert to Sequence Evaluator inside the bound function."
      - q: "Which node advances a Sequence Evaluator by the distance the character travelled each frame?"
        choices: ["Advance Time By Distance Matching", "Set Playrate to Match Speed", "Distance Match to Target", "Sequence Player"]
        answer_index: 0
        explain: "Advance Time By Distance Matching moves the evaluator forward by the distance travelled. Set Playrate to Match Speed only scales play rate and assumes a constant speed."
    flavors:
      _default: {why: "Distance Matching makes landings and stops fit the world, so you do not need a new animation for every fall height or speed."}
      animation: {why: "It replaces guesswork in transition timing with a curve you author.", do: "Also generate an XY distance curve for a stop animation and note which Axis and Stop Speed Threshold you used."}

  - id: AQ72
    rank: 2
