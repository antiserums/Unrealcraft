    title: "Mirror Data Table: one animation, both sides"
    brief: "Mirroring flips an animation from left to right, so a step that starts with the left foot becomes a step that starts with the right foot. You then need to make only half of the animations. A Mirror Data Table is the asset that tells Unreal which left bone matches which right bone, and it can also swap notifies and sync markers. In this quest you create the table for the mannequin and mirror the pose in an Animation Blueprint with the Mirror node."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/mirroring-animation-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-blueprint-blend-nodes-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. In the Content Browser, click Add (+), then Animation, then Mirror Data Table. Pick the Skeleton of the mannequin, or of your own character, and name the asset MDT_Character."
      - "Open the table and check that Unreal filled in the left and right bones for you. Set Mirror Axis to X. Make sure that the central bones (pelvis, spine, neck and head) have the same bone in Name and in Mirrored Name. Add any rows that are missing."
      - "Add one row with Mirror Entry Type set to Sync Marker (or Animation Notify) for a left and right pair that you use, for example FootL and FootR."
      - "Duplicate the Animation Blueprint that the character uses (ABP_Unarmed in the current template, ABP_Manny or ABP_Quinn in older versions), name the copy ABP_Character and open it. Right-click the AnimGraph and add the Mirror node from the Mirroring category. Connect the locomotion pose to it. Create a bool variable named IsMirrored and connect it to the Mirror pin."
      - "On the Mirror node, set Blend Time on Mirror State Change to 0.2. Add an Inertialization node after the Mirror node, because the blend time needs it."
      - "Turn IsMirrored on and off in the preview. Check that the pose with the left foot forward becomes a pose with the right foot forward, and that the notifies still fire."
      - "Optional: in a custom Notify State Blueprint, use Is Triggered By Mirrored Animation with a Branch node to decide whether a Print String runs."
    done_when: "Send a screenshot of MDT_Character with the Sync Marker or Notify row visible, and a screenshot of the AnimGraph with the Mirror and Inertialization nodes."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Besides bones, what can a Mirror Data Table mirror?"
        choices: ["Only sockets", "Curves, sync markers and notifies", "Materials and morph targets", "Only root motion"]
        answer_index: 1
        explain: "The page says you can mirror Animation Sequences and also curves, sync markers and Notifies through the table."
      - q: "How do you create a Mirror Data Table?"
        choices: ["Right-click an Animation Sequence > Create > Mirror", "Project Settings > Engine > Animation > New Table", "Skeleton Editor > Tools > Mirror", "Add (+) > Animation > Mirror Data Table, then select the Skeleton"]
        answer_index: 3
        explain: "The asset is created from the Content Browser Add menu. A dialog asks which Skeleton to mirror."
      - q: "Which is NOT a Mirror Entry Type listed on the page?"
        choices: ["Socket", "Animation Notify", "Bone", "Sync Marker"]
        answer_index: 0
        explain: "The listed types are Bone, Animation Notify, Curve, Sync Marker and Custom. Socket is not one of them."
      - q: "How should central bones like pelvis and spine be entered in the table?"
        choices: ["Leave them out of the table", "Put spine in Name and pelvis in Mirrored Name", "Name and Mirrored Name should match", "Set Mirror Entry Type to Custom"]
        answer_index: 2
        explain: "Central bones must be in the table so their rotations flip across the axis. For them, both Name and Mirrored Name should be the same bone."
      - q: "What should Mirror Axis be in most cases?"
        choices: ["It must match the root bone's forward axis in the FBX", "Y", "Z", "X"]
        answer_index: 3
        explain: "The page says the mirror axis runs across the front of the character and in most cases this should be X."
      - q: "Your bones are named like finger_left_index1. Which Find Replace Method handles a modifier in the middle of the name?"
        choices: ["Prefix", "Regular Expression", "Suffix", "Any of them works the same"]
        answer_index: 1
        explain: "Prefix and Suffix only search at the start or end. The page shows a Regular Expression for names with _left_ in the middle."
      - q: "You set Blend Time on Mirror State Change on the Mirror node. What else is required?"
        choices: ["A Slot node before the Mirror node", "A second Mirror Data Table", "An Inertialization node after the Mirror node", "Root motion enabled on the sequence"]
        answer_index: 2
        explain: "The page says using the blend time requires an Inertialization node after the Mirror node."
      - q: "Inside a custom Notify Blueprint, how do you know if the notify came from a mirrored animation?"
        choices: ["Use the Is Triggered By Mirrored Animation node", "Check the Mirror bool on the Anim Instance", "Compare the bone name to the Mirror Data Table", "Read the Mirror Axis from Project Settings"]
        answer_index: 0
        explain: "The page shows Is Triggered By Mirrored Animation used in Received Notify to branch the logic."
    flavors:
      _default: {why: "Mirroring halves the number of animations you need to author and keep in sync."}
      animation: {why: "Sync markers and notifies stay correct when mirrored, so locomotion does not break.", do: "Change the default Mirror Find Replace Expressions in Project Settings to match your naming and screenshot the array."}

  - id: AQ73
    rank: 2
    difficulty: adept
