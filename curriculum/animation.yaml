    required: true
    capstone: true
    title: Control Rig kit
    brief: "A kit is a folder that holds everything another person needs to animate a character: the mesh, the skeleton, the rig, the retargeter and a set of animations, with a short guide. The real test is that someone can use it with only the guide. In this quest you build such a kit for a character that is not the Mannequin, test it in an empty project, and write down what the test showed."
    time_min: 480
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/modular-control-rigs-in-unreal-engine"
