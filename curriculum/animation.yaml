    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/modular-control-rigs-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/control-rig-in-unreal-engine"
    checklist:
      - "Enable the Control Rig Modules plugin (Edit > Plugins > Animation) and restart."
      - "Create CR_Modular_Hero (Animation > Control Rig > Control Rig, choose ModularRig). Set the Preview Mesh to your character."
      - "Drag the Spine module onto the unresolved socket. Then add Neck, both Legs, both Feet, Shoulders and Arms. Select all finger sockets at once and drop one Finger module."
      - "Delete the left arm modules. Rebuild them by selecting the right arm modules and using Mirror in the Module Hierarchy."
      - "Force one unresolved connector (rename a bone or remove a socket), then fix it with Use Selected or the hierarchy dropdown. Screenshot the red none before and the fix after."
