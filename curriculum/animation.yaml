        answer_index: 0
        explain: "Bind > Expose As Pin on the Sequence property, then Promote to Variable and make it public so the linking Blueprint can set it."
      - q: "Where in the AnimGraph context menu do you find both Linked Anim Graphs and templates?"
        choices: ["Blend Spaces", "Misc", "Linked Anim Blueprints", "Variables"]
        answer_index: 2
