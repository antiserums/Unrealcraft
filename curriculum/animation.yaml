quests:
  - id: AQ9
    rank: 0
    difficulty: novice
    track: animation
    subjects: [skeletal-mesh, animation-sequence, actors]
    required_for_majors: []
    taster_for_majors: [animation]
    adjacent_for: [cinematics, gameplay_design]
    required_spine: false
    elective: true
    title: Play an animation on a mesh
    time_min: 25
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/skeletal-mesh-actors-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/skeletal-mesh-assets-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-sequences-in-unreal-engine"
    checklist:
      - "Open a Third Person template project. In the Content Browser, find SKM_Quinn or SKM_Manny."
      - "Drag the Skeletal Mesh into the Level Viewport. This creates a Skeletal Mesh Actor. Move it to an empty spot."
      - "In the Details panel, find the Animation section. Set Animation Mode to Use Animation Asset."
      - "Set Anim to Play to one animation from Content/Characters/Mannequins/Animations (for example an idle or a run)."
      - "Turn on Looping. Press Play and watch the mesh animate in the level."
      - "Try one more thing: drag a different Material onto the actor. If it looks wrong, open the Material and enable Used with Skeletal Mesh."
    done_when: "A screenshot in Play mode of your Skeletal Mesh Actor in the middle of the animation, and a second screenshot of its Details panel showing Animation Mode and Anim to Play."
    xp: 30
    verify_type: screenshot
    quiz:
      - q: "What are the two basic ways to animate a Skeletal Mesh Actor?"
        choices: ["A Material and a Texture", "An Animation Blueprint, or a single Animation Asset", "A Static Mesh and a Physics Asset", "A Level Sequence only"]
        answer_index: 1
        explain: "You can use an Animation Blueprint to play and blend many animations, or use one Animation Asset to play a single sequence once or in a loop."
      - q: "What is the quickest way to place a Skeletal Mesh Actor in a level?"
        choices: ["Write a Blueprint that spawns it", "Import it again from FBX", "Drag it from the Content Browser into the Level Viewport", "Right-click the level and pick Add Skeleton"]
        answer_index: 2
        explain: "The docs say the quickest way is to drag the mesh from the Content Browser into the Level Viewport, then set its Transform."
      - q: "You drag a Material onto a Skeletal Mesh Actor and it does not render correctly. What must you enable in the Material?"
        choices: ["Two Sided", "Used with Static Lighting", "Cast Shadows", "Used with Skeletal Mesh"]
        answer_index: 3
        explain: "A Material needs the Used with Skeletal Mesh option enabled before it can be used on a Skeletal Mesh."
      - q: "Why does a Skeletal Mesh Actor not collide with objects like a Static Mesh does?"
        choices: ["It needs a Physics Asset made for it", "Skeletal Meshes can never collide", "It needs a Nav Mesh", "It collides only when it has an Animation Blueprint"]
        answer_index: 0
        explain: "Normal collision does not work with Skeletal Mesh Actors. They need a Physics Asset created for them (Create > Physics Asset > Create and Assign)."
      - q: "Which property do you set so a mesh plays one Animation Sequence without an Animation Blueprint?"
        choices: ["Anim Class", "Animation Mode set to Use Animation Asset, then Anim to Play", "Skeleton", "Preview Pose Asset"]
        answer_index: 1
        explain: "Set Animation Mode to Use Animation Asset and choose the sequence in Anim to Play. Anim Class is for Animation Blueprints."
    flavors:
      _default: {why: "Placing a mesh and playing one animation is the first step of every animation task."}
      animation: {why: "You will do this many times to check an animation in a real scene with real lighting.", do: "Also test the same animation with Looping off and note what pose the mesh stops in."}
      cinematics: {why: "A Skeletal Mesh Actor playing a loop is the simplest background character for a shot."}
      gameplay_design: {why: "Quick animation previews help you judge timing before any Blueprint work."}

  - id: AQ10
    rank: 0
    difficulty: novice
    track: animation
    subjects: [skeletal-mesh, skeleton, animation-sequence]
    required_for_majors: []
    taster_for_majors: [animation]
    adjacent_for: [tech_art, programming]
    required_spine: false
    elective: true
    title: "Skeleton, mesh, animation: three assets"
    time_min: 25
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/skeletons-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/skeletal-mesh-assets-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-sequences-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/skeletal-mesh-animation-system-in-unreal-engine"
    checklist:
      - "In a Third Person project, open Content/Characters/Mannequins. Find the Skeleton asset, one Skeletal Mesh (SKM_) and one Animation Sequence."
      - "Double-click the Skeleton asset. Look at the Skeleton Tree. Find the root bone, the pelvis and one hand bone."
      - "Open the Skeletal Mesh asset. In its Asset Details, find the Skeleton property. Note that it points to the same Skeleton asset."
      - "Open the Animation Sequence. In Asset Details, find the Skeleton property again."
      - "Write 3 short lines: what the Skeletal Mesh holds, what the Skeleton holds, what the Animation Sequence holds."
      - "Bonus: in the Skeleton Editor, open Window > Anim Notifies or Anim Curves and note that this data lives on the Skeleton."
    done_when: "A screenshot of the Skeleton Tree with the three bones named, plus your 3 lines that say what each asset holds and how they are linked."
    xp: 30
    verify_type: writeup
    quiz:
      - q: "What does a Skeletal Mesh asset contain?"
        choices: ["Only the animation keyframes", "The visual mesh and the skeleton bone data used to animate it", "Only Materials", "The Animation Blueprint logic"]
        answer_index: 1
        explain: "The Skeletal Mesh is the foundation asset. It holds the geometric model and the skeleton with bone data. The skeleton is also saved as a separate Skeleton asset."
      - q: "Why can one Animation Sequence be used on several different Skeletal Meshes?"
        choices: ["Because sequences store vertex positions", "Because Unreal converts them automatically each time", "Because each sequence is tied to a Skeleton, and any mesh that uses that Skeleton can play it", "Because they are tied to a Material"]
        answer_index: 2
        explain: "Animation Sequences are tied to a specific Skeleton. Meshes that share that Skeleton can share the animations."
      - q: "During FBX import you leave the Skeleton field empty. What happens?"
        choices: ["The import fails", "A new Skeleton asset is created from the imported character", "The mesh is imported as a Static Mesh", "The last used Skeleton is picked"]
        answer_index: 1
        explain: "Leaving the Skeleton field empty creates a new Skeleton asset based on the skinned character being imported."
      - q: "Two meshes want to share one Skeleton asset. What must be the same on both?"
        choices: ["Bone names and their hierarchy order", "The number of vertices", "The Material slots", "The animation length"]
        answer_index: 0
        explain: "Sharing works only if bone names and hierarchy order are consistent. The second mesh may add extra bones but cannot rename or reorder the existing ones."
      - q: "You add an Animation Notify inside an Animation Sequence. Where is that notify data stored?"
        choices: ["In the Level", "In the Skeletal Mesh", "In the Material", "On the Skeleton asset, as shared data"]
        answer_index: 3
        explain: "Skeletons store animation-specific data such as notifies. When you create one in a sequence, it is added to the Skeleton as shared data."
    flavors:
      _default: {why: "Most animation problems come from mixing up these three assets. Know which one holds what."}
      animation: {why: "Every retarget, notify and curve depends on the Skeleton. Understanding the link saves hours later.", do: "Open the Skeleton Editor toolbar and find the Retarget Manager. Read the Manage Compatible Skeletons section."}
      tech_art: {why: "Pipelines and naming rules for bones start here."}
      programming: {why: "Code that plays or swaps animations has to reference the right asset type."}

