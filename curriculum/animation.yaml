  - id: AQ79
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [animation, fbx, import, pipeline]
    required_spine: false
    required: false
    title: "FBX animation import: one clip per file"
    brief: "Animations made in another 3D program come into Unreal as FBX files. The import settings decide which Skeleton the animation belongs to, which frames are imported, and how many frames per second are used. Current versions of Unreal show these settings in the Interchange import window, and older versions show them in a window named FBX Import Options. In this quest you import one animation per file onto an existing Skeleton, and then import a second one with a limited frame range."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/importing-animations-using-fbx-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/fbx-animation-pipeline-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/importing-assets-using-interchange-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/fbx-import-options-reference-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Get an FBX file that holds one animation for the mannequin skeleton. If you use a DCC tool (Blender, Maya or 3ds Max), export one animation with the Animations checkbox enabled, export only the skeleton, and put one animation in each file. If you have no such tool, export one from Unreal: right-click an animation of the mannequin, choose Asset Actions, then Export, and save it as an FBX file."
      - "In the Content Browser, go to the folder where the animation should be stored. Click Import and pick the FBX file."
      - "The import window opens. In current versions it is named Interchange Pipeline Configuration, and older versions show FBX Import Options. Set Skeleton to your existing Skeleton. For the UE5 mannequins this is the asset named SK_Mannequin. Do not leave it empty, because then a new Skeleton is created. In the new window, also turn on Import Only Animations, which needs a Skeleton to be set."
      - "Open the Animations section. Set Animation Length to the option that imports only the range of frames that contain animation: it is named Animation Time in the new window and Animated Time in the old one. Let the frame rate come from the file: in the new window, leave Use 30Hz to Bake Bone Animation off and Custom Bone Animation Sample Rate at 0, and in the old window, turn off Use Default Sample Rate."
      - "Give the animation a name, for example A_Wave: type it into Asset Name in the Common section of the new window, or into Override Animation Name in the old one. Then click Import."
      - "Import a second animation, or the same file again with another name. This time set Animation Length to Set Range and type a Frame Import Range that covers only the first 20 frames. Compare the two Animation Sequences."
      - "Open each sequence in the Animation Sequence Editor. Check the number of frames, and check that the Skeleton is the one you chose."
    done_when: "Send one screenshot of the import window with your Skeleton, Animation Length and the name of the animation set, and one screenshot of the two imported Animation Sequences in the Content Browser. Add one sentence that says how many frames each one has."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You export an animation FBX with a different FBX version than the one Unreal expects. Which version does the Unreal FBX import pipeline use?"
        choices: ["FBX 2020.2", "FBX 2016", "FBX 2013", "FBX 2024"]
        answer_index: 0
        explain: "The docs say the Unreal Engine FBX import pipeline uses FBX 2020.2. Another version may cause incompatibilities."
      - q: "You import an animation FBX without a skeletal mesh. What do the docs say is required?"
        choices: ["A Physics Asset", "An existing Skeleton must be specified", "A Skeletal Mesh in the same folder", "A Material for the mesh"]
        answer_index: 1
        explain: "When you import an animation on its own, you must specify an existing Skeleton in the import window. In the Interchange window, Import Only Animations requires a Skeleton."
      - q: "You import a skeletal mesh and its animation in one FBX and leave the name field empty. What is the Animation Sequence named by default?"
        choices: ["After the FBX file name", "After the Skeletal Mesh name", "After the root bone of the skeleton", "AnimSequence_0"]
        answer_index: 2
        explain: "When animation is imported together with a Skeletal Mesh, the sequence is named after the root bone by default. You can rename it later."
      - q: "Your exported time range is longer than the actual keyframes in the file. Which Animation Length option imports only the frames that have animation?"
        choices: ["Source Timeline", "Set Range", "Animation Time (named Animated Time in the older FBX Import Options window)", "Frame Import Range"]
        answer_index: 2
        explain: "Animation Time imports the range of frames that contain animation. Source Timeline (Exported Time in the older window) uses the range defined in the file, and Set Range uses the frames you type into Frame Import Range."
      - q: "In the import window, Use 30Hz to Bake Bone Animation is turned on. What sample rate does the animation get?"
        choices: ["24 frames per second", "60 frames per second", "The rate stored in the FBX file", "30 frames per second"]
        answer_index: 3
        explain: "With this option on, all animation curves are sampled at 30 frames per second. The older FBX Import Options window has a similar option named Use Default Sample Rate. With the option off and Custom Bone Animation Sample Rate at 0, the importer finds the best rate from the file."
      - q: "Your animation has non-uniform scale on some bones. What does the docs say about importing scale?"
        choices: ["Scale is never imported for animations", "Scale imports without extra options, and the engine only saves scale that is not 1", "You must enable Import Scale Tracks first", "Scale is baked into the mesh instead"]
        answer_index: 1
        explain: "Unreal supports non-uniform scale animations. Scale imports automatically, and for memory reasons the engine only stores scale when it is not 1."
      - q: "You want a curves-only animation and do not want any bone transform data. Which option do you turn off?"
        choices: ["Import Bone Tracks", "Import Attributes as Curves or Animation Attribute", "Remove Redundant Keys", "Use T0 As Ref Pose"]
        answer_index: 0
        explain: "Import Bone Tracks imports the bone transform tracks found in the file. With it turned off they are left out, which is useful for curves-only animations. The older window writes the name as Import Bone Track."
      - q: "Many DCC tools such as Maya cannot save several animations in one FBX. Which tool does the docs name as one that can, so Unreal imports all of them from a single file?"
        choices: ["Blender", "Motion Builder", "Houdini", "ZBrush"]
        answer_index: 1
        explain: "The docs say that if you export from a supporting application such as Motion Builder, Unreal imports all the animations contained in that file."
    flavors:
      _default: {why: "Clean imports save hours later. Wrong skeleton, wrong range or wrong sample rate are the most common animation pipeline bugs."}
      animation: {why: "You will import hundreds of clips. Knowing the options means you fix problems at import instead of in the editor.", do: "Reimport one clip with Import Custom Attribute enabled and check if any curve appears in the sequence."}
      tech_art: {why: "Import settings are the first place a pipeline can be standardized for a whole team.", do: "Write a short note listing the import settings your team should always use for animation clips."}

  - id: AQ80
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [animation, skeleton, virtual-bones, ik, animation-blueprint]
    required_spine: false
    required: false
    title: "Virtual bones: stop the hands swimming"
    brief: "When an additive animation, such as breathing or a head look, plays on top of a base pose, the hands can drift away from the weapon or prop they hold. A Virtual Bone helps with this. It is an extra bone that follows a target bone, such as a hand, but is attached to a different parent, such as the root. It remembers where the hand was in the base animation, and IK can then pull the real hand back to that place. In this quest you add two Virtual Bones and use them to keep the hands steady."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/virtual-bones-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/skeleton-editor-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-blueprint-two-bone-ik-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blend-masks-and-blend-profiles-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open the Skeleton of the mannequin, or of your own character, in the Animation Editor. In the Skeleton Tree, right-click the root bone, choose Add Virtual Bone, and pick hand_l as the target. Do the same for hand_r."
      - "Preview an animation and watch the two VB bones follow the hands. Save the Skeleton."
      - "In the Options menu of the Skeleton Tree, choose Add Blend Mask. Name the mask BM_NoVirtualBones and set both virtual bones to 0.0."
      - "Duplicate the Animation Blueprint that the character uses (ABP_Unarmed in the current template, ABP_Manny or ABP_Quinn in older versions), name the copy ABP_Character, and set it as the Anim Class of the Mesh in BP_ThirdPersonCharacter. In its AnimGraph, add two Slot nodes: one set to DefaultSlot and a second one named AdditiveSlot, which you first add in the Anim Slot Manager. Connect them to an Apply Additive node."
      - "Put a Layered Blend per Bone node between AdditiveSlot and Apply Additive. Set its Blend Mode to Blend Mask and pick BM_NoVirtualBones."
      - "Add a Two Bone IK node for each arm. Set IKBone to the hand, set Effector Location Space to Bone Space, and set Effector Target to the matching virtual bone. Enable Take Rotation from Effector Space."
      - "Make an additive animation: duplicate an animation in which the upper body moves, such as the idle, and set Additive Anim Type to Local Space in its Asset Details. Create a montage from it, set its Slot track to AdditiveSlot, and play it from a key press in BP_ThirdPersonCharacter. Check that the hands stay where they are in the base pose."
    done_when: "Send one screenshot of the Skeleton Tree that shows both virtual bones under root, and one screenshot of the AnimGraph with the Slots, the Layered Blend per Bone node set to Blend Mask, and the Two Bone IK nodes. Add one sentence that says what changed when the additive animation was playing."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is a Virtual Bone, according to the docs?"
        choices: ["A bone that follows the transform of another bone, but in a different bone space", "A bone that is only used in the editor and removed at runtime", "A bone that is created by the physics asset", "A bone that stores animation curves"]
        answer_index: 0
        explain: "A Virtual Bone follows the transform of a target bone while being parented elsewhere, for example parented to root but following a hand."
      - q: "You create a Virtual Bone with parent root and target hand_l. What name does it get by default?"
        choices: ["hand_l_virtual", "VB root_hand_l", "IK_hand_l", "root.hand_l"]
        answer_index: 1
        explain: "Virtual Bones are named VB <Parent>_<Target> by default, so this one becomes VB root_hand_l."
      - q: "Why does the docs prefer Virtual Bones plus IK over a plain IK-only setup for hands on a weapon?"
        choices: ["IK-only setups do not work on the mannequin", "Virtual Bones are cheaper to evaluate", "An IK-only setup pins the hands in place, so you need extra logic to turn IK off during actions like reloading", "Virtual Bones replace the need for a Skeleton asset"]
        answer_index: 2
        explain: "Virtual Bones follow the target bone, so the base animation can still move the hands. IK-only would pin them and need extra on/off logic."
      - q: "Where do you create a Virtual Bone?"
        choices: ["In the Physics Asset Editor", "In the Animation Blueprint Class Settings", "In the Skeletal Mesh Reduction settings", "In the Animation Editor's Skeleton Tree, by right-clicking a bone and choosing Add Virtual Bone"]
        answer_index: 3
        explain: "You right-click the parent bone in the Skeleton Tree, select Add Virtual Bone and choose the target bone from the list."
      - q: "What is the purpose of the Blend Mask in the docs' setup?"
        choices: ["To exclude the Virtual Bones from the additive layer so they keep the base pose", "To mask the legs from IK", "To speed up the Apply Additive node", "To hide the Virtual Bones in the viewport"]
        answer_index: 0
        explain: "The Blend Mask sets the Virtual Bones to 0.0, so the additive animation does not move them. The IK then follows the base-layer position."
      - q: "On the Layered Blend per Bone node in this setup, what must Blend Mode be set to?"
        choices: ["Branch Filter", "Blend Mask", "Additive", "Mesh Space"]
        answer_index: 1
        explain: "The docs set Blend Mode to Blend Mask and then pick the mask that excludes the Virtual Bones."
      - q: "On the Two Bone IK node, which Effector Location Space does the docs use so the limb follows the Virtual Bone?"
        choices: ["World Space", "Component Space", "Bone Space", "Parent Bone Space"]
        answer_index: 2
        explain: "Effector Location Space is set to Bone Space with Effector Target set to the Virtual Bone. Joint Target Location Space is set to Parent Bone Space."
      - q: "What does the Joint Target Location on the Two Bone IK node define?"
        choices: ["The bone that receives the rotation", "The IK pole vector, a position behind the elbow", "The maximum stretch of the limb", "The socket that holds the weapon"]
        answer_index: 1
        explain: "Joint Target Location sets the pole vector. For the default mannequin the docs use X -25, Y -50, Z 0, but it depends on your character."
    flavors:
      _default: {why: "Hands that drift off a weapon or a prop are one of the most visible animation bugs. Virtual Bones fix this without killing the base animation."}
      animation: {why: "This is the standard way to hold props during additive and layered animation.", do: "Add a third virtual bone for a foot and test it with a Two Bone IK on the leg."}
      tech_art: {why: "Virtual Bones live on the Skeleton, so they are shared by every mesh that uses it.", do: "Document the naming rule for virtual bones your team should use."}

  - id: AQ81
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [animation, notifies, blueprint, tools]
    required_spine: false
    required: false
    title: "Custom notify classes and trigger rules"
    brief: "A notify is a marker on an animation timeline that runs some logic when the animation reaches it, for example a footstep sound. You can write your own notify as a Blueprint class, and then every animator on the team can place it on any animation. An AnimNotify fires once at one moment, and an AnimNotifyState lasts for a range of frames. In this quest you create one of each, place them on a walk animation, and try the settings that decide when a notify is allowed to fire."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-notifies-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-montage-editor-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. In the Content Browser, click Add, then Blueprint Class. Open All Classes and pick AnimNotify. Name the new class AN_Footstep."
      - "In AN_Footstep, use the Override dropdown to add Received Notify. In it, print the name of the owner of the Skeletal Mesh Component, and play a sound at the foot socket."
      - "Override Get Notify Name, so that the notify shows a clear label on the timeline."
      - "Create a second Blueprint with the parent class AnimNotifyState and name it ANS_Trail. Override Received Notify Begin, Received Notify Tick and Received Notify End, and put a Print String in each."
      - "Open a walk Animation Sequence of the mannequin. Add AN_Footstep at each moment where a foot lands, and add one ANS_Trail across the middle of the animation."
      - "Select one AN_Footstep on the timeline. In the Details panel, set Notify Trigger Chance to 0.5 and Trigger Weight Threshold to 0.5. Play in the editor and watch the printed output."
      - "Right-click the Notify area and open Manage Notifies. Use Find References on one Skeleton Notify to see where it is used."
    done_when: "Send one screenshot of the AN_Footstep graph with the Received Notify override, and one screenshot of the Animation Sequence timeline that shows both custom notifies. Add one sentence that says what Trigger Weight Threshold 0.5 changed."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You want a reusable Notify with your own Blueprint logic that fires once at a frame. Which parent class do you choose for the Blueprint?"
        choices: ["AnimNotify", "AnimNotifyState", "AnimInstance", "AnimMontage"]
        answer_index: 0
        explain: "AnimNotify is the parent class for single-event notifies. AnimNotifyState is for notifies that last over a duration."
      - q: "Which function runs continuously during a Notify State?"
        choices: ["Received Notify", "Received Notify Begin", "Received Notify Tick", "Get Notify Name"]
        answer_index: 2
        explain: "Notify States have Begin, Tick and End. Received Notify Tick executes throughout the duration of the state."
      - q: "What is the default Trigger Weight Threshold, and what does it mean?"
        choices: ["1.0, so the animation must be fully blended in", "0.00001, so the notify fires even when the animation is barely blended in", "0.5, so the animation must be at least half weight", "0, so the notify never fires while blending"]
        answer_index: 1
        explain: "The default of 0.00001 means the notify fires even at very low blend weight. Raise it to require the animation to be more fully blended in."
      - q: "Two walk animations are in a Sync Group. The follower animation has a footstep notify. By default, does it fire?"
        choices: ["Yes, all animations in a group fire their notifies", "Yes, but only on dedicated servers", "No, only the Sync Group leader fires notifies unless Trigger on Follower is enabled", "No, notifies never fire inside Sync Groups"]
        answer_index: 2
        explain: "By default only the leader animation executes its notifies. Enable Trigger on Follower to also fire them on followers."
      - q: "A Montage Notify must fire on exactly the right frame because gameplay branches on it. Which Montage Tick Type should you pick?"
        choices: ["Queued", "Branching Point", "Absolute", "Proportional"]
        answer_index: 1
        explain: "Branching Point is the precise, synchronous, higher-cost option. Queued is cheaper but can be a few frames off."
      - q: "What does Notify Trigger Chance control?"
        choices: ["How much blend weight is needed to fire", "The delay in seconds before the notify fires", "Which LOD levels can fire the notify", "The chance the notify executes, from 0 (never) to 1 (always)"]
        answer_index: 3
        explain: "Notify Trigger Chance is a probability. 0 means it never executes and 1 means it always executes."
      - q: "You create a new Skeleton Notify with Add Notify > New Notify. Which asset must you save afterwards?"
        choices: ["The Skeleton asset", "The Animation Blueprint", "The Physics Asset", "The Skeletal Mesh"]
        answer_index: 0
        explain: "Skeleton Notifies are stored on the Skeleton asset, so creating one edits the Skeleton and you must save it."
      - q: "You want to see every animation that uses a certain Skeleton Notify. Where is the fastest place to do that?"
        choices: ["The Compiler Results panel", "The Manage Notifies panel, right-click the notify and choose Find References", "The Reference Viewer of the Skeletal Mesh", "The Project Settings Animation section"]
        answer_index: 1
        explain: "The Animation Notifies panel (Manage Notifies) has Find References, which filters the Asset Browser to animations that use the notify."
    flavors:
      _default: {why: "Custom notify classes turn one-off Blueprint events into reusable tools that every animator on the team can drop on a timeline."}
      animation: {why: "Trigger rules decide if a notify fires while blending, on followers, or at low LOD. Wrong settings mean missing footsteps.", do: "Set Notify Filter Type to LOD on one notify and test with the mesh far from the camera."}
      gameplay_design: {why: "Notify States are the timing windows for hitboxes, invulnerability and input buffers.", do: "Make an ANS_HitWindow that prints Begin and End and place it on an attack clip."}

  - id: AQ82
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [animation, pose-assets, curves, animation-blueprint]
    required_spine: false
    required: false
    title: "Pose Driver: corrective poses from bone rotation"
    brief: "When a joint such as a shoulder rotates far, the mesh around it can lose its shape. A corrective pose repairs the shape for one specific rotation. The Pose Driver node reads the rotation of a bone and blends in the corrective poses that match it, and you do not need an extra rig or any C++ code. In this quest you make three shoulder poses, store them in a Pose Asset, and let the rotation of the upper arm drive them."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/pose-driver-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-pose-assets-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/pose-blender-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make a short Animation Sequence with 3 poses for one shoulder: arm down, arm forward and arm up. One way: duplicate the idle animation of the mannequin, open the copy, select upperarm_l in the Skeleton Tree, and press Key in the toolbar at the first frame. Then go to a frame in the middle, rotate the bone so that the arm points forward, and press Key, and do the same at the last frame with the arm up. Right-click the sequence and create a Pose Asset named PA_ShoulderFix."
      - "Duplicate the Animation Blueprint that the character uses (ABP_Unarmed in the current template, ABP_Manny or ABP_Quinn in older versions) and open the copy. Add a Pose Driver node after the locomotion pose. Set its Pose Asset to PA_ShoulderFix."
      - "Add upperarm_l as a Source Bone, the bone whose movement the node reads. Set Drive Source to Rotation and Drive Output to Drive Poses."
      - "In the Tool dropdown, choose Copy All from PoseAsset to create the pose targets. Then choose Auto Scale."
      - "Set Solver Type to Interpolative and enable Eval from Ref Pose. Compile, and rotate the arm in the preview to watch the poses blend."
      - "Hold the Solo button on one Pose Target to preview only that pose. Double-click the button to lock it, and then unlock it again."
      - "Switch Solver Type to Additive and compare the result. Note which solver is smoother with your 3 targets."
    done_when: "Send one screenshot of the Details panel of the Pose Driver with Source Bones, Pose Targets and Solver Type visible, and one screenshot of the preview viewport with the arm raised and the driven pose visible. Add one sentence that compares Additive and Interpolative."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the difference between the Pose Driver node and the Pose Blender node?"
        choices: ["Pose Driver drives poses from bone motion; Pose Blender blends poses using curve values", "Pose Driver works only on faces", "Pose Blender is the C++ version of Pose Driver", "There is no difference, both drive poses from bones"]
        answer_index: 0
        explain: "Pose Blender and Pose by Name blend Pose Assets using curves. Pose Driver uses the motion of a source bone to drive the poses."
      - q: "You already added three Pose Targets by hand. Then you choose Copy All from PoseAsset in the Tool menu. What happens?"
        choices: ["The three targets are kept and new ones are added after them", "Nothing, the tool only works on an empty list", "The existing targets are overwritten by the poses in the Pose Asset", "The Pose Asset is duplicated"]
        answer_index: 2
        explain: "The docs say Copy All from PoseAsset creates targets from the Pose Asset and overwrites any existing pose targets."
      - q: "What does the Auto Scale tool do?"
        choices: ["Scales the character mesh", "Sets each target's Scale based on the distance to the nearest neighbor target", "Normalizes all weights to one", "Doubles the radius of every target"]
        answer_index: 1
        explain: "Auto Scale automatically sets all Scale factors based on distance to the nearest neighbor pose target."
      - q: "You have few targets and want smooth blending without a normalization step. Which Solver Type does the docs recommend?"
        choices: ["Additive", "Linear", "Quaternion", "Interpolative"]
        answer_index: 3
        explain: "The Interpolative solver gives smoother results with fewer targets and needs no normalization, but costs more. Additive is faster but needs more targets and normalization."
      - q: "How many Source Bones does a Pose Driver need at minimum?"
        choices: ["None, it can run from curves only", "At least one", "Exactly two", "One per Pose Target"]
        answer_index: 1
        explain: "Many source bones can be added, but at least one is required."
      - q: "You set Distance Method to Swing Angle. What does the docs recommend to enable so the twist is measured from the reference pose?"
        choices: ["Eval from Ref Pose", "Only Drive Selected Bones", "Automatic Radius", "Hidden"]
        answer_index: 0
        explain: "Eval from Ref Pose evaluates the source bone relative to its Reference Pose. The docs recommend it when using Swing or Twist Angle."
      - q: "Eval Space Bone is set and Eval from Ref Pose is also enabled. Which one is used?"
        choices: ["Both are combined", "Eval from Ref Pose wins", "Eval Space Bone is used and Eval from Ref Pose is ignored", "The node shows a compile error"]
        answer_index: 2
        explain: "When Eval Space Bone is set, Eval from Ref Pose is ignored."
      - q: "You want the Pose Driver to output animation curves instead of poses, for example to drive a material. Which property do you change?"
        choices: ["Drive Source to Translation", "Drive Output to Drive Curves", "Solver Type to Additive", "Normalize Method to No Normalization"]
        answer_index: 1
        explain: "Drive Output selects Drive Poses (from the Pose Asset) or Drive Curves. For curve targets you also enable the Curve property on each target."
    flavors:
      _default: {why: "Pose Driver is the engine's built-in way to add corrective shapes that react to joint rotation, with no extra rig or C++."}
      animation: {why: "Shoulders, elbows and hips look broken in extreme poses. Corrective poses driven by rotation fix that at runtime.", do: "Add a fourth target for the arm behind the back and re-run Auto Scale."}
      tech_art: {why: "Pose Driver can also drive curves, which means it can drive material or morph parameters from bone rotation.", do: "Set Drive Output to Drive Curves and read one curve with Get Curve Value in the Event Graph."}

  - id: AQ83
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [animation, montage, blending, slots]
    required_spine: false
    required: false
    title: "Montage blend settings and multi-slot montages"
    brief: "A montage does not start and stop in an instant. It blends in from the current pose and blends out again at the end, and the length of these blends decides if an action feels quick or slow. A montage can also have more than one Slot track, so the same montage can play a different animation depending on the state of the character, for example standing or lying down. In this quest you tune the blend settings of a montage and add a second Slot track to it."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-montage-editor-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-montage-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blend-masks-and-blend-profiles-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-slots-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a reload montage of your own, or create a montage named AM_Reload from any Animation Sequence of the mannequin that stands in for a reload: right-click it and choose Create, then Create AnimMontage."
      - "In Asset Details, set the Blend Time of Blend In to 0.1 and the Blend Time of Blend Out to 0.4. Set Blend Out Trigger Time to 0.3, and test the difference in Play In Editor."
      - "Turn off Enable Auto Blend Out and play the montage. Note what the character does at the end. Then turn the setting on again."
      - "Open Window > Anim Slot Manager and add a Slot named Prone to the DefaultGroup. Then right-click the Slot track of the montage and choose New Slot. Set the new track to DefaultGroup.Prone."
      - "Drag a second, different Animation Sequence into the new track. It stands in for a reload done lying down. Make both tracks the same length."
      - "In BP_ThirdPersonCharacter, add a key press event that calls Play Montage with AM_Reload. Add a bool variable named IsProne to the character. In the AnimGraph of the Animation Blueprint that the character uses, add a Slot node for each of the two slots and use a Blend Poses by bool node on IsProne to choose which Slot node is shown."
      - "Set In Play Rate to 2.0 on one of the calls, and check that the montage plays at double speed."
    done_when: "Send one screenshot of the Asset Details of the montage with your Blend In, Blend Out and Blend Out Trigger Time values, and one screenshot of the montage timeline with two Slot tracks. Add one sentence that says what happened when Enable Auto Blend Out was off."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Blend Out Trigger Time is set to a value less than 0. When does the blend out finish?"
        choices: ["As the montage ends, using the Blend Out Time", "Halfway through the montage", "It never blends out", "One second before the end"]
        answer_index: 0
        explain: "A value below 0 means BlendOutTime is used so the blend out finishes as the montage ends. A value of 0 or more triggers the blend out at Montage End minus the trigger time."
      - q: "You disable Enable Auto Blend Out. What happens when the montage reaches its end?"
        choices: ["The montage restarts", "No blend happens and the final pose stays until something stops it", "The montage blends into the Default section", "The AnimGraph resets to the reference pose"]
        answer_index: 1
        explain: "With Auto Blend Out off, the last pose holds until the montage is stopped explicitly by another function."
      - q: "Which three settings does the Blend In property contain?"
        choices: ["Blend Time, Blend Option, Custom Curve", "Blend Time, Blend Mask, Slot Group", "Play Rate, Start Section, Custom Curve", "Blend Time, Sync Group, Hysteresis"]
        answer_index: 0
        explain: "Blend In and Blend Out each have a Blend Time, a Blend Option (the blend method) and an optional Custom Curve asset."
      - q: "You add a second Slot track to a montage. What rule does the docs give about Slot Groups?"
        choices: ["Each track must use a different Slot Group", "Only DefaultGroup can be used in montages", "All sequence tracks must use Slots from the same Slot Group", "Slot Groups do not matter for montages"]
        answer_index: 2
        explain: "All sequence tracks in one montage must use Slots from the same Slot Group. The docs also advise keeping track lengths equal."
      - q: "You choose Duplicate Slot on a track. Why must you change the Slot on one of the copies?"
        choices: ["Because duplicated tracks lose their animations", "Because two tracks cannot occupy the same Slot on the same Skeleton", "Because the montage would double in length", "Because sections only work on one track"]
        answer_index: 1
        explain: "Two or more tracks cannot occupy the same Slot on the same Skeleton, so one duplicate must be given a new Slot."
      - q: "When is a Time Stretch Curve actually used during playback?"
        choices: ["Always, on every montage", "Only when the montage has a non-default play rate", "Only in the editor preview", "Only when Auto Blend Out is disabled"]
        answer_index: 1
        explain: "The docs say a Time Stretch Curve is only referenced when the montage plays at a non-default play rate."
      - q: "You use linked animation layers and a montage played on the main instance is being overridden by a layer. Which Class Defaults property helps?"
        choices: ["Warn About Blueprint Usage", "Use Multi Threaded Animation Update", "Use Main Instance Montage Evaluation Data", "Root Motion Mode"]
        answer_index: 2
        explain: "Use Main Instance Montage Evaluation Data makes linked instances use the main instance's montage data, so the montage plays on the linked layer too."
      - q: "On Play Anim Montage you set In Play Rate to 0.5. What happens?"
        choices: ["The montage plays at half speed", "The montage plays at double speed", "Only the first half of the montage plays", "The blend in time is halved"]
        answer_index: 0
        explain: "In Play Rate is a factor. 2 means double speed and 0.5 means half speed."
    flavors:
      _default: {why: "Blend times and trigger times are what make a montage feel snappy or sluggish. They are a few numbers, but they decide game feel."}
      animation: {why: "Multi-slot montages let one asset cover standing, crouching and prone versions of the same action.", do: "Assign a Blend Profile In that blends the arms faster than the spine and compare."}
      gameplay_design: {why: "Blend Out Trigger Time is the difference between a reload that feels responsive and one that feels late.", do: "Write down the blend values you chose and why, for one attack and one reload."}

  - id: AQ84
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [animation, animation-blueprint, performance, optimization]
    required_spine: false
    required: false
    title: "Cheaper crowds: update rates and fixed bounds"
    brief: "In a scene with many characters, animation is often the largest cost on the Game Thread, the main line of work of the game. Some of that cost can be saved on the Skeletal Mesh Component, without changing the Animation Blueprint. Update Rate Optimizations, or URO, update the animation of far away characters less often, and fixed bounds stop Unreal from recalculating the size of each character on every frame. In this quest you build a small crowd, turn on these options, and measure what they change."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-optimization-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-budget-allocator-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-get-animation-variables-in-animation-blueprints-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/graphing-in-animation-blueprints-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make a Character Blueprint named BP_CrowdDummy whose Mesh uses SKM_Manny_Simple with the Anim Class ABP_Unarmed. Place 20 or more copies in a level, in rows that lead away from the Player Start. Press Play, type stat unit in the console, and write down the Game time."
      - "Open BP_CrowdDummy and select the Mesh component. In the Details panel, find the Optimization section and turn on Enable Update Rate Optimizations. In the same panel, turn on Display Debug Update Rate Optimizations, which shows the update rate of each character on screen while the game runs."
      - "Press Play. Stand close to the crowd, then walk far away from it, and watch how the debug display on the characters changes with distance. Take a screenshot at each distance."
      - "On the same Mesh component, search the Details panel for Component Use Fixed Skel Bounds and turn it on. The component now skips the Physics Asset and uses fixed bounds from the Skeletal Mesh, so the bounds are not calculated again on every frame. To see the bounds, open the Show menu of the viewport, then Advanced, then Bounds, and compare with the option on and off."
      - "Open the walk or run animation that the crowd plays and look at its Notifies track. Notifies run on the game thread after the animation work is done, so write one line that says which of them are Blueprint notifies and why the documentation advises notifies that are not Blueprint based."
      - "Run stat unit again with all options on and compare the Game time with your first number. Read the part about Update Rate Optimizations on the documentation page linked on this quest, and note which plugin it recommends in place of URO for controlling how often Animation Blueprints are evaluated."
    done_when: "Send one screenshot in Play mode with the URO debug display visible on characters that are near and far, and one screenshot of the Details panel of the Mesh component with the three options turned on. Add the stat unit Game time before and after, and one sentence that says what the URO debug display showed at a distance."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "According to the docs, which part of an Animation Blueprint is usually the most expensive?"
        choices: ["The AnimGraph", "The Event Graph logic", "The State Machine transitions", "The Slot nodes"]
        answer_index: 1
        explain: "The Event Graph runs each tick, sequentially on the Game Thread, and is generally the most expensive part. The docs advise reducing it as much as possible."
      - q: "Where do you turn on Update Rate Optimizations for a character?"
        choices: ["In Project Settings, under Rendering", "On the Skeletal Mesh Component, in the Optimization section of its Details panel, with Enable Update Rate Optimizations", "In the Class Settings of the Animation Blueprint", "In the Skeleton asset"]
        answer_index: 1
        explain: "URO is a setting of each Skeletal Mesh Component. You find Enable Update Rate Optimizations in the Optimization section of its Details panel."
      - q: "What does Component Use Fixed Skel Bounds do?"
        choices: ["It locks the mesh to its most detailed LOD", "It stops the animation when the character is hidden", "It skips the Physics Asset and uses fixed bounds from the Skeletal Mesh, so the bounds are not recalculated every frame", "It makes the collision capsule static"]
        answer_index: 2
        explain: "With this option on, the component uses the fixed bounds defined in the Skeletal Mesh. The bounding volume used for culling is then not recalculated on each frame, which improves performance."
      - q: "Which property shows the URO rate of each character on screen while the game runs?"
        choices: ["Display Debug Update Rate Optimizations", "Warn About Blueprint Usage", "Enable Lazy Evaluation", "Component Use Fixed Skel Bounds"]
        answer_index: 0
        explain: "Display Debug Update Rate Optimizations is a property of the Skeletal Mesh Component. It shows the update rate on screen during the simulation."
      - q: "Which plugin do the docs recommend in place of URO for controlling how often Animation Blueprints are evaluated?"
        choices: ["Pose Search", "Animation Budget Allocator", "Motion Warping", "Control Rig Modules"]
        answer_index: 1
        explain: "The page recommends the Animation Budget Allocator plugin for controlling the tick rate of Animation Blueprint evaluation."
      - q: "Animation Notifies run on the game thread after the worker threads have finished. What do the docs advise for them?"
        choices: ["Use Blueprint notifies wherever you can", "Store every notify on the Skeleton", "Turn all notifies off at a distance", "Make them non-Blueprint based, to avoid calls into the Blueprint Virtual Machine"]
        answer_index: 3
        explain: "Notifies are part of the work done on the main thread after the parallel animation task. The docs say they should not be Blueprint based, because each one would call into the Blueprint Virtual Machine."
      - q: "Your character uses root motion for movement. What do the docs say about parallel animation updates?"
        choices: ["They are faster with root motion", "The parallel update cannot happen because character movement is not multi-threaded", "Root motion has no effect on threading", "Root motion forces the AnimGraph onto a worker thread"]
        answer_index: 1
        explain: "If root motion is required for character movement, the update cannot run in parallel, because character movement runs on the game thread."
      - q: "What update rate do the docs suggest as a target when using Update Rate Optimizations at distance?"
        choices: ["60Hz with interpolation on", "30Hz with interpolation on", "15Hz and under, with interpolation disabled", "1Hz for all characters"]
        answer_index: 2
        explain: "The docs recommend targeting 15Hz and under at appropriate distances and disabling interpolation."
    flavors:
      _default: {why: "Animation is often the biggest game-thread cost in a crowd scene. Thread-safe updates and Fast Path move that work off the critical path."}
      animation: {why: "A clean AnimBP is one that other people can profile and trust. This quest teaches the two rules that keep it fast.", do: "Enable Component Use Fixed Skel Bounds on a background character and note what the docs say it skips."}
      programming: {why: "Property Access and thread-safe functions are the same ideas as pull-based data flow in C++ anim instances.", do: "List which of your Event Graph nodes cannot be moved to a thread safe function and why."}

  - id: AQ85
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [animation, skeletal-mesh, lods, optimization]
    required_spine: false
    required: false
    title: "Generate skeletal mesh LODs with the reduction tool"
    brief: "LOD means Level of Detail. A mesh can have several versions, and Unreal shows a simpler version with fewer triangles when the character is far from the camera. Skeletal meshes are expensive to draw, so LODs are the first and cheapest way to make a crowd run faster. Unreal can create these simpler versions for you. In this quest you generate four LODs for a character, protect important areas such as the head and the hands, and remove finger bones on the lowest LOD."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/skeletal-mesh-lods-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-and-using-lods-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/importing-skeletal-mesh-lods-using-fbx-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open Edit > Project Settings and search for Skeletal Mesh Reduction. Make sure that the plugin property is set to SkeletalMeshReduction."
      - "Duplicate SKM_Manny_Simple and name the copy SK_Character, or use the Skeletal Mesh of your own character. Open it. In Asset Details, under LOD Settings, set Number of LODs to 4 and click Apply Changes. Save the LODSettings asset next to the mesh."
      - "Use the LOD menu of the viewport to look at LOD 1, LOD 2 and LOD 3. Write down the triangle count of each one."
      - "In LOD Picker, enable Custom so that the sections of all LODs are visible. In LOD 3, add the head bone and both hand bones to Bones to Prioritize, set Weight of Prioritization to 5000, and click Regenerate LOD."
      - "In the Reduction Settings of LOD 2, change Termination Criterion to Max Triangles and set a triangle count. Regenerate the LOD and compare."
      - "In the LOD Info of LOD 3, add the finger bones to Bones to Remove and click Regenerate LOD. Check the icons of those bones in the Skeleton Tree."
      - "Set LOD Hysteresis on LOD 1. Move the camera back and forth, and check for LOD popping, a sudden visible switch between two versions."
    done_when: "Send one screenshot of the viewport at LOD 3 with the LOD stats visible, and one screenshot of the Asset Details of LOD 3 that shows Bones to Prioritize and Bones to Remove filled in. Add one sentence that lists the triangle counts for LOD 0 to 3."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Before generating LODs, what must be set in Project Settings?"
        choices: ["Nanite must be enabled for skeletal meshes", "Skeletal Mesh Reduction Plugin must be set to SkeletalMeshReduction", "Skin Cache must be Disabled", "The default LOD group must be Character"]
        answer_index: 1
        explain: "The docs say to check Project Settings > Skeletal Mesh Reduction Simplification and set the Skeletal Mesh Reduction Plugin property to SkeletalMeshReduction."
      - q: "You imported LODs from your DCC tool, then click Regenerate LOD on one of them in Unreal. What happens?"
        choices: ["The imported LOD is kept and a new one is added", "The tool refuses because the LOD was imported", "The regenerated LOD overwrites the imported LOD", "Only the materials are regenerated"]
        answer_index: 2
        explain: "Any regenerated LOD overwrites the existing LOD, even LODs imported from an external source."
      - q: "The reduction removed too much detail from the face. Which two properties does the docs use to protect it?"
        choices: ["Bones to Prioritize and a high Weight of Prioritization, such as 5000", "Bones to Remove and LOD Hysteresis", "Lock Mesh Edges and Skin Cache Usage", "Bake Pose and Volumetric Correction"]
        answer_index: 0
        explain: "Add the face bones to Bones to Prioritize, set Weight of Prioritization high (the docs use 5,000) and Regenerate LOD."
      - q: "You want to see the properties of several LODs at the same time in Asset Details. What do you do?"
        choices: ["Open the mesh twice", "Enable Custom in the LOD Picker and toggle the LODs you want", "Set Number of LODs to 1", "Use the viewport LOD menu"]
        answer_index: 1
        explain: "LOD Picker shows one LOD by default. Enable Custom, then use Advanced to choose which LOD property sets are visible."
      - q: "Memory targets matter most for your project. Which Termination Criterion does the docs suggest fits that better?"
        choices: ["Triangles, because memory follows triangle count", "Vertices, because the memory cost is related to vertex count", "First Percent Simplified, because it is the default", "Max Triangles, because it is the fastest"]
        answer_index: 1
        explain: "The docs say memory cost is related to the number of vertices, while some rendering costs follow the number of triangles."
      - q: "What happens with Volumetric Correction set to 0?"
        choices: ["The LOD keeps the exact volume of the source", "The simplification flattens and deflates rounded surfaces", "The LOD becomes larger than the source", "The setting is ignored"]
        answer_index: 1
        explain: "A value of zero flattens and deflates rounded surfaces. The default of 1.0 usually gives the best results."
      - q: "You add bones to Bones to Remove for LOD 3 and regenerate. How does the Skeleton Tree show those bones on that LOD?"
        choices: ["They disappear from the tree", "They are shown in red", "They are still listed but with a dot icon instead of a bone icon", "They are moved under the root"]
        answer_index: 2
        explain: "Removed bones stay visible in the LOD's Skeleton Tree but get a dot icon rather than the usual bone icon."
      - q: "What does LOD Hysteresis do, and when is it used?"
        choices: ["It delays the LOD switch to avoid flickering, and only applies when going from a complex to a simple LOD", "It blends two LODs together over time", "It changes the screen size threshold for all LODs", "It only applies when going from a simple to a complex LOD"]
        answer_index: 0
        explain: "LOD Hysteresis adds lag when crossing a threshold to avoid flickering, and it is only taken into account when moving from complex to simple."
    flavors:
      _default: {why: "Skeletal meshes are the most expensive things on screen in a crowd. LODs are the first and cheapest fix."}
      animation: {why: "LODs also remove bones, which changes how your animation looks far away. You need to control what is dropped.", do: "Use Bake Pose on LOD 3 with a single frame so removed finger bones hold a natural hand shape."}
      tech_art: {why: "The LODSettings asset can be shared across meshes to standardize reduction across a whole cast.", do: "Reuse the same LODSettings asset on a second skeletal mesh and confirm the counts."}

  - id: AQ86
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [animation, data-validation, editor-tools, blueprint]
    required_spine: false
    required: false
    title: "Validate animation assets with a Blueprint validator"
    brief: "A validator is a small check that Unreal runs on assets, for example when you save them. It can find wrong names or missing data before they cause problems for the rest of the team. You can write your own validator as a Blueprint. In this quest you write one that checks that the name of every Animation Sequence starts with A_, and you run it on one asset and on a whole folder."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/data-validation-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open a project made from the Third Person template, or create one. Open Edit > Plugins and confirm that the Data Validation plugin is enabled."
      - "In the Content Browser, click Add, then Blueprint Class. Search All Classes for EditorValidatorBase, pick it, and name the new class EUV_AnimNaming."
      - "Override the function Can Validate Asset. Make it return true only when the asset is an Animation Sequence."
      - "Override the function Validate Loaded Asset. If the name of the asset starts with A_, call Asset Passes. If it does not, call Asset Fails with a message such as Animation names must start with A_."
      - "Compile and save. Restart the editor, because validators are found when the editor starts."
      - "Make a folder named Content/ValidateTest and copy five animations of the mannequin into it. Rename one of them so that its name starts with A_. Right-click one of the others and choose Asset Actions, then Validate Assets. Read the result in the Message Log."
      - "Right-click the ValidateTest folder and choose Validate Assets in Folder to check everything at once. Fix the names until the whole folder passes."
    done_when: "Send one screenshot of the Validate Loaded Asset graph of EUV_AnimNaming with both Asset Passes and Asset Fails, and one screenshot of the Message Log that shows a failed animation. Add one sentence that says how many assets failed in your folder the first time."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which of these is NOT listed by the docs as a common Data Validation use case?"
        choices: ["Checking naming conventions", "Enforcing space and performance budgets", "Compiling shaders faster", "Catching bad dependencies"]
        answer_index: 2
        explain: "The docs list naming conventions, space and performance budgets, and dependency checks. Shader compilation is not a validation task."
      - q: "You want to validate one asset and everything it depends on. Which menu item do you use?"
        choices: ["Asset Actions > Validate Assets", "Asset Actions > Validate Assets and Dependencies", "Tools > Validate Data...", "Validate Assets in Folder"]
        answer_index: 1
        explain: "Validate Assets checks only the selected assets. Validate Assets and Dependencies also checks what they depend on. Tools > Validate Data validates the whole project."
      - q: "A build machine should validate the project without opening the editor UI. Which command does the docs give?"
        choices: ["UnrealEditor-Cmd.exe <PROJECT>.uproject -run=DataValidation", "UnrealEditor.exe -validate", "UnrealPak.exe -check", "UnrealEditor-Cmd.exe -run=Cook -validate"]
        answer_index: 0
        explain: "The DataValidation commandlet runs from the command line, which is useful for continuous integration."
      - q: "Which two functions are the key overrides in a UEditorValidatorBase validator?"
        choices: ["Begin Play and Tick", "Is Data Valid and Post Load", "Can Validate Asset and Validate Loaded Asset", "Construct and Validate"]
        answer_index: 2
        explain: "Can Validate Asset decides if this validator applies to an asset. Validate Loaded Asset does the actual check."
      - q: "What must Validate Loaded Asset do on every execution path?"
        choices: ["Return a boolean", "Call Asset Passes or Asset Fails", "Print to the Output Log", "Save the asset"]
        answer_index: 1
        explain: "The docs say ValidateLoadedAsset must call AssetPasses or AssetFails for each of its execution paths."
      - q: "You wrote a validator in Python. What extra step does it need that a Blueprint validator does not?"
        choices: ["It must be compiled with C++", "It must be placed in the Plugins folder", "It must override IsDataValid instead", "It must register itself with the Editor Validator Subsystem using AddValidator"]
        answer_index: 3
        explain: "C++ and Blueprint validators are discovered automatically on editor startup. Python validators must call AddValidator on UEditorValidatorSubsystem."
      - q: "When does validation run by default, apart from the menu options and CIS?"
        choices: ["On asset save", "On every editor tick", "On Play In Editor start", "Only on cook"]
        answer_index: 0
        explain: "Both types of validation run in CIS, on asset save (enabled by default) and through the editor menu options."
      - q: "A validator fails an asset in the editor. Where do the messages appear?"
        choices: ["In the Content Browser tooltip", "In the Message Log", "In a modal error dialog", "In the World Outliner"]
        answer_index: 1
        explain: "When validation fails in the editor, messages are shown in the Message Log. In CIS they go to the console."
    flavors:
      _default: {why: "A validator catches broken names and missing data before they reach the rest of the team. It runs on save, so mistakes are found right away."}
      animation: {why: "Animation folders grow fast. A naming validator keeps hundreds of clips findable.", do: "Add a second rule that fails any Animation Sequence whose Skeleton is not your project Skeleton."}
      tech_art: {why: "Validators are cheap editor tools that scale to the whole project and to the build farm.", do: "Override Is Enabled so the validator can be switched off from its Details panel."}
