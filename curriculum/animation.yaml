    title: A shared Control Rig function library
    brief: "A function is a group of nodes saved under one name, so you can use it again without building it again. In Control Rig, a function marked as Public can be used by every other Control Rig in the project. A team usually keeps such functions in one rig asset that has no mesh, called a function library. In this quest you create a library, write one function that shows or hides controls, and use it in a character rig."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/control-rig-function-libraries-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/control-rig-in-unreal-engine"
    extra_urls:
