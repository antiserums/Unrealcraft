    title: "Export a sequence to FBX and bring edits back"
    brief: "Animators often polish animation in another 3D program, called a DCC (digital content creation tool), such as Blender or Maya. FBX is the file format that carries animation between Unreal and those programs. Sequencer can export a sequence to FBX and import the edited keys back, so the Unreal scene stays the main version of your work. In this quest you export a sequence, change it in another program, and import the changes."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/import-and-export-cinematic-fbx-animations-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/sequencer-cinematic-toolbar-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/fk-control-rig-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open a Level Sequence in which a prop has keys on its Transform track. To make one, place a cube named SM_Crate, create a Level Sequence named LS_KeyDrill, add the cube, and set three keys with the S key at different frames and positions. It must be a source Level Sequence, not a shot inside a master sequence. Select the crate actor and use Actions, then Export... Read every option in the FBX Export Options window, and then export with the default settings."
      - "Export again with nothing selected. This time the whole sequence is exported. Compare the sizes of the two files."
      - "Open the FBX file in any DCC or FBX viewer you have. Blender is free and works well. Set the time rate of the DCC to match the frame rate of the sequence. Move the keys of the crate, and then export the FBX with Z as the up axis."
      - "Back in Sequencer, right-click the crate track and choose Import. Look at the options Force Front XAxis and Create Cameras in the Import FBX window, and then import. Confirm that the keys changed."
      - "Also try the import from the Actions menu with nothing selected. Note how Unreal matches objects by their names."
      - "For a sequence with a character, for example one where you dragged SKM_Manny_Simple into the level and gave it an animation clip, right-click the Skeletal Mesh track and use Bake Animation Sequence to make an asset named AS_Export_Test. Open it in the Animation Sequence editor."
    done_when: "Send a short text of 6 to 10 lines that covers the FBX Export options you used, the DCC you edited in and its time setting, what changed after the import, and one warning from the documentation page that applies to your sequence. Attach one screenshot of the keys after you imported them again."
    xp: 60
    verify_type: writeup
    quiz:
      - q: "What does importing an FBX into Sequencer do?"
        choices: ["Creates new actors and imports animation", "Replaces the level", "Imports materials and meshes", "Imports only animation; it does not create new objects"]
        answer_index: 3
        explain: "The page says importing FBX files only imports animation and will not create new objects."
      - q: "Which sequences does the page say FBX export/import does NOT work with?"
        choices: ["Sequences with cameras", "Sequences longer than 10 seconds", "Master Sequences, shots within a Master, and Subscenes", "Sequences with Skeletal Meshes"]
        answer_index: 2
        explain: "Export/Import does not work with Master Sequences, shots within a Master, or Subscenes. Export from a source Level Sequence."
      - q: "Before importing the FBX in your DCC, what should you match to Unreal?"
        choices: ["The project name", "The time settings or frame rate of the scene", "The level name", "The unit scale to inches"]
        answer_index: 1
        explain: "Make sure the time settings in the third-party application match the time frame used in Unreal so the scene is not resampled."
      - q: "What does Map Skeletal Motion to Root do on export?"
        choices: ["Maps the Skeletal Actor motion to the root bone of the skeleton", "Removes root motion", "Bakes the camera to the root", "Exports only the root bone"]
        answer_index: 0
        explain: "If enabled, Map Skeletal Motion to Root maps the Skeletal Actor motion to the root bone of the Skeleton."
      - q: "Export Local Time is checked by default. When would you uncheck it?"
        choices: ["Never; it is required", "When you want to export a shot by Master Sequence time", "When exporting cameras", "When the DCC uses 30 fps"]
        answer_index: 1
        explain: "The default is Export Local Time. Uncheck it to export by Master time, useful when looking at animation across shots."
      - q: "Exporting from Maya, which axis change does the page say to make?"
        choices: ["Set Up Axis to Z", "Set Up Axis to Y", "Set Front Axis to X", "Swap Y and Z in the FBX viewer"]
        answer_index: 0
        explain: "Under Axis Conversion in the Maya FBX export, change the Up Axis to Z for a compatible import into Unreal."
      - q: "What does Force Front XAxis do on import?"
        choices: ["Rotates the camera 90 degrees", "Forces all keys to X only", "Mirrors the animation", "Converts the FBX scene to the Unreal coordinate system with front X axis instead of -Y"]
        answer_index: 3
        explain: "Force Front XAxis converts the scene from the FBX coordinate system to the Unreal system with front X axis instead of -Y."
      - q: "You import from the General Options with nothing selected. How does Unreal decide where the data goes?"
        choices: ["It asks for each object", "It applies to the first track", "It matches object names in the FBX to objects in the sequence", "It creates new cameras only"]
        answer_index: 2
