      animation: {why: "Linked graphs and templates are how you share sway, breathing or IK logic across characters.", do: "Link the same ABPT_SinglePlay template into an ABP for a different skeleton and confirm it still works."}

  - id: AQ47
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [sequencer, control-rig, keyframing, cinematics]
    required_spine: false
    required: false
    title: "Keyframe a Control Rig in Sequencer"
    brief: "Sequencer is the timeline tool of Unreal, used for cinematics and for animating by hand. A Control Rig gives a character controls that you can move, and a keyframe (or key) saves the position of a control at one moment in time. Unreal fills in the movement between the keys. In this quest you put a Control Rig in a level and set keys to make the character raise and lower an arm."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animating-with-control-rig-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-create-control-rigs-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-animation-keyframes-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/control-rig-forwards-solve-and-backwards-solve-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. You need a Control Rig asset for the mannequin: use CR_Mannequin_Body from the template, or your own asset whose name starts with CR_."
      - "Drag the Control Rig asset from the Content Browser into the level. Notice that a new Level Sequence opens with a Skeletal Mesh track and a Control Rig track. Save it as LS_WaveTest."
      - "Expand the Control Rig track. Click one control in the track list, and confirm that the same control is selected in the viewport."
      - "At frame 0, select the hand and arm controls and press S in the viewport to set a key on them. Move the playhead to frame 30, raise the arm, and press S again. Do the same at frame 60 to bring the arm back down."
      - "Add a second character: place a Skeletal Mesh Actor and add it to the sequence. On its track, click Add Track (+), then Control Rig, then Control Rig Classes. Hide one rig with the eye icon in the Anim Outliner, and then show it again."
      - "Play the sequence. Adjust any key so that the motion has a clear start, a clear highest point and a clear return."
    done_when: "Send one screenshot of Sequencer with the expanded Control Rig track showing keys at three different frames, together with the viewport showing the character in the middle of the wave. The sequence must be named LS_WaveTest."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What happens when you drag a Control Rig asset from the Content Browser into the level?"
        choices: ["A new Sequencer opens with the Skeletal Mesh and Control Rig tracks added", "The Control Rig editor opens", "The rig is added to the Animation Blueprint of the mesh", "Nothing until you create a Level Sequence by hand"]
        answer_index: 0
        explain: "The page says dragging the Control Rig asset into the level opens a new Sequencer and adds the Skeletal Mesh with Control Rig tracks to it."
      - q: "Your sequence already has a Skeletal Mesh Actor. How do you add a Control Rig to it?"
        choices: ["Drag the rig onto the viewport character", "Right-click the mesh and pick Attach Rig", "Click Add (+) Track on the Skeletal Mesh track and choose Control Rig > Control Rig Classes", "Set the Animation Mode of the actor to Control Rig"]
        answer_index: 2
        explain: "The page says to click the Add (+) Track button on the Skeletal Mesh track and select Control Rig > Control Rig Classes, then pick a rig class for that mesh."
      - q: "A control is selected in the viewport. Which key creates a Transform keyframe on it at the playhead?"
        choices: ["K", "Enter only", "Ctrl+K", "S"]
        answer_index: 3
        explain: "Pressing the S key with a Control selected creates a Transform keyframe on that control at the current playhead time."
      - q: "You select a control in the Control Rig track list. What happens in the viewport?"
        choices: ["Nothing, the track list and viewport are separate", "The same control is selected in the viewport", "The camera moves to the control", "The control becomes hidden"]
        answer_index: 1
        explain: "Selecting a control in the track selects it in the viewport, and selecting it in the viewport selects the track."
      - q: "Two Control Rigs are in the same sequence and the viewport is crowded. What does the page suggest?"
        choices: ["Delete one rig while you work", "Click the eyeball icon to show or hide a Control Rig", "Only one rig can be shown at a time", "Lock the second rig track"]
        answer_index: 1
        explain: "Sequencer shows multiple Control Rigs at once, and you can change their visibility with the eyeball icon."
      - q: "A Control Rig track is set to Layered but it does not react to the animation underneath. What is the most likely missing piece?"
        choices: ["The rig has no working Backwards Solve graph", "The track weight is set to 100", "The Skeletal Mesh has no Transform track", "Auto Key is disabled"]
        answer_index: 0
        explain: "The page says a rig must have an operational Backwards Solve graph to work as a layered Control Rig."
      - q: "What is the default Order value of a Layered Control Rig track, and in which direction are tracks evaluated?"
        choices: ["0, ascending", "1, ascending", "100, descending from the highest value", "100, ascending from the lowest value"]
        answer_index: 2
        explain: "The order begins at 100 and tracks are evaluated in descending order, starting with the highest order value."
      - q: "Which hotkey reverts the selected keys of the selected Control Rig tracks to their default values?"
        choices: ["Ctrl+G", "Ctrl+I", "Ctrl+Shift+I", "Ctrl+D"]
        answer_index: 0
        explain: "Ctrl+G reverts selected key values to defaults. Ctrl+Shift+G reverts all keys; Ctrl+I and Ctrl+Shift+I set keys to zero."
    flavors:
      _default: {why: "Sequencer is where animators pose and key a rig inside Unreal. This is the base skill for every other Sequencer quest."}
      animation: {why: "You can animate a character in-engine without leaving for Maya, and see it in the real scene lighting.", do: "Add a second Control Rig track and set its Order so it evaluates first. Write one line on what changed."}
      cinematics: {why: "Shots often need small custom character moves. Keying a rig directly is faster than importing a new clip.", do: "Key a head turn that follows a Cine Camera Actor."}

  - id: AQ48
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [sequencer, control-rig, animation-mode, poses]
    required_spine: false
    required: false
    title: "Animation Mode and the Pose tool"
    brief: "Animation Mode is a mode of the level editor that shows the panels an animator needs, such as a list of the rig controls and their values. It also contains the Poses tool, which saves a pose so you can paste it again later, or paste it mirrored on the other side of the body. In this quest you enter Animation Mode, look at its panels, and save, mirror and blend a pose."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-editor-mode-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animating-with-control-rig-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-create-control-rigs-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a Level Sequence that has a Control Rig track. To make one, drag the Control Rig asset CR_Mannequin_Body from the Content Browser into the level and save the sequence that opens. Switch to Animation Mode with the Mode dropdown. Then leave it with Shift+1 and enter it again with Shift+7."
      - "In the Anim Outliner, which lists the controls of the rig, select a hand control. In Anim Details, read its transform values and note that they are relative to the initial values of the control."
      - "Enable the Select tool in the Animation panel. Try to click the character mesh in the viewport, and confirm that you can only select controls."
      - "Pose the left arm and the left hand. Select those controls and click Create Pose in the Poses tool. Name the pose Pose_ArmRaise_L and capture a thumbnail, the small preview image."
      - "Reset the pose. Select the controls of the right side, enable Mirror in the Poses tool and paste the pose. Check that the naming fields match the names in your rig, for example _l_ and _r_."
      - "Enable Key in the Poses tool. On a new frame, set the Blend Pose slider to 0.5 to apply half of the pose."
    done_when: "Send two screenshots. The first shows Animation Mode active with the Anim Outliner and Anim Details panels visible. The second shows the Poses tool with Pose_ArmRaise_L, and the mirrored pose applied on the other arm in the viewport."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which hotkey enables Animation Mode, and which returns to normal Select mode?"
        choices: ["Shift+7 and Shift+1", "Shift+1 and Shift+7", "Ctrl+7 and Ctrl+1", "Alt+A and Alt+S"]
        answer_index: 0
        explain: "The page says Shift+7 enables Animation Mode and Shift+1 restores Select mode."
      - q: "What does the Anim Outliner show?"
        choices: ["All actors in the level", "Only bones of the skeleton", "The Sequencer track list", "Only the controls of the selected Control Rig, in their hierarchy"]
        answer_index: 3
        explain: "The Anim Outliner is an Outliner modified to show only the controls on the selected Control Rig, organized by hierarchy."
      - q: "Anim Details shows a control at Location 0,0,0. What does that zero mean?"
        choices: ["The control is at the world origin", "The control is at the actor root", "The control is at its Initial Local or Global values from the rig asset", "The control has no keyframes"]
        answer_index: 2
        explain: "Transform values in Anim Details are relative to the Initial Local / Global values defined on the control in the Control Rig asset."
      - q: "You keep clicking the character instead of the controls. Which tool fixes this?"
        choices: ["Pivot", "Snapper", "Trails", "Select, which makes only rig controls selectable"]
        answer_index: 3
        explain: "The Select tool makes only Control Rig controls selectable in the viewport. The same option is Only Select Rig Controls in the settings."
      - q: "Where does the Pose tool save poses by default?"
        choices: ["Content/Poses", "Content/ControlRig/Pose", "Content/Animation/Poses", "Next to the Control Rig asset"]
        answer_index: 1
        explain: "The default folder for saving and using poses is Content/ControlRig/Pose. Other folders can be added with Add Existing Folder To View."
      - q: "Blend Pose slider at 1 does what?"
        choices: ["Keeps the current pose", "Fully applies the selected pose", "Mirrors the pose", "Deletes the current keys"]
        answer_index: 1
        explain: "A value of 0 keeps the current pose and 1 fully applies the selected pose, based on the delta between them."
      - q: "By default, how does Mirror decide which control is left and which is right?"
        choices: ["By the control's world X position", "By the names _l_ and _r_ in the control names", "By the bone index", "By the Mirror Data Table of the skeleton"]
        answer_index: 1
        explain: "The naming system assumes Left and Right are _l_ and _r_. You can change the Right Side and Left Side fields for other conventions."
      - q: "For a standard Y-facing character, which Mirror Axis and Axis to Flip does the page say are normal?"
        choices: ["Y and Y", "Z and X", "X and X", "X and Z"]
        answer_index: 2
        explain: "Mirror Axis usually stays X for a standard Y-facing character, and Axis to Flip is X, which keeps rotational X and inverts Y and Z."
    flavors:
      _default: {why: "Animation Mode turns the level editor into an animation workstation with the panels an animator needs."}
      animation: {why: "Saved and mirrored poses save a lot of time on symmetrical characters.", do: "Save three poses for a short idle and blend between them with the slider and keys."}
      cinematics: {why: "Quick pose libraries let you block out a scene fast.", do: "Save a sitting pose and apply it to a second character."}

  - id: AQ49
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [sequencer, control-rig, tweening, motion-trails]
    required_spine: false
    required: false
    title: "Tweens, Snapper and Motion Trails"
    brief: "Animation Mode has small tools that save a lot of manual work. Tweens create an in-between key, a key placed between two other keys, with one slider. The Snapper makes one object follow another for a range of frames, for example a hand that holds a ball. Motion Trails draw the path of a control in the viewport so you can see and edit the movement. In this quest you try each of these tools, and also the Pivot tool, on a sequence with a Control Rig."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-editor-mode-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animating-with-control-rig-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-animation-keyframes-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a Level Sequence that has a Control Rig track. To make one, drag the Control Rig asset CR_Mannequin_Body from the Content Browser into the level and save the sequence that opens. Switch to Animation Mode. Set a key on a hand control at frame 0 and at frame 40, with a clear difference between the two poses. Put the playhead at frame 20."
      - "Open Tweens from the Animation panel. Set the mode to Tween (TW), drag the slider to -0.5 and look at the new in-between key. Undo, switch to Push Pull (PP) and try the value 1."
      - "Place a static mesh in the level, for example a sphere from the Place Actors panel that you name SM_Ball, and add it to the sequence. Open Snapper. Select the hand control and click Children, then select SM_Ball and click Parent."
      - "Set the snap range to frames 10 to 30. Enable Keep Offset and Snap Position, and then click Snap Animation. Move the playhead through the range and confirm that keys were baked (created on every frame) on the hand."
      - "Open Trails. Enable Show Trails and Show Keys for the hand control. Drag one key along the curve in the viewport. Turn on Show Marks and read where the motion is fast: the marks are far apart there."
      - "Use the Pivot tool: click Edit, move the pivot to the area of the elbow, click Pose, and rotate the hand around that point."
    done_when: "Send two screenshots. The first shows the Tween Controller open with a value set and the in-between key visible in Sequencer. The second shows the viewport with a motion trail, keys and timing marks on the hand control."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Where must the playhead be to use the Tween Controller on selected controls?"
        choices: ["On the first keyframe", "On the last keyframe", "Between two keyframes", "Anywhere, it does not matter"]
        answer_index: 2
        explain: "The page says to select the keyframed controls and make sure the playhead is between two keyframes, then move the slider between -1 and 1."
      - q: "In Tween (TW) mode, what does a value of 0 do?"
        choices: ["Deletes the in-between key", "Moves the key value half-way between the neighboring values", "Copies the previous key", "Copies the next key"]
        answer_index: 1
        explain: "Tween moves the key in absolute values, so 0 always puts the key value half-way between the neighboring values."
      - q: "Which tween mode softens (-1) or intensifies (1) the overall values between the first and last key?"
        choices: ["Blend to Neighbor", "Tween", "Push Pull", "Ease"]
        answer_index: 2
        explain: "Push Pull (PP) softens or intensifies the selected keyframes' values between the first and last key."
      - q: "How does the Snapper attach a control to another object?"
        choices: ["It creates a parent constraint", "It changes the control's parent in the rig", "It attaches the actor in the Outliner", "It bakes keyframes for the range, so the result can still be edited"]
        answer_index: 3
        explain: "Rather than attaching the control, the Snapper bakes keyframes, so you can easily modify the resulting animation after snapping."
      - q: "In the Snapper, what does Keep Offset do?"
        choices: ["Keeps the offset between parent and child from the initial snap time", "Adds a fixed 10 cm offset", "Keeps the child at the world origin", "Disables rotation snapping"]
        answer_index: 0
        explain: "Keep Offset maintains the offset between parent and child at the initial snap time. If disabled, the child takes the same transform as the parent."
      - q: "Motion trail marks are far apart in one part of the curve. What does that mean?"
        choices: ["The motion is slow there", "The motion is fast there", "There are no keys there", "The trail is not evaluated there"]
        answer_index: 1
        explain: "Marks spread apart denote high-speed regions; marks close together denote lower-speed regions."
      - q: "Which option must be enabled before Show Keys can draw keys on a motion trail?"
        choices: ["Show Marks", "Show Full Trail", "Show Trails", "Lock Marks to Frames"]
        answer_index: 2
        explain: "Show Keys requires Show Trails to also be enabled."
      - q: "Which console command lets non-Control Rig actors use the new Motion Trails tool?"
        choices: ["Sequencer.UseOldSequencerTrails 0", "Sequencer.MotionTrails 1", "r.MotionTrails 1", "Sequencer.ShowTrails 1"]
        answer_index: 0
        explain: "Sequencer.UseOldSequencerTrails 0 disables the legacy trajectory display and enables the new Motion Trails for other actors."
    flavors:
      _default: {why: "These tools replace hand-made in-betweens and manual attachment with fast, editable results."}
      animation: {why: "Tweens and trails are the daily tools of a polish pass: timing, arcs and contacts.", do: "Use the trail to fix one arc so the hand path is a smooth curve, then screenshot before and after."}
      cinematics: {why: "Snapping a hand to a prop for a few frames is a common shot fix.", do: "Snap a hand to a door handle for 15 frames with Keep Offset off."}

  - id: AQ50
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [sequencer, animation-track, blending, root-motion]
    required_spine: false
    required: false
    title: "Animation track: layers, blends and clip matching"
    brief: "In Sequencer, a character can play ready-made animations on an Animation track. Each animation on the track is a section, also called a clip. Most shots are made from such clips, so you need to know how to blend one into the next, change their speed, and line them up so the character does not jump. In this quest you overlap a walk clip and a run clip, blend them, change their timing, and match their positions."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-animation-track-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-add-cinematic-animation-to-a-character-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/motion-blending-tools-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one, and drag SKM_Manny_Simple or SKM_Quinn_Simple into the level as a Skeletal Mesh Actor. Create a Level Sequence named LS_ClipBlend and add the mannequin Skeletal Mesh Actor to it. On its Animation track, add a walk clip at frame 0 and a run clip, placed so that the two sections overlap by about 15 frames."
      - "Drag the blend handle on the overlap. Right-click the blend curve and change the shape of the curve under Options. Play the sequence and watch the blend."
      - "Expand the Animation track. Set keys on the Weight of the run section so that it goes from 0 to 1 across the overlap."
      - "Hold Ctrl on the right edge of the walk clip and drag to change its Play Rate. Then right-click the clip and use Edit, then Auto Size, to restore its length. Split a clip in two with Ctrl+/."
      - "Put the playhead at the start of the run clip. Right-click the run clip, choose Match With This Bone In Previous Clip, and pick a foot bone or the pelvis bone. Then enable Show Root Motion Trail on the track."
      - "Right-click a section, open Properties, and set When Finished to Keep State. Check what is different when the sequence ends."
    done_when: "Send one screenshot of Sequencer that shows two overlapping animation sections with a visible blend curve, a Weight channel with keys, and the viewport with the root motion trail drawn. Add two lines that say which bone you matched and why."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "When a Skeletal Mesh is animated by Sequencer, what does its Animation Mode become?"
        choices: ["Use Animation Asset", "Use Custom Mode", "Use Animation Blueprint", "It stays unchanged in every case"]
        answer_index: 1
        explain: "The Animation Mode switches to Use Custom Mode so Sequencer drives the actor with a special Animation Blueprint. It does not switch if an Animation Blueprint is already assigned."
      - q: "Your character already has an Animation Blueprint assigned. What must the Blueprint contain so Sequencer clips still play?"
        choices: ["A Slot node to receive the Sequencer animation", "A State Machine named Sequencer", "A Root Motion node", "A Layered Blend per Bone node"]
        answer_index: 0
        explain: "The page says to ensure the Animation Blueprint contains a Slot to receive animation from Sequencer, and to set Slot Name on the section."
      - q: "What is the value range of a section's Weight, and can it be keyed?"
        choices: ["0-100, no", "-1 to 1, yes", "0-1, no", "0-1, yes"]
        answer_index: 3
        explain: "Weight has a range of 0-1 and can be keyframed for dynamic weighting and blending."
      - q: "You hold Ctrl and drag a section edge. What changes?"
        choices: ["The section loops", "The section is trimmed", "The section's play rate is scaled", "A new section is created"]
        answer_index: 2
        explain: "Holding Ctrl on a section edge engages the Play Rate modifier, so dragging scales playback rate instead of looping or trimming."
      - q: "Which hotkey splits a selected animation section at the playhead?"
        choices: ["Ctrl+S", "Ctrl+/", "Alt+]", "Ctrl+,"]
        answer_index: 1
        explain: "Pressing Ctrl + / splits the selected section at the current playhead time."
      - q: "The character snaps back to its start pose when the section ends. Which property changes this?"
        choices: ["When Finished set to Keep State", "Force Custom Mode", "Reverse", "Skip Anim Notifiers"]
        answer_index: 0
        explain: "Keep State holds the last animation frame; Restore State returns the actor to its state before Sequencer animated it."
      - q: "Two run clips reset the character to the origin at each transition. Which tool keeps the world position?"
        choices: ["Swap Root Bone set to None", "Increasing the blend length", "Match With This Bone In Previous Clip on the second clip", "Setting Play Rate to 1"]
        answer_index: 2
        explain: "Motion Blending matches a bone with displacement data to the previous clip and stores an offset, so the position is preserved across the blend."
      - q: "Your mocap clips keep the root bone static and move the pelvis. What does the page recommend for motion blending?"
        choices: ["Re-export the clips with root motion", "Use Match Z Height only", "Disable Show Skeleton", "Enable Blend First Child of Root on the track"]
        answer_index: 3
        explain: "Blend First Child of Root ignores the root bone and blends motion using the first animated child bone, often the pelvis."
    flavors:
      _default: {why: "Clips are the raw material of most shots. Blending and retiming them well is a core skill."}
      animation: {why: "You will fix many transitions between existing clips before you ever key a new pose.", do: "Set a Start Rotation Offset on the second clip so the run turns 45 degrees from the walk."}
      cinematics: {why: "A shot usually chains several clips; motion blending keeps the actor where the camera expects.", do: "Add Show Skeleton on both clips and screenshot the two colored skeletons at the blend."}

  - id: AQ51
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [sequencer, keyframing, curve-editor, tangents]
    required_spine: false
    required: false
    title: "Keyframing fast: hotkeys, Auto Key, tangents and curves"
    brief: "Setting keys quickly and shaping the curves between them is everyday work for an animator. A curve shows how a value changes between two keys, and a tangent is the handle on a key that controls the shape of that curve. In this quest you practice the keyboard shortcuts for keys, try Auto Key (which sets keys for you when you move something), change tangent types, and edit a curve in the Curve Editor. You do all of this on a simple crate."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-animation-keyframes-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-curve-editor-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/sequencer-cinematic-toolbar-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Place a static mesh prop in the level, for example a cube, and name the actor SM_Crate. Create a Level Sequence named LS_KeyDrill and add the crate to it. With the actor selected, press S to create a Transform track and a full key. Move the playhead to other frames and use Shift+W to key the location only and Shift+E to key the rotation only."
      - "Enable Auto Key. Open Keyframe Options and choose Key Changed. Move the crate on the X axis only, and check which channels received keys. Then switch to Key Group and compare."
      - "Select all keys by dragging a selection box (a marquee) around them. Press 4 to make them Linear, and then 1 to make them Cubic (Auto). Hold Alt and drag a key to duplicate it. Use Ctrl+] to select all keys to the right of the playhead."
      - "Turn on Layer Bars and Key Bars in View Options. Scale the whole animation by dragging the edge of the Layer Bar, and change the timing of one pair of keys with a Key Bar."
      - "Open the Curve Editor and select the Location Z curve. Enable Weighted Tangents on one key and stretch a tangent. Buffer the curve, which stores a copy of it, then change the curve, and then apply the buffered curve back."
      - "On a curve with many keys, open the Filter Tool and use Simplify. Note how many keys were removed."
