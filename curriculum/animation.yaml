    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/physics-bodies-reference-for-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-a-new-physics-asset-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Pick a character with a hanging part, such as a ponytail, a chain, a tail or a hose. If you have none, use the mannequin and treat its left arm, from upperarm_l down to hand_l, as the hanging chain. Right-click the Skeletal Mesh, choose Create, then Physics Asset, then Create, and name the asset PHYS_Secondary. Keep only the bodies of the hanging chain, and the bodies of the head, the back and the arms that it can touch."
      - "In the Skeleton Tree, right-click the bodies of the chain and choose Collision, then Enable Collision All. Set their Physics Mode to Simulated. Set every other body to Kinematic, which means physics does not move it."
      - "Set Mass (kg) so that the body nearest to the parent is the heaviest and each next body has half the mass. Set Linear Damping and Angular Damping to about 5.0 on the simulated bodies. Press Simulate to test."
      - "Duplicate the Animation Blueprint that the character uses (ABP_Unarmed in the current template, ABP_Manny or ABP_Quinn in older versions), name the copy ABP_Character, and set it as the Anim Class of the Mesh in BP_ThirdPersonCharacter. In its AnimGraph, after the last pose node, add a RigidBody node, which also adds the conversion nodes to and from component space. Set Override Physics Asset to PHYS_Secondary. Keep Simulation Space set to Component Space."
      - "Expand Sim Space Settings. Set Master Alpha to 1, Velocity Scale Z to 0.5, Max Angular Velocity to about 10, and Max Linear Acceleration to a few hundred. Run the game and spin the character."
      - "In the Event Graph, add a custom event named OnTeleport that calls Reset Dynamics on the Anim Instance. Trigger this event after you teleport the character, so the simulation starts fresh."
    done_when: "Send a screenshot of PHYS_Secondary that shows the simulated chain bodies with their Mass values, and a screenshot of the Details of the RigidBody node with your Sim Space Settings."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "What does the RigidBody node offer that Anim Dynamics does not, per the page?"
        choices: ["It runs on the GPU", "It replaces the movement component", "It works without a Skeleton", "It uses the character's physics asset and can collide with the rest of the character and the level"]
        answer_index: 3
        explain: "The page says RigidBody is a more feature-rich solution because it integrates the physics asset and can simulate collisions with the character and other objects."
      - q: "With default settings, what is the collision state of new physics bodies?"
        choices: ["Enabled on all bodies", "Enabled only on the root body", "Disabled on all bodies until you enable it, for example with Collision > Enable Collision All", "Enabled only between constrained bodies"]
        answer_index: 2
        explain: "The page says collision is disabled on all bodies by default. You right-click the bodies to simulate and choose Enable Collision All."
      - q: "The chain jitters and shakes. What mass setup does the page recommend?"
        choices: ["Give every body the same mass", "Make the body closest to the parent the heaviest and halve the mass for each next body", "Make the tip the heaviest body", "Set all masses to 0"]
        answer_index: 1
        explain: "The example sets the first hose body to 2 kg and the next to 1 kg. Taper the mass down the chain to reduce shaking."
      - q: "In which space does the RigidBody node operate?"
        choices: ["Component Space, so a space conversion is needed around it", "Local Space, so no conversion is needed", "World Space only", "Bone Space of the root"]
        answer_index: 0
        explain: "The page states the RigidBody node operates within Component Space, so a space conversion is needed in the AnimGraph."
      - q: "You set Simulation Space to Base Bone Space with a Base Bone. What happens when the whole mesh moves?"
        choices: ["Velocities are generated from the mesh movement", "Moving the whole mesh or the base bone has no effect on velocities", "The simulation resets", "Gravity is disabled"]
        answer_index: 1
        explain: "In Base Bone Space, moving the entire Skeletal Mesh and moving the Base Bone itself have no effect on velocities, so character motion does not influence the simulation."
      - q: "What does Master Alpha = 0 mean in Sim Space Settings?"
        choices: ["The simulation is fully local; world movement does not affect it", "The simulation runs in world space", "The node is disabled", "Gravity is doubled"]
        answer_index: 0
        explain: "At 0 the system is disabled and the simulation is fully local. At 1 it acts like a world-space simulation but with limits on other parameters."
      - q: "The ponytail flies out when the character spins fast. Which setting does the page suggest lowering?"
        choices: ["Cached Bounds Scale", "Evaluation Reset Time", "Overlap Channel", "Max Angular Velocity (values around 10 or less) and Max Angular Acceleration"]
        answer_index: 3
        explain: "The page says reduce Max Angular Velocity (about 10 or less for fast-turning characters) and Max Angular Acceleration to limit bodies flying out on spins."
      - q: "Which property is described as useful for ragdolls because it stops non-simulated bones from animating when simulation starts?"
        choices: ["Transfer Bone Velocities", "Clamp Linear Translation Limit to Ref Pose", "Freeze Incoming Pose on Start", "World Space Minimum Scale"]
        answer_index: 2
        explain: "Freeze Incoming Pose on Start freezes the incoming pose when simulation begins. The page says this is useful for ragdolls where the simulation takes over."
    flavors:
      _default: {why: "Secondary motion sells weight and speed. RigidBody gives you that with collision at a low cost."}
      animation: {why: "You control the look through mass, damping and sim space limits, not by keyframing every strand.", do: "Also try External Linear Velocity to fake wind and screenshot the result."}

  - id: AQ75
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [physical-animation, physics-asset, profiles, blueprint]
    required_spine: false
    required: false
    title: "Physical Animation profile: motors that follow the pose"
    brief: "Physical animation is a mix of animation and physics. The body is simulated by physics, but motors pull each body part toward the pose of the animation. The character keeps playing its animation and still reacts when something pushes it. A Physical Animation Profile stores how strong those motors are for each body. In this quest you create a profile for the upper body, apply it from a Blueprint, and push the character with a physics cube."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-a-physical-animation-profile-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/applying-a-physical-animation-profile-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-profiles-for-bodies-and-constraints-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/physics-asset-editor-in-unreal-engine---tools-and-profiles"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open the Physics Asset of the mannequin (PA_Mannequin in the folder Characters/Mannequins/Rigs) and go to Window > Profiles. Under Physical Animation Profiles, click New and name the profile PAP_UpperBody."
      - "In the Skeleton Tree or in the Physics Graph, select spine_01 and every body below it. Press Assign. Check that the nodes in the graph change from shaded to filled."
      - "With those bodies selected, set the profile to the starting values from the documentation page: Orientation Strength 1000, Angular Velocity Strength 100, Position Strength 1000, Velocity Strength 100, Max Linear Force 0 and Max Angular Force 0. Save the asset."
      - "Create an Actor Blueprint named BP_PhysAnimPawn with a Skeletal Mesh Component that uses SKM_Manny_Simple. Set its collision preset so that collision is enabled, Object Type is Pawn, and the Pawn channel is ignored. Add a Physical Animation Component. Add a Name variable named BoneName with the value spine_01."
      - "In the Event Graph, connect three nodes after BeginPlay. First, call Set Skeletal Mesh Component with the Physical Animation Component as target. Second, call Apply Physical Animation Profile Below with Body Name set to BoneName, Profile Name set to PAP_UpperBody, and Include Self on. Third, call Set All Bodies Below Simulate Physics with BoneName, New Simulate on and Include Self on."
      - "Set the mesh to play a looping animation: set Animation Mode to Use Animation Asset and pick an idle. Place the Blueprint in a level and place a cube with Simulate Physics turned on next to it. Play in the editor and push the cube into the character. The upper body should follow the animation and also react to the hits."
      - "Try Orientation Strength 100 and then 5000. Note how closely the pose still follows the animation in each case."
    done_when: "Send a screenshot of the Profiles tab with PAP_UpperBody assigned, with the graph nodes filled, and a screenshot of the BeginPlay graph. Add one line about what changed between Orientation Strength 100 and 5000."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Where do you create a Physical Animation Profile?"
        choices: ["Physics Asset Editor > Window > Profiles > New under Physical Animation Profiles", "Project Settings > Physics > Profiles", "In the Animation Blueprint Class Defaults", "By right-clicking a bone in the Skeleton Editor"]
        answer_index: 0
        explain: "The page opens the Profiles window from the Window menu of the Physics Asset Editor and adds the profile with New."
      - q: "Which starting values does the page suggest for a Physical Animation profile?"
        choices: ["0, 0, 0, 0, 0, 0", "100, 1000, 100, 1000, 50, 50", "1, 1, 1, 1, 1, 1", "1000, 100, 1000, 100, 0, 0"]
        answer_index: 3
        explain: "Both the creating page and the profiles page say a good set of starting values is 1000, 100, 1000, 100, 0, 0."
      - q: "When are Position Strength and Velocity Strength used?"
        choices: ["Always", "Only for non-local simulation", "Only when Is Local Simulation is enabled", "Only for kinematic bodies"]
        answer_index: 1
        explain: "The Tools and Profiles page says Position Strength and Velocity Strength are only used for non-local simulation."
      - q: "Why does the applying page change the Skeletal Mesh Component collision to ignore Pawn?"
        choices: ["To reduce draw calls", "To let projectiles pass through", "So the mesh stops trying to eject itself from the collision capsule", "Because profiles need it to compile"]
        answer_index: 2
        explain: "The page says ignoring Pawn fixes the mesh trying to push itself out of the Pawn capsule. Use a custom Object Type if you need pawn-vs-pawn hits."
      - q: "What is the first node after Event BeginPlay in the applying graph?"
        choices: ["Set All Bodies Below Simulate Physics", "Apply Physical Animation Profile Below", "Set Skeletal Mesh Component on the Physical Animation Component", "Set Constraint Profile for All"]
        answer_index: 2
        explain: "The Physical Animation Component must first be told which Skeletal Mesh Component to drive. Then the profile is applied and simulation is turned on."
      - q: "You apply the profile below spine_01 and want spine_01 itself included. What do you set?"
        choices: ["Clear Not Found", "Include Self", "New Simulate", "Default if Not Found"]
        answer_index: 1
        explain: "Include Self is checked so the named bone is included with the bones below it. Body names match bone names in the physics asset."
      - q: "A newly created profile uses which settings?"
        choices: ["The values of the last profile you edited", "The Engine ragdoll preset", "Random values", "It is empty and uses default settings"]
        answer_index: 3
        explain: "The profiles page says new profiles are initialized empty, meaning they use default settings until you edit them."
      - q: "In the Physics Graph, how can you tell which bodies are assigned to the Current Profile?"
        choices: ["Assigned nodes show their fill color; unassigned nodes are shaded", "Assigned nodes are red", "Assigned nodes are hidden", "There is no visual difference"]
        answer_index: 0
        explain: "The page says assigned nodes change from shaded to their fill color, and unassigned nodes stay shaded."
    flavors:
      _default: {why: "Physical animation lets a character keep playing its animation while physics pushes it around."}
      animation: {why: "It is the bridge between your keyframes and a full ragdoll: strength values decide how much the pose wins.", do: "Make a second profile for the arms only and switch to it from a key press."}

  - id: AQ76
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [ragdoll, physics-blend, animation-blueprint, hit-reaction]
    required_spine: false
    required: false
    title: "Hit reaction: blend physics in and out"
    brief: "A hit reaction makes the part of the body that was hit move by physics for a short moment, and then return to the animation. It is a cheap way to make combat feel physical. The key value is the Physics Blend Weight: at 0 the body part follows the animation, and at 1 it is fully driven by physics. In this quest you raise and lower that weight with a Timeline when the character is hit, and you also make the hands stay on the animation with Kinematic bodies."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/physics-driven-animation-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-kinematic-bodies-with-simulated-parents-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/physics-bodies-reference-for-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a Character Blueprint named BP_HitDummy. Set its Mesh to SKM_Manny_Simple with the Anim Class ABP_Unarmed, and set the collision preset of the Mesh so that collision is enabled and the Visibility channel is blocked. Place one in the level. In its Event Graph, add a custom event named HitBone with a Name input. In it, call Set All Bodies Below Simulate Physics on the Mesh with that bone, New Simulate on and Include Self on."
      - "In BP_HitDummy, add a Timeline named TL_HitBlend with a length of 0.6 s and a float track that goes from 0 to 1 and back to 0. Play it from the start at the end of HitBone. On every update of the Timeline, send its value to Set All Bodies Below Physics Blend Weight for the same bone."
      - "On the Finished output of the Timeline, call Set All Bodies Below Simulate Physics with New Simulate off, so that the simulation stops."
      - "In BP_ThirdPersonCharacter, add a key press event that does a Line Trace by Channel from the camera forward, with Trace Complex turned on. Break the hit result, cast the Hit Actor to BP_HitDummy, take the Hit Bone Name, and call HitBone with it."
      - "Open the Physics Asset of the mannequin. Select hand_l and hand_r and set their Physics Type to Kinematic. Set Physics Update Mode to Component Transform is Kinematic. Simulate with the jump loop animation, and watch the hands stay on the animation."
      - "Play in the editor. Aim at the arm of the dummy and press the key, and then do the same on the leg. Check that the part that was hit blends into physics and back to the animation."
    done_when: "Send a short video clip (30 seconds or less), or three screenshots, of a hit blending in and out. Also send a screenshot of the Event Graph with the timeline and both Set All Bodies Below nodes."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What does a Physics Blend Weight of 1.0 mean for the bone and the bones below it?"
        choices: ["They are fully driven by the keyframe animation", "They are fully driven by physics", "They are frozen", "Half physics, half animation"]
        answer_index: 1
        explain: "At 1.0 the given bone and all below it are completely driven by physics. At 0.0 the mesh returns to its keyframed animation."
      - q: "What does Set All Bodies Below Simulate Physics do?"
        choices: ["Simulates only the named bone", "Applies a constraint profile", "Turns simulation on or off from the named bone recursively down the chain", "Changes the mesh collision preset"]
        answer_index: 2
        explain: "The page calls it an on/off switch that starts simulating at a bone and continues down the hierarchy, for example a whole arm from the clavicle."
      - q: "Which is the correct order for a hit reaction, per the page?"
        choices: ["Blend weight to 1, then start simulating, then get the bone", "Start simulating on every bone, then trace", "Stop simulating, blend weight up, get the bone", "Get the hit bone, start simulating below it, animate blend weight up to 1 and back to 0, then stop simulating"]
        answer_index: 3
        explain: "The overview lists: get the hit bone name, enable simulation below it, animate Physics Blend Weight up and back down, then disable simulation once the weight is 0."
      - q: "For a Character or Pawn, where does the page say to put these nodes?"
        choices: ["In the Animation Blueprint's Event Graph", "In the Level Blueprint", "In the Physics Asset", "In a Material"]
        answer_index: 0
        explain: "The page uses a simple Actor for the demo but says that for a Character or Pawn the nodes go in the Animation Blueprint Event Graph."
      - q: "What must a Skeletal Mesh have before any physics can be used on it?"
        choices: ["A Physics Asset set up and applied", "A Control Rig", "Root motion enabled", "A Nanite mesh"]
        answer_index: 0
        explain: "The page states that using physics on a Skeletal Mesh in any form requires a Physics Asset applied to it."
      - q: "What does Physics Type = Kinematic mean for a body, per the bodies reference?"
        choices: ["It is fully simulated", "It ignores animation", "It inherits from the owner component", "It is not affected by physics but can interact with simulated bodies"]
        answer_index: 3
        explain: "Kinematic bodies are not moved by physics but can push simulated bodies. Default inherits the owner component's behavior."
      - q: "To make a character hang from a ledge with simulated body, which setting is changed on the asset after making the hands Kinematic?"
        choices: ["Root Motion Mode = Ignore", "Enable Gravity off on all bodies", "Physics Update Mode = Component Transform is Kinematic", "Sleep Family = Sensitive"]
        answer_index: 2
        explain: "The kinematic bodies page sets the hands to Kinematic and then Physics Update Mode to Component Transform is Kinematic so the root body does not move the component."
      - q: "You right-click a bone in the Physics Asset Skeleton Tree and expand Physics Type. What does that option do?"
        choices: ["Sets the Physics Type for that bone only", "Sets the Physics Type for the bodies below that bone", "Deletes the body", "Creates a constraint profile"]
        answer_index: 1
        explain: "The page says the context menu option sets the Physics Type for the children's bodies below the current bone."
    flavors:
      _default: {why: "A hit that pushes the body and then returns to animation is the cheapest way to make combat feel physical."}
      animation: {why: "Blend weight timing is animation work: how fast physics wins and how fast the pose comes back.", do: "Try a 0.3 s and a 1.2 s timeline and write one line on which felt better and why."}

  - id: AQ77
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [groom, hair, physics, simulation]
    required_spine: false
    required: false
    title: "Groom hair: make the strands move"
    brief: "A groom is the Unreal asset for hair made of single strands. Simulating every strand would cost too much, so Unreal simulates a small number of guide strands, and the other strands follow them. With simulation turned on, the hair reacts to movement and wind. In this quest you look at the guides of a groom, turn on its physics, make the tips softer than the roots, and put the groom on a character."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/enabling-physics-simulation-on-grooms-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/groom-asset-editor-user-guide-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/hair-rendering-and-simulation-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, and enable the Groom plugin in Edit > Plugins. Get a groom asset. No template includes one, so use a MetaHuman hair groom from Epic, a free groom from Fab, or any Alembic (.abc) groom that you import with the Alembic Groom Importer plugin. Double-click it to open the Groom Asset Editor."
      - "In the Show menu of the viewport, turn on Guide and Guide Influence. Take a screenshot of the simulation guides and their colored clumps, the groups of strands that follow one guide."
      - "In the Physics panel, turn on Enable Simulation. Set Niagara Solver to Groom Rods. Note the values of Sub Steps and Iteration Count."
      - "Lower Bend Stiffness a little and raise Bend Damping. Edit the Bend Stiffness Scale curve so that the tip of the hair (x = 1) is softer than the root (x = 0)."
      - "In the LOD panel, set Simulation to Disable on your last LOD, the simplest version used at far distances."
      - "Place the groom on a character with a Groom component, for example on the Mesh of BP_ThirdPersonCharacter or on the character the groom came with. On the component, set Physics Asset to the physics asset of the character, which is used for collision. Enable Override Settings, then turn Local Simulation on and set Local Bone to head. Run with the character and watch the hair."
    done_when: "Send two screenshots: one of the Physics panel of the Groom Asset Editor with your values, and one of the Details of the Groom component with Override Settings, Physics Asset and Local Bone filled in. Add one line about what Bend Damping changed."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Where do you turn on physics for a groom asset?"
        choices: ["Project Settings > Physics > Hair", "Skeletal Mesh Editor > Cloth", "Groom Asset Editor > Physics panel > Enable Simulation", "The Niagara System editor"]
        answer_index: 2
        explain: "The page says to go to the Groom Asset Editor Physics panel and enable the Enable Simulation checkbox."
      - q: "Which options does the Niagara Solver property list?"
        choices: ["Chaos Cloth, Chaos Flesh, Custom", "GPU, CPU, Hybrid", "PBD, XPBD, Verlet", "Groom Rods, Groom Springs, Custom Solver"]
        answer_index: 3
        explain: "The solver choices are Groom Rods, Groom Springs and Custom Solver. Custom System holds the Niagara system for the custom option."
      - q: "Sub Steps sets sub steps per frame. At what rate are solver calls made, per the page?"
        choices: ["24 frames per second", "30 frames per second", "60 frames per second", "The game frame rate"]
        answer_index: 0
        explain: "The page says solver calls are done at 24 frames per second, and Sub Steps is the number of sub steps per frame."
      - q: "On the Bend Stiffness Scale curve, what do x = 0 and x = 1 mean?"
        choices: ["Minimum and maximum stiffness", "Root and tip of the strand", "First and last LOD", "Left and right side of the head"]
        answer_index: 1
        explain: "The x-axis range is 0 to 1 where 0 maps to the root and 1 to the tip of each strand."
      - q: "You enable Override Settings on a Groom component but the hair does not simulate. What is the most likely reason?"
        choices: ["The component needs a Niagara system", "Enable Simulation is off in the groom asset; both the asset and the component must have it enabled", "Local Bone is not set", "The LOD is set to Auto"]
        answer_index: 1
        explain: "The page says the groom asset must first have Enable Simulation on. The component setting requires both to be enabled."
      - q: "What are the Simulation options in the LOD panel?"
        choices: ["Auto, Enable, Disable", "Low, Medium, High", "On, Off", "Strands, Cards, Meshes"]
        answer_index: 0
        explain: "Auto uses the global value, Enable forces simulation on for that LOD, and Disable forces it off."
      - q: "What does Teleport Distance do on the Groom component?"
        choices: ["Moves the groom to a bone", "Limits how far strands can stretch", "Sets the distance threshold that resets the simulation", "Sets the collision radius"]
        answer_index: 2
        explain: "Teleport Distance is the distance threshold used to reset the simulation, for example after a character teleports."
      - q: "In the Groom Asset Editor Show menu, what does Guide Influence display?"
        choices: ["The UV at the root of each strand", "The clusters used for culling", "The random seed per strand", "The strands influenced by each guide, as colored simulation clumps"]
        answer_index: 3
        explain: "Guide Influence shows simulation clumps, meaning all the strands driven by one guide, in color."
    flavors:
      _default: {why: "Simulated hair reacts to motion and wind, which makes close-up characters feel alive."}
      animation: {why: "Hair timing and softness are part of the performance; the stiffness curves are your keys.", do: "Compare Groom Rods and Groom Springs on the same groom and write one line on the difference you saw."}

  - id: AQ78
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [compression, animation-sequence, optimization, memory]
    required_spine: false
    required: false
    title: "Animation compression that fits the clip"
    brief: "Animations use a lot of memory, so Unreal compresses them, which means it stores them in a smaller form. Stronger compression saves more memory but can cause small errors, such as feet that slide or shake. A Bone Compression Settings asset holds the rules for compressing bone movement, and you can give different animations different rules. In this quest you create one asset for high quality and one for small size, apply them to two copies of a run animation, and compare the size and the quality."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-compression-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-compression-codec-reference-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. In the Content Browser, click Add (+), then Animation, then Advanced, then Bone Compression Settings. Name the asset BCS_Quality. Add one codec (a compression method): Anim Compress Per Track Compression. Set Error Threshold to 0.05 and enable Force Below Threshold."
      - "Create BCS_Small in the same way, with two codecs: Anim Compress Remove Linear Keys and Anim Compress Removes Every Second Key. Set Error Threshold to 0.5."
      - "Duplicate a run animation of the mannequin twice and name the copies A_Run_Quality and A_Run_Small. In the Asset Details panel of each copy, under Compression, assign the matching Bone Compression Settings asset. Note the size or memory that is shown for each."
      - "Open BCS_Small and change Max Pos Diff on the Remove Linear Keys codec. Click the Compress button in the toolbar, and read the dialog that shows how many assets will be compressed."
      - "Create a Curve Compression Settings asset named CCS_Default. Note its default values for Max Curve Error and Error Sample Rate. Assign it to A_Run_Quality."
      - "Play both animations side by side in the Animation Sequence Editor. Look for foot sliding or shaking on the small one."
    done_when: "Send a text with the sizes of A_Run_Quality and A_Run_Small, a screenshot of the Compress confirmation dialog, and 3 lines about where you saw a loss of quality and which kinds of animation you would give each settings asset."
    xp: 60
    verify_type: writeup
    quiz:
      - q: "Which two data assets apply compression to Animation Sequences?"
        choices: ["Texture Compression Settings and Mesh Compression Settings", "Montage and Composite", "Animation Modifier and Pose Asset", "Bone Compression Settings and Curve Compression Settings"]
        answer_index: 3
        explain: "The page names Bone Compression Settings for skeletal motion and Curve Compression Settings for curve data."
      - q: "Where are the default Compression Settings assets that ship with the engine?"
        choices: ["Engine > Content > Animation", "Game > Animation > Defaults", "Plugins > Animation > Compression", "Project Settings > Engine > Animation"]
        answer_index: 0
        explain: "The page says the pre-packaged general use Compression Settings assets are in the Engine > Content > Animation folder."
      - q: "What is the default Error Threshold on a Bone Compression Settings asset, and how is it used?"
        choices: ["1.0; any codec above it is used", "0; compression is skipped", "0.1; the best codec below this error is used", "10; codecs are tried in order"]
        answer_index: 2
        explain: "The page says the best codec below the error threshold is used and .1 is the default value."
      - q: "What does Force Below Threshold do?"
        choices: ["Deletes keys until the file is smaller", "Uses a codec with lower error, even if it increases file size, until the error falls below the threshold", "Locks the threshold at 0", "Forces resampling to 30 fps"]
        answer_index: 1
        explain: "With Force Below Threshold, any codec with lower error can be picked, even one that makes the sequence bigger, until the error is under the threshold."
      - q: "You changed a codec property inside a settings asset. What happens to the animations that use it?"
        choices: ["They recompress automatically right away", "They are marked as broken", "Nothing until you press the Compress button in the settings asset toolbar", "They lose their compression"]
        answer_index: 2
        explain: "Changing a codec property does not auto-apply because many assets may use it. The Compress button recompresses them after a confirmation dialog."
      - q: "Which is NOT a moment when compression is applied automatically, per the page?"
        choices: ["When you change which Compression Settings asset a sequence uses", "During a cook", "When the DDC sees a new settings asset registered", "When you rename the animation"]
        answer_index: 3
        explain: "Auto compression happens when the settings asset on a sequence changes, on load if settings changed, when the DDC notices a new asset, or during a cook. Renaming is not listed."
      - q: "Which bone codec restores any present compression to raw data?"
        choices: ["Anim Compress Least Destructive", "Anim Compress Bitwise Compress Only", "Anim Compress Per Track Compression", "Anim Compress Removes Trivial Keys"]
        answer_index: 0
        explain: "The codec reference says Least Destructive restores the animation to raw data. Bitwise Compress Only keeps all keys but compresses them bitwise."
      - q: "Which kind of animation benefits most from compression with little quality loss, per the page?"
        choices: ["Animations with a lot of movement", "Animations with minimal movement", "Only additive animations", "Only root motion animations"]
        answer_index: 1
        explain: "The page says animations with minimal movement compress well with little impact, while animations with a lot of movement lose more quality."
    flavors:
