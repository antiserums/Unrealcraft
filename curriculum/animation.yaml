    title: Locomotion set
    brief: "Locomotion means all the ways a character moves around: standing, walking, running, jumping and landing. A complete locomotion set joins these animations so that the character changes smoothly from one to the next. It is the main piece of work that a game animator shows to others. In this quest you build one from a blend space, a state machine and an upper body layer, and you record a clip of the result."
    time_min: 240
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-blueprints-in-unreal-engine"
