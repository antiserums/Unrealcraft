        choices: ["Animation keyframes", "A set of rigid bodies and constraints that form a ragdoll", "Materials and textures", "A list of sockets"]
        answer_index: 1
        explain: "A Physics Asset defines the physics and collision of a Skeletal Mesh. It contains rigid bodies and constraints that make up one ragdoll."
      - q: "How many Physics Assets can a Skeletal Mesh have?"
        choices: ["One", "One per bone", "Unlimited", "Two, one for collision and one for ragdoll"]
        answer_index: 0
