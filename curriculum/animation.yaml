    required_spine: false
    required: false
    title: "Animation Modifiers: notifies by script"
    brief: "An Animation Modifier is a small Blueprint script that changes animation assets for you, for example by adding tracks or markers. Placing markers by hand on hundreds of animations is slow, and a modifier does the same work with one click. It has two functions: OnApply makes the changes, and OnRevert removes them again. In this quest you write a modifier that finds the frame where a foot is lowest and puts a sync marker there."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-modifiers-in-unreal-engine"
