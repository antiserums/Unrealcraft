      - "Enable the Pose Search plugin (Edit > Plugins > Animation) and restart. Get a set of root-motion locomotion clips, for example from the Game Animation Sample."
      - "Create PSS_Locomotion (Animation > Motion Matching > Pose Search Schema) for your skeleton. Check that the Pose channel uses your left and right foot bones."
      - "Create PSD_Locomotion (Pose Search Database) with PSS_Locomotion as Schema. Add loops, starts, stops and pivots. Confirm each sequence has Root Motion enabled."
      - "In ABP_MMCharacter, add Motion Matching (Database = PSD_Locomotion) into Pose History into Output Pose. On Pose History enable Generate Trajectory and add the collected bones."
      - "Play in editor. Enable Should Filter Notifies and set Notify Recency Time Out. Tune Continuing Pose Cost Bias until the character does not switch clips too often."
      - "Record 10 seconds with the Rewind Debugger (Tools > Debug). Open the Pose Search track and the Selection Table. Find one pose that was rejected and read why."
      - "Change the Trajectory channel Weight (for example 3.0 to 1.0) and record again. Note what changed."
    done_when: "A short clip of the character moving with Motion Matching, a screenshot of the Rewind Debugger selection table with Channel Breakdown on, and 5 lines: your schema channels, which database bias you changed and why, and one case where a state machine would still be the better choice."
    xp: 250
    verify_type: writeup
    quiz:
      - q: "What does the Motion Matching node replace, according to the source?"
        choices: ["The Skeletal Mesh Component", "State Machines and Blend Spaces as the way to pick the next pose", "Root motion extraction", "Animation Montages and slots"]
        answer_index: 1
        explain: "The page calls Motion Matching a dynamic alternative to State Machines or Blendspaces. It selects poses from a database instead of using transition logic."
      - q: "Which asset stores the channels (for example Trajectory and Pose) and the query settings?"
        choices: ["Pose Search Schema", "Pose Search Database", "Pose History", "Mirror Data Table"]
        answer_index: 0
        explain: "A Pose Search Schema asset stores the motion matching configuration and query settings. The Database links to a Schema and holds the animations."
      - q: "A new Pose Search Schema is set up for a locomotion system by default. Which bones does its Pose channel use?"
        choices: ["hand_l and hand_r", "pelvis and head", "root and ik_foot_root", "foot_l and foot_r from the Mannequin skeleton"]
        answer_index: 3
        explain: "The default asset comes pre-configured with bone definitions for the Mannequin foot bones foot_l and foot_r. Replace them if you use another skeleton."
      - q: "You want a climbing system with Motion Matching. What does the source suggest for the Pose channel?"
        choices: ["Use the same foot bones as locomotion", "Remove the Pose channel completely", "Add every bone in the skeleton", "Use bones that hold useful data for that motion, such as the hand bones"]
        answer_index: 3
        explain: "The Pose channel can use any bone. For climbing you would pick bones with valuable data, like the hands. More channels and samples cost more performance."
      - q: "Your locomotion clips do not move the character in Motion Matching. What is the most likely problem?"
        choices: ["The Animation Sequences do not have Root Motion enabled", "The Schema Sample Rate is too high", "The Database uses Brute Force search", "The Pose History node has Generate Trajectory enabled"]
        answer_index: 0
        explain: "Animations used in a Motion Matching locomotion setup must contain root motion, and the sequences must have the Root Motion property enabled."
      - q: "Which asset type can NOT be added to a Pose Search Database for the AnimGraph node?"
        choices: ["Animation Sequence", "Animation Composite", "Animation Montage", "Blend Space"]
        answer_index: 2
        explain: "Databases support Sequences, Composites and Blendspaces. Montages are not supported in Animation Blueprints, so they cannot be used with the Motion Matching node."
      - q: "The character leaves a start animation too early. Which database setting makes the system hold the current clip longer?"
        choices: ["A positive Looping Cost Bias", "A negative Continuing Pose Cost Bias", "A higher Search Throttle Time on the Schema", "Set Pose Search Mode to VPTree"]
        answer_index: 1
        explain: "Negative Continuing Pose Cost Bias values make the current animation more likely to be selected again, so it plays longer. Positive values shorten it."
      - q: "What is the simplest AnimGraph that runs Motion Matching?"
        choices: ["Motion Matching into a State Machine into Output Pose", "Motion Matching node into Pose History node into Output Pose", "Pose History into Blend Space into Output Pose", "Motion Matching node alone into Output Pose"]
        answer_index: 1
        explain: "The page builds a Motion Matching node, then a Pose History node from its output, then connects Pose History to Output Pose and enables Generate Trajectory."
      - q: "Footstep sounds fire twice on adjacent frames after a pose switch. What is the documented fix?"
        choices: ["Convert the notifies to Anim Notify States", "Lower the Schema Sample Rate", "Enable Should Filter Notifies and set Notify Recency Time Out", "Increase Pose Jump Threshold Time"]
        answer_index: 2
        explain: "Anim Notify Filtering drops repeat instances of the same notify inside Notify Recency Time Out. The default 0.2 s is a baseline for biped locomotion. It only works on Anim Notifies, not Notify States."
      - q: "Pose channel weight is 1.0 and Trajectory weight is 3.0. What does this mean?"
        choices: ["Trajectory differences count three times as much as pose differences", "The pose is searched three times per frame", "Only the trajectory channel is used", "Trajectory samples are taken 3 seconds ahead"]
        answer_index: 0
        explain: "The system is influenced three times as much by differences in trajectory as by differences in pose. Weights are normalized unless Data Preprocessor is None."
      - q: "The movement model runs at 5 m/s but the data averages 4 m/s, so the system always picks the fastest poses. Why is changing weights the wrong fix?"
        choices: ["Weights cannot be edited after indexing", "Weights only affect the debug colors", "Devaluing those poses can make the system ignore some channel criteria and leave gaps; better to split data into databases and pick them with a chooser", "Weights are ignored when the Trajectory channel is present"]
        answer_index: 2
        explain: "The page warns that adjusting weights changes how poses are selected, not the data mismatch, and can leave gaps. It suggests Database sets and a chooser to swap the active database."
      - q: "In the Rewind Debugger selection table, a pose shows the flag PoseReselectHistory. What does that tell you?"
        choices: ["The pose is mirrored", "The pose was used recently, so the system ignores it until more poses have been selected", "The pose is from a looping asset", "The pose has the lowest cost and will play next"]
        answer_index: 1
        explain: "PoseReselectHistory means the pose was selected recently and is ignored for now. Gray values in the table mark selections that are ignored completely."
    flavors:
      _default: {why: "Motion Matching is how modern locomotion is built. You must know when to use it and how to read its choices."}
      animation: {why: "Adding data instead of adding transitions changes how you plan a whole animation set.", do: "Add a Pose Search: Block Transition notify state to one idle clip and prove in the debugger that the system never jumps into that range."}
      gameplay_design: {why: "Choosers and databases are where gameplay state meets animation selection."}
      programming: {why: "You will wire the update functions and choosers that feed databases into the node."}

  - id: AQ33
    rank: 4
    difficulty: master
    track: animation
    subjects: [retargeting, ik-rig, ik-retargeter, pipeline]
    required_for_majors: [animation]
    taster_for_majors: []
    adjacent_for: [tech_art, cinematics]
    required_spine: false
    elective: false
    title: Retargeting at scale
    time_min: 150
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/ik-rig-animation-retargeting-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/auto-retargeting-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/retargeting-operation-stack-in-unreal-engine"
    checklist:
      - "Pick a source character (for example the UE5 Mannequin) and a target character with a different skeleton. Create IK rigs IKR_Source and IKR_Target."
      - "In each IK Rig, run Auto Create Retarget Chains and Set Pelvis. Read the notification and fix any chain the tool got wrong by hand."
      - "Create RTG_SourceToTarget (Animation > IK Rig > IK Retargeter). Click Add Default Ops. Check the mapping with Map All (Fuzzy) and fix any wrong chain."
      - "If the reference poses differ (A-pose vs T-pose), create a new retarget pose and use Auto Align. Do not edit the Default Pose."
      - "Preview 3 clips in the Asset Browser. Fix one visible problem with an op setting, for example FK Chains Rotation Mode on the fingers or a Pin Bones op for a weapon bone."
      - "Batch: right-click 10 or more source Animation Sequences in the Content Browser, choose Retarget Animation Assets, turn off Auto Generate Retargeter, pick RTG_SourceToTarget, use Add Suffix and export."
      - "Create one Override Set (for example IsHoldingWeapon) that changes one op property. Show it on the Retarget Pose From Mesh node."
    done_when: "Screenshots of the chain mapping, the op stack, and the batch export options, plus the exported folder in the Content Browser. Add 5 lines: which chain the auto tool got wrong, which op fixed your worst problem, and what the override set changes."
    xp: 250
    verify_type: screenshot
    quiz:
      - q: "Why does IK Rig retargeting work when the target arm has more joints than the source arm?"
        choices: ["Extra joints are deleted during export", "You define whole chains, not individual bones, so the chain adapts to any bone count", "The source skeleton is copied onto the target", "Only the hand bone is retargeted"]
        answer_index: 1
        explain: "Chains are defined from a start bone to an end bone. Defining the whole arm chain keeps retargeting correct no matter how many bones it has."
      - q: "Source chain is named ArmLeft, target chain is named left_arm. What happens?"
        choices: ["Retargeting fails until the names are identical", "Only exact matches are allowed on limbs", "The chain is mapped to Root", "They match, because chain matching uses a fuzzy string match"]
        answer_index: 3
        explain: "The page says chain matching uses a fuzzy string match. ArmLeft can match left_arm as long as no other name is more accurate."
      - q: "Why must you also Set Pelvis in each IK Rig?"
        choices: ["So root motion can be defined and transferred proportionally", "So the fingers retarget in One to One mode", "The IK Retargeter cannot open without it", "It sets the preview mesh"]
        answer_index: 0
        explain: "The pelvis bone is defined so the character's root motion can be transferred in a proportional way between the two characters."
      - q: "The source is in an A-pose and the target is in a T-pose. What is the documented approach?"
        choices: ["Re-import the target in an A-pose", "Increase Rotation Alpha on the FK Chains op", "Create a new retarget pose, then match it with Edit Mode or Auto Align", "Set Translation Mode to Absolute"]
        answer_index: 2
        explain: "Different reference poses need a matching Retarget Pose. Epic recommends creating a new pose instead of editing the Default Pose, then aligning it."
      - q: "What does the Retarget Pose Blend slider do at 0 and at 1?"
        choices: ["0 is the source pose, 1 is the target pose", "0 blends to the first animation frame, 1 to the last", "0 shows the mesh reference pose, 1 shows the current retarget pose", "0 disables IK, 1 enables it"]
        answer_index: 2
        explain: "Setting it to 0 returns to the Skeletal Mesh default reference pose. Setting it to 1 shows the current Retarget Pose. It helps you see what you changed."
      - q: "Which ops appear when you click Add Default Ops?"
        choices: ["Pelvis Motion, FK Chains, Root Motion and Remap Curves", "Pin Bones, Filter Bones and Scale Source", "Only Run IK Rig", "Stride Warp and Speed Plant"]
        answer_index: 0
        explain: "The op stack page marks Pelvis Motion, FK Chains, Root Motion and Remap Curves as default operations added by Add Default Ops."
      - q: "The finger chains look wrong with the default FK Chains Rotation Mode. Which mode is usually best for fingers?"
        choices: ["Interpolated", "None", "One to One, when the bone counts match", "One to One Reversed for all chains"]
        answer_index: 2
        explain: "Interpolated is best for chains with different bone counts. One to One copies each bone in order and is typically the best choice for finger chains."
      - q: "A weapon bone ik_hand_weapon floats away from the hand after retargeting. Which op is made for this?"
        choices: ["Pin Bones, to lock ik_hand_weapon to hand_r", "Filter Bones", "Scale Source", "Remap Curves"]
        answer_index: 0
        explain: "Pin Bones is a post-processing op that locks a specific bone, such as ik_hand_weapon, to another bone like hand_r so it follows the animated character."
      - q: "You add a Retarget Pose op in the middle of the op stack and it does nothing. Why?"
        choices: ["It only works in Sequencer", "Retarget Pose must be the first op in the stack", "It needs an IK goal", "It is disabled on LOD 0"]
        answer_index: 1
        explain: "The page states that Retarget Pose must be the first op in the stack for it to work as expected, and only one copy of the op can be used."
      - q: "When you retarget from the Content Browser with Retarget Animation Assets, what does Auto Generate Retargeter do by default?"
        choices: ["It is off, so you must pick an IK Retargeter", "It only works for Mannequin to MetaHuman", "It renames the exported assets", "It creates IK Rigs and an IK Retargeter for the two meshes automatically"]
        answer_index: 3
        explain: "Auto Generate Retargeter is enabled by default. It creates IK Rig assets and an IK Retargeter for the source and target. Turn it off to use your own retargeter."
      - q: "You batch-retarget an Animation Blueprint. Which export option also retargets the sequences it references?"
        choices: ["Overwrite Existing Files", "Include Referenced Assets", "Export Retarget Assets", "Add Prefix"]
        answer_index: 1
        explain: "Include Referenced Assets duplicates and retargets animation assets referenced by the input, for example sequences in an animation blueprint or blendspace."
      - q: "What replaced Retarget Profiles for state-driven changes (for example IsHoldingWeapon) inside one retarget asset?"
        choices: ["Override Sets, applied on the Retarget Pose From Mesh node", "A second IK Retargeter per state", "Anim Notifies", "Bone Filters"]
        answer_index: 0
        explain: "Override Sets define state-driven variations in a single retarget asset. They are assigned at runtime on the Retarget Pose From Mesh node and replace the former Retarget Profiles workflow."
    flavors:
      _default: {why: "Retargeting one clip is easy. Retargeting a whole library for many characters without hand fixes is the real skill."}
      animation: {why: "You will own the retargeter for every character in the project. It must be repeatable.", do: "Set a per-op LOD threshold so an expensive op is skipped at LOD 2 or higher, and show it."}
      tech_art: {why: "Batch export and override sets are pipeline tools. You will script them."}
      cinematics: {why: "Mocap on new characters goes through this retargeter before it reaches Sequencer."}

  - id: AQ34
    rank: 4
    difficulty: master
    track: animation
    subjects: [performance, animation-budget-allocator, uro, skeletal-mesh-lods, optimization]
    required_for_majors: [animation]
    taster_for_majors: []
    adjacent_for: [programming, tech_art]
    required_spine: false
    elective: false
    title: Animation budget for a crowd
    time_min: 150
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-budget-allocator-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-optimization-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/skeletal-mesh-lods-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/working-with-modular-characters-in-unreal-engine"
    checklist:
      - "Spawn 50 or more copies of BP_CrowdCharacter with an Animation Blueprint. Show stat unit and note the game thread time."
      - "In ABP_Crowd, enable Warn About Blueprint Usage (Class Settings > Optimization). Move Event Graph logic into a Thread Safe function with Property Access until the AnimGraph nodes show the Fast Path lightning icon."
      - "Enable the Animation Budget Allocator plugin. Set the Mesh Component Class to SkeletalMeshComponentBudgeted, turn on Auto Calculate Significance, and call Enable Animation Budget at Begin Play."
      - "Run with a.Budget.Debug.Enabled 1 and Stat > Advanced > AnimationBudgetAllocator. Screenshot the graph and the per-mesh overlay numbers."
      - "Add a.Budget.BudgetMs per quality level in Config/DefaultScalability.ini under [ViewDistanceQuality@0..3]. Test two levels."
      - "Open SK_CrowdCharacter, set Number of LODs to 4 and Apply Changes. Add Bones to Prioritize on the face or hands with a high Weight of Prioritization and Regenerate LOD."
      - "Compare stat unit before and after. Write the numbers down."
    done_when: "Screenshots of the budget graph with overlay, the Compiler Results with no Blueprint usage warnings, the LOD settings, and a before/after stat unit table. Add 5 lines on what gave the biggest win and one thing you would not do on a hero character."
    xp: 250
    verify_type: writeup
    quiz:
      - q: "Which three optimizations does the Animation Budget Allocator apply when it is over budget?"
        choices: ["Stops ticking some components in favor of a Leader Pose Component, lowers update rate, and chooses whether to interpolate", "Reduces LOD, lowers texture quality, and disables notifies", "Disables root motion, physics and morph targets", "Removes bones, merges meshes and lowers frame rate"]
        answer_index: 0
        explain: "The page lists these three targeted areas: stop ticking components (favoring a Leader Pose Component), update at a lower rate, and choose whether or not to interpolate."
      - q: "What must the character's mesh component be for the budget allocator to manage it?"
        choices: ["A Static Mesh Component", "A SkeletalMeshComponentBudgeted component class", "A Poseable Mesh Component", "Any component with Tick disabled"]
        answer_index: 1
        explain: "You must set the mesh's Component Class to SkeletalMeshComponentBudgeted, or set it in C++ with SetDefaultSubobjectClass, then enable Auto Register with Budget Allocator."
      - q: "A mesh overlay shows the number 5 and the letter I. What does that mean?"
        choices: ["LOD 5 and inactive", "5 ms of work and idle", "5 bones and invisible", "It ticks every 5 frames and is interpolating between frames"]
        answer_index: 3
        explain: "The number is the update rate: 5 means the mesh ticks every five frames. I means interpolating between frames; Hi and Lo show whether expensive logic is running."
      - q: "What is the default value of a.Budget.BudgetMs?"
        choices: ["0.1", "2.5", "1.0", "16.6"]
        answer_index: 2
        explain: "a.Budget.BudgetMs defaults to 1.0 millisecond of skeletal mesh work. The example scalability ini scales it from 1.0 at quality 0 to 2.5 at quality 3."
      - q: "Where does Epic recommend setting the budget for each platform?"
        choices: ["In the Animation Blueprint Class Settings", "In scalability settings, for example DefaultScalability.ini under [ViewDistanceQuality@N]", "In the Skeletal Mesh asset LOD Info", "Hard-coded in BeginPlay"]
        answer_index: 1
        explain: "The page recommends driving the cvars from the platform scalability settings, with an example DefaultScalability.ini that sets a.Budget.BudgetMs per ViewDistanceQuality level."
      - q: "You set a.Budget.MinQuality to 0.5. What is the trade-off?"
        choices: ["No trade-off, it only affects the debug graph", "Interpolation is disabled", "The system may go over its time budget to keep enough components ticking", "All meshes drop to LOD 1"]
        answer_index: 2
        explain: "MinQuality is NumComponentsTickingThisFrame divided by NumComponentsThatWeNeedToTick. If it is not 0.0, the allocator can potentially go over the time budget."
      - q: "What happens to Update Rate Optimization (URO) when a component registers with the budget allocator?"
        choices: ["URO is disabled and the budgeter controls the tick rate", "URO runs at double speed", "URO must be enabled first", "Nothing changes"]
        answer_index: 0
        explain: "RegisterComponent disables the default tick function and disables URO, and re-routes the parallel anim tasks to the budgeter."
      - q: "Per the Animation Optimization page, what is generally the most expensive part of an Animation Blueprint?"
        choices: ["The Output Pose node", "Blend Space evaluation", "Anim notify states", "The Event Graph logic, which runs each tick on the Game Thread"]
        answer_index: 3
        explain: "The Event Graph is evaluated every Tick sequentially on the Game Thread. Moving that logic into Thread Safe functions lets it run on worker threads."
      - q: "A Blend Space node lost its lightning icon after you added a Multiply on the input float. Why?"
        choices: ["The Blend Space asset is corrupt", "Any Blueprint logic on the pin stops Fast Path, so the node now calls into the Blueprint VM", "Multiply is not thread safe", "The lightning icon only shows in Debug builds"]
        answer_index: 1
        explain: "Fast Path copies member variables directly. If any calculation is added, the node can no longer use Fast Path and the icon is removed after compile."
      - q: "Why can a character with root motion driving movement not use parallel animation updates?"
        choices: ["Character movement is not multi-threaded, so the update must run on the game thread", "Root motion is always on the render thread", "Root motion needs a Leader Pose Component", "Parallel updates only work with URO"]
        answer_index: 0
        explain: "The page says that if root motion is required for character movement, the parallel update cannot be performed because character movement is not multi-threaded."
      - q: "The LOD generator removed the detail on the hands. What is the documented fix?"
        choices: ["Add the hand bones to Bones to Prioritize with a high Weight of Prioritization, then Regenerate LOD", "Enable Volumetric Correction", "Import LOD 0 again", "Lower the Termination Criterion to 0"]
        answer_index: 0
        explain: "Bones to Prioritize keeps geometry skinned to those bones from being optimized. The page uses a high weight like 5,000 and then Regenerate LOD."
      - q: "The team wants the cheapest modular crowd character on the game thread and accepts no physics. Which method does the modular characters page rank lowest on game thread cost?"
        choices: ["Copy Pose from Mesh", "Skeletal Mesh Merge", "Leader Pose Component", "Separate Animation Blueprints per part"]
        answer_index: 2
        explain: "The chart shows Leader Pose Component with minimum setup and game thread cost, but high render thread cost and no physics. Skeletal Mesh Merge has low render cost but more setup."
    flavors:
      _default: {why: "Fifty animated characters can eat a frame. A master knows how to spend milliseconds on purpose."}
      animation: {why: "You must ship crowds that still look alive. The budget allocator decides who gets the frames.", do: "Set bNeverSkip or Always Tick on the player mesh and prove in the overlay that it stays at rate 1 under load."}
      programming: {why: "Thread safe updates and the budgeter API are your side of the deal."}
      tech_art: {why: "LOD settings and scalability ini files are tools you will maintain."}

  - id: AQ35
