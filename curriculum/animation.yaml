    required: false
    title: "RigidBody node: ponytails and chains"
    brief: "Secondary motion is the movement of parts that hang from a character, such as a ponytail, a chain or a tail. They swing and lag behind when the character moves, and this makes the character feel heavy and fast. The RigidBody node is an AnimGraph node that simulates such parts with physics at a low cost, and it also handles collision with the body. In this quest you make a small Physics Asset for a hanging part and simulate it with the RigidBody node."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-blueprint-rigid-body-in-unreal-engine"
