  - id: AQ45
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [animation-blueprint, property-access, thread-safe, performance]
    required_spine: false
    required: false
    title: "Thread-safe Anim Instance: property access and node functions"
    brief: "A game does its work on several threads, which are lines of work that run at the same time. Normal Blueprint logic runs on the main Game Thread, so animation logic placed there slows the whole game when there are many characters. Thread safe animation logic is allowed to run on other threads. In this quest you move the update logic of an Animation Blueprint into a thread safe function, read values with Property Access nodes, and check that your nodes use the Fast Path, the cheapest way for a node to get its values."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/graphing-in-animation-blueprints-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-optimization-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-get-animation-variables-in-animation-blueprints-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Duplicate the Animation Blueprint that the character uses (ABP_Unarmed in the current template, ABP_Manny or ABP_Quinn in older versions), name the copy ABP_ThreadSafe, and set it as the Anim Class of the Mesh in BP_ThirdPersonCharacter. Its Event Graph already has update logic that you will replace. Open it. In the My Blueprint panel, go to Functions, open the Override dropdown, and choose Blueprint Thread Safe Update Animation."
      - "Create a function named UpdateMovement and enable Thread Safe in its Details panel. Inside the function, add a Property Access node and bind it to this path: Try Get Pawn Owner, then Get Movement Component, then Velocity."
      - "From the velocity, use Vector Length XY and promote the result to a variable named Speed. Make a bool variable named ShouldMove that is true when Speed >= 0.1. Also read IsFalling into a bool variable."
      - "Call UpdateMovement from Blueprint Thread Safe Update Animation. Then delete the old Update Animation event logic from the Event Graph."
      - "Select a Blendspace Player or Sequence Player node inside the state machine, or an Aim Offset node if your Animation Blueprint has one. In its Details panel, under Functions, bind On Update to a new function. Open the function and look at its Context and Node pins: the function runs each time this node updates, and it is the place to set values for this one node, such as the Yaw and Pitch of an Aim Offset."
      - "Enable Warn About Blueprint Usage in Class Settings and compile. Fix every warning until the lightning icon, which means Fast Path, shows on your blend nodes."
    done_when: "Send a screenshot of the Thread Safe function graph with the Property Access node, a screenshot of the Blueprint Thread Safe Update Animation graph that calls it, and a screenshot of the Compiler Results with no Blueprint Usage warnings."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "By default, on which thread does the AnimGraph run, and on which does the Event Graph run?"
        choices: ["Both on the Game Thread", "AnimGraph on the Game Thread, Event Graph on the Worker Thread", "AnimGraph on the Worker Thread, Event Graph on the Game Thread", "Both on the Worker Thread"]
        answer_index: 2
        explain: "The AnimGraph runs on a separate Worker Thread. The Event Graph and other Blueprints run on the Game Thread."
      - q: "Why do the docs recommend using the Event Graph as little as possible?"
        choices: ["It cannot use variables", "It runs on the Game Thread with all other Blueprint logic, so complex logic there lowers performance", "It does not support events", "It is removed in cooked builds"]
        answer_index: 1
        explain: "The Event Graph executes on the primary Game Thread. Most events have thread-safe alternatives that should be used instead."
      - q: "How do you add Blueprint Thread Safe Update Animation to an Animation Blueprint?"
        choices: ["Right-click the AnimGraph and add it as a node", "Enable it in Class Settings", "Drag it from the Content Browser", "Use the Override dropdown in the Functions category of My Blueprint"]
        answer_index: 3
        explain: "It is a function you must override from the Override dropdown in the Functions section of the My Blueprint panel."
      - q: "A node function is bound to On Become Relevant. When does it run?"
        choices: ["Once only, the first time the node is relevant", "Every tick while relevant", "Each time the node becomes relevant, including after being blended off and on again", "Only when the graph compiles"]
        answer_index: 2
        explain: "On Become Relevant re-executes every time the node becomes relevant again. On Initial Update runs only once."
      - q: "What is the default Call Site for a Property Access, and what do the docs advise?"
        choices: ["Game Thread; change it to Thread Safe", "Automatic; leave it in most cases", "Worker Thread (Post-Event Graph); change it to Automatic", "Thread Safe; change it to Game Thread"]
        answer_index: 1
        explain: "Automatic picks the call site from context and thread safety. The docs say to leave it as Automatic in most cases."
      - q: "A custom function is to be used from the Property Access menu. What must be true?"
        choices: ["It must be Pure and have a Return Node with a ReturnValue output", "It must have an exec pin", "It must be a macro", "It must run on the Game Thread"]
        answer_index: 0
        explain: "Property access functions must be Pure and return their value through a ReturnValue pin on a Return Node."
      - q: "After adding a Multiply node between a float variable and a Blend Space input, the lightning icon disappears. Why?"
        choices: ["The variable is now private", "The node no longer uses Fast Path because Blueprint logic is executed", "The Blend Space needs recompiling", "The value is now on the Game Thread"]
        answer_index: 1
        explain: "Fast Path copies member variables directly. Any calculation in the AnimGraph means a call into the Blueprint VM, so Fast Path is lost and the icon goes away."
      - q: "Which Class Settings option makes the compiler warn when the AnimGraph calls into the Blueprint Virtual Machine?"
        choices: ["Use Multi Threaded Animation Update", "Propagate Notifies to Linked Instances", "Root Motion Mode", "Warn About Blueprint Usage"]
        answer_index: 3
        explain: "Warn About Blueprint Usage emits warnings in Compiler Results for each call into the Blueprint VM from the AnimGraph."
    flavors:
      _default: {why: "Thread-safe animation logic is how a game keeps its frame rate with many characters."}
      animation: {why: "Moving your update logic off the Game Thread is the first optimization Epic asks for.", do: "Open Animation Insights and compare the Game Thread cost before and after the move."}

