      - q: "What does double-clicking a Linked Anim Graph node do?"
        choices: ["Compiles the linked Blueprint", "Opens the linked Animation Blueprint asset if one is assigned", "Collapses the node", "Adds an Input Pose"]
        answer_index: 1
        explain: "Double-clicking a Linked Anim Graph node opens the linked Animation Blueprint if an Instance Class is assigned."
