      - q: "In the Physics Asset Editor, what is the No Gravity simulation option useful for?"
        choices: ["Making the ragdoll fall faster", "Baking the ragdoll to an animation", "Finding interpenetrating bodies or constraints already outside their limits by poking them with Ctrl+click", "Deleting all constraints"]
        answer_index: 2
        explain: "No Gravity simulates the whole asset without gravity. You can Ctrl+click to poke bodies and see problems such as overlapping bodies."
      - q: "You enable Selected Simulation with the shoulder body selected. What simulates?"
        choices: ["Only the shoulder", "The whole body", "The shoulder and every body below it in the hierarchy, so the whole arm", "Nothing until you press Play"]
        answer_index: 2
        explain: "Selected Simulation simulates the selected bodies and those down the hierarchy. Selecting the shoulder simulates the entire arm."
      - q: "Which shapes can a Physics Body use?"
        choices: ["Boxes, spheres, capsules or convex hulls", "Only the full triangle mesh", "Only spheres", "Only boxes"]
        answer_index: 0
        explain: "Physics Bodies are simplified shapes: boxes, spheres, capsules, or convex hulls. They are used instead of the detailed render mesh for simulation."
