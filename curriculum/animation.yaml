    required_spine: false
    required: false
    title: "Backwards Solve: bake an animation onto your rig"
    brief: "Normally a Control Rig works forwards: you move the controls and the bones follow. This is called Forwards Solve. Backwards Solve is the opposite direction, where the bones of an existing animation move the controls. With it you can bake an animation onto a rig, which means the animation is copied to keys on the controls, and then you can edit the motion inside Unreal. In this quest you add a Backwards Solve to a rig, bake a walk animation onto it in Sequencer, and change one key."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/control-rig-forwards-solve-and-backwards-solve-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/control-rig-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-create-control-rigs-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/controls-bones-and-nulls-in-control-rig-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a Control Rig that drives the arms and the head of the mannequin with FK controls. If you have none, make one: right-click SKM_Manny_Simple, choose Create, then Control Rig, and name it CR_Manny_FK."
      - "If you made a new rig, add its controls. In the Rig Hierarchy, select the upper arm, lower arm and hand bones of both arms and the head bone. Right-click and choose New, then Add Controls For Selected."
      - "In the graph of the new rig, add a Set Transform node for each bone and connect a Get Transform node of its control to it. Connect the Set Transform nodes in a chain that starts at Forwards Solve."
      - "Right-click the graph, open Events and add Backwards Solve. For each control, connect a Get Transform node of its bone to a Set Transform node of the control."
      - "In the toolbar, switch Solve Direction to Backwards Solve. In Preview Scene Settings, set Preview Controller to Use Specified Animation and pick a walk animation."
      - "Confirm that the border of the viewport is yellow and that the controls follow the animation. Then try the option Backwards and Forwards, and note the blue border."
      - "Create a Level Sequence named LS_BakeTest. Drag SKM_Manny_Simple into the level, add this actor to the sequence, and add the same walk animation to its Animation track."
      - "Right-click the character track, choose Bake To Control Rig, and pick your rig. Enable Reduce Keys with a Tolerance of 0.1, and click Create."
      - "Move one baked key on an arm control to change the walk. Move the playhead through the sequence to see the change."
    done_when: "Send two screenshots. The first shows the Control Rig editor in Backwards Solve mode with the yellow border and the controls matching the animation. The second shows Sequencer with the Control Rig track, the baked keys, and one edited key on an arm control."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "What does Backwards Solve do?"
        choices: ["Plays the animation in reverse", "Drives the controls from the skeleton bones", "Drives the bones from the controls", "Resets the rig to its Initial pose"]
        answer_index: 1
        explain: "Backwards Solve is the inverse of Forwards Solve: bones affect controls. It is used to bake animation onto a Control Rig."
      - q: "Your rig does not appear in the Bake To Control Rig menu in Sequencer. What is the most likely reason?"
        choices: ["The rig has no Construction Event", "The rig has no Backwards Solve node in its graph", "The rig uses too many controls", "Reduce Keys is disabled"]
        answer_index: 1
        explain: "A Control Rig without a Backwards Solve node cannot be selected in the Bake To Control Rig menu."
      - q: "How do you see your controls follow a playing animation while previewing Backwards Solve?"
        choices: ["Enable Debug Mode", "Open the Execution Stack", "In Preview Scene Settings set Preview Controller to Use Specified Animation and pick an animation", "Drag the animation into the Rig Graph"]
        answer_index: 2
        explain: "The page says to set Preview Controller to Use Specified Animation and choose an animation, then the controls match it."
      - q: "The Control Rig viewport shows a yellow border. Which mode is active?"
        choices: ["Construction Event", "Backwards and Forwards", "Forwards Solve", "Backwards Solve"]
        answer_index: 3
        explain: "Backwards Solve shows a yellow border, Construction Event a red one, and Backwards and Forwards a blue one."
      - q: "What is the Backwards and Forwards preview mode for?"
        choices: ["Debugging the bake process by running Backwards Solve then Forwards Solve", "Doubling the frame rate", "Playing the animation forward and then backward", "Exporting the rig to FBX"]
        answer_index: 0
        explain: "It runs Backwards Solve then Forwards Solve, which mimics the bake process so you can check bones and controls."
      - q: "In the bake dialog, what does a higher Tolerance value do when Reduce Keys is enabled?"
        choices: ["Keeps more keyframes", "Allows more deviation from the original, so more keys are removed", "Slows the bake", "Bakes in world space"]
        answer_index: 1
        explain: "Higher Tolerance lets the filtered curve deviate more from the original, which removes more keyframes."
      - q: "A post-process Animation Blueprint effect needs time to settle before baking. Which option helps?"
        choices: ["Export Curves", "Record in World Space", "Warm Up Frames", "Evaluate All Skeletal Mesh Components"]
        answer_index: 2
        explain: "Warm Up Frames sets how many frames are evaluated before the bake, so post-process effects can settle."
      - q: "Which event runs once at post-initialization and is where Spawn nodes for procedural rig elements work?"
        choices: ["Forwards Solve", "Backwards Solve", "Construction Event", "Pre Initialize"]
