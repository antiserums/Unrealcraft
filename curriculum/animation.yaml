        explain: "The Rewind Debugger is built on Animation Insights. Enable that plugin and restart the editor."
      - q: "Where do you open the Rewind Debugger window?"
        choices: ["Window > Pose Watch Manager", "Edit > Project Settings", "Tools > Debug > Rewind Debugger", "Window > Anim Slot Manager"]
