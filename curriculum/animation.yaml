    brief: "When a character's pose looks wrong, you need to find which node in the AnimGraph caused it. Unreal has tools for this, so you do not have to guess. A Pose Watch draws the pose at one node as a colored skeleton in the viewport. The Rewind Debugger records the game, so you can go back in time and see what the Animation Blueprint was doing on each frame. In this quest you use both tools and two console commands."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-rewind-debugger-in-unreal-engine"
