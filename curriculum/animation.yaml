  - id: AQ66
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [ik, two-bone-ik, foot-ik, animation-blueprint]
    required_spine: false
    required: false
    title: "Two Bone IK: a foot that finds the step"
    brief: "When a character stands on stairs or on a slope, a normal animation puts both feet at the same height, so one foot sinks into the ground or floats in the air. Two Bone IK is a simple node that fixes this. It moves the end of a chain of three bones, such as thigh, calf and foot, to a point you give it, and bends the middle joint to fit. In this quest you find the floor under the foot with a line trace, which is an invisible ray that reports what it hits, and you place the foot there."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-blueprint-two-bone-ik-in-unreal-engine"
    backup_url: null
    extra_urls: []
    checklist:
      - "Open a project made from the Third Person template, or create one. In the Animation Blueprint of the Third Person character, add a Two Bone IK node after the locomotion logic. Set IK Bone to foot_l. The node builds its chain from the two bones above: calf_l is the joint and thigh_l is the root."
      - "Turn on Enable Debug Draw. In the preview, move the Effector Location, shown in red, and the Joint Target Location, shown in green. Watch the knee point toward the green target."
      - "Set Effector Location Space to World. In the Event Graph, do a Line Trace from foot_l down to the floor, and store the hit location in a Vector variable named FootTarget_L. Connect this variable to Effector Location."
      - "Select the Two Bone IK node. In its Details panel, set Joint Target Location Space to Bone Space and choose calf_l as the Joint Target bone. Then type a small value, for example 30, into one axis of Joint Target Location and watch the green target in the preview. Use the axis that moves the green target in front of the knee, so that the knee bends forward in a natural way."
      - "Place BP_ThirdPersonCharacter on a low step or a slope and press Play. Add a Float variable named FootAlpha and connect it to the Alpha of the node, so that you can blend the effect off."
      - "Enable Allow Stretching with Start Stretch Ratio 0.9 and Max Stretch Scale 1.2. Move the target too far away and note how the leg stretches."
      - "Do the same for foot_r. You can also duplicate the setup and rename the variables."
    done_when: "Send a screenshot of the AnimGraph with the Two Bone IK node or nodes and the Details panel. Also send a screenshot in Play mode with the character standing on a slope or step, with one foot placed lower than the other."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You set IK Bone to foot_l. How does the node build the two-bone chain?"
        choices: ["It uses foot_l and its child", "It takes the first parent as the joint and the second parent as the root", "It uses the pelvis as root always", "You must set root and joint by hand"]
        answer_index: 1
        explain: "From the IK Bone the node looks two bones up: the first parent becomes the joint and the second parent becomes the root of the chain."
      - q: "What does the Joint Target Location control?"
        choices: ["The end bone position", "The root bone position", "The middle joint, so it controls the bend direction of the chain", "The stretch limit"]
        answer_index: 2
        explain: "Joint Target Location sets the location the chain's middle joint aims at, which controls how the limb bends."
      - q: "With Enable Debug Draw on, what colors mark the effector and the joint target?"
        choices: ["Effector red, joint target green", "Effector green, joint target red", "Both blue", "Effector yellow, joint target white"]
        answer_index: 0
        explain: "The page says the Effector Location is drawn as a red object and the Joint Target Location as a green object."
      - q: "Start Stretch Ratio is 0.9. What does that mean?"
        choices: ["The limb stretches 90% longer", "The alpha is 0.9", "The limb shortens by 10%", "Stretching starts once the chain reaches 90% of its full length"]
        answer_index: 3
        explain: "Start Stretch Ratio is the threshold: at 0.9 the chain begins to stretch when it reaches 90% of the whole limb length."
      - q: "Max Stretch Scale of 1.5 lets the limb stretch to what length?"
        choices: ["50% of its length", "150% of its whole length", "1.5 cm more", "Unlimited"]
        answer_index: 1
        explain: "Max Stretch Scale limits the stretch. 1.5 means the limb can stretch until 150% of its whole length."
      - q: "Which Effector Location Space options exist on the node?"
        choices: ["Local, Global", "World, Actor, Level", "Component, Socket", "World, Component, Parent Bone, Bone"]
        answer_index: 3
        explain: "The effector position can be calculated in World Space, Component Space, Parent Bone Space or Bone Space of the Effector Target."
      - q: "When can Take Rotation from Effector Space be used?"
        choices: ["Only with World Space", "Only with Component Space", "When Effector Location Space is Parent Bone Space or Bone Space", "Always"]
        answer_index: 2
        explain: "That option applies the effector's rotation to the IK bone, and it is available when the space is Parent Bone Space or Bone Space."
      - q: "You disabled Allow Twist. What extra setting should you now set?"
        choices: ["The Twist Axis the bone is aligned to", "Max Iterations", "Effector Target", "Alpha Scale Bias"]
        answer_index: 0
        explain: "When Allow Twist is disabled you specify which axis the bone is aligned to in Twist Axis, optionally in local space."
    flavors:
      _default: {why: "Feet that sink into stairs break the illusion instantly. Two Bone IK is the cheapest fix."}
      animation: {why: "Understanding effector and joint target is the base of every limb IK you will tune later.", do: "Add a second trace for the pelvis and lower the hips so the high foot does not lock straight."}
      gameplay_design: {why: "Foot planting on slopes is a feel feature players notice without knowing why.", do: "Test on a 30 degree slope and a 25 cm step and note which alpha felt right."}

  - id: AQ67
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [ik, ccdik, fabrik, animation-blueprint]
    required_spine: false
    required: false
    title: "CCDIK and FABRIK: press the button"
    brief: "CCDIK and FABRIK are two IK solvers for chains of many bones, such as a whole arm from the shoulder to a fingertip, or a tail. They bend the chain so that its tip reaches a point. CCDIK can also limit how far each joint may rotate, which stops the chain from folding in ways a real body cannot. In this quest you make the character press a button with the index finger using CCDIK, and then compare the result with FABRIK."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-blueprint-ccdik-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/fabrik-animation-blueprint-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make an actor named BP_Button: a small box with a Scene component named PressPoint on top of it. Place it at hand height near the player start."
      - "In the AnimGraph of the Animation Blueprint of the Third Person character, convert the pose to component space, add a CCDIK node, and then convert back to local space before Output Pose."
      - "On the CCDIK node, set Tip Bone to index_03_l and Root Bone to clavicle_l. Set Effector Location Space to World Space, as in the example from the documentation."
      - "Add a Vector variable named ButtonLocation and a Float variable named PressAlpha. When the player overlaps BP_Button, set ButtonLocation to the world location of PressPoint. Connect both variables to the node."
      - "Turn on Enable Rotation Limit and open Rotation Limit Per Joints. Set limits on the first indices so that the finger and the wrist do not fold backwards."
      - "Duplicate the setup with a FABRIK node that has Tip Bone hand_l and Root Bone clavicle_l. Compare the shape of the arm with CCDIK for the same target, and write the difference in one line."
      - "On both nodes, compare Max Iterations 2 with 10, and Precision 1 with 0.1. Write down which values looked good enough."
    done_when: "Send a screenshot of the AnimGraph with the space conversion nodes and the Details of the CCDIK node, showing Tip, Root and the rotation limits. Also send a screenshot in Play mode of the character touching the button with the index finger. Add two lines that compare CCDIK and FABRIK on your arm."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What does CCDIK offer that FABRIK does not, per the source?"
        choices: ["Two-bone stretching", "World space effectors", "Lower cost", "Angular constraints to limit the rotation of affected bones"]
        answer_index: 3
        explain: "CCDIK is similar to FABRIK but adds the ability to define angular constraints per joint."
      - q: "Why do you need conversion nodes around CCDIK in the AnimGraph?"
        choices: ["Because CCDIK operates in Component Space", "Because it needs a cached pose", "Because it only works on the root bone", "Because it outputs a montage"]
        answer_index: 0
        explain: "The CCDIK node operates within Component Space, so a space conversion is needed to use it in the character's Animation Blueprint."
      - q: "In the button example, which bones are Tip and Root?"
        choices: ["Tip hand_l, Root pelvis", "Tip clavicle_l, Root index_03_l", "Tip index_03_l, Root clavicle_l", "Tip head, Root spine_01"]
        answer_index: 2
        explain: "The example sets the Tip Bone to the left index finger index_03_l and the Root Bone to the left clavicle."
      - q: "In Rotation Limit Per Joints, which joint does Index 0 apply to?"
        choices: ["The joint next to the Root Bone", "The Root Bone itself", "The joint directly connected to the Tip Bone", "All joints at once"]
        answer_index: 2
        explain: "The starting Index applies to the joint directly connected to the Tip Bone and works up the chain to the joint adjacent to the Root Bone."
      - q: "What are the default values the page calls suitable for most projects for Precision and Max Iterations on CCDIK?"
        choices: ["Precision 1, Max Iterations 10", "Precision 0, Max Iterations 100", "Precision 10, Max Iterations 1", "Precision 0.5, Max Iterations 50"]
        answer_index: 0
        explain: "The page says Precision 1 is the default and most commonly best, and Max Iterations 10 is suitable for most projects."
      - q: "What does Alpha 0 do on the CCDIK node?"
        choices: ["Outputs the fully solved pose", "Outputs the source pose with no IK", "Hides the debug lines", "Resets the limits"]
        answer_index: 1
        explain: "Alpha blends the solved motion: 1 uses the generated output pose fully, 0 outputs the source pose."
      - q: "What is the minimum chain length for FABRIK?"
        choices: ["Exactly 2 bones", "At least 2 bone links, any length above that", "At least 3 bones", "At least 4 bones"]
        answer_index: 1
        explain: "FABRIK operates on a chain of arbitrary length as long as there are at least 2 bone links."
      - q: "On FABRIK, what happens when you lower the Precision value?"
        choices: ["The tip lands closer to the effector but the evaluation costs more", "The chain gets shorter", "The solver runs fewer iterations", "The alpha is ignored"]
        answer_index: 0
        explain: "Precision is the tolerance for the final tip location. Lower tolerance is more precise but has a higher performance cost."
    flavors:
      _default: {why: "Chain solvers let a finger or a tail reach any point. Knowing when to add limits is the real skill."}
      animation: {why: "CCDIK limits are how you stop a reaching arm from breaking the elbow.", do: "Add a limit on the elbow index so it only bends on one axis."}
      tech_art: {why: "Precision and iterations are the cost dials for every chain IK in your AnimBP.", do: "Note the iteration count where the finger stops visibly improving."}

  - id: AQ68
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [retargeting, ik-retargeter, retarget-pose, auto-align]
    required_spine: false
    required: false
    title: "Retarget poses: A-pose meets T-pose"
    brief: "Every skeleton has a reference pose, the pose in which the character was built. Some characters stand in an A-pose, with the arms pointing down at an angle, and others in a T-pose, with the arms straight out to the sides. When you retarget animation between two characters with different reference poses, the arms and shoulders come out wrong. A retarget pose fixes this by storing small rotations that make the two poses match. In this quest you create and align a retarget pose and use it in the op stack of an IK Retargeter."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/ik-rig-animation-retargeting-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/auto-retargeting-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/retargeting-operation-stack-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Pick a source character (the UE5 Mannequin, which is in an A-pose) and a target character with a different reference pose, for example your own character or a free T-pose character from Fab, Epic's asset store. Make an IK Rig for each with Auto Create Retarget Chains, and create an IK Retargeter named RTG_PoseFix."
      - "Click Edit Retarget Pose in the toolbar. With Target selected, click Create (+), then Create, and name the new pose Target_Aligned. Do not edit the Default Pose."
      - "Open Auto Align and choose Align All Bones with Alignment Method set to Direction. Then click Snap Character to Ground. After that, try Mesh as the method on the arms only, with Align Selected and Children, and compare."
      - "Turn on Edit Mode and fix one bone by hand. In the Details panel, type 0, 0, 0 to send the bone back to the reference pose, and then set a small value. Drag Retarget Pose Blend between 0 and 1 to see your changes."
      - "Create a second pose with Create (+), then Import from Animation Sequence, using frame 0 of an idle animation. Export one pose with Export Pose Asset."
      - "In the Op Stack, add a Retarget Pose op at the top, with Override Target Pose set to Target_Aligned. Then add an Additive Pose op at the bottom, with a small Alpha and a pose that you made."
      - "Run the retarget and preview 3 animations. Write down which alignment method gave the best shoulders."
    done_when: "Send screenshots of the target in Edit Retarget Pose mode after Auto Align, of the Retarget Pose Blend slider, and of the Op Stack with Retarget Pose first. Add three lines that give the names of the poses you created, the alignment method you kept, and what the Additive Pose op changed."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "When does the source say you typically need to edit a retarget pose?"
        choices: ["When both characters have the same bone names", "When the target reference pose differs from the source, for example T-pose vs A-pose", "Every time you export", "Only for quadrupeds"]
        answer_index: 1
        explain: "Reference pose differences, like a T-pose target and an A-pose source, reduce accuracy. Matching the retarget poses fixes this."
      - q: "What does the page recommend instead of editing the Default Pose?"
        choices: ["Editing the skeleton asset", "Re-importing the mesh", "Changing the Preview Mesh", "Creating a new retarget pose with Create (+) > Create"]
        answer_index: 3
        explain: "You can edit Default Pose, but the page recommends creating new retarget poses for adjustments."
      - q: "In the Details panel, what does a rotation of 0, 0, 0 mean for a bone in a retarget pose?"
        choices: ["The bone is deleted", "The bone is locked", "The bone returns to its reference pose", "The bone matches the source"]
        answer_index: 2
        explain: "Retarget poses are numeric offsets. A rotation value of 0, 0, 0 returns the bone to its reference pose."
      - q: "What does Retarget Pose Blend at 0 show?"
        choices: ["The current retarget pose", "The skeletal mesh default reference pose", "The source animation", "An empty viewport"]
        answer_index: 1
        explain: "0 shows the default reference pose and 1 shows the current retarget pose, so you can preview which bones you changed."
      - q: "Which Auto Align method uses the vertices weighted to a bone to find its direction?"
        choices: ["Direction", "Local Rotation Axes", "Global Rotation Axes", "Mesh"]
        answer_index: 3
        explain: "Mesh generates a direction vector from the principal axis of the vertices skinned to the bone. Direction uses the chain hierarchy instead."
      - q: "What does Import from Animation Sequence use by default?"
        choices: ["Frame 0 of the sequence", "The last frame", "The average pose", "A random frame"]
        answer_index: 0
        explain: "Sequence Frame defaults to 0, which uses the first frame of the animation as the imported retarget pose."
      - q: "Where must the Retarget Pose op sit in the Op Stack?"
        choices: ["Last", "Anywhere", "First, and only one copy is allowed", "Inside Run IK Rig"]
        answer_index: 2
        explain: "Retarget Pose must be the first op to work as expected, and an asset can only use one copy of this op."
      - q: "What does the Additive Pose op do?"
        choices: ["Replaces the whole retarget result", "Adds a retarget pose on top of the retargeted result, blended by Alpha", "Imports a Pose Asset", "Aligns the source to the target"]
        answer_index: 1
        explain: "Additive Pose applies a named retarget pose additively on the target output for layered corrections, with an Alpha to blend it."
    flavors:
      _default: {why: "Most bad retargets are a pose mismatch, not a chain problem. Fix the base pose first."}
      animation: {why: "Auto Align gets you 90 percent, hand edits get the shoulders right.", do: "Export your aligned pose as a Pose Asset and reuse it in a second retargeter."}
      cinematics: {why: "Shot characters from many sources arrive in different rest poses. This is the fix.", do: "Align a second target character and compare how many hand edits it needed."}

  - id: AQ69
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [retargeting, ik-retargeter, op-stack, chains]
    required_spine: false
    required: false
    title: "Chain settings: FK Chains, pole vectors and stretch"
    brief: "An IK Retargeter copies animation from one character to another through a list of operations, called ops. The most important op is FK Chains, which copies the rotations of each chain of bones, such as an arm or a finger. Its settings decide how the limbs look on a target character that has different body proportions. In this quest you try the rotation and translation modes of FK Chains, and add ops that correct the knee direction, the arm length and the root motion."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/retargeting-operation-stack-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/ik-rig-animation-retargeting-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open an IK Retargeter between two two-legged characters with different proportions, or make a new one. Manny and Quinn from the template work, because their bodies have different proportions: create an IK Rig for SKM_Manny_Simple and one for SKM_Quinn_Simple, use Auto Create Retarget Chains in each, and create an IK Retargeter with Manny as the source and Quinn as the target. Click Add Default Ops and write down the ops that appear."
      - "Select FK Chains. Use Map All (Fuzzy), and then Hide Mapped Chains to see which chains are left without a match. Fix every unmapped chain by hand."
      - "Select the LeftArm chain. Switch Rotation Mode between Interpolated and One to One while an animation in which the arms move plays. Then do the same on a finger chain. Note which mode fits each chain better."
      - "On the Spine chain, set Translation Mode to Globally Scaled, then to Absolute, and then back to None. Note what looked broken."
      - "Add a Pole Vector Alignment op below FK Chains. On LeftLeg, set Align Alpha to 1 and try a Static Angular Offset of 15. Watch the knee."
      - "Add a Stretch Chains op. On the arm chains, set Match Source Length to 1, and then set Scale Chain Length to 1.1. Compare the position of the wrists."
      - "Select Pelvis Motion and set Scale Vertical to 0.8. Then, on Root Motion, switch Root Motion Source between Copy From Source Root and Generate From Target Pelvis. Turn on Draw Chain Lines in the debug settings of FK Chains for your final screenshot."
    done_when: "Send screenshots of the Op Stack with the ops you added, of the FK Chains chain list with the mapping filters, and of the viewport with the chain debug lines turned on. Add four lines: the rotation mode you used for arms and for fingers, the translation mode you kept and why, the pole vector offset you used, and which root motion source you chose."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Which FK Chains Rotation Mode is best when the target chain has a different number of bones than the source?"
        choices: ["One to One", "One to One Reversed", "Interpolated", "None"]
        answer_index: 2
        explain: "Interpolated normalizes both chains by length and samples the source rotation at the same normalized distance, which fits chains with different bone counts or proportions."
      - q: "Why is One to One usually the best Rotation Mode for fingers?"
        choices: ["Bone counts usually match, and each source bone copies to the equivalent target bone in order", "Fingers have no rotation", "It ignores the reference pose", "It is the only mode that works on small bones"]
        answer_index: 0
        explain: "One to One copies each bone in order from the chain root. It is the best choice when the source and target chains have the same number of bones, which is typical for fingers."
      - q: "In One to One mode the target chain has more bones than the source. What happens to the extra bones?"
        choices: ["They are deleted", "They stay at their reference pose", "They copy the last source bone", "The op fails"]
        answer_index: 1
        explain: "If the target chain has more bones than the source, the extra bones remain at their reference pose."
      - q: "Which Translation Mode does the page say is the best option in most cases?"
        choices: ["None", "Absolute", "Globally Scaled", "Stretch Bone Length Uniformly"]
        answer_index: 0
        explain: "None keeps bone translations at their reference pose. The page says in most cases this is the best option to choose."
      - q: "Map All (Exact) finds no identical name for a chain. What does it do?"
        choices: ["Maps to the closest name", "Maps to Root", "Does not change that chain's mapping", "Deletes the chain"]
        answer_index: 2
        explain: "The Exact mapping options only map chains with identical names and do not change the mapping when no exact match is found. Fuzzy maps to the closest name."
      - q: "What does Pole Vector Alignment change on a limb?"
        choices: ["The position of the hand or foot", "The chain length", "The pelvis height", "The twist of the chain so the knee or elbow bends in the source direction, without moving the end effector"]
        answer_index: 3
        explain: "Pole Vector Alignment matches the limb's bend direction to the source by twisting the joint chain, without altering the end effector location."
      - q: "Match Source Length is 0 and Scale Chain Length is 1 on a Stretch Chains op. What is the result?"
        choices: ["The chain doubles", "The chain is stretched to the source length", "The chain length is left alone", "The chain collapses"]
        answer_index: 2
        explain: "At 0, Match Source Length leaves the chain length alone, and Scale Chain Length 1 is the default multiplier. These are the defaults."
      - q: "Root Motion Source is Copy From Source Root. How is the motion adjusted?"
        choices: ["Not at all, it is copied exactly", "It is scaled according to the relative height difference", "It is generated from the target pelvis", "It is snapped to the ground only"]
        answer_index: 1
        explain: "Copy From Source Root copies the root bone motion but scales it by the relative height difference between characters. Generate From Target Pelvis builds it from the retargeted pelvis instead."
    flavors:
      _default: {why: "FK Chains is where a retarget is won or lost. Rotation and translation modes decide how limbs read."}
      animation: {why: "Knowing Interpolated vs One to One saves hours of fixing broken fingers and arms.", do: "Retarget one clip with fingers in Interpolated and one in One to One and keep both for comparison."}
      tech_art: {why: "Per-op LOD thresholds and debug lines make the retargeter a profiling tool too.", do: "Set an LOD threshold on Pole Vector Alignment and confirm it stops running at that LOD."}

  - id: AQ70
    rank: 2
