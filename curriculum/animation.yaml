  - id: AQ21
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [animation, root-motion, character-movement]
    required_spine: false
    required: true
    title: "Root motion vs in-place"
    brief: "Some animations move the character forward by moving the root bone, the first bone of the skeleton. This is called root motion. Other animations are in-place: the character walks on the spot and the movement code moves it through the level. The choice decides who moves the character, the animation or the code. In this quest you look at the root bone of a moving animation, turn on root motion, and see how the character's collision capsule follows the mesh in the game."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/root-motion-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-montage-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. You need an Animation Sequence that moves the root bone forward, such as a roll or a vault. If you have none, make one: duplicate a jump or walk animation of the mannequin and name the copy Anim_RootMove. Open it, go to the first frame, select the root bone in the Skeleton Tree and press Key in the toolbar. Then go to the last frame, move the root bone about 200 units forward in the viewport, and press Key again."
      - "In the viewport, open the Character menu, go to Bones, then Bone Drawing, and choose All Hierarchy so that all bones are drawn. Watch the red root bone and its red line while the animation plays."
      - "In the Character menu, go to Animation, then Root Motion, and try the options Ignore, Loop, and Loop and Reset. Note what each option does to the preview."
      - "In the Asset Details panel, check Enable Root Motion on the sequence. The panel writes it as one word, EnableRootMotion. Then create a montage from the sequence and name it AM_Roll."
      - "Open the Animation Blueprint that the character uses (ABP_Unarmed in the current template, ABP_Manny or ABP_Quinn in older versions) and click Class Defaults in the toolbar. Set Root Motion Mode to Root Motion from Montages Only. Also make sure the AnimGraph has a Slot 'DefaultSlot' node before the Output Pose node, so that montages are shown."
      - "In BP_ThirdPersonCharacter, add a key press event that plays AM_Roll with a Play Montage node and the character's Mesh. Play in the editor and press the key while the character is standing still."
      - "Open the console with the backtick key and type show collision. You can now see the capsule, the collision shape of the character, move together with the mesh."
    done_when: "Send a screenshot of the Animation Sequence with All Hierarchy bone drawing and the red root line, and a screenshot of the Class Defaults of the Animation Blueprint that shows Root Motion Mode. Add one sentence that describes what changed in the game after you turned on Enable Root Motion."
    xp: 110
    verify_type: screenshot
    quiz:
      - q: "An animation has movement on the root bone, but Enable Root Motion is off. What do you see in game?"
        choices: ["The character moves with the animation", "The mesh moves away from the capsule and then snaps back at the end", "The animation does not play", "The capsule moves but the mesh stays"]
        answer_index: 1
        explain: "Without root motion, the mesh animates away from the character capsule and snaps back to the start when the cycle ends."
      - q: "Where do you turn on Enable Root Motion?"
        choices: ["In the Project Settings", "In the Skeleton asset", "In the Asset Details of each Animation Sequence or Montage", "In the Character Movement component"]
        answer_index: 2
        explain: "Each Animation Sequence or Montage has its own Enable Root Motion property in the Asset Details panel of the Animation Sequence Editor."
      - q: "Where is Root Motion Mode set?"
        choices: ["In the Animation Blueprint Class Defaults", "In the Animation Sequence Asset Details", "In the Skeletal Mesh Actor", "In the Game Mode"]
        answer_index: 0
        explain: "Click Class Defaults in the Animation Blueprint Editor toolbar. The Root Motion Mode drop-down is there."
      - q: "Which Root Motion Mode extracts root motion and removes it from the root bone, but does not move the character?"
        choices: ["No Root Motion Extraction", "Root Motion from everything", "Root Motion from Montages Only", "Ignore Root Motion"]
        answer_index: 3
        explain: "Ignore Root Motion extracts the motion (so the root bone stays in place) but does not apply it to the character."
      - q: "You choose Root Motion from everything. What is the performance cost the documentation warns about?"
        choices: ["Textures are streamed twice", "The Animation Graph updates on the Game Thread instead of a Worker Thread", "All montages become read only", "Physics is disabled on the character"]
        answer_index: 1
        explain: "With Root Motion from everything or from Montages, the AnimGraph runs on the Game Thread, which can cause performance issues."
      - q: "A walking character plays a root motion jump with movement on Z. What does the movement component do?"
        choices: ["It applies full root motion including Z", "It ignores the Z axis of root motion and applies gravity", "It switches the character to Flying", "It stops the animation"]
        answer_index: 1
        explain: "When Walking or Falling, the Z axis of root motion is ignored and gravity is applied. Only in Flying is the full root motion used."
      - q: "In the Animation Sequence Editor preview, what does Loop and Reset do?"
        choices: ["Plays with root motion and starts every loop from the root origin", "Plays with root motion and continues from where the last loop ended", "Ignores root motion", "Resets the Skeleton to the reference pose"]
        answer_index: 0
        explain: "Loop continues from the point where the loop before it ended. Loop and Reset starts each loop again from the root bone origin."
      - q: "In a network game you want root motion from a montage to replicate. What does the documentation say you must do?"
        choices: ["Nothing, Play Montage replicates itself", "Set Root Motion Mode to Ignore Root Motion", "Replicate the Play Montage call yourself with an RPC", "Enable Force Root Lock"]
        answer_index: 2
        explain: "Root motion replication happens by default, but you first need to replicate the Play Montage node manually with an RPC."
    flavors:
      _default: {why: "Choosing root motion or in-place decides who moves the character: the animation or the movement code."}
      animation: {why: "Rolls, vaults and attacks feel grounded when the animation owns the movement.", do: "Try Root Motion Root Lock set to Anim First Frame and describe the difference in the preview."}
      programming: {why: "Root motion changes where movement is computed and which thread the AnimGraph runs on.", do: "Note in your writeup when you would pick Root Motion from Montages Only over from everything."}

  - id: AQ22
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [animation, ik, ik-rig, retargeting]
    required_spine: false
    required: true
    title: "IK Rig: define a rig for retargeting"
    brief: "An IK Rig is an asset that describes the important parts of a character's skeleton, such as the pelvis, the spine, the arms and the legs. Unreal needs it for retargeting, which means playing the animations of one skeleton on a different skeleton. IK means Inverse Kinematics: you move the end of a limb, such as a foot, and the rest of the limb bends to follow. In this quest you create an IK Rig, mark the pelvis, define seven bone chains, and add IK goals to the feet."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/ik-rig-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/ik-rig-animation-retargeting-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/retargeting-bipeds-with-ik-rig-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/ik-rig-solvers-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. In the Content Browser, click Add (+), then Animation, then IK Rig. Pick the Skeletal Mesh of the character, for example SKM_Manny_Simple, and name the new asset IK_MyCharacter."
      - "In the Hierarchy panel, right-click the pelvis bone and set it as the pelvis (the retarget root). This tells Unreal which bone carries the movement of the whole body."
      - "Create retarget chains for Spine, Neck, Head, Left Arm, Right Arm, Left Leg and Right Leg. For each chain, select the bones from the first to the last, right-click, choose New Retarget Chain, and check the Chain Name that Unreal fills in for you."
      - "Select both foot bones, click Add (+) in the Hierarchy panel and choose New IK Goal. When Unreal asks for a Solver, pick Limb IK. A solver is the part that calculates how the limb bends."
      - "Do this for each Limb IK solver: select the solver and the thigh bone, right-click, and choose Set Root Bone on Selected Solver."
      - "In the viewport, drag one foot goal up and watch the leg bend. Then click Reset."
      - "Look at the IK Retargeting panel and check that every chain has a name, a Start Bone and an End Bone."
    done_when: "Send a screenshot of the IK Rig editor that shows the IK Retargeting panel with all seven chains and the pelvis set. Also send a second screenshot with a foot goal moved and the leg bending in the viewport."
    xp: 115
    verify_type: screenshot
    quiz:
      - q: "How do you create an IK Rig asset?"
        choices: ["Right-click an Animation Sequence > Create IK Rig", "Add (+) > Animation > IK Rig, then pick a Skeletal Mesh", "Open the Skeleton editor and click Add Rig", "Drag a Control Rig onto the mesh"]
        answer_index: 1
        explain: "The IK Rig is created from the Content Browser Add menu under Animation. A dialog asks for the Skeletal Mesh to rig."
      - q: "When you make an IK Goal for a leg, which bone do you select first?"
        choices: ["The pelvis", "The thigh (the start of the chain)", "The foot (the end bone of the chain)", "The root bone"]
        answer_index: 2
        explain: "IK Goals are made from the ending bones of the chain, typically the hand or foot. The goal is the effector at the end."
      - q: "You have a Set Transform solver on the hips and two Limb IK solvers. Why does their order in the Solver Stack matter?"
        choices: ["It does not matter, they run in parallel", "Solvers run in sequence by their number, so Limb IK should run after the hips move", "Only the first solver ever runs", "Lower numbers get more blend weight"]
        answer_index: 1
        explain: "Solvers evaluate in order by the number next to their name. The legs must solve after the hips have moved so they can compensate."
      - q: "A Limb IK solver has a goal but does nothing. What is probably missing?"
        choices: ["A root bone set on the solver, for example the thigh", "A Blend Mask", "A Sync Group", "A second goal on the knee"]
        answer_index: 0
        explain: "Limb IK needs both a goal and a root. You set the root by selecting the solver and the bone, then Set Root Bone on Selected Solver."
      - q: "For an arm retarget chain, what are typical Start Bone and End Bone values?"
        choices: ["Hand and finger tip", "Clavicle and pelvis", "Upper arm and hand", "Spine and head"]
        answer_index: 2
        explain: "The chain runs from the start of the limb to its end. For an arm, the docs give the upper arm as Start Bone and the hand as End Bone."
      - q: "Your source rig has a chain named ArmLeft and the target has left_arm. Will they map?"
        choices: ["No, names must be exactly equal", "Yes, chain names are matched with a fuzzy string match, but you should still try to match them", "Only if both have IK Goals", "Only if the bones have the same names"]
        answer_index: 1
        explain: "Chain matching uses a fuzzy string match. ArmLeft can match left_arm, but matching names is still recommended."
      - q: "Why must the pelvis (retarget root) be defined in both IK Rigs?"
        choices: ["So the character's root motion can be transferred proportionally", "So the IK Goals can be drawn", "So the skeleton can be merged", "So the Control Rig can find the mesh"]
        answer_index: 0
        explain: "The pelvis is set so the character's root motion is defined and transferred in a proportional way between the two characters."
      - q: "The target character has more arm bones than the source. What does the documentation say about retargeting the arm?"
        choices: ["You must add the same number of bones to the source", "It still works because you define the whole chain, not individual bones", "You must retarget with the old Compatible Skeleton system", "It works only with IK Goals on every bone"]
        answer_index: 1
        explain: "Chains are defined by joint chains, not single bones, so different bone counts between source and target still retarget correctly."
    flavors:
      _default: {why: "An IK Rig is the bridge that lets one skeleton borrow animation from another, and a base for foot placement."}
      animation: {why: "Every retarget starts with two IK Rigs. Bad chains mean bad animation on the target.", do: "Also add single-bone chains for the clavicles and note why a one-bone chain is valid."}
      tech_art: {why: "Chain and pelvis rules affect how you name and build bones in your DCC tool.", do: "Rename one bone chain in the rig and check what auto-naming picked, and why."}

  - id: AQ23
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [animation, montage, notifies, blueprint, capstone]
    required_spine: false
    required: true
    capstone: true
    title: Triggered montage
    brief: "Many game actions follow the same pattern: the player presses a key, the character plays an animation, and something happens in the world at the right moment of that animation. An Animation Montage with notifies makes this possible. A notify is a marker on the animation timeline that sends an event when the animation reaches it. In this quest you build a lever or a chest that the character can use, with an effect at the moment of contact and a clean stop when the animation is interrupted."
    time_min: 120
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-montage-editor-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-montage-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-notifies-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-slots-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Build an actor that the player can interact with, named BP_Lever or BP_Chest. Give it a trigger volume and a prompt on screen. When the player presses the interact key inside the trigger volume, the actor tells the character to interact."
      - "Create a montage named AM_Interact from one or two Animation Sequences of the mannequin, or from your own, with at least two sections, Reach and Pull. Set it to a named Slot, FullBody or UpperBody, and make sure that this Slot exists in the AnimGraph of the character."
      - "Play AM_Interact with the Play Montage node. Use its On Completed output to unlock the player, and use On Interrupted to cancel the interaction cleanly."
      - "Add a Notify to the montage at the moment when the hand touches the object. When that notify fires, spawn a Niagara effect or play a sound at a socket on the hand."
      - "Add a second notify that fires On Notify Begin in the Play Montage node. Use it to change the state of the lever or chest, for example to open or pulled."
      - "Make it possible to interrupt the montage. A hit or a jump during the montage should stop it, and the actor should go back to its starting state."
      - "Record a short video clip (30 seconds or less). It must show the approach, the interaction, the effect at the right frame, the change of the actor state, and one attempt that is interrupted."
    done_when: "Send the clip described in the last step, a screenshot of the montage timeline with the sections and notifies visible, and a screenshot of the Blueprint graph with Play Montage, On Completed, On Interrupted and On Notify Begin connected. Add a short note that explains which Slot you used and why. A mentor reviews your work."
    xp: 250
    verify_type: mentor
    quiz: []
    flavors:
      _default: {why: "This is the smallest full loop of gameplay animation: trigger, montage, event, effect, recovery."}
      animation: {why: "It proves you can sync animation timing with gameplay events.", do: "Put the effect notify on the exact contact frame and show a frame-by-frame view in your clip."}
      gameplay_design: {why: "Interactions live or die on timing and interruption rules.", do: "Write three lines on what should and should not interrupt the interaction."}

  - id: AQ24
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [animation, curves, animation-blueprint, materials]
    required_spine: false
    required: false
    title: Animation curves
    brief: "An animation curve is an extra value stored inside an animation that changes over time, like a small graph that plays together with the movement. Materials, face shapes and gameplay code can read this value, so they can follow the motion. In this quest you add a curve named Glow to an animation, use it to make the character's material glow, and read its value in an Animation Blueprint."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-curves-in-unreal-engine"
    backup_url: null
    extra_urls: []
    checklist:
      - "Open a project made from the Third Person template, or create one. Open an Animation Sequence of the mannequin. In the timeline, open the drop-down of the Curves track, choose Add Curve..., then Create Curve, and name the curve Glow."
      - "Click the drop-down of the new curve and choose Edit Curve. Add keys with the Enter key so that Glow goes from 0 up to 1 and back to 0 during the animation."
      - "Open Window > Anim Curves. Turn on the Material type for Glow, so that the curve can drive a material. Save the Skeleton when Unreal asks you to."
      - "Open the material of the character and add a scalar parameter named Glow. Multiply it into Emissive, the input that makes a material give off light. Watch the mesh glow while the animation plays."
      - "In the Event Graph of the Animation Blueprint that the character uses, call Get Curve Value with the Curve Name set to Glow. Show the result every tick with a Print String node."
      - "Add a second curve, right-click it and choose Convert To Metadata. Note which value the curve outputs now."
    done_when: "Send a screenshot of the Curve Editor with the Glow keys, a screenshot of the Anim Curves panel that shows Glow with the Material type turned on, and a screenshot or a short video clip (30 seconds or less) of the mesh glowing during playback."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You create a new curve in an Animation Sequence. Which asset also changes?"
        choices: ["The Skeletal Mesh", "The Skeleton asset, because curves are stored on it", "The Animation Blueprint", "The Physics Asset"]
        answer_index: 1
        explain: "Animation Curves are stored on the Skeleton. Creating a curve edits the Skeleton and you must save it."
      - q: "You want a Maya custom attribute to import as a curve. What must be true?"
        choices: ["It must be an integer attribute", "It must be a float attribute and it must be keyframed", "It must be on the root bone only", "It must be named Curve_ something"]
        answer_index: 1
        explain: "Only float attributes work as curves, and the attribute must be keyframed or the curve data will not import."
      - q: "Which FBX import option must be enabled to bring in those attributes as curves?"
        choices: ["Import Morph Targets", "Use T0 As Ref Pose", "Import Custom Attribute", "Preserve Local Transform"]
        answer_index: 2
        explain: "The docs say to enable Import Custom Attribute when importing the FBX so the attributes appear as curves."
      - q: "What two things make a curve drive a scalar Material Parameter automatically?"
        choices: ["Curve name matches the parameter name, and the Material type is enabled in Anim Curves", "The curve is a Metadata Curve, and the material is unlit", "The curve is on the root bone, and Max LOD is 0", "The curve has Auto off, and the material is an instance"]
        answer_index: 0
        explain: "Match the curve name to the Material Parameter name and enable the Material curve type. Then the value drives the parameter."
      - q: "Your mesh has three materials that share a parent with a parameter named Glow. A Glow material curve plays. What happens?"
        choices: ["Only the first material changes", "The engine asks which material to use", "All three materials get the parameter change", "Nothing, curves cannot drive instances"]
        answer_index: 2
        explain: "Material curves affect all Materials and their parameters assigned to the Skeletal Mesh, so shared names change everywhere."
      - q: "In the Animation Blueprint, which node returns the current value of a named curve?"
        choices: ["Get All Curve Names", "Get Curve Value", "Get Active Curve Names", "Montage Get Position"]
        answer_index: 1
        explain: "Get Curve Value targets the Anim Instance and returns the value of the curve name you give it."
      - q: "A Metadata Curve is added to a sequence. What value does it output?"
        choices: ["A constant 0.0", "The last keyed value", "A constant 1.0", "Whatever the Weight field says"]
        answer_index: 2
        explain: "Metadata Curves output a static value of 1.0 and are read only. A normal curve with no keys outputs 0.0."
      - q: "You set a curve's Max LOD to 1. On which LODs does it evaluate?"
        choices: ["LOD 1 only", "LOD 0 and LOD 1", "LOD 1 and higher", "All LODs"]
        answer_index: 1
        explain: "Max LOD is the last LOD where the curve still evaluates. With 1, LODs 0 and 1 evaluate it, 2 and beyond do not."
    flavors:
      _default: {why: "Curves carry extra data inside an animation, so materials, morphs and gameplay can follow the motion."}
      animation: {why: "Curves are your channel from the animation to everything else in the engine.", do: "Drive a morph target by naming a curve the same as the morph and enabling the Morph Target type."}
      tech_art: {why: "Curve-driven material parameters let animation control shader effects without Blueprint glue.", do: "Explain in one line why a shared parent material can make a curve change more than you wanted."}

  - id: AQ25
    rank: 2
    difficulty: adept
    specializations: [animation]
    subjects: [animation, sync-groups, sync-markers, locomotion]
    required_spine: false
    required: false
    title: Sync markers
    brief: "When Unreal blends two animations of different lengths, such as a walk and a run, the feet often do not touch the ground at the same time. The result is feet that slide. A Sync Group makes the animations play in step with each other, and Sync Markers are named marks on the timeline, such as the moment the left foot lands, that Unreal lines up between the animations. In this quest you blend a walk and a run, see the problem, and fix it with a Sync Group and markers."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-sync-groups-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-blueprint-blend-nodes-in-unreal-engine"
    checklist:
