      - q: "How do you free the mouse cursor from the simulation without pausing it while recording?"
        choices: ["Press Escape", "Press Shift + F1", "Click Eject", "Press Backtick"]
        answer_index: 1
        explain: "Shift + F1 disconnects the cursor from the simulation without stopping or pausing it."
      - q: "What does the docs say happens to the recording when you pause the simulation?"
        choices: ["The recording continues", "The recording is discarded", "The recording stops automatically", "The recording restarts"]
