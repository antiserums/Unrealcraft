      - q: "You call Montage Jump to Section but leave the Montage input empty (NULL). What does the node do?"
        choices: ["It jumps every active montage to that section", "It does nothing", "It jumps only the last played montage", "It stops all montages"]
        answer_index: 0
        explain: "The Blueprint reference says that with a NULL Montage reference, the jump is applied to all active montages."
      - q: "Play Montage fires but the character keeps playing locomotion and never shows the montage. What is the most likely missing piece?"
        choices: ["A Sync Group name on the montage", "A Slot node with the matching Slot Name in the AnimGraph", "A Child Montage", "A Timing track in the montage"]
