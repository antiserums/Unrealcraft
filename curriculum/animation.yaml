        explain: "Linked Anim Graph references one Animation Blueprint directly. Linked Anim Layers require an Animation Layer Interface that defines the layers."
      - q: "How do you expose a pose input on a linked Animation Blueprint?"
        choices: ["Add an Input Pose node from the Misc category in its AnimGraph", "Enable Instance Editable on the Output Pose", "Add a Slot node", "Set Receive Notifies from Linked Instances"]
        answer_index: 0
        explain: "Input Pose nodes in the linked Blueprint appear as input pins on the Linked Anim Graph node. You can add several and rename them."
      - q: "How do you expose a variable on the Linked Anim Graph node?"
        choices: ["Make it a local variable", "Add it to the Animation Layer Interface", "Bind it with Property Access", "Enable Instance Editable on the variable in the linked Blueprint"]
        answer_index: 3
        explain: "Like making a Blueprint variable public, enable Instance Editable and the variable shows on the Linked Anim Graph node."
      - q: "Propagate Notifies to Linked Instances is enabled on the sender. What else is required for notifies to arrive?"
        choices: ["Nothing else", "The target linked instance must also have the propagate setting enabled", "The montage must use DefaultSlot", "Both instances must share an Event Graph"]
        answer_index: 1
        explain: "The docs say Propagate Notifies to Linked Instances must also be enabled on the target Linked Anim instance for notifies to propagate."
