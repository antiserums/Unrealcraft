    title: "FK arm rig: Controls, Bones and Nulls"
    brief: "Every Control Rig is built from three kinds of elements: Bones, which come from the skeleton and move the mesh, Controls, which are the shapes an animator selects and moves, and Nulls, which are invisible helper points used to group or offset other elements. FK means Forward Kinematics, where you rotate each joint directly, from the shoulder down to the hand. In this quest you build a simple FK rig for both arms, group the controls under a Null, and limit how far one control can rotate."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/controls-bones-and-nulls-in-control-rig-in-unreal-engine"
