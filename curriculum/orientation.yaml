# Unrealcraft — First steps (Novice, rank 0)
# 5 small steps that teach the site before Unreal. They are `first_steps: true`: the path lists them first and
# they are required, with the Starter Quests, before Apprentice. Written in simple English on purpose:
# short sentences, common words, no idioms. Many members don't speak English as a first language.
# Every step is done on the website and can be done alone.
#
# `step` is the one line shown for the quest. `checklist` lines have a `check:` the site verifies itself
# (see api/app/progress.py for the fact names), so nobody ticks steps by hand. A quest made only of such
# checks (`verify_type: action`) finishes itself when its last fact is recorded.

quests:
  - id: O1
    rank: 0
    first_steps: true
    difficulty: novice
    specializations: [all]
    subjects: [rules]
    required_spine: false
    required: true
    title: First quest - rules quiz
    brief: "Unrealcraft has a few short rules about where to ask for help, where your work is reviewed and what you may post on the Discord server. This first quest checks that you have understood them. You answer five short questions on this page, and you need at least four correct answers."
    step: "Beat your first boss: a short quiz about the rules. Get 4 of 5 right."
    time_min: 5
    backup_url: null
    checklist:
      - text: "Press the Fight button on this page and answer the questions. You need to get at least 4 of the 5 questions right."
        check: {fact: quiz.O1}
    done_when: "You do not need to send anything for this quest. It is complete as soon as you have passed the quiz on this page."
    xp: 10
    verify_type: quiz
    quiz:
      - q: "You are working in Unreal and you get stuck on a problem. Where should you ask for help?"
        choices: ["In the #general chat channel", "In the #help-desk forum on the Discord server", "In a private message to a mentor", "In the #rank-ups channel"]
        answer_index: 1
        explain: "Ask in #help-desk on Discord. When you post, say which Unreal version you use and what you already tried, so people can help you faster."
      - q: "What do you have to do to reach the next rank?"
        choices: ["Chat a lot on the server", "Finish quests", "Stay on the server for a long time", "Boost the server"]
        answer_index: 1
        explain: "Ranks come from XP, and only quests give XP. Chatting on the server does not give any."
      - q: "After you finish a quest, where is your work looked at and reviewed?"
        choices: ["In a Discord channel", "Here on the site, by mentors", "In a private message", "Nowhere, nobody looks at it"]
        answer_index: 1
        explain: "You send your work from the quest page, and mentors review it here on the site. Discord is for talking and for showing your progress."
      - q: "What are you allowed to post in the #showcase channel on Discord?"
        choices: ["Any cool art you found online", "Your own work, finished or not", "Only finished games", "Links to store pages"]
        answer_index: 1
        explain: "#showcase is only for work you made yourself. It does not have to be finished: work in progress is welcome."
      - q: "What do you always have to write when you send your work for a quest?"
        choices: ["Your age", "Your Unreal version (for example 5.8)", "Your computer model", "How many hours you have played"]
        answer_index: 1
        explain: "Always write your Unreal version. Menus and features change between versions, so the right answer for you depends on which one you have."
    flavors:
      _default:
        why: "The rules are short. The quiz checks that you understood them."

  - id: O2
    rank: 0
    first_steps: true
    difficulty: novice
    specializations: [all]
    subjects: [specializations]
    required: true
    title: Pick what to learn
    brief: "A specialization is the area of Unreal Engine you want to focus on, such as level design or programming. Your primary specialization decides which quests your path shows you first. You can add more specializations later and you can change your choice at any time, so there is no wrong answer here. In this quest you pick your primary specialization and save it."
    step: "Choose a primary specialization on your player card page. Not sure? Pick Undecided."
    time_min: 2
    backup_url: null
    checklist:
      - text: "Open your player card page and press Change under Specializations. Pick a primary specialization and press Save. If you have not decided yet, it is fine to choose Undecided."
        check: {fact: spec.chosen}
    done_when: "You do not need to send anything for this quest. It is complete as soon as a primary specialization is saved on your player card."
    xp: 10
    verify_type: action
    quiz:
      - q: "What is a specialization on this site?"
        choices: ["A badge you get for finishing a quest", "A setting that changes the colours of your player card", "The area of Unreal Engine you want to focus on", "A group of members who work on one project"]
        answer_index: 2
        explain: "A specialization is the area of Unreal Engine you want to focus on, such as level design or programming. It tells the site what you want to learn."
      - q: "What does your primary specialization decide?"
        choices: ["Which quests your path shows you first", "Which version of Unreal Engine you must install", "How many questions each quiz has", "Who is allowed to see your player card"]
        answer_index: 0
        explain: "The primary specialization sets the order of your path, so the quests for that area come first. It does not lock you out of anything."
      - q: "Where do you pick your primary specialization?"
        choices: ["On the Achievements page, under Unlocked", "On the Quest Board, in the part named My path", "In the chest at the bottom of a quest page", "On your player card page, under Specializations"]
        answer_index: 3
        explain: "You open your player card page, press Change under Specializations, pick a primary specialization and press Save."
      - q: "You are not sure yet which area you like most. What can you do?"
        choices: ["Wait, because the first choice can never be changed", "Choose Undecided, and change your choice later", "Skip the choice, because it has no effect on your path", "Pick every specialization as primary at the same time"]
        answer_index: 1
        explain: "It is fine to choose Undecided. You can change your primary specialization at any time, so there is no wrong answer."
      - q: "What happens if you later become interested in a second area?"
        choices: ["You must start again with a new account", "You lose the quests you already finished", "You can add more specializations to the one you have", "You must ask a mentor to unlock that area"]
        answer_index: 2
        explain: "You can add more specializations later and keep your primary one. The choice only guides your path, it does not close the other areas."
    flavors:
      _default:
        why: "Your primary specialization decides your path. You can add more later, and change it any time."

  - id: O3
    rank: 0
    first_steps: true
    difficulty: novice
    specializations: [all]
    subjects: [navigation]
    required: true
    title: Look around
    brief: "The site has three pages that you will come back to often. Your player card shows who you are and how far you have come, the Quest Board lists the quests, and Achievements shows what you have unlocked. On the Quest Board, the part named My path always shows what you should do next. In this quest you open each of these pages once so that you know where they are."
    step: "Open three pages: your player card, My path on the quest board, and your achievements."
    time_min: 3
    backup_url: null
    checklist:
      - text: "Open your player card by clicking your name at the top right of the page."
        check: {fact: site.card}
      - text: "Open the Quest Board and look at the part named My path, which shows the next quests for you."
        check: {fact: site.path}
      - text: "Go back to your player card page and open Achievements from there."
        check: {fact: site.achievements}
    done_when: "You do not need to send anything for this quest. It is complete as soon as you have opened all three pages."
    xp: 15
    verify_type: action
    quiz:
      - q: "Which three pages of the site will you come back to often?"
        choices: ["Your player card, the Quest Board and Achievements", "The Quest Board, the chest and the settings page", "Your player card, the motto page and the path page", "Achievements, the review page and the help page"]
        answer_index: 0
        explain: "The player card shows who you are, the Quest Board lists the quests, and Achievements shows what you have unlocked."
      - q: "How do you open your player card?"
        choices: ["Press Send in the chest of any quest", "Open the Quest Board and click My path", "Open Achievements and click the first item", "Click your name at the top right of the page"]
        answer_index: 3
        explain: "Your name at the top right of the page is the link to your player card. From the card you can also reach Achievements."
      - q: "What does the part named My path on the Quest Board show?"
        choices: ["Every quest on the site in order of its id", "The quests you should do next", "The quests that other members finished today", "Only the quests you have already finished"]
        answer_index: 1
        explain: "My path always shows what you should do next, so you do not have to search the whole list of quests."
      - q: "What does your player card show?"
        choices: ["The steps of the quest you are doing now", "The list of all Epic documentation pages", "Who you are and how far you have come", "The questions of the next quiz"]
        answer_index: 2
        explain: "The player card is your own page. It shows who you are and your progress."
      - q: "From which page do you open Achievements in this quest?"
        choices: ["From the Quest Board", "From your player card page", "From the chest on a quest page", "From the part named My path"]
        answer_index: 1
        explain: "You go back to your player card page and open Achievements from there. Achievements shows what you have unlocked."
    flavors:
      _default:
        why: "My path always shows what to do next."

  - id: O4
    rank: 0
    first_steps: true
    difficulty: novice
    specializations: [all]
    subjects: [player-card]
    required: true
    title: Make your card yours
    brief: "Your player card is the page that other members see when they look at you. You can change how it looks, and more colours, frames and titles become available as you finish quests. In this quest you make a first small change: you write a short motto, which is one line of text about you."
    step: "Press Edit profile on your player card page, write a motto and press Save."
    time_min: 2
    backup_url: null
    checklist:
      - text: "On your player card page, press Edit profile. Write a short motto and then press Save."
        check: {fact: card.motto}
    done_when: "You do not need to send anything for this quest. It is complete as soon as a motto is saved on your player card."
    xp: 15
    verify_type: action
    quiz:
      - q: "What is your player card?"
        choices: ["A list of the quests you should do next", "The place where you send proof of your work", "A page that only mentors can open", "The page that other members see when they look at you"]
        answer_index: 3
        explain: "The player card is your public page on the site. Other members see it when they look at you, which is why it is worth making it yours."
      - q: "What is a motto on your player card?"
        choices: ["A picture that frames your name", "One short line of text about you", "The name of your primary specialization", "A title you unlock with a quest"]
        answer_index: 1
        explain: "A motto is one line of text about you. Writing it is the first small change you make to your card."
      - q: "Which button do you press on your player card page to write a motto?"
        choices: ["Edit profile", "Change", "Send", "My path"]
        answer_index: 0
        explain: "You press Edit profile, write a short motto, and then press Save. Change is the button for specializations."
      - q: "How do more colours, frames and titles become available for your card?"
        choices: ["You pick a second specialization", "You open the Achievements page once", "You finish quests", "You write a longer motto"]
        answer_index: 2
        explain: "More ways to change the look of your card unlock as you finish quests. The motto is available from the start."
      - q: "You wrote a motto but the quest is still not complete. What do you check first?"
        choices: ["That you sent a screenshot of the card", "That you opened the Quest Board afterwards", "That you picked a new colour and frame", "That you pressed Save after writing it"]
        answer_index: 3
        explain: "The quest is complete as soon as a motto is saved on your player card. Text that you typed but did not save does not count, and nothing has to be sent."
    flavors:
      _default:
        why: "Your player card is what others see. Colours, frames and titles unlock as you play."

  - id: O5
    rank: 0
    first_steps: true
    difficulty: novice
    specializations: [all]
    subjects: [turn-in]
    required: true
    title: Practice sending work
    brief: "Most quests end with you sending proof of your work, such as a screenshot or a few lines of text. On the quest page, the place where you send your work is called the chest. In this quest you practice this once with a single word, so that you know how it works before a real quest asks for it."
    step: "On this page, type READY in the chest and send it."
    time_min: 1
    backup_url: null
    checklist:
      - text: "Find the chest on this page, type the word READY into it, and press Send."
        check: {fact: submit.O5}
    done_when: "Send the word READY through the chest on this page. The quest is complete as soon as this practice work is sent."
    xp: 10
    verify_type: action
    quiz:
      - q: "What is the chest on a quest page?"
        choices: ["The list of steps of the quest", "The place where you send your work", "The quiz at the end of the quest", "The link to the Epic documentation"]
        answer_index: 1
        explain: "On the quest page, the place where you send your work is called the chest. You type or attach your proof there and press Send."
      - q: "How do most quests end?"
        choices: ["You wait one day before the next quest opens", "You install a new version of Unreal Engine", "You change your primary specialization", "You send proof of your work"]
        answer_index: 3
        explain: "Most quests end with you sending proof, such as a screenshot or a few lines of text. The proof shows that you did the steps."
      - q: "What do you send in this practice quest?"
        choices: ["The word READY", "A screenshot of your player card", "A short video of the editor", "A link to your project files"]
        answer_index: 0
        explain: "You type the single word READY into the chest and press Send. The goal is only to try the chest once."
      - q: "Why do you practice sending work with a single word?"
        choices: ["Because the chest only accepts short words", "Because a mentor must check your spelling", "So you know how it works before a real quest asks for it", "So your player card gets a new frame"]
        answer_index: 2
        explain: "The practice removes the surprise later. When a real quest asks for proof, you already know where the chest is and how to use it."
      - q: "Which of these is a normal kind of proof for a quest?"
        choices: ["Your password for the site", "A screenshot or a few lines of text", "The motto from your player card", "The name of your computer"]
        answer_index: 1
        explain: "Proof of work is usually a screenshot or a few lines of text. Each quest says which kind it needs."
    flavors:
      _default:
        why: "Every dungeon ends with a chest. Practice it once."
