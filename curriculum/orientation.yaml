# Unrealcraft — Orientation (Rank -1)
# 6 small steps that teach the server before Unreal. Written in simple English on purpose:
# short sentences, common words, no idioms. Many members don't speak English as a first language.
# Every step can be done alone, even on an empty server.
#
# Step 1 is only the rules quiz (Discord's Rules Screening already makes everyone accept the rules).
# `step` is the one line shown on the Orientation page. `checklist` lines have a `check:` the Quartermaster
# verifies itself (see bot/registrar/checks.py), so nobody ticks steps by hand.

quests:
  - id: O1
    rank: -1
    track: orientation
    subjects: [discord, rules]
    required_for_majors: [all]
    taster_for_majors: []
    adjacent_for: []
    required_spine: false
    elective: false
    title: First quest - rules quiz
    step: "Press **Start Questing** in #welcome and get 4 of 5 right."
    time_min: 5
    official_url: "discord://#welcome"
    backup_url: null
    checklist:
      - text: "Press Start Questing in #welcome (or type /quiz O1) and get 4 of 5 right."
        check: {fact: quiz.O1}
    done_when: "Quiz passed."
    xp: 10
    verify_type: quiz
    quiz:
      - q: "You are stuck in Unreal. Where do you ask?"
        choices: ["#general", "#help-desk, with the Unreal help button", "Send a private message to a mentor", "#rank-ups"]
        answer_index: 1
        explain: "Use #help-desk. The form helps people understand your problem."
      - q: "How do you rank up?"
        choices: ["Chat a lot", "Finish quests", "Stay on the server for a long time", "Boost the server"]
        answer_index: 1
        explain: "Only quests give XP. Chatting does not."
      - q: "Someone asks how to fix dark lighting. What is a good answer?"
        choices: ["\"Watch this 8-hour video.\"", "A link to the right Epic docs page and the setting to change.", "\"Just Google it.\"", "No answer."]
        answer_index: 1
        explain: "Give a short, exact answer that helps. Don't send people to very long videos."
      - q: "What can you post in #showcase?"
        choices: ["Any cool art you found online", "Your own work, finished or not", "Only finished games", "Store pages"]
        answer_index: 1
        explain: "Only your own work. Work in progress is welcome."
      - q: "What do you always write when you send your work?"
        choices: ["Your age", "Your Unreal version (for example 5.8)", "Your computer model", "Your hours played"]
        answer_index: 1
        explain: "Always write your Unreal version. Answers change between versions."
    flavors:
      _default:
        why: "The rules are short. The quiz checks that you understood them."

  - id: O2
    rank: -1
    track: orientation
    subjects: [discord, majors]
    required_for_majors: [all]
    elective: false
    title: Pick what to learn
    step: "Answer the join question, or type /major."
    time_min: 2
    official_url: "discord://#welcome"
    backup_url: null
    checklist:
      - text: "Pick what you want to learn (your major). Not sure? Pick Undecided."
        check: {fact: cmd.major}
    done_when: "A major is set."
    xp: 10
    verify_type: action
    quiz: []
    flavors:
      _default:
        why: "Your major decides which quests you get."

  - id: O3
    rank: -1
    track: orientation
    subjects: [discord, commands]
    required_for_majors: [all]
    elective: false
    title: Try 3 commands
    step: "Type /rank, then /quest, then /path."
    time_min: 3
    official_url: "discord://#welcome"
    backup_url: null
    checklist:
      - text: "Type /rank: see your level."
        check: {fact: cmd.rank}
      - text: "Type /quest: see your next task."
        check: {fact: cmd.quest}
      - text: "Type /path: see all your quests."
        check: {fact: cmd.path}
    done_when: "All 3 commands used."
    xp: 10
    verify_type: action
    quiz: []
    flavors:
      _default:
        why: "/quest always tells you what to do next."

  - id: O4
    rank: -1
    track: orientation
    subjects: [discord, navigation]
    required_for_majors: [all]
    elective: false
    title: Find #quest-log
    step: "Open #quest-log and press **Continue your quest**."
    time_min: 1
    official_url: "discord://#quest-log"
    backup_url: null
    checklist:
      - text: "Open #quest-log and press Continue your quest."
        check: {fact: btn.clockin}
    done_when: "Continue your quest pressed in #quest-log."
    xp: 10
    verify_type: action
    quiz: []
    flavors:
      _default:
        why: "New quests and weekly events are posted there."

  - id: O5
    rank: -1
    track: orientation
    subjects: [discord, submit]
    required_for_majors: [all]
    elective: false
    title: Practice sending work
    step: "Type `/submit quest:O5 proof:READY`"
    time_min: 1
    official_url: "discord://#welcome"
    backup_url: null
    checklist:
      - text: "Type /submit quest:O5 proof:READY"
        check: {fact: submit.O5}
    done_when: "Practice submit sent."
    xp: 10
    verify_type: action
    quiz: []
    flavors:
      _default:
        why: "Every quest ends with /submit. Practice it once."

  - id: O7
    rank: -1
    track: orientation
    subjects: [discord, voice]
    required_for_majors: [all]
    elective: false
    title: Visit voice chat
    step: "Join **➕ Join to create**. It makes a room just for you. Stay 1 minute (you can stay muted), or press **Skip voice**."
    time_min: 1
    official_url: "discord://#➕ Join to create"
    backup_url: null
    checklist:
      - text: "Stay in a voice room for 1 minute, or press Skip voice."
        check: {any: [voice.studio_floor, cmd.skip_voice]}
    done_when: "1 minute in voice, or skipped."
    xp: 10
    verify_type: action
    quiz: []
    flavors:
      _default:
        why: "People work together in voice. Now you know where."

  # ---------------- Orientation extras (optional) ----------------
  - id: O-E1
    rank: -1
    track: orientation
    subjects: [discord, profile]
    required_for_majors: []
    elective: true
    title: Save your Unreal version
    time_min: 1
    official_url: "discord://#welcome"
    checklist:
      - text: "Type /profile ue_version:5.8 (use your version)."
        check: {fact: cmd.profile_version}
    done_when: "Version saved."
    xp: 5
    verify_type: action
    quiz: []

  - id: O-E2
    rank: -1
    track: orientation
    subjects: [discord, profile]
    required_for_majors: []
    elective: true
    title: Show your major in your name
    time_min: 1
    official_url: "discord://#welcome"
    checklist:
      - text: "Change your server nickname to Name | Major (for example: Sam | Level Design)."
        check: {fact: nick.major}
    done_when: "Nickname has a |."
    xp: 5
    verify_type: action
    quiz: []

  - id: O-E3
    rank: -1
    track: orientation
    subjects: [discord, social]
    required_for_majors: []
    elective: true
    title: Say hi
    time_min: 2
    official_url: "discord://#introductions"
    checklist:
      - text: "Write in #introductions: what you want to learn, and one thing you want to make."
        check: {fact: msg.introductions}
    done_when: "One message in #introductions."
    xp: 5
    verify_type: action
    quiz: []
