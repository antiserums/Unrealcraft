# Unrealcraft — Orientation (Rank -1)
# Teaches the Discord game before Unreal. Each quest takes 5–10 minutes.
# Every Orientation checklist line has a `check:` the Quartermaster verifies itself (see bot/registrar/checks.py).
# Nobody can tick these by pressing a button: they complete when the bot sees the action.
# O1 also needs the Rules Screening accept + a 5-question rules quiz.

quests:
  - id: O1
    rank: -1
    track: orientation
    subjects: [discord, rules]
    required_for_majors: [all]
    taster_for_majors: []
    adjacent_for: []
    required_spine: false
    elective: false
    title: Read the brief
    time_min: 8
    official_url: "discord://#how-this-place-works"
    backup_url: null
    checklist:
      - text: "Accept the server rules (the Discord rules screen when you joined)."
        check: {fact: rules.accepted}
      - text: "Read #how-this-place-works (5 short posts), then pass /quiz O1 (4/5)."
        check: {fact: quiz.O1}
    done_when: "Rules accepted and O1 quiz passed. The Quartermaster ticks both."
    xp: 10
    verify_type: action
    quiz:
      - q: "You're stuck on a Blueprint. Where does the question go?"
        choices: ["#general", "A #help-desk forum post using the template", "DM a mentor", "#rank-ups"]
        answer_index: 1
        explain: "#help-desk is a forum. The template gets you answered faster. Mentors don't take cold DMs."
      - q: "What makes you rank up?"
        choices: ["Chatting a lot", "Finishing quests and passing capstones", "Time on the server", "Boosting"]
        answer_index: 1
        explain: "Chat XP is off. Only quests, quizzes and approved submissions count."
      - q: "Someone asks how lighting works. Which answer breaks a server rule?"
        choices: ["A link to the Epic Lumen page plus the one setting to check", "A screenshot of your own Details panel", "'Just watch this 8-hour course'", "Asking which engine version they're on"]
        answer_index: 2
        explain: "No 8-hour video answers. Point to the specific fix."
      - q: "What can you post in #showcase?"
        choices: ["Any cool Unreal art you found", "Your own map or scene, WIP included", "Only finished games", "Marketplace store pages"]
        answer_index: 1
        explain: "Showcase must be your own map. WIP is welcome."
      - q: "What must every turn-in state?"
        choices: ["Your age", "Your engine version", "Your GPU", "Your hours played"]
        answer_index: 1
        explain: "Always state the engine version. Answers differ between 5.x versions."
    flavors:
      _default:
        why: "You're a new hire. This is the studio handbook. It's short."

