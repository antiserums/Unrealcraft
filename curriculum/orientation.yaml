# Unrealcraft — First steps (Novice, rank 0)
# 5 small steps that teach the site before Unreal. They are `first_steps: true`: the path lists them first and
# they are required, with the Starter Quests, before Apprentice. Written in simple English on purpose:
# short sentences, common words, no idioms. Many members don't speak English as a first language.
# Every step is done on the website and can be done alone.
#
# `step` is the one line shown for the quest. `checklist` lines have a `check:` the site verifies itself
# (see api/app/progress.py for the fact names), so nobody ticks steps by hand. A quest made only of such
# checks (`verify_type: action`) finishes itself when its last fact is recorded.

quests:
  - id: O1
    rank: 0
    first_steps: true
    difficulty: novice
    specializations: [all]
    subjects: [rules]
    required_spine: false
    required: true
    title: First quest - rules quiz
    step: "Beat your first boss: a short quiz about the rules. Get 4 of 5 right."
    time_min: 5
    backup_url: null
    checklist:
      - text: "Press Fight on this page and get 4 of 5 right."
        check: {fact: quiz.O1}
    done_when: "Quiz passed."
    xp: 10
    verify_type: quiz
    quiz:
      - q: "You are stuck in Unreal. Where do you ask?"
        choices: ["#general", "The #help-desk forum on the Discord server", "A private message to a mentor", "#rank-ups"]
        answer_index: 1
        explain: "Use #help-desk on Discord. Say your Unreal version and what you tried."
      - q: "How do you rank up?"
        choices: ["Chat a lot", "Finish quests", "Stay on the server for a long time", "Boost the server"]
        answer_index: 1
        explain: "Only quests give XP. Chatting does not."
      - q: "Where is your work reviewed?"
        choices: ["In a Discord channel", "Here on the site, by mentors", "By private message", "Nowhere"]
        answer_index: 1
        explain: "You send your work on the quest page. Mentors review it on the site. Discord is for talking and showing progress."
      - q: "What can you post in #showcase on Discord?"
        choices: ["Any cool art you found online", "Your own work, finished or not", "Only finished games", "Store pages"]
        answer_index: 1
        explain: "Only your own work. Work in progress is welcome."
      - q: "What do you always write when you send your work?"
        choices: ["Your age", "Your Unreal version (for example 5.8)", "Your computer model", "Your hours played"]
        answer_index: 1
        explain: "Always write your Unreal version. Answers change between versions."
    flavors:
      _default:
        why: "The rules are short. The quiz checks that you understood them."

  - id: O2
    rank: 0
    first_steps: true
    difficulty: novice
    specializations: [all]
    subjects: [specializations]
    required: true
    title: Pick what to learn
    step: "Choose a primary specialization on your player card page. Not sure? Pick Undecided."
    time_min: 2
    backup_url: null
    checklist:
      - text: "Open your player card page, press Change under Specializations, pick a primary and press Save. Undecided is fine."
        check: {fact: spec.chosen}
    done_when: "A primary specialization is saved."
    xp: 10
    verify_type: action
    quiz: []
    flavors:
      _default:
        why: "Your primary specialization decides your path. You can add more later, and change it any time."

  - id: O3
    rank: 0
    first_steps: true
    difficulty: novice
    specializations: [all]
    subjects: [navigation]
    required: true
    title: Look around
    step: "Open three pages: your player card, My path on the quest board, and your achievements."
    time_min: 3
    backup_url: null
    checklist:
      - text: "Open your player card (your name, top right)."
        check: {fact: site.card}
      - text: "Open the Quest Board and look at My path."
        check: {fact: site.path}
      - text: "Open Achievements from your player card page."
        check: {fact: site.achievements}
    done_when: "All three pages opened."
    xp: 15
    verify_type: action
    quiz: []
    flavors:
      _default:
        why: "My path always shows what to do next."

  - id: O4
    rank: 0
    first_steps: true
    difficulty: novice
    specializations: [all]
    subjects: [player-card]
    required: true
    title: Make your card yours
    step: "Press Edit profile on your player card page, write a motto and press Save."
    time_min: 2
    backup_url: null
    checklist:
      - text: "On your player card page press Edit profile, write a short motto and press Save."
        check: {fact: card.motto}
    done_when: "A motto is saved on your player card."
    xp: 15
    verify_type: action
    quiz: []
    flavors:
      _default:
        why: "Your player card is what others see. Colours, frames and titles unlock as you play."

  - id: O5
    rank: 0
    first_steps: true
    difficulty: novice
    specializations: [all]
    subjects: [turn-in]
    required: true
    title: Practice sending work
    step: "On this page, type READY in the chest and send it."
    time_min: 1
    backup_url: null
    checklist:
      - text: "Type READY in the chest on this page and press Send."
        check: {fact: submit.O5}
    done_when: "Practice turn-in sent."
    xp: 10
    verify_type: action
    quiz: []
    flavors:
      _default:
        why: "Every dungeon ends with a chest. Practice it once."
