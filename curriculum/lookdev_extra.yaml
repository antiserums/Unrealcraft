        explain: "Water mirrors the sky and the surroundings. Clear, bright water and dark, murky water give the same place two very different moods."
      - q: "What do you do right after you enable the Water plugin in Edit, then Plugins?"
        choices: ["Delete the Landscape", "Restart the editor", "Create a new project", "Open the Material Editor"]
        answer_index: 1
        explain: "A plugin only loads when the editor starts. After the restart, the water bodies are available."
      - q: "How do you add a lake or a river to the level?"
        choices: ["Sculpt a hole and fill it with a blue material", "Right-click in the Content Browser and choose Water", "Open Landscape Mode and choose New", "Search for Water Body in the Place Actors panel and drag one into the level"]
        answer_index: 3
        explain: "The Place Actors panel lists Water Body Lake and Water Body River after the plugin is enabled. You drag one into the level."
      - q: "Where do you find the material of a water body?"
        choices: ["In Water Material in the Details panel of the water body", "In the World Settings of the level", "In the Landscape Material of the Landscape", "In the Post Process Volume"]
        answer_index: 0
        explain: "You select the water body and look for Water Material in its Details panel. It points to a Material Instance."
      - q: "Why do you make a copy of the water Material Instance before you change it?"
        choices: ["A copy renders faster than the original", "The original cannot be opened", "So the original of the plugin stays as it is", "So the water body gets collision"]
        answer_index: 2
        explain: "The original instance belongs to the plugin and can be used by other water bodies. Changing a copy keeps your tuning in your own asset."
      - q: "Which two values of the copied Material Instance do you change to tune the water?"
        choices: ["Roughness and Metallic", "Absorption and Scattering", "Intensity and Source Angle", "Inner Radius and Falloff Distance"]
        answer_index: 1
        explain: "Absorption and Scattering describe what happens to light inside the water. Together they set its color and how far you can see into it."
      - q: "What does Scattering control?"
        choices: ["How fast the water flows", "How high the waves are", "How large the lake is", "How light spreads inside the water"]
        answer_index: 3
        explain: "Scattering is how light spreads inside the water. It changes how clear or murky the water looks."
      - q: "Why do you write one line about the mood before you tune the water?"
        choices: ["It gives you a target to tune toward and to judge the result against", "The plugin reads the line and sets the values", "The line is used as the name of the water body", "It replaces the screenshot as proof"]
        answer_index: 0
        explain: "Clear and tropical needs different values from dark and murky. With the mood written down, you know when the water is right."
      - q: "The water values look right, but the water still feels wrong for the mood. What else should you look at?"
        choices: ["The name of the level", "The size of the Content Browser", "The sky and the lighting around the water", "The number of camera bookmarks"]
        answer_index: 2
        explain: "Water reflects everything around it. If the sky does not fit the mood, the water will not fit it either."
    flavors:
      _default: {why: "Water reflects everything around it.", do: "Add one body and tune it."}
      lookdev: {why: "Water shows off lighting mistakes fast.", do: "Match it to your sky."}

  - id: EAQ34
    rank: 3
    difficulty: expert
    specializations: [lookdev]
    subjects: [foliage, procedural-foliage]
    required_spine: false
    required: false
    title: Procedural foliage for a forest edge
    brief: "A Procedural Foliage Volume is a box that fills an area with trees and plants by simulating how they spread. You give it foliage types, which act like species, each with its own spacing rules. Plants with the same distance between them look artificial, so the settings matter. In this quest you set up a volume with two species and tune it until the edge of the forest looks natural."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-foliage-tool-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 procedural foliage spawner volume"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a level of your own that has a Landscape, or create a new level and make a Landscape in Landscape Mode."
      - "Set up a Procedural Foliage Volume with 2 species. First open Edit, then Editor Preferences, find the Experimental section and enable Procedural Foliage."
      - "Right-click in the Content Browser, open Foliage, and create two Static Mesh Foliage assets (one per species) and one Procedural Foliage Spawner. Give each Static Mesh Foliage asset a mesh, for example trees of your own, or SM_Cylinder and SM_ChamferCube from the folder LevelPrototyping/Meshes of the template as stand-ins."
      - "Open the spawner and add both species under Foliage Types. Drag the spawner into the level, scale it over the area where the forest edge should be, and click Resimulate in its Details panel."
      - "Tune the spacing settings in the two Static Mesh Foliage assets, such as Shade Radius, Initial Seed Density and Average Spread Distance, and click Resimulate after each change. Continue until the edge of the forest looks natural and not uniform."
    done_when: "Send a screenshot of the forest edge."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is a Procedural Foliage Volume?"
        choices: ["A brush that paints single plants by hand", "A box that fills an area with plants by simulating how they spread", "A volume that hides plants from the camera", "A folder that stores tree meshes"]
        answer_index: 1
        explain: "The volume simulates how plants spread and places them inside its box. You do not place each tree yourself."
      - q: "What do foliage types act like in this system?"
        choices: ["Like materials on a mesh", "Like lights in a room", "Like cameras in a shot", "Like species with their own spacing rules"]
        answer_index: 3
        explain: "Each foliage type is one kind of plant. Its settings say how it spreads and how much room it needs."
      - q: "Why do the spacing settings matter so much?"
        choices: ["Plants with the same distance between them look artificial", "Plants that are too close cannot be saved", "Plants only cast shadows at one distance", "Plants need spacing to get collision"]
        answer_index: 0
        explain: "Real forests are uneven. Even spacing looks like a plantation, so you tune the rules until the result is not uniform."
      - q: "The Procedural Foliage Spawner is missing from the Foliage menu of the Content Browser. What do you check first?"
        choices: ["That the Water plugin is enabled", "That the level is saved", "That Procedural Foliage is enabled in the Editor Preferences", "That Nanite is enabled on the tree meshes"]
        answer_index: 2
        explain: "Procedural Foliage is an experimental feature. You turn it on in Edit, then Editor Preferences, in the Experimental section."
      - q: "Which assets do you create for a volume with 2 species?"
        choices: ["Two Landscape Grass Type assets and one PCG Graph", "Two Static Mesh Foliage assets and one Procedural Foliage Spawner", "Two Material Instances and one master material", "Two Level Instances and one Data Asset"]
        answer_index: 1
        explain: "Each species is one Static Mesh Foliage asset with its own mesh and rules. The spawner holds the list of species."
      - q: "Where do you add the two species in the spawner?"
        choices: ["Under Mesh Entries", "Under Grass Types", "Under Parameter Name", "Under Foliage Types"]
        answer_index: 3
        explain: "The spawner has a list named Foliage Types. Every Static Mesh Foliage asset in that list takes part in the simulation."
      - q: "How do you make the spawner fill the forest edge?"
        choices: ["Drag it into the level, scale it over the area, and click Resimulate", "Open it and click Generate", "Paint it on the landscape in Foliage Mode", "Add it to the Landscape Material"]
        answer_index: 0
        explain: "The spawner in the level becomes the volume. Resimulate in its Details panel runs the simulation inside the scaled box."
      - q: "Which of these are spacing settings of a Static Mesh Foliage asset?"
        choices: ["Inner Radius, Falloff Distance and Apply Reverb", "Source Angle, Intensity and Light Color", "Shade Radius, Initial Seed Density and Average Spread Distance", "Absorption, Scattering and Roughness"]
        answer_index: 2
        explain: "These settings control how many plants start, how far they spread, and how much room each one takes. You tune them in both species."
      - q: "You changed Average Spread Distance, but the forest in the level looks the same. What do you do?"
        choices: ["Restart the editor", "Click Resimulate in the Details panel of the volume", "Delete the Landscape", "Enable Procedural Foliage again"]
        answer_index: 1
        explain: "The plants in the level are the result of the last simulation. A changed setting only shows after you click Resimulate."
      - q: "When is the tuning of the forest edge finished?"
        choices: ["When both species have the same settings", "When every tree has the same distance to the next", "When the volume holds no plants", "When the edge of the forest looks natural and not uniform"]
        answer_index: 3
        explain: "The goal is a result that looks grown and not placed. You keep tuning both species together until the edge reads as natural."
    flavors:
      _default: {why: "Uniform spacing looks artificial.", do: "Tune two species together."}
      lookdev: {why: "Uses what you know about placing foliage.", do: "Check it from your Cine Camera."}
