      - q: "Why do you make a Material Instance of the emissive material?"
        choices: ["So you can change how strong the glow is", "So Lumen is turned on", "So the material becomes a light actor", "So the screen gets collision"]
        answer_index: 0
        explain: "Intensity is a parameter, so an instance can change it quickly. You try the values 1, 10 and 50 and compare the results."
      - q: "Why do you test the glow in a dark place, such as a closed room?"
        choices: ["Emissive materials do not work outdoors", "Lumen is turned off in bright levels", "The glow is easy to see there", "Dark rooms need no material"]
        answer_index: 2
        explain: "In a bright level the sun hides the small amount of light from the screen. In a dark room you see clearly what the glow adds."
      - q: "What happens when you raise Intensity from 1 to 50?"
        choices: ["The glow changes its color to white only on the edges", "The surface becomes transparent", "The glow stays the same, but the room gets darker", "The glow becomes much stronger and lights the nearby surfaces more"]
        answer_index: 3
        explain: "Intensity multiplies the emissive color. A higher value sends more light into the scene."
      - q: "When do you still need a real light next to an emissive surface?"
        choices: ["When the material has a parameter", "When the glow does not give enough light for the scene", "When the room has more than four walls", "When Lumen is turned on"]
        answer_index: 1
        explain: "A glowing surface does not always light its surroundings well enough. A real light then gives the light that the glow alone cannot."
    flavors:
      _default: {why: "Glowing things are everywhere in scenes.", do: "Build one and test its light."}
      lookdev: {why: "Emissive alone can be noisy with Lumen.", do: "Back it with a real light when needed."}

  # =====================================================================
  # RANK 3 — bay-lookdev (Environment Art Specialty)
  # Shared required for all specializations (defined elsewhere): AQ1, AQ2, AQ3.
  # =====================================================================
  - id: EAQ25
    rank: 3
    difficulty: expert
    specializations: [lookdev]
    subjects: [materials, master-material, static-switch, performance]
    required_spine: false
    required: true
    title: Master material architecture
    brief: "A Static Switch Parameter is an on or off switch in a material that turns a part of the graph on or off for each instance. Switches are cheap for one instance, but every different combination makes Unreal compile another version of the shader, called a shader permutation. Too many permutations make compile times and memory use grow. In this quest you add switches to a master material, count the permutations, and remove a switch that is not worth its cost."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-materials"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 master material static switch parameter shader permutations cost"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/instanced-materials-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a master material of your own, or make a small one now: a material named M_Master_Surface with a color texture, a normal texture and a roughness parameter. Extend it with Static Switch Parameters: one that turns a detail normal on or off, one for emissive, and one more of your choice."
      - "Create instances that use different combinations of the switches."
      - "Write down how many shader permutations your switches can create."
      - "Remove one switch that is not worth its cost, and explain why you removed it."
    done_when: "Send a writeup with the number of permutations, a screenshot of the graph, and the name of the switch you removed."
    xp: 110
    verify_type: writeup
    quiz:
      - q: "What is a Static Switch Parameter?"
        choices: ["A number in a material that an instance can set to any value", "An on or off switch in a material that turns a part of the graph on or off for each instance", "A setting that makes a mesh static in the level", "A node that switches between two levels"]
        answer_index: 1
        explain: "Each Material Instance sets the switch to on or off. The part of the graph behind the switch is then used or left out for that instance."
      - q: "What is a shader permutation?"
        choices: ["A copy of a texture at a lower resolution", "A list of the parameters of a material", "A shader version compiled for one combination of switches", "A light that changes its color over time"]
        answer_index: 2
        explain: "Every different combination of switch settings needs its own compiled version of the shader. Each of these versions is a shader permutation."
      - q: "Why is a switch cheap for one single instance?"
        choices: ["The part that is switched off is left out of its shader", "The switch is checked again on every frame", "The switch lowers the resolution of the textures", "The switch moves the work to the Game thread"]
        answer_index: 0
        explain: "A static switch is decided when the shader is compiled. An instance with the switch off does not pay for the nodes behind it."
      - q: "What grows when a master material has too many permutations?"
        choices: ["The size of the meshes in the level", "The number of lights in the scene", "The length of the parameter names", "Compile times and memory use"]
        answer_index: 3
        explain: "Each permutation must be compiled and kept in memory. Many switches can create many versions of one material."
      - q: "A master material has 3 Static Switch Parameters. How many different combinations of on and off are possible?"
        choices: ["3", "6", "8", "9"]
        answer_index: 2
        explain: "Each switch has two states, so 3 switches give 2 times 2 times 2, which is 8 combinations. That is the most permutations these switches can create."
      - q: "What happens to the number of possible combinations when you add one more switch?"
        choices: ["It grows by one", "It doubles", "It stays the same", "It is cut in half"]
        answer_index: 1
        explain: "The new switch can be on or off for every combination that already exists. That is why you count before you add more switches."
      - q: "Two instances use exactly the same combination of switches. What does this mean for the permutations?"
        choices: ["They need two permutations each", "They cannot be used in the same level", "They turn all switches off", "They share one permutation"]
        answer_index: 3
        explain: "Unreal compiles another version only for each different combination. Instances that only differ in colors or numbers share one version."
      - q: "Can a Static Switch Parameter be changed while the game runs?"
        choices: ["No, it is fixed when the shader is compiled", "Yes, on every frame, like a scalar parameter", "Yes, but only from the Level Blueprint", "Yes, but only once per level"]
        answer_index: 0
        explain: "The word static means the choice is made at compile time. Values that must change during play need normal parameters."
      - q: "Which switches do you add to the master material in this quest?"
        choices: ["One for collision, one for shadows and one for physics", "One for the sun, one for the sky and one for the fog", "One for a detail normal, one for emissive and one more of your choice", "One for each texture channel"]
        answer_index: 2
        explain: "The detail normal and the emissive are parts that not every surface needs. A switch lets each instance decide."
      - q: "Which switch is the best one to remove?"
        choices: ["The one that most instances turn on and off in different ways", "The one that is not worth its cost, for example because nobody uses it", "The one with the shortest name", "The one that was added first"]
        answer_index: 1
        explain: "Every switch adds possible permutations. A switch that people do not use adds cost and gives nothing back, so it should go."
    flavors:
      _default: {why: "Switches are cheap per instance but add shader permutations.", do: "Count before you add more."}
      lookdev: {why: "Your master material will be shared with the server.", do: "Keep only switches people will use."}

  - id: EAQ26
    rank: 3
    difficulty: expert
    specializations: [lookdev]
    subjects: [materials, material-functions]
    required_spine: false
    required: true
    title: Material functions
    brief: "A Material Function is a small piece of material graph that you save as its own asset and can use in many materials. It stops you from building the same group of nodes again and again, and when you fix the function, every material that uses it is fixed too. In this quest you move one part of a material into a function and use it in two materials."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/material-functions-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 material function create inputs outputs reuse"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a material of your own, or make a small one with a color texture and a normal texture. In it, build detail normal blending: sample a second normal texture with a higher tiling and combine it with the first one using the BlendAngleCorrectedNormals node. This is a group of nodes you would repeat in many materials. Move it into a Material Function named MF_DetailNormal."
      - "Give the function inputs with clear names and default values. Also write a description for it."
      - "Use the function in 2 different materials."
    done_when: "Send a screenshot of the function graph, and screenshots of both materials that use it."
    xp: 90
    verify_type: screenshot
    quiz:
      - q: "What is a Material Function?"
        choices: ["A Blueprint node that changes a material during play", "A setting that turns a material into a decal", "A copy of a material that only changes parameters", "A small piece of material graph saved as its own asset that many materials can use"]
        answer_index: 3
        explain: "A Material Function holds a group of nodes as an asset. You place it in a material like one node."
      - q: "What happens when you fix a mistake inside a Material Function?"
        choices: ["Every material that uses the function is fixed too", "Only the first material that used it is fixed", "The materials that use it must be built again by hand", "The function is removed from all materials"]
        answer_index: 0
        explain: "The materials do not hold a copy of the nodes. They all point to the same function, so one fix reaches all of them."
      - q: "Which kind of node group is a good choice to move into a Material Function?"
        choices: ["A group that is used in only one material", "A single Constant node", "A group of nodes that you would repeat in many materials", "The output node of the material"]
        answer_index: 2
        explain: "A function saves work when the same nodes are needed again and again. Detail normal blending is such a group."
      - q: "What is detail normal blending in this quest?"
        choices: ["Two color textures are mixed by a vertex color", "A second normal texture with a higher tiling is combined with the first", "A normal texture is turned into a height texture", "A normal texture is removed to save memory"]
        answer_index: 1
        explain: "The first normal texture gives the large shapes. The second one repeats more often and adds small detail that shows up close."
      - q: "Which node combines the two normal textures?"
        choices: ["Lerp", "Landscape Layer Blend", "WorldAlignedTexture", "BlendAngleCorrectedNormals"]
        answer_index: 3
        explain: "BlendAngleCorrectedNormals is made for combining a base normal with a detail normal. It keeps the result a correct normal."
      - q: "Why does the detail normal texture use a higher tiling than the first one?"
        choices: ["So it repeats more often and adds small detail", "So it covers the mesh only once", "So it uses less memory", "So it changes the Base Color"]
        answer_index: 0
        explain: "A higher tiling makes the texture smaller on the surface. Its bumps then read as fine detail on top of the larger shapes."
      - q: "What do you give each input of MF_DetailNormal?"
        choices: ["A random value and a color", "A lock and a password", "A clear name and a default value", "A shortcut key and an icon"]
        answer_index: 2
        explain: "A clear name tells the user what to connect. A default value lets the function give a useful result even when that input is left empty."
      - q: "Why do you write a description for the function?"
        choices: ["The function cannot be saved without one", "So other people know what the function does without opening it", "The description makes the function faster", "So the function gets the prefix MF_"]
        answer_index: 1
        explain: "A function is made to be shared. The description tells the next person what it is for, so they can use it with confidence."
      - q: "Why do you use the function in 2 different materials?"
        choices: ["A function only compiles when two materials use it", "The two materials must look the same", "One material holds the inputs and the other the outputs", "It shows that the same nodes are now reused and not built twice"]
        answer_index: 3
        explain: "Reuse is the point of a function. Two materials that share MF_DetailNormal prove that the group of nodes exists only once."
      - q: "A material shows the detail normal too strongly, and it uses MF_DetailNormal. Where can you fix this for all materials at once?"
        choices: ["Inside the Material Function", "In the Details panel of each mesh", "In the World Settings of the level", "In the texture file of the first normal"]
        answer_index: 0
        explain: "The blend is built in the function, so that is where a general fix belongs. Every material that uses the function gets the change."
    flavors:
      _default: {why: "Functions stop you rebuilding the same nodes.", do: "Pull one repeated chunk out."}
      lookdev: {why: "Groundwork for the Rank 4 function library.", do: "Write a description for every input."}

  - id: EAQ27
    rank: 3
    difficulty: expert
    specializations: [lookdev]
    subjects: [materials, vertex-paint, blending]
    required_spine: false
    required: true
    title: Vertex paint blending
    brief: "Every vertex (corner point) of a mesh can store a color, and a material can read that color. If you paint these colors in the level, you can blend a second surface, such as moss or grime, over the base surface on one mesh at a time. This is a cheap way to make copies of the same mesh look different. In this quest you add this blend to a material and paint it on a mesh."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-a-texture-blended-material-for-vertex-weights-painting-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 vertex paint mesh paint mode material blend height lerp"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make a material with two surfaces, for example stone as the base and moss on top. Free surfaces from Fab work well. For a first test, two textures of the template that look different also work, such as T_Quinn_01_D and T_GridChecker_A. Add a Vertex Color node and use its red channel as the Alpha of a Lerp node between the two surfaces, so that red paint puts the second surface over the base surface."
      - "Place a mesh with enough vertices in the level, for example a sphere, and apply the material. The paint is stored on the vertices, so a simple cube has too few. Use Mesh Paint mode to paint on the mesh."
      - "Add a height-based blend, which uses a height texture to decide where the second surface appears first. This makes the edge look sharp and natural and not like a soft smear."
    done_when: "Send before and after screenshots of the painted mesh, and also a screenshot of the blend graph."
    xp: 90
    verify_type: screenshot
    quiz:
      - q: "What is a vertex of a mesh?"
        choices: ["A texture that covers the mesh", "A corner point of the mesh", "A material slot of the mesh", "A copy of the mesh in the level"]
        answer_index: 1
        explain: "A mesh is made of triangles, and their corner points are the vertices. Each vertex can store a color."
      - q: "What can you do with the colors stored on the vertices?"
        choices: ["Change the collision of the mesh", "Make the mesh cast no shadow", "Let a material read them and use them to blend two surfaces", "Move the mesh while the game runs"]
        answer_index: 2
        explain: "A material can read the vertex color. Where you paint, the material shows more of the second surface, such as moss over stone."
      - q: "Which node reads the painted color in the material?"
        choices: ["Texture Sample", "TexCoord", "Constant3Vector", "Vertex Color"]
        answer_index: 3
        explain: "The Vertex Color node gives the color stored on the vertices of the mesh. Each of its channels can be used as a mask."
      - q: "How do you use the red channel of the Vertex Color node in this quest?"
        choices: ["As the Alpha of a Lerp node between the two surfaces", "As the Base Color of the material", "As the Roughness of the material", "As the tiling of the textures"]
        answer_index: 0
        explain: "A Lerp node blends from one input to the other by its Alpha. With red as the Alpha, the amount of red paint decides how much of the second surface shows."
      - q: "What does red paint do on a mesh with this material?"
        choices: ["It makes the mesh red", "It removes the base surface from the material", "It puts the second surface over the base surface", "It deletes the painted vertices"]
        answer_index: 2
        explain: "You do not see the red itself. The material uses it as a mask, so painted areas show the second surface."
      - q: "Why is a sphere a better test mesh than a simple cube?"
        choices: ["A sphere has no UVs", "The paint is stored on the vertices, and a simple cube has too few", "A cube cannot have a material", "A sphere is always larger than a cube"]
        answer_index: 1
        explain: "You can only paint where there are vertices. A simple cube has just its corners, so there is nothing to paint on its faces."
      - q: "Which editor mode do you use to paint on the mesh?"
        choices: ["Landscape Mode", "Foliage Mode", "Modeling Mode", "Mesh Paint mode"]
        answer_index: 3
        explain: "Mesh Paint mode paints vertex colors onto meshes in the level. The paint belongs to that one placed mesh."
      - q: "What does a height-based blend use to decide where the second surface appears first?"
        choices: ["A height texture", "The height of the camera", "The Z position of the mesh in the level", "The scale of the mesh"]
        answer_index: 0
        explain: "The height texture says which parts of the surface are high and which are low. The second surface then appears in some parts before others, for example in the cracks first."
      - q: "What does the height-based blend improve?"
        choices: ["The frame rate of the level", "The number of vertices of the mesh", "The edge of the blend, which looks sharp and natural", "The size of the texture files"]
        answer_index: 2
        explain: "A plain vertex blend fades softly between the painted vertices. The height texture breaks that fade into a detailed edge."
      - q: "Why is vertex paint a cheap way to add variety to a level?"
        choices: ["It lowers the triangle count of each mesh", "Copies of one mesh can look different with the same material", "It removes the need for textures", "It turns off the lighting on painted meshes"]
        answer_index: 1
        explain: "The mesh and the material stay the same. Only the paint differs from copy to copy, which breaks up repetition at a low cost."
    flavors:
      _default: {why: "Vertex paint breaks up repetition cheaply.", do: "Paint one blend on one mesh."}
      lookdev: {why: "Hand-placed variation reads as care.", do: "Use a height mask for a crisp edge."}

  - id: EAQ28
    rank: 3
