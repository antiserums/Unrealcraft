# Not required for Environment Art: any C++ quest (R3-CD-*, PQ17), GDQ1..04, R2-PR-*.
# R2-MAT-* is required for lookdev and tech_art only. Programming has no materials requirement beyond Starter Quest SQ8.

quests:
  # =====================================================================
  # RANK 1 — world-lighting
  # Shared prerequisites (defined in level_design_r1.yaml, do not redefine here):
  #   EAQ8 landscape, EAQ9 light types + Lumen, EAQ10 post process/exposure, EAQ11 foliage.
  # =====================================================================
  - id: EAQ1
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [reference, mood, art-direction]
    required_spine: false
    required: true
    title: Reference board and mood target
    brief: "A reference board is one image that holds a group of pictures you collected to guide your work. A mood target is the single picture and short description that says how your scene should feel. When you have a target, it is much easier to judge if your lighting is right or wrong. In this quest you collect reference images for one small space, pick one as your target, and describe it in three lines."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/lighting-the-environment-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "environment art reference board mood board lighting reference how to"
    checklist:
      - "Collect 8 to 12 reference images for one small space. They can be photos, film stills or paintings."
      - "Mark each image with what you are taking from it: the light direction, the color, the material, or the composition (how things are arranged in the picture)."
      - "Pick one image as your mood target. This is the image your scene should feel like."
      - "Write 3 lines: one for the time of day, one for the color of the key light (the main light in the scene), and one for the feeling you want."
    done_when: "Send an image of your reference board together with your 3-line mood target, posted as a writeup."
    xp: 60
    verify_type: writeup
    quiz: []  # TODO Phase 4
    flavors:
      _default: {why: "A target makes lighting decisions easier to judge.", do: "Pick one image and say why."}
      lookdev: {why: "Every lighting pass from here gets judged against a target.", do: "Label what each reference is for."}

  - id: EAQ2
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [sky, hdri, atmosphere, fog]
    required_spine: false
    required: true
    title: Sky, HDRI and atmosphere mood
    brief: "The sky gives a base color to everything below it, so it has a strong effect on the mood of a scene. Unreal offers two common ways to make a sky. One is the atmosphere system, which calculates the sky from a sun light. The other is an HDRI, a 360 degree photo of a real sky that also lights the scene. In this quest you light the same scene both ways and compare which one fits a mood you chose better."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/environmental-light-with-fog-clouds-sky-and-atmosphere-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 hdri backdrop sky atmosphere height fog mood lighting"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/sky-lights-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/sky-atmosphere-component-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/exponential-height-fog-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Write one line that describes the mood you want, for example a cold, foggy morning or a warm sunset. If you already have a mood target picture, use that. Create a new level with File, New Level, Empty Level, and place a floor and a few objects in it."
      - "Light the scene with Sky Atmosphere, a Directional Light (the sun), a Sky Light (soft light that comes from the whole sky), and Height Fog."
      - "Duplicate the level and light the copy with an HDRI instead. You can use the HDRI Backdrop actor, which needs the HDRI Backdrop plugin from Edit > Plugins and comes with a sample HDRI, or a Sky Light with a cubemap, which is a texture that covers all directions."
      - "Push each version toward your mood. Change the sun angle, the fog color and the fog density until the mood is close."
      - "Compare the two versions from the same camera bookmark, so that both pictures show exactly the same view."
    done_when: "Send side-by-side screenshots of the atmosphere version and the HDRI version taken from the same bookmark. Add your one-line mood, and 2 lines that say which version fits it better."
    xp: 90
    verify_type: screenshot
    quiz: []  # TODO Phase 4
    flavors:
      _default: {why: "The sky sets the base color of everything below it.", do: "Try two sky setups from one camera."}
      lookdev: {why: "Mood mostly comes from the sky and fog.", do: "Match your target before adding any other lights."}

  - id: EAQ3
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [ies, physical-units, interior-lighting]
    required_spine: false
    required: true
    title: IES profiles and physical light units indoors
    brief: "Unreal can measure light in the same units that real lamps use, such as candela and lumens, and can set its color as a temperature in Kelvin. When you use real values, your lighting behaves in a way you can predict. An IES profile is a small file from a lamp maker that describes the shape of the light a real lamp gives. In this quest you light a room with real-world values and see what an IES profile changes."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-ies-light-profiles-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 ies profile physical light units lumens candela interior"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-physical-lighting-units-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/auto-exposure-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open a room level of your own, or build a simple closed room in a new level from cubes: a floor, four walls and a ceiling. Set the exposure to a fixed value: add a Post Process Volume, tick Infinite Extent (Unbound), and set Metering Mode to Manual in its Exposure section. Exposure is how bright the camera makes the picture, and a fixed value stops Unreal from adjusting it, so you can see brightness changes."
      - "Place 2 lights and give them real-world intensities, in candela or lumens, and a realistic color temperature."
      - "Apply an IES profile to one of the lights. Lamp makers offer IES files as free downloads on their websites. Drag one .ies file into the Content Browser to import it, then pick it in the IES Texture setting of the light. The engine also comes with a few profiles, for example Complex_IES. To see them in the list, click the settings icon of the list and turn on Show Engine Content. Compare how the light looks with the profile and without it."
      - "Write down the intensity and the temperature you used, and where you got each value from."
    done_when: "Send before and after screenshots of the light with the IES profile, and add your notes about the intensity values."
    xp: 80
    verify_type: screenshot
    quiz: []  # TODO Phase 4
    flavors:
      _default: {why: "Real-world units make lighting predictable.", do: "Light a room with real numbers."}
      lookdev: {why: "Physical units make your scenes consistent with each other.", do: "Lock exposure before judging brightness."}

  - id: EAQ4
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [composition, cameras, bookmarks, cine-camera]
    required_spine: false
    required: true
    title: "Composition: bookmarks and a Cine Camera still"
    brief: "Composition is the way things are arranged inside the picture frame. The position of the camera decides what people see, so it matters as much as the lighting. A Cine Camera Actor is a camera in Unreal that works like a real film camera, with a focal length (how wide or narrow the view is) and a focus distance. In this quest you save camera bookmarks, frame a view with a Cine Camera, and take a still image through it."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-bookmarks"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 cine camera actor focal length composition still screenshot"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/taking-screenshots-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Work in any level that has a few objects in it: the level of the template works, and so does a scene of your own. Save 3 camera bookmarks: one wide view, one medium view and one detail view."
      - "Place a Cine Camera Actor and set its focal length and focus distance. Then pilot the camera, which means you look through it and move it, and frame the best view."
      - "Turn on a composition overlay, such as the rule of thirds grid or a similar one. Use it to adjust the frame."
      - "Take a High Resolution Screenshot while you look through the Cine Camera."
    done_when: "Send the still image, and also a screenshot of the Cine Camera settings."
    xp: 70
    verify_type: screenshot
    quiz: []  # TODO Phase 4
    flavors:
      _default: {why: "Where the camera sits decides what people see.", do: "Frame one shot on purpose."}
      lookdev: {why: "Your reviews happen through fixed cameras.", do: "Save bookmarks before you light, not after."}

  - id: EAQ12
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [lighting, diorama, capstone]
    required_spine: false
    required: true
    capstone: true
    title: Lit diorama
    brief: "A diorama is a small, complete scene, like a model in a box. A small finished scene teaches you more than a big scene that you never finish, because you have to make every part work together. In this quest you combine several skills: you build a small piece of landscape with plants, light it toward a mood you chose, and take three still images. Everything you need to build is listed in the steps."
    time_min: 180
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/artist-02-light-a-scene"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 lit diorama small environment lighting lumen"
    checklist:
      - "Open a project made from the Third Person template, or create one. Choose a mood target: one reference picture, or three lines that give the time of day, the color of the main light and the feeling you want. Then build a small diorama of roughly 10 x 10 m in a new level: create a small Landscape in Landscape Mode, sculpt it a little, and paint a few plants or rocks on it in Foliage Mode. You can reuse a terrain of your own."
      - "Light it toward your mood target. Add a Directional Light, a Sky Light, a Sky Atmosphere and Height Fog, and at least one local light, such as a Point Light, with an intensity that you set in real units (candela or lumens)."
      - "Set the exposure and the post process settings on purpose, so that the result is your choice and not the default: add a Post Process Volume, tick Infinite Extent (Unbound), and set Metering Mode to Manual in its Exposure section."
      - "Save 3 camera bookmarks and take a still from each. Take one of them through a Cine Camera Actor: place one, right-click it and choose Pilot, frame the view, and take a High Resolution Screenshot."
      - "Write 3 lines that say what matches the target and what does not match it yet."
    done_when: "Send your 3 stills, the mood target image, and your 3-line writeup."
    xp: 200
    verify_type: screenshot
    quiz: []  # TODO Phase 4
    flavors:
      _default: {why: "A small finished scene teaches more than a big unfinished one.", do: "Keep it small and finish the lighting."}
      lookdev: {why: "This diorama becomes walkable at Rank 2.", do: "Judge it against your target, not against nothing."}

  # ---------- Rank 1 electives ----------
  - id: EAQ5
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [volumetric-fog, atmosphere]
    required_spine: false
    required: false
    title: Volumetric fog shafts
    brief: "Volumetric Fog is fog that reacts to light in 3D space. It makes light visible in the air, so you can see beams of light, often called light shafts, when light comes through a window. In this quest you turn on Volumetric Fog and adjust one light until the shafts help the picture."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/volumetric-fog-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 volumetric fog light shafts god rays"
    checklist:
      - "Open any project, or create one from the Third Person template. Open a level of your own that has a dark room with a window, or build one in a new Basic level from cubes: a floor, four walls and a ceiling, with a gap in one wall as the window. Select the Exponential Height Fog actor in the level. If there is none, drag one in from the Place Actors panel, under Visual Effects. In the Details panel, turn on Volumetric Fog. Aim a Directional Light or a Spot Light through the window into the room, and adjust the scene until you can see light shafts coming through the window."
      - "Select the light and change Volumetric Scattering Intensity in its Details panel, which controls how strongly that light shows in the fog. The shafts should support the image and not wash it out."
    done_when: "Send a screenshot that shows the light shafts."
    xp: 40
    verify_type: screenshot
    quiz: []  # TODO Phase 4
    flavors:
      _default: {why: "Fog makes light visible in the air.", do: "Get one clean shaft."}
      lookdev: {why: "A common mood tool, easy to overdo.", do: "Stop before it looks milky."}

  - id: EAQ6
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [local-fog, atmosphere]
    required_spine: false
    required: false
    title: Local fog volumes for depth
    brief: "A Local Fog Volume is a small area of fog that you can place anywhere in the level, unlike the height fog that covers the whole scene. Layers of fog at different distances make a picture look deeper, because far things become softer than near things. In this quest you place two of these volumes and compare the scene with and without them."
    time_min: 30
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/local-fog-volumes-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 local fog volume"
    checklist:
      - "Open any project, or create one from the Third Person template. Work in any outdoor level with a main subject in front and something far behind it: the level of the template works, and so does a scene of your own. In the Place Actors panel, search for Local Fog Volume and drag 2 of them into the level. Scale and move them so that they separate the foreground from the background, for example one behind the main subject and one far away. Change the two Extinction values in the Details panel to make the fog thicker or thinner."
      - "Take one screenshot with the volumes and one screenshot without them, from the same view."
    done_when: "Send the before and after screenshots."
    xp: 30
    verify_type: screenshot
    quiz: []  # TODO Phase 4
    flavors:
      _default: {why: "Fog layers add depth.", do: "Separate two planes with fog."}
      lookdev: {why: "Local control without changing the whole sky.", do: "Use it where the eye should stop."}

  - id: EAQ7
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [directional-light, shadows]
    required_spine: false
    required: false
    title: Sun angle and shadow shape
    brief: "The angle of the sun decides where shadows fall and how long they are. The Source Angle setting of the Directional Light decides how soft the edges of those shadows are. Together they change how clearly you can read the shapes in a scene. In this quest you render the same view with different sun settings and choose the best one."
    time_min: 30
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/directional-lights-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 directional light source angle soft shadows"
    checklist:
      - "Open any project, or create one from the Third Person template. Work in any outdoor level that has a Directional Light and a few objects that cast shadows: the level of the template works. Render the same view at 3 sun angles and with 2 Source Angle values for each, so that you get 6 renders. Select the Directional Light and rotate it to change the sun angle. Source Angle is in its Details panel, under Light: a small value gives sharp shadows and a large value gives soft shadows. Take each render from the same camera bookmark."
      - "Pick the render where the shapes are the easiest to read, and write one line that says why."
    done_when: "Send a contact sheet (one image that shows all 6 renders together), and say which one you picked."
    xp: 40
    verify_type: screenshot
    quiz: []  # TODO Phase 4
    flavors:
      _default: {why: "Shadow shape changes how forms read.", do: "Compare six versions."}
      lookdev: {why: "Soft vs hard shadow is a mood decision.", do: "Choose based on your target."}

  # =====================================================================
  # RANK 2 — materials (shared materials track R2-MAT-*)
  # Required for lookdev and tech_art. Level Design: adjacent for decals only (EAQ18).
  # Programming: none. Opposite taster for Environment Art: GDQ5 (tasters.yaml).
  # =====================================================================
  - id: EAQ13
    rank: 2
    difficulty: adept
    specializations: [lookdev, tech_art]
    subjects: [materials, material-editor]
    required_spine: false
    required: true
    taster_for: [cinematics]
    title: Material Editor basics
    brief: "A material is the asset that decides how a surface looks: its color, how shiny it is, and if it is metal. Every surface in Unreal has one. You build materials in the Material Editor by connecting small boxes called nodes to the inputs of the material. In this quest you create your first simple material, look at how much work it costs to draw, and put it on a mesh."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-materials"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 material editor basics beginner nodes"
    checklist:
      - "Open any project, or create one from the Third Person template. Create a material named M_Basic in the folder UC/Materials (create the folder if it does not exist yet). Double-click it to open the Material Editor."
      - "Add a Constant3Vector node, which holds a color, and connect it to Base Color. Add Constant nodes, which each hold one number, and connect them to Roughness and Metallic."
      - "Look at the material in the preview viewport. Open the Stats panel to see the instruction counts, which show how much work the material costs to draw."
      - "Apply the material to a mesh in any level, for example a cube or a sphere from the Place Actors panel."
    done_when: "Send a screenshot of the material graph with the Stats panel visible."
    xp: 60
    verify_type: screenshot
    quiz: []  # TODO Phase 4
    flavors:
      _default: {why: "Every surface in Unreal is a material.", do: "Build one from scratch."}
      lookdev: {why: "You'll live in this editor from here on.", do: "Keep the Stats panel open."}
      tech_art: {why: "Instruction counts start mattering soon.", do: "Note the count for each version you build."}

  - id: EAQ14
    rank: 2
    difficulty: adept
    specializations: [lookdev, tech_art]
    subjects: [materials, pbr]
    required_spine: false
    required: true
    title: PBR inputs
    brief: "PBR means physically based rendering. It is a way to describe a surface with a few inputs, such as Base Color, Roughness and Metallic, that act like real materials do. When the values are plausible, the surface looks right under any light. A dielectric is any material that is not a metal, such as plastic, wood or stone. In this quest you make four test surfaces, called swatches, and compare them under the same light."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/artist-03-create-materials-and-material-instances"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 pbr base color roughness metallic normal explained"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make 4 swatches, each a simple material on its own sphere: a rough dielectric, a glossy dielectric, a rough metal and a polished metal."
      - "Keep the Base Color values of each swatch in a plausible range. Do not use pure black or pure white."
      - "Add a normal map to one swatch. A normal map is a texture that fakes small bumps on the surface. The template has normal maps in the folder Characters/Mannequins/Textures, with names that end in _N. Compare the swatch with and without it."
      - "Place the four spheres next to each other in one level, so that they are all under the same light. The level of the template works, and so does a lit scene of your own. Put a Text Render actor at each sphere as a label."
    done_when: "Send a screenshot of the 4 swatches under the same light, with a label on each one."
    xp: 70
    verify_type: screenshot
    quiz: []  # TODO Phase 4
    flavors:
      _default: {why: "Plausible values react correctly to any light.", do: "Build four swatches."}
      lookdev: {why: "Wrong albedo breaks every lighting setup.", do: "Check values, not just looks."}
      tech_art: {why: "You'll validate these values for others.", do: "Note the ranges you used."}

  - id: EAQ15
    rank: 2
    difficulty: adept
    specializations: [lookdev, tech_art]
    subjects: [materials, textures, uvs]
    required_spine: false
    required: true
    title: Texture sampling and UVs
    brief: "Most materials get their detail from textures, which are images that the material reads, or samples. UVs are the coordinates that say which part of the image goes on which part of the mesh. Wrong texture settings are a common problem because Unreal does not show an error, the surface just looks a little wrong. In this quest you take three textures, check their settings, and use them in a material with adjustable tiling."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/coordinates-material-expressions-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 texture coordinate tiling texture sample srgb compression settings"
    checklist:
      - "Open a project made from the Third Person template, or create one. Pick a color texture, a normal texture and a packed texture of the same surface. The template has such a set in the folder Characters/Mannequins/Textures/Quinn: T_Quinn_01_D is the color texture, T_Quinn_01_N is the normal texture and T_Quinn_01_MRA is the packed texture. You can also import your own files. A packed texture stores a different grayscale map in each color channel. Open each texture and check its sRGB setting and its compression settings."
      - "Create a material named M_Surface and sample the three textures in it. Add a TexCoord node with a tiling parameter, so that you can change how many times the texture repeats."
      - "Split the packed texture into its channels, so that you can use each channel on its own."
      - "Apply the material to a large mesh, such as a cube scaled into a floor. Find one place where you can see the texture repeat. Fix it by changing the scale or by rotating the UVs."
    done_when: "Send a screenshot of the material graph, and also a screenshot of the textured mesh."
    xp: 70
    verify_type: screenshot
    quiz: []  # TODO Phase 4
    flavors:
      _default: {why: "Wrong texture settings are a common silent bug.", do: "Check every texture's settings once."}
      lookdev: {why: "Channel packing saves memory in every scene.", do: "Use one packed texture."}
      tech_art: {why: "You'll set import rules for these later.", do: "Note the compression each needs."}

  - id: EAQ16
    rank: 2
    difficulty: adept
    specializations: [lookdev, tech_art]
    subjects: [materials, parameters, instances]
    required_spine: false
    required: true
    taster_for: [cinematics]
    title: Parameters for instances
    brief: "A parameter is a value in a material that has a name and can be changed later without opening the material graph. A Material Instance is a copy of a material that only changes those parameters. This lets one material serve many different surfaces. In this quest you build a material with parameters and create three instances that look different from each other."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/instanced-materials-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 material parameters groups instances"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/artist-04-expanded-material-instances"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a material named M_Surface that reads a color texture and a normal texture, for example T_Quinn_01_D and T_Quinn_01_N from the folder Characters/Mannequins/Textures/Quinn of the template, or start from a textured material of your own. Give it scalar parameters (single numbers, for example for roughness and tiling), vector parameters (colors, for example a tint) and texture parameters."
      - "Put the parameters in named groups. Give each one a sensible default value and a sort priority, which sets the order they are listed in."
      - "Create 3 instances of the material that look like different materials."
    done_when: "Send a screenshot of the 3 instances applied to meshes, and also a screenshot of the Details panel of one instance."
