    required_spine: false
    required: true
    title: Nanite and displacement awareness
    brief: "Nanite is the system in Unreal Engine 5 that lets you use meshes with millions of triangles, because it only draws the detail that the screen can show. It changes how many polygons are too many, but it has limits and it does not support every kind of material. Displacement means that a texture moves the surface of the mesh in and out to add real detail. In this quest you enable Nanite on a mesh, look at how it works, and write down when you would use it."
