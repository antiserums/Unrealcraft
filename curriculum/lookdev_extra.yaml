  - id: EAQ19
    rank: 2
    difficulty: adept
    specializations: [lookdev, tech_art]
    subjects: [materials, world-aligned]
    required_spine: false
    required: false
    title: World-aligned texturing
    brief: "Normally a texture follows the UVs of a mesh, so the texture stretches when you scale the mesh. World-aligned texturing projects the texture from the world instead, so it keeps the same size on every mesh, at any scale. This is useful for blockout meshes, the simple shapes you use to plan a level, when their UVs are not good enough yet. In this quest you try it and compare it with normal UV texturing."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/texturing-material-functions-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 world aligned texture material function triplanar"
    checklist:
      - "Open a project made from the Third Person template, or create one. Place three cubes in any level and scale them to different sizes as blockout meshes. Pick any texture, for example T_GridChecker_A from the folder LevelPrototyping/Textures of the template. Make a material that uses a world-aligned texture: add the WorldAlignedTexture node, connect a Texture Object node with your texture to its TextureObject input, and connect its XYZ Texture output to Base Color. Apply the material to blockout meshes that you have scaled to different sizes. The pattern keeps the same size on all of them."
      - "Make a second material that uses a normal Texture Sample node, which follows the UVs of the mesh. Apply it to the same meshes, and compare the two results. Look at how the pattern stretches on the scaled meshes."
    done_when: "Send a before and after screenshot."
    xp: 50
    verify_type: screenshot
    quiz:
      - q: "A material uses a normal Texture Sample node. What happens to the pattern when you scale the mesh up?"
        choices: ["The pattern keeps its size", "The pattern stretches with the mesh", "The pattern disappears", "The pattern turns gray"]
        answer_index: 1
        explain: "A normal Texture Sample follows the UVs of the mesh. When the mesh is scaled, the UVs are scaled too, so the pattern stretches."
      - q: "How does world-aligned texturing place a texture?"
        choices: ["It paints the texture by hand on each mesh", "It copies the UVs from another mesh", "It projects the texture from the world, not from the UVs of the mesh", "It bakes the texture into the lighting"]
        answer_index: 2
        explain: "The texture is projected using positions in the world. The UVs of the mesh play no part, so their quality does not matter."
      - q: "You apply a world-aligned material to three cubes of different sizes. What do you see?"
        choices: ["The pattern keeps the same size on all of them", "The pattern is largest on the smallest cube", "The pattern shows only on the largest cube", "The pattern has a different color on each cube"]
        answer_index: 0
        explain: "Because the texture is measured in world space, one tile has the same size everywhere. Scaling a mesh does not change it."
      - q: "Which node projects a texture from the world in this quest?"
        choices: ["Texture Sample", "Landscape Layer Blend", "Constant3Vector", "WorldAlignedTexture"]
        answer_index: 3
        explain: "WorldAlignedTexture is the node that does the world projection. A normal Texture Sample node follows the UVs."
      - q: "How do you give your texture to the WorldAlignedTexture node?"
        choices: ["Connect a Texture Object node to its TextureObject input", "Connect a Constant node to its Base Color input", "Type the name of the texture in its title", "Drag the texture onto the mesh in the level"]
        answer_index: 0
        explain: "The node needs the texture itself, not a sampled color. A Texture Object node holds the texture and connects to the TextureObject input."
      - q: "Which output of the WorldAlignedTexture node do you connect to Base Color?"
        choices: ["TextureObject", "Roughness", "XYZ Texture", "Emissive Color"]
        answer_index: 2
        explain: "XYZ Texture is the result of the projection from all three axes. It covers every side of the mesh."
      - q: "When is world-aligned texturing most useful?"
        choices: ["On characters that are animated", "On blockout meshes whose UVs are not good enough yet", "On meshes that never get a texture", "On the sky of a level"]
        answer_index: 1
        explain: "Blockout meshes are simple shapes for planning a level, and you scale them all the time. World-aligned texturing gives them a clean pattern with no UV work."
      - q: "What happens to a world-aligned pattern when you move the mesh through the level?"
        choices: ["The pattern is deleted", "The pattern moves with the mesh", "The pattern becomes larger", "The pattern stays fixed in the world, so it slides over the mesh"]
        answer_index: 3
        explain: "The pattern belongs to the world and not to the mesh. That is fine for static blockout meshes, but it looks wrong on things that move."
    flavors:
      _default: {why: "Useful when UVs aren't good enough yet.", do: "Try it on scaled cubes."}
      lookdev: {why: "Fast texturing for blockouts and rocks.", do: "Note where it breaks."}

