  - id: EAQ13
    rank: 2
    difficulty: adept
    specializations: [lookdev, tech_art]
    subjects: [materials, material-editor]
    required_spine: false
    required: true
    taster_for: [cinematics]
    title: Material Editor basics
    brief: "A material is the asset that decides how a surface looks: its color, how shiny it is, and if it is metal. Every surface in Unreal has one. You build materials in the Material Editor by connecting small boxes called nodes to the inputs of the material. In this quest you create your first simple material, look at how much work it costs to draw, and put it on a mesh."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-materials"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 material editor basics beginner nodes"
    checklist:
      - "Open any project, or create one from the Third Person template. Create a material named M_Basic in the folder UC/Materials (create the folder if it does not exist yet). Double-click it to open the Material Editor."
      - "Add a Constant3Vector node, which holds a color, and connect it to Base Color. Add Constant nodes, which each hold one number, and connect them to Roughness and Metallic."
      - "Look at the material in the preview viewport. Open the Stats panel to see the instruction counts, which show how much work the material costs to draw."
      - "Apply the material to a mesh in any level, for example a cube or a sphere from the Place Actors panel."
    done_when: "Send a screenshot of the material graph with the Stats panel visible."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is a material in Unreal Engine?"
        choices: ["The asset that decides how a surface looks", "The asset that stores the shape of a mesh", "The asset that holds the lights of a level", "The asset that plays an animation"]
        answer_index: 0
        explain: "A material decides the color of a surface, how shiny it is, and if it is metal. Every surface in Unreal has one."
      - q: "How do you build a material in the Material Editor?"
        choices: ["You paint on the mesh with a brush", "You type the values into the Outliner", "You connect nodes to the inputs of the material", "You import a finished material from an image"]
        answer_index: 2
        explain: "The Material Editor is a graph. Small boxes called nodes hold values, and you connect them to inputs such as Base Color."
      - q: "How do you open the Material Editor for M_Basic?"
        choices: ["Drag M_Basic into the level", "Double-click M_Basic in the Content Browser", "Press F9 while M_Basic is selected", "Open Window, then Output Log"]
        answer_index: 1
        explain: "Double-clicking a material asset opens it in the Material Editor, where you see its graph and a preview."
      - q: "What does a Constant3Vector node hold?"
        choices: ["A texture", "One number", "A mesh", "A color"]
        answer_index: 3
        explain: "A Constant3Vector holds three numbers, which are used as red, green and blue. You connect it to Base Color."
      - q: "Which node do you connect to Roughness and to Metallic?"
        choices: ["A Constant node, which holds one number", "A Constant3Vector node, which holds a color", "A Text Render node, which holds a text", "A Timeline node, which holds a curve"]
        answer_index: 0
        explain: "Roughness and Metallic each need a single number. A Constant node holds exactly one number."
      - q: "What do the instruction counts in the Stats panel show?"
        choices: ["How many meshes use the material", "How many times the material was saved", "How much work the material costs to draw", "How large the material file is on disk"]
        answer_index: 2
        explain: "More instructions mean more work for the graphics card on every pixel. The Stats panel lets you watch this number while you build."
      - q: "What happens to a surface when you change Roughness from 1 to 0?"
        choices: ["It becomes transparent", "It becomes smooth and shows sharp reflections", "It becomes darker in color", "It becomes matte and dull"]
        answer_index: 1
        explain: "Roughness 0 is a smooth surface that reflects like a mirror. Roughness 1 is fully rough and looks matte."
      - q: "Which input of the material decides if the surface is metal?"
        choices: ["Base Color", "Roughness", "Emissive Color", "Metallic"]
        answer_index: 3
        explain: "Metallic is 0 for surfaces that are not metal and 1 for metal. Base Color and Roughness then decide the color and the shine."
    flavors:
      _default: {why: "Every surface in Unreal is a material.", do: "Build one from scratch."}
      lookdev: {why: "You'll live in this editor from here on.", do: "Keep the Stats panel open."}
