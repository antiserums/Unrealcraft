      - q: "Why is a Movie Render Queue image cleaner than a normal screenshot?"
        choices: ["It uses a different level", "It removes the lights before rendering", "It always renders in black and white", "It can spend more time on each frame than the viewport does"]
        answer_index: 3
        explain: "The viewport must draw many frames each second. Movie Render Queue has no such limit, so it can render one frame with much more care."
