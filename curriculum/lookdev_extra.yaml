        answer_index: 1
        explain: "Brightness and contrast pull the eye. Lighting artists use this to lead the viewer to the important place."
      - q: "What is a hero area?"
        choices: ["The most important place in a scene, where you want people to look", "The place where the player character starts", "The area with the most triangles", "The area that is lit by the sun"]
