  - id: EAQ15
    rank: 2
    difficulty: adept
    specializations: [lookdev, tech_art]
    subjects: [materials, textures, uvs]
    required_spine: false
    required: true
    title: Texture sampling and UVs
    brief: "Most materials get their detail from textures, which are images that the material reads, or samples. UVs are the coordinates that say which part of the image goes on which part of the mesh. Wrong texture settings are a common problem because Unreal does not show an error, the surface just looks a little wrong. In this quest you take three textures, check their settings, and use them in a material with adjustable tiling."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/coordinates-material-expressions-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 texture coordinate tiling texture sample srgb compression settings"
    checklist:
      - "Open a project made from the Third Person template, or create one. Pick a color texture, a normal texture and a packed texture of the same surface. The template has such a set in the folder Characters/Mannequins/Textures/Quinn: T_Quinn_01_D is the color texture, T_Quinn_01_N is the normal texture and T_Quinn_01_MRA is the packed texture. You can also import your own files. A packed texture stores a different grayscale map in each color channel. Open each texture and check its sRGB setting and its compression settings."
      - "Create a material named M_Surface and sample the three textures in it. Add a TexCoord node with a tiling parameter, so that you can change how many times the texture repeats."
      - "Split the packed texture into its channels, so that you can use each channel on its own."
      - "Apply the material to a large mesh, such as a cube scaled into a floor. Find one place where you can see the texture repeat. Fix it by changing the scale or by rotating the UVs."
    done_when: "Send a screenshot of the material graph, and also a screenshot of the textured mesh."
    xp: 70
    verify_type: screenshot
    quiz:
      - q: "What does it mean when a material samples a texture?"
        choices: ["The material deletes the image after use", "The material paints a new image", "The material reads the image", "The material saves the image to disk"]
        answer_index: 2
        explain: "Textures are images. A material samples, or reads, them to get detail such as color or bumps."
      - q: "What are UVs?"
        choices: ["The coordinates that place the image on the mesh", "The two brightest colors of a texture", "The settings that compress a texture", "The lights that shine on a mesh"]
        answer_index: 0
        explain: "UVs connect the flat image to the 3D surface. Changing them moves, scales or rotates the texture on the mesh."
      - q: "What is a packed texture?"
        choices: ["A texture that was compressed into a ZIP file", "A texture that stores a different grayscale map in each color channel", "A texture that holds several animation frames", "A texture that is used by more than one mesh"]
        answer_index: 1
        explain: "The red, green and blue channels each hold their own grayscale map. One file then does the work of three, which saves memory."
      - q: "Why are wrong texture settings a common problem?"
        choices: ["The editor crashes when a setting is wrong", "The texture is deleted when a setting is wrong", "The material refuses to compile", "Unreal does not show an error, and the surface just looks a little wrong"]
        answer_index: 3
        explain: "Nothing warns you about a wrong setting. You only notice it if you know how the surface should look, so you check the settings of each texture."
      - q: "Which sRGB setting is right for the packed texture T_Quinn_01_MRA?"
        choices: ["On, because every texture needs sRGB", "On, because it has three channels", "Off, because its channels hold data and not color", "Off, because it is smaller than the color texture"]
        answer_index: 2
        explain: "sRGB is for images that are seen as color, such as T_Quinn_01_D. The channels of a packed texture are plain numbers, so sRGB must be off."
      - q: "What does the tiling parameter on the TexCoord node change?"
        choices: ["How many times the texture repeats on the mesh", "How bright the texture is", "How many channels the texture has", "How strongly the texture is compressed"]
        answer_index: 0
        explain: "The TexCoord node gives the UVs to the texture samples. Multiplying them makes the texture repeat more or less often."
      - q: "How do you use one map of the packed texture on its own?"
        choices: ["Import the texture three times", "Take the single channel pin, such as R, G or B, from its texture sample", "Turn on sRGB for the texture", "Rotate the UVs by 90 degrees"]
        answer_index: 1
        explain: "The texture sample has separate output pins for the channels. Each pin gives one grayscale map that you connect to its own input."
      - q: "On the large floor you can see the texture repeat. How do you fix it?"
        choices: ["Delete the normal texture", "Set Metallic to 1", "Move the mesh to another level", "Change the scale or rotate the UVs"]
        answer_index: 3
        explain: "A visible repeat comes from the same image tiling in a regular way. A different scale or a rotation of the UVs breaks up the pattern."
    flavors:
      _default: {why: "Wrong texture settings are a common silent bug.", do: "Check every texture's settings once."}
      lookdev: {why: "Channel packing saves memory in every scene.", do: "Use one packed texture."}
      tech_art: {why: "You'll set import rules for these later.", do: "Note the compression each needs."}

