    subjects: [pcg, set-dressing]
    required_spine: false
    required: false
    title: PCG scatter for set dressing
    brief: "PCG means Procedural Content Generation. It is a system in Unreal where you build a graph of rules, and the graph places many objects for you. Set dressing is the work of filling a scene with small objects such as rocks and debris, and PCG makes this much faster than placing each one by hand. In this quest you scatter objects on a surface with a PCG graph and add a rule that keeps the paths free."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-content-generation-overview"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 pcg scatter rocks debris beginner"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a level of your own that has a Landscape, or create a new level and make a Landscape in Landscape Mode. Decide where a path runs across it."
      - "Make a PCG graph that scatters debris or rocks on the surface. Open Edit, then Plugins, and enable the Procedural Content Generation Framework (PCG) plugin if it is off. Then right-click in the Content Browser, open PCG and choose PCG Graph."
      - "In the graph, connect a Get Landscape Data node to a Surface Sampler node and then to a Static Mesh Spawner node, and pick a mesh under Mesh Entries. If you have no rock mesh, SM_ChamferCube from the folder LevelPrototyping/Meshes of the template works as a stand-in."
      - "Place a PCG Volume in the level, set Graph on its PCG component, and click Generate."
      - "Add one rule to the graph that keeps the paths clear. It can be a density rule, which controls how many objects appear, for example a Density Filter node after the Surface Sampler. It can also be an exclusion rule, which removes objects from an area, for example a Difference node that subtracts the points near a spline along the path."
    done_when: "Send a screenshot of the scattered objects, and also a screenshot of the graph."
    xp: 80
    verify_type: screenshot
    quiz:
      - q: "What is set dressing?"
        choices: ["Choosing clothes for a character", "Filling a scene with small objects such as rocks and debris", "Setting the lights of a scene", "Naming the assets of a project"]
        answer_index: 1
        explain: "Set dressing adds the many small objects that make a place look real. Placing each one by hand takes a long time."
      - q: "How does PCG help with set dressing?"
        choices: ["It lowers the triangle count of each rock", "It paints textures on the landscape", "It imports rock meshes from Fab", "You build a graph of rules, and the graph places many objects for you"]
        answer_index: 3
        explain: "PCG means Procedural Content Generation. The rules place the objects, so you change a rule and not a thousand rocks."
      - q: "PCG is missing from the right-click menu of the Content Browser. What do you check first?"
        choices: ["That the Procedural Content Generation Framework (PCG) plugin is enabled", "That the level has a Landscape", "That the project has a rock mesh", "That the Place Actors panel is open"]
        answer_index: 0
        explain: "PCG comes from a plugin. You enable it in Edit, then Plugins, and the PCG entries appear in the editor."
      - q: "In which order do you connect the three nodes of the scatter graph?"
        choices: ["Surface Sampler, Static Mesh Spawner, Get Landscape Data", "Static Mesh Spawner, Get Landscape Data, Surface Sampler", "Get Landscape Data, Surface Sampler, Static Mesh Spawner", "Surface Sampler, Get Landscape Data, Static Mesh Spawner"]
        answer_index: 2
        explain: "The graph first reads the landscape, then makes points on its surface, and last puts a mesh on each point."
      - q: "What does the Surface Sampler node do in this graph?"
        choices: ["It reads the height of the camera", "It makes points on the surface of the landscape", "It picks the mesh that is spawned", "It deletes the landscape under the rocks"]
        answer_index: 1
        explain: "The sampler turns the landscape surface into many points. Each point can later become one object."
      - q: "How do you run the graph in the level?"
        choices: ["Drag the graph asset onto the landscape", "Press Play and wait", "Open the graph and press F9", "Place a PCG Volume, set Graph on its PCG component, and click Generate"]
        answer_index: 3
        explain: "The PCG Volume marks where the graph works. Its PCG component needs to know the graph, and Generate runs it."
      - q: "What does a density rule control?"
        choices: ["How many objects appear", "How heavy each object is", "How bright each object is", "How large the PCG Volume is"]
        answer_index: 0
        explain: "A density rule thins out or keeps points. A Density Filter node after the Surface Sampler is one way to build it."
      - q: "What does an exclusion rule do?"
        choices: ["It adds objects to an area", "It changes the mesh of the objects", "It removes objects from an area", "It hides the PCG Volume"]
        answer_index: 2
        explain: "An exclusion rule takes points away where you do not want objects. That is how a path stays free."
      - q: "Which node can subtract the points near a spline along the path?"
        choices: ["A Static Mesh Spawner node", "A Difference node", "A Get Landscape Data node", "A Surface Sampler node"]
        answer_index: 1
        explain: "A Difference node removes one set of points from another. With the points near the path spline as the second set, the path is kept clear."
      - q: "Why do you add a rule that keeps the paths clear?"
        choices: ["So the graph has more nodes", "So the rocks are larger near the path", "So the PCG Volume can be deleted", "So the scattered objects do not block where the player walks"]
        answer_index: 3
        explain: "A scatter that covers everything also covers the route. The rule keeps the dressing where it helps the scene and away from the path."
    flavors:
      _default: {why: "Procedural scatter speeds up dressing.", do: "Scatter one thing with one rule."}
      lookdev: {why: "Frees time for hero areas.", do: "Keep the rule simple."}

