# Unrealcraft — Environment Art specialization, Ranks 1–3 (STUB, Phase 2)
# URL prefix: https://dev.epicgames.com/documentation/en-us/unreal-engine/
# Verified slugs only (see VERIFIED_URLS.md). Anything unverified is TODO_URL. Backup videos are TODO_URL.
# Every quest has a quiz.
#
# Environment Art is never gated on C++. Your only gameplay obligation is the Rank 2 opposite taster.
#
# FULL REQUIRED PATH (Environment Art), including shared quests defined in other files:
#
# Rank 1 (Apprentice) — track: world-lighting
#   EAQ8  Landscape                        (shared, level_design_r1.yaml)
#   EAQ9  Light types and Lumen            (shared, level_design_r1.yaml)
#   EAQ10  Post process and exposure        (shared, level_design_r1.yaml)
#   EAQ11  Foliage                          (shared, level_design_r1.yaml)
#   EAQ1  Reference board and mood target
#   EAQ2  Sky, HDRI and atmosphere mood
#   EAQ3  IES profiles and physical light units indoors
#   EAQ4  Composition: bookmarks and a Cine Camera still
#   EAQ12 Lit diorama (capstone)
#   Electives: EAQ5, EAQ6, EAQ7
#   (required_tasters rank 1: none)
#
# Rank 2 (Adept) — track: materials
#   EAQ13 Material Editor basics           (shared materials track, defined here)
#   EAQ14 PBR inputs                       (shared materials track, defined here)
#   EAQ15 Texture sampling and UVs         (shared materials track, defined here)
#   EAQ16 Parameters for instances         (shared materials track, defined here)
#   EAQ17 Landscape material basics        (shared materials track, defined here)
#   EAQ18 Decals                           (shared materials track, defined here; Level Design adjacent)
#   GDQ5  Opposite taster: tiny pickup loop (tasters.yaml) — required_tasters rank 2
#   EAQ24 Walkable diorama + master material + instances (capstone)
#   Electives: EAQ19, EAQ20, EAQ21
#
# Rank 3 (Expert, Environment Art Specialty) — track: bay-lookdev
#   EAQ25  Master material architecture
#   EAQ26  Material functions
#   EAQ27  Vertex paint blending
#   EAQ28  Nanite and displacement awareness
#   EAQ29  Light a hero area
#   EAQ30  Post process grading and LUT
#   EAQ31  Movie Render Queue still
#   AQ1  Character anatomy                (shared, required for all specializations)
#   AQ2  Read an AnimBP                   (shared, required for all specializations)
#   AQ3  Montage on interact              (shared, required for all specializations)
#   EAQ35 Reference scene for the server (capstone, mentor-verified)
#   Electives: EAQ32, EAQ33, EAQ34
#
# Not required for Environment Art: any C++ quest (R3-CD-*, PQ17), GDQ1..04, R2-PR-*.
# R2-MAT-* is required for lookdev and tech_art only. Programming has no materials requirement beyond Starter Quest SQ8.

quests:
  # =====================================================================
  # RANK 1 — world-lighting
  # Shared prerequisites (defined in level_design_r1.yaml, do not redefine here):
  #   EAQ8 landscape, EAQ9 light types + Lumen, EAQ10 post process/exposure, EAQ11 foliage.
  # =====================================================================
  - id: EAQ1
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [reference, mood, art-direction]
    required_spine: false
    required: true
    title: Reference board and mood target
    brief: "A reference board is one image that holds a group of pictures you collected to guide your work. A mood target is the single picture and short description that says how your scene should feel. When you have a target, it is much easier to judge if your lighting is right or wrong. In this quest you collect reference images for one small space, pick one as your target, and describe it in three lines."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/lighting-the-environment-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "environment art reference board mood board lighting reference how to"
    checklist:
      - "Collect 8 to 12 reference images for one small space. They can be photos, film stills or paintings."
      - "Mark each image with what you are taking from it: the light direction, the color, the material, or the composition (how things are arranged in the picture)."
      - "Pick one image as your mood target. This is the image your scene should feel like."
      - "Write 3 lines: one for the time of day, one for the color of the key light (the main light in the scene), and one for the feeling you want."
    done_when: "Send an image of your reference board together with your 3-line mood target, posted as a writeup."
    xp: 60
    verify_type: writeup
    quiz:
      - q: "What is a reference board?"
        choices: ["A list of the assets in your project", "One image that holds a group of pictures you collected to guide your work", "A level where you test your materials", "A panel in the editor that shows your bookmarks"]
        answer_index: 1
        explain: "A reference board puts your collected pictures side by side in one image. You look at it while you work to stay close to your idea."
      - q: "What is a mood target?"
        choices: ["The folder where you save your reference images", "The number of lights you plan to use", "The brightest light in your scene", "The single picture and short description that says how your scene should feel"]
        answer_index: 3
        explain: "The mood target is one image plus a few lines. It is the goal that you compare your scene against."
      - q: "How does a mood target help you when you light a scene?"
        choices: ["It makes it easier to judge if your lighting is right or wrong", "It sets the light values in the engine for you", "It makes the scene render faster", "It removes the need for a Sky Light"]
        answer_index: 0
        explain: "Without a target, any lighting can look fine. With a target, you can compare and see what is still different."
      - q: "What do you mark on each image of the reference board?"
        choices: ["The size of the image file", "The website where you found it", "What you are taking from it, such as the light direction or the color", "The date when you saved it"]
        answer_index: 2
        explain: "Each image is on the board for a reason: the light direction, the color, the material or the composition. The label reminds you which part to copy."
      - q: "What is the key light of a scene?"
        choices: ["The light that is placed first", "The main light in the scene", "The light that casts no shadows", "The light with the coldest color"]
        answer_index: 1
        explain: "The key light is the main light. Its color and direction decide most of the look, which is why one of your three lines describes it."
      - q: "Which three things do the 3 lines of your mood target give?"
        choices: ["The time of day, the color of the key light and the feeling you want", "The engine version, the template and the level name", "The camera, the lens and the resolution", "The number of images, their sizes and their sources"]
        answer_index: 0
        explain: "One line is for the time of day, one for the color of the key light, and one for the feeling. Together they describe the target in words."
    flavors:
      _default: {why: "A target makes lighting decisions easier to judge.", do: "Pick one image and say why."}
      lookdev: {why: "Every lighting pass from here gets judged against a target.", do: "Label what each reference is for."}

  - id: EAQ2
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [sky, hdri, atmosphere, fog]
    required_spine: false
    required: true
    title: Sky, HDRI and atmosphere mood
    brief: "The sky gives a base color to everything below it, so it has a strong effect on the mood of a scene. Unreal offers two common ways to make a sky. One is the atmosphere system, which calculates the sky from a sun light. The other is an HDRI, a 360 degree photo of a real sky that also lights the scene. In this quest you light the same scene both ways and compare which one fits a mood you chose better."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/environmental-light-with-fog-clouds-sky-and-atmosphere-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 hdri backdrop sky atmosphere height fog mood lighting"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/sky-lights-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/sky-atmosphere-component-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/exponential-height-fog-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Write one line that describes the mood you want, for example a cold, foggy morning or a warm sunset. If you already have a mood target picture, use that. Create a new level with File, New Level, Empty Level, and place a floor and a few objects in it."
      - "Light the scene with Sky Atmosphere, a Directional Light (the sun), a Sky Light (soft light that comes from the whole sky), and Height Fog."
      - "Duplicate the level and light the copy with an HDRI instead. You can use the HDRI Backdrop actor, which needs the HDRI Backdrop plugin from Edit > Plugins and comes with a sample HDRI, or a Sky Light with a cubemap, which is a texture that covers all directions."
      - "Push each version toward your mood. Change the sun angle, the fog color and the fog density until the mood is close."
      - "Compare the two versions from the same camera bookmark, so that both pictures show exactly the same view."
    done_when: "Send side-by-side screenshots of the atmosphere version and the HDRI version taken from the same bookmark. Add your one-line mood, and 2 lines that say which version fits it better."
    xp: 90
    verify_type: screenshot
    quiz:
      - q: "Why does the sky have a strong effect on the mood of a scene?"
        choices: ["It hides the objects on the ground", "It sets how fast the scene renders", "It gives a base color to everything below it", "It decides which materials you can use"]
        answer_index: 2
        explain: "Light from the sky falls on every surface. Its color becomes the base color of the whole scene, so it shapes the mood."
      - q: "What is an HDRI?"
        choices: ["A 360 degree photo of a real sky that also lights the scene", "A light that only shines in one direction", "A fog actor that reacts to light", "A file that describes the shape of light from a lamp"]
        answer_index: 0
        explain: "An HDRI is a photo that covers all directions and stores a wide range of brightness. It can be shown as the sky and used as the light of the scene."
      - q: "How does the atmosphere system make a sky?"
        choices: ["It plays a video of clouds", "It copies the colors of the floor", "It loads a photo from the Content Browser", "It calculates the sky from a sun light"]
        answer_index: 3
        explain: "Sky Atmosphere works together with the Directional Light. When you change the sun angle, the color of the sky changes with it."
      - q: "What does a Sky Light do?"
        choices: ["It casts sharp shadows like the sun", "It gives soft light that comes from the whole sky", "It lights one small spot like a lamp", "It adds fog near the ground"]
        answer_index: 1
        explain: "A Sky Light lights the scene softly from all directions of the sky. It fills the shadows that the sun does not reach."
      - q: "You want to use the HDRI Backdrop actor but cannot find it. What do you check first?"
        choices: ["That the level has a Sky Atmosphere", "That the Directional Light is deleted", "That the HDRI Backdrop plugin is enabled in Edit, then Plugins", "That the project uses the Third Person template"]
        answer_index: 2
        explain: "The HDRI Backdrop actor comes from the HDRI Backdrop plugin. The plugin also brings a sample HDRI you can use."
      - q: "Why do you compare the two versions from the same camera bookmark?"
        choices: ["So both pictures show exactly the same view", "So both levels use the same fog color", "So the HDRI is loaded only once", "So the screenshots have a higher resolution"]
        answer_index: 0
        explain: "If the view is the same, the only difference between the pictures is the sky setup. That makes the comparison fair."
    flavors:
      _default: {why: "The sky sets the base color of everything below it.", do: "Try two sky setups from one camera."}
      lookdev: {why: "Mood mostly comes from the sky and fog.", do: "Match your target before adding any other lights."}

  - id: EAQ3
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [ies, physical-units, interior-lighting]
    required_spine: false
    required: true
    title: IES profiles and physical light units indoors
    brief: "Unreal can measure light in the same units that real lamps use, such as candela and lumens, and can set its color as a temperature in Kelvin. When you use real values, your lighting behaves in a way you can predict. An IES profile is a small file from a lamp maker that describes the shape of the light a real lamp gives. In this quest you light a room with real-world values and see what an IES profile changes."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-ies-light-profiles-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 ies profile physical light units lumens candela interior"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-physical-lighting-units-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/auto-exposure-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open a room level of your own, or build a simple closed room in a new level from cubes: a floor, four walls and a ceiling. Set the exposure to a fixed value: add a Post Process Volume, tick Infinite Extent (Unbound), and set Metering Mode to Manual in its Exposure section. Exposure is how bright the camera makes the picture, and a fixed value stops Unreal from adjusting it, so you can see brightness changes."
      - "Place 2 lights and give them real-world intensities, in candela or lumens, and a realistic color temperature."
      - "Apply an IES profile to one of the lights. Lamp makers offer IES files as free downloads on their websites. Drag one .ies file into the Content Browser to import it, then pick it in the IES Texture setting of the light. The engine also comes with a few profiles, for example Complex_IES. To see them in the list, click the settings icon of the list and turn on Show Engine Content. Compare how the light looks with the profile and without it."
      - "Write down the intensity and the temperature you used, and where you got each value from."
    done_when: "Send before and after screenshots of the light with the IES profile, and add your notes about the intensity values."
    xp: 80
    verify_type: screenshot
    quiz:
      - q: "What is an IES profile?"
        choices: ["A setting that locks the exposure of the camera", "A material that makes a lamp glow", "A list of all lights in the level", "A small file from a lamp maker that describes the shape of the light of a real lamp"]
        answer_index: 3
        explain: "An IES profile holds measured data about how a real lamp spreads its light. Applied to a light in Unreal, it gives that light the same pattern."
      - q: "In which unit do you set the color temperature of a light?"
        choices: ["Candela", "Kelvin", "Lumens", "Degrees"]
        answer_index: 1
        explain: "Color temperature is measured in Kelvin. Candela and lumens are units for how strong a light is."
      - q: "Why do you set the exposure to a fixed value before you judge the brightness of your lights?"
        choices: ["A fixed exposure stops Unreal from adjusting the picture, so you can see brightness changes", "A fixed exposure makes all lights use the same color", "A fixed exposure turns off the shadows of the lights", "A fixed exposure makes the IES profile load faster"]
        answer_index: 0
        explain: "Exposure is how bright the camera makes the picture. If it adjusts by itself, a stronger light does not look brighter, so you cannot compare values."
      - q: "How do you bring an IES file from a lamp maker into your project?"
        choices: ["Type its name in the Outliner", "Open it in the Material Editor", "Drag the .ies file into the Content Browser", "Copy it into the Details panel"]
        answer_index: 2
        explain: "Dragging the .ies file into the Content Browser imports it as an asset. After that you can pick it on a light."
      - q: "Where do you apply an imported IES profile to a light?"
        choices: ["In the Exposure section of the Post Process Volume", "In the Light Color setting of the light", "In the World Settings of the level", "In the IES Texture setting of the light"]
        answer_index: 3
        explain: "You select the light and pick the profile in its IES Texture setting. The light then follows the shape stored in the profile."
      - q: "What is the gain of lighting a room with real-world values?"
        choices: ["The room needs no Post Process Volume", "The lighting behaves in a way you can predict", "The lights no longer cost performance", "The room looks the same at every exposure"]
        answer_index: 1
        explain: "Real values, such as the candela or lumens of a real lamp, make lights behave like the lamps you know. Your scenes also stay consistent with each other."
    flavors:
      _default: {why: "Real-world units make lighting predictable.", do: "Light a room with real numbers."}
      lookdev: {why: "Physical units make your scenes consistent with each other.", do: "Lock exposure before judging brightness."}

  - id: EAQ4
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [composition, cameras, bookmarks, cine-camera]
    required_spine: false
    required: true
    title: "Composition: bookmarks and a Cine Camera still"
    brief: "Composition is the way things are arranged inside the picture frame. The position of the camera decides what people see, so it matters as much as the lighting. A Cine Camera Actor is a camera in Unreal that works like a real film camera, with a focal length (how wide or narrow the view is) and a focus distance. In this quest you save camera bookmarks, frame a view with a Cine Camera, and take a still image through it."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-bookmarks"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 cine camera actor focal length composition still screenshot"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/taking-screenshots-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Work in any level that has a few objects in it: the level of the template works, and so does a scene of your own. Save 3 camera bookmarks: one wide view, one medium view and one detail view."
      - "Place a Cine Camera Actor and set its focal length and focus distance. Then pilot the camera, which means you look through it and move it, and frame the best view."
      - "Turn on a composition overlay, such as the rule of thirds grid or a similar one. Use it to adjust the frame."
      - "Take a High Resolution Screenshot while you look through the Cine Camera."
    done_when: "Send the still image, and also a screenshot of the Cine Camera settings."
    xp: 70
    verify_type: screenshot
    quiz:
      - q: "What is composition?"
        choices: ["The way things are arranged inside the picture frame", "The number of lights in a scene", "The list of materials on a mesh", "The order in which actors are loaded"]
        answer_index: 0
        explain: "Composition is about what is in the frame and where. The camera position decides it, so it matters as much as the lighting."
      - q: "What is a Cine Camera Actor?"
        choices: ["A tool that records the screen to a video file", "A camera that follows the player in the game", "A camera in Unreal that works like a real film camera", "A bookmark that stores a camera position"]
        answer_index: 2
        explain: "A Cine Camera Actor has the settings of a real film camera, such as a focal length and a focus distance."
      - q: "What does the focal length of a Cine Camera Actor control?"
        choices: ["How bright the picture is", "How wide or narrow the view is", "How fast the camera moves", "How many frames are saved"]
        answer_index: 1
        explain: "A short focal length gives a wide view and a long focal length gives a narrow view."
      - q: "What does it mean to pilot a camera?"
        choices: ["You attach the camera to the player character", "You lock the camera so that it cannot move", "You copy the camera to another level", "You look through the camera and move it"]
        answer_index: 3
        explain: "While you pilot a camera, the viewport shows its view and your viewport movement moves the camera. This is how you frame a shot."
      - q: "What do you use a composition overlay such as the rule of thirds grid for?"
        choices: ["To change the focal length", "To save a camera bookmark", "To adjust the frame", "To raise the screenshot resolution"]
        answer_index: 2
        explain: "The overlay draws guide lines over the view. You move the camera until the important things sit well on those lines."
      - q: "Which three views do you save as camera bookmarks?"
        choices: ["One wide view, one medium view and one detail view", "One top view, one front view and one side view", "One day view, one night view and one fog view", "One lit view, one unlit view and one wireframe view"]
        answer_index: 0
        explain: "Wide, medium and detail views show the scene at three distances. Saved bookmarks let you return to exactly the same views later."
    flavors:
      _default: {why: "Where the camera sits decides what people see.", do: "Frame one shot on purpose."}
      lookdev: {why: "Your reviews happen through fixed cameras.", do: "Save bookmarks before you light, not after."}

  - id: EAQ12
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [lighting, diorama, capstone]
    required_spine: false
    required: true
    capstone: true
    title: Lit diorama
    brief: "A diorama is a small, complete scene, like a model in a box. A small finished scene teaches you more than a big scene that you never finish, because you have to make every part work together. In this quest you combine several skills: you build a small piece of landscape with plants, light it toward a mood you chose, and take three still images. Everything you need to build is listed in the steps."
    time_min: 180
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/artist-02-light-a-scene"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 lit diorama small environment lighting lumen"
    checklist:
      - "Open a project made from the Third Person template, or create one. Choose a mood target: one reference picture, or three lines that give the time of day, the color of the main light and the feeling you want. Then build a small diorama of roughly 10 x 10 m in a new level: create a small Landscape in Landscape Mode, sculpt it a little, and paint a few plants or rocks on it in Foliage Mode. You can reuse a terrain of your own."
      - "Light it toward your mood target. Add a Directional Light, a Sky Light, a Sky Atmosphere and Height Fog, and at least one local light, such as a Point Light, with an intensity that you set in real units (candela or lumens)."
      - "Set the exposure and the post process settings on purpose, so that the result is your choice and not the default: add a Post Process Volume, tick Infinite Extent (Unbound), and set Metering Mode to Manual in its Exposure section."
      - "Save 3 camera bookmarks and take a still from each. Take one of them through a Cine Camera Actor: place one, right-click it and choose Pilot, frame the view, and take a High Resolution Screenshot."
      - "Write 3 lines that say what matches the target and what does not match it yet."
    done_when: "Send your 3 stills, the mood target image, and your 3-line writeup."
    xp: 200
    verify_type: screenshot
    quiz:
      - q: "What is a diorama?"
        choices: ["A large open world with many levels", "A small, complete scene, like a model in a box", "A flat image that is used as a sky", "A camera that works like a film camera"]
        answer_index: 1
        explain: "A diorama is small but complete. Here it is a piece of landscape of roughly 10 x 10 m with plants and finished lighting."
      - q: "Why does a small finished scene teach you more than a big scene you never finish?"
        choices: ["A small scene needs no lighting", "A small scene can be built without a target", "A small scene is not judged by anyone", "You have to make every part work together"]
        answer_index: 3
        explain: "Finishing forces you to connect terrain, plants, light, exposure and camera. In an unfinished scene you never reach that step."
      - q: "In which editor mode do you paint plants or rocks onto the landscape of the diorama?"
        choices: ["Foliage Mode", "Modeling Mode", "Selection Mode", "Animation Mode"]
        answer_index: 0
        explain: "Foliage Mode paints many copies of a mesh, such as plants or rocks, onto a surface. Landscape Mode is where you create and sculpt the terrain."
      - q: "In which units do you set the intensity of the local light in the diorama?"
        choices: ["Kelvin or degrees", "Meters or centimeters", "Candela or lumens", "Percent or pixels"]
        answer_index: 2
        explain: "Candela and lumens are real units for the strength of a light. Using them makes a Point Light behave like a real lamp."
      - q: "Why do you set Metering Mode to Manual in a Post Process Volume for the diorama?"
        choices: ["So the fog becomes volumetric", "So the exposure is your choice and not the default", "So the camera bookmarks are saved", "So the landscape can be sculpted"]
        answer_index: 1
        explain: "With Manual metering the brightness of the picture stays where you set it. Infinite Extent (Unbound) makes the volume apply to the whole level."
      - q: "What do the 3 lines of your writeup say?"
        choices: ["Which plugins you enabled", "How long each step took", "Which meshes you painted", "What matches the target and what does not match it yet"]
        answer_index: 3
        explain: "You judge the diorama against your mood target. Naming what matches and what does not is how you find the next thing to improve."
    flavors:
      _default: {why: "A small finished scene teaches more than a big unfinished one.", do: "Keep it small and finish the lighting."}
      lookdev: {why: "This diorama becomes walkable at Rank 2.", do: "Judge it against your target, not against nothing."}

  # ---------- Rank 1 electives ----------
  - id: EAQ5
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [volumetric-fog, atmosphere]
    required_spine: false
    required: false
    title: Volumetric fog shafts
    brief: "Volumetric Fog is fog that reacts to light in 3D space. It makes light visible in the air, so you can see beams of light, often called light shafts, when light comes through a window. In this quest you turn on Volumetric Fog and adjust one light until the shafts help the picture."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/volumetric-fog-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 volumetric fog light shafts god rays"
    checklist:
      - "Open any project, or create one from the Third Person template. Open a level of your own that has a dark room with a window, or build one in a new Basic level from cubes: a floor, four walls and a ceiling, with a gap in one wall as the window."
      - "Select the Exponential Height Fog actor in the level. If there is none, drag one in from the Place Actors panel, under Visual Effects. In the Details panel, turn on Volumetric Fog."
      - "Aim a Directional Light or a Spot Light through the window into the room, and adjust the scene until you can see light shafts coming through the window."
      - "Select the light and change Volumetric Scattering Intensity in its Details panel, which controls how strongly that light shows in the fog. The shafts should support the image and not wash it out."
    done_when: "Send a screenshot that shows the light shafts."
    xp: 40
    verify_type: screenshot
    quiz:
      - q: "What are light shafts?"
        choices: ["Beams of light that you can see in the air", "Shadows that fall on the floor", "Lamps that hang from a ceiling", "Reflections on a wet surface"]
        answer_index: 0
        explain: "Volumetric Fog makes light visible in the air. When light comes through a window, you see it as beams, often called light shafts."
      - q: "Where do you turn on Volumetric Fog?"
        choices: ["In the Details panel of the window mesh", "In the Details panel of the Sky Light", "In the Details panel of the Exponential Height Fog actor", "In the Details panel of the Post Process Volume"]
        answer_index: 2
        explain: "Volumetric Fog is an option of the Exponential Height Fog actor. The level needs this actor before any light shafts can appear."
      - q: "The level has no Exponential Height Fog actor. Where do you find one?"
