  - id: EAQ14
    rank: 2
    difficulty: adept
    specializations: [lookdev, tech_art]
    subjects: [materials, pbr]
    required_spine: false
    required: true
    title: PBR inputs
    brief: "PBR means physically based rendering. It is a way to describe a surface with a few inputs, such as Base Color, Roughness and Metallic, that act like real materials do. When the values are plausible, the surface looks right under any light. A dielectric is any material that is not a metal, such as plastic, wood or stone. In this quest you make four test surfaces, called swatches, and compare them under the same light."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/artist-03-create-materials-and-material-instances"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 pbr base color roughness metallic normal explained"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make 4 swatches, each a simple material on its own sphere: a rough dielectric, a glossy dielectric, a rough metal and a polished metal."
      - "Keep the Base Color values of each swatch in a plausible range. Do not use pure black or pure white."
      - "Add a normal map to one swatch. A normal map is a texture that fakes small bumps on the surface. The template has normal maps in the folder Characters/Mannequins/Textures, with names that end in _N. Compare the swatch with and without it."
      - "Place the four spheres next to each other in one level, so that they are all under the same light. The level of the template works, and so does a lit scene of your own. Put a Text Render actor at each sphere as a label."
    done_when: "Send a screenshot of the 4 swatches under the same light, with a label on each one."
    xp: 70
    verify_type: screenshot
    quiz:
      - q: "What does PBR stand for?"
        choices: ["Pixel based reflection", "Physically based rendering", "Projected bump rendering", "Painted base roughness"]
        answer_index: 1
        explain: "PBR means physically based rendering. It describes a surface with a few inputs that act like real materials do."
      - q: "What is a dielectric?"
        choices: ["Any material that is a polished metal", "Any material that gives off light", "Any material that is not a metal", "Any material that is transparent"]
        answer_index: 2
        explain: "Dielectric is the word for surfaces that are not metal, such as plastic, wood or stone. In a material, their Metallic value is 0."
      - q: "What is the gain of plausible PBR values?"
        choices: ["The surface looks right under any light", "The surface needs no textures", "The surface is drawn without any cost", "The surface casts no shadows"]
        answer_index: 0
        explain: "Values that match real materials react to light like those materials. You do not need to fix the surface again for each new lighting setup."
      - q: "Which Base Color values should you avoid on your swatches?"
        choices: ["Gray values", "Warm colors", "Cool colors", "Pure black and pure white"]
        answer_index: 3
        explain: "No real surface is pure black or pure white. Such values break the lighting, so you keep Base Color in a plausible range."
      - q: "Which values describe the polished metal swatch?"
        choices: ["Metallic 0 and a high Roughness", "Metallic 1 and a high Roughness", "Metallic 1 and a low Roughness", "Metallic 0 and a low Roughness"]
        answer_index: 2
        explain: "Metallic 1 makes the surface a metal. A low Roughness makes it smooth, so it looks polished."
      - q: "What is a normal map?"
        choices: ["A texture that fakes small bumps on the surface", "A texture that stores the color of the surface", "A map of the level seen from above", "A list of the materials on a mesh"]
        answer_index: 0
        explain: "A normal map changes how light hits each pixel, so a flat surface seems to have small bumps. The mesh itself does not change."
      - q: "How do you recognize the normal maps in the folder Characters/Mannequins/Textures of the template?"
        choices: ["Their names start with M_", "Their names end in _N", "Their names end in _D", "Their names start with SM_"]
        answer_index: 1
        explain: "The normal maps of the template have names that end in _N. A naming rule like this tells you the kind of texture without opening it."
      - q: "Why do you place the four spheres next to each other in one level?"
        choices: ["So they share one material", "So they can be selected with one click", "So the level needs only one label", "So they are all under the same light"]
        answer_index: 3
        explain: "Under the same light, any difference you see comes from the materials. That makes the comparison fair."
