  - id: EAQ35
    rank: 3
    difficulty: expert
    specializations: [lookdev]
    subjects: [reference-scene, lighting, materials, capstone]
    required_spine: false
    required: true
    capstone: true
    title: Reference scene for the server
    brief: "A reference scene is a neutral level with known lighting that people use to check their assets. When everyone on a team puts an asset into the same scene, everyone judges it under the same light, so the results can be compared. In this quest you build such a scene, write a short guide for it, and show it to a mentor. Everything you need to build is listed in the steps."
    time_min: 360
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/artist-quick-start-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 lookdev reference scene material calibration lighting"
    checklist:
      - "Open any project, or create one from the Third Person template. In a new level, build a scene that other people can drop assets into to check them. Include neutral props, a pair of balls (one gray and one chrome), and a Macbeth-style swatch board, which is a board of standard color patches."
      - "Light the scene with physical units and a fixed exposure (a Post Process Volume with Metering Mode set to Manual). Give it a hero area, the place where the asset stands, with a key light, a fill light and a rim light."
      - "Build the surfaces of the scene from one master material with instances. Use at least one Material Function in it, and put one vertex-painted blend on a prop, which is a second surface that you paint on in Mesh Paint mode."
      - "Provide 3 Cine Cameras with a camera bookmark at each one, and a Movie Render Queue preset: a saved set of render settings for a one-frame Level Sequence."
      - "Write a README of one page. It must say how to use the scene, what the exposure is, and what people should not change."
      - "Record a short video clip (30 seconds or less) in which you put one asset into the scene and look at it through the three cameras."
    done_when: "Send your README as text, a screenshot from each of the 3 cameras, a screenshot of the Movie Render Queue preset, and the short video clip. A mentor reviews your work and checks that the scene could be used with only your README."
    xp: 200
    verify_type: mentor
    quiz:
      - q: "What is a reference scene?"
        choices: ["A neutral level with known lighting that people use to check their assets", "The first level of a finished game", "A folder with reference images", "A level that shows every material of a project"]
        answer_index: 0
        explain: "A reference scene is a known, neutral place. People put an asset into it to see how the asset looks under fixed conditions."
      - q: "Why should everyone on a team check assets in the same reference scene?"
        choices: ["The scene makes all assets look the same", "The scene fixes mistakes in the assets", "Everyone judges under the same light, so the results can be compared", "Only one person can then open the assets"]
        answer_index: 2
        explain: "An asset looks different under every light. With one shared scene, a difference between two assets comes from the assets and not from the lighting."
      - q: "What is a Macbeth-style swatch board?"
        choices: ["A board that lists the names of the cameras", "A board of standard color patches", "A board with the README text", "A board that blocks the key light"]
        answer_index: 1
        explain: "The patches have known colors. If they look wrong in the picture, the lighting or the exposure is off."
      - q: "Which pair of balls belongs in the scene?"
        choices: ["One red and one blue", "One large and one small", "One lit and one unlit", "One gray and one chrome"]
        answer_index: 3
        explain: "The gray ball shows how the light falls on a plain surface. The chrome ball mirrors the surroundings, so you see where the light comes from."
      - q: "How do you give the reference scene a fixed exposure?"
        choices: ["Add a Post Process Volume and set Metering Mode to Manual", "Set the Directional Light to Movable", "Turn off Lumen in the Project Settings", "Save a camera bookmark at each camera"]
        answer_index: 0
        explain: "With Manual metering the camera does not adjust the brightness by itself. Every asset is then judged at the same exposure."
      - q: "What is the hero area of the reference scene?"
        choices: ["The place where the cameras stand", "The place where the README is shown", "The place where the asset stands", "The place with the swatch board"]
        answer_index: 2
        explain: "The hero area is where people put their asset. The three lights show its shape from the front, in the shadows and along its edge."
      - q: "How are the surfaces of the scene built?"
        choices: ["From a new material for every surface", "From one master material with instances", "From vertex colors only", "From decals on a single mesh"]
        answer_index: 1
        explain: "One master material with instances keeps the scene easy to maintain. It also uses at least one Material Function, and one prop has a vertex-painted blend."
      - q: "What do you provide so that people can take the same pictures of every asset?"
        choices: ["A list of console commands", "A second copy of the level", "A folder of screenshots", "3 Cine Cameras with bookmarks, and a Movie Render Queue preset"]
        answer_index: 3
        explain: "Fixed cameras give the same views each time. The preset gives the same render settings, so stills of different assets can be compared."
      - q: "What must the one-page README say?"
        choices: ["How to use the scene, what the exposure is, and what people should not change", "How long the scene took to build and which tools you used", "Which assets were tested in the scene so far", "Which engine versions you tried"]
        answer_index: 0
        explain: "The README is the manual for other people. It protects the fixed parts of the scene, such as the exposure, from changes by mistake."
      - q: "What does the mentor check about your README?"
        choices: ["That it is longer than one page", "That it lists every node of the master material", "That the scene could be used with only your README", "That it is written before the scene is built"]
        answer_index: 2
        explain: "The scene is built for other people. If someone can use it with nothing but the README, the guide does its job."
    flavors:
      _default: {why: "A shared reference scene gives everyone the same lighting to judge assets in.", do: "Build it for other people."}
      lookdev: {why: "Your work becomes a tool the whole server uses.", do: "Write the README before you polish."}

