    checklist:
      - "Open any project, or create one from the Third Person template. Pick a high-poly mesh, which is a mesh with a very large number of triangles. If you have none, use the most detailed mesh in your project, or make a sphere in Modeling Mode with a very high subdivision level. Enable Nanite on it: open the mesh and tick Enable Nanite Support in its Nanite Settings. Inspect it in the level with the Nanite visualization modes Triangles, Clusters and Overdraw."
      - "On the Nanite documentation page linked on this quest, read the list of things that Nanite does not support. Note which kinds of materials in a project would be affected, such as translucent ones."
      - "Try Nanite displacement on one mesh if your engine version and your project support it. If they do not, write what you would need to enable."
      - "Write 3 lines: when you would use Nanite, when you would not use it, and one cost to watch."
    done_when: "Send a screenshot of a visualization mode, and add your 3-line writeup."
    xp: 80
    verify_type: writeup
    quiz:
      - q: "What is Nanite?"
        choices: ["The lighting system that calculates bounced light", "The tool that paints vertex colors", "The editor for building materials", "The system in Unreal Engine 5 that lets you use meshes with millions of triangles"]
        answer_index: 3
        explain: "Nanite is the geometry system of Unreal Engine 5. It makes very detailed meshes usable in real time."
      - q: "Why can Nanite handle meshes with millions of triangles?"
        choices: ["It only draws the detail that the screen can show", "It turns every mesh into a flat image", "It removes the materials from the mesh", "It draws each mesh only on every second frame"]
        answer_index: 0
        explain: "Far away, a mesh covers few pixels and needs few triangles. Nanite picks the detail that fits the screen, so the full triangle count is never drawn at once."
      - q: "What is a high-poly mesh?"
        choices: ["A mesh that is placed high above the level", "A mesh with many material slots", "A mesh with a very large number of triangles", "A mesh with a very large texture"]
        answer_index: 2
        explain: "High-poly means many polygons, which are the triangles of the mesh. Such meshes show the gain of Nanite most clearly."
      - q: "How do you enable Nanite on a mesh in this quest?"
        choices: ["Open Edit, then Plugins, and enable Nanite", "Open the mesh and tick Enable Nanite Support in its Nanite Settings", "Set the Mobility of the mesh to Movable", "Add a Nanite component to the level"]
        answer_index: 1
        explain: "Nanite is a setting of the mesh asset. You open the mesh and tick Enable Nanite Support in its Nanite Settings."
      - q: "Which Nanite visualization modes do you use to inspect the mesh in the level?"
        choices: ["Lit, Unlit and Wireframe", "Game, Draw and GPU", "Key, Fill and Rim", "Triangles, Clusters and Overdraw"]
        answer_index: 3
        explain: "These three modes show how Nanite draws the mesh: its triangles, the clusters they are grouped in, and how much is drawn over other geometry."
      - q: "In the Triangles visualization mode, what do you see when you move the camera away from a Nanite mesh?"
        choices: ["The mesh is drawn with fewer and larger triangles", "The mesh is drawn with more and smaller triangles", "The mesh turns into a cube", "The mesh keeps exactly the same triangles"]
        answer_index: 0
        explain: "Nanite draws only the detail the screen can show. From far away the mesh covers fewer pixels, so fewer triangles are enough."
      - q: "Which kind of material does the quest name as one that Nanite does not support?"
        choices: ["Opaque materials", "Materials with a normal map", "Translucent materials", "Materials with parameters"]
        answer_index: 2
        explain: "Nanite does not support every kind of material, and translucent ones are an example. You check the list on the documentation page to see which materials of a project are affected."
      - q: "What does displacement do?"
        choices: ["It moves the whole mesh to another place in the level", "A texture moves the surface of the mesh in and out to add real detail", "It replaces the mesh with a simpler one", "It swaps the material of the mesh during play"]
        answer_index: 1
        explain: "Displacement changes the shape of the surface itself. A normal map only fakes bumps in the lighting."
