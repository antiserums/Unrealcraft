    title: A water body that fits the mood
    brief: "The Water system is a plugin in Unreal that gives you ready-made lakes, rivers and oceans. Water reflects everything around it, so its color and clarity have a strong effect on the mood of a scene. In this quest you add a small water body and adjust it until it fits a mood you chose."
