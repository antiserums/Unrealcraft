    subjects: [post-process, color-grading, lut]
    required_spine: false
    required: true
    title: Post process grading and LUT
    brief: "Color grading means changing the colors and contrast of the final image, like editing a photo. In Unreal you do this in a Post Process Volume. A LUT (lookup table) is a small texture that stores a color grade made in an image editor, so that you can apply it in the engine. Grading finishes an image, but it cannot fix bad lighting. In this quest you grade a scene by hand, grade it again with a LUT, and compare the two."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 color grading post process volume lut"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/add-post-process-volumes"
    checklist:
      - "Open any project, or create one from the Third Person template. Work in any lit level: the level of the template works, and so does a scene of your own. Save a camera bookmark and take one screenshot without any grade. Then grade the scene in a Post Process Volume with Infinite Extent (Unbound) turned on. Start with the white balance, then change the global settings, and then the shadows, midtones and highlights."
      - "Now grade with a LUT. Take a screenshot of the scene without a grade. Download the neutral LUT image, a LUT that changes nothing yet (256 x 16 pixels), from the Epic documentation page about color grading with Look-Up Tables. Open both in an image editor, apply the same color adjustments to the screenshot and to the LUT image, and save the LUT image."
      - "Import the LUT image into Unreal, open the texture, and set Texture Group to ColorLookupTable and Mip Gen Settings to NoMipmaps. In the Post Process Volume, open Color Grading, then Misc, and assign it as the Color Grading LUT."
      - "Compare the manual grade with the LUT grade."
      - "Keep one screenshot without any grade for reference."
    done_when: "Send three stills taken from the same camera: one without a grade, one with the manual grade, and one with the LUT grade."
    xp: 90
    verify_type: screenshot
    quiz:
      - q: "What is color grading?"
        choices: ["Changing the colors and contrast of the final image", "Painting colors on the vertices of a mesh", "Choosing the Base Color of a material", "Sorting textures by their color"]
        answer_index: 0
        explain: "Color grading works on the finished picture, like editing a photo. It changes the mood without touching the scene itself."
      - q: "Where do you grade a scene in Unreal Engine?"
        choices: ["In the Material Editor", "In the World Settings", "In a Post Process Volume", "In the Content Browser"]
        answer_index: 2
        explain: "The Post Process Volume holds the Color Grading settings. With Infinite Extent (Unbound) turned on, the grade applies to the whole level."
      - q: "What is a LUT?"
        choices: ["A light that only affects reflections", "A lookup table: a small texture that stores a color grade", "A list of the lights in the level", "A tool that measures the exposure"]
        answer_index: 1
        explain: "LUT means lookup table. It stores a color grade made in an image editor, so that the same grade can be applied in the engine."
      - q: "What can color grading not do?"
        choices: ["Change the contrast of the image", "Make the image warmer or cooler", "Darken the shadows", "Fix bad lighting"]
        answer_index: 3
        explain: "Grading finishes an image. If the lighting is wrong, the grade only changes the colors of a badly lit picture, so you grade last, after lighting."
      - q: "In which order do you grade by hand in this quest?"
        choices: ["Highlights first, then the white balance, then the global settings", "Shadows first, then the LUT, then the white balance", "The white balance first, then the global settings, then shadows, midtones and highlights", "The global settings first, then the LUT, then the midtones"]
        answer_index: 2
        explain: "You go from the broad to the fine. White balance sets the base, the global settings shape the whole image, and the three ranges are adjusted last."
      - q: "What is the neutral LUT image that you download from the Epic documentation?"
        choices: ["A LUT that changes nothing yet", "A LUT that turns the image gray", "A screenshot of an empty level", "A texture with a single color"]
        answer_index: 0
        explain: "The neutral LUT is the starting point, 256 x 16 pixels in size. It only becomes a grade after you apply your adjustments to it."
      - q: "Why do you apply the same color adjustments to the screenshot and to the LUT image in the image editor?"
        choices: ["So both files get the same size", "So the screenshot can be imported as a LUT", "So the LUT image is deleted afterwards", "The screenshot shows the result, and the LUT image records the adjustments"]
        answer_index: 3
        explain: "You judge the grade on the screenshot. The same adjustments on the LUT image store that grade in a form Unreal can apply."
      - q: "Which settings do you change on the imported LUT texture?"
        choices: ["Texture Group to World and Mip Gen Settings to Sharpen0", "Texture Group to ColorLookupTable and Mip Gen Settings to NoMipmaps", "Texture Group to UI and sRGB turned off", "Texture Group to Lightmap and Mip Gen Settings to Blur1"]
        answer_index: 1
        explain: "A LUT is data and not a normal picture. These two settings keep Unreal from shrinking or filtering it in a way that would change the colors."
      - q: "Where do you assign the LUT texture?"
        choices: ["In the Light Color of the Directional Light", "In the Emissive Color of a material", "In the Post Process Volume, as the Color Grading LUT", "In the World Settings, under Lightmass"]
