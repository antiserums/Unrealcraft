    required_spine: false
    required: true
    capstone: true
    title: Walkable diorama + master material + instances
    brief: "A scene that you walk through at eye level shows problems that a still render hides, such as gaps, stretched textures and places where you get stuck. A master material is one material with many parameters, and the surfaces in the scene use instances of it. In this quest you make a small scene walkable, build one master material for its surfaces, and fix what looks wrong when you walk around. Everything you need to build is listed in the steps."
    time_min: 240
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/artist-04-expanded-material-instances"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 master material instances environment walkable scene"
    checklist:
      - "Open a project made from the Third Person template, or create one. Use a small scene of your own, or build a diorama of roughly 10 x 10 m in a new level: a small Landscape, a few meshes such as rocks and walls, and basic lighting. Make it walkable: add a Player Start, make sure the meshes have collision so that you cannot walk through them, and leave no dead ends."
      - "Build one master material named M_Master_Surface with parameters for color, roughness, a texture and tiling. Put its parameters in named groups in the Details panel of each parameter."
      - "Use instances of this material on at least 5 surfaces in the scene."
      - "Build a landscape material with 3 layers that uses a Landscape Layer Blend node, and paint the layers on the landscape. Place at least 3 decals that each have a purpose, such as a stain under a pipe or an arrow toward the path. A decal is a material with its Material Domain set to Deferred Decal."
      - "Walk through the scene in PIE, which means Play In Editor. Fix anything that looks wrong at eye level."
      - "Write a short note that lists the parameters of the master material and says what each one is for."
    done_when: "Send 3 PIE screenshots taken at eye level, a screenshot of the master material graph, the list of instances, and your note about the parameters."
    xp: 200
    verify_type: screenshot
    quiz:
      - q: "Why do you walk through the scene at eye level?"
        choices: ["It makes the scene render faster", "It shows problems that a still render hides", "It creates the Material Instances", "It paints the landscape layers"]
        answer_index: 1
        explain: "Walking shows gaps, stretched textures and places where you get stuck. A single still picture can hide all of these."
      - q: "Which three things make the scene walkable?"
        choices: ["A Sky Light, a Directional Light and Height Fog", "A Cine Camera, a bookmark and a screenshot", "A Player Start, collision on the meshes and no dead ends", "A master material, an instance and a decal"]
        answer_index: 2
        explain: "The Player Start puts the player in the scene. Collision keeps the player from walking through meshes, and a scene without dead ends can be walked all the way."
      - q: "In Play In Editor you walk straight through a rock. What do you check first?"
        choices: ["That the rock mesh has collision", "That the rock uses a Material Instance", "That the rock has a decal", "That the rock is on the landscape"]
        answer_index: 0
        explain: "Without collision, a mesh is only a picture and nothing stops the player. The mesh needs collision to be solid."
      - q: "Which parameters does M_Master_Surface have?"
        choices: ["Sun angle, fog color and exposure", "Width, height and depth", "Speed, health and score", "Color, roughness, a texture and tiling"]
        answer_index: 3
        explain: "These four parameters are enough to make many different surfaces from one graph. Each instance sets its own values."
      - q: "How do at least 5 surfaces in the scene get their different looks?"
        choices: ["Each surface uses its own new material graph", "Each surface uses an instance of the one master material", "Each surface is painted in another program", "Each surface uses a different landscape"]
        answer_index: 1
        explain: "The instances share one graph and differ only in their parameter values. The scene stays easy to manage, because there is only one material to maintain."
      - q: "What does the landscape material of the scene need?"
        choices: ["3 layers and a Landscape Layer Blend node", "3 lights and a Sky Atmosphere", "1 layer and a WorldAlignedTexture node", "5 instances and a decal"]
        answer_index: 0
        explain: "The Landscape Layer Blend node mixes the 3 layers based on where you paint. You then paint the layers on the landscape."
      - q: "What must each of the 3 decals in the scene have?"
        choices: ["A light of its own", "A collision box", "A name that starts with MI_", "A purpose, such as a stain under a pipe or an arrow toward the path"]
        answer_index: 3
