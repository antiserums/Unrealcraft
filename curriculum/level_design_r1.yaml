        choices: ["Decoration only", "Hiding the skybox", "Improving frame rate", "Letting the player orient themselves and find the goal from a distance"]
        answer_index: 3
        explain: "A good landmark answers 'where am I, where do I go?' without a map."
      - q: "What makes a landmark readable?"
        choices: ["Lots of small detail", "A unique silhouette that's visible from several places", "A bright material only", "Being close to the player"]
        answer_index: 1
        explain: "Silhouette carries at distance. Fine detail disappears."
      - q: "Where should you check a sightline?"
        choices: ["At the player's eye height in PIE", "Top-down view", "From the Sky Light", "In the Content Drawer"]
        answer_index: 0
        explain: "The flying editor camera sees over walls the player never can."
      - q: "Why block a sightline on purpose?"
        choices: ["To hide mistakes", "To set up a reveal or a choice when the view opens", "To save memory", "To make it harder to find the goal forever"]
        answer_index: 1
        explain: "Hiding the goal for a moment, then showing it, makes a reveal feel earned."
