    title: Foliage that doesn't block routes
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/foliage-mode-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 foliage mode paint erase density beginner"
    checklist:
      - "In L_Terrain_01 open Foliage Mode and add two foliage types: one bush and one small grass or rock mesh."
      - "Paint both along the edges of your ramped path. Hold Shift to erase anything that lands on it."
      - "Open the bush foliage type and lower Density until the path edges still read."
      - "Set the grass type's Collision Preset to NoCollision so the player walks through it."
      - "Walk the path in PIE. Nothing on it should stop or snag you."
    done_when: "Eye-level screenshot of the path with foliage on both sides and the path itself clear."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "In Foliage Mode's Paint tool, how do you erase instances?"
        choices: ["Hold Shift while painting", "Press Delete", "Right-click the mesh in the Content Drawer", "Set Density to 100"]
        answer_index: 0
        explain: "Shift inverts the paint brush and removes instances under it."
      - q: "Where do you set how thickly a foliage type is painted?"
        choices: ["World Settings", "The mesh's LOD settings", "The Post Process Volume", "The foliage type's Density setting"]
        answer_index: 3
        explain: "Each foliage type has its own density and scale ranges."
      - q: "Grass on the path stops the player like a wall. The fix?"
        choices: ["Delete the landscape", "Set the grass foliage type's Collision Preset to NoCollision", "Raise Max Step Height to 500", "Turn off Lumen"]
        answer_index: 1
        explain: "Small ground cover rarely needs collision. Save collision for things that should block."
      - q: "Why is painted foliage cheaper than placing each bush as its own actor?"
        choices: ["It has no materials", "It's drawn as instanced static meshes, so many copies render efficiently", "It's never shadowed", "It isn't saved"]
        answer_index: 1
        explain: "Foliage instances are batched instead of costing one actor each."
      - q: "What's the level design risk of dense foliage?"
        choices: ["None", "It breaks PIE", "It can hide route edges, landmarks and the ground the player needs to read", "It changes the capsule size"]
        answer_index: 2
        explain: "Foliage should frame routes, not hide them."
    flavors:
      _default: {why: "Foliage makes a space feel real. Keep it off the path."}
      level_design: {why: "Your Rank 1 adjacent taster. Foliage frames a route or hides it.", do: "Use a bush line to point toward your path, not across it."}
      lookdev: {why: "Density and variety are what sell an outdoor diorama."}
      gameplay_design: {why: "Cover and clutter change how a space plays. See it once."}

  # ------------ Level Design ------------
  - id: R1-LD-01
    rank: 1
    track: world-lighting
    subjects: [metrics, character]
    required_for_majors: [level_design]
    taster_for_majors: []
    adjacent_for: [gameplay_design, animation]
    required_spine: false
    elective: false
    title: Build a metrics gym
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-01-project-setup-and-level-blockout-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 level design metrics gym character jump height step height"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/third-person-template-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-a-character-in-unreal-engine"
    checklist:
      - "Open BP_ThirdPersonCharacter. Write down Capsule Radius and Capsule Half Height from the Capsule Component."
      - "From Character Movement write down Max Step Height, Walkable Floor Angle, Jump Z Velocity and Gravity Scale."
      - "New level L_MetricsGym. Build a row of steps (15, 30, 45, 60 cm), a row of ledges (100–250 cm, 25 cm apart) and a row of gaps (100–500 cm, 50 cm apart)."
      - "Build three doorways: capsule diameter, diameter + 40 cm, and your comfortable width."
      - "PIE and test every piece. Note the highest step you walk up, the highest ledge you jump onto and the widest gap you clear."
      - "Label each piece with a Text Render actor so the numbers are visible in screenshots."
    done_when: "Screenshot of the labelled gym plus a metrics list (capsule, step, jump height, jump distance, door width)."
    xp: 70
    verify_type: screenshot
    quiz:
      - q: "Where do you read the character's collision size?"
        choices: ["Capsule Component → Capsule Radius and Capsule Half Height", "The mesh's bounds", "World Settings", "The Animation Blueprint"]
        answer_index: 0
        explain: "The capsule is what actually collides. The visible mesh doesn't decide what fits."
      - q: "Which setting decides the tallest step the character walks up without jumping?"
        choices: ["Jump Z Velocity", "Max Step Height on Character Movement", "Capsule Radius", "Walkable Floor Angle"]
        answer_index: 1
        explain: "Max Step Height (45 cm by default) is the limit. Taller than that needs a jump."
      - q: "Which two Character Movement values mostly decide jump height?"
        choices: ["Max Walk Speed and Braking", "Mass and Friction", "Jump Z Velocity and Gravity Scale", "Air Control and Step Height"]
        answer_index: 2
        explain: "Launch speed up against gravity. Measure it in the gym anyway. Don't guess from the formula."
      - q: "Capsule Radius is 42. What's the narrowest gap the capsule can physically pass?"
        choices: ["42 cm", "Just over 84 cm, though you'd build wider for comfort", "200 cm", "Any width"]
        answer_index: 1
        explain: "Width is the diameter, twice the radius. A door that just fits feels awful to walk through."
      - q: "What is the metrics gym for?"
        choices: ["A portfolio piece", "Testing lighting", "Performance profiling", "Measuring the character once so every level uses tested numbers"]
        answer_index: 3
        explain: "Measure once, build to the numbers. Keep the gym and update it if movement changes."
    flavors:
      _default: {why: "Every space is built around what the character can do. Measure it first."}
      level_design: {why: "Your metrics sheet is the rulebook for every blockout from here on.", do: "Keep L_MetricsGym in the project and re-check it whenever movement settings change."}
      programming: {why: "Feel what the movement numbers do before you write movement code."}
      animation: {why: "Step and ledge heights decide which climb and vault animations you'll need."}

