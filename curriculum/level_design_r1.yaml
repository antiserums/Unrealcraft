    flavors:
      _default: {why: "People find their way by what they can see."}
      level_design: {why: "Players who can see the goal don't need a waypoint marker.", do: "Every route should get at least one view of the landmark before the halfway point."}
      lookdev: {why: "A landmark is where your composition work pays off in gameplay."}

