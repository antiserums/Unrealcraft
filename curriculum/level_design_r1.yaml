# Verified slugs only (see VERIFIED_URLS.md). Backup videos are TODO_URL until a human picks a dated UE5+ video.
# Rank 0–1 verification is quiz + honor-system artifact. No mentor sign-off at this rank.

quests:
  # ------------ Shared world-lighting (Level Design + Environment Art) ------------
  - id: R1-WL-01
    rank: 1
    track: world-lighting
    subjects: [landscape, sculpt]
    required_for_majors: [level_design, lookdev]
    taster_for_majors: []
    adjacent_for: [gameplay_design, cinematics]
    required_spine: false
    elective: false
    title: Sculpt a walkable patch
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/landscape-quick-start-guide-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 landscape quick start sculpt beginner"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/landscape-sculpt-mode-in-unreal-engine"
    checklist:
      - "New level L_Terrain_01. Landscape Mode → Manage → New. Keep it small (the default size or less is plenty)."
      - "Sculpt tool: raise one hill and hold Shift to dig one hollow."
      - "Smooth tool over the edges until nothing looks like a spike."
      - "Ramp tool: make one path from the low ground to the top of the hill."
      - "Drop in a Player Start and the Third Person GameMode, then walk the path in PIE."
      - "Anywhere the character slides back or gets stuck, smooth or flatten it."
    done_when: "Eye-level screenshot on the path plus one overview screenshot of the patch."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Where do you create a new Landscape?"
        choices: ["Content Drawer → right-click → Landscape", "Landscape Mode → Manage → New", "World Settings → Terrain", "Place Actors → Basic → Cube"]
        answer_index: 1
        explain: "Landscape Mode has its own Manage, Sculpt and Paint tabs. New lives under Manage."
      - q: "With the Sculpt tool active, what does holding Shift while painting do?"
        choices: ["Lowers the terrain instead of raising it", "Doubles brush size", "Paints a material layer", "Undoes the last stroke"]
        answer_index: 0
        explain: "Shift inverts the tool, so Sculpt digs down."
      - q: "You need an even slope between two points. Which tool?"
        choices: ["Erosion", "Noise", "Ramp", "Retopologize"]
        answer_index: 2
        explain: "Ramp builds a straight, even slope between two points you place. Good for paths."
      - q: "The character slides back down a slope in PIE. What's the likely cause?"
        choices: ["Lumen is off", "The slope is steeper than the CharacterMovement Walkable Floor Angle", "The landscape has no material", "Collision is on"]
        answer_index: 1
        explain: "CharacterMovement treats anything steeper than Walkable Floor Angle (about 45° by default) as a wall."
      - q: "Why keep the first landscape small?"
        choices: ["Big landscapes aren't allowed", "Lumen only works on small ones", "Small landscapes don't need collision", "Faster to sculpt, test and fix; most of a huge terrain would sit empty"]
        answer_index: 3
        explain: "You're learning the tools. Only build the area the player will actually walk."
    flavors:
      _default: {why: "Not every level is flat. Know how to make ground the player can walk."}
      level_design: {why: "Terrain is blockout too. Slope decides where players can and can't go.", do: "Mark the path you ramped. That is your first route on uneven ground."}
      lookdev: {why: "Your diorama needs ground that reads well under light, not a flat plane."}

  - id: R1-WL-02
    rank: 1
    track: world-lighting
    subjects: [lighting, mobility, lumen]
    required_for_majors: [level_design, lookdev]
    taster_for_majors: []
    adjacent_for: [cinematics, tech_art]
    required_spine: false
    elective: false
    title: Light types and Lumen
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/light-types-and-their-mobility-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 light types mobility movable stationary static lumen"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/lumen-global-illumination-and-reflections-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/features-and-properties-of-lights-in-unreal-engine"
    checklist:
      - "Open Project Settings → Rendering and confirm Dynamic Global Illumination Method is Lumen."
      - "In L_Room_01 place one each: Point, Spot and Rect Light. Set all three to Movable."
      - "Change each light's Intensity, Attenuation Radius and color. For the Spot, change the cone angles."
      - "Aim the Rect Light at a wall and watch Lumen bounce color onto the floor."
      - "Toggle one light's mobility to Static and note what the tooltip or warning says."
    done_when: "One screenshot with all three lights visible, plus one line per light on what you'd use it for."
    xp: 70
    verify_type: screenshot
    quiz:
      - q: "What are the three light mobility settings?"
        choices: ["Low, Medium, High", "Baked, Mixed, Realtime", "Static, Stationary, Movable", "Local, Global, Sky"]
        answer_index: 2
        explain: "Mobility sets how much of the light can change at runtime and how it's lit."
      - q: "Which mobility lets a light move and change freely at runtime?"
        choices: ["Static", "Stationary", "Movable", "None, lights can't move"]
        answer_index: 2
        explain: "Movable lights are fully dynamic. That's the safe default with Lumen."
      - q: "Do you need to build lighting for Lumen bounce light to appear?"
        choices: ["No, Lumen calculates GI and reflections at runtime", "Yes, every time you move a light", "Only for Rect Lights", "Only in packaged builds"]
        answer_index: 0
        explain: "Lumen is dynamic. There is no lightmap bake for its bounce light."
      - q: "You want soft light from a window-shaped area. Which light?"
        choices: ["Point Light", "Rect Light", "Directional Light", "Sky Light"]
        answer_index: 1
        explain: "A Rect Light emits from a rectangle, like a window or softbox."
      - q: "Where do you check that a project uses Lumen?"
        choices: ["World Settings → Lighting", "Editor Preferences → Viewport", "The Sky Light's Details", "Project Settings → Rendering → Dynamic Global Illumination Method"]
        answer_index: 3
        explain: "New UE5 projects default to Lumen. The setting lives in Project Settings → Rendering."
    flavors:
      _default: {why: "Pick the right light and you do half the lighting work."}
      level_design: {why: "You'll place lights to guide players. Know which one does what.", do: "Put the Spot on the doorway and see how it pulls your eye."}
      lookdev: {why: "Mobility and light shape are the vocabulary for everything you light after this."}

  - id: R1-WL-03
    rank: 1
    track: world-lighting
    subjects: [post-process, exposure]
    required_for_majors: [level_design, lookdev]
    taster_for_majors: []
    adjacent_for: [cinematics, tech_art]
    required_spine: false
    elective: false
    title: Lock exposure for honest review
    time_min: 30
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/add-post-process-volumes"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 post process volume manual exposure lock ev100"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/auto-exposure-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine"
    checklist:
      - "In L_Room_01 add a Post Process Volume and tick Infinite Extent (Unbound)."
      - "Walk from the bright doorway into a dark corner in PIE. Watch auto exposure adapt."
      - "Exposure → set Metering Mode to Manual, then adjust Exposure Compensation until the room reads clearly."
      - "Walk the same path again. Brightness should now stay put."
      - "Save a camera bookmark and screenshot it before and after the lock."
    done_when: "Before/after screenshots from the same bookmark, plus the Exposure settings visible in Details."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "How do you make one Post Process Volume affect the whole level?"
        choices: ["Tick Infinite Extent (Unbound)", "Scale it to 10000", "Set Priority to 0", "Put it in World Settings"]
        answer_index: 0
        explain: "Unbound makes the volume apply everywhere, no matter where the camera is."
      - q: "Why lock exposure before reviewing a level?"
        choices: ["It improves performance", "Auto exposure brightens dark areas as you look at them, so you can't judge real brightness", "Lumen requires it", "It's needed to package"]
        answer_index: 1
        explain: "With auto exposure on, a dark corner looks fine once your 'eyes' adapt. Locked exposure shows the real result."
      - q: "Which is a valid way to lock exposure?"
        choices: ["Delete the Sky Light", "Turn off Lumen", "Set Min EV100 and Max EV100 to the same value", "Set Blend Radius to 0"]
        answer_index: 2
        explain: "Equal min and max leaves auto exposure no range. Manual metering mode also works."
      - q: "Two bounded Post Process Volumes overlap. Which wins?"
        choices: ["The bigger one", "The one placed first", "The one with higher Priority", "They cancel out"]
        answer_index: 2
        explain: "Priority decides the order. Higher Priority is applied on top."
      - q: "What does Blend Radius do on a bounded volume?"
        choices: ["Blurs the image", "Fades the volume's settings in over that distance as the camera approaches", "Sets the fog radius", "Limits light range"]
        answer_index: 1
        explain: "Blend Radius avoids a hard pop when the camera enters the volume."
    flavors:
      _default: {why: "If exposure drifts, every screenshot you post will look different."}
      level_design: {why: "A dark route stays dark with locked exposure. That's what you want to catch.", do: "Lock it once and leave it locked for the rest of Rank 1."}
      lookdev: {why: "You can't compare two lighting passes if the camera keeps changing exposure."}

  - id: R1-WL-09
    rank: 1
    track: world-lighting
    subjects: [foliage, routes]
