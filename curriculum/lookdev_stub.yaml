#   R1-WL-01  Landscape                        (shared, level_design_r1.yaml)
#   R1-WL-02  Light types and Lumen            (shared, level_design_r1.yaml)
#   R1-WL-03  Post process and exposure        (shared, level_design_r1.yaml)
#   R1-WL-09  Foliage                          (shared, level_design_r1.yaml)
#   R1-LK-01  Reference board and mood target
#   R1-LK-02  Sky, HDRI and atmosphere mood
#   R1-LK-03  IES profiles and physical light units indoors
#   R1-LK-04  Composition: bookmarks and a Cine Camera still
#   R1-LK-CAP Lit diorama (capstone)
#   Electives: R1-LK-05, R1-LK-06, R1-LK-07
#   (required_tasters rank 1: none)
#
# Rank 2 (Gameplay Prototyper) — track: materials
#   R2-MAT-01 Material Editor basics           (shared materials track, defined here)
#   R2-MAT-02 PBR inputs                       (shared materials track, defined here)
#   R2-MAT-03 Texture sampling and UVs         (shared materials track, defined here)
#   R2-MAT-04 Parameters for instances         (shared materials track, defined here)
#   R2-MAT-05 Landscape material basics        (shared materials track, defined here)
#   R2-MAT-06 Decals                           (shared materials track, defined here; Level Design adjacent)
#   T-PICKUP-LOOP  Opposite taster: tiny pickup loop (tasters.yaml) — required_tasters rank 2
#   R2-LK-CAP Walkable diorama + master material + instances (capstone)
#   Electives: R2-MAT-07, R2-MAT-08, R2-MAT-09
#
# Rank 3 (Specialist, Lookdev seal) — track: bay-lookdev
#   R3-LK-01  Master material architecture
#   R3-LK-02  Material functions
#   R3-LK-03  Vertex paint blending
#   R3-LK-04  Nanite and displacement awareness
#   R3-LK-05  Light a hero area
#   R3-LK-06  Post process grading and LUT
#   R3-LK-07  Movie Render Queue still
#   R3-CA-01  Character anatomy                (shared, required for all majors)
#   R3-CA-02  Read an AnimBP                   (shared, required for all majors)
