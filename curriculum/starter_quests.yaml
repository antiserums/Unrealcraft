    quiz:
      - q: "In a Blueprint, which event runs when the player walks into a collision box?"
        choices: ["Event Tick", "On Component Begin Overlap", "Event BeginPlay", "On Clicked"]
        answer_index: 1
        explain: "On Component Begin Overlap runs at the moment something starts touching the box. The box's collision must be set to overlap for this to happen."
      - q: "You made a Blueprint actor named BP_Door. How do you get it into your level?"
        choices: ["Drag it from the Content Drawer into the viewport", "It appears in the level by itself", "Add it in World Settings", "Add it in Project Settings"]
        answer_index: 0
        explain: "A Blueprint Class is a template. Dragging it into the viewport places one copy of it in the level, and that copy is called an instance."
      - q: "What is the Print String node used for?"
        choices: ["The user interface of a finished game", "Quick debug messages on screen and in the log", "Saving files", "Player chat"]
        answer_index: 1
        explain: "Print String writes a short message on screen. It is the fastest way to check that an event really ran."
      - q: "You walk into your collision box and the overlap event never runs. What should you check first?"
        choices: ["Reinstall the engine", "The box's Generate Overlap Events option and its collision preset", "The material", "The lighting"]
        answer_index: 1
        explain: "Most overlap problems are collision settings. The box needs Generate Overlap Events turned on, and a collision preset that overlaps the player."
      - q: "When does Event BeginPlay run?"
        choices: ["Every frame", "Once, when the actor starts playing", "When something overlaps the actor", "It never runs in Play In Editor"]
        answer_index: 1
        explain: "BeginPlay runs one time when the actor enters the game, so it is the place for setup. Event Tick is the one that runs every frame."
