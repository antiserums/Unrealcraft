# Unrealcraft — Starter Quests (Rank 0, every specialization)
# Short on purpose. Finish all 11 before the specialization grind starts.
# URL prefix: https://dev.epicgames.com/documentation/en-us/unreal-engine/
# Verified slugs only (see VERIFIED_URLS.md). Backup videos are TODO_URL until a human picks a dated UE5+ video.

quests:
  - id: SQ1
    rank: 0
    difficulty: novice
    specializations: [all]
    subjects: [install]
    required_spine: true
    required: true
    title: Install the engine
    brief: "Unreal Engine is the program you will use for every quest after this one. You do not download it from a website: you install a small program called the Epic Games Launcher, and the Launcher downloads the engine for you. The download is large, so start it when you have a good connection and some free disk space."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/install-unreal-engine"
    backup_url: TODO_URL
    backup_search: "install unreal engine 5 epic games launcher beginner"
    checklist:
      - "Download the Epic Games Launcher from Epic's website and install it. Open it and sign in with an Epic Games account (it is free to make one)."
      - "In the Launcher, click Unreal Engine in the left menu, then open the Library tab at the top. Click the + button next to Engine Versions and install the newest UE5 version it offers."
      - "Before the download starts, click Options. Untick the platforms you will not build for, such as Android and iOS. This saves a lot of disk space, and you can add them back later."
      - "When the install is finished, click Launch. Wait for the engine to open, and check that you see the Project Browser, the window where you pick or create a project."
    done_when: "Send a screenshot of the Project Browser. The engine version number must be visible in it (you can see it in the window title or in the Launcher next to the engine)."
    xp: 50
    verify_type: screenshot
    quiz:
      - q: "Which program do you use to download and install Unreal Engine 5?"
        choices: ["Steam, in the Library tab, under the Tools category", "The Epic Games Launcher, in the Unreal Engine tab under Library", "The Microsoft Store, on the page of Unreal Engine 5, with the Install button", "A zip file that someone sends you in a chat, unpacked to your desktop"]
        answer_index: 1
        explain: "Unreal Engine is installed from the Epic Games Launcher. Its Library tab is where you add, update and remove engine versions."
      - q: "During the install, the Options button lets you untick target platforms such as Android or iOS. Why is it a good idea to untick the ones you do not use?"
        choices: ["Because they cost extra money as soon as the free trial period ends", "Because they take a lot of disk space and you do not need them yet", "Because they break Lumen in every project that you make on your computer", "Because they only work on Linux, and the install fails on Windows with them"]
        answer_index: 1
        explain: "Each extra platform adds many gigabytes to the install. You can add a platform later, when you actually want to build your game for it."
      - q: "Can you have more than one version of Unreal Engine installed on the same computer?"
        choices: ["No, only one version at a time", "Yes, they sit side by side in the Library", "Only if you build the engine from source code", "Only on a Mac"]
        answer_index: 1
        explain: "The Library can hold several engine versions at once. This is why you always say which version you used when you send your work."
      - q: "You launch the engine for the first time. Which screen opens first?"
        choices: ["The Level Editor", "The Project Browser", "The Material Editor", "Fortnite"]
        answer_index: 1
        explain: "The Project Browser opens first. It is the window where you open a project you already have, or create a new one."
      - q: "Why should you say which Unreal Engine version you use when you send your work or ask for help?"
        choices: ["There is no reason to; all versions of Unreal Engine 5 have the same menus and the same features", "Menus and features differ between versions, so a helper needs to know which one you have", "So that the site can update your engine to the newest version while you work on a quest", "Because only one version is allowed, and work from other versions is refused"]
        answer_index: 1
        explain: "Unreal changes from version to version. A menu or an asset that exists in one version can be missing or renamed in another, so the version is the first thing a helper needs to know. Unrealcraft teaches the current UE5 version."
    flavors:
      _default: {why: "Everything else needs this."}
      level_design: {why: "Your future levels start here."}
      programming: {why: "Start with the Launcher build. A source build and a code editor can wait until you need them."}

  - id: SQ2
    rank: 0
    difficulty: novice
    specializations: [all]
    subjects: [project, templates]
    required_spine: true
    required: true
    title: Blank vs Third Person
    brief: "When you create a project, Unreal asks you to pick a template. A template is a starting point that decides what the project already contains. Third Person gives you a character you can control and a small level, while Blank gives you almost nothing. In this quest you create one project from each of these two templates and compare them to see the difference."
    time_min: 30
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-a-new-project-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 blank vs third person template"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-templates-reference"
    checklist:
      - "Create a new project named UC_Sandbox from the Third Person template. Choose Blueprint as the project type and leave the other settings as they are."
      - "Press Play and run around the level once."
      - "Create and open a second project from the Blank template and compare the two. Notice that Blank has no pawn (no character to control) and no level art."
      - "Close the Blank project. You can keep UC_Sandbox as a place to practice, but you do not have to: every quest tells you which template to start from."
    done_when: "Send a screenshot of UC_Sandbox open in the editor, and add one sentence about what the Third Person template gives you that Blank does not."
    xp: 50
    verify_type: screenshot
    quiz:
      - q: "When you create a new project you pick a template. What does the Third Person template give you that the Blank template does not?"
        choices: ["Nothing, they are the same; the name only changes the icon of the project", "A character you can play, a camera, input controls and a sample level", "A project that only uses C++ and has no Blueprints or sample content in it", "Multiplayer that is already set up, with a server and two test players"]
        answer_index: 1
        explain: "Third Person comes with a ready-made character and a small level, so you can press Play and walk around straight away."
      - q: "When is the Blank template the right one to pick?"
        choices: ["Never, because a project that starts with nothing in it cannot be played or tested", "When you want to build every system yourself, with nothing made for you", "When you need a character that can walk and jump as soon as the project opens", "Only when you make a mobile game, because phones cannot run the other ones"]
        answer_index: 1
        explain: "Blank is empty on purpose. It is the right start when you do not want any ready-made character, camera or level in your way."
      - q: "The new-project window asks you to choose between Blueprint and C++. What does this choice decide?"
        choices: ["Which renderer the project uses for its lighting", "Whether the project starts with C++ source files", "Which Unreal version the project uses when you open it", "Which platform the project is built for when you package it"]
        answer_index: 1
        explain: "It only decides what the project starts with. A Blueprint project can still have C++ added to it later."
      - q: "Old tutorials tell you to tick a Starter Content checkbox in the new-project window. You cannot find it in a current Unreal Engine version. Why?"
        choices: ["Your install is broken and must be repaired in the launcher first", "Current versions no longer include the Starter Content pack", "It only appears for C++ projects in that window", "It only appears when you pick the Blank template in that window"]
        answer_index: 1
        explain: "Starter Content was a pack of sample meshes, materials and sounds. Current engine versions no longer include it, so the quests here use the assets of the templates and of the engine."
      - q: "You want a game where the camera looks down on the character from above. Which template gives you that as a starting point?"
        choices: ["Blank", "Top Down", "First Person", "Third Person"]
        answer_index: 1
        explain: "The Top Down template starts with a character that is seen from above. First Person shows the world through the eyes of the character, and Third Person puts the camera behind the character."
    flavors:
      _default: {why: "Knowing what a template includes tells you what you'd have to build yourself."}
      level_design: {why: "Third Person is your test character. Its capsule and jump set your metrics."}
      programming: {why: "Later you'll rebuild parts of this template in C++. First see what it does."}

  - id: SQ3
    rank: 0
    difficulty: novice
    specializations: [all]
    subjects: [viewport, pie]
    required_spine: true
    required: true
    title: Fly the viewport
    brief: "The viewport is the large window in the middle of the editor that shows your level. You will move through it all day, so it is worth learning the controls well now. In this quest you fly the camera, save a camera position, and learn how to leave your character while the game is running so that you can look around."
    time_min: 30
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/viewport-controls-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 viewport navigation controls bookmarks"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-bookmarks"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/playing-and-simulating-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/possessing-pawns-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Hold the right mouse button in the viewport and use the W, A, S, D keys to fly, with Q and E to go down and up. While you fly, turn the mouse wheel to change the fly speed."
      - "Select something in the level and press F. The camera moves to focus on it."
      - "Save a camera bookmark, which is a stored camera position, with Ctrl+1. Move away, then press 1 to return to it."
      - "Press Play to start Play in Editor (PIE). Then press F8 to eject, which lets you leave the character and fly around while the game keeps running."
      - "Press Esc to stop PIE."
    done_when: "Send a short text that says which key ejects you from PIE, and why you would want to do that."
    xp: 50
    verify_type: writeup
    quiz:
      - q: "The viewport is the 3D window where you see your level. How do you fly around in it the way you would move a camera in a game?"
        choices: ["Hold the right mouse button and press W, A, S and D", "Use only the arrow keys of the keyboard", "Hold Ctrl and scroll the mouse wheel up or down to move", "Double-click in the viewport and move the mouse around"]
        answer_index: 0
        explain: "Hold the right mouse button and use W, A, S, D to move, with Q and E to go down and up. While you fly, the mouse wheel changes your speed."
      - q: "You click an actor (an object in your level) to select it, then press F. What happens?"
        choices: ["The actor is deleted", "The camera moves to focus on the actor", "The actor is frozen in place", "The Blueprint of the actor opens in a tab"]
        answer_index: 1
        explain: "F stands for focus. It moves the camera so the selected actor fills the view, which is the fastest way to find something in a big level."
      - q: "In the viewport, what happens when you press Ctrl+1 and later press 1?"
        choices: ["You switch to another level and then come back to the first level again", "Ctrl+1 saves the camera position as a bookmark, and 1 jumps back to it", "The grid size changes to 1 unit, and the second press sets it back to 10 units", "Lumen turns on and off, so you can compare the lighting of the level quickly"]
        answer_index: 1
        explain: "These are camera bookmarks. Ctrl plus a number saves where the camera is, and pressing that number alone brings you back to the same view."
      - q: "PIE means Play In Editor: testing your game inside the editor. While PIE is running, what does pressing F8 do?"
        choices: ["It quits the game and returns you to the editor at the place where the camera was", "It lets you leave your character and look around while the game keeps running", "It takes a screenshot of the game and saves it in the Saved folder of the project", "It compiles your Blueprints again while the game keeps running in the viewport"]
        answer_index: 1
        explain: "F8 ejects you from the pawn, which is the character you control. The game keeps running so you can inspect it. Press F8 again to take control back."
      - q: "The editor has a Play button and a Simulate button. What is the difference between them?"
        choices: ["There is no difference; both buttons start the same session", "Simulate runs the world but does not create a player for you to control", "Simulate is slower, because it runs physics two times per frame", "Play does not run Blueprints, while Simulate runs them and the physics"]
        answer_index: 1
        explain: "Simulate runs physics and game logic so you can watch the level work, but no player character is spawned. Play also spawns a player and gives you control of it."
    flavors:
      _default: {why: "You'll use the viewport all day. Get comfortable in it."}
      level_design: {why: "Bookmarks are your review cameras. Eject from PIE to check sightlines while the game runs."}
      programming: {why: "Eject from PIE to watch actors while your logic runs."}
      animation: {why: "Focus and orbit your character. Eject from PIE to watch the pose from any angle."}

  - id: SQ4
    rank: 0
    difficulty: novice
    specializations: [all]
    subjects: [content-browser, naming]
    required_spine: true
    required: true
    title: A tidy Content Drawer
    brief: "Every file in an Unreal project is called an asset, and a project soon has hundreds of them. Clear folders and a short prefix on each name, such as SM_ for a Static Mesh, make it easy for anyone to find things later, including you. In this quest you make the folder structure used in Unrealcraft and give one asset of each kind its correct prefix."
    time_min: 30
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/content-browser-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 content browser folders naming conventions"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/recommended-asset-naming-conventions-in-unreal-engine-projects"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open the Content Drawer with Ctrl+Space. This is the panel that shows all the files of your project."
      - "Create a folder at /Content/UC/ and add these subfolders inside it: Maps, Meshes, Materials, Textures, and Blueprints."
      - "Rename or duplicate one asset of each kind so that it has the correct prefix: SM_ for a Static Mesh, M_ for a material, MI_ for a Material Instance, T_ for a texture, BP_ for a Blueprint, and L_ for a level. You can copy assets from the template folders, such as LevelPrototyping and Characters, into your folders for this."
      - "Save a level with the name L_Sandbox in the folder UC/Maps."
    done_when: "Send a screenshot of the UC folder tree that shows the assets with their prefixes."
    xp: 50
    verify_type: screenshot
    quiz:
      - q: "Asset names start with a short prefix that says what kind of asset it is. Which prefix is used for a Static Mesh?"
        choices: ["M_", "SM_", "S_", "ST_"]
        answer_index: 1
        explain: "SM_ means Static Mesh, a 3D model that does not bend. SK_ is used for a Skeletal Mesh, a model with bones that can be animated."
      - q: "Which prefix is used for a Material Instance?"
        choices: ["M_", "MI_", "MAT_", "I_"]
        answer_index: 1
        explain: "M_ is for a parent material, and MI_ is for a Material Instance made from it."
      - q: "Which prefix do we put on a level (also called a map)?"
        choices: ["L_", "MAP_", "LV_", "W_"]
        answer_index: 0
        explain: "Unrealcraft uses L_ for levels, for example L_FirstRoom."
      - q: "Why should you move or rename assets inside the Unreal editor, and never in your computer's file explorer?"
        choices: ["Because the file explorer is much slower than the editor when it moves many files in one go", "Because the editor updates the links between assets, and the file explorer breaks them", "Because only Epic is allowed to move the files that are inside the Content folder of a project", "There is no reason; both ways give the same result in the project"]
        answer_index: 1
        explain: "Assets point to each other: a mesh points to its material, a level points to its meshes. When you move something in the Content Browser, the editor repairs those links for you. The file explorer does not know they exist."
      - q: "The Content Drawer is the panel that slides up to show your project's files. Which shortcut opens it?"
        choices: ["Ctrl+Space", "Ctrl+Tab", "Tab", "F11"]
        answer_index: 0
        explain: "Ctrl+Space opens the Content Drawer, and pressing it again closes it."
    flavors:
      _default: {why: "Clear names mean anyone can find your assets later, including you."}
      level_design: {why: "At Rank 4 you ship a kit someone else can use. It starts with naming."}
      programming: {why: "Your code will load assets by path. Messy folders break things."}

  - id: SQ5
    rank: 0
    difficulty: novice
    specializations: [all]
    subjects: [outliner, details, transforms]
    required_spine: true
    required: true
    title: Move things on purpose
    brief: "Every object you place in a level is called an actor. Building anything in Unreal means moving, rotating and scaling actors, and doing it exactly is better than doing it by eye. In this quest you practice the transform tools, turn on snapping so that things move in fixed steps, and learn a few panels that help you place and organize actors."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/transforming-actors-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 outliner details panel transform snapping"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/outliner-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-editor-details-panel-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-settings-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-snapping-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Select an actor in the level and press W to move it, E to rotate it and R to scale it. Pressing Space switches between these three tools."
      - "Turn on grid snapping at the top of the viewport and set it to 10 or 50. Set the rotation snap to 15°."
      - "In the Outliner, the panel that lists everything in the level, create a folder called Blockout and put 3 actors into it."
      - "Select an actor and type an exact Location into its Details panel."
      - "Open World Settings and find the setting named GameMode Override. You only need to find it for now."
      - "Lift an actor so that it floats above the floor, then press End to drop it down onto the floor."
    done_when: "Send a screenshot that shows the Outliner folder and a Details panel with the values you typed in."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "With an actor selected in the viewport, what do the W, E and R keys switch between?"
        choices: ["Three different camera view modes", "The move, rotate and scale tools", "Three lighting modes of the viewport", "Three different levels of the project"]
        answer_index: 1
        explain: "W is move, E is rotate and R is scale. These tools are called transform gizmos, and the Space bar also cycles through them."
      - q: "You want an actor at an exact position, for example X = 200. Where do you type the number?"
        choices: ["In the Outliner, next to the name of the actor", "In the Details panel, under Transform", "In World Settings, under the World section", "In the Content Drawer, under Settings"]
        answer_index: 1
        explain: "The Details panel shows every setting of the actor you have selected. Its Transform section holds the location, rotation and scale as numbers you can type."
      - q: "What is the World Settings panel used for?"
        choices: ["Settings of the one actor that you have selected in the level", "Settings for the whole level, such as GameMode Override", "The color theme of the editor and the size of its text and icons", "Installing the engine and adding new target platforms to it later"]
        answer_index: 1
        explain: "World Settings holds settings that belong to the level itself, not to one actor. Every level has its own."
      - q: "A blockout is a rough version of a level built from simple shapes. Why should you turn on grid snapping while you build one?"
        choices: ["Because it looks nicer in screenshots when every edge is on a line of the grid", "Because pieces line up with no gaps and your measurements stay clean", "Because you cannot save a level that was built without the grid turned on", "Because the level renders faster when all of its meshes sit on whole numbers"]
        answer_index: 1
        explain: "With snapping on, pieces move in fixed steps, so walls meet exactly and sizes are round numbers. That makes the level easy to measure and to change later."
      - q: "You select an actor that is floating in the air and press the End key. What happens?"
        choices: ["The actor is deleted from the level at once", "The actor drops onto the surface below it", "Play In Editor stops and the actor resets", "The actor is hidden until you press End again"]
        answer_index: 1
        explain: "End snaps the selected actor straight down onto the floor or object under it. It is a quick way to put things on the ground."
    flavors:
      _default: {why: "Placing things precisely matters for every discipline."}
      level_design: {why: "Snapping is how blockouts stay clean enough to iterate on."}
      programming: {why: "The Details panel shows every exposed property. Later your own UPROPERTYs will show up here."}

  - id: SQ6
    rank: 0
    difficulty: novice
    specializations: [all]
    subjects: [graybox, scale]
    required_spine: true
    required: true
    title: Graybox a room
    brief: "A graybox is a level built from simple shapes with no art, so that you can test its size and layout early. In Unreal, one unit is one centimeter, and spaces must be sized to fit the character, not guessed. In this quest you build one small room with a doorway and a window, and then walk through it to feel whether the size is right."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-01-project-setup-and-level-blockout-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 blockout room player scale modeling mode"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/player-start-actor-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/modeling-mode-quick-start-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Create a new level named L_Room_01. Build a floor, 4 walls, 1 doorway and 1 window, using cubes or the tools in Modeling Mode."
      - "Size the doorway to fit the mannequin instead of guessing. For the default character, about 120 to 150 cm wide and 220 cm or more tall works well."
      - "Place a Player Start actor, which is the point where the player appears. Rotate it so that its blue arrow points into the room."
      - "Play in the editor (PIE) and walk through the door. Check that the ceiling does not feel too low above the character."
      - "Take a screenshot from the eye level of the character."
    done_when: "Send an eye-level screenshot of L_Room_01 in which the Player Start is visible, either in the Outliner or in the viewport."
    xp: 80
    verify_type: screenshot
    quiz:
      - q: "Unreal measures distance in units. By default, how long is one unit?"
        choices: ["1 unit is 1 millimeter", "1 unit is 1 centimeter", "1 unit is 1 meter", "1 unit is 1 foot"]
        answer_index: 1
        explain: "One unit is one centimeter, so 100 units is one meter. A door that is 200 units tall is 2 meters tall."
      - q: "Why should you build a room to the size of the player before you do anything else?"
        choices: ["Because Epic requires a room of that size before a project can be saved or packaged", "Because a room that looks right from far away can feel wrong when you stand inside it", "Because it saves memory when the level is loaded on a slow machine", "Because lighting needs it before Lumen can work out the bounces"]
        answer_index: 1
        explain: "Size is hard to judge from the editor camera. Always check a space from the player's eye height, because that is how it will be seen in the game."
      - q: "What does a Player Start actor do in your level?"
        choices: ["It lights the scene around the place where the player stands at the start", "It marks the place where the player appears when the game starts", "It starts the music at the moment the level begins", "It loads the next level when the player walks into it at the end"]
        answer_index: 1
        explain: "When you press Play, the game creates the player's character at a Player Start. Without one, the player can appear in an unexpected place."
      - q: "You test your room and the character does not fit through the door frame. What is the right fix?"
        choices: ["Make the character smaller, until it fits through every door you built", "Make the door wider, using the sizes you measured from the character", "Turn off collision on the door frame, so the character can walk through the mesh", "Add a light above the door, so that it looks wider"]
        answer_index: 1
        explain: "The character's size is the starting point, and the level is built to fit it. Measure the character, then size doors and corridors from those numbers."
      - q: "What does the word graybox mean in level design?"
        choices: ["The final art of a level, with all of its textures and props, shown in a gray preview light", "Plain placeholder shapes used to test the space and how the player moves through it", "A material that is gray and is put on every finished mesh to check the lighting of the level", "Lighting that is broken, so every surface of the level shows up in one flat gray tone"]
        answer_index: 1
        explain: "A graybox is the level built from simple shapes with no art. It lets you test size and flow before anyone spends time on art."
    flavors:
      _default: {why: "Everyone should know what a correctly sized space feels like."}
      level_design: {why: "This is your core skill. Rank 1 turns this room into a courtyard."}
      programming: {why: "A test room you can debug in. You'll want one for every system."}
      lookdev: {why: "Scale mistakes show up in every render. Get scale right before you light."}
      animation: {why: "Animations look wrong in a badly scaled room."}

  - id: SQ7
    rank: 0
    difficulty: novice
    specializations: [all]
    subjects: [lighting]
    required_spine: true
    required: true
    title: One readable lighting pass
    brief: "Work that is too dark or flat is hard for anyone to review, so everyone should be able to do a basic lighting pass. The goal is not beauty yet: the goal is that a player can see the space and where to go. In this quest you add a sun, sky light and fog to a small room with one tool, and then add one more light to make the doorway stand out."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/lighting-the-environment-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 lumen basic lighting directional sky light beginner"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/environment-light-mixer-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/lumen-global-illumination-and-reflections-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Create a new level with File, New Level, Empty Level. Build a simple room from cubes: a floor, four walls, and a gap in one wall for a doorway and in another for a window. If you already have an unlit room level of your own, you can use that instead."
      - "Save a camera bookmark with Ctrl+1 and take a screenshot of the room before you add any lights."
      - "Open the Window menu and choose Env. Light Mixer. Use it to add a Directional Light (the sun), a Sky Light, a Sky Atmosphere and Height Fog."
      - "Rotate the Directional Light until the sunlight comes in through the window."
      - "Add one Point Light or Rect Light near the doorway so that the doorway stands out."
      - "Check your result against the goal: the player can see where to go. It does not need to look pretty. Press 1 to return to the bookmark and take the second screenshot."
    done_when: "Send one screenshot from before and one from after your lighting pass, both taken from the same camera bookmark."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which tool lets you add the usual outdoor lights (sun, sky, fog and clouds) from one window?"
        choices: ["The Env. Light Mixer", "The Content Drawer", "World Partition", "Sequencer"]
        answer_index: 0
        explain: "The Env. Light Mixer (Environment Light Mixer) creates the Directional Light, Sky Light, atmosphere, fog and clouds, and lets you adjust them all in one place."
      - q: "What is Lumen in Unreal Engine 5?"
        choices: ["A plugin you have to buy from the store before you can use lights that move or change while the game is running", "UE5's system for light that bounces off surfaces, and for reflections, worked out while the game runs", "A type of light actor that you place in the level, in the same way as you would place a Point Light or a Spot Light", "A filter that is added after the image is drawn, to make the colors of the picture look warmer or cooler"]
        answer_index: 1
        explain: "Lumen is UE5's dynamic global illumination: light bounces off surfaces and lights other things, and it updates live. You do not have to bake the lighting first."
      - q: "What is the goal of the lighting pass in this quest?"
        choices: ["A picture that is good enough to show in a portfolio", "The player can understand the space and find the exit", "The most realistic lighting possible for the room", "Showing off the fog"]
        answer_index: 1
        explain: "The goal is a readable space: the player can see where they are and where to go. Making it pretty comes later."
      - q: "Which light actor do you use for the sun?"
        choices: ["A Movable Point Light", "A Directional Light", "A Spot Light", "A Sky Light"]
        answer_index: 1
        explain: "A Directional Light shines in one direction across the whole level with parallel rays, the way sunlight does."
      - q: "What does a Sky Light do in a scene?"
        choices: ["It draws the disk of the sun in the sky and moves it during the day", "It captures the sky and lights the scene softly from all around", "It adds fog to the level, which gets thicker the lower you go in the scene", "It makes clouds in the sky that move over the level while the game runs"]
        answer_index: 1
        explain: "A Sky Light adds soft fill light in the color of the sky. It is why areas in shadow are not completely black."
    flavors:
      _default: {why: "Poorly lit work is hard to review. Anyone should be able to do a basic lighting pass."}
      level_design: {why: "Light is how you tell players where to go."}
      programming: {why: "Readable is enough. You owe one more pass at Rank 2, on your own loop, and that's it."}
      lookdev: {why: "Warm-up. The good lighting work starts at Rank 1."}

  - id: SQ8
    rank: 0
    difficulty: novice
    specializations: [all]
    subjects: [materials]
    required_spine: true
    required: true
    title: One material instance
    brief: "A material decides how a surface looks, for example its color and how shiny it is. A Material Instance is a light copy of a material in which you can only change the values the original left open, which are called parameters. It is the normal way to recolor things in Unreal because the change shows at once. In this quest you make one instance, change one value in it, and put it on a wall."
    time_min: 30
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/instanced-materials-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 material instance beginner change color parameter"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/artist-03-create-materials-and-material-instances"
    checklist:
      - "Open a project made from the Third Person template, or create one. Find a material that has parameters. The template has one: M_PrototypeGrid in the folder LevelPrototyping/Materials."
      - "Right-click the material, choose Create Material Instance, and name the new asset MI_Wall_Accent."
      - "Open the instance and change one parameter in it, such as a color or the roughness."
      - "Apply the instance to one wall in your level, for example by dragging it onto the wall. If your level has no wall, place a cube from the Place Actors panel, scale it into a wall, and use that."
    done_when: "Send a screenshot that shows the instance editor with the changed parameter, next to the wall that uses it."
    xp: 50
    verify_type: screenshot
    quiz:
      - q: "A Material Instance is a copy of a material where you can change some values. Why do you edit an instance and not the parent material itself?"
        choices: ["Because instances look better than the parent material, as they are drawn with a higher quality level by the engine", "Because changes to an instance are instant, and they do not affect other things that use the parent", "Because a parent material cannot be put on a mesh at all; only its instances can be used in a level", "There is no reason; an instance and its parent are the same asset, shown with two names in the Content Browser of the editor"]
        answer_index: 1
        explain: "Changing a parent material makes the engine rebuild its shader, and the change shows up everywhere the material is used. An instance changes at once, and only where that instance is used."
      - q: "What are you able to change in a Material Instance?"
        choices: ["Any node in the graph of the parent material, one by one", "Only the parameters that the parent material exposes", "The shading model, always, whatever the parent material allows", "Nothing at all; an instance is a copy that cannot be edited"]
        answer_index: 1
        explain: "The parent material decides which values are open to change. These open values are called parameters, and they are the only things an instance can edit."
      - q: "Which name prefix do you put on a Material Instance?"
        choices: ["M_", "MI_", "T_", "SM_"]
        answer_index: 1
        explain: "MI_ means Material Instance. M_ is the parent material, T_ is a texture and SM_ is a Static Mesh."
      - q: "Which of these does this quest NOT ask you to do?"
        choices: ["Apply a Material Instance to a mesh", "Change a parameter of the Material Instance", "Build a master material from nothing", "Name the instance in the correct way"]
        answer_index: 2
        explain: "You only make and edit an instance here. Building a master material is a bigger job that comes later, mostly in the art specializations."
      - q: "How do you put a material on a mesh that is in your level?"
        choices: ["Drag it onto the mesh, or set it in the Details panel under Materials", "Rename the mesh so that it has the name of the material", "Recompile the project and pick the material in the Project Settings", "Restart the editor, which assigns new materials on load"]
        answer_index: 0
        explain: "Both ways work. Dragging is quick, and the Materials section of the Details panel lets you choose the exact material slot."
    flavors:
      _default: {why: "Material instances are how everyone recolors things in Unreal."}
      level_design: {why: "Color-code interactables so players know what they can use."}
      lookdev: {why: "The small version of what you'll do later with your own master materials."}
      programming: {why: "Later your code will set these parameters at runtime."}

  - id: SQ9
    rank: 0
    difficulty: novice
    specializations: [all]
    subjects: [blueprint, interaction]
    required_spine: true
    required: true
    title: One Blueprint interact
    brief: "A Blueprint is Unreal's visual way to add behavior: you connect boxes called nodes instead of writing code. An overlap is the moment when one object starts touching another, and it is the most common way to make the world react to the player. In this quest you build one small interactive object, either a pickup or a door, that reacts when the player touches it."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/module-3-create-a-coin-pickup-with-modeling-tools-and-blueprints"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 blueprint door open overlap beginner"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/opening-doors-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-class-assets-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Choose ONE of these two: a pickup that prints a message and disappears, or a door that opens when the player overlaps it."
      - "Create a Blueprint of type Actor and name it BP_Pickup or BP_Door. Add a mesh to it, and add a Box Collision or Sphere Collision that will detect the player."
      - "In the graph, add the event On Component Begin Overlap for the collision and connect it to a Print String node. After that, add Destroy Actor for the pickup, or move the door."
      - "Place your Blueprint in the level and trigger it while you play in the editor (PIE)."
    done_when: "Send a short video clip (30 seconds or less) recorded in PIE, or 2 screenshots (one before and one after the interaction). Also send a screenshot of the Blueprint graph."
    xp: 80
    verify_type: screenshot
    quiz:
      - q: "In a Blueprint, which event runs when the player walks into a collision box?"
        choices: ["Event Tick, on every frame", "On Component Begin Overlap", "Event BeginPlay of the box", "On Actor Begin Cursor Over"]
        answer_index: 1
        explain: "On Component Begin Overlap runs at the moment something starts touching the box. The box's collision must be set to overlap for this to happen."
      - q: "You made a Blueprint actor named BP_Door. How do you get it into your level?"
        choices: ["Drag it from the Content Drawer into the viewport", "It appears in the level by itself when you save it", "Add it in World Settings, under the GameMode section", "Add it in Project Settings, under Maps and Modes, as a default"]
        answer_index: 0
        explain: "A Blueprint Class is a template. Dragging it into the viewport places one copy of it in the level, and that copy is called an instance."
      - q: "What is the Print String node used for?"
        choices: ["The user interface of a finished, shipped game", "Quick debug messages on screen and in the log", "Saving files of the player to the disk", "Player chat between two people in a game"]
        answer_index: 1
        explain: "Print String writes a short message on screen. It is the fastest way to check that an event really ran."
      - q: "You walk into your collision box and the overlap event never runs. What should you check first?"
        choices: ["Reinstall the engine and create the project again from the template", "The box's Generate Overlap Events option and its collision preset", "The material of the box, which must not be translucent for overlaps to work", "The lighting of the room, which has to be built first"]
        answer_index: 1
        explain: "Most overlap problems are collision settings. The box needs Generate Overlap Events turned on, and a collision preset that overlaps the player."
      - q: "When does Event BeginPlay run?"
        choices: ["Every frame", "Once, when the actor starts playing", "When something overlaps the actor", "It never runs in Play In Editor"]
        answer_index: 1
        explain: "BeginPlay runs one time when the actor enters the game, so it is the place for setup. Event Tick is the one that runs every frame."
    flavors:
      _default: {why: "At least once, make the world react to the player."}
      level_design: {why: "Doors and pickups are how you gate a level. You'll build many."}
      programming: {why: "Learn the Blueprint version first. Later you'll decide what moves to C++."}
      lookdev: {why: "Enough Blueprint to make a light turn on when you walk in."}
      animation: {why: "Later, this overlap will trigger a montage."}

  - id: SQ10
    rank: 0
    difficulty: novice
    specializations: [all]
    subjects: [pawn, character]
    required_spine: true
    required: true
    title: Walk your space
    brief: "A room can look right from the editor camera and still feel wrong when you walk through it as the player. The GameMode is the asset that holds the rules of the game, including which character the player controls, and each level can choose its own. In this quest you make sure a room uses the Third Person character, walk through it, and fix one thing that feels wrong."
    time_min: 30
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-a-game-mode-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 game mode default pawn class mannequin"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/third-person-template-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-settings-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a room level that you built yourself, or build a small one now in a new level: a floor, four walls, a doorway and a Player Start."
      - "Open World Settings and set GameMode Override to the Third Person GameMode of the template (its name starts with BP_ThirdPerson)."
      - "Play in the editor (PIE). Walk, jump, and bump into every wall."
      - "Drag a mannequin mesh from the Content Browser into the room. Leave it standing there as a fixed reference for size."
      - "Note one thing that feels wrong, such as a tight corner or a ledge that is too high, and fix it."
    done_when: "Send a short text that says what you fixed, and a screenshot of the mannequin standing in the space."
    xp: 50
    verify_type: writeup
    quiz:
      - q: "A pawn is the thing the player controls. Where do you set which pawn appears when the level starts?"
        choices: ["In the Material editor, under Details, in the Usage section of the material you applied", "In the GameMode's Default Pawn Class, or through GameMode Override in World Settings", "In the Content Drawer, with a right-click on the pawn asset and the option Set As Default Pawn for the level", "In an Outliner folder that is named Player, into which you drag the pawn that you want to use"]
        answer_index: 1
        explain: "The GameMode holds the rules of the game, including which pawn the player gets. World Settings can choose a different GameMode for one level."
      - q: "Why is it useful to keep a mannequin that does not move standing in your level while you build?"
        choices: ["For fun, as a small joke in the level", "It is a size reference you can always see while you build", "You cannot save the level without at least one mannequin", "It lights the scene for you while you place the walls"]
        answer_index: 1
        explain: "With a human-sized figure in view, you can judge the size of doors and rooms without pressing Play every time."
      - q: "Unreal has a Pawn class and a Character class. What is the difference?"
        choices: ["They are the same thing with two names in the editor", "A Character is a Pawn that already has a capsule, a mesh and walking movement", "Pawn is the newer one, and Character is kept for old projects", "A Character cannot be controlled by a player, only by an AI or by a cutscene"]
        answer_index: 1
        explain: "Character is a ready-made kind of Pawn. It gives you walking, jumping and falling without building them yourself."
      - q: "You press Play and you are a camera floating in the air, not your character. What is the most likely cause?"
        choices: ["Lumen is turned off in the Project Settings of the project", "The GameMode's default pawn is not your character", "The material is wrong on the mesh of your character", "There are too many lights in the level you opened"]
        answer_index: 1
        explain: "The game spawned its default pawn, not yours. Check GameMode Override in World Settings, and the Default Pawn Class of that GameMode."
      - q: "What do you have to do for this quest to count as done?"
        choices: ["Make a pretty render of the room from three camera angles", "Walk through your space and fix one thing that felt wrong", "Write a C++ class for the character", "Make a packaged build of the level and send the file"]
        answer_index: 1
        explain: "Test, notice a problem, fix it. This loop is how every level gets better, and this quest is your first time through it."
    flavors:
      _default: {why: "Walk your space in-game. The editor view isn't enough."}
      level_design: {why: "You'll repeat this walk test on everything you build."}
      animation: {why: "The mannequin is your character's baseline. Know how it moves."}
      programming: {why: "GameMode → Pawn → Controller is the chain you'll be coding against later."}

  - id: SQ11
    rank: 0
    difficulty: novice
    specializations: [all]
    subjects: [cpp, awareness]
    required_spine: true
    required: true
    title: What C++ is for
    brief: "Unreal gives you two ways to build game logic: Blueprint, where you connect nodes, and C++, a programming language you type. Each one is better for some jobs, and most games use both. In this quest you only read about the difference, so that you know what C++ is for even if you never write it."
    time_min: 15
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/coding-in-unreal-engine-blueprint-vs-cplusplus"
    backup_url: TODO_URL
    backup_search: "unreal engine blueprint vs c++ when to use which"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/programming-with-cplusplus-in-unreal-engine"
    checklist:
      - "Read the Blueprint vs C++ page. You do not need an IDE, which is a program for writing code."
      - "Write 3 lines: one thing that is better done in Blueprint, one thing that is better done in C++, and one thing you are not sure about."
    done_when: "Send your 3 lines."
    xp: 40
    verify_type: writeup
    quiz:
      - q: "Do you have to install Visual Studio to finish this quest?"
        choices: ["Yes, before you start", "No, this quest is only reading", "Only on Windows 11", "Only if you are a programmer"]
        answer_index: 1
        explain: "This quest only asks you to read and understand. Visual Studio, the program used to write C++, is installed later in the Programming path."
      - q: "Which of these is a normal reason to write something in C++ and not in Blueprint?"
        choices: ["C++ is always better than Blueprint, so every part of a game should be written in it", "It needs a lot of performance, or it is a core system that many Blueprints build on", "To change colors of a few props, which is hard to do in a Blueprint graph or in the Details panel", "To set up lighting for a level, which can only be done in code and not in the editor"]
        answer_index: 1
        explain: "Heavy work and core systems go in C++. Content, and values you want to adjust quickly, stay in Blueprint."
      - q: "Can a Blueprint be built on top of a class that was written in C++?"
        choices: ["No, C++ classes and Blueprints cannot be mixed in a project", "Yes. A common setup is a C++ base class with Blueprint children", "Only in Unreal Engine 4, which had another kind of Blueprint", "Only with plugins that you buy and install for each of your projects"]
        answer_index: 1
        explain: "Yes, and it is very common: programmers write the base in C++, and designers make Blueprint versions of it. It is also a capstone later in the Programming path."
      - q: "Why do designers like to work in Blueprint?"
        choices: ["It is the only option, because the editor cannot open or compile C++ files on most computers", "They can try changes quickly and see the logic as a graph, without compiling C++", "It runs faster in the game than C++ does, so their levels have a higher frame rate", "Lighting requires it, because lights can only be changed by a Blueprint graph during the game"]
        answer_index: 1
        explain: "In Blueprint you change something and test it right away. That speed of trying things is the reason Blueprint exists."
      - q: "You chose Level Design as your specialization. After this quest, how much C++ do you still have to do?"
        choices: ["You have to rewrite all of your Blueprint work in C++ in the quests after this", "One small taster (a C++ hello or a GAS video), and nothing is locked behind it", "Nothing, ever, in any later quest", "A networking capstone in C++ with a dedicated server and two clients, which everyone has to finish"]
        answer_index: 1
        explain: "Level designers only do one short taster from the other side. They never have to rewrite their work in C++."
    flavors:
      _default: {why: "Know what C++ does even if you never write it."}
      level_design: {why: "So you can talk to programmers. That's all this is."}
      programming: {why: "Your first look at the split you'll spend Ranks 3–4 learning to make well."}

