    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/taking-screenshots-in-unreal-engine"
    checklist:
      - text: "Here is a bad help post: \"my door doesnt work pls help\". Rewrite it as a good help post. Imagine the details: you made a door Blueprint that should open when the player walks up to it. Your post must say what you want to happen, what happens instead, what you already tried, and which engine version you use. Paste your rewritten post as your proof."
        check: {min_length: 150}
    done_when: "Send your rewritten post as text."
    xp: 20
    verify_type: writeup
    quiz:
      - q: "Which four parts does a good help post have?"
        choices: ["Your name, your country, your age and the model of your computer and monitor", "A greeting, an apology, a thank you and a deadline", "What you want to happen, what happens instead, what you tried, and your engine version", "The name of the project, the name of the level, the name of the asset and its folder"]
        answer_index: 2
        explain: "These four parts give a helper everything needed to find the cause. Without them the helper must ask questions before any answer is possible."
      - q: "Why is the post \"my door doesnt work pls help\" a bad help post?"
        choices: ["It is written without capital letters and has a spelling mistake in one word", "It does not say what should happen, what happens instead, or what was tried", "It is about a door, which is too simple a topic for a post on the help forum", "It is too short to be shown on the page, which needs at least three full lines"]
        answer_index: 1
        explain: "The post gives no details, so nobody can tell what the problem is. An unclear question often gets no answer."
      - q: "Why do you write which engine version you use?"
        choices: ["Because helpers only answer users of the newest version", "Because the version changes the price of the engine", "Because the site sorts posts by version number", "Because menus and features differ between versions"]
        answer_index: 3
        explain: "The right answer can depend on the version, since tools and menus change. With the version in the post, the helper can give steps that fit your editor."
      - q: "Why do you list what you already tried?"
        choices: ["So helpers do not suggest things you have already done", "So the post becomes long enough to be accepted by the forum", "So helpers can see how many hours you worked", "So the post is moved to the top of the list"]
        answer_index: 0
        explain: "What you tried rules out some causes and saves time for everyone. The helper can go straight to ideas that are new to you."
      - q: "Which sentence is the best start for the rewritten door post?"
        choices: ["My door is broken and I need help fast, because I want to finish my level today.", "Doors in Unreal Engine never work for me.", "I want my door Blueprint to open when the player walks up to it, but it stays closed.", "Can someone send me a door Blueprint that works, so that I can copy it into my level?"]
        answer_index: 2
        explain: "This sentence says what you want to happen and what happens instead. Those are the first two parts of a good help post."

  - id: SQ16
    needs_others: true          # hidden and not required until the server has enough members
    rank: 0
    difficulty: novice
    specializations: [all]
    subjects: [meta, review]
    required: false
    title: Review a peer like a mentor
    brief: "Giving useful feedback is a skill, and practicing it also teaches you to look at your own work more clearly. Good feedback is specific: it says what works, what the problem is, and what to do next. In this quest you write that kind of feedback on a piece of work that someone else made."
    time_min: 20
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-editor-interface"
    checklist:
      - text: "Pick a piece of work that someone else made in Unreal Engine: a level, a screenshot or a clip that another learner has shown you. If you have none at hand, open a project made from the Third Person template and review its sample level as if another learner had built it. Write a review that names 1 thing that works, 1 specific issue, and 1 next step. Say in one line what you reviewed, and paste the text of your review."
        check: {min_length: 120}
    done_when: "Send the text of your review on this page: what you reviewed, 1 thing that works, 1 specific issue, and 1 next step."
    xp: 25
    verify_type: writeup
    quiz:
      - q: "Which three things does a good review name?"
        choices: ["Three problems, sorted from large to small", "A score, a rank and a final grade", "The tools, the time and the cost of the work, in that order", "One thing that works, one specific issue and one next step"]
        answer_index: 3
        explain: "Good feedback says what works, what the problem is, and what to do next. The person then knows what to keep and what to change."
      - q: "Which of these is specific feedback?"
        choices: ["The level feels a bit off, and I am not sure why that is.", "The exit door is hard to see because it has the same colour as the wall.", "The lighting could be better in some places, and maybe the colors too.", "Nice work, keep going like this, I really like the mood."]
        answer_index: 1
        explain: "Specific feedback names the exact thing and the reason. The other sentences do not tell the person what to look at or what to change."
      - q: "How does reviewing the work of other people help you?"
        choices: ["It teaches you to look at your own work more clearly", "It lets you copy their project files", "It removes the need to send in any work of your own", "It makes your own screenshots sharper"]
        answer_index: 0
        explain: "Giving feedback is a skill you can practice. When you learn to see what works and what does not in other work, you see the same things in your own."
      - q: "You have no work from another learner at hand. What can you review instead?"
        choices: ["Your own player card on the site, with its motto", "A page of the Epic documentation about level design", "The sample level of a project made from the Third Person template", "A level from a game that you bought and played to the end last year"]
        answer_index: 2
        explain: "You open a project made from the Third Person template and review its sample level as if another learner had built it."
      - q: "Why does a review end with a next step?"
        choices: ["So the review reaches the minimum length for a post", "So the person knows what to do after reading it", "So the reviewer can show more knowledge", "So the person must send the work again"]
        answer_index: 1
        explain: "Naming a problem is only half of the help. A next step turns the feedback into something the person can act on."

  - id: SQ17
    needs_others: true          # hidden and not required until the server has enough members
    rank: 0
    difficulty: novice
    specializations: [all]
    subjects: [meta, critique]
    required: false
    title: Take critique without flinching
    brief: "Showing unfinished work and hearing what is wrong with it is how you get better quickly. It is easier when you ask one specific question, because then people know what kind of feedback you want. In this quest you show a work in progress (WIP) to another person, and then answer the feedback you receive."
    time_min: 20
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/taking-screenshots-in-unreal-engine"
    checklist:
      - "Show a work in progress (WIP) to at least one other person, for example another learner or a friend, and ask one specific question about it. Any small piece of Unreal Engine work of your own is fine, such as a room made of cubes."
      - text: "Write down the feedback you got. Then write your reply to it: say what you will change, or why you will not change it. Paste your question, the feedback and your reply as your proof."
        check: {min_length: 120}
    done_when: "Send three things as text on this page: the question you asked, the feedback you got, and your reply to it."
    xp: 25
    verify_type: writeup
    quiz:
      - q: "What does WIP mean?"
        choices: ["Work in progress", "World in preview", "Window in panel", "Work is perfect"]
        answer_index: 0
        explain: "WIP means work in progress, which is work that is not finished yet. Showing it early lets you fix problems while they are still small."
      - q: "Why do you ask one specific question when you show your work?"
        choices: ["So people answer with only yes or no", "So people cannot say anything negative", "So people know what kind of feedback you want", "So people do not look at the rest of the work"]
        answer_index: 2
        explain: "A specific question points people at the part you are unsure about. The feedback you get is then easier to use."
      - q: "Why is it useful to show work that is not finished?"
        choices: ["Unfinished work cannot be criticised by others", "Finished work may not be shown to other people on the site", "Other people will finish the work for you", "Hearing what is wrong with it is how you get better quickly"]
        answer_index: 3
        explain: "Early critique shows problems before you have spent many hours on them. That is the fastest way to improve."
      - q: "What must your reply to the feedback say?"
        choices: ["That the feedback was wrong in every point", "What you will change, or why you will not change it", "That you will start the whole work again from zero", "How long you worked on the piece in total"]
        answer_index: 1
        explain: "A good reply shows that you thought about the feedback. You either say what you will change, or give your reason for keeping it as it is."
      - q: "Which three things do you send as proof?"
        choices: ["A screenshot, a clip and a project file of the work that you showed", "The question you asked, the feedback you got and your reply", "Your name, your motto and the specialization that you chose", "Three different works in progress, each with a short text of its own"]
        answer_index: 1
        explain: "You send the question, the feedback and your reply as text. Together they show the whole exchange."

  - id: SQ12
    rank: 0
    difficulty: novice
    specializations: [all]
    subjects: [editor, shortcuts]
    required: false
    title: Five shortcuts that save an hour a week
    brief: "Keyboard shortcuts let you do common actions without looking for a button, and a few of them save a lot of time every week. In this quest you learn five shortcuts for the level editor and decide which one will help you the most."
    time_min: 15
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/customizing-keyboard-shortcuts-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Try each of these shortcuts in the editor: G switches game view on and off, Ctrl+B finds the selected asset in the Content Browser, Alt+drag makes a copy of an actor, H hides the selected actor and Ctrl+H shows hidden actors again, and F11 makes the viewport fullscreen."
      - text: "Write which one of them you will use the most, and when you will use it."
        check: {min_length: 60}
    done_when: "Send a short text that says which shortcut you will use most and when."
    xp: 15
    verify_type: writeup
    quiz:
      - q: "In the level editor, what does the G key do?"
        choices: ["It groups the selected actors", "It turns the grid snapping off", "It switches game view on and off", "It starts Play in Editor"]
        answer_index: 2
        explain: "G switches game view on and off. Game view shows the level the way it looks in the game, without the editor icons."
      - q: "You selected an actor in the level and want to find its asset in the Content Browser. Which shortcut do you press?"
        choices: ["Ctrl+B", "Ctrl+H", "F11", "Alt+B"]
        answer_index: 0
        explain: "Ctrl+B finds the selected asset in the Content Browser. It saves you from searching through folders by hand."
      - q: "What happens when you hold Alt and drag an actor in the viewport?"
        choices: ["The actor is hidden", "The actor snaps to the floor", "The camera orbits around the actor", "A copy of the actor is made"]
        answer_index: 3
        explain: "Alt+drag makes a copy of the actor and moves the copy. It is a quick way to repeat walls, props and lights."
      - q: "You pressed H and the selected actor is no longer visible. How do you show hidden actors again?"
        choices: ["Press G", "Press Ctrl+H", "Press F11", "Press Ctrl+B"]
        answer_index: 1
        explain: "H hides the selected actor, and Ctrl+H shows hidden actors again. The actor was not deleted, only hidden in the editor."
      - q: "Which key makes the viewport fullscreen?"
        choices: ["F11", "F8", "G", "H"]
        answer_index: 0
        explain: "F11 makes the viewport fullscreen, and pressing it again brings the other panels back."
