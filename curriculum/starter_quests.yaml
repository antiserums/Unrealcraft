    verify_type: writeup
    quiz:
      - q: "Do you have to install Visual Studio to finish this quest?"
        choices: ["Yes", "No, this quest is only reading", "Only on Windows", "Only if you are a programmer"]
        answer_index: 1
        explain: "This quest only asks you to read and understand. Visual Studio, the program used to write C++, is installed later in the Programming path."
      - q: "Which of these is a normal reason to write something in C++ and not in Blueprint?"
        choices: ["C++ is always better", "It needs a lot of performance, or it is a core system that many Blueprints build on", "To change colors", "To set up lighting"]
        answer_index: 1
        explain: "Heavy work and core systems go in C++. Content, and values you want to adjust quickly, stay in Blueprint."
      - q: "Can a Blueprint be built on top of a class that was written in C++?"
        choices: ["No", "Yes. A common setup is a C++ base class with Blueprint children", "Only in Unreal Engine 4", "Only with plugins"]
        answer_index: 1
        explain: "Yes, and it is very common: programmers write the base in C++, and designers make Blueprint versions of it. It is also the Rank 3 capstone of the Programming path."
      - q: "Why do designers like to work in Blueprint?"
        choices: ["It is the only option", "They can try changes quickly and see the logic as a graph, without compiling C++", "It runs faster in the game", "Lighting requires it"]
        answer_index: 1
        explain: "In Blueprint you change something and test it right away. That speed of trying things is the reason Blueprint exists."
      - q: "You chose Level Design as your specialization. After this quest, how much C++ do you still have to do?"
        choices: ["Rewrite your work in C++ at Rank 4", "One small taster (a C++ hello or a GAS video), and nothing is locked behind it", "Nothing, ever", "A networking capstone"]
        answer_index: 1
        explain: "Level designers only do one short taster from the other side. They never have to rewrite their work in C++."
    flavors:
      _default: {why: "Know what C++ does even if you never write it."}
