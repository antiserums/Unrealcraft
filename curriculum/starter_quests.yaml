    quiz:
      - q: "A pawn is the thing the player controls. Where do you set which pawn appears when the level starts?"
        choices: ["In the Material editor", "In the GameMode's Default Pawn Class, or through GameMode Override in World Settings", "In the Content Drawer", "In an Outliner folder"]
        answer_index: 1
        explain: "The GameMode holds the rules of the game, including which pawn the player gets. World Settings can choose a different GameMode for one level."
      - q: "Why is it useful to keep a mannequin that does not move standing in your level while you build?"
        choices: ["For fun", "It is a size reference you can always see while you build", "You cannot save without it", "It lights the scene"]
        answer_index: 1
        explain: "With a human-sized figure in view, you can judge the size of doors and rooms without pressing Play every time."
      - q: "Unreal has a Pawn class and a Character class. What is the difference?"
        choices: ["They are the same thing", "A Character is a Pawn that already has a capsule, a mesh and walking movement", "Pawn is the newer one", "A Character cannot be controlled by a player"]
        answer_index: 1
        explain: "Character is a ready-made kind of Pawn. It gives you walking, jumping and falling without building them yourself."
      - q: "You press Play and you are a camera floating in the air, not your character. What is the most likely cause?"
        choices: ["Lumen is turned off", "The GameMode's default pawn is not your character", "The material is wrong", "There are too many lights"]
        answer_index: 1
        explain: "The game spawned its default pawn, not yours. Check GameMode Override in World Settings, and the Default Pawn Class of that GameMode."
      - q: "What do you have to do for this quest to count as done?"
        choices: ["Make a pretty render", "Walk through your space and fix one thing that felt wrong", "Write a C++ class", "Make a packaged build"]
        answer_index: 1
        explain: "Test, notice a problem, fix it. This loop is how every level gets better, and this quest is your first time through it."
