    checklist:
      - "Choose ONE: a pickup that disappears and prints a message, or a door that opens on overlap."
      - "Create BP_Pickup or BP_Door (Actor). Add a mesh plus a Box or Sphere collision."
      - "Use On Component Begin Overlap → Print String, then Destroy Actor or move the door."
