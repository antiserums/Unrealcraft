  - id: PQ9
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [gamemode, gamestate, win-condition]
    required_spine: false
    required: true
    title: A win condition in GameMode and GameState
    brief: "The GameMode is the Blueprint that holds the rules of the game, such as how a player wins. The GameState holds information about the match that everyone needs to know, such as the score. Keeping rules and shared information in these two known places makes a project easier to understand. In this quest you store a count in the GameState and let the GameMode declare a win when the count reaches a target."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/game-mode-and-game-state-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 game mode vs game state win condition blueprint"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create two Blueprints: BP_UUGameMode with Game Mode Base as the parent class, and BP_UUGameState with Game State Base as the parent class. In the Class Defaults of BP_UUGameMode, set Game State Class to BP_UUGameState, and set Default Pawn Class to the character of the template so that you can still walk around. In the World Settings of a test level, set GameMode Override to BP_UUGameMode, so the level uses them when it runs."
      - "In BP_UUGameState, add an Integer variable named Collected that stores a score or a count of collected items. Add a function named AddPoint that adds 1 to it."
      - "In BP_UUGameMode, add an Integer variable named Target with the value 3, and a Custom Event named CheckWin. In CheckWin, use Get Game State, cast it to BP_UUGameState and read Collected. When the count reaches Target, the GameMode declares a win. To test it, make a simple pickup: an Actor Blueprint with a sphere mesh and a Sphere Collision that, when the player overlaps it, calls AddPoint and then CheckWin and destroys itself. Place three of them in the level."
      - "Print or log the win message one time only. Put a Do Once node in front of the Print String, or use a Boolean variable named HasWon. The message must not appear again on every frame."
      - "Write 2 lines that say why the score is stored in the GameState and not in the GameMode."
    done_when: "Send a short video clip (30 seconds or less), or two screenshots from PIE, that show the win happening, and add your 2 lines."
    xp: 100
    verify_type: screenshot
    quiz: []  # TODO Phase 4
    flavors:
      _default: {why: "Rules and shared state belong in known places.", do: "Put the rule in GameMode and the state in GameState."}
      programming: {why: "This split matters even more once networking arrives.", do: "Keep the state readable from anywhere."}

  - id: PQ10
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [enhanced-input, input]
    required_spine: false
    required: true
    title: One Enhanced Input action
    brief: "Enhanced Input is the system that Unreal Engine 5 uses to read what the player does on the keyboard, mouse or gamepad. An Input Action is an asset that stands for one thing the player can do, such as interact. An Input Mapping Context is an asset that says which keys start which actions. In this quest you create one action, map it to a key, and react to it on the character."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/enhanced-input-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 enhanced input action mapping context blueprint"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/module-2-create-a-flashlight-with-enhanced-input"
    checklist:
      - "Open a project made from the Third Person template, or create one. The template already uses Enhanced Input, so you can look at its Input folder as an example. Create an Input Action asset named IA_Interact. Add it to an Input Mapping Context, either a new one or one that already exists, and give it a key."
      - "On the BeginPlay event, which runs when the game starts, add the mapping context to the player. Without this step the player's keys do nothing."
      - "On the character, handle the Triggered event of IA_Interact. When it fires, write to the log which actor the character is facing."
      - "Add one modifier or one trigger to the mapping, for example Hold, which fires only after the key is held down for a moment. Note what changes in how the action behaves."
    done_when: "Send a screenshot of the input graph, and add the log output that appears when you press the key."
    xp: 80
    verify_type: screenshot
    quiz: []  # TODO Phase 4
    flavors:
      _default: {why: "Enhanced Input is how UE5 handles player input.", do: "Wire one action end to end."}
      programming: {why: "You'll bind these same assets from C++ later.", do: "Keep the asset names clean."}

  - id: PQ11
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [functions, macros, events]
    required_spine: false
    required: true
    title: Functions vs macros vs events
    brief: "Blueprints give you three ways to pack nodes into something you can use again: a function, a macro, and a custom event. They look similar, but they have different rules. For example, they differ in whether they can wait for some time and in whether other Blueprints can call them. In this quest you build the same small behavior in all three ways and compare them, so you can pick the right one later and keep your graphs easy to read."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/events-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine blueprint function vs macro vs custom event differences"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/flow-control-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, and make a new Actor Blueprint for this test. Choose one small behavior, such as printing a message and changing the color of a light, and build it three times in the same Blueprint: once as a function, once as a macro, and once as a custom event."
      - "Try to add a Delay node inside each of the three. A Delay node makes the graph wait for some time. Note where the editor allows it and where it does not."
      - "Try to call each of the three from another Blueprint. Note which ones you can reach from there."
      - "Write a table with 3 rows, one for each of the three. In each row, say when you would pick that one."
    done_when: "Send a screenshot of the graph that shows all three, and add your table with 3 rows."
    xp: 80
    verify_type: writeup
    quiz: []  # TODO Phase 4
    flavors:
      _default: {why: "Picking the right one keeps graphs readable.", do: "Build all three and compare."}
      programming: {why: "Maps directly to C++ functions and delegates later.", do: "Note where latent nodes are allowed."}

  - id: PQ12
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [data, structs, enums, data-assets]
    required_spine: false
    required: true
    title: "Data in Blueprint: structs, enums, Data Assets"
    brief: "Good projects keep data, such as names and numbers, apart from logic, which is the graph that does the work. Then other people can change the values without touching your graphs. Blueprints offer three tools for this: an enum is a fixed list of named choices, a struct is a group of values kept together, and a Data Asset is a file that stores a set of values. In this quest you describe two pickups with these tools and make one pickup Blueprint read its values from a Data Asset."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/data-assets-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 blueprint struct enum primary data asset tutorial"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-variables-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Create an enum named E_PickupType with 3 values. Then create a struct named S_PickupInfo that holds a name, a value, and a type."
      - "Create a Data Asset class: make a new Blueprint Class with Primary Data Asset as its parent, name it DA_PickupBase, and add a variable of type S_PickupInfo to it. Then create 2 Data Asset instances from it (right-click in the Content Browser, open Miscellaneous, choose Data Asset and pick your class), each one describing a different pickup."
      - "Make one pickup Blueprint, an Actor with a mesh and a Sphere Collision, that has an Instance Editable variable of your Data Asset type. When the player overlaps it, it prints the name and the value that it reads from the Data Asset. It must not use hardcoded variables, which are values typed directly into the Blueprint."
      - "Place a pickup in the level and change which Data Asset it uses. Confirm that the pickup behaves differently and that you did not need to edit the graph."
    done_when: "Send a screenshot of two placed pickups that use different Data Assets, and a screenshot of the Data Asset shown in the Details panel."
    xp: 90
    verify_type: screenshot
    quiz: []  # TODO Phase 4
    flavors:
      _default: {why: "Data separate from logic lets others tune without touching graphs.", do: "Drive one actor from a Data Asset."}
      programming: {why: "Designers will tune your systems through data like this.", do: "Keep hardcoded numbers out of the graph."}

  - id: PQ13
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [logging, asserts, debugging]
    required_spine: false
