  - id: PQ29
    rank: 3
    difficulty: expert
    specializations: [programming]
    subjects: [profiling, insights, cpp]
    required_spine: false
    required: false
    title: Profile your own code
    brief: "Before you try to make code faster, you should measure it, because the slow part is often not where you expect. Unreal Insights is the tool that records where the engine spends its time, and a recording is called a trace. A named CPU scope is a mark that you put around a piece of your own code so that it appears under its own name in the trace. In this quest you add one scope and find it in Unreal Insights."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-insights-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal insights trace cpu scope custom c++ code"
    checklist:
      - "Open a C++ project, or create one from the Third Person template with C++ selected. Pick an actor class of your own with a function that runs during play, or add a new actor with Tools, then New C++ Class, and give it a Tick function that does some work, such as a loop that adds numbers. Add a named CPU scope around that function with the macro TRACE_CPUPROFILER_EVENT_SCOPE, so that the time spent in that function is recorded under the name you give it. Place the actor in a level."
      - "Capture a trace while the game runs: click Trace in the bar at the bottom of the editor window, choose Start Trace, play for 10 seconds, and choose Stop Trace. Then open the trace in Unreal Insights and find your scope in the timing view."
    done_when: "Send a screenshot of your named scope in the timing view."
    xp: 70
    verify_type: screenshot
    quiz:
      - q: "Why should you measure code before you try to make it faster?"
        choices: ["Measuring makes the code faster by itself", "The compiler refuses to build code that was not measured", "The slow part is often not where you expect", "Measuring removes the need for testing"]
        answer_index: 2
        explain: "Guessing often leads you to change code that was never the problem. A measurement shows where the time really goes."
      - q: "What is Unreal Insights?"
        choices: ["The tool that records where the engine spends its time", "The window that lists compile errors", "The page that documents the C++ classes of the engine", "The plugin that writes log files"]
        answer_index: 0
        explain: "Unreal Insights is the profiling tool of the engine. It shows the work of each frame on a timeline."
      - q: "What is a trace?"
        choices: ["A line that connects two nodes", "A recording that Unreal Insights can open", "A breakpoint in the IDE", "A warning that is written to the Output Log"]
        answer_index: 1
        explain: "A trace is the recording of what the engine did over a period of time. You capture it while the game runs and study it afterwards."
      - q: "What is a named CPU scope?"
        choices: ["A limit on how much CPU time the game may use", "A list of all functions of a class", "A setting that makes your own code run on another thread of the CPU", "A mark around your own code that gives it its own name in the trace"]
        answer_index: 3
        explain: "The scope measures the time spent in the marked code. In the trace, that time is shown as a block with the name you gave it."
      - q: "Which macro adds a named CPU scope?"
        choices: ["TRACE_CPUPROFILER_EVENT_SCOPE", "DECLARE_LOG_CATEGORY_EXTERN", "UE_LOG", "UFUNCTION"]
        answer_index: 0
        explain: "TRACE_CPUPROFILER_EVENT_SCOPE marks the code that follows it inside the function. The time until the function ends is recorded under the given name."
      - q: "Why is a Tick function with some work in it a good place for your first scope?"
        choices: ["Tick runs only once, so the trace stays small", "Tick cannot be measured in another way", "Tick runs every frame, so the scope appears in the trace again and again", "Tick is the only function that may contain macros like the scope macro"]
        answer_index: 2
        explain: "A function that runs every frame is easy to find in a trace of 10 seconds. The work inside gives the scope a visible length."
      - q: "How do you capture a trace from the editor?"
        choices: ["Open Window, then Output Log, and type trace", "Click Trace at the bottom of the editor, choose Start Trace, play, then Stop Trace", "Press F9 on the actor in the level", "Build the project with the configuration Development Editor and press Play two times"]
        answer_index: 1
        explain: "Start Trace begins the recording and Stop Trace ends it. In between, you play for about 10 seconds so that the trace has frames to show."
      - q: "Where in Unreal Insights do you find your scope?"
        choices: ["In the Content Browser", "In the Details panel", "In the World Settings", "In the timing view"]
        answer_index: 3
        explain: "The timing view shows each frame as blocks of work on the threads. Your scope is one of these blocks, with the name you gave it."
      - q: "You open the trace, but your named scope is nowhere to be found. What do you check first?"
        choices: ["That the actor was placed in the level, so its function ran during the trace", "That the name of the scope is written in capital letters and has no spaces in it", "That the level has a Directional Light", "That the Output Log was open during play"]
        answer_index: 0
        explain: "A scope is only recorded when its code runs. If the actor is not in the level, its function is never called and nothing is recorded."
      - q: "Why should you give your scopes clear names?"
        choices: ["Short names make the code run faster", "Unnamed scopes stop the build", "So that you and other people can find them in a trace", "So that the scope is saved in the Blueprint of the actor"]
        answer_index: 2
        explain: "A trace has thousands of blocks. A clear name is what lets someone search for your code and understand what the block measures."
    flavors:
      _default: {why: "Measure before optimizing.", do: "Find your own function in a trace."}
      programming: {why: "Groundwork for Rank 5 and 6 perf work.", do: "Name scopes so others can find them."}
