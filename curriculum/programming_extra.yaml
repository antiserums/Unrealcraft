    title: A win condition in GameMode and GameState
    brief: "The GameMode is the Blueprint that holds the rules of the game, such as how a player wins. The GameState holds information about the match that everyone needs to know, such as the score. Keeping rules and shared information in these two known places makes a project easier to understand. In this quest you store a count in the GameState and let the GameMode declare a win when the count reaches a target."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/game-mode-and-game-state-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 game mode vs game state win condition blueprint"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create two Blueprints: BP_UUGameMode with Game Mode Base as the parent class, and BP_UUGameState with Game State Base as the parent class. In the Class Defaults of BP_UUGameMode, set Game State Class to BP_UUGameState, and set Default Pawn Class to the character of the template so that you can still walk around. In the World Settings of a test level, set GameMode Override to BP_UUGameMode, so the level uses them when it runs."
      - "In BP_UUGameState, add an Integer variable named Collected that stores a score or a count of collected items. Add a function named AddPoint that adds 1 to it."
      - "In BP_UUGameMode, add an Integer variable named Target with the value 3, and a Custom Event named CheckWin. In CheckWin, use Get Game State, cast it to BP_UUGameState and read Collected. When the count reaches Target, the GameMode declares a win. To test it, make a simple pickup: an Actor Blueprint with a sphere mesh and a Sphere Collision that, when the player overlaps it, calls AddPoint and then CheckWin and destroys itself. Place three of them in the level."
      - "Print or log the win message one time only. Put a Do Once node in front of the Print String, or use a Boolean variable named HasWon. The message must not appear again on every frame."
      - "Write 2 lines that say why the score is stored in the GameState and not in the GameMode."
    done_when: "Send a short video clip (30 seconds or less), or two screenshots from PIE, that show the win happening, and add your 2 lines."
    xp: 100
    verify_type: screenshot
    quiz:
      - q: "What is the job of the GameMode?"
        choices: ["It holds the rules of the game, such as how a player wins", "It draws the score on the screen", "It stores the meshes of the level", "It reads the keys that the player presses during the game"]
        answer_index: 0
        explain: "The GameMode is the Blueprint for the rules. In this quest it decides when the count is high enough for a win."
      - q: "What kind of information belongs in the GameState?"
        choices: ["The rules that decide who wins and when the game ends", "The settings of the editor", "Shared information about the match, such as the score", "The input keys of one player"]
        answer_index: 2
        explain: "The GameState holds shared information about the match. The count of collected items is such a value, so it is stored there."
      - q: "Where do you tell BP_UUGameMode to use BP_UUGameState?"
        choices: ["In the World Settings, under Kill Z", "In the Class Defaults of BP_UUGameMode, in Game State Class", "In the Event Graph of BP_UUGameState", "In the Details panel of the Player Start, in Game State Class"]
        answer_index: 1
        explain: "Game State Class is a setting in the Class Defaults of the GameMode. It decides which GameState is created when the game starts."
      - q: "How do you make a test level use BP_UUGameMode?"
        choices: ["Drag BP_UUGameMode into the level", "Rename the level to BP_UUGameMode", "Add BP_UUGameMode to the character as a new component", "Set GameMode Override in the World Settings of the level"]
        answer_index: 3
        explain: "GameMode Override in the World Settings chooses the GameMode for that level. Without it, the level uses the default of the project."
      - q: "Why do you set Default Pawn Class to the character of the template?"
        choices: ["So the score is saved between the two levels", "So the GameState is created", "So you can still walk around as that character", "So the win message is printed once"]
        answer_index: 2
        explain: "Default Pawn Class decides which pawn the player gets. A new GameMode does not know the template character until you set it."
      - q: "How does CheckWin in the GameMode read the count?"
        choices: ["It uses Get Game State, casts it to BP_UUGameState and reads Collected", "It counts the pickups that are left in the level with Get All Actors Of Class", "It reads the Target variable of the GameState", "It asks the character for its location"]
        answer_index: 0
        explain: "Get Game State returns the general GameState. The cast to BP_UUGameState gives access to your own variable Collected."
      - q: "The win message appears again and again after the win. What do you add?"
        choices: ["A second Print String node", "A Do Once node in front of the Print String", "A Delay node right after the Print String", "A larger Target value"]
        answer_index: 1
        explain: "Do Once lets the execution pass only one time. A Boolean variable named HasWon that you check first does the same job."
