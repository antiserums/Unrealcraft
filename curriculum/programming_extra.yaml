        answer_index: 0
        explain: "A kill volume marks a place where the player fails, for example a pit under the level. Touching it ends the try."
      - q: "What does respawn logic do?"
        choices: ["It removes the player from the game for the rest of it", "It loads the main menu", "It puts the player back in the level after they fail", "It saves the level to disk"]
        answer_index: 2
        explain: "To respawn means to appear again. The logic decides where and how the player comes back after a failure."
      - q: "Where do you place the kill volume in this quest?"
        choices: ["Above the level, in the sky, as a thin plane", "Below the floor, as a large Box Collision", "Around the Player Start", "Inside the checkpoint"]
        answer_index: 1
        explain: "The volume lies under the level. A player who falls off the floor overlaps the large box and is sent back."
      - q: "Where do you store the last checkpoint?"
