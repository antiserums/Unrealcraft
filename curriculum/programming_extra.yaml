    title: Functions vs macros vs events
    brief: "Blueprints give you three ways to pack nodes into something you can use again: a function, a macro, and a custom event. They look similar, but they have different rules. For example, they differ in whether they can wait for some time and in whether other Blueprints can call them. In this quest you build the same small behavior in all three ways and compare them, so you can pick the right one later and keep your graphs easy to read."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/events-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine blueprint function vs macro vs custom event differences"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/flow-control-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, and make a new Actor Blueprint for this test. Choose one small behavior, such as printing a message and changing the color of a light, and build it three times in the same Blueprint: once as a function, once as a macro, and once as a custom event."
      - "Try to add a Delay node inside each of the three. A Delay node makes the graph wait for some time. Note where the editor allows it and where it does not."
      - "Try to call each of the three from another Blueprint. Note which ones you can reach from there."
      - "Write a table with 3 rows, one for each of the three. In each row, say when you would pick that one."
    done_when: "Send a screenshot of the graph that shows all three, and add your table with 3 rows."
    xp: 80
    verify_type: writeup
    quiz:
      - q: "Which three ways do Blueprints give you to pack nodes into something you can use again?"
        choices: ["A variable, a component and a comment", "A function, a macro and a custom event", "A struct, an enum and a Data Asset", "A level, a widget and a material"]
        answer_index: 1
        explain: "A function, a macro and a custom event all hold a group of nodes under one name. They look similar but follow different rules."
      - q: "What does a Delay node do?"
        choices: ["It makes the graph wait for some time", "It makes the graph run faster", "It stops the game for ever", "It repeats the node that is before it"]
        answer_index: 0
        explain: "A Delay node pauses that path of the graph for the time you set, and then the path continues."
      - q: "In which of the three does the editor not allow a Delay node?"
        choices: ["In a macro", "In a custom event", "In the Event Graph", "In a function"]
        answer_index: 3
        explain: "A function must run from start to end without waiting. A macro and a custom event can contain a Delay node."
      - q: "You need to call a behavior from another Blueprint. Which of the three can you not reach from there?"
        choices: ["The function", "The custom event", "The macro", "All three can be reached"]
        answer_index: 2
