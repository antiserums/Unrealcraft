        answer_index: 2
        explain: "With Live Coding you change the code and apply it without closing the editor. It saves the time of a restart."
      - q: "Which shortcut applies a change with Live Coding?"
        choices: ["Ctrl+Alt+F11", "Ctrl+B", "F9", "Shift+P"]
        answer_index: 0
        explain: "Ctrl+Alt+F11 starts a Live Coding compile while the editor stays open."
