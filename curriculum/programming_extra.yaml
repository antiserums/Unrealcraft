      - q: "What does the rule that you write for this quest say?"
        choices: ["Which changes are safe to apply with Live Coding and which need a restart", "How many classes a project may have", "Which IDE is the fastest", "How often the editor must be updated and restarted during a working day"]
        answer_index: 0
