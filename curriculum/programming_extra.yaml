    title: First look at Unreal Insights
    brief: "Unreal Insights is a profiling tool, which means a tool that records where the engine spends its time. A recording is called a trace. When a game runs slowly, a trace shows you which part of the work takes too long. In this quest you record a short trace and open it to take a first look."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-insights-in-unreal-engine"
