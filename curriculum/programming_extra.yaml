    xp: 120
    verify_type: screenshot
    quiz:
      - q: "What is a component?"
        choices: ["A part that you add to an actor to give it a shape or a behavior", "A level that is loaded inside another level", "A file that stores the settings of the editor for one project", "A node that connects two Blueprints"]
        answer_index: 0
        explain: "A mesh, a collision box and a script that spins the actor are all components. An actor is built from such parts."
      - q: "What is the main gain of writing a behavior as a component?"
        choices: ["The behavior runs without an actor", "The behavior needs no compiling", "You write it once and reuse it on many actors", "The behavior cannot be changed by other people"]
        answer_index: 2
        explain: "A spin component can be added to any actor. The code exists once, and every actor that needs it gets the same behavior."
      - q: "What is the constructor of a class?"
        choices: ["The function that runs every frame", "The function that runs when the object is created", "The function that runs when the game ends", "The function that runs when the player presses a key"]
        answer_index: 1
        explain: "The constructor sets up a new object. For an actor, it is the place where the default components are created."
