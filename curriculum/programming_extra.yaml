  # ---------- Rank 2 electives ----------
  - id: PQ14
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [blueprint, communication]
    required_spine: false
    required: false
    title: Three ways Blueprints talk
    brief: "Actors often need to tell each other things, and Blueprints give you three main ways to do this: a direct reference that calls one known actor, an interface that is a shared list of functions any actor can answer, and an Event Dispatcher that is a signal other actors can listen to. Each way creates a different amount of coupling, which means how much one actor depends on the other. In this quest you connect two actors in all three ways and compare them."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-communication-usage-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine blueprint communication direct cast interface event dispatcher"
    checklist:
      - "Open any project, or create one from the Third Person template. Make two simple Actor Blueprints: BP_Button, with a mesh and a Box Collision that counts as pressed when the player overlaps it, and BP_Lamp, with a Point Light and a function that switches the light on and off. In the next three steps you connect two actors three times, for example a button and a lamp."
      - "First use a direct reference: give the button an Instance Editable variable of the type BP_Lamp, pick the lamp in the level, and call a function on it."
      - "Then use an interface: create a Blueprint Interface with a function named Activate, implement it on the lamp, and call Activate (Message) on a plain Actor reference."
      - "Then use an Event Dispatcher: add an Event Dispatcher named OnPressed to the button and call it, and in the lamp use Bind Event to OnPressed to react."
      - "For each of the three ways, write one line about the coupling it creates, which means how much one actor must know about the other."
    done_when: "Send your written lines, and a screenshot of the graph of the Event Dispatcher version."
    xp: 50
    verify_type: writeup
    quiz:
      - q: "What is coupling between two actors?"
        choices: ["How far apart the two actors are in the level", "How much one actor depends on the other", "How many components the two actors share", "How often the two actors are saved"]
        answer_index: 1
        explain: "Coupling is how much one actor must know about the other. The more it must know, the harder both are to change later."
      - q: "What is a direct reference?"
        choices: ["A variable that points to one known actor, so you can call it", "A signal that any actor in the level can listen to and answer", "A list of functions without any logic", "A copy of another Blueprint"]
        answer_index: 0
        explain: "A direct reference is a variable of a known type, here BP_Lamp. The button picks one lamp in the level and calls a function on it."
      - q: "What is a Blueprint Interface?"
        choices: ["A widget that is drawn on the screen", "A variable that stores a location", "A window where you edit the keyboard shortcuts of a game", "A shared list of functions that any actor can answer"]
        answer_index: 3
        explain: "An interface only names functions, such as Activate. Any Blueprint that implements it decides for itself what the function does."
      - q: "What is an Event Dispatcher?"
        choices: ["A node that waits for some time", "A function that returns a value", "A signal that other actors can listen to", "A volume that fires overlap events at once"]
        answer_index: 2
        explain: "An Event Dispatcher sends out a signal when you call it. Every actor that is bound to it reacts."
      - q: "In the direct reference version, what must the button know about its target?"
        choices: ["Nothing at all", "Its exact class, BP_Lamp", "Only that it is an Actor", "Only its position in the level"]
        answer_index: 1
        explain: "The variable on the button is of the type BP_Lamp. The button only works with lamps, which is the strongest coupling of the three ways."
      - q: "In the interface version, on which kind of reference does the button call Activate (Message)?"
        choices: ["On a plain Actor reference", "On a BP_Lamp reference", "On a Point Light reference", "On a GameMode reference"]
        answer_index: 0
        explain: "The message can be sent to any Actor. The button does not need to know the class, and any actor that implements the interface answers."
      - q: "In the Event Dispatcher version, how does the lamp react to the button?"
        choices: ["It reads the button on every frame", "It calls Activate (Message) on the button", "It casts the player to BP_Button", "It uses Bind Event to OnPressed"]
        answer_index: 3
        explain: "The lamp binds one of its events to OnPressed. When the button calls the dispatcher, the bound event runs."
      - q: "In the Event Dispatcher version, what does the button know about the lamp?"
        choices: ["It knows the class of the lamp", "It knows the light color of the lamp", "It knows nothing about who listens", "It knows every function of the lamp"]
        answer_index: 2
        explain: "The button only calls OnPressed. The listeners bind themselves, so you can add or remove lamps and never change the button."
    flavors:
      _default: {why: "How actors talk decides how easy they are to change.", do: "Try all three."}
      programming: {why: "Dispatchers become C++ delegates later.", do: "Note the coupling for each."}

