      - q: "What do you use SetupAttachment for?"
        choices: ["To attach the components to each other", "To create a new component", "To make a component tick", "To show a component in the Details panel"]
        answer_index: 0
        explain: "SetupAttachment says which component is the parent of another. The mesh and the box then follow the root scene component."
      - q: "Why do you mark the components with UPROPERTY(VisibleAnywhere)?"
        choices: ["So they are deleted when the game starts", "So they tick every frame", "So you can see them in the editor", "So they cannot be attached"]
