        answer_index: 3
        explain: "The editor and your code no longer agree about the class. The result can be wrong values or crashes that have no clear cause."
      - q: "What is the gain of Live Coding when the change is safe?"
        choices: ["The game runs faster", "It is fast, because the editor does not have to restart", "The code needs no testing after it is compiled this way", "The project gets smaller"]
        answer_index: 1
        explain: "A restart costs time on every change. For safe changes, Live Coding lets you test a few seconds after you edit."
      - q: "A property you just added with Live Coding shows strange values in the editor. What do you do first?"
