    checklist:
      - "Open a project made from the Third Person template, or create one. Make a GameMode Blueprint as a child of the GameMode of the template and set it as the GameMode Override of a level in World Settings. Add a kill volume to the level: an Actor Blueprint with a large Box Collision, placed below the floor. When the player overlaps it, the player must respawn, which means appear again, at the last checkpoint they reached. The simple way is to call an event on the GameMode that moves the player back with Set Actor Transform."
      - "Store the last checkpoint in a place where the GameMode can read it, for example a Transform variable named LastCheckpoint in the GameMode itself or in the GameState. Make a checkpoint Blueprint with a Box Collision that writes its own transform into that variable when the player overlaps it."
