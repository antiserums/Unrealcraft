    rank: 1
    difficulty: apprentice
    specializations: [all]
    subjects: [editor, preferences]
    required_spine: false
    required: false
    title: Editor preferences for coders
    brief: "The Unreal editor has many preferences, and a few of them save a programmer time every day. They control things like where the game window opens when you press Play and whether the editor shows the frame rate. In this quest you look at three of these settings and write down what you chose and why."
    time_min: 20
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-editor-preferences"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 editor preferences settings for programmers"
    checklist:
      - "Open any project, or create one from the Third Person template. Choose how Play In Editor (PIE) opens. Click the three dots next to the Play button in the main toolbar and pick New Editor Window (PIE) or Selected Viewport. Try both and note which one you prefer."
      - "Open Edit > Editor Preferences, go to General, then Performance. Turn on Show Frame Rate and Memory, which shows these numbers in the editor at all times."
      - "In the Editor Preferences, go to General, then Source Code, and find Source Code Editor. This is the program that Unreal opens when you want to read or write C++ code. Note what it is set to now. Change it only if you use a different program."
