# Unrealcraft — Programming specialization, Ranks 1–3 (STUB, Phase 2)
# URL prefix: https://dev.epicgames.com/documentation/en-us/unreal-engine/
# Verified slugs only (see VERIFIED_URLS.md). Anything unverified is TODO_URL. Backup videos are TODO_URL.
# Every quest has a quiz.
#
# Programmers are never gated on a lighting reel. Your only lighting obligation is the Rank 2 opposite taster.
#
# FULL REQUIRED PATH (Programming), including shared quests defined in other files:
#
# Rank 1 (Apprentice) — track: starter-quests
#   PQ1  Debug room toolkit (stat commands, show flags, Print String, console)
#   PQ2  Output Log and the Blueprint debugger
#   PQ3  Read the Third Person template's Blueprints
#   PQ4  A tiny test-harness level
#   LDQ19  Courtyard walk-and-note (shared LD taster, level_design_r1.yaml) — required_tasters rank 1
#   PQ8 Debug room (capstone)
#   Electives: PQ5, PQ6, PQ7
#
# Rank 2 (Adept) — track: blueprint
#   GDQ1  Actor Blueprint anatomy          (shared, level_design_r2.yaml)
#   GDQ2  Triggers and overlaps            (shared, level_design_r2.yaml)
#   GDQ3  Timelines                        (shared, level_design_r2.yaml)
#   GDQ4  Blueprint Interfaces             (shared, level_design_r2.yaml)
#   PQ9  GameMode / GameState win condition
#   PQ10  One Enhanced Input action
#   PQ11  Functions vs macros vs events
#   PQ12  Data in Blueprint: structs, enums, Data Assets
#   PQ13  Blueprint-side logging and asserts
#   EAQ22  Opposite taster: one lighting pass (tasters.yaml) — required_tasters rank 2
#   PQ19 Pickup/win loop in Blueprint (capstone)
#   Electives: PQ14, PQ15, PQ16
#
# Rank 3 (Expert, Programming) — track: bay-code
#   PQ20  IDE setup and first compile
#   PQ21  UCLASS / UPROPERTY / UFUNCTION exposure
#   PQ22  BlueprintNativeEvent vs BlueprintImplementableEvent
#   PQ23  Components in C++
#   PQ24  Live Coding vs full rebuild
#   PQ25  UE_LOG and custom log categories
#   PQ26  C++ and Blueprint interop patterns
#   AQ1  Character anatomy                (shared, required for all specializations)
#   AQ2  Read an AnimBP                   (shared, required for all specializations)
#   AQ3  Montage on interact              (shared, required for all specializations)
#   PQ30 C++ actor that Blueprint children use (capstone, mentor-verified)
#   Electives: PQ27, PQ28, PQ29
#
# Not required for Programming: any hero lighting, lookdev, or materials quest (R1-WL-*, R2-MAT-*, R3-LK-*).
# PQ17 / PQ18 are Level Design's opposite tasters, not ours.

quests:
  # =====================================================================
  # RANK 1 — foundations
  # =====================================================================
  - id: PQ1
    rank: 1
    difficulty: apprentice
    specializations: [programming]
    subjects: [debugging, stat-commands, console]
    required_spine: false
    required: true
    title: Debug room toolkit
    brief: "Debugging means finding out why something in your game does not work. Unreal gives you several small tools that show what the engine is doing, so you do not have to guess. In this quest you try three of them: console commands that show performance numbers, show flags that draw hidden information in the viewport, and the Print String node that writes text on the screen."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/stat-commands-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 stat unit stat fps show flags console commands debugging"
    checklist:
      - "Open any project, or create one from the Third Person template. Start Play In Editor (PIE), which means pressing Play to run the game inside the editor. Open the console with the backtick key, which on most keyboards is the key above Tab. Run the command stat fps, then stat unit, and then stat none, which hides the stats again."
      - "Open the Show menu of the viewport and toggle two show flags, for example Collision and Bounds. A show flag turns one kind of visual information on or off. Note what each of the two shows you."
      - "In any Blueprint, for example the Level Blueprint or the character Blueprint of the template, add a Print String node on the BeginPlay event, which runs when the game starts. Give the node a custom color, a Key, and a duration of 5 seconds."
      - "Run the same Print String twice with the same Key. Note that the second message replaces the first one on the screen instead of appearing as a new line under it."
      - "Write down 5 console commands that you would want to use in every debug session."
    done_when: "Send a screenshot of PIE with stat unit visible, and add your list of 5 commands."
    xp: 70
    verify_type: screenshot
    quiz:
      - q: "How do you open the console while the game runs in the editor?"
        choices: ["Press F9", "Press the backtick key, which on most keyboards is the key above Tab", "Press Ctrl+B", "Press the G key in the viewport, which is also the key for Game View"]
        answer_index: 1
        explain: "The backtick key opens the console, where you type commands such as stat fps. On most keyboards it is the key above Tab."
      - q: "Which console command hides the stats that are shown on the screen?"
        choices: ["stat none", "stat off", "stat hide", "stat unit"]
        answer_index: 0
        explain: "The command stat none hides the stats again. The commands stat fps and stat unit turn stats on."
      - q: "What kind of information do the commands stat fps and stat unit show?"
        choices: ["The names of the actors in the level", "The list of the assets that have not been saved to disk yet", "The errors in your Blueprints", "Performance numbers, such as the frame rate and frame times"]
        answer_index: 3
        explain: "These stat commands print performance numbers on the screen. They tell you how fast the game runs without any guessing."
      - q: "What is a show flag?"
        choices: ["A marker that you place in the level", "A node that writes one line of text on the screen during play", "A switch that turns one kind of visual information on or off", "A warning in the Output Log"]
        answer_index: 2
        explain: "Show flags are in the Show menu of the viewport. Each one turns one kind of visual information on or off, for example Collision or Bounds."
      - q: "What does the Print String node do?"
        choices: ["It writes text on the screen", "It saves text to a file on disk", "It prints the level on paper", "It renames the selected actor"]
        answer_index: 0
        explain: "Print String writes a text on the screen while the game runs. It is the simplest way to see that a part of a Blueprint was reached."
      - q: "You run the same Print String node twice with the same Key. What do you see?"
        choices: ["Two lines, one under the other, on screen", "An error message in red", "The second message replaces the first one", "No message at all"]
        answer_index: 2
        explain: "Messages with the same Key share one line on the screen. A new message replaces the old one, which keeps the screen clean when a value updates often."
    flavors:
      _default: {why: "Seeing what the engine is doing beats guessing.", do: "Collect the commands you'll reach for first."}
      programming: {why: "Every bug hunt starts with these tools.", do: "Keep your command list pinned in your notes."}

  - id: PQ2
    rank: 1
    difficulty: apprentice
    specializations: [programming]
    subjects: [debugging, output-log, blueprint-debugger]
    required_spine: false
    required: true
    title: Output Log and the Blueprint debugger
    brief: "The Output Log is a window where the engine and your Blueprints write messages, warnings and errors. The Blueprint debugger lets you pause a running Blueprint at a node you choose, called a breakpoint, and then look at the values of its variables. Together they tell you what really ran, which is much better than guessing. In this quest you filter the Output Log, pause a Blueprint on a breakpoint, and watch a value."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-debugger-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 blueprint debugger breakpoints watch values output log filter"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open Window, then Output Log. Use its filter so that it shows only warnings and errors."
      - "Open a Blueprint that has some logic in it. The character Blueprint of the template, BP_ThirdPersonCharacter, works well, and so does a Blueprint of your own. Select a node, for example the Jump node, and press F9 to set a breakpoint on it, which makes the game pause when that node runs. Then play in the editor (PIE) and do the action that makes the node run."
      - "While the game is paused, press F10 two times to step over two nodes, which means running them one at a time. Then hover the mouse over a variable to read its value."
      - "Right-click a pin and choose Watch This Value. Then open the Blueprint Debugger window and read the value there."
      - "Remove the breakpoint. Play again and confirm that PIE now runs straight through without pausing."
    done_when: "Send a screenshot of the Blueprint with execution paused on a breakpoint and a watched value visible."
    xp: 70
    verify_type: screenshot
    quiz:
      - q: "What is the Output Log?"
        choices: ["A panel that lists the actors in the level", "A file that stores your saved games", "A window where the engine and your Blueprints write messages, warnings and errors", "A tool that records where the engine spends its time while the game is running"]
        answer_index: 2
        explain: "The Output Log collects text from the engine and from your Blueprints. You open it with Window, then Output Log, and you can filter it to show only warnings and errors."
      - q: "What does a breakpoint on a Blueprint node do?"
        choices: ["It deletes the node when the game starts", "It makes the game pause when that node runs", "It skips the node while the game runs", "It prints the name of the node on the screen"]
        answer_index: 1
        explain: "A breakpoint pauses the game at the moment the node runs. While it is paused, you can look at the values in the graph."
      - q: "Which key sets a breakpoint on the selected node?"
        choices: ["F9", "F8", "F11", "F5"]
        answer_index: 0
        explain: "You select a node and press F9 to set a breakpoint on it. The same key removes it again."
      - q: "The game is paused on a breakpoint. What does pressing F10 do?"
        choices: ["It stops Play in Editor and returns to the level editor", "It removes all breakpoints", "It restarts the level", "It steps over one node, so the nodes run one at a time"]
        answer_index: 3
        explain: "F10 runs the next node and pauses again. Stepping lets you follow the flow of the graph one node at a time."
      - q: "How do you keep an eye on the value of a pin in the Blueprint Debugger window?"
        choices: ["Double-click the pin", "Right-click the pin and choose Watch This Value", "Drag the pin from the node into the Output Log window", "Select the pin and press F9"]
        answer_index: 1
        explain: "Watch This Value marks the pin as watched. The Blueprint Debugger window then shows its value while the game is paused."
      - q: "You set a breakpoint on the Jump node and press Play, but the game never pauses. What do you check first?"
        choices: ["That the Output Log is closed", "That the Blueprint is saved in another folder", "That you did the action that makes the node run", "That the level has a Player Start"]
        answer_index: 2
        explain: "A breakpoint only pauses the game when its node runs. If you never jump, the Jump node never runs and nothing pauses."
    flavors:
      _default: {why: "Breakpoints tell you what actually ran.", do: "Pause one graph and read its values."}
      programming: {why: "Same habits you'll use in the IDE at Rank 3.", do: "Step through a graph until the flow is obvious."}

  - id: PQ3
    rank: 1
    difficulty: apprentice
    specializations: [programming]
    subjects: [blueprint, reading-code, templates]
    required_spine: false
    required: true
    title: Read the Third Person template
    brief: "The Third Person template is a small working game that comes with Unreal. Reading how it is built teaches you faster than writing everything from nothing, because you can see how input, movement and the camera are connected. In this quest you open the template's character Blueprint, follow one input from the key press to the movement, and list the parts the character is made of."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/third-person-template-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 third person template blueprint explained character input"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open the Third Person character Blueprint. Also open its GameMode, the Blueprint that sets the rules of the game and decides which character the player uses."
      - "Follow one input through the graph. Start at the Input Action event, which is the node that fires when the player presses a key or moves a stick, and end at the node that moves the character."
      - "List the components on the character, which are the parts shown in the Components panel. Write what each one is for."
      - "Find where the length of the camera boom is set. The camera boom is the arm that holds the camera behind the character. Change the length once to see the effect, and then set it back to the old value."
    done_when: "Send a written description of the chain from input to movement in 4 to 6 lines, and add your list of components."
    xp: 60
    verify_type: writeup
    quiz:
      - q: "Why is reading the Third Person template a fast way to learn?"
        choices: ["It is the only project that can be opened in the editor without any extra download first", "It has no Blueprints, so it is simple", "It cannot be changed, so nothing can break", "It is a working game where you can see how input, movement and the camera are connected"]
        answer_index: 3
        explain: "The template already works. Following its graphs shows you how the parts connect, which is faster than writing everything from nothing."
      - q: "What does the GameMode of the template do?"
        choices: ["It sets the rules of the game and decides which character the player uses", "It draws the level in the viewport", "It stores the meshes of the character", "It records the input of the player to a file that can be played back later"]
        answer_index: 0
        explain: "The GameMode is the Blueprint that holds the rules of the game. One of its settings is which character the player gets."
      - q: "What is an Input Action event in the character Blueprint?"
        choices: ["A node that runs one single time when the game starts in the level", "A node that fires when the player presses a key or moves a stick", "A node that plays an animation", "A node that changes the camera boom"]
        answer_index: 1
        explain: "The Input Action event is where the input enters the graph. You follow the chain from this node to the node that moves the character."
      - q: "Where do you see the components that the character is made of?"
        choices: ["In the Output Log", "In the World Settings", "In the Components panel of the Blueprint", "In the Place Actors panel of the editor"]
        answer_index: 2
        explain: "The Components panel lists the parts of the Blueprint, such as the mesh and the camera. Each one has its own job."
      - q: "What is the camera boom of the character?"
        choices: ["The sound the camera makes", "The arm that holds the camera behind the character", "The light that follows the character in the dark", "The mesh that shows the character"]
        answer_index: 1
        explain: "The camera boom is an arm between the character and the camera. Its length decides how far the camera sits behind the character."
      - q: "What do you send as proof for the input part of this quest?"
        choices: ["A written description of the chain from input to movement", "A video of the character jumping", "A copy of the Blueprint file of the character, as a zip", "A screenshot of the Content Browser"]
        answer_index: 0
        explain: "You describe in 4 to 6 lines how one input travels from the key press to the movement. Writing it down shows that you understood each step."
    flavors:
      _default: {why: "Reading working code is faster than writing from nothing.", do: "Trace one input end to end."}
      programming: {why: "You'll rebuild parts of this in C++ at Rank 3.", do: "Note anything you'd move to C++ and why."}

  - id: PQ4
    rank: 1
    difficulty: apprentice
    specializations: [programming]
    subjects: [testing, harness, pie]
    required_spine: false
    required: true
    title: A tiny test-harness level
    brief: "A test harness is a small, empty level that you build only for testing. When a level has nothing in it except the things you want to test, a bug is much easier to repeat and to understand. In this quest you build such a level with one labeled pad for each system you plan to test, and you make sure it always starts the same way."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/playing-and-simulating-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 test level gym map for testing gameplay"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a level named L_TestHarness in the folder UC/Maps (create the folder if it does not exist yet). Give it a flat floor, a Player Start, and one pad for each system you plan to test. A pad is just a marked area on the floor. Plan at least two pads, for example one for a pickup and one for a door."
      - "Add a Text Render actor next to each pad. Set its text to the name of that pad so you can read what the pad is for."
      - "Place an interactable object on one pad. If you have none, make a simple one: an Actor Blueprint with a cube mesh and a Box Collision that prints a message with Print String when something overlaps it. Confirm that it works in PIE (Play In Editor) and also in Simulate, the mode that runs the level without a player. In Simulate, drop a physics cube onto the pad to trigger it."
      - "Set the GameMode Override of the level, which you find in the World Settings panel. This makes the level always start with the same GameMode, so it always starts the same way."
    done_when: "Send a screenshot of the harness level taken from above that shows the pads with their labels."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is a test harness level?"
        choices: ["The first level of your finished game", "A level that holds every asset of the whole project", "A small, empty level that you build only for testing", "A level that Unreal creates when a test fails"]
        answer_index: 2
        explain: "A test harness has nothing in it except the things you want to test. It exists to make testing simple."
      - q: "Why is a bug easier to understand in a level that is almost empty?"
        choices: ["Empty levels have no collision", "Empty levels cannot have bugs", "Empty levels are saved much more often by the editor itself", "Nothing else in the level can cause or hide the problem"]
        answer_index: 3
        explain: "With only the tested things in the level, there are few possible causes. The bug is easier to repeat and to understand."
      - q: "What is a pad in the test harness?"
        choices: ["A marked area on the floor for one system you plan to test", "A Blueprint that runs all the tests of a level in a row", "A window that shows test results", "A note that is saved with the level"]
        answer_index: 0
        explain: "Each pad is a marked area for one system, for example one for a pickup and one for a door. This keeps the tests apart."
      - q: "How do you show what each pad is for?"
        choices: ["Give each pad a different sound", "Add a Text Render actor next to it with the name of the pad", "Write the name of the pad in the World Settings of the level", "Place a Player Start on each pad"]
        answer_index: 1
        explain: "A Text Render actor shows text in the level. With the name of the pad as its text, anyone can read what the pad tests."
      - q: "Simulate runs the level without a player. How do you trigger the interactable on a pad in Simulate?"
        choices: ["Press the E key in the viewport", "Walk the character onto the pad", "Drop a physics cube onto the pad", "Type the name of the pad in the console"]
        answer_index: 2
        explain: "There is no character in Simulate, so something else must overlap the pad. A physics cube that falls onto it does the job."
      - q: "Why do you set the GameMode Override of the level in the World Settings panel?"
        choices: ["So the level loads faster", "So the level always starts with the same GameMode", "So the level cannot be edited by any other people", "So the level has no Player Start"]
        answer_index: 1
        explain: "With the override set, the level does not depend on the project default. It always starts the same way, which makes tests repeatable."
    flavors:
      _default: {why: "A clean test space makes bugs reproducible.", do: "Build one pad per thing you test."}
      programming: {why: "Every system you write gets a pad here.", do: "Keep it boring and consistent."}

  - id: PQ8
    rank: 1
    difficulty: apprentice
    specializations: [programming]
    subjects: [debugging, harness, capstone]
    required_spine: false
    required: true
    capstone: true
    title: Debug room
    brief: "A debug room is a test level where each area shows one way to find problems. Building one proves that you can set up a space for testing and that you can explain your tests to another person. In this quest you build a small debug room with three pads, and you write notes so that someone else can repeat each test."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/stat-commands-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 debug level setup print string stat commands"
    checklist:
      - "Open any project, or create one from the Third Person template. Build a debug room in a new level: a flat floor, a Player Start, and at least 3 pads, which are marked areas on the floor with a Text Render actor as a label. If you already have a test level of your own, you can extend that. Each pad must show one debug technique."
      - "Give each pad a small Actor Blueprint with a Box Collision that reacts when the player steps on it. Make one pad write a message to the Output Log only (a Print String with Print to Screen turned off). Make one pad use Print String with Keys. Give one pad a Blueprint that is ready for a breakpoint, which is a mark that pauses the game on a node you choose."
      - "Write notes for each test. Say how to reproduce the test, which means the steps to run it again, and say what output you expect to see."
      - "Run stat unit in the room and write down the numbers it shows. Add one line that says what these numbers mean."
    done_when: "Send a screenshot of the room, and add written notes that another learner could follow to reproduce each test."
    xp: 200
    verify_type: writeup
    quiz:
      - q: "What is a debug room?"
        choices: ["A test level where each area shows one way to find problems", "A window that lists all errors of the project", "A folder where crash files are saved", "A level that players see for a moment when the game crashes"]
        answer_index: 0
        explain: "A debug room is a test level with several pads. Each pad shows one debug technique."
      - q: "How do you make a Print String node write to the Output Log only?"
        choices: ["Set its duration to 0", "Give it an empty Key", "Set its Text Color to black on the node", "Turn off Print to Screen on the node"]
        answer_index: 3
        explain: "Print String can write to the screen and to the log. With Print to Screen turned off, the message only appears in the Output Log."
      - q: "What does it mean to reproduce a test?"
        choices: ["To copy the test level to a new project", "To follow the steps and run the test again", "To delete the test and write a new one", "To record the test as a video"]
        answer_index: 1
        explain: "To reproduce is to run the same steps again and get the same result. Your notes must give those steps."
      - q: "Besides the steps to reproduce, what do your notes for each test say?"
        choices: ["How long you worked on the pad", "Which mesh the pad uses", "What output you expect to see", "Who built the pad"]
        answer_index: 2
        explain: "The expected output tells the reader what a correct run looks like. Without it, nobody can tell if the test passed."
      - q: "One pad has a Blueprint that is ready for a breakpoint. What is a breakpoint?"
        choices: ["A mark that pauses the game on a node you choose", "A place where the level ends", "A message in the Output Log", "A pad that breaks when the player steps on it"]
        answer_index: 0
        explain: "A breakpoint pauses the game when the marked node runs. You can then look at the values in the graph."
      - q: "Which console command do you run in the room to write down timing numbers?"
        choices: ["stat none", "show collision", "stat unit", "print string"]
        answer_index: 2
        explain: "The command stat unit shows timing numbers on the screen. You note them and add one line that says what they mean."
    flavors:
      _default: {why: "Shows you can set up a space to test in.", do: "Make each pad self-explanatory."}
      programming: {why: "This room goes with you to every later rank.", do: "Write notes someone else could run without you."}

  # ---------- Rank 1 electives ----------
  - id: PQ5
    rank: 1
    difficulty: apprentice
    specializations: [all]
    subjects: [editor, preferences]
    required_spine: false
    required: false
    title: Editor preferences for coders
    brief: "The Unreal editor has many preferences, and a few of them save a programmer time every day. They control things like where the game window opens when you press Play and whether the editor shows the frame rate. In this quest you look at three of these settings and write down what you chose and why."
    time_min: 20
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-editor-preferences"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 editor preferences settings for programmers"
    checklist:
      - "Open any project, or create one from the Third Person template. Choose how Play In Editor (PIE) opens. Click the three dots next to the Play button in the main toolbar and pick New Editor Window (PIE) or Selected Viewport. Try both and note which one you prefer."
      - "Open Edit > Editor Preferences, go to General, then Performance. Turn on Show Frame Rate and Memory, which shows these numbers in the editor at all times."
      - "In the Editor Preferences, go to General, then Source Code, and find Source Code Editor. This is the program that Unreal opens when you want to read or write C++ code. Note what it is set to now. Change it only if you use a different program."
    done_when: "Send a written note that lists the 3 settings from the steps, says what each one is set to now, and says why you chose that."
    xp: 30
    verify_type: writeup
    quiz:
      - q: "Where do you choose how Play In Editor (PIE) opens?"
        choices: ["In the Output Log, under Filters", "In the three dots menu next to the Play button in the main toolbar", "In the World Settings, under GameMode", "In the Content Browser, under Settings, in the Play section at the end"]
        answer_index: 1
        explain: "The three dots next to the Play button open the play options. There you pick New Editor Window (PIE) or Selected Viewport."
      - q: "What does the play option Selected Viewport do?"
        choices: ["It records the viewport to a video", "It opens the game on a second computer screen", "It opens the game in a new window", "It runs the game inside the level viewport"]
        answer_index: 3
        explain: "Selected Viewport plays the game in the viewport you already have. New Editor Window (PIE) opens a separate window for the game."
      - q: "Where do you find the setting Show Frame Rate and Memory?"
        choices: ["In Edit, then Editor Preferences, under General, then Performance", "In Edit, then Plugins, under Performance, then Frame Rate and Memory", "In Window, then Output Log", "In the Show menu of the viewport"]
        answer_index: 0
        explain: "The setting is an editor preference. You open Edit, then Editor Preferences, and go to General, then Performance."
      - q: "What changes when you turn on Show Frame Rate and Memory?"
        choices: ["The game runs at a fixed frame rate", "The editor uses less memory", "The editor shows these numbers at all times", "The numbers are written to a file on disk"]
        answer_index: 2
        explain: "The frame rate and memory use stay visible in the editor. You notice at once when a change makes the editor slower."
      - q: "What is the Source Code Editor setting in the Editor Preferences?"
        choices: ["The folder on your disk where the Blueprints of a project are saved", "The language of the editor menus", "The font of the Blueprint graphs", "The program that Unreal opens when you read or write C++ code"]
        answer_index: 3
        explain: "This setting names the program for C++ code. You find it under General, then Source Code."
      - q: "When should you change the Source Code Editor setting?"
        choices: ["Only if you use a different program for your code", "Every time that you create a new project in Unreal", "Before every Play In Editor session", "Only if the frame rate is low"]
        answer_index: 0
