      - q: "Where does WBP_Score start to listen to OnScoreChanged?"
        choices: ["On Event Tick of the character", "On Event Construct, with Bind Event on the GameState", "In the Class Defaults of the GameMode, under HUD Class", "In the World Settings of the level"]
        answer_index: 1
        explain: "Event Construct runs when the widget is created. There the widget gets the GameState, casts it to your class and binds to the dispatcher."
      - q: "You press the test key and the score variable goes up, but the text on the screen stays the same. What do you check first?"
        choices: ["That the Text widget uses a large font", "That the level has a Player Start", "That the widget was added to the viewport two times in the same frame", "That the GameState calls OnScoreChanged after it changes the score"]
