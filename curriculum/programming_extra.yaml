# Unrealcraft — Programming specialization, Ranks 1–3 (STUB, Phase 2)
# URL prefix: https://dev.epicgames.com/documentation/en-us/unreal-engine/
# Verified slugs only (see VERIFIED_URLS.md). Anything unverified is TODO_URL. Backup videos are TODO_URL.
# No quizzes yet (Phase 4).
#
# Programmers are never gated on a lighting reel. Your only lighting obligation is the Rank 2 opposite taster.
#
# FULL REQUIRED PATH (Programming), including shared quests defined in other files:
#
# Rank 1 (Apprentice) — track: starter-quests
#   PQ1  Debug room toolkit (stat commands, show flags, Print String, console)
#   PQ2  Output Log and the Blueprint debugger
#   PQ3  Read the Third Person template's Blueprints
#   PQ4  A tiny test-harness level
#   LDQ19  Courtyard walk-and-note (shared LD taster, level_design_r1.yaml) — required_tasters rank 1
#   PQ8 Debug room (capstone)
#   Electives: PQ5, PQ6, PQ7
#
# Rank 2 (Adept) — track: blueprint
#   GDQ1  Actor Blueprint anatomy          (shared, level_design_r2.yaml)
#   GDQ2  Triggers and overlaps            (shared, level_design_r2.yaml)
#   GDQ3  Timelines                        (shared, level_design_r2.yaml)
#   GDQ4  Blueprint Interfaces             (shared, level_design_r2.yaml)
#   PQ9  GameMode / GameState win condition
#   PQ10  One Enhanced Input action
#   PQ11  Functions vs macros vs events
#   PQ12  Data in Blueprint: structs, enums, Data Assets
#   PQ13  Blueprint-side logging and asserts
#   EAQ22  Opposite taster: one lighting pass (tasters.yaml) — required_tasters rank 2
#   PQ19 Pickup/win loop in Blueprint (capstone)
#   Electives: PQ14, PQ15, PQ16
#
# Rank 3 (Expert, Programming) — track: bay-code
#   PQ20  IDE setup and first compile
#   PQ21  UCLASS / UPROPERTY / UFUNCTION exposure
#   PQ22  BlueprintNativeEvent vs BlueprintImplementableEvent
#   PQ23  Components in C++
#   PQ24  Live Coding vs full rebuild
#   PQ25  UE_LOG and custom log categories
#   PQ26  C++ and Blueprint interop patterns
#   AQ1  Character anatomy                (shared, required for all specializations)
#   AQ2  Read an AnimBP                   (shared, required for all specializations)
#   AQ3  Montage on interact              (shared, required for all specializations)
#   PQ30 C++ actor that Blueprint children use (capstone, mentor-verified)
#   Electives: PQ27, PQ28, PQ29
#
# Not required for Programming: any hero lighting, lookdev, or materials quest (R1-WL-*, R2-MAT-*, R3-LK-*).
# PQ17 / PQ18 are Level Design's opposite tasters, not ours.

quests:
  # =====================================================================
  # RANK 1 — foundations
  # =====================================================================
  - id: PQ1
    rank: 1
    difficulty: apprentice
    specializations: [programming]
    subjects: [debugging, stat-commands, console]
    required_spine: false
    required: true
    title: Debug room toolkit
    brief: "Debugging means finding out why something in your game does not work. Unreal gives you several small tools that show what the engine is doing, so you do not have to guess. In this quest you try three of them: console commands that show performance numbers, show flags that draw hidden information in the viewport, and the Print String node that writes text on the screen."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/stat-commands-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 stat unit stat fps show flags console commands debugging"
    checklist:
      - "Open any project, or create one from the Third Person template. Start Play In Editor (PIE), which means pressing Play to run the game inside the editor. Open the console with the backtick key, which on most keyboards is the key above Tab. Run the command stat fps, then stat unit, and then stat none, which hides the stats again."
      - "Open the Show menu of the viewport and toggle two show flags, for example Collision and Bounds. A show flag turns one kind of visual information on or off. Note what each of the two shows you."
      - "In any Blueprint, for example the Level Blueprint or the character Blueprint of the template, add a Print String node on the BeginPlay event, which runs when the game starts. Give the node a custom color, a Key, and a duration of 5 seconds."
      - "Run the same Print String twice with the same Key. Note that the second message replaces the first one on the screen instead of appearing as a new line under it."
      - "Write down 5 console commands that you would want to use in every debug session."
    done_when: "Send a screenshot of PIE with stat unit visible, and add your list of 5 commands."
    xp: 70
    verify_type: screenshot
    quiz: []  # TODO Phase 4
    flavors:
      _default: {why: "Seeing what the engine is doing beats guessing.", do: "Collect the commands you'll reach for first."}
      programming: {why: "Every bug hunt starts with these tools.", do: "Keep your command list pinned in your notes."}

  - id: PQ2
    rank: 1
    difficulty: apprentice
    specializations: [programming]
    subjects: [debugging, output-log, blueprint-debugger]
    required_spine: false
    required: true
    title: Output Log and the Blueprint debugger
    brief: "The Output Log is a window where the engine and your Blueprints write messages, warnings and errors. The Blueprint debugger lets you pause a running Blueprint at a node you choose, called a breakpoint, and then look at the values of its variables. Together they tell you what really ran, which is much better than guessing. In this quest you filter the Output Log, pause a Blueprint on a breakpoint, and watch a value."
    time_min: 50
    official_url: TODO_URL
    backup_url: TODO_URL
    backup_search: "unreal engine 5 blueprint debugger breakpoints watch values output log filter"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open Window, then Output Log. Use its filter so that it shows only warnings and errors."
      - "Open a Blueprint that has some logic in it. The character Blueprint of the template, BP_ThirdPersonCharacter, works well, and so does a Blueprint of your own. Select a node, for example the Jump node, and press F9 to set a breakpoint on it, which makes the game pause when that node runs. Then play in the editor (PIE) and do the action that makes the node run."
      - "While the game is paused, press F10 two times to step over two nodes, which means running them one at a time. Then hover the mouse over a variable to read its value."
      - "Right-click a pin and choose Watch This Value. Then open the Blueprint Debugger window and read the value there."
      - "Remove the breakpoint. Play again and confirm that PIE now runs straight through without pausing."
    done_when: "Send a screenshot of the Blueprint with execution paused on a breakpoint and a watched value visible."
    xp: 70
    verify_type: screenshot
    quiz: []  # TODO Phase 4
    flavors:
      _default: {why: "Breakpoints tell you what actually ran.", do: "Pause one graph and read its values."}
      programming: {why: "Same habits you'll use in the IDE at Rank 3.", do: "Step through a graph until the flow is obvious."}

  - id: PQ3
    rank: 1
    difficulty: apprentice
    specializations: [programming]
    subjects: [blueprint, reading-code, templates]
    required_spine: false
    required: true
    title: Read the Third Person template
    brief: "The Third Person template is a small working game that comes with Unreal. Reading how it is built teaches you faster than writing everything from nothing, because you can see how input, movement and the camera are connected. In this quest you open the template's character Blueprint, follow one input from the key press to the movement, and list the parts the character is made of."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/third-person-template-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 third person template blueprint explained character input"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open the Third Person character Blueprint. Also open its GameMode, the Blueprint that sets the rules of the game and decides which character the player uses."
      - "Follow one input through the graph. Start at the Input Action event, which is the node that fires when the player presses a key or moves a stick, and end at the node that moves the character."
      - "List the components on the character, which are the parts shown in the Components panel. Write what each one is for."
      - "Find where the length of the camera boom is set. The camera boom is the arm that holds the camera behind the character. Change the length once to see the effect, and then set it back to the old value."
    done_when: "Send a written description of the chain from input to movement in 4 to 6 lines, and add your list of components."
    xp: 60
    verify_type: writeup
    quiz: []  # TODO Phase 4
    flavors:
      _default: {why: "Reading working code is faster than writing from nothing.", do: "Trace one input end to end."}
      programming: {why: "You'll rebuild parts of this in C++ at Rank 3.", do: "Note anything you'd move to C++ and why."}

  - id: PQ4
    rank: 1
    difficulty: apprentice
    specializations: [programming]
    subjects: [testing, harness, pie]
    required_spine: false
    required: true
    title: A tiny test-harness level
    brief: "A test harness is a small, empty level that you build only for testing. When a level has nothing in it except the things you want to test, a bug is much easier to repeat and to understand. In this quest you build such a level with one labeled pad for each system you plan to test, and you make sure it always starts the same way."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/playing-and-simulating-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 test level gym map for testing gameplay"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a level named L_TestHarness in the folder UC/Maps (create the folder if it does not exist yet). Give it a flat floor, a Player Start, and one pad for each system you plan to test. A pad is just a marked area on the floor. Plan at least two pads, for example one for a pickup and one for a door."
      - "Add a Text Render actor next to each pad. Set its text to the name of that pad so you can read what the pad is for."
      - "Place an interactable object on one pad. If you have none, make a simple one: an Actor Blueprint with a cube mesh and a Box Collision that prints a message with Print String when something overlaps it. Confirm that it works in PIE (Play In Editor) and also in Simulate, the mode that runs the level without a player. In Simulate, drop a physics cube onto the pad to trigger it."
      - "Set the GameMode Override of the level, which you find in the World Settings panel. This makes the level always start with the same GameMode, so it always starts the same way."
    done_when: "Send a screenshot of the harness level taken from above that shows the pads with their labels."
    xp: 60
    verify_type: screenshot
    quiz: []  # TODO Phase 4
    flavors:
      _default: {why: "A clean test space makes bugs reproducible.", do: "Build one pad per thing you test."}
      programming: {why: "Every system you write gets a pad here.", do: "Keep it boring and consistent."}

  - id: PQ8
    rank: 1
    difficulty: apprentice
    specializations: [programming]
    subjects: [debugging, harness, capstone]
    required_spine: false
    required: true
    capstone: true
    title: Debug room
    brief: "A debug room is a test level where each area shows one way to find problems. Building one proves that you can set up a space for testing and that you can explain your tests to another person. In this quest you build a small debug room with three pads, and you write notes so that someone else can repeat each test."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/stat-commands-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 debug level setup print string stat commands"
    checklist:
      - "Open any project, or create one from the Third Person template. Build a debug room in a new level: a flat floor, a Player Start, and at least 3 pads, which are marked areas on the floor with a Text Render actor as a label. If you already have a test level of your own, you can extend that. Each pad must show one debug technique."
      - "Give each pad a small Actor Blueprint with a Box Collision that reacts when the player steps on it. Make one pad write a message to the Output Log only (a Print String with Print to Screen turned off). Make one pad use Print String with Keys. Give one pad a Blueprint that is ready for a breakpoint, which is a mark that pauses the game on a node you choose."
      - "Write notes for each test. Say how to reproduce the test, which means the steps to run it again, and say what output you expect to see."
      - "Run stat unit in the room and write down the numbers it shows. Add one line that says what these numbers mean."
    done_when: "Send a screenshot of the room, and add written notes that another learner could follow to reproduce each test."
    xp: 200
    verify_type: writeup
    quiz: []  # TODO Phase 4
    flavors:
      _default: {why: "Shows you can set up a space to test in.", do: "Make each pad self-explanatory."}
      programming: {why: "This room goes with you to every later rank.", do: "Write notes someone else could run without you."}

