    title: C++ and Blueprint interop patterns
    brief: "Most Unreal projects use C++ and Blueprint together. A common pattern is a base class in C++ that holds the core logic, and a Blueprint child where designers set values and add small changes. How you split the work decides who can change what without asking a programmer. In this quest you plan such a split for a pickup that the player collects, on paper."
