      programming: {why: "Every class you write for others depends on this.", do: "Pick specifiers on purpose, not by copy-paste."}

  - id: PQ22
    rank: 3
    difficulty: expert
    specializations: [programming]
    subjects: [cpp, blueprint-events, overrides]
    required_spine: false
    required: true
    title: BlueprintNativeEvent vs BlueprintImplementableEvent
    brief: "C++ code often needs to let a Blueprint decide what happens at a certain moment. Unreal gives you two main tools for this. A BlueprintImplementableEvent is a function that C++ calls but only a Blueprint fills in. A BlueprintNativeEvent has a default version written in C++ that a Blueprint may replace. In this quest you add one of each to a C++ actor and use both from a Blueprint child, which is a Blueprint made from your C++ class."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/ufunctions-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine blueprintnativeevent vs blueprintimplementableevent _Implementation"
    checklist:
      - "Open a C++ project, or create one from the Third Person template with C++ selected. Create a C++ actor class with Tools, then New C++ Class, or use an actor class of your own. Add a BlueprintImplementableEvent named OnActivated to it. Call it from your C++ code, for example in BeginPlay."
      - "Add a BlueprintNativeEvent named OnReset. Write its C++ version, which is a function with _Implementation at the end of its name, and make it write a line to the log. Call OnReset from BeginPlay as well, so that you can see it run."
      - "Create a Blueprint child of your actor. In it, implement OnActivated and override OnReset. In the OnReset override, call the parent version one time."
      - "Write 2 lines that say when you would use each of the two kinds of event."
    done_when: "Send a screenshot of the graph of the Blueprint child, and add the log output that shows that both the C++ code and the Blueprint code ran."
    xp: 110
    verify_type: screenshot
    quiz:
      - q: "What is a BlueprintImplementableEvent?"
        choices: ["A function that a Blueprint calls and C++ fills in", "A function that C++ calls but only a Blueprint fills in", "A function that can only run in the editor", "A function with a default version written in C++"]
        answer_index: 1
        explain: "C++ decides when the event is called. What happens then is written only in a Blueprint."
      - q: "What is a BlueprintNativeEvent?"
        choices: ["A function that cannot be changed by Blueprints", "A function that only exists in the Level Blueprint and is called from C++ code", "A function that runs before the game starts", "A function with a default version written in C++ that a Blueprint may replace"]
        answer_index: 3
        explain: "The C++ version gives a default behavior. A Blueprint child can override it when it needs something else."
      - q: "How do you name the C++ version of the BlueprintNativeEvent OnReset?"
        choices: ["OnReset_Implementation", "OnReset_Native", "OnReset_Default", "OnReset_BlueprintNative"]
        answer_index: 0
        explain: "The C++ body of a BlueprintNativeEvent is a function with _Implementation at the end of its name."
      - q: "For which of the two kinds of event do you write no body in C++?"
        choices: ["For both of them", "For neither of them", "For the BlueprintImplementableEvent", "For the BlueprintNativeEvent only"]
        answer_index: 2
        explain: "A BlueprintImplementableEvent is only declared in C++. Its content comes from the Blueprint that implements it."
      - q: "A Blueprint child does not implement OnActivated. What happens when C++ calls it?"
        choices: ["The editor crashes", "Nothing happens", "The C++ default version runs", "The Blueprint is deleted"]
        answer_index: 1
        explain: "A BlueprintImplementableEvent has no C++ version. With no Blueprint implementation, the call does nothing."
      - q: "A Blueprint child does not override OnReset. What happens when C++ calls it?"
        choices: ["Nothing happens", "The call is skipped and a warning is written to the log", "The game pauses", "The C++ version runs and writes its line to the log"]
        answer_index: 3
        explain: "A BlueprintNativeEvent falls back to its C++ version. That is the default behavior you wrote in OnReset_Implementation."
      - q: "In the Blueprint override of OnReset you call the parent version one time. What does the log show?"
        choices: ["That both the C++ code and the Blueprint code ran", "That only the Blueprint code ran, and it ran twice", "That only the C++ code ran", "That neither of them ran"]
        answer_index: 0
        explain: "The override runs the Blueprint nodes, and the call to the parent runs the C++ version. Both leave their mark in the log."
      - q: "You override OnReset in the Blueprint and do not call the parent version. What happens to the C++ version?"
        choices: ["It runs before the Blueprint version", "It runs after the Blueprint version", "It does not run", "It runs two times"]
        answer_index: 2
        explain: "An override replaces the default. The C++ version only runs if the Blueprint calls the parent version."
      - q: "What is a Blueprint child of your C++ actor?"
        choices: ["A copy of the C++ files in another folder", "A Blueprint made from your C++ class", "A component that is attached to the actor", "A level that contains the actor"]
        answer_index: 1
        explain: "The Blueprint child has your C++ class as its parent. It gets the events of the class and can implement or override them."
      - q: "When is a BlueprintNativeEvent the better choice?"
        choices: ["When Blueprints must never change the behavior, and the C++ version is the only one", "When the function has no use in the game", "When C++ has nothing to do at that moment", "When there is a sensible default behavior in C++ that designers may want to change"]
        answer_index: 3
        explain: "The default lives in C++ and works without any Blueprint. Designers can still replace or extend it without asking a programmer."
    flavors:
      _default: {why: "These are the main hooks C++ gives Blueprint.", do: "Use both once."}
      programming: {why: "The right hook lets designers extend without asking you.", do: "Default behavior in C++, overrides in BP."}

  - id: PQ23
