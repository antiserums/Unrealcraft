  - id: PQ21
    rank: 3
    difficulty: expert
    specializations: [programming]
    subjects: [cpp, reflection, uproperty, ufunction]
    required_spine: false
    required: true
    title: UCLASS, UPROPERTY, UFUNCTION
    brief: "Unreal can only show your C++ code in the editor if you mark it with special macros. UCLASS marks a class, UPROPERTY marks a variable, and UFUNCTION marks a function. This system is called reflection, and the words you put inside the macros, called specifiers, decide what the editor and Blueprints are allowed to see and change. In this quest you write a small actor with marked properties and a function, and you use them from the editor."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-cpp-quick-start"
    backup_url: TODO_URL
    backup_search: "unreal engine uproperty editanywhere blueprintreadwrite ufunction blueprintcallable explained"
    checklist:
      - "Open a C++ project, or create one from the Third Person template with C++ selected. You need an IDE such as Visual Studio, set up as Epic's documentation describes. Create a C++ actor class named AUUDebugActor with Tools, then New C++ Class. Give it a float variable marked with UPROPERTY, and use the specifiers EditAnywhere and BlueprintReadWrite."
      - "Add a second property that uses the specifier VisibleAnywhere. Compile, and note what is different about this property in the Details panel."
      - "Add a function marked with UFUNCTION(BlueprintCallable) that writes the float to the log."
      - "Make a Blueprint child of your class that calls that function on BeginPlay, and place the Blueprint in any level."
      - "Write a short table of the specifiers you used. For each one, say what it does."
    done_when: "Send a screenshot of your properties in the Details panel, and a screenshot of the Blueprint that calls your function."
    xp: 110
    verify_type: screenshot
    quiz:
      - q: "What is reflection in Unreal Engine?"
        choices: ["The mirror image of a mesh on a shiny floor", "A tool that copies your C++ code into Blueprint graphs each time that you compile it", "The system that lets the editor and Blueprints see C++ code that is marked with macros", "A log that lists every compiled class"]
        answer_index: 2
        explain: "Plain C++ is invisible to the editor. The macros give Unreal the information it needs to show your classes, variables and functions."
      - q: "Which macro marks a variable for reflection?"
        choices: ["UCLASS", "UFUNCTION", "UENUM", "UPROPERTY"]
        answer_index: 3
        explain: "UPROPERTY marks a variable. UCLASS marks a class and UFUNCTION marks a function."
      - q: "What are specifiers?"
        choices: ["The words inside the macros that decide what the editor and Blueprints may see and change", "The names of the C++ header and source files that belong to one class, in the order of the build", "The errors that the compiler prints", "The comments above a function"]
        answer_index: 0
        explain: "Specifiers such as EditAnywhere or BlueprintCallable are written inside the macro. Each one grants a certain kind of access."
      - q: "What does the specifier EditAnywhere do?"
        choices: ["The property is hidden in the editor", "The property can be edited in the Details panel", "The property can only be changed in C++ code", "The property is saved to the log"]
        answer_index: 1
        explain: "EditAnywhere shows the property in the Details panel and lets you change its value there."
      - q: "A property uses VisibleAnywhere. What is different about it in the Details panel?"
        choices: ["It does not appear at all", "It appears twice", "It is shown, but you cannot edit it", "It can be edited only while the game runs"]
        answer_index: 2
        explain: "VisibleAnywhere lets you see the value in the Details panel, but not change it. EditAnywhere is the specifier that allows editing."
      - q: "What does the specifier BlueprintReadWrite do?"
        choices: ["It lets Blueprint graphs get and set the property", "It lets Blueprint graphs delete the property again", "It writes the property to a file", "It makes the property read-only in C++"]
        answer_index: 0
        explain: "With BlueprintReadWrite, a Blueprint graph can read the value and also change it."
      - q: "What does UFUNCTION(BlueprintCallable) do for a function?"
        choices: ["The function runs on every frame", "The function can only be called from C++", "The function is removed from the class in Blueprints", "The function can be called from a Blueprint graph"]
        answer_index: 3
        explain: "BlueprintCallable makes the function appear as a node. A Blueprint, such as a child of your class, can then call it."
      - q: "You add a float variable to your class with no UPROPERTY macro. What happens in the editor?"
        choices: ["It appears in the Details panel as read-only", "It does not appear in the editor", "It appears in every Blueprint as a node", "It causes a compile error"]
        answer_index: 1
        explain: "The editor only knows what reflection tells it. A variable without UPROPERTY is normal C++ and stays invisible to the editor and to Blueprints."
      - q: "How do you create the C++ actor class in the editor?"
        choices: ["With Add, then Blueprint Class", "With Edit, then Plugins", "With Tools, then New C++ Class", "With Window, then Output Log"]
        answer_index: 2
        explain: "New C++ Class in the Tools menu creates the files of the class and adds them to the project."
      - q: "How do you test your BlueprintCallable function in this quest?"
        choices: ["A Blueprint child of your class calls it on BeginPlay", "The Level Blueprint calls it on every frame", "The IDE calls it during the build", "A console command calls it from the Output Log window"]
        answer_index: 0
        explain: "You make a Blueprint child of the class, call the function on BeginPlay, and place the Blueprint in a level. The log line shows that the call reached your C++ code."
