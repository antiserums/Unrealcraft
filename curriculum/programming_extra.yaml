        choices: ["A function", "A custom event", "A Delay node", "A comment box"]
        answer_index: 0
        explain: "A function can have return values that the caller uses right away. A custom event has no return value."
      - q: "You need a behavior that waits two seconds and that another Blueprint can start. Which one do you pick?"
        choices: ["A function", "A custom event", "A macro", "An enum"]
        answer_index: 1
        explain: "A custom event can contain a Delay node and can be called from another Blueprint. A function cannot wait, and a macro cannot be reached from outside."
      - q: "Which of the three can have several execution output pins?"
        choices: ["A function", "A custom event", "A variable", "A macro"]
        answer_index: 3
        explain: "A macro can have more than one execution input and output. This is why flow control nodes that split the path are built as macros."
      - q: "Why do you build the same behavior three times in this quest?"
        choices: ["Because the editor needs all three to compile", "Because one of the three will be deleted by the engine later", "So you can compare their rules and pick the right one later", "So the behavior runs three times as fast"]
        answer_index: 2
