    required: true
    title: Live Coding vs full rebuild
    brief: "Live Coding is a feature that compiles your C++ changes while the editor is still open, so you do not have to restart it. It is fast, but it is safe only for some kinds of changes. Other changes need you to close the editor and build again, and if you do not, you can get bugs that are very hard to understand. In this quest you try both kinds of change and write your own rule for when to restart."
