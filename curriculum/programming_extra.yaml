    xp: 90
    verify_type: writeup
    quiz:
      - q: "Which pattern do most Unreal projects use to combine C++ and Blueprint?"
        choices: ["All of the logic in the Level Blueprint, and all of the data in C++ header files only", "One C++ class for each Blueprint node", "A C++ base class with the core logic, and a Blueprint child where designers set values", "Blueprints for the editor and C++ for the packaged game"]
        answer_index: 2
        explain: "The base class in C++ holds the logic that should not break. The Blueprint child is where designers set values and add small changes."
      - q: "What does the way you split the work between C++ and Blueprint decide?"
        choices: ["Who can change what without asking a programmer", "How many levels the game can have", "Which version of the engine the project uses", "How large the textures may be"]
        answer_index: 0
        explain: "Everything exposed to Blueprint can be changed by designers themselves. Everything kept in C++ needs a programmer."
      - q: "Which kind of work does the Epic page name as a strength of Blueprint?"
        choices: ["Tight loops over large sets of data", "Low-level access to external libraries and to the hardware", "Merging changes from many programmers", "Scripting behaviors and prototyping with fast iteration"]
        answer_index: 3
        explain: "Blueprint is quick to change and easy to read as a visual flow. That makes it good for defining behavior and for trying ideas."
      - q: "Which kind of work does the Epic page name as better done in C++?"
        choices: ["Setting the color of a single prop", "Core systems and code where performance matters, such as tight loops", "Trying out a new idea in ten minutes to see if it is any fun to play", "Choosing which mesh a pickup shows"]
        answer_index: 1
        explain: "C++ is the foundation for systems. The cost of Blueprint shows most in core code, tight loops, large data sets and many ticking instances."
      - q: "Why does C++ code run faster than Blueprint logic?"
        choices: ["C++ compiles to machine code, while Blueprint runs in a virtual machine", "C++ code is always shorter than a Blueprint graph that does the same work", "Blueprint only runs on every second frame", "C++ skips the collision checks"]
        answer_index: 0
        explain: "Machine code runs directly on the processor. Blueprint bytecode is run by a virtual machine, which adds a small cost to every node."
      - q: "Why is C++ easier to work on in a team with version control?"
        choices: ["C++ files cannot be edited by two people at one time", "C++ files are saved more often", "C++ is text, so changes are easy to compare and merge", "C++ files are smaller than textures"]
        answer_index: 2
        explain: "Text files can be compared line by line and merged. A Blueprint is a binary asset, where two edits cannot be combined that way."
      - q: "What is a specifier in the UPROPERTY macro?"
        choices: ["A comment for other programmers", "The type of the variable", "The default value that the variable has when the game starts", "A word that controls what the editor and Blueprints can do"]
        answer_index: 3
        explain: "Specifiers such as EditDefaultsOnly or BlueprintReadOnly set the access to a value. Choosing them is how you decide what designers may touch."
      - q: "What does the specifier EditDefaultsOnly allow?"
        choices: ["The value can be edited on every placed copy in the level, but not in the class", "The value can be edited in the class defaults, but not on placed copies", "The value can be edited only in C++", "The value can be edited only while the game runs"]
        answer_index: 1
        explain: "EditDefaultsOnly shows the value in the class defaults. A designer sets it once per Blueprint child, and single copies in the level cannot differ."
      - q: "What does the specifier BlueprintReadOnly allow?"
        choices: ["Blueprint graphs can read the value but not change it", "Blueprint graphs can change the value but not read it", "Blueprint graphs cannot see the value", "Blueprint graphs can delete the value"]
        answer_index: 0
        explain: "BlueprintReadOnly gives graphs a get node only. The value stays under the control of the C++ code."
      - q: "What is a delegate?"
        choices: ["A copy of a class in another module", "A variable that stores a number", "A signal that other code can listen to", "A person who reviews your code"]
        answer_index: 2
        explain: "A delegate announces that something happened. When Blueprints can assign to it, designers can react to that event without any change to the C++ code."
    flavors:
      _default: {why: "The split decides who can change what without a programmer.", do: "Sketch one split on paper first."}
      programming: {why: "This is the plan for your capstone.", do: "Expose only what designers need."}

