      level_design: {why: "At Rank 4 you ship a kit a Novice can place. Tunable actors are the start.", do: "Hand your BP to someone else and ask them to change a value without help."}
      gameplay_design: {why: "Tuning knobs from your GDD should be real fields, not numbers buried in a graph.", do: "Make every knob from GDQ6 an Instance Editable variable with a tooltip."}
      programming: {why: "The same idea as EditAnywhere on a UPROPERTY. Designers expect it.", do: "Note which of these you'd move to a C++ base later."}

