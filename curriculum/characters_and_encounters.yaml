  - id: LDQ35
    rank: 3
    difficulty: expert
    specializations: [level_design]
    subjects: [metrics, cover, sightlines]
    required_spine: false
    required: true
    title: Cover and sightline metrics
    brief: "Metrics are the measured numbers of your level, such as how high cover is and how far apart enemies and the player stand. Numbers are easier to talk about in a review than a feeling that something is wrong. A sightline is what a person can see from one place. In this quest you set two cover heights from the size of your character, measure the fighting distances in your arena, and check what each enemy can see."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-bookmarks"
    backup_url: TODO_URL
    backup_search: "level design cover height metrics engagement distance sightlines"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/viewport-controls-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/possessing-pawns-in-unreal-engine"
    checklist:
      - "Use your capsule numbers from quest AQ1 to choose two heights. Low cover is a height the standing player can see over. Full cover is a height that hides the whole capsule."
      - "Resize every cover piece in L_Arena_01 so that it has one of those two heights."
      - "Switch the viewport to the Top orthographic view. Drag with the middle mouse button to measure the distances between the enemy positions and the player cover. Write down a short, a mid and a long distance."
      - "At each enemy position, place a Camera Actor at the eye height of the enemy. Right-click the camera and choose Pilot to look through it, and check what it can see."
      - "Save a bookmark with Ctrl+1 to Ctrl+9 at each enemy view and at the player entry. A bookmark stores a camera position so you can come back to it. Then fix one sightline that is too open or too closed."
      - "Add the cover heights and the engagement distances, which are the distances at which the fight happens, to your metrics sheet."
    done_when: "Send your metrics sheet with the cover heights and engagement distances, and screenshots from before and after of the sightline you fixed."
    xp: 100
    verify_type: screenshot
    quiz:
      - q: "Where should cover heights come from?"
        choices: ["Your character's measured capsule and eye height", "Whatever looks nice", "The engine default grid size", "The Starter Content cube"]
        answer_index: 0
        explain: "Cover works only if it matches the character. Measure, then build to those numbers."
      - q: "How do you measure a distance quickly in the editor?"
        choices: ["Count grid squares on screen", "Middle-mouse drag in an orthographic viewport", "Use Print String", "Open the Outliner"]
        answer_index: 1
        explain: "The orthographic ruler shows the length in units (cm) as you drag."
      - q: "How can you check exactly what an enemy position can see?"
        choices: ["Lower the light intensity", "Hide all cover", "Place a camera at enemy eye height and pilot it, or bookmark that view", "Turn on wireframe"]
        answer_index: 2
        explain: "Look from the enemy's eye height, not the editor camera's."
      - q: "Cover is 110 cm tall and your standing player can't see over it. What's wrong?"
        choices: ["Nothing", "The NavMesh", "The lighting", "That piece is taller than your character's standing view line, so it acts as full cover"]
        answer_index: 3
        explain: "If players can't see over it, it's full cover. Decide which you want and build to that height."
      - q: "Why write engagement distances down?"
        choices: ["Epic requires it", "So spacing stays consistent across encounters and other people can tune against it", "It saves memory", "It speeds up NavMesh building"]
        answer_index: 1
        explain: "Written metrics are what let a team build spaces that play the same way."
    flavors:
      _default: {why: "Numbers you can measure are easier to discuss in critique than 'it feels off'."}
      level_design: {why: "Cover and sightlines are measurable. Measured spaces are easier to fix.", do: "Keep a bookmark per enemy view and walk them all after every layout change."}
      gameplay_design: {why: "Engagement distances decide which weapons and verbs matter.", do: "Note the range each of your verbs is designed for and check the arena supports it."}

  - id: GDQ6
    rank: 3
    difficulty: expert
    specializations: [level_design, gameplay_design]
    subjects: [gdd, documentation, encounter]
    required_spine: false
    required: true
    title: One-page GDD
    brief: "GDD is short for game design document, a text that describes what you plan to build. A one-page version is short enough that people really read it, and it lets a team review the idea before anyone spends time building it. In this quest you write one page about your arena encounter, which is the fight that happens in your arena."
    time_min: 45
    official_url: TODO_URL
    backup_url: TODO_URL
    backup_search: "one page game design document encounter template"
    checklist:
      - "Write one page for your arena encounter. Use these five headings: Goal, Player verbs, Beats, Fail state, Tuning knobs."
      - "Under Goal, write one sentence that says what the player should feel or learn."
      - "Under Beats, write 3 to 5 lines in the order they happen: enter, first contact, pressure, turn, exit. A beat is one step in how the fight goes."
      - "Under Tuning knobs, list every number you might change, such as enemy count, spawn delay, cover count and health. Write the current value next to each one."
      - "Add your screenshot from above from quest LDQ33. Share the document as a link that anyone can view."
    done_when: "Send a link to your one-page GDD with all five headings filled in."
    xp: 90
    verify_type: writeup
    quiz:
      - q: "What belongs under 'Goal' in an encounter GDD?"
        choices: ["The engine version", "A list of assets", "One sentence on what the player should feel or learn", "Every enemy's stats"]
        answer_index: 2
        explain: "One clear goal lets you judge every other choice against it."
      - q: "Which is a player verb?"
        choices: ["Flank", "Arena", "Lumen", "Cover height"]
        answer_index: 0
        explain: "Verbs are actions the player takes: move, shoot, flank, hide, pull."
      - q: "Why list tuning knobs with current values?"
        choices: ["It makes the doc look long", "So you and others know what to change and what it was before", "Epic requires it", "It isn't useful"]
        answer_index: 1
        explain: "When a playtest goes badly, the knob list is where you look first."
      - q: "Why keep the GDD to one page?"
        choices: ["Discord limits file size", "Longer docs are banned", "Nobody reads GDDs", "It forces you to choose what matters, and reviewers actually read it"]
        answer_index: 3
        explain: "A short doc gets read. A long one gets skimmed."
      - q: "What is a fail state?"
        choices: ["A bug", "How the player can lose, and what happens next", "A crash", "An empty Content Drawer"]
        answer_index: 1
        explain: "Say how they lose and where they restart. That shapes how hard you can make it."
    flavors:
      _default: {why: "Writing it down means the team can review the idea before anyone builds it."}
      level_design: {why: "The GDD is how you explain an encounter to someone who hasn't played it.", do: "Write the GDD before you polish the arena, then check the build against it."}
      gameplay_design: {why: "This is your main document. A knob list is your balance plan.", do: "Mark which knob you'd change first if the fight is too hard."}

  - id: GDQ7
    needs_others: true          # hidden and not required until the server has enough members
    rank: 3
    difficulty: expert
    specializations: [level_design, gameplay_design]
    subjects: [critique, iteration]
    required_spine: false
    required: true
    title: The critique loop
    brief: "A critique is feedback from other people on your work. Other people see problems that you have stopped noticing, so asking for critique is one of the fastest ways to improve a level. An iteration log is a list where you write down what feedback you got and what you did with it. In this quest you ask for critique on your arena, change something because of it, and give a critique to another person."
    time_min: 45
    official_url: "discord://#showcase"
    backup_url: TODO_URL
    backup_search: "how to give and receive game design critique"
    checklist:
      - "Post your arena in the #showcase channel with the tag Critique-wanted. Include a screenshot from above, one screenshot at eye level, and a link to your GDD."
      - "Ask one specific question in your post, for example 'Is the left flank too safe?'. Do not ask a general question such as 'thoughts?'."
      - "Start an iteration log. For each entry, write the date, the feedback you received, what you changed, and what you did not change and why."
      - "Make at least one change that is based on the feedback, and write it in your log."
      - "Give one critique on the /critique post of another person. Name 1 thing that works, 1 specific issue, and 1 next step."
    done_when: "Send a link to your /critique thread, your iteration log, and the critique you gave."
    xp: 80
    verify_type: writeup
    quiz:
      - q: "Which critique request gets the most useful answers?"
        choices: ["'Thoughts?'", "'Is it good?'", "'Rate 1–10'", "'Players keep ignoring the right flank. Is the entry to it too hidden?'"]
        answer_index: 3
        explain: "A specific question gets a specific answer."
      - q: "What goes in an iteration log entry?"
        choices: ["Only the changes you liked", "Date, feedback, what you changed, and what you didn't change and why", "Just screenshots", "The reviewer's rank"]
        answer_index: 1
        explain: "The log shows your reasoning. Mentors check it at the capstone."
      - q: "A reviewer suggests something that goes against your GDD's goal. What do you do?"
        choices: ["Ignore it silently", "Change the goal every time", "Reply with why you're keeping it, and log the decision", "Delete the post"]
        answer_index: 2
        explain: "Not every note needs a change. Every note needs an answer."
      - q: "What makes a good critique you give?"
        choices: ["One thing that works, one specific issue, one next step", "A long list of everything wrong", "Only emojis", "A rewrite of their level"]
        answer_index: 0
        explain: "Same format as SQ16, applied to encounters."
      - q: "Why include the GDD link with a critique post?"
        choices: ["The bot requires links", "Reviewers can judge the space against what you meant it to do", "To fill space", "So it gets more reactions"]
