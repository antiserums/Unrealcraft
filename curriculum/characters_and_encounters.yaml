      - "Open a project made from the Third Person template, or create one. Build one encounter space in a new level, or finish an arena you already have. It needs an entry, an exit, 6 to 10 cover pieces in two heights (low cover that the standing character can see over, and full cover that hides it), a flank route on each side, high ground with a cost, a Nav Mesh Bounds Volume that covers the floor, and 3 or more enemies. A simple enemy is a Character Blueprint with Auto Possess AI set to Placed in World or Spawned that walks to a Target Point with AI MoveTo."
      - "Make the space readable. Choose a color key with one color for threats, one for cover and one for objectives, make one Material Instance for each, and apply them. Light the exit so that it is the brightest thing the player sees from the entry."
      - "Write a one-page GDD (game design document) with the headings Goal, Player verbs, Beats, Fail state and Tuning knobs, or update the one you have, so that it matches what you built."
      - text: "Show the space to at least one other person with a screenshot from above and one at eye level, and ask one specific question. Write down the feedback you get."
        needs_others: true
      - text: "Make at least one change that comes from the feedback. Take a screenshot before and after from the same bookmark, and write the change in a short log."
        needs_others: true
      - "Record a short video clip (30 seconds or less) of one run in PIE from the entry to the exit. Also take a screenshot from above in the Top view and mark the entry, the exit, the cover, the flanks, the high ground and the enemy start points on it."
    done_when: "Send a short video clip (30 seconds or less) of one run in PIE, your marked map from above, your GDD as text or as a link that anyone can view, and screenshots from before and after the change you made after critique, with the feedback that led to it. A mentor reviews your work."
    done_when_solo: "PIE clip, annotated top-down map, GDD link, and one self-review change with before/after screenshots. Approved by a mentor."
    xp: 200
    verify_type: mentor
    quiz:
      - q: "Who approves a Rank 3 capstone?"
        choices: ["The Quartermaster automatically", "Nobody", "Any one reaction", "A mentor, or two peer approves"]
        answer_index: 3
        explain: "Rank 3+ capstones are reviewed by people, not by the quiz."
      - q: "What must the before/after show?"
        choices: ["Two different arenas", "The same view before and after a change made from critique, with the feedback that led to it", "Two lighting presets", "The editor theme"]
        answer_index: 1
        explain: "Same bookmark, one real change, and the feedback that prompted it."
      - q: "The GDD says 'three enemies flank' but your build has no flank route. What do you do before turn-in?"
        choices: ["Fix the build or update the GDD so they match", "Submit anyway", "Remove the GDD link", "Add more enemies"]
        answer_index: 0
        explain: "Reviewers check the build against the doc. They must agree."
      - q: "Does this capstone need any C++?"
        choices: ["Yes, the enemy AI", "Yes, the spawner", "No. Blueprint, layout and docs only", "Only for gameplay designers"]
        answer_index: 2
        explain: "Level designers are never gated on C++."
      - q: "What does the top-down map need to show?"
        choices: ["Nothing, a plain screenshot is fine", "Entry, exit, cover, flanks, high ground and spawn points, labeled", "Only the lights", "Only the NavMesh"]
        answer_index: 1
        explain: "The annotated map is how a reviewer understands the space before they watch the clip."
    flavors:
      _default: {why: "Brings together everything from the bay: layout, threats, metrics, doc, critique, readability."}
      level_design: {why: "This is the Expert capstone for Level Design. It's what you'll point to in a portfolio.", do: "Keep scope to one arena. A small, polished space passes more often than a big, rough one."}
      gameplay_design: {why: "A mechanic needs a space to be tested in. This proves your GDD works in a real layout.", do: "Make sure at least one GDD tuning knob visibly changes the fight, and show it in the clip."}

