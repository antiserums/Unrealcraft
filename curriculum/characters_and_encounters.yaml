    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/ai-perception-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "level design stealth space sightlines patrol routes"
    checklist: ["Open a project made from the Third Person template, or create one. If you have an arena level of your own, duplicate it and name the copy L_Arena_Stealth. If not, create a new level with that name and build a simple arena: a floor of about 30 x 30 m, one entry, one exit, 6 to 10 cubes as cover, and a Nav Mesh Bounds Volume that covers the floor.", "Add two or three patrolling enemies. A simple one is a Character Blueprint with Auto Possess AI set to Placed in World or Spawned that walks back and forth between two Target Points with AI MoveTo.", "Change the cover and the patrols so that the player can cross the arena without being seen. An enemy sees the player when there is a free line between them, the enemy faces that way, and nothing blocks the view.", "Take a screenshot from above and mark the patrol routes and the safe path on it."]
    done_when: "Send your marked screenshot from above, and a short video clip (30 seconds or less) or two to three screenshots from PIE of a crossing in which the player is not seen."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What does the player try to do in a stealth encounter?"
        choices: ["Beat all enemies as fast as possible", "Collect every pickup in the arena", "Get past the enemies without being seen", "Stay in one place until a timer ends"]
        answer_index: 2
        explain: "In stealth the goal is to stay unseen. This is why the level must work in a different way from a fight."
      - q: "What must cover do in a stealth level?"
        choices: ["Give the player more health", "Block what the enemies see", "Slow the enemies down", "Mark the exit of the arena"]
        answer_index: 1
        explain: "Cover in a stealth level is about sight. A piece of cover works when it breaks the line between an enemy and the player."
      - q: "What is a patrol?"
        choices: ["A group of enemies that appears together", "A place where the player is safe", "A volume that covers the floor", "The route that an enemy walks"]
        answer_index: 3
        explain: "A patrol is the route an enemy walks. In a stealth level the patrols must leave a path open for the player."
      - q: "How do you build a simple patrolling enemy?"
        choices: ["A Character Blueprint that walks between two Target Points with AI MoveTo", "A Static Mesh that moves on a Timeline", "A Pain Causing Volume that follows the player", "A Widget Blueprint that shows a warning"]
        answer_index: 0
        explain: "The enemy uses AI MoveTo to walk to one Target Point and then to the other, again and again. That gives a patrol the player can learn."
      - q: "What does setting Auto Possess AI to Placed in World or Spawned do for the enemy?"
        choices: ["The enemy is hidden until the player comes near", "The enemy is controlled by the keyboard of the player", "An AI controller takes control of the enemy, whether it is placed or spawned", "The enemy is deleted when the level starts"]
        answer_index: 2
