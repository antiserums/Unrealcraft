      - q: "When does an enemy see the player in this quest?"
        choices: ["When the player is anywhere inside the arena", "When the enemy faces the player and nothing blocks the line between them", "When the player stands still for too long", "When the player is closer than the nearest cover"]
        answer_index: 1
