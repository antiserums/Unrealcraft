  - id: AQ7
    rank: 3
    difficulty: expert
    specializations: [animation]
    subjects: [blendspace, locomotion]
    required_spine: false
    required: true
    title: Blend space from scratch
    brief: "A blend space is an asset that mixes several animations based on a value, most often the speed of the character. With it, a character changes smoothly from idle to walk to run, with no sudden switch. If the animations sit at the wrong speeds, the feet seem to slide over the ground. In this quest you build a blend space yourself and check it for foot sliding."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blend-spaces-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 create blend space 1d idle walk run from scratch"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-blueprints-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. The template character comes with idle, walk and run animations. The run animations have Jog in their names. In the Content Browser, click Add, then Animation, then Blend Space, and pick the Skeleton of your character. Open the new asset. In Asset Details, under Axis Settings, open Horizontal Axis, name it Speed, and set Maximum Axis Value to the Max Walk Speed of your character. You find Max Walk Speed on the Character Movement component in the Blueprint of the character."
      - "Drag an idle animation, a walk animation and a run animation from the Asset Browser onto the bottom line of the grid. Put each one at the speed it was authored for, which means the speed the animation was made to move at: idle at 0, and walk and run at their own speeds. Hold Ctrl and move the mouse over the grid to preview the blend."
      - "Make a copy of the AnimBP: right-click it and choose Duplicate. In the copy, select the Blend Space Player node and pick your blend space in its Details panel. Select the Mesh in the Blueprint of your character and set Anim Class to the copy. Play in the editor (PIE) and check whether the feet slide."
    done_when: "Send a screenshot of the blend space grid, and a short video clip (30 seconds or less) or two screenshots from PIE that show the character at walk speed and at run speed."
    xp: 100
    verify_type: screenshot
    quiz:
      - q: "What is a blend space?"
        choices: ["A level used to test animations", "A node that plays one animation in a loop", "An asset that mixes several animations based on a value", "A folder that holds the animations of one character"]
        answer_index: 2
        explain: "A blend space blends between animations as a value changes. The character moves smoothly from idle to walk to run, with no sudden switch."
      - q: "Which value most often drives a locomotion blend space?"
        choices: ["The health of the character", "The speed of the character", "The height of the camera", "The frame rate of the game"]
        answer_index: 1
        explain: "Idle, walk and run differ by speed. The speed of the character decides how much of each animation is used."
      - q: "How do you create a blend space in the Content Browser?"
        choices: ["Click Add, then Animation, then Blend Space, and pick the Skeleton", "Click Add, then User Interface, then Widget Blueprint", "Right-click a Skeletal Mesh and choose Create, then Control Rig", "Right-click an animation and choose Retarget Animations"]
        answer_index: 0
        explain: "Blend Space is in the Animation group of the Add menu. It must know the Skeleton, because it can only blend animations of that Skeleton."
      - q: "What do you set Maximum Axis Value of the Speed axis to?"
        choices: ["The number of animations in the blend space", "The length of the run animation in seconds", "The height of the character in centimeters", "The Max Walk Speed of your character"]
        answer_index: 3
        explain: "The axis should cover every speed the character can reach. Max Walk Speed is the top speed, so it is the right end of the axis."
      - q: "Where do you find Max Walk Speed?"
        choices: ["In the Asset Details of the blend space", "In the World Settings of the level", "On the Character Movement component in the Blueprint of the character", "On the Blend Space Player node"]
        answer_index: 2
        explain: "The Character Movement component holds the movement values of the character, and Max Walk Speed is one of them."
      - q: "What does it mean that an animation was authored for a speed?"
        choices: ["It can only be played at that frame rate", "It is the speed the animation was made to move at", "It is the time the animator needed to make it", "It is the speed at which the file is loaded"]
        answer_index: 1
        explain: "The steps in a walk or run animation fit one movement speed. At that speed, the feet match the ground."
      - q: "Where on the Speed axis do you put the idle animation?"
        choices: ["At 0", "At the Max Walk Speed", "In the middle of the axis", "Outside the grid"]
        answer_index: 0
        explain: "An idle character does not move, so idle belongs at speed 0. Walk and run go at the speeds they were authored for."
      - q: "In Play in Editor, the feet of the character slide over the ground. What is the likely cause?"
        choices: ["The blend space has no name", "The level has no Directional Light", "The Skeleton has too many bones", "The animations sit at the wrong speeds in the blend space"]
        answer_index: 3
        explain: "If an animation plays at a speed it was not made for, the steps do not match the distance the character travels. The feet then seem to slide."
      - q: "How do you preview the blend inside the blend space asset?"
        choices: ["Press F9 on the grid", "Hold Ctrl and move the mouse over the grid", "Double-click the Speed axis", "Drag the asset into the level"]
        answer_index: 1
        explain: "With Ctrl held, the preview point follows the mouse. The preview character shows the blend at that point of the grid."
      - q: "How do you make the copy of the AnimBP use your blend space?"
        choices: ["Rename the blend space to the name of the old one", "Drag the blend space onto the character in the level", "Select the Blend Space Player node and pick your blend space in its Details panel", "Set Maximum Axis Value to 0"]
        answer_index: 2
        explain: "The Blend Space Player node plays one blend space. After you pick yours, you set Anim Class on the Mesh of the character to the copied AnimBP."

  - id: AQ8
    rank: 3
    difficulty: expert
    specializations: [animation]
    subjects: [aim-offset]
    required_spine: false
    required: true
    title: Aim offsets
    brief: "An aim offset is an asset that bends the upper body of a character toward the direction the player is looking. It is made from additive poses, which are poses that are added on top of another animation and do not replace it. With it, a character can walk and aim up, down or to the side at the same time. In this quest you create an aim offset and put it on top of the walking animation."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/aim-offset-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 aim offset setup control rotation pitch yaw"
    checklist:
      - "Open a project made from the Third Person template, or create one. The template has no aim poses, so you make simple ones. Open the idle animation of the template character and pause it. In the Skeleton Tree, select a spine bone and rotate it so that the upper body leans up. Click Create Asset in the toolbar, choose Create Animation, then Current Pose, and name the new animation Aim_Up. Make Aim_Down, Aim_Left, Aim_Right and Aim_Center (no rotation) in the same way. If you already have aim poses, you can use those."
      - "Aim poses must be additive. Open each aim pose animation and, in Asset Details, set Additive Anim Type to Mesh Space and choose Aim_Center as the base pose. Then click Add, then Animation, then Aim Offset in the Content Browser, and pick the Skeleton of the character. In the new asset, set the horizontal axis to Yaw and the vertical axis to Pitch, both from -90 to 90, and drag each aim pose onto the grid at the direction it aims in."
      - "In the AnimBP of the character, read the pitch and the yaw from the control rotation: use Get Control Rotation on the owning Pawn and take the difference with the rotation of the Actor (the Delta Rotator node does this). Store the result in two variables named Pitch and Yaw. Pitch is looking up and down, yaw is looking left and right, and the control rotation is the direction the player is looking."
      - "In the AnimGraph, add an Aim Offset Player node for your asset. Connect the locomotion pose, which is the walking and running animation, to its Base Pose pin, connect the Pitch and Yaw variables, and connect the result to Output Pose. Then test looking up, down and to the sides."
    done_when: "Send a short video clip (30 seconds or less), or three screenshots from PIE, that show the character walking while it aims up, down and to one side."
    xp: 100
    verify_type: screenshot
    quiz:
      - q: "What is an aim offset?"
        choices: ["An asset that bends the upper body of a character toward the direction the player is looking", "A setting that moves the camera to the side of the character", "A node that fires a weapon at a target", "A marker on an animation that plays a sound"]
        answer_index: 0
        explain: "An aim offset blends aim poses so that the upper body follows the look direction. The character can walk and aim at the same time."
      - q: "What are additive poses?"
        choices: ["Poses that replace the animation below them", "Poses that only work on the legs", "Poses that are saved in a Data Table", "Poses that are added on top of another animation"]
        answer_index: 3
        explain: "An additive pose stores only a difference. It is added on top of another animation, such as walking, and does not replace it."
      - q: "How do you save a rotated spine pose as a new animation such as Aim_Up?"
        choices: ["Press Shift+P in the Skeleton Tree", "Click Create Asset, choose Create Animation, then Current Pose", "Right-click the animation and choose Retarget Animations", "Click Add, then Animation, then Blend Space"]
        answer_index: 1
        explain: "Create Asset, then Create Animation, then Current Pose saves the pose you see as an animation asset. You do this for each aim direction."
      - q: "Which Additive Anim Type do you set on each aim pose animation?"
        choices: ["No additive", "Local Space", "Mesh Space", "World Space"]
        answer_index: 2
        explain: "Aim poses for an aim offset use Mesh Space. You find the setting in the Asset Details of each aim pose animation."
      - q: "Which pose do you choose as the base pose of the additive aim poses?"
        choices: ["Aim_Center", "Aim_Up", "The run animation", "The jump animation"]
        answer_index: 0
        explain: "Aim_Center is the pose with no rotation. Each aim pose is stored as the difference from it."
      - q: "How do you set the two axes of the aim offset asset?"
        choices: ["Horizontal is Speed and vertical is Direction, both from 0 to 600", "Horizontal is Pitch and vertical is Yaw, both from 0 to 360", "Horizontal is Roll and vertical is Pitch, both from -180 to 180", "Horizontal is Yaw and vertical is Pitch, both from -90 to 90"]
        answer_index: 3
        explain: "Yaw is looking left and right, so it is the horizontal axis. Pitch is looking up and down, so it is the vertical axis."
      - q: "What is the control rotation?"
        choices: ["The rotation of the spine bone", "The direction the player is looking", "The rotation of the floor under the character", "The speed at which the character turns"]
        answer_index: 1
        explain: "The control rotation follows the mouse or stick of the player. It can differ from the rotation of the Actor, and that difference is what the aim offset shows."
      - q: "How does the AnimBP get the Pitch and Yaw values?"
        choices: ["It reads Max Walk Speed from the Character Movement component", "It reads the position of the Aim Offset Player node", "It takes the difference between the control rotation and the rotation of the Actor", "It counts the aim poses on the grid"]
        answer_index: 2
        explain: "Get Control Rotation on the owning Pawn gives the look direction. The Delta Rotator node gives its difference to the Actor rotation, and you store the result in Pitch and Yaw."
      - q: "What do you connect to the Base Pose pin of the Aim Offset Player node?"
        choices: ["The locomotion pose of the character", "The Aim_Up pose", "The Pitch variable", "The Output Pose node"]
        answer_index: 0
        explain: "The aim offset is added on top of its base pose. With the locomotion pose as the base, the character keeps walking while the upper body aims."
      - q: "The character aims correctly, but it no longer walks or runs. What do you check first?"
        choices: ["That the axes go from -90 to 90", "That the locomotion pose is connected to the Base Pose pin", "That Aim_Center has no rotation", "That the Pitch variable is a Float"]
        answer_index: 1
        explain: "Without a base pose the node has nothing to add the aim onto. The walking and running animation must enter through the Base Pose pin."

