      level_design: {why: "Cover and sightlines are measurable. Measured spaces are easier to fix.", do: "Keep a bookmark per enemy view and walk them all after every layout change."}
      gameplay_design: {why: "Engagement distances decide which weapons and verbs matter.", do: "Note the range each of your verbs is designed for and check the arena supports it."}

  - id: GDQ6
    rank: 3
    difficulty: expert
    specializations: [level_design, gameplay_design]
    subjects: [gdd, documentation, encounter]
    required_spine: false
    required: true
    title: One-page GDD
    brief: "GDD is short for game design document, a text that describes what you plan to build. A one-page version is short enough that people really read it, and it lets a team review the idea before anyone spends time building it. In this quest you write one page about an arena encounter, which is a fight that happens in one arena."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-framework-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "one page game design document encounter template"
    checklist:
      - "Choose an arena encounter to write about: one that you have built, or one that you plan to build. Write one page for it. Use these five headings: Goal, Player verbs, Beats, Fail state, Tuning knobs."
      - "Under Goal, write one sentence that says what the player should feel or learn."
      - "Under Beats, write 3 to 5 lines in the order they happen: enter, first contact, pressure, turn, exit. A beat is one step in how the fight goes."
      - "Under Tuning knobs, list every number you might change, such as enemy count, spawn delay, cover count and health. Write the current value next to each one."
      - "Add a picture of the arena from above. This can be a screenshot from the Top view if you have built it, or a simple sketch if you have not. Then paste the page as text into your proof, or share the document as a link that anyone can view."
    done_when: "Send your one-page GDD with all five headings filled in, as text or as a link that anyone can view."
    xp: 90
    verify_type: writeup
    quiz:
      - q: "What belongs under 'Goal' in an encounter GDD?"
        choices: ["The engine version", "A list of assets", "One sentence on what the player should feel or learn", "Every enemy's stats"]
        answer_index: 2
        explain: "One clear goal lets you judge every other choice against it."
      - q: "Which is a player verb?"
        choices: ["Flank", "Arena", "Lumen", "Cover height"]
        answer_index: 0
        explain: "Verbs are actions the player takes: move, shoot, flank, hide, pull."
      - q: "Why list tuning knobs with current values?"
        choices: ["It makes the doc look long", "So you and others know what to change and what it was before", "Epic requires it", "It isn't useful"]
        answer_index: 1
        explain: "When a playtest goes badly, the knob list is where you look first."
      - q: "Why keep the GDD to one page?"
        choices: ["A second page costs extra", "Longer docs are banned", "Nobody reads GDDs", "It forces you to choose what matters, and reviewers actually read it"]
        answer_index: 3
        explain: "A short doc gets read. A long one gets skimmed."
      - q: "What is a fail state?"
        choices: ["A bug", "How the player can lose, and what happens next", "A crash", "An empty Content Drawer"]
        answer_index: 1
        explain: "Say how they lose and where they restart. That shapes how hard you can make it."
    flavors:
      _default: {why: "Writing it down means the team can review the idea before anyone builds it."}
      level_design: {why: "The GDD is how you explain an encounter to someone who hasn't played it.", do: "Write the GDD before you polish the arena, then check the build against it."}
      gameplay_design: {why: "This is your main document. A knob list is your balance plan.", do: "Mark which knob you'd change first if the fight is too hard."}

  - id: GDQ7
    needs_others: true          # hidden and not required until the server has enough members
    rank: 3
    difficulty: expert
    specializations: [level_design, gameplay_design]
    subjects: [critique, iteration]
    required_spine: false
    required: true
    title: The critique loop
    brief: "A critique is feedback from other people on your work. Other people see problems that you have stopped noticing, so asking for critique is one of the fastest ways to improve a level. An iteration log is a list where you write down what feedback you got and what you did with it. In this quest you ask for critique on a level you built, change something because of it, and give a critique to another person."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/taking-screenshots-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "how to give and receive game design critique"
    checklist:
      - "Pick a level that you built, for example an arena. If you have none, graybox a small arena first: a floor of about 30 x 30 m, one entry, one exit and 6 to 10 cubes as cover. Show it to at least one other person, such as another learner or a friend. Show a screenshot from above and one screenshot at eye level, and say in one sentence what the space is for."
      - "Ask one specific question, for example 'Is the left flank too safe?'. Do not ask a general question such as 'thoughts?'."
      - "Start an iteration log. For each entry, write the date, the feedback you received, what you changed, and what you did not change and why."
      - "Make at least one change that is based on the feedback, and write it in your log."
      - "Give one critique on the work of another person. If nobody has work to show you, critique the sample level of the Third Person template as if another learner had built it. Name 1 thing that works, 1 specific issue, and 1 next step."
    done_when: "Send three things on this page: the question you asked together with your screenshots, your iteration log, and the text of the critique you gave."
    xp: 80
    verify_type: writeup
    quiz:
      - q: "Which critique request gets the most useful answers?"
        choices: ["'Thoughts?'", "'Is it good?'", "'Rate 1–10'", "'Players keep ignoring the right flank. Is the entry to it too hidden?'"]
        answer_index: 3
        explain: "A specific question gets a specific answer."
      - q: "What goes in an iteration log entry?"
        choices: ["Only the changes you liked", "Date, feedback, what you changed, and what you didn't change and why", "Just screenshots", "The reviewer's rank"]
        answer_index: 1
        explain: "The log shows your reasoning. Mentors check it at the capstone."
      - q: "A reviewer suggests something that goes against your GDD's goal. What do you do?"
        choices: ["Ignore it silently", "Change the goal every time", "Reply with why you're keeping it, and log the decision", "Delete the post"]
        answer_index: 2
        explain: "Not every note needs a change. Every note needs an answer."
      - q: "What makes a good critique you give?"
        choices: ["One thing that works, one specific issue, one next step", "A long list of everything wrong", "Only emojis", "A rewrite of their level"]
        answer_index: 0
        explain: "This format is short, kind and useful: the other person learns what to keep, what to fix, and what to do next."
      - q: "Why do you say what the space is for when you ask for critique?"
        choices: ["Because long posts look better", "Reviewers can judge the space against what you meant it to do", "To fill space", "So it gets more reactions"]
        answer_index: 1
        explain: "Without the goal, reviewers critique the level they would have made instead."
    flavors:
      _default: {why: "Other people see problems you've stopped noticing. Critique is how you get that."}
      level_design: {why: "Your capstone needs one critique iteration. This is the practice run.", do: "Ask about the one part of your arena you're least sure of."}
      gameplay_design: {why: "Mechanics feel different to someone who didn't design them.", do: "Ask one question about a tuning knob, not about the layout."}

  - id: LDQ36
    rank: 3
    difficulty: expert
    specializations: [level_design]
    subjects: [readability, color-language, lighting]
    required_spine: false
    required: true
    title: Readability pass 2
    brief: "Readability means that a player can understand a space with one look: where the danger is, where to hide, and where to go. If the player cannot read the space, your design does not reach them. Color and light are your main tools for this. In this quest you choose a small color key, apply it to an arena, and test that it still works when the picture has no color."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/features-and-properties-of-lights-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "level design color language readability lighting guide player"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/instanced-materials-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/decal-actors-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open an arena level of your own, or build a simple one in a new level: a floor of about 30 x 30 m, one entry, one exit, 6 to 10 cubes as cover, two or three cubes that stand for enemies, and one cube that stands for the objective. Write a color key of 3 lines: one color for threats, one color for cover or things you can climb, and one color for objectives."
      - "Make one Material Instance for each color and name them MI_Read_Threat, MI_Read_Cover and MI_Read_Objective. A Material Instance is a copy of a material with its own values. You can make them from any material that has a color parameter, or make a simple material with one color parameter first. Apply them in your arena."
      - "Change the value, which is the brightness, as well as the hue of each color. This way the key still works in grayscale, a picture with only shades of gray."
      - "Light the exit and the main objective so that they are the brightest things the player sees from the entry."
      - "Save a camera bookmark at the entry with Ctrl+1 and take a screenshot from it. Then convert it to grayscale in any image tool and check that threats, cover and objectives still stand out."
    done_when: "Send your color key, and the entry screenshot both in color and in grayscale."
    xp: 100
    verify_type: screenshot
    quiz:
      - q: "Why check your readability pass in grayscale?"
        choices: ["Grayscale renders faster", "Epic requires it", "If it only works by hue, color-blind players and dark scenes lose it. Value contrast survives.", "It hides errors"]
        answer_index: 2
        explain: "Value (light vs dark) is read before hue. Build the key on both."
      - q: "What makes a color language work?"
        choices: ["Using it the same way every time", "Using as many colors as possible", "Changing it per room", "Only using red"]
        answer_index: 0
        explain: "If yellow means climbable once, it has to mean climbable everywhere."
      - q: "What's usually the brightest thing in view at the entry?"
        choices: ["The ceiling", "The next goal or exit", "A random prop", "The skybox"]
        answer_index: 1
        explain: "Players are drawn to light. Put it where you want them to go."
      - q: "You color 30 props as objectives. What happens?"
        choices: ["The level gets easier", "Nothing", "Performance improves", "Nothing stands out anymore, so the key stops working"]
        answer_index: 3
        explain: "A signal only works if it's rare. Keep it for what matters."
      - q: "Fastest way to recolor all threat markers at once?"
        choices: ["Edit each mesh", "Change the parameter in the shared Material Instance", "Rebuild lighting", "Rename the assets"]
        answer_index: 1
        explain: "Everything using MI_Read_Threat updates together."
    flavors:
      _default: {why: "If the player can't read the space, the design doesn't come across."}
      level_design: {why: "R1 lit for navigation. Now you light and color for combat decisions.", do: "Mark every threat, cover and objective with your key, and nothing else."}
      gameplay_design: {why: "Players can't use a verb on something they can't see.", do: "Check that every interactable in your mechanic uses the objective color."}

  - id: GDQ8
    rank: 3
