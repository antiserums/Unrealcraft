  - id: GDQ10
    rank: 3
    difficulty: expert
    specializations: [gameplay_design, level_design]
    subjects: [spawning, blueprint]
    required: false
    title: Spawn waves with a BP spawner
    brief: "A spawner is an actor that creates enemies while the game runs. A wave is a group of enemies that appears together, and the next wave starts after the current one is beaten. With a spawner you can change the size and timing of a fight by changing a few numbers. In this quest you build a wave spawner Blueprint with values that can be edited in the Details panel."
