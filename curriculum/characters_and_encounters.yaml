        explain: "The right-click menu of an animation sequence has Create, then Create AnimMontage. The new montage holds that sequence."
      - q: "Where in the montage do you add a notify?"
        choices: ["In the Rig Hierarchy tab", "In the Notifies track, with a right-click at the frame you want", "In the Class Defaults of the character", "In the Stats panel"]
        answer_index: 1
        explain: "The Notifies track runs along the timeline. A right-click at a frame opens Add Notify for exactly that frame."
      - q: "Which kind of notify is sent to the Play Montage node?"
        choices: ["Play Sound", "Any notify with the name Hit", "Montage Notify", "Every notify on the Notifies track"]
        answer_index: 2
        explain: "Only a Montage Notify reaches the On Notify Begin pin of Play Montage. Other kinds, such as Play Sound, do their own job and are not sent to that node."
      - q: "What must the AnimGraph of the character have so that the montage can play?"
        choices: ["A Print String node after the Output Pose node", "A Timeline node with Loop turned on", "A Blend Space Player node with a Speed axis", "A Slot 'DefaultSlot' node before the Output Pose node"]
        answer_index: 3
