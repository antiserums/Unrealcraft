    title: Stealth variant
    brief: "In a stealth encounter the player tries to get past the enemies without being seen, so the level works in a different way from a fight. Cover must block what the enemies see, and patrols, the routes that enemies walk, must leave a path open. In this quest you take an arena and change it into a stealth version."
