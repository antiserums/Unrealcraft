  - id: LDQ33
    rank: 3
    difficulty: expert
    specializations: [level_design]
    subjects: [encounter, combat-space, layout]
    required_spine: false
    required: true
    title: Anatomy of a combat space
    brief: "A combat space, or arena, is a part of a level that is built for a fight. Almost every combat game builds its arenas from the same parts: an entry, an exit, cover to hide behind, side routes called flanks, and high ground. When you can name these parts, you can give and get feedback much faster. In this quest you graybox one arena, which means building it from simple blocks, and you mark its parts on a picture."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-designer-quick-start-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "level design combat arena cover flanking high ground layout"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/modeling-mode-quick-start-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Create a new level named L_Arena_01. Graybox one arena of about 30 x 30 m with one entry and one exit."
      - "Place a view point just inside the entry. This is a spot where the player can stand and read the space before anyone shoots."
      - "Add 6 to 10 cover pieces. Make some of them low and some of them full height. Make sure that no single piece of cover is safe from every direction."
      - "Add at least one flank route on each side, which is a path that leads around the middle of the fight. Add one high-ground position that has a cost, for example exposed stairs or little cover."
      - "Take a screenshot from above in the Top orthographic view, a flat view with no perspective. Open it in any paint tool and mark the entry, the exit, the flanks, the high ground and the cover."
    done_when: "Send your marked screenshot from above, and one screenshot taken at eye level from the entry."
    xp: 100
    verify_type: screenshot
    quiz:
      - q: "Enemies can see the entry doorway from every position. What's the main problem?"
        choices: ["The level is too dark", "The player is shot before they can read the space", "NavMesh won't build", "It's too easy"]
        answer_index: 1
        explain: "Give the player a safe moment at the entry to see the layout before combat starts."
      - q: "A long lane with cover only down the middle and no side routes tends to play as…"
        choices: ["A static shooting gallery where players just trade shots", "A stealth level", "A puzzle", "A flanking playground"]
        answer_index: 0
        explain: "Flanks give both the player and the AI choices. Without them the fight turns into trading shots."
      - q: "Your high ground wins every fight. What's a good fix?"
        choices: ["Delete it", "Put an invisible wall on it", "Give it a cost: an exposed approach, less cover, or a sightline that covers it", "Make it darker"]
        answer_index: 2
        explain: "High ground should be worth taking but not free to hold."
      - q: "Why mix low and full-height cover?"
        choices: ["It's cheaper to render", "Only low cover counts", "Full cover breaks navigation", "Low cover lets players shoot over it; full cover lets them reset safely. The mix creates choices."]
        answer_index: 3
        explain: "Different cover heights support different actions: peeking and firing versus hiding and healing."
      - q: "What does a clearly visible but gated exit do for the encounter?"
        choices: ["Nothing", "Tells the player the goal and when the fight is over", "Lowers frame rate", "Replaces the need for cover"]
        answer_index: 1
        explain: "Players fight better when they know where they're going next."
    flavors:
      _default: {why: "Every combat game uses these parts. Learning to name them makes feedback faster."}
      level_design: {why: "Cover, flanks and high ground are the parts you'll arrange in every encounter from now on.", do: "Mark every part on the top-down. If you can't label a piece, ask why it's there."}
      gameplay_design: {why: "The space decides which of your verbs are worth using.", do: "Write next to the map which player verb each area rewards."}

  - id: LDQ34
    rank: 3
    difficulty: expert
    specializations: [level_design]
    subjects: [ai, navmesh, spawning]
    required_spine: false
    required: true
    title: Placing threats
    brief: "Enemies are part of the level layout, because where they start changes how the fight plays. To move on their own, enemies need a NavMesh, which is a map of the floor areas where the AI can walk, and an AI controller, which is the part that steers them. In this quest you add a NavMesh to an arena, create a simple enemy, and place hidden spawn points for it."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/basic-navigation-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 navmesh bounds volume ai move to beginner"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/navigation-system-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/behavior-trees-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-08-create-an-enemy-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open an arena level of your own, or build a simple one in a new level: a floor of about 30 x 30 m with walls around it, one entry, one exit, and 6 to 10 cubes as cover. Add a Nav Mesh Bounds Volume that covers the whole arena. Press P to show the NavMesh, and fix any gaps near cover and doorways."
      - "Create a Blueprint named BP_Enemy with Character as its parent class. Set its Auto Possess AI property to 'Placed in World or Spawned', so that the enemy always gets an AI controller."
      - "Give the enemy a simple loop that uses AI MoveTo to walk between two target points. If you would rather use a Behavior Tree, which is an asset that describes what an AI decides to do, follow the Create an Enemy tutorial or the Behavior Trees page linked on this quest."
      - "If you use a Behavior Tree, open it and write one line for each node that says what the node does."
      - "Place 3 spawn points that the player cannot see from the entry. Mark each one with a simple arrow or billboard that is visible in the editor."
      - "Play in the editor (PIE) and watch each enemy reach its first position. Fix any enemy that gets stuck."
    done_when: "Send a screenshot with the NavMesh shown (press P) and the spawn points visible, and a short video clip (30 seconds or less) or two screenshots from PIE of the enemies moving into position."
    xp: 120
    verify_type: screenshot
    quiz:
      - q: "An enemy with AI MoveTo just stands still. What do you check first?"
        choices: ["Its material", "The light's mobility", "NavMesh covers the path, and the pawn is possessed by an AI controller", "Project packaging settings"]
        answer_index: 2
        explain: "No NavMesh or no AI controller are the two common causes. Press P and check Auto Possess AI."
      - q: "What does pressing P in the editor viewport do?"
        choices: ["Plays the level", "Toggles the NavMesh display", "Pins the actor", "Opens Project Settings"]
        answer_index: 1
        explain: "Green areas are walkable for the AI. Gaps show where AI can't go."
      - q: "Enemies spawned with Spawn Actor from Class don't move, but placed ones do. The likely cause?"
        choices: ["Auto Possess AI is set to 'Placed in World' only", "They need a Player Start", "Spawned actors can't use NavMesh", "Lumen is off"]
        answer_index: 0
        explain: "Set Auto Possess AI to 'Placed in World or Spawned' (or use Spawn AI From Class) so spawned pawns get a controller."
      - q: "In a Behavior Tree, how does a Sequence node behave?"
        choices: ["Runs children until one succeeds", "Runs one random child", "Runs only the rightmost child", "Runs children left to right and stops when one fails"]
        answer_index: 3
        explain: "Sequence stops on a failure. A Selector stops on the first success."
      - q: "Where should most spawn points be?"
        choices: ["Directly behind the player with no warning", "Out of the player's view, with a clear direction the threat arrives from", "Inside cover pieces", "On the exit"]
        answer_index: 1
        explain: "Spawns the player sees happen feel cheap. Spawns behind them with no warning feel unfair. Telegraph the direction."
    flavors:
      _default: {why: "Enemies are part of the level layout. Where they start changes how the fight plays."}
      level_design: {why: "You don't need to write AI. You need to know where it can walk and where it starts.", do: "Keep NavMesh (P) visible while you move cover. Every change can open or close an AI path."}
      gameplay_design: {why: "Threat placement is the first tuning knob of any encounter.", do: "Try the same 3 enemies at two different spawn layouts and write down which fight felt better."}
      programming: {why: "Designers will place your AI. Knowing what they need saves you rework.", do: "Note one thing about the provided tree you'd expose to designers."}

