        answer_index: 2
        explain: "The marked picture shows your plan: where the enemies walk and where the player can cross unseen."
      - q: "What must the clip or the screenshots from Play in Editor show?"
        choices: ["The player beating all the enemies", "The enemies standing still", "The arena without any cover", "A crossing in which the player is not seen"]
        answer_index: 3
