      - q: "How do you create the montage AM_Action from an animation sequence?"
        choices: ["Right-click the sequence and choose Create, then Create AnimMontage", "Drag the sequence into the level", "Open the sequence and press Shift+P", "Click Add, then Animation, then Aim Offset"]
