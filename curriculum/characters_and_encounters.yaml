# Unrealcraft — Rank 3 "Expert", Level Design path (Design Specialty)
# Shared characters-anim track (AQ1..03 required for every specialization; AQ4..08 animation specialization, stubbed)
# plus the bay-design track (required for level_design and gameplay_design) and Design electives.
# URL prefix: https://dev.epicgames.com/documentation/en-us/unreal-engine/
# Verified slugs only (see VERIFIED_URLS.md). Backup videos are TODO_URL until a human picks a dated UE5+ video.
# The Expert 1.25x in-Specialty XP multiplier is applied by the Quartermaster, not here.
# Rank 3+ capstone verification: one mentor approve OR two peer approves (verify_type: mentor).

quests:
  # ------------ Shared characters-anim track (required for all specializations) ------------
  - id: AQ1
    rank: 3
    difficulty: expert
    specializations: [all]
    subjects: [character, movement, metrics]
    required_spine: false
    required: true
    title: Character anatomy
    brief: "A playable character in Unreal is built from a few parts: a Capsule that is its real collision shape, a Mesh that is only the visible model, and a CharacterMovement component that holds numbers such as walk speed and jump strength. Every room, stair and gap in a level must fit these numbers, so you need to know them. In this quest you read the numbers of the Third Person template character and test them on stairs, ramps and a ledge."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-a-character-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 character movement component max walk speed jump z step height walkable floor angle"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/third-person-template-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/collision-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open the character Blueprint BP_ThirdPersonCharacter. In the Components panel, find the Capsule, the Mesh and CharacterMovement."
      - "Select the Capsule and write down its Half Height and its Radius. These two numbers are the real collision size of your character."
      - "Select CharacterMovement. In the Details panel, find the settings Max Walk Speed, Jump Z Velocity, Max Step Height and Walkable Floor Angle."
      - "Create a new level with File, New Level, Basic. In it, build a stair from cubes with 3 steps whose risers are 20, 40 and 60 cm high. A riser is the vertical front of a step. Also build three ramps with angles of 30°, 45° and 55°, and one ledge that is about 150 cm high."
      - "Play in the editor (PIE) and note which steps and ramps you can walk up. Then change Max Step Height or Walkable Floor Angle one time and test again."
      - "Set Jump Z Velocity to two times its value and jump onto a ledge. Then set it back to the old value. Note the ledge height you could reach with each value."
    done_when: "Send a screenshot of the CharacterMovement Details panel that shows your four values. Add a note of 3 lines: the capsule size, the highest step you could climb, and the steepest ramp you could walk up."
    xp: 90
    verify_type: screenshot
    quiz:
      - q: "What actually collides with walls and floors when a Character moves?"
        choices: ["The skeletal mesh", "The capsule component", "The camera boom", "Every bone's physics body"]
        answer_index: 1
        explain: "CharacterMovement sweeps the capsule. The mesh is visual. Build doorways and gaps to the capsule's size."
      - q: "The player walks into a 55 cm ledge and stops dead, but you want them to walk up it. Which setting?"
        choices: ["Jump Z Velocity", "Walkable Floor Angle", "Max Walk Speed", "Max Step Height"]
        answer_index: 3
        explain: "Max Step Height is the tallest step the capsule climbs without jumping. Be careful: raising it also lets players climb props you meant as barriers."
      - q: "The player slides down a ramp you meant to be walkable. Which setting decides that?"
        choices: ["Walkable Floor Angle", "Gravity Scale", "Max Step Height", "Braking Deceleration"]
        answer_index: 0
        explain: "Surfaces steeper than Walkable Floor Angle count as walls or slides. Build ramps under it, or change the value for the whole character."
      - q: "Max Walk Speed is measured in…"
        choices: ["Meters per second", "Tiles per turn", "Centimeters per second", "Units per frame"]
        answer_index: 2
        explain: "Unreal units are cm, so 600 means 6 m/s. Divide a corridor length by it to get the seconds it takes to cross."
      - q: "What mostly sets how high the character can jump?"
        choices: ["Capsule Half Height", "Jump Z Velocity, together with the character's gravity scale", "Max Step Height", "Walkable Floor Angle"]
        answer_index: 1
        explain: "Jump Z is the upward launch speed. Gravity pulls it back down. Change either and every jump gap in your level changes too."
    flavors:
      _default: {why: "Every space, animation and system is built around these few numbers."}
      level_design: {why: "Step height, jump height and floor angle decide which ledges are paths and which are walls.", do: "Keep your measured values at the top of your metrics sheet and check every blockout against them."}
      gameplay_design: {why: "Walk speed and jump height set the pace of every mechanic you tune.", do: "Record the values you test with so your tuning notes can be reproduced."}
      programming: {why: "CharacterMovement is the component your gameplay code will read and change more than any other.", do: "Note which values you'd want exposed to designers, not hard-coded."}
      lookdev: {why: "Capsule and walk speed tell you how close the player gets to your surfaces and how fast they pass.", do: "Walk past your detail at Max Walk Speed and see what the player actually notices."}
      animation: {why: "Walk speed and jump height must match the animations or feet slide and jumps look wrong.", do: "Write down the speeds your walk and run cycles need to match."}

  - id: AQ2
    rank: 3
    difficulty: expert
    specializations: [all]
    subjects: [animbp, state-machine, blendspace]
    required_spine: false
    required: true
    title: Read an Animation Blueprint
    brief: "An Animation Blueprint, often called an AnimBP, is the asset that decides which animation a character plays at each moment. You do not need to build one to learn from it. When you can read one, you understand why a character moves the way it does and where to look when the animation is wrong. In this quest you open the Animation Blueprint of the Third Person template character, read its parts, and watch it work while you play."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-blueprints-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 animation blueprint explained state machine blendspace ground speed"
    checklist:
      - "Open a project made from the Third Person template, or create one. Find out which AnimBP the character uses. To do this, open BP_ThirdPersonCharacter, select the Mesh component and look at the Anim Class property."
      - "Open that AnimBP. In the Event Graph, find the node Event Blueprint Update Animation. Follow the nodes after it to see how it reads the velocity of the pawn, which is the character, and stores it in a speed variable."
      - "In the AnimGraph, open the locomotion state machine, which is the graph that switches between states such as idle and jump. List every state, and click each transition to read its rule."
      - "Open the blendspace that is used for idle, walk and run. A blendspace mixes several animations based on a value such as speed. Move the preview point along the speed axis and watch the animations blend."
      - "Play in the editor (PIE). Then, in the AnimBP, pick your character in the debug object dropdown. Watch the speed variable and the active state change while you run and jump."
    done_when: "Send a screenshot of the AnimBP in debug mode during PIE with the speed value visible. Add a list of the states and their transition rules."
    xp: 90
    verify_type: screenshot
    quiz:
      - q: "Where does an Animation Blueprint usually read the character's speed?"
        choices: ["In the Level Blueprint", "In the AnimGraph's Output Pose node", "In the Event Graph, on Event Blueprint Update Animation, from the pawn's velocity", "In the skeletal mesh asset"]
        answer_index: 2
        explain: "The Event Graph gathers data (velocity, falling) every update. The AnimGraph uses those variables to pick poses."
      - q: "What does a blendspace do?"
        choices: ["Blends between animations based on one or two input values, like speed", "Plays one animation once from Blueprint", "Retargets animation to a new skeleton", "Stores collision for the character"]
        answer_index: 0
        explain: "Feed it speed and it blends idle into walk into run. No hard switch between them."
      - q: "A state machine transition rule must return…"
        choices: ["A float", "An animation asset", "A montage", "A boolean: true means take the transition"]
        answer_index: 3
        explain: "Rules such as 'IsFalling' or 'Speed > 3' decide when to switch states."
      - q: "How do you see live AnimBP values while the game runs?"
        choices: ["Recompile during PIE", "Pick the running character in the AnimBP's debug object dropdown", "Press F8 twice", "Open the Output Log only"]
        answer_index: 1
        explain: "With a debug object selected, the graphs show the values and the active state as you play."
      - q: "Your character slides while playing the idle pose. The likely cause?"
        choices: ["The speed variable isn't updating, so the blendspace stays at idle", "Lumen is off", "The capsule is too big", "The level has no Player Start"]
        answer_index: 0
        explain: "If the AnimBP never gets the real speed, the pose never changes. Check the Event Graph and the debug values first."
    flavors:
      _default: {why: "You don't need to build an AnimBP to read one. Reading it tells you why a character moves the way it does."}
      level_design: {why: "When a character looks wrong in your space, you can tell whether it's your geometry or the AnimBP.", do: "Run a ramp and a drop in your level while watching the state machine in debug."}
      gameplay_design: {why: "Speed and state variables are where feel lives between input and animation.", do: "Note which AnimBP variable you'd hook a new mechanic into."}
      programming: {why: "Your movement code feeds this graph. The Event Graph is where the two meet.", do: "Trace one variable from the pawn to the AnimGraph and note where it's set."}
      lookdev: {why: "You'll frame and light characters. Knowing the states tells you which poses you'll actually see.", do: "List the states a player sees most often in a normal walk."}
      animation: {why: "This is your home graph. Read Epic's before you build your own.", do: "Sketch the state machine on paper before you build one of your own."}

  - id: AQ3
    rank: 3
    difficulty: expert
    specializations: [all]
    subjects: [montage, interaction, blueprint]
    required_spine: false
    required: true
    title: Montage on interact
    brief: "An Animation Montage is an animation asset that gameplay code can start at any moment, for example when the player pulls a lever. A world that answers with the body of the character feels much more solid than one that only prints a message. A montage plays through a Slot node in the Animation Blueprint, and without that node nothing is shown. In this quest you build a lever that makes the character play a montage and then changes something in the level."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-montage-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 play montage blueprint interact lever"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-interface-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/enhanced-input-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. In the Content Browser, right-click any animation sequence of the template character. Choose Create, then Create AnimMontage, and name the new asset AM_PullLever."
      - "Open the AnimBP of the character. Look in the AnimGraph for a Slot 'DefaultSlot' node before the Output Pose node. If there is none, add one."
      - "Build a Blueprint named BP_Lever. Give it a mesh and a Box collision, and add an overlap check so that the lever only works when the player is close."
      - "When the player interacts, through an Enhanced Input action or a key event, get the player character. Then call Play Montage and give it the character's Mesh and AM_PullLever."
      - "Connect the On Completed pin of Play Montage, which fires when the animation has finished. From this pin, flip the lever and do one thing in the level, for example turn on a Point Light that you placed, or hide a cube that blocks a doorway."
      - "Play in the editor (PIE) and pull the lever. Then pull it while the character is running and note what happens."
    done_when: "Send a short video clip (30 seconds or less) that shows the character pulling the lever, or two screenshots from PIE, one before and one after. Also send a screenshot of the lever graph."
    xp: 110
    verify_type: screenshot
    quiz:
      - q: "Play Montage fires but the character doesn't move. What do you check first?"
        choices: ["The lever's material", "The AnimBP has a Slot node for the montage's slot, and the montage uses the same skeleton", "Lumen settings", "The level's World Settings"]
        answer_index: 1
        explain: "A montage plays through a slot. No matching Slot node in the AnimGraph means nothing shows."
      - q: "Which Play Montage output should trigger 'lever done, open the door'?"
        choices: ["On Interrupted", "On Notify Begin", "On Completed", "The white exec pin straight away"]
        answer_index: 2
        explain: "On Completed fires when the montage finishes normally. The plain exec pin fires immediately, before the animation plays."
      - q: "Which component do you pass as the skeletal mesh to Play Montage?"
        choices: ["The character's Mesh", "The capsule", "The lever's Box collision", "The camera"]
        answer_index: 0
        explain: "Montages play on the Skeletal Mesh component, which runs the AnimBP."
      - q: "Why use a Blueprint Interface for 'Interact'?"
        choices: ["It's required for montages", "It runs faster than events", "It lets you skip collision", "The player can call Interact on any actor without casting to each type"]
        answer_index: 3
        explain: "Levers, doors and buttons each implement Interact their own way. The player just sends the message."
      - q: "What is a montage for, compared with a plain animation sequence?"
        choices: ["Nothing, they're the same", "Playing an animation from gameplay code or Blueprint, with slots, sections and notifies", "Only cinematics", "Only facial animation"]
        answer_index: 1
        explain: "Montages are the gameplay-triggered animation asset. Sequences are usually driven by the AnimBP."
    flavors:
      _default: {why: "A world that reacts with the player's body feels much more solid than one that just prints a message."}
      level_design: {why: "Levers, doors and valves are how you gate progress. A pull animation tells the player the action worked.", do: "Use the montage length as your gating time, and make sure the player can see the door open from the lever."}
      gameplay_design: {why: "Montage timing is part of an interaction's feel and cost.", do: "Note how long the player is committed to the pull and whether that should be tunable."}
      programming: {why: "Interfaces and async nodes like Play Montage are patterns you'll use everywhere.", do: "Note which Play Montage output pins you'd need handled in C++ later."}
      lookdev: {why: "Interactions are where players stop and look closely. Your lighting should support the moment.", do: "Light the lever so it reads before the player reaches it."}
      animation: {why: "Your animations reach gameplay through montages. This is the plumbing.", do: "Check the pull's blend in and blend out times. Rank 3 notifies build on this."}

  # ------------ Animation-specialization quests (required for animation, optional for everyone else) — STUBS ------------
  - id: AQ4
    rank: 3
    difficulty: expert
    specializations: [animation]
    subjects: [retargeting, ik-rig]
    required_spine: false
    required: true
    title: Retarget an animation
    brief: "Retargeting means copying an animation from one character to another character that has a different skeleton, which is a different set of bones. It lets you reuse animations and saves a lot of work. Unreal does this with IK Rig assets, which describe each skeleton, and an IK Retargeter asset, which maps one skeleton to the other. In this quest you retarget one animation and fix one problem in the result."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/auto-retargeting-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 auto retarget ik rig retargeter"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/ik-rig-animation-retargeting-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-retargeting-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Pick one source animation of the template character. Also pick a second character that has a different skeleton from the first one. The template has only one skeleton, so add a free character from Fab, Epic's asset store, to the project."
      - "In the Content Browser, right-click the source animation and choose Retarget Animations. The Retarget Animations window opens. Set Target Preview Mesh to the Skeletal Mesh of the second character and leave Auto Generate Retargeter turned on, so that Unreal sets up the retarget for you. Select your animation in the list, click Export Animations, and pick a folder for the new animation."
      - "In the same window, click Export Retarget Assets to save the IK Rig assets and the IK Retargeter asset that Unreal generated. Open them and fix one problem that you can see, for example in the feet, the hands or the root."
    done_when: "Send a screenshot that shows the source pose and the retargeted pose side by side, and add one line that says what you fixed."
    xp: 100
    verify_type: screenshot
    quiz:
      - q: "What does retargeting an animation mean?"
        choices: ["Changing the speed at which an animation plays", "Copying an animation to another character that has a different skeleton", "Recording an animation to a video file", "Moving an animation asset to another folder"]
        answer_index: 1
        explain: "Retargeting copies the motion from one skeleton to a different one. It lets you reuse animations and saves a lot of work."
      - q: "What is a skeleton in this context?"
        choices: ["The set of bones of a character", "The collision shape of a character", "The list of animations of a character", "The material of a character"]
        answer_index: 0
        explain: "A skeleton is the set of bones that an animation moves. Two characters with different bones need retargeting to share an animation."
      - q: "What is the job of an IK Rig asset in retargeting?"
        choices: ["It stores the new animation", "It renders the two characters side by side", "It imports a character from Fab", "It describes one skeleton"]
        answer_index: 3
        explain: "Each character gets an IK Rig asset that describes its skeleton. The retarget needs one for the source and one for the target."
      - q: "What is the job of the IK Retargeter asset?"
        choices: ["It deletes bones that are not used", "It adds controls to the hands and feet", "It maps one skeleton to the other", "It turns a Skeletal Mesh into a Static Mesh"]
        answer_index: 2
        explain: "The IK Retargeter connects the IK Rig of the source to the IK Rig of the target. With that mapping, motion can be copied from one to the other."
      - q: "Why do you add a free character from Fab for this quest?"
        choices: ["The template has only one skeleton, and you need a second, different one", "The template character has no animations", "Fab characters are the only ones that can be animated", "The template character cannot be opened in the editor"]
        answer_index: 0
        explain: "Retargeting needs two different skeletons. The mannequins of the template share one skeleton, so the second character must come from somewhere else."
      - q: "How do you open the Retarget Animations window?"
        choices: ["Open Window, then Output Log", "Right-click the source animation in the Content Browser and choose Retarget Animations", "Drag the animation into the level", "Open Edit, then Plugins, and search for Retarget"]
        answer_index: 1
        explain: "The command is in the right-click menu of the animation asset. The window that opens holds all settings for the retarget."
      - q: "What do you set Target Preview Mesh to?"
        choices: ["The Skeletal Mesh of the template character", "The source animation", "The folder for the new animation", "The Skeletal Mesh of the second character"]
        answer_index: 3
        explain: "The target is the character that should receive the animation. Its Skeletal Mesh tells Unreal which skeleton to retarget to."
      - q: "What happens when you leave Auto Generate Retargeter turned on?"
        choices: ["Unreal deletes the source animation after the export", "Unreal exports every animation of the project", "Unreal sets up the retarget for you", "Unreal locks the target character"]
        answer_index: 2
        explain: "With this option on, Unreal creates the needed rigs and the retargeter by itself. You do not have to build them by hand first."
      - q: "What does Export Animations do in the Retarget Animations window?"
        choices: ["It saves the retargeted animation as a new asset in the folder you pick", "It sends the animation to Fab", "It saves the IK Rig assets and the IK Retargeter asset", "It records the preview as a video"]
        answer_index: 0
        explain: "You select your animation in the list and click Export Animations. A new animation for the target character is saved in the folder you choose."
      - q: "You want to fix the feet in the result by editing the retarget setup. What do you click first?"
        choices: ["Export Animations, to save the animation again", "Export Retarget Assets, to save the generated IK Rig assets and IK Retargeter asset", "Auto Generate Retargeter, to turn it off", "Target Preview Mesh, to pick another mesh"]
        answer_index: 1
        explain: "The generated assets only exist inside the window until you export them. After Export Retarget Assets you can open them and fix problems in the feet, the hands or the root."

  - id: AQ5
    rank: 3
    difficulty: expert
    specializations: [animation]
    subjects: [control-rig]
    required_spine: false
    required: true
    title: Control Rig quick start
    brief: "A Control Rig is an asset that lets you move the bones of a character with handles called controls, directly inside Unreal. Animators use these controls to pose and animate a character without another 3D program. In this quest you create a small Control Rig, add controls for one arm, and pose the arm."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-create-control-rigs-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 control rig beginner create controls"
    checklist:
      - "Open a project made from the Third Person template, or create one. In the Content Browser, find the Skeletal Mesh of the template character (its name starts with SKM_). Right-click it and choose Create, then Control Rig. Double-click the new asset to open the Control Rig Editor."
      - "In the Rig Hierarchy tab, right-click the upper arm bone and choose New Element, then New Control. Select the new control and press Shift+P to unparent it from the bones. Do the same for the lower arm and the hand."
      - "Drag each control into the Rig Graph and choose Get Control. Drag its bone into the graph and choose Set Bone. Connect the Transform pin of the Get node to the Value pin of the Set node. Then connect the Forwards Solve node to the Set nodes one after the other, so that the bones follow when you move a control."
      - "Move and rotate the controls in the viewport to pose the arm. Clicking Compile puts the controls back in their starting position, so take your screenshot before you compile again."
    done_when: "Send a screenshot of the rig graph and a screenshot of the posed arm."
    xp: 100
    verify_type: screenshot
    quiz:
      - q: "What is a Control Rig?"
        choices: ["An asset that stores the textures of a character", "A camera that follows a character", "An asset that lets you move the bones of a character with controls, inside Unreal", "A plugin that imports characters from other programs"]
        answer_index: 2
        explain: "A Control Rig gives a character handles called controls. Animators pose and animate with them directly in Unreal, without another 3D program."
      - q: "How do you create a Control Rig for the template character?"
        choices: ["Right-click its Skeletal Mesh and choose Create, then Control Rig", "Drag its Skeletal Mesh into the level and press F9", "Open its Animation Blueprint and add a Slot node", "Click Add, then Animation, then Blend Space"]
        answer_index: 0
        explain: "The Skeletal Mesh of the template has a name that starts with SKM_. Its right-click menu has Create, then Control Rig."
      - q: "How do you add a control for the upper arm bone?"
        choices: ["In the Rig Graph, press the E key on the bone", "In the Content Browser, duplicate the bone", "In the viewport, hold Alt and drag the bone", "In the Rig Hierarchy tab, right-click the bone and choose New Element, then New Control"]
        answer_index: 3
        explain: "The Rig Hierarchy tab lists the bones. New Element, then New Control creates a control at the selected bone."
      - q: "What does pressing Shift+P on a selected control do?"
        choices: ["It deletes the control", "It unparents the control from the bones", "It makes a copy of the control", "It compiles the Control Rig"]
        answer_index: 1
        explain: "A new control is created under the bone you clicked. Shift+P unparents it, so the control is no longer a child of the bones it should drive."
      - q: "Which two nodes do you create in the Rig Graph for each control and its bone?"
        choices: ["Play Montage and On Completed", "Create Widget and Add to Viewport", "Get Control and Set Bone", "Get Actor Location and Set Actor Transform"]
        answer_index: 2
        explain: "Dragging the control into the graph gives Get Control. Dragging the bone gives Set Bone. Together they copy the control to the bone."
      - q: "How do you connect the Get Control node to the Set Bone node?"
        choices: ["The Transform pin of the Get node goes to the Value pin of the Set node", "The Value pin of the Set node goes to the Forwards Solve node", "The Name pin of the Get node goes to the Name pin of the Set node", "The two nodes are not connected"]
        answer_index: 0
        explain: "Get Control gives the transform of the control. Fed into the Value pin of Set Bone, it places the bone where the control is."
      - q: "What is the Forwards Solve node connected to?"
        choices: ["To the Get Control nodes only", "To the Rig Hierarchy tab", "To the Skeletal Mesh in the Content Browser", "To the Set Bone nodes, one after the other"]
        answer_index: 3
        explain: "Forwards Solve is the event that runs the graph. Its execution line must pass through each Set Bone node for the bones to follow."
      - q: "You move a control in the viewport, but its bone does not follow. What do you check first?"
        choices: ["That the control has a red color", "That the Forwards Solve node is connected to the Set Bone node of that bone", "That the Skeletal Mesh has a material", "That the level has a Player Start"]
        answer_index: 1
        explain: "A Set Bone node that is not on the execution line of Forwards Solve never runs. The bone then keeps its old place."
      - q: "Why should you take the screenshot of the posed arm before you click Compile again?"
        choices: ["Compile closes the Control Rig Editor", "Compile deletes the controls", "Compile puts the controls back in their starting position", "Compile hides the Skeletal Mesh"]
        answer_index: 2
        explain: "Compiling resets the controls, and the pose is lost. The pose you set in the editor viewport is only a test of the rig."
      - q: "What do animators gain from a Control Rig?"
        choices: ["They can pose and animate a character without another 3D program", "They can paint textures on the character", "They can package the game faster", "They can replace the skeleton with a static mesh"]
        answer_index: 0
        explain: "The controls make posing possible directly inside Unreal. Changes are seen at once in the engine where the character is used."

  - id: AQ6
    rank: 3
    difficulty: expert
    specializations: [animation]
    subjects: [anim-notify, montage]
    required_spine: false
    required: true
    title: Anim notifies
    brief: "An anim notify is a marker that you place on one frame of an animation. When the animation reaches that frame, the notify tells the game to do something, such as play a sound or start an effect. This lets you match game events to the exact moment in a movement. In this quest you make something happen in the middle of a montage, at the frame you choose, and you add a sound notify to a walk animation."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-notifies-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 anim notify montage play sound footstep blueprint"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-montage-in-unreal-engine"
    checklist:
