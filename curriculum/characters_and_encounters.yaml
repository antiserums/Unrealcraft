  - id: LDQ38
    rank: 3
    difficulty: expert
    specializations: [gameplay_design, level_design]
    subjects: [verticality, encounter]
    required: false
    title: Vertical arena
    brief: "A vertical arena has several floors at different heights, so the fight also moves up and down. Every stair, ledge and drop must fit how high the character can step and jump, and the AI needs a NavMesh, the map of where it can walk, that joins the floors. In this quest you graybox an arena with two or three floors, which means building it from simple blocks, and you check it against the numbers of the character."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cubegrid-tool-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "level design vertical combat arena multiple floors"
    checklist: ["Open a project made from the Third Person template, or create one. Open BP_ThirdPersonCharacter, select Character Movement and write down Max Step Height. Then test in PIE how high a ledge the character can jump onto, and write that down too. These are your step and jump metrics.", "In a new level, graybox an arena with two or three levels of height. Use CubeGrid, a modeling tool in Unreal for building simple block shapes on a grid. You find it in Modeling Mode.", "Check every change of height against your step and jump metrics.", "Add a Nav Mesh Bounds Volume that covers the arena and press P to show the NavMesh. Make sure it connects the levels in the places where the AI should be able to follow the player."]
    done_when: "Send a screenshot of the arena from the side, and a short video clip (30 seconds or less) or two screenshots from PIE of moving between the levels."
    xp: 70
    verify_type: screenshot
    quiz:
      - q: "What is a vertical arena?"
        choices: ["An arena that is taller than it is wide and has one floor", "An arena with several floors at different heights", "An arena where the camera looks straight down", "An arena with walls but no floor"]
        answer_index: 1
        explain: "In a vertical arena the fight also moves up and down. Stairs, ledges and drops connect the floors."
      - q: "Where do you find Max Step Height?"
        choices: ["In the World Settings of the level", "In the settings of the CubeGrid tool", "On the Character Movement component of BP_ThirdPersonCharacter", "On the Nav Mesh Bounds Volume"]
        answer_index: 2
        explain: "The Character Movement component holds the movement numbers of the character. Max Step Height is one of them."
      - q: "What does Max Step Height tell you?"
        choices: ["How high a step the character can walk up without jumping", "How high the character can jump", "How tall the character is", "How far the character can fall without damage"]
        answer_index: 0
        explain: "A step that is not higher than this value can be walked up. Anything higher blocks the character until it jumps."
      - q: "How do you get your jump metric?"
        choices: ["You read it on the Nav Mesh Bounds Volume", "You copy it from the size of the CubeGrid", "You measure the height of the character mesh", "You test in Play in Editor how high a ledge the character can jump onto"]
        answer_index: 3
        explain: "The test in the running game gives you the real number. You write it down next to Max Step Height."
      - q: "What is CubeGrid?"
        choices: ["A view mode that shows the collision of meshes", "A modeling tool for building simple block shapes on a grid", "A plugin that creates the NavMesh", "A material with a checker pattern"]
        answer_index: 1
        explain: "CubeGrid lets you push and pull blocks on a grid. It is a fast way to graybox floors, stairs and ledges."
      - q: "Where do you find the CubeGrid tool?"
        choices: ["In Landscape Mode", "In Foliage Mode", "In Modeling Mode", "In the Place Actors panel, under Volumes"]
        answer_index: 2
        explain: "CubeGrid is one of the tools of Modeling Mode. You switch to that mode with the mode dropdown of the editor."
      - q: "What do you check every change of height against?"
        choices: ["Your step and jump metrics", "The size of the Sky Light", "The number of enemies", "The length of the level name"]
        answer_index: 0
        explain: "A stair must fit the step metric and a ledge must fit the jump metric. If not, the player cannot move between the floors as you planned."
      - q: "A ledge that the player should jump onto is higher than your jump metric. What happens?"
        choices: ["The character climbs it more slowly", "The NavMesh lifts the character onto it", "The ledge is removed when the game starts", "The character cannot get onto the ledge"]
        answer_index: 3
        explain: "The jump metric is the highest ledge the character reaches. A higher ledge is a wall to the player, so you lower it or add a step."
      - q: "What is the NavMesh?"
        choices: ["The mesh of the floor that the player sees", "The map of where the AI can walk", "The grid of the CubeGrid tool", "The collision of the character"]
        answer_index: 1
        explain: "The NavMesh marks the walkable area for the AI. You add a Nav Mesh Bounds Volume around the arena and press P to show it."
      - q: "The NavMesh covers each floor but does not join the floors. What does this mean for the fight?"
        choices: ["The player cannot jump any more", "The AI walks faster on each floor", "The AI cannot follow the player from one floor to another", "The floors lose their collision"]
        answer_index: 2
        explain: "The AI only walks where the NavMesh is connected. It must join the floors in the places where the AI should be able to follow the player."

  - id: LDQ39
    rank: 3
    difficulty: expert
    specializations: [gameplay_design, level_design]
    subjects: [pacing, encounter]
    required: false
    title: Pacing curve across 3 encounters
    brief: "Pacing is how the intensity of a game rises and falls over time. If every fight is equally hard, players get tired or bored, so designers plan peaks and quiet moments, called rest beats. An intensity curve is a simple line drawing of this plan. In this quest you draw such a curve for three encounters in a row and explain it."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-08-create-an-enemy-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "level design pacing intensity curve encounters"
    checklist: ["Sketch an intensity curve for three encounters in a row. Include rest beats, the quiet moments, between them.", "For each encounter, note what changes compared to the one before: the enemy count, the space, or the verb, which is the main action the player uses."]
    done_when: "Send an image of your curve, and add 3 lines that explain each peak and each rest."
    xp: 50
    verify_type: writeup
    quiz:
      - q: "What is pacing in a game?"
        choices: ["How fast the character runs", "How long the game takes to load", "How many levels the game has", "How the intensity of the game rises and falls over time"]
        answer_index: 3
        explain: "Pacing is the change of intensity over time. Good pacing has both strong moments and quiet moments."
      - q: "What happens when every fight in a row is equally hard?"
        choices: ["Players get tired or bored", "Players learn the verb faster", "Players find the exit sooner", "Players notice the lighting more"]
        answer_index: 0
        explain: "Without change, intensity stops feeling like anything. Players either wear out or lose interest."
      - q: "What is a rest beat?"
        choices: ["The hardest fight of the level", "A quiet moment between encounters", "The sound that plays when an enemy dies", "A checkpoint that saves the game"]
        answer_index: 1
        explain: "A rest beat is a quiet moment. It lets the player breathe, and it makes the next peak feel stronger."
      - q: "What is an intensity curve?"
        choices: ["A graph of the frame rate over time", "A spline that the enemies walk along", "A simple line drawing of how the intensity is planned to rise and fall", "A setting on the Character Movement component"]
        answer_index: 2
        explain: "The curve is a sketch of your pacing plan. High points are intense moments and low points are quiet ones."
      - q: "What does a peak on your intensity curve stand for?"
        choices: ["A moment of high intensity, such as an encounter", "A place where the level is highest", "A moment when the game is paused", "A point where the player has the most health"]
        answer_index: 0
        explain: "The curve shows intensity, not height in the level. Each of the three encounters is a peak on it."
      - q: "Where do the rest beats go on your curve?"
        choices: ["Only before the first encounter", "Only after the last encounter", "On top of each peak", "Between the encounters"]
        answer_index: 3
        explain: "You draw three encounters in a row with quiet moments between them. The curve goes up for a fight and down for a rest."
      - q: "What do you note for each encounter?"
        choices: ["Which textures the arena uses", "What changes compared to the one before", "How long it took to build", "Which Blueprint nodes it uses"]
        answer_index: 1
        explain: "Each encounter should differ from the last one. The note says what you change, so the three fights do not feel the same."
      - q: "Which three things can change from one encounter to the next in this quest?"
        choices: ["The sky, the fog or the music", "The menu, the font or the language", "The enemy count, the space or the verb", "The camera, the lens or the exposure"]
        answer_index: 2
        explain: "More or fewer enemies, a different space, or a different main action each change how intense a fight feels."
      - q: "What is the verb of an encounter?"
        choices: ["The main action the player uses", "The name of the encounter", "The first word of the level description", "The sound the enemies make"]
        answer_index: 0
        explain: "The verb is the main action of the player, such as shoot or sneak. Changing the verb changes how the encounter plays."
      - q: "What do the 3 lines that you send with the curve explain?"
        choices: ["Each enemy and its health", "Each tool you used for the drawing", "Each Blueprint in the level", "Each peak and each rest"]
        answer_index: 3
        explain: "The lines give the reason for the shape of the curve: why each peak is there and what each rest is for."

  - id: GDQ10
    rank: 3
    difficulty: expert
    specializations: [gameplay_design, level_design]
    subjects: [spawning, blueprint]
    required: false
    title: Spawn waves with a BP spawner
    brief: "A spawner is an actor that creates enemies while the game runs. A wave is a group of enemies that appears together, and the next wave starts after the current one is beaten. With a spawner you can change the size and timing of a fight by changing a few numbers. In this quest you build a wave spawner Blueprint with values that can be edited in the Details panel."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/flow-control-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 blueprint wave spawner spawn ai from class"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-variables-in-unreal-engine"
    checklist: ["Open a project made from the Third Person template, or create one. Make a simple enemy to spawn: a Character Blueprint named BP_WaveEnemy with any mesh. In its Class Defaults, set Initial Life Span to 5, so that each enemy destroys itself after 5 seconds. This lets you test waves without building combat. If you already have an enemy that can be destroyed, you can use that.", "Build a Blueprint named BP_WaveSpawner. Give it three Instance Editable variables, which are variables you can change in the Details panel: the wave count, the enemies per wave, and the delay.", "Make the spawner start the next wave when all enemies from the current wave are destroyed. One way: count the living enemies in a variable, bind an event to On Destroyed of each spawned enemy that lowers the count, and start the next wave after the delay when the count reaches 0.", "Place the spawner, and add spawn points where the player cannot see them, for example Target Points behind cover that the spawner picks from."]
    done_when: "Send a short video clip (30 seconds or less), or two screenshots from PIE, that show two waves, and a screenshot of the Details panel of the spawner."
    xp: 70
    verify_type: screenshot
    quiz:
      - q: "What is a spawner?"
        choices: ["A volume that damages the player", "An actor that creates enemies while the game runs", "A widget that shows the number of enemies", "A table that stores tuning numbers"]
        answer_index: 1
        explain: "A spawner creates actors during play. The enemies do not have to be placed in the level by hand."
      - q: "What is a wave?"
        choices: ["A group of enemies that appears together", "A single enemy with a lot of health", "A sound that warns the player", "A path that enemies walk along"]
        answer_index: 0
        explain: "A wave is one group of enemies that appears together. A fight is made of several waves in a row."
      - q: "When does the spawner start the next wave?"
        choices: ["As soon as the first enemy of the wave appears", "When the player presses the E key", "At a random time", "When all enemies of the current wave are destroyed, after the delay"]
        answer_index: 3
        explain: "The next wave waits until the current one is beaten. The delay then gives the player a short pause before more enemies appear."
      - q: "What does Initial Life Span set to 5 do on BP_WaveEnemy?"
        choices: ["Each enemy gets 5 health points", "Each enemy waits 5 seconds before it appears", "Each enemy destroys itself after 5 seconds", "Each wave has 5 enemies"]
        answer_index: 2
        explain: "Initial Life Span is how long an actor lives. With 5, each enemy removes itself after 5 seconds, so you can test waves without building combat."
      - q: "Where do you set Initial Life Span?"
        choices: ["In the World Settings of the level", "In the Class Defaults of BP_WaveEnemy", "In the Details panel of the spawner", "In the Event Graph of the Level Blueprint"]
        answer_index: 1
        explain: "Initial Life Span is a property of the actor class. You set it in the Class Defaults of the enemy Blueprint, and every spawned enemy gets it."
      - q: "Which three Instance Editable variables does BP_WaveSpawner have?"
        choices: ["The wave count, the enemies per wave and the delay", "The player health, the score and the lives", "The mesh, the material and the sound", "The level name, the GameMode and the Kill Z"]
        answer_index: 0
        explain: "These three numbers describe the fight: how many waves, how many enemies in each, and how long the pause between them is."
      - q: "What does Instance Editable mean for these variables?"
        choices: ["They change by themselves during play", "They are saved in a Data Table", "They can only be changed in the graph", "They can be changed in the Details panel of the placed spawner"]
        answer_index: 3
        explain: "Each placed spawner can have its own values. You change the size and the timing of a fight by changing a few numbers, with no graph edits."
      - q: "How does the spawner know that a wave is beaten?"
        choices: ["It waits a fixed time and then assumes the wave is over", "It checks the health of the player", "It counts the living enemies and lowers the count when an enemy is destroyed", "It reads the frame rate of the game"]
        answer_index: 2
        explain: "The spawner binds an event to On Destroyed of each spawned enemy, and that event lowers the count. When the count reaches 0, the wave is beaten."
      - q: "The first wave is destroyed, but the second wave never starts. What do you check first?"
        choices: ["That the enemies have a visible mesh", "That the event bound to On Destroyed of each enemy lowers the count", "That the spawner is placed at the center of the level", "That the delay is longer than 5 seconds"]
        answer_index: 1
        explain: "The next wave only starts when the count of living enemies reaches 0. If the count is never lowered, the spawner waits for ever."
      - q: "Where do you put the spawn points?"
        choices: ["Where the player cannot see them, for example behind cover", "Directly in front of the player", "Above the level, in the sky", "Outside the Nav Mesh Bounds Volume"]
        answer_index: 0
        explain: "Enemies that appear out of nothing in plain view break the illusion. Target Points behind cover let them appear unseen and then walk in."
