  - id: LDQ36
    rank: 3
    difficulty: expert
    specializations: [level_design]
    subjects: [readability, color-language, lighting]
    required_spine: false
    required: true
    title: Readability pass 2
    brief: "Readability means that a player can understand a space with one look: where the danger is, where to hide, and where to go. If the player cannot read the space, your design does not reach them. Color and light are your main tools for this. In this quest you choose a small color key, apply it to your arena, and test that it still works when the picture has no color."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/features-and-properties-of-lights-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "level design color language readability lighting guide player"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/instanced-materials-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/decal-actors-in-unreal-engine"
    checklist:
      - "Write a color key of 3 lines: one color for threats, one color for cover or things you can climb, and one color for objectives."
      - "Make one Material Instance for each color and name them MI_Read_Threat, MI_Read_Cover and MI_Read_Objective. A Material Instance is a copy of a material with its own values. Apply them in L_Arena_01."
      - "Change the value, which is the brightness, as well as the hue of each color. This way the key still works in grayscale, a picture with only shades of gray."
      - "Light the exit and the main objective so that they are the brightest things the player sees from the entry."
      - "Take a screenshot from your entry bookmark. Then convert it to grayscale and check that threats, cover and objectives still stand out."
    done_when: "Send your color key, and the entry screenshot both in color and in grayscale."
    xp: 100
    verify_type: screenshot
    quiz:
      - q: "Why check your readability pass in grayscale?"
        choices: ["Grayscale renders faster", "Epic requires it", "If it only works by hue, color-blind players and dark scenes lose it. Value contrast survives.", "It hides errors"]
        answer_index: 2
        explain: "Value (light vs dark) is read before hue. Build the key on both."
      - q: "What makes a color language work?"
        choices: ["Using it the same way every time", "Using as many colors as possible", "Changing it per room", "Only using red"]
        answer_index: 0
        explain: "If yellow means climbable once, it has to mean climbable everywhere."
      - q: "What's usually the brightest thing in view at the entry?"
        choices: ["The ceiling", "The next goal or exit", "A random prop", "The skybox"]
        answer_index: 1
        explain: "Players are drawn to light. Put it where you want them to go."
      - q: "You color 30 props as objectives. What happens?"
        choices: ["The level gets easier", "Nothing", "Performance improves", "Nothing stands out anymore, so the key stops working"]
        answer_index: 3
        explain: "A signal only works if it's rare. Keep it for what matters."
      - q: "Fastest way to recolor all threat markers at once?"
        choices: ["Edit each mesh", "Change the parameter in the shared Material Instance", "Rebuild lighting", "Rename the assets"]
        answer_index: 1
        explain: "Everything using MI_Read_Threat updates together."
    flavors:
      _default: {why: "If the player can't read the space, the design doesn't come across."}
      level_design: {why: "R1 lit for navigation. Now you light and color for combat decisions.", do: "Mark every threat, cover and objective with your key, and nothing else."}
      gameplay_design: {why: "Players can't use a verb on something they can't see.", do: "Check that every interactable in your mechanic uses the objective color."}

  - id: GDQ8
    rank: 3
    difficulty: expert
    specializations: [level_design, gameplay_design]
    subjects: [blueprint, tuning, tooling]
    required_spine: false
    required: true
    title: Designer-tunable actors
    brief: "A designer-tunable actor is a Blueprint whose important numbers can be changed in the Details panel, without opening its graph. When you set it up this way, other people can use and adjust your actor, and each copy in the level can have its own values. In this quest you turn fixed numbers into editable variables, add helpful names, tooltips and limits, and place two copies that behave differently."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-variables-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 instance editable expose on spawn variable tooltip category"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-class-assets-in-unreal-engine"
    checklist:
      - "Open BP_Enemy or BP_Lever. Turn three hard-coded numbers, which are numbers typed directly into the graph, into variables, for example MoveSpeed, WaitTime and Health."
      - "For each variable, tick Instance Editable, which is the eye icon. Also give each one a Category and a Description, which is the text shown as its tooltip."
      - "On the number variables, set a Slider Range and a Value Range. These limits stop people from typing a value such as 99999."
      - "Give one Vector variable the option Show 3D Widget. This shows a handle in the viewport, so the target point can be dragged there."
      - "Place two copies of the actor in the level and give them different values. Play in the editor (PIE) to see both behaviors, without opening the graph."
    done_when: "Send a screenshot of the Details panel that shows your category, your tooltips, and two instances with different values."
    xp: 110
    verify_type: screenshot
    quiz:
      - q: "What does Instance Editable do?"
        choices: ["Makes the variable replicate", "Lets you set a different value on each placed copy, from the Details panel", "Hides the variable", "Makes it a constant"]
        answer_index: 1
        explain: "Each copy in the level can have its own value, with no graph edits."
      - q: "Where does a variable's tooltip text come from?"
        choices: ["Its Description field", "Its name only", "The Output Log", "Project Settings"]
        answer_index: 0
        explain: "Write what the value does and its units, e.g. 'Seconds before first move'."
      - q: "Why set Slider Range and Value Range?"
        choices: ["Faster compile", "Required for Instance Editable", "It limits values to sensible ranges, so tuning is safe", "It changes the variable type"]
        answer_index: 2
        explain: "Clamps keep designers inside ranges that work."
      - q: "Which option lets you drag a Vector variable's point in the viewport?"
        choices: ["Expose on Spawn", "Private", "Replication", "Show 3D Widget"]
        answer_index: 3
        explain: "Handy for patrol points and target locations."
      - q: "What does Expose on Spawn add?"
        choices: ["A pin for that variable on Spawn Actor from Class", "A tooltip", "A category", "A slider"]
        answer_index: 0
        explain: "Spawners can set the value at spawn time. You'll use it in the spawn waves elective."
    flavors:
