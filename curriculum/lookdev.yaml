      - q: "What does the Edge Offset setting do?"
        choices: ["Moves the whole water body up or down by that value, with its spline", "Adds a flat edge around the water body before the falloff starts, useful for flat shores", "Offsets the spline points of the water body sideways, away from the center of the body", "Sets the depth of the water at the shoreline, in units, before it gets deeper"]
        answer_index: 1
        explain: "Edge Offset applies a flat offset from the water's edge before falloff begins. It makes flat shores, even for a river carved through a mountain."
      - q: "What is the difference between Angle and Width falloff?"
        choices: ["Angle falloff extends at a set angle until it meets the terrain; Width falloff uses a fixed width regardless of intersection", "Angle falloff is used for oceans and always reaches the horizon; Width falloff is used for rivers and lakes and stops at the bank", "Angle falloff affects the paint layers of the landscape; Width falloff affects the height of the landscape under the water body", "There is no difference; they are aliases"]
        answer_index: 0
        explain: "Angle-based falloff extends the shape at an angle until it intersects the landscape. Width-based falloff uses a fixed width no matter where the terrain is."
      - q: "How do rivers drive the motion of their surface?"
        choices: ["With Gerstner waves, in the same way as the oceans do", "With the landscape slope under the river", "With a Niagara system along the whole spline of the river body", "With velocity per spline point written to a flow map"]
        answer_index: 3
        explain: "Rivers do not use waves. Velocity from each spline point is written to a flow map that moves the water in the direction the spline is going."
      - q: "What is the Island Water Body for?"
        choices: ["Rendering a small lake with waves, inside an ocean", "Making sure a piece of land stays above water; it only affects the landscape", "Creating a dry zone under the water surface, where the player can walk freely", "A water surface for a pool on a piece of land that is above the sea level"]
        answer_index: 1
        explain: "Islands only affect the landscape under them, to keep that land above water. Their terraforming is applied after all other water bodies."
      - q: "Two water bodies overlap and no transition material is assigned. Which one's material wins?"
        choices: ["The one created first in the level by you", "The larger one of the two bodies", "The one with the higher Overlap Material Priority", "The river always wins over lakes and over oceans"]
