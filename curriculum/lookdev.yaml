    checklist:
      - "In Landscape Mode > Manage > Spline, Ctrl+Left-click to lay 6 to 8 control points for a road across a hill. Use Alt+LMB drag from an end point to extend it."
      - "Select all control points (Ctrl+A). Set Half-Width to about 300 and Side Falloff to about 400. Press End to snap them to the landscape."
      - "Add a Spline Edit Layer in the edit layer stack. Watch the terrain rise or cut to fit the road."
      - "Select all segments. Set Layer Name to your Dirt (or Road) paint layer so the road paints itself."
      - "Assign a road Static Mesh under Landscape Spline Meshes. Turn on Scale to Width and set the correct Forward Axis."
      - "On one downhill segment turn off Raise Terrain and keep Lower Terrain, so the road cuts into the slope instead of building an embankment."
      - "Select a segment, use the scale tool to drag a tangent and smooth one sharp bend."
