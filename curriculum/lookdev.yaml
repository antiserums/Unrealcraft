    title: "Sculpt on a layer stack"
    brief: "Landscape edit layers work like layers in a paint program. Each layer holds its own sculpting and painting, and Unreal adds them together to make the final terrain. This means you can try an idea on a new layer and hide or remove it later without damaging the base terrain. In this quest you create a stack of layers, sculpt on one of them, and try the controls of the stack."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/landscape-edit-layers-in-unreal-engine"
