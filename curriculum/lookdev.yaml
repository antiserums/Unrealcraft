      - q: "In Sculpt mode you set an edit layer's heightmap Alpha to a negative value. What happens?"
        choices: ["The layer's height data is applied as a subtractive blend", "The layer is hidden until the Alpha is above 0 again", "The layer is locked and cannot be sculpted anymore", "The paint data of the layer is inverted on every channel"]
        answer_index: 0
        explain: "A negative heightmap alpha applies the data in a subtractive blend. An alpha of zero means the layer has no effect on the final heightmap."
      - q: "Which of these can you NOT do on a locked edit layer?"
        choices: ["Toggle its visibility", "Select it in the layer list", "Sculpt or paint on it", "Read its name"]
        answer_index: 2
        explain: "Locked edit layers cannot be modified in any way, including sculpting, painting, collapsing and managing Blueprint brushes."
      - q: "What does the Collapse context option do?"
        choices: ["Hides the layer", "Merges the edit layer into the layer below it", "Deletes the layer and the brushes that are on it", "Resets the layer's height to zero"]
        answer_index: 1
        explain: "Collapse merges the final data of the layer and the layer below into the bottom one. Collapse All Layers flattens everything into the base layer and removes all Blueprint Brushes."
      - q: "How do you see exactly what one edit layer contributes to the heightmap?"
        choices: ["Use the Erase tool on it and compare", "Set the alpha of every other layer to 2 and compare the result with the first view", "Open the Edit Layer Inspector from the Window menu and select the layer in the list", "Turn on Lit > Visualizers > Layer Contribution and select the layer in Sculpt mode"]
        answer_index: 3
