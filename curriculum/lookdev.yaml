    required_spine: false
    required: false
    title: Filmic tonemapper controls
    brief: "Unreal calculates light with a very wide range of brightness, called HDR, which is much wider than a normal screen can show. The tonemapper is the last step that turns this range into the colors on your screen, using a curve that looks like film. In this quest you move the main controls of that curve to see what each one does, and then you put them back."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/color-grading-and-the-filmic-tonemapper-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine"
    checklist:
      - "In a scene that has lighting, place a few spheres with different colors and one with a strong emissive material, which is a material that glows. Take a reference screenshot."
      - "In the Post Process Volume, open the Film category. Override Slope and move it up and down. Note which direction makes the image darker."
      - "Override Toe and Shoulder, one at a time. Watch what happens to the darkest and the brightest areas of the image."
      - "Raise the emissive brightness of one sphere by a large amount. Watch how its color changes as it gets very bright."
      - "Put Slope, Toe and Shoulder back to their default values. Write one line about when the Film settings should be changed."
      - "This step is optional. Open Color Grading, then Misc, and set Tone Curve Amount and Expand Gamut to 0 to see the image without the tone curve. Then restore the values."
    done_when: "Send one image with 4 labeled crops of the same view: default, high Slope, high Toe and high Shoulder. Add one sentence that says when the Film settings should be changed."
    xp: 50
    verify_type: screenshot
    quiz:
      - q: "Which standard does Unreal's filmic tonemapper follow?"
        choices: ["ACES (Academy Color Encoding System)", "sRGB gamma 2.2", "Rec.601", "Kodak Vision3"]
        answer_index: 0
        explain: "The filmic tonemapper matches the ACES standard for television and film, so color stays consistent across displays and formats."
      - q: "You increase Slope. What happens to the image?"
        choices: ["It gets lighter", "It gets darker because the S-curve gets steeper", "Only the shadows change", "Bloom turns off"]
        answer_index: 1
        explain: "Slope sets the steepness of the tonemapper S-curve. Larger values make it steeper and the image darker; lower values make it lighter."
      - q: "Which property adjusts the dark colors of the tonemapper?"
        choices: ["Shoulder", "White Clip", "Toe", "Gain"]
        answer_index: 2
        explain: "Toe adjusts the dark colors. Shoulder adjusts the bright colors."
