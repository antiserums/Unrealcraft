    required: false
    title: Bake displacement into a Nanite prop
    brief: "A height texture, also called a displacement map, stores how far each part of a surface should stick out. With Nanite you can bake this texture into a mesh: Unreal builds a new, more detailed mesh once, in the editor, with the bumps as real geometry. This gives real surface detail from a simple source mesh. In this quest you bake a displacement map into a Nanite prop and look at the new triangles."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/working-with-naniteenabled-content"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/nanite-technical-details"
    checklist:
      - "Open a project made from the Third Person template, or create one. Take a simple prop that has Nanite enabled and one material slot, such as a brick block or a stone slab. A Box made in Modeling Mode with Nanite enabled works. Name it SM_Disp_Test. Get a height (displacement) texture for its surface. A free surface from Fab includes one, and for a first test any grayscale texture works, such as T_GridChecker_A from the folder LevelPrototyping/Textures of the template."
      - "Open the prop in the Static Mesh Editor. Under Nanite Settings, set Trim Relative Error to 0.04."
      - "Expand Displacement Maps and add one element (Index 0). Set its Texture to your height map, and set Magnitude to a small value. Start with 2. Click Apply Changes."
      - "Check that Displacement UV Channel matches the UV channel your height map was made for. Then place the prop in a level."
      - "Open View Modes, then Nanite Visualization, then Triangles. Compare the mesh with Magnitude 0 and with your Magnitude."
      - "This step is optional. On a copy of the material, check Enable Tessellation under Nanite in the material Details, connect the height texture to Displacement, and set Magnitude and Center. Compare this tessellation, which happens while the game runs, with the baked result."
    done_when: "Send before and after screenshots of the prop, in the Lit view and in the Nanite Triangles view. Also send a screenshot of the Nanite Settings with Trim Relative Error, Displacement Maps and Magnitude visible."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "For Nanite static displacement, what does the page suggest for Trim Relative Error?"
        choices: ["Exactly 0, so no triangle is lost", "A good default is 0.04, and keep it above 0.02", "Any value above 1, to save build time on dense meshes", "It must always match the Magnitude of the material"]
        answer_index: 1
        explain: "The value targets an error level for the tessellator. Too small only adds triangles and long build times."
      - q: "A prop has three material slots. Which displacement map is used for Material Slot 2?"
        choices: ["Always Index 0", "The last index in the list", "The map with the same name as the material", "Displacement Maps Index 2"]
        answer_index: 3
        explain: "Each Displacement Maps index maps to the material slot with the same number."
      - q: "In a tessellation material, what does Center 0.5 mean?"
        choices: ["Mid gray in the map is no change, so the surface moves in and out equally", "The mesh is scaled by half before it is displaced at all", "Only half of the triangles of the mesh are displaced by the height map", "Displacement starts when the mesh covers half of the screen"]
        answer_index: 0
        explain: "Center sets which displacement value equals the base surface. Use 0 to push only outwards."
      - q: "Why should the Magnitude stay as small as possible?"
        choices: ["Large values break the normal map, because the normals are scaled by the Magnitude before the lighting is calculated", "It changes the UV channel that the displacement map is sampled with, so a large value reads the wrong part of the texture", "Magnitude sets the bounds used for culling; a large value hurts performance, especially with Virtual Shadow Maps", "The value is limited to 1, and a larger one is ignored"]
        answer_index: 2
        explain: "Use the full 0-1 range of the Displacement output instead of a big Magnitude scaled down."
      - q: "In which direction does Nanite displacement move the surface?"
        choices: ["Along world Z; there is no option to use the normal", "Along the vertex normal; there is no shader option to change the direction", "Towards the camera, so the surface always looks raised from where you stand", "Along the UV U axis of the first UV channel of the mesh, so it follows the texture"]
        answer_index: 1
        explain: "Displacement is scalar and follows the unnormalized interpolated vertex normal."
      - q: "Does displacement change the shading of the surface?"
        choices: ["Yes, all the normals are recomputed, like in offline renderers", "Yes, but only with Lumen, which reads the new surface", "Only when Center is 0", "No; you need a normal map or derive one from the displacement"]
        answer_index: 3
        explain: "Unlike offline renderers, shading is not updated. The page recommends an extra normal map."
      - q: "You scale a displaced cube 10x to make a wall. What happens to the displacement height?"
        choices: ["It scales with the mesh, because Magnitude is in local space before object scale", "It stays the same in world units, because Magnitude is always measured in world space", "It becomes zero, because scaled meshes cannot be displaced by Nanite at all", "It switches to world space automatically, so that the height in cm stays the same"]
        answer_index: 0
        explain: "Displacement is applied in object space before scaling. The page notes a world-space option may come later."
      - q: "Which texture compression does the page say works decently for displacement maps?"
        choices: ["Packing the height into the blue channel of a normal map", "Any HDR float format only, because 8 bits give steps", "Alpha (BC4), or the alpha of a Default/DXT5 texture", "Compression does not matter"]
        answer_index: 2
        explain: "Compression artifacts show as stair steps. Packing height with normals in a compressed format will likely show artifacts."
    flavors:
