  - id: EAQ85
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [lighting, shadows, virtual-shadow-maps, performance]
    required_spine: false
    required: false
    title: Green pages, red pages
    brief: "Virtual Shadow Maps split shadows into small squares called pages, and Unreal keeps finished pages in a cache so it does not have to draw them again. In the Cached Page view, green pages come from the cache and red pages had to be drawn again this frame. Drawing pages again is what makes shadows expensive, so fewer red pages means better performance. In this quest you find out what causes red pages in a level and reduce them."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/virtual-shadow-maps-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/nanite-virtualized-geometry-in-unreal-engine"
    checklist:
      - "Open a level that has a Directional Light, some static props, a few foliage meshes with a wind material (one that uses World Position Offset), and one large building mesh without Nanite."
      - "Open View Modes, then Virtual Shadow Map, then Cached Page. Keep the camera still and take a screenshot. Red pages that appear while the camera is still are cache invalidations, which means cached pages were thrown away."
      - "Switch to the Shadow Casters visualization and find which objects cause the red pages. Check that their bounds, the invisible boxes around them, are not much bigger than the meshes."
      - "Select the foliage meshes. In the Details panel, set Shadow Cache Invalidation Behavior to Rigid and check the Cached Page view again. Then set World Position Offset Disable Distance to a distance where you can no longer see the wind."
      - "In the console, run r.ShaderPrintEnable 1 and then r.Shadow.Virtual.Stats 1. Write down the values Allocated, Cached and Invalidated. Rotate the Directional Light a little and watch Invalidated jump up."
      - "Enable Nanite on the large building mesh. Move the camera slowly and compare the stats and the Cached Page view with before."
      - "Write three lines: what caused most of the invalidations, what you changed, and what you would never do to a Directional Light while the game runs."
    done_when: "Send two screenshots of the Cached Page view, one before and one after your fixes, with the VSM stats visible on screen. Add your three lines."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "In the Virtual Shadow Map Cached Page view, what do green, red and blue pages mean?"
        choices: ["Green is low resolution, red is high resolution, blue is coarse pages", "Green is Nanite, red is non-Nanite, blue is foliage", "Green is cached, red is new or invalidated, blue is static cached but dynamic uncached", "Green is Directional Light, red is local lights, blue is Sky Light"]
        answer_index: 2
        explain: "Cached pages are tinted green, uncached pages red. Pages where only the static page is cached (dynamic uncached) are blue."
      - q: "What happens to a light's cached shadow pages when the light moves or rotates?"
        choices: ["All cached pages for that light are invalidated", "Nothing, because lights are always dynamic", "Only Nanite pages are refreshed", "Only pages near the camera are refreshed"]
        answer_index: 0
        explain: "Any light movement or rotation invalidates all cached pages for that light. That is why a slowly moving sun is expensive."
      - q: "Why do meshes with World Position Offset materials invalidate cached pages every frame, even when they barely move?"
        choices: ["Because WPO disables Nanite", "Because the shadow map cannot store animated depth", "Because WPO forces the mesh to be Movable", "Because the actual displacement is not known until the object is rendered, so the cache must assume it changed"]
        answer_index: 3
        explain: "When WPO is used, the displacement is not known until render time. The VSM cache system must assume the object needs to be redrawn."
      - q: "Which Shadow Cache Invalidation Behavior option suppresses invalidations from WPO but still invalidates when the transform changes?"
        choices: ["Always", "Rigid", "Static", "Auto"]
        answer_index: 1
        explain: "Rigid suppresses invalidations that WPO would generate. Static also suppresses transform changes; Auto is the default; Always forces invalidation."
      - q: "With separate static caching, the stats show many invalidated static pages. What does the documentation recommend?"
        choices: ["Find the actors that invalidate the static cache and switch them to Movable", "Disable caching with r.Shadow.Virtual.Cache 0", "Set all lights to Stationary", "Lower the screen resolution"]
        answer_index: 0
        explain: "The number of invalidated static pages should be near 0. Instances that invalidate the static cache often should be switched to Movable so they land in the dynamic layer."
      - q: "How do Directional Lights, Spot Lights and Point Lights each get their shadow resolution in VSM?"
        choices: ["Only Nanite meshes receive resolution; the light type does not matter", "All three use one shared 16k shadow map", "Directional Lights use clipmaps of 16k VSMs, Spot Lights one 16k VSM with a mip chain, Point Lights a cube map of 16k VSMs", "Directional Lights use cascades, local lights use 2k shadow maps"]
        answer_index: 2
        explain: "Directional Lights use a clipmap of 16k VSMs. Spot Lights use a single 16k VSM with a mip chain. Point Lights use a cube map of 16k VSMs, one per face."
      - q: "Why does the documentation recommend enabling Nanite even on low-poly meshes when using VSM?"
        choices: ["Nanite meshes never cast shadows", "Non-Nanite geometry is much more expensive to render into VSMs, and invalidations fully in Nanite shadow can be skipped", "Nanite meshes are cached forever", "Nanite removes the need for a Directional Light"]
        answer_index: 1
        explain: "Non-Nanite geometry costs much more in the Shadow Depths pass. Invalidations entirely in the shadow of Nanite objects can also be skipped, which is not true for non-Nanite objects."
      - q: "With VSM enabled, what does the documentation say about the Contact Shadow Length property?"
        choices: ["It is now the main soft shadow control", "It replaces Source Angle", "It must be at least 0.1 or shadows break", "It is no longer necessary for sharp contact shadows and is less accurate than VSM; keep it only for objects that do not render into shadow maps"]
        answer_index: 3
        explain: "VSM is high resolution and accurate, so screen space Contact Shadows are not needed. They may still help for objects set to not render into shadow maps."
    flavors:
      _default: {why: "VSM cost is mostly re-drawn pages. If you can read the colors, you can fix the cost."}
      tech_art: {why: "This is the shadow budget in one overlay.", do: "Use Unreal Insights with trace.enable counters,vsm and graph Invalidated over a 20 second walk."}
      level_design: {why: "A single moving sun or a huge swaying tree can eat the whole shadow budget.", do: "List the moving shadow casters in your level and mark which ones really need to move."}

  - id: EAQ86
    rank: 2
