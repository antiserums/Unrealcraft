    xp: 55
    verify_type: screenshot
    quiz:
      - q: "How does Exponential Height Fog distribute density?"
        choices: ["Same density everywhere", "More density in low places, less in high places, with a smooth transition", "Only inside a box volume", "Denser near the camera only"]
        answer_index: 1
        explain: "Exponential Height Fog creates more density in low places and less in high places. The transition is smooth, so there is no hard cutoff with altitude."
      - q: "Exponential Height Fog has two fog colors. What decides which one you see?"
        choices: ["Camera height", "Time of day", "The fog actor's rotation", "Whether you look at the hemisphere facing the dominant Directional Light or the opposite one"]
        answer_index: 3
        explain: "One color is for the hemisphere facing the dominant directional light (or straight up if none exists), the other is for the opposite hemisphere."
      - q: "You lower Fog Height Falloff to a smaller value. What happens?"
        choices: ["The transition from thick to thin fog becomes larger", "The fog becomes fully opaque", "The fog moves up in Z", "The fog is disabled"]
        answer_index: 0
        explain: "Fog Height Falloff controls how density increases as height decreases. Smaller values make the transition larger."
      - q: "Why can a far Start Distance make height fog cheaper to render?"
        choices: ["It reduces the fog texture resolution", "Pixels in the fog-free area in front of the viewer can be culled by the Z-buffer, so the cost can drop to 50% or less", "It disables the second fog layer", "It turns off directional inscattering"]
        answer_index: 1
        explain: "The start distance keeps an area in front of the viewer without fog. It is rendered as a full-screen quad with a depth test, so pixels are culled and the cost can be 50% or less."
      - q: "Your skybox already has fog painted in it and now looks doubled. Which setting helps?"
        choices: ["Fog Max Opacity 1", "Directional Inscattering Exponent", "Fog Cutoff Distance, so elements past that distance get no fog", "Emissive"]
        answer_index: 2
        explain: "Fog Cutoff Distance stops fog on scene elements past that distance. The docs say this is useful for excluding skyboxes that already have fog baked in."
      - q: "You want the Sky Atmosphere to light the height fog. Besides the project setting, what must you do to the fog colors?"
        choices: ["Set Fog Inscattering Color and Directional Inscattering Color to black", "Set both colors to white", "Match both colors to the sun color", "Delete the fog actor"]
        answer_index: 0
        explain: "The atmosphere contribution is additive on top of the fog's faked colors. To let the Sky Atmosphere drive the fog, set both inscattering colors to black, then use Height Fog Contribution on the Sky Atmosphere."
