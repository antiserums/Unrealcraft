    xp: 60
    verify_type: writeup
    quiz:
      - q: "What is a scene-referred image?"
        choices: ["An image already converted to the display's color space", "A screenshot with a LUT applied", "An image that keeps the original linear light values without limiting exposure range", "An image tone mapped for sRGB"]
        answer_index: 2
        explain: "Scene-referred images keep the original linear light values. Display-referred is the final image in the color space of the display."
      - q: "In what order does the ACES Viewing Transform run?"
        choices: ["ODT, RRT, LMT", "RRT, LMT, ODT", "LMT, ODT, RRT", "LMT, RRT, ODT"]
        answer_index: 3
        explain: "The look (LMT) is applied first, the RRT converts scene-referred to display-referred, and the ODT matches the specific output device."
