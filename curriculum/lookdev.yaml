    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/modeling-tools-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/instanced-static-mesh-component-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/modeling-mode-in-unreal-engine"
    checklist:
      - "Open Modeling Mode with Shift+5. Select one fence post mesh and open XForm, then Pattern. Use the Line shape to make a row of 12 posts. Set the output type to Instanced Static Mesh and accept."
      - "Select a floor tile and use Pattern with the Grid shape to make a floor of 6x6 tiles. Add a small rotation jitter, a little random rotation, so the tiles do not all look the same."
      - "Select a torch or column mesh and use Pattern with the Circle shape to place 8 copies around a center. This time, output them as single actors."
      - "Select the 8 single actors and run XForm, then Harvest Instances. This turns them into one ISM actor, which is one actor that holds all the instances."
      - "Open XForm, then ISMEd, on the fence row. Delete two instances and move one. Then replace one instance with a different mesh and look at the list of components."
      - "Compare the Outliner before and after. Count the actors in the fence row and in the circle after you harvested it."
    done_when: "Send one screenshot of the level with the three patterns (line, grid and circle). Also send one screenshot of the Details panel of the fence ISM actor that shows its instanced components."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which shapes can the Pattern tool tile meshes along?"
        choices: ["Line, Grid or Circle on a movable 3D plane", "Spline, Landscape or Volume", "Box, Sphere or Cylinder", "Only a straight line"]
        answer_index: 0
        explain: "The Pattern tool tiles one or more selected meshes along a Line, Grid or Circle oriented on a movable 3D plane."
      - q: "Which output types does the Pattern tool offer?"
        choices: ["Static Mesh asset only", "Single actors, dynamic mesh, or instanced static mesh", "Packed Level Actor or Level Instance", "Foliage type or PCG volume"]
        answer_index: 1
        explain: "The ISM page lists the Pattern tool output types as single actors, dynamic mesh and instanced static mesh."
      - q: "In which Modeling Mode category do you find Pattern, Harvest Instances and ISMEd?"
        choices: ["Create", "Mesh", "XForm", "Misc"]
        answer_index: 2
