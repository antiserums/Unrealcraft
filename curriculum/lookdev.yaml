    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/modeling-tools-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/instanced-static-mesh-component-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/modeling-mode-in-unreal-engine"
    checklist:
      - "Open Modeling Mode (Shift+5). Select one fence post mesh and open XForm > Pattern. Use the Line shape to make a row of 12 posts. Set the output type to Instanced Static Mesh and accept."
      - "Select a floor tile and use Pattern with the Grid shape to make a 6x6 floor. Add a small rotation jitter so the tiles do not look stamped."
      - "Select a torch or column mesh and use Pattern with the Circle shape to place 8 copies around a center. Output as single actors this time."
      - "Select the 8 single actors and run XForm > Harvest Instances to turn them into one ISM actor."
      - "Open XForm > ISMEd on the fence row. Delete two instances and move one. Then replace one instance with a different mesh and look at the components list."
      - "Compare the Outliner before and after: count actors in the fence row and in the harvested circle."
    done_when: "One screenshot of the level with the three patterns (line, grid, circle), and one screenshot of the fence ISM actor's Details showing its instanced components."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which shapes can the Pattern tool tile meshes along?"
        choices: ["Line, Grid or Circle on a movable 3D plane", "Spline, Landscape or Volume", "Box, Sphere or Cylinder", "Only a straight line"]
        answer_index: 0
        explain: "The Pattern tool tiles one or more selected meshes along a Line, Grid or Circle oriented on a movable 3D plane."
      - q: "Which output types does the Pattern tool offer?"
        choices: ["Static Mesh asset only", "Single actors, dynamic mesh, or instanced static mesh", "Packed Level Actor or Level Instance", "Foliage type or PCG volume"]
        answer_index: 1
        explain: "The ISM page lists the Pattern tool output types as single actors, dynamic mesh and instanced static mesh."
      - q: "In which Modeling Mode category do you find Pattern, Harvest Instances and ISMEd?"
        choices: ["Create", "Mesh", "XForm", "Misc"]
        answer_index: 2
        explain: "Pattern, ISMEd and Harvest Instances are all in the XForm category, which adjusts placement or representation of meshes."
      - q: "You have 30 separate static mesh actors of the same rock. Which tool batches them into one ISM or HISM component?"
        choices: ["Merge", "Union", "Harvest Instances", "Split"]
        answer_index: 2
        explain: "Harvest Instances selects a set of static mesh actors and batches them into an ISM or HISM component. Merge and Union combine geometry into one mesh."
      - q: "In the ISM Editor you replace one instance with a different static mesh asset. What happens?"
        choices: ["The whole component switches to the new mesh", "A second ISM component is added for the new mesh", "The instance is deleted", "Nothing, replacing is not supported"]
        answer_index: 1
        explain: "When you replace an instance with a new static mesh asset, a second ISM component is added, because one component can only hold one mesh."
      - q: "What is the difference between the XForm Merge tool and the Mesh category Union tool?"
        choices: ["Merge keeps intersecting geometry; Union resolves self-intersections", "Merge works on volumes only", "Union creates an ISM", "There is no difference"]
        answer_index: 0
        explain: "Merge combines meshes into one and keeps intersecting geometry. Union combines meshes and resolves self-intersections."
      - q: "What does the XForm Duplicate tool do?"
        choices: ["Creates an instance in an ISM", "Duplicates a single mesh, creating a new actor", "Copies a mesh to the clipboard", "Tiles the mesh along a grid"]
        answer_index: 1
        explain: "Duplicate duplicates a single mesh and creates a new actor. Tiling many copies is the Pattern tool's job."
      - q: "The Modeling option is missing from the Modes dropdown. What does the page say to check?"
        choices: ["The Geometry Script plugin", "The Modeling Tools Editor Mode plugin under Edit > Plugins", "The PCG plugin", "Project Settings > Editor"]
        answer_index: 1
        explain: "If Modeling does not appear, enable Modeling Tools Editor Mode in Edit > Plugins."
    flavors:
      _default: {why: "Pattern builds fences, floors and rings in seconds and can output instances instead of loose actors."}
      lookdev: {why: "Most modular kits are rows, grids and rings. Pattern with jitter makes them fast and less stamped.", do: "Add scale jitter to the grid floor and check the seams still line up."}
      tech_art: {why: "Pattern, Harvest Instances and ISMEd are the manual side of instancing; knowing them helps you debug what PCG or Blueprints produce.", do: "Open the harvested actor and read its ISM component's instance count in Details."}

