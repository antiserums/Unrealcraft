      - q: "What does the ProjectionTansitionContrast input control?"
        choices: ["The tiling size of the texture on each of the three planes", "The contrast of the blend where two projection planes meet", "The brightness of the texture on faces that point upward in the world", "The number of planes that are projected onto the mesh surface"]
        answer_index: 1
        explain: "When projecting in X, Y and Z, this input sharpens or softens the seam where projection planes meet."
      - q: "You want gravel on top faces and brick on the sides in one function. Which function gives separate XY, YZ and XZ texture inputs?"
        choices: ["WorldCoordinate3Way", "WorldAlignedTexture", "LocalAlignedTexture", "CylindricalUVs"]
        answer_index: 0
        explain: "WorldCoordinate3Way takes one texture per plane, with scale and blend controls per plane, and a Single Texture switch to reuse one."
      - q: "Which WorldAlignedNormal output adds a contrast boost?"
        choices: ["XY Texture", "Z Texture", "XYZFlatTop", "XYZ Texture"]
        answer_index: 2
        explain: "XYZFlatTop projects in X, Y and Z with an added contrast boost; XYZ Texture is the plain three-axis result."
      - q: "What is different about LocalAlignedTexture compared to WorldAlignedTexture?"
        choices: ["It only supports normal maps, and base color has to come from another node of the graph", "It tiles in the object's local space, so the texture moves with the object", "It uses the UVs of the mesh instead of positions, so it needs no projection", "It has no Z output"]
        answer_index: 1
        explain: "LocalAlignedTexture tiles in local space. The docs also note its Normal input is currently nonfunctional."
      - q: "Which value type must be connected to the TextureObject input of these functions?"
        choices: ["A Texture Sample RGB output", "A Vector3 constant", "A Scalar", "A Texture Object"]
        answer_index: 3
        explain: "The functions take a Texture Object input and do the sampling internally in world space."
    flavors:
