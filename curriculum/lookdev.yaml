    title: Triplanar walls that ignore scale
    brief: "Normally a texture is placed on a mesh with its UVs, so the texture stretches when you scale the mesh. World-aligned texturing, also called triplanar, projects the texture from the three world axes instead. The texture then keeps the same size on every mesh, whatever its scale or rotation. In this quest you build a world-aligned stone material, test it on three cubes, and see its main weakness on objects that move."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/texturing-material-functions-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/material-functions-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a material named M_WorldStone. Add a WorldAlignedTexture function, and connect a stone base color texture to it as a Texture Object, not as a Texture Sample. If you have no stone texture, T_GridChecker_A from the folder LevelPrototyping/Textures of the template works for the test."
      - "Connect a Vector3 parameter to TextureSize and start with the value 200,200,200. Connect the XYZ Texture output to Base Color."
      - "Add a WorldAlignedNormal function with the matching normal map and the same TextureSize. Connect its XYZ output to Normal."
      - "Apply the material to three cubes that have different scales and rotations. Confirm that the stone has the same size on all of them."
      - "Make a second material named M_WorldStone3Way that uses WorldCoordinate3Way. Give it a different texture, such as gravel, for the XY plane, which is the top. Adjust Blend Exponent until the seams are soft."
      - "Rotate one cube during play or in Sequencer, and notice that the texture slides over the surface. This is called swimming. Write one line about when you would avoid this technique."
    done_when: "Send a viewport screenshot of the three cubes at different scales that shows the same texture size on each, and a screenshot of the M_WorldStone3Way graph. Add one line about the swimming problem."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What unit does TextureSize on WorldAlignedTexture use?"
        choices: ["A percentage of the texture", "UV tiles per meter", "World units along X, Y and Z", "Pixels on the screen"]
        answer_index: 2
        explain: "World-aligned functions scale in world units instead of as a percentage of texture size, so the result is the same on any mesh."
      - q: "A door that opens uses a world-aligned material. What visual problem does the docs warn about?"
        choices: ["The texture stays in place and the object slides under it (swimming)", "The texture disappears when the door is fully open", "The normal map inverts when the door turns by 180 degrees", "The material becomes unlit while the door moves and lit when it stops"]
        answer_index: 0
        explain: "Because tiling is in world space, animated or moving objects experience texture swimming."
      - q: "Which WorldAlignedTexture input rotates the projection so that a different axis counts as up?"
        choices: ["WorldPosition", "ExportFloat 4", "ProjectionTansitionContrast", "World Space Normal"]
        answer_index: 3
