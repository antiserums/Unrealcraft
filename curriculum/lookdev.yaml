      - q: "How should the Film settings be used in a project?"
        choices: ["Changed per shot to match the mood", "Animated during gameplay", "Set once project-wide; use Color Grading for artistic changes", "Set only inside Cine Cameras"]
        answer_index: 2
        explain: "Film controls define one project-wide look. They should not change per shot or dynamically. Use the Color Grading properties for artistic adjustments."
      - q: "With the filmic tonemapper, a colored emissive surface gets extremely bright. What happens to its color?"
        choices: ["It becomes white, like a saturated film sensor", "It becomes more saturated", "It becomes black", "It keeps the exact same color"]
        answer_index: 0
        explain: "Emissive is physically correct: as power increases the color gets lighter, and when bright enough to saturate the film it becomes white. The legacy tonemapper just over-saturated."
    flavors:
