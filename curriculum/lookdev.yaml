      - q: "The textures seem to slide across the wall as you move. What does the tutorial change?"
        choices: ["Raise the Height Ratio", "Turn off the normal map, which is the cause", "Increase the resolution of all the textures", "Lower the Height Ratio (from 0.05 to 0.005)"]
        answer_index: 3
        explain: "UV swimming means the parallax is too strong. The tutorial lowers Height Ratio to 0.005."
      - q: "Where does the tutorial get its height map?"
        choices: ["A separate T_Brick_Clay_New_H texture made for the height map", "The alpha channel of the diffuse texture T_Brick_Clay_New_D", "The blue channel of the normal map T_Brick_Clay_New_N", "A Constant with a value of 0.5 for the whole of the wall"]
        answer_index: 1
        explain: "The diffuse texture stores height in its Alpha channel, so a duplicated sample's A output feeds the Height input."
      - q: "The BumpOffset node shows an error right after you connect it to the UVs. Why?"
        choices: ["No height map is connected to Height yet", "The material has no normal map", "Height Ratio is zero", "The node needs a Texture Object on Height"]
        answer_index: 0
