        answer_index: 1
        explain: "If the project only uses Nanite, ISM is always the choice. HISMs are for projects with Nanite and fallback meshes when appropriate."
      - q: "When is a HISM described as the better choice?"
        choices: ["When instances move every frame", "When you need per-instance materials", "When you have thousands of instances that do not move, so a static hierarchy accelerates culling and LOD", "When the mesh has many triangles and per-instance LOD matters"]
        answer_index: 2
        explain: "HISMs can be better with thousands of static instances. Non-static instances can cause errors with HISMs, and HISM groups LODs so it suits low-triangle meshes."
      - q: "You batch a selection that contains three different static mesh assets with Merge Actors (Batch). What do you get?"
        choices: ["One ISM component with all three meshes", "One instanced static mesh component per unique static mesh asset", "One merged static mesh asset", "Three separate actors"]
        answer_index: 1
        explain: "When grouping multiple unique static meshes into one actor, an ISM component is created per unique static mesh asset."
      - q: "Which menu path does the page give for batching actors into ISMs?"
        choices: ["Actor > Merge Actors > Merge Actors Settings, then Batch", "Edit > Batch Instances", "Window > ISM Editor", "Build > Build Instances"]
        answer_index: 0
        explain: "Select the actors, open Actor > Merge Actors > Merge Actors Settings, change the method to Batch and click Merge Actors."
      - q: "What does creating a Packed Level Actor do to the selected actors' meshes?"
        choices: ["Converts them to Nanite", "Bakes them into one static mesh asset", "Groups them automatically into a HISM inside a Blueprint actor", "Turns them into foliage"]
        answer_index: 2
        explain: "The page says actors are automatically grouped into a HISM when you use Create Packed Level Actor. Edit the Blueprint to change component properties."
      - q: "How can you vary the look of individual instances without creating a new dynamic material instance per mesh?"
        choices: ["Give each instance its own material slot", "Use Per Instance Custom Data or Custom Primitive Data read in the material", "Paint vertex colors per instance", "Use a Material Parameter Collection per instance"]
        answer_index: 1
        explain: "Custom Primitive Data and Per Instance Custom Data pass float data to the material without a new material instance, which keeps draw calls low."
    flavors:
      _default: {why: "Set dressing is mostly repeated meshes. Instancing decides whether 500 props cost 500 draw calls or a few."}
      lookdev: {why: "Knowing when the editor already instances for you (Foliage, Packed Level Actors, PCG) tells you where hand placement is fine and where it is not.", do: "Check one of your existing Packed Level Actors and confirm it contains HISM components."}
      tech_art: {why: "ISM versus HISM is a common question from artists; the page gives clear rules you can quote.", do: "Profile both shelves with stat rhi and note the difference, if any, at your view distance."}

  - id: EAQ114
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [data-layers, world-partition, organization]
    required_spine: false
    required: false
    title: Art variants with Data Layers
    brief: "A Data Layer is a named group of actors in a World Partition level that you can load and unload together. This lets one level hold several versions of its decoration, for example a winter look and a summer look, without copying the whole map. In this quest you create three Data Layers, decorate one area in two ways, and switch between the two versions while the game runs."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition---data-layers-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-editor-context-in-unreal-engine"
    checklist:
      - "In a World Partition level, open the Content Browser and create three Data Layer assets (choose Miscellaneous, then Data Layer). Name them DL_Dressing_Base with the Editor type, DL_Dressing_Winter with the Runtime type, and DL_Dressing_Summer with the Runtime type."
      - "Open Window > World Partition > Data Layer Outliner. Drag each asset into it to create a Data Layer Instance."
      - "Right-click DL_Dressing_Base in the outliner and choose Make Current Data Layer. Place your permanent props and confirm that they are assigned to the layer automatically. Then choose Clear Current Data Layers."
      - "Decorate one area twice. Assign snow piles and bare trees to DL_Dressing_Winter, and assign flowers and leafy trees to DL_Dressing_Summer. Use Add Selected Actors to Selected Data Layer to assign them."
      - "Set Initial Runtime State so that Summer is Activated and Winter is Unloaded. Use the visibility checkbox and the Loaded In Editor checkbox to look at each version."
      - "In the Level Blueprint, add a key press event. Use the Data Layer Subsystem to set Winter to Activated and Summer to Unloaded. Test it while playing in the editor."
    done_when: "Send two screenshots of the same area, one in its Winter version and one in its Summer version. Also send a screenshot of the Data Layer Outliner that shows all three layers and their types."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What are the two asset pieces that make up the Data Layers system?"
        choices: ["Data Layer Assets and Data Layer Instances", "Layer Volumes and Layer Actors", "Streaming Levels and Sub-levels", "Data Tables and Data Assets"]
        answer_index: 0
        explain: "Data Layer Assets hold cross-world data at the project level. Data Layer Instances are world-specific and are created in the Data Layer Outliner."
      - q: "What is the difference between an Editor Data Layer and a Runtime Data Layer?"
        choices: ["Editor layers can hold more actors", "Runtime layers can be loaded and unloaded by Blueprints or C++ at runtime; Editor layers are for organizing in the editor", "Editor layers are always visible in the game", "There is no difference except color"]
        answer_index: 1
        explain: "Editor Data Layers keep assets organized and can be loaded or hidden in the editor. Runtime Data Layers can also be toggled with in-game events."
      - q: "Where do you create a Data Layer Instance?"
        choices: ["In the Content Browser under Miscellaneous", "In World Settings", "In the Data Layer Outliner, or by dragging a Data Layer Asset into it", "In the Level Blueprint"]
        answer_index: 2
        explain: "Instances are created in the Data Layer Outliner with Create New Data Layer, or by dragging a Data Layer Asset into the outliner."
      - q: "You choose Make Current Data Layer on a layer. What happens to actors you place afterwards?"
        choices: ["Nothing until you assign them by hand", "They are automatically assigned to that Data Layer Instance", "They are hidden", "They are moved to a new sub-level"]
        answer_index: 1
        explain: "Make Current sets the layer in the Actor Editor Context, and all actors added while it is active are assigned to that instance."
      - q: "What does the Data Layers system require of the level?"
        choices: ["Lumen must be enabled", "The level must use World Partition", "The level must be a Level Instance", "The level must have HLODs built"]
        answer_index: 1
        explain: "Data Layers require World Partition. A map can be converted with Tools > Convert Level or the commandlet."
      - q: "You want a holiday version of a point of interest to be off by default in one world but always on in another world, using the same layer asset. What lets you do that?"
        choices: ["Two copies of the Data Layer Asset", "A Runtime Data Layer cannot do this", "A separate level per world", "Data Layer Instances with different instance properties in each world"]
        answer_index: 3
        explain: "A Data Layer Asset can exist in several worlds through instances, and each instance can specify different properties such as its initial state."
      - q: "In the page's Blueprint example, what does setting a Data Layer Instance Runtime State to Loaded do?"
        choices: ["Loads the actors and makes them visible", "Loads the actors but does not make them visible", "Unloads the actors", "Deletes the layer"]
        answer_index: 1
        explain: "The example states that changing the state to Loaded makes the layer loaded but not visible in the level. Activated is the visible state."
      - q: "The page warns about a performance concern with Runtime Data Layers. Which one?"
        choices: ["Widely used assets assigned to too many Runtime Data Layer Instances can degrade World Partition streaming", "Runtime layers double texture memory", "Editor layers cannot be saved", "More than three layers is not supported"]
        answer_index: 0
        explain: "Loading many assets at once can hurt performance, and assets on too many Runtime Data Layer Instances can degrade streaming performance."
    flavors:
      _default: {why: "Data Layers let one level hold several dressing variants without duplicating the map."}
      lookdev: {why: "Seasonal, damaged or time-of-day dressing variants live side by side and can be reviewed with one checkbox.", do: "Make a third Runtime layer for a damaged variant and switch to it in PIE."}
      cinematics: {why: "A shot can switch dressing variants without loading another level.", do: "Note which layer state you would set before recording a winter shot."}

  - id: EAQ115
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [screenshots, review, presentation]
    required_spine: false
    required: false
    title: Review captures that match
    brief: "When other people review your art, they need pictures that show the same view before and after a change, at a size where small details are visible. Unreal has a High Resolution Screenshot tool for this, and bookmarks that bring the camera back to exactly the same view. In this quest you save three bookmarks and use the tool to take large captures, a capture of one region, images without lighting, and a cutout of one prop."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/taking-screenshots-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-bookmarks"
    checklist:
      - "Set three world bookmarks (1, 2 and 3) on views of your decorated area. Bookmarks let you return to the same view, so every capture can be repeated."
      - "Open Viewport Options, then High Resolution Screenshot. Set the Screenshot Size Multiplier to 2 and capture bookmark 1. Find the file in the folder Saved/Screenshots/Windows."
      - "Press Specify Region and drag a region around one group of props. Capture again, and then clear the region."
      - "Enable Include Buffer Visualization Targets and capture bookmark 2. Open the BaseColor image and the Roughness image, and check that your props are still easy to read without lighting."
      - "Select one main prop and enable Render CustomDepth Pass in its Details panel. In the screenshot tool, enable Use custom depth as mask, and capture a cutout of the prop."
      - "Play in the editor, open the console and run HighResShot 2 for bookmark 3. Name the files Review_<area>_<bookmark> and post them together."
    done_when: "Send three review captures of the same bookmarks, the BaseColor buffer image, and the custom depth cutout. All files must be named as the checklist says."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Where are screenshots saved by default?"
        choices: ["Content/Screenshots", "Saved/Screenshots/Windows inside the project folder", "The Windows Pictures folder", "Intermediate/Captures"]
        answer_index: 1
        explain: "By default screenshots go to Saved\\Screenshots\\Windows in the project folder, and a message in the lower right links to the folder."
      - q: "How does the HighResShot command produce an image larger than the screen?"
        choices: ["It upscales the final frame with TSR", "It lowers the screen percentage", "It renders the frame in tiles at full resolution and joins them into one image", "It uses the Movie Render Queue"]
        answer_index: 2
        explain: "The high resolution screenshot renders the game frame multiple times, one tile at a time, and concatenates the tiles into a single image file."
      - q: "What is the default size of a HighResShot capture when you give no parameters?"
        choices: ["The same as the screen resolution", "2 times the game resolution", "4 times the game resolution", "3840 x 2160"]
        answer_index: 2
        explain: "The default behavior is a screenshot with a resolution 4 times greater than the game resolution."
      - q: "Which key takes a standard screenshot by default?"
        choices: ["F9", "F12", "Print Screen", "Ctrl+Shift+S"]
        answer_index: 0
        explain: "The standard screenshot uses the Shot console command, and its default key binding is F9."
      - q: "You want to capture only a hero prop with the background removed. What must be enabled on the prop?"
        choices: ["Cast Shadow", "Render CustomDepth Pass", "Nanite", "Is Editor Only"]
        answer_index: 1
        explain: "Select the objects, enable Render CustomDepth Pass in Details, then enable Use custom depth as mask in the tool before capturing."
      - q: "What does the Include Buffer Visualization Targets option export?"
        choices: ["A video of the viewport", "A separate image for each G-Buffer pass such as BaseColor, Roughness and WorldNormal", "The level's lightmaps", "A depth-only image"]
        answer_index: 1
        explain: "With that option on, the capture folder contains one screenshot per G-Buffer, including BaseColor, Metallic, Roughness, SceneDepth and WorldNormal."
      - q: "What does the page warn about very large screenshot multipliers?"
        choices: ["The image will be blurry", "The graphics driver may become unresponsive and crash; use a lower number", "Post process is disabled", "The file is saved as JPEG"]
        answer_index: 1
        explain: "Due to the high system requirements, very large multipliers can make the graphics driver unresponsive and possibly crash."
      - q: "Which HighResShot parameter writes an HDR .EXR image?"
        choices: ["bDateTimeAsFilename", "bDumpBufferVisualizationTargets", "bCaptureHDR", "Multiplier"]
        answer_index: 2
        explain: "bCaptureHDR toggles the use of the .EXR file format to capture an HDR image. bDateTimeAsFilename only changes the file name."
    flavors:
      _default: {why: "Reviews only work when the before and after captures match, at a size where details can be judged."}
      lookdev: {why: "Buffer captures let a reviewer judge your albedo and roughness without lighting hiding mistakes.", do: "Post the BaseColor buffer next to the lit capture and mark one texture you would fix."}
      cinematics: {why: "High resolution stills from bookmarks are the fast path to a frame reference before a full render.", do: "Capture at 4K with the XxY parameter using the aspect of your shot."}
