    required: false
    title: Cinematic depth of field on a Cine Camera
    brief: "Depth of field means that only things at a certain distance from the camera are sharp, and things nearer or further away are blurred. It guides the eye of the viewer to the subject. A Cine Camera Actor in Unreal controls it with real camera values: the focus distance, the focal length of the lens, and the aperture, which is the size of the lens opening written as an f-number. In this quest you focus a Cine Camera on a prop and see how each value changes the blur."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-depth-of-field-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Place a main prop, such as a mannequin or a cube, with other objects behind it and in front of it, and a small bright light in the background. Place a Cine Camera Actor named CineCam_DOF about 4 to 7 m from the main prop and pilot it, so you look through it."
      - "Set Focus Method to Manual and enable Draw Debug Focus Plane, which shows a colored plane at the focus distance. Change Manual Focus Distance until the plane sits on your main prop."
      - "Set Current Focal Length to 50 mm, then 75 mm, then 100 mm. Note how the field of view and the blur of the background change."
      - "Set Current Aperture to f/1.4, then f/2.8, then f/5.6, and compare the blur of the background."
      - "Set Diaphragm Blade Count to 5 and Min FStop to 1.4. Look at the bokeh shape, which is the shape of a blurred point of light, on a small bright light in the background."
      - "Open Show, then Advanced, then Depth of Field Layers. Use this view to check which areas are foreground, in focus and background."
      - "Make sure Engine Scalability is set to Epic or Cinematic before you judge the bokeh."
    done_when: "Send three screenshots from CineCam_DOF at f/1.4, f/2.8 and f/5.6 with the same focus distance, and one screenshot of the Depth of Field Layers view. List your focal length and your focus distance."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which three settings decide the depth of field of a shot, according to the page?"
        choices: ["ISO, shutter speed and white balance", "Sensor width, sensor height and the field of view", "Bloom, exposure and vignette", "Focal length, aperture (f-stop) and focus distance"]
        answer_index: 3
        explain: "The page lists three core factors: the lens focal length, the aperture (f-stop) and the distance to the subject."
      - q: "You change the aperture from f/5.6 to f/1.4. What happens?"
        choices: ["The depth of field gets deeper with less foreground and background blur", "The image gets darker and the depth of field stays as it was before", "The depth of field gets shallower with more foreground and background blur", "The field of view narrows and the depth of field stays the same"]
        answer_index: 2
        explain: "Smaller f-stop numbers mean a larger opening and a shallower depth of field with more blur."
      - q: "In Unreal, does changing the f-stop also change the brightness of the image?"
        choices: ["Yes, exactly like a real camera, so you must lower the exposure when you open the aperture", "No, aperture does not control light intensity so you do not need to re-adjust exposure", "Yes, but only with auto exposure turned on; with manual exposure nothing changes at all", "Only in Movie Render Queue, where the Camera setting applies it"]
        answer_index: 1
        explain: "The page says this is not a real camera, so adjusting the f-stop and diaphragm does not control the light intensity."
      - q: "You increase the focal length from 50 mm to 100 mm. What happens to the field of view?"
        choices: ["It gets narrower, like zooming in, and out-of-focus areas become more pronounced", "It gets wider, like zooming out, and out-of-focus areas become less pronounced", "It stays the same, and only the depth of field gets much shallower", "It flips vertically, as it does when a real lens is reversed"]
        answer_index: 0
        explain: "As the focal length increases, the FOV decreases, and the background and foreground blur become more visible."
      - q: "Your bokeh shows perfect circles even with Diaphragm Blade Count set to 5. What is the most likely reason?"
        choices: ["Blade count only works above 8, and lower values always fall back to one perfect circle", "Engine Scalability is below Epic, so the diaphragm simulation falls back to circle bokeh", "The camera is not piloted, so its lens settings are not used by the view", "Focus Method is Manual, and blades need the Tracking method"]
        answer_index: 1
        explain: "The diaphragm simulation is only supported at Epic and Cinematic scalability. Lower settings fall back to circular bokeh."
      - q: "Which Focus Method options does a Cine Camera Actor offer?"
        choices: ["None, Manual, Tracking", "Auto, Manual, Cinematic", "Near, Far, Infinite", "Static, Dynamic, Locked"]
        answer_index: 0
        explain: "Focus Method can be None (DOF off), Manual (set or animate a distance) or Tracking (lock focus on an object)."
      - q: "What does Draw Debug Focus Plane show?"
        choices: ["A wireframe of the camera frustum", "Colored layers for foreground and background", "The bokeh shape as an overlay", "A translucent plane at the current focus depth"]
        answer_index: 3
        explain: "It draws a translucent plane at the focus depth so you can see where the focus is, in a color you can choose."
      - q: "In the Depth of Field Layers view, which color marks the in-focus region?"
        choices: ["Green", "Blue", "Black", "Red"]
