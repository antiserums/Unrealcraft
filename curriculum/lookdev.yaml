    title: HDR display output, first test
    brief: "An HDR display can show much brighter highlights and more colors than a normal display, which is called SDR. Unreal can send an HDR picture to such a display, and it uses the ACES color standard to convert the image correctly. Even if your monitor is SDR today, it helps to know which console variables control this. In this quest you read about the ACES steps, turn HDR output on with console variables, and write down what happened."
