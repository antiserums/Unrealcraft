      - q: "You set the Temp value higher than the temperature of the light in the scene. What happens?"
        choices: ["The image gets a cool, blue look", "The image gets a warm, yellow look", "The image gets darker", "Nothing until you change Tint"]
        answer_index: 1
        explain: "When Temp matches the light, the light looks white. Higher than the light gives a warm, yellow color; lower gives a cool, blue color."
      - q: "What does Tint adjust?"
        choices: ["The cyan and magenta ranges", "The red and blue ranges", "The brightness of highlights", "The strength of the LUT"]
        answer_index: 0
        explain: "Tint adjusts the white balance tint by moving between cyan and magenta. Use it after Temp to get natural colors."
      - q: "Which section should you use for most of your color grading changes?"
        choices: ["Highlights", "Shadows", "Global", "Film"]
        answer_index: 2
        explain: "The page says to start with the Global properties and do the majority of grading there before touching the other sections."
