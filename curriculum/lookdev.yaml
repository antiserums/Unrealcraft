    title: Real displacement with Nanite tessellation
    brief: "Displacement moves the real surface of a mesh in and out according to a height map, so the outline of the mesh changes too. Nanite is the system in Unreal that draws meshes with very many triangles, and Nanite tessellation adds the extra triangles for displacement only where the screen needs them. This feature is experimental, so you must turn it on first. In this quest you enable it, build a displaced brick material, and compare the edge of a wall with and without displacement."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/working-with-naniteenabled-content"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/nanite-virtualized-geometry-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/nanite-virtualized-geometry-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Nanite tessellation is experimental, so you have to turn it on. In the file Config/DefaultEngine.ini of the project (or in ConsoleVariables.ini), add r.Nanite.AllowTessellation=1 and r.Nanite.Tessellation=1. Then restart the editor."
      - "Make a flat wall mesh: in Modeling Mode, create a Box that is wide, tall and thin, accept it as a Static Mesh, and name the asset SM_Wall. Open it in the Static Mesh Editor and enable Nanite on it."
      - "Create a material named M_NaniteBrick. Select the Main Material Node and check Enable Tessellation under the Nanite settings. Connect a height texture with values from 0 to 1 to the Displacement pin, and also connect a matching normal map. A free brick or stone surface from Fab that includes a height map gives the best result. For a first test, the grid textures of the engine work: T_Default_Material_Grid_M as the height and T_Default_Material_Grid_N as the normal map. To see engine content, open the Settings menu of the Content Browser and turn on Show Engine Content."
      - "Set Magnitude to a small value, for example 4, and set Center to 0.5 so the surface moves both in and out. Apply the material to SM_Wall."
      - "Enable Displacement Fade, and set Start Fade Size and End Fade Size in pixels so that the effect disappears at a distance."
      - "Compare this with the static option. In the Static Mesh Editor, under Nanite Settings, set Trim Relative Error to 0.04, add a Displacement Map with a Magnitude, and click Apply Changes."
      - "Take a screenshot of the edge of the wall from a low angle with tessellation on, and another one with tessellation off."
    done_when: "Send two viewport screenshots of the edge of the wall, one with displacement and one without. Also send a screenshot of the material Details panel that shows Enable Tessellation, Magnitude and Center. Add one line that says which Magnitude you used and why you did not use a larger one."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "How is Nanite tessellation different from World Position Offset?"
        choices: ["WPO works per pixel and needs no extra triangles; tessellation works per vertex and only moves the original vertices", "Tessellation works on non-Nanite meshes too and needs no displacement map; WPO needs a Nanite mesh and a texture to work", "WPO only moves the original vertices; tessellation creates new triangles at runtime to follow the displacement map", "There is no difference; tessellation is the new name of WPO"]
        answer_index: 2
        explain: "Nanite displacement dices the mesh at runtime into more triangles as needed for pixel density, while WPO can only move existing vertices."
      - q: "Which console variable must be set in a config file because it is read-only at runtime?"
        choices: ["r.Nanite.AllowTessellation", "r.Nanite.Tessellation", "r.Nanite.MaxPixelsPerEdge", "r.SplineMesh.RenderNanite"]
        answer_index: 0
        explain: "r.Nanite.AllowTessellation=1 is read-only and must be in the project config; r.Nanite.Tessellation=1 can be toggled at runtime."
      - q: "Why does Epic warn against setting a large Magnitude and scaling the Displacement input down to compensate?"
        choices: ["It makes the displacement texture look blurry, because the engine samples a lower mip when the Magnitude value is very large", "Magnitude is capped at 1, so any value above that is ignored by the engine, and the scaled Displacement input then gives a result that is too flat", "It disables the normal map of the material, because the engine builds a new normal from the displaced surface when the Magnitude is large", "Magnitude sets the bounds used for culling patches, so a large value hurts performance, especially with Virtual Shadow Maps"]
        answer_index: 3
        explain: "Use the full 0-1 range of the Displacement output and keep Magnitude as small as necessary, because it bounds patches for culling."
      - q: "You want displacement to only push outward from the base mesh. What Center value do you use?"
        choices: ["0.5", "0", "1", "-1"]
        answer_index: 1
        explain: "Center defines which displacement value means no change. 0.5 gives equal in and out; 0 pushes only outward."
      - q: "Displacement looks flat when lit. What does the docs say you must add?"
        choices: ["A corresponding normal map, because displacement does not change shading", "A second displacement map, because one map only moves the surface inward", "Higher Magnitude, because low values are hidden by the light of the scene", "Pixel Depth Offset, because it adds the shadows that displacement leaves out"]
        answer_index: 0
        explain: "Unlike offline renderers, displacement here does not change shading. Supply a normal map or derive normals from the displacement."
      - q: "You scaled a cube into a long wall and the bricks displace much more than expected. Why?"
        choices: ["The texture is too large for the wall, so each brick covers more of the surface than it did on the cube", "Nanite disables the scaling of displaced meshes, so the bricks keep the size they had on the cube", "Displacement is in local space before object scale, so Magnitude is in unscaled object units", "The Center is wrong for a scaled mesh, so the bricks move outward from a point that is not on the wall"]
        answer_index: 2
        explain: "Displacement is applied in local space before scaling. Epic notes a world-space option may come later."
      - q: "Which feature is ignored when tessellation is enabled?"
        choices: ["Opacity Mask", "Pixel Depth Offset", "World Position Offset", "Virtual Shadow Maps"]
        answer_index: 1
        explain: "Tessellation is not compatible with Pixel Depth Offset; PDO is ignored. WPO and Opacity Mask can be combined with limits."
