        choices: ["Speed Up low, Speed Down high", "Speed Up and Speed Down both 0", "Speed Up high, Speed Down low", "Speed Up equal to Speed Down"]
        answer_index: 2
        explain: "Eyes adapt fast from dark to bright (Speed Up high) and slowly from bright to dark (Speed Down low)."
      - q: "When is Local Exposure most useful?"
        choices: ["In flat, evenly lit scenes", "Only on mobile", "When the tonemapper is off", "In high-contrast scenes, like a dark interior with a bright exterior visible through a door"]
