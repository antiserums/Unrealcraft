      - q: "You scale a displaced cube 10x to make a wall. What happens to the displacement height?"
        choices: ["It scales with the mesh, because Magnitude is in local space before object scale", "It stays the same in world units", "It becomes zero", "It switches to world space automatically"]
        answer_index: 0
        explain: "Displacement is applied in object space before scaling. The page notes a world-space option may come later."
      - q: "Which texture compression does the page say works decently for displacement maps?"
        choices: ["Packing the height into a normal map", "Any HDR float format only", "Alpha (BC4), or the alpha of a Default/DXT5 texture", "Compression does not matter"]
        answer_index: 2
        explain: "Compression artifacts show as stair steps. Packing height with normals in a compressed format will likely show artifacts."
    flavors:
      _default: {why: "Baked Nanite displacement adds real surface detail from a texture, without a heavy source mesh."}
      lookdev: {why: "Height maps you already own can become geometry.", do: "Try two different Magnitude values on the same slab and note when cracks appear at UV seams."}
