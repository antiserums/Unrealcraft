        choices: ["Hiding the landscape actor in game", "Controlling landscape LOD distance", "Fading the landscape at the world edge", "Masking out parts of the landscape to make holes for tunnels or caves"]
        answer_index: 3
        explain: "The Visibility tool masks out parts of the landscape so you can build caves and tunnels with static meshes, working around the 2D heightmap limit."
      - q: "What must be in the landscape material before the Visibility tool works properly?"
        choices: ["A Landscape Layer Coords node", "A Landscape Visibility Mask node connected to Opacity Mask", "A Landscape Grass Output", "A Static Switch parameter"]
