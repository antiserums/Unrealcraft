    title: Quick prop with Boolean and Bevel
    brief: "Modeling Mode is a set of tools inside the Unreal editor for making and changing meshes, so you do not always need another 3D program. A Boolean combines two meshes, for example by cutting the shape of one out of the other, and a Bevel makes sharp edges softer. In this quest you build a quick prop from a box and a cylinder with these tools and save it as a Static Mesh."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/modeling-mode-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/modeling-tools-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/boolean-tool-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/polygroup-edit-tool-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, and open any level. Press SHIFT+5 to enter Modeling Mode. If Modeling Mode is missing, enable the plugin named Modeling Tools Editor Mode first."
      - "In the Create category, place a Box with Output Type set to Static Mesh. This is the body of your prop. Then place a Cylinder that cuts into the Box."
      - "Select the Box first, and then the Cylinder. Open Model, then Boolean, and use Difference A - B to cut a hole in the Box. Click Accept."
      - "Select the result and open Model, then PolyGroup Edit. Select the top face and use Extrude to add a lip. Then select the outer edges and use Bevel. Click Accept."
      - "Open Xform, then Edit Pivot, and set the pivot to Bottom. Click Accept."
      - "Save the asset as SM_Quick_<Name>, with a name of your choice in place of <Name>. Place two copies of it in the level."
    done_when: "Send a screenshot of the finished mesh in the level and a screenshot of the Content Browser that shows SM_Quick_<Name>. Also say which Boolean operation you used."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "In the Boolean tool, which mesh becomes A?"
        choices: ["The larger mesh", "The mesh you selected first", "The mesh you selected last", "The mesh closest to the camera"]
        answer_index: 1
        explain: "The first selection becomes A and the second becomes B. This order matters for Difference A - B and Difference B - A."
      - q: "You cut a hole in a wall with Boolean but the hole cutter remains and the wall is gone. What went wrong?"
        choices: ["You used Union, which merges the two meshes into a single one", "You used Intersection in place of Difference", "You selected the meshes in the wrong order for Difference", "You forgot to press Accept after you selected the meshes"]
        answer_index: 2
        explain: "Difference A - B subtracts the second mesh from the first. If the cutter was selected first, the operation subtracts the wall from the cutter."
      - q: "What happens to your edits if you leave Modeling Mode without pressing Accept?"
        choices: ["They are applied automatically", "They are saved as a new asset", "The editor asks you to name the mesh", "They are discarded and the mesh reverts"]
        answer_index: 3
        explain: "Most tools only preview changes. Exiting the mode or pressing Cancel discards them. Accept applies them to the mesh."
      - q: "You create a mesh with Output Type set to Dynamic Mesh. Where is it saved?"
        choices: ["In the Content Browser as an asset", "In the level only", "In the Project Settings", "In a plugin folder"]
        answer_index: 1
        explain: "A Dynamic Mesh is saved in the level only. A Static Mesh is saved in the Content Browser with an instance placed in the level."
      - q: "PolyGroup Edit is greyed out for an imported mesh. What is the most likely reason?"
        choices: ["The mesh has no PolyGroup information", "The mesh is too small to hold PolyGroups", "The mesh uses Nanite and has no triangles", "The mesh has a material assigned to it"]
        answer_index: 0
        explain: "PolyGroup Edit is not available for meshes with no PolyGroups. Create them with Generate PolyGroups, Paint PolyGroups or Tri Select first."
      - q: "After you Accept a sculpting tool with many brush strokes, what can Undo do?"
        choices: ["Undo each stroke one by one", "Undo only the combined result of all strokes", "Nothing, the change is permanent", "Undo all the strokes but keep the tool open"]
        answer_index: 1
        explain: "While the tool is open you can undo single changes. After Accept, undo history only tracks the mesh before and after the tool."
    flavors:
      _default: {why: "A quick prop made in the editor fills gaps in a kit without a round trip to another program."}
      lookdev: {why: "Boolean and Bevel let you make trims, cutouts and holders in minutes while you see them in the scene.", do: "Use Xform > Bake Transform after scaling so the asset has scale 1 before you share it."}
      tech_art: {why: "Knowing how Modeling Mode handles triangles, PolyGroups and Accept helps you write tools that use the same data.", do: "Open the result in the UV Editor and check what the Boolean did to the UVs."}

  - id: EAQ47
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [uvs, uv-editor, modeling-mode, texturing]
    required_spine: false
    required: false
    title: Fix UVs in the UV Editor
    brief: "UVs are a flat map of the surface of a 3D mesh. They tell Unreal which part of a texture goes on which part of the mesh. When the UVs are stretched or lie on top of each other, every texture on the mesh looks wrong. In this quest you open a mesh in the UV Editor, create clean UVs, and check the result with a checker pattern."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/uv-editor-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/uvs-category-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-uv-channels-with-static-meshes-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. You need a mesh made in Modeling Mode, with UVs that are not clean yet. If you have none, enter Modeling Mode, create a Box as a Static Mesh, and cut a hole into it with a Cylinder and the Boolean tool. Right-click the mesh in the Content Browser and open the UV Editor."
      - "In Display, turn on a checker texture as the background. Look at the 3D Viewport and find places where the checker squares are stretched."
      - "Run AutoUV with the default method, Patch Builder, and click Apply. Then look at the checker squares again."
      - "Use the Seam tool to cut one seam on an edge that players will not see. A seam is a cut that lets the surface unfold flat. Then use Unwrap on that island, which is one connected piece of the UV map."
      - "Use Layout with the type Repack so that no islands overlap inside the 0-1 square. Click Apply and then Save."
      - "In the level, assign a material with a visible texture to the mesh. Compare how it looks now with how it looked before."
    done_when: "Send two screenshots: one of the 2D view of the UV Editor after Repack, and one of the prop in the level with a checker material or a textured material that shows even squares."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Which of these is a way to open the UV Editor?"
        choices: ["Right-click the mesh in the Content Browser", "Window > Cinematics > UV Editor in the main menu", "Edit > Project Settings > Editor > UV Editor", "Press F with the mouse in the Material Editor"]
        answer_index: 0
        explain: "You can open the UV Editor from the UV category in Modeling Mode, by right-clicking a mesh in the level, or right-clicking it in the Content Browser."
      - q: "What does the Sew tool do?"
        choices: ["It splits an island in two along the edges that you selected", "It connects two corresponding edges into one island", "It scales all UVs to fit the 0-1 space", "It bakes the lighting of the level into the new UVs"]
        answer_index: 1
        explain: "Sew joins the selected edge (red) with its counterpart (green). The two parts become one UV island."
      - q: "You want the islands packed into the 0-1 square with NO overlap. Which Layout Type do you pick?"
        choices: ["Transform", "Stack", "Repack", "Mirror"]
        answer_index: 2
        explain: "Repack scales and moves islands together to pack the square with no overlap. Stack packs with overlap, Transform only scales and moves everything."
      - q: "Which AutoUV method does Epic describe as designed for lightmaps and mechanical meshes?"
        choices: ["Patch Builder", "UV Atlas", "XAtlas", "ExpMap"]
        answer_index: 2
        explain: "XAtlas is for lightmaps and mechanical meshes. UV Atlas is for organic objects, and Patch Builder is the default and supports large models."
      - q: "Where should seams usually go?"
        choices: ["On the most visible faces", "Where the audience will not see them", "Always on the top faces of the mesh", "Never, seams are not allowed"]
        answer_index: 1
        explain: "Seams should be invisible to the audience unless you want them as a look. Think about which parts are seen in the experience."
      - q: "You edited UVs but the mesh in the level did not change. What did you probably forget?"
        choices: ["To restart the editor after the change", "To rebuild lighting for the level", "To enable Nanite on the mesh", "To click Apply in the UV Editor toolbar"]
        answer_index: 3
        explain: "Apply writes your UV changes to the original mesh. Until then the edit lives only in the UV Editor."
    flavors:
      _default: {why: "Stretched or overlapping UVs make every texture look wrong. Good UVs are the base of good materials."}
      lookdev: {why: "Meshes made in the editor get default UVs that often stretch. The UV Editor fixes this without leaving Unreal.", do: "Add a second UV channel with the Channels tool and note what you would use it for."}
      tech_art: {why: "UV channels are data your materials read. Knowing how they are made helps you debug texture bugs.", do: "Compare the results of the three AutoUV methods on the same mesh."}

  - id: EAQ48
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [lightmaps, lumen, static-lighting, uvs]
    required_spine: false
    required: false
    title: Lightmap UVs or Lumen
    brief: "Baked lighting is light that Unreal calculates once in the editor and stores in textures called lightmaps. A mesh that uses baked lighting needs a special UV channel, the lightmap UV, where no two faces share the same space. Projects that use Lumen calculate light while the game runs and do not need lightmaps at all. In this quest you find out which kind of lighting a project uses and look at the lightmap settings of one prop."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/understanding-lightmapping-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/generating-lightmap-uvs-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/global-illumination-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/lumen-global-illumination-and-reflections-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open Project Settings, then Engine, then Rendering. Note whether Dynamic Global Illumination is set to Lumen, and whether Allow Static Lighting is turned on."
      - "Open a prop whose name starts with SM_ in the Static Mesh Editor, for example SM_Ramp from the folder LevelPrototyping/Meshes of the template. In the Details panel, expand LOD0 and then Build Settings. Find Generate Lightmap UVs, Min Lightmap Resolution, Source Lightmap Index and Destination Lightmap Index."
      - "Set Min Lightmap Resolution to 64 and click Apply Changes. Then use the UV button in the toolbar to view the lightmap UV channel."
      - "Under General Settings, check that Lightmap Resolution and Lightmap Coordinate Index match the channel you generated."
      - "Write three lines that answer these questions: does this project bake its lighting or use Lumen, and does this prop need a lightmap UV at all?"
    done_when: "Send a screenshot of the Static Mesh Editor that shows the lightmap UV channel and the Build Settings, and add your three lines of text."
    xp: 50
    verify_type: screenshot
    quiz:
      - q: "When does a Static Mesh need a lightmap UV?"
        choices: ["Always, for every mesh, whatever lighting the project uses", "Only when it will be lit with baked (precomputed) lighting", "Only when it uses Nanite, because Nanite stores light in a second UV set", "Only when it has a normal map, which is sampled with the lightmap UV"]
        answer_index: 1
        explain: "Lightmaps are only needed for baked lighting. If the project uses only dynamic lighting, no lightmap UV is needed."
      - q: "Which rule applies to a lightmap UV but NOT to a texture UV?"
        choices: ["It must be inside the bounds of the level it is used in", "Islands may overlap freely, as long as they share a material", "No overlapping faces and enough padding between islands", "It must use UDIMs, with one tile for each material slot of it"]
        answer_index: 2
        explain: "Texture UVs can overlap or tile. Lightmap UVs must give each face unique space and padding so light and shadow do not bleed."
      - q: "From which UV channel does the auto lightmap generator repack by default?"
        choices: ["UV channel 0", "UV channel 1", "The last channel", "A random channel"]
        answer_index: 0
        explain: "By default the generated lightmap UV repacks the charts from the first UV, channel 0, which is usually the texture UV."
      - q: "What does the auto generator NOT do while repacking?"
        choices: ["Add padding between charts", "Split UV chart edges into new islands", "Normalize chart scale", "Store the result in a new UV channel"]
        answer_index: 1
        explain: "The repacker never splits charts. If the source charts are badly cut, the lightmap will be bad too. Split them before import."
      - q: "Why is at least four texels of padding recommended between charts?"
        choices: ["Because DXT compression works on 4x4 texel blocks", "Because Lumen needs it to trace light between the charts", "Because the UV Editor does not accept less padding", "Because meshes have four sides per face"]
        answer_index: 0
        explain: "Texture compression uses 4x4 blocks, so a padding of about four texels avoids bleeding between charts."
      - q: "What happens to precomputed (static) lighting when Lumen is enabled?"
        choices: ["It is blended with Lumen", "It becomes brighter", "It is used for reflections only", "It is removed"]
        answer_index: 3
        explain: "Precomputed lighting from static lights is removed when Lumen is enabled. You can also turn off Allow Static Lighting in Project Settings."
    flavors:
      _default: {why: "Knowing if your project bakes light or uses Lumen decides how much UV work each prop needs."}
      lookdev: {why: "Lightmap UVs cost time. Spend it only when the project actually bakes lighting.", do: "Set Lightmap Resolution to a value higher than Min Lightmap Resolution and explain why."}
      cinematics: {why: "Cinematic scenes often use Lumen for moving lights. Check this before you ask for lightmaps.", do: "Move a light in a Lumen scene and note how many seconds the global lighting takes to update."}

  - id: EAQ49
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [mesh-paint, vertex-color, texture-blending, props]
    required_spine: false
    required: false
    title: Mesh Paint tools and texture weights
    brief: "Mesh Paint mode lets you paint directly on a mesh that is placed in the level. The paint is stored as vertex colors, which are color values saved on each corner point of the mesh, and a material can read them to blend between two textures. This way one copy of a prop can have dirt or moss and the next copy can be clean. In this quest you make a blend material, paint a second texture onto a prop, and copy the paint to another prop."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/mesh-paint-tool-reference-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/mesh-paint-mode-in-unreal-engine"
    extra_urls: []
    checklist:
      - "Open a project made from the Third Person template, or create one. Make a material named M_Blend2 that blends two textures with a Lerp node, and use the alpha of a Vertex Color node to control the blend. Any two textures that look different work, for example T_Quinn_01_D from the folder Characters/Mannequins/Textures/Quinn and T_GridChecker_A from LevelPrototyping/Textures. Place a mesh with many vertices in the level, for example a Sphere made in Modeling Mode with a high number of subdivisions, and apply the material to it."
      - "Enter Mesh Paint mode. Choose the Vertex Weight paint method, and set Texture Weight Type to Alpha (Two Textures)."
      - "Set Paint Texture Weight Index to the second texture and paint dirt or moss on the lower part of the prop. Use Ctrl + [ and Ctrl + ] to make the brush smaller or larger."
      - "Use Color View Mode to look at the Alpha channel. This shows you exactly where you painted."
      - "Click To LODs so that the paint is copied to all LOD levels, which are the simpler versions of the mesh used at a distance. Then click Save."
      - "Duplicate the prop. Use Copy on the painted prop and Paste on the new copy to move the paint across."
    done_when: "Send a screenshot of the painted prop in the level, and a screenshot with Color View Mode set to Alpha Channel. Also say which Texture Weight Type you used."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "What does the Erase Color really do?"
        choices: ["It removes all of the paint from the mesh", "It is a second paint color you can swap to", "It resets the mesh to white on all channels", "It deletes the material of the mesh"]
        answer_index: 1
        explain: "Erase Color does not erase. It is a secondary color, and you can swap it with Paint Color at any time."
      - q: "Which Texture Weight Type blends exactly three textures?"
        choices: ["Alpha (Two Textures)", "RGB (Three Textures)", "ARGB (Four Textures)", "ARGB - 1 (Five Textures)"]
        answer_index: 1
        explain: "RGB blends three textures using painted RGB values. It needs a 3-way lerp blend material on the mesh."
      - q: "What does the To LODs tool do?"
        choices: ["Creates new LODs from LOD0 and copies its vertex colors to them", "Applies the vertex colors from LOD0 to all LOD levels", "Removes the vertex colors from all LOD levels but LOD0", "Sets the LOD screen size from the amount of paint on the mesh"]
        answer_index: 1
        explain: "To LODs copies the vertex colors from LOD0 to every other LOD so the paint does not vanish at a distance."
      - q: "Which keys change the brush size?"
        choices: ["Ctrl + [ and Ctrl + ]", "Shift + Mouse Wheel", "Alt + Arrow keys", "Page Up and Page Down"]
        answer_index: 0
        explain: "Ctrl + Left Bracket makes the brush smaller and Ctrl + Right Bracket makes it larger."
      - q: "The Fill tool fills the mesh with the paint color while respecting which setting?"
        choices: ["The Falloff value", "The LOD Group", "The Collision Preset", "The Channels settings"]
        answer_index: 3
        explain: "Fill uses the paint color but only on the color and alpha channels you enabled in Channels."
      - q: "What does the Vertex Weight painting method require on the mesh?"
        choices: ["A material set up to blend textures between layers", "A Nanite mesh with at least two material slots on it", "A lightmap UV in channel 1 of the mesh", "A Skeletal Mesh with a Physics Asset assigned to it"]
        answer_index: 0
        explain: "Painting texture weights needs a Texture Blended Material with several textures so each layer can be painted and erased."
    flavors:
      _default: {why: "Painting wear and dirt on props per instance makes a kit look hand-placed instead of copied."}
      lookdev: {why: "Mesh Paint lets you break up repetition on placed props with no new textures.", do: "Try Texture Color painting and compare its resource size in the Resource Usage section with vertex colors."}
      tech_art: {why: "The blend material and the paint tool must agree on how many layers there are.", do: "Build the 3-way lerp version of the material and paint with the RGB (Three Textures) type."}

