        answer_index: 3
        explain: "Nanite meshes receive projected decals but do not support Mesh Decals."
      - q: "Why do leaves and grass (aggregate geometry) cost more under Nanite?"
        choices: ["They break fine-grained LOD simplification and occlusion culling, so more triangles are drawn per pixel", "They use too many materials, and Nanite has to draw the whole mesh one more time for each material slot", "Nanite cannot store green pixels, so every leaf texture is converted when the mesh is built, which costs time", "They always need Explicit Tangents, which doubles the size of each vertex and so the cost of each cluster"]
        answer_index: 0
