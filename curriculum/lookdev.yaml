# Unrealcraft — Environment Art specialization, all ranks. IDs EAQ1…
# Difficulty tiers: novice (rank 0) · apprentice (1) · adept (2) · expert (3) · master (4).
# Every URL was checked against the live UE 5.8 docs when written.

quests:
  - id: EAQ36
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [lighting, directional-light, sky-atmosphere]
    required_spine: false
    required: false
    title: Sun and sky, the physical way
    brief: "Outdoor scenes in Unreal usually start with two actors: a Directional Light, which acts as the sun, and a Sky Atmosphere, which draws a sky that reacts to the sun. When the two are linked, moving the sun changes the color of the sky, just like in the real world. In this quest you build this sun and sky from an empty level, rotate the sun to sunset and noon, and add a second light as a moon."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/directional-lights-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/sky-atmosphere-component-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/sky-atmosphere-component-properties-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Make a new level and choose Empty Level. Then place a Directional Light and a Sky Atmosphere from the Place Actors panel."
      - "Select the Directional Light and enable Atmosphere Sun Light in its Details panel. This tells the sky to use this light as the sun. Check that Atmosphere Sun Light Index is 0."
      - "Hold Right Ctrl + L and move the mouse to rotate the sun. Find a low sun angle that looks like a sunset, and a high sun angle that looks like noon."
      - "On the Directional Light, turn on Use Temperature. Try a Temperature of 6500 K and then 3000 K, and note how the color of the light changes."
      - "Turn on the Shadow Frustums view: in the viewport, open Show, then Advanced, and enable Shadow Frustums. Look at the rays of the light and notice that they are parallel, which is how sunlight behaves."
      - "Select the Sky Atmosphere and change Mie Scattering Scale up and down. Then set Mie Anisotropy to 0 and to 0.9 and watch the glow around the sun. Reset the values to their defaults when you are done."
      - "Add a second Directional Light and set its Atmosphere Sun Light Index to 1. Make it dim and blue so it works as a moon, and rotate it so it points the opposite way to the sun."
    done_when: "Send two screenshots of the same view: one at sunset with a low sun, and one at noon with a high sun. In one of them, the Details panel of the Directional Light must be visible with Atmosphere Sun Light enabled."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Why are all shadows from a Directional Light parallel?"
        choices: ["The light is simulated as a source that is infinitely far away", "The light has a Source Radius of zero, so its rays cannot spread out", "The light uses lightmaps only, and baked shadows are always parallel", "The shadow frustum of the light forces all of the rays to align"]
        answer_index: 0
        explain: "A Directional Light simulates a source infinitely far away, so its rays and shadows are parallel. That makes it the right choice for sunlight."
      - q: "The Source Angle of a Directional Light defaults to 0.5357. What is this number?"
        choices: ["The number of shadow cascades", "The angle our sun subtends in degrees", "The default Temperature divided by 100", "The Shadow Bias value"]
        answer_index: 1
        explain: "Source Angle is the angle subtended by the light source in degrees. The default 0.5357 is the angle of our sun."
      - q: "With Use Temperature enabled, which Temperature value gives white light?"
        choices: ["3000K", "1000K", "6500K", "10000K"]
        answer_index: 2
        explain: "The docs say Temperature is the color temperature in Kelvin of the blackbody illuminant, and white is 6500K."
      - q: "You want a sun and a moon, both affecting the atmosphere. How do you set the Atmosphere Sun Light Index?"
        choices: ["Both lights get index 0", "Sun 0 and moon 1", "Sun 1 and moon 2", "Only one light can affect the atmosphere"]
        answer_index: 1
        explain: "Two atmosphere lights are supported at any time. The primary (sun) is index 0 and the secondary (moon) is index 1."
      - q: "Which shortcut rotates the Directional Light with index 0 while you move the mouse?"
        choices: ["Ctrl + Shift + L", "Right Ctrl + L", "Alt + drag", "Right Ctrl + L + Shift"]
        answer_index: 1
        explain: "Right Ctrl + L with mouse movement adjusts the light at index 0 (the sun). Adding Shift adjusts the light at index 1 (the moon)."
      - q: "In the Sky Atmosphere, Mie Anisotropy is moved from 0.8 toward 0.9. What changes?"
        choices: ["Light scatters more uniformly in all directions, so the halo around the sun disappears", "The sky becomes bluer because of Rayleigh scattering, and the sun disk gets a red rim", "Light scatters more forward, so the halo around the sun becomes tighter and brighter", "The planet radius grows"]
        answer_index: 2
        explain: "A value closer to 1 scatters light more forward. This makes a stronger, tighter halo around the light source. A value of 0 scatters uniformly."
    flavors:
      _default: {why: "A physically based sun and sky is the base of almost every outdoor scene."}
      level_design: {why: "Sun angle decides what the player can read at a distance.", do: "Save the two sun angles as viewport bookmarks so you can compare readability."}
      cinematics: {why: "Time of day is a story tool. Knowing the sun controls means fast iteration on a shot.", do: "Animate the sun rotation in a Level Sequence from sunset to noon."}

  - id: EAQ37
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [lighting, point-light, spot-light, rect-light]
    required_spine: false
    required: false
    title: Local lights up close
    brief: "Local lights are lights that sit at one place in the level and light only the area around them. Unreal has three kinds: the Point Light shines in all directions like a bulb, the Spot Light shines in a cone like a torch, and the Rect Light shines from a flat rectangle like a screen or a window. In this quest you build a small dark room and try the most important settings of each one."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/spot-lights-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/point-lights-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/rectangular-area-lights-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. In a new level, build a small dark room from cubes with a floor and 3 walls, and put a few props inside, such as spheres and cylinders. Set the Directional Light and the Sky Light to a very low brightness, or delete them, so the room is dark."
      - "Place a Point Light. Change Attenuation Radius, which is how far the light reaches, until the light stops at the walls. Then set Source Radius to 20 and look at the highlight on a smooth prop."
      - "Place a Spot Light and aim it at the floor. Set Inner Cone Angle to 20 and Outer Cone Angle to 40. Then try 35 and 40, and compare how soft the edge of the light is."
      - "Place a Rect Light that acts as a TV screen. Set Source Width to 100 and Source Height to 60. Rotate it so its X axis points into the room, because a Rect Light only shines along its X axis."
      - "On the Rect Light, try Barn Door Angle and Barn Door Length. Barn doors are flaps at the sides of the light, and you can use them to cut the light that spills onto the wall."
      - "Set the Mobility of the Rect Light to Movable, and then to Stationary. Note how the shape of the shadow changes between blocky and soft."
    done_when: "Send one screenshot of the room with all three lights turned on. The Details panel of the Spot Light must be visible and show your Inner Cone Angle and Outer Cone Angle values."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Where does a Spot Light have full brightness?"
        choices: ["Between the inner and outer cone", "Inside the Inner Cone Angle", "Only at the Attenuation Radius", "Outside the Outer Cone Angle"]
        answer_index: 1
        explain: "Inside the Inner Cone Angle the light is at full brightness. From the inner cone to the Outer Cone Angle the light falls off, which makes the soft edge."
      - q: "A Point Light has Use Inverse Squared Falloff enabled. What does Attenuation Radius do then?"
        choices: ["It only clamps the light's contribution", "It sets the radius of the light source shape", "It controls the specular highlight size", "It is ignored completely"]
        answer_index: 0
        explain: "With physically based inverse squared falloff, Attenuation Radius only clamps where the light stops. The falloff itself comes from distance."
      - q: "What are Source Radius and Source Length on a Point Light used for?"
        choices: ["Changing the distance at which the light has attenuated to zero", "Deciding the lightmap resolution of the meshes that are near the light", "Giving the light a shape in reflections and specular highlights", "Setting the shadow bias"]
        answer_index: 2
        explain: "The light still emits from one point, but Unreal uses a radius and length for reflections and specular highlights so the light feels more physical."
      - q: "In which direction does a Rect Light emit light?"
        choices: ["In all directions like a Point Light, inside its sphere", "Along its local Z axis (up), inside its attenuation", "Along its positive local X axis, inside its sphere of attenuation", "Only along the direction that the Barn Door Angle points toward"]
        answer_index: 2
        explain: "A Rect Light emits within its attenuation sphere only in the positive local X direction, like a Spot Light with a 180 degree cone. Width is along Y and Height along Z."
      - q: "A Rect Light is set to Movable. What do Source Width and Source Height affect?"
        choices: ["The softness of the shadows, which are traced from every point of the rectangle on each frame", "Only the specular reflections; the light itself is emitted from the center like a Point Light", "The lightmap samples across the rectangle, which are baked into each mesh during the lighting build", "Nothing at all until lighting is built"]
        answer_index: 1
        explain: "For Movable Rect Lights the width and height are only used for specular reflections. The light is emitted from the center, so shadows are sharp like a Point Light."
      - q: "You make a Rect Light twice as big but keep Intensity the same. What happens?"
        choices: ["It looks brighter because it is larger, and a larger surface always emits more", "It looks dimmer because Intensity is averaged over the surface area", "Nothing, because the size of a light does not change its brightness", "It stops casting shadows, because large area lights cannot use shadow maps"]
        answer_index: 1
        explain: "For Rect Lights the Intensity is averaged over the surface area. When you increase Source Width and Height you must raise Intensity to keep the same apparent brightness."
    flavors:
      _default: {why: "Point, Spot and Rect lights are the tools for interiors and hero props. Their details make the difference between flat and rich lighting."}
      level_design: {why: "Local lights guide the player. Cone angles and radius decide what is seen.", do: "Use a Spot Light with a tight cone to mark a door the player must find."}
      cinematics: {why: "Rect lights behave like film softboxes.", do: "Light a character with one Rect Light as key and one Point Light as rim."}
      tech_art: {why: "Light shape affects specular and shadow cost.", do: "Compare Cast Shadows on and off on the Rect Light and note the difference in the Stat GPU shadow depths."}

  - id: EAQ38
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [lighting, mobility, performance]
    required_spine: false
    required: false
    title: Static, Stationary or Movable
    brief: "Every light in Unreal has a Mobility setting with three options. A Static light cannot change at all while the game runs, a Stationary light stays in place but can change brightness and color, and a Movable light can change in every way. This choice affects both how good the light looks and how much it costs to draw. In this quest you place five overlapping lights, see what happens when too many Stationary lights overlap, and decide which Mobility each light should have."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/light-types-and-their-mobility-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/stationary-light-mobility-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/movable-light-mobility-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/static-light-mobility-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open a small test level that has a floor and a few props, for example a new Basic level with a few cubes. Place five Point Lights close together so that the areas they light overlap."
      - "Set all five lights to Stationary. Look at the light icons in the viewport and find the one that shows a red X."
      - "Open View Mode, then Optimization Viewmodes, then click Stationary Light Overlap. Take a screenshot that shows the red overlap."
      - "Change one light to Movable and one light to Static. Then check the overlap view again and see what changed."
      - "Select a Movable Point Light and turn Cast Shadows off and then on again. Read the section of the documentation that explains why Movable lights without shadows are cheap."
      - "For each of your five lights, write down which Mobility you would use in a real scene and why. One line for each light is enough."
    done_when: "Send one screenshot in the Stationary Light Overlap view mode that shows the red overlap. Add your five lines of text, one for each light, that say which Mobility you chose."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Which mobility lets a light change color and intensity in game, but not move?"
        choices: ["Static", "Stationary", "Movable", "None, only Movable lights can change"]
        answer_index: 1
        explain: "Stationary lights stay in one position but can change in other ways, such as brightness and color. Static lights cannot change at all."
      - q: "How many Stationary Lights can overlap a single object at the same time before the limit is reached?"
        choices: ["Two", "Eight", "There is no limit", "Four"]
        answer_index: 3
        explain: "Only four or fewer Stationary Lights can overlap one another or a single piece of geometry. Beyond that, the extra light falls back to costly dynamic shadows."
      - q: "What does the editor show when the Stationary light overlap limit is exceeded?"
        choices: ["A yellow warning in the Output Log only, with the name of the light and the number of its overlaps", "The light turns invisible in the viewport", "A red X over the light icon, and the Stationary Light Overlap view mode highlights it in red", "The light is switched to Static automatically, and a message in the Output Log names the light"]
        answer_index: 2
        explain: "The offending light icon gets a red X, and the Stationary Light Overlap view mode (under Optimization Viewmodes) highlights it in red until you fix it."
      - q: "A Movable Point Light with Cast Shadows turned off: how expensive is it?"
        choices: ["Very inexpensive, even lower cost than a Static light because no lighting data is saved to disk", "The most expensive light type, because it lights every pixel in its radius on each frame anew", "The same cost as a Stationary light, because both save their shadow data to disk during the build", "It cannot be rendered without shadows"]
        answer_index: 0
        explain: "Non-shadowing Movable lights are very inexpensive. The docs say they carry a lower cost than Static lights because nothing needs to be saved to disk. Shadows are the expensive part."
      - q: "What happens to the runtime cost of a Static light after the lighting build is done?"
        choices: ["It costs the same as a Movable light of the same size", "It has no further impact on performance; its data lives in lightmaps", "It still computes shadows every frame, but no direct light", "It only costs performance while the player moves inside its radius"]
        answer_index: 1
        explain: "Static lights are precomputed with Lightmass and stored in lightmaps. After the build they have no further impact on performance."
      - q: "A Stationary Directional Light shows no dynamic shadows near the player. What is the likely cause?"
        choices: ["Cast Shadows is always off for Stationary lights", "Dynamic Shadow Distance StationaryLight is at its default of 0", "The light needs Source Radius above 0", "Stationary lights never cast dynamic shadows on any kind of object"]
        answer_index: 1
        explain: "By default all Directional Stationary Lights start with Dynamic Shadow Distance StationaryLight at 0, which means no dynamic shadowing. Raise it to get Cascaded Shadow Maps near the player."
    flavors:
      _default: {why: "Mobility is the first performance and quality decision you make for every light."}
      level_design: {why: "Too many overlapping Stationary lights silently become expensive.", do: "Run the overlap view mode on one of your own blockout levels."}
      tech_art: {why: "Mobility decides which shadow path the renderer uses.", do: "Note which mobility combinations trigger per-object shadows in the docs and test one."}

  - id: EAQ39
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [lighting, lumen, global-illumination, reflections]
    required_spine: false
    required: false
    title: Lumen dials that matter
    brief: "Global illumination, often written GI, is light that bounces from one surface to another, for example sunlight that hits a floor and then lights the ceiling. Lumen is the system in Unreal Engine 5 that calculates this bounced light and the reflections while the game runs. Lumen has many settings, but only a few of them change the picture in a way you can easily see. In this quest you build a small room and try those settings in a Post Process Volume, which is a box that changes how the final picture is drawn."
    time_min: 55
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/lumen-global-illumination-and-reflections-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open any project, or create one from the Third Person template. Open Project Settings, then Engine, then Rendering. Confirm that Dynamic Global Illumination Method and Reflection Method are both set to Lumen. Note whether Generate Mesh Distance Fields is turned on."
      - "In a new level, build a small room from cubes with one open door and a bright white floor. Place a strong Directional Light outside so that light bounces into the room through the door."
      - "Add a Post Process Volume and enable Infinite Extent (Unbound), so that its settings apply to the whole level."
      - "In the Post Process Volume, under Global Illumination, try Final Gather Quality at 1 and then at 4. Compare the noise in the dark corners of the room."
      - "Set Max Trace Distance to a very small value, for example 200, and watch what happens in the corners. Then set it back to its old value."
      - "Place a sphere that works like a mirror, with a material that has Roughness 0 and Metallic 1. Under Reflections, set Max Reflection Bounces to 1 and then to 3. Compare the black areas in the reflection."
      - "Try Skylight Leaking at 0 and then at 0.2. Note which value stops the room from becoming fully black."
    done_when: "Send two screenshots of the room, one with Final Gather Quality 1 and one with Final Gather Quality 4. Also send a screenshot of the sphere with Max Reflection Bounces set to 3 and the Details panel of the Post Process Volume visible."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Where do you turn Lumen on for a whole project?"
        choices: ["World Settings > Lightmass > Lightmass Settings, Dynamic Global Illumination Method and Reflection Method", "Project Settings > Engine > Rendering, Dynamic Global Illumination Method and Reflection Method", "The Sky Light Details panel, with Real Time Capture and the Lumen option under the Light section", "Each light's Mobility dropdown, where Lumen is listed as the fourth option after Movable in a new project"]
        answer_index: 1
        explain: "Lumen is enabled in Project Settings under Rendering, by setting Dynamic Global Illumination Method and Reflection Method to Lumen. They can be set independently."
      - q: "Why does enabling Lumen also turn on Generate Mesh Distance Fields?"
        choices: ["It is required for Lumen's Software Ray Tracing mode", "Distance fields store the lightmaps", "It makes Nanite meshes render faster in Lumen scenes", "It is needed before you can place a Post Process Volume"]
        answer_index: 0
        explain: "Software Ray Tracing traces against mesh distance fields, so Lumen needs them. Hardware Ray Tracing is the alternative when the GPU supports it."
      - q: "A light is set to Static in a Lumen project. What happens to its contribution?"
        choices: ["It becomes fully dynamic and is lit by Lumen like a Movable light", "It is disabled, because Static lights live in lightmaps which Lumen hides", "It only affects reflections", "It doubles in strength, because Lumen adds its bounces on top of the lightmap"]
        answer_index: 1
        explain: "Lights with Mobility set to Static are not supported by Lumen. Their contribution is stored completely in lightmaps, and lightmaps are hidden when Lumen is on."
      - q: "Light seems to leak into a large cave. Which Post Process setting is the most likely fix?"
        choices: ["Lower Lumen Scene Detail", "Raise Skylight Leaking", "Raise Max Trace Distance", "Set Max Reflection Bounces to 1"]
        answer_index: 2
        explain: "Max Trace Distance values that are too small cause lighting to leak into large areas such as caves. Larger values fix it at higher GPU cost."
      - q: "A mirror sphere shows black patches in its reflection. Max Reflection Bounces is at the default. What is the default, and what can you do?"
        choices: ["Default 0; set it to 1 so that the sphere shows one bounce", "Default 1; raise it to 2 or more (up to 8 in the PPV)", "Default 8; lower it to 2, because too many bounces go black", "Default 64; it is a fixed value and cannot be changed"]
        answer_index: 1
        explain: "The default is 1 bounce, one reflection ray with no secondary reflections. 2 or more bounces can prevent black areas in reflections when there is performance budget. The PPV allows up to 8."
      - q: "You switch the sun off in a Lumen scene and the room stays lit for a few seconds. Why?"
        choices: ["Lumen caches lighting, so global changes take time to propagate; Lighting Update Speed controls it at GPU cost", "The Sky Light needs a recapture", "Lightmaps still hold the old lighting, and they fade out slowly after the sun is switched off in a Lumen scene", "Screen Traces are disabled, so the old frame is shown until the camera moves; r.Lumen.ScreenProbeGather turns them on"]
        answer_index: 0
        explain: "Lumen uses caches for real-time performance. Global lighting changes can take multiple seconds. Lumen Scene Lighting Update Speed and Final Gather Lighting Update Speed in the PPV speed this up but cost more GPU."
    flavors:
      _default: {why: "Lumen is the default GI. Knowing the few dials that matter saves hours of guessing."}
      tech_art: {why: "Every Lumen dial trades quality for GPU time.", do: "Record GPU ms with Stat GPU for Final Gather Quality 1 and 4 and note the difference."}
      cinematics: {why: "Reflection bounces and quality matter most on hero shots.", do: "Set up one shot-specific PPV with higher Reflection Quality and compare."}

  - id: EAQ40
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [lighting, shadows, virtual-shadow-maps, nanite]
    required_spine: false
    required: false
    title: Soft shadows with Virtual Shadow Maps
    brief: "Virtual Shadow Maps, often written VSM, are the default way Unreal Engine 5 draws shadows. They can make shadows that are sharp where an object touches the ground and softer further away, which is how real shadows look. In this quest you check that your project uses Virtual Shadow Maps, make soft shadows with one setting on the light, and look at a debug view that shows which parts of the shadow are redrawn every frame."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/virtual-shadow-maps-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open any project, or create one from the Third Person template, and work in a level with a floor. Open Project Settings, then Engine, then Rendering, and find the Shadows section. Confirm that Shadow Map Method is set to Virtual Shadow Maps."
      - "Place a tall thin mesh, such as a cylinder scaled into a pole, on the floor. Add a Directional Light with Mobility set to Movable, or use the one in the level, and rotate it to a low angle so the shadow is long."
      - "On the Directional Light, set Source Angle to 0.5 and then to 3. Watch the shadow: it should be sharp at the base of the pole and softer far away from it."
      - "Place a Movable Point Light near a prop. Change Source Radius from 0 to 10 and compare the penumbra, which is the soft edge of the shadow."
      - "Open Show, then Visualize, then Virtual Shadow Map, and pick the Cached Page view. Move the camera and watch the green and red pages. Green pages are reused from the frame before, and red pages had to be drawn again."
      - "Add a mesh whose material uses World Position Offset, which moves the surface of the mesh, as wind does on foliage. To make one, create a material, multiply a Sine of a Time node by a small vector such as 0, 0, 20, connect it to World Position Offset, and apply it to a sphere. See how this mesh keeps showing red pages."
      - "On the Directional Light, compare Contact Shadow Length at 0 and at 0.1. Decide if it adds anything to the picture when Virtual Shadow Maps are on."
    done_when: "Send two screenshots: one of the pole shadow with Source Angle 3 that shows the shadow sharp at the base and softer further away, and one of the Cached Page view with red and green pages visible."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Where does a project choose between Virtual Shadow Maps and conventional Shadow Maps?"
        choices: ["World Settings > Lightmass > Lightmass Settings > Shadow Map Method", "On each light's Mobility dropdown, as a fourth option below Static, Stationary and Movable", "Sky Light Details panel > Light > Advanced > Shadow Map Method of the level", "Project Settings > Engine > Rendering > Shadows > Shadow Map Method"]
        answer_index: 3
        explain: "The Shadow Map Method project setting (or the console variable r.Shadow.Virtual.Enable) selects VSM. New projects use VSM by default."
      - q: "What makes a Point Light's shadow soft with VSM?"
        choices: ["Increasing the Attenuation Radius until the shadow edge fades out", "Setting Source Radius above 0; local lights have none by default", "Enabling Cast Translucent Shadows", "Lowering Shadow Bias to 0, which blurs the edge of every shadow that it casts"]
        answer_index: 1
        explain: "Shadow Map Ray Tracing distributes rays based on Source Radius on local lights or Source Angle on Directional Lights. Local lights have no Source Radius by default, so set one."
      - q: "In the Cached Page visualization, what do red pages mean?"
        choices: ["Pages that are fully cached from the frame before this one", "Pages with the highest resolution, which are closest to the camera", "Pages outside the camera view that are kept for the next frames", "Pages that are new or invalidated and must be re-rendered"]
        answer_index: 3
        explain: "Fully cached pages are green. New or invalidated pages are red. With a static camera, most red comes from cache invalidations you should reduce."
      - q: "Which of these invalidates cached shadow pages every frame?"
        choices: ["A Static Mesh with Static mobility", "A Directional Light that never moves", "A material using World Position Offset", "A Nanite mesh with a plain material"]
        answer_index: 2
        explain: "Skeletal animation and materials using World Position Offset or Pixel Depth Offset always invalidate cached pages every frame, so use them carefully and keep bounds tight."
      - q: "With VSM enabled, is the Contact Shadow Length setting still needed for sharp contact shadows?"
        choices: ["Yes, it is required for VSM to work, and it must be set on every light in the level", "No, VSM's high resolution makes it unnecessary and it can be less accurate", "Yes, but only on Point Lights", "No, because VSM disables all of the screen space effects in the whole project"]
        answer_index: 1
        explain: "Because of VSM's high resolution and accuracy, screen space Contact Shadows are no longer necessary for sharp contact shadows and are not recommended otherwise."
      - q: "How large is a Virtual Shadow Map, and how is it split up?"
        choices: ["16k x 16k virtual resolution, split into 128x128 pages that render only when needed", "2k x 2k for each light, split into cascades that all render again on every single frame", "4k x 4k, with one texture per object that is stored on disk and loaded when the object is near", "Unlimited, streamed from disk in pages of any size that the light happens to need at that time"]
        answer_index: 0
        explain: "VSMs have a virtual resolution of 16k x 16k and are split into 128x128 pages. Pages are allocated and rendered only as needed for on-screen pixels and are cached between frames."
    flavors:
      _default: {why: "VSM is the default shadow method in UE5. Soft, contact-hardened shadows are one setting away once you know which one."}
      tech_art: {why: "Cache invalidations are the main VSM cost.", do: "Use the ShadowCasters view mode and find one object with inflated bounds."}
      level_design: {why: "Shadows sell scale and grounding in a blockout.", do: "Set Source Angle on the sun in your blockout and see how contact hardening reads."}

  - id: EAQ41
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [lighting, materials, light-functions]
    required_spine: false
    required: false
    title: Light functions, caustics and cloud shadows
    brief: "A light function is a material that you put on a light to change its brightness in a pattern, a little like a slide in a projector. Artists use light functions for moving effects such as the light patterns under water, called caustics, or the shadows of clouds. In this quest you make a light function material with a moving pattern, put it on a Spot Light, and adjust how it looks."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-light-functions-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open any project, or create one from the Third Person template, and work in a level with a floor. Create a material named M_LF_Caustic. Open it, and in the Details panel set Material Domain to Light Function."
      - "Add a tiling noise texture or caustic texture, and make it move with a Panner node. Any tiling grayscale texture works, for example the engine textures T_Default_MacroVariation or Good64x64TilingNoiseHighFreq. To see engine content, open the Settings menu of the Content Browser and turn on Show Engine Content. Connect the result to Emissive Color. Keep the values between 0 and 1."
      - "Place a Spot Light with Mobility set to Movable and aim it at a floor. In the Details panel of the light, assign M_LF_Caustic to Light Function Material."
      - "Change the X and Y values of Light Function Scale until the size of the pattern looks right. Also note what the Z value does."
      - "Set Fade Distance so that the pattern fades out far from the camera. Then set Disabled Brightness to the average brightness of your pattern, so the light does not jump in brightness when the pattern fades."
      - "Place an Exponential Height Fog, enable Volumetric Fog on it, and see the pattern appear in the fog."
      - "Open the console and run ShowFlag.VisualizeLightFunctionAtlas 1. Check if your material appears in the atlas, which is one shared texture where Unreal stores light functions."
    done_when: "Send one screenshot of the animated caustic pattern on the floor, and one screenshot of the Light Function Atlas view that shows your material in the list."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "How do you turn a material into a light function?"
        choices: ["Set Blend Mode to Additive", "Set Material Domain to Light Function and feed nodes into Emissive Color", "Enable Two Sided and feed nodes into Opacity instead of Emissive Color", "Set Shading Model to Unlit and feed nodes into Base Color instead of Emissive Color"]
        answer_index: 1
        explain: "Light functions are materials with Material Domain set to Light Function. All nodes feed into the Emissive Color input on the main material node."
      - q: "Which light mobility can use a light function?"
        choices: ["Static only, because the function has to be baked into the lightmaps", "Any mobility; Static lights bake the function into the lightmaps", "Movable or Stationary only; they cannot be baked into lightmaps", "Movable only, with shadows on"]
        answer_index: 2
        explain: "Light functions can only be applied to lights with mobility set to Movable or Stationary, and they cannot be baked into lightmaps."
      - q: "Does the light need Cast Shadows enabled to show its light function?"
        choices: ["Yes, always, because the function is drawn into the shadow", "No, once assigned it shows without Cast Shadows", "Only for Directional Lights, which have no shadow by default", "Only when Volumetric Fog is turned on in the level"]
        answer_index: 1
        explain: "Once a light function is assigned, it does not require Cast Shadows to be enabled to display the light function material."
      - q: "What does the Z value of Light Function Scale control?"
        choices: ["Scale along the light direction", "The brightness of the function", "The fade distance", "The width perpendicular to the light"]
        answer_index: 0
        explain: "X and Y scale the directions perpendicular to the light's direction. Z scales along the light direction."
      - q: "What value should Disabled Brightness be set to?"
        choices: ["Always 0, so that the light is fully off when the function is disabled by distance", "Always 1", "The average brightness of the material's emissive input, between 0 and 1", "The Intensity of the light in candela, divided by its Attenuation Radius"]
        answer_index: 2
        explain: "Disabled Brightness is used when the light function is specified but disabled, such as beyond Fade Distance. It should match the average brightness of the emissive input, between 0 and 1."
      - q: "Which light type is currently forced NOT to sample the Light Function Atlas?"
        choices: ["Spot Lights", "Point Lights", "Rect Lights only", "Directional Lights"]
        answer_index: 3
        explain: "The atlas restrictions list says Directional Lights are currently forced to not sample the atlas. Also, materials that read the depth buffer, world position or GBuffer cannot be baked into it."
    flavors:
      _default: {why: "Light functions add moving, material-driven variation to light: water caustics, cloud shadows, projected shapes."}
      tech_art: {why: "Light functions cost like dynamic-shadow lights unless the atlas can bake them.", do: "Check the atlas visualization and make your material atlas-compatible (no depth, no UV tricks)."}
      cinematics: {why: "A gobo-style light function is a classic film lighting trick.", do: "Make a window-blind pattern and project it onto a wall with a Spot Light."}

  - id: EAQ42
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [lighting, fog, atmosphere]
    required_spine: false
    required: false
    title: Height fog, layer by layer
    brief: "Exponential Height Fog is a fog actor that is thick in low places and thin in high places. It is a cheap way to make an outdoor scene feel deep, because things far away fade into the fog. In this quest you place the fog, change where it sits and how it is colored, add a second layer of fog, and connect it to the sky."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/exponential-height-fog-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/sky-atmosphere-component-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open an outdoor level that has some difference in height, such as a hill or a Landscape. The level of the template works, or you can make a new level with a sculpted Landscape. Open Place Actors, then Visual Effects, and place an Exponential Height Fog if the level has none."
      - "Move the fog actor up and down on the Z axis and watch where the thick fog sits. Then set Fog Height Falloff to a smaller value and to a larger value and compare."
      - "Set Fog Inscattering Color and Directional Inscattering Color to two clearly different colors. Look toward the sun, and then look away from it, to see where each color is used."
      - "Open Second Fog Data, which is a second layer of fog. Give this layer a small density and a Fog Height Offset so that it sits in a valley."
      - "Set Start Distance to 0 and then to 5000, and compare how the scene looks. Read the Performance section of the documentation to learn why a larger start distance is cheaper."
      - "Do this step if your project uses Sky Atmosphere. Turn on Support Sky Atmosphere Affecting Height Fog in Project Settings, set both inscattering colors to black, and try Height Fog Contribution on the Sky Atmosphere."
    done_when: "Send two screenshots, one looking toward the sun and one looking away from it, so that the two inscattering colors are visible. Also show the Details panel with your Second Fog Data values."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "How does Exponential Height Fog distribute density?"
        choices: ["Same density everywhere in the level, from the ground up to the top of the sky", "More density in low places, less in high places, with a smooth transition", "Only inside a box volume", "Denser near the camera only, and thinner the further away you look from it"]
        answer_index: 1
        explain: "Exponential Height Fog creates more density in low places and less in high places. The transition is smooth, so there is no hard cutoff with altitude."
      - q: "Exponential Height Fog has two fog colors. What decides which one you see?"
        choices: ["Camera height above the fog actor, with one color below it and the second color above it", "Time of day", "Whether the fog actor is rotated toward the dominant Directional Light or away from it in the level", "Whether you look at the hemisphere facing the dominant Directional Light or the opposite one"]
        answer_index: 3
        explain: "One color is for the hemisphere facing the dominant directional light (or straight up if none exists), the other is for the opposite hemisphere."
      - q: "You lower Fog Height Falloff to a smaller value. What happens?"
        choices: ["The transition from thick to thin fog becomes larger", "The fog becomes fully opaque at every height in the level", "The fog moves up in Z by the same value", "The fog is disabled below that value"]
        answer_index: 0
        explain: "Fog Height Falloff controls how density increases as height decreases. Smaller values make the transition larger."
      - q: "Why can a far Start Distance make height fog cheaper to render?"
        choices: ["It reduces the resolution of the fog texture for far pixels, so the cost of the whole fog pass can drop to 50% or less", "Pixels in the fog-free area in front of the viewer can be culled by the Z-buffer, so the cost can drop to 50% or less", "It disables the second fog layer, which is the more costly one of the two fog layers", "It turns off directional inscattering for all pixels, which is half of the total fog cost"]
        answer_index: 1
        explain: "The start distance keeps an area in front of the viewer without fog. It is rendered as a full-screen quad with a depth test, so pixels are culled and the cost can be 50% or less."
      - q: "Your skybox already has fog painted in it and now looks doubled. Which setting helps?"
        choices: ["Fog Max Opacity 1, so the fog covers the skybox with a solid color", "Directional Inscattering Exponent, so the far fog gets thinner", "Fog Cutoff Distance, so elements past that distance get no fog", "Emissive"]
        answer_index: 2
        explain: "Fog Cutoff Distance stops fog on scene elements past that distance. The docs say this is useful for excluding skyboxes that already have fog baked in."
      - q: "You want the Sky Atmosphere to light the height fog. Besides the project setting, what must you do to the fog colors?"
        choices: ["Set Fog Inscattering Color and Directional Inscattering Color to black", "Set both colors to white", "Match both colors to the color of the sun, and set Fog Density to zero", "Delete the fog actor and add a new one below the Sky Atmosphere in the Outliner"]
        answer_index: 0
        explain: "The atmosphere contribution is additive on top of the fog's faked colors. To let the Sky Atmosphere drive the fog, set both inscattering colors to black, then use Height Fog Contribution on the Sky Atmosphere."
    flavors:
      _default: {why: "Height fog is the cheapest way to add depth and mood to an outdoor scene. The details decide if it looks real or milky."}
      level_design: {why: "Fog controls how far a player can read the space.", do: "Set Start Distance so the play space is clear but the far background fades."}
      cinematics: {why: "Directional inscattering is your free backlight haze.", do: "Frame a shot into the sun with a warm Directional Inscattering Color."}

  - id: EAQ43
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [lighting, sky-light, reflections]
    required_spine: false
    required: false
    title: Sky Light capture and real-time sky
    brief: "A Sky Light takes a picture of the sky around your level and uses it to light everything softly and to create reflections. This picture is called a capture. If the sky changes and the capture does not, the lighting and the reflections no longer match the sky. In this quest you see this problem for yourself, and then you fix it with Recapture and with Real Time Capture."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/sky-lights-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/sky-atmosphere-component-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Make a new Empty Level with a floor. Place a Directional Light and a Sky Atmosphere, and enable Atmosphere Sun Light on the Directional Light so that the sky uses it as the sun. If you already have a level with this sun and sky, you can use it. Place a Sky Light and set its Mobility to Movable."
      - "Place a chrome sphere, which is a sphere with a material that has Roughness 0 and Metallic 1. You will use it to see the reflection of the sky."
      - "Rotate the sun to a sunset. Notice that the sphere and the lighting on the ground do not change until you press Recapture in the Details panel of the Sky Light."
      - "Enable Real Time Capture on the Sky Light. Rotate the sun again and watch the reflection and the lighting follow it."
      - "Change Cubemap Resolution from 128 to 64, and then to 256. Compare the reflection on the sphere each time."
      - "Open the Advanced section and enable Lower Hemisphere is Solid Color. Note what changes under overhangs, which are places that are covered from above."
      - "Switch Source Type to SLS Specified Cubemap and pick any HDRI, which is a picture of a full sky. The engine content has HDRI cubemaps: turn on Show Engine Content in the settings of the asset picker to find one. Then switch back to SLS Captured Scene."
    done_when: "Send two screenshots of the chrome sphere at sunset: one taken before Recapture, where the sky reflection is old, and one with Real Time Capture enabled. The Details panel of the Sky Light must be visible."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "A Stationary or Movable Sky Light: when does it capture the scene?"
        choices: ["Every frame, always, whether Real Time Capture is enabled or not on the Sky Light component", "Once on load, and then only when Recapture is called or Real Time Capture is enabled", "Only when the lighting of the level is built, and then never again while the game runs", "Only when the level is saved, so you must save again after each change to the sky or the sun"]
        answer_index: 1
        explain: "For Stationary or Movable Sky Lights, updates happen once on load and then only when Recapture is called, unless Real Time Capture is enabled. Static Sky Lights update when building lighting."
      - q: "You swap the texture in your skybox material. What does the Sky Light do?"
        choices: ["Updates automatically on the next frame, with no action", "Rebuilds lighting by itself, as soon as the material is saved", "Switches to a specified cubemap until you save the level", "Nothing until you Recapture or use Real Time Capture"]
        answer_index: 3
        explain: "The docs say changing the skybox texture does not automatically update the Sky Light. You must use Recapture, Blueprint, or Real Time Capture."
      - q: "Real Time Capture is enabled but nothing changes. What does the mode require?"
        choices: ["A Sky Atmosphere component in the scene", "A Static Sky Light with a cubemap", "Volumetric Fog enabled on the Exponential Height Fog", "A Reflection Capture actor in the scene"]
        answer_index: 0
        explain: "Real Time Capture requires a Sky Atmosphere component to be present. It works with Stationary or Movable Sky Lights, and Volumetric Fog is not supported by it."
      - q: "Which values are valid for Cubemap Resolution?"
        choices: ["Any integer between 1 and 2048", "Only 128, the default value", "Powers of two such as 64, 128, 256", "Multiples of 100 such as 100, 200"]
        answer_index: 2
        explain: "Cubemap Resolution uses power of two values (64, 128, 256 and so on). Higher values increase quality at the cost of performance."
      - q: "For a Static Sky Light, why should the skybox material be Unlit?"
        choices: ["Unlit is faster to compile, and the capture waits for the shader", "Only the emissive contribution of materials is captured, to avoid a feedback loop", "Lit materials cannot be seen by the Sky Light at all, so the sky would be black", "Static Sky Lights only capture cubemaps, not materials on a mesh"]
        answer_index: 1
        explain: "A Static Sky Light captures only the emissive contribution of materials to avoid a feedback loop, so the skybox must use an Unlit material."
      - q: "Why is Real Time Capture preferred over calling RecaptureSky() from Blueprint during gameplay?"
        choices: ["RecaptureSky() gives lower quality, because it uses a cubemap with half the resolution of the real time one", "RecaptureSky() only works in the editor; in a packaged game the node is ignored and does nothing", "Real Time Capture is free, because it reuses the reflection captures that are already placed in the level", "Real Time Capture stays on the GPU; RecaptureSky() costs at least 120 ms and can pause gameplay"]
        answer_index: 3
        explain: "Real Time Capture keeps all work on the GPU with time slicing. RecaptureSky() has a high processing cost, at least 120 ms, which can cause a pause or slowdown."
    flavors:
      _default: {why: "The Sky Light gives ambient light and reflections to everything. If it is stale, the whole scene looks wrong."}
      cinematics: {why: "Time-of-day shots need the sky lighting to follow the sun.", do: "Animate the sun in Sequencer with Real Time Capture on and check the reflection on a chrome ball."}
      tech_art: {why: "Real Time Capture has a per-frame cost that time slicing spreads out.", do: "Try r.SkyLight.RealTimeReflectionCapture.TimeSlice 0 and 1 and compare Stat GPU."}

  - id: EAQ44
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [static-mesh, import, fbx, pivot, lods]
    required_spine: false
    required: false
    title: Import a prop the right way
    brief: "A prop is a small object in a level, such as a crate or a lamp. Most props are made in another 3D program and brought into Unreal as an FBX file, a common file format for 3D models. The pivot is the point the prop moves and rotates around, and together with the scale it decides how easy the prop is to place later. In this quest you make a simple prop, import it with the correct pivot and size, and check it next to an object of a known size."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/fbx-static-mesh-pipeline-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/importing-static-meshes-using-fbx-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/importing-assets-using-interchange-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/fbx-import-options-reference-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/importing-static-mesh-lods-using-fbx-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make a small prop such as a crate, a barrel or a lamp in a 3D app such as Blender, which is free. Put it at the origin, which is the zero point of the scene, so that the origin is at one corner or at the bottom center of the prop. If you have no 3D app, build the prop in Modeling Mode in Unreal, then right-click the new Static Mesh, choose Asset Actions, then Export, and save it as an FBX file."
      - "If you use a 3D app, triangulate the mesh before you export it, which means turning all its faces into triangles. Then export it as FBX. Unreal uses the version FBX 2020.2."
      - "In Unreal, click Add/Import in the Content Browser and choose your FBX file. The import window opens. In current versions it is named Interchange Pipeline Configuration, and older versions show a window named FBX Import Options. Before you click Import, look at three settings: the uniform scale (Offset Uniform Scale in the new window, Import Uniform Scale in the old one), Convert Scene Unit, and Generate Lightmap UVs."
      - "Name the asset SM_<PropName>, with the name of your prop in place of <PropName>. Open it in the Static Mesh Editor and check its size and its pivot."
      - "If the scale is wrong, import the file again with a different uniform scale. Do not fix it by scaling the actor in the level."
      - "Place SM_<PropName> in a level next to the default mannequin, which is 180 cm tall, or next to a 100 cm cube, to check its size."
    done_when: "Send a screenshot of the Static Mesh Editor that shows SM_<PropName>, and one screenshot of the prop in the level next to an object that shows its size. Add one line that says where your pivot is."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Where does Unreal put the pivot of an imported FBX mesh?"
        choices: ["At the origin (0,0,0) of the 3D app scene", "At the center of the mesh bounds", "At the first vertex of the mesh", "At the camera position when you export"]
        answer_index: 0
        explain: "The pivot is always at the origin when exporting. So you should model at the origin, usually with the origin at one corner, to snap well to the grid."
      - q: "Which is the BEST way to make sure your mesh is triangulated, according to Epic?"
        choices: ["Let the importer triangulate it, because Unreal knows best which edges to use", "Let the FBX exporter triangulate it, with its default settings", "Triangulate it yourself in the 3D app, controlling the edges", "Do nothing, Unreal renders quads directly and keeps the edges as they are"]
        answer_index: 2
        explain: "Manual triangulation in the 3D app gives control over edge direction and placement. Automatic triangulation can give bad results."
      - q: "You want a doorway prop with a hole the player can walk through. What should the collision mesh in the FBX be called if the render mesh is Door_01?"
        choices: ["COL_Door_01", "UCX_Door_01", "Door_01_Collision", "PHYS_Door_01"]
        answer_index: 1
        explain: "Custom collision is found by name. UCX_[RenderMeshName] makes a convex collision piece, and you can add _00, _01 for more pieces."
      - q: "Your FBX has three separate props. What does the importer do by default?"
        choices: ["It refuses to import more than one mesh", "It always merges them into one Static Mesh", "It imports only the first mesh", "It makes three separate Static Mesh assets"]
        answer_index: 3
        explain: "Multiple Static Meshes in one FBX become multiple assets unless you turn on the option that combines them at import. It is named Combine Static Meshes in the current import window and Combine Meshes in the older one."
      - q: "Your prop arrives 100 times too small because the 3D app used meters. Which import option is made for this?"
        choices: ["Bake Pivot in Vertex", "Remove Degenerates", "Convert Scene Unit", "Force Front XAxis"]
        answer_index: 2
        explain: "Convert Scene Unit converts the FBX units of measurement to Unreal's unit, centimeters. The uniform scale option of the import window (Offset Uniform Scale, or Import Uniform Scale in the older window) is another way to fix scale."
      - q: "What does the Generate Lightmap UVs import option do?"
        choices: ["It makes a set of unique, non-overlapping UVs for static lighting", "It deletes the texture UVs and replaces them with a single flat projection", "It makes the mesh use Nanite, which stores lighting in the vertices of the mesh", "It bakes the lighting of the level into the vertex colors of the mesh"]
        answer_index: 0
        explain: "Generate Lightmap UVs creates a unique, non-overlapping UV set that baked (static) lighting can use."
    flavors:
      _default: {why: "A prop with a wrong pivot, wrong scale or missing collision will be fought by every person who places it later."}
      lookdev: {why: "Clean imports are the base of a prop kit. Fix scale and pivot once at import, not on every placed actor.", do: "Add a UCX_ collision mesh in your 3D app and check that Unreal picks it up in the Static Mesh Editor."}
      level_design: {why: "Props that snap to the grid and have correct scale make blockout-to-art handoff fast.", do: "Place ten copies of the prop with grid snapping on and check that they line up without gaps."}

  - id: EAQ45
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [static-mesh, collision, physics]
    required_spine: false
    required: false
    title: Collision that fits the prop
    brief: "Collision is a simple invisible shape around a mesh that tells the game where the mesh is solid. Players never see it, but they feel it when it stops them in the wrong place or lets them walk through an object. In this quest you add collision to props in the Static Mesh Editor in several ways, from automatic shapes to a collision that you build by hand from boxes."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-collisions-with-static-meshes-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/fbx-static-mesh-pipeline-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Pick a simple prop: your own mesh with a name that starts with SM_, or SM_Door of the template (search for its name in the Content Browser). Duplicate it, so that the original stays unchanged, and open the copy in the Static Mesh Editor."
      - "In the Collision menu, add a Box Simplified Collision. Then add a Sphere Simplified Collision and see that both shapes now exist. Use Remove Collision to delete them."
      - "Open a copy of a prop with a less simple shape, for example SM_Ramp or SM_QuarterCylinder from the folder LevelPrototyping/Meshes of the template. Try 10-DOP, 18-DOP and 26-DOP from the Collision menu and look at how the shapes differ."
      - "Try Auto Convex Collision, which builds the collision from several simple shapes called hulls. Change Hull Count and Max Hull Verts, click Apply, and compare the result."
      - "Build a collision by hand. Add a Box Simplified Collision, then move and scale it to fit one part of the prop. Duplicate it with Ctrl + D and fit the copies to the other parts."
      - "Place the prop in a level, set Simulate Physics to true, and press Play. Then change the Collision Preset and see what changes."
    done_when: "Send two screenshots of the Static Mesh Editor: one with the result of Auto Convex Collision, and one with the collision you built by hand from several boxes. Add one line that says which one you would use in a finished game and why."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "You add a Box Simplified Collision to a mesh that already has a Sphere Simplified Collision. What happens?"
        choices: ["The box replaces the sphere, which is deleted", "The box is added, and both collisions stay", "Unreal shows an error and adds no new collision", "The sphere is converted to a box of that size"]
        answer_index: 1
        explain: "A new simplified collision does not replace the old one. It adds to it. Use Remove Collision to clear all of them."
      - q: "What does the 18 in 18-DOP mean?"
        choices: ["18 triangles in the hull, placed around the mesh", "18 convex hulls that together cover the mesh", "A box with all edges beveled, using 18 axis-aligned planes", "18 percent of the detail of the mesh is kept in the hull"]
        answer_index: 2
        explain: "K-DOP pushes K axis-aligned planes as close to the mesh as possible. 10 bevels 4 edges, 18 bevels all edges, 26 bevels edges and corners."
      - q: "A prop has no collision at all. Which option is NOT available in the Details panel when you place it?"
        choices: ["Mobility (Static or Movable)", "Material slots", "Simulate Physics", "Scale"]
        answer_index: 2
        explain: "Simulate Physics is not available by default when the Static Mesh has no collision. Add collision first."
      - q: "In Auto Convex Collision, which setting controls the number of primitives used to represent the collision?"
        choices: ["Hull Count", "Hull Precision", "Max Hull Verts", "Collision Preset"]
        answer_index: 0
        explain: "Hull Count sets the number of primitives. Max Hull Verts sets vertices per hull, and Hull Precision sets the voxels used to generate the shape."
      - q: "You set Simulate Physics on and change the Collision Preset to Overlap All. What happens when you play?"
        choices: ["The prop becomes impossible to move", "The prop stops moving", "The prop turns invisible", "The prop falls through the level"]
        answer_index: 3
        explain: "With Overlap All the mesh no longer blocks anything, so it falls right through the level as soon as play begins."
      - q: "When a custom collision is made of several convex hulls, what does Epic advise?"
        choices: ["Make the hulls overlap a lot so that no hole is left between", "Leave a small gap between the hulls so they do not intersect", "Use only one hull always, however complex the shape of the mesh is", "Use spheres, not convex hulls, for every part"]
        answer_index: 1
        explain: "Results are best when the hulls do not intersect. The lollipop example leaves a gap between the candy hull and the stick hull."
    flavors:
      _default: {why: "Players do not see collision, they feel it. Bad collision blocks the player for no reason or lets them fall through."}
      lookdev: {why: "Every prop you ship needs collision that matches its shape at the places players touch.", do: "Turn on the Player Collision view mode in the level and take one screenshot of your prop with it."}
      level_design: {why: "Props with tight collision let you plan jumps, cover and paths with confidence.", do: "Walk your character along the prop in PIE and note any invisible wall."}

