        explain: "The Notes say only paths for 1000-nit and 2000-nit display outputs are implemented."
      - q: "Why does the LUT page say a LUT grade will not carry over to an HDR display?"
        choices: ["A LUT works on the final LDR sRGB image after output, while the Color Grading properties work in scene-referred linear space before tone mapping", "LUTs are too small", "LUTs only support Rec2020", "HDR turns off all post processing"]
        answer_index: 0
