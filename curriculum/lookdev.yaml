    title: Four kinds of reflections
    brief: "Reflections make objects look like they belong in the scene. Unreal has several ways to create them: Lumen, Screen Space Reflections (often written SSR), Reflection Captures and Planar Reflections. Each one costs a different amount of performance and fails in a different way. In this quest you look at the same shiny floor with all four methods and write down what each can do."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/reflections-environment-in-unreal-engine"
