    title: Bake it with GPU Lightmass
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/gpu-lightmass-global-illumination-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/understanding-lightmapping-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/generating-lightmap-uvs-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/volumetric-lightmaps-in-unreal-engine"
    checklist:
      - "Duplicate your diorama level as L_Bake_01. Set the Directional Light and Sky Light to Stationary and the local lights to Static. Check that Allow Static Lighting is on in Project Settings > Rendering."
      - "Edit > Plugins > Built-In > Editor: enable GPU Lightmass. Before restarting, in Project Settings enable Support Hardware Ray Tracing, Enable Virtual Texture Support and Enable Virtual Texture Lightmaps, and set Platforms > Windows > Default RHI to DirectX 12. Restart."
      - "Open Build > GPU Lightmass. Pick Bake What You See, keep the viewport in Realtime, click Build Lighting. Move a prop while it bakes and watch the tiles update. Click Save, then Cancel."
      - "Now choose Full Bake, turn viewport Realtime off (Ctrl+R) and click Build Lighting. Write down how long it took."
      - "Find one prop with blotchy shadows. Raise its Lightmap Resolution in the Details panel, rebake, and compare."
      - "Screenshot the baked level next to the Lumen version of the same view. Write two lines on what each does better."
    done_when: "Two screenshots (baked and Lumen) from the same bookmark, the Full Bake time, and two lines comparing them. A screenshot of the GPU Lightmass panel with your settings."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Which lights does GPU Lightmass bake, and what does it require to run?"
        choices: ["All lights; it requires the CPU Lightmass Swarm", "Movable lights; it requires Lumen", "Lights with Static or Stationary mobility; it requires DirectX 12 and Support Hardware Ray Tracing", "Only Directional Lights; it requires Vulkan"]
        answer_index: 2
        explain: "GPU Lightmass precomputes lighting from Static and Stationary lights into lightmaps. It uses DXR, so DirectX 12 and Support Hardware Ray Tracing are required."
      - q: "Do you need Ray Traced Shadows or Ray Traced Skylight enabled for GPU Lightmass?"
        choices: ["No, leave them disabled unless your project needs them for other reasons", "Only Ray Traced Shadows", "Only for Stationary lights", "Yes, both"]
        answer_index: 0
        explain: "They are not needed for GPU Lightmass to function. The page says to leave these features disabled unless you need them."
      - q: "What do Virtual Texture Lightmaps add to a GPU Lightmass workflow?"
        choices: ["Support for Movable lights", "Faster CPU encoding", "Smaller lightmap files on disk", "Real-time updates in the viewport during the bake and editing while it builds; not required just to build lighting"]
        answer_index: 3
        explain: "With Virtual Texture Lightmaps, builds update the viewport in real time and you can edit while it builds. GPULM can still build lighting without them."
      - q: "Where are most GPU Lightmass settings found, compared to CPU Lightmass?"
        choices: ["Both in World Settings", "GPU Lightmass has its own panel under the Build dropdown; CPU Lightmass keeps most settings in World Settings", "Both in Project Settings", "GPU Lightmass settings live on each light"]
        answer_index: 1
        explain: "Unlike CPU Lightmass, almost all GPU Lightmass settings are in the plugin's own panel, opened from Build > GPU Lightmass."
      - q: "In Bake What You See mode, what do Save and Cancel do?"
        choices: ["Save encodes the lightmaps generated so far for what was on screen, but the bake keeps running; Cancel stops it", "Save exports an EXR; Cancel restarts", "Save and Cancel both end the bake", "Save finishes the whole scene; Cancel deletes lightmaps"]
        answer_index: 0
        explain: "BWYS only builds what is visible and waits indefinitely. Save encodes the data made so far and does not end the bake. Cancel stops the process."
      - q: "What is the simplest way to make a GPU Lightmass build much faster?"
        choices: ["Raise Non-Realtime Workload Factor to the maximum", "Enable Realtime in the viewport", "Turn viewport Realtime mode off (Ctrl+R) so the GPU does not also render frames", "Set every mesh to Movable"]
        answer_index: 2
        explain: "With Realtime on, GPULM runs in slow mode because it must also render frames. Turning Realtime off frees the GPU. Workload Factor changes are not a guaranteed speedup."
      - q: "Which memory statement about GPU Lightmass is true per the documentation?"
        choices: ["It bakes using the lowest-detail LOD to save memory", "The whole scene must fit in GPU memory at its highest quality LOD, because GPULM does not consider LODs while baking; lightmaps are not saved to disk until the bake completes", "Lightmaps stream to disk every few seconds", "It needs less memory than DX11 rendering"]
        answer_index: 1
        explain: "GPULM stores the entire scene at the highest quality LOD in GPU memory and does not take LODs into account. Lightmaps stay in RAM until the whole bake finishes."
      - q: "What is a listed limitation of multi-GPU GPU Lightmass baking?"
        choices: ["It disables Virtual Textures", "It only supports one light", "It only works on AMD cards", "Volumetric Lightmap calculation is not supported, and the irradiance cache is built per GPU so tiles can shade slightly differently"]
        answer_index: 3
        explain: "Multi-GPU does not yet support Volumetric Lightmap computation, and per-GPU irradiance caches can cause slight shading differences between tiles."
    flavors:
      _default: {why: "Some targets still need baked light. Knowing the bake path keeps that option open."}
      tech_art: {why: "Baking exposes lightmap UV and resolution problems fast.", do: "Use the Lightmap Density view mode before and after your Lightmap Resolution change."}
      cinematics: {why: "Baked GI plus Lumen reflections is a valid high-quality combination for stills.", do: "Try Lumen Reflections on top of your baked level and screenshot a glossy floor."}

