    title: Find the pink in the Lumen Scene
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/lumen-technical-details-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/lumen-performance-guide-for-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/lumen-global-illumination-and-reflections-in-unreal-engine"
    checklist:
      - "Open an interior level of yours with Lumen on. Switch View Mode > Lumen > Surface Cache. Screenshot it and circle every pink area."
      - "Open one pink prop (SM_) in the Static Mesh Editor. In Build Settings, raise Max Lumen Mesh Cards from 12 to 24 and click Apply Changes. Check the Surface Cache view again."
      - "In the console run r.Lumen.Visualize.CardPlacement 1 and look at the cards on that mesh. Set it back to 0."
      - "Switch to Show > Visualize > Mesh DistanceFields. Find one thin wall or window mesh that looks blobby. In its Build Settings, set Distance Field Resolution Scale to 2.0 and Apply Changes. Compare."
      - "In your Post Process Volume, set Lumen Scene View Distance to a small value, look at a far corner, then set it back to default."
      - "Open Show > Lumen and untick Screen Traces. Screenshot the same view with and without."
      - "Open Project Settings > Engine > Rendering. Write down whether Support Hardware Ray Tracing and Use Hardware Ray Tracing when available are on, and which Software Ray Tracing Mode is set."
    done_when: "Three screenshots: the Surface Cache view before and after your fix, and the Mesh DistanceFields view of the mesh you changed. Plus three lines: what was pink, what you changed, and whether the project uses Hardware or Software Ray Tracing."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "In the Lumen Surface Cache view mode an area of a mesh is pink. What does that mean for the final image?"
        choices: ["The mesh is outside the Lumen Scene distance", "The mesh has no Nanite and renders slowly", "The area has no Surface Cache coverage, so it will not bounce light and appears black in reflections", "The material uses World Position Offset"]
        answer_index: 2
        explain: "Pink marks surfaces without Surface Cache coverage. Those areas do not bounce light and look black in Lumen reflections."
      - q: "By default Lumen places how many Cards on a mesh, and where do you raise that number?"
        choices: ["12 Cards, with Max Lumen Mesh Cards in the Static Mesh Editor Build Settings", "24 Cards, in the Post Process Volume", "1 Card per material slot, in the Material Editor", "6 Cards, in the Project Settings under Lumen"]
        answer_index: 0
        explain: "Lumen places 12 Cards by default. You can raise that with Max Lumen Mesh Cards in the Build Settings of the Static Mesh Editor."
      - q: "An artist imports a whole room, including furniture, as one Static Mesh. What does the documentation say about this for Lumen?"
        choices: ["It works if you raise Max Lumen Mesh Cards to 100", "It only works with Hardware Ray Tracing", "It works fine as long as Nanite is enabled", "It is not expected to work; walls, floors and ceilings should be separate meshes"]
        answer_index: 3
        explain: "Only meshes with simple interiors are supported. Walls, floors and ceilings should be separate meshes. A full room in one mesh is not expected to work."
      - q: "With Software Ray Tracing, why does the documentation say walls should be at least 10 cm thick?"
        choices: ["Thinner walls cost more GPU time", "Distance fields cannot represent very thin features, so thin walls cause light leaking", "Nanite refuses to build meshes thinner than 10 cm", "Lightmaps need 10 cm of padding"]
        answer_index: 1
        explain: "Distance Fields cannot represent extremely thin features. Walls thinner than 10 cm can leak light."
      - q: "With Software Ray Tracing, what does Lumen trace against by default along a ray?"
        choices: ["The mesh's own distance field for the first two meters, then the merged Global Distance Field", "The triangle mesh for the first two meters, then the Surface Cache", "The Nanite Fallback Mesh only", "Only the Global Distance Field for the full ray"]
        answer_index: 0
        explain: "By default Lumen traces against each mesh's distance field for the first two meters for accuracy, and the Global Distance Field for the rest of each ray."
      - q: "A far corner of a large level shows no Lumen bounce, only screen-space effects. With Software Ray Tracing, which setting is the likely limit?"
        choices: ["Distance Field Voxel Density, which is per light", "Final Gather Quality, which is capped at 1", "Lumen Scene View Distance, which covers 200 m by default and can go up to 800 m", "Max Lumen Mesh Cards, which is per level"]
        answer_index: 2
        explain: "With Software Ray Tracing the Lumen Scene covers 200 m from the camera by default. It can be raised to 800 m with Lumen Scene View Distance in the Post Process Volume. Past that, only Screen Traces are active."
      - q: "You set a large Indirect Lighting Scale on a light to art-direct the bounce. What side effect does the documentation warn about?"
        choices: ["The light stops casting shadows", "Global illumination becomes view-dependent, because Screen Traces cannot support it correctly", "The Surface Cache is rebuilt every frame", "The light is removed from the Lumen Scene"]
        answer_index: 1
        explain: "Screen Traces limit art-direction of indirect lighting. A large Indirect Lighting Scale causes view-dependent global illumination because Screen Traces cannot support it."
      - q: "A prop was imported very small and then scaled up 20x in the level. Its Lumen bounce looks wrong. What is the correct fix per the documentation?"
        choices: ["Switch the mesh to Movable", "Raise Lumen Scene View Distance", "Turn off Screen Traces in the Post Process Volume", "Set the Distance Field Resolution Scale in the Static Mesh Editor Build Settings, because resolution is assigned from the imported scale"]
        answer_index: 3
        explain: "Mesh Distance Field resolution is assigned from the imported scale. A tiny mesh scaled up on the component lacks resolution. Set Distance Field Resolution Scale in the Static Mesh Editor Build Settings instead."
    flavors:
      _default: {why: "Most 'Lumen looks wrong' bugs are coverage bugs. The view modes show them in seconds."}
      tech_art: {why: "Card count and distance field resolution both cost memory and disk size.", do: "Run r.DistanceFields.LogAtlasStats 1 before and after raising a mesh's Distance Field Resolution Scale and note the atlas change."}
      level_design: {why: "Modular walls and floors are what Lumen expects. Kitbash rooms break it.", do: "Find one place in your blockout where a single big mesh should be split into wall, floor and ceiling pieces, and split it."}

