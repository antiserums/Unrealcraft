        explain: "With Software Ray Tracing the Lumen Scene covers 200 m from the camera by default. It can be raised to 800 m with Lumen Scene View Distance in the Post Process Volume. Past that, only Screen Traces are active."
      - q: "You set a large Indirect Lighting Scale on a light to art-direct the bounce. What side effect does the documentation warn about?"
        choices: ["The light stops casting shadows on surfaces that are lit mostly by its own bounce, and they look flat", "Global illumination becomes view-dependent, because Screen Traces cannot support it correctly", "The Surface Cache is rebuilt on every single frame for all of the meshes that the light can reach", "The light is removed from the Lumen Scene and only lights directly"]
        answer_index: 1
        explain: "Screen Traces limit art-direction of indirect lighting. A large Indirect Lighting Scale causes view-dependent global illumination because Screen Traces cannot support it."
      - q: "A prop was imported very small and then scaled up 20x in the level. Its Lumen bounce looks wrong. What is the correct fix per the documentation?"
        choices: ["Switch the mesh to Movable, because the distance field of a Static mesh is built at the imported scale and is never updated when you scale the actor", "Raise Lumen Scene View Distance, because a scaled prop is treated as if it were 20 times farther away", "Turn off Screen Traces in the Post Process Volume, because screen traces use the imported scale of the prop instead of its scale in the level", "Set the Distance Field Resolution Scale in the Static Mesh Editor Build Settings, because resolution is assigned from the imported scale"]
        answer_index: 3
        explain: "Mesh Distance Field resolution is assigned from the imported scale. A tiny mesh scaled up on the component lacks resolution. Set Distance Field Resolution Scale in the Static Mesh Editor Build Settings instead."
    flavors:
      _default: {why: "Most 'Lumen looks wrong' bugs are coverage bugs. The view modes show them in seconds."}
      tech_art: {why: "Card count and distance field resolution both cost memory and disk size.", do: "Run r.DistanceFields.LogAtlasStats 1 before and after raising a mesh's Distance Field Resolution Scale and note the atlas change."}
      level_design: {why: "Modular walls and floors are what Lumen expects. Kitbash rooms break it.", do: "Find one place in your blockout where a single big mesh should be split into wall, floor and ceiling pieces, and split it."}

  - id: EAQ85
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [lighting, shadows, virtual-shadow-maps, performance]
    required_spine: false
    required: false
    title: Green pages, red pages
    brief: "Virtual Shadow Maps split shadows into small squares called pages, and Unreal keeps finished pages in a cache so it does not have to draw them again. In the Cached Page view, green pages come from the cache and red pages had to be drawn again this frame. Drawing pages again is what makes shadows expensive, so fewer red pages means better performance. In this quest you find out what causes red pages in a level and reduce them."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/virtual-shadow-maps-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/nanite-virtualized-geometry-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a level that has a Directional Light, some static props, a few foliage meshes with a wind material (one that uses World Position Offset), and one large building mesh without Nanite. To build it quickly: place a few cubes and cylinders as props, place a few cones as bushes and give them a material in which a Sine of a Time node, multiplied by a small vector, is connected to World Position Offset, and scale a cube into a large building block."
      - "Open View Modes, then Virtual Shadow Map, then Cached Page. Keep the camera still and take a screenshot. Red pages that appear while the camera is still are cache invalidations, which means cached pages were thrown away."
      - "Switch to the Shadow Casters visualization and find which objects cause the red pages. Check that their bounds, the invisible boxes around them, are not much bigger than the meshes."
      - "Select the foliage meshes. In the Details panel, set Shadow Cache Invalidation Behavior to Rigid and check the Cached Page view again. Then set World Position Offset Disable Distance to a distance where you can no longer see the wind."
      - "In the console, run r.ShaderPrintEnable 1 and then r.Shadow.Virtual.Stats 1. Write down the values Allocated, Cached and Invalidated. Rotate the Directional Light a little and watch Invalidated jump up."
      - "Enable Nanite on the large building mesh. Move the camera slowly and compare the stats and the Cached Page view with before."
      - "Write three lines: what caused most of the invalidations, what you changed, and what you would never do to a Directional Light while the game runs."
    done_when: "Send two screenshots of the Cached Page view, one before and one after your fixes, with the VSM stats visible on screen. Add your three lines."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "In the Virtual Shadow Map Cached Page view, what do green, red and blue pages mean?"
        choices: ["Green is low resolution, red is high resolution, blue is the coarse pages of far geometry", "Green is Nanite, red is non-Nanite, blue is foliage", "Green is cached, red is new or invalidated, blue is static cached but dynamic uncached", "Green is Directional Light, red is local lights, blue is Sky Light"]
        answer_index: 2
        explain: "Cached pages are tinted green, uncached pages red. Pages where only the static page is cached (dynamic uncached) are blue."
      - q: "What happens to a light's cached shadow pages when the light moves or rotates?"
        choices: ["All cached pages for that light are invalidated", "Nothing, because lights are always dynamic", "Only Nanite pages are refreshed", "Only the pages that are near the camera are refreshed"]
        answer_index: 0
        explain: "Any light movement or rotation invalidates all cached pages for that light. That is why a slowly moving sun is expensive."
      - q: "Why do meshes with World Position Offset materials invalidate cached pages every frame, even when they barely move?"
        choices: ["Because WPO disables Nanite on the mesh, and meshes without Nanite are never cached by Virtual Shadow Maps in any case at all", "Because the shadow map cannot store animated depth, so such meshes are always drawn into a separate dynamic map", "Because WPO forces the mesh to be Movable, and Movable meshes are never cached", "Because the actual displacement is not known until the object is rendered, so the cache must assume it changed"]
        answer_index: 3
        explain: "When WPO is used, the displacement is not known until render time. The VSM cache system must assume the object needs to be redrawn."
      - q: "Which Shadow Cache Invalidation Behavior option suppresses invalidations from WPO but still invalidates when the transform changes?"
        choices: ["Always", "Rigid", "Static", "Auto"]
        answer_index: 1
        explain: "Rigid suppresses invalidations that WPO would generate. Static also suppresses transform changes; Auto is the default; Always forces invalidation."
      - q: "With separate static caching, the stats show many invalidated static pages. What does the documentation recommend?"
        choices: ["Find the actors that invalidate the static cache and switch them to Movable", "Disable caching with r.Shadow.Virtual.Cache 0 so the pages are never stored", "Set all lights to Stationary, so that their static shadows are baked and never invalidated", "Lower the screen resolution, so that fewer pages are needed and fewer of them are invalidated"]
        answer_index: 0
        explain: "The number of invalidated static pages should be near 0. Instances that invalidate the static cache often should be switched to Movable so they land in the dynamic layer."
      - q: "How do Directional Lights, Spot Lights and Point Lights each get their shadow resolution in VSM?"
        choices: ["Only Nanite meshes receive resolution; the light type does not matter, because each mesh gets one 16k VSM that all lights share", "All three use one shared 16k shadow map, split into equal parts for every light in the level, whatever the type of the light is", "Directional Lights use clipmaps of 16k VSMs, Spot Lights one 16k VSM with a mip chain, Point Lights a cube map of 16k VSMs", "Directional Lights use four cascades of 2k shadow maps, Spot Lights one 2k shadow map, Point Lights six 1k shadow map faces"]
        answer_index: 2
        explain: "Directional Lights use a clipmap of 16k VSMs. Spot Lights use a single 16k VSM with a mip chain. Point Lights use a cube map of 16k VSMs, one per face."
      - q: "Why does the documentation recommend enabling Nanite even on low-poly meshes when using VSM?"
        choices: ["Nanite meshes never cast shadows into VSMs, so they cost nothing there and leave more pages for other meshes", "Non-Nanite geometry is much more expensive to render into VSMs, and invalidations fully in Nanite shadow can be skipped", "Nanite meshes are cached forever, so their shadow is rendered one time when the level loads", "Nanite removes the need for a Directional Light, because Nanite meshes take their shadows from the Sky Light capture"]
        answer_index: 1
        explain: "Non-Nanite geometry costs much more in the Shadow Depths pass. Invalidations entirely in the shadow of Nanite objects can also be skipped, which is not true for non-Nanite objects."
      - q: "With VSM enabled, what does the documentation say about the Contact Shadow Length property?"
        choices: ["It is now the main soft shadow control; a larger value gives a wider penumbra on every light, and Source Radius and Source Angle are no longer used by VSM", "It replaces Source Angle on Directional Lights; the value is read as the angle of the sun disk in degrees, and the real contact shadows are always turned off", "It must be at least 0.1 on every light, or the virtual pages near the camera are not allocated and close shadows break up into very large blocks", "It is no longer necessary for sharp contact shadows and is less accurate than VSM; keep it only for objects that do not render into shadow maps"]
        answer_index: 3
        explain: "VSM is high resolution and accurate, so screen space Contact Shadows are not needed. They may still help for objects set to not render into shadow maps."
    flavors:
      _default: {why: "VSM cost is mostly re-drawn pages. If you can read the colors, you can fix the cost."}
      tech_art: {why: "This is the shadow budget in one overlay.", do: "Use Unreal Insights with trace.enable counters,vsm and graph Invalidated over a 20 second walk."}
      level_design: {why: "A single moving sun or a huge swaying tree can eat the whole shadow budget.", do: "List the moving shadow casters in your level and mark which ones really need to move."}

  - id: EAQ86
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [lighting, megalights, ray-tracing, shadows]
    required_spine: false
    required: false
    title: Fifty shadowed lights with MegaLights
    brief: "Lights that cast shadows are expensive, so in the past a scene could only have a few of them. MegaLights is a newer feature of Unreal Engine 5 that makes it possible to use many shadow-casting lights at the same time. It has limits, and you should know them before you depend on it. In this quest you turn MegaLights on, light a hall with at least 20 shadowed lights, measure the cost, and fix a light that wastes performance."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/megalights-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/hardware-ray-tracing-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/ray-tracing-performance-guide-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open Project Settings, then Engine, then Rendering, and find the Direct Lighting section. Enable MegaLights, and accept the prompt that asks to enable Support Hardware Ray Tracing. Restart the editor."
      - "In a new level, build a dark hall from cubes with a floor, walls and pillars. Place at least 20 Movable local lights: Point Lights, Spot Lights, and 2 Rect Lights with a Source Texture (any texture works). Turn Cast Shadows on for all of them."
      - "Add a Post Process Volume with Infinite Extent turned on. Use its MegaLights setting to turn MegaLights off, and read the number from stat GPU. Then turn MegaLights on again and compare the number."
      - "Open View Modes, then MegaLights, then Light Complexity. Move the mouse over a wall between many lights, and take a screenshot of the list of lights and their weight ratios."
      - "Find one light that is partly inside a wall or reaches very far. Make its Source Width, Source Height, cone angle or Attenuation Radius smaller until it no longer shines through geometry."
      - "On one Spot Light, set MegaLights Shadow Method to Virtual Shadow Maps. Compare the shadow detail on a Nanite prop with the shadow from a Ray Tracing light next to it."
      - "Open one prop in the Static Mesh Editor. Under Nanite Settings, set Fallback Target to Fallback Relative Error (some versions show this option as Relative Error), lower the Fallback Relative Error value, and click Apply Changes. See if its shadow gets more accurate."
    done_when: "Send a screenshot of the lit hall and a screenshot of the Light Complexity view with the list of lights visible. Also write the two stat GPU numbers in your post, one with MegaLights off and one with MegaLights on."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Where do you enable MegaLights for a project, and what does the editor ask you to enable at the same time?"
        choices: ["In World Settings > Lightmass Settings; it prompts to enable Virtual Shadow Maps for the whole project", "In the Post Process Volume, under Global Illumination; it asks you to enable Lumen and to restart the editor before the option shows", "In Project Settings > Rendering > Direct Lighting; it prompts to enable Support Hardware Ray Tracing", "On each light's Details panel; it asks for Nanite on every mesh in the light's radius"]
        answer_index: 2
        explain: "MegaLights is enabled in Project Settings under Rendering > Direct Lighting. It prompts you to enable Support Hardware Ray Tracing, which is recommended."
      - q: "How does MegaLights performance behave compared to Deferred Shading as you add more lights?"
        choices: ["MegaLights has a roughly constant cost but quality can drop where lighting is complex; Deferred Shading keeps quality but cost rises with light count", "MegaLights gets faster with more lights, because the ray budget per pixel is shared and each light then takes a smaller part of it; Deferred Shading does not change", "Deferred Shading has a roughly constant cost but quality can drop where lighting is complex; MegaLights keeps quality but cost rises with light count", "Both get slower at the same rate, because both shade every light for each pixel; the only difference is the quality of the shadows"]
        answer_index: 0
        explain: "MegaLights traces a fixed number of rays per pixel, so cost is constant and quality depends on lighting complexity. Deferred Shading has constant quality and rising GPU cost per light."
      - q: "Too many important lights hit one pixel and the result looks blurry or ghosts. What does the documentation recommend?"
        choices: ["Switch all lights to Static, so that they are baked and no longer take part in the sampling of MegaLights at runtime, which removes the noise", "Disable screen space traces, which are the main source of ghosting on moving objects", "Raise the denoiser strength in the Post Process Volume until the ghosting is gone, and add more small lights to fill", "Merge clusters of small lights into one area light and narrow light bounds (attenuation, cone angles, barn doors)"]
        answer_index: 3
        explain: "With a fixed sample budget the denoiser must work harder. Replace clusters with a single area light and narrow attenuation, cone angles and barn doors."
      - q: "Which MegaLights shadow method is the default, and why should the other one be used sparingly?"
        choices: ["Virtual Shadow Maps is default; Ray Tracing needs Lumen Hardware Ray Tracing and adds a large memory cost for every light", "Ray Tracing is default; Virtual Shadow Maps add a significant per-light memory, CPU and GPU cost to generate shadow depths", "Distance Field Shadows is default; the others are experimental and can only be enabled with a console variable, so they should not be used in a shipped game", "Ray Tracing is default; Virtual Shadow Maps do not work with Nanite meshes at all in MegaLights"]
        answer_index: 1
        explain: "Ray Tracing is the default and adds no per-light cost. Virtual Shadow Maps capture full Nanite detail but need per-light shadow depths, which cost memory, CPU and GPU."
      - q: "MegaLights shadows leak or miss detail from a Nanite prop. What is the root cause per the documentation and one fix?"
        choices: ["The Ray Tracing Scene is built from simplified Nanite Fallback Meshes; set Fallback Target to Relative Error and lower Fallback Relative Error", "The light is set to Stationary and bakes its shadows into lightmaps; set it to Movable and rebuild the lighting so that MegaLights can trace it", "Screen traces are disabled, so near details are missed; enable them with the console variable for MegaLights and raise the number of samples that are taken per pixel", "The prop has no lightmap UVs, so MegaLights has nowhere to store its shadow; generate them in the Static Mesh Editor"]
        answer_index: 0
        explain: "Ray traced shadows depend on the Ray Tracing Scene, which uses simplified Nanite Fallback Meshes. Lowering Fallback Relative Error adds triangles to the fallback mesh."
      - q: "How does MegaLights treat Directional Lights by default, and what does the documentation recommend for a strong sun?"
        choices: ["They are disabled unless the light is Static; use a Static Directional Light for the sun and let MegaLights add its shadows on top of the baked lightmaps of the level", "They are always handled by MegaLights; use one Directional Light for the sun and give it the largest share of the whole ray budget per pixel", "They are disabled in MegaLights by default; use Deferred Lighting with VSM for the sun and MegaLights only for dim lights like moonlight", "They are converted to Rect Lights by MegaLights; use a very large Rect Light far above the level for the sun"]
        answer_index: 2
        explain: "Directional lights are off in MegaLights by default (r.MegaLights.DirectionalLights 1 enables them). The recommendation is Deferred plus VSM for strong suns."
      - q: "What does the Light Complexity view mode show when you hover a pixel?"
        choices: ["The shadow map resolution of each light that reaches the pixel, with the page size and the mip level in use", "Lines to the lights influencing that pixel and a list sorted by weight ratio, with visibility and light type", "The number of Nanite triangles per light that are drawn into the shadow of that pixel, with a color scale from green to red", "The lightmap density of the surface that is under the cursor, in texels per unit"]
        answer_index: 1
        explain: "Light Complexity draws lines from the pixel to the influencing lights and lists them sorted by weight ratio, which measures light importance for that pixel."
      - q: "Do Light Functions work with MegaLights?"
        choices: ["Only on Directional Lights, because the Light Function Atlas has one slot only, and that slot is always given to the sun of the level", "Only when the shadow method of the light is set to Virtual Shadow Maps and the light is a Spot Light or Rect Light", "No, never; a light that has a Light Function is always handled by Deferred Shading", "Yes, if the material is compatible with the Light Function Atlas and the atlas is enabled in the project settings"]
        answer_index: 3
        explain: "Light Functions are supported as long as they are compatible with the Light Function Atlas and the atlas is enabled in the project settings."
    flavors:
      _default: {why: "MegaLights changes what is affordable: many shadowed area lights. You need to know its limits before you rely on it."}
      tech_art: {why: "The Ray Tracing Scene quality and culling are the real dials.", do: "Run r.MegaLights.Debug 1 and r.ShaderPrint.Lock 1 on a noisy pixel and fly around to see where its rays go."}
      cinematics: {why: "Textured Rect Lights become cheap enough for shot lighting.", do: "Light one shot with three textured Rect Lights and no other local lights."}

  - id: EAQ87
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [lighting, ies, physical-units, local-lights]
    required_spine: false
    required: false
    title: IES intensity and the cone clip
    brief: "An IES profile is a small file from a lamp manufacturer that describes how a real lamp spreads its light and how bright it is. Brightness in these files is measured in candelas. When you assign a profile to a light in Unreal, the light gets the realistic shape of that lamp on walls and floors. In this quest you import an IES profile, use it on three kinds of lights, and see how the cone of a Spot Light can cut part of it off."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-ies-light-profiles-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/point-lights-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/spot-lights-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-physical-lighting-units-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Download one free IES profile from the website of a lighting manufacturer. The documentation page linked on this quest names Lithonia and Philips. Import it with the Add button of the Content Browser, or drag and drop the file. If you cannot download one, use a copy of a profile that comes with the engine, for example Complex_IES in the engine folder EngineLightProfiles. To see engine content, open the Settings menu of the Content Browser and turn on Show Engine Content."
      - "Open the imported IES asset in the Texture Editor. Write down its Brightness, which is given in candelas, and the read-only value Texture Multiplier."
      - "Build a dark room from cubes in a new level. Place a Point Light, a Spot Light and a Rect Light on the same wall. Under Light Profiles, assign the same IES Texture to each of them. Take a screenshot of all three."
      - "Set the Outer Cone Angle of the Spot Light to 30, and then to 80. Watch where the profile is cut off."
      - "On the Point Light, enable Use IES Intensity. Try IES Intensity Scale at 1.0 and at 0.25. Then disable Use IES Intensity and compare with the light's own Intensity."
      - "In the Texture Editor, set Brightness to 0 and save. Look at the Point Light with Use IES Intensity turned on. Put the original value back afterwards."
      - "Make one Light Function material that imitates the same shape and put it on a fourth light. Note in one line which is the cheaper way to shape a light."
    done_when: "Send one screenshot of the three lights with the same IES profile (Point, Spot and Rect), and one screenshot of the Texture Editor that shows Brightness. Add two lines: the candela value you used, and which light type lost part of the profile."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "What is an IES profile inside Unreal Engine, technically?"
        choices: ["A mesh that blocks light around the source, which is rendered into the shadow map of the light", "A 2D texture that is projected from the light like a slide and multiplies its own color", "A 1D curve of intensity that sweeps around an axis and works as a brightness multiplier", "A cubemap of the fixture that is used in reflections of the light"]
        answer_index: 2
        explain: "IES profiles are a 1D texture (gradient) but not a real texture file. The curve sweeps around an axis and multiplies the light's brightness."
      - q: "What does Use IES Intensity do, and when can you edit IES Intensity Scale?"
        choices: ["It uses the brightness stored in the profile instead of the light's Intensity; IES Intensity Scale can only be set when it is enabled", "It converts the lumens of the profile to candelas for the light; IES Intensity Scale can only be set on Rect Lights, never on others", "It bakes the profile into the lightmap during the build; IES Intensity Scale is read-only after that and cannot be set", "It doubles the light's Intensity for every light that has a profile; IES Intensity Scale is always editable"]
        answer_index: 0
        explain: "Use IES Intensity takes the brightness from the profile. IES Intensity Scale scales that contribution and is only available when Use IES Intensity is on."
      - q: "In the Texture Editor the IES asset's Brightness is set to 0 and the light has Use IES Intensity enabled. What happens?"
        choices: ["The light becomes white and ignores its Light Color", "The editor refuses to save the asset with that value", "The light ignores the profile and uses its own Intensity value instead", "The profile is used for masking only and the light is completely masked"]
        answer_index: 3
        explain: "When Brightness is less than or equal to 0 with Use IES Intensity on, the profile only masks, so the light is completely masked."
      - q: "You put the same IES profile on a Point Light and a Spot Light. What is the difference?"
        choices: ["The Point Light ignores the profile, because profiles need a cone; the Spot Light shows all of it inside its cone angle", "The Spot Light's cone masks the profile, and data beyond its 179 degree arc is lost; the Point Light shows it unclipped", "The Spot Light doubles the brightness of the profile, because the same light is pressed into a cone; the Point Light shows it as it is", "The Point Light becomes a Rect Light when a profile is assigned to it, because profiles need a source with a width and a height"]
        answer_index: 1
        explain: "On a Spot Light the cone masks the IES effect and data past the 179 degree maximum arc is lost. On a Point Light the profile is unclipped."
      - q: "Why does the documentation call IES profiles a better choice than Light Functions for shaping a light?"
        choices: ["They render very fast with no significant performance effect, unlike a Light Function", "They work on Directional Lights too, which cannot use a Light Function to shape their light at all", "They can be edited node by node in the Material Editor, which a Light Function cannot", "They support animation with keys in Sequencer, which a Light Function material is not able to do"]
        answer_index: 0
        explain: "IES profiles render very fast and do not affect performance much, so they are the more ideal option for shaping a light than a Light Function."
      - q: "An IES profile on a Static light looks blotchy after a lightmap build. What does the documentation suggest?"
        choices: ["Convert the IES to a texture and assign it as a Light Function, which is baked at a higher resolution", "Use a Rect Light instead, because Rect Lights are the only lights that bake a profile cleanly", "Raise the lightmap resolution of the receiving surface or use a Stationary or Movable light", "Disable Inverse Squared Falloff on the light and build the lighting again"]
        answer_index: 2
        explain: "With precomputed Static lighting the profile mask and a low lightmap resolution give poor results. Increase lightmap resolution or use Stationary or Movable lights."
      - q: "What does the read-only Texture Multiplier on an IES asset represent?"
        choices: ["The number of candelas that the profile has at its brightest angle, as read from the file", "The multiplier that maps the texture value so it integrates over a sphere to 1.0", "The attenuation radius of the light, in the units that the profile was made in", "The cone angle in degrees that the profile covers around its axis"]
        answer_index: 1
        explain: "Texture Multiplier is an uneditable value used to map the texture value to a result that integrates over a sphere to 1.0."
      - q: "Where does the documentation say to get IES profiles, and how can you preview one before importing?"
        choices: ["From the Engine Content folder, which ships with a full library; preview one in the Texture Editor window", "By exporting from a Spot Light in the level; preview one in Sequencer with a Light track", "From the Marketplace only, as paid packs; preview one in the Material Editor preview", "From lighting manufacturers' websites, free of charge; preview with a photometric viewer such as IESviewer"]
        answer_index: 3
        explain: "Almost all major lighting manufacturers provide IES files for free. Photometric viewers like IESviewer show the profile before you import it."
    flavors:
      _default: {why: "Real fixtures have real shapes and real candela values. IES gives you both for free."}
      cinematics: {why: "Practical lamps in shots read as real when their falloff is real.", do: "Match one practical lamp in a shot with an IES profile and a real candela value from the profile."}
      tech_art: {why: "IES vs light function is a cost decision.", do: "Compare stat GPU with 10 IES lights versus 10 light-function lights in the same room."}

