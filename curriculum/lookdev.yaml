    quiz:
      - q: "Which IOR value does the page give for glass?"
        choices: ["1.00", "1.33", "1.52", "2.42"]
        answer_index: 2
        explain: "Glass is 1.52. Water is 1.33, air is 1.00, diamond is 2.42. Use real values for realism."
      - q: "The Refraction pin is greyed out on the main material node. What two settings enable it?"
        choices: ["Blend Mode Translucent and Lighting Mode Surface TranslucencyVolume", "Blend Mode Masked and Two Sided", "Shading Model Unlit and Blend Mode Additive", "Blend Mode Opaque and a Fresnel node"]
        answer_index: 0
        explain: "The tutorial changes Blend Mode to Translucent and the Lighting Mode from Volumetric NonDirectional to Surface TranslucencyVolume. That enables the Refraction input."
      - q: "Why does the tutorial use a Fresnel node to drive refraction?"
        choices: ["To make the glass darker", "Because glass refracts little when viewed straight on and more at glancing angles", "To disable refraction on mobile", "To add roughness"]
        answer_index: 1
        explain: "Fresnel blends the constant at the center of the sphere with the IOR at the edges, so refraction is strongest where the surface curves away from the camera."
      - q: "What is Refraction Depth Bias for?"
        choices: ["Making refraction stronger", "Changing the IOR by distance", "Preventing closer objects from rendering into the distorted surface at sharp viewing angles", "Enabling Thin Translucent"]
        answer_index: 2
        explain: "The depth bias stops nearby objects from being pulled into the refraction at acute angles, at the cost of a disconnect between the surface and where refraction starts."
      - q: "What does adding a normal map to the refractive material do?"
        choices: ["Nothing, refraction ignores normals", "It bends the refraction following the normal detail", "It turns the material opaque", "It changes the IOR value"]
        answer_index: 1
        explain: "The normal map changes the refraction wherever it has detail. Panning two normal maps is how the page builds moving water or heat haze."
      - q: "For a Thin Translucent glass, which Lighting Mode does the page require?"
        choices: ["Volumetric Directional", "Surface TranslucencyVolume", "Volumetric PerVertex NonDirectional", "Surface ForwardShading"]
