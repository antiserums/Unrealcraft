    title: Motion blur that helps, not hurts
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/temporal-super-resolution-in-unreal-engine"
    checklist:
      - "Add a rotating or moving prop (a Rotating Movement component on BP_Fan is enough) and a Post Process Volume PPV_Motion with Infinite Extent."
      - "Under Motion Blur, set Amount to 0 and take a screenshot while the prop moves. Then set Amount to 0.5 and compare."
      - "Set Max to a small value (for example 5) and then a large value. Note how far the smear can reach across the screen."
      - "Set Target FPS to 30, then 60, then 0. Note which one gives the most blur."
      - "Lower Per Object Size from the default and check whether small moving props gain blur."
      - "Open Show > Visualize > Motion Blur and take a screenshot of the velocity view."
    done_when: "Screenshots of the moving prop at Amount 0 and Amount 0.5, plus the Visualize > Motion Blur view. List the Max, Target FPS and Per Object Size values you kept."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What does the motion blur system use to decide how much to blur each object?"
        choices: ["A full-screen velocity map", "The distance to the camera", "The object's mass", "The shutter speed of the Post Process Volume"]
        answer_index: 0
        explain: "The engine uses a full screen velocity map and blurs objects based on their contribution to it."
      - q: "What does the Max property control?"
        choices: ["The maximum number of blurred objects", "The maximum frame rate for blur", "The maximum distortion in percent of the screen width", "The maximum blur intensity from 0 to 1"]
        answer_index: 2
        explain: "Max is the maximum distortion caused by motion blur, in percent of the screen width. 0 is off."
      - q: "You set Target FPS to 0. What does that mean?"
        choices: ["Motion blur is off", "Blur depends on the actual measured frame rate", "Blur is computed for a fixed 60 fps", "Blur is doubled"]
        answer_index: 1
        explain: "A Target FPS of 0 makes motion blur dependent on the actual measured frame rate. Other values make it independent of frame rate."
      - q: "With Target FPS set, which gives more motion blur?"
        choices: ["A higher target FPS", "They give the same blur", "Only Amount changes the blur", "A lower target FPS"]
        answer_index: 3
        explain: "A higher target FPS means shorter frames and shutter times, so less blur. A lower target FPS means more blur."
      - q: "What is the default Per Object Size and what happens when you lower it?"
        choices: ["1% and fewer objects blur", "10% and the blur becomes sharper", "4% and more objects are drawn in the velocity pass, causing more draw calls", "50% and the effect is disabled"]
        answer_index: 2
        explain: "The default is 4% of screen width. Smaller radii let smaller objects into the velocity pass, which causes more draw calls."
      - q: "Where do you visualize motion blur in the editor?"
        choices: ["View Mode > Motion Blur", "Stat > Motion", "Project Settings > Rendering > Debug", "Show > Visualize > Motion Blur"]
        answer_index: 3
        explain: "The page says motion blur is visualized with Level Viewport Show > Visualize > Motion Blur."
      - q: "Why is motion blur called a hidden cost of temporal upscaling?"
        choices: ["It runs after TSR at display resolution, so it does not scale with screen percentage", "It runs before TSR at a lower resolution", "It disables TSR", "It doubles the TSR history size"]
        answer_index: 0
        explain: "Passes like motion blur and the tonemapper run after TSR, so they run at display resolution, not the rendering resolution set by screen percentage."
      - q: "Which console variable runs directional blur at half resolution on very large movements?"
        choices: ["r.MotionBlur.Amount 0.5", "r.MotionBlur.HalfResGather 1", "r.TSR.History.ScreenPercentage 50", "r.MotionBlur.Max 0"]
        answer_index: 1
        explain: "The TSR page lists r.MotionBlur.HalfResGather 1 as the setting that enables half resolution for large directional blur."
    flavors:
      _default: {why: "Motion blur can smooth movement or smear your whole scene. Knowing the four dials keeps it under control."}
      lookdev: {why: "Fly-through captures of your environment need blur that reads as camera motion, not mud.", do: "Record a short viewport fly-through with your chosen values and check that small props still read."}
      tech_art: {why: "Motion blur costs GPU time after upscaling.", do: "Compare stat gpu with Amount 0 and Amount 0.5 and write the difference."}

  - id: EAQ105
    rank: 2
    difficulty: adept
    track: environment-art
    subjects: [rendering, tsr, screen-percentage, performance]
    required_for_majors: []
    taster_for_majors: []
    adjacent_for: [tech_art, programming]
    required_spine: false
    elective: true
    title: Screen percentage and TSR
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/temporal-super-resolution-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/screen-percentage-with-temporal-upscale-in-unreal-engine"
    checklist:
      - "Open your environment scene. In the Viewport Options menu, enable Stat > Engine > TSR (or type stat tsr in the console)."
      - "In Viewport Options > Screen Percentage, enable Custom Override. Set 100, then 66, then 50. Write down TSR feed and TSR 1spp for each."
      - "Enable Stat > Advanced > GPU and note the TemporalSuperResolution cost at 100 and at 50 percent."
      - "Open Show > Visualize > VisualizeTemporalUpscaler and take a screenshot of the input and output view."
      - "Open Settings > Engine Scalability Settings and switch the Anti-Aliasing group between Medium and Epic. Look at the same thin geometry (fence, wires, foliage) each time."
      - "Open Engine/Config/BaseScalability.ini and find the AntiAliasingQuality sections. Note two r.TSR variables that change between levels."
    done_when: "A screenshot of the VisualizeTemporalUpscaler view and a small table: screen percentage (100, 66, 50) with TSR feed, TSR 1spp and GPU cost for each."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the main promise of Temporal Super Resolution?"
        choices: ["Path-traced quality in real time", "Image quality near native 4K from a lower internal resolution, at a fraction of the cost", "Perfect anti-aliasing with no ghosting", "Higher resolution textures"]
        answer_index: 1
        explain: "TSR renders a lower internal resolution and accumulates frames, giving near-4K quality from inputs as low as 1080p while reducing GPU frame time."
      - q: "Where in the rendering chain does TSR happen?"
        choices: ["After depth of field, and everything after it (motion blur, bloom) is upscaled", "Before the base pass", "After the tonemapper", "After the UI is drawn"]
        answer_index: 0
        explain: "TSR happens after depth of field. Motion blur, bloom and later passes then run on the upscaled image."
      - q: "What does stat tsr add compared to stat unit?"
        choices: ["Draw call counts", "Shader compile times", "Texture streaming pool size", "TSR feed and TSR 1spp"]
        answer_index: 3
        explain: "TSR stats show the same frame information plus TSR feed (megapixels per second fed into TSR) and TSR 1spp (convergence time)."
      - q: "At 50 percent screen percentage and 60 Hz, how long does TSR need to reach one sample per pixel?"
        choices: ["16.6 ms", "33.3 ms", "66.6 ms", "133.3 ms"]
        answer_index: 2
        explain: "TSR 1spp = 1000 / (0.5 squared x 60) = 66.6 ms. At 50 percent you need four frames for one sample per pixel."
      - q: "Which console variable sets the anti-aliasing scalability group, and what does 4 mean?"
        choices: ["sg.AntiAliasingQuality, 4 = Cinematic", "r.TSR.Quality, 4 = Ultra", "r.ScreenPercentage, 4 = 400 percent", "sg.PostProcessQuality, 4 = Epic"]
        answer_index: 0
        explain: "sg.AntiAliasingQuality uses 0 Low, 1 Medium, 2 High, 3 Epic and 4 Cinematic."
      - q: "How do you set a custom rendering resolution for an editor viewport?"
        choices: ["Project Settings > Rendering > Editor Resolution", "r.SetRes in the console", "Viewport Options > Screen Percentage with Custom Override", "Window > Viewport Resolution"]
        answer_index: 2
        explain: "Editor viewports have their own Screen Percentage setting in the Viewport Options menu, with a Custom Override checkbox."
      - q: "When is a screen percentage below 50 percent a reasonable choice?"
        choices: ["Always, it is the fastest", "Only when targeting a display above 4K, or in exceptional dynamic resolution cases on consoles", "Never, the engine clamps at 50", "Only in the editor"]
        answer_index: 1
        explain: "The page says extreme upscaling below 50 percent should only be considered for displays greater than 4K or exceptional dynamic resolution cases on consoles."
      - q: "With a 1920x1080 output and 83 percent screen percentage, roughly what size are the render targets before upscaling?"
        choices: ["1280x720", "1920x1080", "2304x1296", "1600x900"]
        answer_index: 3
        explain: "The screen percentage page gives this example: at 83 percent, the render targets are resized to about 1600x900 before being upscaled to 1920x1080."
    flavors:
      _default: {why: "Screen percentage is the biggest single performance dial, and TSR is what makes a low value still look good."}
      lookdev: {why: "Thin details like wires, fences and grass are the first to break under upscaling.", do: "Find the lowest screen percentage where your thinnest detail still reads and write it down."}
      tech_art: {why: "Scalability groups are how a project ships TSR settings per platform.", do: "Copy one AntiAliasingQuality section into your project's DefaultScalability.ini and change one value on purpose."}

