    subjects: [nanite, lod, static-mesh, performance]
    required_spine: false
    required: false
    title: "Nanite or LODs: decide per prop"
    brief: "Nanite is the system that draws very detailed meshes efficiently, and it is the normal choice for most props in Unreal Engine 5. The older method is LODs, which are simpler versions of a mesh that Unreal shows at a distance. Nanite does not help every kind of mesh, for example some meshes with see-through leaf cards or very simple shapes. In this quest you look at four different props and decide for each one whether it should use Nanite or classic LODs."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/nanite-virtualized-geometry-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/working-with-naniteenabled-content"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/nanite-technical-details"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/static-mesh-automatic-lod-generation-in-unreal-engine"
    community_urls:
      - {title: "Nanite | Inside Unreal (Unreal Engine channel)", url: "https://www.youtube.com/watch?v=TMorJX3Nj6U"}
    checklist:
      - "Collect four props in a test level: a dense scanned rock, a tree made of masked leaf cards, a sky sphere or another big simple mesh, and a modular wall piece that you place 50 times."
      - "For each prop, write one line that says Nanite or classic LODs. Give the reason from the Nanite documentation page, such as triangle count, instance count, occluder, VSM shadows or material type."
      - "Enable Nanite on the props you chose. Open View Modes, then Nanite Visualization, then Mask, to confirm which are green (Nanite) and which are red (not Nanite)."
      - "Open the Overdraw visualization. Look at the tree and at any kit pieces that are stacked on each other, and note the brightest areas."
      - "Open the rock in the Static Mesh Editor and compare its vertex count with its triangle count. If the vertex count is 2 times the triangle count or more, note that the normals are probably faceted, which means each triangle looks flat."
      - "Type r.Nanite 0 and then r.Nanite 1 in the console, and watch stat unit each time. Add the result to your notes."
    done_when: "Send a short text with the four props and your decision for each one with the reason. Also send one screenshot of the Nanite Mask visualization."
    xp: 60
    verify_type: writeup
    quiz:
      - q: "The Nanite page gives one example of a mesh that is NOT a good Nanite candidate. Which one?"
        choices: ["A photogrammetry rock", "A modular wall used 200 times", "A sky sphere", "A ZBrush statue"]
        answer_index: 2
        explain: "Its triangles are large on screen, it occludes nothing and there is only one in the scene."
      - q: "A prop material uses the Translucent blend mode. What happens when you enable Nanite on the mesh?"
        choices: ["The material renders as usual", "A default material is assigned and a warning appears in the Output Log", "The mesh becomes invisible", "Nanite is disabled again automatically"]
        answer_index: 1
        explain: "Nanite supports Opaque and Masked materials only."
      - q: "Can a Nanite prop use Mesh Decals?"
        choices: ["Yes, always", "Yes, if the decal is Opaque", "Only with Virtual Textures", "No; Mesh Decals need a Translucent blend mode, but projected decals still work on Nanite"]
        answer_index: 3
        explain: "Nanite meshes receive projected decals but do not support Mesh Decals."
      - q: "Why do leaves and grass (aggregate geometry) cost more under Nanite?"
        choices: ["They break fine-grained LOD simplification and occlusion culling, so more triangles are drawn per pixel", "They use too many materials", "Nanite cannot store green pixels", "They always need Explicit Tangents"]
        answer_index: 0
        explain: "From far away they look like a cloud, not a surface. Nanite cannot simplify or occlude them well."
      - q: "A dense mesh has 3 vertices for every triangle. What does this tell you?"
        choices: ["It is perfect for Nanite", "The mesh has too few UVs", "Every triangle has its own vertices, so the normals are fully faceted and the mesh is much more expensive", "It has no collision"]
        answer_index: 2
        explain: "The page says a ratio of 2:1 or higher is likely a problem, and 3:1 means completely faceted normals."
      - q: "Kit pieces are stacked very close together on a wall. Which visualization shows the cost?"
        choices: ["Lightmap UV", "Overdraw", "Instances", "Mask"]
        answer_index: 1
        explain: "Brighter areas in the Overdraw view mean more layers are drawn for the same pixels."
      - q: "The technical details page compares a 1.5 million triangle mesh stored as Nanite versus as a standard static mesh with 4 LODs. What is the result?"
        choices: ["Both are about the same size", "The Nanite mesh is twice as large", "The standard mesh is smaller because of LODs", "The Nanite mesh is about 7.6x smaller (19.64 MB versus 148.95 MB)"]
        answer_index: 3
        explain: "Nanite uses a highly compressed format. Data size is the thing to watch, not raw triangle count."
      - q: "You import a dense mesh with Build Nanite and your project uses no baked lighting. What does the page recommend?"
        choices: ["Turn off Generate Lightmap UVs to save import time and data", "Turn on Generate Lightmap UVs", "Import at half resolution", "Disable Virtual Textures"]
        answer_index: 0
