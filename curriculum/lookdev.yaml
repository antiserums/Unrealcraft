    checklist:
      - "Start from your EAQ36 level (Directional Light + Sky Atmosphere). Place a Sky Light and set its Mobility to Movable."
      - "Place a chrome sphere (Roughness 0, Metallic 1) to see the sky reflection."
      - "Rotate the sun to a sunset. Notice the sphere and the ground lighting do not change until you press Recapture in the Sky Light Details panel."
      - "Enable Real Time Capture on the Sky Light. Rotate the sun again and watch the reflection and lighting follow."
      - "Change Cubemap Resolution from 128 to 64 and to 256. Compare the sphere reflection."
      - "Open the Advanced section and enable Lower Hemisphere is Solid Color. Note the change under overhangs."
      - "Switch Source Type to SLS Specified Cubemap with any HDRI, then back to SLS Captured Scene."
    done_when: "Two screenshots of the chrome sphere at sunset: one before Recapture (stale sky) and one with Real Time Capture enabled, with the Sky Light Details panel visible."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "A Stationary or Movable Sky Light: when does it capture the scene?"
        choices: ["Every frame, always", "Once on load, and then only when Recapture is called or Real Time Capture is enabled", "Only when lighting is built", "Only when the level is saved"]
        answer_index: 1
        explain: "For Stationary or Movable Sky Lights, updates happen once on load and then only when Recapture is called, unless Real Time Capture is enabled. Static Sky Lights update when building lighting."
      - q: "You swap the texture in your skybox material. What does the Sky Light do?"
        choices: ["Updates automatically", "Rebuilds lighting by itself", "Switches to a specified cubemap", "Nothing until you Recapture or use Real Time Capture"]
        answer_index: 3
        explain: "The docs say changing the skybox texture does not automatically update the Sky Light. You must use Recapture, Blueprint, or Real Time Capture."
      - q: "Real Time Capture is enabled but nothing changes. What does the mode require?"
        choices: ["A Sky Atmosphere component in the scene", "A Static Sky Light", "Volumetric Fog enabled", "A Reflection Capture actor"]
        answer_index: 0
        explain: "Real Time Capture requires a Sky Atmosphere component to be present. It works with Stationary or Movable Sky Lights, and Volumetric Fog is not supported by it."
      - q: "Which values are valid for Cubemap Resolution?"
        choices: ["Any integer", "Only 128", "Powers of two such as 64, 128, 256", "Multiples of 100"]
        answer_index: 2
        explain: "Cubemap Resolution uses power of two values (64, 128, 256 and so on). Higher values increase quality at the cost of performance."
      - q: "For a Static Sky Light, why should the skybox material be Unlit?"
        choices: ["Unlit is faster to compile", "Only the emissive contribution of materials is captured, to avoid a feedback loop", "Lit materials cannot be seen by the Sky Light at all", "Static Sky Lights only capture cubemaps"]
        answer_index: 1
        explain: "A Static Sky Light captures only the emissive contribution of materials to avoid a feedback loop, so the skybox must use an Unlit material."
      - q: "Why is Real Time Capture preferred over calling RecaptureSky() from Blueprint during gameplay?"
        choices: ["RecaptureSky() gives lower quality", "RecaptureSky() only works in the editor", "Real Time Capture is free", "Real Time Capture stays on the GPU; RecaptureSky() costs at least 120 ms and can pause gameplay"]
        answer_index: 3
        explain: "Real Time Capture keeps all work on the GPU with time slicing. RecaptureSky() has a high processing cost, at least 120 ms, which can cause a pause or slowdown."
