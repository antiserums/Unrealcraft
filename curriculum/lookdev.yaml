    quiz:
      - q: "A Stationary or Movable Sky Light: when does it capture the scene?"
        choices: ["Every frame, always", "Once on load, and then only when Recapture is called or Real Time Capture is enabled", "Only when lighting is built", "Only when the level is saved"]
        answer_index: 1
        explain: "For Stationary or Movable Sky Lights, updates happen once on load and then only when Recapture is called, unless Real Time Capture is enabled. Static Sky Lights update when building lighting."
      - q: "You swap the texture in your skybox material. What does the Sky Light do?"
        choices: ["Updates automatically", "Rebuilds lighting by itself", "Switches to a specified cubemap", "Nothing until you Recapture or use Real Time Capture"]
        answer_index: 3
