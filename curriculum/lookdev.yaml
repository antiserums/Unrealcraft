        choices: ["A percentage of the texture", "UV tiles per meter", "World units along X, Y and Z", "Pixels"]
        answer_index: 2
        explain: "World-aligned functions scale in world units instead of as a percentage of texture size, so the result is the same on any mesh."
      - q: "A door that opens uses a world-aligned material. What visual problem does the docs warn about?"
        choices: ["The texture stays in place and the object slides under it (swimming)", "The texture disappears", "The normal map inverts", "The material becomes unlit"]
        answer_index: 0
        explain: "Because tiling is in world space, animated or moving objects experience texture swimming."
