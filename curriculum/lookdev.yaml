    brief: "A normal decal is projected onto a surface from one direction, so it stretches on curved shapes such as pipes and barrels. A mesh decal is different: it is a thin piece of geometry that sits just above the surface and uses a decal material. Because it follows the shape of the prop, details such as rust bands wrap around it without stretching. In this quest you build a mesh decal for a curved prop and compare it with a projected decal."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-mesh-decals-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/decal-actors-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Pick a prop that does not use Nanite and has a curved part, for example a pipe or a barrel. A Cylinder made in Modeling Mode works. Make a copy and name it SM_Decal_Base."
      - "In Modeling Mode, create a thin strip mesh that follows the curved surface closely, such as a bent plane a few units above the surface. Give its edges a small soft border. Name it SM_Decal_Strip."
      - "Make a material named M_MeshDecal with Material Domain set to Deferred Decal and Blend Mode set to Translucent. Use a rust or grime texture with a soft alpha. If you have none, use any texture for the color, such as T_GridChecker_A of the template, and a soft gradient, such as a RadialGradientExponential node, for the Opacity. Apply the material to SM_Decal_Strip."
      - "Place the strip on the prop. Move the camera far away and check if the strip cuts into the base mesh."
      - "If it cuts in, do not move the mesh. Add a small World Position Offset along the normal in M_MeshDecal, which pushes the strip slightly outward, and compare the result."
      - "Place a normal Decal Actor with the same texture on the same curved part. Look at both from a low angle and compare how much each one stretches."
    done_when: "Send two screenshots: one of the mesh decal wrapped around the curved prop, and one of the same texture as a projected Decal Actor for comparison. Add one line that says which one stretched."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Why are projected Deferred Decal Actors a poor fit for a curved pipe?"
        choices: ["They cannot use normal maps, so the bolts on a pipe would look flat in any kind of light", "They only work on landscapes and on flat floors that are aligned with the world axes", "They rely on projection, so details shear and distort when not aligned with the surface", "They cannot be rotated to follow the pipe"]
        answer_index: 2
        explain: "Mesh Decals use their own geometry and custom UVs, so they can wrap around edges and along splines."
      - q: "Compared with a masked material, what do Mesh Decals trade?"
        choices: ["No EarlyZ cost and soft transitions, but no shadows and no proper occlusion", "Shadows for speed: they cast and receive shadows but cost a full extra pass", "Fewer materials in exchange for more draw calls, and shadows on every decal mesh", "Nothing, they are the same in cost and in looks"]
        answer_index: 0
        explain: "They do not write depth. They update the GBuffer or DBuffer after opaque geometry."
      - q: "How closely must the decal geometry match the base surface?"
        choices: ["Exactly, vertex by vertex, because any gap between the two surfaces shows as a dark line", "It must be inside the base mesh, by a few units, so that the depth test hides its edges", "It must be at least 10 units away from the surface, or the two meshes flicker in the distance", "It should hug the surface but need not match closely; a small depth bias is already applied"]
        answer_index: 3
        explain: "The geometry only needs to stay in front of the surface. Feathered edges give soft transitions."
      - q: "At long view distances the decal strip intersects the base mesh. What does the page suggest?"
        choices: ["Increase the texture size of the decal, so that the edge is sharper far away from the camera", "Push the geometry out with a small World Position Offset in the material, or change the mesh", "Switch to a masked material, which has no depth problems at any distance from the camera at all", "Disable Lumen for the decal mesh"]
        answer_index: 1
        explain: "There is no easily adjustable depth bias, so the offset comes from the mesh or from WPO."
      - q: "You enable Nanite on SM_Decal_Base and add a mesh decal to it. What happens?"
        choices: ["It works the same as on a mesh without Nanite, with no change", "The decal becomes opaque, because Nanite replaces its material with a default one", "Nanite meshes do not support Mesh Decals, because they need a Translucent blend mode", "The decal gets shadows, because Nanite meshes always cast them"]
        answer_index: 2
        explain: "Nanite meshes can still receive projected decals, but not Mesh Decals."
      - q: "Which of these is a listed limitation of Mesh Decals?"
        choices: ["There is no artist-specified sort order", "They cannot use textures", "They cost one draw call per pixel", "They only work in the Material Editor preview"]
        answer_index: 0
        explain: "Other listed limits: no Material Editor preview, no tangent space support and no adjustable depth bias."
      - q: "Why can Mesh Decals produce fewer draw calls than large Deferred Decals?"
        choices: ["They use instancing, so all decals of a level are drawn in one call", "They share one material with the base mesh, so no extra call is needed", "They skip the GBuffer and are drawn in one pass together with the translucent meshes", "Large Deferred Decals often need front and back facing draw calls; mesh decals do not"]
        answer_index: 3
        explain: "Flat back-facing decals also cover 0 pixels, which makes them faster."
      - q: "Many mesh decal layers overlap on one prop. What does the page advise?"
        choices: ["Merge all of them into one single mesh", "Sort them by depth to avoid artifacts", "Use only one layer per prop", "Enable Parallel Rendering"]
        answer_index: 1
        explain: "The notes say to sort by depth when there are many overlapping layers."
    flavors:
      _default: {why: "Mesh decals add wrapped detail like rust bands and trims without the stretching of projected decals."}
      lookdev: {why: "Soft-edged, normal-mapped detail on curved props is hard any other way.", do: "Try a normal map in the mesh decal and check it from three angles."}
      level_design: {why: "Wrapped markings can follow pipes and rails to guide the player.", do: "Make one decal strip that follows a spline mesh."}

  - id: EAQ97
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [merge-actors, modular-kit, nanite, optimization]
    required_spine: false
    required: false
    title: Bake a kit corner with Merge Actors
    brief: "Every separate mesh in a level costs the computer some work to draw, and each such job is called a draw call. When a group of pieces is finished and will not change again, you can use Merge Actors to combine them and lower that cost. The tool has several methods: Merge makes one mesh, Batch groups identical meshes into instances, and Approximate builds a new simple mesh for use at a distance. In this quest you try all three on a building corner and compare the results."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/merging-actors-in-unreal-engine"
    backup_url: null
    extra_urls: []
    checklist:
      - "Open any project, or create one from the Third Person template. Build a small corner of a building from 8 to 12 kit pieces, such as walls, a pillar and trims. If you have no kit, make the pieces from boxes in Modeling Mode. Use at least two materials and include one piece with Nanite enabled. Use the same pillar mesh three times."
      - "Select all pieces. Open Actor, then Merge Actors, then Merge Actor Settings. With the Merge method selected, turn off Pivot Point at Zero, turn on Generate Nanite Enabled Mesh, and keep Merge Materials off. Run the Merge and save the result as SM_Corner_Merge."
      - "Open SM_Corner_Merge and count its material sections. Compare that number with the number of materials you used."
      - "Undo the merge or place the pieces again. Select only the three identical pillars and run Batch. Look at the result in the Outliner."
      - "Select the whole corner again and run Approximate. Save the result as SM_Corner_Approx. Open it and compare its triangle count and materials with SM_Corner_Merge."
      - "Place the original pieces, SM_Corner_Merge and SM_Corner_Approx side by side. Compare them from close up and from far away."
    done_when: "Send a screenshot of the three versions side by side. Add a short note with the number of sections in SM_Corner_Merge, what Batch produced, and which version you would use at a distance."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "With the default Merge method, how many draw calls does the merged mesh use?"
        choices: ["One, whatever the number of materials is", "One per material, because each material becomes one mesh section", "One per source actor, because each actor keeps its own section", "One per LOD of the merged mesh, for each material"]
        answer_index: 1
        explain: "Merge keeps one section per material and preserves the UVs."
      - q: "You turn on Merge Materials. What do you gain and lose?"
        choices: ["More sections but better lighting on the merged mesh, and the UVs are kept", "A smaller file on disk but no collision at all, and the UVs are kept", "Better occlusion culling, but far more draw calls than before", "A single section and draw call, but the UVs are not preserved"]
        answer_index: 3
        explain: "A single material is baked for the whole mesh with a new UV layout."
      - q: "Which LOD does Simplify use from each source mesh?"
        choices: ["The lowest-detail LOD of each mesh", "LOD0 only, of each mesh", "The LOD that you select per mesh", "All LODs stacked together"]
        answer_index: 0
        explain: "Simplify builds one proxy mesh with one draw call and one baked material."
      - q: "What does the Batch method create?"
        choices: ["One proxy mesh with a single baked material, made from the simplified source meshes", "A Packed Level Actor that holds the meshes as one Blueprint, with one new merged material", "Instanced Static Mesh components from identical meshes, keeping UVs and occlusion behavior", "A merged material atlas that all of the source actors then share, with no change to the meshes"]
        answer_index: 2
        explain: "Batch is for repeated identical pieces. It does not bake anything."
      - q: "When would you pick Approximate instead of Simplify?"
        choices: ["When you want to keep every material and every UV channel of the source meshes as it is", "When the sources are very complex, for example Nanite meshes, where Simplify would fail", "When you need instancing of identical meshes, with the UVs of the sources kept as they are in the proxy", "When the pieces are all the same"]
        answer_index: 1
        explain: "Approximate is new in UE5 and handles sources that break Simplify's simplification or texture baking."
      - q: "Pivot Point at Zero is disabled. Where is the merged actor's pivot?"
        choices: ["At the level origin, at 0,0,0", "At the center of the bounds of all the selected actors", "At the lowest Z of all of the selected actors, below the center", "At the pivot of the first Static Mesh Actor you selected"]
        answer_index: 3
        explain: "Enable Pivot Point at Zero to put the pivot at (0,0,0) instead."
      - q: "Merge Materials is grayed out. What is the likely reason?"
        choices: ["LOD Selection Type is set to Use all LOD levels", "The meshes have no collision set up", "Nanite is enabled on one of the selected meshes", "Too many actors are selected for a single merge"]
        answer_index: 0
        explain: "You cannot merge materials for multiple meshes while using all LOD levels."
      - q: "What is Gutter Size for in a baked merged material?"
        choices: ["The border of the mesh collision, so that the player does not get stuck on the seams of the pieces", "The distance between actors that are merged, below which two actors are welded into a single piece", "Space in pixels between UV islands so colors do not bleed when mipmaps downsample", "The thickness in units of the walls of the proxy mesh, so that light does not leak"]
        answer_index: 2
        explain: "Without a gutter, island colors overlap at lower mips and show as artifacts."
    flavors:
      _default: {why: "Merging a finished kit assembly cuts draw calls for pieces that never change again."}
      tech_art: {why: "Merge, Batch and Approximate are the base of HLOD-style optimization.", do: "Run Simplify on the corner too and note where it fails or looks wrong."}
      level_design: {why: "Baked corners are quick to place many times.", do: "Place the merged corner four times and compare stat unit with the loose pieces."}

  - id: EAQ98
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [modular-kit, grid-snapping, sockets, props]
    required_spine: false
    required: false
    title: Modular kit on the grid
    brief: "A modular kit is a set of pieces, such as walls, floors and corners, that are all built to the same grid sizes. Because the sizes match, the pieces snap together without gaps, and a level designer can build rooms very quickly. A socket is a named point on a mesh where other things, such as a lamp, can be attached. In this quest you make three kit pieces, build a closed room with grid snapping, and add a socket for lamps."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-snapping-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-sockets-with-static-meshes-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, and work in any level with a floor. In Modeling Mode, make three kit pieces with sizes that fit a grid of 100: SM_Kit_Wall (400 long, 20 thick and 400 high), SM_Kit_Corner (20 x 20 and 400 high) and SM_Kit_Floor (400 x 400 and 20 thick). Use Edit Pivot to set the pivot of each piece to a bottom back corner."
      - "Open Edit > Editor Preferences, then Viewports, then Snap. Enable Use Power of Two Snap Size and note how the Drag Grid dropdown in the viewport toolbar changes. Then turn it off again, because this kit is built on a grid of 100."
      - "Turn on the Drag Grid and the Rotation Grid in the viewport toolbar. Set the drag grid to 100 and the rotation to 90. Build a closed room from at least 12 pieces."
      - "Hold V while you drag one wall so that its pivot snaps to a vertex, a corner point, of the wall next to it. Look at the seam from close up."
      - "Open SM_Kit_Wall in the Static Mesh Editor and open Window > Socket Manager. Create a socket named Lamp and set its Relative Location to the center of the wall at head height."
      - "In the level, place a Point Light and right-click it. Choose Attach To, pick SM_Kit_Wall and then the Lamp socket. Reset the Location of the light so it snaps to the socket. Repeat this on two more walls."
    done_when: "Send a screenshot of the closed room with the grid snapping settings visible in the toolbar, and a screenshot of the Socket Manager with the Lamp socket. Add one line with your grid sizes."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "The translation snap is set to 10. What does that mean when you move a wall?"
        choices: ["The wall rotates in 10 degree steps", "The wall scales by 10 percent", "The wall moves only in 10 unit steps", "The wall snaps to the nearest surface within 10 units"]
        answer_index: 2
        explain: "Grid snapping moves, rotates or scales in fixed increments per grid."
      - q: "Where do you change the list of grid sizes shown in the viewport toolbar?"
        choices: ["Edit > Editor Preferences > Viewports, in the Snap category", "World Settings, in the World category", "Edit > Project Settings > Rendering, in the Editor category", "The Static Mesh Editor, in the viewport options under Grid Settings"]
        answer_index: 0
        explain: "Decimal Grid Sizes, Pow 2 Grid Sizes and the rotation lists live there."
      - q: "What does Use Power of Two Snap Size change?"
        choices: ["Rotation snaps in steps of 2, 4, 8, 16 and 32 degrees instead of 5 or 10", "Scaling becomes multiplicative, so each step doubles or halves the size of the actor", "Surface Offset doubles each time you snap an actor to a surface in the level", "Grid sizes become 1, 2, 4, 8, 16 and so on instead of decimal sizes"]
        answer_index: 3
        explain: "Power-of-two grids match kit pieces built on 2-based sizes."
      - q: "How many separate snapping grids does the editor use for transforms?"
        choices: ["One shared grid for move, rotate and scale", "Three: Drag Grid, Rotation Grid and Scale Grid", "Two: one grid to move and one grid to rotate", "One per viewport, four in all"]
        answer_index: 1
        explain: "Each grid has its own toolbar button and increment dropdown."
      - q: "How do you snap one mesh to a vertex of another mesh?"
        choices: ["Hold V while dragging with the translate gizmo", "Press End with the mesh selected, which drops it", "Enable Surface Snapping in the toolbar", "Hold Ctrl and click the vertex on the other mesh"]
        answer_index: 0
        explain: "Vertex snapping works best together with a pivot placed on a corner vertex."
      - q: "Where does a new socket appear when you create it?"
        choices: ["At the top of the mesh bounds", "At the camera position", "At the origin of the Static Mesh", "At the last clicked vertex"]
        answer_index: 2
        explain: "Move it with the widget or type a Relative Location in the Socket Manager."
      - q: "You attached a light to a socket but it did not move to the socket. What is missing?"
        choices: ["Saving the mesh after adding the socket to it", "Collision on the wall that the socket mesh is placed on", "A second socket on the light, to match the first", "Resetting the light's Location in its Transform to 0,0,0"]
        answer_index: 3
        explain: "After attaching, the location is relative to the parent. Reset it and the light snaps to the socket."
      - q: "Where are sockets created for a Static Mesh?"
        choices: ["In the Level Blueprint, with an Add Socket node on Begin Play", "In the Static Mesh Editor, Window > Socket Manager", "In the Outliner, by a right-click on the actor and Add Socket", "In the Details panel of the placed actor, under Sockets"]
        answer_index: 1
        explain: "The Socket Manager lets you create, rename and position sockets on the asset."
    flavors:
      _default: {why: "A kit that snaps on a grid, with sockets for add-ons, is what makes level building fast for everyone."}
      level_design: {why: "You will build with kits others made; know the grid rules.", do: "Write the grid size and pivot rule for your kit in one line a novice can follow."}
      tech_art: {why: "Pivot and grid conventions are tool rules.", do: "Check the pivot of all three pieces with Edit Pivot and fix any that are off-grid."}

  - id: EAQ99
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [trim-sheet, uvs, modeling-mode, texturing]
    required_spine: false
    required: false
    title: Trim sheet UVs in Modeling Mode
    brief: "A trim sheet is one texture that holds several horizontal strips, such as a metal band, a wood plank and a stone edge. You texture a mesh by moving its UV islands, the flat pieces of its surface map, onto the strip each part should use. This way one texture can cover a whole kit of pieces. In this quest you place the UV islands of a kit piece onto the strips of a trim sheet with the UV tools in Modeling Mode."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/uvs-category-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-uv-channels-with-static-meshes-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Get or paint a trim sheet texture named T_Trim, with horizontal strips such as a metal band, a wood plank and a stone moulding. For a first test, an image with three horizontal strips in different colors, made in any image editor, is enough. Make a material named M_Trim from it, and also prepare a checkerboard material for testing."
      - "Take a kit piece with a flat face and a trim edge. If you have none, make a wall in Modeling Mode: a Box that is 400 long, 20 thick and 400 high. In Modeling Mode, open UVs, then Project. Choose Plane, use Auto Fit and accept. Set Preview Material to Checkerboard."
      - "Open UVs, then XFormUV. Scale and move each island so that the main face sits on the stone strip of T_Trim and the trim edge sits on the metal strip. Hold Shift to move several islands together."
      - "Open UVs, then Layout. Set Layout Type to Stack for islands that should share the same strip. Set Layout Type to Transform when you need to scale or move all UVs together."
      - "Assign M_Trim and check the mesh in the level. If an island looks stretched, fix it with Unwrap."
      - "Open the Static Mesh Editor and look at the list of UV channels. Note which channel holds your trim UVs."
    done_when: "Send a screenshot of the textured kit piece in the level, and a screenshot of the Preview UV Layout panel that shows the islands on the strips. Add one line that says which Layout Type you used and why."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Two islands should use the same strip of the trim sheet. Which Layout Type is made for this?"
        choices: ["Repack, which packs all islands into the 0 to 1 space without any overlap between two islands", "Stack, which packs islands individually with overlap for islands that share the same texturing", "Transform, which moves each island on top of all the other islands that have the same shape", "Unwrap"]
        answer_index: 1
        explain: "Stack scales and moves each island into the unit square and allows overlap."
      - q: "What does the Transform layout type do?"
        choices: ["It repacks without overlap, and changes the scale of each island to fit", "It only moves the islands you selected and leaves all the others in place", "It creates seams along the edges that you select", "It scales and translates all UVs together, keeping the current layout"]
        answer_index: 3
        explain: "Transform ignores island selection and keeps the arrangement."
      - q: "Which Project type does the page suggest for a flat wall piece?"
        choices: ["Plane", "Cylinder", "Box", "ExpMap"]
        answer_index: 0
        explain: "Plane suits flat assets like a mirror or wall. Box suits crates, Cylinder suits round shapes."
      - q: "In XFormUV, how do you adjust several islands at once?"
        choices: ["Double-click an island", "Enable Uniform Dimensions", "Hold the Shift key", "Press Enter"]
        answer_index: 2
        explain: "XFormUV works per island; Shift adds islands to the adjustment."
      - q: "Which AutoUV method is the built-in default and supports large models such as Nanite?"
        choices: ["XAtlas", "Patch Builder", "UV Atlas, with charts", "Conformal"]
        answer_index: 1
        explain: "UV Atlas is for organic shapes and XAtlas is designed for light maps and mechanical meshes."
      - q: "You cut a seam with SeamEd and want to merge it again. What do you need?"
        choices: ["The Unwrap tool in Modeling Mode", "The Layout tool", "A second UV channel on the mesh", "The Sew tool in the UV Editor"]
        answer_index: 3
        explain: "The level UV tools cannot merge edges. The page also notes SeamEd does not support multiple UV channels."
      - q: "Where must UDIMs be created and managed?"
        choices: ["In the UV Editor", "In the Layout tool", "In the Static Mesh Editor", "In the Material Editor"]
        answer_index: 0
        explain: "The in-level UV tools do not manage UDIMs."
      - q: "Repack has an option that saves space but can cause problems later. Which one?"
        choices: ["Preserve UDIMs", "Island Merging", "Allow Flips", "Uniform Dimensions"]
        answer_index: 2
        explain: "Flipped islands pack tighter but can break downstream operations."
    flavors:
      _default: {why: "One trim sheet can texture a whole kit. Placing islands on strips is the core skill."}
      lookdev: {why: "Trim sheets keep texel density even across many props.", do: "Compare checkerboard density on two kit pieces and match them with XFormUV."}
      tech_art: {why: "UV rules for kits are part of your pipeline.", do: "Write which UV channel the trim UVs use and which channel is free for lightmaps or paint."}

  - id: EAQ100
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [post-process, color-management, opencolorio]
    required_spine: false
    required: false
    title: OCIO in the viewport
    brief: "OpenColorIO, or OCIO, is a standard system for managing color that many film and effects programs share. It makes sure the same picture shows the same colors in Unreal, in other programs and on the final screen. In Unreal you set it up with an OpenColorIO Configuration asset, and you can then view the viewport through it. In this quest you create that asset with two color spaces and turn the OCIO display on in the viewport."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/opencolorio-quick-start-for-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/color-management-with-opencolorio-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/apply-color-conversion-to-the-level-viewport-and-play-in-editor-with-opencolorio-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, and open any lit level. Check that the OpenColorIO plugin is enabled. It is on by default in new projects."
      - "In the Content Browser, right-click and choose Miscellaneous, then OpenColorIO Configuration. Name the asset OCIO_Scene."
      - "Open OCIO_Scene. Keep the Configuration File at ocio://default, which is the built-in ACES CG config."
      - "Under Desired Color Spaces, add only two entries: a linear sRGB source and an sRGB monitor display view."
      - "In the Level Viewport, open View Mode, then OCIO Display. Pick OCIO_Scene, set the source and the destination, and then click Enable Display."
      - "Turn Enable Display on and off and compare the tone of your scene. Note what changed in the highlights, the brightest parts of the image."
      - "This step is optional. In a camera Blueprint, add a Create In-Game OpenColorIO Display Extension node on BeginPlay and test it while playing in the editor."
    done_when: "Send two screenshots of the same view, one with OCIO Display off and one with it on. Also send a screenshot of OCIO_Scene that shows its Configuration File and its Desired Color Spaces list."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Where do you create an OpenColorIO Configuration Asset?"
        choices: ["Content Browser right-click > Miscellaneous > OpenColorIO Configuration", "Project Settings > Rendering > Color", "Window > Color Management > New OpenColorIO Configuration Asset, then save it", "Edit > Plugins > OpenColorIO (OCIO) > New Configuration Asset, then restart"]
        answer_index: 0
        explain: "The Quick Start creates the asset from the Content Browser context menu under Miscellaneous."
      - q: "Which string uses the built-in default ACES CG config, with no external file?"
        choices: ["file://Engine/OCIO/default.ocio", "ocio://default", "aces://cg", "config://aces-1.3"]
        answer_index: 1
        explain: "Built-in configs use ocio:// paths. ocio://default is the default ACES CG config and needs no external file."
      - q: "You have a custom .ocio file. Why can you not import it with the Content Drawer?"
        choices: ["The file is too large for the importer, which only reads text files below one megabyte, so you have to split the file into parts first", "Only .ocioz files are allowed in the Content Drawer, so you compress the file first and then drag the archive into the project", "Unreal does not recognize .ocio files as assets, so you copy them into the Content folder with the file explorer", "Import is blocked until the OpenColorIO plugin is restarted, which happens only when the editor is closed and opened"]
        answer_index: 2
        explain: "UE does not automatically recognize .ocio or .ocioz files. You add them to the Content folder with your computer's file explorer."
      - q: "What is an .ocioz file?"
        choices: ["A LUT texture in a special format that only OpenColorIO can read", "A Blueprint that stores the color spaces and their display names", "An old OCIO v1 config that must be converted before it can be used", "A compressed archive of a config file and its LUT texture folder"]
        answer_index: 3
        explain: "The plugin supports .ocioz archives, which compress a config file and its LUT folder into one archive."
      - q: "Why should you add only the color spaces you actually need to the Desired Color Spaces list?"
        choices: ["Extra entries cause a compile error", "The list is limited to two entries", "Unused entries slow down the tonemapper pass", "It keeps the configuration asset lightweight"]
        answer_index: 3
        explain: "The page says to set up only the color profiles you need, so the configuration asset stays as lightweight as possible."
      - q: "How do you apply OCIO to the Level Viewport?"
