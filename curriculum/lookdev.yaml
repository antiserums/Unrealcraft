        explain: "You can open the UV Editor from the UV category in Modeling Mode, by right-clicking a mesh in the level, or right-clicking it in the Content Browser."
      - q: "What does the Sew tool do?"
        choices: ["It splits an island in two", "It connects two corresponding edges into one island", "It scales all UVs to 0-1", "It bakes lighting into the UVs"]
