    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/landscape-materials-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-nanite-with-landscapes-in-unreal-engine"
    checklist:
      - "Open your landscape material. Add a Landscape Visibility Mask node and connect it to Opacity Mask. Keep Blend Mode set to Opaque (the pin looks greyed out; connect it anyway)."
      - "Check the Visibility tool panel under Target Layers shows no warning about a missing Visibility Mask node."
      - "In Landscape Mode > Sculpt, pick the Visibility tool. Set a brush size for a cave mouth and Left-click on a hillside to paint a hole."
      - "Shift + Left-click to erase part of the hole and shape the entrance."
      - "Build a cave interior from a few Static Meshes (rock kit or Modeling Mode) and fit them into the hole so no sky shows through."
      - "Switch to Place mode and Play In Editor. Walk through the hole into the cave and confirm collision is gone where you painted."
      - "If the landscape has Enable Nanite on, click Build Data in the Nanite section and check the hole is still correct."
    done_when: "One screenshot from outside showing the cave mouth in the landscape and one PIE screenshot from inside the cave looking out."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the Visibility tool for?"
        choices: ["Hiding the landscape actor in game", "Controlling landscape LOD distance", "Fading the landscape at the world edge", "Masking out parts of the landscape to make holes for tunnels or caves"]
        answer_index: 3
        explain: "The Visibility tool masks out parts of the landscape so you can build caves and tunnels with static meshes, working around the 2D heightmap limit."
      - q: "What must be in the landscape material before the Visibility tool works properly?"
        choices: ["A Landscape Layer Coords node", "A Landscape Visibility Mask node connected to Opacity Mask", "A Landscape Grass Output", "A Static Switch parameter"]
        answer_index: 1
        explain: "The material needs a Landscape Visibility Mask node. Without it, the Visibility tool panel shows a warning under Target Layers."
      - q: "Which controls paint and erase a hole?"
        choices: ["Left-click paints a hole; Shift + Left-click makes it visible again", "Right-click paints; Left-click erases", "Ctrl + click paints; Alt + click erases", "Left-click paints; Ctrl + Shift + click erases"]
        answer_index: 0
        explain: "Left-click adds the visibility mask (invisible). Shift + Left-click removes the mask and makes the components visible again."
      - q: "Can you paint a soft, half-transparent edge on a hole?"
        choices: ["Yes, with brush falloff", "Yes, by lowering Tool Strength", "No, the mask is only visible or invisible, with no gradient", "Only on Nanite landscapes"]
        answer_index: 2
        explain: "When painting masked areas you only get a visible or invisible state. There is no gradient from fully masked to unmasked."
      - q: "Why should the landscape material's Blend Mode stay Opaque even though the Opacity Mask is connected?"
        choices: ["Masked mode is not allowed on landscapes", "The landscape overrides to a masked material only on components that have visibility data, so the cost stays local", "Opaque makes holes render faster on mobile", "The Opacity Mask pin does nothing on landscapes"]
        answer_index: 1
        explain: "The landscape detects components with visibility data and overrides the blend mode only there. Leaving the whole material Masked would cost more everywhere."
      - q: "What is the status of the Landscape Hole Material approach?"
        choices: ["It is the recommended method", "It only works with Nanite", "It is required for collision holes", "It is a legacy feature, more costly, and Epic recommends switching to the Visibility Mask node"]
        answer_index: 3
        explain: "A Landscape Hole Material can still paint away visibility, but it is legacy and more costly to render. The Visibility Mask node is preferred."
      - q: "You painted a hole but in PIE you still bump into an invisible wall. What does the documentation suggest?"
        choices: ["Rebuild lighting", "Delete the layer info objects", "Change from Landscape mode to Place mode before testing in PIE", "Turn off Nanite"]
        answer_index: 2
        explain: "To test the collision of a new hole in PIE, you may need to switch from Landscape mode to Place mode."
      - q: "On a Nanite landscape, what is the cost of visibility in the landscape material?"
        choices: ["No extra cost in the material; the Nanite renderer keeps using the fast opaque path", "Double, because two meshes are rendered", "It forces the material to Masked everywhere", "Nanite landscapes cannot have holes"]
        answer_index: 0
        explain: "When a Nanite landscape mesh is generated there is no cost in the material, because the Nanite renderer keeps using the hardware rasterizer as with any opaque material."
    flavors:
      _default: {why: "Caves and tunnels are the only way past the heightmap's one-height-per-point limit."}
      level_design: {why: "An underground route adds a whole layer to a map without a second level.", do: "Make the cave a shortcut between two points on your main route and time both paths."}
