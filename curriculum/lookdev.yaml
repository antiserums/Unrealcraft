        choices: ["Set Roughness to 1 on the floor material, because Planar Reflections are only drawn on surfaces that are fully rough", "Enable Support global clip plane for Planar Reflections in Project Settings and restart the editor", "Set the Reflection Method to Screen Space in Project Settings, then build the lighting of the level", "Build lighting for the level, because a Planar Reflection Actor is baked like a Reflection Capture and is empty until then"]
        answer_index: 1
        explain: "Planar Reflections need the project setting Support global clip plane for Planar Reflections. Without a restart after enabling it, they do not work."
      - q: "A large sphere capture and a small sphere capture overlap. Which one is used?"
