  - id: EAQ52
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [post-process, post-process-volume, lookdev]
    required_spine: false
    required: false
    title: Global and local Post Process Volumes
    brief: "A Post Process Volume is a box that changes how the final picture looks, for example its colors, brightness and blur. A common setup is one global volume that gives the whole level its basic look, plus small local volumes that change the look in special places. In this quest you set up one global and one local volume and learn how Priority, Blend Radius and Blend Weight decide which one you see."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/add-post-process-volumes"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a small level that has two rooms or two clearly different areas. The level of the template is fine."
      - "Place a Post Process Volume and name it PPV_Global. In Post Process Volume Settings, turn on Infinite Extent (Unbound) so it affects the whole level, and keep Priority at 0."
      - "Place a second Post Process Volume around one room and name it PPV_Room. Leave Infinite Extent off and set Priority to 100."
      - "In PPV_Room, override one setting that is easy to see. For example, open Color Grading, then Global, and set Saturation to 0.2."
      - "Set Blend Radius on PPV_Room to 0. Play from the viewport and walk in and out of the room. Then set Blend Radius to 1000, walk again, and note the difference."
      - "Set Blend Weight on PPV_Room to 0.5 and look at the room again."
      - "Open Project Settings, then Rendering, then Default Settings, and find where the post process defaults for the whole project are stored. Do not change them."
    done_when: "Send two screenshots taken from the same spot at the edge of PPV_Room: one with Blend Radius 0 and one with Blend Radius 1000. Also show the Details panel of PPV_Room with Priority, Blend Radius and Blend Weight visible."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Two Post Process Volumes overlap. Which one wins?"
        choices: ["The one with the highest Priority", "The one placed first in the level", "The larger one", "The one closest to the player"]
        answer_index: 0
        explain: "With overlapping volumes, the highest Priority overrides the lower ones. If two have the same priority, the order is undefined."
      - q: "What does Infinite Extent (Unbound) do?"
        choices: ["It makes the volume grow slowly over time until it fills the scene", "It makes the volume affect the whole scene, ignoring its bounds", "It disables the volume until the camera is inside its bounds once more", "It doubles the Blend Radius of the volume it is on"]
        answer_index: 1
        explain: "With Infinite Extent on, the volume affects the entire scene no matter its size. Off, it only affects the area inside its bounds."
      - q: "What is Blend Radius?"
        choices: ["The size of the bloom effect around bright pixels while the camera is in the volume", "The distance (in world units) that a light can reach when it is inside the volume", "A transition area (in world units) around the volume where the look blends in", "The radius of the ambient occlusion that is drawn in the corners inside the volume"]
        answer_index: 2
        explain: "Blend Radius is a distance around the volume used for blending. It creates a transition zone so the look changes gradually when you walk in."
      - q: "You set Blend Weight to 0 on a volume. What happens?"
        choices: ["The volume has full effect", "The volume has no effect", "The volume becomes unbound", "The volume gets the highest priority"]
        answer_index: 1
        explain: "Blend Weight is the amount of influence the volume has. 1 is full effect, 0 is no effect."
      - q: "There is no Post Process Volume in the level at all. Where do the default post process settings come from?"
        choices: ["Nowhere; the level has no post processing at all", "The Directional Light that is in the level", "The Sky Light of the level, from its captured cubemap", "Project Settings > Rendering > Default Settings"]
        answer_index: 3
        explain: "The engine always uses some default post process settings. They live in Project Settings under Rendering > Default Settings."
      - q: "The tutorial suggests choosing Priority values like 0, 100, 200 instead of 0, 1, 2. Why?"
        choices: ["Higher numbers render faster, because volumes are sorted from the largest value down", "It leaves room to insert or remove volumes later without renumbering the others", "Priorities below 10 are ignored by the engine in all levels", "Blend Radius only works when the Priority of the volume is a large round number"]
        answer_index: 1
        explain: "A wide gap between values lets you add a new volume between existing ones without updating every priority."
    flavors:
      _default: {why: "One global volume plus small local volumes is how a level gets a base look and special moments."}
      lookdev: {why: "Every grade and exposure choice you make later lives in these volumes, so their priority and blending must be clean.", do: "Add a third small volume with Priority 200 inside the room and give it a different Saturation."}
      level_design: {why: "Local volumes can mark a special area (a shrine, a danger zone) without changing any asset."}
      cinematics: {why: "Cine cameras have their own post process layer that blends on top of these volumes."}

  - id: EAQ53
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [exposure, auto-exposure, cine-camera, lookdev]
    required_spine: false
    required: false
    title: Exposure, three ways
    brief: "Exposure is how bright the camera makes the picture. By default Unreal uses auto exposure, which changes the brightness slowly as you move between dark and bright places, like human eyes do. You can also set exposure by hand with real camera values. In this quest you try three ways to control exposure: auto exposure, manual exposure on a camera, and Local Exposure, which adjusts bright and dark areas of the same picture separately."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/auto-exposure-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-cameras-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a level that has a dark interior and a bright exterior. If you do not have one, build a closed box from cubes with one open door in a new Basic level."
      - "Place a Post Process Volume and turn on Infinite Extent (Unbound), or use the global volume your level already has. In it, open Lens, then Exposure, and set Metering Mode to Auto Exposure Histogram. In the viewport, turn on Show > Visualize > HDR (Eye Adaptation) and watch the graph as you move from dark to bright."
      - "Override Speed Up and Speed Down. Try Speed Up 10 with Speed Down 1, and then the reverse. Note which one feels more like real eyes."
      - "Override Exposure Compensation. Try -1 and then +1, and note what happens to the image."
      - "Place a Cine Camera Actor and pilot it with Ctrl+Shift+P, which means you look through it. In the camera's own post process settings, set Metering Mode to Manual and turn on Apply Physical Camera Exposure."
      - "Set ISO, Shutter Speed and Aperture on the camera until the interior looks right. Write the three values down."
      - "Turn on Local Exposure in the volume. Use Show > Visualization > Local Exposure to see where it works."
    done_when: "Send three screenshots taken from the doorway: one with histogram auto exposure and the HDR visualization turned on, one with manual physical camera exposure and the ISO, shutter and aperture values written in the caption, and one of the Local Exposure visualization."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which metering mode is the default in Unreal Engine?"
        choices: ["Manual", "Auto Exposure Basic", "Auto Exposure Histogram", "Physical Camera Exposure"]
        answer_index: 2
        explain: "Auto Exposure Histogram is the default. It builds a 64-bin histogram and gives finer control. Basic is faster but has fewer settings."
      - q: "You set Exposure Compensation to -1. What does the page say happens?"
        choices: ["The image becomes two times darker", "The image becomes two times brighter", "Auto exposure turns off", "Nothing, the value must be positive"]
        answer_index: 0
        explain: "Exposure Compensation is logarithmic. -1 is two times darker, -2 four times darker, +1 two times brighter."
      - q: "Min Brightness and Max Brightness are set to the same value. What happens?"
        choices: ["The scene turns black", "Auto exposure is disabled", "Local Exposure turns on", "The engine picks a new value automatically"]
        answer_index: 1
        explain: "If Min Brightness equals Max Brightness (or Min EV100 equals Max EV100), the camera cannot adapt, so auto exposure is disabled."
      - q: "Apply Physical Camera Exposure is turned on. Which statement is true?"
        choices: ["It affects all metering modes, and the scene is usually brighter", "It only affects Manual mode, and the scene is usually much darker", "It makes the scene brighter in every metering mode", "It disables the exposure settings of the Cine Camera"]
        answer_index: 1
        explain: "The toggle only affects Manual metering mode. With it on, ISO, Shutter Speed and Aperture control brightness, and most scenes get significantly darker."
      - q: "To mimic real eyes, which pair of values does the page recommend?"
        choices: ["Speed Up low, Speed Down high", "Speed Up and Speed Down both 0", "Speed Up high, Speed Down low", "Speed Up equal to Speed Down"]
        answer_index: 2
        explain: "Eyes adapt fast from dark to bright (Speed Up high) and slowly from bright to dark (Speed Down low)."
      - q: "When is Local Exposure most useful?"
        choices: ["In flat, evenly lit scenes, where it adds more contrast to the whole image", "Only on mobile devices, where the normal auto exposure is not supported at all", "When the tonemapper is turned off and the image is shown in linear color on an HDR display", "In high-contrast scenes, like a dark interior with a bright exterior visible through a door"]
        answer_index: 3
        explain: "Local Exposure applies local adjustments to keep both highlight and shadow detail. The page says to always set it up when using Lumen GI."
    flavors:
      _default: {why: "Exposure decides what the player sees before any color grade is applied."}
      lookdev: {why: "You cannot judge lighting or materials while exposure is drifting. Learn to control it.", do: "Add an Exposure Metering Mask texture that favors the screen center and compare stability."}
      cinematics: {why: "Manual physical camera exposure gives you the same ISO, shutter and f-stop language as a real set."}
      level_design: {why: "Exposure speed changes how a dark cave entrance feels to the player."}

  - id: EAQ54
