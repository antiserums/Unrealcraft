    brief: "A landscape is built from a heightmap, which stores only one height for each point on the ground. Because of this, a landscape alone cannot have a cave or a tunnel. The solution is to paint a hole in the landscape and build the cave from separate meshes behind it. In this quest you prepare your landscape material for holes, paint a cave mouth with the Visibility tool, and fit a cave interior into it."
