# Unrealcraft — Environment Art specialization, all ranks. IDs EAQ1…
# Difficulty tiers: novice (rank 0) · apprentice (1) · adept (2) · expert (3) · master (4).
# Every URL was checked against the live UE 5.8 docs when written.

quests:
  - id: EAQ36
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [lighting, directional-light, sky-atmosphere]
    required_spine: false
    required: false
    title: Sun and sky, the physical way
    brief: "Outdoor scenes in Unreal usually start with two actors: a Directional Light, which acts as the sun, and a Sky Atmosphere, which draws a sky that reacts to the sun. When the two are linked, moving the sun changes the color of the sky, just like in the real world. In this quest you build this sun and sky from an empty level, rotate the sun to sunset and noon, and add a second light as a moon."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/directional-lights-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/sky-atmosphere-component-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/sky-atmosphere-component-properties-in-unreal-engine"
    checklist:
      - "Make a new level and choose Empty Level. Then place a Directional Light and a Sky Atmosphere from the Place Actors panel."
      - "Select the Directional Light and enable Atmosphere Sun Light in its Details panel. This tells the sky to use this light as the sun. Check that Atmosphere Sun Light Index is 0."
      - "Hold Right Ctrl + L and move the mouse to rotate the sun. Find a low sun angle that looks like a sunset, and a high sun angle that looks like noon."
      - "On the Directional Light, turn on Use Temperature. Try a Temperature of 6500 K and then 3000 K, and note how the color of the light changes."
      - "Turn on Show > Shadow Frustum for the light. Look at the rays and notice that they are parallel, which is how sunlight behaves."
      - "Select the Sky Atmosphere and change Mie Scattering Scale up and down. Then set Mie Anisotropy to 0 and to 0.9 and watch the glow around the sun. Reset the values to their defaults when you are done."
      - "Add a second Directional Light and set its Atmosphere Sun Light Index to 1. Make it dim and blue so it works as a moon, and rotate it so it points the opposite way to the sun."
    done_when: "Send two screenshots of the same view: one at sunset with a low sun, and one at noon with a high sun. In one of them, the Details panel of the Directional Light must be visible with Atmosphere Sun Light enabled."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Why are all shadows from a Directional Light parallel?"
        choices: ["The light is simulated as a source that is infinitely far away", "The light has a Source Radius of zero", "The light uses lightmaps only", "The shadow frustum forces the rays to align"]
        answer_index: 0
        explain: "A Directional Light simulates a source infinitely far away, so its rays and shadows are parallel. That makes it the right choice for sunlight."
      - q: "The Source Angle of a Directional Light defaults to 0.5357. What is this number?"
        choices: ["The number of shadow cascades", "The angle our sun subtends in degrees", "The default Temperature divided by 100", "The Shadow Bias value"]
        answer_index: 1
        explain: "Source Angle is the angle subtended by the light source in degrees. The default 0.5357 is the angle of our sun."
      - q: "With Use Temperature enabled, which Temperature value gives white light?"
        choices: ["3000K", "1000K", "6500K", "10000K"]
        answer_index: 2
        explain: "The docs say Temperature is the color temperature in Kelvin of the blackbody illuminant, and white is 6500K."
      - q: "You want a sun and a moon, both affecting the atmosphere. How do you set the Atmosphere Sun Light Index?"
        choices: ["Both lights get index 0", "Sun 0 and moon 1", "Sun 1 and moon 2", "Only one light can affect the atmosphere"]
        answer_index: 1
        explain: "Two atmosphere lights are supported at any time. The primary (sun) is index 0 and the secondary (moon) is index 1."
      - q: "Which shortcut rotates the Directional Light with index 0 while you move the mouse?"
        choices: ["Ctrl + Shift + L", "Right Ctrl + L", "Alt + drag", "Right Ctrl + L + Shift"]
        answer_index: 1
        explain: "Right Ctrl + L with mouse movement adjusts the light at index 0 (the sun). Adding Shift adjusts the light at index 1 (the moon)."
      - q: "In the Sky Atmosphere, Mie Anisotropy is moved from 0.8 toward 0.9. What changes?"
        choices: ["Light scatters more uniformly, so the halo around the sun disappears", "The sky becomes bluer because of Rayleigh scattering", "Light scatters more forward, so the halo around the sun becomes tighter and brighter", "The planet radius grows"]
        answer_index: 2
        explain: "A value closer to 1 scatters light more forward. This makes a stronger, tighter halo around the light source. A value of 0 scatters uniformly."
    flavors:
      _default: {why: "A physically based sun and sky is the base of almost every outdoor scene."}
      level_design: {why: "Sun angle decides what the player can read at a distance.", do: "Save the two sun angles as viewport bookmarks so you can compare readability."}
      cinematics: {why: "Time of day is a story tool. Knowing the sun controls means fast iteration on a shot.", do: "Animate the sun rotation in a Level Sequence from sunset to noon."}

  - id: EAQ37
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [lighting, point-light, spot-light, rect-light]
    required_spine: false
    required: false
    title: Local lights up close
    brief: "Local lights are lights that sit at one place in the level and light only the area around them. Unreal has three kinds: the Point Light shines in all directions like a bulb, the Spot Light shines in a cone like a torch, and the Rect Light shines from a flat rectangle like a screen or a window. In this quest you build a small dark room and try the most important settings of each one."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/spot-lights-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/point-lights-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/rectangular-area-lights-in-unreal-engine"
    checklist:
      - "Build a small dark room with a floor and 3 walls, and put a few props inside. Set the Directional Light and the Sky Light to a very low brightness, or delete them, so the room is dark."
      - "Place a Point Light. Change Attenuation Radius, which is how far the light reaches, until the light stops at the walls. Then set Source Radius to 20 and look at the highlight on a smooth prop."
      - "Place a Spot Light and aim it at the floor. Set Inner Cone Angle to 20 and Outer Cone Angle to 40. Then try 35 and 40, and compare how soft the edge of the light is."
      - "Place a Rect Light that acts as a TV screen. Set Source Width to 100 and Source Height to 60. Rotate it so its X axis points into the room, because a Rect Light only shines along its X axis."
      - "On the Rect Light, try Barn Door Angle and Barn Door Length. Barn doors are flaps at the sides of the light, and you can use them to cut the light that spills onto the wall."
      - "Set the Mobility of the Rect Light to Movable, and then to Stationary. Note how the shape of the shadow changes between blocky and soft."
    done_when: "Send one screenshot of the room with all three lights turned on. The Details panel of the Spot Light must be visible and show your Inner Cone Angle and Outer Cone Angle values."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Where does a Spot Light have full brightness?"
        choices: ["Between the inner and outer cone", "Inside the Inner Cone Angle", "Only at the Attenuation Radius", "Outside the Outer Cone Angle"]
        answer_index: 1
        explain: "Inside the Inner Cone Angle the light is at full brightness. From the inner cone to the Outer Cone Angle the light falls off, which makes the soft edge."
      - q: "A Point Light has Use Inverse Squared Falloff enabled. What does Attenuation Radius do then?"
        choices: ["It only clamps the light's contribution", "It sets the radius of the light source shape", "It controls the specular highlight size", "It is ignored completely"]
        answer_index: 0
        explain: "With physically based inverse squared falloff, Attenuation Radius only clamps where the light stops. The falloff itself comes from distance."
      - q: "What are Source Radius and Source Length on a Point Light used for?"
        choices: ["Changing the attenuation distance", "Deciding the lightmap resolution", "Giving the light a shape in reflections and specular highlights", "Setting the shadow bias"]
        answer_index: 2
        explain: "The light still emits from one point, but Unreal uses a radius and length for reflections and specular highlights so the light feels more physical."
      - q: "In which direction does a Rect Light emit light?"
        choices: ["In all directions like a Point Light", "Along its local Z axis (up)", "Along its positive local X axis, inside its sphere of attenuation", "Only along the Barn Door direction"]
        answer_index: 2
        explain: "A Rect Light emits within its attenuation sphere only in the positive local X direction, like a Spot Light with a 180 degree cone. Width is along Y and Height along Z."
      - q: "A Rect Light is set to Movable. What do Source Width and Source Height affect?"
        choices: ["The shadow softness from every point of the rectangle", "Only the specular reflections; the light itself is emitted from the center like a Point Light", "The lightmap samples across the rectangle", "Nothing at all until lighting is built"]
        answer_index: 1
        explain: "For Movable Rect Lights the width and height are only used for specular reflections. The light is emitted from the center, so shadows are sharp like a Point Light."
      - q: "You make a Rect Light twice as big but keep Intensity the same. What happens?"
        choices: ["It looks brighter because it is larger", "It looks dimmer because Intensity is averaged over the surface area", "Nothing, size does not change brightness", "It stops casting shadows"]
        answer_index: 1
        explain: "For Rect Lights the Intensity is averaged over the surface area. When you increase Source Width and Height you must raise Intensity to keep the same apparent brightness."
    flavors:
      _default: {why: "Point, Spot and Rect lights are the tools for interiors and hero props. Their details make the difference between flat and rich lighting."}
      level_design: {why: "Local lights guide the player. Cone angles and radius decide what is seen.", do: "Use a Spot Light with a tight cone to mark a door the player must find."}
      cinematics: {why: "Rect lights behave like film softboxes.", do: "Light a character with one Rect Light as key and one Point Light as rim."}
      tech_art: {why: "Light shape affects specular and shadow cost.", do: "Compare Cast Shadows on and off on the Rect Light and note the difference in the Stat GPU shadow depths."}

  - id: EAQ38
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [lighting, mobility, performance]
    required_spine: false
    required: false
    title: Static, Stationary or Movable
    brief: "Every light in Unreal has a Mobility setting with three options. A Static light cannot change at all while the game runs, a Stationary light stays in place but can change brightness and color, and a Movable light can change in every way. This choice affects both how good the light looks and how much it costs to draw. In this quest you place five overlapping lights, see what happens when too many Stationary lights overlap, and decide which Mobility each light should have."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/light-types-and-their-mobility-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/stationary-light-mobility-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/movable-light-mobility-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/static-light-mobility-in-unreal-engine"
    checklist:
      - "Open a small test level that has a floor and a few props. Place five Point Lights close together so that the areas they light overlap."
      - "Set all five lights to Stationary. Look at the light icons in the viewport and find the one that shows a red X."
      - "Open View Mode, then Optimization Viewmodes, then click Stationary Light Overlap. Take a screenshot that shows the red overlap."
      - "Change one light to Movable and one light to Static. Then check the overlap view again and see what changed."
      - "Select a Movable Point Light and turn Cast Shadows off and then on again. Read the section of the documentation that explains why Movable lights without shadows are cheap."
      - "For each of your five lights, write down which Mobility you would use in a real scene and why. One line for each light is enough."
    done_when: "Send one screenshot in the Stationary Light Overlap view mode that shows the red overlap. Add your five lines of text, one for each light, that say which Mobility you chose."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Which mobility lets a light change color and intensity in game, but not move?"
        choices: ["Static", "Stationary", "Movable", "None, only Movable lights can change"]
        answer_index: 1
        explain: "Stationary lights stay in one position but can change in other ways, such as brightness and color. Static lights cannot change at all."
      - q: "How many Stationary Lights can overlap a single object at the same time before the limit is reached?"
        choices: ["Two", "Eight", "There is no limit", "Four"]
        answer_index: 3
        explain: "Only four or fewer Stationary Lights can overlap one another or a single piece of geometry. Beyond that, the extra light falls back to costly dynamic shadows."
      - q: "What does the editor show when the Stationary light overlap limit is exceeded?"
        choices: ["A yellow warning in the Output Log only", "The light turns invisible", "A red X over the light icon, and the Stationary Light Overlap view mode highlights it in red", "The light is switched to Static automatically"]
        answer_index: 2
        explain: "The offending light icon gets a red X, and the Stationary Light Overlap view mode (under Optimization Viewmodes) highlights it in red until you fix it."
      - q: "A Movable Point Light with Cast Shadows turned off: how expensive is it?"
        choices: ["Very inexpensive, even lower cost than a Static light because no lighting data is saved to disk", "The most expensive light type", "The same cost as a Stationary light", "It cannot be rendered without shadows"]
        answer_index: 0
        explain: "Non-shadowing Movable lights are very inexpensive. The docs say they carry a lower cost than Static lights because nothing needs to be saved to disk. Shadows are the expensive part."
      - q: "What happens to the runtime cost of a Static light after the lighting build is done?"
        choices: ["It costs the same as a Movable light", "It has no further impact on performance; its data lives in lightmaps", "It still computes shadows every frame", "It only costs performance when the player moves"]
        answer_index: 1
        explain: "Static lights are precomputed with Lightmass and stored in lightmaps. After the build they have no further impact on performance."
      - q: "A Stationary Directional Light shows no dynamic shadows near the player. What is the likely cause?"
        choices: ["Cast Shadows is always off for Stationary lights", "Dynamic Shadow Distance StationaryLight is at its default of 0", "The light needs Source Radius above 0", "Stationary lights never cast dynamic shadows"]
        answer_index: 1
        explain: "By default all Directional Stationary Lights start with Dynamic Shadow Distance StationaryLight at 0, which means no dynamic shadowing. Raise it to get Cascaded Shadow Maps near the player."
    flavors:
      _default: {why: "Mobility is the first performance and quality decision you make for every light."}
      level_design: {why: "Too many overlapping Stationary lights silently become expensive.", do: "Run the overlap view mode on one of your own blockout levels."}
      tech_art: {why: "Mobility decides which shadow path the renderer uses.", do: "Note which mobility combinations trigger per-object shadows in the docs and test one."}

  - id: EAQ39
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [lighting, lumen, global-illumination, reflections]
    required_spine: false
    required: false
    title: Lumen dials that matter
    brief: "Global illumination, often written GI, is light that bounces from one surface to another, for example sunlight that hits a floor and then lights the ceiling. Lumen is the system in Unreal Engine 5 that calculates this bounced light and the reflections while the game runs. Lumen has many settings, but only a few of them change the picture in a way you can easily see. In this quest you build a small room and try those settings in a Post Process Volume, which is a box that changes how the final picture is drawn."
    time_min: 55
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/lumen-global-illumination-and-reflections-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open Project Settings, then Engine, then Rendering. Confirm that Dynamic Global Illumination Method and Reflection Method are both set to Lumen. Note whether Generate Mesh Distance Fields is turned on."
      - "Build a small room with one open door and a bright white floor. Place a strong Directional Light outside so that light bounces into the room through the door."
      - "Add a Post Process Volume and enable Infinite Extent (Unbound), so that its settings apply to the whole level."
      - "In the Post Process Volume, under Global Illumination, try Final Gather Quality at 1 and then at 4. Compare the noise in the dark corners of the room."
      - "Set Max Trace Distance to a very small value, for example 200, and watch what happens in the corners. Then set it back to its old value."
      - "Place a sphere that works like a mirror, with a material that has Roughness 0 and Metallic 1. Under Reflections, set Max Reflection Bounces to 1 and then to 3. Compare the black areas in the reflection."
      - "Try Skylight Leaking at 0 and then at 0.2. Note which value stops the room from becoming fully black."
    done_when: "Send two screenshots of the room, one with Final Gather Quality 1 and one with Final Gather Quality 4. Also send a screenshot of the sphere with Max Reflection Bounces set to 3 and the Details panel of the Post Process Volume visible."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Where do you turn Lumen on for a whole project?"
        choices: ["World Settings > Lightmass", "Project Settings > Engine > Rendering, Dynamic Global Illumination Method and Reflection Method", "The Sky Light Details panel", "Each light's Mobility dropdown"]
        answer_index: 1
        explain: "Lumen is enabled in Project Settings under Rendering, by setting Dynamic Global Illumination Method and Reflection Method to Lumen. They can be set independently."
      - q: "Why does enabling Lumen also turn on Generate Mesh Distance Fields?"
        choices: ["It is required for Lumen's Software Ray Tracing mode", "Distance fields store the lightmaps", "It makes Nanite meshes render faster", "It is needed to place a Post Process Volume"]
        answer_index: 0
        explain: "Software Ray Tracing traces against mesh distance fields, so Lumen needs them. Hardware Ray Tracing is the alternative when the GPU supports it."
      - q: "A light is set to Static in a Lumen project. What happens to its contribution?"
        choices: ["It becomes fully dynamic", "It is disabled, because Static lights live in lightmaps which Lumen hides", "It only affects reflections", "It doubles because Lumen adds bounces"]
        answer_index: 1
        explain: "Lights with Mobility set to Static are not supported by Lumen. Their contribution is stored completely in lightmaps, and lightmaps are hidden when Lumen is on."
      - q: "Light seems to leak into a large cave. Which Post Process setting is the most likely fix?"
        choices: ["Lower Lumen Scene Detail", "Raise Skylight Leaking", "Raise Max Trace Distance", "Set Max Reflection Bounces to 1"]
        answer_index: 2
        explain: "Max Trace Distance values that are too small cause lighting to leak into large areas such as caves. Larger values fix it at higher GPU cost."
      - q: "A mirror sphere shows black patches in its reflection. Max Reflection Bounces is at the default. What is the default, and what can you do?"
        choices: ["Default 0; set it to 1", "Default 1; raise it to 2 or more (up to 8 in the PPV)", "Default 8; lower it", "Default 64; it cannot be changed"]
        answer_index: 1
        explain: "The default is 1 bounce, one reflection ray with no secondary reflections. 2 or more bounces can prevent black areas in reflections when there is performance budget. The PPV allows up to 8."
      - q: "You switch the sun off in a Lumen scene and the room stays lit for a few seconds. Why?"
        choices: ["Lumen caches lighting, so global changes take time to propagate; Lighting Update Speed controls it at GPU cost", "The Sky Light needs a recapture", "Lightmaps still hold the old lighting", "Screen Traces are disabled"]
        answer_index: 0
        explain: "Lumen uses caches for real-time performance. Global lighting changes can take multiple seconds. Lumen Scene Lighting Update Speed and Final Gather Lighting Update Speed in the PPV speed this up but cost more GPU."
    flavors:
      _default: {why: "Lumen is the default GI. Knowing the few dials that matter saves hours of guessing."}
      tech_art: {why: "Every Lumen dial trades quality for GPU time.", do: "Record GPU ms with Stat GPU for Final Gather Quality 1 and 4 and note the difference."}
      cinematics: {why: "Reflection bounces and quality matter most on hero shots.", do: "Set up one shot-specific PPV with higher Reflection Quality and compare."}

  - id: EAQ40
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [lighting, shadows, virtual-shadow-maps, nanite]
    required_spine: false
    required: false
    title: Soft shadows with Virtual Shadow Maps
    brief: "Virtual Shadow Maps, often written VSM, are the default way Unreal Engine 5 draws shadows. They can make shadows that are sharp where an object touches the ground and softer further away, which is how real shadows look. In this quest you check that your project uses Virtual Shadow Maps, make soft shadows with one setting on the light, and look at a debug view that shows which parts of the shadow are redrawn every frame."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/virtual-shadow-maps-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open Project Settings, then Engine, then Rendering, and find the Shadows section. Confirm that Shadow Map Method is set to Virtual Shadow Maps."
      - "Place a tall thin mesh, such as a pole or a fence, on a floor. Add a Directional Light with Mobility set to Movable, and rotate it to a low angle so the shadow is long."
      - "On the Directional Light, set Source Angle to 0.5 and then to 3. Watch the shadow: it should be sharp at the base of the pole and softer far away from it."
      - "Place a Movable Point Light near a prop. Change Source Radius from 0 to 10 and compare the penumbra, which is the soft edge of the shadow."
      - "Open Show, then Visualize, then Virtual Shadow Map, and pick the Cached Page view. Move the camera and watch the green and red pages. Green pages are reused from the last frame, and red pages had to be drawn again."
      - "Add a mesh whose material uses World Position Offset, which moves the surface of the mesh, for example wind on foliage. See how this mesh keeps showing red pages."
      - "On the Directional Light, compare Contact Shadow Length at 0 and at 0.1. Decide if it adds anything to the picture when Virtual Shadow Maps are on."
    done_when: "Send two screenshots: one of the pole shadow with Source Angle 3 that shows the shadow sharp at the base and softer further away, and one of the Cached Page view with red and green pages visible."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Where does a project choose between Virtual Shadow Maps and conventional Shadow Maps?"
        choices: ["World Settings > Lightmass", "On each light's Mobility dropdown", "Sky Light Details panel", "Project Settings > Engine > Rendering > Shadows > Shadow Map Method"]
        answer_index: 3
        explain: "The Shadow Map Method project setting (or the console variable r.Shadow.Virtual.Enable) selects VSM. New projects use VSM by default."
      - q: "What makes a Point Light's shadow soft with VSM?"
        choices: ["Increasing Attenuation Radius", "Setting Source Radius above 0; local lights have none by default", "Enabling Cast Translucent Shadows", "Lowering Shadow Bias to 0"]
        answer_index: 1
        explain: "Shadow Map Ray Tracing distributes rays based on Source Radius on local lights or Source Angle on Directional Lights. Local lights have no Source Radius by default, so set one."
      - q: "In the Cached Page visualization, what do red pages mean?"
        choices: ["Pages fully cached from last frame", "Pages with the highest resolution", "Pages outside the camera view", "Pages that are new or invalidated and must be re-rendered"]
        answer_index: 3
        explain: "Fully cached pages are green. New or invalidated pages are red. With a static camera, most red comes from cache invalidations you should reduce."
      - q: "Which of these invalidates cached shadow pages every frame?"
        choices: ["A Static Mesh with Static mobility", "A Directional Light that never moves", "A material using World Position Offset", "A Nanite mesh with a plain material"]
        answer_index: 2
        explain: "Skeletal animation and materials using World Position Offset or Pixel Depth Offset always invalidate cached pages every frame, so use them carefully and keep bounds tight."
      - q: "With VSM enabled, is the Contact Shadow Length setting still needed for sharp contact shadows?"
        choices: ["Yes, it is required for VSM to work", "No, VSM's high resolution makes it unnecessary and it can be less accurate", "Yes, but only on Point Lights", "No, because VSM disables all screen space effects"]
        answer_index: 1
        explain: "Because of VSM's high resolution and accuracy, screen space Contact Shadows are no longer necessary for sharp contact shadows and are not recommended otherwise."
      - q: "How large is a Virtual Shadow Map, and how is it split up?"
        choices: ["16k x 16k virtual resolution, split into 128x128 pages that render only when needed", "2k x 2k, split into cascades", "4k x 4k, one texture per object", "Unlimited, streamed from disk"]
        answer_index: 0
        explain: "VSMs have a virtual resolution of 16k x 16k and are split into 128x128 pages. Pages are allocated and rendered only as needed for on-screen pixels and are cached between frames."
    flavors:
      _default: {why: "VSM is the default shadow method in UE5. Soft, contact-hardened shadows are one setting away once you know which one."}
      tech_art: {why: "Cache invalidations are the main VSM cost.", do: "Use the ShadowCasters view mode and find one object with inflated bounds."}
      level_design: {why: "Shadows sell scale and grounding in a blockout.", do: "Set Source Angle on the sun in your blockout and see how contact hardening reads."}

  - id: EAQ41
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [lighting, materials, light-functions]
    required_spine: false
    required: false
    title: Light functions, caustics and cloud shadows
    brief: "A light function is a material that you put on a light to change its brightness in a pattern, a little like a slide in a projector. Artists use light functions for moving effects such as the light patterns under water, called caustics, or the shadows of clouds. In this quest you make a light function material with a moving pattern, put it on a Spot Light, and adjust how it looks."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-light-functions-in-unreal-engine"
    backup_url: null
    checklist:
      - "Create a material named M_LF_Caustic. Open it, and in the Details panel set Material Domain to Light Function."
      - "Add a tiling noise texture or caustic texture, and make it move with a Panner node. Connect the result to Emissive Color. Keep the values between 0 and 1."
      - "Place a Spot Light with Mobility set to Movable and aim it at a floor. In the Details panel of the light, assign M_LF_Caustic to Light Function Material."
      - "Change the X and Y values of Light Function Scale until the size of the pattern looks right. Also note what the Z value does."
      - "Set Fade Distance so that the pattern fades out far from the camera. Then set Disabled Brightness to the average brightness of your pattern, so the light does not jump in brightness when the pattern fades."
      - "Place an Exponential Height Fog, enable Volumetric Fog on it, and see the pattern appear in the fog."
      - "Open the console and run ShowFlag.VisualizeLightFunctionAtlas 1. Check if your material appears in the atlas, which is one shared texture where Unreal stores light functions."
    done_when: "Send one screenshot of the animated caustic pattern on the floor, and one screenshot of the Light Function Atlas view that shows your material in the list."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "How do you turn a material into a light function?"
        choices: ["Set Blend Mode to Additive", "Set Material Domain to Light Function and feed nodes into Emissive Color", "Enable Two Sided and use Opacity", "Set Shading Model to Unlit"]
        answer_index: 1
        explain: "Light functions are materials with Material Domain set to Light Function. All nodes feed into the Emissive Color input on the main material node."
      - q: "Which light mobility can use a light function?"
        choices: ["Static only", "Any mobility", "Movable or Stationary only; they cannot be baked into lightmaps", "Movable only"]
        answer_index: 2
