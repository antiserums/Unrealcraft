    title: Bake a kit corner with Merge Actors
    brief: "Every separate mesh in a level costs the computer some work to draw, and each such job is called a draw call. When a group of pieces is finished and will not change again, you can use Merge Actors to combine them and lower that cost. The tool has several methods: Merge makes one mesh, Batch groups identical meshes into instances, and Approximate builds a new simple mesh for use at a distance. In this quest you try all three on a building corner and compare the results."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/merging-actors-in-unreal-engine"
    backup_url: null
    extra_urls: []
    checklist:
      - "Build a small corner of a building from 8 to 12 kit pieces, such as walls, a pillar and trims. Use at least two materials and include one Nanite piece. Use the same pillar mesh three times."
      - "Select all pieces. Open Actor, then Merge Actors, then Merge Actor Settings. With the Merge method selected, turn off Pivot Point at Zero, turn on Generate Nanite Enabled Mesh, and keep Merge Materials off. Run the Merge and save the result as SM_Corner_Merge."
      - "Open SM_Corner_Merge and count its material sections. Compare that number with the number of materials you used."
      - "Undo the merge or place the pieces again. Select only the three identical pillars and run Batch. Look at the result in the Outliner."
      - "Select the whole corner again and run Approximate. Save the result as SM_Corner_Approx. Open it and compare its triangle count and materials with SM_Corner_Merge."
      - "Place the original pieces, SM_Corner_Merge and SM_Corner_Approx side by side. Compare them from close up and from far away."
    done_when: "Send a screenshot of the three versions side by side. Add a short note with the number of sections in SM_Corner_Merge, what Batch produced, and which version you would use at a distance."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "With the default Merge method, how many draw calls does the merged mesh use?"
        choices: ["One", "One per material, because each material becomes one mesh section", "One per source actor", "One per LOD"]
        answer_index: 1
        explain: "Merge keeps one section per material and preserves the UVs."
      - q: "You turn on Merge Materials. What do you gain and lose?"
        choices: ["More sections but better lighting", "Smaller file but no collision", "Better occlusion but more draw calls", "A single section and draw call, but the UVs are not preserved"]
        answer_index: 3
        explain: "A single material is baked for the whole mesh with a new UV layout."
      - q: "Which LOD does Simplify use from each source mesh?"
        choices: ["The lowest-detail LOD of each mesh", "LOD0 only", "The LOD you select per mesh", "All LODs stacked"]
        answer_index: 0
        explain: "Simplify builds one proxy mesh with one draw call and one baked material."
      - q: "What does the Batch method create?"
        choices: ["One proxy mesh", "A Packed Level Actor", "Instanced Static Mesh components from identical meshes, keeping UVs and occlusion behavior", "A merged material atlas"]
        answer_index: 2
        explain: "Batch is for repeated identical pieces. It does not bake anything."
      - q: "When would you pick Approximate instead of Simplify?"
        choices: ["When you want to keep every material", "When the sources are very complex, for example Nanite meshes, where Simplify would fail", "When you need instancing", "When the pieces are all the same"]
        answer_index: 1
        explain: "Approximate is new in UE5 and handles sources that break Simplify's simplification or texture baking."
      - q: "Pivot Point at Zero is disabled. Where is the merged actor's pivot?"
        choices: ["At the level origin", "At the center of the bounds", "At the lowest Z", "At the pivot of the first Static Mesh Actor you selected"]
        answer_index: 3
        explain: "Enable Pivot Point at Zero to put the pivot at (0,0,0) instead."
      - q: "Merge Materials is grayed out. What is the likely reason?"
        choices: ["LOD Selection Type is set to Use all LOD levels", "The meshes have no collision", "Nanite is enabled", "Too many actors are selected"]
        answer_index: 0
        explain: "You cannot merge materials for multiple meshes while using all LOD levels."
      - q: "What is Gutter Size for in a baked merged material?"
        choices: ["The border of the mesh collision", "The distance between actors", "Space in pixels between UV islands so colors do not bleed when mipmaps downsample", "The thickness of the proxy walls"]
        answer_index: 2
        explain: "Without a gutter, island colors overlap at lower mips and show as artifacts."
    flavors:
      _default: {why: "Merging a finished kit assembly cuts draw calls for pieces that never change again."}
      tech_art: {why: "Merge, Batch and Approximate are the base of HLOD-style optimization.", do: "Run Simplify on the corner too and note where it fails or looks wrong."}
      level_design: {why: "Baked corners are quick to place many times.", do: "Place the merged corner four times and compare stat unit with the loose pieces."}

