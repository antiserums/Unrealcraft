    xp: 60
    verify_type: screenshot
    quiz:
      - q: "For Nanite static displacement, what does the page suggest for Trim Relative Error?"
        choices: ["Exactly 0", "A good default is 0.04, and keep it above 0.02", "Any value above 1", "It must match the Magnitude"]
        answer_index: 1
        explain: "The value targets an error level for the tessellator. Too small only adds triangles and long build times."
      - q: "A prop has three material slots. Which displacement map is used for Material Slot 2?"
        choices: ["Always Index 0", "The last index in the list", "The map with the same name as the material", "Displacement Maps Index 2"]
        answer_index: 3
        explain: "Each Displacement Maps index maps to the material slot with the same number."
      - q: "In a tessellation material, what does Center 0.5 mean?"
        choices: ["Mid gray in the map is no change, so the surface moves in and out equally", "The mesh is scaled by half", "Only half the triangles are displaced", "Displacement starts at half the screen size"]
        answer_index: 0
        explain: "Center sets which displacement value equals the base surface. Use 0 to push only outwards."
      - q: "Why should the Magnitude stay as small as possible?"
        choices: ["Large values break the normal map", "It changes the UV channel", "Magnitude sets the bounds used for culling; a large value hurts performance, especially with Virtual Shadow Maps", "The value is limited to 1"]
        answer_index: 2
        explain: "Use the full 0-1 range of the Displacement output instead of a big Magnitude scaled down."
      - q: "In which direction does Nanite displacement move the surface?"
        choices: ["Along world Z", "Along the vertex normal; there is no shader option to change the direction", "Towards the camera", "Along the UV U axis"]
        answer_index: 1
        explain: "Displacement is scalar and follows the unnormalized interpolated vertex normal."
      - q: "Does displacement change the shading of the surface?"
        choices: ["Yes, normals are recomputed like in offline renderers", "Yes, but only with Lumen", "Only when Center is 0", "No; you need a normal map or derive one from the displacement"]
        answer_index: 3
