    checklist:
      - "Take a simple Nanite-enabled prop with one material slot (a brick block or a stone slab). Name it SM_Disp_Test. Get a height (displacement) texture for its surface, for example from a Fab surface."
      - "Open the Static Mesh Editor. Under Nanite Settings set Trim Relative Error to 0.04."
      - "Expand Displacement Maps, add one element (Index 0) and set its Texture to your height map. Set Magnitude to a small value (start with 2). Click Apply Changes."
      - "Check Displacement UV Channel matches the UV channel your height map is meant for. Place the prop in a level."
      - "Open View Modes > Nanite Visualization > Triangles. Compare the mesh with Magnitude 0 and with your Magnitude."
      - "Optional: on a copy of the material, check Enable Tessellation under Nanite in the material Details, plug the height texture into Displacement, and set Magnitude and Center. Compare runtime tessellation with the baked result."
