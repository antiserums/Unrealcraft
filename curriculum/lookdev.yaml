    checklist:
      - "Open a level with a dark interior and a bright exterior door. In the global Post Process Volume set Metering Mode to Auto Exposure Histogram."
      - "In Project Settings > Rendering > Default Settings enable Extend default luminance range in Auto Exposure settings. Note that Min Brightness and Max Brightness are now shown in EV100."
      - "Turn on Show > Visualize > HDR (Eye Adaptation). Stand outside and inside and write down the Average Scene EV100 for both."
      - "Create a Curve Float asset CF_ExposureComp (Add > Miscellaneous > Curve). Add a key at your outdoor EV100 with value -0.5 and one at your indoor EV100 with value +0.5. Assign it to Exposure Compensation Curve and watch Exposure Compensation (Curve) change as you walk."
      - "Make a small grayscale texture T_MeteringMask that is bright in the center and dark at the edges. Assign it to Exposure Metering Mask. Look at the bright door from the side so it sits at the screen edge, and compare stability."
      - "Under Lens > Local Exposure set Highlight Contrast 0.8, Shadow Contrast 0.8, Blurred Luminance Blend 0.5. Turn on Show > Visualization > Local Exposure and screenshot it."
      - "Add PPV_Interior around the room with Blend Radius 300 and its own Exposure Compensation. Walk through the door in PIE and check the transition."
