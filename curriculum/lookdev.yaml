    title: "Foliage that fades instead of popping"
    time_min: 70
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/foliage-mode-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/mesh-distance-fields-in-unreal-engine"
    checklist:
      - "Open a landscape level with at least two Static Mesh Foliage types (a bush with a masked leaf material and a rock). Paint a wide field of both."
      - "On the bush type set Start Cull Distance 3000 and End Cull Distance 5000. Fly the camera back and watch whole clusters vanish."
      - "Open the bush material. Add a PerInstanceFadeAmount node and multiply it into the Opacity Mask so leaves thin out before the end distance. Fly back again."
      - "On the bush type enable Scalability > Enable Density Scaling. In the console run foliage.DensityScale 0.3, then 1.0, and compare."
      - "Enable Affect Distance Field Lighting on the bush type only. Leave it off for grass-like types."
      - "Resculpt the ground under some bushes so they float. Select those instances, move them above the ground and press End to snap and reattach them."
      - "If the map uses World Partition, find Instanced Foliage Grid Size in Project Settings and note the default."
    done_when: "Two screenshots from the same far camera: one with clusters popping (no fade) and one with fading leaves, plus a screenshot of the Foliage Details showing the cull distances and Enable Density Scaling."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Why can foliage seem to disappear in groups at the End Cull Distance?"
        choices: ["Each instance has its own random cull distance", "Instances render as clusters in one draw call, and a whole cluster is culled when it goes out of range", "The landscape LOD hides them", "Culling happens per material, not per instance"]
        answer_index: 1
        explain: "Foliage instances are rendered as clusters in a single draw call. Beyond End Cull Distance the whole cluster is culled, so groups disappear abruptly."
      - q: "Which material node gives the per-instance fade factor between Start and End Cull Distance?"
        choices: ["PerInstanceRandom", "DistanceToNearestSurface", "PerInstanceFadeAmount", "CameraDepthFade"]
        answer_index: 2
        explain: "The vertex shader computes a per-instance fade from 1.0 at the start distance to 0.0 at the end. It is read with the PerInstanceFadeAmount node."
      - q: "What happens if the FadeMultiplier is set to zero?"
        choices: ["Foliage never fades", "Foliage fades only at the end distance", "The cull distance is ignored", "Foliage is invisible at any distance"]
        answer_index: 3
        explain: "Lowering FadeMultiplier speeds up the fade. A value of zero makes the foliage invisible at any distance."
      - q: "Which foliage is not affected by cull distance and instance fading?"
        choices: ["Nanite-enabled meshes", "Actor Foliage", "Static Mesh Foliage with LODs", "Foliage placed with the Single tool"]
        answer_index: 0
        explain: "The documentation states that Nanite-enabled meshes are not affected by culling distance and instance fading."
      - q: "What must be enabled for foliage.DensityScale to change a foliage type at runtime?"
        choices: ["Affect Distance Field Lighting", "Place in Current Level", "Align to Normal", "Enable Density Scaling in the type's Scalability section"]
        answer_index: 3
        explain: "Enable Density Scaling in the Foliage Details Scalability section lets the scalability system change how many instances render with foliage.DensityScale."
      - q: "Why is Static Mesh Foliage cheaper than Actor Foliage?"
        choices: ["It has no collision", "Static Mesh Foliage batches instances with hardware instancing, so many instances cost one draw call, while Actor Foliage costs like normal actors", "It uses lower LODs", "It is not rendered in shadows"]
        answer_index: 1
        explain: "Static meshes placed with Foliage Mode are grouped and rendered with hardware instancing. Actor Foliage has the same cost as placing normal actors."
      - q: "How do you reattach floating foliage instances to the ground after resculpting?"
        choices: ["Select them, move them above the target, and press End to snap them", "Repaint them", "Run the Reapply tool with Align to Normal", "Use the Fill tool"]
        answer_index: 0
        explain: "Select the instances, move them above the target component, and press End. They snap to the ground and are reparented to that component."
      - q: "In a World Partition map, what is the default Instanced Foliage Grid size?"
        choices: ["64 meters, the same as the World Partition grid", "128 meters", "256 meters, separate from the World Partition grid", "1 kilometer"]
        answer_index: 2
        explain: "The default Instanced Foliage Grid is 256 meters (25600 cm). It is separate from the World Partition grid size and can be changed in Project Settings."
    flavors:
      _default: {why: "Popping foliage breaks the illusion of a big open world; fading and scalability keep it smooth and cheap."}
      tech_art: {why: "Fade, density scaling and distance field flags are the levers for foliage budgets.", do: "Run foliage.DensityScale at 0.1, 0.5 and 1.0 with stat unit open and note the Draw time each time."}
      level_design: {why: "Cull distances decide whether cover and landmarks are visible from where the player needs them.", do: "Set the End Cull Distance of landmark trees well beyond bushes so routes stay readable."}

