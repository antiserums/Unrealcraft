      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-substrate-materials-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, and work in any lit level. Create a material named M_Blend_Test with a colored Base Color. This is the opaque starting point that you copy in the next steps. Place four spheres in front of a wall, one for each blend mode you will try."
      - "Duplicate the material and name the copy M_Blend_Masked. Set its Blend Mode to Masked. Connect a pattern with clear light and dark areas to Opacity Mask, for example a striped or checker texture, or a Checker Pattern node, and try two different Opacity Mask Clip Values. Apply it to the first sphere."
      - "Duplicate M_Blend_Test again and name the copy M_Blend_Translucent. Set its Blend Mode to Translucent and connect a gradient to Opacity, for example one channel of a Texture Coordinate node. Apply it to the second sphere."
      - "Duplicate again to make M_Blend_Additive, with Blend Mode Additive, and M_Blend_Modulate, with Blend Mode Modulate, set to Unlit, and with the color connected to Emissive. Apply them to the third and fourth sphere. Move two spheres so that they overlap, and look at the area where they overlap."
      - "On M_Blend_Translucent, open the Translucency section in the Details panel. Place a Point Light nearby and compare these three Lighting Mode values: Volumetric NonDirectional, Surface TranslucencyVolume and Surface ForwardShading."
      - "Take one screenshot with all four blend modes visible, and one screenshot with the three lighting modes side by side."
    done_when: "Send two screenshots: one with the four blend modes labeled, and one with the three translucency lighting modes labeled. Add one line that says which mode showed a specular highlight."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "What does the Opacity Mask Clip Value do in a Masked material?"
        choices: ["It sets the cutoff: mask values darker than it are not rendered", "It blurs the mask by that amount at the edges of the cutout", "It sets how transparent the whole material is, from 0 up to 1", "It controls the refraction of the pixels that are kept"]
        answer_index: 0
        explain: "Masked is on/off. Pixels whose mask value is below the Opacity Mask Clip Value are discarded. There are no in-between levels."
      - q: "A translucent gradient sphere: what does black in the Opacity input mean?"
        choices: ["Fully opaque", "Fully transparent", "Half transparent", "Not rendered and no reflections"]
        answer_index: 1
        explain: "In Translucent mode, black areas of Opacity are fully transparent, white areas are fully opaque, and grays are in between."
      - q: "Two Additive spheres overlap. What do you see in the overlap?"
        choices: ["It gets darker, because pixel values are divided", "It disappears, because the two spheres cancel each other", "It gets brighter, because pixel values are added", "It turns gray, as the values are averaged"]
        answer_index: 2
        explain: "Additive adds the material's pixels to the background. Overlaps are brighter and black renders as transparent. Modulate multiplies and darkens instead."
      - q: "Why can Masked be cheaper than Translucent for a fence?"
        choices: ["Masked uses fewer textures and no lighting on the cut pixels", "Masked pixels that are cut are not drawn or calculated at all", "Masked disables lighting on the whole fence mesh", "Masked has no Opacity input, so it needs no texture"]
        answer_index: 1
        explain: "Culled masked pixels simply do not draw, so nothing is calculated for them. But they also show no reflections in those areas."
      - q: "You need specular highlights from a Point Light on a translucent surface. Which Lighting Mode gives them?"
        choices: ["Volumetric NonDirectional", "Volumetric PerVertex NonDirectional", "Surface TranslucencyVolume", "Surface ForwardShading"]
        answer_index: 3
        explain: "Surface ForwardShading computes each light per pixel, so specular highlights from local lights are supported. It is also the most expensive mode."
      - q: "Which Lighting Mode is the cheapest per pixel and meant for smoke and dust?"
        choices: ["Volumetric NonDirectional", "Surface ForwardShading", "Surface TranslucencyVolume", "Thin Translucent"]
        answer_index: 0
        explain: "Volumetric NonDirectional lights a volume without direction and ignores the material normal. It is the cheapest per-pixel method."
    flavors:
      _default: {why: "Blend mode and lighting mode decide what a see-through material can do and what it costs."}
      lookdev: {why: "Glass, water, fog cards and holograms all start with the right blend and lighting mode.", do: "Try AlphaComposite on the additive sphere against a bright sky and note the difference."}
      tech_art: {why: "Translucency lighting modes are a big cost lever. Know the cheap ones."}
      level_design: {why: "Fences and grates should be Masked, not Translucent, unless you need reflections."}

  - id: EAQ58
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [materials, glass, refraction, fresnel, translucency]
    required_spine: false
    required: false
    title: Glass with refraction
    brief: "Refraction is the way light bends when it passes through glass or water, so things behind the glass look shifted. The strength of the bend is given by a number called the index of refraction, or IOR. In this quest you build a glass material that bends the background more at the edges than in the center, and you compare several real IOR values."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-refraction-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/lit-translucency-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-fresnel-in-your-unreal-engine-materials"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a material named M_Glass. Set Blend Mode to Translucent. Under Translucency, set Lighting Mode to Surface TranslucencyVolume so that the Refraction pin appears."
      - "Add a Scalar Parameter named Opacity with the value 0.3 and connect it to Opacity. Add a Scalar Parameter named IOR with the value 1.52. Use a Fresnel node to drive a Lerp between 1.0 at the center and IOR at the edges, and connect the result to Refraction."
      - "Create a Material Instance named MI_Glass and apply it to a sphere in front of a wall with a pattern, for example a cube with the grid material MI_PrototypeGrid_Gray of the template. Try IOR 1.0, 1.33, 1.52 and 2.42, and take a screenshot of each."
      - "Add a Normal Map texture parameter and connect it to Normal. Any normal map works, for example T_Quinn_01_N from the folder Characters/Mannequins/Textures/Quinn of the template. See how the refraction breaks up."
      - "Find Refraction Depth Bias in the Details panel of the material. Try a small value while you look at a close object through the glass."
      - "This step is optional. Duplicate the material as M_Glass_Thin, and set Shading Model to Thin Translucent and Lighting Mode to Surface ForwardShading. Compare the highlights."
    done_when: "Send four labeled screenshots of the sphere with IOR 1.0, 1.33, 1.52 and 2.42, and one more screenshot with the normal map turned on."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Which IOR value does the page give for glass?"
        choices: ["1.00", "1.33", "1.52", "2.42"]
        answer_index: 2
        explain: "Glass is 1.52. Water is 1.33, air is 1.00, diamond is 2.42. Use real values for realism."
      - q: "The Refraction pin is greyed out on the main material node. What two settings enable it?"
        choices: ["Blend Mode Translucent and Lighting Mode Surface TranslucencyVolume", "Blend Mode Masked and Two Sided enabled on the material", "Shading Model Unlit and Blend Mode Additive with Two Sided enabled", "Blend Mode Opaque and a Fresnel node on the Normal input"]
        answer_index: 0
        explain: "The tutorial changes Blend Mode to Translucent and the Lighting Mode from Volumetric NonDirectional to Surface TranslucencyVolume. That enables the Refraction input."
      - q: "Why does the tutorial use a Fresnel node to drive refraction?"
        choices: ["To make the glass darker at the edges, so that it looks thicker than the mesh really is", "Because glass refracts little when viewed straight on and more at glancing angles", "To disable refraction on mobile devices, where the Fresnel node always returns zero", "To add roughness in places where the glass is seen from the side"]
        answer_index: 1
        explain: "Fresnel blends the constant at the center of the sphere with the IOR at the edges, so refraction is strongest where the surface curves away from the camera."
      - q: "What is Refraction Depth Bias for?"
        choices: ["Making refraction much stronger for objects that are close to the surface, and weaker for far ones", "Changing the index of refraction by distance, so far objects are distorted less than near ones", "Preventing closer objects from rendering into the distorted surface at sharp viewing angles", "Enabling Thin Translucent on the material, which the Refraction pin needs before it can be used"]
        answer_index: 2
        explain: "The depth bias stops nearby objects from being pulled into the refraction at acute angles, at the cost of a disconnect between the surface and where refraction starts."
      - q: "What does adding a normal map to the refractive material do?"
        choices: ["Nothing, because refraction ignores the normal map", "It bends the refraction following the normal detail", "It turns the material opaque where the map is flat", "It changes the IOR value of the whole material"]
        answer_index: 1
        explain: "The normal map changes the refraction wherever it has detail. Panning two normal maps is how the page builds moving water or heat haze."
      - q: "For a Thin Translucent glass, which Lighting Mode does the page require?"
        choices: ["Volumetric Directional", "Surface TranslucencyVolume", "Volumetric PerVertex NonDirectional", "Surface ForwardShading"]
        answer_index: 3
        explain: "Thin Translucent needs Blend Mode Translucent, Shading Model Thin Translucent and Lighting Mode Surface ForwardShading. It gives white specular highlights and tints the background."
    flavors:
      _default: {why: "Glass is the first material where the camera angle changes what you see. Refraction and Fresnel make it read."}
      lookdev: {why: "Windows, bottles and water all use this same Fresnel-driven refraction setup.", do: "Add two panned normal maps blended with a Lerp to make the surface move like water."}
      tech_art: {why: "Refraction adds a distortion pass; keep the material simple and the IOR real."}
      cinematics: {why: "A glass prop in the foreground of a shot needs correct IOR or the edges look wrong."}

  - id: EAQ59
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [materials, substrate, slab, pbr]
    required_spine: false
    required: false
    title: Substrate awareness
    brief: "Substrate is the newer material system in Unreal Engine 5. Instead of the classic inputs such as Base Color and Metallic, you describe a surface with a building block called a Slab, and you connect it to one input named Front Material. Here F0 is the amount of light a surface reflects when you look straight at it: low for plastic, high for metal. In this quest you check if a project uses Substrate and build two simple Slab materials so that the system is familiar when you meet it."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-substrate-materials-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/substrate-materials-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open Project Settings, then Rendering, and check whether Substrate materials is enabled in the project. Write down what you found, and also the GBuffer Format."
      - "Create a material named M_Substrate_Test. If Substrate is on, add a Substrate Slab node and connect it to the Front Material input on the root node."
      - "Set Diffuse Albedo to a color, F0 to 0.04 (which is a plastic) and Roughness to 0.3. Apply the material to a sphere."
      - "Duplicate the material. Set F0 to a bright color (which is a metal) and Diffuse Albedo to black. Apply it to a second sphere and compare the two."
      - "Open any old material that does not use Substrate, for example a copy of a material from the template. Right-click the root node and read the Convert to Substrate option. Do NOT convert a material that other people share. Use a copy instead."
      - "Write two lines: one that says what a Slab is made of, and one that says what happens to a converted material if Substrate is turned off."
    done_when: "Send a screenshot of the M_Substrate_Test graph with the Slab connected to Front Material, a screenshot of the two spheres side by side, and the two lines that you wrote in step 6."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "A new project is created in UE 5.7 or later. Is Substrate on?"
        choices: ["No, it must always be enabled by hand in Project Settings", "Yes, Substrate is enabled by default for new projects", "Only on consoles, where it replaces the old shading models", "Only in the Automotive template, where car paint needs it"]
        answer_index: 1
        explain: "Substrate is on by default for new projects. Existing projects that upgrade keep the non-Substrate path unless they opt in from Project Settings > Rendering and restart."
      - q: "What must every Substrate material graph connect to?"
        choices: ["The Base Color input on the root node", "The Emissive input on the root node, as a color", "The Front Material input on the root node", "A Material Attributes node at the very end"]
        answer_index: 2
        explain: "All Substrate graphs end at the Front Material input on the Material Root node."
      - q: "A Substrate Slab is described as two parts. Which two?"
        choices: ["An interface and a medium", "A base color and a normal", "A diffuse layer and a specular layer", "A front face and a back face"]
        answer_index: 0
        explain: "The interface is where light meets the surface (Roughness, Normal, F0, F90, Diffuse Albedo). The medium is the matter below, where light scatters and is absorbed (Mean Free Path, Diffuse Albedo)."
      - q: "You converted a material with Convert to Substrate. Which statement is true?"
        choices: ["You can undo it at any time from the same menu, and the old inputs come back as before", "The conversion is permanent and the material no longer works in non-Substrate projects", "It only changes the preview in the Material Editor, and the saved material stays as it was", "It deletes the old inputs and the nodes that were connected to them, so you rebuild the graph"]
        answer_index: 1
        explain: "Explicit conversion is permanent and cannot be reverted. Converted materials are not compatible with non-Substrate projects, and render black if Substrate is disabled."
      - q: "A typical dielectric (non-metal) plastic should have which F0 value, in linear space?"
        choices: ["Between 0.02 and 0.06", "Exactly 1.0, always", "Between 0.5 and 1.0", "Exactly 0.0, always"]
        answer_index: 0
        explain: "Dielectrics have F0 around 0.02 to 0.06. Conductors (metals) go from about 0.5 up to 1. Gemstones can reach about 0.18."
      - q: "Your project runs at 60Hz and needs predictable speed. Which GBuffer format does the page describe for that?"
        choices: ["Adaptive GBuffer", "Blendable GBuffer", "High Precision Normals GBuffer", "DBuffer"]
        answer_index: 1
        explain: "Blendable GBuffer targets a fixed memory footprint and predictable speed for 60Hz projects. Adaptive GBuffer targets visual fidelity at a higher, content-dependent cost."
    flavors:
      _default: {why: "Substrate is the material system new projects use. Knowing Slab, F0 and the root input keeps you from being lost."}
      lookdev: {why: "F0 and Diffuse Albedo replace Base Color, Specular and Metallic. Learn the new words before you build a library.", do: "Read one of the Developer's Blog examples (Simple Dielectric) and rebuild it."}
      tech_art: {why: "Conversion is one-way and the GBuffer format changes cost; the team needs one decision, not many."}
      cinematics: {why: "Adaptive GBuffer is what the Automotive and Architectural templates use for fidelity."}

  - id: EAQ60
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [textures, import, mipmaps, texture-editor]
    required_spine: false
    required: false
    title: Import a texture set the right way
    brief: "A texture is an image that a material uses, for example for the color or the roughness of a surface. Unreal stores each texture together with smaller copies of itself called mips, which it uses when the surface is far away to save memory and avoid shimmering. Mips work best when the image size is a power of two, such as 1024 or 2048. In this quest you import a small set of textures and read what Unreal did with them."
    time_min: 35
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/textures-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/texture-asset-editor-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Prepare three image files for one surface: a color image, a normal image and a roughness image, with a power-of-two size such as 1024x1024, saved as .png or .tga files. If you have none, export them from Unreal: in the folder Characters/Mannequins/Textures/Quinn of the template, right-click T_Quinn_01_D (color), T_Quinn_01_N (normal) and T_Quinn_01_MRA (a mask texture), choose Asset Actions, then Export, and save each one as an image file."
      - "Also prepare one image whose size is not a power of two, for example 1000x700. A cropped screenshot or photo works."
      - "Import all four images with the Import button in the Content Browser, or drag them in from your file explorer. Name them T_Wood_BC, T_Wood_N, T_Wood_R and T_Test_NPOT."
      - "Double-click T_Wood_BC to open the Texture Asset Editor. In the Details panel, read the values Imported, Displayed, Max In-Game and Number of Mips."
      - "Enable the Mip Level checkbox in the toolbar and step through the mips one by one. Watch the Displayed size change."
      - "Open T_Test_NPOT and check which value Mip Gen Settings was given at import. Write the value down."
    done_when: "Send one screenshot of the Texture Asset Editor for T_Wood_BC with the texture information visible (Imported size and Number of Mips). Add one line that says which Mip Gen Settings value T_Test_NPOT got at import."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Which texture sizes can be mipmapped and streamed?"
        choices: ["Any size, as long as it is under 8192", "Power-of-two sizes such as 512, 1024, 2048", "Only square sizes", "Only sizes that end in 00, such as 1000 or 2000"]
        answer_index: 1
        explain: "The Textures page says to use power-of-two sizes. They can be mipmapped and streamed. Non-power-of-two sizes are never streamed."
      - q: "You import a 1000x700 image. What does Unreal do to its Mip Gen Settings?"
        choices: ["It sets Mip Gen Settings to NoMipMaps automatically", "It resizes the image to 1024x1024 when it is imported", "It refuses to import the image and shows an error message", "It sets Mip Gen Settings to Sharpen and keeps all the mips"]
        answer_index: 0
        explain: "Non-power-of-two textures get Mip Gen Settings set to NoMipMaps at import. You can change it later in the Texture Asset Editor."
      - q: "How many mip levels does a 1024x1024 texture get?"
        choices: ["Four", "Twenty", "Ten", "One"]
        answer_index: 2
        explain: "Each mip halves the resolution. The Texture Asset Editor page says a 1024x1024 texture has ten mip levels and a 4096x4096 texture has twelve."
      - q: "Which file type is NOT in the list of supported image formats for import?"
        choices: [".tga", ".exr", ".psd", ".svg"]
        answer_index: 3
        explain: "The supported list includes .bmp, .float, .jpeg, .jpg, .pcx, .png, .psd, .tga, .dds, .exr, .tif and .tiff. Vector formats like .svg are not on it."
      - q: "In the Texture Asset Editor, what does Max In-Game tell you?"
        choices: ["The size of the source file on disk, which is always larger than the size of the texture in the game", "The largest size the texture can be in the game, which is never larger than the imported size", "The number of mips that stream in at the highest quality level, which is never more than the mip count", "The size of the checkered background that is drawn behind the texture"]
        answer_index: 1
        explain: "Max In-Game is the maximum size while in game. It cannot be larger than the imported size, but it can be smaller because of texture settings."
      - q: "Why do textures use mip maps?"
        choices: ["To make the texture brighter when it is seen from far away by the camera", "To add an alpha channel to each of the lower mips", "To reduce aliasing at a distance by using lower resolution versions", "To turn on texture streaming for sizes that are not a power of two"]
        answer_index: 2
        explain: "Mip mapping downscales the texture step by step. Far away surfaces use smaller mips, which reduces aliasing and saves rendering time."
    flavors:
      _default: {why: "Every material starts with a texture. Importing it wrong costs memory and makes far surfaces shimmer."}
      lookdev: {why: "A clean import habit means your whole texture library streams and mips correctly.", do: "Set the Texture Group for each of the three textures to match its use (World, WorldNormalMap)."}
      tech_art: {why: "Import rules are the first place a pipeline breaks.", do: "Note which Details fields you would check in an automated import validator."}

  - id: EAQ61
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [textures, compression, oodle, memory]
    required_spine: false
    required: false
    title: Pick the right compression
    brief: "Textures usually take more memory and disk space than anything else in a project, so Unreal compresses them. There are several compression formats, such as BC1 and BC7, and each one gives a different balance between size and quality. In this quest you look at the compression of a texture, compare two formats, and use the Oodle panel to see how large the texture will be on disk."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/texture-asset-editor-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/texture-format-support-and-settings-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a color texture in the Texture Asset Editor, for example T_Quinn_01_D from the folder Characters/Mannequins/Textures/Quinn of the template. Find the Compression category in the Details panel."
      - "Note the value of Compression Settings, and the Format shown in the texture information at the top. Write down the Resource Size."
      - "Open a packed mask texture, which is a texture that stores a different mask in each color channel. The template has one named T_Quinn_01_MRA in the same folder. Duplicate it and work on the copy. Change Compression Settings to BC7 and compare the Resource Size before and after."
      - "Open the Oodle panel. Enable On-disk Sizes and read the values Uncompressed Size and Compressed Size (Estimate)."
      - "In the Oodle panel, enable Try Encodings and test the RDO Lambda values 0, 30 and 100. Look in the viewport for artifacts, which are small errors in the image caused by compression."
      - "Open Project Settings, then Engine, then Texture Encoding, and find the Fast and Final settings. Do not change them."
    done_when: "Send one screenshot of the Oodle panel with On-disk Sizes enabled. Add a short table (two lines are enough) with the Resource Size of the same texture for BC1/AutoDXT and for BC7."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "A texture holds four unrelated masks, one in each channel, and looks blocky with default DXT compression. Which format does Epic suggest?"
        choices: ["BC7, because it is higher quality for images that do not encode well in BC1", "HDR Compressed (BC6), because it stores each channel as a floating point value", "Uncompressed RGBA16F, because it is the only format that keeps four channels", "Grayscale, because masks have no color and need one channel"]
        answer_index: 0
        explain: "The page says BC7 is higher quality than BC1 and is a good choice for images such as unrelated masks packed into channels. It costs about twice the bytes of BC1 for RGB."
      - q: "How much smaller is HDR Compressed (BC6H) in GPU memory compared to uncompressed HDR (RGBA16F)?"
        choices: ["The same size", "2x smaller", "8x smaller", "100x smaller"]
        answer_index: 2
        explain: "The page recommends BC6H instead of RGBA16F because it is 8x smaller in GPU memory and still high quality."
      - q: "When you import a new texture in the editor, which encode does it get by default?"
        choices: ["Final RDO encode", "Fast non-RDO encode", "No encode until you package", "ASTC encode"]
        answer_index: 1
        explain: "Newly imported textures are encoded with the Fast non-RDO option for speed. Final RDO encoding is used for cooking."
      - q: "In the Oodle Try Encodings section, what does RDO Lambda 0 mean?"
        choices: ["Smallest file size", "Maximum quality loss", "The texture is not compressed at all on the GPU", "RDO is disabled"]
        answer_index: 3
        explain: "The page says 0 disables RDO entirely, 1 gives the largest file size and 100 the smallest."
      - q: "What does a Maximum Texture Size of 0 mean?"
        choices: ["The texture is not rendered at all, on any one of the platforms", "The texture is 1x1 on each platform, to save the most memory", "The maximum size for the format on each platform is used", "The texture is stored uncompressed on each of the platforms"]
        answer_index: 2
        explain: "0 is the default. It means the maximum size for the format on each platform, not a real zero."
      - q: "Where do you set the project-wide Fast and Final texture encoding options?"
        choices: ["Editor Preferences > Texture Editor", "Project Settings > Engine > Texture Encoding", "The Oodle panel of each texture", "Project Settings > Packaging > Compression"]
        answer_index: 1
        explain: "The page says the Fast and Final settings for the project are found in Project Settings under Engine > Texture Encoding. The Oodle panel Try Encodings are not saved."
    flavors:
      _default: {why: "Textures are the biggest part of most projects. The right format saves memory and disk with no visible loss."}
      lookdev: {why: "You will make hundreds of textures. A wrong default multiplies across all of them.", do: "Write a three-line rule for your project: color, normal and mask textures each get which Compression Setting."}
      tech_art: {why: "RDO and format choices are pipeline policy, not per-artist taste.", do: "Read the Platforms panel for one texture and note how Size and Mips differ between two platforms."}

