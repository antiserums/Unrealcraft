    checklist:
      - "Create M_Blend_Test with a colored Base Color. Place four spheres in front of a wall, each with a Material Instance of it."
      - "Set the first instance's parent Blend Mode to Masked. Plug a striped texture into Opacity Mask and try two Opacity Mask Clip Values."
      - "Duplicate the material as M_Blend_Translucent. Set Blend Mode to Translucent and plug a gradient into Opacity."
      - "Duplicate again as M_Blend_Additive (Additive) and M_Blend_Modulate (Modulate, Unlit, color into Emissive). Overlap two spheres and look at the overlap."
      - "On M_Blend_Translucent, open Translucency in the Details panel. Compare Lighting Mode Volumetric NonDirectional, Surface TranslucencyVolume and Surface ForwardShading with a Point Light nearby."
      - "Take one screenshot with all four blend modes visible and one with the three lighting modes side by side."
