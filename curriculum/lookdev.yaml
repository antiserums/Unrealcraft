    title: Paint color onto a Nanite prop
    brief: "The usual way to paint on a placed mesh is vertex painting, which stores color on the corner points of the mesh. This does not work on Nanite meshes. Texture Color painting solves this: your paint is stored in a small texture for each placed copy of the prop, and the material reads that texture. In this quest you prepare a Nanite prop and a material for this method and paint dirt on one copy."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/getting-started-with-mesh-texture-color-painting-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-a-material-and-mesh-for-texture-color-painting-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/mesh-paint-mode-in-unreal-engine"
    checklist:
      - "Open Project Settings, then Engine, then Rendering, and enable Virtual Textures. Restart the editor if it asks you to."
      - "Pick a Nanite prop named SM_PaintTest. In the Static Mesh Editor, open the UV dropdown and check whether UV 0 overlaps or repeats. If it does, expand LOD 0, then Build Settings, enable Generate Lightmap UVs with Destination Lightmap Index 1, and click Apply Changes."
      - "Under General Settings, set Mesh Paint Texture Coordinate Index to the UV channel you will paint on, for example 1."
      - "Make a material named M_PaintTint. Add a Texture Sample with a MeshPaintTextureObject node connected to its Tex input, and set its UVs to the same index. Multiply its RGB with your base color texture. Then send both paths through a MeshPaintTextureReplace node into Base Color."
      - "Place the prop in the level and enter Mesh Paint Mode. Open the Texture Color tab and click Add. Paint dirt or moss on the lower part of the prop."
      - "Set Mesh Paint Texture Resolution on the asset, for example to 512. Click Fix on the instance and check how the paint changes."
    done_when: "Send a screenshot of the painted prop in the level, and a screenshot of M_PaintTint with the MeshPaintTextureObject and MeshPaintTextureReplace nodes. Add one line with the UV index you used."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Why does the page say Texture Color is the only painting option for Nanite meshes?"
        choices: ["Nanite meshes have no UVs", "Nanite meshes do not support per-instance Vertex Color painting", "Vertex colors are always white on Nanite", "Nanite only supports Skeletal Meshes"]
        answer_index: 1
        explain: "Texture Color writes paint into a Mesh Paint Texture instead of the vertex buffer, so it works with Nanite."
      - q: "The Add tool in the Texture Color tab is grayed out. What is the likely cause?"
        choices: ["The mesh has no collision", "The mesh is too small", "Virtual Textures are not enabled for the project", "You are in Game View"]
        answer_index: 2
        explain: "Mesh paint textures are always virtual textures, so the project must have Virtual Textures enabled."
      - q: "Where is the Mesh Paint Texture stored?"
        choices: ["On the mesh instance (component), as a virtual texture asset", "Inside the material", "In the level's World Settings", "On the Static Mesh asset for all instances"]
        answer_index: 0
        explain: "Like vertex color painting, the data belongs to the painted instance. You can inspect it in the component's Mesh Painting category."
      - q: "What is the MeshPaintTextureReplace node for?"
        choices: ["It swaps the texture resolution", "It resets the paint", "It converts vertex colors to a texture", "It picks a Default path when the mesh has no valid mesh paint texture, so one material can be shared"]
        answer_index: 3
        explain: "Default is used when no valid paint texture exists; the MeshPaintTexture path is used when one does."
      - q: "You paint on one side of a prop and the paint also appears on the other side. Why?"
        choices: ["The brush is too big", "The UVs overlap or tile; generate a UV with unique charts instead", "The texture is compressed", "Nanite mirrors the paint"]
        answer_index: 1
        explain: "Texture painting needs unique UV charts. Generate Lightmap UVs makes a suitable channel."
      - q: "Which two values must match for texture painting to work?"
        choices: ["Lightmap resolution and texture size", "Material slot and UV count", "Mesh Paint Texture Coordinate Index on the mesh and the UVs input of the Texture Sample using MeshPaintTextureObject", "Brush size and texel count"]
        answer_index: 2
        explain: "If they differ, painting looks wrong in ways that seem UV-related."
      - q: "Mesh Paint Texture Resolution is 0. What size is used?"
        choices: ["A default heuristic based on the vertex count of the non-Nanite LOD0 mesh, rounded to a power of two", "Always 1024", "The size of the base color texture", "No texture is created"]
        answer_index: 0
        explain: "The project setting Mesh paint texels per vertex times the LOD0 vertex count gives the minimum texel count."
      - q: "You change the resolution setting after painting. How do you apply it without losing your work?"
        choices: ["Re-import the mesh", "Delete and Add again", "Restart the editor", "Use the Fix tool to resize the existing mesh paint texture"]
        answer_index: 3
