      - q: "Why does the page tell you to trim Nanite data with Keep Triangle Percent and Trim Relative Error?"
        choices: ["To make the mesh render faster on screen, because Nanite draws every stored triangle in every frame", "To turn on streaming for the mesh", "To fix the small cracks that appear between modular pieces at far view distances", "To reduce disk and download size; by default Nanite stores all source triangles"]
        answer_index: 3
        explain: "Nothing is trimmed by default. Trimming is about data size on disk, not frame rate."
      - q: "You want your own hand-made LODs instead of the auto fallback. What is the correct setup?"
        choices: ["Fallback Triangle Percent 0, import LOD1, set Minimum LOD to 1", "Disable Nanite and re-enable it, then import all the LODs", "Set Keep Triangle Percent to 100 and import all of the LODs again", "Set Max Edge Length Factor to 1"]
        answer_index: 0
