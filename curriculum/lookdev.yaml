        choices: ["Set it to 0 for the best quality; larger values only remove triangles and blur the result", "It must match the texture size of the displacement map, so use 1024 for a 1K map and 2048 for a 2K map", "It controls the Magnitude of the displacement, so raise it until the surface has the depth that you want", "A good default is 0.04 and keep it above 0.02; smaller only adds triangles and build time"]
        answer_index: 3
