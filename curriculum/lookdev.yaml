    brief: "Nanite lets Unreal draw meshes with millions of triangles. Every Nanite mesh also contains a second, simpler version called the fallback mesh. Unreal uses the fallback for things like collision and ray tracing, and on platforms that cannot run Nanite. In this quest you look at the fallback mesh of a dense prop and learn the settings that control how detailed it is."
