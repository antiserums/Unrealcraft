      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/color-management-with-opencolorio-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/apply-color-conversion-to-the-level-viewport-and-play-in-editor-with-opencolorio-in-unreal-engine"
    checklist:
      - "Check that the OpenColorIO plugin is enabled. It is on by default in new projects."
      - "In the Content Browser, right-click and choose Miscellaneous, then OpenColorIO Configuration. Name the asset OCIO_Scene."
      - "Open OCIO_Scene. Keep the Configuration File at ocio://default, which is the built-in ACES CG config."
      - "Under Desired Color Spaces, add only two entries: a linear sRGB source and an sRGB monitor display view."
      - "In the Level Viewport, open View Mode, then OCIO Display. Pick OCIO_Scene, set the source and the destination, and then click Enable Display."
      - "Turn Enable Display on and off and compare the tone of your scene. Note what changed in the highlights, the brightest parts of the image."
      - "This step is optional. In a camera Blueprint, add a Create In-Game OpenColorIO Display Extension node on BeginPlay and test it while playing in the editor."
    done_when: "Send two screenshots of the same view, one with OCIO Display off and one with it on. Also send a screenshot of OCIO_Scene that shows its Configuration File and its Desired Color Spaces list."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Where do you create an OpenColorIO Configuration Asset?"
        choices: ["Content Browser right-click > Miscellaneous > OpenColorIO Configuration", "Project Settings > Rendering > Color", "Window > Color Management", "Edit > Plugins > OpenColorIO > New"]
        answer_index: 0
        explain: "The Quick Start creates the asset from the Content Browser context menu under Miscellaneous."
      - q: "Which string uses the built-in default ACES CG config, with no external file?"
        choices: ["file://Engine/OCIO/default.ocio", "ocio://default", "aces://cg", "config://aces-1.3"]
        answer_index: 1
        explain: "Built-in configs use ocio:// paths. ocio://default is the default ACES CG config and needs no external file."
