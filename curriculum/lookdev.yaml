      - q: "A dense mesh has 3 vertices for every triangle. What does this tell you?"
        choices: ["It is perfect for Nanite, because separate vertices are compressed better than shared ones", "The mesh has too few UVs, so the importer split every triangle to give each one a UV island of its own", "Every triangle has its own vertices, so the normals are fully faceted and the mesh is much more expensive", "It has no collision, so the vertices are not welded"]
        answer_index: 2
