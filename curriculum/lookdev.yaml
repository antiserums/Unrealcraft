    required_spine: false
    required: false
    title: Virtual textures, first look
    brief: "A virtual texture is a very large texture that Unreal cuts into small tiles, so that it only loads the tiles the camera can see. This lets a project use huge textures without using a huge amount of memory. There are two kinds: Streaming Virtual Textures (SVT), which are loaded from disk, and Runtime Virtual Textures (RVT), which are created while the game runs. In this quest you convert a large texture to a virtual texture and look at its tiles."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/virtual-texturing-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/streaming-virtual-texturing-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/runtime-virtual-texturing-in-unreal-engine"
    checklist:
      - "On the Virtual Texturing documentation page, read the table that compares Runtime Virtual Textures with Streaming Virtual Textures. Write one sentence about each."
      - "Import a large color texture with a power-of-two size (4096x4096 is enough) and name it T_Big_BC. Use it in a material named M_BigTest and put that material on a plane."
      - "In the Content Browser, right-click T_Big_BC and choose Convert to Virtual Texture. Read the list of materials in the Convert To window and click Ok."
      - "Open M_BigTest. Confirm that the Texture Sample node now shows VT in its corner and uses a Virtual sampler type."
      - "Play in the editor. In the console, type stat virtualtexturing, and then r.VT.Borders 1. Move around and look at the grid. Turn the grid off with r.VT.Borders 0."
    done_when: "Send one screenshot of the plane with r.VT.Borders 1 active and stat virtualtexturing on screen. Add your two sentences about RVT and SVT."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Which virtual texturing method makes its texel data on the GPU at runtime?"
        choices: ["Streaming Virtual Texturing", "Runtime Virtual Texturing", "Mip-based texture streaming", "UDIM"]
        answer_index: 1
        explain: "RVT texel data is generated by the GPU at runtime. SVT texel data is cooked and loaded from disk."
      - q: "How does Streaming Virtual Texturing decide what to load?"
        choices: ["It loads the full mip level of any texture on a visible object", "It loads all textures at startup", "It loads textures based on actor names", "It splits mips into small fixed-size tiles and loads only the tiles that visible pixels use"]
        answer_index: 3
        explain: "SVT splits all mip levels into fixed-size tiles. The GPU finds which tiles visible pixels touch and the CPU loads only those."
      - q: "You enable Virtual Texture Streaming by hand on a texture and its material shows an error. What is the fix?"
        choices: ["Change the Texture Sample's Sampler Type to a Virtual type such as Virtual Color", "Reimport the texture", "Set the texture to Never Stream", "Delete the material"]
        answer_index: 0
        explain: "A virtual texture needs a Virtual Sampler Type. The conversion menu does this for you; manual conversion does not."
      - q: "What does r.VT.Borders 1 do?"
        choices: ["Draws a mip visualization grid on materials that use streaming virtual textures", "Adds a border color to all textures", "Disables virtual texturing", "Increases the tile border size"]
        answer_index: 0
        explain: "The page says r.VT.Borders 1 draws a mip visualization grid on SVT materials and r.VT.Borders 0 hides it."
      - q: "How does the cost of sampling a virtual texture compare to a regular texture?"
        choices: ["It is always cheaper", "It is the same", "It is always more expensive, with at least two texture fetches plus some math", "It is free when Nanite is enabled"]
        answer_index: 2
        explain: "Virtual textures always cost more than a regular sample. Stacks that share the same UVs can be combined, up to 8, to save fetches."
      - q: "What happens when you import an image that uses the UDIM naming convention?"
        choices: ["Each image becomes a separate texture asset", "Unreal groups the images with the same base name and different four-digit numbers into a single Virtual Texture asset", "The import fails", "The images are merged into one 8K texture on disk"]
        answer_index: 1
        explain: "UE scans the folder for images with the same BaseName and a different four-digit coordinate and imports them as one Virtual Texture asset."
    flavors:
      _default: {why: "Virtual textures are how modern projects use huge textures without huge memory. Know when they help and what they cost."}
