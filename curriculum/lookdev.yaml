    title: Fog particles for a low valley
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/volumetric-fog-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/exponential-height-fog-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/local-fog-volumes-in-unreal-engine"
    checklist:
      - "Open an outdoor level with a low area. Place an Exponential Height Fog, enable Volumetric Fog, and keep the Fog Density low. Give the Directional Light a Volumetric Scattering Intensity of 1."
      - "Create M_FogSphere. Set Material Domain to Volume. Multiply a SphereMask (Absolute World Position against Particle Position, radius from Particle Radius) by a tiling noise texture and plug it into Extinction. Plug a constant 1 into Albedo."
      - "Create a simple Niagara sprite system NS_LowFog with a few large, slow particles. Assign M_FogSphere in its Sprite Renderer. Place it in the low area."
      - "Screenshot the valley with NS_LowFog hidden and visible from the same camera bookmark."
      - "Place a Spot Light in the fog. Toggle Cast Volumetric Shadow on and off and read stat GPU or profilegpu for both."
      - "Set Scattering Distribution on the fog to 0.9 and look toward and away from the sun. Then set it back to the default."
      - "Add a flickering light (Blueprint or Sequencer). If it leaves trails in the fog, set its Volumetric Scattering Intensity to 0."
    done_when: "Two screenshots from the same bookmark (fog particles hidden and visible), the GPU cost with Cast Volumetric Shadow off and on, and one line on what the noise texture did to the fog edge."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What do the outputs of a Volume-domain material describe, and what are their ranges?"
        choices: ["Color and Alpha, any value", "Base Color, Roughness and Opacity, all 0 to 1", "Albedo in 0 to 1, plus Emissive and Extinction as world space densities greater than 0", "Only Extinction, from 0 to 1"]
        answer_index: 2
        explain: "Volume materials describe Albedo, Emissive and Extinction at a point in space. Albedo is 0 to 1; Emissive and Extinction are world space densities above 0."
      - q: "Where do Volume-domain materials currently work, per the documentation?"
        choices: ["Only on particles, with positions inside the particle radius valid, usually handled by a SphereMask", "Only on Landscape", "Only on Post Process Volumes", "On any static mesh"]
        answer_index: 0
        explain: "Volume materials currently only work on particles. Positions inside the particle radius are valid, which is usually handled with a SphereMask."
      - q: "A Spot Light in Volumetric Fog gets Cast Volumetric Shadow enabled. What does that cost?"
        choices: ["It disables the light's regular shadows", "It doubles the fog resolution", "Nothing extra", "Roughly three times the cost of the same unshadowed light in the fog"]
        answer_index: 3
        explain: "Point and Spot Lights with Cast Volumetric Shadow are approximately three times more expensive because they contribute to the volume texture shadowing."
      - q: "A muzzle flash leaves a glowing trail in the fog. Why, and what is the fix?"
        choices: ["The fog Albedo is too high; lower it", "Temporal reprojection smooths the low-resolution voxels, so fast-changing lights leave trails; set that light's Volumetric Scattering Intensity to 0", "The light has no shadow; enable Cast Volumetric Shadow", "The fog View Distance is too small"]
        answer_index: 1
        explain: "Volumetric Fog uses heavy temporal reprojection on low-resolution frustum-aligned voxels, so fast lights leave trails. Set their Volumetric Scattering Intensity to 0."
      - q: "You want strong light shafts without fogging the whole scene. Which approach does the documentation give?"
        choices: ["Keep global density low, raise the Directional Light's Volumetric Scattering Intensity and set Scattering Distribution near 0.9, or add density locally with Volume particles", "Enable Fog Max Opacity", "Increase Start Distance", "Raise global Fog Density until shafts appear"]
        answer_index: 0
        explain: "Keep global fog low, use a higher Volumetric Scattering Intensity on the Directional Light and Scattering Distribution near 0.9, or add local density with Volume particles."
      - q: "What happens when you raise the Volumetric Fog View Distance a lot?"
        choices: ["Lights stop contributing", "The fog becomes sharper", "The fixed number of Z slices is stretched, causing under-sampling artifacts; r.VolumetricFog.GridSizeZ can add slices at a cost", "The fog turns off beyond 10 km"]
        answer_index: 2
        explain: "The fog volume texture has a limited number of Z slices over the View Distance. A larger distance under-samples. r.VolumetricFog.GridSizeZ raises the slice count but costs more."
      - q: "Which of these is listed as NOT supported by Volumetric Fog?"
        choices: ["Shadowing of Stationary Sky Lights", "IES profiles and Light Functions on Point and Spot Lights", "A Directional Light with a Light Function", "Particle lights"]
        answer_index: 1
        explain: "Known issues list IES profiles and Light Functions on Point and Spot Lights, Source Radius on those lights, and some Height Fog settings as unsupported."
      - q: "What mainly controls the GPU cost of Volumetric Fog?"
        choices: ["The Fog Inscattering Color", "The Sky Light Cubemap Resolution", "The number of fog actors", "The volume texture resolution, which is set from the Shadow level of the Engine Scalability settings"]
        answer_index: 3
        explain: "The cost is primarily controlled by the volume texture resolution, which comes from the Shadow scalability level. Volume particles add cost by overdraw and instruction count."
    flavors:
      _default: {why: "Global fog is a mood. Local fog is a composition tool. Particles give you the local part."}
      tech_art: {why: "Volume particles are overdraw in 3D.", do: "Run profilegpu with 3 and with 30 fog particles overlapping and compare the volumetric fog pass."}
      level_design: {why: "Low fog hides floors and reveals routes.", do: "Fill one dead-end with fog particles and leave the true route clear, then ask a peer which way they would go."}

