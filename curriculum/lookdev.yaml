      - q: "Where should the expensive, camera-independent work in the material go?"
        choices: ["Before the Runtime Virtual Texture Output, so it is cached", "After the Runtime Virtual Texture Sample, so it runs per pixel", "In the Virtual Texture Feature Switch, on the No input", "In the RVT Volume, in its Details panel, under Bounds"]
        answer_index: 0
