    subjects: [instancing, optimization, props]
    required_spine: false
    required: false
    title: ISM or HISM for the prop kit
    brief: "When you place the same mesh many times, Unreal can draw all copies together as instances and avoid one draw call, one drawing job, for each copy. The Instanced Static Mesh component (ISM) and the Hierarchical Instanced Static Mesh component (HISM) both do this. In this quest you measure the draw calls of 100 separate props, batch them into instances, and build a shelf Blueprint with each of the two component types."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/instanced-static-mesh-component-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-instancing-in-unreal-engine"
    checklist:
      - "Place 100 copies of one book mesh or brick mesh as separate Static Mesh Actors. In the console, type stat unit and stat rhi, and note the number of draw calls."
      - "Select all 100 actors. Open Actor, then Merge Actors, then Merge Actors Settings. Choose the Batch method and click Merge Actors. Note the draw calls again."
      - "Open the Details panel of the new actor. Click one instance and confirm that you can only edit its transform. Then change the material on the component and see all instances update."
      - "Create a Blueprint named BP_Shelf with an Instanced Static Mesh component. Set its Static Mesh, and add 10 instances with the + button in the Instances category."
      - "Duplicate BP_Shelf and name the copy BP_Shelf_HISM. Use a Hierarchical Instanced Static Mesh component in it. Write two lines: which component you would use for 5000 static pebbles, and which one for a project that uses only Nanite."
      - "On the ISM, enable Per Instance Custom Data by setting Num Custom Data Floats to 1. Use this value in the material to control the color, so that two shelves can look different without a new material instance."
    done_when: "Send a screenshot of the stat numbers before batching and after batching, and a screenshot of the components of BP_Shelf. Add your two lines of notes."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the main performance reason to use an Instanced Static Mesh component?"
        choices: ["It reduces texture memory", "It combines draw calls of identical meshes and lowers UObject memory", "It bakes lighting faster", "It enables Nanite on any mesh"]
        answer_index: 1
        explain: "An ISM combines the draw calls of identical static meshes. The page also gives a GPU example: a primitive uses about 672 bytes versus 64 bytes for an instance."
      - q: "You click one instance of an ISM in the Details panel. What can you edit?"
        choices: ["Only its transform", "Its material and collision", "Its LOD settings", "Its shadow settings"]
        answer_index: 0
