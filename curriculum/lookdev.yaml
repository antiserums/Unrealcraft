      - q: "What does the page say about Black Clip?"
        choices: ["It should be raised in every night scene", "It controls the bloom threshold", "It only works with LUTs", "In general it should not be adjusted"]
        answer_index: 3
        explain: "Black Clip sets where blacks start to cut off. The page says it should ideally never need to be adjusted."
      - q: "How should the Film settings be used in a project?"
        choices: ["Changed for each shot so that the curve matches the mood of it", "Animated during gameplay with a Timeline, so the curve follows the action", "Set once project-wide; use Color Grading for artistic changes", "Set only inside Cine Cameras, never in a volume"]
        answer_index: 2
        explain: "Film controls define one project-wide look. They should not change per shot or dynamically. Use the Color Grading properties for artistic adjustments."
      - q: "With the filmic tonemapper, a colored emissive surface gets extremely bright. What happens to its color?"
        choices: ["It becomes white, like a saturated film sensor", "It becomes more and more saturated as it gets brighter", "It becomes black above a value of 1", "It keeps the exact same color at any brightness"]
        answer_index: 0
        explain: "Emissive is physically correct: as power increases the color gets lighter, and when bright enough to saturate the film it becomes white. The legacy tonemapper just over-saturated."
