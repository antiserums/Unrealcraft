    brief: "The Pattern tool in Modeling Mode makes many copies of a mesh in a line, a grid or a circle. It is a quick way to build fences, tiled floors and rings of columns. The copies can be created as instances, which means Unreal draws them together as one group and saves performance. In this quest you make all three patterns and then edit and convert the instances."
