  - id: EAQ101
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [post-process, bloom, lens-effects]
    required_spine: false
    required: false
    title: Convolution bloom and a dirt mask
    brief: "Bloom is the soft glow that appears around very bright parts of the picture, such as lamps and glowing materials. Unreal has two methods: Standard, which is fast, and Convolution, which uses a picture called a kernel to give the glow a realistic shape but costs more. A dirt mask adds the look of dust on the lens where the glow is. In this quest you set up both bloom methods, add a dirt mask, and measure the cost."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/bloom-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, and work in a dark place, such as a closed room built from cubes. Place a Post Process Volume named PPV_Bloom with Infinite Extent enabled. Put one strong emissive object or light source in view."
      - "Open Lens, then Bloom, and keep Method on Standard. Try Intensity at 0, 1 and 5. Then set a Threshold so that only your bright source glows."
      - "Switch Method to Convolution. Assign the default kernel texture, or your own, and compare the shape of the glow."
      - "Open the kernel texture. Check that Mip Gen Settings is set to No Mipmaps and that Never Stream is enabled."
      - "Enable Dirt Mask Texture and assign a small dirt texture. You can make one in any image editor: a black image with a few soft gray smudges. The documentation recommends a size that is not a power of two, for example 960 x 540, because Unreal then makes no mipmaps for it and does not stream it. Set Dirt Mask Intensity so that the dirt only shows near the bright source."
      - "Switch back to Standard and use stat gpu to note the difference in frame time between the two methods."
    done_when: "Send three screenshots of the same view: Standard bloom, Convolution bloom, and Convolution with the Dirt Mask. Add one line with the two stat gpu numbers."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which bloom method should most games ship with, according to the docs?"
        choices: ["Convolution, because it is energy conserving and cheaper", "Either, they cost the same", "Standard, because of its large performance advantage", "Convolution, because Standard cannot be tinted"]
        answer_index: 2
        explain: "Convolution is meant for cinematics or high-end hardware. Standard bloom has a significant performance advantage and is recommended for most game applications."
      - q: "What is a known drawback of Standard bloom compared with Convolution?"
        choices: ["It is not conservative and can brighten the whole image", "It cannot be faded over time with a Post Process Volume", "It only works on mobile", "It needs a kernel texture, which uses more memory than a Convolution setup does"]
        answer_index: 0
        explain: "The page says Standard bloom is not conservative, so it can result in an overall brightening, and it lacks the visual complexity of Convolution."
      - q: "Where do you switch to Convolution bloom?"
        choices: ["Project Settings > Rendering > Bloom, Default Method set to Convolution for all levels", "The Film section of the Post Process Volume, Method set to Convolution", "The Texture Editor of the kernel image, with Use as Convolution Kernel turned on there", "The Lens section of the Post Process Volume, Method set to Convolution"]
        answer_index: 3
        explain: "In the Post Process Volume, under Lens, the Method dropdown offers Convolution."
      - q: "Which two Texture Editor settings keep a kernel image at full quality?"
        choices: ["sRGB on and Compression None", "Mips Gen Setting No Mipmaps and Never Stream enabled", "Power of two size and Streaming Priority set to highest", "Texture Group UI and Filter Nearest, with a Power Of Two mode"]
        answer_index: 1
        explain: "The kernel must be fully on the GPU at full resolution. The docs set No Mipmaps and enable Never Stream."
      - q: "The bloom from your kernel is offset from the light source. Which property fixes a slightly off-center kernel?"
        choices: ["Convolution Center", "Convolution Scale", "Convolution Buffer", "Convolution Boost"]
        answer_index: 0
        explain: "The system expects the hottest point in the center of the kernel. Convolution Center adjusts this in UV coordinates."
      - q: "What Threshold value makes every scene color contribute to bloom?"
        choices: ["0", "1", "100", "-1"]
        answer_index: 3
        explain: "Threshold is in luminance units. The docs say a value of -1 makes all scene colors contribute."
      - q: "You put different Dirt Mask textures in two overlapping Post Process Volumes. What happens?"
        choices: ["They blend smoothly over the Blend Radius of each volume", "The Dirt Mask Texture cannot be blended between volumes", "The textures are averaged, half of each, in the area of overlap", "The engine multiplies both masks, so that the dirt of both shows"]
        answer_index: 1
        explain: "The Dirt Mask Texture property cannot be blended with other Post Process Volumes in the level."
      - q: "Why does the page recommend a non-power-of-two size for a dirt mask texture?"
        choices: ["It compresses better", "It renders sharper bloom, because each texel of the mask then maps to a single pixel on screen", "It avoids mip creation and streaming, so the settings are correct automatically", "Power-of-two textures are not allowed in post process settings and fail to load"]
        answer_index: 2
        explain: "A non-power-of-two image avoids mip creation and streaming. With a power-of-two size you must set those options yourself in the Texture Editor."
    flavors:
      _default: {why: "Bloom is the first thing a viewer reads as bright. Choosing the method and the threshold with intent keeps the image clean."}
      lookdev: {why: "Uncontrolled bloom hides material detail and flattens lighting.", do: "Set the threshold so only your intended hero light blooms, and show a before and after of a nearby surface."}
      cinematics: {why: "Convolution bloom gives shots the streaks and glows of a real lens.", do: "Try a custom kernel image and explain in one line what changed in the glow shape."}

  - id: EAQ102
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [post-process, lens-effects, film-grain]
    required_spine: false
    required: false
    title: Lens flares, fringe, vignette and grain
    brief: "Real camera lenses are not perfect, and their small faults are part of what makes a picture look filmed. Unreal can imitate four of them: lens flares (bright shapes caused by strong lights), chromatic aberration (color edges near the border of the image), vignette (darker corners) and film grain (fine noise). Small amounts add realism, but large amounts look like a cheap filter. In this quest you set up all four in a Post Process Volume with care."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/bloom-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, and work in a level with at least one strong light in view. Make a Post Process Volume named PPV_Lens with Infinite Extent enabled, or use an unbound volume that you already have. Open Lens, then Lens Flares. Set Intensity, and raise Threshold until only the brightest light makes a flare."
      - "Change BokehSize and BokehShape. Then edit one Tint entry and change its Alpha, which moves that flare along the screen."
      - "Open Lens, then Chromatic Aberration. Set a small Intensity, and raise Start Offset so that the center of the image stays clean."
      - "Open Lens, then Image Effects. Set Vignette Intensity to a low value that darkens only the corners."
      - "Open Film Grain. Set a low Film Grain Intensity, and give the shadows more grain than the highlights."
      - "Take one screenshot with all four effects on, and one with all four set to 0."
    done_when: "Send two screenshots, one with the effects on and one with the effects off. Also send a screenshot of the Lens and Film Grain sections that shows your values."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Why should the Lens Flare Threshold be as high as possible?"
        choices: ["Lower values disable the flare, so a high value is the only way to see the effect", "It avoids the cost of blurring content that is too dark to see", "High values make the flare more colorful and give it more ghosts", "The engine clamps values below 1, so a low value has the same result as a value of 1"]
        answer_index: 1
        explain: "Threshold is the minimum brightness that starts a flare. The docs say keep it high to avoid blurring content that is too dark to see."
      - q: "How does the performance cost of lens flare BokehSize scale?"
        choices: ["Linearly with size", "It has no cost", "With the number of lights", "With radius times radius"]
        answer_index: 3
        explain: "BokehSize is a percent of view width and its performance cost is radius x radius."
      - q: "In the lens flare Tints list, what does the Alpha value control?"
        choices: ["The position of the flare", "The transparency of the flare", "The size of the flare", "Whether the flare is enabled"]
        answer_index: 0
        explain: "For each Tint, the RGB defines the lens flare color and the Alpha is its position."
      - q: "Two overlapping volumes use different BokehShape textures. What does the engine do?"
        choices: ["Blends them over the Blend Radius of each of the volumes", "Uses a circle for both, until one of the volumes is removed", "BokehShape cannot be blended, so one wins", "Averages the two textures, pixel by pixel, in the overlap"]
        answer_index: 2
        explain: "The BokehShape property cannot be blended between Post Process Volumes."
      - q: "What does Chromatic Aberration Start Offset control?"
        choices: ["The delay in seconds before the effect appears after a camera cut in a sequence", "The color of the fringe, from red at 0 to blue at 1, with green in the middle of the range", "The number of color channels that are shifted, from the red one to the blue one", "The normalized distance from the framebuffer center where the effect starts"]
        answer_index: 3
        explain: "Start Offset is a normalized distance to the center of the framebuffer where the color separation takes place."
      - q: "What does a Vignette Intensity of 0 mean?"
        choices: ["No vignetting", "Full darkening of the corners", "The vignette follows the camera aperture", "A white vignette"]
        answer_index: 0
        explain: "Larger values increase the darkening of the corners. 0 is no vignetting."
      - q: "Which statement about Film Grain Intensity is correct?"
        choices: ["It is measured in luminance units", "Values above 1 add color noise", "0 is no grain and 1 is full grain", "It only works with Convolution bloom"]
        answer_index: 2
        explain: "Film Grain Intensity goes from 0 (no film grain) to 1 (full film grain), with separate controls for shadows, midtones and highlights."
      - q: "What does the Dirt Mask do to the image?"
        choices: ["Adds scratches to the material of every surface", "Brightens the bloom in areas defined by a texture", "Blurs the edges of the screen with a texture", "Replaces the lens flare shape with a texture"]
        answer_index: 1
        explain: "Dirt Mask is a texture-driven effect that brightens up the bloom in defined areas of the screen, like dust on a lens."
    flavors:
      _default: {why: "Lens effects sell the idea of a camera. Small amounts add realism; large amounts look like a filter."}
      lookdev: {why: "A vignette and a little grain can pull the eye to the center of your composition.", do: "Show one reviewer both screenshots without saying which is which and write down what they noticed."}
      gameplay_design: {why: "Chromatic aberration and vignette are common feedback effects for damage or low health.", do: "Note which values you would animate for a damage hit and which you would leave alone."}

  - id: EAQ103
