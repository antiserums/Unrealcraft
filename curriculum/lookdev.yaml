        choices: ["SSR only reflects what is visible on screen", "SSR only works on metals, and the prop is plastic", "SSR ignores props that are set to Movable mobility", "The Blend Radius of the volume is too small"]
        answer_index: 0
        explain: "SSR is limited to information on the screen. Objects off screen or hidden behind others cannot appear in the reflection."
      - q: "What is the runtime cost of Reflection Capture Actors?"
        choices: ["Very high, because they render the level again each frame", "None, they are captured before runtime and are static", "Medium, because they update on every frame at a low resolution", "They only cost memory on mobile devices"]
        answer_index: 1
