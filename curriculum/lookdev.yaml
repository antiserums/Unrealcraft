        choices: ["The whites and highlights", "The mid-tones only", "The color temperature", "The blacks and shadows"]
        answer_index: 3
        explain: "Offset adjusts the luminance of the image's blacks (shadows). Small amounts lift or lower the dark areas."
      - q: "Why does Unreal do color correction in scene-referred linear space instead of a LUT after tonemapping?"
        choices: ["Because LUTs are slower to render", "So one grade looks correct on both HDR and LDR displays", "Because LUTs cannot change saturation", "Because linear space has no black point"]
