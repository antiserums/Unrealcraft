    subjects: [rendering, tsr, screen-percentage, performance]
    required_spine: false
    required: false
    title: Screen percentage and TSR
    brief: "Screen percentage is the size at which Unreal draws the scene, compared with the size of your screen. At 50 percent the scene is drawn with far fewer pixels, which is much faster. Temporal Super Resolution, or TSR, is the system that then scales this smaller picture up to full size and keeps it sharp by using information from earlier frames. In this quest you lower the screen percentage step by step and measure what TSR does and what it costs."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/temporal-super-resolution-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/screen-percentage-with-temporal-upscale-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open a level with some thin geometry in view, such as a fence, wires or foliage. Cylinders that you scale into thin poles and wires work. In the Viewport Options menu, open Stat, then Engine, and enable TSR. You can also type stat tsr in the console."
      - "In Viewport Options, open Screen Percentage and enable Custom Override. Set it to 100, then 66, then 50. Write down the values TSR feed and TSR 1spp for each."
      - "Open Stat, then Advanced, and enable GPU. Note the cost of TemporalSuperResolution at 100 percent and at 50 percent."
      - "Open Show, then Visualize, and enable Temporal Upscaler I/O. This is the VisualizeTemporalUpscaler view. Take a screenshot of the view that shows the input and the output."
      - "Open Settings, then Engine Scalability Settings, and switch the Anti-Aliasing group between Medium and Epic. Look at the same thin geometry each time, such as a fence, wires or foliage."
      - "Open the file Engine/Config/BaseScalability.ini and find the AntiAliasingQuality sections. Note two r.TSR variables that change between the quality levels."
    done_when: "Send a screenshot of the Temporal Upscaler I/O view. Add a small table that lists, for screen percentage 100, 66 and 50, the TSR feed, the TSR 1spp and the GPU cost."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the main promise of Temporal Super Resolution?"
        choices: ["Path-traced quality in real time, on any graphics card that supports DirectX 12", "Image quality near native 4K from a lower internal resolution, at a fraction of the cost", "Perfect anti-aliasing with no ghosting at all, at the same cost as rendering at native 4K", "Higher resolution textures, loaded from a lower mip"]
        answer_index: 1
        explain: "TSR renders a lower internal resolution and accumulates frames, giving near-4K quality from inputs as low as 1080p while reducing GPU frame time."
      - q: "Where in the rendering chain does TSR happen?"
        choices: ["After depth of field, and everything after it (motion blur, bloom) is upscaled", "Before the base pass, so that every later pass is rendered at the full output resolution", "After the tonemapper, so that bloom and motion blur are still at the lower resolution", "After the UI is drawn, so widgets and text are upscaled with the rest of the frame"]
        answer_index: 0
        explain: "TSR happens after depth of field. Motion blur, bloom and later passes then run on the upscaled image."
      - q: "What does stat tsr add compared to stat unit?"
        choices: ["Draw call counts", "Shader compile times", "Texture streaming pool size", "TSR feed and TSR 1spp"]
        answer_index: 3
        explain: "TSR stats show the same frame information plus TSR feed (megapixels per second fed into TSR) and TSR 1spp (convergence time)."
      - q: "At 50 percent screen percentage and 60 Hz, how long does TSR need to reach one sample per pixel?"
        choices: ["16.6 ms", "33.3 ms", "66.6 ms", "133.3 ms"]
        answer_index: 2
        explain: "TSR 1spp = 1000 / (0.5 squared x 60) = 66.6 ms. At 50 percent you need four frames for one sample per pixel."
      - q: "Which console variable sets the anti-aliasing scalability group, and what does 4 mean?"
        choices: ["sg.AntiAliasingQuality, 4 = Cinematic", "r.TSR.Quality, 4 = Ultra", "r.ScreenPercentage, 4 = 400 percent", "sg.PostProcessQuality, 4 = Epic"]
        answer_index: 0
        explain: "sg.AntiAliasingQuality uses 0 Low, 1 Medium, 2 High, 3 Epic and 4 Cinematic."
      - q: "How do you set a custom rendering resolution for an editor viewport?"
        choices: ["Project Settings > Rendering > Editor Viewport Resolution", "r.SetRes in the console, with the size and a w", "Viewport Options > Screen Percentage with Custom Override", "Window > Viewport Resolution > Custom Screen Percentage"]
        answer_index: 2
        explain: "Editor viewports have their own Screen Percentage setting in the Viewport Options menu, with a Custom Override checkbox."
      - q: "When is a screen percentage below 50 percent a reasonable choice?"
        choices: ["Always, because it is the fastest setting and TSR hides the difference at every output resolution", "Only when targeting a display above 4K, or in exceptional dynamic resolution cases on consoles", "Never, the engine clamps the value at 50 percent", "Only in the editor, where image quality does not matter, and never in a build that you ship"]
        answer_index: 1
        explain: "The page says extreme upscaling below 50 percent should only be considered for displays greater than 4K or exceptional dynamic resolution cases on consoles."
      - q: "With a 1920x1080 output and 83 percent screen percentage, roughly what size are the render targets before upscaling?"
        choices: ["1280x720", "1920x1080", "2304x1296", "1600x900"]
        answer_index: 3
        explain: "The screen percentage page gives this example: at 83 percent, the render targets are resized to about 1600x900 before being upscaled to 1920x1080."
    flavors:
      _default: {why: "Screen percentage is the biggest single performance dial, and TSR is what makes a low value still look good."}
      lookdev: {why: "Thin details like wires, fences and grass are the first to break under upscaling.", do: "Find the lowest screen percentage where your thinnest detail still reads and write it down."}
      tech_art: {why: "Scalability groups are how a project ships TSR settings per platform.", do: "Copy one AntiAliasingQuality section into your project's DefaultScalability.ini and change one value on purpose."}

  - id: EAQ106
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [post-process, hdr, color-management]
    required_spine: false
    required: false
    title: HDR display output, first test
    brief: "An HDR display can show much brighter highlights and more colors than a normal display, which is called SDR. Unreal can send an HDR picture to such a display, and it uses the ACES color standard to convert the image correctly. Even if your monitor is SDR today, it helps to know which console variables control this. In this quest you read about the ACES steps, turn HDR output on with console variables, and write down what happened."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/high-dynamic-range-display-output-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-lookup-tables-for-color-grading-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Read the ACES Viewing Transform section of the documentation page linked on this quest. Write the three steps LMT, RRT and ODT in your own words."
      - "In the console, set r.AllowHDR 1. Then set r.HDR.Display.OutputDevice 3 and r.HDR.Display.ColorGamut 2. Write down what each value means."
      - "Play in a new window and press Alt+Enter to switch to exclusive fullscreen. Set r.HDR.EnableHDROutput 1 and look at the result."
      - "If you have an HDR display, check that its HDR mode is on and note how the highlights changed. If you do not have one, describe what you saw and why the documentation page says it may not work."
      - "Set r.HDR.UI.CompositeMode 1 and r.HDR.UI.Level 1.5. Then look at a HUD or a menu widget to see how the user interface is shown."
      - "Reset everything with r.HDR.EnableHDROutput 0 and r.HDR.Display.OutputDevice 0."
    done_when: "Send a short text of 5 to 10 lines with your summary of the three ACES steps, the console variables you set and what they mean, and what happened on your display, whether it is HDR or not."
    xp: 60
    verify_type: writeup
    quiz:
      - q: "What is a scene-referred image?"
        choices: ["An image that is already converted to the color space and brightness range of the display", "A screenshot with a LUT applied, saved with the color space of the display that it was made on", "An image that keeps the original linear light values without limiting exposure range", "An image tone mapped for sRGB"]
        answer_index: 2
        explain: "Scene-referred images keep the original linear light values. Display-referred is the final image in the color space of the display."
      - q: "In what order does the ACES Viewing Transform run?"
        choices: ["ODT, RRT, LMT", "RRT, LMT, ODT", "LMT, ODT, RRT", "LMT, RRT, ODT"]
        answer_index: 3
        explain: "The look (LMT) is applied first, the RRT converts scene-referred to display-referred, and the ODT matches the specific output device."
      - q: "What does r.HDR.Display.OutputDevice 3 select?"
        choices: ["ACES 1000-nit ST-2084 (Dolby PQ)", "sRGB (LDR) for a normal monitor", "Rec709 (LDR) for a normal TV set", "ACES 2000-nit ST-2084 (Dolby PQ)"]
        answer_index: 0
        explain: "0 is sRGB, 1 Rec709, 2 explicit gamma, 3 ACES 1000-nit ST-2084 (PQ), 4 ACES 2000-nit ST-2084, 5 and 6 are ScRGB."
      - q: "Which r.HDR.Display.ColorGamut value selects Rec2020?"
        choices: ["0", "1", "2", "3"]
        answer_index: 2
        explain: "0 is Rec709/sRGB, 1 DCI-P3, 2 Rec2020/BT2020, 3 ACES and 4 ACEScg."
      - q: "HDR output does not switch on in your borderless window. Why?"
        choices: ["You must restart the editor before HDR output can be enabled in any window mode", "The Post Process Volume needs HDR enabled in its settings before the window can switch modes", "Only packaged builds support HDR", "Borderless and windowed modes do not currently work for HDR output; use exclusive fullscreen"]
        answer_index: 3
        explain: "The page says borderless window or windowed mode will not work for HDR output. Use exclusive fullscreen, for example with Alt+Enter."
      - q: "Your UI looks washed out with HDR on. What does the page recommend?"
        choices: ["Disable the UI while HDR is on, and draw it again in the tone mapper with a Post Process Material", "Enable r.HDR.UI.CompositeMode 1 and raise r.HDR.UI.Level to about 1.5 or 2", "Lower the exposure of the scene until the UI looks right, and raise r.HDR.UI.Level to 0.5", "Apply a LUT to the widget and lower its brightness until it matches the scene"]
        answer_index: 1
        explain: "Composite mode preserves the LDR look of the UI, and a level of 1.5 or 2 boosts it so it does not look washed out next to the HDR scene."
      - q: "Which display outputs are implemented today for HDR?"
        choices: ["Only the 400-nit path", "Any nit value that you type in", "1000-nit and 2000-nit paths only", "Only the 4000-nit ST-2084 path"]
        answer_index: 2
        explain: "The Notes say only paths for 1000-nit and 2000-nit display outputs are implemented."
      - q: "Why does the LUT page say a LUT grade will not carry over to an HDR display?"
        choices: ["A LUT works on the final LDR sRGB image after output, while the Color Grading properties work in scene-referred linear space before tone mapping", "LUTs are too small to hold the range of an HDR display, so their colors are stretched and show banding", "LUTs only support Rec2020, so they have to be made again for each display that uses another color space", "HDR output turns off all post processing after the tone mapper, so the LUT step is skipped, while the Color Grading properties run before that step"]
        answer_index: 0
        explain: "LUTs happen in LDR on the sRGB output, so the correction does not transfer to other displays. Color Grading properties happen before tone mapping and stay consistent."
    flavors:
      _default: {why: "HDR output is where the ACES pipeline pays off. Knowing the switches helps even if your monitor is SDR today."}
      lookdev: {why: "A scene graded only with LUTs can fall apart on an HDR screen.", do: "Check whether your scene uses a LUT and note which Color Grading properties would replace it."}
      programming: {why: "Shipping HDR means exposing these settings through Game User Settings.", do: "Find the GameUserSettings Blueprint nodes for HDR and describe what they clamp to."}

  - id: EAQ107
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [viewport, composition, cine-camera]
    required_spine: false
    required: false
    title: Cinematic Viewport for framing stills
    brief: "The Cinematic Viewport is a special viewport mode for camera work. It can draw helper lines over the picture, such as a 3x3 grid, safe areas and a letterbox mask, so you can see composition rules while you frame a shot. In this quest you turn the Cinematic Viewport on, use its overlays to frame a still image of a prop, and set up a second viewport that does not follow the camera."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-viewport-controls-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-depth-of-field-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, and place a main prop to frame, such as a mannequin or a group of cubes. Create a Level Sequence named LS_Stills and click the Camera button in Sequencer, which adds a Cine Camera Actor with a Camera Cuts track. Keep Sequencer open."
      - "In the Perspective menu of the viewport, enable Cinematic Viewport."
      - "Open Film Overlays and turn on Grid (3x3). Frame the main prop so it sits on one of the points where the lines cross."
      - "Turn on Action Safe and Title Safe. Change the Custom Safe percentage and give it a new color."
      - "Enable Letterbox Mask at 2.35:1. On the camera, enable Constrain Aspect Ratio so that the mask matches the filmback, which is the sensor size of the camera."
      - "Use the playback controls at the bottom of the viewport to move through the sequence. Read the camera and filmback information shown above them."
      - "Open a second Perspective viewport and turn off Allow Cinematic Control on it. Confirm that only the first viewport follows the sequence camera."
    done_when: "Send a screenshot of the Cinematic Viewport that shows the 3x3 grid, the safe areas and the letterbox on your framed still. Also send a screenshot of the layout with two viewports where only one follows the camera."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "How do you turn a Level Viewport into a Cinematic Viewport?"
        choices: ["Window > Cinematics > Cinematic Viewport, and dock it over the Level Viewport", "Press Ctrl+Shift+C with the viewport in focus", "Open Sequencer and click Lock Viewport to Camera Cuts in its toolbar", "Select the viewport's Perspective menu and enable Cinematic Viewport"]
        answer_index: 3
        explain: "The page says to open the Viewport Perspective menu and enable Cinematic Viewport."
      - q: "Which composition overlay supports framing by the Rule of Thirds?"
        choices: ["Grid (2x2)", "Grid (3x3)", "Crosshair", "Rabatment"]
        answer_index: 1
        explain: "Grid (3x3) draws a three by three grid for Rule of Thirds framing. Rabatment is a different composition guide."
      - q: "What are the default sizes and colors of Action Safe and Title Safe?"
        choices: ["Action 90 percent yellow, Title 95 percent red", "Action 85 percent green, Title 80 percent blue", "Action 95 percent red, Title 90 percent yellow", "Both 100 percent white"]
        answer_index: 2
        explain: "Action Safe appears at 95 percent in red, Title Safe at 90 percent in yellow, and Custom Safe at 85 percent in green."
      - q: "Your letterbox does not match the camera's sensor. What must you enable?"
        choices: ["Constrain Aspect Ratio on the camera", "Allow Cinematic Control on the viewport", "Draw Debug Focus Plane on the camera", "Game View in the viewport options menu"]
        answer_index: 0
        explain: "The page says Constrain Aspect Ratio must be enabled on the camera for the letterboxing to be accurate for its sensor size."
      - q: "What is the default Letterbox Mask aspect ratio?"
        choices: ["16:9", "4:3", "2.35:1", "1.85:1"]
        answer_index: 2
        explain: "By default the letterbox aspect ratio is 2.35:1, and you can type a different ratio next to the entry."
      - q: "Why can you not set a safe area guideline to 0 percent or 100 percent?"
        choices: ["The field only accepts whole numbers between 10 and 90, in steps of ten percent", "The ranges are clamped between 1 and 99 percent so they stay fully visible", "Those values disable the overlay, so they are replaced by the nearest value that shows a frame", "Those two values are reserved for the letterbox mask and for the frame edge"]
        answer_index: 1
        explain: "Guideline ranges are clamped between 1 percent and 99 percent in order to remain fully visible."
      - q: "What information does the upper region of the cinematic controls show?"
        choices: ["The current sequence and camera name, the camera's filmback properties and the current time", "Frame rate and GPU time", "The list of all actors in the level that are bound to the current sequence, with their tracks", "The render output path and the file name format that Movie Render Queue would use for the shot"]
        answer_index: 0
        explain: "That area shows the name of the current sequence and camera, the camera's Filmback properties and the current time."
      - q: "Which viewports can have Allow Cinematic Control enabled?"
        choices: ["Any orthographic viewport, such as Top", "Only the Cinematic Viewport of the level", "All viewports at once, it cannot be turned off", "Only viewports in Perspective view mode"]
        answer_index: 3
        explain: "Allow Cinematic Control can only be enabled or disabled on Perspective viewports. You usually keep it on for one viewport and off for the others."
    flavors:
      _default: {why: "Overlays make composition rules visible while you work, instead of guessing after the render."}
      lookdev: {why: "Portfolio stills need safe margins and a deliberate aspect ratio.", do: "Reframe one existing bookmark using the 3x3 grid and letterbox, and show the old and new framing side by side."}
      cinematics: {why: "Multiple viewports with one cinematic view is the normal layout for shot work.", do: "Set up a two-viewport layout and note which one you use for blocking and which for the shot."}

  - id: EAQ108
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [pcg, set-dressing, splines, procedural]
    required_spine: false
    required: false
    title: Props on a spline with PCG Mode
    brief: "PCG stands for Procedural Content Generation. It is a system in Unreal where a graph of nodes places objects for you by rules, so you do not place each one by hand. PCG Mode adds tools on top of this that let you draw a spline or paint an area in the level, and a PCG graph then fills it with props. In this quest you build a graph that places props along a spline, make it usable as a tool, and make a second one that you paint with."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/pcg-editor-mode-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-content-generation-framework-node-reference-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-content-generation-overview"
    checklist:
      - "Open a project made from the Third Person template, or create one, and work in a level with a floor or a Landscape. Enable the Procedural Content Generation Framework plugin. Then create a PCG Graph named PCG_FenceProps."
      - "In PCG_FenceProps, connect these nodes in a row: Get Spline Data, then Spline Sampler, then Transform Points with a small random yaw and scale, then Static Mesh Spawner. Give the spawner three Mesh Entries, for example a post, a barrel and a crate, with different Weights, so some appear more often than others. Any three small meshes work, such as SM_Cylinder, SM_ChamferCube and SM_Cube from the folder LevelPrototyping/Meshes of the template."
      - "Open the Graph Settings. Under Tool Data, set Display Name to Fence Props, add SplineTool to Compatible Tool Tags, and enable Is Preset."
      - "Switch to PCG mode from the Modes dropdown. With nothing selected, choose the Draw Spline tool and pick your Fence Props preset. Draw an open spline along a path in the level and click Apply."
      - "Duplicate the graph and name the copy PCG_Rubble. Remove the spline nodes, keep the spawner, and set Compatible Tool Tags to PaintTool. In PCG mode, use the Paint tool to paint rubble on the ground. Hold Shift to remove points that land on the path."
      - "In the Raycast Rules, enable Ignore PCG Components. This stops you from painting on top of the props you already spawned."
    done_when: "Send one screenshot of the level that shows the props placed along the spline and the painted rubble. Also send one screenshot of PCG_FenceProps with its Tool Data settings visible."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "How do you open PCG Mode?"
        choices: ["Open the Modes dropdown and select PCG", "Press Shift+5 in a viewport", "Window > PCG Tools > Open PCG Mode in the Level Editor", "Right-click a PCG Volume and choose Edit Mode"]
        answer_index: 0
        explain: "The page says to open the Modes dropdown menu and select PCG. Shift+5 opens Modeling Mode."
      - q: "You start a PCG Mode tool with no actor selected. What happens?"
        choices: ["The tool does nothing until you select an actor", "An actor is created to perform the operation, based on the selected graph or preset", "The tool adds a PCG component to the PCGWorldActor and runs the graph on the whole level", "The tool asks you to create a new level for the graph, and opens it when you confirm the dialog"]
        answer_index: 1
        explain: "With no actor selected, an actor is created for the operation. With an actor selected, a PCG component is added to it if needed."
      - q: "Your new graph does not show up in the Draw Spline tool dropdown. What is the most likely cause?"
        choices: ["The graph has no Static Mesh Spawner node in it", "The graph is not saved in the Content folder of the project", "The graph's Compatible Tool Tags does not include SplineTool", "The graph has no Debug node on its output"]
        answer_index: 2
        explain: "You must set Compatible Tool Tags for the graph to appear in the matching tool's dropdown. The Draw Spline tool uses the SplineTool tag."
      - q: "What does the Draw Spline Surface tool do?"
        choices: ["Places objects only along the spline curve itself", "Creates a PCG volume by dragging a footprint on the ground and then a height above it", "Paints points where raycasts from the brush hit the world, and the graph runs on these painted points", "Defines a closed area bounded by a spline, and the graph populates the interior"]
        answer_index: 3
        explain: "Draw Spline Surface defines a spline-bound closed area, and the PCG graph fills the inside. Examples are fields, cornrows and grass."
      - q: "While using the Paint tool, how do you remove points you already painted?"
        choices: ["Hold Shift while painting; the brush turns red", "Hold Ctrl while painting; the brush turns blue", "Click the Cancel button in the tool panel", "Set Data Instance to 0 and paint over the points one more time"]
        answer_index: 0
        explain: "Holding Shift removes points and the brush becomes red. Cancel discards the whole tool operation, not single points."
      - q: "Which Raycast Rule stops the tool from interacting with meshes that PCG itself created?"
        choices: ["Constrain to Actor", "Ignore PCG Components", "Allowed Classes", "Landscape"]
        answer_index: 1
        explain: "Ignore PCG Components rejects interaction on PCG-created components. Constrain to Actor only accepts hits on the selected actor."
      - q: "A Static Mesh Spawner has four Mesh Entries, each with Weight 1. What is the chance of each mesh spawning at a point?"
        choices: ["100%, all four spawn at every point", "50%", "25%", "It depends on the point density"]
        answer_index: 2
        explain: "Weights are summed and each weight is divided by the sum. Four entries with weight 1 give 25% each."
      - q: "You want the Spline Sampler to sample points inside the spline area, not just on the curve. What must be true?"
        choices: ["The spline must be an open spline", "The spline must be closed", "The spline must have at least 10 points", "The graph must use Hierarchical Generation"]
        answer_index: 1
        explain: "The node reference says sampling inside the spline requires the spline to be closed."
    flavors:
      _default: {why: "PCG Mode lets you place procedural props by drawing and painting, so set dressing stays fast to change."}
      lookdev: {why: "Fences, rubble and roadside props are the bulk of set dressing. A tool graph makes them one drag instead of hundreds of placements.", do: "Add a fourth Mesh Entry with Weight 0.2 so a rare hero prop appears only sometimes."}
      level_design: {why: "You can block out fences and clutter along routes and move the spline when the route changes.", do: "Draw the spline along your main route and note how the props follow when you move a spline point."}

  - id: EAQ109
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [foliage, procedural, vegetation]
    required_spine: false
    required: false
    title: Forest with priority and blocking volumes
    brief: "The Procedural Foliage tool grows a forest for you by simulating how plants spread. Each type of tree has rules, such as how much shade it makes and whether it can grow in the shade of others, so the types compete for space the way real plants do. In this quest you set up a spawner with a big tree and a small tree, adjust their rules, and use a blocking volume to keep an area free of trees."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-foliage-tool-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/foliage-mode-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a level with a Landscape, or create a new level and make a Landscape in Landscape Mode. Open Editor Preferences, then Experimental, and enable Procedural Foliage. Create a Procedural Foliage Spawner named PFS_Forest and scale it over a flat area of the landscape."
      - "Create two Static Mesh Foliage assets named SMF_TreeBig and SMF_TreeSmall and give each one a mesh. If you have no tree meshes, SM_Cylinder can stand in for the big tree and SM_ChamferCube for the small one. Both are in the folder LevelPrototyping/Meshes of the template. Add both to the Foliage Types of PFS_Forest and press Resimulate."
      - "In SMF_TreeBig, set Shade Radius to 50 and Overlap Priority to 2. In SMF_TreeSmall, set Overlap Priority to 1 and enable Can Grow in Shade and Spawns in Shade. Press Resimulate and look at how the small trees fill the space around the big ones."
      - "Change Num Steps to 0 on SMF_TreeBig and press Resimulate. Then set it back to 3. Lower Initial Seed Density until the edge of the forest looks natural."
      - "In the Instance Settings of both types, set Cull Distance Max to 20000."
      - "Place a Procedural Foliage Blocking Volume over an area that should stay free, such as a path or the place where a building would stand, and press Resimulate. No trees should appear inside the volume."
    done_when: "Send two screenshots, one of the forest before the blocking volume and one after it. Also send one screenshot of the Procedural settings of SMF_TreeSmall (Collision, Clustering and Growth)."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Where do you enable the Procedural Foliage tools before using them?"
        choices: ["Edit > Plugins > Foliage > Procedural Foliage, then restart", "Editor Preferences > Experimental > Procedural Foliage", "Project Settings > Rendering > Enable Procedural Foliage", "Foliage Mode > Settings > Procedural Foliage Spawner > Enable"]
        answer_index: 1
        explain: "The page says to open Editor Preferences, go to the Experimental section and enable Procedural Foliage."
      - q: "Two foliage types compete for the same spot. One Virtual Seed's collision radius overlaps another seed's shade radius. Which seed survives?"
        choices: ["The one that was spawned first by the simulation", "The one whose mesh has the larger bounds in the level", "The one from the foliage type with the higher priority", "Both survive and overlap each other"]
        answer_index: 2
        explain: "When radii overlap, one Virtual Seed is replaced or killed based on which Foliage Type has the higher priority."
      - q: "You set Num Steps to 0 on a tree type. What changes in the result?"
        choices: ["No trees spawn at all, in any volume", "All trees are the same size and age", "Trees spawn only inside blocking volumes", "Trees grow for 10 years, the default"]
        answer_index: 1
        explain: "Num Steps is the number of growth years. At 0 the trees are all the same size and age; the tutorial sets it back to 3 to spread them."
      - q: "The forest is too dense. Which setting does the tutorial lower first to fix this?"
        choices: ["Initial Seed Density", "Max Age", "Cull Distance", "Procedural Scale Max"]
        answer_index: 0
        explain: "Setting Initial Seed Density to 0.25 greatly reduced the density. Max Age and Procedural Scale control growth, not count."
      - q: "What does the Procedural Foliage Blocking Volume do?"
        choices: ["It marks where foliage should be denser than in the rest of the spawner", "It prevents the spawner from placing foliage inside its bounds", "It stops the player from walking into the foliage inside its bounds", "It hides foliage beyond a distance from the camera, to save draw calls"]
        answer_index: 1
        explain: "The blocking volume prevents the Procedural Foliage Spawner from spawning any Foliage Type inside its bounds."
      - q: "Which section of a Static Mesh Foliage asset holds Cull Distance, Shadowing and Collision for the placed instances?"
        choices: ["Placement", "Clustering and Growth", "Collision Settings", "Instance Settings"]
        answer_index: 3
        explain: "Instance Settings controls how the mesh instances are displayed, including Cull Distance, Shadowing and Collision."
      - q: "You want a small tree species to appear under the canopy of big trees. Which two options do you enable on the small tree?"
        choices: ["Align to Normal and Random Yaw", "Can Grow in Shade and Spawns in Shade", "Merge Physics Data and Overlap Priority", "Resimulate and Num Steps"]
        answer_index: 1
        explain: "The tutorial enables Can Grow in Shade and Spawns in Shade on the second species so it interacts with the shade of the first."
      - q: "After pressing Resimulate the lighting looks wrong. What does the page say you must do to see the proper result?"
        choices: ["Restart the editor and resimulate", "Click Build in the main toolbar to rebuild lighting", "Delete the spawner and place a new one in the level", "Lower Initial Seed Density and click Resimulate again in the Details panel"]
        answer_index: 1
        explain: "The page notes that you need to click Build to rebuild lighting every time you use Resimulate, and that it can take a long time."
