    title: Blend modes and lit translucency
    brief: "The Blend Mode of a material decides how it mixes with what is behind it. Opaque is fully solid, Masked cuts holes, Translucent is see-through, and Additive and Modulate make the background brighter or darker. See-through materials also have a Lighting Mode that decides how well they receive light. In this quest you build one test material for each blend mode and compare three lighting modes."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/material-blend-modes-in-unreal-engine"
