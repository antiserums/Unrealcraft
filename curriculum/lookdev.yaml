  - id: EAQ82
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [distance-fields, ambient-occlusion, sky-light, foliage]
    required_spine: false
    required: false
    title: "Distance fields that ground your props"
    brief: "A mesh distance field is data that Unreal stores for a mesh, which tells it how far any point in space is from the surface of that mesh. Unreal uses this for Distance Field Ambient Occlusion, or DFAO, which darkens places the sky light cannot reach, such as the ground under rocks and trees. This soft shadow makes props look like they stand on the ground. In this quest you turn distance fields on, look at them in the visualizer, and improve them for a rock or a tree."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/mesh-distance-fields-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/distance-field-ambient-occlusion-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-distance-field-ambient-occlusion-in-unreal-engine"
    checklist:
      - "Open Project Settings, then Engine, then Rendering, and find the Software Ray Tracing section. Enable Generate Mesh Distance Fields and restart the editor."
      - "In your terrain scene, set the Mobility of the Sky Light to Movable. Open Show, then Visualize, then Distance Fields Ambient Occlusion, and take a screenshot."
      - "Open Show, then Visualize, then Mesh Distance Fields. Find a rock or a tree that looks blurry or mostly white."
      - "Open that mesh in the Static Mesh Editor. In Build Settings, raise Distance Field Resolution Scale and apply. Read the size of the distance field in the corner of the viewport."
      - "For a tree or bush with a masked leaf material, enable Two-Sided Distance Field Generation and compare the result in the visualizer."
      - "In Foliage Mode, enable Affect Distance Field Lighting on the tree type only, and not on grass."
      - "On the Sky Light, adjust Min Occlusion and Occlusion Contrast until the underside of the trees is dark but not black."
    done_when: "Send a screenshot of the Mesh Distance Fields visualizer that shows your improved rock or tree. Also send a lit before and after of the same spot, with DFAO on and off."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What does a Signed Distance Field store for a static mesh?"
        choices: ["The mesh triangles at lower resolution", "A shadow map per light", "The distance to the nearest surface in a volume texture, positive outside and negative inside", "A baked ambient occlusion texture"]
        answer_index: 2
        explain: "An SDF stores the distance to the nearest surface in a volume texture. Points outside are positive and points inside are negative."
      - q: "Where do you raise the quality of one mesh's distance field?"
        choices: ["Project Settings > Rendering", "Distance Field Resolution Scale in the Static Mesh Editor Build Settings", "The Sky Light's Occlusion Max Distance", "The Foliage type's Density"]
        answer_index: 1
        explain: "Distance Field Resolution Scale is in the Static Mesh Editor Build Settings. Higher resolution captures more features but increases memory."
      - q: "In the Mesh Distance Fields visualizer, what does a mostly white area mean?"
        choices: ["The mesh has no distance field", "The resolution is too high", "The mesh is fully lit by the sky", "Many ray steps were needed to find the surface, for example at grazing angles or with two-sided fields"]
        answer_index: 3
        explain: "Whiter areas mean many steps were needed to find the intersection. Grazing angles and two-sided distance fields show more white."
      - q: "Why enable Two-Sided Distance Field Generation on a tree?"
        choices: ["Masked leaf surfaces with many holes cannot be represented as a solid surface, and two-sided fields work better for them", "It halves the memory cost", "It makes the tree cast hard shadows", "It is required for Nanite foliage"]
        answer_index: 0
        explain: "High-density masked meshes like trees cannot be represented as solid. Two-sided generation works well for foliage but has a higher ray marching cost."
      - q: "Why is Affect Distance Field Lighting off by default for foliage types?"
        choices: ["It only works with Lightmass", "Thousands of grass instances would overflow the tile culling buffer and cause artifacts", "Foliage has no distance field", "It disables instancing"]
        answer_index: 1
        explain: "Foliage like grass with tens of thousands of instances would overflow the tile culling buffer. Enable it only for the foliage types that need it."
      - q: "How does DFAO get turned on for a level?"
        choices: ["Add a Post Process Volume with AO", "Set the Directional Light to Movable", "Enable Lumen", "Enable Generate Mesh Distance Fields and set a Sky Light to Movable"]
        answer_index: 3
        explain: "DFAO needs Generate Mesh Distance Fields in the project and a Sky Light with Mobility set to Movable. Then it is enabled automatically."
      - q: "How are landscapes represented for distance field lighting?"
        choices: ["As a heightfield with approximate cone intersection, not as a mesh distance field", "They are ignored", "As one large mesh distance field", "As many small distance fields per component"]
        answer_index: 0
        explain: "Landscapes use a heightfield, not a mesh distance field. They can receive occlusion, but there is no self-shadowing or distance field shadowing from them."
      - q: "A material uses World Position Offset to sway a tree. What limitation applies?"
        choices: ["The tree loses its distance field entirely", "DFAO becomes twice as expensive", "Self-shadowing artifacts can appear because the distance field is generated offline and does not know about the deformation", "The Sky Light must be Static"]
        answer_index: 2
        explain: "Distance fields are generated offline. Materials that deform the mesh with WPO or displacement may cause self-shadowing artifacts."
    flavors:
      _default: {why: "Distance fields give soft sky occlusion under rocks and trees, so props stop floating."}
      tech_art: {why: "Distance fields also feed other features like GPU particle collision and material effects.", do: "Open Show > Visualize > Global Distance Field and compare it with the per-mesh visualizer near the camera and far away."}
      lookdev: {why: "Occlusion Tint and Contrast on the Sky Light are look controls, not just tech.", do: "Try an Occlusion Tint that matches your sky color and compare against pure grey."}

  - id: EAQ83
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [foliage, culling, scalability, materials]
    required_spine: false
    required: false
    title: "Foliage that fades instead of popping"
    brief: "Foliage is the name for the many plants and rocks you paint onto a landscape. To save performance, Unreal stops drawing foliage beyond a set distance, called the cull distance. If whole groups of plants vanish at once, the player notices it, which is called popping. In this quest you set cull distances, make the leaves fade out smoothly before they are removed, and try the setting that lowers foliage density on slower computers."
    time_min: 70
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/foliage-mode-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/mesh-distance-fields-in-unreal-engine"
    checklist:
      - "Open a landscape level that has at least two Static Mesh Foliage types: a bush with a masked leaf material, and a rock. Paint a wide field of both."
      - "On the bush type, set Start Cull Distance to 3000 and End Cull Distance to 5000. Fly the camera backward and watch whole groups vanish."
      - "Open the bush material. Add a PerInstanceFadeAmount node and multiply it into the Opacity Mask, so the leaves thin out before the end distance. Fly backward again."
      - "On the bush type, open Scalability and enable Enable Density Scaling. In the console, run foliage.DensityScale 0.3 and then foliage.DensityScale 1.0, and compare."
      - "Enable Affect Distance Field Lighting on the bush type only. Leave it off for types that are like grass."
      - "Sculpt the ground under some bushes again so that they float. Select those instances, move them above the ground, and press End to snap them down and attach them again."
      - "If the map uses World Partition, find Instanced Foliage Grid Size in Project Settings and note the default value."
    done_when: "Send two screenshots from the same far camera position: one where groups pop with no fade, and one with fading leaves. Also send a screenshot of the Foliage Details that shows the cull distances and Enable Density Scaling."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Why can foliage seem to disappear in groups at the End Cull Distance?"
        choices: ["Each instance has its own random cull distance", "Instances render as clusters in one draw call, and a whole cluster is culled when it goes out of range", "The landscape LOD hides them", "Culling happens per material, not per instance"]
        answer_index: 1
        explain: "Foliage instances are rendered as clusters in a single draw call. Beyond End Cull Distance the whole cluster is culled, so groups disappear abruptly."
      - q: "Which material node gives the per-instance fade factor between Start and End Cull Distance?"
        choices: ["PerInstanceRandom", "DistanceToNearestSurface", "PerInstanceFadeAmount", "CameraDepthFade"]
        answer_index: 2
        explain: "The vertex shader computes a per-instance fade from 1.0 at the start distance to 0.0 at the end. It is read with the PerInstanceFadeAmount node."
      - q: "What happens if the FadeMultiplier is set to zero?"
        choices: ["Foliage never fades", "Foliage fades only at the end distance", "The cull distance is ignored", "Foliage is invisible at any distance"]
        answer_index: 3
        explain: "Lowering FadeMultiplier speeds up the fade. A value of zero makes the foliage invisible at any distance."
      - q: "Which foliage is not affected by cull distance and instance fading?"
        choices: ["Nanite-enabled meshes", "Actor Foliage", "Static Mesh Foliage with LODs", "Foliage placed with the Single tool"]
        answer_index: 0
        explain: "The documentation states that Nanite-enabled meshes are not affected by culling distance and instance fading."
      - q: "What must be enabled for foliage.DensityScale to change a foliage type at runtime?"
        choices: ["Affect Distance Field Lighting", "Place in Current Level", "Align to Normal", "Enable Density Scaling in the type's Scalability section"]
        answer_index: 3
        explain: "Enable Density Scaling in the Foliage Details Scalability section lets the scalability system change how many instances render with foliage.DensityScale."
      - q: "Why is Static Mesh Foliage cheaper than Actor Foliage?"
        choices: ["It has no collision", "Static Mesh Foliage batches instances with hardware instancing, so many instances cost one draw call, while Actor Foliage costs like normal actors", "It uses lower LODs", "It is not rendered in shadows"]
        answer_index: 1
        explain: "Static meshes placed with Foliage Mode are grouped and rendered with hardware instancing. Actor Foliage has the same cost as placing normal actors."
      - q: "How do you reattach floating foliage instances to the ground after resculpting?"
        choices: ["Select them, move them above the target, and press End to snap them", "Repaint them", "Run the Reapply tool with Align to Normal", "Use the Fill tool"]
        answer_index: 0
        explain: "Select the instances, move them above the target component, and press End. They snap to the ground and are reparented to that component."
      - q: "In a World Partition map, what is the default Instanced Foliage Grid size?"
        choices: ["64 meters, the same as the World Partition grid", "128 meters", "256 meters, separate from the World Partition grid", "1 kilometer"]
        answer_index: 2
        explain: "The default Instanced Foliage Grid is 256 meters (25600 cm). It is separate from the World Partition grid size and can be changed in Project Settings."
    flavors:
      _default: {why: "Popping foliage breaks the illusion of a big open world; fading and scalability keep it smooth and cheap."}
      tech_art: {why: "Fade, density scaling and distance field flags are the levers for foliage budgets.", do: "Run foliage.DensityScale at 0.1, 0.5 and 1.0 with stat unit open and note the Draw time each time."}
      level_design: {why: "Cull distances decide whether cover and landmarks are visible from where the player needs them.", do: "Set the End Cull Distance of landmark trees well beyond bushes so routes stay readable."}

  - id: EAQ84
    rank: 2
