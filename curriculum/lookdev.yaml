    required: false
    title: Trim sheet UVs in Modeling Mode
    brief: "A trim sheet is one texture that holds several horizontal strips, such as a metal band, a wood plank and a stone edge. You texture a mesh by moving its UV islands, the flat pieces of its surface map, onto the strip each part should use. This way one texture can cover a whole kit of pieces. In this quest you place the UV islands of a kit piece onto the strips of a trim sheet with the UV tools in Modeling Mode."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/uvs-category-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-uv-channels-with-static-meshes-in-unreal-engine"
    checklist:
      - "Get or paint a trim sheet texture named T_Trim, with horizontal strips such as a metal band, a wood plank and a stone moulding. Make a material named M_Trim from it, and also prepare a checkerboard material for testing."
      - "Take a kit piece with a flat face and a trim edge, from quest EAQ98 or a new one. In Modeling Mode, open UVs, then Project. Choose Plane, use Auto Fit and accept. Set Preview Material to Checkerboard."
      - "Open UVs, then XFormUV. Scale and move each island so that the main face sits on the stone strip of T_Trim and the trim edge sits on the metal strip. Hold Shift to move several islands together."
      - "Use UVs, then Layout, with Layout Type set to Stack for islands that should share the same strip. Use Transform when you need to move all UVs together."
      - "Assign M_Trim and check the mesh in the level. If an island looks stretched, fix it with Unwrap."
      - "Open the Static Mesh Editor and look at the list of UV channels. Note which channel holds your trim UVs."
    done_when: "Send a screenshot of the textured kit piece in the level, and a screenshot of the Preview UV Layout panel that shows the islands on the strips. Add one line that says which Layout Type you used and why."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Two islands should use the same strip of the trim sheet. Which Layout Type is made for this?"
        choices: ["Repack", "Stack, which packs islands individually with overlap for islands that share the same texturing", "Transform", "Unwrap"]
        answer_index: 1
        explain: "Stack scales and moves each island into the unit square and allows overlap."
      - q: "What does the Transform layout type do?"
        choices: ["It repacks without overlap", "It only moves selected islands", "It creates seams", "It scales and translates all UVs together, keeping the current layout"]
        answer_index: 3
