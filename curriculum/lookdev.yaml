      - q: "Why can you not sculpt by hand on a Spline edit layer?"
        choices: ["It is locked by default, like every new layer", "It has an alpha of zero until a spline is added", "It only supports procedural data from landscape splines", "It is always the base layer, which cannot be sculpted"]
