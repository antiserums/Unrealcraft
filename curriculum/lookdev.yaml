    title: Forest with priority and blocking volumes
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-foliage-tool-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/foliage-mode-in-unreal-engine"
    checklist:
      - "Enable Procedural Foliage in Editor Preferences > Experimental. Create a Procedural Foliage Spawner named PFS_Forest and scale it over a flat landscape area."
      - "Create two Static Mesh Foliage assets, SMF_TreeBig and SMF_TreeSmall, and add both to the Foliage Types of PFS_Forest. Press Resimulate."
      - "In SMF_TreeBig set Shade Radius to 50 and Overlap Priority to 2. In SMF_TreeSmall set Overlap Priority to 1 and enable Can Grow in Shade and Spawns in Shade. Resimulate and look at how the small trees fill in around the big ones."
      - "Change Num Steps to 0 on SMF_TreeBig, Resimulate, then set it back to 3. Lower Initial Seed Density until the forest edge reads as natural."
      - "Set Cull Distance Max to 20000 in the Instance Settings of both types."
      - "Place a Procedural Foliage Blocking Volume over your path or building footprint, then Resimulate. No trees should spawn inside it."
    done_when: "Two screenshots: the forest before and after the blocking volume, plus one screenshot of the SMF_TreeSmall Procedural settings (Collision, Clustering, Growth)."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Where do you enable the Procedural Foliage tools before using them?"
        choices: ["Edit > Plugins > Foliage", "Editor Preferences > Experimental > Procedural Foliage", "Project Settings > Rendering", "Foliage Mode > Settings"]
        answer_index: 1
        explain: "The page says to open Editor Preferences, go to the Experimental section and enable Procedural Foliage."
      - q: "Two foliage types compete for the same spot. One Virtual Seed's collision radius overlaps another seed's shade radius. Which seed survives?"
        choices: ["The one that was spawned first", "The one with the larger mesh", "The one from the foliage type with the higher priority", "Both survive and overlap"]
        answer_index: 2
        explain: "When radii overlap, one Virtual Seed is replaced or killed based on which Foliage Type has the higher priority."
      - q: "You set Num Steps to 0 on a tree type. What changes in the result?"
        choices: ["No trees spawn at all", "All trees are the same size and age", "Trees spawn only inside blocking volumes", "Trees grow for 10 years"]
        answer_index: 1
        explain: "Num Steps is the number of growth years. At 0 the trees are all the same size and age; the tutorial sets it back to 3 to spread them."
      - q: "The forest is too dense. Which setting does the tutorial lower first to fix this?"
        choices: ["Initial Seed Density", "Max Age", "Cull Distance", "Procedural Scale Max"]
        answer_index: 0
        explain: "Setting Initial Seed Density to 0.25 greatly reduced the density. Max Age and Procedural Scale control growth, not count."
      - q: "What does the Procedural Foliage Blocking Volume do?"
        choices: ["It marks where foliage should be denser", "It prevents the spawner from placing foliage inside its bounds", "It stops the player from walking into foliage", "It hides foliage beyond a distance"]
        answer_index: 1
        explain: "The blocking volume prevents the Procedural Foliage Spawner from spawning any Foliage Type inside its bounds."
      - q: "Which section of a Static Mesh Foliage asset holds Cull Distance, Shadowing and Collision for the placed instances?"
        choices: ["Placement", "Clustering", "Growth", "Instance Settings"]
        answer_index: 3
