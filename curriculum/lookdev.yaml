  - id: EAQ112
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [hlod, world-partition, optimization]
    required_spine: false
    required: false
    title: HLOD Layers for distant art
    brief: "In a large world that uses World Partition, Unreal only loads the parts of the level near the player. Far parts are unloaded, so distant buildings and trees would simply disappear. HLOD, which means Hierarchical Level of Detail, replaces those far parts with cheap stand-in meshes that stay visible. An HLOD Layer is an asset that decides how the stand-in is made. In this quest you create two HLOD Layers, assign them to buildings and trees, and build the HLODs."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition---hierarchical-level-of-detail-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition---data-layers-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a World Partition level, or create one with File, New Level, Open World. Place about ten large cubes as buildings and about twenty trees far from the Player Start. Cones from the Place Actors panel can stand in for trees. Open the Content Drawer and create two HLOD Layer assets (choose Miscellaneous, then HLOD Layer). Name one HLOD_Buildings and set its Layer Type to Merged Mesh. Name the other HLOD_Trees and set its Layer Type to Instancing."
      - "On HLOD_Buildings, enable Generate Nanite Enabled Mesh and turn Merge Materials on. On HLOD_Trees, leave the Instancing settings at their defaults."
      - "Select the building meshes and set their Mobility to Static. In the Details panel, set the HLOD property to HLOD_Buildings. Do the same for the tree actors, with HLOD_Trees."
      - "In World Settings, set Default HLOD Layer to HLOD_Buildings, so that new static actors get a layer by default."
      - "Run Build > Build HLODs. Then move the camera far away, or unload cells, and compare the view with HLODs on and off."
      - "Open one of the generated HLOD actors and note its Cell Size and Loading Range. Write one line on why the trees used Instancing and the buildings used Merged Mesh."
    done_when: "Send two screenshots from the same far camera position, one with the HLODs showing and one without. Also send a screenshot of the settings of the two HLOD Layer assets."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "What is the main purpose of World Partition HLODs?"
        choices: ["To bake lighting for far objects into a proxy", "To show distant, non-interactive content from unloaded cells as a proxy and reduce draw calls", "To replace Nanite on low-end hardware, where every mesh is swapped for a simplified proxy mesh", "To stream textures faster for cells that are about to be loaded, so that distant content is sharp"]
        answer_index: 1
        explain: "HLODs replace content in unloaded World Partition cells with generated proxy meshes, cutting draw calls and keeping distant art visible."
      - q: "Which HLOD Layer type is described as ideal for trees and foliage?"
        choices: ["Merged Mesh", "Simplified Mesh", "Instancing", "Always Loaded"]
        answer_index: 2
        explain: "Instancing replaces the assets with ISM components using their lowest LOD. The page says it is ideal for imposter meshes like trees and foliage."
      - q: "What is the difference between Merged Mesh and Simplified Mesh layer types?"
        choices: ["Merged keeps materials, Simplified removes them and uses vertex colors on the proxy", "Both merge into one proxy, but Simplified Mesh also runs mesh simplification", "Merged Mesh is for Nanite source meshes, Simplified Mesh is for non-Nanite ones", "Simplified only works with landscapes, Merged only works with Static Mesh actors"]
        answer_index: 1
        explain: "Both merge Static Mesh assets into a single proxy mesh. Simplified Mesh additionally performs mesh simplification."
      - q: "You enable Always Loaded on an HLOD Layer. Which settings become unavailable?"
        choices: ["Layer Type and HLODMaterial", "Cell Size and Loading Range", "Merge Materials and Gutter Size", "Parent Layer only"]
        answer_index: 1
        explain: "Cell Size and Loading Range configure the runtime grid for streaming the HLOD actors, so they are not available when the layer is Always Loaded."
      - q: "Which of these is NOT a way the page lists for adding actors to an HLOD Layer?"
        choices: ["The HLOD property in the actor's Details panel", "The Default HLOD Layer of a Data Layer", "The Default HLOD Layer in World Settings", "Painting the actor in Foliage Mode"]
        answer_index: 3
        explain: "Actors get an HLOD Layer through the actor's HLOD property, a Data Layer's Default HLOD Layer, or the World Settings default. Foliage Mode is not listed."
      - q: "Before HLODs can be generated for an actor, what must its Mobility be?"
        choices: ["Movable", "Stationary", "Static", "Any mobility works"]
        answer_index: 2
        explain: "The page says actors need to be in an HLOD Layer, have Mobility set to Static, and then be built with Build > Build HLODs or the commandlet."
      - q: "You re-run the HLOD builder after changing nothing. What happens to existing HLOD actors?"
        choices: ["They are all rebuilt from scratch, which takes as long as before", "They are deleted, and you must build them again with another run", "They are not rebuilt because their source actors did not change", "The build fails with an error that says that no source actor has changed"]
        answer_index: 2
        explain: "HLOD actors are not recreated if no changes were made to their source actors. Changing meshes, materials or textures triggers a rebuild."
      - q: "What does the Gutter Size setting in Mesh Merge Settings control?"
        choices: ["The distance between HLOD cells", "The pixel space between UV islands in the baked material, to avoid bleeding when mipmaps downsample", "The size of the gap that is closed between doors and windows when distant geometry is merged into one", "The screen size of the proxy mesh at which it is swapped for the source actors in a loaded cell of the grid"]
        answer_index: 1
        explain: "Gutter Size is space in pixels between UV islands so colors do not overlap as the texture is downsampled. Merge Distance is the door and window closing setting."
    flavors:
      _default: {why: "Distant art only looks good if it is still there when its cell unloads. HLOD Layers are how you decide what it becomes."}
      lookdev: {why: "Choosing Instancing versus Merged Mesh per asset type is an art call as much as a performance call.", do: "Compare the far silhouette of the trees with Instancing versus Merged Mesh and keep the one that reads better."}
      level_design: {why: "Landmarks must stay visible from far away for wayfinding, and HLODs make that possible.", do: "Make sure your main landmark is in a layer with a large enough Loading Range."}

  - id: EAQ113
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [instancing, optimization, props]
    required_spine: false
    required: false
    title: ISM or HISM for the prop kit
    brief: "When you place the same mesh many times, Unreal can draw all copies together as instances and avoid one draw call, one drawing job, for each copy. The Instanced Static Mesh component (ISM) and the Hierarchical Instanced Static Mesh component (HISM) both do this. In this quest you measure the draw calls of 100 separate props, batch them into instances, and build a shelf Blueprint with each of the two component types."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/instanced-static-mesh-component-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-instancing-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Place 100 copies of one small mesh, such as a book or a brick, as separate Static Mesh Actors. A cube scaled to the size of a brick works. In the console, type stat unit and stat rhi, and note the number of draw calls."
      - "Select all 100 actors. Open Actor, then Merge Actors, then Merge Actor Settings. Choose the Batch method and click Merge Actors. Note the draw calls again."
      - "Open the Details panel of the new actor. Click one instance and confirm that you can only edit its transform. Then change the material on the component and see all instances update."
      - "Create a Blueprint named BP_Shelf with an Instanced Static Mesh component. Set its Static Mesh, and add 10 instances with the + button in the Instances category."
      - "Duplicate BP_Shelf and name the copy BP_Shelf_HISM. Use a Hierarchical Instanced Static Mesh component in it. Write two lines: which component you would use for 5000 static pebbles, and which one for a project that uses only Nanite."
      - "On the ISM, enable Per Instance Custom Data by setting Num Custom Data Floats to 1. Use this value in the material to control the color, so that two shelves can look different without a new material instance."
    done_when: "Send a screenshot of the stat numbers before batching and after batching, and a screenshot of the components of BP_Shelf. Add your two lines of notes."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the main performance reason to use an Instanced Static Mesh component?"
        choices: ["It reduces texture memory for all of the instances", "It combines draw calls of identical meshes and lowers UObject memory", "It bakes lighting faster for the meshes in the level", "It enables Nanite on any mesh that is added to the component at all"]
        answer_index: 1
        explain: "An ISM combines the draw calls of identical static meshes. The page also gives a GPU example: a primitive uses about 672 bytes versus 64 bytes for an instance."
      - q: "You click one instance of an ISM in the Details panel. What can you edit?"
        choices: ["Only its transform", "Its material and collision", "Its LOD settings", "Its shadow settings"]
        answer_index: 0
        explain: "Only the transform is available per instance. Materials, collision and shadows are component-level and shared by all instances."
      - q: "Your project uses only Nanite meshes. Which component does the page say to choose?"
        choices: ["HISM, because its static hierarchy is faster with Nanite", "ISM, because Nanite has its own culling and LOD system", "Either, there is no difference with Nanite", "Neither, use separate actors"]
        answer_index: 1
        explain: "If the project only uses Nanite, ISM is always the choice. HISMs are for projects with Nanite and fallback meshes when appropriate."
      - q: "When is a HISM described as the better choice?"
        choices: ["When instances move every frame, so the hierarchy can update only the instances that changed since the last one", "When you need per-instance materials", "When you have thousands of instances that do not move, so a static hierarchy accelerates culling and LOD", "When the mesh has many triangles and per-instance LOD matters, so each instance is drawn as a separate mesh"]
        answer_index: 2
        explain: "HISMs can be better with thousands of static instances. Non-static instances can cause errors with HISMs, and HISM groups LODs so it suits low-triangle meshes."
      - q: "You batch a selection that contains three different static mesh assets with Merge Actors (Batch). What do you get?"
        choices: ["One ISM component that holds all three meshes in a single list", "One instanced static mesh component per unique static mesh asset", "One merged static mesh asset with three sections", "Three separate actors, one for each of the mesh assets"]
        answer_index: 1
        explain: "When grouping multiple unique static meshes into one actor, an ISM component is created per unique static mesh asset."
      - q: "Which menu path does the page give for batching actors into ISMs?"
        choices: ["Actor > Merge Actors > Merge Actor Settings, then Batch", "Edit > Batch Instances > Batch Settings, then Create ISM", "Window > ISM Editor > Batch Selected Actors, then Create", "Build > Build Instances > Batch Selected Static Mesh Actors"]
        answer_index: 0
        explain: "Select the actors, open Actor > Merge Actors > Merge Actor Settings, change the method to Batch and click Merge Actors."
      - q: "What does creating a Packed Level Actor do to the selected actors' meshes?"
        choices: ["Converts them to Nanite meshes inside a Blueprint", "Bakes them into one static mesh asset with a merged material", "Groups them automatically into a HISM inside a Blueprint actor", "Turns them into foliage instances of the level"]
        answer_index: 2
        explain: "The page says actors are automatically grouped into a HISM when you use Create Packed Level Actor. Edit the Blueprint to change component properties."
      - q: "How can you vary the look of individual instances without creating a new dynamic material instance per mesh?"
        choices: ["Give each instance its own material slot in the component", "Use Per Instance Custom Data or Custom Primitive Data read in the material", "Paint vertex colors per instance with the Mesh Paint mode", "Use a Material Parameter Collection for each instance and set it on spawn"]
        answer_index: 1
        explain: "Custom Primitive Data and Per Instance Custom Data pass float data to the material without a new material instance, which keeps draw calls low."
    flavors:
      _default: {why: "Set dressing is mostly repeated meshes. Instancing decides whether 500 props cost 500 draw calls or a few."}
      lookdev: {why: "Knowing when the editor already instances for you (Foliage, Packed Level Actors, PCG) tells you where hand placement is fine and where it is not.", do: "Check one of your existing Packed Level Actors and confirm it contains HISM components."}
      tech_art: {why: "ISM versus HISM is a common question from artists; the page gives clear rules you can quote.", do: "Profile both shelves with stat rhi and note the difference, if any, at your view distance."}

