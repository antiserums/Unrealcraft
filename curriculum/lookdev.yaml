        choices: ["Manual", "Auto Exposure Basic", "Auto Exposure Histogram", "Physical Camera"]
        answer_index: 2
        explain: "Auto Exposure Histogram is the default. It builds a 64-bin histogram and gives finer control. Basic is faster but has fewer settings."
      - q: "You set Exposure Compensation to -1. What does the page say happens?"
        choices: ["The image becomes two times darker", "The image becomes two times brighter", "Auto exposure turns off", "Nothing, the value must be positive"]
        answer_index: 0
        explain: "Exposure Compensation is logarithmic. -1 is two times darker, -2 four times darker, +1 two times brighter."
