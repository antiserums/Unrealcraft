    required_spine: false
    required: false
    title: Detail textures for close-ups
    brief: "When a player stands very close to a wall, the wall texture often looks blurry because there are not enough pixels. A detail texture is a second, small texture that repeats many times over the surface and adds fine detail up close. In this quest you build a wall material that uses the DetailTexturing material function, which is a ready-made group of nodes that comes with Unreal."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/adding-detail-textures-to-unreal-engine-materials"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/coordinates-material-expressions-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a material named M_DetailWall. You need a base color texture and a base normal map for the wall, and a second color texture and normal map for the fine detail. Free surfaces from Fab work well."
      - "For a first test, use T_Quinn_01_D and T_Quinn_01_N from the folder Characters/Mannequins/Textures/Quinn of the template as the base, and T_GridChecker_A from LevelPrototyping/Textures and the engine texture T_Default_Material_Grid_N as the detail. To see engine content, open the Settings menu of the Content Browser and turn on Show Engine Content. Drag all four textures into the graph."
      - "Add the DetailTexturing material function, which is in the Misc category. Then right-click the two detail textures and choose Convert To Texture Object for each."
      - "Connect the base textures to Diffuse and Normal. Connect the two Texture Objects to DetailDiffuse and DetailNormal. Then connect the outputs of the function to Base Color and Normal."
      - "Add three Scalar Parameters named Scale, Diffuse Intensity and Normal Intensity, and set each one to 1. Connect them to the function."
      - "Make a Material Instance named MI_DetailWall and apply it to a cube that you scale into a wall. Try Scale at 1, 5 and 10, and look at the wall from very close each time."
      - "Add a TextureCoordinate node in front of the base textures. Set UTiling and VTiling to 2 so that the base textures repeat twice."
    done_when: "Send two close-up screenshots of the wall in the level, one with Scale 1 and one with Scale 10. Also send one screenshot of the M_DetailWall graph."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "What type of input do the DetailDiffuse and DetailNormal pins of the DetailTexturing function accept?"
        choices: ["A Texture Sample", "A Texture Object only", "A Vector3 color", "A Scalar Parameter"]
        answer_index: 1
        explain: "The page says these inputs can only accept a Texture Object. Right-click a Texture Sample and choose Convert To Texture Object."
      - q: "You raise the Scale input from 1 to 10. What happens?"
        choices: ["The detail texture tiles more times and looks finer", "The detail texture becomes larger and looks blurrier", "The base texture disappears, and only the detail one is left", "The normal map is inverted, so that bumps turn into dents"]
        answer_index: 0
        explain: "Bigger Scale numbers give more tiling. At 10 the detail texture tiles more times across the mesh and appears smaller and finer."
      - q: "What is the performance trade-off of detail texturing?"
        choices: ["It adds no cost, because both textures are packed in one", "It doubles the polygon count of every mesh that uses the material", "It can add two or more extra texture lookups to the material", "It disables mip maps on the base texture"]
        answer_index: 2
        explain: "The conclusion says detail texturing can add two or more texture lookups, which can be a performance or memory issue, especially on mobile."
      - q: "On a TextureCoordinate node, what does Coordinate Index 1 select?"
        choices: ["The first UV channel", "The second UV channel", "The tiling amount", "The mirror mode"]
        answer_index: 1
        explain: "Coordinate Index picks the UV channel. 0 is the first channel and 1 is the second channel."
      - q: "Where do you find the DetailTexturing node in the material context menu?"
        choices: ["Under the Misc category as a Material Function", "Under the Texture category as a Texture Sample", "Under the Parameters category, as a Scalar Parameter", "It must be downloaded from Fab and added to the project"]
        answer_index: 0
        explain: "Search for detail texturing and click DetailTexturing under the Misc category. It is a Material Function that contains all the logic."
      - q: "In the distance-based example, the blend happens at 512 units. How do you make it happen sooner?"
        choices: ["Increase the Power constant that is after the Divide node, up to a value of 512", "Set Scale to 0 on the DetailTexturing function", "Convert the textures back to Texture Samples and remove the Divide", "Reduce the 512 value in the Constant plugged into the Divide node"]
        answer_index: 3
        explain: "The distance is controlled by the first Constant plugged into Divide. Reducing it from 512 to something smaller makes the transition occur sooner."
    flavors:
      _default: {why: "Players walk right up to walls. Detail textures keep surfaces sharp without giant base textures."}
      lookdev: {why: "This is the cheapest way to make a 1K texture look like 4K up close.", do: "Also test the material on a floor and note whether the detail normal is too strong at grazing angles."}
      tech_art: {why: "Detail texturing is a common master material feature you will maintain.", do: "Build the manual version from the page (without the function) and compare instruction counts."}

  - id: EAQ66
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [virtual-textures, texture-streaming, materials]
    required_spine: false
    required: false
    title: Virtual textures, first look
    brief: "A virtual texture is a very large texture that Unreal cuts into small tiles, so that it only loads the tiles the camera can see. This lets a project use huge textures without using a huge amount of memory. There are two kinds: Streaming Virtual Textures (SVT), which are loaded from disk, and Runtime Virtual Textures (RVT), which are created while the game runs. In this quest you convert a large texture to a virtual texture and look at its tiles."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/virtual-texturing-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/streaming-virtual-texturing-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/runtime-virtual-texturing-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. On the Virtual Texturing documentation page linked on this quest, read the table that compares Runtime Virtual Textures with Streaming Virtual Textures. Write one sentence about each."
      - "Import a large color texture with a power-of-two size (4096x4096 is enough) and name it T_Big_BC. If you have no such image, make one in any image editor by resizing a photo to 4096x4096. Use it in a material named M_BigTest and put that material on a plane."
      - "In the Content Browser, right-click T_Big_BC and choose Convert to Virtual Texture. Read the list of materials in the Convert To window and click Ok."
      - "Open M_BigTest. Confirm that the Texture Sample node now shows VT in its corner and uses a Virtual sampler type."
      - "Play in the editor. In the console, type stat virtualtexturing, and then r.VT.Borders 1. Move around and look at the grid. Turn the grid off with r.VT.Borders 0."
    done_when: "Send one screenshot of the plane with r.VT.Borders 1 active and stat virtualtexturing on screen. Add your two sentences about RVT and SVT."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Which virtual texturing method makes its texel data on the GPU at runtime?"
        choices: ["Streaming Virtual Texturing", "Runtime Virtual Texturing", "Mip-based texture streaming", "UDIM"]
        answer_index: 1
        explain: "RVT texel data is generated by the GPU at runtime. SVT texel data is cooked and loaded from disk."
      - q: "How does Streaming Virtual Texturing decide what to load?"
        choices: ["It loads the full mip level of any texture that is on a visible object, even for the pixels that are hidden", "It loads all textures at startup, and keeps them in memory until the level is closed", "It loads textures based on actor names, with one tile for each actor that is on screen", "It splits mips into small fixed-size tiles and loads only the tiles that visible pixels use"]
        answer_index: 3
        explain: "SVT splits all mip levels into fixed-size tiles. The GPU finds which tiles visible pixels touch and the CPU loads only those."
      - q: "You enable Virtual Texture Streaming by hand on a texture and its material shows an error. What is the fix?"
        choices: ["Change the Texture Sample's Sampler Type to a Virtual type such as Virtual Color", "Reimport the texture with the same import settings as before, and compile the material", "Set the texture to Never Stream in the Texture Editor and save the material once more", "Delete the material and make a new one, because a material cannot mix both kinds of texture"]
        answer_index: 0
        explain: "A virtual texture needs a Virtual Sampler Type. The conversion menu does this for you; manual conversion does not."
      - q: "What does r.VT.Borders 1 do?"
        choices: ["Draws a mip visualization grid on materials that use streaming virtual textures", "Adds a border color to all textures in the project, for debugging", "Disables virtual texturing for the current session", "Increases the border size of every tile by one pixel, which removes visible seams"]
        answer_index: 0
        explain: "The page says r.VT.Borders 1 draws a mip visualization grid on SVT materials and r.VT.Borders 0 hides it."
      - q: "How does the cost of sampling a virtual texture compare to a regular texture?"
        choices: ["It is always cheaper, because only one small tile is read for each pixel on screen", "It is the same, as both use one texture fetch", "It is always more expensive, with at least two texture fetches plus some math", "It is free when Nanite is enabled, because Nanite reads the tiles for the texture"]
        answer_index: 2
        explain: "Virtual textures always cost more than a regular sample. Stacks that share the same UVs can be combined, up to 8, to save fetches."
      - q: "What happens when you import an image that uses the UDIM naming convention?"
        choices: ["Each image becomes a separate texture asset, and you assign each one to its own material slot", "Unreal groups the images with the same base name and different four-digit numbers into a single Virtual Texture asset", "The import fails, because four-digit numbers are not allowed in asset names", "The images are merged into one 8K texture on disk, and the source files with the four-digit numbers are deleted after that"]
        answer_index: 1
        explain: "UE scans the folder for images with the same BaseName and a different four-digit coordinate and imports them as one Virtual Texture asset."
    flavors:
      _default: {why: "Virtual textures are how modern projects use huge textures without huge memory. Know when they help and what they cost."}
      lookdev: {why: "Hero assets with 8K textures and UDIMs need SVT to fit in memory.", do: "Write down one asset in your project that would benefit from SVT and one that would not."}
      tech_art: {why: "RVT is the base of most landscape material pipelines.", do: "Read the RVT Material Types table and note which type stores a normal in a BC5 texture."}

