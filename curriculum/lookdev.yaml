      - q: "You want the fallback mesh to keep every triangle of the source. Which settings do that?"
        choices: ["Keep Triangle Percent 0 and Trim Relative Error 1", "Fallback Triangle Percent 100 and Fallback Relative Error 0", "Position Precision Auto", "Minimum Residency 0"]
        answer_index: 1
        explain: "100 percent keeps all triangles and a relative error of 0 removes nothing."
      - q: "Why does the page tell you to trim Nanite data with Keep Triangle Percent and Trim Relative Error?"
        choices: ["To make the mesh render faster", "To turn on streaming", "To fix cracks between modular pieces", "To reduce disk and download size; by default Nanite stores all source triangles"]
        answer_index: 3
