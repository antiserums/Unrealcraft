    title: "Roads and rocks blended with RVT"
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/runtimevirtual-texturing-quick-start-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/runtime-virtual-texturing-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/virtual-texturing-settings-and-properties-in-unreal-engine"
    checklist:
      - "Project Settings > Engine > Rendering > Virtual Textures: enable virtual texture support and restart."
      - "Create RVT_Ground (Runtime Virtual Texture asset). Set Virtual texture content to Base Color, Normal, Roughness, Specular and keep border padding at 2 or more."
      - "In your landscape material enable Use Material Attributes. Write the layer blend into a Runtime Virtual Texture Output. Sample RVT_Ground with a Runtime Virtual Texture Sample and route both paths through a Virtual Texture Feature Switch."
      - "Place a Runtime Virtual Texture Volume, assign RVT_Ground, and use Transform from Bounds > Set Bounds with the landscape as Source Actor. Add RVT_Ground to the landscape's Draw in Virtual Textures."
      - "Open the road mesh material from EAQ78 (or any spline mesh). Add a Runtime Virtual Texture Output with Base Color and Roughness. Select all spline segments and add RVT_Ground under Virtual Texture."
      - "On the RVT Volume enable Hide Primitives and check the road now lives only in the terrain texture."
      - "Make M_RockBlend: sample RVT_Ground and blend its Base Color into the bottom of a rock mesh so it meets the ground softly. Set a Translucency Sort Priority on the road so it stacks above the rock."
    done_when: "Before/after screenshot of a rock base meeting the ground, plus a screenshot of the road rendered into the RVT with the spline mesh hidden (Game View)."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Why do Runtime Virtual Textures work especially well with landscapes?"
        choices: ["Landscapes have no UVs, so RVT is required", "Complex landscape shading is cached for a performance win, and other actors can blend into the same RVT asset", "They replace the landscape heightmap", "They remove the need for layer info objects"]
        answer_index: 1
        explain: "The quick start says RVT caches complex landscape material results, gives better spline and decal-type effects, and blends non-landscape actors using the same RVT asset."
      - q: "Which material setting must be enabled before rebuilding the landscape material for RVT?"
        choices: ["Two Sided", "Masked blend mode", "Tangent Space Normal off", "Use Material Attributes"]
        answer_index: 3
        explain: "Use Material Attributes is the one exception in setup. It lets you use Make Material Attributes nodes to rebuild the output for the different paths."
      - q: "Where should the expensive, camera-independent work in the material go?"
        choices: ["Before the Runtime Virtual Texture Output, so it is cached", "After the Runtime Virtual Texture Sample", "In the Virtual Texture Feature Switch", "In the RVT Volume"]
        answer_index: 0
        explain: "Everything feeding the RVT Output is cached to the RVT. The part after the Sample runs every frame, so the less work there, the cheaper the material."
      - q: "The landscape renders black after setup. What is the most likely cause?"
        choices: ["The Virtual Texture Feature Switch is connected backwards", "Nanite is off", "Something in the RVT chain is not set up, for example the landscape is not in the volume or not drawing to the RVT asset", "The RVT tile size is too large"]
        answer_index: 2
        explain: "The guide says that if something is not set up correctly, the landscape renders black. Actors must be inside the RVT Volume bounds and listed in Draw in Virtual Textures."
      - q: "What does Hide Primitives on the RVT Volume do?"
        choices: ["Hides the landscape", "Hides the volume's bounds in the editor", "Disables RVT for foliage", "Hides actors that render into the RVT from the main pass, so they exist only in the virtual texture"]
        answer_index: 3
        explain: "After a spline is rendered into the RVT it is still visible. Hide Primitives stops it drawing in the main pass so only the RVT version shows."
      - q: "What does Translucency Sort Priority control for actors written into an RVT?"
        choices: ["Their shadow order", "The layer order in which they are rendered into the RVT; higher values stack on top", "Their collision priority", "The tile generation order"]
        answer_index: 1
        explain: "The On Your Own section says to use Translucency Sort Priority to set layer order: 0 is the bottom layer and higher values stack on top."
      - q: "The RVT asset's border padding is set to 0. What artifact does the documentation warn about?"
        choices: ["Shading seams at tile edges from bilinear sampling", "Black landscape", "Doubled texture memory", "Anisotropic filtering is forced on"]
        answer_index: 0
        explain: "A padding of 0 causes shading seams from bilinear sampling at tile edges. A value of 2 should fix this; higher values enable anisotropic sampling."
      - q: "Which statement about the RVT Volume is correct?"
        choices: ["One volume can hold many RVT assets", "Volumes are only needed for non-landscape actors", "Each volume is assigned a single RVT asset, and any actor sampling or writing must be inside its bounds", "The volume must be smaller than the landscape"]
        answer_index: 2
        explain: "Each RVT Volume is assigned one RVT asset. Actors are assigned any number of RVT assets, but they only render when inside a volume that uses one of them."
    flavors:
      _default: {why: "RVT is how roads, decals and rocks stop looking pasted onto the ground."}
      tech_art: {why: "This is the standard modern pipeline for terrain blending; knowing the node chain lets you debug it.", do: "Run stat virtualtexturing and change the tile size in RVT_Ground to see the cost change."}
      level_design: {why: "Path markings baked into the terrain read well from far and stay cheap.", do: "Add a masked plane as a path marking that writes only into the RVT."}

  - id: EAQ81
    rank: 2
