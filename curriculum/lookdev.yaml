        explain: "Once a light function is assigned, it does not require Cast Shadows to be enabled to display the light function material."
      - q: "What does the Z value of Light Function Scale control?"
        choices: ["Scale along the light direction", "The brightness of the function", "The fade distance", "The width perpendicular to the light"]
