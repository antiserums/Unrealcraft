        explain: "r.Nanite.AllowTessellation=1 is read-only and must be in the project config; r.Nanite.Tessellation=1 can be toggled at runtime."
      - q: "Why does Epic warn against setting a large Magnitude and scaling the Displacement input down to compensate?"
        choices: ["It makes the texture blurry", "Magnitude is capped at 1", "It disables the normal map", "Magnitude sets the bounds used for culling patches, so a large value hurts performance, especially with Virtual Shadow Maps"]
        answer_index: 3
        explain: "Use the full 0-1 range of the Displacement output and keep Magnitude as small as necessary, because it bounds patches for culling."
      - q: "You want displacement to only push outward from the base mesh. What Center value do you use?"
        choices: ["0.5", "0", "1", "-1"]
        answer_index: 1
        explain: "Center defines which displacement value means no change. 0.5 gives equal in and out; 0 pushes only outward."
      - q: "Displacement looks flat when lit. What does the docs say you must add?"
        choices: ["A corresponding normal map, because displacement does not change shading", "A second displacement map", "Higher Magnitude", "Pixel Depth Offset"]
        answer_index: 0
        explain: "Unlike offline renderers, displacement here does not change shading. Supply a normal map or derive normals from the displacement."
      - q: "You scaled a cube into a long wall and the bricks displace much more than expected. Why?"
        choices: ["The texture is too large", "Nanite disables scaling", "Displacement is in local space before object scale, so Magnitude is in unscaled object units", "The Center is wrong"]
        answer_index: 2
        explain: "Displacement is applied in local space before scaling. Epic notes a world-space option may come later."
      - q: "Which feature is ignored when tessellation is enabled?"
        choices: ["Opacity Mask", "Pixel Depth Offset", "World Position Offset", "Virtual Shadow Maps"]
        answer_index: 1
        explain: "Tessellation is not compatible with Pixel Depth Offset; PDO is ignored. WPO and Opacity Mask can be combined with limits."
      - q: "For the offline Static Displacement option, what does Epic say about Trim Relative Error?"
        choices: ["Set it to 0 for best quality", "It must match the texture size", "It controls the Magnitude", "A good default is 0.04 and keep it above 0.02; smaller only adds triangles and build time"]
        answer_index: 3
        explain: "Trim Relative Error targets an error level when tessellating; 0.04 is a good default and going too small inflates triangle count and build times."
    flavors:
      _default: {why: "Real silhouettes from a height map, with detail only where pixels need it."}
      lookdev: {why: "Stone, brick and bark get true depth at grazing angles.", do: "Try the same height map with Bump Offset on a second wall and compare cost and look."}

  - id: EAQ76
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [landscape, materials, layer-blend, height-blend]
    required_spine: false
    required: false
    title: "Height blend without black spots"
    brief: "A landscape material usually has several layers, such as grass, dirt and rock, that you paint on the terrain. With a plain blend, the border between two layers is a soft, even fade. With a height blend, the material uses a height map so that, for example, dirt fills the gaps between rocks first, which looks much more real. In this quest you change a landscape material to height blending and avoid the black spots that this method can cause."
    time_min: 70
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/landscape-materials-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/landscape-paint-mode-in-unreal-engine"
    checklist:
      - "Duplicate your landscape material and name the copy M_Land_HeightBlend. In its Landscape Layer Blend node, keep 4 layers: Grass, Dirt, Rock and Snow."
      - "Set Grass, Dirt and Rock to LB Height Blend. For each layer, connect the alpha of its texture, or a height mask, to the matching Height input."
      - "Set Snow to LB Alpha Blend and move it to the end of the list. This fixes the black spots that appear where all height layers have the value zero."
      - "Add a Landscape Layer Switch node around the Snow branch. It lets Unreal skip the snow textures on parts of the landscape that have no snow."
      - "Add a Landscape Layer Sample node for Rock. Multiply it into Roughness so that painted rock looks a little wetter or drier than grass."
      - "In Landscape Mode, open Paint and create a Weight-Blended layer info for each layer. Paint rock next to dirt and look at the height detail where they meet."
      - "Compare with the old material. Take one close screenshot of the border between rock and dirt with each material."
    done_when: "Send two close screenshots of the same border between rock and dirt, one with the height blend and one with the plain weight blend. Also send one screenshot of the Details panel of the Layer Blend node that shows the four Blend Types."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What does LB Height Blend add compared to LB Weight Blend?"
        choices: ["Order-dependent stacking of layers", "Detail in the transition between layers, driven by a height map", "A cheaper shader because it skips unused layers", "A separate weightmap that never affects other layers"]
        answer_index: 1
        explain: "LB Height Blend is the same as LB Weight Blend but adds detail to the transition based on a height map, so dirt can appear in the gaps between rocks."
      - q: "Several layers are all set to LB Height Blend and black spots appear where they meet. Why?"
        choices: ["The weightmap texture is too small", "The Layer Info objects are Non Weight-Blended", "All painted layers can have a 0 height value at the same spot, so no layer contributes", "Height blending only works with 2 layers"]
        answer_index: 2
        explain: "With no ordering, the layers painted there can all have height 0, so every blend factor is 0 and nothing contributes. Normals then become (0,0,0), which makes it worse."
      - q: "Which change does the documentation show as the fix for those black spots?"
        choices: ["Set one of the layers to LB Alpha Blend", "Delete the Height inputs", "Switch the material to Masked blend mode", "Increase Preview Weight on every layer"]
        answer_index: 0
        explain: "In the example, the Soil layer is set to LB Alpha Blend while the others stay LB Height Blend. This stops the issue."
      - q: "How does LB Alpha Blend treat layer order?"
        choices: ["Order is ignored, like weight blend", "Only the first layer in the list is used", "Order is decided by Preview Weight", "Layers are applied in the order they appear in the list, as an overlay on top of the weight and height layers"]
        answer_index: 3
        explain: "LB Alpha Blend is an alpha-blended overlay on top of the LB Weight Blend and LB Height Blend layers, applied in list order. Erasing snow reveals the rock and grass beneath it."
      - q: "What is the Landscape Layer Switch node for?"
        choices: ["Switching between two landscape materials at runtime", "Choosing the UV mapping type for a layer", "Skipping material operations on regions where a layer's weight is zero", "Blending two layers by a painted mask"]
        answer_index: 2
        explain: "Layer Switch picks the Layer Used or Layer Not Used network depending on whether the layer contributes to that region. It removes calculations that are not needed when a layer's weight is zero."
      - q: "What does a Landscape Layer Sample node output?"
        choices: ["The UV coordinates of the layer", "The layer's weight, from 0.0 (not used) to 1.0 (fully painted)", "The blended base color of all layers", "The height value of the layer"]
        answer_index: 1
        explain: "Layer Sample returns the weight value of a target layer, between 0.0 and 1.0, so you can use it anywhere in the material."
      - q: "The material looks for a layer name that has no target layer entry in the landscape. What happens?"
        choices: ["The editor refuses to compile the material", "The layer is painted everywhere at 100%", "A new layer info object is created automatically", "The layer's weight is always treated as zero"]
        answer_index: 3
        explain: "It is fine to have a target layer that the material does not use. But if the material looks for a layer with no target layer entry, its weight is always considered zero."
      - q: "You paint a Weight-Blended layer to 100% at one spot, then use the paint tool to remove it there. Why does nothing seem to change?"
        choices: ["All other layers are at 0% there, so there is nothing to replace it with", "Weight-blended layers cannot be erased at all", "The landscape needs a rebuild first", "The brush strength is capped at 50% for removal"]
        answer_index: 0
        explain: "Weight blending keeps the total at 100%. When one layer is at 100%, all others are 0%, so removing it leaves nothing to show. Paint the layer you want instead."
    flavors:
      _default: {why: "Height blending is the difference between a painted map and terrain that looks like it has real gravel and cracks."}
      tech_art: {why: "Layer Switch and Layer Sample are the tools that keep a big landscape material within budget.", do: "Open the Shader Complexity view before and after adding the Layer Switch and compare a component with no snow."}
      level_design: {why: "Clear transitions between rock and dirt tell the player where the walkable path is.", do: "Paint the walkable path with the dirt layer only and check that it reads from 20 meters away."}

  - id: EAQ77
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [landscape, edit-layers, sculpt, non-destructive]
    required_spine: false
    required: false
    title: "Sculpt on a layer stack"
    brief: "Landscape edit layers work like layers in a paint program. Each layer holds its own sculpting and painting, and Unreal adds them together to make the final terrain. This means you can try an idea on a new layer and hide or remove it later without damaging the base terrain. In this quest you create a stack of layers, sculpt on one of them, and try the controls of the stack."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/landscape-edit-layers-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/landscape-blueprint-brushes-in-unreal-engine"
    checklist:
      - "Open a level whose landscape uses edit layers. New landscapes have edit layers turned on by default. In Landscape Mode, open Sculpt and find the Layers list."
      - "Rename the default layer to Base. Add three layers with the + icon and name them SculptDetails, PaintDetails and Splines. For the last one, choose Spline Edit Layer."
      - "Select SculptDetails and sculpt a few small bumps and a ditch. Then turn on Lit > Visualizers > Layer Contribution and take a screenshot of the highlight."
      - "Set the heightmap Alpha of SculptDetails to a negative value and watch the bumps become dents. Then set it back to 1."
      - "Hide the layer with the eye icon, and then show it again. Lock the Base layer with the lock icon and try to sculpt on it."
      - "Select PaintDetails and switch to Paint mode. Paint one material layer, so that the paint is stored only on this edit layer. Turn its visibility off and on to compare."
      - "Drag SculptDetails above PaintDetails in the stack. Then right-click a layer and read the context menu, which has options such as Collapse, Clear Sculpt Layer and Show Only Selected."
    done_when: "Send a screenshot of the Layers list with four named layers, one of which is a Spline edit layer. Also send a screenshot of the Layer Contribution visualizer that shows your SculptDetails layer."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the main purpose of Landscape Edit Layers?"
        choices: ["To bake the landscape into static meshes", "To split the landscape into streaming proxies", "To store foliage per layer", "To edit heightmap and weightmap data in non-destructive layers that can be reordered or hidden"]
        answer_index: 3
        explain: "Edit layers are stack-based, independent, non-destructive containers for height, paint or visibility data. They can be edited, reordered or hidden."
      - q: "By default, how many edit layers can a landscape have, and where is the limit set?"
        choices: ["4, in the Landscape actor Details", "8, in Project Settings under Landscape: Max Number of Layers", "16, in Editor Preferences", "There is no limit"]
        answer_index: 1
        explain: "The editor sets a default limit of 8 edit layers. It can be changed in Project Settings under Landscape: Max Number of Layers."
      - q: "In Sculpt mode you set an edit layer's heightmap Alpha to a negative value. What happens?"
        choices: ["The layer's height data is applied as a subtractive blend", "The layer is hidden", "The layer is locked", "The layer's paint data is inverted"]
        answer_index: 0
        explain: "A negative heightmap alpha applies the data in a subtractive blend. An alpha of zero means the layer has no effect on the final heightmap."
      - q: "Which of these can you NOT do on a locked edit layer?"
        choices: ["Toggle its visibility", "Select it", "Sculpt or paint on it", "Read its name"]
        answer_index: 2
        explain: "Locked edit layers cannot be modified in any way, including sculpting, painting, collapsing and managing Blueprint brushes."
      - q: "What does the Collapse context option do?"
        choices: ["Hides the layer", "Merges the edit layer into the layer below it", "Deletes the layer and its brushes", "Resets the layer's height to zero"]
        answer_index: 1
        explain: "Collapse merges the final data of the layer and the layer below into the bottom one. Collapse All Layers flattens everything into the base layer and removes all Blueprint Brushes."
      - q: "How do you see exactly what one edit layer contributes to the heightmap?"
        choices: ["Use the Erase tool on it", "Set every other layer's alpha to 2", "Open the Edit Layer Inspector", "Turn on Lit > Visualizers > Layer Contribution and select the layer in Sculpt mode"]
        answer_index: 3
        explain: "Layer Contribution highlights the selected layer's data. In Sculpt mode it shows the heightmap contribution; in Paint mode it shows the paint layer contribution."
      - q: "Why can you not sculpt by hand on a Spline edit layer?"
        choices: ["It is locked by default", "It has an alpha of zero", "It only supports procedural data from landscape splines", "It is always the base layer"]
        answer_index: 2
        explain: "The Spline edit layer only supports procedural data. It cannot be sculpted or painted by hand; it lets splines terraform the landscape non-destructively."
      - q: "You want to reset all landscape data. Per the documentation, what is the clean way?"
        choices: ["Add a new empty layer and delete the remaining edit layers", "Delete the landscape actor and make a new one", "Set every layer's alpha to zero", "Use Clear Visibility Layer"]
        answer_index: 0
        explain: "All landscapes must keep at least one edit layer. To reset, add a new empty layer, then delete the others."
    flavors:
      _default: {why: "Layers let you experiment with terrain without destroying the base sculpt."}
      level_design: {why: "You can keep the gameplay base terrain locked while art layers change above it.", do: "Lock the Base layer once the walkable routes are approved."}
      tech_art: {why: "Special edit layers are where splines, patches and Blueprint brushes plug in.", do: "Enable the Landmass plugin and add a CustomBrush_Landmass to a new edit layer."}

  - id: EAQ78
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [landscape, splines, roads, edit-layers]
    required_spine: false
    required: false
    title: "A road that shapes the terrain"
    brief: "A landscape spline is a curve that you draw on the terrain for things like roads and paths. The spline can raise or lower the ground under it, paint a material layer along it, and place a road mesh that follows it. This makes the road sit inside the terrain and not float on top of it. In this quest you draw a road across a hill and use these options to make it shape the terrain."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/landscape-splines-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/landscape-edit-layers-in-unreal-engine"
    checklist:
      - "In Landscape Mode, open Manage and choose Spline. Hold Ctrl and left-click to place 6 to 8 control points for a road across a hill. To extend the road, hold Alt and drag with the left mouse button from an end point."
      - "Select all control points with Ctrl+A. Set Half-Width to about 300 and Side Falloff to about 400. Press End to snap the points to the landscape."
      - "Add a Spline Edit Layer in the edit layer stack. Watch the terrain rise or get cut to fit the road."
      - "Select all segments of the spline. Set Layer Name to your Dirt (or Road) paint layer so that the road paints itself onto the terrain."
      - "Under Landscape Spline Meshes, assign a road Static Mesh. Turn on Scale to Width and set the correct Forward Axis for your mesh."
      - "On one segment that goes downhill, turn off Raise Terrain and keep Lower Terrain. The road then cuts into the slope and does not build a bank of earth under itself."
      - "Select a segment and use the scale tool to drag a tangent, which is the handle that controls the curve. Use it to smooth one sharp bend."
    done_when: "Send one screenshot of the road from above with the spline visible and the terrain deformed. Also send one screenshot taken while playing in the editor, standing on the road mesh where it cuts through the hill."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Landscape splines do not change the heightmap until what exists?"
        choices: ["A Spline edit layer in the edit layer stack", "A Static Mesh on every segment", "A Layer Name on every control point", "A Nanite build of the landscape"]
        answer_index: 0
        explain: "Splines do not affect the heightmap until a Spline edit layer is added. After that, the landscape reacts automatically to spline changes."
      - q: "What does the Side Falloff property on a control point control?"
        choices: ["The mesh scale on each side of the road", "How far the road paints its layer beyond the mesh", "The distance between control points", "The width of the cosine-blended region where the terrain blends back to the original height"]
        answer_index: 3
        explain: "Side Falloff is the width of the cosine-blended falloff region on each side of the spline, shown as dotted lines. Half-Width is the solid part."
      - q: "A road on an embankment should raise the ground under it, but a ditch should only cut down. Which options control this?"
        choices: ["Layer Width Ratio", "Raise Terrain and Lower Terrain", "Mesh Vertical Offset", "End Falloff"]
        answer_index: 1
        explain: "Raise Terrain raises the landscape to match the spline (good for roads on embankments). Lower Terrain lowers it (good for rivers and ditches)."
      - q: "Where do you set which landscape paint layer the spline applies?"
        choices: ["In the Layer Info object", "In the Static Mesh's material", "In the Layer Name property of the control points or segments", "In the Spline edit layer's alpha"]
        answer_index: 2
        explain: "Layer Name on the control points or segments names the painted blendmask layer. Width and falloff settings affect how far it paints."
      - q: "What does Scale to Width do on a spline mesh?"
        choices: ["Scales the mesh to fit the spline width instead of using it as-is", "Widens the spline to fit the mesh", "Scales the landscape component", "Doubles the mesh along the segment"]
        answer_index: 0
        explain: "Scale to Width scales the mesh to the spline width. With it on, the Scale value is relative to the spline width; otherwise it is relative to the mesh's natural size."
      - q: "Which key snaps the selected control points to the landscape below?"
        choices: ["R", "T", "End", "F"]
        answer_index: 2
        explain: "End snaps selected control points to the landscape. R auto-calculates rotation, T flips tangents, F flips segments (meshes only)."
      - q: "Which tool changes the curve of a spline segment?"
        choices: ["The rotation tool on a segment", "The translate tool on the midpoint", "Ctrl+Left-click on the segment", "The scale tool, which shows the tangents you can drag"]
        answer_index: 3
        explain: "Control points respond to translate and rotate as usual, but the scale tool brings up spline tangents. Dragging a tangent end changes how curved the segment is."
      - q: "Ctrl+Left-click on an existing segment does what?"
        choices: ["Deletes the segment", "Splits the segment and inserts a new control point", "Joins it to another spline", "Selects every connected segment"]
        answer_index: 1
        explain: "Ctrl+Left-click on a segment splits it at that point and inserts a new control point. Ctrl+Left-click on another spline joins them."
    flavors:
      _default: {why: "Roads and paths are the first thing the eye follows in a landscape; they must sit in the terrain, not on it."}
      level_design: {why: "A spline road is the fastest way to build a readable main route across terrain.", do: "Walk the full road in PIE and note any slope the character cannot climb."}
      tech_art: {why: "Spline meshes and paint layers are a procedural pipeline you can drive for whole maps.", do: "Add a second mesh to Spline Meshes and change Random Seed to see the order change."}

  - id: EAQ79
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [water, river, ocean, landscape, terrain-carving]
    required_spine: false
    required: false
    title: "River into ocean, with shorelines"
    brief: "The Water plugin adds ready-made water actors such as oceans, rivers and lakes. Each water body follows a spline and also carves the landscape under it, so you get a shore and a riverbed without sculpting them by hand. In this quest you place an ocean and a river, control how each one carves the terrain, and blend the place where the river meets the ocean."
    time_min: 80
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/water-body-actors-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/water-system-in-unreal-engine"
    checklist:
      - "Enable the Water plugin and restart the editor. Use a landscape that has Enable Edit Layers turned on. Place a Water Body Ocean and shape its closed spline into a coastline."
      - "Select the WaterZone actor. Under Rendering, in Far Distance, note the value of Far Distance Mesh Extent, and check that the ocean reaches the horizon."
      - "Place a Water Body River that runs from inland down to the ocean. Give its points different heights, and set River Width and Depth for each point."
      - "In the Terrain settings of the river, set Blend Mode to Min. This makes sure the river never raises the terrain inside the area the ocean has carved."
      - "Set Falloff Mode to Width and add an Edge Offset of about 500. This gives you a flat shore on both banks."
      - "Try Curl Noise on the river, with Curl Amount and Curl Tiling, to break up the straight banks. Then try Terracing with a small Terrace Alpha on the ocean shore."
      - "Assign the River to Ocean transition material slot on the river so that the join blends smoothly. Take a screenshot of the mouth of the river."
    done_when: "Send a screenshot of the river mouth where it meets the ocean, blended and with no hard edge. Also send a screenshot of the Terrain settings of the river that shows Blend Mode Min, Falloff Mode and Edge Offset."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Which water body type uses an open spline and lets points have different heights?"
        choices: ["Ocean", "Lake", "River", "Custom"]
        answer_index: 2
        explain: "Rivers are defined by an open spline with start and end points and allow varying heights. Lakes and oceans are closed loops with all points at one height."
      - q: "Why does an Ocean Water Body sometimes show a gap before the horizon, and what fills it?"
        choices: ["Water bodies have a maximum extent; the Water Zone's Far Distance Mesh fills the gap", "The landscape is too small; enlarge the landscape", "The ocean spline is open; close it", "The wave asset is missing; assign one"]
        answer_index: 0
        explain: "Water bodies are limited by their largest Extent Size. The Water Zone provides a Far Distance Mesh with a simplified material (Water_FarMesh) to fill the space cheaply."
      - q: "A river flows into a lake. Which Blend Mode should the river use so it does not raise the terrain inside the lake?"
        choices: ["Alpha Blend", "Max", "Additive", "Min"]
        answer_index: 3
        explain: "Min limits the brush to only lowering terrain. The docs give exactly this example: a river intersecting a lake should use Min."
      - q: "What does the Edge Offset setting do?"
        choices: ["Moves the whole water body up", "Adds a flat edge around the water body before the falloff starts, useful for flat shores", "Offsets the spline points sideways", "Sets the depth at the shoreline"]
        answer_index: 1
        explain: "Edge Offset applies a flat offset from the water's edge before falloff begins. It makes flat shores, even for a river carved through a mountain."
      - q: "What is the difference between Angle and Width falloff?"
        choices: ["Angle falloff extends at a set angle until it meets the terrain; Width falloff uses a fixed width regardless of intersection", "Angle is for oceans; Width is for rivers", "Angle affects paint layers; Width affects height", "There is no difference; they are aliases"]
        answer_index: 0
        explain: "Angle-based falloff extends the shape at an angle until it intersects the landscape. Width-based falloff uses a fixed width no matter where the terrain is."
      - q: "How do rivers drive the motion of their surface?"
        choices: ["With Gerstner waves like oceans", "With the landscape slope", "With a Niagara system", "With velocity per spline point written to a flow map"]
        answer_index: 3
        explain: "Rivers do not use waves. Velocity from each spline point is written to a flow map that moves the water in the direction the spline is going."
      - q: "What is the Island Water Body for?"
        choices: ["Rendering a small lake with waves", "Making sure a piece of land stays above water; it only affects the landscape", "Creating a dry underwater zone", "A water surface for a pool"]
        answer_index: 1
        explain: "Islands only affect the landscape under them, to keep that land above water. Their terraforming is applied after all other water bodies."
      - q: "Two water bodies overlap and no transition material is assigned. Which one's material wins?"
        choices: ["The one created first", "The larger one", "The one with the higher Overlap Material Priority", "The river always wins"]
        answer_index: 2
        explain: "Overlap Material Priority decides precedence when no transition material is applied. Higher values win; the valid range is -8192 to 8191."
    flavors:
      _default: {why: "Shorelines are where water and terrain meet; how they carve decides if the coast looks natural."}
      level_design: {why: "The blend mode and edge offset decide if the shore is walkable.", do: "Add a Water Body Exclusion Volume and walk through a dry tunnel under the river."}
      lookdev: {why: "Transition materials and the far mesh keep the water look consistent to the horizon.", do: "Change the ocean's color, then match the same change in Water_FarMesh."}

  - id: EAQ80
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [runtime-virtual-texture, landscape, materials, blending]
    required_spine: false
    required: false
    title: "Roads and rocks blended with RVT"
    brief: "A Runtime Virtual Texture, or RVT, is a large texture that Unreal fills in while the game runs, usually with the colors of the landscape. Other materials can then read it. Roads can be drawn into it so they become part of the ground, and rocks can take the ground color at their base so they do not look pasted on. In this quest you set up an RVT for your landscape, draw the road into it, and make a rock blend into the ground."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/runtimevirtual-texturing-quick-start-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/runtime-virtual-texturing-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/virtual-texturing-settings-and-properties-in-unreal-engine"
    checklist:
      - "Open Project Settings, then Engine, then Rendering, and find the Virtual Textures section. Enable virtual texture support and restart the editor."
      - "Create a Runtime Virtual Texture asset named RVT_Ground. Set Virtual texture content to Base Color, Normal, Roughness, Specular, and keep border padding at 2 or more."
      - "In your landscape material, enable Use Material Attributes. Write the layer blend into a Runtime Virtual Texture Output node. Read RVT_Ground with a Runtime Virtual Texture Sample node, and send both paths through a Virtual Texture Feature Switch node."
      - "Place a Runtime Virtual Texture Volume and assign RVT_Ground to it. Under Transform from Bounds, pick the landscape as Source Actor and click Set Bounds. Then add RVT_Ground to Draw in Virtual Textures on the landscape."
      - "Open the material of the road mesh from quest EAQ78, or of any spline mesh. Add a Runtime Virtual Texture Output node with Base Color and Roughness. Then select all spline segments and add RVT_Ground under Virtual Texture."
      - "On the RVT Volume, enable Hide Primitives. Check that the road now exists only in the terrain texture."
      - "Make a material named M_RockBlend. Sample RVT_Ground and blend its Base Color into the bottom of a rock mesh so that the rock meets the ground softly. Set a Translucency Sort Priority on the road so that it is drawn above the rock."
