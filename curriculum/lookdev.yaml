    title: "Distance fields that ground your props"
    brief: "A mesh distance field is data that Unreal stores for a mesh, which tells it how far any point in space is from the surface of that mesh. Unreal uses this for Distance Field Ambient Occlusion, or DFAO, which darkens places the sky light cannot reach, such as the ground under rocks and trees. This soft shadow makes props look like they stand on the ground. In this quest you turn distance fields on, look at them in the visualizer, and improve them for a rock or a tree."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/mesh-distance-fields-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/distance-field-ambient-occlusion-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-distance-field-ambient-occlusion-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open an outdoor level with a ground, a Sky Light and a few rocks or bushes on the ground. Spheres and cones from the Place Actors panel work as stand-ins. Open Project Settings, then Engine, then Rendering, and find the Software Ray Tracing section. Enable Generate Mesh Distance Fields and restart the editor."
      - "Set the Mobility of the Sky Light to Movable. Open Show, then Visualize, then Distance Fields Ambient Occlusion, and take a screenshot."
      - "Open Show, then Visualize, then Mesh Distance Fields. Find a rock or a tree that looks blurry or mostly white."
      - "Open that mesh in the Static Mesh Editor. In Build Settings, raise Distance Field Resolution Scale and apply. Read the size of the distance field in the corner of the viewport."
      - "For a tree or bush with a masked leaf material, enable Two-Sided Distance Field Generation and compare the result in the visualizer."
      - "If you painted the bush or a tree with Foliage Mode, enable Affect Distance Field Lighting on that foliage type only, and not on grass."
      - "On the Sky Light, adjust Min Occlusion and Occlusion Contrast until the underside of the trees is dark but not black."
    done_when: "Send a screenshot of the Mesh Distance Fields visualizer that shows your improved rock or tree. Also send a lit before and after of the same spot, with DFAO on and off."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What does a Signed Distance Field store for a static mesh?"
        choices: ["The triangles of the mesh at a lower resolution, stored in a volume texture around the mesh", "A shadow map per light that reaches the mesh, stored in a volume texture", "The distance to the nearest surface in a volume texture, positive outside and negative inside", "A baked ambient occlusion texture that is stored in the second UV channel"]
        answer_index: 2
        explain: "An SDF stores the distance to the nearest surface in a volume texture. Points outside are positive and points inside are negative."
      - q: "Where do you raise the quality of one mesh's distance field?"
        choices: ["Project Settings > Rendering > Distance Field Voxel Density, for that one mesh only", "Distance Field Resolution Scale in the Static Mesh Editor Build Settings", "Occlusion Max Distance in the Details panel of the Sky Light of the level", "The Foliage type's Density setting, in the Foliage Mode panel"]
        answer_index: 1
        explain: "Distance Field Resolution Scale is in the Static Mesh Editor Build Settings. Higher resolution captures more features but increases memory."
      - q: "In the Mesh Distance Fields visualizer, what does a mostly white area mean?"
        choices: ["The mesh has no distance field there, so the ray passed through without a single step", "The resolution is too high for the mesh, and the field uses too much memory there", "The mesh is fully lit by the sky there, so no ray steps were needed to find a surface that blocks it", "Many ray steps were needed to find the surface, for example at grazing angles or with two-sided fields"]
        answer_index: 3
        explain: "Whiter areas mean many steps were needed to find the intersection. Grazing angles and two-sided distance fields show more white."
      - q: "Why enable Two-Sided Distance Field Generation on a tree?"
        choices: ["Masked leaf surfaces with many holes cannot be represented as a solid surface, and two-sided fields work better for them", "It halves the memory cost of the field, because both sides of a leaf share one set of voxels", "It makes the tree cast hard shadows from both sides of each leaf, which the default one-sided fields are not able to do", "It is required for Nanite foliage, which cannot build a one-sided field from masked leaves"]
        answer_index: 0
        explain: "High-density masked meshes like trees cannot be represented as solid. Two-sided generation works well for foliage but has a higher ray marching cost."
      - q: "Why is Affect Distance Field Lighting off by default for foliage types?"
        choices: ["It only works with Lightmass, and foliage instances are never part of a lighting build", "Thousands of grass instances would overflow the tile culling buffer and cause artifacts", "Foliage has no distance field at all, so the option would do nothing", "It disables instancing, so each blade of grass costs one draw call"]
        answer_index: 1
        explain: "Foliage like grass with tens of thousands of instances would overflow the tile culling buffer. Enable it only for the foliage types that need it."
      - q: "How does DFAO get turned on for a level?"
        choices: ["Add a Post Process Volume with Ambient Occlusion Intensity set to 1", "Set the Directional Light to Movable and enable Distance Field Shadows", "Enable Lumen in the Project Settings and set a Sky Light to Stationary", "Enable Generate Mesh Distance Fields and set a Sky Light to Movable"]
        answer_index: 3
        explain: "DFAO needs Generate Mesh Distance Fields in the project and a Sky Light with Mobility set to Movable. Then it is enabled automatically."
      - q: "How are landscapes represented for distance field lighting?"
        choices: ["As a heightfield with approximate cone intersection, not as a mesh distance field", "They are ignored, and only meshes cast distance field shadows", "As one large mesh distance field that covers every component", "As many small mesh distance fields, with one field for each landscape component"]
        answer_index: 0
        explain: "Landscapes use a heightfield, not a mesh distance field. They can receive occlusion, but there is no self-shadowing or distance field shadowing from them."
      - q: "A material uses World Position Offset to sway a tree. What limitation applies?"
        choices: ["The tree loses its distance field entirely, because meshes with World Position Offset are skipped when the fields are built", "DFAO becomes twice as expensive, because the field of the tree has to be built again on every frame while the wind moves its leaves", "Self-shadowing artifacts can appear because the distance field is generated offline and does not know about the deformation", "The Sky Light must be Static, because a Movable Sky Light cannot use the distance fields of meshes that are moved by a material"]
        answer_index: 2
        explain: "Distance fields are generated offline. Materials that deform the mesh with WPO or displacement may cause self-shadowing artifacts."
    flavors:
      _default: {why: "Distance fields give soft sky occlusion under rocks and trees, so props stop floating."}
