        choices: ["Ctrl + N", "Alt + F", "Ctrl + L", "F5"]
        answer_index: 0
        explain: "Ctrl + N toggles the Nanite Fallback option that is also in the viewport Show menu."
      - q: "When does the engine use the fallback mesh of a Nanite prop?"
        choices: ["Only when the prop is far away", "Only in the Static Mesh Editor", "When Nanite is not supported, and for complex collision, baked lighting and hardware ray-traced reflections", "Never, it is only a preview"]
