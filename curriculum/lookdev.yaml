    title: Import a prop the right way
    brief: "A prop is a small object in a level, such as a crate or a lamp. Most props are made in another 3D program and brought into Unreal as an FBX file, a common file format for 3D models. The pivot is the point the prop moves and rotates around, and together with the scale it decides how easy the prop is to place later. In this quest you make a simple prop, import it with the correct pivot and size, and check it next to an object of a known size."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/fbx-static-mesh-pipeline-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/importing-static-meshes-using-fbx-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/fbx-import-options-reference-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/importing-static-mesh-lods-using-fbx-in-unreal-engine"
    checklist:
      - "In your 3D app, make a small prop such as a crate, a barrel or a lamp. Put it at the origin, which is the zero point of the scene, so that the origin is at one corner or at the bottom center of the prop."
      - "Triangulate the mesh in your 3D app before you export it, which means turning all its faces into triangles. Then export it as FBX. Unreal uses the version FBX 2020.2."
      - "In Unreal, click Add/Import in the Content Browser and choose your FBX file. In the FBX Import Options window, look at Import Uniform Scale, Convert Scene Unit and Generate Lightmap UVs before you click Import."
      - "Name the asset SM_<PropName>, with the name of your prop in place of <PropName>. Open it in the Static Mesh Editor and check its size and its pivot."
      - "If the scale is wrong, import the file again with a different Import Uniform Scale. Do not fix it by scaling the actor in the level."
      - "Place SM_<PropName> in a level next to the default mannequin, which is 180 cm tall, or next to a 100 cm cube, to check its size."
    done_when: "Send a screenshot of the Static Mesh Editor that shows SM_<PropName>, and one screenshot of the prop in the level next to an object that shows its size. Add one line that says where your pivot is."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Where does Unreal put the pivot of an imported FBX mesh?"
        choices: ["At the origin (0,0,0) of the 3D app scene", "At the center of the mesh bounds", "At the first vertex of the mesh", "At the camera position when you export"]
        answer_index: 0
        explain: "The pivot is always at the origin when exporting. So you should model at the origin, usually with the origin at one corner, to snap well to the grid."
      - q: "Which is the BEST way to make sure your mesh is triangulated, according to Epic?"
        choices: ["Let the importer triangulate it", "Let the FBX exporter triangulate it", "Triangulate it yourself in the 3D app, controlling the edges", "Do nothing, Unreal renders quads directly"]
        answer_index: 2
        explain: "Manual triangulation in the 3D app gives control over edge direction and placement. Automatic triangulation can give bad results."
      - q: "You want a doorway prop with a hole the player can walk through. What should the collision mesh in the FBX be called if the render mesh is Door_01?"
        choices: ["COL_Door_01", "UCX_Door_01", "Door_01_Collision", "PHYS_Door_01"]
        answer_index: 1
        explain: "Custom collision is found by name. UCX_[RenderMeshName] makes a convex collision piece, and you can add _00, _01 for more pieces."
      - q: "Your FBX has three separate props. What does the importer do by default?"
        choices: ["It refuses to import more than one mesh", "It always merges them into one Static Mesh", "It imports only the first mesh", "It makes three separate Static Mesh assets"]
        answer_index: 3
        explain: "Multiple Static Meshes in one FBX become multiple assets unless you enable Combine Meshes at import."
      - q: "Your prop arrives 100 times too small because the 3D app used meters. Which import option is made for this?"
        choices: ["Bake Pivot in Vertex", "Remove Degenerates", "Convert Scene Unit", "Force Front XAxis"]
        answer_index: 2
        explain: "Convert Scene Unit converts the FBX units of measurement to Unreal's unit, centimeters. Import Uniform Scale is another way to fix scale."
      - q: "What does the Generate Lightmap UVs import option do?"
        choices: ["It makes a set of unique, non-overlapping UVs for static lighting", "It deletes the texture UVs", "It makes the mesh use Nanite", "It bakes the lighting into vertex colors"]
        answer_index: 0
        explain: "Generate Lightmap UVs creates a unique, non-overlapping UV set that baked (static) lighting can use."
