        answer_index: 2
        explain: "BumpOffset_Advanced is a Material Function that adds inputs and outputs not on the regular node, built on the same UV manipulation."
      - q: "When does the Bump Offset illusion break down?"
        choices: ["In bright daylight, when shadows are sharp", "When the camera is nearly parallel to the surface", "When the mesh is scaled up", "When the Blend Mode of the material is set to Masked"]
