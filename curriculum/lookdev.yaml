    xp: 60
    verify_type: screenshot
    quiz:
      - q: "In an Exposure Compensation Curve asset, what do the X and Y axes represent?"
        choices: ["X is screen position, Y is weight", "X is time, Y is brightness", "X is the Average Scene EV100, Y is the resulting Exposure Compensation (Curve) value", "X is ISO, Y is shutter speed"]
        answer_index: 2
        explain: "The curve's X axis is the Average Scene EV100 and the Y axis is the Exposure Compensation (Curve) value. Exposure Compensation (All) is the sum of the settings value and the curve value."
      - q: "How does the Exposure Metering Mask texture change auto exposure?"
        choices: ["Bright areas of the mask have high influence and dark areas low influence, so a center-weighted mask makes bright objects at the screen edge less disruptive", "It sets the minimum brightness", "It replaces the histogram with a single value", "Bright areas of the mask are excluded from metering"]
        answer_index: 0
        explain: "Each pixel is weighted by the mask. Weighting the center more means bright objects at the edges cause fewer abrupt exposure changes."
      - q: "What does Extend default luminance range in Auto Exposure settings do?"
        choices: ["It enables Local Exposure", "It disables the tonemapper", "It doubles the maximum brightness", "It changes Min/Max Brightness and the histogram limits to EV100 so physically correct light values are respected without blowing out"]
        answer_index: 3
        explain: "The setting in Project Settings > Rendering > Default Settings expresses the exposure range in EV100 so real lux values work with auto exposure."
      - q: "Which Local Exposure values does the documentation call good starting points?"
        choices: ["Highlight Threshold 100, Shadow Threshold 100", "Highlight and Shadow Contrast 0.6 to 1, Detail Strength 1, Blurred Luminance Blend 0.4 to 0.6", "Highlight and Shadow Contrast 0, Detail Strength 5", "Middle Grey Bias 4, Detail Strength 0"]
        answer_index: 1
        explain: "Good values for Highlight and Shadow Contrast are between 0.6 and 1. Detail Strength should be 1 in most cases, and Blurred Luminance Blend 0.4 to 0.6."
      - q: "When does the documentation say Local Exposure should always be set up?"
        choices: ["When using Lumen Global Illumination", "When using Manual metering", "When using Static lighting", "When using the Mobile renderer"]
        answer_index: 0
        explain: "Local Exposure preserves highlight and shadow detail in high dynamic range dynamic lighting, and the page says it should always be set up when using Lumen Global Illumination."
      - q: "In the HDR (Eye Adaptation) histogram, what do the blue, purple and white lines mean?"
        choices: ["Blue is last frame, purple is this frame, white is next frame", "Blue is minimum, purple is maximum, white is average", "Blue is the target EV100, purple is the actual current exposure, white is the final exposure after compensation", "Blue is the sky, purple is shadows, white is highlights"]
        answer_index: 2
        explain: "Blue is the target exposure, purple is the actual exposure moving toward it, and white is the final value after exposure compensation."
      - q: "An Exposure Compensation of -2 does what to the image?"
        choices: ["Two times darker", "Four times darker", "Two stops brighter", "Nothing, it is clamped at -1"]
        answer_index: 1
        explain: "Exposure Compensation is logarithmic: -1 is two times darker, -2 is four times darker, 1 is two times brighter and 2 is four times brighter."
      - q: "What is the difference between the Bilateral and Fusion Local Exposure methods?"
