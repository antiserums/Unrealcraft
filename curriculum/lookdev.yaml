    quiz:
      - q: "How does the Volumetric Cloud system render clouds?"
        choices: ["A pre-rendered HDRI that is mapped on the sky and lit by the Sky Light", "A static material on a sky dome mesh, with a panning cloud texture and a normal map on it", "A three-dimensional volume texture that is ray-marched, driven by a Volume-domain material", "Thousands of billboard particles that always face the camera of the player"]
        answer_index: 2
        explain: "The system ray-marches a 3D volume texture through a material-driven approach. This is what allows time-of-day and flying through clouds."
      - q: "Which cloud shadow mode is recommended for clouds seen from the ground and for console targets, and why?"
        choices: ["Beer Shadow Maps, because they are faster and reach far distances even though they lack colored self shadow", "Cascaded Shadow Maps on the Sky Light, because they are the only mode that works on consoles", "Distance Field Shadows, because clouds have a distance field that is very cheap to trace", "Ray Marched, because it is cheaper per pixel and is the only mode that reaches far distances on consoles"]
        answer_index: 0
        explain: "Beer Shadow Maps use cascaded shadow maps, are faster and support far shadow distances. Ray Marched shadows are sharper and colored but limited in distance and more expensive."
      - q: "For a game project, how many octaves of multiple scattering does the documentation recommend?"
        choices: ["Two octaves, the maximum, because a single octave looks flat and the second octave has almost no cost on current consoles", "Four octaves, because each octave after the second one costs nothing and adds light to the dark parts", "Zero, always, because multiple scattering is only meant for offline renders with the Path Tracer", "A single octave, using high Contribution and low Occlusion on the Volumetric Advanced Material expression for a similar look"]
        answer_index: 3
        explain: "Higher octaves make the shader more expensive. For games a single octave is recommended, with Contribution and Occlusion values used to fake more scattering."
      - q: "What does enabling Cast Cloud Shadows on the Directional Light give you, and which property focuses the shadow map around the camera?"
        choices: ["Shadows on the clouds from meshes below them; Dynamic Shadow Distance MovableLight", "Cloud shadows on the scene and sunlight shafts in the atmosphere; Cloud Shadow Extent", "Ambient occlusion on the clouds from the ground and from the meshes below; Cubemap Resolution", "Colored clouds at sunset and sunrise; Cloud Scattering Luminance Scale"]
        answer_index: 1
        explain: "Cast Cloud Shadows lets the cloud volume shadow the scene and cast sunlight shafts. Reducing Cloud Shadow Extent focuses the shadow map resolution around the camera."
      - q: "The documentation says to make instances of the cloud material rather than editing it. Where does the default cloud material live?"
        choices: ["Engine/EngineSky/VolumetricClouds in Engine Content, so editing it affects every project", "The Volumetric Cloud component itself, which stores the graph inside the actor", "Plugins/VolumetricClouds/Materials, which you must enable before you see it", "Content/Sky/Clouds in every project, so each project already has its own copy to edit"]
        answer_index: 0
        explain: "The material is in Engine Content under Engine/EngineSky/VolumetricClouds. Changing Engine Content affects every project that references it, so make instances in your own Content folder."
      - q: "In the cloud material, which color channel drives the storm cloud type?"
        choices: ["Green (Altostratus)", "Blue (Cirrostratus)", "Alpha (Nimbostratus)", "Red (Stratocumulus)"]
        answer_index: 2
        explain: "The four cloud types map to texture channels: R Stratocumulus, G Altostratus, B Cirrostratus and A Nimbostratus, the storm type."
      - q: "What is the trade-off of r.VolumetricRenderTarget.Mode 2?"
        choices: ["Fastest but blurriest, because clouds are traced at quarter resolution", "Looks full resolution and is fast to trace, but clouds do not intersect opaque meshes", "Supports flight from the ground to space, but it is the most expensive of the modes", "It is the cinematic mode with per-pixel quality and the highest cost"]
        answer_index: 1
        explain: "Mode 2 looks high resolution and traces fast but does not support cloud intersection with opaque meshes. Mode 0 supports fast ground-to-space gameplay at quarter-resolution traces."
      - q: "Why does the documentation offer Cloud Scattering Luminance Scale on the atmosphere light?"
        choices: ["To turn off cloud shadows from that light without changing its other settings", "To scale the Sky Light capture of the clouds, so that the ground gets more light", "To change the color of the clouds at night, when the moon is the only atmosphere light in the scene", "To counterbalance energy lost by the octave approximation of multiple scattering, without extra cost"]
        answer_index: 3
        explain: "The octave approximation loses some energy. Cloud Scattering Luminance Scale scales the light contribution with a color picker to compensate at no added expense."
    flavors:
      _default: {why: "Clouds are half the sky. Cloud shadows moving over the ground sell a living world."}
