    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/distance-field-ambient-occlusion-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-distance-field-ambient-occlusion-in-unreal-engine"
    checklist:
      - "Project Settings > Engine > Rendering > Software Ray Tracing: enable Generate Mesh Distance Fields and restart."
      - "In your terrain scene, set the Sky Light Mobility to Movable. Open Show > Visualize > Distance Fields Ambient Occlusion and screenshot it."
      - "Open Show > Visualize > Mesh Distance Fields. Find a rock or tree that looks blurry or mostly white."
      - "Open that mesh in the Static Mesh Editor. In Build Settings raise Distance Field Resolution Scale, apply, and read the distance field size in the viewport corner."
      - "For a tree or bush with a masked leaf material, enable Two-Sided Distance Field Generation and compare the visualizer."
      - "In Foliage Mode, enable Affect Distance Field Lighting on the tree type only, not on grass."
      - "On the Sky Light, adjust Min Occlusion and Occlusion Contrast until the under-side of trees is dark but not black."
    done_when: "Screenshot of the Mesh Distance Fields visualizer with your improved rock or tree, and a lit before/after of the same spot with DFAO on and off."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What does a Signed Distance Field store for a static mesh?"
        choices: ["The mesh triangles at lower resolution", "A shadow map per light", "The distance to the nearest surface in a volume texture, positive outside and negative inside", "A baked ambient occlusion texture"]
        answer_index: 2
        explain: "An SDF stores the distance to the nearest surface in a volume texture. Points outside are positive and points inside are negative."
      - q: "Where do you raise the quality of one mesh's distance field?"
        choices: ["Project Settings > Rendering", "Distance Field Resolution Scale in the Static Mesh Editor Build Settings", "The Sky Light's Occlusion Max Distance", "The Foliage type's Density"]
        answer_index: 1
        explain: "Distance Field Resolution Scale is in the Static Mesh Editor Build Settings. Higher resolution captures more features but increases memory."
      - q: "In the Mesh Distance Fields visualizer, what does a mostly white area mean?"
        choices: ["The mesh has no distance field", "The resolution is too high", "The mesh is fully lit by the sky", "Many ray steps were needed to find the surface, for example at grazing angles or with two-sided fields"]
        answer_index: 3
        explain: "Whiter areas mean many steps were needed to find the intersection. Grazing angles and two-sided distance fields show more white."
      - q: "Why enable Two-Sided Distance Field Generation on a tree?"
        choices: ["Masked leaf surfaces with many holes cannot be represented as a solid surface, and two-sided fields work better for them", "It halves the memory cost", "It makes the tree cast hard shadows", "It is required for Nanite foliage"]
        answer_index: 0
        explain: "High-density masked meshes like trees cannot be represented as solid. Two-sided generation works well for foliage but has a higher ray marching cost."
      - q: "Why is Affect Distance Field Lighting off by default for foliage types?"
        choices: ["It only works with Lightmass", "Thousands of grass instances would overflow the tile culling buffer and cause artifacts", "Foliage has no distance field", "It disables instancing"]
        answer_index: 1
        explain: "Foliage like grass with tens of thousands of instances would overflow the tile culling buffer. Enable it only for the foliage types that need it."
      - q: "How does DFAO get turned on for a level?"
        choices: ["Add a Post Process Volume with AO", "Set the Directional Light to Movable", "Enable Lumen", "Enable Generate Mesh Distance Fields and set a Sky Light to Movable"]
        answer_index: 3
        explain: "DFAO needs Generate Mesh Distance Fields in the project and a Sky Light with Mobility set to Movable. Then it is enabled automatically."
      - q: "How are landscapes represented for distance field lighting?"
        choices: ["As a heightfield with approximate cone intersection, not as a mesh distance field", "They are ignored", "As one large mesh distance field", "As many small distance fields per component"]
        answer_index: 0
        explain: "Landscapes use a heightfield, not a mesh distance field. They can receive occlusion, but there is no self-shadowing or distance field shadowing from them."
      - q: "A material uses World Position Offset to sway a tree. What limitation applies?"
        choices: ["The tree loses its distance field entirely", "DFAO becomes twice as expensive", "Self-shadowing artifacts can appear because the distance field is generated offline and does not know about the deformation", "The Sky Light must be Static"]
        answer_index: 2
        explain: "Distance fields are generated offline. Materials that deform the mesh with WPO or displacement may cause self-shadowing artifacts."
