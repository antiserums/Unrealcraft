      level_design: {why: "Blocking volumes keep routes and combat spaces clear without hand-deleting trees.", do: "Cover every walkable route with blocking volumes before you Resimulate."}

  - id: EAQ110
    rank: 2
    difficulty: adept
    track: environment-art
    subjects: [geometry-script, procedural, blueprint]
    required_for_majors: []
    taster_for_majors: []
    adjacent_for: [tech_art, level_design]
    required_spine: false
    elective: true
    title: Scatter rocks with Geometry Script
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/geometry-scripting-users-guide-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/geometry-scripting-through-blueprints-in-unreal-engine"
    checklist:
      - "Enable the Geometry Script plugin (Edit > Plugins, search geometry script) and restart the editor."
      - "Create a Blueprint from GeneratedDynamicMeshActor named BP_GS_RockScatter. Add public variables Count (Integer, default 30), Radius (Float, default 800) and Seed (Integer). Make all three Instance Editable."
      - "In the Event Graph add Event On Rebuild Generated Mesh. Promote Target Mesh to a variable named DynamicMesh."
      - "Use a Random Stream from Seed and a loop over Count. Each step, build a Transform with a random position inside Radius, random yaw and random scale, and Append Box (or Append Sphere) to DynamicMesh at that transform."
      - "Place BP_GS_RockScatter in your level. Change Count, Radius and Seed in the Details panel and watch the scatter rebuild."
      - "Write two lines in your notes: why the same Target Mesh pin goes in and out of every node, and why you should not use this actor for 5000 instanced rocks."
    done_when: "One screenshot of the level with the scattered rocks, one screenshot of the Event Graph, and the two note lines in the message."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which event does a GeneratedDynamicMeshActor Blueprint use to build its mesh?"
        choices: ["Event BeginPlay", "Event On Rebuild Generated Mesh", "Construction Script", "Event Tick"]
        answer_index: 1
        explain: "GeneratedDynamicMeshActor offers On Rebuild Generated Mesh, which gives better in-editor performance than building in the Construction Script."
      - q: "Most Geometry Scripting nodes take a Target Mesh and also return a Target Mesh. What is the relationship between the two?"
        choices: ["The output is a fresh copy of the input", "They are the same object; the input mesh is modified in place", "The output is a Static Mesh asset", "The output is only used for debugging"]
        answer_index: 1
        explain: "Operations modify the input mesh rather than create a new one, and return the same object so nodes can be chained."
      - q: "How is a UDynamicMesh different from a UStaticMesh?"
        choices: ["A UDynamicMesh is an asset shared by many components", "A UDynamicMesh supports Nanite and a UStaticMesh does not", "A UDynamicMesh is not an asset; each component owns its own mesh", "There is no difference"]
        answer_index: 2
        explain: "UDynamicMesh is not an asset. A Dynamic Mesh Component owns its mesh instead of sharing it, which means instanced rendering is not available."
      - q: "Which feature list is NOT supported by a Dynamic Mesh Component, according to the page?"
        choices: ["Raytracing", "Vertex attribute updates at runtime", "Nanite, Mesh Distance Field, LODs and Instanced Rendering", "Editing in the editor"]
        answer_index: 2
        explain: "The page lists Nanite, Mesh Distance Field, LODs and Instanced Rendering as unsupported. Raytracing is supported."
      - q: "You need a temporary mesh inside your generator and you run the generator often. What does the page recommend?"
        choices: ["Construct Object From Class every time", "Use the Dynamic Mesh Pool with Request and Release Mesh", "Create a Static Mesh asset for the temporary mesh", "Use a Procedural Mesh Component"]
        answer_index: 1
        explain: "Dynamic Mesh Actors have a built-in UDynamicMeshPool. Reusing pooled meshes is more efficient than creating and garbage collecting a new one each run."
      - q: "How do you expose the extra settings of a Geometry Scripting node that are not shown as pins?"
        choices: ["Drag off the empty Options pin or Split Struct Pin on it", "Enable Advanced Display in Project Settings", "Add a Debug node after it", "Open the node's C++ source"]
        answer_index: 0
        explain: "Extra options live in an operation-specific Options structure. Drag off the Options pin, or right-click it and use Split Struct Pin."
      - q: "Where is the mesh data of a Dynamic Mesh Component stored?"
        choices: ["In a separate .uasset in the Content folder", "On the GPU only", "In the project's Config folder", "In the level, or in the OFPA actor file when One File Per Actor is on"]
        answer_index: 3
        explain: "A dynamic mesh is stored in the level only. With One File Per Actor it is stored in the actor file rather than the level file."
      - q: "Why can On Rebuild Generated Mesh not be used in a packaged game to build meshes?"
        choices: ["It only works with Nanite meshes", "It needs a Static Mesh input", "The Generated Dynamic Mesh Actor function is currently editor-only", "It runs on a background thread"]
        answer_index: 2
        explain: "The page says the Generated Dynamic Mesh Actor function is currently editor-only. Geometry Scripting functions run on the Game Thread."
    flavors:
      _default: {why: "Geometry Script gives you a scatter tool you can edit in Blueprint without waiting for a programmer."}
      lookdev: {why: "Small procedural clutter (rubble, pebbles, debris piles) can be one editable actor instead of hand placement.", do: "Replace the Append Box with a Copy Mesh From Static Mesh of a real rock and append it at each transform."}
      tech_art: {why: "This is the base pattern for every custom mesh tool: rebuild event, target mesh chain, exposed parameters.", do: "Add a Bool that switches between Box and Sphere and expose it with Instance Editable."}

