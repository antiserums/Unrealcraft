    title: Brick depth with Bump Offset
    brief: "Bump Offset is a material node that shifts the texture a little depending on the camera angle, using a height map. This makes a flat surface such as a brick wall look like it has depth, and it does not add any triangles. It is cheap, but the effect breaks when you look along the surface from a very low angle. In this quest you add Bump Offset to a brick material and compare it with the plain version."
