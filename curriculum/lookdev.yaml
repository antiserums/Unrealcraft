    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/volumetric-fog-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/exponential-height-fog-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/local-fog-volumes-in-unreal-engine"
    checklist:
      - "Open an outdoor level that has a low area. Place an Exponential Height Fog, enable Volumetric Fog on it, and keep the Fog Density low. Give the Directional Light a Volumetric Scattering Intensity of 1."
      - "Create a material named M_FogSphere and set Material Domain to Volume. Make a SphereMask that compares Absolute World Position with Particle Position and takes its radius from Particle Radius. Multiply it by a tiling noise texture and connect the result to Extinction. Connect a constant 1 to Albedo."
      - "Create a simple Niagara sprite system named NS_LowFog with a few large, slow particles. Assign M_FogSphere in its Sprite Renderer. Place the system in the low area."
      - "Save a camera bookmark. Take a screenshot of the valley with NS_LowFog hidden and another with it visible, both from that same bookmark."
      - "Place a Spot Light in the fog. Turn Cast Volumetric Shadow off and on, and read stat GPU or profilegpu for both cases."
      - "Set Scattering Distribution on the fog to 0.9. Look toward the sun and then away from it. Then set it back to the default."
      - "Add a light that flickers, driven by a Blueprint or by Sequencer. If it leaves trails in the fog, set its Volumetric Scattering Intensity to 0."
    done_when: "Send two screenshots from the same bookmark, one with the fog particles hidden and one with them visible. Add the GPU cost with Cast Volumetric Shadow off and on, and one line on what the noise texture did to the edge of the fog."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What do the outputs of a Volume-domain material describe, and what are their ranges?"
        choices: ["Color and Alpha, any value", "Base Color, Roughness and Opacity, all 0 to 1", "Albedo in 0 to 1, plus Emissive and Extinction as world space densities greater than 0", "Only Extinction, from 0 to 1"]
        answer_index: 2
        explain: "Volume materials describe Albedo, Emissive and Extinction at a point in space. Albedo is 0 to 1; Emissive and Extinction are world space densities above 0."
      - q: "Where do Volume-domain materials currently work, per the documentation?"
        choices: ["Only on particles, with positions inside the particle radius valid, usually handled by a SphereMask", "Only on Landscape", "Only on Post Process Volumes", "On any static mesh"]
        answer_index: 0
        explain: "Volume materials currently only work on particles. Positions inside the particle radius are valid, which is usually handled with a SphereMask."
      - q: "A Spot Light in Volumetric Fog gets Cast Volumetric Shadow enabled. What does that cost?"
        choices: ["It disables the light's regular shadows", "It doubles the fog resolution", "Nothing extra", "Roughly three times the cost of the same unshadowed light in the fog"]
        answer_index: 3
        explain: "Point and Spot Lights with Cast Volumetric Shadow are approximately three times more expensive because they contribute to the volume texture shadowing."
      - q: "A muzzle flash leaves a glowing trail in the fog. Why, and what is the fix?"
        choices: ["The fog Albedo is too high; lower it", "Temporal reprojection smooths the low-resolution voxels, so fast-changing lights leave trails; set that light's Volumetric Scattering Intensity to 0", "The light has no shadow; enable Cast Volumetric Shadow", "The fog View Distance is too small"]
        answer_index: 1
        explain: "Volumetric Fog uses heavy temporal reprojection on low-resolution frustum-aligned voxels, so fast lights leave trails. Set their Volumetric Scattering Intensity to 0."
      - q: "You want strong light shafts without fogging the whole scene. Which approach does the documentation give?"
        choices: ["Keep global density low, raise the Directional Light's Volumetric Scattering Intensity and set Scattering Distribution near 0.9, or add density locally with Volume particles", "Enable Fog Max Opacity", "Increase Start Distance", "Raise global Fog Density until shafts appear"]
        answer_index: 0
        explain: "Keep global fog low, use a higher Volumetric Scattering Intensity on the Directional Light and Scattering Distribution near 0.9, or add local density with Volume particles."
      - q: "What happens when you raise the Volumetric Fog View Distance a lot?"
        choices: ["Lights stop contributing", "The fog becomes sharper", "The fixed number of Z slices is stretched, causing under-sampling artifacts; r.VolumetricFog.GridSizeZ can add slices at a cost", "The fog turns off beyond 10 km"]
        answer_index: 2
        explain: "The fog volume texture has a limited number of Z slices over the View Distance. A larger distance under-samples. r.VolumetricFog.GridSizeZ raises the slice count but costs more."
      - q: "Which of these is listed as NOT supported by Volumetric Fog?"
        choices: ["Shadowing of Stationary Sky Lights", "IES profiles and Light Functions on Point and Spot Lights", "A Directional Light with a Light Function", "Particle lights"]
        answer_index: 1
        explain: "Known issues list IES profiles and Light Functions on Point and Spot Lights, Source Radius on those lights, and some Height Fog settings as unsupported."
      - q: "What mainly controls the GPU cost of Volumetric Fog?"
        choices: ["The Fog Inscattering Color", "The Sky Light Cubemap Resolution", "The number of fog actors", "The volume texture resolution, which is set from the Shadow level of the Engine Scalability settings"]
        answer_index: 3
        explain: "The cost is primarily controlled by the volume texture resolution, which comes from the Shadow scalability level. Volume particles add cost by overdraw and instruction count."
    flavors:
      _default: {why: "Global fog is a mood. Local fog is a composition tool. Particles give you the local part."}
      tech_art: {why: "Volume particles are overdraw in 3D.", do: "Run profilegpu with 3 and with 30 fog particles overlapping and compare the volumetric fog pass."}
      level_design: {why: "Low fog hides floors and reveals routes.", do: "Fill one dead-end with fog particles and leave the true route clear, then ask a peer which way they would go."}

  - id: EAQ90
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [lighting, lightmass, baked-lighting, gpu-lightmass]
    required_spine: false
    required: false
    title: Bake it with GPU Lightmass
    brief: "Baking means that Unreal calculates the lighting once in the editor and stores it in textures, so the game does not have to calculate it while it runs. This is cheaper than Lumen and is still needed on weak hardware. GPU Lightmass is the plugin that does this calculation on the graphics card. In this quest you set up a copy of a level for baking, bake it in two ways, and compare the result with the Lumen version."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/gpu-lightmass-global-illumination-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/understanding-lightmapping-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/generating-lightmap-uvs-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/volumetric-lightmaps-in-unreal-engine"
    checklist:
      - "Duplicate your diorama level and name the copy L_Bake_01. Set the Directional Light and the Sky Light to Stationary, and the local lights to Static. Open Project Settings, then Rendering, and check that Allow Static Lighting is on."
      - "Open Edit > Plugins, go to Built-In, then Editor, and enable GPU Lightmass. Before you restart, open Project Settings and enable Support Hardware Ray Tracing, Enable Virtual Texture Support and Enable Virtual Texture Lightmaps. Under Platforms, then Windows, set Default RHI to DirectX 12. Then restart."
      - "Open Build > GPU Lightmass. Pick Bake What You See, keep the viewport in Realtime, and click Build Lighting. Move a prop while it bakes and watch the tiles update. Click Save, and then Cancel."
      - "Now choose Full Bake. Turn Realtime off in the viewport with Ctrl+R and click Build Lighting. Write down how long it took."
      - "Find one prop whose shadows look blotchy. Raise its Lightmap Resolution in the Details panel, bake again, and compare."
      - "Take a screenshot of the baked level and one of the Lumen version from the same view. Write two lines on what each one does better."
    done_when: "Send two screenshots from the same bookmark, one baked and one with Lumen. Add the time the Full Bake took and two lines that compare them. Also send a screenshot of the GPU Lightmass panel with your settings."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Which lights does GPU Lightmass bake, and what does it require to run?"
        choices: ["All lights; it requires the CPU Lightmass Swarm", "Movable lights; it requires Lumen", "Lights with Static or Stationary mobility; it requires DirectX 12 and Support Hardware Ray Tracing", "Only Directional Lights; it requires Vulkan"]
        answer_index: 2
        explain: "GPU Lightmass precomputes lighting from Static and Stationary lights into lightmaps. It uses DXR, so DirectX 12 and Support Hardware Ray Tracing are required."
      - q: "Do you need Ray Traced Shadows or Ray Traced Skylight enabled for GPU Lightmass?"
        choices: ["No, leave them disabled unless your project needs them for other reasons", "Only Ray Traced Shadows", "Only for Stationary lights", "Yes, both"]
        answer_index: 0
        explain: "They are not needed for GPU Lightmass to function. The page says to leave these features disabled unless you need them."
      - q: "What do Virtual Texture Lightmaps add to a GPU Lightmass workflow?"
        choices: ["Support for Movable lights", "Faster CPU encoding", "Smaller lightmap files on disk", "Real-time updates in the viewport during the bake and editing while it builds; not required just to build lighting"]
        answer_index: 3
        explain: "With Virtual Texture Lightmaps, builds update the viewport in real time and you can edit while it builds. GPULM can still build lighting without them."
      - q: "Where are most GPU Lightmass settings found, compared to CPU Lightmass?"
        choices: ["Both in World Settings", "GPU Lightmass has its own panel under the Build dropdown; CPU Lightmass keeps most settings in World Settings", "Both in Project Settings", "GPU Lightmass settings live on each light"]
        answer_index: 1
        explain: "Unlike CPU Lightmass, almost all GPU Lightmass settings are in the plugin's own panel, opened from Build > GPU Lightmass."
      - q: "In Bake What You See mode, what do Save and Cancel do?"
        choices: ["Save encodes the lightmaps generated so far for what was on screen, but the bake keeps running; Cancel stops it", "Save exports an EXR; Cancel restarts", "Save and Cancel both end the bake", "Save finishes the whole scene; Cancel deletes lightmaps"]
        answer_index: 0
        explain: "BWYS only builds what is visible and waits indefinitely. Save encodes the data made so far and does not end the bake. Cancel stops the process."
      - q: "What is the simplest way to make a GPU Lightmass build much faster?"
        choices: ["Raise Non-Realtime Workload Factor to the maximum", "Enable Realtime in the viewport", "Turn viewport Realtime mode off (Ctrl+R) so the GPU does not also render frames", "Set every mesh to Movable"]
        answer_index: 2
        explain: "With Realtime on, GPULM runs in slow mode because it must also render frames. Turning Realtime off frees the GPU. Workload Factor changes are not a guaranteed speedup."
      - q: "Which memory statement about GPU Lightmass is true per the documentation?"
        choices: ["It bakes using the lowest-detail LOD to save memory", "The whole scene must fit in GPU memory at its highest quality LOD, because GPULM does not consider LODs while baking; lightmaps are not saved to disk until the bake completes", "Lightmaps stream to disk every few seconds", "It needs less memory than DX11 rendering"]
        answer_index: 1
        explain: "GPULM stores the entire scene at the highest quality LOD in GPU memory and does not take LODs into account. Lightmaps stay in RAM until the whole bake finishes."
      - q: "What is a listed limitation of multi-GPU GPU Lightmass baking?"
        choices: ["It disables Virtual Textures", "It only supports one light", "It only works on AMD cards", "Volumetric Lightmap calculation is not supported, and the irradiance cache is built per GPU so tiles can shade slightly differently"]
        answer_index: 3
        explain: "Multi-GPU does not yet support Volumetric Lightmap computation, and per-GPU irradiance caches can cause slight shading differences between tiles."
    flavors:
      _default: {why: "Some targets still need baked light. Knowing the bake path keeps that option open."}
      tech_art: {why: "Baking exposes lightmap UV and resolution problems fast.", do: "Use the Lightmap Density view mode before and after your Lightmap Resolution change."}
      cinematics: {why: "Baked GI plus Lumen reflections is a valid high-quality combination for stills.", do: "Try Lumen Reflections on top of your baked level and screenshot a glossy floor."}

  - id: EAQ91
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [lighting, exposure, post-process, local-exposure]
    required_spine: false
    required: false
    title: Exposure curve and metering mask
    brief: "Auto exposure changes the brightness of the picture as the camera moves between dark and bright places. On its own it can jump too much or make every place look equally bright. Unreal gives you tools to calm it down: a curve that adjusts exposure for dark and bright scenes, a mask that tells the camera which part of the screen to measure, and Local Exposure. In this quest you set up all three on a level with a dark room and a bright doorway. Brightness here is measured in EV100, a camera unit for how bright a scene is."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/auto-exposure-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine"
    checklist:
      - "Open a level that has a dark interior and a door to a bright exterior. In the global Post Process Volume, set Metering Mode to Auto Exposure Histogram."
      - "Open Project Settings, then Rendering, then Default Settings, and enable Extend default luminance range in Auto Exposure settings. Note that Min Brightness and Max Brightness are now shown in EV100."
      - "Turn on Show > Visualize > HDR (Eye Adaptation). Stand outside and then inside, and write down the Average Scene EV100 for both places."
      - "Create a Curve Float asset named CF_ExposureComp (click Add, then Miscellaneous, then Curve). Add a key at your outdoor EV100 with the value -0.5, and a key at your indoor EV100 with the value +0.5. Assign the asset to Exposure Compensation Curve, and watch Exposure Compensation (Curve) change as you walk."
      - "Make a small grayscale texture named T_MeteringMask that is bright in the center and dark at the edges. Assign it to Exposure Metering Mask. Look at the bright door from the side, so that it sits at the edge of the screen, and compare how stable the exposure is."
      - "Open Lens, then Local Exposure, and set Highlight Contrast to 0.8, Shadow Contrast to 0.8 and Blurred Luminance Blend to 0.5. Turn on Show > Visualization > Local Exposure and take a screenshot."
      - "Add a Post Process Volume named PPV_Interior around the room, with Blend Radius 300 and its own Exposure Compensation. Play in the editor, walk through the door and check the transition."
    done_when: "Send a screenshot of the HDR (Eye Adaptation) view that shows your curve values, and one of the Local Exposure visualization. Add your indoor and outdoor EV100 numbers and the curve keys you used."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "In an Exposure Compensation Curve asset, what do the X and Y axes represent?"
        choices: ["X is screen position, Y is weight", "X is time, Y is brightness", "X is the Average Scene EV100, Y is the resulting Exposure Compensation (Curve) value", "X is ISO, Y is shutter speed"]
        answer_index: 2
        explain: "The curve's X axis is the Average Scene EV100 and the Y axis is the Exposure Compensation (Curve) value. Exposure Compensation (All) is the sum of the settings value and the curve value."
      - q: "How does the Exposure Metering Mask texture change auto exposure?"
        choices: ["Bright areas of the mask have high influence and dark areas low influence, so a center-weighted mask makes bright objects at the screen edge less disruptive", "It sets the minimum brightness", "It replaces the histogram with a single value", "Bright areas of the mask are excluded from metering"]
        answer_index: 0
        explain: "Each pixel is weighted by the mask. Weighting the center more means bright objects at the edges cause fewer abrupt exposure changes."
      - q: "What does Extend default luminance range in Auto Exposure settings do?"
        choices: ["It enables Local Exposure", "It disables the tonemapper", "It doubles the maximum brightness", "It changes Min/Max Brightness and the histogram limits to EV100 so physically correct light values are respected without blowing out"]
        answer_index: 3
        explain: "The setting in Project Settings > Rendering > Default Settings expresses the exposure range in EV100 so real lux values work with auto exposure."
      - q: "Which Local Exposure values does the documentation call good starting points?"
        choices: ["Highlight Threshold 100, Shadow Threshold 100", "Highlight and Shadow Contrast 0.6 to 1, Detail Strength 1, Blurred Luminance Blend 0.4 to 0.6", "Highlight and Shadow Contrast 0, Detail Strength 5", "Middle Grey Bias 4, Detail Strength 0"]
        answer_index: 1
        explain: "Good values for Highlight and Shadow Contrast are between 0.6 and 1. Detail Strength should be 1 in most cases, and Blurred Luminance Blend 0.4 to 0.6."
      - q: "When does the documentation say Local Exposure should always be set up?"
        choices: ["When using Lumen Global Illumination", "When using Manual metering", "When using Static lighting", "When using the Mobile renderer"]
        answer_index: 0
        explain: "Local Exposure preserves highlight and shadow detail in high dynamic range dynamic lighting, and the page says it should always be set up when using Lumen Global Illumination."
      - q: "In the HDR (Eye Adaptation) histogram, what do the blue, purple and white lines mean?"
        choices: ["Blue is last frame, purple is this frame, white is next frame", "Blue is minimum, purple is maximum, white is average", "Blue is the target EV100, purple is the actual current exposure, white is the final exposure after compensation", "Blue is the sky, purple is shadows, white is highlights"]
        answer_index: 2
        explain: "Blue is the target exposure, purple is the actual exposure moving toward it, and white is the final value after exposure compensation."
      - q: "An Exposure Compensation of -2 does what to the image?"
        choices: ["Two times darker", "Four times darker", "Two stops brighter", "Nothing, it is clamped at -1"]
        answer_index: 1
        explain: "Exposure Compensation is logarithmic: -1 is two times darker, -2 is four times darker, 1 is two times brighter and 2 is four times brighter."
      - q: "What is the difference between the Bilateral and Fusion Local Exposure methods?"
        choices: ["Bilateral is manual; Fusion is automatic", "They are the same with different names", "Bilateral only works on mobile; Fusion only on PC", "Bilateral splits the image into base and detail layers with a bilateral blur and reduces base contrast; Fusion fuses multiple exposures by quality measures"]
        answer_index: 3
        explain: "Bilateral decomposes the image into base and detail layers and reduces only base contrast to keep detail. Fusion fuses multiple exposures according to quality measures."
    flavors:
      _default: {why: "A curve, a mask and local exposure turn a jumpy image into a calm one, with no per-room hacks."}
      cinematics: {why: "Shots need repeatable exposure, but walk-throughs need adaptive exposure. The curve gives both.", do: "Keep the curve for gameplay and override to Manual on the Cine Camera for one shot."}
      level_design: {why: "Exposure decides whether a doorway reads as a route or a white hole.", do: "Check your main door transition from both directions with the HDR visualization on."}

  - id: EAQ92
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [nanite, static-mesh, fallback-mesh, optimization]
    required_spine: false
    required: false
    title: Nanite fallback mesh you control
    brief: "Nanite lets Unreal draw meshes with millions of triangles. Every Nanite mesh also contains a second, simpler version called the fallback mesh. Unreal uses the fallback for things like collision and ray tracing, and on platforms that cannot run Nanite. In this quest you look at the fallback mesh of a dense prop and learn the settings that control how detailed it is."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/nanite-technical-details"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/nanite-virtualized-geometry-in-unreal-engine"
    checklist:
      - "Pick a dense prop with 100k triangles or more, such as a rock or statue from Fab or Megascans. Duplicate it and name the copy SM_Fallback_Test. In the Static Mesh Editor, under Nanite Settings, turn on Enable Nanite Support."
      - "In the Static Mesh Editor, press Ctrl + N to switch between the full Nanite mesh and the fallback mesh. Write down the triangle count of each."
      - "Set Fallback Target to Fallback Relative Error. Try the value 1.0 and then 0.1. Click Apply Changes each time and compare the triangle count of the fallback mesh."
      - "Set Keep Triangle Percent to 50 and Trim Relative Error to 0.05, and click Apply. Compare the Resource Size in the asset details before and after."
      - "Place the prop in a level. In the console, type r.Nanite 0 to see the fallback mesh drawn in the level. Type r.Nanite 1 to go back."
      - "Type NaniteStats in the console and read the information on screen. Then open View Modes, then Nanite Visualization, then Mask. Nanite meshes are green and meshes without Nanite are red."
    done_when: "Send two screenshots of the Static Mesh Editor, one of the full Nanite mesh and one of the fallback mesh, both with the triangle counts visible. Add one line with the Fallback Relative Error you kept and why."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "In the Static Mesh Editor, which hotkey switches between the full Nanite mesh and the fallback mesh?"
        choices: ["Ctrl + N", "Alt + F", "Ctrl + L", "F5"]
        answer_index: 0
        explain: "Ctrl + N toggles the Nanite Fallback option that is also in the viewport Show menu."
      - q: "When does the engine use the fallback mesh of a Nanite prop?"
        choices: ["Only when the prop is far away", "Only in the Static Mesh Editor", "When Nanite is not supported, and for complex collision, baked lighting and hardware ray-traced reflections", "Never, it is only a preview"]
        answer_index: 2
        explain: "Many engine features need a normal vertex buffer. The fallback mesh serves those cases and platforms without Nanite."
      - q: "You want the fallback mesh to keep every triangle of the source. Which settings do that?"
        choices: ["Keep Triangle Percent 0 and Trim Relative Error 1", "Fallback Triangle Percent 100 and Fallback Relative Error 0", "Position Precision Auto", "Minimum Residency 0"]
        answer_index: 1
        explain: "100 percent keeps all triangles and a relative error of 0 removes nothing."
      - q: "Why does the page tell you to trim Nanite data with Keep Triangle Percent and Trim Relative Error?"
        choices: ["To make the mesh render faster", "To turn on streaming", "To fix cracks between modular pieces", "To reduce disk and download size; by default Nanite stores all source triangles"]
        answer_index: 3
        explain: "Nothing is trimmed by default. Trimming is about data size on disk, not frame rate."
      - q: "You want your own hand-made LODs instead of the auto fallback. What is the correct setup?"
        choices: ["Fallback Triangle Percent 0, import LOD1, set Minimum LOD to 1", "Disable Nanite and re-enable it", "Set Keep Triangle Percent to 100", "Set Max Edge Length Factor to 1"]
        answer_index: 0
        explain: "Minimum LOD 1 makes the engine skip the generated fallback in LOD0. Fallback Triangle Percent 0 keeps that unused fallback tiny."
      - q: "What does the console variable r.Nanite 0 do?"
        choices: ["Deletes Nanite data from the meshes", "Shows the Overdraw visualization", "Turns Nanite rendering off globally, which emulates a platform without Nanite", "Sets the streaming pool to zero"]
        answer_index: 2
        explain: "It is a runtime switch. It is a good way to test what non-Nanite platforms will see."
      - q: "On which meshes should Preserve Area be enabled?"
        choices: ["All Nanite meshes", "Foliage meshes only", "Modular wall pieces", "Meshes with many material slots"]
        answer_index: 1
        explain: "Preserve Area dilates open edges so leaves and grass do not thin out with distance. The page says to use it on foliage and nothing else."
      - q: "What is the storage cost of turning on Explicit Tangents?"
        choices: ["None", "It halves the mesh size", "About 50 percent more", "About 10 percent more"]
        answer_index: 3
        explain: "Tangents are stored on disk instead of derived at runtime. The page gives roughly 10 percent extra storage."
    flavors:
      _default: {why: "Every Nanite prop also ships a fallback mesh. Knowing its settings keeps collision, ray tracing and low-end platforms correct."}
      lookdev: {why: "Ray-traced reflections show the fallback, not the full mesh.", do: "Compare a reflection of the prop with Fallback Relative Error 1.0 and 0.1."}
      tech_art: {why: "Fallback and trim settings are project rules you will set for a whole team.", do: "Write a one-line rule for Fallback Relative Error for hero props and for background props."}

  - id: EAQ93
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [nanite, displacement, tessellation, materials]
    required_spine: false
    required: false
    title: Bake displacement into a Nanite prop
    brief: "A height texture, also called a displacement map, stores how far each part of a surface should stick out. With Nanite you can bake this texture into a mesh: Unreal builds a new, more detailed mesh once, in the editor, with the bumps as real geometry. This gives real surface detail from a simple source mesh. In this quest you bake a displacement map into a Nanite prop and look at the new triangles."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/working-with-naniteenabled-content"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/nanite-technical-details"
    checklist:
      - "Take a simple prop that has Nanite enabled and one material slot, such as a brick block or a stone slab. Name it SM_Disp_Test. Get a height (displacement) texture for its surface, for example from a Fab surface."
      - "Open the prop in the Static Mesh Editor. Under Nanite Settings, set Trim Relative Error to 0.04."
      - "Expand Displacement Maps and add one element (Index 0). Set its Texture to your height map, and set Magnitude to a small value. Start with 2. Click Apply Changes."
      - "Check that Displacement UV Channel matches the UV channel your height map was made for. Then place the prop in a level."
      - "Open View Modes, then Nanite Visualization, then Triangles. Compare the mesh with Magnitude 0 and with your Magnitude."
      - "This step is optional. On a copy of the material, check Enable Tessellation under Nanite in the material Details, connect the height texture to Displacement, and set Magnitude and Center. Compare this tessellation, which happens while the game runs, with the baked result."
    done_when: "Send before and after screenshots of the prop, in the Lit view and in the Nanite Triangles view. Also send a screenshot of the Nanite Settings with Trim Relative Error, Displacement Maps and Magnitude visible."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "For Nanite static displacement, what does the page suggest for Trim Relative Error?"
        choices: ["Exactly 0", "A good default is 0.04, and keep it above 0.02", "Any value above 1", "It must match the Magnitude"]
        answer_index: 1
        explain: "The value targets an error level for the tessellator. Too small only adds triangles and long build times."
      - q: "A prop has three material slots. Which displacement map is used for Material Slot 2?"
        choices: ["Always Index 0", "The last index in the list", "The map with the same name as the material", "Displacement Maps Index 2"]
        answer_index: 3
        explain: "Each Displacement Maps index maps to the material slot with the same number."
      - q: "In a tessellation material, what does Center 0.5 mean?"
        choices: ["Mid gray in the map is no change, so the surface moves in and out equally", "The mesh is scaled by half", "Only half the triangles are displaced", "Displacement starts at half the screen size"]
        answer_index: 0
        explain: "Center sets which displacement value equals the base surface. Use 0 to push only outwards."
      - q: "Why should the Magnitude stay as small as possible?"
