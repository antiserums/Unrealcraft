      - q: "In the ISM Editor you replace one instance with a different static mesh asset. What happens?"
        choices: ["The whole component switches to the new mesh", "A second ISM component is added for the new mesh", "The instance is deleted", "Nothing, replacing is not supported"]
        answer_index: 1
        explain: "When you replace an instance with a new static mesh asset, a second ISM component is added, because one component can only hold one mesh."
      - q: "What is the difference between the XForm Merge tool and the Mesh category Union tool?"
        choices: ["Merge keeps intersecting geometry; Union resolves self-intersections", "Merge works on volumes only", "Union creates an ISM", "There is no difference"]
        answer_index: 0
        explain: "Merge combines meshes into one and keeps intersecting geometry. Union combines meshes and resolves self-intersections."
      - q: "What does the XForm Duplicate tool do?"
        choices: ["Creates an instance in an ISM", "Duplicates a single mesh, creating a new actor", "Copies a mesh to the clipboard", "Tiles the mesh along a grid"]
