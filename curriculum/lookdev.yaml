        choices: ["A LUT texture in a special format", "A Blueprint that stores color spaces", "An old OCIO v1 config", "A compressed archive of a config file and its LUT texture folder"]
        answer_index: 3
        explain: "The plugin supports .ocioz archives, which compress a config file and its LUT folder into one archive."
      - q: "Why should you add only the color spaces you actually need to the Desired Color Spaces list?"
        choices: ["Extra entries cause a compile error", "The list is limited to two entries", "Unused entries slow down the tonemapper", "It keeps the configuration asset lightweight"]
        answer_index: 3
        explain: "The page says to set up only the color profiles you need, so the configuration asset stays as lightweight as possible."
      - q: "How do you apply OCIO to the Level Viewport?"
        choices: ["Show > Visualize > OCIO", "Add an OCIO node to a Post Process Material", "View Mode > OCIO Display, choose the asset, then Enable Display", "Lit > Color Management > OCIO"]
        answer_index: 2
