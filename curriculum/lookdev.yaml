  - id: EAQ59
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [materials, substrate, slab, pbr]
    required_spine: false
    required: false
    title: Substrate awareness
    brief: "Substrate is the newer material system in Unreal Engine 5. Instead of the classic inputs such as Base Color and Metallic, you describe a surface with a building block called a Slab, and you connect it to one input named Front Material. Here F0 is the amount of light a surface reflects when you look straight at it: low for plastic, high for metal. In this quest you check if your project uses Substrate and build two simple Slab materials so that the system is familiar when you meet it."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-substrate-materials-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/substrate-materials-in-unreal-engine"
    checklist:
      - "Open Project Settings, then Rendering, and check whether Substrate materials is enabled in your project. Write down what you found, and also the GBuffer Format."
      - "Create a material named M_Substrate_Test. If Substrate is on, add a Substrate Slab node and connect it to the Front Material input on the root node."
      - "Set Diffuse Albedo to a color, F0 to 0.04 (which is a plastic) and Roughness to 0.3. Apply the material to a sphere."
      - "Duplicate the material. Set F0 to a bright color (which is a metal) and Diffuse Albedo to black. Apply it to a second sphere and compare the two."
      - "Open any old material that does not use Substrate. Right-click the root node and read the Convert to Substrate option. Do NOT convert a material that other people share. Use a copy instead."
      - "Write two lines: one that says what a Slab is made of, and one that says what happens to a converted material if Substrate is turned off."
    done_when: "Send a screenshot of the M_Substrate_Test graph with the Slab connected to Front Material, a screenshot of the two spheres side by side, and the two lines from the last step."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "A new project is created in UE 5.7 or later. Is Substrate on?"
        choices: ["No, it must always be enabled manually", "Yes, Substrate is enabled by default for new projects", "Only on consoles", "Only in the Automotive template"]
        answer_index: 1
        explain: "Substrate is on by default for new projects. Existing projects that upgrade keep the non-Substrate path unless they opt in from Project Settings > Rendering and restart."
      - q: "What must every Substrate material graph connect to?"
        choices: ["The Base Color input", "The Emissive input", "The Front Material input on the root node", "A Material Attributes node"]
        answer_index: 2
        explain: "All Substrate graphs end at the Front Material input on the Material Root node."
      - q: "A Substrate Slab is described as two parts. Which two?"
        choices: ["An interface and a medium", "A base color and a normal", "A diffuse layer and a specular layer", "A front face and a back face"]
        answer_index: 0
        explain: "The interface is where light meets the surface (Roughness, Normal, F0, F90, Diffuse Albedo). The medium is the matter below, where light scatters and is absorbed (Mean Free Path, Diffuse Albedo)."
      - q: "You converted a material with Convert to Substrate. Which statement is true?"
        choices: ["You can undo it any time from the same menu", "The conversion is permanent and the material no longer works in non-Substrate projects", "It only changes the preview", "It deletes the old inputs"]
        answer_index: 1
        explain: "Explicit conversion is permanent and cannot be reverted. Converted materials are not compatible with non-Substrate projects, and render black if Substrate is disabled."
      - q: "A typical dielectric (non-metal) plastic should have which F0 value, in linear space?"
        choices: ["Between 0.02 and 0.06", "Exactly 1.0", "Between 0.5 and 1.0", "Zero"]
        answer_index: 0
        explain: "Dielectrics have F0 around 0.02 to 0.06. Conductors (metals) go from about 0.5 up to 1. Gemstones can reach about 0.18."
      - q: "Your project runs at 60Hz and needs predictable speed. Which GBuffer format does the page describe for that?"
        choices: ["Adaptive GBuffer", "Blendable GBuffer", "High Precision Normals GBuffer", "DBuffer"]
        answer_index: 1
        explain: "Blendable GBuffer targets a fixed memory footprint and predictable speed for 60Hz projects. Adaptive GBuffer targets visual fidelity at a higher, content-dependent cost."
    flavors:
      _default: {why: "Substrate is the material system new projects use. Knowing Slab, F0 and the root input keeps you from being lost."}
      lookdev: {why: "F0 and Diffuse Albedo replace Base Color, Specular and Metallic. Learn the new words before you build a library.", do: "Read one of the Developer's Blog examples (Simple Dielectric) and rebuild it."}
      tech_art: {why: "Conversion is one-way and the GBuffer format changes cost; the team needs one decision, not many."}
      cinematics: {why: "Adaptive GBuffer is what the Automotive and Architectural templates use for fidelity."}

  - id: EAQ60
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [textures, import, mipmaps, texture-editor]
    required_spine: false
    required: false
    title: Import a texture set the right way
    brief: "A texture is an image that a material uses, for example for the color or the roughness of a surface. Unreal stores each texture together with smaller copies of itself called mips, which it uses when the surface is far away to save memory and avoid shimmering. Mips work best when the image size is a power of two, such as 1024 or 2048. In this quest you import a small set of textures and read what Unreal did with them."
    time_min: 35
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/textures-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/texture-asset-editor-in-unreal-engine"
    checklist:
      - "Prepare three images for one surface: a color image, a normal image and a roughness image. Use a power-of-two size such as 1024x1024, and save them as .png or .tga files."
      - "Also prepare one image whose size is not a power of two, for example 1000x700."
      - "Import all four images with the Import button in the Content Browser, or drag them in from your file explorer. Name them T_Wood_BC, T_Wood_N, T_Wood_R and T_Test_NPOT."
      - "Double-click T_Wood_BC to open the Texture Asset Editor. In the Details panel, read the values Imported, Displayed, Max In-Game and Number of Mips."
      - "Enable the Mip Level checkbox in the toolbar and step through the mips one by one. Watch the Displayed size change."
      - "Open T_Test_NPOT and check which value Mip Gen Settings was given at import. Write the value down."
    done_when: "Send one screenshot of the Texture Asset Editor for T_Wood_BC with the texture information visible (Imported size and Number of Mips). Add one line that says which Mip Gen Settings value T_Test_NPOT got at import."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Which texture sizes can be mipmapped and streamed?"
        choices: ["Any size, as long as it is under 8192", "Power-of-two sizes such as 512, 1024, 2048", "Only square sizes", "Only sizes that end in 00, such as 1000 or 2000"]
        answer_index: 1
        explain: "The Textures page says to use power-of-two sizes. They can be mipmapped and streamed. Non-power-of-two sizes are never streamed."
      - q: "You import a 1000x700 image. What does Unreal do to its Mip Gen Settings?"
        choices: ["It sets Mip Gen Settings to NoMipMaps automatically", "It resizes the image to 1024x1024", "It refuses to import the image", "It sets Mip Gen Settings to Sharpen"]
        answer_index: 0
        explain: "Non-power-of-two textures get Mip Gen Settings set to NoMipMaps at import. You can change it later in the Texture Asset Editor."
      - q: "How many mip levels does a 1024x1024 texture get?"
        choices: ["Four", "Twenty", "Ten", "One"]
        answer_index: 2
        explain: "Each mip halves the resolution. The Texture Asset Editor page says a 1024x1024 texture has ten mip levels and a 4096x4096 texture has twelve."
      - q: "Which file type is NOT in the list of supported image formats for import?"
        choices: [".tga", ".exr", ".psd", ".svg"]
        answer_index: 3
        explain: "The supported list includes .bmp, .float, .jpeg, .jpg, .pcx, .png, .psd, .tga, .dds, .exr, .tif and .tiff. Vector formats like .svg are not on it."
      - q: "In the Texture Asset Editor, what does Max In-Game tell you?"
        choices: ["The size of the source file on disk", "The largest size the texture can be in the game, which is never larger than the imported size", "The number of mips that stream", "The size of the checkered background"]
        answer_index: 1
        explain: "Max In-Game is the maximum size while in game. It cannot be larger than the imported size, but it can be smaller because of texture settings."
      - q: "Why do textures use mip maps?"
        choices: ["To make the texture brighter", "To add an alpha channel", "To reduce aliasing at a distance by using lower resolution versions", "To turn on texture streaming for non-power-of-two sizes"]
        answer_index: 2
        explain: "Mip mapping downscales the texture step by step. Far away surfaces use smaller mips, which reduces aliasing and saves rendering time."
    flavors:
      _default: {why: "Every material starts with a texture. Importing it wrong costs memory and makes far surfaces shimmer."}
      lookdev: {why: "A clean import habit means your whole texture library streams and mips correctly.", do: "Set the Texture Group for each of the three textures to match its use (World, WorldNormalMap)."}
      tech_art: {why: "Import rules are the first place a pipeline breaks.", do: "Note which Details fields you would check in an automated import validator."}

  - id: EAQ61
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [textures, compression, oodle, memory]
    required_spine: false
    required: false
    title: Pick the right compression
    brief: "Textures usually take more memory and disk space than anything else in a project, so Unreal compresses them. There are several compression formats, such as BC1 and BC7, and each one gives a different balance between size and quality. In this quest you look at the compression of a texture, compare two formats, and use the Oodle panel to see how large the texture will be on disk."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/texture-asset-editor-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/texture-format-support-and-settings-in-unreal-engine"
    checklist:
      - "Open T_Wood_BC, or any other color texture, in the Texture Asset Editor. Find the Compression category in the Details panel."
      - "Note the value of Compression Settings, and the Format shown in the texture information at the top. Write down the Resource Size."
      - "Open a packed mask texture, which is a texture that stores a different mask in each color channel, or import one. Change Compression Settings to BC7 and compare the Resource Size before and after."
      - "Open the Oodle panel. Enable On-disk Sizes and read the values Uncompressed Size and Compressed Size (Estimate)."
      - "In the Oodle panel, enable Try Encodings and test the RDO Lambda values 0, 30 and 100. Look in the viewport for artifacts, which are small errors in the image caused by compression."
      - "Open Project Settings, then Engine, then Texture Encoding, and find the Fast and Final settings. Do not change them."
    done_when: "Send one screenshot of the Oodle panel with On-disk Sizes enabled. Add a short table (two lines are enough) with the Resource Size of the same texture for BC1/AutoDXT and for BC7."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "A texture holds four unrelated masks, one in each channel, and looks blocky with default DXT compression. Which format does Epic suggest?"
        choices: ["BC7, because it is higher quality for images that do not encode well in BC1", "HDR Compressed (BC6)", "Uncompressed RGBA16F", "Grayscale"]
        answer_index: 0
        explain: "The page says BC7 is higher quality than BC1 and is a good choice for images such as unrelated masks packed into channels. It costs about twice the bytes of BC1 for RGB."
      - q: "How much smaller is HDR Compressed (BC6H) in GPU memory compared to uncompressed HDR (RGBA16F)?"
        choices: ["The same size", "2x smaller", "8x smaller", "100x smaller"]
        answer_index: 2
        explain: "The page recommends BC6H instead of RGBA16F because it is 8x smaller in GPU memory and still high quality."
      - q: "When you import a new texture in the editor, which encode does it get by default?"
        choices: ["Final RDO encode", "Fast non-RDO encode", "No encode until you package", "ASTC encode"]
        answer_index: 1
        explain: "Newly imported textures are encoded with the Fast non-RDO option for speed. Final RDO encoding is used for cooking."
      - q: "In the Oodle Try Encodings section, what does RDO Lambda 0 mean?"
        choices: ["Smallest file size", "Maximum quality loss", "The texture is not compressed at all on the GPU", "RDO is disabled"]
        answer_index: 3
        explain: "The page says 0 disables RDO entirely, 1 gives the largest file size and 100 the smallest."
      - q: "What does a Maximum Texture Size of 0 mean?"
        choices: ["The texture is not rendered", "The texture is 1x1", "The maximum size for the format on each platform is used", "The texture is uncompressed"]
        answer_index: 2
        explain: "0 is the default. It means the maximum size for the format on each platform, not a real zero."
      - q: "Where do you set the project-wide Fast and Final texture encoding options?"
        choices: ["Editor Preferences > Texture Editor", "Project Settings > Engine > Texture Encoding", "The Oodle panel of each texture", "Project Settings > Packaging > Compression"]
        answer_index: 1
        explain: "The page says the Fast and Final settings for the project are found in Project Settings under Engine > Texture Encoding. The Oodle panel Try Encodings are not saved."
    flavors:
      _default: {why: "Textures are the biggest part of most projects. The right format saves memory and disk with no visible loss."}
      lookdev: {why: "You will make hundreds of textures. A wrong default multiplies across all of them.", do: "Write a three-line rule for your project: color, normal and mask textures each get which Compression Setting."}
      tech_art: {why: "RDO and format choices are pipeline policy, not per-artist taste.", do: "Read the Platforms panel for one texture and note how Size and Mips differ between two platforms."}

  - id: EAQ62
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [normal-maps, textures, texture-editor]
    required_spine: false
    required: false
    title: Normal maps that point the right way
    brief: "A normal map is a texture that tells the light which way each small part of a surface faces. It makes a flat surface look like it has bumps and grooves without adding geometry. Different programs save normal maps in two different ways, and if you use the wrong one the bumps look pushed in instead of raised. In this quest you test a normal map on a cube and learn the texture settings that fix it."
    time_min: 35
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/texture-asset-editor-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/material-inputs-in-unreal-engine"
    checklist:
      - "Import a normal map and name it T_Brick_N. Open it in the Texture Asset Editor and confirm that Compression Settings is set to Normalmap."
      - "Make a material named M_NormalTest. Connect T_Brick_N to the Normal input, and apply the material to a cube in a level that has one directional light."
      - "In the Texture Asset Editor, turn Flip Green Channel on and off and watch the cube. Note which setting makes the bumps look raised and not sunken."
      - "Enable Normalize after making Mips. Move the camera far away from the cube and compare the surface with the setting turned off."
      - "Open a roughness texture. Set Composite Texture to T_Brick_N and set Composite Texture Mode to CTM_RoughnessFromNormalAlpha. Try Composite Power at 1 and at 4."
    done_when: "Send two screenshots of the lit cube: one with Flip Green Channel off and one with it on. Add one line that says which one is correct for your normal map."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Your imported normal map makes bumps look like dents. Which Texture setting is made for this problem?"
        choices: ["Flip Green Channel", "sRGB", "Compress without Alpha", "Preserve Border"]
        answer_index: 0
        explain: "Flip Green Channel inverts the green channel of the texture. The page says this is useful for some normal maps."
      - q: "Which mip levels does Normalize after making Mips change?"
        choices: ["Only the top mip level", "All mip levels equally", "Only the lower mip levels, not the top one", "No mip levels; it changes the material"]
        answer_index: 2
        explain: "The page says this setting does not affect the top mip level, only lower mip levels. It makes normal maps in the distance look sharper."
      - q: "Why should normals be normalized before an encoding like BC5 drops components?"
        choices: ["Because BC5 stores color", "Because blended normals in mips get shorter, and dropping components then loses detail so the surface looks flatter far away", "Because it makes the texture smaller on disk", "Because the top mip would otherwise be too sharp"]
        answer_index: 1
        explain: "When mips are made, normals are blended and become shorter (unnormalized). If you drop components without normalizing, the detail disappears in distant mips."
      - q: "What is the Composite Texture setting used for?"
        choices: ["To combine two color textures into one", "To flip the red channel", "To pack four masks into one texture", "To modify roughness based on the normal map variation, mostly from mip maps"]
        answer_index: 3
        explain: "Composite Texture can modify the roughness based on the normal map variation. The normal map should have at least as many mips as this texture."
      - q: "What is the default Composite Power, and which values make the effect stronger?"
        choices: ["Default 0; negative values are stronger", "Default 1; higher whole numbers like 2, 4, 8 are stronger", "Default 100; lower values are stronger", "Default 0.5; any decimal works"]
        answer_index: 1
        explain: "The page says the default is 1 and higher whole number values (1, 2, 4, 8) give a stronger effect. It is not a slider."
      - q: "What does the Normal input on the main material node change?"
        choices: ["The number of polygons on the mesh", "The color of the surface", "The position of the vertices", "The facing direction of each pixel, which gives the illusion of more detail"]
        answer_index: 3
        explain: "The Normal input takes a normal map that modifies the facing direction of each pixel. This gives the illusion of many more polygons than are rendered."
    flavors:
      _default: {why: "A normal map that points the wrong way makes every prop look wrong in every light."}
      lookdev: {why: "Different tools export normal maps with different green channels. You need to know how to fix that in seconds.", do: "Write one line saying which green channel convention your main texturing tool uses."}
      tech_art: {why: "Mip behavior of normal maps is a common cause of flat distant surfaces.", do: "Compare a far view of the cube with Normalize after making Mips on and off and report the difference."}

  - id: EAQ63
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [decals, materials, set-dressing]
    required_spine: false
    required: false
    title: Decal materials, first look
    brief: "A decal is a material that is projected onto other surfaces, like a sticker or a stain. Artists use decals to add cracks, dirt and damage to walls and floors without making new meshes or textures for them. In this quest you make a decal material, project it on a wall with a Decal Actor, and learn how to control which decal is on top and which meshes receive it."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/decal-materials-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/decal-actors-in-unreal-engine"
    checklist:
      - "Create a material named M_Decal_Crack. In the Details panel, set Material Domain to Deferred Decal and Blend Mode to Translucent."
      - "Add a crack texture or a dirt texture to the graph. Connect its color to Base Color and its mask to Opacity. If you like, also connect a normal map to Normal."
      - "Place a Decal Actor from the Visual Effects category of the Place Actors panel. Assign M_Decal_Crack to Decal Material, and rotate the actor so its arrow points at a wall."
      - "Scale the Decal Actor with the scale tool, using a different amount on each axis. Watch how the projection fades at the edges of the box."
      - "Place a second decal that overlaps the first one. Change Sort Order on one of them so that it draws on top of the other."
      - "Put a Static Mesh inside the box of the decal and turn off Receives Decals on that mesh. Confirm that the decal no longer shows on it."
      - "Switch the viewport to the Shader Complexity view mode. Look at the cost in the area where the two decals overlap."
    done_when: "Send one screenshot of the two overlapping decals on the wall, with the Sort Order values visible in the Details panel. Also send one screenshot of the same view in the Shader Complexity view mode."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Which two settings define a decal material?"
        choices: ["Material Domain Surface and Blend Mode Masked", "Material Domain Deferred Decal and Blend Mode Translucent or Alpha Composite", "Shading Model Unlit and Blend Mode Additive", "Material Domain Post Process and Blend Mode Opaque"]
        answer_index: 1
        explain: "Decal Materials use the Deferred Decal material domain with the Translucent or Alpha Composite blend mode."
      - q: "You set a decal material to the Modulate blend mode. What happens?"
        choices: ["The material fails to compile", "The decal turns black", "It compiles, but the blend mode silently falls back to Translucent", "The decal is projected twice"]
        answer_index: 2
        explain: "Modulate is not supported with DBuffer decals. The material still compiles, but the Blend Mode falls back to Translucent."
      - q: "Two decals overlap. How do you choose which one draws on top?"
        choices: ["Set a higher Sort Order on the decal that should be on top", "Move it one unit closer to the wall", "Give it a larger Decal Size", "Set its Fade Duration to 0"]
        answer_index: 0
        explain: "Sort Order controls the render order. Higher values render later, so they appear on top of lower values."
      - q: "A character walks through a Decal Actor box and gets the decal projected on it. What is the fix the page suggests?"
        choices: ["Make the decal smaller", "Disable Receives Decals on the character mesh", "Set the Decal Response of the decal to None", "Change the decal to Alpha Composite"]
        answer_index: 1
        explain: "Static and skeletal meshes have a Receives Decals property. Turn it off on actors like moving characters so the volume does not affect them."
      - q: "What is the default Decal Response of a material that receives decals?"
        choices: ["None", "Color", "Normal Roughness", "Color Normal Roughness"]
        answer_index: 3
        explain: "All materials default to Color Normal Roughness, which applies all DBuffer channels. You can reduce it to only the channels a surface needs."
      - q: "What decides the performance cost of a Decal Actor?"
        choices: ["The polygon count of the meshes under it", "The shader complexity and the size of the decal box on screen", "The number of lights in the level", "The texture import size only"]
        answer_index: 1
        explain: "The Decal Actors page says mesh complexity does not matter. Cost depends on shader complexity and the size of the box on screen, which you can check with the ShaderComplexity view mode."
    flavors:
      _default: {why: "Decals break up repeated textures and add damage and dirt without new geometry."}
      lookdev: {why: "Most of the grime and wear you see in a level is decals, not unique textures.", do: "Make a Material Instance of M_Decal_Crack and use the Decal Color property on the actor to tint one copy."}
      level_design: {why: "Decals are the fastest way to mark a path or a point of interest on a blockout.", do: "Place three decals that guide the player along one route."}

  - id: EAQ64
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [texture-streaming, performance, console-commands, view-modes]
    required_spine: false
    required: false
    title: Watch the texture streamer work
    brief: "Texture streaming is the system that loads only the texture sizes the camera needs at the moment, to save memory. It has a fixed memory budget called the pool. When the pool is too small, textures stay blurry, which is a common problem in finished games. In this quest you watch the streamer work with a stat command and a view mode, and you make the pool too small on purpose to see the result."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/texture-streaming-overview-for-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/texture-streaming-metrics-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/building-texture-streaming-data-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/texture-streaming-configuration-in-unreal-engine"
    checklist:
      - "Open a level with several textured props. Click the dropdown next to the Build button and run Build Texture Streaming."
      - "Play in the editor, open the console and type STAT STREAMING. Read the values Texture Pool, Streaming Pool and Wanted Mips."
      - "Walk close to a prop and then far away from it. Watch the values Visible Mips and Cached Mips change."
      - "Stop playing. In the View Mode menu of the viewport, open the texture streaming accuracy view modes and look at Primitive Distance Accuracy. Note any meshes that are red or green."
      - "Type r.Streaming.PoolSize 50 in the console, play again, and look for blurry textures. Then set the value back to what it was before."
      - "Open one texture in the Texture Asset Editor and find the Never Stream checkbox. Do not enable it. Only note where it is."
    done_when: "Send one screenshot of STAT STREAMING on screen while you play. Also send one screenshot of the Primitive Distance Accuracy view mode, with a short line about what the colors on your meshes mean."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "The streaming pool is too small for the ideal resolution of every texture. What does the streamer do?"
        choices: ["It turns off texture streaming", "It reduces planned quality for selected textures, dropping one mip at a time until it fits the budget", "It deletes textures from the project", "It stops rendering distant objects"]
        answer_index: 1
        explain: "The overview says the streamer drops one mip at a time on selected textures until the planned solution is under budget."
      - q: "Which textures does the streamer try to keep first when dropping mips?"
        choices: ["The largest textures", "UI textures only", "Landscape textures, forced load textures and textures that are already missing resolution", "Textures that were seen longest ago"]
        answer_index: 2
        explain: "The retention priority keeps landscape, forced load and already-reduced textures first, then visible mips, then character and small textures. Non-visible mips are dropped first."
      - q: "Which console command shows texture streaming performance and memory stats?"
        choices: ["STAT STREAMING", "STAT TEXTURES", "SHOW STREAMING", "r.Streaming.Show"]
        answer_index: 0
        explain: "The metrics page says to profile texture streaming with STAT STREAMING, for example STAT STREAMING sortby=name."
      - q: "What happens when r.TextureStreaming is disabled?"
        choices: ["Textures render at the lowest mip", "All texture mips are fully loaded in memory, even for textures never used for rendering", "Only visible mips are loaded", "The texture pool becomes zero"]
        answer_index: 1
        explain: "The configuration page says that with the streamer disabled all mips are fully loaded, even if a texture is never rendered."
