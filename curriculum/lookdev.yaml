  - id: EAQ89
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [lighting, volumetric-fog, niagara, materials]
    required_spine: false
    required: false
    title: Fog particles for a low valley
    brief: "Volumetric Fog is fog that exists as real 3D volume in the scene, so lights can shine through it and form visible beams. Height fog covers the whole level, but you can also add fog in one place only. You do this with particles that use a special Volume material, which add density to the fog where they are. In this quest you put a patch of fog into a low valley with a Niagara particle system and measure what volumetric shadows cost."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/volumetric-fog-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/exponential-height-fog-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/local-fog-volumes-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open an outdoor level that has a low area, or create a new level with a Landscape and sculpt a valley. Place an Exponential Height Fog, enable Volumetric Fog on it, and keep the Fog Density low. Give the Directional Light a Volumetric Scattering Intensity of 1."
      - "Create a material named M_FogSphere and set Material Domain to Volume. Make a SphereMask that compares Absolute World Position with Particle Position and takes its radius from Particle Radius. Multiply it by a tiling noise texture, for example a noise or cloud texture from the engine content, or by a Noise node, and connect the result to Extinction. Connect a constant 1 to Albedo."
      - "Create a simple Niagara sprite system named FXS_LowFog with a few large, slow particles. Assign M_FogSphere in its Sprite Renderer. Place the system in the low area."
      - "Save a camera bookmark. Take a screenshot of the valley with FXS_LowFog hidden and another with it visible, both from that same bookmark."
      - "Place a Spot Light in the fog. Turn Cast Volumetric Shadow off and on, and read stat GPU or profilegpu for both cases."
      - "Set Scattering Distribution on the fog to 0.9. Look toward the sun and then away from it. Then set it back to the default."
      - "Add a light that flickers, driven by a Blueprint or by Sequencer. If it leaves trails in the fog, set its Volumetric Scattering Intensity to 0."
    done_when: "Send two screenshots from the same bookmark, one with the fog particles hidden and one with them visible. Add the GPU cost with Cast Volumetric Shadow off and on, and one line on what the noise texture did to the edge of the fog."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What do the outputs of a Volume-domain material describe, and what are their ranges?"
        choices: ["Color and Alpha, with any value, as for a translucent material on a mesh", "Base Color, Roughness and Opacity, all in 0 to 1, as for any Surface-domain material", "Albedo in 0 to 1, plus Emissive and Extinction as world space densities greater than 0", "Only Extinction, from 0 to 1, because fog has no color of its own"]
        answer_index: 2
        explain: "Volume materials describe Albedo, Emissive and Extinction at a point in space. Albedo is 0 to 1; Emissive and Extinction are world space densities above 0."
      - q: "Where do Volume-domain materials currently work, per the documentation?"
        choices: ["Only on particles, with positions inside the particle radius valid, usually handled by a SphereMask", "Only on Landscape, with positions above the surface valid, usually handled by a height mask in the material", "Only on Post Process Volumes, with positions inside the volume bounds valid", "On any static mesh, with positions inside the bounds of the mesh valid, with no particle system needed"]
        answer_index: 0
        explain: "Volume materials currently only work on particles. Positions inside the particle radius are valid, which is usually handled with a SphereMask."
      - q: "A Spot Light in Volumetric Fog gets Cast Volumetric Shadow enabled. What does that cost?"
        choices: ["It disables the regular shadows of the light on all opaque surfaces", "It doubles the fog resolution inside the cone of that light", "Nothing extra, because the shadow map of the light is reused", "Roughly three times the cost of the same unshadowed light in the fog"]
        answer_index: 3
        explain: "Point and Spot Lights with Cast Volumetric Shadow are approximately three times more expensive because they contribute to the volume texture shadowing."
      - q: "A muzzle flash leaves a glowing trail in the fog. Why, and what is the fix?"
        choices: ["The fog Albedo is too high, so the voxels keep reflecting the flash after it has ended; lower the Albedo on the Exponential Height Fog", "Temporal reprojection smooths the low-resolution voxels, so fast-changing lights leave trails; set that light's Volumetric Scattering Intensity to 0", "The light casts no shadow, so its glow is added to every voxel it has reached and is never removed; enable Cast Volumetric Shadow on that one light", "The fog View Distance is too small, so the flash is drawn in too few voxels and each one stays bright; raise the View Distance"]
        answer_index: 1
        explain: "Volumetric Fog uses heavy temporal reprojection on low-resolution frustum-aligned voxels, so fast lights leave trails. Set their Volumetric Scattering Intensity to 0."
      - q: "You want strong light shafts without fogging the whole scene. Which approach does the documentation give?"
        choices: ["Keep global density low, raise the Directional Light's Volumetric Scattering Intensity and set Scattering Distribution near 0.9, or add density locally with Volume particles", "Enable Fog Max Opacity and set it to a low value, which keeps the shafts of the Directional Light and removes the fog from the rest of the scene around them", "Increase Start Distance until the fog begins behind the objects that cast the shafts, and raise the Fog Height Falloff so that the fog stays close to the ground", "Raise the global Fog Density until the shafts appear, then lower Fog Max Opacity and raise Start Distance so that only the area near the camera stays clear of the thick fog"]
        answer_index: 0
        explain: "Keep global fog low, use a higher Volumetric Scattering Intensity on the Directional Light and Scattering Distribution near 0.9, or add local density with Volume particles."
      - q: "What happens when you raise the Volumetric Fog View Distance a lot?"
        choices: ["Lights stop contributing beyond the old distance, so the far fog is unlit; r.VolumetricFog.GridSizeZ can bring the light back", "The fog becomes sharper, because more slices are added automatically for the longer distance", "The fixed number of Z slices is stretched, causing under-sampling artifacts; r.VolumetricFog.GridSizeZ can add slices at a cost", "The fog turns off beyond 10 km, which is a fixed limit; r.VolumetricFog.GridSizeZ has no effect on it"]
        answer_index: 2
        explain: "The fog volume texture has a limited number of Z slices over the View Distance. A larger distance under-samples. r.VolumetricFog.GridSizeZ raises the slice count but costs more."
      - q: "Which of these is listed as NOT supported by Volumetric Fog?"
        choices: ["Shadowing of Sky Lights by Distance Field Ambient Occlusion", "IES profiles and Light Functions on Point and Spot Lights", "A Directional Light that has a Light Function assigned to it", "Particle lights with Volumetric Scattering Intensity above zero"]
        answer_index: 1
        explain: "Known issues list IES profiles and Light Functions on Point and Spot Lights, Source Radius on those lights, and some Height Fog settings as unsupported."
      - q: "What mainly controls the GPU cost of Volumetric Fog?"
        choices: ["The Fog Inscattering Color, because brighter fog needs more samples per voxel", "The Cubemap Resolution of the Sky Light, which is set from the Effects level of Engine Scalability", "The number of fog actors in the level, because each one renders its own volume", "The volume texture resolution, which is set from the Shadow level of the Engine Scalability settings"]
        answer_index: 3
        explain: "The cost is primarily controlled by the volume texture resolution, which comes from the Shadow scalability level. Volume particles add cost by overdraw and instruction count."
    flavors:
      _default: {why: "Global fog is a mood. Local fog is a composition tool. Particles give you the local part."}
      tech_art: {why: "Volume particles are overdraw in 3D.", do: "Run profilegpu with 3 and with 30 fog particles overlapping and compare the volumetric fog pass."}
      level_design: {why: "Low fog hides floors and reveals routes.", do: "Fill one dead-end with fog particles and leave the true route clear, then ask a peer which way they would go."}

  - id: EAQ90
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [lighting, lightmass, baked-lighting, gpu-lightmass]
    required_spine: false
    required: false
    title: Bake it with GPU Lightmass
    brief: "Baking means that Unreal calculates the lighting once in the editor and stores it in textures, so the game does not have to calculate it while it runs. This is cheaper than Lumen and is still needed on weak hardware. GPU Lightmass is the plugin that does this calculation on the graphics card. In this quest you set up a copy of a level for baking, bake it in two ways, and compare the result with the Lumen version."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/gpu-lightmass-global-illumination-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/understanding-lightmapping-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/generating-lightmap-uvs-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/volumetric-lightmaps-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Pick a small level with a Directional Light, a Sky Light, a few local lights and some props. If you have none, build a small room scene from cubes and other simple shapes in a new Basic level and add two Point Lights. Duplicate the level and name the copy L_Bake_01. Set the Directional Light and the Sky Light to Stationary, and the local lights to Static. Open Project Settings, then Rendering, and check that Allow Static Lighting is on."
      - "Open Edit > Plugins, go to Built-In, then Editor, and enable GPU Lightmass. Before you restart, open Project Settings and enable Support Hardware Ray Tracing, Enable Virtual Texture Support and Enable Virtual Texture Lightmaps. Under Platforms, then Windows, set Default RHI to DirectX 12. Then restart."
      - "Open Build > GPU Lightmass. Pick Bake What You See, keep the viewport in Realtime, and click Build Lighting. Move a prop while it bakes and watch the tiles update. Click Save, and then Cancel."
      - "Now choose Full Bake. Turn Realtime off in the viewport with Ctrl+R and click Build Lighting. Write down how long it took."
      - "Find one prop whose shadows look blotchy. Raise its Lightmap Resolution in the Details panel, bake again, and compare."
      - "Take a screenshot of the baked level and one of the Lumen version from the same view. Write two lines on what each one does better."
    done_when: "Send two screenshots from the same bookmark, one baked and one with Lumen. Add the time the Full Bake took and two lines that compare them. Also send a screenshot of the GPU Lightmass panel with your settings."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Which lights does GPU Lightmass bake, and what does it require to run?"
        choices: ["All lights of any mobility; it requires the CPU Lightmass Swarm Agent and Swarm Coordinator to run", "Movable lights only; it requires Lumen to be enabled in the Project Settings and a Sky Light with Real Time Capture", "Lights with Static or Stationary mobility; it requires DirectX 12 and Support Hardware Ray Tracing", "Only Directional Lights; it requires Vulkan and a Linux build of the editor"]
        answer_index: 2
        explain: "GPU Lightmass precomputes lighting from Static and Stationary lights into lightmaps. It uses DXR, so DirectX 12 and Support Hardware Ray Tracing are required."
      - q: "Do you need Ray Traced Shadows or Ray Traced Skylight enabled for GPU Lightmass?"
        choices: ["No, leave them disabled unless your project needs them for other reasons", "Only Ray Traced Shadows, because they are used for the direct light of the bake", "Only for Stationary lights, which bake their shadows with ray tracing on", "Yes, both, or the bake stops with an error that names the missing project setting"]
        answer_index: 0
        explain: "They are not needed for GPU Lightmass to function. The page says to leave these features disabled unless you need them."
      - q: "What do Virtual Texture Lightmaps add to a GPU Lightmass workflow?"
        choices: ["Support for Movable lights in the bake, which are stored in a separate lightmap layer and can then be moved without a new lighting build", "Faster CPU encoding of the lightmaps after the bake, because virtual textures are written in small tiles and need no compression at all", "Smaller lightmap files on disk, because only the tiles that the camera has seen in the editor are saved to the level", "Real-time updates in the viewport during the bake and editing while it builds; not required just to build lighting"]
        answer_index: 3
        explain: "With Virtual Texture Lightmaps, builds update the viewport in real time and you can edit while it builds. GPULM can still build lighting without them."
      - q: "Where are most GPU Lightmass settings found, compared to CPU Lightmass?"
        choices: ["Both in World Settings, under Lightmass, where the GPU option only adds one checkbox that switches the baker to the GPU", "GPU Lightmass has its own panel under the Build dropdown; CPU Lightmass keeps most settings in World Settings", "Both in Project Settings, under Rendering > Lightmass, in one shared section", "GPU Lightmass settings live on each light in its Details panel; CPU Lightmass keeps them in Project Settings"]
        answer_index: 1
        explain: "Unlike CPU Lightmass, almost all GPU Lightmass settings are in the plugin's own panel, opened from Build > GPU Lightmass."
      - q: "In Bake What You See mode, what do Save and Cancel do?"
        choices: ["Save encodes the lightmaps generated so far for what was on screen, but the bake keeps running; Cancel stops it", "Save exports an EXR of the lightmaps that were generated so far, and the bake goes on; Cancel restarts the bake from the first sample", "Save and Cancel both end the bake; the only difference is whether lightmaps are kept", "Save finishes the bake for the whole scene, also for what was off screen; Cancel deletes all existing lightmaps"]
        answer_index: 0
        explain: "BWYS only builds what is visible and waits indefinitely. Save encodes the data made so far and does not end the bake. Cancel stops the process."
      - q: "What is the simplest way to make a GPU Lightmass build much faster?"
        choices: ["Raise the Non-Realtime Workload Factor to the maximum value that the panel allows", "Enable Realtime in the viewport, so the GPU keeps the scene in memory and shares it with the bake", "Turn viewport Realtime mode off (Ctrl+R) so the GPU does not also render frames", "Set every mesh to Movable, so that fewer surfaces need a lightmap and the bake has less to do"]
        answer_index: 2
        explain: "With Realtime on, GPULM runs in slow mode because it must also render frames. Turning Realtime off frees the GPU. Workload Factor changes are not a guaranteed speedup."
      - q: "Which memory statement about GPU Lightmass is true per the documentation?"
        choices: ["It bakes using the lowest-detail LOD of each mesh to save GPU memory, and lightmaps are written to disk tile by tile while the bake runs, so that a crash loses almost nothing", "The whole scene must fit in GPU memory at its highest quality LOD, because GPULM does not consider LODs while baking; lightmaps are not saved to disk until the bake completes", "Lightmaps stream to disk every few seconds while the bake runs, and the scene is loaded tile by tile, so even a very large level fits on a small card with no trouble", "It needs less memory than DX11 rendering, because the scene is kept in system memory and only the tile that is being baked at the moment is sent to the GPU"]
        answer_index: 1
        explain: "GPULM stores the entire scene at the highest quality LOD in GPU memory and does not take LODs into account. Lightmaps stay in RAM until the whole bake finishes."
      - q: "What is a listed limitation of multi-GPU GPU Lightmass baking?"
        choices: ["It disables Virtual Textures on all GPUs but the first one, so the viewport cannot show any of the lightmaps while the bake is running", "It only supports one light per GPU, so a level with eight lights needs eight cards, and every light after that is skipped by the bake without any warning", "It only works on AMD cards, and all the cards in the machine must be the same model with the same amount of memory, or the bake fails", "Volumetric Lightmap calculation is not supported, and the irradiance cache is built per GPU so tiles can shade slightly differently"]
        answer_index: 3
        explain: "Multi-GPU does not yet support Volumetric Lightmap computation, and per-GPU irradiance caches can cause slight shading differences between tiles."
    flavors:
      _default: {why: "Some targets still need baked light. Knowing the bake path keeps that option open."}
      tech_art: {why: "Baking exposes lightmap UV and resolution problems fast.", do: "Use the Lightmap Density view mode before and after your Lightmap Resolution change."}
      cinematics: {why: "Baked GI plus Lumen reflections is a valid high-quality combination for stills.", do: "Try Lumen Reflections on top of your baked level and screenshot a glossy floor."}

  - id: EAQ91
    rank: 2
    difficulty: adept
    specializations: [lookdev]
    subjects: [lighting, exposure, post-process, local-exposure]
    required_spine: false
    required: false
    title: Exposure curve and metering mask
    brief: "Auto exposure changes the brightness of the picture as the camera moves between dark and bright places. On its own it can jump too much or make every place look equally bright. Unreal gives you tools to calm it down: a curve that adjusts exposure for dark and bright scenes, a mask that tells the camera which part of the screen to measure, and Local Exposure. In this quest you set up all three on a level with a dark room and a bright doorway. Brightness here is measured in EV100, a camera unit for how bright a scene is."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/auto-exposure-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a level that has a dark interior and a door to a bright exterior, or build a closed box from cubes with one open door in a new Basic level. Place a Post Process Volume with Infinite Extent (Unbound) turned on as the global volume, if the level has none, and set its Metering Mode to Auto Exposure Histogram."
      - "Open Project Settings, then Rendering, then Default Settings, and enable Extend default luminance range in Auto Exposure settings. Note that Min Brightness and Max Brightness are now shown in EV100."
      - "Turn on Show > Visualize > HDR (Eye Adaptation). Stand outside and then inside, and write down the Average Scene EV100 for both places."
      - "Create a Curve Float asset named CF_ExposureComp (click Add, then Miscellaneous, then Curve). Add a key at your outdoor EV100 with the value -0.5, and a key at your indoor EV100 with the value +0.5. Assign the asset to Exposure Compensation Curve, and watch Exposure Compensation (Curve) change as you walk."
      - "Make a small grayscale texture named T_MeteringMask that is bright in the center and dark at the edges. Assign it to Exposure Metering Mask. Look at the bright door from the side, so that it sits at the edge of the screen, and compare how stable the exposure is."
      - "Open Lens, then Local Exposure, and set Highlight Contrast to 0.8, Shadow Contrast to 0.8 and Blurred Luminance Blend to 0.5. Turn on Show > Visualization > Local Exposure and take a screenshot."
      - "Add a Post Process Volume named PPV_Interior around the room, with Blend Radius 300 and its own Exposure Compensation. Play in the editor, walk through the door and check the transition."
    done_when: "Send a screenshot of the HDR (Eye Adaptation) view that shows your curve values, and one of the Local Exposure visualization. Add your indoor and outdoor EV100 numbers and the curve keys you used."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "In an Exposure Compensation Curve asset, what do the X and Y axes represent?"
        choices: ["X is the screen position of a pixel, Y is the weight of that pixel in the metering mask", "X is time in seconds since the level started, Y is the brightness that the scene should have then", "X is the Average Scene EV100, Y is the resulting Exposure Compensation (Curve) value", "X is the ISO of the camera, Y is the shutter speed"]
        answer_index: 2
        explain: "The curve's X axis is the Average Scene EV100 and the Y axis is the Exposure Compensation (Curve) value. Exposure Compensation (All) is the sum of the settings value and the curve value."
      - q: "How does the Exposure Metering Mask texture change auto exposure?"
        choices: ["Bright areas of the mask have high influence and dark areas low influence, so a center-weighted mask makes bright objects at the screen edge less disruptive", "It sets the minimum brightness for each pixel, so that dark areas of the mask can never be darker on screen than the value painted there, whatever the exposure is", "It replaces the histogram with a single value that is read from the center pixel of the mask", "Bright areas of the mask are excluded from metering and dark areas count fully, so a center-weighted mask makes the edges of the screen set the whole exposure"]
        answer_index: 0
        explain: "Each pixel is weighted by the mask. Weighting the center more means bright objects at the edges cause fewer abrupt exposure changes."
      - q: "What does Extend default luminance range in Auto Exposure settings do?"
        choices: ["It enables Local Exposure for every Post Process Volume in the project, and it sets the contrast values of the highlights and the shadows to the physical defaults", "It disables the tonemapper, so that light values are shown without any curve", "It doubles the maximum brightness that auto exposure can adapt to, so very bright lights no longer clamp the histogram at its upper end", "It changes Min/Max Brightness and the histogram limits to EV100 so physically correct light values are respected without blowing out"]
        answer_index: 3
        explain: "The setting in Project Settings > Rendering > Default Settings expresses the exposure range in EV100 so real lux values work with auto exposure."
      - q: "Which Local Exposure values does the documentation call good starting points?"
        choices: ["Highlight Threshold 100, Shadow Threshold 100, Detail Strength 5, Blurred Luminance Blend 0", "Highlight and Shadow Contrast 0.6 to 1, Detail Strength 1, Blurred Luminance Blend 0.4 to 0.6", "Highlight and Shadow Contrast 0, Detail Strength 5, Blurred Luminance Blend 1", "Middle Grey Bias 4, Detail Strength 0, Blurred Luminance Blend 0"]
        answer_index: 1
        explain: "Good values for Highlight and Shadow Contrast are between 0.6 and 1. Detail Strength should be 1 in most cases, and Blurred Luminance Blend 0.4 to 0.6."
      - q: "When does the documentation say Local Exposure should always be set up?"
        choices: ["When using Lumen Global Illumination", "When using Manual metering", "When using Static lighting", "When using the Mobile renderer only"]
        answer_index: 0
        explain: "Local Exposure preserves highlight and shadow detail in high dynamic range dynamic lighting, and the page says it should always be set up when using Lumen Global Illumination."
      - q: "In the HDR (Eye Adaptation) histogram, what do the blue, purple and white lines mean?"
        choices: ["Blue is the exposure of the last frame, purple is the exposure of this frame, white is the one of the next frame", "Blue is the minimum brightness, purple is the maximum brightness, white is the average of the two values of the frame", "Blue is the target EV100, purple is the actual current exposure, white is the final exposure after compensation", "Blue is the sky, purple is the shadows, white is the highlights"]
        answer_index: 2
        explain: "Blue is the target exposure, purple is the actual exposure moving toward it, and white is the final value after exposure compensation."
      - q: "An Exposure Compensation of -2 does what to the image?"
