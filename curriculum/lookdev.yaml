    xp: 55
    verify_type: screenshot
    quiz:
      - q: "What does the Opacity Mask Clip Value do in a Masked material?"
        choices: ["It sets the cutoff: mask values darker than it are not rendered", "It blurs the mask", "It sets how transparent the material is", "It controls the refraction"]
        answer_index: 0
        explain: "Masked is on/off. Pixels whose mask value is below the Opacity Mask Clip Value are discarded. There are no in-between levels."
      - q: "A translucent gradient sphere: what does black in the Opacity input mean?"
        choices: ["Fully opaque", "Fully transparent", "Half transparent", "Not rendered and no reflections"]
        answer_index: 1
        explain: "In Translucent mode, black areas of Opacity are fully transparent, white areas are fully opaque, and grays are in between."
      - q: "Two Additive spheres overlap. What do you see in the overlap?"
        choices: ["It gets darker", "It disappears", "It gets brighter, because pixel values are added", "It turns gray"]
        answer_index: 2
        explain: "Additive adds the material's pixels to the background. Overlaps are brighter and black renders as transparent. Modulate multiplies and darkens instead."
      - q: "Why can Masked be cheaper than Translucent for a fence?"
        choices: ["Masked uses fewer textures", "Masked pixels that are cut are not drawn or calculated at all", "Masked disables lighting", "Masked has no Opacity input"]
        answer_index: 1
        explain: "Culled masked pixels simply do not draw, so nothing is calculated for them. But they also show no reflections in those areas."
      - q: "You need specular highlights from a Point Light on a translucent surface. Which Lighting Mode gives them?"
        choices: ["Volumetric NonDirectional", "Volumetric PerVertex NonDirectional", "Surface TranslucencyVolume", "Surface ForwardShading"]
        answer_index: 3
        explain: "Surface ForwardShading computes each light per pixel, so specular highlights from local lights are supported. It is also the most expensive mode."
      - q: "Which Lighting Mode is the cheapest per pixel and meant for smoke and dust?"
        choices: ["Volumetric NonDirectional", "Surface ForwardShading", "Surface TranslucencyVolume", "Thin Translucent"]
        answer_index: 0
        explain: "Volumetric NonDirectional lights a volume without direction and ignores the material normal. It is the cheapest per-pixel method."
