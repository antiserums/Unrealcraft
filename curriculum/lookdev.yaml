    title: HLOD Layers for distant art
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition---hierarchical-level-of-detail-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition---data-layers-in-unreal-engine"
    checklist:
      - "In a World Partition level, create two HLOD Layer assets in the Content Drawer (Miscellaneous > HLOD Layer): HLOD_Buildings with Layer Type Merged Mesh and HLOD_Trees with Layer Type Instancing."
      - "On HLOD_Buildings enable Generate Nanite Enabled Mesh and set Merge Materials on. On HLOD_Trees leave Instancing defaults."
      - "Select your building meshes, set Mobility to Static and set the HLOD property in Details to HLOD_Buildings. Do the same for tree actors with HLOD_Trees."
      - "In World Settings set Default HLOD Layer to HLOD_Buildings so new static actors get a layer by default."
      - "Run Build > Build HLODs. Then move the camera far away, or unload cells, and compare the view with HLODs on and off."
      - "Open one generated HLOD actor and note its Cell Size and Loading Range. Write one line on why the trees used Instancing and the buildings used Merged Mesh."
    done_when: "Two screenshots from the same far camera: one with HLODs showing and one without, plus a screenshot of the two HLOD Layer assets' settings."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "What is the main purpose of World Partition HLODs?"
        choices: ["To bake lighting for far objects", "To show distant, non-interactive content from unloaded cells as a proxy and reduce draw calls", "To replace Nanite on low-end hardware", "To stream textures faster"]
        answer_index: 1
        explain: "HLODs replace content in unloaded World Partition cells with generated proxy meshes, cutting draw calls and keeping distant art visible."
      - q: "Which HLOD Layer type is described as ideal for trees and foliage?"
        choices: ["Merged Mesh", "Simplified Mesh", "Instancing", "Always Loaded"]
        answer_index: 2
        explain: "Instancing replaces the assets with ISM components using their lowest LOD. The page says it is ideal for imposter meshes like trees and foliage."
      - q: "What is the difference between Merged Mesh and Simplified Mesh layer types?"
        choices: ["Merged keeps materials, Simplified removes them", "Both merge into one proxy, but Simplified Mesh also runs mesh simplification", "Merged is for Nanite, Simplified is for non-Nanite", "Simplified only works with landscapes"]
        answer_index: 1
        explain: "Both merge Static Mesh assets into a single proxy mesh. Simplified Mesh additionally performs mesh simplification."
      - q: "You enable Always Loaded on an HLOD Layer. Which settings become unavailable?"
        choices: ["Layer Type and HLODMaterial", "Cell Size and Loading Range", "Merge Materials and Gutter Size", "Parent Layer only"]
        answer_index: 1
        explain: "Cell Size and Loading Range configure the runtime grid for streaming the HLOD actors, so they are not available when the layer is Always Loaded."
      - q: "Which of these is NOT a way the page lists for adding actors to an HLOD Layer?"
        choices: ["The HLOD property in the actor's Details panel", "The Default HLOD Layer of a Data Layer", "The Default HLOD Layer in World Settings", "Painting the actor in Foliage Mode"]
        answer_index: 3
        explain: "Actors get an HLOD Layer through the actor's HLOD property, a Data Layer's Default HLOD Layer, or the World Settings default. Foliage Mode is not listed."
      - q: "Before HLODs can be generated for an actor, what must its Mobility be?"
        choices: ["Movable", "Stationary", "Static", "Any mobility works"]
        answer_index: 2
        explain: "The page says actors need to be in an HLOD Layer, have Mobility set to Static, and then be built with Build > Build HLODs or the commandlet."
      - q: "You re-run the HLOD builder after changing nothing. What happens to existing HLOD actors?"
        choices: ["They are all rebuilt from scratch", "They are deleted", "They are not rebuilt because their source actors did not change", "The build fails"]
        answer_index: 2
        explain: "HLOD actors are not recreated if no changes were made to their source actors. Changing meshes, materials or textures triggers a rebuild."
      - q: "What does the Gutter Size setting in Mesh Merge Settings control?"
        choices: ["The distance between HLOD cells", "The pixel space between UV islands in the baked material, to avoid bleeding when mipmaps downsample", "The gap closed between doors and windows", "The screen size of the proxy mesh"]
        answer_index: 1
        explain: "Gutter Size is space in pixels between UV islands so colors do not overlap as the texture is downsampled. Merge Distance is the door and window closing setting."
    flavors:
      _default: {why: "Distant art only looks good if it is still there when its cell unloads. HLOD Layers are how you decide what it becomes."}
      lookdev: {why: "Choosing Instancing versus Merged Mesh per asset type is an art call as much as a performance call.", do: "Compare the far silhouette of the trees with Instancing versus Merged Mesh and keep the one that reads better."}
      level_design: {why: "Landmarks must stay visible from far away for wayfinding, and HLODs make that possible.", do: "Make sure your main landmark is in a layer with a large enough Loading Range."}

