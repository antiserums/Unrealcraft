    title: Volumetric Clouds that cast shadows
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/volumetric-cloud-component-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/volumetric-cloud-material-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/environment-light-mixer-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/sky-lights-in-unreal-engine"
    checklist:
      - "Start from a level with a Directional Light (Atmosphere Sun Light on), a Sky Atmosphere and a Sky Light with Real Time Capture on. Use Window > Env. Light Mixer to add a Volumetric Cloud."
      - "In the Content Browser enable Show Engine Content. Find Engine/EngineSky/VolumetricClouds and make a Material Instance of the cloud material in your own Content folder. Name it MI_Clouds_01 and assign it to the Volumetric Cloud component."
      - "In MI_Clouds_01 change Layout_GlobalCoverage, the Layout_CloudType channels and Cloud_GlobalDensity until you have a partly cloudy sky. Add a little wind with Layout_WindControls."
      - "On the Directional Light enable Cast Cloud Shadows. Try Cloud Shadow Extent small and large, and Cloud Shadow Map Resolution Scale 0.5 and 2. Screenshot the cloud shadows on the ground."
      - "On the Sky Light open Atmosphere and Cloud and raise the Cloud Ambient Occlusion strength. Compare the cloud bottoms."
      - "In the console try r.VolumetricRenderTarget.Mode 0, 1 and 2 while flying near a tall mesh that reaches the cloud layer. Note which mode does not intersect it. Set it back to the default."
      - "Turn Storm_Clouds up in MI_Clouds_01 and take one screenshot of the storm look."
    done_when: "Two screenshots: your partly cloudy sky with cloud shadows on the ground, and the storm version. Plus one line naming the r.VolumetricRenderTarget.Mode you would ship for a ground-view game and why."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "How does the Volumetric Cloud system render clouds?"
        choices: ["A pre-rendered HDRI", "A static material on a sky dome mesh", "A three-dimensional volume texture that is ray-marched, driven by a Volume-domain material", "Thousands of billboard particles"]
        answer_index: 2
        explain: "The system ray-marches a 3D volume texture through a material-driven approach. This is what allows time-of-day and flying through clouds."
      - q: "Which cloud shadow mode is recommended for clouds seen from the ground and for console targets, and why?"
        choices: ["Beer Shadow Maps, because they are faster and reach far distances even though they lack colored self shadow", "Cascaded Shadow Maps on the Sky Light", "Distance Field Shadows", "Ray Marched, because it is cheaper"]
        answer_index: 0
        explain: "Beer Shadow Maps use cascaded shadow maps, are faster and support far shadow distances. Ray Marched shadows are sharper and colored but limited in distance and more expensive."
      - q: "For a game project, how many octaves of multiple scattering does the documentation recommend?"
        choices: ["Two octaves, the maximum", "Four octaves", "Zero, always", "A single octave, using high Contribution and low Occlusion on the Volumetric Advanced Material expression for a similar look"]
        answer_index: 3
        explain: "Higher octaves make the shader more expensive. For games a single octave is recommended, with Contribution and Occlusion values used to fake more scattering."
      - q: "What does enabling Cast Cloud Shadows on the Directional Light give you, and which property focuses the shadow map around the camera?"
        choices: ["Shadows on the clouds from meshes; Dynamic Shadow Distance", "Cloud shadows on the scene and sunlight shafts in the atmosphere; Cloud Shadow Extent", "Ambient occlusion on the clouds; Cubemap Resolution", "Colored clouds; Cloud Scattering Luminance Scale"]
        answer_index: 1
        explain: "Cast Cloud Shadows lets the cloud volume shadow the scene and cast sunlight shafts. Reducing Cloud Shadow Extent focuses the shadow map resolution around the camera."
      - q: "The documentation says to make instances of the cloud material rather than editing it. Where does the default cloud material live?"
        choices: ["Engine/EngineSky/VolumetricClouds in Engine Content, so editing it affects every project", "The Volumetric Cloud component itself", "Plugins/VolumetricClouds/Materials", "Content/Sky/Clouds in every project"]
        answer_index: 0
        explain: "The material is in Engine Content under Engine/EngineSky/VolumetricClouds. Changing Engine Content affects every project that references it, so make instances in your own Content folder."
      - q: "In the cloud material, which color channel drives the storm cloud type?"
        choices: ["Green (Altostratus)", "Blue (Cirrostratus)", "Alpha (Nimbostratus)", "Red (Stratocumulus)"]
        answer_index: 2
        explain: "The four cloud types map to texture channels: R Stratocumulus, G Altostratus, B Cirrostratus and A Nimbostratus, the storm type."
      - q: "What is the trade-off of r.VolumetricRenderTarget.Mode 2?"
        choices: ["Fastest but blurriest, traced at quarter resolution", "Looks full resolution and is fast to trace, but clouds do not intersect opaque meshes", "Supports ground-to-space flight but is the most expensive", "It is the cinematic mode with per-pixel quality"]
        answer_index: 1
        explain: "Mode 2 looks high resolution and traces fast but does not support cloud intersection with opaque meshes. Mode 0 supports fast ground-to-space gameplay at quarter-resolution traces."
      - q: "Why does the documentation offer Cloud Scattering Luminance Scale on the atmosphere light?"
        choices: ["To turn off cloud shadows", "To scale the Sky Light capture", "To change the cloud color at night", "To counterbalance energy lost by the octave approximation of multiple scattering, without extra cost"]
        answer_index: 3
        explain: "The octave approximation loses some energy. Cloud Scattering Luminance Scale scales the light contribution with a color picker to compensate at no added expense."
    flavors:
      _default: {why: "Clouds are half the sky. Cloud shadows moving over the ground sell a living world."}
      level_design: {why: "Cloud shadows change how readable your open areas are at different times.", do: "Check your main route under heavy cloud cover and note if any landmark disappears."}
      cinematics: {why: "Cinematic cloud quality has its own switches.", do: "Set r.VolumetricRenderTarget 0 and raise the View sample count scale on the component for one still."}

  - id: EAQ89
    rank: 2
