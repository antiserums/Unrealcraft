      - q: "Why should the landscape material's Blend Mode stay Opaque even though the Opacity Mask is connected?"
        choices: ["Masked mode is not allowed on landscapes", "The landscape overrides to a masked material only on components that have visibility data, so the cost stays local", "Opaque makes holes render faster on mobile", "The Opacity Mask pin does nothing on landscapes"]
        answer_index: 1
