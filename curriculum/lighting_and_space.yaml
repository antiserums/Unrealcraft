    title: A water body as a route edge
    brief: "The Water plugin gives Unreal ready-made lakes, rivers and oceans that you can place in a level. In level design, water is a useful edge: it shows the player where the route ends without a wall. In this quest you add a lake or a river to a terrain and let a path run beside it."
