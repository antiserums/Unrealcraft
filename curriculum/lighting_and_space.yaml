    quiz:
      - q: "What does the Water plugin add to Unreal Engine?"
        choices: ["A tool that paints wet materials on the meshes of your level", "Ready-made lakes, rivers and oceans you can place in a level", "A weather system with rain and snow that you can turn on in a level", "A sound library with water effects"]
        answer_index: 1
        explain: "The Water plugin gives you water bodies such as lakes, rivers and oceans. You place them in a level like other actors."
      - q: "Where do you enable the Water plugin?"
        choices: ["In Landscape Mode, on the Manage tab", "In the Details panel of the Landscape", "In the Place Actors panel, under Volumes", "In Edit, then Plugins, by searching for Water"]
        answer_index: 3
        explain: "You open Edit, then Plugins, search for Water and enable the Water plugin. The editor must restart before the plugin works."
