  - id: LDQ2
    rank: 1
    difficulty: apprentice
    specializations: [level_design, lookdev]
    subjects: [fog, mood, guidance]
    required: false
    title: Fog for mood and guidance
    brief: "Fog changes the mood of a level, and it can also guide the player. Places with thick fog feel less inviting, so players tend to go toward the clear areas. In this quest you turn on Volumetric Fog, which is fog that reacts to light in 3D, and you place a Local Fog Volume, a small area of fog, over a dead end."
    time_min: 30
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/local-fog-volumes-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 local fog volume volumetric fog level design"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/volumetric-fog-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open a level of your own that has a goal, a landmark and at least one dead end. If you have none, block out a quick one in a new Basic level: two or three routes of cubes and walls from a start to a goal, a tall landmark near the goal, and one side path that ends at a wall."
      - "Save a camera bookmark with Ctrl+1 and take a screenshot for the before picture."
      - "Select the Exponential Height Fog actor in the Outliner. If the level has none, drag one in from the Place Actors panel, under Visual Effects. In the Details panel, turn on Volumetric Fog."
      - "In the Place Actors panel, search for Local Fog Volume and drag one over one dead end. Scale it so that it covers the dead end, and raise its two Extinction values in the Details panel, which make the fog thicker, until the dead end feels less inviting."
      - "Check that you can still see the goal and the landmark clearly through the fog."
    done_when: "Send before and after screenshots taken from the same bookmark."
    xp: 30
    verify_type: screenshot
    quiz:
      - q: "What is Volumetric Fog?"
        choices: ["Fog that reacts to light in 3D", "Fog that is painted on a flat texture", "Fog that only appears in Play mode", "Fog that is made of small meshes"]
        answer_index: 0
        explain: "Volumetric Fog is calculated in 3D space, so lights can light it and cast shadows through it. That is why it gives more mood than simple distance fog."
      - q: "Where do you turn on Volumetric Fog?"
        choices: ["In the Details panel of the Directional Light, under Light", "In the settings of the Place Actors panel", "In the Details panel of the Exponential Height Fog actor", "In the view mode menu of the viewport"]
        answer_index: 2
        explain: "Volumetric Fog is an option of the Exponential Height Fog actor. You select that actor in the Outliner and turn the option on in the Details panel."
      - q: "What is a Local Fog Volume?"
        choices: ["A volume that removes fog from a room", "A small area of fog that you place in the level", "A setting that changes the fog of the whole level", "A light that only shines through fog"]
        answer_index: 1
        explain: "A Local Fog Volume is a placeable actor that holds fog in one small area. It lets you add fog in one spot without changing the rest of the level."
      - q: "Why do you place thick fog over a dead end?"
        choices: ["Fog blocks the player like a wall, so nobody can walk into the dead end", "Fog makes the dead end load faster", "Fog hides mistakes in the blockout, so nobody sees an unfinished corner", "Foggy places feel less inviting, so players go toward the clear areas"]
        answer_index: 3
        explain: "Fog does not stop the player, but it changes how a place feels. Players tend to move toward clear areas, so the fog guides them away from the dead end."
      - q: "What happens when you raise the two Extinction values of a Local Fog Volume?"
        choices: ["The fog becomes thicker", "The fog changes colour", "The fog volume becomes larger", "The fog moves upward"]
        answer_index: 0
        explain: "The Extinction values control how dense the fog is. Higher values make the fog thicker, so less can be seen through it."
      - q: "After you add the fog, what must you still be able to see clearly?"
        choices: ["The floor of the dead end", "The Exponential Height Fog actor", "The goal and the landmark", "The edges of the Local Fog Volume"]
        answer_index: 2
        explain: "The fog should make one dead end less inviting, and nothing more. If it hides the goal or the landmark, the player loses the things that guide them."

  - id: LDQ3
    rank: 1
