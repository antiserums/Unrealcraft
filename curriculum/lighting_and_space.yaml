      - q: "How do you make the Directional Light read as moonlight?"
        choices: ["Raise its Intensity, point it straight down and set a warm orange Light Color", "Rotate it low, lower its Intensity and set a cool blue Light Color", "Delete it and add many Spot Lights that point down, each with a white Light Color", "Move it far away from the level, so that less of its light reaches the ground"]
        answer_index: 1
        explain: "A low angle, a dim Intensity and a cool blue Light Color together read as moonlight. Moving a Directional Light does not change its light, only rotating it does."
