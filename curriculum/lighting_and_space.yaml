      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/features-and-properties-of-lights-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a level of your own that has a start, a goal and more than one route between them. If you have none, block out a quick one in a new level: a start and a goal about 40 to 60 m apart, with two or three different routes made of cubes and walls, and at least one ledge to jump onto. Pick one guidance color, for example yellow = climbable or usable. Make a Material Instance for it, with a name that starts with MI_, and use it only for that meaning."
      - "Apply it to every ledge the player can jump onto and to every usable object in the level. Nothing else gets that color."
      - "Light the entrance of each route so that it is slightly brighter than the walls around it."
      - "Give one route a shape cue, which is a shape that points the way: an arch, a gap in a wall, or a line of pillars that points toward the route."
      - "Start PIE and stop at each junction. Ask yourself what tells you to go this way. Fix every junction where you have no answer."
