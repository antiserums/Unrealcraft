  - id: LDQ16
    rank: 1
    difficulty: apprentice
    specializations: [level_design]
    subjects: [verticality, metrics, traversal]
    required_spine: false
    required: true
    title: Verticality within metrics
    brief: "Verticality means using height in a level, with places above and below the main floor. Height adds new routes and good views, but only when the character can really climb it. In this quest you raise a route with a ramp, stairs and a ledge, and you size every piece from the measured limits of the character."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cubegrid-tool-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "level design verticality ramps stairs ledges jump metrics unreal"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/modeling-mode-quick-start-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cubegrid-tool-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open BP_ThirdPersonCharacter, select Character Movement, and write down Max Step Height and Walkable Floor Angle. Test in PIE how high a ledge the character can jump onto. Then open a level of your own that has a route from a start to a goal, or block out a simple route of about 40 m in a new level. Raise the route by 3 to 4 m. Use a ramp, a staircase and one ledge that the player must jump up onto."
      - "Make each stair riser (the height of one stair) lower than Max Step Height. Make the ramp less steep than Walkable Floor Angle."
      - "Size the ledge and any gap with a margin. They should be noticeably below the maximum jump you measured, not right at it."
      - "Add a way back down from the high point, such as a drop or stairs, so that it is not a trap."
      - "Start PIE and climb every piece three times. If you miss even once, the piece is too close to the limit."
    done_when: "Send a side-view screenshot of the vertical route with the heights labelled, and one PIE screenshot taken from the top."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Your stair risers are 50 cm and Max Step Height is 45. What happens?"
        choices: ["The character can't walk up without jumping", "Walks up fine", "The stairs disappear", "Lumen breaks"]
        answer_index: 0
        explain: "Each riser must be under Max Step Height. Invisible ramp collision is the other common fix."
      - q: "A ramp is steeper than Walkable Floor Angle. What happens?"
        choices: ["Faster movement", "The character can't walk up it and slides off", "Nothing", "The ramp gets navmesh automatically"]
        answer_index: 1
        explain: "Anything steeper than the walkable angle is treated as a wall."
      - q: "Your max jump clears 350 cm. How wide should a required gap be?"
        choices: ["350 cm exactly", "400 cm for challenge", "Doesn't matter", "Clearly less, with margin, so an average jump makes it"]
        answer_index: 3
        explain: "Required jumps sit well inside the limit. Max-distance jumps are for optional challenge."
      - q: "A ledge is just too high to jump onto but looks reachable. The problem?"
        choices: ["None", "It reads as a route and then fails, which feels like a bug", "It saves performance", "It's good guidance"]
        answer_index: 1
        explain: "Make heights clearly reachable or clearly not. Ambiguous heights frustrate players."
      - q: "Why add a way back down from a high area?"
        choices: ["Required by Epic", "To double the XP", "So the player can't get stranded with no way out", "For lighting"]
        answer_index: 2
        explain: "One-way traps without a return path are a common blockout bug."
    flavors:
      _default: {why: "Height adds routes and views, but only if the character can climb it."}
      level_design: {why: "Height gives routes their own character: overlooks, drop-downs, shortcuts.", do: "Use the high point as a view down onto the other two routes."}
      programming: {why: "The movement values you'll code against are the limits here."}
      animation: {why: "Every ledge height is a question about which traversal animation plays."}

  - id: LDQ17
