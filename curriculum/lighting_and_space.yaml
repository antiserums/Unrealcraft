    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/directional-lights-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 night lighting readable level design moonlight"
    checklist:
      - "Open any project, or create one from the Third Person template. Open a daylight level of your own that has a start, a goal and more than one route. If you have none, block out a quick one in a new Basic level: a start and a goal about 40 to 60 m apart, with two or three routes made of cubes and walls. Save 3 camera bookmarks with Ctrl+1 to Ctrl+3 and take a screenshot from each. Then duplicate the level in the Content Browser and add _Night to the name of the copy, for example L_Routes_01_Night."
      - "In the copy, select the Directional Light, which is the sun. Rotate it until it sits low over the horizon, lower its Intensity until the level is dim, and set its Light Color to a cool blue so that it reads as moonlight. Lock the exposure so that the picture does not brighten by itself: add a Post Process Volume, tick Infinite Extent (Unbound), and set Metering Mode to Manual in its Exposure section."
