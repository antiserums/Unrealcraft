        choices: ["A brush that paints grass on a landscape", "A curved line that you draw on a landscape with control points", "A wall that marks the edge of a landscape and keeps the player inside", "A copy of a landscape at a lower resolution, used at far distances"]
        answer_index: 1
        explain: "A landscape spline is a curved line made of control points. Unreal can shape the ground to follow it, which is a fast way to make roads and paths."
