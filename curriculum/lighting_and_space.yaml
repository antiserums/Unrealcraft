    subjects: [level-instancing, reuse]
    required: false
    title: Reuse a room with Level Instances
    brief: "A Level Instance is a group of actors saved as its own small level, which you can place many times in a bigger level. When you edit one copy, all the copies change. This saves a lot of work when a level uses the same room or building several times. In this quest you turn a blockout room into a Level Instance, place more copies, and check that an edit shows up in all of them."
    time_min: 35
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-instancing-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 level instance create from selection beginner"
    checklist:
      - "Open any project, or create one from the Third Person template. In any level, build a small blockout room from cubes (a floor and four walls), or use a room you already have. Select all the actors of the room. Right-click the selection, open Level and choose Create Level Instance. Click OK in the window that opens and save the new level file, for example as L_Room_Instance."
      - "Place the instance two more times in the level, so that you have three. Hold Alt and drag the instance to make a copy."
      - "Select one copy and click Edit in the Details panel. Change something, for example move a wall. Then select the Level Instance in the Outliner and click Commit Changes in the Details panel. Confirm that the change shows up in all three copies."
    done_when: "Send a screenshot that shows the three instances after the shared edit."
    xp: 35
    verify_type: screenshot
    quiz:
      - q: "What is a Level Instance?"
        choices: ["A backup copy of the whole project that is saved each time you close the editor", "A single mesh that replaces a whole room and all of the actors that are in it", "A camera bookmark saved in a level, which you can recall with one of the number keys", "A group of actors saved as its own small level that you can place many times"]
        answer_index: 3
        explain: "A Level Instance stores a group of actors as a small level. You can then place that level many times inside a bigger level."
      - q: "How do you turn a selected room into a Level Instance?"
        choices: ["Right-click the selection, open Level and choose Create Level Instance", "Drag the selection into the Content Browser and choose Create Blueprint from the menu", "Press Ctrl+G to group the selection", "Open the File menu and choose Save Current Level As with a new room name"]
        answer_index: 0
        explain: "You select all the actors of the room, right-click, open Level and choose Create Level Instance. A window opens and then you save the new level file."
      - q: "You have three copies of a Level Instance. What happens when you edit one copy and commit the change?"
        choices: ["Only that copy changes", "All three copies change", "The other two copies are deleted", "A fourth copy is created"]
        answer_index: 1
        explain: "All copies point to the same level file. A change that you commit in one copy shows up in every copy."
      - q: "How do you start editing one copy of a Level Instance?"
        choices: ["Double-click it in the Content Browser while Play is running", "Delete it and build the room again", "Select it and click Edit in the Details panel", "Select it and press F on the keyboard"]
        answer_index: 2
        explain: "You select one copy and click Edit in the Details panel. The actors inside can then be moved and changed."
      - q: "You moved a wall while editing a Level Instance. How do you finish the edit so that the change is saved to all copies?"
        choices: ["Press Play and stop again, which writes the edit to all copies in the level", "Select the Level Instance in the Outliner and click Commit Changes", "Hold Alt and drag the instance to make a new copy that has the change in it", "Right-click the wall and choose Create Level Instance one more time"]
        answer_index: 1
        explain: "Commit Changes in the Details panel ends the edit and saves the level file of the instance. After that, every copy shows the moved wall."
      - q: "When does a Level Instance save the most work?"
        choices: ["When a level uses the same room or building several times", "When a level has only one room and no plan for more rooms later on", "When every room in a level must look different from the rest", "When a level has no actors yet"]
        answer_index: 0
        explain: "With a Level Instance you build and fix the room once. Every place that uses it gets the same change, so you do not repeat the work."

  - id: LDQ5
