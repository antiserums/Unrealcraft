# Unrealcraft — Rank 1 "Apprentice" (Level Design + shared world-lighting)
# Goal: you can make space and light it without getting lost.
# URL prefix: https://dev.epicgames.com/documentation/en-us/unreal-engine/
# Verified slugs only (see VERIFIED_URLS.md). Backup videos are TODO_URL until a human picks a dated UE5+ video.
# Rank 0–1 verification is quiz + honor-system artifact. No mentor sign-off at this rank.

quests:
  # ------------ Shared world-lighting (Level Design + Environment Art) ------------
  - id: EAQ8
    rank: 1
    difficulty: apprentice
    specializations: [level_design, lookdev]
    subjects: [landscape, sculpt]
    required_spine: false
    required: true
    title: Sculpt a walkable patch
    brief: "A Landscape is the terrain actor that Unreal uses for outdoor ground with hills and valleys. You shape it with brush tools in Landscape Mode, a little like pushing and pulling clay. Not every level is flat, so you need to know how to make ground that the player can walk on. In this quest you sculpt a small patch with a hill, a hollow and a path, and then you walk on it to test it."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/landscape-quick-start-guide-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 landscape quick start sculpt beginner"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/landscape-sculpt-mode-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a new level named L_Terrain_01. Open Landscape Mode, go to the Manage tab and choose New. Keep the landscape small: the default size or less is plenty."
      - "Select the Sculpt tool and raise one hill. Then hold Shift while you sculpt to dig one hollow, because Shift makes the tool push the ground down."
      - "Use the Smooth tool over the edges until nothing looks like a spike."
      - "Use the Ramp tool to make one path from the low ground to the top of the hill. The Ramp tool builds a straight, even slope between two points that you place."
      - "Place a Player Start in the level and set the GameMode to the Third Person GameMode. Then walk the path in PIE, which means Play In Editor."
      - "Find every place where the character slides back or gets stuck. Smooth or flatten the ground there."
    done_when: "Send a screenshot taken at eye level on the path, and one overview screenshot of the whole patch."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Where do you create a new Landscape?"
        choices: ["Content Drawer → right-click → Landscape", "Landscape Mode → Manage → New", "World Settings → Terrain", "Place Actors → Basic → Cube"]
        answer_index: 1
        explain: "Landscape Mode has its own Manage, Sculpt and Paint tabs. New lives under Manage."
      - q: "With the Sculpt tool active, what does holding Shift while painting do?"
        choices: ["Lowers the terrain instead of raising it", "Doubles brush size", "Paints a material layer", "Undoes the last stroke"]
        answer_index: 0
        explain: "Shift inverts the tool, so Sculpt digs down."
      - q: "You need an even slope between two points. Which tool?"
        choices: ["Erosion", "Noise", "Ramp", "Retopologize"]
        answer_index: 2
        explain: "Ramp builds a straight, even slope between two points you place. Good for paths."
      - q: "The character slides back down a slope in PIE. What's the likely cause?"
        choices: ["Lumen is off", "The slope is steeper than the CharacterMovement Walkable Floor Angle", "The landscape has no material", "Collision is on"]
        answer_index: 1
        explain: "CharacterMovement treats anything steeper than Walkable Floor Angle (about 45° by default) as a wall."
      - q: "Why keep the first landscape small?"
        choices: ["Big landscapes aren't allowed", "Lumen only works on small ones", "Small landscapes don't need collision", "Faster to sculpt, test and fix; most of a huge terrain would sit empty"]
        answer_index: 3
        explain: "You're learning the tools. Only build the area the player will actually walk."
    flavors:
      _default: {why: "Not every level is flat. Know how to make ground the player can walk."}
      level_design: {why: "Terrain is blockout too. Slope decides where players can and can't go.", do: "Mark the path you ramped. That is your first route on uneven ground."}
      lookdev: {why: "Your diorama needs ground that reads well under light, not a flat plane."}

  - id: EAQ9
    rank: 1
    difficulty: apprentice
    specializations: [level_design, lookdev]
    subjects: [lighting, mobility, lumen]
    required_spine: false
    required: true
    title: Light types and Lumen
    brief: "Unreal has several types of lights, and each one sends out light in a different shape. A Point Light shines in all directions like a bulb, a Spot Light shines in a cone, and a Rect Light shines from a rectangle like a window. Lumen is the system in Unreal Engine 5 that calculates bounced light while the game runs. In this quest you place the three light types in a room, change their settings, and watch Lumen bounce light."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/light-types-and-their-mobility-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 light types mobility movable stationary static lumen"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/lumen-global-illumination-and-reflections-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/features-and-properties-of-lights-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open Project Settings and go to the Rendering section. Confirm that Dynamic Global Illumination Method is set to Lumen."
      - "Open a room level of your own, or build a simple room in a new level from cubes: a floor, four walls and a ceiling, with one wall in a strong color. In the room, place one Point Light, one Spot Light and one Rect Light. Set the Mobility of all three to Movable, which means the light is fully dynamic and can change while the game runs."
      - "Change the Intensity, the Attenuation Radius (how far the light reaches) and the color of each light. For the Spot Light, also change the cone angles."
      - "Aim the Rect Light at the colored wall. Watch how Lumen bounces the color of the wall onto the floor."
      - "Change the Mobility of one light to Static, and note what the tooltip or the warning says."
    done_when: "Send one screenshot with all three lights visible, and add one line for each light that says what you would use it for."
    xp: 70
    verify_type: screenshot
    quiz:
      - q: "What are the three light mobility settings?"
        choices: ["Low, Medium, High", "Baked, Mixed, Realtime", "Static, Stationary, Movable", "Local, Global, Sky"]
        answer_index: 2
        explain: "Mobility sets how much of the light can change at runtime and how it's lit."
      - q: "Which mobility lets a light move and change freely at runtime?"
        choices: ["Static", "Stationary", "Movable", "None, lights can't move"]
        answer_index: 2
        explain: "Movable lights are fully dynamic. That's the safe default with Lumen."
      - q: "Do you need to build lighting for Lumen bounce light to appear?"
        choices: ["No, Lumen calculates GI and reflections at runtime", "Yes, every time you move a light", "Only for Rect Lights", "Only in packaged builds"]
        answer_index: 0
        explain: "Lumen is dynamic. There is no lightmap bake for its bounce light."
      - q: "You want soft light from a window-shaped area. Which light?"
        choices: ["Point Light", "Rect Light", "Directional Light", "Sky Light"]
        answer_index: 1
        explain: "A Rect Light emits from a rectangle, like a window or softbox."
      - q: "Where do you check that a project uses Lumen?"
        choices: ["World Settings → Lighting", "Editor Preferences → Viewport", "The Sky Light's Details", "Project Settings → Rendering → Dynamic Global Illumination Method"]
        answer_index: 3
        explain: "New UE5 projects default to Lumen. The setting lives in Project Settings → Rendering."
    flavors:
      _default: {why: "Pick the right light and you do half the lighting work."}
      level_design: {why: "You'll place lights to guide players. Know which one does what.", do: "Put the Spot on the doorway and see how it pulls your eye."}
      lookdev: {why: "Mobility and light shape are the vocabulary for everything you light after this."}

  - id: EAQ10
    rank: 1
    difficulty: apprentice
    specializations: [level_design, lookdev]
    subjects: [post-process, exposure]
    required_spine: false
    required: true
    title: Lock exposure for honest review
    brief: "Exposure is how bright the camera makes the picture. By default Unreal uses auto exposure, which slowly changes the brightness like your eyes do when you enter a dark room. This hides lighting problems and makes every screenshot look different. In this quest you lock the exposure to one fixed value with a Post Process Volume, so that you see the real brightness of a room."
    time_min: 30
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/add-post-process-volumes"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 post process volume manual exposure lock ev100"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/auto-exposure-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a room level of your own, or build a simple room in a new Basic level from cubes: a floor, four walls, a ceiling and one doorway that lets the daylight in. Add a Post Process Volume and tick Infinite Extent (Unbound). This makes the volume apply everywhere, no matter where the camera is."
      - "Start PIE and walk from the bright doorway into a dark corner. Watch how auto exposure slowly changes the brightness."
      - "In the Exposure section of the volume, set Metering Mode to Manual. Then adjust Exposure Compensation until you can see the room clearly."
      - "Walk the same path again. The brightness should now stay the same."
      - "Save a camera bookmark, and take a screenshot from it before the lock and after the lock."
    done_when: "Send before and after screenshots taken from the same bookmark, and a screenshot of the Details panel with the Exposure settings visible."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "How do you make one Post Process Volume affect the whole level?"
        choices: ["Tick Infinite Extent (Unbound)", "Scale it to 10000", "Set Priority to 0", "Put it in World Settings"]
        answer_index: 0
        explain: "Unbound makes the volume apply everywhere, no matter where the camera is."
      - q: "Why lock exposure before reviewing a level?"
        choices: ["It improves performance", "Auto exposure brightens dark areas as you look at them, so you can't judge real brightness", "Lumen requires it", "It's needed to package"]
        answer_index: 1
        explain: "With auto exposure on, a dark corner looks fine once your 'eyes' adapt. Locked exposure shows the real result."
      - q: "Which is a valid way to lock exposure?"
        choices: ["Delete the Sky Light", "Turn off Lumen", "Set Min EV100 and Max EV100 to the same value", "Set Blend Radius to 0"]
        answer_index: 2
        explain: "Equal min and max leaves auto exposure no range. Manual metering mode also works."
      - q: "Two bounded Post Process Volumes overlap. Which wins?"
        choices: ["The bigger one", "The one placed first", "The one with higher Priority", "They cancel out"]
        answer_index: 2
        explain: "Priority decides the order. Higher Priority is applied on top."
      - q: "What does Blend Radius do on a bounded volume?"
        choices: ["Blurs the image", "Fades the volume's settings in over that distance as the camera approaches", "Sets the fog radius", "Limits light range"]
        answer_index: 1
        explain: "Blend Radius avoids a hard pop when the camera enters the volume."
    flavors:
      _default: {why: "If exposure drifts, every screenshot you post will look different."}
      level_design: {why: "A dark route stays dark with locked exposure. That's what you want to catch.", do: "Lock it once and leave it locked for the rest of Rank 1."}
      lookdev: {why: "You can't compare two lighting passes if the camera keeps changing exposure."}

  - id: EAQ11
    rank: 1
    difficulty: apprentice
    specializations: [lookdev]
    subjects: [foliage, routes]
    required_spine: false
    required: true
    taster_for: [level_design, gameplay_design]
    title: Foliage that doesn't block routes
    brief: "Foliage means plants, rocks and other small meshes that you paint onto the ground in large numbers with Foliage Mode. Foliage makes a space feel real, but it must not stand in the way of the player. In this quest you paint two foliage types along a path and make sure that nothing blocks the route."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/foliage-mode-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 foliage mode paint erase density beginner"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a level of your own that has a Landscape with a path on it. If you have none, create a new level, open Landscape Mode, choose New on the Manage tab, and sculpt one hill with a path up to it. Open Foliage Mode and add two foliage types: one bush, and one small grass mesh or rock mesh. Free foliage from Fab works well. For a first test, SM_Cylinder and SM_ChamferCube from the folder LevelPrototyping/Meshes of the template work as stand-ins."
      - "Paint both types along the edges of the path. Hold Shift and paint to erase anything that lands on the path."
      - "Open the bush foliage type and lower its Density. Stop when you can still see clearly where the edges of the path are."
      - "Set the Collision Preset of the grass type to NoCollision, so that the player walks through it."
      - "Walk the path in PIE. Nothing on the path should stop you or catch you."
    done_when: "Send a screenshot taken at eye level that shows the path with foliage on both sides and the path itself clear."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "In Foliage Mode's Paint tool, how do you erase instances?"
        choices: ["Hold Shift while painting", "Press Delete", "Right-click the mesh in the Content Drawer", "Set Density to 100"]
        answer_index: 0
        explain: "Shift inverts the paint brush and removes instances under it."
      - q: "Where do you set how thickly a foliage type is painted?"
        choices: ["World Settings", "The mesh's LOD settings", "The Post Process Volume", "The foliage type's Density setting"]
        answer_index: 3
        explain: "Each foliage type has its own density and scale ranges."
      - q: "Grass on the path stops the player like a wall. The fix?"
        choices: ["Delete the landscape", "Set the grass foliage type's Collision Preset to NoCollision", "Raise Max Step Height to 500", "Turn off Lumen"]
        answer_index: 1
        explain: "Small ground cover rarely needs collision. Save collision for things that should block."
      - q: "Why is painted foliage cheaper than placing each bush as its own actor?"
        choices: ["It has no materials", "It's drawn as instanced static meshes, so many copies render efficiently", "It's never shadowed", "It isn't saved"]
        answer_index: 1
        explain: "Foliage instances are batched instead of costing one actor each."
      - q: "What's the level design risk of dense foliage?"
        choices: ["None", "It breaks PIE", "It can hide route edges, landmarks and the ground the player needs to read", "It changes the capsule size"]
        answer_index: 2
        explain: "Foliage should frame routes, not hide them."
    flavors:
      _default: {why: "Foliage makes a space feel real. Keep it off the path."}
      level_design: {why: "Your Rank 1 adjacent taster. Foliage frames a route or hides it.", do: "Use a bush line to point toward your path, not across it."}
      lookdev: {why: "Density and variety are what sell an outdoor diorama."}
      gameplay_design: {why: "Cover and clutter change how a space plays. See it once."}

  # ------------ Level Design ------------
  - id: LDQ11
    rank: 1
    difficulty: apprentice
    specializations: [level_design]
    subjects: [metrics, character]
    required_spine: false
    required: true
    title: Build a metrics gym
    brief: "Metrics are the numbers that describe what the player character can do: how wide it is, how high it can step and how far it can jump. Every space in a level is built around these numbers. A metrics gym is a test level with steps, ledges, gaps and doors of known sizes, where you measure these limits. In this quest you read the character settings, build a gym, and test every piece."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-01-project-setup-and-level-blockout-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 level design metrics gym character jump height step height"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/third-person-template-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-a-character-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open BP_ThirdPersonCharacter and select the Capsule Component, the invisible shape that collides with the world. Write down its Capsule Radius and Capsule Half Height."
      - "Select the Character Movement component. Write down Max Step Height, Walkable Floor Angle, Jump Z Velocity and Gravity Scale."
      - "Create a new level named L_MetricsGym. Build a row of steps (15, 30, 45 and 60 cm high), a row of ledges (from 100 to 250 cm, 25 cm apart) and a row of gaps (from 100 to 500 cm, 50 cm apart)."
      - "Build three doorways. Make the first as wide as the capsule diameter, the second as wide as the diameter + 40 cm, and the third a width that feels comfortable to you."
      - "Start PIE and test every piece. Note the highest step you can walk up, the highest ledge you can jump onto, and the widest gap you can jump over."
      - "Put a Text Render actor next to each piece as a label, so that the numbers are visible in screenshots."
    done_when: "Send a screenshot of the gym with its labels, and a list of your metrics: capsule size, step height, jump height, jump distance and door width."
    xp: 70
    verify_type: screenshot
    quiz:
      - q: "Where do you read the character's collision size?"
        choices: ["Capsule Component → Capsule Radius and Capsule Half Height", "The mesh's bounds", "World Settings", "The Animation Blueprint"]
        answer_index: 0
        explain: "The capsule is what actually collides. The visible mesh doesn't decide what fits."
      - q: "Which setting decides the tallest step the character walks up without jumping?"
        choices: ["Jump Z Velocity", "Max Step Height on Character Movement", "Capsule Radius", "Walkable Floor Angle"]
        answer_index: 1
        explain: "Max Step Height (45 cm by default) is the limit. Taller than that needs a jump."
      - q: "Which two Character Movement values mostly decide jump height?"
        choices: ["Max Walk Speed and Braking", "Mass and Friction", "Jump Z Velocity and Gravity Scale", "Air Control and Step Height"]
        answer_index: 2
        explain: "Launch speed up against gravity. Measure it in the gym anyway. Don't guess from the formula."
      - q: "Capsule Radius is 42. What's the narrowest gap the capsule can physically pass?"
        choices: ["42 cm", "Just over 84 cm, though you'd build wider for comfort", "200 cm", "Any width"]
        answer_index: 1
        explain: "Width is the diameter, twice the radius. A door that just fits feels awful to walk through."
      - q: "What is the metrics gym for?"
        choices: ["A portfolio piece", "Testing lighting", "Performance profiling", "Measuring the character once so every level uses tested numbers"]
        answer_index: 3
        explain: "Measure once, build to the numbers. Keep the gym and update it if movement changes."
    flavors:
      _default: {why: "Every space is built around what the character can do. Measure it first."}
      level_design: {why: "Your metrics sheet is the rulebook for every blockout from here on.", do: "Keep L_MetricsGym in the project and re-check it whenever movement settings change."}
      programming: {why: "Feel what the movement numbers do before you write movement code."}
      animation: {why: "Step and ledge heights decide which climb and vault animations you'll need."}

  - id: LDQ12
    rank: 1
    difficulty: apprentice
    specializations: [level_design]
    subjects: [blockout, modeling, cubegrid, brushes]
    required_spine: false
    required: true
    title: Blockout toolkit
    brief: "A blockout is a rough version of a level made from simple shapes, so that you can test the space before you spend time on art. Unreal gives you three common ways to build one: scaled cubes, geometry brushes, and the CubeGrid tool in Modeling Mode. In this quest you build the same small room with each tool and find out which one is the fastest to change."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/modeling-mode-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 blockout cubegrid modeling mode vs bsp brushes"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cubegrid-tool-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/geometry-brush-actors-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/modeling-mode-quick-start-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Create a new level named L_Toolkit. You will build the same small room three times, with a floor, walls and one doorway."
      - "Build version A from cubes that you take from the Place Actors panel and scale to the right size."
      - "Build version B with geometry brushes. Use one additive box for the room, and one subtractive box that cuts out the doorway."
      - "Build version C with the CubeGrid tool in Modeling Mode. Set the grid to a size that fits a character, such as 50 or 100 cm."
      - "Change the width of the doorway in all three versions. Time how long each change takes."
      - "Write down which tool you would use for a quick room, which for a big irregular shape, and which for a piece you want to use again."
    done_when: "Send a writeup of 3 to 5 lines that says which tool you would pick for which job and why, and one screenshot of the three rooms."
    xp: 60
    verify_type: writeup
    quiz:
      - q: "What does a subtractive geometry brush do?"
        choices: ["Deletes actors", "Lowers the landscape", "Removes materials", "Carves space out of additive brush geometry"]
        answer_index: 3
        explain: "Brushes are additive or subtractive. A subtractive box is a fast way to cut a doorway."
      - q: "CubeGrid is best at…"
        choices: ["Organic sculpting", "Fast grid-aligned blocky shapes by pushing and pulling cells", "Painting foliage", "Lighting"]
        answer_index: 1
        explain: "It builds on a grid, so blockout pieces stay on your metrics."
      - q: "What does Modeling Mode typically produce when you accept a new shape?"
        choices: ["A Static Mesh asset you can reuse and place again", "A texture", "A Blueprint graph", "A landscape layer"]
        answer_index: 0
        explain: "Modeling Mode output is a real mesh. Reusable pieces are a good reason to use it."
      - q: "What's the weak point of scaled cubes for blockout?"
        choices: ["They don't collide", "Scaling stretches materials and the numbers stop matching real sizes", "They can't be lit", "They crash Lumen"]
        answer_index: 1
        explain: "A cube scaled to 3.7 is hard to measure. Snap to clean sizes if you use them."
      - q: "What matters most in a blockout tool?"
        choices: ["Final-quality visuals", "Polygon count", "How fast you can change the space after a playtest", "Material quality"]
        answer_index: 2
        explain: "Blockouts exist to be changed. Pick whatever you can change fastest."
    flavors:
      _default: {why: "Three ways to make a room. Know which one to reach for."}
      level_design: {why: "The tool you pick decides how quickly you can change the level after a playtest.", do: "Pick one tool as your default for the capstone and note why."}
      lookdev: {why: "Modeling Mode is also how you'll make quick set-dressing shapes."}

  - id: LDQ13
    rank: 1
    difficulty: apprentice
    specializations: [level_design]
    subjects: [layout, routes, flow]
    required_spine: false
    required: true
    title: Three routes
    brief: "A route is one way for the player to get from the start to the goal. When a level offers several routes that are clearly different, the player has a real choice and does not feel stuck. In this quest you block out three routes between a start and a goal, connect them, and walk each one to test it."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-designer-quick-start-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "level design multiple routes critical path loops blockout"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a new level named L_Routes_01. Place a start and a goal about 40 to 60 m apart. A lit box is fine as the goal."
      - "Build three routes to the goal. Each one must be different in one clear way: short and exposed, long and covered, or high and requiring a jump."
      - "Build every route to the metrics of the character, which are the numbers for what it can do. Before you build, test in PIE how high a step the character can walk up, how high a ledge it can jump onto and how wide a gap it can jump over, and write the numbers down. Do not guess any step heights. If you have a metrics test level of your own, use the numbers from it."
      - "Connect at least two of the routes somewhere in the middle, so that the player can switch from one to the other."
      - "Start PIE and walk each route from the start to the goal. Fix anything that stops you."
    done_when: "Send a top-down screenshot with the three routes drawn on it in different colors, and one screenshot taken at eye level from the start."
    xp: 80
    verify_type: screenshot
    quiz:
      - q: "Why give the player three routes?"
        choices: ["Choice, and if one route is unclear or blocked they still have somewhere to go", "More content to fill", "Epic requires it", "It improves performance"]
        answer_index: 0
        explain: "Options mean the player doesn't feel stuck, and the routes can offer different play."
      - q: "Two routes are the same length with the same cover. What's wrong?"
        choices: ["Nothing", "It's not a real choice. Routes should differ in risk, length, height or cover", "They need different materials", "They need more lights"]
        answer_index: 1
        explain: "If the routes don't differ, the player has no reason to choose one over another."
      - q: "What's a loop in layout?"
        choices: ["A Blueprint Timeline", "Routes that reconnect, so the player returns to known ground instead of a dead end", "A repeating sound", "A camera orbit"]
        answer_index: 1
        explain: "Loops keep players oriented and let them change their mind."
      - q: "How do you confirm a route actually works?"
        choices: ["Fly it in the editor camera", "Look at it from above", "Check the Outliner", "Walk it in PIE as the character, start to goal"]
        answer_index: 3
        explain: "The editor camera ignores collision and metrics. Only the character tells you the truth."
      - q: "A dead end with nothing in it tends to…"
        choices: ["Reward exploration", "Improve pacing", "Frustrate players and waste their time", "Hide performance issues"]
        answer_index: 2
        explain: "If a dead end is there, give the player something for going in: a view, a pickup, a shortcut."
    flavors:
      _default: {why: "Test your blockout by giving the player a choice of routes."}
      level_design: {why: "Three routes so the player never feels stuck.", do: "Draw the routes on paper before you build. Fix the drawing first, then build."}
      programming: {why: "Feel scale before you write movement."}

  - id: LDQ14
    rank: 1
    difficulty: apprentice
