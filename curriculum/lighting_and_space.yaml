        choices: ["So the picture does not brighten by itself", "So the lights cast no shadows on the ground at night", "So the level loads faster", "So the sun cannot be rotated by accident"]
        answer_index: 0
        explain: "With automatic exposure the camera brightens a dark picture, and the night looks like a grey day. Locking the exposure keeps the level as dim as you set it."
