  - id: LDQ6
    rank: 1
    difficulty: apprentice
    specializations: [level_design, lookdev]
    subjects: [pcg, scatter]
    required: false
    title: PCG scatter, first look
    brief: "PCG means Procedural Content Generation. It is a system in Unreal where you build a graph of rules, and the graph places many objects for you. To scatter means to spread objects over an area. In this quest you take a first look at PCG: you scatter one rock mesh inside a volume and keep it away from a path."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-content-generation-overview"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 pcg quick start scatter meshes on landscape"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-content-generation-framework-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a level of your own that has a Landscape, or create a new level, open Landscape Mode and choose New on the Manage tab. Decide where a path runs across it."
      - "Open Edit, then Plugins, enable the Procedural Content Generation Framework (PCG) plugin and restart the editor."
      - "Right-click in the Content Browser, open PCG and choose PCG Graph. The graph holds the rules. Then drag a PCG Volume from the Place Actors panel onto the landscape, and set Graph on its PCG component in the Details panel. The volume is the box that marks where the graph works."
      - "Open the graph. Add a Get Landscape Data node, a Surface Sampler node and a Static Mesh Spawner node, and connect them in that order. In the Static Mesh Spawner, add one entry under Mesh Entries and pick one rock mesh. If you have none, SM_ChamferCube from the folder LevelPrototyping/Meshes of the template works as a stand-in. Select the PCG Volume and click Generate in the Details panel. The rocks appear on the landscape inside the volume."
      - "Move the volume away from the path, so that the scattered rocks do not block it."
    done_when: "Send a screenshot of the graph and a screenshot of the scattered result."
    xp: 40
    verify_type: screenshot
    quiz:
      - q: "What does PCG stand for?"
        choices: ["Physical Collision Geometry", "Player Camera Guide", "Procedural Content Generation", "Project Content Group"]
        answer_index: 2
        explain: "PCG means Procedural Content Generation. You build a graph of rules, and the graph places many objects for you."
      - q: "What does a PCG Graph asset hold?"
        choices: ["The rules that decide where objects are placed", "The textures of the landscape that the graph reads", "The collision of the rock mesh", "The camera bookmarks of the level you work in"]
        answer_index: 0
        explain: "The graph holds the rules. In this quest the rules read the landscape, pick points on its surface and spawn a mesh on each point."
      - q: "What is the PCG Volume for?"
        choices: ["It sets how loud the level is", "It stores the rock mesh for the graph", "It blocks the player from walking on the path", "It is the box that marks where the graph works"]
        answer_index: 3
        explain: "The PCG Volume marks the area in which the graph places objects. You set Graph on its PCG component so it knows which rules to run."
      - q: "In which order do you connect the three nodes of the scatter graph?"
        choices: ["Static Mesh Spawner, Surface Sampler, Get Landscape Data", "Get Landscape Data, Surface Sampler, Static Mesh Spawner", "Surface Sampler, Static Mesh Spawner, Get Landscape Data", "Surface Sampler, Get Landscape Data, Static Mesh Spawner"]
        answer_index: 1
        explain: "First the graph reads the landscape, then it samples points on that surface, and last it spawns a mesh on each point."
      - q: "Where do you choose which rock mesh the graph places?"
