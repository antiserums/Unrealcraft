    specializations: [level_design, lookdev]
    subjects: [decals, guidance]
    required: false
    title: Decals as guidance
    brief: "A decal is a material that is projected onto surfaces, like a sticker, a stain or a painted arrow. A line of small decals on the ground can lead the eye of the player toward a route, without any text or sign. In this quest you place a few decals that lead toward one route entrance."
    time_min: 25
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/decal-actors-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 decal actor beginner"
    checklist:
      - "Open a project made from the Third Person template, or create one, and open any level with a floor and at least one doorway or route entrance. Open the Place Actors panel, search for Decal, and drag a Decal Actor onto a floor or wall. In its Details panel, set Decal Material to a decal material. If your project has none, make a simple one: create a material, set its Material Domain to Deferred Decal and its Blend Mode to Translucent, and connect a color and an opacity."
      - "Use 3 to 4 decals, such as scuffs, arrows or stains, to lead toward one route entrance. Hold Alt and drag a decal to copy it. A decal only shows where its box touches a surface, so rotate and move each one until you see it."
    done_when: "Send a screenshot taken at eye level that shows the trail of decals."
    xp: 25
    verify_type: screenshot
    quiz:
      - q: "What is a decal?"
        choices: ["A light that shines in one direction", "A mesh with a very low number of triangles", "A material that is projected onto surfaces", "A volume that blocks the player"]
        answer_index: 2
        explain: "A decal is a material projected onto the surfaces it touches, like a sticker, a stain or a painted arrow. It adds detail without changing the mesh below it."
      - q: "Which Material Domain do you set for a material that a Decal Actor can use?"
        choices: ["Surface", "Deferred Decal", "Post Process", "User Interface"]
        answer_index: 1
        explain: "A decal material needs its Material Domain set to Deferred Decal. In this quest you also set its Blend Mode to Translucent."
      - q: "Where do you choose the material that a Decal Actor shows?"
        choices: ["In the Decal Material property in its Details panel", "In the Place Actors panel, before you drag it in", "In the view mode menu of the viewport", "In the material of the floor below it"]
        answer_index: 0
        explain: "You select the Decal Actor and set Decal Material in the Details panel. The surface below keeps its own material."
      - q: "You placed a Decal Actor but you cannot see the decal. What do you check first?"
        choices: ["That the level has a Sky Light with a cubemap", "That the floor mesh has collision turned on", "That the project was saved after you placed the Decal Actor", "That the box of the decal touches a surface"]
        answer_index: 3
        explain: "A decal only shows where its box touches a surface. Rotate and move the Decal Actor until the box reaches the floor or the wall."
      - q: "How can a few decals on the ground guide the player?"
        choices: ["They push the character in one direction when stepped on", "They form a line that leads the eye toward a route", "They light the route like lamps, so the way is bright", "They block the other routes, so only one way is left"]
        answer_index: 1
        explain: "A trail of scuffs, arrows or stains leads the eye of the player toward a route entrance. It works without any text or sign."
      - q: "What is a fast way to copy a decal that is already in the level?"
        choices: ["Press G while it is selected", "Press F while it is selected", "Hold Alt and drag it", "Hold Ctrl and click it"]
        answer_index: 2
        explain: "Holding Alt while you drag an actor makes a copy and moves the copy. This is a quick way to lay out three or four decals in a line."

  - id: LDQ4
    rank: 1
