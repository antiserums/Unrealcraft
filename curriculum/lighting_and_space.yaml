    title: Reuse a room with Level Instances
    brief: "A Level Instance is a group of actors saved as its own small level, which you can place many times in a bigger level. When you edit one copy, all the copies change. This saves a lot of work when a level uses the same room or building several times. In this quest you turn a blockout room into a Level Instance, place more copies, and check that an edit shows up in all of them."
    time_min: 35
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-instancing-in-unreal-engine"
