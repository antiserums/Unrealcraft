  - id: LDQ8
    rank: 1
    difficulty: apprentice
    specializations: [level_design, lookdev]
    subjects: [audio, ambience]
    required: false
    title: Ambient sound that pulls
    brief: "Sound can guide a player just like light can. A sound that gets louder as you get closer pulls the player toward its source. Attenuation is the setting that controls how a sound gets quieter with distance, and reverb is the echo of a room. In this quest you place a looping sound near the goal of a level, set how far it reaches, and change the reverb of one room."
    time_min: 25
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/ambient-sound-actor-user-guide-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 ambient sound actor attenuation audio volume beginner"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a level of your own that has a goal and at least one room. If you have none, block out a quick one in a new level: a start, a goal about 40 m away, and one closed room on the way."
      - "Drag a looping sound from the Content Browser into the level, near the goal. This creates an Ambient Sound actor. You can import a .wav file of your own, open it and turn on Looping. If you have none, use the engine sound WhiteNoise. To see engine content, open the Settings menu of the Content Browser and turn on Show Engine Content."
      - "Select the Ambient Sound actor. In the Details panel, under Attenuation, turn on Override Attenuation. Set Inner Radius and Falloff Distance so that the player can hear the sound from the start, and so that it is louder near the goal."
      - "In the Place Actors panel, open Volumes and drag an Audio Volume around one room. In its Details panel, under Reverb, turn on Apply Reverb and pick a Reverb Effect. Walk into the room in PIE and listen to the change."
    done_when: "Send a writeup that says where the sound is and how it pulls the player."
    xp: 25
    verify_type: writeup
    quiz:
      - q: "What does attenuation control for a sound?"
        choices: ["How fast the sound plays", "How the sound gets quieter with distance", "How many times the sound repeats in a loop", "How the sound echoes in a room"]
        answer_index: 1
        explain: "Attenuation sets how the volume of a sound falls as the listener moves away. It decides how far the sound reaches."
      - q: "What is created when you drag a sound from the Content Browser into the level?"
        choices: ["An Audio Volume", "A Reverb Effect", "An Ambient Sound actor", "A Sound Attenuation asset"]
        answer_index: 2
        explain: "Dragging a sound into the level creates an Ambient Sound actor at that spot. The actor plays the sound from its position in the level."
      - q: "How does a sound near the goal pull the player toward it?"
        choices: ["It gets louder as the player gets closer", "It gets quieter as the player gets closer", "It stops when the player moves", "It plays only at the start of the level"]
        answer_index: 0
        explain: "A sound that grows louder tells the player they are moving toward its source. This guides the player without anything on screen."
      - q: "Where do you set how far the sound of an Ambient Sound actor reaches?"
        choices: ["In the Place Actors panel, under Volumes, after you search for the word Attenuation", "In the Settings menu of the Content Browser, after you turn on Show Engine Content", "In the Reverb section of an Audio Volume that you place around the Ambient Sound actor", "In the Details panel, under Attenuation, after you turn on Override Attenuation"]
        answer_index: 3
        explain: "Override Attenuation lets you set the values on the actor itself. Inner Radius and Falloff Distance then decide where the sound is loud and how far it fades out."
      - q: "Which actor do you place around a room to change its reverb?"
        choices: ["A Post Process Volume", "An Audio Volume", "An Ambient Sound actor", "A Local Fog Volume"]
        answer_index: 1
        explain: "An Audio Volume changes how sound behaves inside it. Under Reverb you turn on Apply Reverb and pick a Reverb Effect."
      - q: "You want to use the engine sound WhiteNoise, but you cannot find it in the Content Browser. What do you turn on?"
        choices: ["Override Attenuation in the Details panel of the Ambient Sound actor", "Apply Reverb in the Details panel of an Audio Volume in the level", "Show Engine Content in the Settings menu of the Content Browser", "Looping in the sound asset, after you open it from the Content Browser"]
        answer_index: 2
        explain: "Engine content is hidden by default. Show Engine Content makes the engine folders visible, and WhiteNoise is one of the engine sounds."

