        choices: ["The darkest one", "Always the left", "The longest", "The brighter or higher-contrast one"]
        answer_index: 3
        explain: "Light and contrast pull attention. Use that to point at where they should go."
      - q: "What is an affordance?"
        choices: ["A performance budget", "A shape or cue that suggests what the player can do with it", "A kind of light", "A material parameter"]
        answer_index: 1
