      - "Add a Custom Event OpenGate. It moves the door mesh up (Set Relative Location or a Timeline), then calls Set Timer by Event with a Custom Event CloseGate, Time = OpenSeconds, Looping off. Store the returned handle in a variable GateHandle."
      - "Call a second Set Timer by Event with a Custom Event Tick1s, Time = 1, Looping on. Store the handle in TickHandle. In Tick1s, read Get Timer Remaining Time by Handle (GateHandle), round it, and set the Text Render text."
      - "In CloseGate: move the door back down, and Clear and Invalidate Timer by Handle for TickHandle. Set the Text Render to CLOSED."
      - "Create BP_GateSwitch (Actor) with a Box Collision and an Instance Editable reference to BP_TimedGate. On overlap with the player it calls OpenGate. Place the switch far enough that the run to the gate takes about 7 seconds."
      - "On the exit Box Collision Begin Overlap in BP_TimedGate, clear both timers and print Made it. Test a fast run and a slow run. Then add a pause volume that calls Pause Timer by Handle on GateHandle and confirm the countdown freezes."
    done_when: "Screenshot of PIE showing the open gate with the Text Render countdown mid-run, plus a short note with the OpenSeconds value you settled on and why."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What happens to a timer if the actor it would call is destroyed before the time is up?"
        choices: ["The timer still fires on the Game Instance", "The timer is canceled automatically and its handle becomes invalid", "The timer fires immediately", "The timer is moved to the next actor of the same class"]
        answer_index: 1
        explain: "The Gameplay Timers page says timers are canceled automatically when the target object is destroyed, and the handle becomes invalid."
      - q: "What does calling Set Timer with a rate less than or equal to zero do?"
        choices: ["It is identical to clearing the timer", "It fires the timer every frame", "It pauses the timer", "It creates a timer that never fires but keeps the handle valid"]
        answer_index: 0
        explain: "The page states that SetTimer with a rate <= 0 is identical to calling ClearTimer. The Set Timer by Event node says the same."
      - q: "A timer is paused with Pause Timer. What happens to its elapsed and remaining times while paused?"
        choices: ["Both reset to zero", "Elapsed keeps growing, remaining stops", "They stay the same until the timer is unpaused", "Remaining becomes -1"]
        answer_index: 2
        explain: "Pausing prevents the function call, but the elapsed and remaining times stay the same while paused. UnPauseTimer resumes."
      - q: "GetTimerRate returns -1. What does that tell you?"
        choices: ["The timer is looping", "The timer handle is not valid", "The timer is paused", "The timer fires on the next tick"]
        answer_index: 1
        explain: "The page says GetTimerRate, GetTimerElapsed and GetTimerRemaining return -1 when the handle is invalid."
      - q: "What is the relationship between a timer's elapsed time, remaining time and rate?"
        choices: ["Elapsed minus remaining equals the rate", "Elapsed plus remaining equals the rate", "Rate equals remaining divided by elapsed", "There is no fixed relationship"]
        answer_index: 1
        explain: "The page says the sum of elapsed and remaining time should equal the rate of the timer."
      - q: "You call Set Timer by Event again using a handle that already has a running timer. What happens?"
        choices: ["The second call is ignored", "Both timers run at the same time", "The engine reports an error", "The existing timer is cleared and replaced with the new one"]
        answer_index: 3
        explain: "Calling SetTimer with an existing timer handle clears the referenced timer and replaces it with a new one."
      - q: "Which input on Set Timer by Event stops a looping timer from firing several times in one frame when it would otherwise catch up?"
        choices: ["Max Once Per Frame", "Initial Start Delay", "Looping", "Initial Start Delay Variance"]
        answer_index: 0
        explain: "The node's Max Once Per Frame input is for looping timers, to execute only once when the timer would expire multiple times in the current frame."
      - q: "You want a function to run on the next frame, not after a delay. Which function does the page name, and what is its limitation?"
        choices: ["SetTimerForNextTick, which does not fill out a timer handle", "ClearAllTimersForObject, which only works once", "PauseTimer, which needs a rate", "GetWorldTimerManager, which only works in C++"]
        answer_index: 0
        explain: "SetTimerForNextTick runs on the next frame but does not provide a timer handle, so you cannot pause or query it."
    flavors:
      _default: {why: "A visible timer turns a corridor into a decision: run now, or explore and lose the gate."}
      level_design: {why: "Timed gates are a cheap pacing tool once the timer logic is reliable and readable.", do: "Place the switch so the player can see the gate when they press it, and measure the run with the countdown."}
      gameplay_design: {why: "Timer handles are the base of cooldowns, buffs and wave spawners.", do: "Add a second gate that shares the same countdown so the player has to choose one exit."}

  - id: LDQ78
