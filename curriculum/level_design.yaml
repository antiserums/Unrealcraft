      - q: "Modeling does not appear in the mode dropdown. What should you check?"
        choices: ["That the level has a landscape, because the mode works on terrain", "That Nanite is enabled in the Project Settings of the project", "That the project is a C++ project and that the editor module is compiled", "That the Modeling Tools Editor Mode plugin is enabled under Edit > Plugins"]
        answer_index: 3
