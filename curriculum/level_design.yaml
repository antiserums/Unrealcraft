    title: Falls that are fair, not fatal
    brief: "When a player falls off the level, something has to happen, and you should be the one who decides what. Kill Z is a height in World Settings below which actors are destroyed, and a Kill Z Volume does the same inside a box. A blocking volume is an invisible wall. In this quest you set these up, and you build a catcher that takes some health and puts the player back at the last safe spot, so that a fall costs something but does not end the game."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/volume-actors-in-unreal-engine"
    backup_url: null
    extra_urls:
