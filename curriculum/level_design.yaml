    required_spine: false
    required: false
    title: Quest stages with Data Layers
    brief: "A Data Layer is a named group of actors in a World Partition level that can be loaded and unloaded together while the game runs. With Data Layers, one place can have several states without a copy of the level, for example a camp before and after a battle. This is how progress in a story can change the world. In this quest you build two stages of a camp on two Data Layers and switch between them with a trigger."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition---data-layers-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-editor-context-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a World Partition level, or create one with File, New Level, Open World. Create three Data Layer assets of the type Runtime: DL_Stage1, DL_Stage2 and DL_Stage2_Props. Drag DL_Stage1 and DL_Stage2 into the Data Layer Outliner to make instances. Then drag DL_Stage2_Props onto the DL_Stage2 instance, so that it becomes a child of it."
      - "Set the Initial Runtime State of DL_Stage1 to Activated and of DL_Stage2 to Unloaded. Right-click DL_Stage1 and choose Make Current Data Layer, so that new actors go into it. Build a simple camp from cubes, with a few tents and a closed gate. Check that the Actor Editor Context widget shows DL_Stage1."
      - "Now make DL_Stage2 the current layer and build the same camp as it looks after a battle, with an open gate and tents that are tilted or dark. Put a few small cubes as loot props in DL_Stage2_Props. Clear the current Data Layer when you are done."
      - "Make an Actor Blueprint named BP_StageTrigger with a Box collision and two editable variables of the type Data Layer Asset, named LayerOff and LayerOn. On overlap by the player, get the Data Layer Subsystem and call Set Data Layer Instance Runtime State twice: once to set LayerOff to Unloaded and once to set LayerOn to Activated."
      - "Place the trigger at the exit of the camp, with LayerOff set to DL_Stage1 and LayerOn set to DL_Stage2. Start Play In Editor, run wp.Runtime.ToggleDrawDataLayers, and walk through the trigger."
      - "Test the states. In the console, run wp.Runtime.SetDataLayerRuntimeState Loaded DL_Stage2 and look at the camp. Then set it to Activated. Write one line about the difference."
      - "Run wp.DumpDatalayers and read the log. Then rename DL_Stage2_Props in the Content Browser and confirm that the actors still belong to it."
    done_when: "Send a screenshot of the Data Layer Outliner that shows the hierarchy and the Initial Runtime States. Also send two Play In Editor screenshots with wp.Runtime.ToggleDrawDataLayers turned on, one before and one after the trigger. Add one line about Loaded compared with Activated."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the difference between a Data Layer Asset and a Data Layer Instance?"
        choices: ["There is no difference; both names are used for the same object, which is shown in the Content Browser and in the Outliner", "Assets are runtime only and are loaded by the game; instances are editor only and are removed when the project is cooked", "Assets are project-level and not world specific; instances hold world-specific settings for that asset", "Instances live in the Content Browser and are shared by all worlds; assets live in the Outliner of one world"]
        answer_index: 2
        explain: "The asset stores the name, type and debug color and can be used in several worlds. Each world creates an instance with its own properties such as Initial Runtime State."
      - q: "A Data Layer Instance is set to the Loaded runtime state. What does the player see?"
        choices: ["The actors are unloaded", "The actors are visible but have no collision", "The actors are loaded and visible", "The actors are loaded but not visible"]
        answer_index: 3
        explain: "Loaded means in memory but not visible. Activated means loaded and visible. The Blueprint example moves GreyBox to Loaded and Ruins to Activated."
      - q: "How do you create a child Data Layer Instance by drag and drop?"
        choices: ["Drop the asset onto the viewport, above an actor that is in the parent layer", "Drop an existing instance into the same folder of the Content Browser", "Drop two assets onto each other in the Content Browser", "Drop the asset onto an existing instance in the Data Layer Outliner"]
        answer_index: 3
        explain: "Dropping an asset into the Outliner creates an instance. Dropping it onto an existing instance creates a child instance under it."
      - q: "Which console command forces a Data Layer into a given state?"
        choices: ["wp.Runtime.ToggleDrawDataLayers [state] [layer]", "wp.Runtime.DumpDatalayers [state] [layer]", "wp.Runtime.SetDataLayerRuntimeState [state] [layer]", "wp.Runtime.DebugFilerByDatalayer [layer] [state]"]
        answer_index: 2
        explain: "SetDataLayerRuntimeState forces a state. ToggleDrawDataLayers shows the list on screen, DumpDatalayers writes it to the log, and DebugFilerByDatalayer filters the hash debug view."
      - q: "What does Make Current Data Layer do?"
        choices: ["Activates the layer at runtime, so its actors are loaded when the game starts", "Sets the layer as the Actor Editor Context, so new actors you place join it automatically", "Loads all of its actors in the editor and unloads the actors of every other Data Layer", "Renames the layer to Current, so that it is listed first in the outliner"]
        answer_index: 1
        explain: "Through Actor Editor Context, every actor added to the viewport is assigned to the current Data Layer. It is an editor placement aid, not a runtime change."
      - q: "You rename a Data Layer. Which files change?"
        choices: ["Only the label in the WorldDataLayer file; actors keep their internal identifier", "Nothing; a Data Layer cannot be renamed once it has been created and saved in the world", "Every actor in the layer, but not the level file of the world", "The level file and every actor in the layer, which must all be checked out first"]
        answer_index: 0
        explain: "Each Data Layer has a display label and an internal unique identifier. Renaming only touches the label, so no actor files need to be saved."
      - q: "What performance warning does the page give about Runtime Data Layers?"
        choices: ["Widely used assets assigned to too many Runtime Data Layer Instances can degrade World Partition streaming performance", "Only one Runtime Data Layer may be active at any time, so loading a second one unloads the first and causes a hitch for the player", "They double memory use, because each actor is stored once for the layer and once for the grid", "They cannot be used in cooked builds, so every Runtime Data Layer must be converted to an Editor Data Layer before packaging"]
        answer_index: 0
        explain: "Loading too much at once and assigning assets to too many runtime instances hurts streaming performance, so monitor runtime instance usage."
      - q: "In a client-server game, who is allowed to activate a Data Layer according to the C++ example?"
        choices: ["Any client, through its own Player Controller", "Only the server, checked with HasAuthority", "Only the listen client, never a server", "The Data Layer Subsystem decides randomly"]
        answer_index: 1
        explain: "The example comment says: in client/server only the server can activate a Data Layer, so the code checks HasAuthority before setting the state."
    flavors:
      _default: {why: "Data Layers let one place have several states without duplicating the level. That is how quest progress changes the world."}
      level_design: {why: "Before and after states are storytelling tools, and the hierarchy keeps them tidy.", do: "Add a DL_Stage3 with a rebuilt camp and chain two triggers."}
      gameplay_design: {why: "Game state should drive which layer is active.", do: "Store the current stage in the Game Instance so it survives a level reload."}

  - id: LDQ87
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [one-file-per-actor, source-control, workflow, collaboration]
    required_spine: false
    required: false
    title: One File Per Actor on an old level
    brief: "Normally a level is one file, so only one person can change it at a time. One File Per Actor, or OFPA, saves every actor of the level in its own small file, called an external actor. This lets several people work on the same map at once. World Partition levels use it by default, but you can also turn it on for older levels. In this quest you convert an old level to OFPA and look at what changes when you save."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/one-file-per-actor-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-instancing-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. You need a level that does not use World Partition and has at least one sublevel. If you have none, make one: choose File, New Level, Basic, save it as L_Legacy, place a few cubes, create a second small level with a few cubes, and add it as a sublevel in Window > Levels. Duplicate the main level, name the copy L_Legacy_OFPA, and open it."
      - "Open Window > World Settings. In the World section, check Use External Actors. Click Yes in the convert dialog, and save the level."
      - "Move one cube and use File > Save All. Write down what the list of files to save shows. Then check the Levels window and notice that the sublevels are still not converted."
      - "Load one sublevel, make it the current level, and enable Use External Actors for it too. Write one line that says why the commandlet (a command line tool of the editor) with -convertsublevels would be faster on a big map."
      - "Select four meshes, right-click, open Level, and choose Create Level Instance. Look at the External Actors checkbox in the dialog and leave it on. Save it as LI_Legacy."
      - "If your project uses Perforce, open the View Changelist window and look at how the external actor files are shown. If it does not, write two lines about what that window would show you and why the file names look strange on disk."
      - "Write 3 lines: what OFPA changes for a team, what happens to external actors when the game is cooked, and one risk when you submit only some of the files."
    done_when: "Send a screenshot of World Settings with Use External Actors checked, and add your 3 lines of text and your note about the save list."
    xp: 55
    verify_type: writeup
    quiz:
      - q: "What problem does One File Per Actor solve?"
        choices: ["Actors losing their transforms when two people save the same level file one after the other", "Slow shader compiling when a level has many actors", "One person checking out the level file locks everyone else out of its actors", "Levels being too large to render when all of their actors are loaded at once"]
        answer_index: 2
        explain: "OFPA saves actor instances in external files, so you no longer need to check out and save the main level file to edit its actors."
      - q: "Where do external actors go when the game is cooked?"
        choices: ["They stay as separate files in the cooked build", "They are embedded back into their level files", "They are deleted, and only the level file is kept", "They become Data Layers, one for each actor file"]
        answer_index: 1
        explain: "OFPA is editor-only. All actors are embedded in their respective level files when cooked."
      - q: "You enable Use External Actors on a level with three sublevels. What is converted?"
        choices: ["Only the current level", "Only the sublevels", "Nothing until you restart", "The level and all sublevels"]
        answer_index: 0
        explain: "Only the current level is converted. Each sublevel must be loaded and enabled separately, or you use the commandlet with -convertsublevels."
      - q: "Which commandlet arguments convert a map and its sublevels without source control?"
        choices: ["-run=ConvertLevelsToExternalActorsCommandlet -nosourcecontrol -convertsublevels", "-run=WorldPartitionBuilderCommandlet -builder=WorldPartitionResaveActorsBuilder", "-run=cook -Unversioned", "-run=WorldPartitionConvertCommandlet -OnlyMergeSubLevels"]
        answer_index: 0
        explain: "ConvertLevelsToExternalActorsCommandlet is the OFPA converter. -nosourcecontrol skips source control and -convertsublevels includes the sublevels."
      - q: "What does the View Changelist window show for external actor files?"
        choices: ["Only the encoded file names, which you must look up in the Content Browser", "The actor names, level paths and asset types instead of the encoded names", "A 3D preview of each actor that is in the changelist", "The cook status of each actor, as Cooked or Not Cooked"]
        answer_index: 1
        explain: "External actor file names are encoded on disk. The View Changelist window decodes them so you can validate a changelist before submitting."
      - q: "Changelist support in the editor is available with which source control provider?"
        choices: ["None, it is a standalone tool", "Git only", "Perforce only", "Any provider"]
        answer_index: 2
        explain: "The page states that changelist support is only available when using Perforce as the source control provider."
      - q: "Why does Epic say to submit OFPA content from inside the editor?"
        choices: ["Because external source control tools cannot see .uasset files at all, so a submit from outside the editor would leave out every actor file", "Because it is faster to submit from the editor, which sends only the changed bytes of each actor file to the server", "Because the editor compresses the files on submit, so the actor files take much less space on the source control server", "Because a user could submit only some checked-out files and leave dangling references, and the editor lets you validate the changelist first"]
        answer_index: 3
        explain: "OFPA adds complexity: partial submits can break references. Validating the changelist in the editor before submitting reduces that risk."
      - q: "A Level Instance is created with External Actors turned OFF. What is the runtime consequence in a World Partition world?"
        choices: ["It becomes always loaded, at any distance from the player", "It loses its meshes, and only the empty actors are loaded", "It is converted to external actors automatically when it loads", "It cannot be embedded in the grid and uses Level Streaming Mode"]
        answer_index: 3
        explain: "Only OFPA Level Instances can be embedded. A Level Instance without OFPA streams as its own level, which costs more at runtime."
    flavors:
      _default: {why: "Teams work on the same map at once. One File Per Actor is what makes that possible, in and out of World Partition."}
      level_design: {why: "You will hand old blockouts to artists. Converting them first avoids file locks.", do: "Convert one more legacy level and note how long the conversion took."}
      programming: {why: "Build and source control scripts must know actors live in external files.", do: "Read the commandlet section and write the full command line for your project."}

