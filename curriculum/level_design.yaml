      - q: "The key has a translucent glow material. Will the channel light affect the glow?"
        choices: ["No, channels only affect direct lighting on opaque materials", "Yes, all materials work with channels, whatever the blend mode", "Only if bloom is on in the Post Process Volume", "Only with Lumen, which lights translucent materials by channel"]
        answer_index: 0
        explain: "Lighting channels only affect direct lighting on opaque materials. Translucent and masked materials do not work."
      - q: "What is the performance cost of lighting channels per the docs?"
        choices: ["Zero", "About 5 ms per light", "Minimal but non-zero", "Doubles lighting cost"]
        answer_index: 2
        explain: "The example shows an extra small pass (CopyStencilToLightingChannels) of about 0.08 ms. Minimal but not zero."
      - q: "On mobile, a mesh has Channel 0 and Channel 1 enabled and there are two directional lights. Which lights it?"
        choices: ["The directional light from the first channel the mesh has set", "Both of them, with the light of each one added together", "The brighter one of the two, measured by its Intensity value", "None of them, as two channels cancel"]
        answer_index: 0
        explain: "On mobile each primitive is affected by one directional light, taken from the first lighting channel it has set."
    flavors:
      _default: {why: "Lighting channels let you spotlight one object without changing the mood of the room."}
      level_design: {why: "A lit key in a dark room is a classic guidance trick. Channels make it clean.", do: "Use a second channel for a hidden path that only shows when a switch light is turned on."}

