    subjects: [foliage, instancing, set-dressing]
    required_spine: false
    required: false
    title: "Foliage mode: paint, erase, reapply"
    brief: "Foliage mode lets you paint many copies of a mesh, such as rocks, bushes or trees, onto the ground with a brush instead of placing them one by one. Foliage fills a level quickly, but it can also block paths and views, so deciding where it grows and where it does not is part of level design. In this quest you paint two foliage types on a slope, erase a path through them, and set how far away they stop being drawn."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/foliage-mode-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open a level that has a Landscape. Press Shift+3 to enter Foliage mode."
      - "Drag two Static Meshes from the Content Drawer into the Mesh List, for example a rock and a bush (any assets are fine). This creates a Static Mesh Foliage type for each mesh."
      - "Select the Paint tool. Set Brush Size to 512 and Paint Density to 0.3. Paint both foliage types across a slope."
      - "Hold Shift and paint to erase foliage. Clear a path through the foliage that is wide enough for a player."
      - "In Filters, turn off Landscape and turn on Static Mesh. Try to paint on the landscape and note what happens."
      - "Select the bush type and change Scale Min and Scale Max. Then use the Reapply tool to paint the new scale onto bushes that are already placed."
      - "In the Foliage Details, set an End Cull Distance and a Start Cull Distance for the bush. These are the distances at which the bushes fade out and stop being drawn. Start Play In Editor and walk away to watch them disappear."
    done_when: "Send one screenshot of the painted slope with a clear path through it, and one screenshot of the Foliage panel that shows your two types and the Cull Distance values."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Why is Static Mesh Foliage cheaper than Actor Foliage?"
        choices: ["Static Mesh Foliage uses hardware instancing, so many instances draw in one draw call; Actor Foliage costs the same as normal actors", "Static Mesh Foliage has no collision", "Actor Foliage uses bigger textures", "There is no difference"]
        answer_index: 0
        explain: "Static Mesh foliage is batched and rendered with hardware instancing. Actor Foliage places real actors, so high densities can cause performance issues."
      - q: "How do you erase foliage while the Paint tool is active?"
        choices: ["Right-click", "Hold Shift while painting", "Hold Ctrl while painting", "Press Delete"]
        answer_index: 1
        explain: "Holding Shift with the Paint tool erases instances of the selected foliage type."
      - q: "You changed the scale settings of a foliage type. How do you apply the change to bushes already in the level?"
        choices: ["Erase and paint again", "Rebuild lighting", "Save the level", "Use the Reapply tool and paint over them"]
        answer_index: 3
        explain: "The Reapply tool selectively changes parameters on instances that are already placed, by painting the changes onto them."
      - q: "What do the Filter options (Landscape, Static Mesh, BSP, Foliage, Translucent) control?"
        choices: ["Which foliage types show in the palette", "The draw distance", "Which surfaces the selected tool will place foliage on", "The LOD of the foliage"]
        answer_index: 2
        explain: "Filters decide which surface types receive foliage. Turn off Landscape and you cannot paint on the landscape."
      - q: "You set only End Cull Distance and groups of bushes pop out of view suddenly. What does the page recommend?"
        choices: ["Increase Brush Size", "Add a Start Cull Distance and use PerInstanceFadeAmount in the material to fade instances out", "Switch to Actor Foliage", "Disable LODs"]
        answer_index: 1
        explain: "Whole clusters cull at End Cull Distance. A Start Cull Distance plus the PerInstanceFadeAmount node lets instances fade before they are removed."
      - q: "How can you let players lower foliage density with scalability settings?"
        choices: ["Enable Density Scaling on the foliage type and use foliage.DensityScale", "Delete half the instances", "Set Brush Size to 0", "Use the Fill tool"]
        answer_index: 0
        explain: "With Enable Density Scaling checked in the Scalability section, the foliage.DensityScale command controls how many instances render."
    flavors:
      _default: {why: "Foliage fills a level fast, but it also blocks paths and sightlines. Painting and erasing it is level design work."}
      level_design: {why: "Erasing foliage is how you cut the path. The Filter and cull settings decide if your path stays readable from far away.", do: "Stand at the start of your path and check that the cleared route is visible from 30 meters away."}
      lookdev: {why: "Cull and fade settings decide whether a forest edge looks natural or pops in and out."}

  - id: LDQ56
    rank: 1
    difficulty: apprentice
    specializations: [level_design]
    subjects: [sky-atmosphere, lighting, readability]
    required_spine: false
    required: false
    title: "Sky Atmosphere: depth you can read"
    brief: "The Sky Atmosphere is the actor that draws a realistic sky and adds haze to things that are far away. In an outdoor level this haze is the strongest sign of depth, because it tells the player what is near and what is far. In this quest you set up a sky with a sun, place a line of cubes that goes into the distance, and change the atmosphere settings until the distances are easy to see."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/sky-atmosphere-component-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/environmental-light-with-fog-clouds-sky-and-atmosphere-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/sky-atmosphere-component-properties-in-unreal-engine"
    checklist:
      - "Start from an empty level. From the Place Actors panel, add a Sky Atmosphere, a Directional Light and a Sky Light."
      - "On the Directional Light, enable Atmosphere Sun Light so that it acts as the sun. Then hold Right Ctrl + L and move the mouse to move the sun across the sky."
      - "Place 5 large cubes in a line that goes away from the camera. Put each cube about 100 meters further away than the one before it."
      - "Set the sun low for a sunset and take a screenshot. Then set the sun high for noon and take another screenshot."
      - "Raise Mie Scattering Scale a little. Watch how the haze and the halo around the sun change."
      - "Raise Aerial Perspective View Distance Scale. Compare how easy it is now to tell which cube is nearer."
      - "Choose the settings that make distance easiest to see, and save the level with them."
    done_when: "Send three screenshots of the same line of cubes: one at sunset, one at noon, and one with your final settings. Add one line that says which setting helped depth the most."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Which three actors does the page say to place for a working Sky Atmosphere?"
        choices: ["Sky Atmosphere, Directional Light with Atmosphere Sun Light enabled, Sky Light", "Sky Atmosphere, Point Light, Post Process Volume", "Exponential Height Fog, Sky Light, Rect Light", "Sky Atmosphere only"]
        answer_index: 0
        explain: "The Sky Atmosphere needs a Directional Light with Atmosphere Sun Light on, and a Sky Light to capture the sky and light the scene."
      - q: "Why is the sky blue at noon but red at sunset in the Sky Atmosphere model?"
        choices: ["Because of Mie scattering from dust", "Because of Rayleigh scattering: blue scatters most, and at sunset the long path scatters the blue away first", "Because the Sky Light changes color", "Because of the tonemapper"]
        answer_index: 1
        explain: "Rayleigh scattering depends on wavelength. Blue scatters most, giving a blue sky. At sunset light travels further, so blue is lost and red remains."
      - q: "You raise the Mie Scattering Scale. What do you see?"
        choices: ["A clearer, sharper sky", "The sun disk disappears", "The sky turns green", "A hazier sky with a stronger bright halo around the sun"]
        answer_index: 3
        explain: "Mie scattering comes from larger particles like dust. More of it makes the sky hazy and scatters light forward, so the halo around the sun grows."
      - q: "What keyboard shortcut moves the Directional Light set to Atmosphere Sun Light Index 0?"
        choices: ["Ctrl + Shift + S", "Right Ctrl + L with mouse movement", "Alt + drag", "F key"]
        answer_index: 1
        explain: "Right Ctrl + L with mouse movement moves index 0 (the sun). Adding Shift moves index 1 (the moon)."
      - q: "What does the Aerial Perspective View Distance Scale do?"
        choices: ["Changes the size of the planet", "Moves the sun", "Scales the distance from the view to surfaces so the atmosphere looks thicker on distant objects", "Sets the cloud height"]
        answer_index: 2
        explain: "It scales view distances, so far surfaces pick up more atmosphere. This is a direct tool for making depth readable."
      - q: "You want the Sky Atmosphere to influence an Exponential Height Fog component. What must you do to the fog?"
        choices: ["Set Fog Inscattering Color and Directional Inscattering Color to black", "Delete the fog", "Set its density to zero", "Make it Movable"]
        answer_index: 0
        explain: "The atmosphere fog is added on top of the fog component's own colors. Setting both inscattering colors to black lets the Sky Atmosphere drive the fog color, with Height Fog Contribution as the control."
    flavors:
      _default: {why: "The atmosphere is the biggest depth cue in an outdoor level. Haze tells the player what is near and what is far."}
      level_design: {why: "Landmarks only guide if the player can read their distance. Aerial perspective and haze do that job for free.", do: "Place a landmark tower at the far end of the cube line and confirm it still reads as far away at noon."}
      lookdev: {why: "Rayleigh, Mie and absorption are the three dials of every sky you will ever build."}
      cinematics: {why: "Sun angle and haze set the time of day and the mood of a shot before any grading."}

  - id: LDQ57
    rank: 1
    difficulty: apprentice
    specializations: [level_design]
    subjects: [navigation, navmesh, project-settings]
    required_spine: false
    required: false
    title: Tune the NavMesh to your agent
    brief: "The NavMesh, short for Navigation Mesh, is a map of the floor areas where AI characters can walk. Unreal builds it from your level geometry. The NavMesh has settings for the size of the character, called the agent, and if they do not match your character the AI will fail in doorways, on stairs and in narrow gaps. In this quest you change these settings and watch how the NavMesh reacts."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/navigation-mesh-settings-in-the-unreal-engine-project-settings"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/optimizing-navigation-mesh-generation-speed-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/optimizing-navigation-mesh-generation-speed-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/basic-navigation-in-unreal-engine"
    checklist:
      - "Open a blockout level and add a NavMeshBoundsVolume that covers the play area. Press P in the viewport to see the NavMesh, which is drawn in green."
      - "Build a narrow gap of about 60 cm between a wall and a box. Check that the NavMesh goes through the gap."
      - "Select the actor named RecastNavMesh-Default. In the Details panel, find the Generation section and raise Cell Size from its default value to 64. Watch the NavMesh in the gap disappear."
      - "Set Cell Size back to its default. Now change Agent Radius and Agent Max Step Height, and watch how the NavMesh changes on stairs and in doorways."
      - "Pick one small decorative prop. In the Collision section of its Details panel, disable Can Ever Affect Navigation so the prop no longer cuts a hole in the NavMesh."
      - "Write down the Cell Size, Agent Radius and Agent Max Step Height that you keep for this level, and why you chose each one."
    done_when: "Send two screenshots of the same gap: one with the default Cell Size where the NavMesh passes through, and one with Cell Size 64 where the NavMesh is gone. Add your three chosen values with one line of reason for each."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "What does the Cell Size setting control?"
        choices: ["The size of one navigation tile in Unreal Units", "The radius of the smallest agent", "The horizontal size of a voxel used to build the NavMesh", "The distance between two Nav Link Proxies"]
        answer_index: 2
        explain: "Cell Size is the horizontal size of a voxelization cell. Cell Height is the vertical size. Tile Size UU is the size of a whole tile."
      - q: "You make the Cell Size bigger. What happens?"
        choices: ["Generation is faster but the NavMesh is less precise around obstacles", "Generation is slower but more precise", "The NavMesh becomes taller", "Agents move faster"]
        answer_index: 0
        explain: "Smaller voxels give more precision but need more processing. Epic recommends making cells as large as possible while keeping the precision your agents need."
      - q: "You want to change NavMesh generation settings for one level only, not the whole project. Where do you do it?"
        choices: ["Editor Preferences > Navigation", "Any Nav Modifier Volume in the level", "The Level Blueprint", "The RecastNavMesh-Default actor in the Outliner, Details panel"]
        answer_index: 3
        explain: "Project Settings > Navigation Mesh sets the defaults. Selecting the RecastNavMesh-Default actor lets you adjust the NavMesh in that level."
      - q: "Epic's recommendation for Tile Size is:"
        choices: ["Exactly 1000 UU", "Between 32 and 128 cells per side", "As small as possible", "The same as the Cell Size"]
        answer_index: 1
        explain: "Tiles between 32 and 128 cells per side give the best performance when rebuilding tiles at runtime. Large tiles are expensive; many tiny tiles add overhead."
      - q: "A small decorative prop should not change the NavMesh. What do you do?"
        choices: ["Delete its collision", "Put a Nav Link Proxy on it", "Disable Can Ever Affect Navigation in the actor's Collision section", "Set its mobility to Movable"]
        answer_index: 2
        explain: "By default Blueprint actors and Static Meshes affect navigation. Turning off Can Ever Affect Navigation removes the object from NavMesh generation and makes the tile cheaper to build."
      - q: "What does Agent Max Step Height mean?"
        choices: ["The largest vertical step the agent can perform", "The height of the tallest agent", "The maximum slope angle the agent can walk on", "The height of one voxel"]
        answer_index: 0
        explain: "Agent Max Step Height is the largest vertical step. Agent Height is the tallest agent, Agent Max Slope is the angle, Cell Height is the voxel height."
    flavors:
      _default: {why: "The NavMesh is built from your geometry. If the settings do not match your character, AI will fail in doorways, on stairs and in narrow gaps."}
      gameplay_design: {why: "Enemy behavior depends on where the NavMesh exists. Wrong settings make encounters break in ways that look like AI bugs.", do: "Test one enemy in a doorway that is exactly two Agent Radius wide, then one that is narrower, and note the difference."}

