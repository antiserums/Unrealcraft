    required: false
    title: Crowds that do not collide (RVO vs Detour Crowd)
    brief: "Pathfinding on the NavMesh only steers AI characters around walls and other fixed things. It does not stop them from walking into each other. For that Unreal has two avoidance systems: RVO, which is a setting on the Character Movement component, and Detour Crowd, which you get by using a special AI Controller. A market or a hallway looks broken when characters push through each other, so choosing a system is a design decision. In this quest you send two groups through each other with no avoidance, with RVO and with Detour Crowd."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-avoidance-with-the-navigation-system-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/navigation-system-in-unreal-engine"
    checklist:
      - "In a Third Person project, make a flat test level with a Floor scaled to 10x10 and a NavMeshBoundsVolume. Place two Sphere actors as targets on opposite sides."
      - "Copy BP_ThirdPersonCharacter and name the copy BP_NPC_NoAvoidance. Remove the input nodes. Add an Instance Editable Actor variable named Target, and on Begin Play call AI Move To with Pawn set to self and Target Actor set to Target."
      - "Place two groups of 4 to 6 NPCs that face each other across the level. Each group targets the sphere on the far side. Click Simulate and watch them collide in the middle."
      - "Duplicate the Blueprint and name it BP_NPC_RVO. On the Character Movement component, under Avoidance, enable Use RVOAvoidance and set Avoidance Consideration Radius to 100. Test the same crossing."
      - "Duplicate the Blueprint again and name it BP_NPC_DetourCrowd. Set its AI Controller Class to DetourCrowdAIController. Test the same crossing."
      - "Open Project Settings, go to Crowd Manager, and note the values of Max Agents and Max Agent Radius. Change one value and observe the effect."
    done_when: "Send three screenshots taken in the middle of the crossing: one with no avoidance, one with RVO and one with Detour Crowd. Add 2 to 3 lines that say which one you would use for a busy town square and why."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Pathfinding already routes around walls. Why does the guide say you still need avoidance?"
        choices: ["Pathfinding is only for players", "Avoidance handles moving obstacles and other agents; pathfinding handles objects that do not move", "Avoidance replaces the NavMesh", "Pathfinding does not work with Characters"]
        answer_index: 1
        explain: "Pathfinding finds a path around static objects. Avoidance algorithms are better for moving obstacles and other agents."
      - q: "Where does RVO avoidance live in Unreal?"
        choices: ["In the Character Movement component of the Character class", "In the AI Controller", "In the RecastNavMesh actor", "In the Blackboard"]
        answer_index: 0
        explain: "RVO is included in the Character Movement component. The guide enables Use RVOAvoidance there."
      - q: "Which is a real limitation of RVO listed by the guide?"
        choices: ["It needs a Behavior Tree", "It has a fixed maximum number of agents", "It does not use the NavMesh, so agents can go out of bounds", "It only works on Pawns that are not Characters"]
        answer_index: 2
        explain: "RVO does not use the Navigation Mesh for avoidance. Agents can potentially leave the navigable area. It is also less configurable and limited to the Character class."
      - q: "How do you turn on Detour Crowd avoidance for an agent Blueprint?"
        choices: ["Enable Use RVOAvoidance", "Set AI Controller Class to DetourCrowdAIController", "Add a Nav Modifier component", "Increase Avoidance Consideration Radius"]
        answer_index: 1
        explain: "The guide sets the AI Controller Class to DetourCrowdAIController. Detour Crowd can be used with any Pawn class."
      - q: "What is a limitation of the Detour Crowd Manager?"
        choices: ["It only works with the Character class", "It has a fixed maximum number of agents set in Project Settings", "It cannot avoid other agents", "It disables pathfinding"]
        answer_index: 1
        explain: "Detour Crowd has a fixed Max Agents value, set in Project Settings under Crowd Manager."
      - q: "Can you run RVO and Detour Crowd together on the same project?"
        choices: ["Yes, they combine for better results", "Yes, but only in packaged builds", "No; the guide says they should be used exclusively", "Only if Max Agents is above 100"]
        answer_index: 2
        explain: "Both systems work independently and should be used exclusively in your project."
      - q: "Why does the guide say Detour Crowd gives better avoidance quality than plain RVO?"
        choices: ["It uses adaptive RVO sampling biased toward the agent's direction, plus path corridor optimizations", "It runs at a higher tick rate", "It uses the GPU", "It teleports blocked agents"]
        answer_index: 0
        explain: "Detour Crowd samples velocities adaptively with a bias toward the agent's direction and adds visibility and topology path corridor optimizations."
      - q: "Which two Crowd Manager settings does the guide name?"
        choices: ["Sight Radius and Hearing Range", "Max Agents and Max Agent Radius", "Cell Size and Tile Size", "Walk Speed and Acceleration"]
        answer_index: 1
        explain: "In Project Settings > Crowd Manager you can adjust Max Agents and the Max Agent Radius used for the avoidance calculation."
    flavors:
