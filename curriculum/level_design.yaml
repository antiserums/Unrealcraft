    subjects: [navigation, nav-link, ai]
    required_spine: false
    required: false
    title: Bridge a gap with Nav Link Proxies
    brief: "The NavMesh breaks wherever the floor is not continuous, for example at a gap, a ledge or a ladder. AI characters will not cross such a break on their own. A Nav Link Proxy is an actor that connects two points on the NavMesh and tells the AI that it may jump or drop between them. In this quest you use Nav Link Proxies to let an AI cross a gap and drop down from a ledge."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-how-to-modify-the-navigation-mesh-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/navigation-system-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/navigation-mesh-settings-in-the-unreal-engine-project-settings"
    checklist:
      - "Build two floor areas with a gap between them, and a raised platform that has a ledge. Cover all of it with one NavMeshBoundsVolume."
      - "Place an AI character that roams around. Press P and confirm that the two floor areas are not connected by the NavMesh."
      - "From the Place Actors panel, drag in a Nav Link Proxy. Move its two handles, PointLinks[0].Left and Right, onto the NavMesh on each side of the gap. The green arrow must stay visible, because it shows that the link is connected."
      - "In the Details panel, open Point Links and then entry 0, and set Direction to Left to Right. Click Simulate and watch the AI cross in one direction only."
      - "Add a second Nav Link Proxy at the ledge. Put its Left handle on the edge of the platform and its Right handle on the floor below, and set Direction to Left to Right. The AI can now drop down."
      - "Select RecastNavMesh-Default and enable Draw Tile Bounds to see the tiles of the NavMesh. Check that each link connects tiles that are next to each other."
    done_when: "Send one screenshot with P turned on that shows both Nav Link Proxies with their green arrows visible. Add one sentence that says which Direction each link uses and why."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "What is a Nav Link Proxy for?"
        choices: ["To raise the cost of an area", "To hide the NavMesh in Play", "To connect two NavMesh areas that have no continuous path", "To spawn AI at a point"]
        answer_index: 2
        explain: "Nav Link Proxies are extra connections used during path search. They bridge separate areas and let agents fall or jump toward their goal."
      - q: "The green arrow on your Nav Link Proxy disappears. Why?"
        choices: ["An end point is not touching the NavMesh surface", "The link is set to Both Ways", "The level has no Nav Modifier Volume", "You have too many links"]
        answer_index: 0
        explain: "The guide says the green arrow disappears if the Nav Link Proxy does not connect with the surface of the NavMesh. Move the handles onto the mesh."
      - q: "You want AI to drop off a ledge but never climb back up. Which setting?"
        choices: ["Area Class = NavArea_Null", "Smart Link Is Relevant off", "Direction = Both Ways", "Direction = Left to Right, with Left on the ledge"]
        answer_index: 3
        explain: "Point Links have a Direction: Both Ways, Left to Right or Right to Left. A one-way link from the ledge (Left) to the floor (Right) allows only the drop."
      - q: "Which of these is NOT a Direction option on a Point Link?"
        choices: ["Both Ways", "Up to Down", "Left to Right", "Right to Left"]
        answer_index: 1
        explain: "The three options are Both Ways, Left to Right and Right to Left. There is no Up to Down."
      - q: "A long Nav Link Proxy across the map does not work. The likely reason:"
        choices: ["Links need a Nav Modifier Volume", "Links only work in Dynamic mode", "Links can only connect adjacent NavMesh tiles; check with Draw Tile Bounds", "Links cannot be longer than 1 meter"]
        answer_index: 2
        explain: "Nav Link Proxies can only connect adjacent Navigation Mesh tiles. Enable Draw Tile Bounds on the RecastNavMesh actor to see the tiles."
      - q: "You want the agent to really jump (with a launch) when it uses a link. What does the guide do?"
        choices: ["A Blueprint child of Nav Link Proxy using Event Receive Smart Link Reached, with Smart Link Is Relevant enabled", "Set the Direction to Both Ways", "Raise Agent Max Step Height", "Add a Nav Modifier component"]
        answer_index: 0
        explain: "The guide creates BP_NavProxyLink from Nav Link Proxy, reacts to Event Receive Smart Link Reached to launch the character, copies the end points to the Smart Link and enables Smart Link Is Relevant."
    flavors:
      _default: {why: "Ledges, gaps and ladders break the NavMesh. Nav Links are how a level designer tells AI that the jump or drop is allowed."}
      gameplay_design: {why: "One-way drops let enemies chase the player down but not back up. That is a pacing tool.", do: "Add one one-way drop that lets enemies follow the player into an arena but not leave it."}

  - id: LDQ60
    rank: 1
    difficulty: apprentice
    specializations: [level_design]
    subjects: [navigation, debugging, navmesh]
    required_spine: false
    required: false
    title: Read the NavMesh like a map
    brief: "When an AI character does not go where it should, the cause is often in the NavMesh, the map of where AI can walk. Unreal can draw the NavMesh in several ways that show its polygons, its tiles and its costs. You cannot fix a movement problem that you cannot see, so reading this drawing is the first step for every navigation bug. In this quest you turn on the different drawing options and find one spot where the NavMesh is missing."
    time_min: 30
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/basic-navigation-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/navigation-mesh-settings-in-the-unreal-engine-project-settings"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/navigation-mesh-settings-in-the-unreal-engine-project-settings"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/ai-debugging-in-unreal-engine"
    checklist:
      - "Open a level that has stairs, a doorway and a NavMeshBoundsVolume. Press P to show the NavMesh."
      - "Select the actor RecastNavMesh-Default. In the Display section of the Details panel, set Draw Offset to 50 and compare how the stairs look now."
      - "Enable Draw Poly Edges, then Draw Tile Bounds, then Draw Polygon Costs. Take one screenshot of each."
      - "Enable Draw Nav Links and Draw Failed Nav Links. Note in which situations each one is useful."
      - "Start Play in Editor. Open the console and type show Navigation true to see the NavMesh during play. Then type show Navigation false to hide it."
      - "Find one place where the NavMesh is missing but a player could walk. Write one line that says why it is missing, for example step height, a gap, or the collision of a prop."
    done_when: "Send three screenshots (Poly Edges, Tile Bounds and Polygon Costs), and add your one-line note about the spot where the NavMesh is missing."
    xp: 50
    verify_type: screenshot
    quiz:
      - q: "Which key toggles the NavMesh display in the editor viewport?"
        choices: ["N", "P", "F8", "Ctrl+Shift+N"]
        answer_index: 1
        explain: "Pressing P shows the NavMesh. It is drawn green by default."
      - q: "The NavMesh drawing looks broken on the stairs. Which setting raises the drawing for better readability?"
        choices: ["Cell Height", "Agent Max Step Height", "Draw Filled Polys", "Draw Offset"]
        answer_index: 3
        explain: "Draw Offset is a vertical offset added to the NavMesh debug drawing. The Basic Navigation guide sets it to 50 to fix the stair artifacts."
      - q: "You want to see the polygons that make up the mesh. Which option?"
        choices: ["Draw Poly Edges", "Draw Octree", "Draw Tile Labels", "Draw Clusters"]
        answer_index: 0
        explain: "Draw Poly Edges draws the edges of every polygon, not only the border edges."
      - q: "Which option shows the boundaries of navigation tiles?"
        choices: ["Draw NavMesh Edges", "Draw Marked Forbidden Polys", "Draw Tile Bounds", "Draw Path Colliding Geometry"]
        answer_index: 2
        explain: "Draw Tile Bounds draws the tile boundaries. Tiles matter for runtime rebuilds and for Nav Links."
      - q: "During Play in Editor, which console command shows the NavMesh?"
        choices: ["navmesh 1", "show Navigation true", "stat nav", "r.NavMesh 1"]
        answer_index: 1
        explain: "The AI Debugging page says show Navigation true displays the NavMesh in gameplay and show Navigation false hides it."
      - q: "When does the editor rebuild the NavMesh?"
        choices: ["Only when you click Build", "Only in Play", "Only after saving the level", "Automatically when a NavMeshBoundsVolume is added or resized"]
        answer_index: 3
        explain: "Unreal generates the NavMesh automatically as soon as a Nav Mesh Bounds Volume is added or resized."
    flavors:
      _default: {why: "You cannot fix AI movement problems you cannot see. Reading the NavMesh drawing is the first step of every navigation bug."}
      gameplay_design: {why: "Most reports of broken enemy AI are NavMesh holes. Knowing the display options makes you fast at finding them.", do: "Use Draw Polygon Costs to find one place where a prop makes a cheap route expensive."}

