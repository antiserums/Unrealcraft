      - q: "Where do you enable the Procedural Foliage tools?"
        choices: ["Edit > Plugins > Foliage > Procedural Foliage Spawner, then restart", "Edit > Editor Preferences > Experimental > Procedural Foliage", "Project Settings > Rendering > Foliage > Enable Procedural Foliage", "Foliage Mode > Settings > Enable Procedural Tools"]
        answer_index: 1
        explain: "The quick start says to open Editor Preferences, go to the Experimental section and enable Procedural Foliage."
      - q: "You set Num Steps to 0 on a Static Mesh Foliage. What happens?"
