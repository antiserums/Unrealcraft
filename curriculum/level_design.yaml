    title: "Keep-out zones: density, filters, pruning"
    brief: "When PCG scatters objects such as bushes over a landscape, it will also put them on the paths the player needs unless you tell it not to. In PCG every point has a density, a value from 0 to 1, and you can remove points by area, by density, or because they overlap. In this quest you build a scatter graph that keeps the main route empty with keep-out volumes, and that thins out the remaining points with noise, a filter and pruning."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-content-generation-framework-node-reference-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-content-generation-framework-data-types-reference-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-content-generation-overview"
    checklist:
      - "Create a PCG graph named PCG_Scatter_Route. Start with a Get Landscape Data node connected to a Surface Sampler node."
      - "Place two Volumes over your main route and give them the tag KeepOut. In the graph, add a Get Volume Data node and set its Actor Filter to find actors by the tag KeepOut."
      - "Add a Difference node. Connect the sampler points to Source and the volumes to Differences. Set Density Function to Binary, which removes the points inside the volumes completely."
      - "Add a Density Noise node, which gives each point a random density. Then add a Density Filter that keeps only the points with a density between 0.5 and 1.0."
      - "Add a Self Pruning node set to Large to Small, which removes points that overlap. Add a Bounds Modifier before it, and test how changing the bounds changes the pruning."
      - "Finish the graph with a Static Mesh Spawner that uses two bush meshes. Click Generate, and check in PIE that the route stays clear."
    done_when: "Send one screenshot of the graph with the Difference, Density Filter and Self Pruning nodes visible, and one viewport screenshot that shows the empty keep-out corridor with bushes around it."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "The Density Filter node is described as superseded by Attribute Filter. When should you still use Density Filter?"
        choices: ["Never, it is deprecated and will fail", "Only in runtime generation", "When performance is a major concern or when it shows the intent of the graph more clearly", "Only when the input is an Attribute Set"]
        answer_index: 2
        explain: "Density Filter is more specialised and more efficient than Attribute Filter. Use it when performance matters or when it makes the graph easier to read."
      - q: "What does Self Pruning do?"
        choices: ["Deletes points outside the actor bounds", "Removes intersections between points in the same point data, with a priority such as Large to Small", "Merges all points into one point", "Removes points that have no static mesh"]
        answer_index: 1
        explain: "Self Pruning removes overlapping points within one point data, prioritised by the settings. Randomized pruning can be used for similar radii so patterns do not appear."
      - q: "In a Difference node with Density Function set to Binary, what is the final density of a source point that overlaps a difference shape?"
        choices: ["0", "The source density minus the difference density", "1", "The average of both"]
        answer_index: 0
        explain: "Binary sets the final density to 0 when the difference density is greater than zero. Otherwise it keeps the source density. This gives a hard keep-out edge."
      - q: "With Density Function Minimum on a Difference node, how is final density computed?"
        choices: ["Source density plus max difference density", "Source density minus the sum of all difference densities, clamped", "Always 0 inside the difference", "Source density minus the max density of all the differences"]
        answer_index: 3
        explain: "Minimum gives source density minus the maximum density of all differences. Clamped Subtraction instead subtracts the sum of the difference densities and clamps to 0 to 1."
      - q: "You want bushes near the road to be smaller than bushes far away. Which node gives you that gradient?"
        choices: ["Gather", "Distance, which computes the distance to the nearest point in a second input", "Mutate Seed", "Combine Points"]
        answer_index: 1
        explain: "Distance calculates, for each point, the distance to the nearest point in the second input. The docs give the example of tweaking tree scale on forest edges or near a stream."
      - q: "Which node would you use to remove points on steep slopes?"
        choices: ["Density Remap", "Split Points", "Apply Scale to Bounds", "Normal To Density, which sets density from the point normal like a dot product"]
        answer_index: 3
        explain: "Normal To Density computes density from the point normal against a chosen direction. The docs name removing trees on steep inclines as a typical use."
      - q: "Why place a Bounds Modifier before Self Pruning?"
        choices: ["Changing point bounds changes what counts as an intersection, so it tweaks the final pruning result", "Self Pruning does not work without it", "It converts points to a volume", "It resets the seeds"]
        answer_index: 0
        explain: "Bounds Modifier changes the bounds property on points. The docs say this is useful before Self Pruning, Intersections or Differences to tweak the final result."
      - q: "Select Points is set to a ratio of 0.5 on 200 points. What do you get?"
        choices: ["Exactly 100 points every time", "The first 100 points in order", "Approximately 100 points, with no guarantee of the exact number", "100 points with density 0.5"]
        answer_index: 2
        explain: "Each point is selected independently with the given probability. A ratio of 0.5 gives about half the points, but not exactly half."
    flavors:
      _default: {why: "Procedural scatter is only useful if it respects the spaces the player needs."}
      level_design: {why: "Keep-out volumes let you scatter freely and still keep routes, cover and sightlines clean.", do: "Tag a third volume LowDensity and use a Density Remap there instead of a full cut."}

  - id: LDQ100
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [pcg, landscape, landscape-layers, biomes]
    required_spine: false
    required: false
    title: "Landscape paint layers steer the scatter"
    brief: "A landscape can be painted with layers such as Grass, Rock and Path. PCG, the Procedural Content Generation framework, can read these painted layers and use them to decide where to place things. This means that painting a layer is the fastest way to tell a procedural system where bushes or boulders belong, and where the path must stay empty. In this quest you build a graph that places bushes on Grass, boulders on Rock, and nothing on the Path."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-content-generation-framework-node-reference-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-content-generation-framework-data-types-reference-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-content-generation-overview"
    checklist:
      - "Use a landscape that has at least three painted layers: Grass, Rock and Path. Paint the Path layer along your main route."
      - "Create a PCG graph named PCG_Biome. Add a World Ray Hit Query node and enable Apply Metadata From Landscape, so that the points know which layers are painted under them. Connect it to a Surface Sampler."
      - "Add an Attribute Filter on the attribute of the Grass layer, and keep values above 0.5. Spawn bushes from its Inside pin."
      - "Add a second Attribute Filter on the attribute of the Rock layer. Spawn boulders from its Inside pin."
      - "Add a Normal To Density node before the boulders, so that steep slopes get fewer boulders."
      - "Add a Spatial Noise node. Use its attribute with a Match And Set Attributes node to choose between two bush meshes."
      - "Paint part of the Path layer again in a new place and click Generate again. Confirm that the route stays empty."
    done_when: "Send one screenshot of the graph that shows the World Ray Hit Query and both Attribute Filters. Also send one viewport screenshot where the painted Path stays free while Grass has bushes and Rock has boulders."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Which option makes the World Ray Hit Query node read landscape paint layer values for each hit?"
        choices: ["Ignore PCG Hits", "Return Physical Material", "Get Data On All Grids", "Apply Metadata From Landscape"]
        answer_index: 3
        explain: "Apply Metadata From Landscape gets the landscape layer values when the raycast hits the landscape. The docs note it has a small performance cost."
      - q: "How does the PCG data types reference describe a Landscape?"
        choices: ["A Volume", "A Line", "A Surface, which is 2D data mapped to the XY plane", "An Attribute Set"]
        answer_index: 2
        explain: "Surfaces are 2D spatial data such as Landscapes mapped to the XY plane. The Surface Sampler generates points on a plane and projects them onto a 3D shape."
      - q: "A Landscape Spline is raised above the terrain. Where does PCG treat its line data?"
        choices: ["Projected vertically, always at the landscape surface", "At the raised height", "It is ignored until the spline is applied", "At the PCG Volume origin"]
        answer_index: 0
        explain: "Landscape Spline data is projected vertically and always applies at the surface, even if the spline is offset from the Landscape. It is read with Get Spline Data or the Spline Sampler."
      - q: "What is the difference between Attribute Filter and Attribute Filter Range?"
        choices: ["Range works only on splines", "Range separates data into inside the range and outside the range", "Range is for integers only", "There is no difference"]
        answer_index: 1
        explain: "Attribute Filter Range is the range-based version. Input data is split into what is inside the range and what is outside the range, so both outputs can be used."
      - q: "Why use Spatial Noise instead of a random value per point?"
        choices: ["It is faster", "It builds a spatially-consistent pattern such as Perlin noise, giving natural looking distributions", "It only works with Static Mesh Spawner", "It changes point density to 1"]
        answer_index: 1
        explain: "Spatial Noise writes a spatially-consistent noise pattern to an attribute. Used with Match And Set Attributes and input-driven weights, it gives more natural selections."
      - q: "What does the Steepness value on a PCG point control?"
        choices: ["The slope of the landscape under the point", "The rotation of the spawned mesh", "The order of spawning", "The softness of the volume the point represents, shaping its influence"]
        answer_index: 3
        explain: "Each point has 3D bounds and represents a region of space. Steepness controls the softness of that volume and the shape of its influence."
      - q: "Why is a point's Seed computed from its position?"
        choices: ["So random results are world-position consistent", "So all points share one seed", "So the seed matches the landscape layer", "So the seed can be edited by hand"]
        answer_index: 0
        explain: "The Seed is consumed by random number generators. It is computed from the position so that random behaviour stays consistent for the same world position."
      - q: "What is Get Landscape Data in relation to Get Actor Data?"
        choices: ["A Blueprint node, not a PCG node", "A slower alias with the same output", "A specialisation that returns appropriately typed Landscape data", "A node that only returns heightmap textures"]
        answer_index: 2
        explain: "Get Landscape Data is a specialisation of the Get Actor Data node that returns appropriately typed and constructed Landscape data."
    flavors:
      _default: {why: "Painting a layer is the fastest way to tell a procedural system where things belong."}
      level_design: {why: "Your Path layer becomes a single source of truth for both the look and the scatter.", do: "Add a fourth layer called Cover and spawn low walls only there."}

  - id: LDQ101
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [foliage, procedural-foliage, blocking-volumes, routes]
    required_spine: false
    required: false
    title: "A forest that respects the route"
    brief: "Procedural Foliage is a tool that fills an area with trees by simulating how a forest grows: trees spread seeds, grow for some years, and compete for space and light. It fills a large area very quickly, but it does not know where your players need to walk or see. In this quest you grow a small forest with a Procedural Foliage Spawner and use blocking volumes to keep the route and the combat space free of trees."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-foliage-tool-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open Edit > Editor Preferences, go to the Experimental section, and enable Procedural Foliage."
      - "Create a Procedural Foliage Spawner asset named PFS_Forest. Place it over your terrain and scale it so that it covers the play area."
      - "Create two Static Mesh Foliage assets named FT_Tree_A and FT_Tree_B. Add both to the Foliage Types array of PFS_Forest."
      - "On FT_Tree_A, set Num Steps to 3, Initial Seed Density to 0.25 and Shade Radius to 50. On FT_Tree_B, set Overlap Priority to 1 and enable Spawns in Shade."
      - "For both types, enable Align to Normal and Random Yaw under Placement. Then click Resimulate on the spawner to grow the forest."
      - "Place one Procedural Foliage Blocking Volume over your main route and one over the combat space. Click Resimulate again."
      - "Walk the route in PIE. Note any tree that still blocks a view the player needs, and fix it with the blocking volume."
    done_when: "Send one editor screenshot that shows the spawner with both Foliage Types and the blocking volumes over the route. Also send one PIE screenshot taken from inside the route that shows the clear corridor."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Where do you enable the Procedural Foliage tools?"
        choices: ["Edit > Plugins > Foliage", "Edit > Editor Preferences > Experimental > Procedural Foliage", "Project Settings > Rendering", "Foliage Mode > Settings"]
        answer_index: 1
        explain: "The quick start says to open Editor Preferences, go to the Experimental section and enable Procedural Foliage."
      - q: "You set Num Steps to 0 on a Static Mesh Foliage. What happens?"
        choices: ["All trees are the same size and age", "No trees spawn", "Trees spawn only in shade", "The spawner ignores the blocking volume"]
        answer_index: 0
        explain: "Num Steps is the number of growth steps, described as years. With 0 steps the trees are all the same size and age. Setting it back to 3 grows and spreads the trees for 3 years."
      - q: "Two virtual seeds overlap by their collision or shade radius. Which one survives?"
        choices: ["The one created first", "The one with the larger mesh", "The one whose Foliage Type has the higher priority", "Both survive, they are merged"]
        answer_index: 2
        explain: "When a seed's collision radius overlaps another seed's collision or shade radius, one seed is replaced or killed based on which Foliage Type has the higher priority."
      - q: "After lowering Initial Seed Density to 0.25 the forest became very sparse. Which setting did the guide change to fix it?"
        choices: ["Shade Radius to 0", "Max Age to 1", "Cull Distance to 0", "Num Steps back to 3 so the trees spread over more years"]
        answer_index: 3
        explain: "With Num Steps 0 the trees only grew for one year, so the low seed density looked empty. Setting Num Steps back to 3 lets the trees grow and spread."
      - q: "What does a Procedural Foliage Blocking Volume do?"
        choices: ["Blocks the player from entering the forest", "Prevents the spawner from placing any Foliage Type inside its bounds", "Adds collision to all trees", "Stops the Resimulate button"]
        answer_index: 1
        explain: "The blocking volume is placed and scaled in the level. The spawner will not spawn any Foliage Type Objects inside its bounds. Resimulate to see the change."
      - q: "You changed a Foliage Type setting but nothing changed in the level. What do you need to do?"
        choices: ["Select the spawner and click Resimulate in the Details panel", "Restart the editor", "Rebuild the NavMesh", "Delete and re-add the Foliage Type"]
        answer_index: 0
        explain: "The spawner only updates when you click Resimulate under the Procedural Foliage section of its Details panel."
      - q: "How do you spawn two different tree species from one area?"
        choices: ["Place two spawners on top of each other", "Use two Static Mesh components", "Paint the second species by hand", "Add both Foliage Type assets to the Foliage Types array of one spawner"]
        answer_index: 3
        explain: "One Procedural Foliage Spawner can hold multiple Foliage Type Objects. The guide duplicates Tree_00 into Tree_01 and adds it to the same spawner."
      - q: "Which two Placement options does the guide enable so trees sit naturally on slopes and do not all face the same way?"
        choices: ["Scale to Width and Cast Shadow", "Can Grow in Shade and Spawns in Shade", "Align to Normal and Random Yaw", "Center H and Offset"]
        answer_index: 2
        explain: "In the Placement section the guide enables Align to Normal and Random Yaw. Placement controls how a Foliage Type's meshes are placed on objects in the level."
    flavors:
      _default: {why: "A simulated forest is fast to fill, but you must control where it may not grow."}
      level_design: {why: "Blocking volumes give you gameplay space inside a big procedural forest without hand editing.", do: "Use a blocking volume shaped as a sightline corridor toward your landmark."}

  - id: LDQ102
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [geometry-script, blockout, dynamic-mesh, parametric-tools]
    required_spine: false
    required: false
    title: "Parametric blockout tools, Lyra style"
    brief: "A parametric block is a blockout piece whose shape is built from numbers, such as width, length and height. When you want a different size, you change a number and the mesh is rebuilt, so you do not have to model it again. Epic's sample game Lyra uses tools like this for its blockouts. In this quest you build a ramp tool with the Geometry Script plugin and then bake its result into a normal Static Mesh."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/lyra-geometry-tools-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/geometry-scripting-users-guide-in-unreal-engine"
    checklist:
      - "Enable the Geometry Script plugin and restart the editor."
      - "Create a Blueprint named BP_Tool_Ramp with GeneratedDynamicMeshActor as its parent class. Add the Instance Editable variables Width, Length, Height and Steps."
      - "In the event Event On Rebuild Generated Mesh, append boxes that use the variables, so that the actor builds a ramp or a stair block. If you need a temporary mesh, use Request and Release Mesh for it."
      - "Place three BP_Tool_Ramp actors in the level. Change their variables in the Details panel so that they fit your metrics gym, the test level where you check sizes and distances."
      - "Add an event named Bake with Call In Editor turned on. It copies the dynamic mesh to a new Static Mesh asset. Search the Geometry Script library for the function that copies a mesh to a static mesh."
      - "Replace one ramp with a Static Mesh Actor that uses the baked asset. Move the tool actor below the level and keep it there as the template."
    done_when: "Send one screenshot of the BP_Tool_Ramp graph with On Rebuild Generated Mesh. Also send one viewport screenshot with three ramps of different sizes and the baked Static Mesh asset visible in the Content Browser."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Why does Lyra bake its parametric Tool actors to Static Mesh assets before shipping a level?"
        choices: ["Dynamic Mesh Components cannot be saved", "Blueprints cannot be placed in levels", "The Dynamic Mesh Component does not support Lumen, Nanite or instancing", "Static Meshes are easier to rename"]
        answer_index: 2
        explain: "The Dynamic Mesh Component gives rapid parametric design but does not support UE rendering features like Lumen or Nanite, and does not support instancing. Baking to a Static Mesh gives all of that back."
      - q: "You duplicate a Tool actor and later change the original's parameters. What happens to the duplicate?"
        choices: ["Nothing, the duplicate is a completely separate mesh", "It updates too", "It is deleted", "It becomes a Static Mesh"]
        answer_index: 0
        explain: "Dynamic Mesh Actors do not support instancing. A duplicate is a separate mesh and changing the original does not affect it. That is why Lyra bakes and places instances of the baked asset."
      - q: "What is the difference between Generate New Static Mesh and Bake to Static Mesh on a Lyra Tool?"
        choices: ["They are the same button", "Generate works in PIE, Bake works in the editor", "Bake creates a new asset each time", "Generate creates a new asset and records it as the Target Static Mesh; Bake updates that existing target asset"]
        answer_index: 3
        explain: "Generate New Static Mesh creates a new StaticMesh asset at the configured path and stores it in Target Static Mesh. Bake to Static Mesh then updates that asset at any time."
      - q: "Why does Lyra keep Tool actors below the playable level instead of deleting them?"
        choices: ["They are needed for collision", "The Tool is the template for the baked asset; if it is deleted the settings are lost", "They cast the shadows", "The engine requires it"]
        answer_index: 1
        explain: "The Tool actor must exist as a template for the Static Mesh asset. Deleting it loses the settings, so Lyra places the tools out of the way below the level."
      - q: "Where does the Event On Rebuild Generated Mesh exist?"
        choices: ["In every Actor Blueprint", "Only in Blueprints derived from GeneratedDynamicMeshActor, and it is editor-only", "In the Level Blueprint", "In Editor Utility Widgets only"]
        answer_index: 1
        explain: "On Rebuild Generated Mesh is offered by AGeneratedDynamicMeshActor for procedural mesh actors. It only exists in Blueprints derived from that class and is currently editor-only."
      - q: "Most Geometry Script nodes take a Target Mesh and also return a Target Mesh. Why?"
        choices: ["The output is a new copy of the mesh", "The return is only used for debugging", "It returns the static mesh asset", "The operation edits the input mesh in place and returns the same object so you can chain operations"]
        answer_index: 3
        explain: "Geometry Scripting operations modify the input mesh rather than creating temporary meshes. The same UDynamicMesh is returned so you can chain nodes in sequence."
      - q: "How is a UDynamicMesh stored compared to a UStaticMesh?"
        choices: ["A UDynamicMesh is not an asset; it lives in the level and each component owns its own mesh", "Both are assets in the Content Browser", "A UDynamicMesh is stored in a text file", "A UDynamicMesh is shared between components"]
        answer_index: 0
        explain: "Unlike UStaticMesh, UDynamicMesh is not an asset. A UDynamicMeshComponent owns its mesh, it is stored in the level, and duplicating the component copies the mesh."
      - q: "How did Lyra build the Swap to Static Mesh and Swap to Generated Mesh right-click actions?"
        choices: ["With C++ editor modules", "With Python scripts", "With Actor Action Utility Blueprints, linked by a Source Generator Key", "With Level Blueprint events"]
        answer_index: 2
        explain: "The swapping system is built entirely in Blueprints using Actor Action Utility Blueprints (Scripted Actions). A Source Generator Key string links a Tool to its baked Static Mesh actors."
    flavors:
      _default: {why: "A parametric block lets you change size with a number instead of rebuilding the mesh."}
      level_design: {why: "Metrics-driven blocks such as ramps and stairs can be tuned live while you test.", do: "Add a Step Height variable and check it against your metrics sheet."}

