    backup_url: null
    checklist:
      - "Edit > Editor Preferences > Experimental: enable Procedural Foliage."
      - "Create a Procedural Foliage Spawner named PFS_Forest. Place it over your terrain and scale it to cover the play area."
      - "Create two Static Mesh Foliage assets, FT_Tree_A and FT_Tree_B, and add both to the Foliage Types array of PFS_Forest."
      - "On FT_Tree_A set Num Steps 3, Initial Seed Density 0.25 and Shade Radius 50. On FT_Tree_B set Overlap Priority 1 and enable Spawns in Shade."
      - "Enable Align to Normal and Random Yaw under Placement for both types. Click Resimulate on the spawner."
      - "Place a Procedural Foliage Blocking Volume over your main route and one over the combat space. Resimulate again."
      - "Walk the route in PIE. Note any tree that still blocks a sightline and fix it with the blocking volume."
    done_when: "One editor screenshot showing the spawner with both Foliage Types and the blocking volumes over the route, and one PIE screenshot from inside the route showing the clear corridor."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Where do you enable the Procedural Foliage tools?"
        choices: ["Edit > Plugins > Foliage", "Edit > Editor Preferences > Experimental > Procedural Foliage", "Project Settings > Rendering", "Foliage Mode > Settings"]
        answer_index: 1
        explain: "The quick start says to open Editor Preferences, go to the Experimental section and enable Procedural Foliage."
      - q: "You set Num Steps to 0 on a Static Mesh Foliage. What happens?"
        choices: ["All trees are the same size and age", "No trees spawn", "Trees spawn only in shade", "The spawner ignores the blocking volume"]
        answer_index: 0
        explain: "Num Steps is the number of growth steps, described as years. With 0 steps the trees are all the same size and age. Setting it back to 3 grows and spreads the trees for 3 years."
      - q: "Two virtual seeds overlap by their collision or shade radius. Which one survives?"
        choices: ["The one created first", "The one with the larger mesh", "The one whose Foliage Type has the higher priority", "Both survive, they are merged"]
        answer_index: 2
        explain: "When a seed's collision radius overlaps another seed's collision or shade radius, one seed is replaced or killed based on which Foliage Type has the higher priority."
      - q: "After lowering Initial Seed Density to 0.25 the forest became very sparse. Which setting did the guide change to fix it?"
        choices: ["Shade Radius to 0", "Max Age to 1", "Cull Distance to 0", "Num Steps back to 3 so the trees spread over more years"]
        answer_index: 3
        explain: "With Num Steps 0 the trees only grew for one year, so the low seed density looked empty. Setting Num Steps back to 3 lets the trees grow and spread."
      - q: "What does a Procedural Foliage Blocking Volume do?"
        choices: ["Blocks the player from entering the forest", "Prevents the spawner from placing any Foliage Type inside its bounds", "Adds collision to all trees", "Stops the Resimulate button"]
