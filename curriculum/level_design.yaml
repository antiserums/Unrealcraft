# Unrealcraft — level_design major, all ranks. IDs LDQ1…
# Difficulty tiers: novice (rank 0) · apprentice (1) · adept (2) · expert (3) · master (4).
# Every URL was checked against the live UE 5.8 docs when written.

quests:
  - id: LDQ41
    rank: 1
    difficulty: apprentice
    track: level-design
    subjects: [snapping, grid, viewport, blockout]
    required_for_majors: []
    taster_for_majors: []
    adjacent_for: [gameplay_design, lookdev]
    required_spine: false
    elective: true
    title: Snap every block to the grid
    time_min: 35
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-snapping-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/viewport-controls-in-unreal-engine"
    community_urls: []
    checklist:
      - "Open a blockout level. In the Level Viewport toolbar, turn on the Drag Grid and set it to 100 units."
      - "Place 6 cube meshes (SM_Cube or Modeling Mode Box) to make a room. Move them only with the grid on. No gaps."
      - "Set the Rotation Grid to 90 degrees. Rotate one wall piece and check it lands exactly."
      - "Select a prop, press End. Watch it drop to the floor (surface snapping)."
      - "Turn on Surface Snapping with Rotate to Surface Normal. Drag a prop onto a sloped block and see it tilt."
      - "Hold V and move one cube so its corner vertex snaps to a vertex of another cube."
      - "Open Edit > Editor Preferences > Viewports > Snap. Turn on Use Power of Two Snap Size and look at the new grid sizes."
    done_when: "One screenshot of your room with the viewport toolbar visible (Drag Grid and Rotation Grid highlighted), plus a second screenshot of the vertex-snapped cube corner."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Which three kinds of snapping does the page list?"
        choices: ["Grid, spline, and camera snapping", "Vertex, edge, and face snapping", "Surface, landscape, and light snapping", "Surface, grid, and vertex snapping"]
        answer_index: 3
        explain: "The page names surface snapping, grid snapping, and vertex snapping. Each one aligns an Actor in a different way."
      - q: "You select an Actor and press the End key. What happens?"
        choices: ["The Actor is deleted", "The Actor snaps to the nearest surface, for example the floor", "The Actor rotates 90 degrees", "The Actor resets its scale"]
        answer_index: 1
        explain: "End snaps the selected Actor to the nearest surface below it. This is a fast way to put props on the floor."
      - q: "Which key do you hold to snap an object to a vertex of another mesh?"
        choices: ["Shift", "Ctrl", "V", "Alt"]
        answer_index: 2
        explain: "Hold V while using the translation gizmo. The vertices you can snap to appear as soon as you move the object."
      - q: "Where do you change the Drag Grid, Rotation Grid, and Scale Grid settings?"
        choices: ["Project Settings > Rendering", "Edit > Editor Preferences > Viewports, in the Snap category", "Window > Layers", "World Settings > Grid"]
        answer_index: 1
        explain: "The page says to open Edit > Editor Preferences > Viewports and scroll down to the Snap category."
      - q: "What does the option Use Power of Two Snap Size change?"
        choices: ["It doubles the size of every Actor", "It limits rotation to 2 degrees", "It uses grid sizes like 1, 2, 4, 8, 16 instead of decimal sizes", "It turns off scale snapping"]
        answer_index: 2
        explain: "With this option the grid uses power-of-two sizes (1, 2, 4, 8, 16...) instead of decimal grid sizes."
      - q: "With Surface Snapping on, what does Rotate to Surface Normal do?"
        choices: ["The Actor rotates to match the surface it snaps to", "The Actor keeps its rotation but moves up", "The Actor rotates to face the camera", "The Actor rotates 180 degrees"]
        answer_index: 0
        explain: "Rotate to Surface Normal makes the Actor rotate to match the alignment of the surface it snaps to."
    flavors:
      _default: {why: "A blockout that sits on the grid is fast to edit and easy to measure."}
      level_design: {why: "Grid discipline is what keeps your metrics (door width, step height) true across the whole level.", do: "Set the Drag Grid to your metric unit (for example 50 or 100) and build one corridor with zero off-grid pieces."}
      gameplay_design: {why: "Snapped blocks make cover and jump distances repeatable, so tests give clean answers.", do: "Place two cover blocks exactly 400 units apart using the grid and note the distance in your writeup."}

  - id: LDQ42
    rank: 1
    difficulty: apprentice
    track: level-design
    subjects: [modeling-mode, cubegrid, blockout]
    required_for_majors: []
    taster_for_majors: []
    adjacent_for: [gameplay_design, lookdev]
    required_spine: false
    elective: true
    title: CubeGrid blockout room
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cubegrid-tool-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/modeling-mode-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/working-with-meshes-in-unreal-engine"
    community_urls: []
    checklist:
      - "Switch to Modeling Mode (Shift+5). If it is missing, enable the Modeling Tools Editor Mode plugin."
      - "In the Create category, open CubeGrid. Click and drag to select a grid of cells for a floor."
      - "Press E to pull the floor up one cell. Use Ctrl+Drag to pull walls up around the edge."
      - "Press Ctrl+E to make the grid bigger and add one large platform. Press Ctrl+Q to make it smaller again for a set of steps."
      - "Press Z to enter Corner Mode. Pull only two corners of a cell to make a ramp. Press Z again to apply."
      - "Press R to show the grid gizmo and move it to a new position. Build a small second room there."
      - "Set Output Type to Static Mesh, press Accept, and name the asset SM_Blockout_Room."
    done_when: "Screenshot of the finished CubeGrid room in the viewport, with the Tool Properties panel showing Output Type: Static Mesh, and the asset SM_Blockout_Room visible in the Content Browser."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "In which Modeling Mode category do you find CubeGrid?"
        choices: ["Model", "Create", "Xform", "Misc"]
        answer_index: 1
        explain: "CubeGrid is in the Create category, together with the primitive shapes and other tools that build new meshes."
      - q: "Which hotkey pulls geometry out from the selected grid?"
        choices: ["Q", "Z", "E", "R"]
        answer_index: 2
        explain: "E pulls geometry from the selected grid. Q pushes it in. You can also use Ctrl+Drag for both."
      - q: "What does Ctrl+E do in CubeGrid?"
        choices: ["Increases the grid size", "Exits the tool", "Extrudes all cells", "Enters Corner Mode"]
        answer_index: 0
        explain: "Ctrl+E increases the grid size and Ctrl+Q decreases it. Bigger cells are good for large shapes, small cells for detail."
      - q: "You want to pull only some corners of a selected cell to make a slope. What do you press?"
        choices: ["Shift+E", "Z, to enter Corner Mode", "Ctrl+Middle-Click", "Shift+Q"]
        answer_index: 1
        explain: "Z enters Corner Mode. You select corners, push or pull them, then press Z again to apply the change."
      - q: "What does Ctrl+Middle-Click do?"
        choices: ["Deletes the nearest cell", "Duplicates the mesh", "Moves the grid gizmo to the corner of the nearest cell", "Changes the output type"]
        answer_index: 2
        explain: "Ctrl+Middle-Click moves the grid gizmo to the corner of the nearest cell. The R key toggles the gizmo itself."
      - q: "Which Output Types can CubeGrid produce?"
        choices: ["Static mesh, skeletal mesh, landscape", "Brush, volume, foliage", "Static mesh only", "Static mesh, dynamic mesh, volume"]
        answer_index: 3
        explain: "When you finish, you can output a Static Mesh, a Dynamic Mesh, or a Volume."
    flavors:
      _default: {why: "CubeGrid lets you block a room in minutes without leaving the editor."}
      level_design: {why: "Push and pull on a grid is the fastest way to test a space before any art exists.", do: "Build the room to your metrics: doors 2 cells wide, steps 1 cell high. Write the cell size you used."}
      lookdev: {why: "A CubeGrid blockout gives you clean, gridded surfaces to test materials and light on.", do: "Apply one grey checker material to the finished mesh to check texel scale."}

  - id: LDQ43
    rank: 1
    difficulty: apprentice
    track: level-design
    subjects: [modeling-mode, polygroups, blockout]
    required_for_majors: []
    taster_for_majors: []
    adjacent_for: [lookdev, gameplay_design]
    required_spine: false
    elective: true
    title: Shape a block with PolyGroup Edit
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/polygroup-edit-tool-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/polygroup-edit-tool-reference-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/understanding-polygroups-in-unreal-engine"
    community_urls: []
    checklist:
      - "In Modeling Mode, use Create > Box to place a box. Set Output Type to Static Mesh and Accept."
      - "Open the Model category and click PolyGroup Edit. Click the box to start editing."
      - "In the Selection Filter, choose faces. Select the top face and run Extrude with Distance Mode set to Fixed, Distance 200."
      - "Select one side face and run Inset, then Extrude it inward to make a doorway."
      - "Switch the Selection Filter to edges. Select the top edges and run Bevel."
      - "Use Shift+Click to add faces to a selection and Ctrl+Click to remove one. Then run Push Pull on the group."
      - "Press Enter to accept. Save the mesh as SM_Blockout_Pillar."
    done_when: "Screenshot of SM_Blockout_Pillar in the viewport with the doorway and the beveled top visible, and the PolyGroup Edit Tool Properties panel open."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "PolyGroup Edit is not available for a mesh when..."
        choices: ["The mesh has more than one material", "The mesh has no PolyGroup information", "The mesh is a Static Mesh", "The mesh was made with CubeGrid"]
        answer_index: 1
        explain: "The tool needs PolyGroups. A mesh with no PolyGroup information cannot be edited with it; generate PolyGroups first."
      - q: "Where are PolyGroups created automatically?"
        choices: ["On predefined shapes from the Create category", "On every imported mesh", "Only on Nanite meshes", "Only on Landscape"]
        answer_index: 0
        explain: "Predefined shapes in the Create category get PolyGroups automatically. Other meshes need Paint PolyGroups, Generate PolyGroups, or Tri Select."
      - q: "What are the three categories of PolyGroup Edit operations?"
        choices: ["Vertex, Edge, and Normal Edits", "Face, Shape, and Edge Edits", "Cut, Merge, and Weld Edits", "UV, Material, and LOD Edits"]
        answer_index: 1
        explain: "The page groups operations into Face Edits, Shape Edits (the mesh as a whole), and Edge Edits."
      - q: "You want to add faces to your current selection. What do you do?"
        choices: ["Alt+Click", "Ctrl+Click", "Shift+Click", "Double-click"]
        answer_index: 2
        explain: "Shift+Click adds to the current selection. Ctrl+Click removes from it."
      - q: "Marquee selection is selecting faces you cannot see. Which setting fixes this?"
        choices: ["Turn on Show Wireframe", "Uncheck Marquee Ignore Occlusion", "Set Distance Mode to Fixed", "Lock the gizmo rotation"]
        answer_index: 1
        explain: "By default the marquee toggles all elements in the area, even hidden ones. Unchecking Marquee Ignore Occlusion stops that."
      - q: "In Extrude, what does Distance Mode = Fixed do?"
        choices: ["Extrudes along the world Z axis only", "Locks the mesh so it cannot be edited", "Extrudes until it hits another mesh", "Sets the extrusion height from a numerical Distance input"]
        answer_index: 3
        explain: "Fixed uses a number you type in (Distance). Click in Viewport instead uses mouse movement and a click to set the height."
    flavors:
      _default: {why: "Box modeling inside Unreal means you can fix a blockout shape without going to another program."}
      level_design: {why: "Doorways, ledges, and ramps are quick face edits when you know Extrude, Inset, and Bevel.", do: "Add one ledge with a Fixed extrude equal to your crouch height metric."}
      lookdev: {why: "Bevels on blockout edges catch light and show how a final asset may read.", do: "Compare a beveled and a sharp-edged pillar under one light and note the difference."}

  - id: LDQ44
    rank: 1
    difficulty: apprentice
    track: level-design
    subjects: [modeling-mode, splines, blockout, duplication]
    required_for_majors: []
    taster_for_majors: []
    adjacent_for: [cinematics, lookdev]
    required_spine: false
    elective: true
    title: Blocks along a path
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/draw-spline-tool-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/modeling-tools-in-unreal-engine"
    community_urls: []
    checklist:
      - "In Modeling Mode, open Create > Draw Spline. Set Output Mode to Empty Actor."
      - "Set Draw Mode to Tangent Drag. Under Raycast Targets, keep only Ground Planes on. Draw a curved path with 5 points. Click without dragging at one point to make a sharp corner."
      - "Press Enter to accept. Rename the actor in the Outliner to SplinePath_Main."
      - "Draw a second spline with Draw Mode Free Draw and turn Loop on. Accept it and name it SplinePath_Loop."
      - "Place one blockout cube next to the path. Open the Xform category, select the cube, and run the Pattern tool. Choose Line and tile 8 copies along the path direction."
      - "Run Pattern again on a cube with Circle to make a ring of pillars around the loop. Accept."
    done_when: "Screenshot of the viewport showing SplinePath_Main (with its sharp corner), SplinePath_Loop, the line of 8 cubes, and the ring of pillars; Outliner visible with the two spline actor names."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Which Output Mode of Draw Spline creates a new actor that only holds a spline component?"
        choices: ["Existing Actor", "Create Blueprint", "Empty Actor", "Mesh Spline"]
        answer_index: 2
        explain: "Empty Actor creates an empty actor with a spline component. Existing Actor attaches to an actor you pick, Create Blueprint spawns a chosen Blueprint."
      - q: "In Tangent Drag mode, what happens if you click without dragging?"
        choices: ["The spline is deleted", "A sharp corner is created at that point", "The tool exits", "The point gets an automatic smooth tangent"]
        answer_index: 1
        explain: "In Tangent Drag you drag to set the tangent. Clicking without dragging creates a sharp corner."
      - q: "Which Draw Mode places many points with a freehand motion, spaced by Min Point Spacing?"
        choices: ["Free Draw", "Click Auto Tangent", "Tangent Drag", "Loop"]
        answer_index: 0
        explain: "Free Draw places multiple points as you click and drag. Min Point Spacing controls the distance between them."
      - q: "How many Raycast Targets must be enabled to draw a spline?"
        choices: ["None, they are optional", "All three", "Exactly two", "At least one"]
        answer_index: 3
        explain: "The page says you must have at least one Raycast Target (World, Custom Plane, or Ground Planes) enabled to draw."
      - q: "The Pattern tool (Xform category) tiles selected meshes along which shapes?"
        choices: ["Spline, Arc, or Spiral", "Line, Grid, or Circle", "Row, Column, or Stack", "Path, Wall, or Ramp"]
        answer_index: 1
        explain: "The Modeling Tools page describes Pattern as tiling one or more selected meshes along a Line, Grid, or Circle on a movable 3D plane."
      - q: "Your Blueprint actor has a slow construction script and dragging spline points lags. What does the page suggest?"
        choices: ["Turn off Rerun Construction Script on Drag in advanced options", "Use Free Draw only", "Switch to a Static Mesh output", "Disable all Raycast Targets"]
        answer_index: 0
        explain: "For an expensive construction script, turn off Rerun Construction Script on Drag under advanced options so the script does not run on every drag."
    flavors:
      _default: {why: "Paths and repeated blocks are the fastest way to lay out corridors, fences, and colonnades."}
      level_design: {why: "A spline shows the route your player takes; tiled blocks fill it without hand-placing each piece.", do: "Match the spline to your beat chart: one point per beat, and a pillar row at the big reveal."}
      cinematics: {why: "The same spline tool can hold a camera path later, so learning it now pays twice.", do: "Draw one spline with Loop off that a camera could follow through the corridor."}

  - id: LDQ45
    rank: 1
    difficulty: apprentice
    track: level-design
    subjects: [level-instances, packed-level-actors, world-partition, organization]
    required_for_majors: []
    taster_for_majors: []
    adjacent_for: [lookdev, gameplay_design]
    required_spine: false
    elective: true
    title: Level Instance or Packed Level Actor?
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-instancing-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/one-file-per-actor-in-unreal-engine"
    community_urls: []
    checklist:
      - "Build a small guard post from 5 to 8 blockout meshes plus one PlayerStart or trigger (anything that is not a Static Mesh)."
      - "Select all of it, right-click > Level > Create Level Instance. Set Pivot Type to Center Min Z. Save it as LI_GuardPost."
      - "Copy LI_GuardPost three times across the map. Edit one (right-click > Level > Edit), move a wall, then click Commit Changes in the Details panel. Check all copies changed."
      - "Build a second kit of only Static Meshes (a bridge). Select it, right-click > Level > Create Packed Level Actor. Save as PLA_Bridge."
      - "Place PLA_Bridge three times. Open its Blueprint from the Outliner Edit button and look at what it contains."
      - "Write 3 lines: which one you would use for a repeated building, which for a gameplay setup, and why."
    done_when: "Screenshot of the Outliner showing three LI_GuardPost and three PLA_Bridge actors, plus your 3-line writeup."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which type is recommended for static buildings and dense visual setups?"
        choices: ["Level Instance", "Packed Level Blueprint (Packed Level Actor)", "Level Streaming Volume", "Data Layer"]
        answer_index: 1
        explain: "Packed Level Blueprints combine Static Mesh assets into one Blueprint Actor that is optimized for rendering. The page recommends them for static buildings."
      - q: "How do you make a Level Instance from selected Actors?"
        choices: ["Drag them into the Content Browser", "Press Ctrl+G", "Window > Levels > New", "Right-click one, then Level > Create Level Instance"]
        answer_index: 3
        explain: "Select the Actors, right-click one, go to the Level option, and choose Create Level Instance."
      - q: "After editing a Level Instance in context, how do you save the change to all copies?"
        choices: ["Press Esc twice", "Save the map only", "Select the Level Instance Actor and click Commit Changes in the Details panel", "Right-click > Break"]
        answer_index: 2
        explain: "Commit Changes saves the edit and it propagates to every copy. Pressing Esc twice leaves editing without committing."
      - q: "What does Breaking a Level Instance do?"
        choices: ["Deletes the Level Instance asset from the Content Browser", "Replaces the Level Instance Actor with the original Actors; it cannot be undone", "Hides the Level Instance", "Converts it to a Packed Level Actor"]
        answer_index: 1
        explain: "Break puts the original Actors back in the world and removes the instance actor. The asset stays in the Content Browser, but the operation cannot be undone."
      - q: "Which Pivot Type puts the pivot at the center of the instance at its lowest Z?"
        choices: ["Center Min Z", "Center", "Pivot Actor", "World Origin"]
        answer_index: 0
        explain: "Center Min Z places the pivot at the center and at the lowest Z value. That is useful for placing on floors."
      - q: "In a World Partition world, what is the default runtime mode for Level Instances that use One File Per Actor?"
        choices: ["Level Streaming Mode", "Embedded Mode", "Always Loaded", "Data Layer Mode"]
        answer_index: 1
        explain: "Embedded Mode is the default: OFPA instances are discarded at runtime and their Actors are added to the World Partition grid."
    flavors:
      _default: {why: "Repeating a setup as an instance means one edit fixes every copy."}
      level_design: {why: "Guard posts, checkpoints, and bridges repeat across a map; instances keep them in sync.", do: "Put one gameplay Actor (trigger or spawn) in the Level Instance and confirm it still works in a copy."}
      lookdev: {why: "Packed Level Actors are how big asset kits are rendered cheaply in City Sample style scenes.", do: "Count the Static Meshes in PLA_Bridge and note that they became one Blueprint Actor."}

  - id: LDQ46
    rank: 1
    difficulty: apprentice
    track: level-design
    subjects: [layers, organization, editor]
    required_for_majors: []
    taster_for_majors: []
    adjacent_for: [lookdev, cinematics]
    required_spine: false
    elective: true
    title: Layers that hide the clutter
    time_min: 30
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/layers-panel-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-editor-in-unreal-engine"
    community_urls: []
    checklist:
      - "Open Window > Layers on a blockout level with at least two floors."
      - "Select all blocks of floor 1. Right-click in the Layers panel and choose Add Selected Actors to New Layer. Rename it Floor_1."
      - "Do the same for floor 2 (Floor_2). Then make an empty layer named Doors and drag every door block from the Outliner onto it."
      - "Click the eye icon on Floor_2 to hide it. Take a screenshot of the clean top view of Floor_1."
      - "Double-click the Doors layer to select all doors. Then right-click Floor_1 and choose Append Actors to Selection."
      - "Press See Contents on Floor_1 and use the type buttons to select only the StaticMeshActors."
    done_when: "Two screenshots: the Layers panel with Floor_1, Floor_2 (hidden) and Doors listed, and the layer contents view of Floor_1 showing the Actor type buttons."
    xp: 50
    verify_type: screenshot
    quiz:
      - q: "How many layers can one Actor belong to?"
        choices: ["Exactly one", "One or two", "As many as you want", "None, layers hold levels not Actors"]
        answer_index: 2
        explain: "An Actor can be in as many layers as you want. The page gives the example of a zone layer plus a doors layer."
      - q: "Which menu option makes a new layer from the Actors you selected?"
        choices: ["Create Empty Layer", "Add Selected Actors to New Layer", "Select Actors", "Deselect Actors"]
        answer_index: 1
        explain: "Add Selected Actors to New Layer creates a layer and fills it with the current selection. Create Empty Layer makes an empty one."
      - q: "What is the default name pattern for a new layer?"
        choices: ["Layer[number]", "NewLayer", "Untitled", "The name of the first Actor"]
        answer_index: 0
        explain: "New layers are named Layer[number] with the number going up. The page says to always rename them with descriptive names."
      - q: "How do you select all Actors in a layer, replacing the current selection?"
        choices: ["Click the eye icon", "Drag the layer into the viewport", "Press Ctrl+A in the Layers panel", "Double-click the layer"]
        answer_index: 3
        explain: "Double-click the layer, or right-click it and choose Select Actors. Both replace the current selection."
      - q: "You already have some Actors selected. Which option adds a layer's Actors without losing them?"
        choices: ["Select Actors", "Append Actors to Selection", "Remove Selected Actors from Layers", "See Contents"]
        answer_index: 1
        explain: "Append Actors to Selection keeps your current selection and adds the layer's Actors to it."
      - q: "In the Details panel, the Layers category shows which layers?"
        choices: ["All layers in the level", "Only the layers common to all selected Actors", "Only hidden layers", "Only layers with Static Meshes"]
        answer_index: 1
        explain: "The Details Layers section only displays the layers that all selected Actors share."
    flavors:
      _default: {why: "Hiding what you are not working on makes big levels manageable."}
      level_design: {why: "A layer per floor or per zone gives a clean top-down view for route checks.", do: "Make a Metrics layer that holds only your reference blocks (door, step, jump) and toggle it during review."}
      lookdev: {why: "Layers let you hide props and see only structure when you judge light and composition.", do: "Make a Props layer and hide it to check the silhouette of the architecture alone."}

  - id: LDQ47
