    specializations: [level_design]
    subjects: [landscape, sculpting, terrain]
    required_spine: false
    required: false
    title: "Flatten, Ramp and Erosion"
    brief: "A Landscape is the terrain of an outdoor level, and you shape it with brushes in Landscape mode. The basic Sculpt brush only raises and lowers the ground, but Unreal also has special tools that make flat areas, ramps and natural-looking worn slopes. Hills and ramps made with the right tool look better and are easier to walk on. In this quest you try the Flatten, Ramp, Erosion and Hydro tools on one hill."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/landscape-sculpt-mode-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/landscape-flatten-tool-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/landscape-ramp-tool-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/landscape-erosion-tool-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/landscape-hydroerosion-tool-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a level that has a Landscape, or create a small one: make a new level, enter Landscape mode and choose New on the Manage tab. Enter Landscape mode and select the Sculpt tab."
      - "With the Sculpt tool, click and drag to raise a hill. Then hold Shift and drag to lower a valley next to it."
      - "Select the Flatten tool. Set Flatten Mode to Raise and make a flat plateau on the side of the hill. Notice that the parts that are higher than the plateau do not change."
      - "Select the Ramp tool. Click two points, one on the plateau and one down in the valley. Set Ramp Width and Side Falloff, then click Add Ramp."
      - "Select the Erosion tool, which wears the terrain down the way weather does. Lower the Threshold and paint the steep side of the hill. Watch how the steep side erodes faster."
      - "Select the Hydro tool, which simulates rain. Raise Rain Amount and paint a few strokes on the hill to add water channels."
      - "Start Play In Editor and walk up the ramp to check that a character can climb it."
    done_when: "Send two screenshots of the same hill, one before and one after. The after screenshot must show the flat plateau, the ramp and the eroded slope. Add one line that says which tool surprised you most."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "In Sculpt mode, what does Left Mouse Button + Shift do?"
        choices: ["Smooths the terrain under the brush", "Lowers the terrain (subtractive stroke)", "Undoes the last stroke on the terrain", "Selects a region of components"]
        answer_index: 1
        explain: "A normal stroke raises the terrain. Holding Shift makes the stroke subtractive, so it lowers the heightmap."
      - q: "You set the Flatten tool to Flatten Mode: Raise and click a point on a slope. What happens to terrain that is higher than the clicked point?"
        choices: ["It is left unchanged", "It is lowered to the clicked height", "It is smoothed", "It is deleted"]
        answer_index: 0
        explain: "In Raise mode, only values lower than the clicked height are raised. Values above the clicked point are left unchanged."
      - q: "In the Ramp tool, what does a Side Falloff of 0 mean?"
        choices: ["The ramp is all falloff, with no flat surface", "The ramp is invisible until you raise it", "No falloff: the sides are hard edges", "The ramp is twice as wide as you drew it"]
        answer_index: 2
        explain: "The page says 0 means no falloff and 1 means all falloff with no flat surface. A soft edge needs a value between them."
      - q: "The Erosion tool has a Threshold setting. What does a smaller Threshold value do?"
        choices: ["Less erosion is applied", "More erosion is applied", "The brush gets smaller", "The noise is turned off"]
        answer_index: 1
        explain: "Threshold is the minimum height difference needed for erosion. Smaller values mean more places qualify, so more erosion is applied."
      - q: "Why did the steep back side of the mountain erode faster than the gentle front side in the Erosion tool example?"
        choices: ["The brush was bigger on the back side than on the front side, by default", "The Erosion tool only works on slopes that face north in the level", "The larger the difference in elevation, the more erosion occurs", "The back side had a different material layer on it"]
        answer_index: 2
        explain: "Thermal erosion moves soil from high to low. The bigger the height difference, the more erosion happens, so steep slopes erode more."
      - q: "How is the Hydro Erosion tool different from the Erosion tool?"
        choices: ["It simulates erosion by water, using rain and sediment settings", "It only raises the terrain and never lowers any part of it", "It works on the weightmap of a paint layer, not on the heightmap", "It needs the Landmass plugin and a Water Body in the level"]
        answer_index: 0
        explain: "Hydro Erosion is a hydraulic simulation. Rain Amount and Sediment Capacity control how much water erodes the heightmap."
    flavors:
      _default: {why: "Hills and ramps made with the right tool read better and play better than ones made only with the Sculpt brush."}
      level_design: {why: "Flatten and Ramp give you playable plateaus and slopes with exact widths. Erosion makes the blockout terrain look natural for free.", do: "Measure the ramp with your character. Note the Ramp Width you used and if the player can climb it."}
      lookdev: {why: "Erosion and Hydro strokes add believable detail to a terrain before any material is painted."}
      cinematics: {why: "A flattened plateau is a stable place for a camera or a set piece."}

  - id: LDQ50
    rank: 1
    difficulty: apprentice
    specializations: [level_design]
    subjects: [landscape, paint-layers, edit-layers]
    required_spine: false
    required: false
    title: "Paint the ground: layers and weights"
    brief: "A Landscape can show different ground surfaces, such as grass and dirt, and you choose where each one appears by painting it. Each surface is called a layer, and the amount of a layer at each spot is called its weight. A painted dirt path is one of the strongest ways to show players where to walk in an outdoor level. In this quest you paint a path, and you also put a second path on a separate edit layer that you can hide and show."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/landscape-paint-mode-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/landscape-edit-layers-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/landscape-materials-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. You need a Landscape that has a Landscape Material with at least two layers, for example Grass and Dirt. If you have none, make a simple one: create a material, add a Landscape Layer Blend node with two layers named Grass and Dirt, connect a green color to the first and a brown color to the second, and connect the node to Base Color. Then create a Landscape in a new level and assign the material to it."
      - "Enter Landscape mode and open the Paint tab. In Target Layers, click the Plus icon next to each layer and create a Weight-Blended layer info object. This is a small asset that stores where the layer is painted."
      - "Select the Dirt layer and paint a path across the grass. Watch the grass go away in the places where you paint."
      - "Hold Ctrl+Shift and paint on the path. Notice that you cannot fully remove the dirt this way."
      - "Open the Layers section and add a new Edit Layer named PaintDetails. Select it and paint a second path on it."
      - "Click the eye icon on PaintDetails a few times to hide and show your second path."
      - "In the viewport, open the Lit menu, then Visualizers, and turn on Layer Contribution. Take a screenshot with the PaintDetails layer highlighted."
    done_when: "Send one screenshot of the painted path, and one screenshot of the Landscape panel that shows your Target Layers with their layer info objects and your PaintDetails edit layer."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Where does the list of Target Layers in the Landscape panel come from?"
        choices: ["From the layers defined in the Landscape Material", "From the names of the folders in the Content Browser", "From the Edit Layers you add in the panel", "From the Foliage panel, one layer for each foliage type"]
        answer_index: 0
        explain: "Each layer defined in the Landscape Material automatically appears in the Target Layers list with its name and thumbnail."
      - q: "What is the main purpose of a Layer Info Object?"
        choices: ["To store the heightmap of the whole Landscape actor", "To store the weightmap data for a painted layer", "To hold the material graph of the Landscape Material", "To store the foliage instances of a painted layer"]
        answer_index: 1
        explain: "A layer info object stores the weightmap and other data for a layer. Every landscape layer must have one assigned."
      - q: "You paint Mud on top of Grass. Both are weight-blended layers. What happens to the Grass?"
        choices: ["Nothing; layers are independent of each other when painted", "The Grass layer is deleted from the Target Layers list", "The Grass becomes an orphaned layer in the list", "The Grass weight goes down where you paint Mud"]
        answer_index: 3
        explain: "Painting a weight-blended layer decreases the weight of all other weight-blended layers. Painting mud removes grass, and painting grass removes mud."
      - q: "Why can you not fully remove a weight-blended layer by painting with Ctrl+Shift?"
        choices: ["Because Ctrl+Shift is the undo shortcut, so each stroke only removes the stroke before it", "Because weight-blended layers are locked as soon as a second layer is painted on top of them", "Because subtracting one layer uniformly raises the other layers, so some weight always remains", "Because the brush is too small to reach every vertex of a component in a single stroke"]
        answer_index: 2
        explain: "Ctrl+Shift lowers the selected layer and raises the others uniformly. The page recommends painting the layer you want in its place additively instead."
      - q: "A layer in the Target Layers list shows a ? icon. What does that mean?"
        choices: ["The layer has no texture assigned in the Landscape Material, so it is drawn with a gray checker", "The layer was removed from the material but still has painted data on the Landscape", "The layer is locked and cannot be painted until you unlock it", "The layer is a non weight-blended layer and has no Layer Info Object assigned to it"]
        answer_index: 1
        explain: "This is an orphaned layer. Its painted data stays until you delete the layer, so nothing is lost if the material change was a mistake."
      - q: "By default, how many Edit Layers can a Landscape have, and where is this limit set?"
        choices: ["8, in Project Settings under Landscape", "2, in the Landscape Material settings", "16, in World Settings under World", "Unlimited, with no setting for it"]
        answer_index: 0
        explain: "The editor sets a limit of 8 edit layers by default. You can change it in Project Settings under Landscape: Max Number of Layers."
    flavors:
      _default: {why: "Paint layers show the player where to walk. A dirt path is one of the strongest guiding tools in an outdoor level."}
      level_design: {why: "Painting the path on a separate edit layer lets you try guiding ideas and hide them without breaking the artist's work.", do: "Paint a second path option on another edit layer and compare both in a screenshot."}
      lookdev: {why: "Understanding weight-blended layers explains why painting one material removes another."}

  - id: LDQ51
