    flavors:
      _default: {why: "Fog layers tell the player what is low, far and dangerous. A lit beam tells them where to go."}
      level_design: {why: "Height fog can hide a pit floor and reveal a walkway with no extra assets.", do: "Add a Fog Cutoff Distance so a far skybox stays clean."}

