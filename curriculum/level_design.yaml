    title: A timed gate with a visible countdown
    brief: "A timer in Blueprint is a way to run an event after a number of seconds, or again and again at a fixed interval. A gate that stays open for only a short time, with a countdown the player can see, turns a simple corridor into a decision: run now, or explore and lose the gate. In this quest you build a gate that opens from a switch, counts down on a text above the door, and closes when the time is over."
