      - q: "How do you use Play From Here?"
        choices: ["Right-click in the viewport and pick Play From Here; play starts at the clicked spot", "Press Alt + S with an actor selected", "Set Number of Players to 0", "Choose Standalone Game in the Play dropdown"]
