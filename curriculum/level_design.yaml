  - id: LDQ109
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [behavior-tree, blackboard, patrol, ai]
    required_spine: false
    required: false
    title: Patrol tree with a chase branch
    brief: "A Behavior Tree is an asset that decides what an AI character does. It is a tree of nodes that Unreal reads from left to right, and the first branch whose conditions are met is the one that runs. It stores what the AI knows in a Blackboard, a small list of named values. In this quest you build an enemy that patrols to random points and switches to chasing the player when it sees them. This is the base of most guards and enemies you will place in a level."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/behavior-tree-in-unreal-engine---quick-start-guide"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/behavior-trees-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-behavior-tree-node-reference-decorators"
    checklist:
      - "Create a folder named AI. In it, make Enemy_Character (a copy of BP_ThirdPersonCharacter with its script removed and Max Walk Speed set to 120) and Enemy_Controller (an AIController Blueprint). Set the AI Controller Class on Enemy_Character to Enemy_Controller."
      - "Create a Blackboard named BB_Enemy with three keys: EnemyActor (type Object with base class Actor), HasLineOfSight (type Bool) and PatrolLocation (type Vector)."
      - "Create a Behavior Tree named BT_Enemy. Under the Root, add a Selector named AI Root. Under it, add a Sequence named Chase Player on the left, a Sequence named Patrol in the middle, and a Wait node of 1.0 on the right."
      - "Make a task named BTT_FindRandomPatrol. From Event Receive Execute AI, call GetRandomReachablePointInRadius with a radius of 1000, then Set Blackboard Value as Vector for PatrolLocation, then Finish Execute. Under Patrol, add this task, then Move To PatrolLocation, then Wait 4.0 with Random Deviation 1.0."
      - "Under Chase Player, add Rotate to Face BBEntry (set to EnemyActor), then BTT_ChasePlayer (a task that sets the walk speed to 500 through a function on the character), then Move To EnemyActor. Add a Blackboard decorator on Chase Player with the key HasLineOfSight and Observer aborts set to Both."
      - "In Enemy_Controller, connect Event On Possess to Run Behavior Tree. Add an AIPerception component with an AI Sight config and turn on Detect Neutrals. On Target Perception Updated, set the Blackboard keys for actors that have the tag Player, and start a timer of 4 s that clears the keys when sight is lost."
      - "Add the tag Player to the player character, place a NavMeshBoundsVolume, and play. Watch the tree switch branches in the Behavior Tree editor."
    done_when: "Send a screenshot of BT_Enemy taken while playing, with the active branch highlighted. Also send a short clip or a second screenshot that shows the enemy chasing you after it sees you."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "A Selector and a Sequence both run children left to right. What is the difference?"
        choices: ["A Selector stops at the first child that succeeds; a Sequence keeps going until a child fails", "A Selector runs children in parallel; a Sequence runs them one by one", "A Selector is for Tasks only; a Sequence is for Decorators only", "There is no difference"]
        answer_index: 0
        explain: "Selectors stop when they find a subtree that executes successfully. Sequences continue until a child fails."
      - q: "The Chase Player branch is placed left of Patrol. Why does the order matter?"
        choices: ["Left branches run faster", "Trees execute left to right and top down, so the most important behavior goes left and fallbacks go right", "Only the leftmost branch can have a Decorator", "The Blackboard reads keys from left to right"]
        answer_index: 1
        explain: "Behavior Trees execute from left to right and top down. Important actions go left; fallback behaviors go right."
      - q: "What does a Wait Task with Wait Time 4.0 and Random Deviation 1.0 do?"
        choices: ["Waits exactly 4 seconds", "Waits 3 to 5 seconds", "Waits 4 seconds then 1 more", "Waits 1 to 4 seconds"]
        answer_index: 1
        explain: "Random Deviation adds plus or minus 1 second to the Wait Time, so the AI waits 3 to 5 seconds."
      - q: "Which node should a Blueprint Task use to start its logic when the agent is an AI Controller?"
        choices: ["Event Receive Execute", "Event Begin Play", "Event Receive Execute AI", "Event Tick"]
        answer_index: 2
        explain: "Always use the AI version of Event Receive Execute (and Abort and Tick) when the agent is an AI Controller. If both are implemented, only the more suitable one is called."
      - q: "The Blackboard decorator on Chase Player has Observer aborts set to Both. What does that do?"
        choices: ["Aborts only the Patrol branch", "Aborts nothing; it only logs", "When HasLineOfSight changes, aborts Chase Player itself and any lower priority tasks", "Aborts the whole tree and restarts from Root"]
        answer_index: 2
        explain: "Both means: when the key changes, abort self and lower priority tasks. So losing sight drops out of Chase Player, and regaining it aborts Patrol."
      - q: "What is the difference between a Decorator and a Service?"
        choices: ["A Decorator is a condition that decides whether a branch can run; a Service runs at a set frequency while its branch is active", "A Decorator runs tasks; a Service stores keys", "A Service is a composite; a Decorator is a task", "They are the same node with different colors"]
        answer_index: 0
        explain: "Decorators are conditionals. Services attach to Task and Composite nodes and execute at a defined frequency while their branch is executing, often to update the Blackboard."
      - q: "Why does the guide call Update Walk Speed on the character instead of changing Character Movement directly from the Task?"
        choices: ["Tasks cannot access components", "Letting the tree change sub-objects directly is not a recommended practice; the character should own that change", "It is faster", "Character Movement is read-only"]
        answer_index: 1
        explain: "Having the Behavior Tree directly change properties of sub-objects is not recommended. The tree calls a function on the character, which makes the change."
      - q: "You spawn the enemy at runtime instead of placing it in the level, and the tree never runs. Which setting does the guide point to?"
        choices: ["Auto Possess AI set to Spawned", "Use Controller Rotation Yaw", "Max Walk Speed", "Detect Neutrals"]
        answer_index: 0
        explain: "If you spawn the AI after the world is loaded, change Auto Possess AI to Spawned so the controller possesses it."
    flavors:
      _default: {why: "A patrol that reacts to the player is the base of most guard, enemy and companion setups you will place in a level."}
      gameplay_design: {why: "Tuning ChaseSpeed, PatrolRadius and the line-of-sight timer is encounter design in numbers.", do: "Expose the timer and speeds as Instance Editable values and tune two different guards in the same level."}

  - id: LDQ110
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [eqs, ai, spawning, navigation]
    required_spine: false
    required: false
    title: EQS picks the spawn point
    brief: "If you place enemy spawn points by hand, they fail when the player stands in a spot you did not expect, and enemies appear in plain view. EQS, the Environment Query System, can find a good spot each time: it creates many test points around the player, removes the bad ones, and scores the rest. In this quest you build a query that finds a point the player cannot see and that an AI can reach, and you test it in the editor."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/environment-query-system-quick-start-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/eqs-node-reference-generators-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/eqs-node-reference-tests-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/environment-query-testing-pawn-in-unreal-engine"
    checklist:
      - "Enable the Environment Query Editor plugin if it is not enabled yet. Create EQC_PlayerContext with the parent class EnvQueryContext_BlueprintBase, and override Provide Single Actor so that it returns Get Player Character."
      - "Create an Environment Query named EQS_SpawnPoint. Add a Points: Donut generator around EQC_PlayerContext with Inner Radius 800, Outer Radius 1600 and 3 rings. Keep Projection Data on, so that the points land on the NavMesh."
      - "Add a Trace test with Test Purpose set to Filter Only and Context set to EQC_PlayerContext. The guide disables Bool Match to keep the points that can see the player. Flip it and compare, so that you keep the hidden points for spawns. Also add a Pathfinding test with Path Exist and Skip Unreachable."
      - "Add a Distance test set to Score Only with a Scoring Factor of -1.0, so that hidden points that are closer get a higher score."
      - "Create BP_EQSTestPawn from the EQS Testing Pawn class, set its Query Template to EQS_SpawnPoint, and place it in the level. Move your cover cubes until the Winner, the point with the best score, is where you want a spawn."
      - "Optional: in a small Behavior Tree, use Run EQSQuery to write the result to a Vector key, and then use Move To to go there."
    done_when: "Send a screenshot of the EQS Testing Pawn results in the editor with the scored points visible and the Winner marked. Also send a screenshot of the EQS_SpawnPoint graph that shows the three tests."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the job of a Generator in an Environment Query?"
        choices: ["To move the AI", "To produce the Items (locations or Actors) that Tests will filter and score", "To store the Blackboard", "To draw debug lines"]
        answer_index: 1
        explain: "Generators produce Items about a Context. Tests then cull or score those Items, and the best one is returned."
      - q: "You add a Distance test first and a Trace test second. What order do they run in?"
        choices: ["Distance then Trace, as added", "Trace always runs first", "Both run at the same time", "Filters run first, and the cheaper filter (Distance) runs before the Line of Sight filter, regardless of the order you added them"]
        answer_index: 3
        explain: "The order you add Tests is irrelevant. Tests are sorted with Filters first and by cost, so a distance filter runs before a line-of-sight filter."
      - q: "A Distance test with Test Purpose Score Only and Scoring Factor -1.0 prefers which points?"
        choices: ["Points closer to the Context", "Points farther from the Context", "Points at exactly the Reference Value", "No points; negative factors disable scoring"]
        answer_index: 0
        explain: "A factor of -1.0 scores closer points higher. With 1.0 the farthest points win, which the guide warns can make the AI run past the player."
      - q: "Which Test Purpose removes failing items and also weights the rest?"
        choices: ["Filter Only", "Score Only", "Filter and Score", "Project"]
        answer_index: 2
        explain: "Filter and Score does both. Filtering is done before scoring so scores are not computed for removed items."
      - q: "What does Projection Data on a Points generator do, and what is its side effect?"
        choices: ["Moves items onto the NavMesh; items just beyond the NavMesh edge can bunch up", "Scales the grid; it can make the query slower", "Adds height; it can hide items", "Removes items inside walls; it needs C++"]
        answer_index: 0
        explain: "Projection moves items that are inside walls or blocked back onto the NavMesh. That can create bunching when a grid line is just beyond the NavMesh edge."
      - q: "Which generator has Inner Radius, Outer Radius and Number of Rings?"
        choices: ["Points: Grid", "Points: Circle", "Points: Donut", "Actors of Class"]
        answer_index: 2
        explain: "Points: Donut creates rings between an Inner Radius and an Outer Radius around the Center context."
      - q: "How do you see an EQS query's scored points and the Winner without pressing Play?"
        choices: ["Use the Visual Logger only", "Place an EQS Testing Pawn with the Query Template assigned", "Set Test Purpose to Debug", "Enable Draw Tile Labels"]
        answer_index: 1
        explain: "The EQS Testing Pawn runs the assigned Query Template in the editor and shows the results."
      - q: "At runtime, which keys open the AI debugger and switch to EQS information?"
        choices: ["F1 then 3", "Tab then E", "The apostrophe key, then 3", "Ctrl+Shift+E"]
        answer_index: 2
        explain: "Press the apostrophe key to activate AI Debugging, then 1 for general, 2 for Behavior Trees, 3 for EQS, 4 for Perception."
    flavors:
      _default: {why: "Hand-placed spawn points break when the player moves. A query finds a hidden, reachable spot every time."}
      gameplay_design: {why: "EQS is the tool for 'spawn behind the player but not too close' rules.", do: "Add a second Distance test with a Float Value Min filter so no spawn is closer than 600 units."}

  - id: LDQ111
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [smart-objects, behavior-tree, ai, level-dressing]
    required_spine: false
    required: false
    title: Smart Objects that run a behavior
    brief: "A Smart Object is an object in the level that AI characters can find, reserve and use, such as a bench, a terminal or a campfire. The object itself holds the behavior that runs when a character uses it, so you do not have to script every NPC separately. NPCs that really use the things around them make a place feel alive. In this quest you make a Smart Object that plays an animation montage on the character, and an AI agent that finds, claims and uses it."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/smart-objects-in-unreal-engine---quick-start"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/smart-objects-in-unreal-engine---overview"
    checklist:
      - "Enable the plugins Smart Objects, AI Behaviors and Gameplay Behavior Smart Objects. Restart the editor if it asks you to."
      - "Create BP_SO_Behavior_PlayMontage with the parent class Gameplay Behavior. Override OnTriggeredCharacter: get the Skeletal Mesh Component of the Avatar, call Play Montage, and connect both On Completed and On Interrupted to End Behavior."
      - "Create BP_SO_BehaviorConfig with the parent class Gameplay Behavior Config. Set its Behavior Class to BP_SO_Behavior_PlayMontage."
      - "Create a Data Asset of the class Smart Object Definition and name it SO_Definition_PlayMontage. Add one Slot, and add a Gameplay Behavior Smart Object Behavior Definition that points to BP_SO_BehaviorConfig."
      - "Create an Actor Blueprint named BP_SO_Bench with a Smart Object component, and set its Definition Asset to SO_Definition_PlayMontage. Place 3 or more of them in the level."
      - "Create a Blackboard named BB_SO_Agent with a key of the type SO Claim Handle. Build two tasks: BTT_FindSmartObject, which uses Find Smart Objects in a box around the pawn, claims a random result and stores the handle, and BTT_UseSmartObject, which calls Use Claimed Gameplay Behavior Smart Object."
      - "Build a Behavior Tree named BT_SO_Agent. Under a Selector, add a Sequence with Find, Use and a Wait of 2.0 with a deviation of 0.5, and next to it add a Wait of 5 as the fallback. Run the tree from the agent on Event Possessed. Add a NavMeshBoundsVolume and click Simulate."
    done_when: "Send a screenshot from Simulate that shows an agent playing the montage at one of your Smart Objects, and a screenshot of the BT_SO_Agent graph."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "What stops two agents from using the same Smart Object slot at the same time?"
        choices: ["A collision volume", "The reservation system: an agent claims the object and others cannot use it until it is free again", "The NavMesh cost", "A Blackboard bool on each agent"]
        answer_index: 1
        explain: "Smart Objects use a reservation system. An agent reserves (claims) a Smart Object so no other agent can use it until it becomes available."
      - q: "Which three plugins does the guide enable?"
        choices: ["Smart Objects, AI Behaviors, Gameplay Behavior Smart Objects", "Smart Objects, Mass AI, State Tree", "Gameplay Abilities, Smart Objects, EQS", "AI Behaviors, Niagara, Smart Objects"]
        answer_index: 0
        explain: "In Settings > Plugins > Gameplay, the guide enables Smart Objects, AI Behaviors and Gameplay Behavior Smart Objects."
      - q: "Why does the behavior use Play Montage instead of Play Anim Montage?"
        choices: ["Play Anim Montage is deprecated", "Play Montage has On Completed and On Interrupted pins, so End Behavior fires only when the animation ends and the object stays occupied until then", "Play Montage is faster", "Play Anim Montage cannot target a Skeletal Mesh"]
        answer_index: 1
        explain: "The On Completed and On Interrupted pins are connected to End Behavior. This keeps the Smart Object occupied until the montage finishes."
      - q: "Where do you define the Slots and their default behavior?"
        choices: ["In the AI Controller", "In the Behavior Tree Root node", "In the Blackboard", "In the Smart Object Definition Data Asset"]
        answer_index: 3
        explain: "The Smart Object Definition Data Asset holds the Slots and, per slot, the Default Behavior Definitions such as the Gameplay Behavior Smart Object Behavior Definition."
      - q: "What connects a placed Actor to a Smart Object Definition?"
        choices: ["A Smart Object component with its Definition Asset set", "An Actor Tag", "A Nav Modifier component", "A Data Layer"]
        answer_index: 0
        explain: "The guide adds a Smart Object component to the Actor Blueprint and sets its Definition Asset."
      - q: "Which Blackboard key type stores the result of Claim?"
        choices: ["Object", "Vector", "SO Claim Handle", "Name"]
        answer_index: 2
        explain: "The Blackboard key ClaimHandle uses the SO Claim Handle type. The Use task reads it back with Get Value as SOClaim Handle."
      - q: "The Find task adds and subtracts 2000 on X, Y and Z from the pawn location. What is that for?"
        choices: ["Setting the montage length", "Making the Query Box for Find Smart Objects, a 4000 x 4000 unit search area", "Scaling the Smart Object", "Setting the NavMesh bounds"]
        answer_index: 1
        explain: "Make Box uses those two points as Min and Max. That creates a 40 x 40 meter search box around the agent."
      - q: "In the guide's tree, when does the agent wait 5 seconds?"
        choices: ["After every montage", "Before possessing the pawn", "When the player is seen", "When the Sequence fails, for example when no Smart Object was found or claimed"]
        answer_index: 3
        explain: "The Wait node sits right of the Sequence under a Selector. It runs only if the Sequence fails, so the agent waits before searching again."
    flavors:
      _default: {why: "Benches, terminals and campfires that NPCs really use make a place feel lived in, without scripting each NPC."}
      gameplay_design: {why: "Smart Objects let you author ambient activity as level content, not AI code.", do: "Give one Smart Object two Slots and show two agents using it at once."}
      animation: {why: "The montage is the visible part; the slot decides where the character stands.", do: "Try a second montage and check the End Behavior timing with a longer animation."}

  - id: LDQ112
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [ai-perception, stealth, ai, debugging]
    required_spine: false
    required: false
    title: Guards that see, hear and forget
    brief: "AI Perception is the system that lets AI characters sense the world, for example by sight and by hearing. Each sense has settings such as how far the guard sees, how wide its view is, and how long it remembers what it saw. A stealth area is designed around what guards can and cannot sense, so you need to see these ranges to place cover in the right spots. In this quest you set up a guard with sight and hearing and look at its senses with the AI debug view."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/ai-perception-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/ai-debugging-in-unreal-engine"
    checklist:
      - "Make an AIController Blueprint named AIC_Guard and add an AIPerception component to it. Add an AI Sight config with Sight Radius 1500, Lose Sight Radius 2000, Peripheral Vision Half Angle 45, Detect Neutrals turned on, and Max Age 5."
      - "Add an AI Hearing config with Hearing Range 1200 and Detect Neutrals turned on. Set Dominant Sense to Sight."
      - "On the event On Target Perception Updated, break the AIStimulus struct and print the value of Successfully Sensed together with the name of the actor. This lets you see when something enters or leaves the guard's senses."
      - "In the player character, add an AIPerception Stimuli Source component. Enable Auto Register as Source and add Sight to Register as Source for Senses. Give the player the tag Player."
      - "Open Project Settings, go to Engine, then AI System, and enable Forget Stale Actors. With this, guards forget the player after the Max Age time."
      - "Place BP_Guard, with AIC_Guard as its controller, in a stealth room that has two cover walls. Play, press the apostrophe key and then Numpad 4, and check the sight cone and the hearing circle. Sneak behind the guard and confirm that it does not detect you outside the half angle."
    done_when: "Send a screenshot with the AI Perception debug view active and the sight cone visible, taken while you are hidden behind cover. Also send a screenshot of the Details panel of the Sight config that shows your radius and angle values."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Where does the guide add the AI Perception Component?"
        choices: ["To the player character", "To the Level Blueprint", "To the Behavior Tree", "To the Pawn's AIController Blueprint"]
        answer_index: 3
        explain: "The AI Perception Component is added to the Pawn's AIController Blueprint. It listens for stimuli and defines the senses."
      - q: "Peripheral Vision Half Angle Degrees is 45. How wide is the guard's full field of view?"
        choices: ["45 degrees", "90 degrees", "180 degrees", "22.5 degrees"]
        answer_index: 1
        explain: "The value is measured from the forward vector, not the whole range. 45 on each side gives 90 degrees total."
      - q: "Sight Radius is 1500 and Lose Sight Radius is 2000. What happens between 1500 and 2000 units?"
        choices: ["An already seen target is still perceived, but a new target cannot be picked up", "A new target is seen for the first time", "Nothing is perceived", "Hearing takes over"]
        answer_index: 0
        explain: "Sight Radius is the max distance to start perceiving. Lose Sight Radius is the max distance at which a seen target is no longer perceived."
      - q: "You want guards to detect only the player, but affiliation cannot be set in Blueprint. What does the source recommend?"
        choices: ["Use C++ only", "Enable Detect Neutrals to detect all actors, then filter with Tags", "Set Sight Radius to zero for non-players", "Use the AI Team sense"]
        answer_index: 1
        explain: "Affiliation is only definable in C++. In Blueprints, use Detect Neutrals to detect everything and use Tags to filter actor types."
      - q: "What does Max Age = 0 mean on a sense config?"
        choices: ["The stimulus is forgotten immediately", "The sense starts disabled", "The stimulus is never forgotten", "The sense fires once per frame"]
        answer_index: 2
        explain: "Max Age is how long until a stimulus becomes forgotten. Zero means never forgotten."
      - q: "For an AI to forget a target after Max Age, what must also be enabled?"
        choices: ["Project Settings > Engine > AI System > Forget Stale Actors", "Starts Enabled on the sense", "Auto Register as Source", "Use Controller Rotation Yaw"]
        answer_index: 0
        explain: "The Forget Perception Event needs Forget Stale Actors set to true in Project Settings > Engine > AI System. Then Max Age sets the timeout."
      - q: "Which sense reacts to a Report Noise Event, such as a thrown object landing?"
        choices: ["AI Sight", "AI Touch", "AI Hearing", "AI Prediction"]
        answer_index: 2
        explain: "AI Hearing detects sounds generated by a Report Noise Event, within its Hearing Range."
      - q: "On Target Perception Updated gives an AI Stimulus struct. Which field tells you if the actor entered or left perception?"
        choices: ["Strength", "Tag", "Receiver Location", "Successfully Sensed"]
        answer_index: 3
        explain: "Successfully Sensed returns True or False. The quick start guides use it to tell 'seen' events from 'lost' events."
    flavors:
      _default: {why: "Stealth spaces are designed around what guards can and cannot sense. You need to see the cone to place the cover."}
      gameplay_design: {why: "Sight angle, radius and forget time are the core stealth tuning values.", do: "Make a 'suspicious' state: when Successfully Sensed goes false, move the guard to the Stimulus Location before returning to patrol."}

  - id: LDQ113
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [editor-utility-widget, metrics, tools]
    required_spine: false
    required: false
    title: Metrics panel as an Editor Utility Widget
    brief: "An Editor Utility Widget is a small panel that you build yourself and that runs inside the Unreal Editor, not in the game. You design it like any other user interface widget and give it Blueprint logic that works on the level. Metrics are the standard sizes of your game, such as the width of a door or the height of a jump. In this quest you build a panel that measures the distance between two selected actors and tells you if it fits your door width."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/editor-utility-widgets-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/scripting-the-unreal-editor-using-blueprints"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/calling-blueprints-in-the-unreal-editor"
    checklist:
      - "In the Content Browser, right-click and choose Editor Utilities, then Editor Utility Widget. Name the new asset EUW_LDMetrics."
      - "Add a Text block and a button named Measure to the widget. When the button is clicked, use the node Get Selection Set to read the actors that are selected in the level."
      - "If exactly two actors are selected, calculate the distance between them and show it in the Text block."
      - "Add three reference rows that show your metrics: door width, jump height and corridor width. Use the numbers that you use in your blockouts."
      - "Compare the measured distance with the door width. Show OK or TOO NARROW in the Text block."
      - "Right-click the asset and choose Run Editor Utility Widget. Dock the tab that opens next to the Details panel."
      - "Select two blockout walls in your level and press Measure. Check that the number and the OK or TOO NARROW text update."
    done_when: "Send a screenshot of the EUW_LDMetrics tab docked in the editor. It must show a measured distance and the OK or TOO NARROW text, with the two selected actors visible in the viewport."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What kind of asset is an Editor Utility Widget based on?"
        choices: ["A UMG Widget Blueprint", "A Level Blueprint", "A Material Instance", "A Data Table"]
        answer_index: 0
        explain: "Editor Utility Widgets are based on Unreal Motion Graphics (UMG). You set up the widget like any other UMG Widget Blueprint."
      - q: "How do you open an Editor Utility Widget as an editor tab for the first time?"
        choices: ["Drag it into the viewport", "Press Play", "Right-click the asset and choose Run Editor Utility Widget", "Open it from the Layers panel"]
        answer_index: 2
        explain: "Right-click the Editor Utility Widget asset and select Run Editor Utility Widget. An editor tab with your widget opens."
      - q: "After you have run an Editor Utility Widget once, where can you find it again?"
        choices: ["In Project Settings > Plugins", "In the Level Editor's Tools menu, under Editor Utility Widgets", "In the Place Actors panel", "In the Content Browser Filters menu"]
        answer_index: 1
        explain: "Once run, the widget appears in the Level Editor's Tools dropdown, under the Editor Utility Widgets category."
      - q: "Where can the tab of an Editor Utility Widget be docked?"
        choices: ["Only inside the Blueprint Editor", "Anywhere, including the Material Editor", "It cannot be docked at all", "Only with Level Editor tabs"]
        answer_index: 3
        explain: "The page says the tab is only dockable with Level Editor tabs."
      - q: "Per the Blueprint scripting page, which option is recommended for most editor scripting work when you need a rich UI?"
        choices: ["Level Blueprint", "Editor Utility Widgets", "Call in Editor buttons", "Startup Objects"]
        answer_index: 1
        explain: "Editor Utility Widgets combine UMG styling with Blueprint scripting. Epic calls them the most flexible option and recommends them for most editor scripting work."
      - q: "Why does an Editor Utility Widget see more editor functions than a normal Actor Blueprint?"
        choices: ["Because it runs in Play In Editor", "Because it has more memory", "Because editor-only functions are only exposed to editor-only classes", "Because it uses C++ instead of Blueprint"]
        answer_index: 2
        explain: "Functions from Editor-type modules are only available in editor-only Blueprint classes. A widget derived from a runtime class sees only a limited Editor Scripting set."
      - q: "You want a Blueprint graph that runs both in the editor and at runtime, triggered from a button in the Details panel. Which approach fits?"
        choices: ["Call in Editor on a Custom Event or function in a normal Actor Blueprint", "An Editor Utility Widget", "A Startup Object", "A Scripted Action"]
        answer_index: 0
        explain: "Call in Editor exposes a button in the Details panel for a placed actor and works both at runtime and in the editor."
      - q: "Which Blueprint class type does NOT show Call in Editor buttons in the Details panel?"
        choices: ["A Blueprint derived from Actor", "A Blueprint derived from Character", "A Blueprint derived from Pawn", "An Editor Utility Blueprint derived from Actor"]
        answer_index: 3
        explain: "Editor Utility Blueprint classes derived from Actor do not expose Details-panel buttons for Call in Editor functions. Use a normal Blueprint class or an Editor Utility Widget."
    flavors:
      _default: {why: "A small panel that checks your metrics saves you from measuring by eye every time."}
      tech_art: {why: "Editor Utility Widgets are the standard way to ship tools to the whole team.", do: "Add a dropdown that switches between metric sets (stealth, combat, platforming)."}
      gameplay_design: {why: "Metrics live in the player controller; a panel keeps the level honest to them.", do: "Read the jump height from the Character Blueprint instead of typing it by hand."}

  - id: LDQ114
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [scripted-actions, editor-utility-blueprint, tags]
    required_spine: false
    required: false
    title: Scripted Actions for tagging and renaming
    brief: "A Scripted Action is a command that you write in Blueprint and that appears in the right-click menu of actors in the editor. It lets you do the same thing to many selected actors at once, for example give them all a tag or a clear name. Tags and good names make a big level easy to search and to review. In this quest you build two Scripted Actions, one that adds a tag and one that renames, and you limit them to Static Mesh Actors."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/scripted-actions-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/scripting-the-unreal-editor-using-blueprints"
    checklist:
      - "Right-click in the Content Browser and choose Editor Utilities, then Editor Utility Blueprint. Pick ActorActionUtility as the parent class and name the asset EUB_LDActions."
      - "Add a function named Add Tag with one String input. It must loop over the result of Get Selection Set and add the tag to each actor."
      - "Add a second function named Rename With Prefix with one String input. It renames each selected actor to Prefix_Number, which means the prefix, an underscore and a number."
      - "In Class Defaults, add Static Mesh Actor to Supported Classes, so that the actions only appear for static meshes."
      - "Click Compile and Save. Select ten blockout meshes in the viewport, right-click, and run Add Tag with the value Cover."
      - "Run Rename With Prefix with the value Cover on the same selection. Check the new names in the Outliner."
      - "Select one actor that is not a static mesh, such as a light, and confirm that the Scripted Actions menu does not show your actions."
