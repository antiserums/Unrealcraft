  - id: LDQ54
    rank: 1
    difficulty: apprentice
    specializations: [level_design]
    subjects: [hlod, world-partition, performance]
    required_spine: false
    required: false
    title: "HLOD: keep the far mountains visible"
    brief: "In a World Partition level, the parts of the world that are far from the player are unloaded, so they would simply disappear. HLOD, short for Hierarchical Level of Detail, fixes this by building cheap stand-in meshes, called proxies, that are shown in place of the far actors. This keeps mountains and forests visible on the horizon at a low cost. In this quest you create two HLOD Layers, assign rocks and trees to them, and build the HLODs."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition---hierarchical-level-of-detail-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open a World Partition level. In the Content Drawer, click + Add, open Miscellaneous, and choose HLOD Layer. Name it HLOD_Rocks and set its Layer Type to Merged Mesh."
      - "Make a second HLOD Layer named HLOD_Trees and set its Layer Type to Instancing."
      - "Place 20 rock meshes and 20 tree meshes far away from the player start. Set the Mobility of all of them to Static."
      - "Select the rocks and, in the Details panel, set their HLOD Layer property to HLOD_Rocks. Do the same for the trees with HLOD_Trees."
      - "Open the Build menu and run Build HLODs. Wait until the build is finished."
      - "In the viewport view mode menu, open Level of Detail Coloration and choose Hierarchical LOD Coloration. Move the camera close to the actors, where they are drawn green, and then far away, where the proxy is drawn blue."
      - "Start Play In Editor and walk far away. Open the console and run the command wp.Runtime.ToggleDrawRuntimeHash2D to see which HLOD cells are loaded."
    done_when: "Send two screenshots in Hierarchical LOD Coloration: one close up with green actors and one from far away with the blue proxy. Add one line that says which layer type you gave the trees and why."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What problem does World Partition HLOD solve?"
        choices: ["Actors in unloaded cells are invisible; HLOD replaces them with a cheap proxy so distant things stay visible", "Actors load too slowly", "Lightmaps are too big", "Foliage cannot be painted far away"]
        answer_index: 0
        explain: "Unloaded cells show nothing. HLOD generates a single proxy mesh and material per cell group to show distant content and reduce draw calls."
      - q: "Which HLOD Layer Type is best for trees and foliage?"
        choices: ["Merged Mesh", "Simplified Mesh", "Instancing", "Always Loaded"]
        answer_index: 2
        explain: "Instancing replaces the meshes with Instanced Static Mesh components using their lowest LOD. The page calls it ideal for imposter meshes like trees."
      - q: "Which of these is NOT required for an actor to get an HLOD proxy?"
        choices: ["The actor is assigned to an HLOD Layer", "The actor's Mobility is Static", "You run Build > Build HLODs or the builder commandlet", "The actor has a Nanite mesh"]
        answer_index: 3
        explain: "Actors need an HLOD Layer, Static mobility, and a build. Nanite is not required; there is only an option to generate a Nanite proxy."
      - q: "Name the three ways an actor can be assigned to an HLOD Layer."
        choices: ["Actor HLOD property, Default HLOD Layer of a Data Layer, Default HLOD Layer in World Settings", "Material, Mesh, Texture", "Level Blueprint, Game Mode, Player Controller", "Only the actor HLOD property"]
        answer_index: 0
        explain: "You can set it per actor, per Data Layer, or as a world default in World Settings."
      - q: "In Hierarchical LOD Coloration view mode, what do green and blue mean?"
        choices: ["Green is unloaded, blue is loaded", "Green is an actor assigned to an HLOD Layer, blue is its HLOD proxy mesh shown from far away", "Green is Static, blue is Movable", "Green is Nanite, blue is not"]
        answer_index: 1
        explain: "Actors in an HLOD Layer draw green. When the camera moves away, their proxy draws blue."
      - q: "You check Always Loaded on an HLOD Layer. Which settings become unavailable?"
        choices: ["Layer Type", "Cell Size and Loading Range", "HLODMaterial", "Parent Layer"]
        answer_index: 1
        explain: "An always loaded proxy does not stream, so the runtime grid settings Cell Size and Loading Range are not available."
    flavors:
      _default: {why: "Players judge a world by what they see on the horizon. HLOD keeps the horizon full without the cost."}
      level_design: {why: "Landmarks guide the player. If your tower disappears when its cell unloads, the guiding fails. HLOD keeps landmarks visible.", do: "Pick one landmark and confirm its proxy is visible from the far end of the map."}
      lookdev: {why: "Merged and simplified proxies bake materials; knowing the settings helps you avoid ugly far views."}
      cinematics: {why: "Wide establishing shots depend on HLOD proxies for everything outside the loaded cells."}

  - id: LDQ55
    rank: 1
