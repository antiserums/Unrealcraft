      - q: "What is the trade-off when you lower Num Waves in a Water Waves asset?"
        choices: ["Better performance, but less variation in the waves", "The waves get taller, and the cost stays the same as before", "Rivers stop flowing in the Water Zone", "The lake stops carving the terrain under its surface"]
        answer_index: 0
        explain: "By default 16 waves are summed. Fewer waves is more performant but gives less variation in how waves collide."
      - q: "What is the purpose of an Island Water Body?"
        choices: ["To render a small ocean around a piece of land that is far away from the main coast", "To raise the landscape inside its spline so that land stays above water", "To block the player from swimming inside the area that its spline covers", "To add caustics to the sea floor around the land that is inside its spline"]
        answer_index: 1
