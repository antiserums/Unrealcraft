        choices: ["Its color is black", "Volumetric Fog is off", "The actor is Static", "Its Fog Density is 0"]
        answer_index: 3
        explain: "Setting the Fog Density of the secondary fog layer to 0 means it has no influence."
      - q: "Why does a far Start Distance help performance?"
        choices: ["It lowers fog resolution for all pixels that are near", "It disables volumetrics inside the Start Distance, which are the costly part", "Pixels in front of the viewer can be culled by the Z-buffer", "It turns off directional inscattering for all nearby pixels"]
        answer_index: 2
        explain: "Start Distance keeps an area in front of the viewer clear, so those pixels are culled. Cost can drop to 50% or less."
      - q: "Which Exponential Height Fog settings does Volumetric Fog NOT support?"
        choices: ["Start Distance, Fog Max Opacity and Fog Cutoff Distance", "Fog Density, Fog Height Falloff and Fog Inscattering Color", "Inscattering Color and Fog Height Falloff", "Second Fog Data and Fog Density"]
        answer_index: 0
        explain: "The docs list Start Distance, Fog Max Opacity and Fog Cutoff Distance as unsupported by Volumetric Fog."
      - q: "A light's contribution to Volumetric Fog is set by which property?"
        choices: ["Volumetric Scattering Intensity", "Intensity", "Source Radius and Soft Source Radius", "Indirect Lighting Intensity"]
        answer_index: 0
        explain: "Volumetric Scattering Intensity controls how much a light contributes to the fog. 0 means no contribution."
      - q: "You want strong light shafts without heavy fog everywhere. What does the doc recommend?"
        choices: ["Raise global Fog Density a lot, lower the Directional Light Intensity and set the Scattering Distribution of the fog to 0", "Turn on Cast Volumetric Shadow on all lights in the level and raise the global Fog Density until the shafts are easy to see", "Keep density low, raise the Directional Light's Volumetric Scattering Intensity and set Scattering Distribution near 0.9", "Use a Box reflection capture around the windows, with a high Brightness"]
