  - id: LDQ57
    rank: 1
    difficulty: apprentice
    specializations: [level_design]
    subjects: [navigation, navmesh, project-settings]
    required_spine: false
    required: false
    title: Tune the NavMesh to your agent
    brief: "The NavMesh, short for Navigation Mesh, is a map of the floor areas where AI characters can walk. Unreal builds it from your level geometry. The NavMesh has settings for the size of the character, called the agent, and if they do not match your character the AI will fail in doorways, on stairs and in narrow gaps. In this quest you change these settings and watch how the NavMesh reacts."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/navigation-mesh-settings-in-the-unreal-engine-project-settings"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/optimizing-navigation-mesh-generation-speed-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/optimizing-navigation-mesh-generation-speed-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/basic-navigation-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a blockout level with a doorway and stairs. The level of the template works, or you can build a small one from cubes. Add a NavMeshBoundsVolume that covers the play area. Press P in the viewport to see the NavMesh, which is drawn in green."
      - "Build a narrow gap of about 60 cm between a wall and a box. Check that the NavMesh goes through the gap."
      - "Select the actor named RecastNavMesh-Default. In the Details panel, find the Generation section and raise Cell Size from its default value to 64. Watch the NavMesh in the gap disappear."
      - "Set Cell Size back to its default. Now change Agent Radius and Agent Max Step Height, and watch how the NavMesh changes on stairs and in doorways."
      - "Pick one small decorative prop. In the Collision section of its Details panel, disable Can Ever Affect Navigation so the prop no longer cuts a hole in the NavMesh."
      - "Write down the Cell Size, Agent Radius and Agent Max Step Height that you keep for this level, and why you chose each one."
    done_when: "Send two screenshots of the same gap: one with the default Cell Size where the NavMesh passes through, and one with Cell Size 64 where the NavMesh is gone. Add your three chosen values with one line of reason for each."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "What does the Cell Size setting control?"
        choices: ["The horizontal size of one navigation tile in Unreal Units", "The radius of the smallest agent", "The horizontal size of a voxel used to build the NavMesh", "The distance between two Nav Link Proxies"]
        answer_index: 2
        explain: "Cell Size is the horizontal size of a voxelization cell. Cell Height is the vertical size. Tile Size UU is the size of a whole tile."
      - q: "You make the Cell Size bigger. What happens?"
        choices: ["Generation is faster but the NavMesh is less precise around obstacles", "Generation is slower but the NavMesh is more precise around obstacles", "The NavMesh becomes taller, and agents can walk under lower ceilings than before", "Agents move faster, because they cross each of the larger cells in a single step"]
        answer_index: 0
        explain: "Smaller voxels give more precision but need more processing. Epic recommends making cells as large as possible while keeping the precision your agents need."
      - q: "You want to change NavMesh generation settings for one level only, not the whole project. Where do you do it?"
        choices: ["Editor Preferences > Navigation, with the level open", "Any Nav Modifier Volume in that level, in its Details panel", "The Level Blueprint, on the Event BeginPlay node", "The RecastNavMesh-Default actor in the Outliner, Details panel"]
        answer_index: 3
        explain: "Project Settings > Navigation Mesh sets the defaults. Selecting the RecastNavMesh-Default actor lets you adjust the NavMesh in that level."
      - q: "Epic's recommendation for Tile Size is:"
        choices: ["Exactly 1000 UU, in all cases", "Between 32 and 128 cells per side", "As small as possible", "The same size as the Cell Size"]
        answer_index: 1
        explain: "Tiles between 32 and 128 cells per side give the best performance when rebuilding tiles at runtime. Large tiles are expensive; many tiny tiles add overhead."
      - q: "A small decorative prop should not change the NavMesh. What do you do?"
        choices: ["Delete its collision so that the NavMesh cannot see the prop at all", "Put a Nav Link Proxy on it, so that agents step over the prop without a change to the mesh", "Disable Can Ever Affect Navigation in the actor's Collision section", "Set its mobility to Movable, because movable actors are never seen by the NavMesh"]
        answer_index: 2
        explain: "By default Blueprint actors and Static Meshes affect navigation. Turning off Can Ever Affect Navigation removes the object from NavMesh generation and makes the tile cheaper to build."
      - q: "What does Agent Max Step Height mean?"
        choices: ["The largest vertical step the agent can perform", "The height of the tallest agent that can use the mesh", "The maximum slope angle the agent can walk on", "The height of one voxel"]
        answer_index: 0
        explain: "Agent Max Step Height is the largest vertical step. Agent Height is the tallest agent, Agent Max Slope is the angle, Cell Height is the voxel height."
    flavors:
      _default: {why: "The NavMesh is built from your geometry. If the settings do not match your character, AI will fail in doorways, on stairs and in narrow gaps."}
      gameplay_design: {why: "Enemy behavior depends on where the NavMesh exists. Wrong settings make encounters break in ways that look like AI bugs.", do: "Test one enemy in a doorway that is exactly two Agent Radius wide, then one that is narrower, and note the difference."}

  - id: LDQ58
    rank: 1
    difficulty: apprentice
    specializations: [level_design]
    subjects: [navigation, nav-modifier, ai]
    required_spine: false
    required: false
    title: Cost zones with Nav Modifier Volumes
    brief: "A Nav Modifier Volume is a box that changes the NavMesh inside it. It can remove the NavMesh, or it can mark the area as costly, so that AI characters prefer other routes but can still cross it if there is no other way. This lets a level designer guide AI around hazards without building walls. In this quest you block and steer a roaming AI with these volumes, and you build a small reusable mud patch actor."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/navigation-components-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-how-to-modify-the-navigation-mesh-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-how-to-modify-the-navigation-mesh-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Work in a blockout level that has a NavMeshBoundsVolume, with a few walls so that there is a short and a long route between two places. Place an AI character that roams around. To make one, duplicate BP_ThirdPersonCharacter, name the copy BP_NPC_NavMesh, delete its input nodes, and add an event that calls Get Random Reachable Point In Radius with a radius of 1000 and then AI Move To, and repeats after a Delay of 4. Epic's Basic Navigation guide builds the same character."
      - "From the Place Actors panel, drag in a Nav Modifier Volume. Press P and notice that there is no NavMesh inside it. Use the volume to block one route."
      - "Add a second Nav Modifier Volume and set its Area Class to NavArea_Obstacle, which gives the area a high cost. Place it on the short route to a target."
      - "Click Simulate. The AI should take the long way around the obstacle area. Then close the long way with another volume and see the AI walk through the obstacle area."
      - "Change the obstacle volume to NavArea_Null and click Simulate again. The AI can no longer reach its goal."
      - "Make a Blueprint named BP_MudPatch. It is an Actor with a Box component as its root and a Nav Modifier component. Set its Area Class to NavArea_Obstacle and place two of them in the level."
    done_when: "Send one screenshot taken in Simulate with P turned on. It must show the green NavMesh, the obstacle zone in a different color, and the AI walking around it. Add one sentence that says what happened with NavArea_Null."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "An AI should avoid a mud area but must still cross it if there is no other way. Which Area Class do you use?"
        choices: ["NavArea_Null", "NavArea_Obstacle", "NavArea_LowHeight", "NavArea_Default"]
        answer_index: 1
        explain: "NavArea_Obstacle assigns a high cost. The solver avoids it, but will still path through a high-cost area if it is the cheapest path."
      - q: "What does NavArea_Null do?"
        choices: ["Halves the cost of the area, so that agents prefer to walk through the volume", "Marks the area as water, so only agents that swim go in", "Assigns the same cost as the rest of the mesh, so nothing changes", "Applies infinite cost, so no NavMesh is generated inside the volume"]
        answer_index: 3
        explain: "NavArea_Null applies an infinite cost and the NavMesh is not generated in that area. An agent can never find a path through it."
      - q: "You drop a Nav Modifier Volume into the level and change nothing. What do you see?"
        choices: ["No NavMesh is generated inside the volume", "The NavMesh inside becomes cheaper", "Nothing changes until you press Build Paths", "The volume becomes a Nav Link"]
        answer_index: 0
        explain: "The guide says that by default no NavMesh is generated inside a Nav Modifier Volume. You change the Area Class to get other effects."
      - q: "You add a Nav Modifier component to a Blueprint actor. When does it change the NavMesh?"
        choices: ["Always, on its own, whatever the root component of the actor is; the NavMesh reads the Area Class of the component", "Only in Static generation mode, when the level is built", "When a basic shape component is the root; the root's volume is modified by the Area Class", "Only if the actor also has a Nav Link Proxy; the link tells the NavMesh which area to change"]
        answer_index: 2
        explain: "The Nav Modifier component does nothing by itself. If a basic shape is the root component, that shape's volume is modified according to the Area Class."
      - q: "You add two Nav Modifier components to one actor. Result?"
        choices: ["The costs of the two components add together", "Only one has an effect; extra ones do nothing", "The actor stops affecting navigation", "The editor shows an error"]
        answer_index: 1
        explain: "You should have only one Nav Modifier component per actor. Multiples have no effect."
      - q: "The only route to the goal is through a high-cost area. What does the AI do?"
        choices: ["It stops and fails the move, because the cost is over its limit now", "It waits at the edge of the area for the cost to drop, and then goes on", "It jumps over the area with a launch", "It walks through, because that is still the cheapest available path"]
        answer_index: 3
        explain: "The solver always picks the cheapest path. A high cost area is still valid, so with no alternative the agent goes through it."
    flavors:
      _default: {why: "Cost zones let you steer AI around hazards or off the player's path without walls. It is the level designer's main tool to shape AI routes."}
      gameplay_design: {why: "Enemy routes decide where fights happen. Cost zones move those fights to where you want them.", do: "Use one NavArea_Obstacle zone to push an enemy patrol along a route that crosses the player's line of sight twice."}

