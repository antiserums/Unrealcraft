      gameplay_design: {why: "Query Filters are a tuning knob: change a cost, change an encounter.", do: "Add a third filter that makes the middle lane cheapest and show a third walker using it."}

  - id: LDQ106
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [navigation, navmesh, performance]
    required_spine: false
    required: false
    title: NavMesh resolution per zone
    brief: "The NavMesh is built in square pieces called tiles. A fine NavMesh is precise but slow to build, and a coarse one is fast but cannot fit through small gaps. Unreal lets you choose a resolution of Low, Default or High for each zone, so that only the tight areas pay for precision. This matters most in big worlds where the NavMesh is rebuilt while the game runs. In this quest you set different resolutions in two zones and compare the build times."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/navigation-mesh-resolutions-user-guide"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/navigation-mesh-settings-in-the-unreal-engine-project-settings"
    checklist:
      - "In a level with a NavMeshBoundsVolume, select the RecastNavMesh-Default actor and enable Draw Tile Build Times. Press P to see the NavMesh and the build time of each tile."
      - "Place a Nav Modifier Volume over an open area that covers several tiles. Set its Nav Mesh Resolution to Low. Compare the build times inside and outside the volume."
      - "Build a tight area from three cube obstacles with small gaps between them. Cover it with a second Nav Modifier Volume and set that one to High."
      - "On the RecastNavMesh actor, enable Draw Tile Resolutions and Draw Tile Build Times Heat Map. Check that the colors match your zones."
      - "Make BP_NavResCarrier, an Actor Blueprint with a NavModifier component that is set to Low. Drag it across the NavMesh and watch the tiles rebuild."
      - "Open Project Settings, go to Navigation Mesh, then Generation, and find Nav Mesh Resolution Params. Note the Cell Size of each resolution."
    done_when: "Send two screenshots: one of the level with Draw Tile Resolutions on, with blue, green and yellow zones visible, and one of the same view with the build time heat map. Add one line with the Cell Size values you found for Low, Default and High."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "How many tile resolutions can one Navigation Mesh use at the same time?"
        choices: ["One", "Two", "Three", "Eight"]
        answer_index: 2
        explain: "The feature generates tiles at three resolutions in the same NavMesh: high, medium (default) and low."
      - q: "What is the trade-off of a Low resolution tile?"
        choices: ["Faster to generate and less memory, but less accurate", "More accurate but slower to load", "Same accuracy, only a different color", "Agents move faster on it"]
        answer_index: 0
        explain: "Low resolution uses fewer polygons for the same space. Generation is faster and memory is smaller, at the cost of accuracy."
      - q: "An open field has no obstacles, and a warehouse has shelves with narrow gaps. Which resolution plan does the guide suggest?"
        choices: ["High everywhere", "Low in the field, Default or High in the warehouse", "Low in the warehouse, High in the field", "Default everywhere; resolution cannot vary"]
        answer_index: 1
        explain: "Use low resolution in open spaces where accuracy is not needed, and default or high in dense areas with small spaces between obstacles."
      - q: "With Draw Tile Resolutions enabled, which color means a Low resolution tile?"
        choices: ["Yellow", "Green", "Red", "Blue"]
        answer_index: 3
        explain: "Blue is low, green is default and yellow is high."
      - q: "Agents cannot pass between two close obstacles in a Low zone, but they can in a Default zone. Why?"
        choices: ["Low tiles block agents by design", "Low resolution does not have enough polygons to build a path in the tight gap", "Default tiles have a lower cost", "Agents ignore Low tiles"]
        answer_index: 1
        explain: "The guide shows this exact case: at Low resolution there is not enough resolution to create polygons between close obstacles, so no path exists."
      - q: "Where can you set a tile resolution from inside an Actor Blueprint?"
        choices: ["On a NavModifier component, Nav Mesh Resolution dropdown", "On the Static Mesh component, Collision section", "On the Actor's Tags", "On the RecastNavMesh actor only"]
        answer_index: 0
        explain: "Add a NavModifier component to the Actor and pick the resolution in its Nav Mesh Resolution dropdown. Tiles rebuild as the actor moves."
      - q: "In Nav Mesh Resolution Params, what does a bigger Cell Size do?"
        choices: ["Makes tiles generate faster", "Makes tiles more accurate", "Makes agents bigger", "Adds more tiles"]
        answer_index: 0
        explain: "The bigger the Cell Size, the faster the tile generates."
      - q: "For optimal performance, what relationship between Tile Size UU and the Cell Sizes does the guide recommend?"
        choices: ["Tile Size UU must equal the largest Cell Size", "Tile Size UU should be divisible by all the Cell Sizes, and Cell Sizes multiples of each other", "Tile Size UU should be a prime number", "There is no relationship"]
        answer_index: 1
        explain: "Set each Cell Size as a multiple of the others and make sure Tile Size UU is divisible by all of them."
    flavors:
      _default: {why: "Big open worlds with dynamic NavMesh get cheaper when only the dense parts pay for precision."}
      gameplay_design: {why: "Tight arenas need precise paths; the resolution choice decides whether AI can use your cover gaps.", do: "Measure the smallest gap your AI must pass and check which resolution still finds a path through it."}

  - id: LDQ107
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [navigation, runtime-generation, dynamic-obstacles, blueprint]
    required_spine: false
    required: false
    title: Moving obstacles that update the NavMesh
    brief: "By default the NavMesh is built once in the editor and does not change during play. This means AI characters do not know when a door closes or a platform moves away. Unreal can update the NavMesh while the game runs, and it has different modes for this that cost different amounts of processing. In this quest you build a rotating gate and a sliding block, and compare how the NavMesh reacts to them in two runtime modes."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-how-to-modify-the-navigation-mesh-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/navigation-mesh-settings-in-the-unreal-engine-project-settings"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/modifying-the-navigation-mesh-preparation-guide-in-unreal-engine"
    checklist:
      - "Use a level with a NavMesh and one AI walker that moves between two spheres. Open Project Settings, go to Navigation Mesh, then Runtime, and set Runtime Generation to Dynamic Modifiers Only."
      - "Create an Actor Blueprint named BP_RotatingGate with a Cube (scale about X=4, Y=1.5, Z=1) and a Rotating Movement component. Place it on the route of the walker and click Simulate. Notice that the NavMesh does not change yet."
      - "Add a Nav Modifier component to BP_RotatingGate. Simulate again and watch the NavMesh update as the gate turns. The tiles that are being updated are shown in red."
      - "Create an Actor Blueprint named BP_SlidingBlock with a Sphere that moves back and forth. Drive it with a Timeline that uses Set Relative Location and a Lerp on X over a distance of about 1000."
      - "Simulate with Dynamic Modifiers Only. Then switch Runtime Generation to Dynamic and Simulate again. Compare how the NavMesh reacts to BP_SlidingBlock in each mode."
      - "Set the mode back to the one that your level really needs, and write down why."
    done_when: "Send a screenshot from Simulate that shows the NavMesh cut around the rotating gate, with the red rebuilt tiles visible. Add a text of 3 to 5 lines that says which mode you kept and why."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Which Runtime Generation mode is the default for a new project?"
        choices: ["Dynamic", "Dynamic Modifiers Only", "Static", "Streaming"]
        answer_index: 2
        explain: "By default the Navigation Mesh is Static. You must change the mode for it to update at runtime."
      - q: "You set Dynamic Modifiers Only and add a rotating cube Blueprint, but the NavMesh does not change. What is missing?"
        choices: ["A NavMeshBoundsVolume", "A Nav Modifier component on the Blueprint", "A Nav Link Proxy", "A Rotating Movement component"]
        answer_index: 1
        explain: "In Dynamic Modifiers Only mode, an actor changes the NavMesh only if it has a NavModifier component."
      - q: "What does Dynamic Modifiers Only NOT do at runtime?"
        choices: ["Change polygon costs", "Block areas", "Generate new Navigation Mesh surfaces", "Apply Navigation Links"]
        answer_index: 2
        explain: "In this mode only modifiers change the existing mesh (cost or blocked areas). No new NavMesh surfaces are generated at runtime."
      - q: "Why is Dynamic Modifiers Only cheaper than Dynamic, per the guide?"
        choices: ["It runs on the GPU", "It caches collision data, which can make affected tiles up to 50% cheaper to process", "It uses fewer tiles", "It disables pathfinding while objects move"]
        answer_index: 1
        explain: "The mode lets the NavMesh cache collision data, which can result in up to 50% cheaper processing of the affected tiles."
      - q: "In Dynamic mode, how much of the NavMesh is rebuilt when a navigation-relevant object moves?"
        choices: ["The whole level", "Only the tiles affected by the change", "Only the polygon under the object", "Nothing; Dynamic only changes costs"]
        answer_index: 1
        explain: "Dynamic mode updates the navigation data and performs generation only on the tiles affected by the change."
      - q: "During Simulate, which color shows tiles that are being regenerated?"
        choices: ["Green", "Blue", "Yellow", "Red"]
        answer_index: 3
        explain: "The guide notes that tiles being generated are displayed in red."
      - q: "The guide warns about its own moving-actor examples. What is the warning?"
        choices: ["They only work in packaged builds", "They force constant NavMesh regeneration, which has a high computational cost and is not best practice", "They break Nav Link Proxies", "They require C++"]
        answer_index: 1
        explain: "The examples force constant runtime generation, which is expensive. They are for demonstration only."
      - q: "Where is the Runtime Generation setting?"
        choices: ["Project Settings > Navigation Mesh > Runtime", "The Nav Modifier Volume Details panel", "World Settings > Lightmass", "Editor Preferences > Level Editor"]
        answer_index: 0
        explain: "Go to Settings > Project Settings, Navigation Mesh, Runtime section, Runtime Generation dropdown."
    flavors:
      _default: {why: "Doors, gates and moving platforms only work for AI if the NavMesh knows they moved, and each mode has a different cost."}
      gameplay_design: {why: "Dynamic obstacles are encounter tools: a closing gate can reroute a whole patrol.", do: "Trigger the gate from a Level Blueprint switch so the player can open or block the AI route on demand."}

  - id: LDQ108
    rank: 2
