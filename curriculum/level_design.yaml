    title: Flythrough sequence for level review
    brief: "Sequencer is the tool in Unreal for making camera shots and cutscenes, and a Level Sequence is the asset that stores them. A flythrough is a camera move that travels through the level and shows it in the order you want. Because it plays the same way every time, reviewers always see the space as you intended. In this quest you make a flythrough of your blockout with keyframes at four landmarks and with labelled marks on the timeline."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-make-movies-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/sequencer-cinematic-editor-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-camera-cut-track-in-unreal-engine"
    checklist:
      - "Click the cinematics icon in the main toolbar and choose Add Level Sequence. Name the sequence LS_Flythrough_Blockout."
      - "In Sequencer, click Create Camera. This makes a Cine Camera Actor and a Camera Cut Track, the track that decides which camera is shown."
      - "Enable Camera Lock on the Camera Cut Track, so that the viewport looks through the camera. Fly the camera to the entrance of your level and add a key for its transform at frame 0. A key stores a value at one point in time."
      - "Add keys for the camera at three more landmarks: the place where the route splits, the main arena, and the exit. Make each move between landmarks 3 to 5 seconds long."
      - "At each landmark, right-click the time bar and choose Add Mark. Give each mark a Label with the name of the landmark, and a Color."
      - "Move to the last key and press the ] hotkey to set the End Time of the sequence there. Play the sequence with looping turned on."
      - "Open the Curve Editor and smooth one camera move that looks too harsh."
    done_when: "Send a screenshot of Sequencer with LS_Flythrough_Blockout open. It must show the Camera Cut Track, at least four transform keys, and labelled colored marks on the time bar, and the viewport must look through the cine camera."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What must exist before you can open Sequencer?"
        choices: ["A Level Sequence asset", "A Cine Camera Actor", "A Movie Render Queue preset", "A Level Blueprint event"]
        answer_index: 0
        explain: "Sequencer requires a Level Sequence asset, saved in the Content Browser and referenced by a Level Sequence Actor in the level."
      - q: "What does the Create Camera button in the Sequencer toolbar do?"
        choices: ["Renders the sequence", "Creates a Cine Camera Actor and a Camera Cut Track that references it, if none exists", "Adds a mark", "Opens the Curve Editor"]
        answer_index: 1
        explain: "Create Camera makes a new Cine Camera Actor and creates a Camera Cut Track bound to it if one was not already there."
      - q: "What does enabling Camera Lock on the Camera Cut Track do?"
        choices: ["Prevents editing the sequence", "Locks the frame rate", "Deletes other cameras", "Makes the viewport look through the active camera"]
        answer_index: 3
        explain: "Camera Lock makes the viewport look through the active camera. Free viewport camera control is disabled while locked."
      - q: "Which hotkey sets the End Time of the sequence at the cursor?"
        choices: ["[", "]", "i", "m"]
        answer_index: 1
        explain: "] sets the end time, [ sets the start time, i and o set selection start and end, m adds a mark."
      - q: "What is a custom frame mark useful for?"
        choices: ["Cutting the video file", "Changing the frame rate", "Calling attention to or annotating points in the sequence", "Binding a camera"]
        answer_index: 2
        explain: "Marks are points you add to call attention to areas or annotate the sequence. They have a Label, Comment and Color."
      - q: "How do you zoom the timeline with the mouse wheel?"
        choices: ["Hold Shift and scroll", "Hold Ctrl and scroll", "Scroll with no key", "Hold Alt and scroll"]
        answer_index: 1
        explain: "Ctrl + scroll zooms. Shift + scroll pans left and right. Plain scroll pans up and down."
      - q: "Which key resets the zoom and timeline framing when you overextend?"
        choices: ["Home", "End", "Escape", "Space"]
        answer_index: 0
        explain: "Pressing Home resets the zoom and framing and also resets the bounds of the range slider."
