        answer_index: 0
        explain: "Pattern tiles one or more selected meshes along a Line, Grid or Circle, oriented on a movable 3D plane."
      - q: "What does the Duplicate tool in the Xform category create?"
        choices: ["An instance inside the same actor", "A Level Instance", "A Static Mesh asset only", "A new actor with a copy of the single selected mesh"]
