    quiz:
      - q: "What does a Level Snapshot record?"
        choices: ["Only the actor transforms", "Actors in the Outliner with their components and properties", "Material assets", "Console variables"]
        answer_index: 1
        explain: "A snapshot records all actors in the World Outliner and the state of their components and properties. Assets like materials are not recorded."
      - q: "What is the default name format of a new Level Snapshot?"
        choices: ["<level_name>_<username>_<time>", "Snapshot_<number>", "<date>_<level_name>", "<username> only"]
        answer_index: 0
        explain: "By default the new snapshot is named <level_name>_<username>_<time>. You can rename it and change the default pattern."
      - q: "When you restore a snapshot, what happens to actors added after it was taken?"
        choices: ["They are kept", "They are moved to a sublevel", "They are hidden", "They are removed from the level"]
        answer_index: 3
        explain: "Restoring reverts to the saved state: new actors are removed, removed actors are added back, transforms and properties are reverted."
      - q: "Which of these is NOT tracked by Level Snapshots?"
        choices: ["Static Mesh Actors", "Point Lights", "Landscapes", "Actor tags"]
        answer_index: 2
        explain: "Known limitations: Landscapes, USD actors and console variables are not tracked."
      - q: "You have snapshots for two levels. Why do you see only some of them in the window?"
        choices: ["The others are corrupt", "Only snapshots for the currently open level are shown", "They need to be re-imported", "The plugin limits you to five"]
        answer_index: 1
        explain: "Only Level Snapshots associated with the currently open Level are visible. Others show when you open their level."
      - q: "How do filters inside one Filter Group combine, and how do separate Filter Groups combine?"
        choices: ["AND inside a group, OR between groups", "OR inside a group, AND between groups", "Always AND", "Always OR"]
        answer_index: 0
        explain: "Multiple filters in the same group use AND. Adding more Filter Groups combines them with OR."
      - q: "A filter is set to Include and you negate it. What does it become?"
        choices: ["Do Not Care", "It stays Include", "It is disabled", "Exclude"]
        answer_index: 3
        explain: "Negating swaps Include and Exclude. Do Not Care stays Do Not Care."
