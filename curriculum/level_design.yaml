  - id: LDQ120
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [collab-viewer, review, annotations]
    required_spine: false
    required: false
    title: Review session in the Collab Viewer
    brief: "The Collab Viewer is a project template from Epic for looking at a 3D space together with other people. Several people can join the same session, walk around, measure distances, and leave notes in the world. A shared walk like this is the closest thing to standing in the level together. In this quest you package the template as a program, run a review session, add measurements and notes, and save the session."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/collab-viewer-template-quick-start-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/annotating-in-the-collab-viewer-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/measuring-in-the-collab-viewer-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/saving-and-loading-a-session-in-unreal-engine"
    checklist:
      - "Create a new project from the Collab Viewer template and open it in the editor."
      - "Package the project for Windows into a folder named CollabReview. To do this, open the Platforms menu, choose Windows, and click Package Project."
      - "Run the packaged .exe file. Enter a display name and start with Host a session, or with Single Session if you are alone."
      - "Press Spacebar to open the menu, choose Measurement, then Add, and measure a doorway. Hold Shift when you place the second point to snap the line to an axis."
      - "Choose Annotation, then Annotate Text, and place three labels with review notes. Then paint one stroke around a problem area."
      - "Use the Save button to save the session as Review_01. Quit the program and start it again, and then load Review_01 from the menu next to Save."
      - "Optional: ask one member to join your session on the same network and add one note."
    done_when: "Send a screenshot from the packaged Collab Viewer that shows one measurement with its value, at least three text labels, one paint stroke, and the loaded session name Review_01. Add one line that says if a second person joined."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Why does everyone in a shared session need the same packaged .exe?"
        choices: ["For licensing", "Because the 3D models are compiled into the package and are not replicated between users", "Because the server checks file dates", "Because VR needs it"]
        answer_index: 1
        explain: "The level content is not replicated automatically. It is compiled into the packaged application, so all users need the same version."
      - q: "What is the difference between Host a session and Single Session?"
        choices: ["Single Session has no VR", "There is no difference", "Host a session is view-only", "Single Session gives the same experience but is not visible to others on the network"]
        answer_index: 3
        explain: "Single Session is the same runtime experience as hosting, except your application does not become visible to others on the network."
      - q: "Which key opens the Interaction Menu in desktop mode?"
        choices: ["Tab", "Spacebar", "Escape", "M"]
        answer_index: 1
        explain: "Press Spacebar to open the Interaction Menu, which holds Xray, Bookmarks, Transform, Measurement, Annotation and more."
      - q: "How do you snap a measurement to the x, y or z axis?"
        choices: ["Hold Ctrl when placing the first point", "Press Tab after measuring", "Hold Shift when releasing the mouse on the second point (desktop only)", "Snapping is automatic"]
        answer_index: 2
        explain: "Hold Shift as you release the mouse button to place the second end point. This option is only available in desktop mode."
      - q: "You need to measure from an object hidden behind another. What do you use first?"
        choices: ["Xray > Apply on the objects in the way", "Delete the objects", "Teleport inside", "Paint Stroke"]
        answer_index: 0
        explain: "Before measuring, use Xray > Apply on the obscuring objects, then pick your end point on the hidden object."
      - q: "Where are saved sessions stored?"
        choices: ["In the project's Content folder", "In YourProjectName/Saved/SaveGames", "On the host's server only", "In the Windows Documents folder"]
        answer_index: 1
        explain: "Each participant saves sessions in their own local copy, in the YourProjectName/Saved/SaveGames sub-folder."
      - q: "Which of these is NOT saved in a session?"
        choices: ["Annotations", "Measurements", "The positions of the participants", "Xray transparency state"]
        answer_index: 2
        explain: "Sessions save annotations, measurements, Xray state, 3D cut sections and transformed items. Participant positions and rotations are not saved."
      - q: "How can you tell a Walk-mode user from a Fly-mode user in the session?"
        choices: ["Walk users have a human-shaped avatar; other modes show a camera", "Walk users are red", "Fly users have no name", "You cannot tell"]
        answer_index: 0
        explain: "Users in Walk and VR modes have a human-shaped avatar. Users in other navigation modes are shown as a camera."
    flavors:
      _default: {why: "A shared walk with notes and measurements is the closest thing to standing in the level together."}
      lookdev: {why: "Art reviews benefit from Xray and measuring on real scale.", do: "Save one session with Xray applied to the walls to review the layout underneath."}
      cinematics: {why: "Bookmarks in the viewer are like camera setups for reviewers.", do: "Teleport to a preset Bookmark and annotate the framing you want."}
