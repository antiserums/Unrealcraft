      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/water-system-in-unreal-engine"
    checklist:
      - "Open Edit > Plugins, enable the Water plugin, and restart the editor. Use a Landscape that has Enable Edit Layers checked, because the water needs this to change the terrain."
      - "From the Place Actors panel, drag a Water Body Lake into a low area. Move its spline points to shape the lake, and watch the terrain carve itself under the water."
      - "Drag in a Water Body River and lay it from the lake up a slope. Give the spline points different heights so that the river runs downhill into the lake."
      - "Select one spline point of the river and set its River Width, Depth and Velocity. Then right-click the spline and enable Visualize Water Velocity."
      - "In the Content Browser, right-click, open Water, and choose Water Waves to create an asset. Name it WW_Calm. In it, lower Max Amplitude and set Num Waves to 8."
      - "Select the lake and assign WW_Calm to its Water Waves Asset slot. Compare how the lake looks now with how it looked with the default asset."
      - "Start Play In Editor and walk into the lake to see the underwater post-process, the visual effect that appears when the camera is under water."
    done_when: "Send one screenshot of the river flowing into the lake with the velocity arrows visible, and one screenshot of your WW_Calm asset editor with Num Waves and Max Amplitude visible."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which Water Body type allows its spline points to have different heights?"
        choices: ["Lake", "Ocean", "River", "Island"]
        answer_index: 2
        explain: "Lakes and oceans keep all spline points at the same height. Rivers allow varying heights, so a river can run downhill."
      - q: "How do rivers drive the motion of their water surface?"
        choices: ["With Gerstner waves from the Water Waves asset", "With velocity values on the spline points, written to a flow map", "With a Niagara system", "They do not move"]
        answer_index: 1
        explain: "Rivers do not use waves. Each spline point has a velocity, and this is written to a flow map that moves the water along the spline."
      - q: "A lake does not carve the landscape under it. What is the most likely cause?"
        choices: ["The Landscape does not have Enable Edit Layers checked", "The lake needs more than 4 spline points", "The Water plugin has no terrain support", "The lake is too small"]
        answer_index: 0
        explain: "Water bodies carve terrain with a Landscape Brush. That brush only works when the Landscape has Enable Edit Layers checked."
      - q: "From the ground you can see a gap between the end of your Ocean Water Body and the horizon. What fills it cheaply?"
        choices: ["A second Ocean Water Body", "A bigger Cell Size", "The Far Distance Mesh of the Water Zone actor", "A Post Process Volume"]
        answer_index: 2
        explain: "The Water Zone actor has a Far Distance Mesh with a simple material. It fills the gap to the horizon at lower cost than the full water mesh."
      - q: "What is the trade-off when you lower Num Waves in a Water Waves asset?"
        choices: ["Better performance, but less variation in the waves", "The waves get taller", "Rivers stop flowing", "The lake stops carving terrain"]
        answer_index: 0
        explain: "By default 16 waves are summed. Fewer waves is more performant but gives less variation in how waves collide."
      - q: "What is the purpose of an Island Water Body?"
        choices: ["To render a small ocean", "To raise the landscape inside its spline so that land stays above water", "To block the player from swimming", "To add caustics"]
        answer_index: 1
        explain: "Islands only affect the landscape under them. Their terraforming is applied after all other water bodies to keep that land above water."
    flavors:
      _default: {why: "Water shapes the map. A river is a path, a lake is a barrier, and both tell the player where they are."}
      level_design: {why: "Rivers and lakes carve the terrain for you, so you can block out routes and barriers fast, and the flow direction is a natural guide.", do: "Add a Water Body Island to keep a small piece of land above the lake as a goal for the player."}
      lookdev: {why: "The Water Waves asset controls the macro look of the surface; the material handles the fine detail."}
      cinematics: {why: "Calm and rough wave assets change the mood of a shot without touching lighting."}

  - id: LDQ52
