        answer_index: 2
        explain: "Fly means the pawn can fly. Ghost means the pawn no longer collides with the world and can fly. God is the separate invulnerability cheat."
      - q: "Which stat command lists all the other stat commands?"
        choices: ["stat Help", "stat List", "stat Quick", "stat Engine"]
