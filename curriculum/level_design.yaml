    subjects: [blueprint, triggers, pacing, flow-control]
    required_spine: false
    required: false
    title: Pacing beats with reusable trigger actors
    brief: "A pacing beat is a moment in a level where something changes for the player, for example a light turns on, a sound plays or a door opens. Beats are usually started by trigger boxes that the player walks through. If a beat fires at the wrong time, fires twice, or does not fire at all, the pacing you planned is broken. In this quest you build one reusable trigger actor and place it three times, with rules for how often and in which order the beats may fire."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/trigger-volume-actors-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/volume-actors-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/flow-control-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/custom-events-in-unreal-engine"
    checklist:
      - "Create an Actor Blueprint named BP_PacingBeat with a Box Collision component. Add a Name variable called BeatName and turn on Instance Editable, so you can set it for each copy in the level. Add a Boolean variable called FireOnce with the default value true."
      - "On the event On Component Begin Overlap, check that the other actor is the player, and then run the execution through a DoOnce node, which lets it pass only one time. Add a Branch on FireOnce, so that the DoOnce can be reset when FireOnce is false."
      - "Add a Custom Event named FireBeat with one String input, and call it from the DoOnce. Inside FireBeat, use Print String to print the BeatName, and change one thing in the level: toggle a Point Light, play a sound, or open a door."
      - "Place three BP_PacingBeat actors along the route of your blockout and name them Beat_Calm, Beat_Tension and Beat_Reveal. Scale each box so that it covers the whole width of the corridor and the player cannot walk around it."
      - "Add a Gate node in front of the action of Beat_Reveal, so that it stays closed until Beat_Tension has fired. To do this, call Open on the gate from Beat_Tension. Test that Beat_Reveal does nothing when you skip Beat_Tension."
      - "Play in PIE and walk the route in order. Then walk it out of order. Check that the log shows the beats in the right order and that nothing fires twice."
    done_when: "Send a screenshot of the level with the three BP_PacingBeat boxes visible and the Output Log showing the three beat names printed in order. Add a short note of 3 lines that says what each beat changes for the player."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "According to the Trigger Volume Actors page, what is the main difference between the default Box, Capsule and Sphere triggers?"
        choices: ["Only the shape of their area of influence", "Which Blueprint events they can fire", "Whether they work in PIE or only in packaged builds", "How much damage they cause"]
        answer_index: 0
        explain: "The page says all default Triggers are generally the same, and differ only in the shape of the area used to detect overlaps."
      - q: "With a Trigger selected in the Viewport, how does the page say you add its overlap event to the Level Blueprint?"
        choices: ["Drag the Trigger into the Event Graph and pick Cast To", "Right-click in the Event Graph and choose an event under Add Event for [Trigger Actor Name]", "Open the Trigger's own Blueprint and add Event BeginPlay", "Press Ctrl+E in the Viewport"]
        answer_index: 1
        explain: "The page shows right-clicking in the Level Blueprint Event Graph and choosing an event under Add Event for the selected Trigger."
      - q: "Your Trigger Volume does not fire when the player walks through it. Which check does the Volume Actors page tell you to make first?"
        choices: ["That the volume has a visible mesh", "That the level has a Player Start", "That the volume's collision settings use the Overlap response for the intended actors", "That the volume is scaled larger than 1000 units"]
        answer_index: 2
        explain: "The page reminds you to check the collision settings so the trigger reacts to the intended Actors with the Overlap collision response."
      - q: "What does the DoOnce node do after it has fired one time?"
        choices: ["It fires again every frame", "It destroys the owning actor", "It fires only when the player leaves the volume", "It stops all outgoing execution until a pulse is sent to its Reset input"]
        answer_index: 3
        explain: "The Flow Control page says DoOnce fires once and then ceases outgoing execution until Reset is pulsed. It equals a DoN node with N = 1."
      - q: "A Gate node's Enter pin receives pulses. When do those pulses leave the Exit pin?"
        choices: ["Only when the gate is currently open", "Always, the Open and Close pins only change a boolean output", "Only on the first pulse after Reset", "Only when Start Closed is true"]
        answer_index: 0
        explain: "The gate's open or closed state decides whether Enter pulses pass out of Exit. Closed means the Exit pin does nothing."
      - q: "You want Beat_Reveal to change several things: a light, a sound and a message. You use a Sequence node with three outputs. How are they called?"
        choices: ["In random order with a one-frame delay between each", "All in order, as soon as the node receives input, with no delay", "Only the first output, the rest need a Reset", "One per frame, so they finish three frames later"]
        answer_index: 1
        explain: "The Sequence node calls all outputs in order, without any delay, so to a user they appear to happen at the same time."
      - q: "Why does the Volume Actors page say the player needs a hint such as a fire effect inside a Pain-Causing Volume?"
        choices: ["Because volumes cannot cause damage without a particle effect", "Because the effect increases the damage per second", "Because a Volume is completely invisible at runtime, so the player cannot see it", "Because PIE hides all volumes but packaged builds show them"]
        answer_index: 2
        explain: "Volumes have no visual representation at runtime. Without a hint the player does not know why they take damage."
      - q: "You changed the number of inputs on your FireBeat Custom Event and now every node that calls it shows an error. What does the Custom Events page say to do?"
        choices: ["Delete the Custom Event and make a Function instead", "Rename the event so the callers find it", "Restart the editor to rebuild the Blueprint cache", "Refresh the nodes that call it (Refresh Nodes or File > Refresh All Nodes)"]
        answer_index: 3
        explain: "The page says changing input parameters breaks calling nodes on compile, and you must refresh them, one by one or with Refresh All Nodes."
    flavors:
      _default: {why: "A beat that fires at the wrong time, twice, or not at all breaks the pacing you planned on paper."}
      level_design: {why: "Reusable beat actors let you retime a level by moving boxes instead of rewriting the Level Blueprint.", do: "Write the intended beat order in a Text Render next to each box so a teammate can read the pacing plan in the viewport."}
      gameplay_design: {why: "The same trigger pattern drives tutorials, ambushes and scripted reveals.", do: "Add a second Custom Event OnBeatReset that reopens the DoOnce so a designer can retest a beat without restarting PIE."}

