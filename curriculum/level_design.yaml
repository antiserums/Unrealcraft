    title: "Static, Stationary or Movable?"
    brief: "Every light in Unreal has a Mobility setting with three options. A Static light cannot change at all during play, a Stationary light stays in place but can change its color and brightness, and a Movable light can do everything but costs the most. Mobility decides both how expensive a light is and what you can do with it in gameplay. In this quest you find and fix a common problem, too many Stationary lights that overlap, and you explain your choice for each kind of light."
