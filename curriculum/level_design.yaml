      - q: "Tools like Extrude Polygon draw on a grid. How do you move that grid?"
        choices: ["Ctrl + Click the desired location", "Press G and move the mouse to the place", "Use the Pattern plane of the Xform tools", "Change the Project Settings grid size"]
