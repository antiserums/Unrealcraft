        explain: "A graph must set Compatible Tool Tags to appear in the graph dropdown of a matching tool. Draw Spline uses the SplineTool tag."
      - q: "You want a field of grass filled inside a closed area you draw. Which PCG mode tool fits?"
        choices: ["Draw Spline", "Paint", "Volume", "Draw Spline Surface"]
        answer_index: 3
        explain: "Draw Spline Surface defines a spline-bound closed area and the graph populates the interior. Examples are fields, cornrows and grass. It uses the SplineSurfaceTool tag."
      - q: "While using the Paint tool, what happens when you hold Shift?"
        choices: ["The brush becomes red and removes points", "The brush paints on a second data instance", "The brush ignores the landscape", "The tool switches to Volume"]
        answer_index: 0
        explain: "The Paint tool creates points where raycasts hit physical objects. Holding Shift turns the brush red and removes points instead."
      - q: "The Volume tool button is greyed out. Why?"
        choices: ["Volume tools need a Landscape in the level", "The Volume tool is only available in PIE", "The selected actor is not a volume and has no box component", "The graph has the PaintTool tag"]
        answer_index: 2
        explain: "The Volume tool is disabled unless the selected actor is a volume or has a box component. Tool buttons are disabled when the selection is not the correct class for the graph."
      - q: "You start a PCG mode tool with no actor selected. What does the tool do?"
        choices: ["It shows an error and stops", "It adds a PCG component to the PCGWorldActor", "It creates a new actor to perform the operation, based on the selected graph or preset", "It waits until you click an actor"]
        answer_index: 2
        explain: "If an actor is selected the tool adds a PCG component to it if needed. If no actor is selected, an actor is created for the operation, using the Actor Class to Spawn from the graph settings."
      - q: "In the PCG graph, you set the Spline Sampler to sample inside the spline area, but nothing appears. What is the likely reason?"
        choices: ["The spline must be closed to sample inside it", "Spline Sampler only works on Landscape Splines", "You need a Volume Sampler first", "The spline has too many points"]
        answer_index: 0
        explain: "The Spline Sampler can sample directly on the curve or in the spline volume. Sampling inside the spline requires the spline to be closed."
      - q: "What does the Raycast Rule 'Ignore PCG Components' do?"
        choices: ["Hides all PCG debug points", "Deletes PCG components on the selected actor", "Stops the graph from generating at runtime", "Rejects interaction on components that PCG created, so you do not draw on top of generated meshes"]
        answer_index: 3
        explain: "Raycast Rules control how the tools interact with the world. Ignore PCG Components rejects hits on PCG-created components, so your spline lands on the real ground or meshes."
      - q: "In the fence generator guide, the grammar is set to A*. What does this mean?"
        choices: ["Spawn exactly one A module", "Place an A module, then keep filling the spline with A modules as long as there is room", "Spawn A modules only at spline control points", "Spawn a random module for every point"]
        answer_index: 1
        explain: "The guide sets the Grammar parameter to A*. This places an initial static mesh and then fills the rest of the spline with static meshes as long as there is room. The Static Mesh Spawner then picks meshes By Attribute named Mesh."
    flavors:
      _default: {why: "Splines plus PCG turn a fence, wall or barrier into something you draw, not place piece by piece."}
      level_design: {why: "You can redraw a boundary in seconds when the route changes during playtests.", do: "Add a post mesh as a second entry and compare readability of the boundary at distance."}

  - id: LDQ99
    rank: 2
    difficulty: adept
    track: level-design
    subjects: [pcg, density, filters, keep-out]
    required_for_majors: []
    taster_for_majors: []
    adjacent_for: [lookdev, gameplay_design]
    required_spine: false
    elective: true
    title: "Keep-out zones: density, filters, pruning"
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-content-generation-framework-node-reference-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-content-generation-framework-data-types-reference-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-content-generation-overview"
    checklist:
      - "Create PCG_Scatter_Route. Start with Get Landscape Data -> Surface Sampler."
      - "Place two Volumes with the tag KeepOut over your main route. In the graph add Get Volume Data (Actor Filter by tag KeepOut)."
      - "Add a Difference node: Source = sampler points, Differences = the volumes. Set Density Function to Binary."
      - "Add Density Noise, then a Density Filter that keeps only points between 0.5 and 1.0."
      - "Add Self Pruning with Large to Small. Add a Bounds Modifier before it and test how the bounds change the pruning."
      - "Finish with a Static Mesh Spawner using two bush meshes. Generate and check the route stays clear in PIE."
    done_when: "One screenshot of the graph with the Difference, Density Filter and Self Pruning nodes visible, and one viewport screenshot showing the empty keep-out corridor with bushes around it."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "The Density Filter node is described as superseded by Attribute Filter. When should you still use Density Filter?"
        choices: ["Never, it is deprecated and will fail", "Only in runtime generation", "When performance is a major concern or when it shows the intent of the graph more clearly", "Only when the input is an Attribute Set"]
        answer_index: 2
        explain: "Density Filter is more specialised and more efficient than Attribute Filter. Use it when performance matters or when it makes the graph easier to read."
      - q: "What does Self Pruning do?"
        choices: ["Deletes points outside the actor bounds", "Removes intersections between points in the same point data, with a priority such as Large to Small", "Merges all points into one point", "Removes points that have no static mesh"]
        answer_index: 1
        explain: "Self Pruning removes overlapping points within one point data, prioritised by the settings. Randomized pruning can be used for similar radii so patterns do not appear."
      - q: "In a Difference node with Density Function set to Binary, what is the final density of a source point that overlaps a difference shape?"
        choices: ["0", "The source density minus the difference density", "1", "The average of both"]
        answer_index: 0
        explain: "Binary sets the final density to 0 when the difference density is greater than zero. Otherwise it keeps the source density. This gives a hard keep-out edge."
      - q: "With Density Function Minimum on a Difference node, how is final density computed?"
        choices: ["Source density plus max difference density", "Source density minus the sum of all difference densities, clamped", "Always 0 inside the difference", "Source density minus the max density of all the differences"]
        answer_index: 3
        explain: "Minimum gives source density minus the maximum density of all differences. Clamped Subtraction instead subtracts the sum of the difference densities and clamps to 0 to 1."
      - q: "You want bushes near the road to be smaller than bushes far away. Which node gives you that gradient?"
        choices: ["Gather", "Distance, which computes the distance to the nearest point in a second input", "Mutate Seed", "Combine Points"]
        answer_index: 1
        explain: "Distance calculates, for each point, the distance to the nearest point in the second input. The docs give the example of tweaking tree scale on forest edges or near a stream."
      - q: "Which node would you use to remove points on steep slopes?"
        choices: ["Density Remap", "Split Points", "Apply Scale to Bounds", "Normal To Density, which sets density from the point normal like a dot product"]
        answer_index: 3
        explain: "Normal To Density computes density from the point normal against a chosen direction. The docs name removing trees on steep inclines as a typical use."
      - q: "Why place a Bounds Modifier before Self Pruning?"
        choices: ["Changing point bounds changes what counts as an intersection, so it tweaks the final pruning result", "Self Pruning does not work without it", "It converts points to a volume", "It resets the seeds"]
        answer_index: 0
        explain: "Bounds Modifier changes the bounds property on points. The docs say this is useful before Self Pruning, Intersections or Differences to tweak the final result."
      - q: "Select Points is set to a ratio of 0.5 on 200 points. What do you get?"
        choices: ["Exactly 100 points every time", "The first 100 points in order", "Approximately 100 points, with no guarantee of the exact number", "100 points with density 0.5"]
        answer_index: 2
        explain: "Each point is selected independently with the given probability. A ratio of 0.5 gives about half the points, but not exactly half."
    flavors:
      _default: {why: "Procedural scatter is only useful if it respects the spaces the player needs."}
      level_design: {why: "Keep-out volumes let you scatter freely and still keep routes, cover and sightlines clean.", do: "Tag a third volume LowDensity and use a Density Remap there instead of a full cut."}

  - id: LDQ100
    rank: 2
    difficulty: adept
    track: level-design
    subjects: [pcg, landscape, landscape-layers, biomes]
    required_for_majors: []
