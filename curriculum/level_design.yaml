  - id: LDQ81
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [world-partition, streaming, open-world, performance]
    required_spine: false
    required: false
    title: Tune the runtime grid
    brief: "World Partition splits a large world into a grid of cells and loads only the cells near the player. Two settings control this: Cell Size is how big each cell is, and Loading Range is how far around the player cells are loaded. Together they decide how far the player can see and how much memory the world uses. In this quest you read these settings, change them, and watch the effect on a long line of cubes."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/dynamic-loading-range-scaling-in-unreal-engine"
    checklist:
      - "Open a World Partition level (File > New Level and then Open World works) and save it as L_WP_Grid. Place 30 cubes in a straight line, one every 50 m, so that the line is about 1.5 km long. Add a Player Start at one end."
      - "Open World Settings and find World Partition Setup. Turn on Preview Grids. Write down the Grid Name, Cell Size and Loading Range of the default grid."
      - "Start Play In Editor. Open the console and run wp.Runtime.ToggleDrawRuntimeHash2D, which draws a small map of the cells. Count how many cells are loaded around the player and take a screenshot."
      - "In the same session, run wp.Runtime.OverrideRuntimeSpatialHashLoadingRange -grid=0 -range=25600. Watch how many cells are loaded now and take a second screenshot."
      - "Stop the game. In World Settings, set Loading Range to half of its old value. Play again and walk along the line of cubes. Note the moment when cubes appear."
      - "Select two cubes far from the start and set their Runtime Grid property to None on purpose. Then turn off Is Spatially Loaded on one of them. Play and check which of the two is always there."
      - "In World Settings, go to World Partition and then Advanced, and enable Dynamic Loading Range Scaling. Set Initial to 25 percent, Delay to 2 seconds and Duration to 10 seconds. Start Play In Editor and watch the loaded area grow during the first seconds."
    done_when: "Send two Play In Editor screenshots with wp.Runtime.ToggleDrawRuntimeHash2D turned on: one at the default Loading Range and one with the override. Add three lines: the Cell Size you chose, the Loading Range you chose, and what the player saw with the smaller range."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "In the World Partition Setup, what does Loading Range control?"
        choices: ["The draw distance of HLOD meshes", "The number of grids in the world", "The size of each grid cell", "The range from a streaming source inside which cells are loaded"]
        answer_index: 3
        explain: "Loading Range is the distance around a streaming source where cells load. Cell Size is a separate setting for the size of each cell."
      - q: "An actor has Runtime Grid set to None. What happens?"
        choices: ["The actor is placed in the HLOD grid", "The actor is never loaded", "The actor is always loaded", "The partition system chooses the grid for it"]
        answer_index: 3
        explain: "The page says: if Runtime Grid is None, the grid will be chosen by the partition system. None does not mean unloaded."
      - q: "You add a second runtime grid for big props. What does Epic warn about this?"
        choices: ["Only one grid can have HLODs", "A second grid disables One File Per Actor", "Using more than one grid can negatively impact performance", "Two grids cannot share streaming sources"]
        answer_index: 2
        explain: "A 2D Runtime Hash grid is provided by default, and the documentation states that using more than one grid can negatively impact performance."
      - q: "What does wp.Runtime.OverrideRuntimeSpatialHashLoadingRange -grid=0 -range=25600 do?"
        choices: ["Sets the cell size of grid 0 to 25600 units", "Sets the runtime loading range of grid 0 to 25600 units for this session", "Saves a new Loading Range into World Settings", "Limits the number of cells that load at once to 25600"]
        answer_index: 1
        explain: "This console command overrides the runtime loading range. -grid picks the grid index and -range gives the new loading range. It is a runtime override, not a saved setting."
      - q: "Which console command limits how many World Partition cells can load at the same time?"
        choices: ["wp.Runtime.MaxLoadingLevelStreamingCells", "wp.Runtime.ToggleDrawRuntimeHash3D", "wp.Runtime.ShowRuntimeSpatialHashGridIndex", "wp.Runtime.HLOD 0"]
        answer_index: 0
        explain: "wp.Runtime.MaxLoadingLevelStreamingCells limits the number of concurrent loading streaming cells. The others are debug display commands."
      - q: "What does Block on Slow Streaming do?"
        choices: ["Blocks loading in situations where grid cells are not loading fast enough", "Makes every cell load at start", "Turns off streaming in the editor", "Stops all streaming while the game is paused"]
        answer_index: 0
        explain: "Block on Slow Streaming is a runtime grid setting that blocks when cells are not loading fast enough, so the player does not run into unloaded space."
      - q: "Dynamic Loading Range Scaling is enabled with Initial set to 100 percent. What is the effect?"
        choices: ["PIE starts with nothing loaded", "The feature is effectively still disabled", "Cooked builds also load faster", "The loading range doubles"]
        answer_index: 1
        explain: "At 100 percent the initial range equals the full range, so nothing changes. The feature is editor-only and only affects PIE, never cooked builds."
      - q: "Why does Epic tell you to avoid an Initial Dynamic Loading Range Scaling of 0 percent?"
        choices: ["It makes the build fail", "It disables the streaming sources", "Your pawn can fall through geometry that is not loaded yet", "It deletes the runtime grid"]
        answer_index: 2
        explain: "With 0 percent almost nothing is loaded when PIE starts, so the ground under the pawn may not exist yet and the pawn can fall through."
    flavors:
      _default: {why: "Cell Size and Loading Range decide how far the player can see and how much memory the world uses. A designer must know how to read and change them."}
      level_design: {why: "You pick loading ranges by where the player can look and how fast they move.", do: "Test the grid with the fastest vehicle or sprint speed you plan to ship."}
      lookdev: {why: "Pop-in of props is often a loading range problem, not an LOD problem.", do: "Note which cubes popped in at the smaller range and how far they were."}

  - id: LDQ82
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [world-partition, streaming, blueprint, open-world]
    required_spine: false
    required: false
    title: Preload a teleport target
    brief: "In a World Partition level, only the area around the player is loaded. If you teleport the player to a far place, that place is not loaded yet, and the player may fall through a floor that does not exist. A streaming source is something that tells World Partition to load the cells around it, and you can add one as a component to any actor. In this quest you use a streaming source to load a teleport target before the player arrives."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition-in-unreal-engine"
    backup_url: null
    extra_urls: []
    checklist:
      - "In a World Partition level with streaming enabled, build two small platforms about 2 km apart: Pad_A near the Player Start and Pad_B far away. Put a few cubes and a light around Pad_B, so that you can see when it is loaded."
      - "Make an Actor Blueprint named BP_StreamAnchor and add a World Partition Streaming Source component to it. Turn Streaming Source Enabled off, set Target State to Activated, and pick a Debug Color. Place one anchor on Pad_B."
      - "Make an Actor Blueprint named BP_TeleportPad with a Box collision. Add two editable variables: Destination of the type Actor, and Anchor of the type BP_StreamAnchor. Place it on Pad_A and set both variables."
      - "On Begin Overlap by the player, call Enable Streaming Source on the component of the Anchor. Then start a looping timer of 0.2 seconds that checks Is Streaming Completed. When it returns true, use Set Actor Location to move the player to the Destination, and then call Disable Streaming Source."
      - "Start Play In Editor and run wp.Runtime.ToggleDrawRuntimeHash2D. Step on Pad_A and watch the cells load around Pad_B before you jump. Take a screenshot while both areas are loaded."
      - "Now test the wrong way: disconnect Enable Streaming Source so that you teleport at once. Write down what you see at Pad_B in the first second."
      - "Open the anchor and set Priority to 10. Read the tooltips of Shapes and Target Grid, and write one line that says when you would use each."
    done_when: "Send a screenshot of the event graph of BP_TeleportPad, and a Play In Editor screenshot where the runtime hash debug view shows loaded cells at both pads. Add two lines that say what happened when you teleported without the anchor."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which of these is a streaming source by default, without adding any component?"
        choices: ["Every Static Mesh Actor", "Each Player Controller", "The World Settings actor", "Every Location Volume"]
        answer_index: 1
        explain: "Each Player Controller is a World Partition streaming source through its Enable Streaming Source option, which is on by default."
      - q: "What is the documented use case for a World Partition Streaming Source component?"
        choices: ["Loading cells at a teleport destination before the player arrives", "Baking HLODs faster", "Replacing Level Streaming Volumes in sublevels", "Making an actor always loaded"]
        answer_index: 0
        explain: "The example on the page activates a streaming source where the player will teleport, waits for the cells to load, teleports, then deactivates the source."
      - q: "The anchor's Shapes list is empty. What shape does the source use?"
        choices: ["A sphere with a radius equal to the grid loading range", "The bounds of the actor's mesh", "A box the size of one cell", "No shape, so it loads nothing"]
        answer_index: 0
        explain: "If Shapes is empty, the component uses a sphere whose radius equals the grid loading range. Shapes lets you build a custom shape instead."
      - q: "One cell is inside two streaming sources: one with Target State Loaded and one with Target State Activated. What state does the cell get?"
        choices: ["Loaded, because it is the safer state", "Activated, because the highest target value wins", "The state of the source that was enabled first", "Unloaded, because the sources conflict"]
        answer_index: 1
        explain: "When a cell intersects several sources, the target state is the highest value, and Activated is greater than Loaded."
      - q: "Which Blueprint function tells you the source has finished loading the cells it touches?"
        choices: ["Enable Streaming Source", "Load Stream Level", "Is Streaming Completed", "Get Streaming Level"]
        answer_index: 2
        explain: "Is Streaming Completed returns true when the component has finished streaming the grid cells it intersects. Enable and Disable Streaming Source only switch the source on and off."
      - q: "After the teleport, the old cells around Pad_A unload. Why?"
        choices: ["Because Disable Streaming Source unloads the whole world", "Because Target State was Loaded", "Because the timer was cleared", "Because there is no longer a streaming source at the old location"]
        answer_index: 3
        explain: "Cells stay loaded only while a streaming source is in range. Once the player is gone and the anchor is disabled, nothing keeps those cells loaded."
      - q: "What does the Priority setting on a streaming source decide?"
        choices: ["How many cells can load per frame", "Which source teleports the player", "The loading range of the source", "Which source's priority a cell gets when several sources overlap it, the highest one"]
        answer_index: 3
        explain: "If a cell intersects multiple sources, its priority is the highest priority among all of them. Priority does not change range or cell count."
      - q: "What does Target HLOD Layer on the component do?"
        choices: ["Sets the HLOD material", "Builds HLODs when the source is enabled", "Determines the HLOD Layer affected by this streaming source", "Turns HLODs off around the source"]
        answer_index: 2
        explain: "Target HLOD Layer chooses which HLOD Layer this source affects, next to Target Grid which chooses the streaming grid."
    flavors:
      _default: {why: "Teleports, fast travel and cutscene jumps all break if the destination is not loaded yet. A streaming source fixes that."}
      level_design: {why: "You decide where players jump. You must also decide what loads first.", do: "Add a short fade or door animation that covers the wait for Is Streaming Completed."}
      gameplay_design: {why: "Fast travel systems need a load-before-move step.", do: "Expose the wait as a loading bar in a simple widget."}

  - id: LDQ83
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [level-instancing, world-partition, data-layers, workflow]
    required_spine: false
    required: false
    title: Twelve camps from one Level Instance
    brief: "Big worlds repeat content, such as camps, houses or checkpoints. A Level Instance saves a group of actors as its own small level that you can place many times, and when you edit one copy, every copy is updated. In a World Partition level these copies also load and unload like normal actors. In this quest you build one camp, place it twelve times, edit all of them at once, and put some of them on a Data Layer."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-instancing-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition---data-layers-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-editor-context-in-unreal-engine"
    checklist:
      - "In a World Partition level, build a small camp from 6 blockout meshes, one Point Light and one Trigger Box. Select all of them, right-click, open Level, and choose Create Level Instance. Keep External Actors on, set Pivot Type to Center Min Z, and save it as LI_Camp."
      - "Copy LI_Camp until you have 12 camps spread over about 2 km. Check the Outliner: the actors of each camp are children of its Level Instance Actor, and you cannot select them on their own."
      - "Edit one camp (right-click, open Level, then choose Edit). Look at the Actor Editor Context widget in the bottom-right of the viewport, which shows what you are editing. Add a barrel mesh and click Commit Changes. Confirm that all 12 camps got the barrel."
      - "Make a Runtime Data Layer asset named DL_Camps, and make an instance of it in the Data Layer Outliner. Assign 4 of the camps to DL_Camps. Click the eye icon and confirm that the whole camp, including the light and the trigger, follows the layer."
      - "Start Play In Editor and run wp.Runtime.ToggleDrawRuntimeHash2D. Walk away from a camp until its cell unloads, and then come back. Notice that the camp streams like normal actors, which is called Embedded Mode."
      - "Select one camp and use Break Level Instance. Read the warning. Write down what stayed in the Content Browser and what changed in the level."
      - "Write 3 lines: when you would use a Level Instance, when you would use a Packed Level Actor, and why a Level Instance without OFPA (One File Per Actor) streams differently."
    done_when: "Send a screenshot of the Outliner with 12 LI_Camp actors and the Data Layer Outliner showing DL_Camps with 4 camps, and add your 3 lines of text."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which type does Epic recommend for static buildings and dense visual setups?"
        choices: ["Level Instance", "Packed Level Blueprint", "Location Volume", "Always Loaded sublevel"]
        answer_index: 1
        explain: "Packed Level Blueprints combine static meshes into one optimized Blueprint Actor and are recommended for static buildings and dense visual setups. Level Instances suit points of interest and gameplay setups."
      - q: "What does Embedded Mode do with a Level Instance that uses One File Per Actor at runtime?"
        choices: ["Streams it as a separate sublevel", "Keeps it as one actor forever", "Discards the instance and adds its actors to the World Partition grid", "Converts it into a Packed Level Actor"]
        answer_index: 2
        explain: "In Embedded Mode the Level Instance exists only in the editor. At runtime its OFPA actors are added directly to the World Partition grid."
      - q: "A Level Instance does NOT use OFPA. How does it stream in a World Partition world?"
        choices: ["It cannot be placed at all", "It is always loaded", "It becomes a Data Layer", "It uses Level Streaming Mode and loads its level when its owning cell loads"]
        answer_index: 3
        explain: "Level Instances without OFPA cannot be embedded, so they use standard level streaming when their Level Instance Actor's cell loads. This costs more, so a high density of them is not recommended."
      - q: "Which non-OFPA actor does the page name as lost at runtime in Embedded Mode?"
        choices: ["All Static Mesh Actors", "The Player Start", "The Directional Light", "The World Settings object of the embedded Level Instance"]
        answer_index: 3
        explain: "Non-OFPA actors such as the AWorldSettings of an embedded Level Instance do not exist at runtime. Do not rely on them, or use Level Streaming Mode."
      - q: "You assign a Level Instance Actor to a Data Layer. What happens to the actors inside it?"
        choices: ["They lose their own Data Layers", "They keep no Data Layer", "They inherit the Data Layer by default and can also have extra Data Layers", "They must be reassigned one by one"]
        answer_index: 2
        explain: "Actors in a Level Instance inherit the Data Layer of the Level Instance Actor by default, and they also support additional Data Layers of their own."
      - q: "What is true about Breaking a Level Instance?"
        choices: ["It can be undone with Ctrl+Z", "It replaces the actor with the original assets and cannot be undone", "It only works on Packed Level Actors", "It deletes the Level asset from the Content Browser"]
        answer_index: 1
        explain: "Breaking puts the original actors back and removes the Level Instance Actor. The asset stays in the Content Browser, but the operation cannot be undone."
      - q: "How do you leave Level Instance editing WITHOUT saving your changes?"
        choices: ["Press Esc twice", "Click Commit Changes", "Close the Outliner", "Delete the Level Instance Actor"]
        answer_index: 0
        explain: "Commit Changes saves and propagates the edit to all copies. Pressing Esc twice leaves editing without committing."
      - q: "What does the Actor Editor Context widget show while you edit a Level Instance?"
        choices: ["The current open Level Instance, and new actors go into it", "The HLOD Layer", "The runtime grid name", "The current sublevel only"]
        answer_index: 0
        explain: "Editing a Level Instance creates a new context. Actors you add go into the open Level Instance, and on commit the editor returns to the previous context."
    flavors:
      _default: {why: "Big worlds repeat content. Level Instances let you fix one camp and update all of them, and they stream like normal actors."}
      level_design: {why: "Points of interest with triggers and lights are exactly what Level Instances are for.", do: "Give one camp a nested Level Instance for a reusable campfire kit."}
      lookdev: {why: "Knowing when a Packed Level Actor is the better choice saves draw calls.", do: "Rebuild the camp's static meshes as a Packed Level Actor and compare the Outliner."}

  - id: LDQ84
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [hlod, world-partition, performance, open-world]
    required_spine: false
    required: false
    title: HLOD layers with a parent
    brief: "HLOD, short for Hierarchical Level of Detail, replaces far away actors with cheap stand-in meshes called proxies, so that a distant town stays visible while its real cells are unloaded. An HLOD Layer is the asset that holds the settings for how the proxies are built. One layer can have a parent layer, which builds an even simpler proxy for even larger distances. In this quest you set up a town layer with a horizon layer as its parent, and compare the world with and without HLODs."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition---hierarchical-level-of-detail-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition-builder-commandlet-reference"
    checklist:
      - "In a World Partition level, create two HLOD Layer assets: HLOD_Town with Layer Type Merged Mesh, and HLOD_Horizon with Layer Type Simplified Mesh. In HLOD_Horizon, turn on Always Loaded and note which settings disappear."
      - "In HLOD_Town, set Parent Layer to HLOD_Horizon. Set its Loading Range to about twice the Loading Range of your grid."
      - "In World Settings, set Default HLOD Layer to HLOD_Town. Place 40 building blocks (boxes with 2 or 3 materials) in 4 groups, all with Mobility set to Static. Do not set the HLOD property on them, because they should use the default layer."
      - "Open the Build menu and run Build HLODs. In the viewport, open Level of Detail Coloration and choose Hierarchical LOD Coloration. Move far away until the proxies are shown in blue."
      - "In HLOD_Horizon, open Proxy Settings and set Merge Distance to 300. Build the HLODs again. Compare the far proxy before and after: small gaps such as doorways should now be closed."
      - "Start Play In Editor and walk far away. Run wp.Runtime.HLOD 0 and then wp.Runtime.HLOD 1 to see the world without HLODs and with HLODs. Take a screenshot of each."
      - "Write 3 lines: which layer is the child, which layer is always loaded, and why the horizon layer does not need a Loading Range."
    done_when: "Send two Play In Editor screenshots taken from far away, one with wp.Runtime.HLOD 0 and one with HLODs on. Also send a screenshot of the HLOD_Town asset that shows Parent Layer, and add your 3 lines."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "What does the Parent Layer setting on an HLOD Layer do?"
        choices: ["Copies the merge settings from another layer", "Sets the layer as the default in World Settings", "Makes the layer load before its children", "Automatically assigns the assets this layer creates to another HLOD Layer"]
        answer_index: 3
        explain: "Parent Layer sends the HLOD assets generated by this layer into the designated layer, so proxies can themselves get a further HLOD."
      - q: "You enable Always Loaded on an HLOD Layer. Which settings become unavailable?"
        choices: ["Mesh Merge Settings", "Layer Type and HLODMaterial", "Cell Size and Loading Range", "Parent Layer only"]
        answer_index: 2
        explain: "Cell Size and Loading Range configure the runtime grid for the HLOD actors. An always-loaded layer has no streaming grid, so both options are hidden."
      - q: "Which Layer Type replaces meshes with Instanced Static Mesh components using the lowest LOD?"
        choices: ["Simplified Mesh", "Instancing", "Proxy Mesh", "Merged Mesh"]
        answer_index: 1
        explain: "Instancing keeps the source assets as ISM components at their lowest LOD. It is meant for imposters such as trees and foliage."
      - q: "What is the difference between Merged Mesh and Simplified Mesh?"
        choices: ["Merged Mesh combines meshes into one proxy; Simplified Mesh also runs mesh simplification", "Merged Mesh works only on Nanite meshes", "Simplified Mesh keeps separate materials", "There is no difference"]
        answer_index: 0
        explain: "Both merge the static meshes into a single proxy. Simplified Mesh additionally reduces the geometry, controlled by Proxy Settings such as Screen Size."
      - q: "Where can an actor get its HLOD Layer from? Pick the complete list."
        choices: ["The actor's HLOD property, the Default HLOD Layer of a Data Layer, or the Default HLOD Layer in World Settings", "Only the World Settings", "The HLOD Layer of its Level Instance", "Only the HLOD property in the actor's Details"]
        answer_index: 0
        explain: "The page lists three ways: the HLOD property on the actor, the Default HLOD Layer property of a Data Layer, and the Default HLOD Layer property of the World Settings."
      - q: "Merge Distance in Proxy Settings is set to a non-zero value. What does it do?"
        choices: ["Merges materials into one flat material", "Closes gaps like doors and windows in distant geometry", "Sets the distance at which the proxy appears", "Removes triangles under the landscape"]
        answer_index: 1
        explain: "Merge Distance closes small gaps in the far proxy. Unresolved Geometry Color then fills areas that no longer map to source geometry."
      - q: "You rebuild HLODs but nothing changed in the source actors. What happens?"
        choices: ["The build fails", "All HLOD Actors are rebuilt anyway", "HLOD Actors are not recreated or rebuilt", "The HLOD Actors are deleted"]
        answer_index: 2
        explain: "HLOD Actors are only rebuilt when their source actors, meshes, materials or textures changed. Unchanged HLODs are skipped."
      - q: "Which commandlet option removes every HLOD Actor from the map?"
        choices: ["-ResaveActors", "-SetupHLODs", "-BuildHLODs", "-DeleteHLODs"]
        answer_index: 3
        explain: "-DeleteHLODs deletes all HLOD Actors. -SetupHLODs creates or updates the actors without geometry and -BuildHLODs builds the geometry."
    flavors:
      _default: {why: "A distant town that vanishes breaks the picture of a big world. HLOD layers keep the horizon while the real cells stay unloaded."}
      level_design: {why: "Landmarks guide players from far away only if they are still visible when unloaded.", do: "Make your main landmark part of HLOD_Horizon so it never disappears."}
      lookdev: {why: "Merge Distance and material baking change how the far proxy looks.", do: "Compare Merge Materials on and off in HLOD_Town and note the texture quality."}

  - id: LDQ85
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [level-streaming, sublevels, pacing, performance]
    required_spine: false
    required: false
    title: Streaming volumes without the hitch
    brief: "Before World Partition, large levels were split by hand into sublevels, which are smaller levels that are loaded into one main level called the persistent level. Many games still work this way. A Level Streaming Volume is a box that loads a sublevel when the player's view enters it and unloads the sublevel when the view leaves. In this quest you set up three sublevels with volumes and adjust them so that the player does not notice the loading."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-streaming-volumes-reference-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-streaming-using-volumes-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-streaming-overview-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/managing-multiple-levels-in-unreal-engine"
    checklist:
      - "Make a level without World Partition named L_Trail_P, with a Player Start. Make three small levels named L_Cave, L_Ridge and L_Village, each with a few blockout meshes. In Window > Levels, use Add Existing to add all three as sublevels with the streaming type Blueprint."
      - "Place three Level Streaming Volumes in L_Trail_P, the persistent level, one for each sublevel. Make each volume larger than the walkable area it covers. Open the Level Details of each sublevel, add its volume under Streaming Volumes, and uncheck Initially Loaded and Initially Visible."
      - "In the viewport, open Show, then Advanced, and turn on Level Coloration. Give each sublevel its own Level Color. Take a screenshot that shows all three colors."
      - "Start Play In Editor and run the console command stat streaming. Walk across the borders of the volumes and watch the stats named Streaming Volumes and Volume Streaming Tick."
      - "Stand on the border of the L_Cave volume and step in and out several times. Then open the Level Details of L_Cave and set Min Time Between Volume Unload Requests to 5 seconds. Repeat the test and write down the difference."
      - "Set the Streaming Usage of the L_Ridge volume to SVB Visibility Blocking on Load and test again. Then run the level as a Standalone Game and note where you first see a level appear."
      - "Set the L_Village volume to Editor Pre Vis Only. Fly the editor camera in and out of the volume, and then play. Write one line that says what changed."
    done_when: "Send a screenshot of the Levels window with the three sublevels and their volumes, and a Play In Editor screenshot with stat streaming visible. Add 3 lines: the value you chose for the unload delay (the hysteresis), what Standalone showed that PIE did not, and what Editor Pre Vis Only did."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Where must a Level Streaming Volume live to work?"
        choices: ["In the persistent level", "In any level that is Always Loaded", "In a Level Instance", "In the sublevel it controls"]
        answer_index: 0
        explain: "All Level Streaming Volumes must exist in the persistent level. Volumes in other levels cannot be used and generate warnings on map check."
      - q: "Why is Play In Editor not a good test of streaming volume timing?"
        choices: ["In PIE the levels are already in memory, so loading is just unhiding them instantly", "PIE always loads levels late", "PIE only tests the persistent level", "PIE ignores volumes"]
        answer_index: 0
        explain: "PIE shows where loads and unloads happen, but the levels are already in memory. Real load times only show in a standalone game on the target platform."
      - q: "You grow a Level Streaming Volume. What changes?"
        choices: ["Nothing until you rebuild", "The level loads sooner and unloads later", "The level loads later and unloads sooner", "Only visibility changes"]
        answer_index: 1
        explain: "Growing a volume means the viewpoint enters it earlier and leaves it later, so the level loads sooner and unloads later. Shrinking does the opposite."
      - q: "What is the default Min Time Between Volume Unload Requests, and what does it prevent?"
        choices: ["2.0 seconds; it delays loading", "0 seconds; it prevents loading twice", "2.0 seconds; it prevents repeated unload requests when the player crosses a border back and forth", "10 seconds; it prevents the level from ever unloading"]
        answer_index: 2
        explain: "The unloading hysteresis is 2.0 seconds by default. There is no hysteresis for loading, because a needed level should load as soon as possible."
      - q: "A sublevel has streaming volumes. You also call Load Stream Level on it from Blueprint. What does Epic say?"
        choices: ["Blueprint always wins", "The volumes are deleted", "Both work together", "Other streaming methods will not behave correctly for that level"]
        answer_index: 3
        explain: "If a level has any streaming volumes, other methods of streaming that level will not behave correctly. Use the Disabled flag to hand control to Blueprint instead."
      - q: "What is the documented use of the Disabled flag on a streaming volume?"
        choices: ["Turning the volume into a trigger", "Making the volume editor-only", "Hiding the volume in the viewport", "Keeping a level behind a locked door from streaming in until the door can be opened, without removing the volume from the level"]
        answer_index: 3
        explain: "The example is a locked door: the volume extends past the door, but the level should not stream until the door is unlocked, so the volume stays Disabled until then."
      - q: "Which two stats does the page name under the Streaming stats group?"
        choices: ["Draw Calls and Triangles", "Volume Count and Cell Count", "Streaming Volumes and Volume Streaming Tick", "Level Load and Level Unload"]
        answer_index: 2
        explain: "Streaming Volumes counts the volumes tested per frame. Volume Streaming Tick is the time spent in UWorld::ProcessLevelStreamingVolumes each frame."
      - q: "In split screen, whose position does volume streaming check?"
        choices: ["Only the host", "The viewpoints of all local players", "The server camera", "Only player one"]
        answer_index: 1
        explain: "Volume-based streaming considers all local players before issuing load or unload requests. A level unloads only when all players are outside all its volumes."
    flavors:
      _default: {why: "Sublevel streaming still runs many games. Sizing volumes and tuning hysteresis is how you hide the loading seam."}
      level_design: {why: "Corridors and bends are where you hide loads. The volume must reach further than the player's sightline.", do: "Add a bend to the trail so no volume border is visible in a straight line."}
      gameplay_design: {why: "Locked doors and streaming go together.", do: "Wire a key pickup that sets the L_Village volume's Disabled to false."}

  - id: LDQ86
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [data-layers, world-partition, blueprint, progression]
    required_spine: false
    required: false
    title: Quest stages with Data Layers
    brief: "A Data Layer is a named group of actors in a World Partition level that can be loaded and unloaded together while the game runs. With Data Layers, one place can have several states without a copy of the level, for example a camp before and after a battle. This is how progress in a story can change the world. In this quest you build two stages of a camp on two Data Layers and switch between them with a trigger."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition---data-layers-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-editor-context-in-unreal-engine"
    checklist:
      - "In a World Partition level, create three Data Layer assets of the type Runtime: DL_Stage1, DL_Stage2 and DL_Stage2_Props. Drag DL_Stage1 and DL_Stage2 into the Data Layer Outliner to make instances. Then drag DL_Stage2_Props onto the DL_Stage2 instance, so that it becomes a child of it."
      - "Set the Initial Runtime State of DL_Stage1 to Activated and of DL_Stage2 to Unloaded. Right-click DL_Stage1 and choose Make Current Data Layer, so that new actors go into it. Place a camp with a closed gate. Check that the Actor Editor Context widget shows DL_Stage1."
      - "Now make DL_Stage2 the current layer and place the same camp as it looks after a battle, with an open gate and burned tents. Put loot props in DL_Stage2_Props. Clear the current Data Layer when you are done."
      - "Make an Actor Blueprint named BP_StageTrigger with a Box collision and two editable variables of the type Data Layer Asset, named LayerOff and LayerOn. On overlap by the player, get the Data Layer Subsystem and call Set Data Layer Instance Runtime State twice: once to set LayerOff to Unloaded and once to set LayerOn to Activated."
      - "Place the trigger at the exit of the camp, with LayerOff set to DL_Stage1 and LayerOn set to DL_Stage2. Start Play In Editor, run wp.Runtime.ToggleDrawDataLayers, and walk through the trigger."
      - "Test the states. In the console, run wp.Runtime.SetDataLayerRuntimeState Loaded DL_Stage2 and look at the camp. Then set it to Activated. Write one line about the difference."
      - "Run wp.DumpDatalayers and read the log. Then rename DL_Stage2_Props in the Content Browser and confirm that the actors still belong to it."
    done_when: "Send a screenshot of the Data Layer Outliner that shows the hierarchy and the Initial Runtime States. Also send two Play In Editor screenshots with wp.Runtime.ToggleDrawDataLayers turned on, one before and one after the trigger. Add one line about Loaded compared with Activated."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the difference between a Data Layer Asset and a Data Layer Instance?"
        choices: ["There is no difference", "Assets are runtime only, instances are editor only", "Assets are project-level and not world specific; instances hold world-specific settings for that asset", "Instances live in the Content Browser, assets in the Outliner"]
        answer_index: 2
        explain: "The asset stores the name, type and debug color and can be used in several worlds. Each world creates an instance with its own properties such as Initial Runtime State."
      - q: "A Data Layer Instance is set to the Loaded runtime state. What does the player see?"
        choices: ["The actors are unloaded", "The actors are visible but have no collision", "The actors are loaded and visible", "The actors are loaded but not visible"]
        answer_index: 3
        explain: "Loaded means in memory but not visible. Activated means loaded and visible. The Blueprint example moves GreyBox to Loaded and Ruins to Activated."
      - q: "How do you create a child Data Layer Instance by drag and drop?"
        choices: ["Drop the asset onto the viewport", "Drop the instance into the Content Browser", "Drop two assets onto each other", "Drop the asset onto an existing instance in the Data Layer Outliner"]
        answer_index: 3
        explain: "Dropping an asset into the Outliner creates an instance. Dropping it onto an existing instance creates a child instance under it."
      - q: "Which console command forces a Data Layer into a given state?"
        choices: ["wp.Runtime.ToggleDrawDataLayers", "wp.DumpDatalayers", "wp.Runtime.SetDataLayerRuntimeState [state] [layer]", "wp.Runtime.DebugFilerByDatalayer"]
        answer_index: 2
        explain: "SetDataLayerRuntimeState forces a state. ToggleDrawDataLayers shows the list on screen, DumpDatalayers writes it to the log, and DebugFilerByDatalayer filters the hash debug view."
      - q: "What does Make Current Data Layer do?"
        choices: ["Activates the layer at runtime", "Sets the layer as the Actor Editor Context, so new actors you place join it automatically", "Loads all its actors in the editor", "Renames the layer"]
        answer_index: 1
        explain: "Through Actor Editor Context, every actor added to the viewport is assigned to the current Data Layer. It is an editor placement aid, not a runtime change."
      - q: "You rename a Data Layer. Which files change?"
        choices: ["Only the label in the WorldDataLayer file; actors keep their internal identifier", "Nothing can be renamed", "Every actor in the layer", "The level file and every actor"]
        answer_index: 0
        explain: "Each Data Layer has a display label and an internal unique identifier. Renaming only touches the label, so no actor files need to be saved."
      - q: "What performance warning does the page give about Runtime Data Layers?"
        choices: ["Widely used assets assigned to too many Runtime Data Layer Instances can degrade World Partition streaming performance", "Only one Runtime Data Layer may be active", "They double memory use", "They cannot be used in cooked builds"]
        answer_index: 0
        explain: "Loading too much at once and assigning assets to too many runtime instances hurts streaming performance, so monitor runtime instance usage."
      - q: "In a client-server game, who is allowed to activate a Data Layer according to the C++ example?"
        choices: ["Any client", "Only the server, checked with HasAuthority", "Only the listen client", "The Data Layer Subsystem decides randomly"]
        answer_index: 1
        explain: "The example comment says: in client/server only the server can activate a Data Layer, so the code checks HasAuthority before setting the state."
    flavors:
      _default: {why: "Data Layers let one place have several states without duplicating the level. That is how quest progress changes the world."}
      level_design: {why: "Before and after states are storytelling tools, and the hierarchy keeps them tidy.", do: "Add a DL_Stage3 with a rebuilt camp and chain two triggers."}
      gameplay_design: {why: "Game state should drive which layer is active.", do: "Store the current stage in the Game Instance so it survives a level reload."}

  - id: LDQ87
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [one-file-per-actor, source-control, workflow, collaboration]
    required_spine: false
    required: false
    title: One File Per Actor on an old level
    brief: "Normally a level is one file, so only one person can change it at a time. One File Per Actor, or OFPA, saves every actor of the level in its own small file, called an external actor. This lets several people work on the same map at once. World Partition levels use it by default, but you can also turn it on for older levels. In this quest you convert an old level to OFPA and look at what changes when you save."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/one-file-per-actor-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-instancing-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition-in-unreal-engine"
    checklist:
      - "Duplicate a level that does not use World Partition (L_Trail_P from quest LDQ85, or any old blockout) and name the copy L_Legacy_OFPA. Open it."
      - "Open Window > World Settings. In the World section, check Use External Actors. Click Yes in the convert dialog, and save the level."
      - "Move one cube and use File > Save All. Write down what the list of files to save shows. Then check the Levels window and notice that the sublevels are still not converted."
      - "Load one sublevel, make it the current level, and enable Use External Actors for it too. Write one line that says why the commandlet (a command line tool of the editor) with -convertsublevels would be faster on a big map."
      - "Select four meshes, right-click, open Level, and choose Create Level Instance. Look at the External Actors checkbox in the dialog and leave it on. Save it as LI_Legacy."
      - "If your project uses Perforce, open the View Changelist window and look at how the external actor files are shown. If it does not, write two lines about what that window would show you and why the file names look strange on disk."
      - "Write 3 lines: what OFPA changes for a team, what happens to external actors when the game is cooked, and one risk when you submit only some of the files."
    done_when: "Send a screenshot of World Settings with Use External Actors checked, and add your 3 lines of text and your note about the save list."
    xp: 55
    verify_type: writeup
    quiz:
      - q: "What problem does One File Per Actor solve?"
        choices: ["Actors losing their transforms", "Slow shader compiling", "One person checking out the level file locks everyone else out of its actors", "Levels being too large to render"]
        answer_index: 2
        explain: "OFPA saves actor instances in external files, so you no longer need to check out and save the main level file to edit its actors."
      - q: "Where do external actors go when the game is cooked?"
        choices: ["They stay as separate files in the build", "They are embedded back into their level files", "They are deleted", "They become Data Layers"]
        answer_index: 1
        explain: "OFPA is editor-only. All actors are embedded in their respective level files when cooked."
      - q: "You enable Use External Actors on a level with three sublevels. What is converted?"
        choices: ["Only the current level", "Only the sublevels", "Nothing until you restart", "The level and all sublevels"]
        answer_index: 0
        explain: "Only the current level is converted. Each sublevel must be loaded and enabled separately, or you use the commandlet with -convertsublevels."
      - q: "Which commandlet arguments convert a map and its sublevels without source control?"
        choices: ["-run=ConvertLevelsToExternalActorsCommandlet -nosourcecontrol -convertsublevels", "-run=WorldPartitionBuilderCommandlet -builder=WorldPartitionResaveActorsBuilder", "-run=cook -Unversioned", "-run=WorldPartitionConvertCommandlet -OnlyMergeSubLevels"]
        answer_index: 0
        explain: "ConvertLevelsToExternalActorsCommandlet is the OFPA converter. -nosourcecontrol skips source control and -convertsublevels includes the sublevels."
      - q: "What does the View Changelist window show for external actor files?"
        choices: ["Only the encoded file names", "The actor names, level paths and asset types instead of the encoded names", "A 3D preview", "The cook status"]
        answer_index: 1
        explain: "External actor file names are encoded on disk. The View Changelist window decodes them so you can validate a changelist before submitting."
      - q: "Changelist support in the editor is available with which source control provider?"
        choices: ["None, it is a standalone tool", "Git only", "Perforce only", "Any provider"]
        answer_index: 2
        explain: "The page states that changelist support is only available when using Perforce as the source control provider."
      - q: "Why does Epic say to submit OFPA content from inside the editor?"
        choices: ["Because external tools cannot see .uasset files", "Because it is faster", "Because the editor compresses the files", "Because a user could submit only some checked-out files and leave dangling references, and the editor lets you validate the changelist first"]
        answer_index: 3
        explain: "OFPA adds complexity: partial submits can break references. Validating the changelist in the editor before submitting reduces that risk."
      - q: "A Level Instance is created with External Actors turned OFF. What is the runtime consequence in a World Partition world?"
        choices: ["It becomes always loaded", "It loses its meshes", "It is converted automatically", "It cannot be embedded in the grid and uses Level Streaming Mode"]
        answer_index: 3
        explain: "Only OFPA Level Instances can be embedded. A Level Instance without OFPA streams as its own level, which costs more at runtime."
    flavors:
      _default: {why: "Teams work on the same map at once. One File Per Actor is what makes that possible, in and out of World Partition."}
      level_design: {why: "You will hand old blockouts to artists. Converting them first avoids file locks.", do: "Convert one more legacy level and note how long the conversion took."}
      programming: {why: "Build and source control scripts must know actors live in external files.", do: "Read the commandlet section and write the full command line for your project."}

