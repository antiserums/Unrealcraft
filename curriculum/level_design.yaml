        choices: ["Less erosion is applied", "More erosion is applied", "The brush gets smaller", "The noise is turned off"]
        answer_index: 1
        explain: "Threshold is the minimum height difference needed for erosion. Smaller values mean more places qualify, so more erosion is applied."
      - q: "Why did the steep back side of the mountain erode faster than the gentle front side in the Erosion tool example?"
        choices: ["The brush was bigger on the back side", "Erosion only works on north-facing slopes", "The larger the difference in elevation, the more erosion occurs", "The back side had a different material"]
        answer_index: 2
