  - id: LDQ48
    rank: 1
    difficulty: apprentice
    specializations: [level_design]
    subjects: [geometry-script, blueprint, procedural, blockout]
    required_spine: false
    required: false
    title: A box that cuts itself (Geometry Script)
    brief: "Geometry Script is a plugin that lets you build and change meshes with Blueprint nodes. A mesh made this way is rebuilt from its settings every time you change them, so you can resize a blockout piece in seconds. In this quest you make a Blueprint that creates a box and then cuts a cylinder-shaped hole in it. Cutting one shape out of another is called a boolean operation."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/geometry-scripting-through-blueprints-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/geometry-scripting-users-guide-in-unreal-engine"
    community_urls: []
    checklist:
      - "Open any project, or create one from the Third Person template. Open Edit > Plugins and search for geometry script. Enable the Geometry Script plugin and restart the editor."
      - "Create a new Blueprint Class that uses GeneratedDynamicMeshActor as its parent class. Name it BP_ProceduralGen."
      - "In the Event Graph, add the event named Event On Rebuild Generated Mesh. Promote its Target Mesh pin to a private variable named DynamicMesh."
      - "Add an Append Box node. Make a public Vector variable named BoxSize, turn on Instance Editable and Show 3D widget for it, and set its default to 200,200,200. Split the variable and connect it to the box dimensions."
      - "Add Get Compute Mesh Pool, then Request and Release Mesh, then Append Cylinder. Promote the temporary mesh to a variable named BoolMesh. Then add Apply Mesh Boolean with Operation set to Subtract and with BoolMesh as the Tool Mesh."
      - "Add two more Vector variables with 3D widgets, named BoolLocation and BoolSize, to control the cylinder. Compile, drag BP_ProceduralGen into the level, and drag the 3D widgets to change the shape."
      - "Create a function named Bake Static Mesh and turn on Call in Editor for it, which shows it as a button in the Details panel. In the function, use Copy Mesh to Static Mesh to copy the result into a variable named TargetMesh."
    done_when: "Send a screenshot of BP_ProceduralGen in the level with a visible cylinder hole and the 3D widgets shown. The Details panel must show the Bake Static Mesh button."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which Blueprint parent class does the guide use for the procedural level tool?"
        choices: ["EditorUtilityActor", "StaticMeshActor", "GeneratedDynamicMeshActor", "ProceduralMeshComponent"]
        answer_index: 2
        explain: "The guide uses GeneratedDynamicMeshActor. If it is missing from the list, the Geometry Script plugin is not enabled."
      - q: "Which event rebuilds the mesh every time you change a parameter?"
        choices: ["Event BeginPlay", "Event On Rebuild Generated Mesh", "Construction Script of the Blueprint", "Event Tick, on every frame"]
        answer_index: 1
        explain: "Event On Rebuild Generated Mesh triggers every time the Dynamic Mesh parameters change. It only exists on GeneratedDynamicMeshActor Blueprints."
      - q: "In Apply Mesh Boolean, what is the Tool Mesh pin?"
        choices: ["The mesh you cut with, for example the cylinder", "The mesh that receives the result", "A debug mesh", "The Static Mesh asset that the result is baked into"]
        answer_index: 0
        explain: "Tool Mesh is the second mesh used for the boolean. Target Mesh is the mesh being edited, here the box."
      - q: "Why does the guide use Request and Release Mesh from a mesh pool for the cylinder?"
        choices: ["Because cylinders cannot be appended to a mesh directly in a graph", "To get a temporary mesh and avoid extra geometry in the editor", "To make the mesh a Static Mesh asset that is saved in the Content Browser", "To enable Nanite on the mesh that the tool makes"]
        answer_index: 1
        explain: "A pooled temporary mesh avoids unnecessary geometry and is released automatically, which is cheaper than creating objects each time."
      - q: "What setting makes the Bake Static Mesh function appear as a button in the Level Editor Details panel?"
        choices: ["Pure", "Instance Editable", "Call in Editor", "Show 3D widget"]
        answer_index: 2
        explain: "Enabling Call in Editor on the function exposes it as a button in the Details panel."
      - q: "How is a Dynamic Mesh different from a Static Mesh, according to the User Guide?"
        choices: ["It is an asset that is shared by many components", "It supports Nanite but not raytracing", "It can only be edited in C++", "It is stored in the level only and is not an asset"]
        answer_index: 3
        explain: "A UDynamicMesh is not an asset; it is stored in the level, owned by its component. Duplicating the component copies the mesh."
    flavors:
      _default: {why: "A mesh that rebuilds from parameters is a blockout you can resize in seconds."}
      level_design: {why: "Lyra's level design tools are built this way; one Blueprint gives you an editable wall, door, or platform.", do: "Add a second boolean cylinder so the box has two windows, and expose the spacing as a variable."}
      gameplay_design: {why: "Parametric blocks let you tune cover height or gap width live while testing.", do: "Expose a Height float and test three values with a character jump."}

  - id: LDQ49
    rank: 1
