  - id: LDQ52
    rank: 1
    difficulty: apprentice
    specializations: [level_design]
    subjects: [world-partition, streaming, open-world]
    required_spine: false
    required: false
    title: "World Partition: load only what you need"
    brief: "World Partition is the system Unreal uses for very large levels. It divides the world into a grid of cells and loads only the cells near the player, which is called streaming. Without it, a big open world would not fit in memory. In this quest you create an Open World level, load a region of it in the editor, and see how actors load and unload as you move."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/one-file-per-actor-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/dynamic-loading-range-scaling-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a new level with File > New Level and choose Open World. Save it as L_WP_Test."
      - "Open Window > World Partition > World Partition Editor. Drag on the map to mark a region, then right-click and choose Load Region from Selection."
      - "Place 10 cubes far apart inside the loaded region. Select one cube and find the World Partition section in the Details panel. Look at the option Is Spatially Loaded, which means the actor loads only when a player is near."
      - "Turn off Is Spatially Loaded on one cube and rename that cube to Cube_AlwaysLoaded."
      - "Open World Settings and find World Partition Setup. Enable Preview Grids and write down the values of Cell Size and Loading Range."
      - "Drag a Location Volume from the Place Actors panel, place it around your cubes, and save. Then find its region in the World Partition window."
      - "Start Play In Editor and walk away from the cubes until they unload. Then come back and see them load again."
    done_when: "Send one screenshot of the World Partition window with your loaded region, and one screenshot of World Settings that shows Cell Size and Loading Range. Add one line that says which actor you made always loaded and why."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "What is World Partition, in one sentence?"
        choices: ["A tool that splits a map into many sublevel files by hand, which you then load and unload with Level Streaming Volumes and Blueprint nodes", "An automatic data management and distance-based streaming system that keeps the world in one persistent level split into grid cells", "A plugin for landscapes only, which cuts one large heightmap into many small tiles and loads the tiles that are near the camera of the player", "A way to package the game, in which the world is split into separate download files by region"]
        answer_index: 1
        explain: "World Partition stores the world in a single persistent level, divides it into grid cells, and loads or unloads cells based on distance from a streaming source."
      - q: "You turn off Is Spatially Loaded on a backdrop mountain actor. What does this mean?"
        choices: ["The actor is never loaded, not in the editor and not in the game, until you turn the option on again", "The actor is loaded only when the player is close to it, like any other actor in the grid", "The actor is loaded regardless of distance, as long as it is not in a disabled Data Layer", "The actor is deleted at runtime as soon as the player moves away"]
        answer_index: 2
        explain: "Non spatially loaded actors do not depend on distance. They load when not assigned to a disabled Data Layer, which is why they are used for backdrops and managers."
      - q: "By default, what acts as a streaming source in a World Partition level?"
        choices: ["Every Static Mesh Actor in a cell", "Each Player Controller", "The Sky Light of the level", "The Landscape of the world"]
        answer_index: 1
        explain: "Each Player Controller is used as a streaming source through its Enable Streaming Source option, which is on by default."
      - q: "In the World Settings example on the page, Cell Size is 256 m and Loading Range is 768 m. What does Loading Range control?"
        choices: ["The size of one grid cell in the runtime grid", "The distance at which foliage and grass are still drawn", "The size of the minimap in the World Partition window", "The range from a streaming source where cells are loaded"]
        answer_index: 3
        explain: "Cell Size is the size of each cell. Loading Range is the radius around a streaming source inside which cells are loaded."
      - q: "You open a big World Partition level and the editor viewport is almost empty. Why?"
        choices: ["The world starts unloaded; only actors with Is Spatially Loaded set to False are loaded, and you load regions yourself", "The level is broken, because a World Partition level must always show every actor in the viewport when the map file is opened", "The level needs a Lightmass build before the actors that are stored in its grid cells can be drawn in the editor viewport at all", "World Partition only works in Play In Editor; the editor viewport never shows any of the actors that are in grid cells"]
        answer_index: 0
        explain: "To support huge worlds, the level opens unloaded. Use the World Partition window or Location Volumes to load the regions you want to work in."
      - q: "What is a Location Volume?"
        choices: ["A trigger that teleports the player to a named place in the world and then loads the cells around that place for the player", "A runtime volume that blocks streaming inside it, so the cells that it touches are never loaded during the game", "An editor-only volume that appears as a named region in the World Partition window so you can load or unload it", "A volume that changes the Cell Size of the runtime grid inside its bounds, so that the cells in a busy area can be made smaller"]
        answer_index: 2
        explain: "A Location Volume is editor-only. After saving, its region appears in the World Partition window with the same name, ready to load or unload."
    flavors:
      _default: {why: "Big levels need streaming. Knowing what loads, when, and why keeps your open world running."}
      level_design: {why: "You will spend hours in the World Partition window. Loading regions and choosing what is always loaded is daily work on open-world maps.", do: "Find a template map with World Partition enabled but Enable Streaming turned off, and write down which one it is."}
      gameplay_design: {why: "If a trigger or manager unloads with distance, your gameplay breaks. Is Spatially Loaded is the fix."}
      cinematics: {why: "A camera far from the player is not a streaming source by default; you may need a streaming source component."}

  - id: LDQ53
