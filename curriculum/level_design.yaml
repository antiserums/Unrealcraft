    specializations: [level_design]
    subjects: [ai-perception, stealth, ai, debugging]
    required_spine: false
    required: false
    title: Guards that see, hear and forget
    brief: "AI Perception is the system that lets AI characters sense the world, for example by sight and by hearing. Each sense has settings such as how far the guard sees, how wide its view is, and how long it remembers what it saw. A stealth area is designed around what guards can and cannot sense, so you need to see these ranges to place cover in the right spots. In this quest you set up a guard with sight and hearing and look at its senses with the AI debug view."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/ai-perception-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/ai-debugging-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make an AIController Blueprint named AIC_Guard and add an AIPerception component to it. Add an AI Sight config with Sight Radius 1500, Lose Sight Radius 2000, Peripheral Vision Half Angle 45, Detect Neutrals turned on, and Max Age 5."
      - "Add an AI Hearing config with Hearing Range 1200 and Detect Neutrals turned on. Set Dominant Sense to Sight."
      - "On the event On Target Perception Updated, break the AIStimulus struct and print the value of Successfully Sensed together with the name of the actor. This lets you see when something enters or leaves the guard's senses."
      - "In the player character, add an AIPerception Stimuli Source component. Enable Auto Register as Source and add Sight to Register as Source for Senses. Give the player the tag Player."
      - "Open Project Settings, go to Engine, then AI System, and enable Forget Stale Actors. With this, guards forget the player after the Max Age time."
      - "Make the guard: duplicate BP_ThirdPersonCharacter, name the copy BP_Guard, delete its input nodes, and set its AI Controller Class to AIC_Guard. Build a small stealth room from cubes with two cover walls, and place the guard in it. Play, press the apostrophe key and then Numpad 4, and check the sight cone and the hearing circle. Sneak behind the guard and confirm that it does not detect you outside the half angle."
    done_when: "Send a screenshot with the AI Perception debug view active and the sight cone visible, taken while you are hidden behind cover. Also send a screenshot of the Details panel of the Sight config that shows your radius and angle values."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Where does the guide add the AI Perception Component?"
        choices: ["To the Blueprint of the player character", "To the Level Blueprint of the map", "To the Behavior Tree asset of the guard", "To the Pawn's AIController Blueprint"]
        answer_index: 3
        explain: "The AI Perception Component is added to the Pawn's AIController Blueprint. It listens for stimuli and defines the senses."
      - q: "Peripheral Vision Half Angle Degrees is 45. How wide is the guard's full field of view?"
        choices: ["45 degrees", "90 degrees", "180 degrees", "22.5 degrees"]
        answer_index: 1
        explain: "The value is measured from the forward vector, not the whole range. 45 on each side gives 90 degrees total."
      - q: "Sight Radius is 1500 and Lose Sight Radius is 2000. What happens between 1500 and 2000 units?"
        choices: ["An already seen target is still perceived, but a new target cannot be picked up", "A new target is seen for the first time, and an old target is lost right away", "Nothing is perceived at all in that range, neither a new target nor one that was seen before", "Hearing takes over from Sight for all targets in that range"]
        answer_index: 0
        explain: "Sight Radius is the max distance to start perceiving. Lose Sight Radius is the max distance at which a seen target is no longer perceived."
      - q: "You want guards to detect only the player, but affiliation cannot be set in Blueprint. What does the source recommend?"
        choices: ["Use C++ only, because Blueprint cannot filter perceived actors", "Enable Detect Neutrals to detect all actors, then filter with Tags", "Set the Sight Radius to zero for every actor that is not the player", "Use the AI Team sense, which only reports the player"]
        answer_index: 1
        explain: "Affiliation is only definable in C++. In Blueprints, use Detect Neutrals to detect everything and use Tags to filter actor types."
      - q: "What does Max Age = 0 mean on a sense config?"
        choices: ["The stimulus is forgotten immediately", "The sense starts disabled", "The stimulus is never forgotten", "The sense fires once per frame"]
        answer_index: 2
        explain: "Max Age is how long until a stimulus becomes forgotten. Zero means never forgotten."
      - q: "For an AI to forget a target after Max Age, what must also be enabled?"
        choices: ["Project Settings > Engine > AI System > Forget Stale Actors", "Starts Enabled on the sense, in the AI Perception Component", "Auto Register as Source on the player's pawn", "Use Controller Rotation Yaw on the guard pawn"]
        answer_index: 0
        explain: "The Forget Perception Event needs Forget Stale Actors set to true in Project Settings > Engine > AI System. Then Max Age sets the timeout."
      - q: "Which sense reacts to a Report Noise Event, such as a thrown object landing?"
        choices: ["AI Sight", "AI Touch", "AI Hearing", "AI Prediction"]
        answer_index: 2
        explain: "AI Hearing detects sounds generated by a Report Noise Event, within its Hearing Range."
      - q: "On Target Perception Updated gives an AI Stimulus struct. Which field tells you if the actor entered or left perception?"
        choices: ["Stimulus Location", "Expiration Age", "Receiver Location", "Successfully Sensed"]
        answer_index: 3
        explain: "Successfully Sensed returns True or False. The quick start guides use it to tell 'seen' events from 'lost' events."
    flavors:
      _default: {why: "Stealth spaces are designed around what guards can and cannot sense. You need to see the cone to place the cover."}
      gameplay_design: {why: "Sight angle, radius and forget time are the core stealth tuning values.", do: "Make a 'suspicious' state: when Successfully Sensed goes false, move the guard to the Stimulus Location before returning to patrol."}

  - id: LDQ113
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [editor-utility-widget, metrics, tools]
    required_spine: false
    required: false
    title: Metrics panel as an Editor Utility Widget
    brief: "An Editor Utility Widget is a small panel that you build yourself and that runs inside the Unreal Editor, not in the game. You design it like any other user interface widget and give it Blueprint logic that works on the level. Metrics are the standard sizes of your game, such as the width of a door or the height of a jump. In this quest you build a panel that measures the distance between two selected actors and tells you if it fits your door width."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/editor-utility-widgets-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/scripting-the-unreal-editor-using-blueprints"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/calling-blueprints-in-the-unreal-editor"
    checklist:
      - "Open any project, or create one from the Third Person template. In the Content Browser, right-click and choose Editor Utilities, then Editor Utility Widget. Name the new asset EUW_LDMetrics."
      - "Add a Text block and a button named Measure to the widget. When the button is clicked, use the node Get Selection Set to read the actors that are selected in the level."
      - "If exactly two actors are selected, calculate the distance between them and show it in the Text block."
      - "Add three reference rows that show your metrics: door width, jump height and corridor width. Use the numbers of your own blockouts, or these examples for the template character: door width 140 cm, jump height 100 cm, corridor width 300 cm."
      - "Compare the measured distance with the door width. Show OK or TOO NARROW in the Text block."
      - "Right-click the asset and choose Run Editor Utility Widget. Dock the tab that opens next to the Details panel."
      - "Place two cubes in a level as blockout walls with a gap between them, select both, and press Measure. Check that the number and the OK or TOO NARROW text update."
    done_when: "Send a screenshot of the EUW_LDMetrics tab docked in the editor. It must show a measured distance and the OK or TOO NARROW text, with the two selected actors visible in the viewport."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What kind of asset is an Editor Utility Widget based on?"
        choices: ["A UMG Widget Blueprint", "A Level Blueprint", "A Material Instance", "A Data Table"]
        answer_index: 0
        explain: "Editor Utility Widgets are based on Unreal Motion Graphics (UMG). You set up the widget like any other UMG Widget Blueprint."
      - q: "How do you open an Editor Utility Widget as an editor tab for the first time?"
        choices: ["Drag it from the Content Browser into the viewport of the level", "Press Play with the asset selected in the Content Browser, and stop again", "Right-click the asset and choose Run Editor Utility Widget", "Open it from the Layers panel with a double-click on its name"]
        answer_index: 2
        explain: "Right-click the Editor Utility Widget asset and select Run Editor Utility Widget. An editor tab with your widget opens."
      - q: "After you have run an Editor Utility Widget once, where can you find it again?"
        choices: ["In Project Settings > Plugins, under the Editor Scripting Utilities section", "In the Level Editor's Tools menu, under Editor Utility Widgets", "In the Place Actors panel, under the All Classes category, next to the volumes", "In the Filters menu of the Content Browser, under Editor Tools"]
        answer_index: 1
        explain: "Once run, the widget appears in the Level Editor's Tools dropdown, under the Editor Utility Widgets category."
      - q: "Where can the tab of an Editor Utility Widget be docked?"
        choices: ["Only inside the Blueprint Editor", "Anywhere, including the Material Editor", "It cannot be docked at all", "Only with Level Editor tabs"]
        answer_index: 3
        explain: "The page says the tab is only dockable with Level Editor tabs."
      - q: "Per the Blueprint scripting page, which option is recommended for most editor scripting work when you need a rich UI?"
        choices: ["Level Blueprint", "Editor Utility Widgets", "Call in Editor buttons", "Startup Objects"]
        answer_index: 1
        explain: "Editor Utility Widgets combine UMG styling with Blueprint scripting. Epic calls them the most flexible option and recommends them for most editor scripting work."
      - q: "Why does an Editor Utility Widget see more editor functions than a normal Actor Blueprint?"
        choices: ["Because it runs in Play In Editor, where every function of the engine is available", "Because it has more memory than an Actor has", "Because editor-only functions are only exposed to editor-only classes", "Because it uses C++ instead of Blueprint for all of its editor calls"]
        answer_index: 2
        explain: "Functions from Editor-type modules are only available in editor-only Blueprint classes. A widget derived from a runtime class sees only a limited Editor Scripting set."
      - q: "You want a Blueprint graph that runs both in the editor and at runtime, triggered from a button in the Details panel. Which approach fits?"
        choices: ["Call in Editor on a Custom Event or function in a normal Actor Blueprint", "An Editor Utility Widget with a button that is docked in the Details panel", "A Startup Object that is listed in the Editor Utility Subsystem of the project settings", "A Scripted Action from the right-click menu"]
        answer_index: 0
        explain: "Call in Editor exposes a button in the Details panel for a placed actor and works both at runtime and in the editor."
      - q: "Which Blueprint class type does NOT show Call in Editor buttons in the Details panel?"
        choices: ["A Blueprint derived from the Actor class itself", "A Blueprint derived from the Character class", "A Blueprint derived from the Pawn class", "An Editor Utility Blueprint derived from Actor"]
        answer_index: 3
        explain: "Editor Utility Blueprint classes derived from Actor do not expose Details-panel buttons for Call in Editor functions. Use a normal Blueprint class or an Editor Utility Widget."
    flavors:
      _default: {why: "A small panel that checks your metrics saves you from measuring by eye every time."}
      tech_art: {why: "Editor Utility Widgets are the standard way to ship tools to the whole team.", do: "Add a dropdown that switches between metric sets (stealth, combat, platforming)."}
      gameplay_design: {why: "Metrics live in the player controller; a panel keeps the level honest to them.", do: "Read the jump height from the Character Blueprint instead of typing it by hand."}

  - id: LDQ114
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [scripted-actions, editor-utility-blueprint, tags]
    required_spine: false
    required: false
    title: "Scripted Actor Actions for tagging and renaming"
    brief: "A Scripted Actor Action is a command that you write in Blueprint and that appears in the right-click menu of actors in the editor, in the Scripted Actor Actions submenu. The documentation page still uses the older name, Scripted Actions. An action lets you do the same thing to many selected actors at once, for example give them all a tag or a clear name. Tags and good names make a big level easy to search and to review. In this quest you build two Scripted Actor Actions, one that adds a tag and one that renames, and you limit them to Static Mesh Actors."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/scripted-actions-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/scripting-the-unreal-editor-using-blueprints"
    checklist:
      - "Open any project, or create one from the Third Person template. Right-click in the Content Browser and choose Editor Utilities, then Editor Utility Blueprint. Pick ActorActionUtility as the parent class and name the asset EUB_LDActions."
      - "Add a function named Add Tag with one String input. It must loop over the result of Get Selection Set and add the tag to each actor."
      - "Add a second function named Rename With Prefix with one String input. It renames each selected actor to Prefix_Number, which means the prefix, an underscore and a number."
      - "In Class Defaults, add Static Mesh Actor to Supported Classes, so that the actions only appear for static meshes."
      - "Click Compile and Save. Select ten blockout meshes in the viewport, for example ten cubes that you place now or ten meshes of the template level, right-click, open Scripted Actor Actions, and run Add Tag with the value Cover."
      - "Run Rename With Prefix with the value Cover on the same selection. Check the new names in the Outliner."
      - "Select one actor that is not a static mesh, such as a light, and confirm that the Scripted Actor Actions menu does not show your actions."
    done_when: "Send a screenshot of the right-click Scripted Actor Actions submenu open on a selection of Static Mesh Actors. The Outliner must show the renamed Cover_ actors, and the Details panel must show the Cover tag on one of them."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which parent class should you pick when a Scripted Actor Action must work on actors selected in the level?"
        choices: ["AssetActionUtility", "ActorActionUtility", "EditorUtilityWidget", "LevelScriptActor"]
        answer_index: 1
        explain: "ActorActionUtility is for actors selected in the Level Viewport or Outliner. AssetActionUtility is for assets in the Content Browser."
      - q: "What must be true for a function or Custom Event in the class to show up as a Scripted Actor Action?"
        choices: ["It must return a Boolean value to the menu", "It must be named Run or start with Run", "Call In Editor must be checked on the node", "It must have no inputs and no local variables at all"]
        answer_index: 2
        explain: "Call In Editor must be checked. New functions get it automatically; Custom Events need you to check it yourself."
      - q: "Which node returns the actors currently selected in the level when the action runs?"
        choices: ["Get All Actors Of Class", "Get Selected Assets", "Get Player Pawn", "Get Selection Set"]
        answer_index: 3
        explain: "Get Selection Set returns an array of actors selected in the Level. Get Selected Assets is for Content Browser assets."
      - q: "Your action shows up when you right-click any actor, even lights. How do you limit it?"
        choices: ["Add the class to Supported Classes in Class Defaults", "Rename the Blueprint so that its name ends with the class", "Add a Branch node at the start that checks the class", "Move the Blueprint to a folder that is named after the class of actor"]
        answer_index: 0
        explain: "In Class Defaults, add the wanted class (for example Static Mesh Actor) to Supported Classes. The action then appears only for that class."
      - q: "What happens when a Scripted Actor Action function has inputs?"
        choices: ["The action is hidden from the menu until all of the inputs are removed", "The editor pops up a small window asking for the values", "Inputs are ignored, and each one gets its default value when it runs", "The Blueprint fails to compile until you remove them all"]
        answer_index: 1
        explain: "Inputs become Dynamic Inputs. The editor shows a small window where you type the values each time you run the action."
      - q: "The editor validates dynamic input types. What does it NOT guarantee?"
        choices: ["That the input has a value at all or makes sense", "That the type of the value matches", "That the window opens for the action", "That the action appears in the right-click menu"]
        answer_index: 0
        explain: "The editor checks the type, but not that values are given or make sense. Your script must handle empty inputs."
      - q: "How many Scripted Actor Actions can one Editor Utility Blueprint class contain?"
        choices: ["Exactly one, the first function or Custom Event of it", "At most three, in the order in which they were added", "As many functions or Custom Events as you need", "One for each class listed in Supported Classes"]
        answer_index: 2
        explain: "Each function or Custom Event becomes a separate menu option. You can put many in one class or spread them across classes."
      - q: "Where do you find the Blueprint class name when running its Scripted Actor Actions?"
        choices: ["In the title of the submenu, above the function names", "In the Details panel of the actor, under a category for actions", "In the Output Log, which prints the class name when the menu opens", "You do not see it; the menu shows only function names"]
        answer_index: 3
        explain: "The class name is not shown when you run the actions. You only need it to find the class later in your project."
    flavors:
      _default: {why: "Bulk tagging and renaming keeps big levels searchable and reviewable."}
      tech_art: {why: "Scripted Actions are the fastest way to give designers a tool without a UI.", do: "Add an action that snaps the selection to a 100 unit grid."}
      lookdev: {why: "Naming rules make hand-off to art easier.", do: "Add an action that tags selected meshes as Hero or Filler."}

  - id: LDQ115
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [property-matrix, bulk-edit, audit]
    required_spine: false
    required: false
    title: Audit a hundred actors in the Property Matrix
    brief: "The Property Matrix is an editor window that shows many actors as rows in a table, with their settings as columns. In this view you can sort, compare and change one setting on many actors at the same time. It finds the one wrong setting among hundreds of actors in seconds. In this quest you open a set of blockout meshes in the Property Matrix, find the ones with the wrong Mobility, and fix them in one edit."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/property-matrix-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open any project, or create one from the Third Person template. Open a level that has many Static Mesh Actors. The level of the template works, and so does a blockout of your own. Set the Mobility of three of the meshes to Movable, so that there is something to find. In the Outliner, select all the Static Mesh Actors."
      - "Right-click the selection and choose Edit Selection in Property Matrix."
      - "In the Pinned Columns panel, pin Mobility, Cast Shadow and Actor Tags so that they show as columns. Remove one of the automatic columns by clicking its header with the middle mouse button."
      - "Sort the Mobility column. Find every actor that is Movable by mistake, select them, and set them all to Static in one edit."
      - "Select five rows with Ctrl+click and turn Cast Shadow off for all of them at once."
      - "Hover the mouse over a column header to read the path of the property. Note it for your text."
      - "Click the save icon in the Property Matrix, and then save the level."
    done_when: "Send a screenshot of the Property Matrix with at least three pinned columns, one sorted column with its arrow visible, and several selected rows. Add one line that names the property path you read from a header."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "What is the Property Matrix for?"
        choices: ["Editing materials of many meshes at the same time, in a single node graph", "Bulk editing and comparing properties of many objects in a table", "Baking lighting for a group of levels from a table of their settings", "Building navigation data for many levels in one single batch pass"]
        answer_index: 1
        explain: "The Property Matrix shows a configurable set of properties for many objects as columns, so you can bulk edit and compare values."
      - q: "Which is a way to open the Property Matrix from the Outliner?"
        choices: ["Double-click an actor while holding the Alt key", "Drag the selected actors from the Outliner into the Details panel header", "Press F2 with the selection active in the Outliner panel", "Right-click the selection and choose Edit Selection in Property Matrix"]
        answer_index: 3
        explain: "Right-click your Outliner selection and choose Edit Selection in Property Matrix. There is also a button in the Details panel next to the Search bar."
      - q: "How do you add a column for a property?"
        choices: ["Pin the property in the Pinned Columns panel", "Type its name in the Outliner search", "Drag the property from the Content Browser", "Right-click the table and choose Add Row"]
        answer_index: 0
        explain: "Columns are added and removed by pinning and unpinning properties in the Pinned Columns panel (the property tree)."
      - q: "What does middle-clicking a column header do?"
        choices: ["Sorts the table rows by that column", "Enters edit mode for every cell of the column", "Removes the column from the table", "Copies the column"]
        answer_index: 2
        explain: "MMB click on a column header removes the column. Middle-click on a property in the Details panel toggles pinning."
      - q: "You edit a value in the property tree. Which objects are changed?"
        choices: ["All objects in the table", "Only the selected rows", "Only the first row", "All actors in the level"]
        answer_index: 1
        explain: "The property tree is bound to the selected rows. Changes apply only to the selected items."
      - q: "The level updates as you edit in the Property Matrix. What must you still do to apply the settings officially?"
        choices: ["Click the save icon", "Press Play", "Restart the editor", "Rebuild lighting"]
        answer_index: 0
        explain: "The page says your level updates as properties change, but you must click the save icon to apply the settings officially."
      - q: "How do you find the full path of a property shown in a column?"
        choices: ["Right-click any cell in that column", "Open the Output Log after a click", "Press Ctrl+A with the column active", "Hover the cursor over the header name"]
        answer_index: 3
        explain: "Hover the cursor over the column header name to see the path of the property."
      - q: "Which keyboard shortcut selects all cells in the table?"
        choices: ["Ctrl+A", "F2", "Escape", "Ctrl+Home"]
        answer_index: 0
        explain: "Ctrl+A selects all cells. F2 enters edit mode, Escape exits it, Ctrl+Home moves to the first cell."
    flavors:
      _default: {why: "A table view finds the one wrong setting among hundreds of actors in seconds."}
      lookdev: {why: "Auditing shadow and mobility settings before a lighting pass avoids surprises.", do: "Pin Lightmap Resolution and sort it to find outliers."}
      tech_art: {why: "Property Matrix is the manual version of what your scripts automate.", do: "Use Ctrl+C / Ctrl+V between cells to copy a tag to many rows."}

  - id: LDQ116
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [level-snapshots, review, iteration]
    required_spine: false
    required: false
    title: Level Snapshots for review variants
    brief: "A Level Snapshot saves the state of all actors in a level at one moment, such as their positions and settings. Later you can restore the whole level, or only some actors, to that state. This lets you try a change to the layout and jump back without making a copy of the level. In this quest you take two snapshots of a blockout, restore one, and use a filter to restore only the actors that have a certain tag."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-snapshots-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-snapshot-filter-reference-for-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Enable the Level Snapshots plugin and restart the editor."
      - "Open a blockout level of your own, or the level of the template. Click the Level Snapshot button in the main toolbar. Name the snapshot Base_v1 and add a description."
      - "Move five meshes that work as cover, delete one, and add a new one. Then take a second snapshot named Variant_Open."
      - "Open the Level Snapshots window, select Base_v1, and click Restore Level Snapshot. Check that all your changes are reverted."
      - "Undo the restore. Then give two cover actors the tag KeepMe."
      - "Add a Filter Group with the filter Actor Has Tag, set to KeepMe. Click Refresh Results and restore only those actors from Base_v1."
      - "Negate the filter by clicking its green bar, which makes it select the opposite. Note for your text what the result list shows now."
    done_when: "Send a screenshot of the Level Snapshots window with two named snapshots, one Filter Group that contains Actor Has Tag, and the results list. Add one line that says what changed when you negated the filter."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What does a Level Snapshot record?"
        choices: ["Only the transforms of the actors that are in the Outliner", "Actors in the Outliner with their components and properties", "Material assets that are used by the actors", "Console variables that were set in the session"]
        answer_index: 1
        explain: "A snapshot records all actors in the World Outliner and the state of their components and properties. Assets like materials are not recorded."
      - q: "What is the default name format of a new Level Snapshot?"
        choices: ["<level_name>_<username>_<time>", "Snapshot_<number>_<username>", "<date>_<level_name>_<number>", "<username>_<number> only"]
        answer_index: 0
        explain: "By default the new snapshot is named <level_name>_<username>_<time>. You can rename it and change the default pattern."
      - q: "When you restore a snapshot, what happens to actors added after it was taken?"
        choices: ["They are kept as they are", "They are moved to a sublevel", "They are hidden in the level", "They are removed from the level"]
        answer_index: 3
        explain: "Restoring reverts to the saved state: new actors are removed, removed actors are added back, transforms and properties are reverted."
      - q: "Which of these is NOT tracked by Level Snapshots?"
        choices: ["Static Mesh Actors", "Point Lights", "Landscapes", "Actor tags"]
        answer_index: 2
        explain: "Known limitations: Landscapes, USD actors and console variables are not tracked."
      - q: "You have snapshots for two levels. Why do you see only some of them in the window?"
        choices: ["The others are corrupt and were removed from the list on load", "Only snapshots for the currently open level are shown", "They need to be re-imported into the project before they show", "The plugin limits you to five snapshots for each level"]
        answer_index: 1
        explain: "Only Level Snapshots associated with the currently open Level are visible. Others show when you open their level."
      - q: "How do filters inside one Filter Group combine, and how do separate Filter Groups combine?"
        choices: ["AND inside a group, OR between groups", "OR inside a group, AND between groups", "Always AND, in and between groups", "Always OR, in and between groups"]
        answer_index: 0
        explain: "Multiple filters in the same group use AND. Adding more Filter Groups combines them with OR."
      - q: "A filter is set to Include and you negate it. What does it become?"
        choices: ["Do Not Care", "It stays Include", "It is disabled", "Exclude"]
        answer_index: 3
        explain: "Negating swaps Include and Exclude. Do Not Care stays Do Not Care."
      - q: "Can you undo a Restore Level Snapshot action?"
        choices: ["No, it is permanent", "Yes", "Only if you saved first", "Only for transforms"]
        answer_index: 1
        explain: "The page states you can undo the Restore Level Snapshot action."
    flavors:
      _default: {why: "Snapshots let you try a layout change and jump back without duplicating the level."}
      cinematics: {why: "Reset a set between takes without losing the base layout.", do: "Take a snapshot per shot and restore only the lighting actors."}
      lookdev: {why: "Compare two dressing options on the same base.", do: "Use a Blueprint filter that includes only Static Mesh Actors."}

  - id: LDQ117
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [python, metrics, reports]
    required_spine: false
    required: false
    title: Python level report in ten lines
    brief: "Python is a programming language that the Unreal Editor can run to automate editor work. Python scripts only work in the editor, not in the game. A short script can count and measure everything in a level in a moment, which replaces a long time of counting by hand. In this quest you write a small script that reports how many actors of each class are in a level and how big its cover objects are."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/scripting-the-unreal-editor-using-python"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/scripting-and-automating-the-unreal-editor"
    checklist:
      - "Open any project, or create one from the Third Person template. Open a level with a number of actors in it, such as the level of the template, and give three or more meshes the actor tag Cover in their Details panel. Enable the Python Editor Script Plugin and the Editor Scripting Utilities plugin. Restart the editor."
      - "In the Output Log, switch the console input from Cmd to Python. Type import unreal, and then print(unreal.__doc__), to test that Python works."
      - "Create a file named level_report.py in the folder YourProject/Content/Python. The script must import unreal and get all actors of the level."
      - "Make the script count the actors per class and print one line for each class, sorted by count. Also print the total number."
      - "Make the script print the size of the bounding box of every actor that has the tag Cover, in meters. The bounding box is the smallest box that fits around the actor."
      - "Run the file with File > Execute Python Script. Then run it again from the list of Recent Python scripts."
      - "Open Project Settings, go to Plugins, then Python, and add the script to Startup scripts. Restart the editor and check the Output Log."
    done_when: "Send a screenshot of the Output Log that shows the counts per class and the Cover sizes from your script, and a screenshot of the Startup scripts setting with your file listed. Attach the text of the script."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Which plugin provides Python support in the Unreal Editor?"
        choices: ["Editor Scripting Utilities", "Python Editor Script Plugin", "Blueprint Utilities", "Remote Control"]
        answer_index: 1
        explain: "The Python Editor Script Plugin provides Python. Editor Scripting Utilities adds simplified APIs and is also recommended."
      - q: "Which Python version is embedded in the plugin by default?"
        choices: ["2.7", "3.7", "3.11.8", "3.13"]
        answer_index: 2
        explain: "The plugin contains an embedded Python 3.11.8, chosen because it is part of the VFX Reference Platform."
      - q: "Where can Python code run in an Unreal project?"
        choices: ["Only in the editor, never in Play In Editor or a packaged game", "Anywhere, including packaged builds and Play In Editor sessions", "Only in packaged builds, where the Python plugin is loaded at start", "Only in Play In Editor, and never while the editor is in edit mode"]
        answer_index: 0
        explain: "Python is only available in the Unreal Editor. It cannot be used as a gameplay scripting language in PIE, standalone or cooked builds."
      - q: "Which method is the only way to run Python line by line, interactively?"
        choices: ["File > Execute Python Script in the menu", "Startup scripts", "The Python console in the Output Log", "The -run=pythonscript commandlet"]
        answer_index: 2
        explain: "The console in Python mode executes each line immediately. All other approaches run a script file."
      - q: "Which folder is automatically on the Python path for your project?"
        choices: ["YourProject/Scripts", "YourProject/Config/Python", "YourProject/Saved/Python", "YourProject/Content/Python"]
        answer_index: 3
        explain: "The editor adds Content/Python of the project, of the engine, of each enabled plugin, and Documents/UnrealEngine/Python to sys.path."
      - q: "What does a file named init_unreal.py on a Python path do?"
        choices: ["Nothing until you run it by hand from the console", "It runs automatically when the editor detects it", "It replaces the unreal module for that session", "It disables the Python console for that session"]
        answer_index: 1
        explain: "If the editor finds init_unreal.py in any configured path, it runs that script immediately."
      - q: "When do Startup scripts from Project Settings run?"
        choices: ["Before the UI of the editor opens for the first time", "Only from the command line, when the editor is started with a script", "Every time you press Play, before the level begins to run", "After the default startup level is fully loaded"]
        answer_index: 3
        explain: "Startup scripts run after the default startup Level is fully loaded, each time you open the project."
      - q: "In which Blueprint classes are the Execute Python Script nodes available?"
        choices: ["Any Blueprint, including Actor Blueprints that run in the game and in packaged builds", "Only editor-only classes such as Editor Utility Widgets and Editor Utility Blueprints", "Only the Level Blueprint of a level that is open in the editor", "Only C++ classes that are compiled into an editor module of the project, and never any Blueprint class"]
        answer_index: 1
        explain: "Python execution nodes exist only in editor-only Blueprint classes. They are not available in runtime classes like Actor."
    flavors:
      _default: {why: "A report you can run in one click replaces an hour of counting by hand."}
      tech_art: {why: "This is the seed of a validation pipeline.", do: "Write the counts to a CSV file in Saved/ and open it in a spreadsheet."}
      programming: {why: "The unreal module mirrors what is exposed to Blueprint, so C++ you expose becomes Python too.", do: "Call one of your own BlueprintCallable functions from the script."}

  - id: LDQ118
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [sequencer, flythrough, review]
    required_spine: false
    required: false
    title: Flythrough sequence for level review
    brief: "Sequencer is the tool in Unreal for making camera shots and cutscenes, and a Level Sequence is the asset that stores them. A flythrough is a camera move that travels through the level and shows it in the order you want. Because it plays the same way every time, reviewers always see the space as you intended. In this quest you make a flythrough of a level with keyframes at four landmarks and with labelled marks on the timeline."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-make-movies-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/sequencer-cinematic-editor-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-camera-cut-track-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open a blockout level of your own, or the level of the template, and choose four landmarks in it, for example the entrance, a place where the route splits, the largest open space, and the exit. Click the cinematics icon in the main toolbar and choose Add Level Sequence. Name the sequence LS_Flythrough_Blockout."
      - "In Sequencer, click Create Camera. This makes a Cine Camera Actor and a Camera Cut Track, the track that decides which camera is shown."
      - "Enable Camera Lock on the Camera Cut Track, so that the viewport looks through the camera. Fly the camera to the first landmark and add a key for its transform at frame 0. A key stores a value at one point in time."
      - "Add keys for the camera at the three other landmarks. Make each move between landmarks 3 to 5 seconds long."
      - "At each landmark, right-click the time bar and choose Add Mark. Give each mark a Label with the name of the landmark, and a Color."
      - "Move to the last key and press the ] hotkey to set the End Time of the sequence there. Play the sequence with looping turned on."
      - "Open the Curve Editor and smooth one camera move that looks too harsh."
    done_when: "Send a screenshot of Sequencer with LS_Flythrough_Blockout open. It must show the Camera Cut Track, at least four transform keys, and labelled colored marks on the time bar, and the viewport must look through the cine camera."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What must exist before you can open Sequencer?"
        choices: ["A Level Sequence asset", "A Cine Camera Actor", "A Movie Render Queue preset", "A Level Blueprint event"]
        answer_index: 0
        explain: "Sequencer requires a Level Sequence asset, saved in the Content Browser and referenced by a Level Sequence Actor in the level."
      - q: "What does the Create Camera button in the Sequencer toolbar do?"
        choices: ["Renders the sequence to an image sequence with the camera that is active at the playhead", "Creates a Cine Camera Actor and a Camera Cut Track that references it, if none exists", "Adds a mark at the playhead with the name of the active camera, so that you can find the cut again later", "Opens the Curve Editor with the camera tracks selected"]
        answer_index: 1
        explain: "Create Camera makes a new Cine Camera Actor and creates a Camera Cut Track bound to it if one was not already there."
      - q: "What does enabling Camera Lock on the Camera Cut Track do?"
        choices: ["Prevents any editing of the sequence and its tracks", "Locks the frame rate of the sequence to the camera", "Deletes other cameras from the sequence, so that only one is left", "Makes the viewport look through the active camera"]
        answer_index: 3
        explain: "Camera Lock makes the viewport look through the active camera. Free viewport camera control is disabled while locked."
      - q: "Which hotkey sets the End Time of the sequence at the cursor?"
        choices: ["[", "]", "i", "m"]
        answer_index: 1
        explain: "] sets the end time, [ sets the start time, i and o set selection start and end, m adds a mark."
      - q: "What is a custom frame mark useful for?"
        choices: ["Cutting the video file at that frame on export", "Changing the frame rate of the sequence at a given frame", "Calling attention to or annotating points in the sequence", "Binding a camera to that frame of the sequence"]
        answer_index: 2
        explain: "Marks are points you add to call attention to areas or annotate the sequence. They have a Label, Comment and Color."
      - q: "How do you zoom the timeline with the mouse wheel?"
        choices: ["Hold Shift and scroll", "Hold Ctrl and scroll", "Scroll with no key", "Hold Alt and scroll"]
        answer_index: 1
        explain: "Ctrl + scroll zooms. Shift + scroll pans left and right. Plain scroll pans up and down."
      - q: "Which key resets the zoom and timeline framing when you overextend?"
        choices: ["Home", "End", "Escape", "Space"]
        answer_index: 0
        explain: "Pressing Home resets the zoom and framing and also resets the bounds of the range slider."
      - q: "What does a middle-mouse drag of the playhead do?"
        choices: ["Evaluates the sequence normally, like a drag with the left mouse button", "Deletes the current key under the playhead", "Adds a keyframe on every track at each frame that the playhead passes", "Moves the playhead without evaluating, so property values do not change"]
        answer_index: 3
        explain: "MMB drag changes the time without evaluating the sequence. The playhead turns yellow. It is used to make same-value keyframes quickly."
    flavors:
      _default: {why: "A repeatable flythrough shows reviewers the intended read of the space, every time the same way."}
      cinematics: {why: "Level flythroughs are the simplest Sequencer job and a good warm-up.", do: "Add a second camera and a blended cut between them with Can Blend."}
      lookdev: {why: "Consistent camera paths make before/after comparisons fair.", do: "Add a mark at each spot where lighting should be checked."}

  - id: LDQ119
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [movie-render-queue, video, documentation]
    required_spine: false
    required: false
    title: Render the flythrough with Movie Render Queue
    brief: "Movie Render Queue is the tool that turns a Level Sequence into image or video files on your disk. It renders every frame at full quality, even when your computer cannot play the sequence smoothly in the editor. A rendered flythrough is the easiest thing to show when you ask others to review a level. In this quest you render a flythrough as a series of PNG images and save the settings so that you can render again after each change."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/movie-render-pipeline-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-rendering-export-formats-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. You need a Level Sequence in which a camera moves through a level. If you have none, choose Add Level Sequence in the Cinematics menu of the main toolbar, click the Camera button in Sequencer, and set three or four keys on the Transform track of the camera at different places in the level. Open Edit > Plugins, find Movie Render Queue in the Rendering section, enable it, and restart the editor."
      - "Open Window > Cinematics > Movie Render Queue. Click + Render and pick the flythrough sequence."
      - "Check that the Map field in Job Details points to the level that the sequence was made in."
      - "Click Unsaved Config to open the settings. Delete the entry .jpg Sequence [8bit] and add .png Sequence [8bit]. Keep Deferred Rendering."
      - "In Output, set the Output Directory to a folder named Review_Flythrough, and set the resolution to 1280x720."
      - "Click Render (Local) and wait until the preview window closes. Then open the output folder with the Output link of the job."
      - "Save the job list as a Queue Preset named MPQ_LevelReview, so that you can render again after each change to the level."
    done_when: "Send a screenshot of the Movie Render Queue window with your job and the saved queue name in the toolbar, together with a file explorer window that shows the .png frames in Review_Flythrough."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which three tools interface with the Movie Render Pipeline?"
        choices: ["Movie Render Graph, Movie Render Queue, Quick Render", "Sequencer, Take Recorder, Media Framework Utilities", "Render Movie, Screenshot, Play In Editor", "Lightmass, Path Tracer, Lumen"]
        answer_index: 0
        explain: "The page lists Movie Render Graph (MRG), Movie Render Queue (MRQ) and Quick Render as the three tools."
      - q: "Where do you enable the Movie Render Queue plugin?"
        choices: ["Edit > Project Settings > Rendering", "Editor Preferences, under General", "Window > Cinematics > Movie Render Queue", "Edit > Plugins, Rendering section"]
        answer_index: 3
        explain: "Go to Edit > Plugins, find Movie Render Queue in the Rendering section, enable it and restart the editor."
      - q: "What output format does Movie Render Queue use by default?"
        choices: ["EXR sequence", ".png sequence", ".jpg sequence", "ProRes .mov"]
        answer_index: 2
        explain: "By default MRQ renders a sequence of .jpg images. You delete that entry and add another format to change it."
      - q: "What does Render (Local) do?"
        choices: ["Launches a separate process that reads the saved files from disk", "Renders in the same process and starts a Play In Editor session", "Uploads the job to a render farm and waits for the frames to come back", "Renders only one frame, the one that is under the playhead of Sequencer"]
        answer_index: 1
        explain: "Render (Local) renders in the Unreal Engine process and launches a PIE session. You do not need to save first."
      - q: "Why must you save your project before Render (Remote)?"
        choices: ["Because it renders in a separate process that reads files from disk", "Because it deletes every unsaved asset just before the render starts", "Because it needs source control to send the files to the other process", "You do not need to save"]
        answer_index: 0
        explain: "Render (Remote) launches a separate process. That process can only read what is saved on disk."
      - q: "Why is the Map field in Job Details useful?"
        choices: ["It sets the output folder for each level, so the frames of two levels never get mixed up", "It changes the frame rate of the sequence to the one that is saved in the World Settings of that level", "It picks the camera of that level, so the Camera Cut Track of the sequence is not needed for the job", "It lets you render the same sequence in a different level; MRQ opens that level for you"]
        answer_index: 3
        explain: "The job specifies the level to run. If the sequence uses spawnables you can render it in different levels, and MRQ opens the level automatically."
      - q: "You want an .mp4 with audio via the Command Line Encoder. What else must the job export?"
        choices: ["Nothing else, the encoder renders", "An image sequence plus a .wav Audio export", "Only a .wav Audio export of the full sequence", "A Final Cut Pro XML file and an EDL of the sequence"]
        answer_index: 1
        explain: "The Command Line Encoder needs an image sequence to build frames from, and a .wav Audio export if you want sound."
      - q: "Which Quick Render option renders a still of the current editor view?"
        choices: ["Current Sequence", "Selected Camera(s)", "Current Viewport", "Use Viewport Camera in Sequence"]
        answer_index: 2
        explain: "Current Viewport renders a still image of the current view in the editor viewport. Current Sequence renders the open Level Sequence."
    flavors:
      _default: {why: "A rendered flythrough is the easiest thing to attach to a review post."}
      cinematics: {why: "MRQ is the daily driver for cinematic output; a small job is the right first run.", do: "Add a burn-in setting so the frame number shows on the video."}
      lookdev: {why: "Offline renders show the level without real-time shortcuts.", do: "Export an EXR sequence as well and compare highlights."}

  - id: LDQ120
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [collab-viewer, review, annotations]
    required_spine: false
    required: false
    title: Review session in the Collab Viewer
    brief: "The Collab Viewer is a project template from Epic for looking at a 3D space together with other people. Several people can join the same session, walk around, measure distances, and leave notes in the world. A shared walk like this is the closest thing to standing in the level together. In this quest you package the template as a program, run a review session, add measurements and notes, and save the session."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/collab-viewer-template-quick-start-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/annotating-in-the-collab-viewer-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/measuring-in-the-collab-viewer-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/saving-and-loading-a-session-in-unreal-engine"
    checklist:
      - "Create a new project from the Collab Viewer template and open it in the editor. In the New Project window, look for it in the Architecture category."
      - "Package the project for Windows into a folder named CollabReview. To do this, open the Platforms menu, choose Windows, and click Package Project."
      - "Run the packaged .exe file. Enter a display name and start with Host a session, or with Single Session if you are alone."
      - "Press Spacebar to open the menu, choose Measurement, then Add, and measure a doorway. Hold Shift when you place the second point to snap the line to an axis."
      - "Choose Annotation, then Annotate Text, and place three labels with review notes. Then paint one stroke around a problem area."
      - "Use the Save button to save the session as Review_01. Quit the program and start it again, and then load Review_01 from the menu next to Save."
      - "Optional: ask one member to join your session on the same network and add one note."
    done_when: "Send a screenshot from the packaged Collab Viewer that shows one measurement with its value, at least three text labels, one paint stroke, and the loaded session name Review_01. Add one line that says if a second person joined."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Why does everyone in a shared session need the same packaged .exe?"
        choices: ["For licensing, because each user needs a copy that was bought by them", "Because the 3D models are compiled into the package and are not replicated between users", "Because the server checks the file dates of every user and rejects the ones that differ", "Because VR needs it, and the desktop mode would work with any build"]
        answer_index: 1
        explain: "The level content is not replicated automatically. It is compiled into the packaged application, so all users need the same version."
      - q: "What is the difference between Host a session and Single Session?"
        choices: ["Single Session has no VR support, while Host a session works with a headset and on desktop", "There is no difference; both buttons start the same session", "Host a session is view-only for the guests, while Single Session lets everyone edit", "Single Session gives the same experience but is not visible to others on the network"]
        answer_index: 3
        explain: "Single Session is the same runtime experience as hosting, except your application does not become visible to others on the network."
      - q: "Which key opens the Interaction Menu in desktop mode?"
        choices: ["Tab", "Spacebar", "Escape", "M"]
        answer_index: 1
        explain: "Press Spacebar to open the Interaction Menu, which holds Xray, Bookmarks, Transform, Measurement, Annotation and more."
      - q: "How do you snap a measurement to the x, y or z axis?"
        choices: ["Hold Ctrl when you place the first point of the measurement (VR only)", "Press Tab after measuring, once for each axis", "Hold Shift when releasing the mouse on the second point (desktop only)", "Snapping is automatic when the two points are nearly on one axis (VR only)"]
        answer_index: 2
        explain: "Hold Shift as you release the mouse button to place the second end point. This option is only available in desktop mode."
      - q: "You need to measure from an object hidden behind another. What do you use first?"
        choices: ["Xray > Apply on the objects in the way", "Delete the objects that are in the way", "Teleport inside the object that is in the way", "Paint Stroke over the objects that are in the way"]
        answer_index: 0
        explain: "Before measuring, use Xray > Apply on the obscuring objects, then pick your end point on the hidden object."
      - q: "Where are saved sessions stored?"
        choices: ["In the project's Content folder", "In YourProjectName/Saved/SaveGames", "On the host's server only", "In the Windows Documents folder"]
        answer_index: 1
        explain: "Each participant saves sessions in their own local copy, in the YourProjectName/Saved/SaveGames sub-folder."
      - q: "Which of these is NOT saved in a session?"
        choices: ["Annotations made by the users", "Measurements made by the users", "The positions of the participants", "The Xray transparency of objects"]
        answer_index: 2
        explain: "Sessions save annotations, measurements, Xray state, 3D cut sections and transformed items. Participant positions and rotations are not saved."
      - q: "How can you tell a Walk-mode user from a Fly-mode user in the session?"
        choices: ["Walk users have a human-shaped avatar; other modes show a camera", "Walk users have a red name tag; other modes have a blue name tag", "Fly users have no name tag above them; all other modes show the name", "You cannot tell, all users look alike"]
        answer_index: 0
        explain: "Users in Walk and VR modes have a human-shaped avatar. Users in other navigation modes are shown as a camera."
    flavors:
      _default: {why: "A shared walk with notes and measurements is the closest thing to standing in the level together."}
      lookdev: {why: "Art reviews benefit from Xray and measuring on real scale.", do: "Save one session with Xray applied to the walls to review the layout underneath."}
      cinematics: {why: "Bookmarks in the viewer are like camera setups for reviewers.", do: "Teleport to a preset Bookmark and annotate the framing you want."}
