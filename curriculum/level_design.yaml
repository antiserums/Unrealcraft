        answer_index: 1
        explain: "The examples force constant runtime generation, which is expensive. They are for demonstration only."
      - q: "Where is the Runtime Generation setting?"
        choices: ["Project Settings > Navigation Mesh > Runtime", "The Details panel of the Nav Modifier Volume", "World Settings > Lightmass", "Editor Preferences > Level Editor"]
        answer_index: 0
