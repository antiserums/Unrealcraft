        choices: ["An instance of the same mesh inside the same actor", "A Level Instance that holds the selected mesh", "A Static Mesh asset only, with no new actor", "A new actor with a copy of the single selected mesh"]
        answer_index: 3
        explain: "Duplicate duplicates a single mesh, creating a new actor."
      - q: "What is the difference between Merge and Union?"
        choices: ["They are the same; Union is the name in the Model category and Merge in Xform", "Merge combines meshes but keeps intersecting geometry; Union combines and resolves self-intersections", "Merge works on volumes only; Union works on Static Meshes and Dynamic Meshes", "Union keeps the meshes as separate actors in a group; Merge combines them into one single new actor"]
        answer_index: 1
        explain: "Merge (Xform) combines multiple meshes into one, keeping intersecting geometry. Union (Mesh category) combines meshes and resolves self-intersections."
      - q: "What does Bake Transform do by default?"
        choices: ["Moves the pivot to the world origin and sets the location of the actor to 0", "Freezes the actor so it cannot move until you bake again", "Bakes scale and rotation into the mesh, setting scale to 1 and rotation to 0", "Converts the mesh to a volume with the same bounds as before"]
        answer_index: 2
        explain: "Bake Transform bakes the scale and rotation values into the mesh. By default scale becomes uniformly 1 and rotation uniformly 0."
      - q: "Which output types can the Convert tool switch between?"
        choices: ["Static Mesh, Skeletal Mesh or Landscape", "Static Mesh, Dynamic Mesh or Volume", "Blueprint, Actor or Component", "Nanite, LOD or Proxy"]
        answer_index: 1
        explain: "Convert changes the Output Type of a mesh between a Static Mesh, Dynamic Mesh or Volume."
      - q: "You want to edit single instances inside an Instanced Static Mesh Component. Which tool is for that?"
        choices: ["Split", "Transfer", "ISMEd", "Align"]
        answer_index: 2
