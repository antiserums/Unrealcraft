      - "With the Sculpt tool, raise a hill. Hold Shift and drag to lower a valley next to it."
      - "Select the Flatten tool. Set Flatten Mode to Raise and make a flat plateau on the hill side. Note that the higher parts do not change."
      - "Select the Ramp tool. Click two points from the plateau down to the valley, set Ramp Width and Side Falloff, then click Add Ramp."
      - "Select the Erosion tool. Lower the Threshold and paint the steep side of the hill. Watch how the steep side erodes faster."
