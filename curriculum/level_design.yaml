        answer_index: 3
        explain: "With Num Steps 0 the trees only grew for one year, so the low seed density looked empty. Setting Num Steps back to 3 lets the trees grow and spread."
      - q: "What does a Procedural Foliage Blocking Volume do?"
        choices: ["Blocks the player from entering the forest, like a Blocking Volume does", "Prevents the spawner from placing any Foliage Type inside its bounds", "Adds collision to all trees inside its bounds, so the player cannot walk through", "Stops the Resimulate button from working while the volume is selected in the level"]
