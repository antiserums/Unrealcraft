    brief: "World Partition splits a large world into a grid of cells and loads only the cells near the player. Two settings control this: Cell Size is how big each cell is, and Loading Range is how far around the player cells are loaded. Together they decide how far the player can see and how much memory the world uses. In this quest you read these settings, change them, and watch the effect on a long line of cubes."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/dynamic-loading-range-scaling-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a World Partition level (File > New Level and then Open World works) and save it as L_WP_Grid. Place 30 cubes in a straight line, one every 50 m, so that the line is about 1.5 km long. Add a Player Start at one end."
      - "Open World Settings and find World Partition Setup. Turn on Preview Grids. Write down the Grid Name, Cell Size and Loading Range of the default grid."
      - "Start Play In Editor. Open the console and run wp.Runtime.ToggleDrawRuntimeHash2D, which draws a small map of the cells. Count how many cells are loaded around the player and take a screenshot."
      - "In the same session, run wp.Runtime.OverrideRuntimeSpatialHashLoadingRange -grid=0 -range=25600. Watch how many cells are loaded now and take a second screenshot."
      - "Stop the game. In World Settings, set Loading Range to half of its old value. Play again and walk along the line of cubes. Note the moment when cubes appear."
      - "Select two cubes far from the start and set their Runtime Grid property to None on purpose. Then turn off Is Spatially Loaded on one of them. Play and check which of the two is always there."
      - "In World Settings, go to World Partition and then Advanced, and enable Dynamic Loading Range Scaling. Set Initial to 25 percent, Delay to 2 seconds and Duration to 10 seconds. Start Play In Editor and watch the loaded area grow during the first seconds."
    done_when: "Send two Play In Editor screenshots with wp.Runtime.ToggleDrawRuntimeHash2D turned on: one at the default Loading Range and one with the override. Add three lines: the Cell Size you chose, the Loading Range you chose, and what the player saw with the smaller range."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "In the World Partition Setup, what does Loading Range control?"
        choices: ["The distance from the camera at which HLOD meshes are still drawn", "The number of grids that the world is split into", "The size of each grid cell, measured in Unreal units", "The range from a streaming source inside which cells are loaded"]
        answer_index: 3
        explain: "Loading Range is the distance around a streaming source where cells load. Cell Size is a separate setting for the size of each cell."
      - q: "An actor has Runtime Grid set to None. What happens?"
        choices: ["The actor is placed in the HLOD grid instead", "The actor is never loaded, in the editor or in game", "The actor is always loaded, at any distance from it", "The partition system chooses the grid for it"]
        answer_index: 3
        explain: "The page says: if Runtime Grid is None, the grid will be chosen by the partition system. None does not mean unloaded."
      - q: "You add a second runtime grid for big props. What does Epic warn about this?"
        choices: ["Only one grid can have HLODs, so all of the big props lose theirs", "A second grid disables One File Per Actor for the whole level", "Using more than one grid can negatively impact performance", "Two grids cannot share streaming sources, so you need two players"]
        answer_index: 2
        explain: "A 2D Runtime Hash grid is provided by default, and the documentation states that using more than one grid can negatively impact performance."
      - q: "What does wp.Runtime.OverrideRuntimeSpatialHashLoadingRange -grid=0 -range=25600 do?"
        choices: ["Sets the cell size of grid 0 to 25600 units for this session", "Sets the runtime loading range of grid 0 to 25600 units for this session", "Saves a new Loading Range of 25600 into World Settings", "Limits the number of cells that can load at the same time to 25600 cells"]
        answer_index: 1
        explain: "This console command overrides the runtime loading range. -grid picks the grid index and -range gives the new loading range. It is a runtime override, not a saved setting."
      - q: "Which console command limits how many World Partition cells can load at the same time?"
        choices: ["wp.Runtime.MaxLoadingLevelStreamingCells", "wp.Runtime.ToggleDrawRuntimeHash3D", "wp.Runtime.ShowRuntimeSpatialHashGridIndex", "wp.Runtime.HLOD 0"]
        answer_index: 0
        explain: "wp.Runtime.MaxLoadingLevelStreamingCells limits the number of concurrent loading streaming cells. The others are debug display commands."
      - q: "What does Block on Slow Streaming do?"
        choices: ["Blocks loading in situations where grid cells are not loading fast enough", "Makes every cell load at the start of the level, before play", "Turns off streaming in the editor, so all cells stay loaded", "Stops all streaming while the game is paused, so no cell loads in a menu"]
        answer_index: 0
        explain: "Block on Slow Streaming is a runtime grid setting that blocks when cells are not loading fast enough, so the player does not run into unloaded space."
      - q: "Dynamic Loading Range Scaling is enabled with Initial set to 100 percent. What is the effect?"
        choices: ["PIE starts with nothing loaded", "The feature is effectively still disabled", "Cooked builds also load faster after that", "The loading range doubles"]
        answer_index: 1
        explain: "At 100 percent the initial range equals the full range, so nothing changes. The feature is editor-only and only affects PIE, never cooked builds."
      - q: "Why does Epic tell you to avoid an Initial Dynamic Loading Range Scaling of 0 percent?"
        choices: ["It makes the build fail when the project is packaged for a platform", "It disables the streaming sources of all Player Controllers", "Your pawn can fall through geometry that is not loaded yet", "It deletes the runtime grid when the level is saved the next time"]
        answer_index: 2
        explain: "With 0 percent almost nothing is loaded when PIE starts, so the ground under the pawn may not exist yet and the pawn can fall through."
    flavors:
      _default: {why: "Cell Size and Loading Range decide how far the player can see and how much memory the world uses. A designer must know how to read and change them."}
      level_design: {why: "You pick loading ranges by where the player can look and how fast they move.", do: "Test the grid with the fastest vehicle or sprint speed you plan to ship."}
      lookdev: {why: "Pop-in of props is often a loading range problem, not an LOD problem.", do: "Note which cubes popped in at the smaller range and how far they were."}

  - id: LDQ82
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [world-partition, streaming, blueprint, open-world]
    required_spine: false
    required: false
    title: Preload a teleport target
    brief: "In a World Partition level, only the area around the player is loaded. If you teleport the player to a far place, that place is not loaded yet, and the player may fall through a floor that does not exist. A streaming source is something that tells World Partition to load the cells around it, and you can add one as a component to any actor. In this quest you use a streaming source to load a teleport target before the player arrives."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition-in-unreal-engine"
    backup_url: null
    extra_urls: []
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a World Partition level with streaming enabled, or create one with File, New Level, Open World. Build two small platforms about 2 km apart: Pad_A near the Player Start and Pad_B far away. Put a few cubes and a light around Pad_B, so that you can see when it is loaded."
      - "Make an Actor Blueprint named BP_StreamAnchor and add a World Partition Streaming Source component to it. Turn Streaming Source Enabled off, set Target State to Activated, and pick a Debug Color. Place one anchor on Pad_B."
      - "Make an Actor Blueprint named BP_TeleportPad with a Box collision. Add two editable variables: Destination of the type Actor, and Anchor of the type BP_StreamAnchor. Place it on Pad_A and set both variables."
      - "On Begin Overlap by the player, call Enable Streaming Source on the component of the Anchor. Then start a looping timer of 0.2 seconds that checks Is Streaming Completed. When it returns true, use Set Actor Location to move the player to the Destination, and then call Disable Streaming Source."
      - "Start Play In Editor and run wp.Runtime.ToggleDrawRuntimeHash2D. Step on Pad_A and watch the cells load around Pad_B before you jump. Take a screenshot while both areas are loaded."
      - "Now test the wrong way: disconnect Enable Streaming Source so that you teleport at once. Write down what you see at Pad_B in the first second."
      - "Open the anchor and set Priority to 10. Read the tooltips of Shapes and Target Grid, and write one line that says when you would use each."
    done_when: "Send a screenshot of the event graph of BP_TeleportPad, and a Play In Editor screenshot where the runtime hash debug view shows loaded cells at both pads. Add two lines that say what happened when you teleported without the anchor."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which of these is a streaming source by default, without adding any component?"
        choices: ["Every Static Mesh Actor", "Each Player Controller", "The World Settings actor", "Every Location Volume"]
        answer_index: 1
        explain: "Each Player Controller is a World Partition streaming source through its Enable Streaming Source option, which is on by default."
      - q: "What is the documented use case for a World Partition Streaming Source component?"
        choices: ["Loading cells at a teleport destination before the player arrives", "Baking HLODs faster by loading all of their source actors at one time", "Replacing Level Streaming Volumes in sublevels of a persistent level", "Making one actor always loaded in the runtime grid"]
        answer_index: 0
        explain: "The example on the page activates a streaming source where the player will teleport, waits for the cells to load, teleports, then deactivates the source."
      - q: "The anchor's Shapes list is empty. What shape does the source use?"
        choices: ["A sphere with a radius equal to the grid loading range", "A box with the bounds of the mesh that the actor uses", "A box the size of one cell of the runtime grid", "No shape, so the source loads nothing at all"]
        answer_index: 0
        explain: "If Shapes is empty, the component uses a sphere whose radius equals the grid loading range. Shapes lets you build a custom shape instead."
      - q: "One cell is inside two streaming sources: one with Target State Loaded and one with Target State Activated. What state does the cell get?"
        choices: ["Loaded, because it is the safer state", "Activated, because the highest target value wins", "The state of the source that was enabled first", "Unloaded, because the sources conflict"]
        answer_index: 1
        explain: "When a cell intersects several sources, the target state is the highest value, and Activated is greater than Loaded."
      - q: "Which Blueprint function tells you the source has finished loading the cells it touches?"
        choices: ["Enable Streaming Source", "Load Stream Level", "Is Streaming Completed", "Get Streaming Level"]
        answer_index: 2
        explain: "Is Streaming Completed returns true when the component has finished streaming the grid cells it intersects. Enable and Disable Streaming Source only switch the source on and off."
      - q: "After the teleport, the old cells around Pad_A unload. Why?"
        choices: ["Because Disable Streaming Source unloads the whole world for a moment", "Because Target State was set to Loaded and not to Activated on the old source", "Because the timer was cleared, and cells unload when no timer is running", "Because there is no longer a streaming source at the old location"]
        answer_index: 3
        explain: "Cells stay loaded only while a streaming source is in range. Once the player is gone and the anchor is disabled, nothing keeps those cells loaded."
      - q: "What does the Priority setting on a streaming source decide?"
        choices: ["How many cells can load per frame around that source when the frame time is too high", "Which source teleports the player when two sources are enabled at the same time in one world", "The loading range of the source, where a higher value loads cells that are farther away", "Which source's priority a cell gets when several sources overlap it, the highest one"]
        answer_index: 3
        explain: "If a cell intersects multiple sources, its priority is the highest priority among all of them. Priority does not change range or cell count."
      - q: "What does Target HLOD Layer on the component do?"
        choices: ["Sets the HLOD material that is used for all cells around the source", "Builds the HLODs of that layer when the source is first enabled", "Determines the HLOD Layer affected by this streaming source", "Turns HLODs off around the source, so that only full actors are drawn"]
        answer_index: 2
        explain: "Target HLOD Layer chooses which HLOD Layer this source affects, next to Target Grid which chooses the streaming grid."
    flavors:
      _default: {why: "Teleports, fast travel and cutscene jumps all break if the destination is not loaded yet. A streaming source fixes that."}
      level_design: {why: "You decide where players jump. You must also decide what loads first.", do: "Add a short fade or door animation that covers the wait for Is Streaming Completed."}
      gameplay_design: {why: "Fast travel systems need a load-before-move step.", do: "Expose the wait as a loading bar in a simple widget."}

  - id: LDQ83
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [level-instancing, world-partition, data-layers, workflow]
    required_spine: false
    required: false
    title: Twelve camps from one Level Instance
    brief: "Big worlds repeat content, such as camps, houses or checkpoints. A Level Instance saves a group of actors as its own small level that you can place many times, and when you edit one copy, every copy is updated. In a World Partition level these copies also load and unload like normal actors. In this quest you build one camp, place it twelve times, edit all of them at once, and put some of them on a Data Layer."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-instancing-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition---data-layers-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-editor-context-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a World Partition level, or create one with File, New Level, Open World. Build a small camp from 6 blockout meshes, one Point Light and one Trigger Box. Select all of them, right-click, open Level, and choose Create Level Instance. Keep External Actors on, set Pivot Type to Center Min Z, and save it as LI_Camp."
      - "Copy LI_Camp until you have 12 camps spread over about 2 km. Check the Outliner: the actors of each camp are children of its Level Instance Actor, and you cannot select them on their own."
      - "Edit one camp (right-click, open Level, then choose Edit). Look at the Actor Editor Context widget in the bottom-right of the viewport, which shows what you are editing. Add a barrel mesh and click Commit Changes. Confirm that all 12 camps got the barrel."
      - "Make a Runtime Data Layer asset named DL_Camps, and make an instance of it in the Data Layer Outliner. Assign 4 of the camps to DL_Camps. Click the eye icon and confirm that the whole camp, including the light and the trigger, follows the layer."
      - "Start Play In Editor and run wp.Runtime.ToggleDrawRuntimeHash2D. Walk away from a camp until its cell unloads, and then come back. Notice that the camp streams like normal actors, which is called Embedded Mode."
      - "Select one camp and use Break Level Instance. Read the warning. Write down what stayed in the Content Browser and what changed in the level."
      - "Write 3 lines: when you would use a Level Instance, when you would use a Packed Level Actor, and why a Level Instance without OFPA (One File Per Actor) streams differently."
    done_when: "Send a screenshot of the Outliner with 12 LI_Camp actors and the Data Layer Outliner showing DL_Camps with 4 camps, and add your 3 lines of text."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which type does Epic recommend for static buildings and dense visual setups?"
        choices: ["Level Instance", "Packed Level Blueprint", "Location Volume", "Always Loaded sublevel"]
        answer_index: 1
        explain: "Packed Level Blueprints combine static meshes into one optimized Blueprint Actor and are recommended for static buildings and dense visual setups. Level Instances suit points of interest and gameplay setups."
      - q: "What does Embedded Mode do with a Level Instance that uses One File Per Actor at runtime?"
        choices: ["Streams it as a separate sublevel with Level Streaming Mode, as before", "Keeps it as one actor forever, in the editor and at runtime", "Discards the instance and adds its actors to the World Partition grid", "Converts it into a Packed Level Actor when you save"]
        answer_index: 2
        explain: "In Embedded Mode the Level Instance exists only in the editor. At runtime its OFPA actors are added directly to the World Partition grid."
      - q: "A Level Instance does NOT use OFPA. How does it stream in a World Partition world?"
        choices: ["It cannot be placed at all in a World Partition world, and the editor shows an error", "It is always loaded, whatever cell it is in and however far away", "It becomes a Data Layer, and its actors load when that Data Layer is activated", "It uses Level Streaming Mode and loads its level when its owning cell loads"]
        answer_index: 3
        explain: "Level Instances without OFPA cannot be embedded, so they use standard level streaming when their Level Instance Actor's cell loads. This costs more, so a high density of them is not recommended."
      - q: "Which non-OFPA actor does the page name as lost at runtime in Embedded Mode?"
        choices: ["All Static Mesh Actors that are in the embedded level", "The Player Start of the embedded level, with its tag", "The Directional Light of the embedded level, and its Sky Light", "The World Settings object of the embedded Level Instance"]
        answer_index: 3
        explain: "Non-OFPA actors such as the AWorldSettings of an embedded Level Instance do not exist at runtime. Do not rely on them, or use Level Streaming Mode."
      - q: "You assign a Level Instance Actor to a Data Layer. What happens to the actors inside it?"
        choices: ["They lose their own Data Layers and keep only the one that the Level Instance has", "They keep no Data Layer at all, not even their own ones", "They inherit the Data Layer by default and can also have extra Data Layers", "They must be assigned to the same Data Layer one by one, by hand, afterwards"]
        answer_index: 2
        explain: "Actors in a Level Instance inherit the Data Layer of the Level Instance Actor by default, and they also support additional Data Layers of their own."
      - q: "What is true about Breaking a Level Instance?"
        choices: ["It can be undone with Ctrl+Z, like any other edit in the level", "It replaces the actor with the original assets and cannot be undone", "It only works on Packed Level Actors, not on Level Instances", "It deletes the Level asset from the Content Browser and cannot be undone"]
        answer_index: 1
        explain: "Breaking puts the original actors back and removes the Level Instance Actor. The asset stays in the Content Browser, but the operation cannot be undone."
      - q: "How do you leave Level Instance editing WITHOUT saving your changes?"
        choices: ["Press Esc twice", "Click Commit Changes", "Close the Outliner", "Delete the Level Instance Actor"]
        answer_index: 0
        explain: "Commit Changes saves and propagates the edit to all copies. Pressing Esc twice leaves editing without committing."
      - q: "What does the Actor Editor Context widget show while you edit a Level Instance?"
        choices: ["The current open Level Instance, and new actors go into it", "The HLOD Layer of the Level Instance, and new actors are assigned to it", "The runtime grid name of the open level, and new actors are put in that grid", "The current sublevel only, and new actors go to the main level"]
        answer_index: 0
        explain: "Editing a Level Instance creates a new context. Actors you add go into the open Level Instance, and on commit the editor returns to the previous context."
    flavors:
      _default: {why: "Big worlds repeat content. Level Instances let you fix one camp and update all of them, and they stream like normal actors."}
      level_design: {why: "Points of interest with triggers and lights are exactly what Level Instances are for.", do: "Give one camp a nested Level Instance for a reusable campfire kit."}
      lookdev: {why: "Knowing when a Packed Level Actor is the better choice saves draw calls.", do: "Rebuild the camp's static meshes as a Packed Level Actor and compare the Outliner."}

  - id: LDQ84
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [hlod, world-partition, performance, open-world]
    required_spine: false
    required: false
    title: HLOD layers with a parent
    brief: "HLOD, short for Hierarchical Level of Detail, replaces far away actors with cheap stand-in meshes called proxies, so that a distant town stays visible while its real cells are unloaded. An HLOD Layer is the asset that holds the settings for how the proxies are built. One layer can have a parent layer, which builds an even simpler proxy for even larger distances. In this quest you set up a town layer with a horizon layer as its parent, and compare the world with and without HLODs."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition---hierarchical-level-of-detail-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition-builder-commandlet-reference"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a World Partition level, or create one with File, New Level, Open World. Create two HLOD Layer assets: HLOD_Town with Layer Type Merged Mesh, and HLOD_Horizon with Layer Type Simplified Mesh. In HLOD_Horizon, turn on Always Loaded and note which settings disappear."
      - "In HLOD_Town, set Parent Layer to HLOD_Horizon. Set its Loading Range to about twice the Loading Range of your grid."
      - "In World Settings, set Default HLOD Layer to HLOD_Town. Place 40 building blocks (boxes with 2 or 3 materials) in 4 groups, all with Mobility set to Static. Do not set the HLOD property on them, because they should use the default layer."
      - "Open the Build menu and run Build HLODs. In the viewport, open Level of Detail Coloration and choose Hierarchical LOD Coloration. Move far away until the proxies are shown in blue."
      - "In HLOD_Horizon, open Proxy Settings and set Merge Distance to 300. Build the HLODs again. Compare the far proxy before and after: small gaps such as doorways should now be closed."
      - "Start Play In Editor and walk far away. Run wp.Runtime.HLOD 0 and then wp.Runtime.HLOD 1 to see the world without HLODs and with HLODs. Take a screenshot of each."
      - "Write 3 lines: which layer is the child, which layer is always loaded, and why the horizon layer does not need a Loading Range."
    done_when: "Send two Play In Editor screenshots taken from far away, one with wp.Runtime.HLOD 0 and one with HLODs on. Also send a screenshot of the HLOD_Town asset that shows Parent Layer, and add your 3 lines."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "What does the Parent Layer setting on an HLOD Layer do?"
        choices: ["Copies the merge settings from another HLOD Layer when this layer is built", "Sets the layer as the default in World Settings for every actor that has no layer", "Makes the layer load before its child layers do at runtime", "Automatically assigns the assets this layer creates to another HLOD Layer"]
        answer_index: 3
        explain: "Parent Layer sends the HLOD assets generated by this layer into the designated layer, so proxies can themselves get a further HLOD."
      - q: "You enable Always Loaded on an HLOD Layer. Which settings become unavailable?"
        choices: ["Mesh Merge Settings", "Layer Type and HLODMaterial", "Cell Size and Loading Range", "Parent Layer only"]
        answer_index: 2
        explain: "Cell Size and Loading Range configure the runtime grid for the HLOD actors. An always-loaded layer has no streaming grid, so both options are hidden."
      - q: "Which Layer Type replaces meshes with Instanced Static Mesh components using the lowest LOD?"
        choices: ["Simplified Mesh", "Instancing", "Proxy Mesh", "Merged Mesh"]
        answer_index: 1
        explain: "Instancing keeps the source assets as ISM components at their lowest LOD. It is meant for imposters such as trees and foliage."
      - q: "What is the difference between Merged Mesh and Simplified Mesh?"
        choices: ["Merged Mesh combines meshes into one proxy; Simplified Mesh also runs mesh simplification", "Merged Mesh works only on Nanite meshes; Simplified Mesh works on every mesh and also on landscapes", "Simplified Mesh keeps a separate material for each source mesh; Merged Mesh uses one only", "There is no difference; both names build the very same proxy mesh"]
        answer_index: 0
        explain: "Both merge the static meshes into a single proxy. Simplified Mesh additionally reduces the geometry, controlled by Proxy Settings such as Screen Size."
      - q: "Where can an actor get its HLOD Layer from? Pick the complete list."
        choices: ["The actor's HLOD property, the Default HLOD Layer of a Data Layer, or the Default HLOD Layer in World Settings", "Only the World Settings; the HLOD property on an actor and the layer of a Data Layer are ignored", "The HLOD Layer of its Level Instance, or the HLOD Layer of the first actor in the same cell", "Only the HLOD Layer property in the Details panel of the actor; Data Layers and World Settings have no HLOD setting"]
        answer_index: 0
        explain: "The page lists three ways: the HLOD property on the actor, the Default HLOD Layer property of a Data Layer, and the Default HLOD Layer property of the World Settings."
      - q: "Merge Distance in Proxy Settings is set to a non-zero value. What does it do?"
        choices: ["Merges materials into one flat material", "Closes gaps like doors and windows in distant geometry", "Sets the distance at which the proxy mesh first appears", "Removes triangles under the landscape"]
        answer_index: 1
        explain: "Merge Distance closes small gaps in the far proxy. Unresolved Geometry Color then fills areas that no longer map to source geometry."
      - q: "You rebuild HLODs but nothing changed in the source actors. What happens?"
        choices: ["The build fails with an error that nothing changed", "All HLOD Actors are rebuilt anyway, as before", "HLOD Actors are not recreated or rebuilt", "The HLOD Actors are deleted and not built again"]
        answer_index: 2
        explain: "HLOD Actors are only rebuilt when their source actors, meshes, materials or textures changed. Unchanged HLODs are skipped."
      - q: "Which commandlet option removes every HLOD Actor from the map?"
        choices: ["-ResaveActors", "-SetupHLODs", "-BuildHLODs", "-DeleteHLODs"]
        answer_index: 3
        explain: "-DeleteHLODs deletes all HLOD Actors. -SetupHLODs creates or updates the actors without geometry and -BuildHLODs builds the geometry."
    flavors:
      _default: {why: "A distant town that vanishes breaks the picture of a big world. HLOD layers keep the horizon while the real cells stay unloaded."}
      level_design: {why: "Landmarks guide players from far away only if they are still visible when unloaded.", do: "Make your main landmark part of HLOD_Horizon so it never disappears."}
      lookdev: {why: "Merge Distance and material baking change how the far proxy looks.", do: "Compare Merge Materials on and off in HLOD_Town and note the texture quality."}

  - id: LDQ85
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [level-streaming, sublevels, pacing, performance]
    required_spine: false
    required: false
    title: Streaming volumes without the hitch
    brief: "Before World Partition, large levels were split by hand into sublevels, which are smaller levels that are loaded into one main level called the persistent level. Many games still work this way. A Level Streaming Volume is a box that loads a sublevel when the player's view enters it and unloads the sublevel when the view leaves. In this quest you set up three sublevels with volumes and adjust them so that the player does not notice the loading."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-streaming-volumes-reference-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-streaming-using-volumes-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-streaming-overview-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/managing-multiple-levels-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make a level without World Partition named L_Trail_P, with a Player Start. Make three small levels named L_Cave, L_Ridge and L_Village, each with a few blockout meshes. In Window > Levels, use Add Existing to add all three as sublevels with the streaming type Blueprint."
      - "Place three Level Streaming Volumes in L_Trail_P, the persistent level, one for each sublevel. Make each volume larger than the walkable area it covers. Open the Level Details of each sublevel, add its volume under Streaming Volumes, and uncheck Initially Loaded and Initially Visible."
