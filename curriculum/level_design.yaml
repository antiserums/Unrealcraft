  - id: LDQ100
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [pcg, landscape, landscape-layers, biomes]
    required_spine: false
    required: false
    title: "Landscape paint layers steer the scatter"
    brief: "A landscape can be painted with layers such as Grass, Rock and Path. PCG, the Procedural Content Generation framework, can read these painted layers and use them to decide where to place things. This means that painting a layer is the fastest way to tell a procedural system where bushes or boulders belong, and where the path must stay empty. In this quest you build a graph that places bushes on Grass, boulders on Rock, and nothing on the Path."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-content-generation-framework-node-reference-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-content-generation-framework-data-types-reference-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-content-generation-overview"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open Edit, then Plugins, and enable the Procedural Content Generation Framework (PCG) plugin if it is off."
      - "You need a landscape that has at least three painted layers: Grass, Rock and Path. If you have none, make a material with a Landscape Layer Blend node that has these three layers, each with its own color. Create a Landscape with this material, and create a layer info object for each layer on the Paint tab."
      - "Paint the Path layer along a route across the landscape, and paint some Grass and some Rock areas."
      - "Create a PCG graph named PCG_Biome. Add a World Ray Hit Query node and enable Apply Metadata From Landscape, so that the points know which layers are painted under them. Connect it to a Surface Sampler."
      - "Add an Attribute Filter on the attribute of the Grass layer, and keep values above 0.5. Spawn bushes from its Inside pin."
      - "Add a second Attribute Filter on the attribute of the Rock layer. Spawn boulders from its Inside pin."
      - "Add a Normal To Density node before the boulders, so that steep slopes get fewer boulders."
      - "Add a Spatial Noise node. Use its attribute with a Match And Set Attributes node to choose between two bush meshes."
      - "Paint part of the Path layer again in a new place and click Generate again. Confirm that the route stays empty."
    done_when: "Send one screenshot of the graph that shows the World Ray Hit Query and both Attribute Filters. Also send one viewport screenshot where the painted Path stays free while Grass has bushes and Rock has boulders."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Which option makes the World Ray Hit Query node read landscape paint layer values for each hit?"
        choices: ["Ignore PCG Hits", "Return Physical Material", "Get Reference To Physical Material", "Apply Metadata From Landscape"]
        answer_index: 3
        explain: "Apply Metadata From Landscape gets the landscape layer values when the raycast hits the landscape. The docs note it has a small performance cost."
      - q: "How does the PCG data types reference describe a Landscape?"
        choices: ["A Volume, which is 3D data with a box shape", "A Line, which is 1D data along the landscape border of the level", "A Surface, which is 2D data mapped to the XY plane", "An Attribute Set, which has no spatial data at all"]
        answer_index: 2
        explain: "Surfaces are 2D spatial data such as Landscapes mapped to the XY plane. The Surface Sampler generates points on a plane and projects them onto a 3D shape."
      - q: "A Landscape Spline is raised above the terrain. Where does PCG treat its line data?"
        choices: ["Projected vertically, always at the landscape surface", "At the raised height of the spline points", "It is ignored until the spline is applied to the terrain", "At the PCG Volume origin, whatever the height of the spline is"]
        answer_index: 0
        explain: "Landscape Spline data is projected vertically and always applies at the surface, even if the spline is offset from the Landscape. It is read with Get Spline Data or the Spline Sampler."
      - q: "What is the difference between Attribute Filter and Attribute Filter Range?"
        choices: ["Range works only on spline data and ignores all point attributes", "Range separates data into inside the range and outside the range", "Range is for integers only, and Attribute Filter is for floats", "There is no difference; Range is the newer name of the same node"]
        answer_index: 1
        explain: "Attribute Filter Range is the range-based version. Input data is split into what is inside the range and what is outside the range, so both outputs can be used."
      - q: "Why use Spatial Noise instead of a random value per point?"
        choices: ["It is faster, because the noise is read from a texture that the GPU makes once for the whole graph", "It builds a spatially-consistent pattern such as Perlin noise, giving natural looking distributions", "It only works with the Static Mesh Spawner node, which reads the noise to pick a mesh for each point", "It changes point density to 1 on all points"]
        answer_index: 1
        explain: "Spatial Noise writes a spatially-consistent noise pattern to an attribute. Used with Match And Set Attributes and input-driven weights, it gives more natural selections."
      - q: "What does the Steepness value on a PCG point control?"
        choices: ["The slope of the landscape under the point, from flat (0) to a wall (1)", "The rotation of the spawned mesh around the up axis, from 0 to 1 turns", "The order of spawning for the points, where higher values spawn first", "The softness of the volume the point represents, shaping its influence"]
        answer_index: 3
        explain: "Each point has 3D bounds and represents a region of space. Steepness controls the softness of that volume and the shape of its influence."
      - q: "Why is a point's Seed computed from its position?"
        choices: ["So random results are world-position consistent", "So all points share one seed", "So the seed matches the landscape layer under it", "So the seed can be edited by hand"]
        answer_index: 0
        explain: "The Seed is consumed by random number generators. It is computed from the position so that random behaviour stays consistent for the same world position."
      - q: "What is Get Landscape Data in relation to Get Actor Data?"
        choices: ["A Blueprint node, not a PCG node, with the same name", "A slower alias that gives the same output as Get Actor Data", "A specialisation that returns appropriately typed Landscape data", "A node that only returns the heightmap textures of the Landscape"]
        answer_index: 2
        explain: "Get Landscape Data is a specialisation of the Get Actor Data node that returns appropriately typed and constructed Landscape data."
    flavors:
      _default: {why: "Painting a layer is the fastest way to tell a procedural system where things belong."}
      level_design: {why: "Your Path layer becomes a single source of truth for both the look and the scatter.", do: "Add a fourth layer called Cover and spawn low walls only there."}

  - id: LDQ101
