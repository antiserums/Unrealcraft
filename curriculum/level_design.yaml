    taster_for_majors: []
    adjacent_for: [gameplay_design, programming]
    required_spine: false
    elective: true
    title: Preload a teleport target
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition-in-unreal-engine"
    backup_url: null
    extra_urls: []
    checklist:
      - "In a World Partition level with streaming enabled, build two small platforms about 2 km apart: Pad_A near the Player Start and Pad_B far away. Put a few cubes and a light around Pad_B so you can see when it is loaded."
      - "Make BP_StreamAnchor (Actor). Add a World Partition Streaming Source component. Set Streaming Source Enabled off, Target State to Activated, and pick a Debug Color. Place one anchor on Pad_B."
      - "Make BP_TeleportPad (Actor with a Box collision). Add two editable variables: Destination (Actor) and Anchor (BP_StreamAnchor). Place it on Pad_A and set both variables."
      - "On Begin Overlap by the player: call Enable Streaming Source on the Anchor component. Then start a 0.2 second looping timer that checks Is Streaming Completed. When it returns true, Set Actor Location of the player to the Destination, then call Disable Streaming Source."
      - "Play In Editor. Run wp.Runtime.ToggleDrawRuntimeHash2D, step on Pad_A and watch cells load around Pad_B before you jump. Take a screenshot while both areas are loaded."
      - "Test the wrong way: disconnect Enable Streaming Source and teleport at once. Write down what you see at Pad_B in the first second."
      - "Open the anchor and set Priority to 10. Read the tooltip of Shapes and Target Grid and write one line on when you would use each."
    done_when: "Screenshot of the BP_TeleportPad event graph, plus a Play In Editor screenshot with the runtime hash debug showing loaded cells at both pads. Add two lines: what happened when you teleported without the anchor."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which of these is a streaming source by default, without adding any component?"
        choices: ["Every Static Mesh Actor", "Each Player Controller", "The World Settings actor", "Every Location Volume"]
        answer_index: 1
        explain: "Each Player Controller is a World Partition streaming source through its Enable Streaming Source option, which is on by default."
      - q: "What is the documented use case for a World Partition Streaming Source component?"
        choices: ["Loading cells at a teleport destination before the player arrives", "Baking HLODs faster", "Replacing Level Streaming Volumes in sublevels", "Making an actor always loaded"]
        answer_index: 0
        explain: "The example on the page activates a streaming source where the player will teleport, waits for the cells to load, teleports, then deactivates the source."
      - q: "The anchor's Shapes list is empty. What shape does the source use?"
        choices: ["A sphere with a radius equal to the grid loading range", "The bounds of the actor's mesh", "A box the size of one cell", "No shape, so it loads nothing"]
        answer_index: 0
        explain: "If Shapes is empty, the component uses a sphere whose radius equals the grid loading range. Shapes lets you build a custom shape instead."
      - q: "One cell is inside two streaming sources: one with Target State Loaded and one with Target State Activated. What state does the cell get?"
        choices: ["Loaded, because it is the safer state", "Activated, because the highest target value wins", "The state of the source that was enabled first", "Unloaded, because the sources conflict"]
        answer_index: 1
        explain: "When a cell intersects several sources, the target state is the highest value, and Activated is greater than Loaded."
      - q: "Which Blueprint function tells you the source has finished loading the cells it touches?"
        choices: ["Enable Streaming Source", "Load Stream Level", "Is Streaming Completed", "Get Streaming Level"]
        answer_index: 2
        explain: "Is Streaming Completed returns true when the component has finished streaming the grid cells it intersects. Enable and Disable Streaming Source only switch the source on and off."
      - q: "After the teleport, the old cells around Pad_A unload. Why?"
        choices: ["Because Disable Streaming Source unloads the whole world", "Because Target State was Loaded", "Because the timer was cleared", "Because there is no longer a streaming source at the old location"]
        answer_index: 3
        explain: "Cells stay loaded only while a streaming source is in range. Once the player is gone and the anchor is disabled, nothing keeps those cells loaded."
      - q: "What does the Priority setting on a streaming source decide?"
        choices: ["How many cells can load per frame", "Which source teleports the player", "The loading range of the source", "Which source's priority a cell gets when several sources overlap it, the highest one"]
        answer_index: 3
        explain: "If a cell intersects multiple sources, its priority is the highest priority among all of them. Priority does not change range or cell count."
      - q: "What does Target HLOD Layer on the component do?"
        choices: ["Sets the HLOD material", "Builds HLODs when the source is enabled", "Determines the HLOD Layer affected by this streaming source", "Turns HLODs off around the source"]
        answer_index: 2
        explain: "Target HLOD Layer chooses which HLOD Layer this source affects, next to Target Grid which chooses the streaming grid."
    flavors:
      _default: {why: "Teleports, fast travel and cutscene jumps all break if the destination is not loaded yet. A streaming source fixes that."}
      level_design: {why: "You decide where players jump. You must also decide what loads first.", do: "Add a short fade or door animation that covers the wait for Is Streaming Completed."}
      gameplay_design: {why: "Fast travel systems need a load-before-move step.", do: "Expose the wait as a loading bar in a simple widget."}

  - id: LDQ83
    rank: 2
    difficulty: adept
    track: level-design
    subjects: [level-instancing, world-partition, data-layers, workflow]
    required_for_majors: []
    taster_for_majors: []
    adjacent_for: [lookdev, gameplay_design]
    required_spine: false
    elective: true
    title: Twelve camps from one Level Instance
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-instancing-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition---data-layers-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-editor-context-in-unreal-engine"
    checklist:
      - "In a World Partition level, build a small camp: 6 blockout meshes, one Point Light and one Trigger Box. Select all, right-click > Level > Create Level Instance. Keep External Actors on, set Pivot Type to Center Min Z, save as LI_Camp."
      - "Copy LI_Camp so you have 12 camps spread over about 2 km. Check the Outliner: the camp actors are children of each Level Instance Actor and cannot be selected on their own."
      - "Edit one camp (right-click > Level > Edit). Look at the Actor Editor Context widget in the bottom-right of the viewport. Add a barrel mesh, then click Commit Changes. Confirm all 12 camps got the barrel."
      - "Make a Runtime Data Layer asset DL_Camps and an instance of it in the Data Layer Outliner. Assign 4 of the camps to DL_Camps. Toggle the eye icon and confirm the whole camp, including the light and trigger, follows the layer."
      - "Play In Editor and run wp.Runtime.ToggleDrawRuntimeHash2D. Walk away from a camp until its cell unloads and come back. Note that the camp streams like normal actors (Embedded Mode)."
      - "Select one camp and use Break Level Instance. Read the warning. Write down what stayed in the Content Browser and what changed in the level."
      - "Write 3 lines: when you would use a Level Instance, when a Packed Level Actor, and why a Level Instance without OFPA streams differently."
    done_when: "Screenshot of the Outliner with 12 LI_Camp actors and the Data Layer Outliner showing DL_Camps with 4 camps, plus your 3-line writeup."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which type does Epic recommend for static buildings and dense visual setups?"
        choices: ["Level Instance", "Packed Level Blueprint", "Location Volume", "Always Loaded sublevel"]
        answer_index: 1
        explain: "Packed Level Blueprints combine static meshes into one optimized Blueprint Actor and are recommended for static buildings and dense visual setups. Level Instances suit points of interest and gameplay setups."
      - q: "What does Embedded Mode do with a Level Instance that uses One File Per Actor at runtime?"
        choices: ["Streams it as a separate sublevel", "Keeps it as one actor forever", "Discards the instance and adds its actors to the World Partition grid", "Converts it into a Packed Level Actor"]
        answer_index: 2
        explain: "In Embedded Mode the Level Instance exists only in the editor. At runtime its OFPA actors are added directly to the World Partition grid."
      - q: "A Level Instance does NOT use OFPA. How does it stream in a World Partition world?"
        choices: ["It cannot be placed at all", "It is always loaded", "It becomes a Data Layer", "It uses Level Streaming Mode and loads its level when its owning cell loads"]
        answer_index: 3
        explain: "Level Instances without OFPA cannot be embedded, so they use standard level streaming when their Level Instance Actor's cell loads. This costs more, so a high density of them is not recommended."
      - q: "Which non-OFPA actor does the page name as lost at runtime in Embedded Mode?"
        choices: ["All Static Mesh Actors", "The Player Start", "The Directional Light", "The World Settings object of the embedded Level Instance"]
        answer_index: 3
        explain: "Non-OFPA actors such as the AWorldSettings of an embedded Level Instance do not exist at runtime. Do not rely on them, or use Level Streaming Mode."
      - q: "You assign a Level Instance Actor to a Data Layer. What happens to the actors inside it?"
        choices: ["They lose their own Data Layers", "They keep no Data Layer", "They inherit the Data Layer by default and can also have extra Data Layers", "They must be reassigned one by one"]
        answer_index: 2
        explain: "Actors in a Level Instance inherit the Data Layer of the Level Instance Actor by default, and they also support additional Data Layers of their own."
      - q: "What is true about Breaking a Level Instance?"
        choices: ["It can be undone with Ctrl+Z", "It replaces the actor with the original assets and cannot be undone", "It only works on Packed Level Actors", "It deletes the Level asset from the Content Browser"]
        answer_index: 1
        explain: "Breaking puts the original actors back and removes the Level Instance Actor. The asset stays in the Content Browser, but the operation cannot be undone."
      - q: "How do you leave Level Instance editing WITHOUT saving your changes?"
        choices: ["Press Esc twice", "Click Commit Changes", "Close the Outliner", "Delete the Level Instance Actor"]
        answer_index: 0
        explain: "Commit Changes saves and propagates the edit to all copies. Pressing Esc twice leaves editing without committing."
      - q: "What does the Actor Editor Context widget show while you edit a Level Instance?"
        choices: ["The current open Level Instance, and new actors go into it", "The HLOD Layer", "The runtime grid name", "The current sublevel only"]
        answer_index: 0
        explain: "Editing a Level Instance creates a new context. Actors you add go into the open Level Instance, and on commit the editor returns to the previous context."
    flavors:
      _default: {why: "Big worlds repeat content. Level Instances let you fix one camp and update all of them, and they stream like normal actors."}
      level_design: {why: "Points of interest with triggers and lights are exactly what Level Instances are for.", do: "Give one camp a nested Level Instance for a reusable campfire kit."}
      lookdev: {why: "Knowing when a Packed Level Actor is the better choice saves draw calls.", do: "Rebuild the camp's static meshes as a Packed Level Actor and compare the Outliner."}

  - id: LDQ84
    rank: 2
    difficulty: adept
    track: level-design
    subjects: [hlod, world-partition, performance, open-world]
    required_for_majors: []
    taster_for_majors: []
    adjacent_for: [lookdev, tech_art]
    required_spine: false
