        choices: ["Sets its health to zero through Apply Damage, so the actor runs its own death logic and effects", "Calls the FellOutOfWorld function on it; by default the actor cleans up and destroys itself", "Teleports it to the nearest Player Start and resets its velocity to zero", "Pauses its physics simulation, so the actor hangs in the air inside it"]
