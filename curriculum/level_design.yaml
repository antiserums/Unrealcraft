    verify_type: screenshot
    quiz:
      - q: "In the Opening Doors tutorial, which two keys are added to the DoorRotationZ float track?"
        choices: ["(0, 0) and (1, 45)", "(0, 0) and (5, 90)", "(0, 90) and (5, 0)", "(0, 45) and (10, 90)"]
        answer_index: 1
        explain: "The tutorial adds one key at time 0 value 0 and one at time 5 value 90, then sets both to Auto interpolation."
      - q: "How is the Timeline's DoorRotationZ value turned into a door rotation in the tutorial?"
        choices: ["Connected to Set Actor Location", "Connected to Set World Scale", "Connected to the Z (Yaw) pin of Make Rotator, feeding Set Relative Rotation on the Door mesh", "Connected to Add Actor Local Offset"]
        answer_index: 2
        explain: "The Update pin drives SetRelativeRotation, and the float goes into the Z (Yaw) pin of a Make Rotator node."
      - q: "Which Timeline pins does the tutorial connect to On Component Begin Overlap and On Component End Overlap?"
        choices: ["Play and Stop", "Play from Start and Set New Time", "Reverse and Play", "Play and Reverse"]
        answer_index: 3
        explain: "Begin Overlap goes to Play, and End Overlap goes to Reverse, so the door closes when the player leaves the box."
      - q: "What is the difference between the Timeline inputs Play and Play from Start?"
        choices: ["Play resumes from the current time; Play from Start begins at the beginning", "Play runs once; Play from Start loops", "Play is for float tracks; Play from Start is for event tracks", "There is no difference"]
        answer_index: 0
        explain: "The Timelines page says Play plays forward from the current time, while Play from Start plays forward from the beginning."
      - q: "You connect a sound to the Timeline's Finished output. When will it NOT fire?"
        choices: ["When the Timeline finishes playing backwards", "When the Timeline is stopped with the Stop input", "When the Timeline is played from start", "When Direction is Forward"]
        answer_index: 1
        explain: "The Timelines page states that Finished fires when playback ends, but it is not triggered by the Stop function."
      - q: "Why does the Open Doors with Keys tutorial put the color-changing logic in the Construction Script?"
        choices: ["Because the Event Graph cannot change materials", "So the door changes color while you set it up in the level editor, not only when gameplay starts", "Because Construction Scripts run faster at runtime", "Because Timelines only work in Construction Scripts"]
        answer_index: 1
        explain: "The tutorial says the door should change color as you set it up in the level, so it uses the Construction Script instead of waiting for game mode."
      - q: "In the same tutorial, what is a local variable used for inside fnHasKey?"
        choices: ["To store a temporary boolean while the function runs, then pass it out through a Return Node", "To save the key to disk", "To replicate the key state to clients", "To expose the key type in the Details panel"]
        answer_index: 0
        explain: "Local variables are local to a function and store temporary values while it runs; the result is passed back with a Return Node."
      - q: "How does an Enum switch node differ from an Int switch node in how its output pins are created?"
        choices: ["Enum switches need a Start Index", "Enum switches have only a Default pin", "Enum switches generate output pins automatically from the enum's values", "Enum switches must be edited in the Details panel one pin at a time"]
        answer_index: 2
        explain: "The Flow Control page says Enum switches automatically generate outputs from the Enum's properties, while Int, String and Name switches have customizable pins."
    flavors:
      _default: {why: "A door's state tells the player what to do next, before they touch it."}
      level_design: {why: "Three door states cover most gating in a level: go, find the key, come back later.", do: "Use the sealed door to hide a shortcut that opens after the final beat, and check the player can read the color from 10 meters."}
