      - "Type Wall in the Outliner search. Then type Wall Door and note that fewer or no Actors show (all terms must match)."
      - "Type -Light to hide all lights. Then type +Door and check that Door matches but DoorFrame does not."
      - "Open the Filter drop-down and save your search as a custom filter named BlockoutWalls."
      - "Right-click a column header and turn on one extra column (for example Type). Resize it."
      - "Select an Actor in the viewport and press F with the Outliner focused; then do the same from the Outliner."
      - "Open Window > Outliner and add a second Outliner instance with a different filter."
