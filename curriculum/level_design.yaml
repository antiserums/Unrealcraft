    title: Spawn points you can control
    brief: "A Player Start is the actor that marks where the player appears in a level and which way the player looks. This is the first pacing decision in any level, because it decides the first thing the player sees. When a level has several Player Starts, you can give each one a tag and choose between them by name. In this quest you place tagged Player Starts, build a debug respawn that sends you to the one you choose, and spawn pickups at Target Points."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/player-start-actor-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/target-point-actors-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Game/RestartPlayeratPlayerStart"
    checklist:
      - "Open a project made from the Third Person template, or create one. Work in a blockout level with three clearly different places, for example an entrance, a middle room and a final arena. The level of the template works if you pick three spots in it. Place three Player Start actors, one in each place. Rotate each one so that its arrow points at the next landmark, because the player faces that way on spawn."
      - "Select each Player Start and set its Player Start Tag in the Details panel to Start_Entrance, Start_Mid and Start_Arena. If a Player Start shows a BADsize label, move it until its capsule no longer overlaps any geometry."
      - "Create a Blueprint named BP_GM_Test with Game Mode Base as its parent class. Add a Name variable called DebugStartTag and turn on Instance Editable. In World Settings, set the GameMode Override of the level to BP_GM_Test."
      - "A Game Mode does not receive key presses, so put the debug key in the character Blueprint, BP_ThirdPersonCharacter. Add a keyboard event for a key such as R. From it, call Get Game Mode and cast the result to BP_GM_Test. On the Game Mode, call Find Player Start with Player set to Get Player Controller and Incoming Name set to DebugStartTag. Then call Restart Player at Player Start with the same Player Controller and the result as the Start Spot."
      - "Add three Target Point actors named TP_Pickup_1 to TP_Pickup_3. Create BP_PickupSpawner with an Instance Editable array of Target Point references. On BeginPlay, loop over the array and use Spawn Actor from Class to spawn a pickup or a simple cube at the transform of each Target Point."
      - "Test it: set DebugStartTag to Start_Arena, press the debug key, and confirm that you respawn in the arena and face the right way. Then set the Play Options to spawn at the current camera location and start PIE from the mid room."
    done_when: "Send a screenshot of PIE after the debug respawn at Start_Arena, with the player facing the landmark. Also send a screenshot of the Outliner that shows the three tagged Player Starts and the three Target Points."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "A level has no Player Start actor at all. Where does the page say the player spawns?"
        choices: ["At the camera position of the last saved viewport", "At the world origin, 0,0,0", "PIE refuses to start until you add one", "At the first Static Mesh in the Outliner"]
        answer_index: 1
        explain: "The page states that without a Player Start the player always starts at the 0,0,0 coordinates of the world."
      - q: "With several Player Starts and no custom logic, how does the engine pick one?"
        choices: ["The one closest to the world origin, at 0,0,0, whatever is around it", "The one that was placed first and is at the top of the Outliner", "Randomly, preferring Player Starts that are not obstructed", "The one with the lowest Z value in the level"]
        answer_index: 2
        explain: "The page says the player starts from a random Player Start each time, prioritizing unobstructed ones. ChoosePlayerStart implements this."
      - q: "What does the white BADsize label with red borders on a Player Start mean?"
        choices: ["The Player Start overlaps or intersects something in the level", "The Player Start is too far from the world origin of the level", "The Player Start tag is empty, so FindPlayerStart cannot find it by name", "The Player Start scale is not 1,1,1, so the capsule has the wrong size"]
        answer_index: 0
        explain: "BADsize appears when the capsule overlaps props or terrain. Move it until the capsule no longer intersects anything."
      - q: "Which node finds a Player Start by the string set in its Player Start Tag?"
        choices: ["Get All Actors of Class with the tag as class", "Restart Player with the tag as New Player", "Spawn Default Pawn at Transform with the tag", "FindPlayerStart with the tag in Incoming Name"]
        answer_index: 3
        explain: "FindPlayerStart looks for a Player Start whose Player Start Tag matches the Incoming Name it receives."
      - q: "According to the page, does the engine usually pass an Incoming Name when it calls FindPlayerStart on its own?"
        choices: ["Yes, it always passes the name of the level, so the tag of each Player Start must match the level name too", "No, in most cases it passes no Incoming Name, so the tag lookup is useful mainly when you call it yourself", "Yes, it passes the player's name, so each Player Start must have the name of one player as its tag to be found", "Only in multiplayer sessions, where the server passes the team name of the player who is joining as the Incoming Name"]
        answer_index: 1
        explain: "The page says the engine does not provide an Incoming Name in most internal calls, so the tag behavior matters when you call FindPlayerStart in your own code."
      - q: "You want to keep the default FindPlayerStart behavior but choose the first spawn with your own rules. Which function should you override?"
        choices: ["ChoosePlayerStart", "RestartPlayerAtPlayerStart", "InitGame", "HandleStartingNewPlayer"]
        answer_index: 0
        explain: "The page recommends overriding ChoosePlayerStart when you want custom selection at first join but want FindPlayerStart to keep working as normal."
      - q: "You want to test a room deep in the level without walking there. Which option does the page give?"
        choices: ["Delete all other Player Starts, so the engine has to use the one in the room, and add them again when you are done with the test", "Add a Target Point in the room and set it as the spawn point in the Game Mode section of the World Settings panel", "Use Play Options > Spawn Player At current camera location, or right-click the viewport and choose Play From Here", "Set World Settings Kill Z above the room, so that the player respawns inside that room"]
        answer_index: 2
        explain: "The page lists both methods: the Spawn Player At option in Play Options, and Play From Here in the viewport context menu."
      - q: "Why does the Target Point Actors page recommend Target Points for pickups?"
        choices: ["They automatically spawn the pickup mesh at their place when the level starts, with no Blueprint and no code needed for it", "They give a generic point in the world you can spawn items from, like a dummy object in other 3D apps", "They block the NavMesh around them so that AI characters walk around the pickup and never take it away", "They replace Player Starts in multiplayer, so every player spawns next to a pickup"]
        answer_index: 1
        explain: "Target Points are generic world positions, similar to dummy actors in 3ds Max or Maya, used as spawn points for items, VFX and AI paths."
    flavors:
      _default: {why: "Where a player appears, and where they look, is the first pacing decision in any level."}
