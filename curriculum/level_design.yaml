    title: "Light channels: light the key, not the room"
    brief: "Normally a light shines on every object in its range. Lighting channels let you choose which objects a light affects: a light only lights the objects that share a channel with it. This lets you put a spotlight on one important object, such as a key, without making the whole room brighter. In this quest you light a key prop on its own channel and see why this does not work on Static objects."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-lighting-channels-in-unreal-engine"
    backup_url: null
    extra_urls: []
    checklist:
      - "Open any project, or create one from the Third Person template. Build a dim room from cubes, with a cube as a table. Place a key prop on the table. Any small mesh works, such as a small cylinder or cone. Set its mobility to Movable."
      - "Add a Spot Light named SL_KeyHighlight and aim it at the key. Its mobility can be Stationary or Movable."
      - "Select the light. In the Details panel, open the Light category, then Advanced, and find Lighting Channels. Turn off Channel 0 and turn on Channel 1."
      - "Select the key mesh. In the Lighting category, find Lighting Channels and turn on Channel 1."
      - "Check that the table and the walls stay dim while the key is lit. If any other mesh also lights up, fix its channels."
      - "Test the reverse: set the key back to Static mobility and note what happens."
    done_when: "Send a screenshot of the lit key on a dim table, and add one line that says what happened when the key was Static."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "How many lighting channels does Unreal Engine support?"
        choices: ["2", "4", "8", "3"]
        answer_index: 3
        explain: "The docs say Unreal Engine supports up to 3 lighting channels at the moment."
      - q: "Which channel is on by default for lights and lit actors?"
        choices: ["Channel 1", "Channel 0", "Channel 2", "None"]
        answer_index: 1
        explain: "Directional, Spot and Point Lights and all lit actors have Channel 0 enabled by default."
      - q: "A light is on Channel 1 but the prop is not lit. What is the most likely mistake?"
        choices: ["The light must be Static to use a channel", "The prop must be translucent for Channel 1 to light it", "The prop must also have Channel 1 enabled", "Channel 1 needs a light build before it works"]
        answer_index: 2
        explain: "You must enable the channel on both the actor and the light for them to overlap."
      - q: "Where is the Lighting Channels property on a light?"
        choices: ["Rendering category", "Light > Advanced", "Lightmass category", "Physics category"]
        answer_index: 1
        explain: "For lights it is under the Advanced pulldown of the Light category. For actors it is under Lighting."
      - q: "Which combination does NOT work with lighting channels?"
        choices: ["Movable light and Movable mesh", "Stationary light and Movable mesh", "Movable light and Skeletal Mesh", "Static light and Static mesh"]
