    title: Outliner search and custom filters
    brief: "The Outliner is the panel that lists every actor in your level. A real level can have thousands of actors, so being able to find the right one in a second saves a lot of time. In this quest you name your actors clearly, learn the search rules of the Outliner, and save a search as a custom filter that you can use again."
