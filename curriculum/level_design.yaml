      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-editor-context-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a World Partition level: create one with File, New Level, Open World if you have none. Then open Window > World Partition > Data Layer Outliner, the panel that lists the Data Layers of this level."
      - "In the Content Browser, right-click, open Miscellaneous, and choose Data Layer. Make two assets this way: DL_Blockout with the type Editor, and DL_Ruins with the type Runtime."
      - "Drag both assets into the Data Layer Outliner. This creates a Data Layer Instance for each one, which is the version of the Data Layer that belongs to this level."
      - "Place a few cubes as a small blockout and select them. Then right-click DL_Blockout in the Data Layer Outliner and choose Add Selected Actors to Selected Data Layers."
      - "Place a few other meshes on the same spot that stand for ruins, for example tilted and scaled cubes, and add them to DL_Ruins. On the DL_Ruins instance, set Initial Runtime State so that the layer starts unloaded."
      - "Click the eye icon on DL_Blockout a few times to hide and show the blockout."
      - "In the Level Blueprint, add a key press event that uses the node Set Data Layer Instance Runtime State to set DL_Ruins to Activated. Test it in Play In Editor."
    done_when: "Send one screenshot of the Data Layer Outliner that shows both instances and their actors. Also send a short video clip (30 seconds or less), or two screenshots, taken in Play In Editor that show the level before and after the key press."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the difference between a Data Layer Asset and a Data Layer Instance?"
        choices: ["They are the same thing with two names; the editor shows Asset in the Content Browser and Instance in the Outliner for the same object", "The Asset is project-level and not world specific; the Instance is world specific and created in the Data Layer Outliner", "The Asset is used at runtime only and holds the actors; the Instance is editor only and holds the name and color of the layer", "The Instance lives in the Content Browser and can be used in any world; the Asset lives in the level and is made in the Data Layer Outliner"]
