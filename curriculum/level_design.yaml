    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/navigation-mesh-settings-in-the-unreal-engine-project-settings"
    checklist:
      - "Open a project made from the Third Person template, or create one. In a new level, build two floor areas with a gap between them, and a raised platform that has a ledge. Cover all of it with one NavMeshBoundsVolume."
      - "Place an AI character that roams around. To make one, duplicate BP_ThirdPersonCharacter, delete its input nodes, and add an event that calls Get Random Reachable Point In Radius with a radius of 1000 and then AI Move To, and repeats after a Delay of 4. Press P and confirm that the two floor areas are not connected by the NavMesh."
      - "From the Place Actors panel, drag in a Nav Link Proxy. Move its two handles, PointLinks[0].Left and Right, onto the NavMesh on each side of the gap. The green arrow must stay visible, because it shows that the link is connected."
      - "In the Details panel, open Point Links and then entry 0, and set Direction to Left to Right. Click Simulate and watch the AI cross in one direction only."
      - "Add a second Nav Link Proxy at the ledge. Put its Left handle on the edge of the platform and its Right handle on the floor below, and set Direction to Left to Right. The AI can now drop down."
      - "Select RecastNavMesh-Default and enable Draw Tile Bounds to see the tiles of the NavMesh. Check that each link connects tiles that are next to each other."
    done_when: "Send one screenshot with P turned on that shows both Nav Link Proxies with their green arrows visible. Add one sentence that says which Direction each link uses and why."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "What is a Nav Link Proxy for?"
        choices: ["To raise the cost of an area so that agents walk around it", "To hide the NavMesh in Play mode, so the green area is not drawn", "To connect two NavMesh areas that have no continuous path", "To spawn AI at a point of the NavMesh when the level begins to play"]
        answer_index: 2
        explain: "Nav Link Proxies are extra connections used during path search. They bridge separate areas and let agents fall or jump toward their goal."
      - q: "The green arrow on your Nav Link Proxy disappears. Why?"
        choices: ["An end point is not touching the NavMesh surface", "The link is set to Both Ways, which has no arrow", "The level has no Nav Modifier Volume for the link", "You have too many links in one NavMesh tile"]
        answer_index: 0
        explain: "The guide says the green arrow disappears if the Nav Link Proxy does not connect with the surface of the NavMesh. Move the handles onto the mesh."
      - q: "You want AI to drop off a ledge but never climb back up. Which setting?"
        choices: ["Area Class = NavArea_Null, with a volume on top of the ledge", "Smart Link Is Relevant turned off on that one link", "Direction = Both Ways, with a higher cost for the way up", "Direction = Left to Right, with Left on the ledge"]
        answer_index: 3
        explain: "Point Links have a Direction: Both Ways, Left to Right or Right to Left. A one-way link from the ledge (Left) to the floor (Right) allows only the drop."
      - q: "Which of these is NOT a Direction option on a Point Link?"
        choices: ["Both Ways", "Up to Down", "Left to Right", "Right to Left"]
        answer_index: 1
        explain: "The three options are Both Ways, Left to Right and Right to Left. There is no Up to Down."
      - q: "A long Nav Link Proxy across the map does not work. The likely reason:"
        choices: ["Links need a Nav Modifier Volume around both of their end points", "Links only work when Runtime Generation is set to Dynamic in the settings", "Links can only connect adjacent NavMesh tiles; check with Draw Tile Bounds", "Links cannot be longer than 1 meter, whatever the size of a tile is"]
        answer_index: 2
        explain: "Nav Link Proxies can only connect adjacent Navigation Mesh tiles. Enable Draw Tile Bounds on the RecastNavMesh actor to see the tiles."
      - q: "You want the agent to really jump (with a launch) when it uses a link. What does the guide do?"
        choices: ["A Blueprint child of Nav Link Proxy using Event Receive Smart Link Reached, with Smart Link Is Relevant enabled", "Set the Direction to Both Ways and raise the Jump Z Velocity of the agent in the Details panel of the Nav Link Proxy actor", "Raise Agent Max Step Height in the NavMesh settings until the agent can step over the gap without any link at all", "Add a Nav Modifier component to the link, with an Area Class that tells the Character Movement component to jump there"]
        answer_index: 0
        explain: "The guide creates BP_NavProxyLink from Nav Link Proxy, reacts to Event Receive Smart Link Reached to launch the character, copies the end points to the Smart Link and enables Smart Link Is Relevant."
    flavors:
      _default: {why: "Ledges, gaps and ladders break the NavMesh. Nav Links are how a level designer tells AI that the jump or drop is allowed."}
      gameplay_design: {why: "One-way drops let enemies chase the player down but not back up. That is a pacing tool.", do: "Add one one-way drop that lets enemies follow the player into an arena but not leave it."}

