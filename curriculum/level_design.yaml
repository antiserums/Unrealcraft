      - q: "From the ground you can see a gap between the end of your Ocean Water Body and the horizon. What fills it cheaply?"
        choices: ["A second Ocean Water Body placed behind the first", "A bigger Cell Size on the Water Zone", "The Far Distance Mesh of the Water Zone actor", "A Post Process Volume with thick fog that hides the gap"]
        answer_index: 2
