      - "Open your blockout level. Click the Level Snapshot button in the main toolbar. Name it Base_v1 and add a description."
      - "Move five cover meshes, delete one, and add a new one. Take a second snapshot named Variant_Open."
      - "Open the Level Snapshots window, select Base_v1 and click Restore Level Snapshot. Check that all changes are reverted."
      - "Undo the restore. Tag two cover actors with the tag KeepMe."
