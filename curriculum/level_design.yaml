    title: A two-floor elevator with call buttons
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/timelines-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/flow-control-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/opening-doors-in-unreal-engine"
    checklist:
      - "Create BP_Elevator (Actor): a platform mesh, a Scene component CabRoot, and a Timeline LiftTimeline with a float track Height (keys 0,0 and 4,1, Auto interpolation). Add a Float variable FloorHeight (Instance Editable, default 400)."
      - "On Update, set the platform's relative Z location to Height multiplied by FloorHeight. On Finished, print the Direction output (Forward means arrived at the top, Backward at the bottom) and open a Gate node."
      - "Add two Custom Events CallUp and CallDown. CallUp goes through the Gate and calls Play; CallDown goes through the same Gate and calls Reverse. Close the Gate when either starts, so the cab ignores calls while moving."
      - "Create BP_CallButton (Actor) with a Box Collision, a Boolean IsUpButton and an Instance Editable reference to BP_Elevator. On overlap with the player it calls CallUp or CallDown. Place one at each floor."
      - "Add a Stop input: a third button on the cab that calls Stop, then a Set New Time and Play from Start to return to the bottom. Check that Finished does not fire on Stop."
      - "Ride the elevator in PIE between two rooms of your blockout. Confirm you do not slide off, and that pressing both buttons quickly does not restart the ride mid-way."
    done_when: "A short video or two screenshots of the cab at each floor with the printed Direction message, plus one line on how you stopped double calls."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What does the Timeline's Direction output pin give you?"
        choices: ["A float with the current playback time", "An enum saying which direction the Timeline is playing", "A boolean that is true only when finished", "The name of the active track"]
        answer_index: 1
        explain: "The Timelines page lists Direction as an output of enum data indicating the direction of playback."
      - q: "Which input freezes playback at the current time without triggering Finished?"
        choices: ["Reverse from End", "Set New Time", "Stop", "Play from Start"]
        answer_index: 2
        explain: "Stop freezes the Timeline at the current time, and the page notes that Finished is not triggered by Stop."
      - q: "What does the New Time data pin expect, and when is it used?"
        choices: ["A float in seconds, applied when Set New Time is called", "An integer frame index, applied every Update", "A boolean, applied on Play", "A vector, applied on Finished"]
        answer_index: 0
        explain: "New Time takes a float time in seconds, and the Timeline jumps there when the Set New Time input is called."
      - q: "The Timelines page compares Timelines with Level Sequences. What kind of tasks are Timelines built for?"
        choices: ["Multi-camera cinematics", "Simple, non-cinematic tasks like opening doors or altering lights", "Character animation retargeting", "Loading levels"]
        answer_index: 1
        explain: "Timelines are for simple, non-cinematic time-based tasks on actors. Both Timelines and sequences interpolate floats, vectors and colors."
      - q: "Where can you open a Timeline for editing, according to the page?"
        choices: ["Only from the Content Browser as an asset", "By double-clicking it in the Graph tab or in the My Blueprint tab", "From Window > Timeline Editor", "Only in Sequencer"]
        answer_index: 1
        explain: "Timelines are edited inside the Blueprint editor by double-clicking the Timeline in the Graph tab or My Blueprint tab."
      - q: "Your Gate should ignore button presses while the cab moves. Which pins do you pulse to stop and later allow calls?"
        choices: ["Toggle for both", "Reset then Enter", "Close when the ride starts, Open when it finishes", "Start Closed then Exit"]
        answer_index: 2
        explain: "The Flow Control page describes Close and Open as the pins that set the gate state; Enter pulses pass to Exit only while open."
      - q: "What does Start Closed on a Gate node control?"
        choices: ["Whether the gate begins in the closed state", "Whether the gate closes after one pulse", "Whether Exit fires on the first frame", "Whether the gate resets on Toggle"]
        answer_index: 0
        explain: "Start Closed is a boolean input: if true the gate begins closed."
      - q: "What does a FlipFlop node's Is A output tell you?"
        choices: ["Whether the node has fired more than once", "Whether output A is being triggered this time, toggling between true and false on each call", "Whether the node is reset", "The number of times A has fired"]
        answer_index: 1
        explain: "Is A is a boolean that shows whether output A is firing, so it toggles every time the FlipFlop is triggered."
