    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/timelines-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-03-open-doors-with-keys-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/flow-control-in-unreal-engine"
    checklist:
      - "Build BP_DoorV2 following the Opening Doors page: DoorFrame as root, Door mesh with Y location 45, a Box Collision, and a Timeline DoorTimelineComponent with a float track DoorRotationZ (keys at 0,0 and 5,90, Auto interpolation)."
      - "Create an Enum E_DoorState with Free, Locked, Sealed. Add an Instance Editable variable DoorState of that type, and a Boolean UseKey plus a Name RequiredKey (category Setup)."
      - "In the Construction Script, use Switch on E_DoorState to set a different material color on the Door mesh: Free = green, Locked = red, Sealed = grey. Check the color changes in the level as you edit the variable."
      - "On Box Begin Overlap: Switch on DoorState. Free plays the Timeline. Locked checks UseKey and RequiredKey against the player (interface or cast) and plays a short deny sound if missing. Sealed does nothing."
      - "On Box End Overlap, call Reverse on the Timeline only if the door is Free. Use the Timeline's Finished pin to play a click sound, and read the Direction output to print Opening or Closing."
      - "Add a Custom Event Unseal that sets DoorState to Free and re-runs the color logic. Place three doors in your blockout, one per state, and call Unseal on the sealed one from a pacing trigger. Test all three in PIE."
    done_when: "Screenshot of the three colored doors in the level with their DoorState values visible in the Details panel, plus a PIE screenshot of the sealed door open after Unseal."
