    subjects: [world-partition, streaming, open-world]
    required_spine: false
    required: false
    title: "World Partition: load only what you need"
    brief: "World Partition is the system Unreal uses for very large levels. It divides the world into a grid of cells and loads only the cells near the player, which is called streaming. Without it, a big open world would not fit in memory. In this quest you create an Open World level, load a region of it in the editor, and see how actors load and unload as you move."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/one-file-per-actor-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/dynamic-loading-range-scaling-in-unreal-engine"
    checklist:
      - "Create a new level with File > New Level and choose Open World. Save it as L_WP_Test."
      - "Open Window > World Partition > World Partition Editor. Drag on the map to mark a region, then right-click and choose Load Region from Selection."
      - "Place 10 cubes far apart inside the loaded region. Select one cube and find the World Partition section in the Details panel. Look at the option Is Spatially Loaded, which means the actor loads only when a player is near."
      - "Turn off Is Spatially Loaded on one cube and rename that cube to Cube_AlwaysLoaded."
      - "Open World Settings and find World Partition Setup. Enable Preview Grids and write down the values of Cell Size and Loading Range."
      - "Drag a Location Volume from the Place Actors panel, place it around your cubes, and save. Then find its region in the World Partition window."
      - "Start Play In Editor and walk away from the cubes until they unload. Then come back and see them load again."
    done_when: "Send one screenshot of the World Partition window with your loaded region, and one screenshot of World Settings that shows Cell Size and Loading Range. Add one line that says which actor you made always loaded and why."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "What is World Partition, in one sentence?"
        choices: ["A tool that splits a map into many sublevel files by hand", "An automatic data management and distance-based streaming system that keeps the world in one persistent level split into grid cells", "A plugin for landscapes only", "A way to package the game"]
        answer_index: 1
        explain: "World Partition stores the world in a single persistent level, divides it into grid cells, and loads or unloads cells based on distance from a streaming source."
      - q: "You turn off Is Spatially Loaded on a backdrop mountain actor. What does this mean?"
        choices: ["The actor is never loaded", "The actor is loaded only when the player is close", "The actor is loaded regardless of distance, as long as it is not in a disabled Data Layer", "The actor is deleted at runtime"]
        answer_index: 2
        explain: "Non spatially loaded actors do not depend on distance. They load when not assigned to a disabled Data Layer, which is why they are used for backdrops and managers."
      - q: "By default, what acts as a streaming source in a World Partition level?"
        choices: ["Every Static Mesh", "Each Player Controller", "The Sky Light", "The Landscape"]
        answer_index: 1
        explain: "Each Player Controller is used as a streaming source through its Enable Streaming Source option, which is on by default."
      - q: "In the World Settings example on the page, Cell Size is 256 m and Loading Range is 768 m. What does Loading Range control?"
