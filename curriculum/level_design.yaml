    flavors:
      _default: {why: "Repeated structure is the backbone of most levels; tools that repeat for you save hours."}
      level_design: {why: "Colonnades, tile grids and rings set rhythm and scale that players read at once.", do: "Match the Line spacing to your metrics (for example one column per 400 units) and note it in your metrics sheet."}

  - id: LDQ104
