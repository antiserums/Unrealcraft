    quiz:
      - q: "What must you do before you can place a Text 3D actor?"
        choices: ["Import a TTF font first", "Enable the Text 3D plugin under Edit > Plugins and restart", "Create a Level Sequence", "Turn on Game View"]
        answer_index: 1
        explain: "3D Text needs the Text 3D plugin. Enable it from the Text tab in Edit > Plugins, accept the experimental warning and restart."
      - q: "How do you make a line break in the Text field?"
        choices: ["Type a slash", "Press Enter twice", "Increase Line Spacing", "Press Shift + Enter"]
        answer_index: 3
        explain: "The page says to press Shift + Enter to create a line break in the Text property."
      - q: "What does the Extrude setting control?"
        choices: ["The depth of the letters from front to back", "The space between letters", "The maximum width of the text", "The size of the edge bevel"]
        answer_index: 0
        explain: "Extrude sets the depth of the geometry, how thick the letters are. Bevel and Kerning are separate settings."
      - q: "Which Bevel Type options does the Text 3D actor offer?"
        choices: ["Round or Square", "Soft or Hard", "Linear or Half Circle", "Inner or Outer"]
        answer_index: 2
        explain: "Bevel Type is Linear for a sharp, flat bevel or Half Circle for a rounded edge. Half Circle Segments sets the curve detail."
      - q: "Which material slots does a Text 3D actor have?"
        choices: ["One material for the whole text", "Front, Bevel, Extrude and Back", "Base and Emissive", "Left, Right, Top and Bottom"]
        answer_index: 1
        explain: "The Details panel has Front Material, Bevel Material, Extrude Material and Back Material for the four surfaces of the letters."
      - q: "On a Text3DCharacterTransform component, what does a Progress value of 100 mean?"
        choices: ["The animation has 100 letters", "The animation runs at full speed", "The text is 100 units wide", "The letters are at their End state"]
        answer_index: 3
        explain: "Progress moves the letters between the Begin state at 0 and the End state at 100. This is the value you usually animate in a Level Sequence."
    flavors:
      _default: {why: "A note that sits in the world is seen by everyone who plays the level, not only by people who read a document."}
      level_design: {why: "Notes at the exact spot of a problem make review walks faster and fix lists clearer.", do: "Number your notes and match the numbers to a fix list in your metrics sheet."}
      cinematics: {why: "Text 3D can animate letter by letter in Sequencer for titles and motion graphics.", do: "Add a Text3DCharacterTransform component and scrub Progress from 0 to 100 to preview it."}
      lookdev: {why: "The four material slots make 3D text a quick test object for your unlit and emissive materials.", do: "Assign a different material to Front and Extrude and check readability at distance."}
