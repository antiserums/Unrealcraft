    brief: "The console is a text line inside the running game where you can type commands. Some of these commands are cheats that let you slow down time, fly through walls, teleport or take no damage. They let you skip the parts of a playtest that you already trust, so you can look closely at the part you want to check. In this quest you try five console commands while you play your blockout."
