  - id: LDQ116
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [level-snapshots, review, iteration]
    required_spine: false
    required: false
    title: Level Snapshots for review variants
    brief: "A Level Snapshot saves the state of all actors in a level at one moment, such as their positions and settings. Later you can restore the whole level, or only some actors, to that state. This lets you try a change to the layout and jump back without making a copy of the level. In this quest you take two snapshots of a blockout, restore one, and use a filter to restore only the actors that have a certain tag."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-snapshots-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-snapshot-filter-reference-for-unreal-engine"
    checklist:
      - "Enable the Level Snapshots plugin and restart the editor."
      - "Open your blockout level. Click the Level Snapshot button in the main toolbar. Name the snapshot Base_v1 and add a description."
      - "Move five cover meshes, delete one, and add a new one. Then take a second snapshot named Variant_Open."
      - "Open the Level Snapshots window, select Base_v1, and click Restore Level Snapshot. Check that all your changes are reverted."
      - "Undo the restore. Then give two cover actors the tag KeepMe."
      - "Add a Filter Group with the filter Actor Has Tag, set to KeepMe. Click Refresh Results and restore only those actors from Base_v1."
      - "Negate the filter by clicking its green bar, which makes it select the opposite. Note for your text what the result list shows now."
    done_when: "Send a screenshot of the Level Snapshots window with two named snapshots, one Filter Group that contains Actor Has Tag, and the results list. Add one line that says what changed when you negated the filter."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What does a Level Snapshot record?"
        choices: ["Only the actor transforms", "Actors in the Outliner with their components and properties", "Material assets", "Console variables"]
        answer_index: 1
        explain: "A snapshot records all actors in the World Outliner and the state of their components and properties. Assets like materials are not recorded."
      - q: "What is the default name format of a new Level Snapshot?"
        choices: ["<level_name>_<username>_<time>", "Snapshot_<number>", "<date>_<level_name>", "<username> only"]
        answer_index: 0
        explain: "By default the new snapshot is named <level_name>_<username>_<time>. You can rename it and change the default pattern."
      - q: "When you restore a snapshot, what happens to actors added after it was taken?"
        choices: ["They are kept", "They are moved to a sublevel", "They are hidden", "They are removed from the level"]
        answer_index: 3
        explain: "Restoring reverts to the saved state: new actors are removed, removed actors are added back, transforms and properties are reverted."
      - q: "Which of these is NOT tracked by Level Snapshots?"
        choices: ["Static Mesh Actors", "Point Lights", "Landscapes", "Actor tags"]
        answer_index: 2
        explain: "Known limitations: Landscapes, USD actors and console variables are not tracked."
      - q: "You have snapshots for two levels. Why do you see only some of them in the window?"
        choices: ["The others are corrupt", "Only snapshots for the currently open level are shown", "They need to be re-imported", "The plugin limits you to five"]
        answer_index: 1
        explain: "Only Level Snapshots associated with the currently open Level are visible. Others show when you open their level."
      - q: "How do filters inside one Filter Group combine, and how do separate Filter Groups combine?"
        choices: ["AND inside a group, OR between groups", "OR inside a group, AND between groups", "Always AND", "Always OR"]
        answer_index: 0
        explain: "Multiple filters in the same group use AND. Adding more Filter Groups combines them with OR."
      - q: "A filter is set to Include and you negate it. What does it become?"
        choices: ["Do Not Care", "It stays Include", "It is disabled", "Exclude"]
        answer_index: 3
        explain: "Negating swaps Include and Exclude. Do Not Care stays Do Not Care."
      - q: "Can you undo a Restore Level Snapshot action?"
        choices: ["No, it is permanent", "Yes", "Only if you saved first", "Only for transforms"]
        answer_index: 1
        explain: "The page states you can undo the Restore Level Snapshot action."
    flavors:
      _default: {why: "Snapshots let you try a layout change and jump back without duplicating the level."}
      cinematics: {why: "Reset a set between takes without losing the base layout.", do: "Take a snapshot per shot and restore only the lighting actors."}
      lookdev: {why: "Compare two dressing options on the same base.", do: "Use a Blueprint filter that includes only Static Mesh Actors."}

