        explain: "Press tilde once to open the PIE console, again to expand it and a third time to close it. It autocompletes commands as you type."
      - q: "What does the command slomo 0.1 do?"
        choices: ["Makes everything move very slowly", "Makes everything move ten times faster", "Limits the frame rate to 10 FPS", "Pauses the game for 0.1 seconds"]
