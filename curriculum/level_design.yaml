    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/light-types-and-their-mobility-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/stationary-light-mobility-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/movable-light-mobility-in-unreal-engine"
    checklist:
      - "Open one of your blockout levels, or make a new one with a corridor and one room."
      - "Place 6 Point Lights or Spot Lights in the corridor. Set the Mobility of all of them to Stationary."
      - "In the viewport, open the View Mode menu, then Optimization Viewmodes, and choose Stationary Light Overlap. Find the lights that show a red X, which means too many Stationary lights overlap there."
      - "Fix the overlap. Change some lights to Movable, or move the lights further apart, until no red X is left."
      - "Pick one light that only marks a door. Set it to Movable and turn off Cast Shadows. Read what the documentation says about the cost of such a light and note it."
      - "Write 3 lines in a text note inside the level, with a Text Render or a note actor. Say which light is Static, which is Stationary, which is Movable, and why."
    done_when: "Send two screenshots: one of the Stationary Light Overlap view with no red X, and one of the Lit view with your 3-line note visible."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "A light must change color when the player presses a switch, but it never moves. Which mobility is the cheapest that still allows this?"
        choices: ["Static", "Movable", "Stationary", "Any mobility works"]
        answer_index: 2
        explain: "Stationary lights can change color or intensity, or turn off, but cannot move. Static lights cannot change at all during gameplay."
      - q: "How many Stationary Lights can affect one object at the same time?"
        choices: ["Two", "Three", "Eight", "Four"]
        answer_index: 3
        explain: "The docs say a single object can be affected by up to four Stationary Lights at any time."
      - q: "A Stationary light shows a red X icon. What does this mean?"
        choices: ["The light has no lightmap UVs", "The light is too bright", "The Stationary overlap limit is reached", "The light is inside a wall"]
        answer_index: 2
        explain: "When more than four Stationary lights overlap, the light icon gets a red X until the overlap is fixed."
      - q: "What happens to a Stationary light once the overlap channel limit is reached?"
        choices: ["It falls back to dynamic whole-scene shadows, which cost a lot", "It is turned off", "It becomes Static", "It only lights Movable meshes"]
        answer_index: 0
        explain: "Once the channel limit is reached, only dynamic (whole scene) shadows are used, with considerable performance cost."
      - q: "Which statement about a Movable light with shadows turned OFF is true?"
        choices: ["It is very cheap, even cheaper than a Static light", "It is the most expensive light type", "It still needs a light build", "It cannot change color"]
        answer_index: 0
        explain: "Non-shadowing Movable lights are very inexpensive and cheaper than Static lights because no lighting data is saved to disk."
      - q: "You are using Lumen. What happens to lights set to Static?"
        choices: ["They cast Lumen shadows", "They become Stationary", "They get infinite bounces", "They are not supported because their contribution lives in lightmaps, which Lumen disables"]
        answer_index: 3
        explain: "Lumen disables precomputed static lighting, so Static lights are stored in lightmaps and are not supported."
      - q: "A Stationary Directional Light shows no moving shadows near the player. What is the likely cause?"
        choices: ["Cascaded shadows are not supported", "Dynamic Shadow Distance Stationary Light is at its default of 0", "The light needs a light function", "Inset Shadows is on"]
        answer_index: 1
        explain: "By default the value is 0, which means no dynamic shadowing. Raise it to get cascaded shadow maps near the player."
      - q: "Why does shadow map caching make Movable Point and Spot lights cheaper?"
        choices: ["It lowers the shadow resolution", "It skips recalculating shadows for Static and Stationary meshes each frame", "It turns off shadows beyond a distance", "It bakes shadows into lightmaps"]
        answer_index: 1
        explain: "Meshes with Static or Stationary mobility do not need their shadow depth recalculated every frame unless something changes."
