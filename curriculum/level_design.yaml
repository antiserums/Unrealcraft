    required: false
    title: "River, lake and waves"
    brief: "Unreal has a Water plugin that adds rivers, lakes and oceans that you shape with spline points, and the water cuts its own bed into the terrain. Water is useful in level design because a river works as a path and a lake works as a barrier, and both help players know where they are. In this quest you make a lake and a river that flows into it, and you create your own gentle wave settings."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/water-body-actors-in-unreal-engine"
