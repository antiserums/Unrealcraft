        answer_index: 3
        explain: "One Procedural Foliage Spawner can hold multiple Foliage Type Objects. The guide duplicates Tree_00 into Tree_01 and adds it to the same spawner."
      - q: "Which two Placement options does the guide enable so trees sit naturally on slopes and do not all face the same way?"
        choices: ["Scale to Width and Cast Shadow", "Can Grow in Shade and Spawns in Shade", "Align to Normal and Random Yaw", "Center H and Offset"]
