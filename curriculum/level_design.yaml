    title: "Data Layers: two versions of one place"
    brief: "A Data Layer is a named group of actors in a World Partition level that you can load and unload together. This lets one map hold several versions of the same place, for example the blockout and the final art, or a building before and after it is destroyed. Editor Data Layers only help you organize your work in the editor, and Runtime Data Layers can be switched on and off while the game runs. In this quest you make one of each and switch the runtime one with a key press."
    time_min: 50
