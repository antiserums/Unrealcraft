    title: Checkpoints that survive a restart
    brief: "A checkpoint remembers how far the player has come, so that the player starts again from there and not from the beginning. To still work after the game is closed, the checkpoint must be written to a save file on disk. In Unreal you do this with a Save Game object. In this quest you build checkpoints that store their location in the Game State, the object that holds shared information about the running game, and that also save it to a file and load it again on the next start."
