        choices: ["They render faster because they have no material, and they also cast much cheaper shadows", "Physics objects then ignore small bumps, behave more predictably, and physics costs less", "They can be seen by the player at runtime, so the player knows where the limits of the level are", "They automatically generate NavMesh on top of them, without a bounds volume"]
