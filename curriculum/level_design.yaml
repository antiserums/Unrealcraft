        answer_index: 2
        explain: "Target Points are generic points, similar to dummy objects in 3D apps. Epic lists path points for AI agents and spawn points as uses."
      - q: "In the guide, what happens on the On Fail pin of AI Move To?"
        choices: ["A short Delay (0.1) and the move is tried again", "The NPC is destroyed", "The NavMesh is rebuilt", "Nothing is connected"]
