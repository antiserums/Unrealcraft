    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which Water Body type allows its spline points to have different heights?"
        choices: ["Lake", "Ocean", "River", "Island"]
        answer_index: 2
        explain: "Lakes and oceans keep all spline points at the same height. Rivers allow varying heights, so a river can run downhill."
      - q: "How do rivers drive the motion of their water surface?"
        choices: ["With Gerstner waves from the Water Waves asset of the river body", "With velocity values on the spline points, written to a flow map", "With a Niagara system that pushes the surface along the spline of the river", "They do not move; only the foam texture is animated"]
        answer_index: 1
