      - q: "A Blueprint sets a Data Layer Instance runtime state to Loaded. What does the player see?"
        choices: ["The actors are loaded and visible, just as they are with the Activated state", "The actors are loaded but not visible; Activated makes them visible", "The actors are deleted from the level until the state is set back to Unloaded", "Nothing changes until the level restarts and the layer is read again"]
        answer_index: 1
        explain: "Loaded means the actors are in memory but not shown. Activated means loaded and visible. The page example uses both states."
      - q: "What does Make Current Data Layer in the outliner context menu do?"
