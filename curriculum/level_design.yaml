  - id: LDQ54
    rank: 1
    difficulty: apprentice
    specializations: [level_design]
    subjects: [hlod, world-partition, performance]
    required_spine: false
    required: false
    title: "HLOD: keep the far mountains visible"
    brief: "In a World Partition level, the parts of the world that are far from the player are unloaded, so they would simply disappear. HLOD, short for Hierarchical Level of Detail, fixes this by building cheap stand-in meshes, called proxies, that are shown in place of the far actors. This keeps mountains and forests visible on the horizon at a low cost. In this quest you create two HLOD Layers, assign rocks and trees to them, and build the HLODs."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition---hierarchical-level-of-detail-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a World Partition level: create one with File, New Level, Open World if you have none. In the Content Drawer, click + Add, open Miscellaneous, and choose HLOD Layer. Name it HLOD_Rocks and set its Layer Type to Merged Mesh."
      - "Make a second HLOD Layer named HLOD_Trees and set its Layer Type to Instancing."
      - "Place 20 rock meshes and 20 tree meshes far away from the player start. Stand-ins are fine: a sphere can stand in for a rock and a cone for a tree. You find both in the Place Actors panel under Shapes. Set the Mobility of all of them to Static."
      - "Select the rocks and, in the Details panel, set their HLOD Layer property to HLOD_Rocks. Do the same for the trees with HLOD_Trees."
      - "Open the Build menu and run Build HLODs. Wait until the build is finished."
      - "In the viewport view mode menu, open Level of Detail Coloration and choose Hierarchical LOD Coloration. Move the camera close to the actors, where they are drawn green, and then far away, where the proxy is drawn blue."
      - "Start Play In Editor and walk far away. Open the console and run the command wp.Runtime.ToggleDrawRuntimeHash2D to see which HLOD cells are loaded."
    done_when: "Send two screenshots in Hierarchical LOD Coloration: one close up with green actors and one from far away with the blue proxy. Add one line that says which layer type you gave the trees and why."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What problem does World Partition HLOD solve?"
        choices: ["Actors in unloaded cells are invisible; HLOD replaces them with a cheap proxy so distant things stay visible", "Actors load too slowly when a cell is streamed in; HLOD keeps a full copy of every actor in memory so nothing has to load", "Lightmaps are too big for a large world; HLOD bakes one small lightmap for each cell", "Foliage cannot be painted far away from the camera; HLOD adds a proxy landscape that the tool can paint on"]
        answer_index: 0
        explain: "Unloaded cells show nothing. HLOD generates a single proxy mesh and material per cell group to show distant content and reduce draw calls."
      - q: "Which HLOD Layer Type is best for trees and foliage?"
        choices: ["Merged Mesh", "Simplified Mesh", "Instancing", "Always Loaded"]
        answer_index: 2
        explain: "Instancing replaces the meshes with Instanced Static Mesh components using their lowest LOD. The page calls it ideal for imposter meshes like trees."
      - q: "Which of these is NOT required for an actor to get an HLOD proxy?"
        choices: ["The actor is assigned to an HLOD Layer", "The actor's Mobility is Static", "You run Build > Build HLODs or the builder commandlet", "The actor has a Nanite mesh"]
        answer_index: 3
        explain: "Actors need an HLOD Layer, Static mobility, and a build. Nanite is not required; there is only an option to generate a Nanite proxy."
      - q: "Name the three ways an actor can be assigned to an HLOD Layer."
        choices: ["Actor HLOD property, Default HLOD Layer of a Data Layer, Default HLOD Layer in World Settings", "Material of the actor, Static Mesh asset of the actor, Texture Group of its textures", "Level Blueprint of the map, Game Mode of the World Settings, Player Controller of the Game Mode", "Only the actor HLOD property; an actor without it is never part of an HLOD"]
        answer_index: 0
        explain: "You can set it per actor, per Data Layer, or as a world default in World Settings."
      - q: "In Hierarchical LOD Coloration view mode, what do green and blue mean?"
        choices: ["Green is an actor in a cell that is unloaded, blue is an actor in a cell that is loaded now", "Green is an actor assigned to an HLOD Layer, blue is its HLOD proxy mesh shown from far away", "Green is an actor that is set to Static, blue is an actor that is set to Movable", "Green is a mesh that has Nanite enabled, blue is a mesh that does not use Nanite"]
        answer_index: 1
        explain: "Actors in an HLOD Layer draw green. When the camera moves away, their proxy draws blue."
      - q: "You check Always Loaded on an HLOD Layer. Which settings become unavailable?"
        choices: ["Layer Type and HLODMaterial", "Cell Size and Loading Range", "HLODMaterial and Spatially Loaded", "Parent Layer and Layer Type"]
        answer_index: 1
        explain: "An always loaded proxy does not stream, so the runtime grid settings Cell Size and Loading Range are not available."
    flavors:
      _default: {why: "Players judge a world by what they see on the horizon. HLOD keeps the horizon full without the cost."}
      level_design: {why: "Landmarks guide the player. If your tower disappears when its cell unloads, the guiding fails. HLOD keeps landmarks visible.", do: "Pick one landmark and confirm its proxy is visible from the far end of the map."}
      lookdev: {why: "Merged and simplified proxies bake materials; knowing the settings helps you avoid ugly far views."}
      cinematics: {why: "Wide establishing shots depend on HLOD proxies for everything outside the loaded cells."}

  - id: LDQ55
    rank: 1
    difficulty: apprentice
    specializations: [level_design]
    subjects: [foliage, instancing, set-dressing]
    required_spine: false
    required: false
    title: "Foliage mode: paint, erase, reapply"
    brief: "Foliage mode lets you paint many copies of a mesh, such as rocks, bushes or trees, onto the ground with a brush instead of placing them one by one. Foliage fills a level quickly, but it can also block paths and views, so deciding where it grows and where it does not is part of level design. In this quest you paint two foliage types on a slope, erase a path through them, and set how far away they stop being drawn."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/foliage-mode-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a level that has a Landscape with a slope, or make one: create a new level, enter Landscape mode, choose New on the Manage tab, and raise a hill with the Sculpt tool. Press Shift+3 to enter Foliage mode."
      - "Drag two Static Meshes from the Content Drawer into the Mesh List, for example SM_Cylinder and SM_ChamferCube from the folder LevelPrototyping/Meshes of the template (any assets are fine). This creates a Static Mesh Foliage type for each mesh."
      - "Select the Paint tool. Set Brush Size to 512 and Paint Density to 0.3. Paint both foliage types across a slope."
      - "Hold Shift and paint to erase foliage. Clear a path through the foliage that is wide enough for a player."
      - "In Filters, turn off Landscape and turn on Static Mesh. Try to paint on the landscape and note what happens."
      - "Select the bush type and change Scale Min and Scale Max. Then use the Reapply tool to paint the new scale onto bushes that are already placed."
      - "In the Foliage Details, set an End Cull Distance and a Start Cull Distance for the bush. These are the distances at which the bushes fade out and stop being drawn. Start Play In Editor and walk away to watch them disappear."
    done_when: "Send one screenshot of the painted slope with a clear path through it, and one screenshot of the Foliage panel that shows your two types and the Cull Distance values."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Why is Static Mesh Foliage cheaper than Actor Foliage?"
        choices: ["Static Mesh Foliage uses hardware instancing, so many instances draw in one draw call; Actor Foliage costs the same as normal actors", "Static Mesh Foliage has no collision and casts no shadows, so each instance costs almost nothing; Actor Foliage always has both of them", "Actor Foliage uses bigger textures and a higher LOD for every instance; Static Mesh Foliage always uses the lowest LOD of the mesh and one small texture", "There is no difference in cost; Actor Foliage is only a second name for Static Mesh Foliage that is placed one instance at a time with the Single tool"]
        answer_index: 0
        explain: "Static Mesh foliage is batched and rendered with hardware instancing. Actor Foliage places real actors, so high densities can cause performance issues."
      - q: "How do you erase foliage while the Paint tool is active?"
        choices: ["Right-click and drag", "Hold Shift while painting", "Hold Ctrl while painting", "Press Delete and drag"]
        answer_index: 1
        explain: "Holding Shift with the Paint tool erases instances of the selected foliage type."
      - q: "You changed the scale settings of a foliage type. How do you apply the change to bushes already in the level?"
        choices: ["Erase them and paint them again by hand", "Rebuild lighting for the level", "Save the level and open it again, which updates them", "Use the Reapply tool and paint over them"]
        answer_index: 3
        explain: "The Reapply tool selectively changes parameters on instances that are already placed, by painting the changes onto them."
      - q: "What do the Filter options (Landscape, Static Mesh, BSP, Foliage, Translucent) control?"
        choices: ["Which foliage types are shown in the palette of the mode", "The draw distance of the foliage types that are checked", "Which surfaces the selected tool will place foliage on", "The LOD of the foliage on each kind of surface"]
        answer_index: 2
        explain: "Filters decide which surface types receive foliage. Turn off Landscape and you cannot paint on the landscape."
      - q: "You set only End Cull Distance and groups of bushes pop out of view suddenly. What does the page recommend?"
        choices: ["Increase Brush Size, so that the groups of bushes are larger and pop out of view less often", "Add a Start Cull Distance and use PerInstanceFadeAmount in the material to fade instances out", "Switch to Actor Foliage, which fades out by itself and is never culled in groups by distance", "Disable LODs on the mesh, so that the bushes keep their full detail until they are culled"]
        answer_index: 1
        explain: "Whole clusters cull at End Cull Distance. A Start Cull Distance plus the PerInstanceFadeAmount node lets instances fade before they are removed."
      - q: "How can you let players lower foliage density with scalability settings?"
        choices: ["Enable Density Scaling on the foliage type and use foliage.DensityScale", "Delete half of the instances by hand and save two versions of the level", "Set Brush Size to 0 in the Paint tool, so no new foliage is added on low settings", "Use the Fill tool with a lower Density"]
        answer_index: 0
        explain: "With Enable Density Scaling checked in the Scalability section, the foliage.DensityScale command controls how many instances render."
    flavors:
      _default: {why: "Foliage fills a level fast, but it also blocks paths and sightlines. Painting and erasing it is level design work."}
      level_design: {why: "Erasing foliage is how you cut the path. The Filter and cull settings decide if your path stays readable from far away.", do: "Stand at the start of your path and check that the cleared route is visible from 30 meters away."}
      lookdev: {why: "Cull and fade settings decide whether a forest edge looks natural or pops in and out."}

