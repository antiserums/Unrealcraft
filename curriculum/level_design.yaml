    title: Hazard zones with readable damage
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/pain-causing-volume-actor-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/volume-actors-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Game/Damage/ApplyRadialDamage"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Game/Damage/ApplyDamage"
    checklist:
      - "Give your test character a Float Health (100). On Event AnyDamage, subtract Damage, print the value, and respawn or print Dead at zero."
      - "Place a Pain-Causing Volume over a poison pool. Set Damage Per Sec, Pain Interval and Entry Pain in its Details panel. Write down the values. Add a visible hint: a Niagara steam effect or a green decal that covers the same area."
      - "Create BP_HazardZone (Actor) that combines a Box Collision, the visual effect and the damage into one actor you can move and duplicate. Use a looping Set Timer by Event to call Apply Damage on overlapping actors every Interval seconds (Instance Editable), and Entry damage on Begin Overlap."
      - "Create BP_ExplodingBarrel (Actor): a mesh and a Box Collision. When it receives Event AnyDamage, call Apply Radial Damage with Base Damage 60, Damage Radius 400, Damage Causer = self, then spawn a Niagara burst and Destroy Actor. Place a wall between the barrel and a second barrel to test line-of-sight."
      - "Place one BP_HazardZone and two barrels in your blockout so the player can see the hazard before they can touch it. Put a safe path past the hazard that costs time, and a fast path that costs health."
      - "Playtest and record health lost on each path. Adjust the Instance Editable values until the fast path is tempting but not free."
    done_when: "Screenshot of the hazard area in PIE with the visual hint visible and the Print String health numbers on screen, plus a 3-line note with the damage values you chose for the volume, the zone and the barrel."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which Pain-Causing Volume property sets the time in seconds between repeated damage applications?"
        choices: ["Damage Per Sec", "Pain Interval", "Entry Pain", "Damage Type"]
        answer_index: 1
        explain: "Pain Interval is the amount of time, in seconds, between applied damage while Pain Causing is enabled."
      - q: "What does Entry Pain do?"
        choices: ["Doubles the damage for the first second", "Blocks the player at the volume edge", "Applies damage immediately on entering, in addition to the recurring damage", "Stops damage after the player leaves"]
        answer_index: 2
        explain: "Entry Pain applies damage right away on entry, on top of the recurring damage based on Pain Interval, as long as Pain Causing is enabled."
      - q: "A Pain-Causing Volume has Pain Causing unchecked. What happens to actors inside it?"
        choices: ["They take no damage", "They take only Entry Pain", "They take Damage Per Sec but not Entry Pain", "They are destroyed"]
        answer_index: 0
        explain: "Pain Causing controls whether the volume currently causes damage or not."
      - q: "Why does the Volume Actors page suggest combining the Pain-Causing Volume and the fire effect into one actor?"
        choices: ["Volumes cannot render particles by themselves", "So you can move and duplicate the hazard easily", "Because damage only works inside a Blueprint", "So the volume becomes visible in packaged builds"]
        answer_index: 1
        explain: "The page says combining them into a single Actor lets you move and duplicate them easily."
      - q: "Apply Radial Damage says it will only hit components that block which channel?"
        choices: ["Camera", "Pawn", "Visibility", "PhysicsBody"]
        answer_index: 2
        explain: "The node description states it only hits components that block the Visibility channel."
      - q: "What is the role of the Damage Prevention Channel input on Apply Radial Damage?"
        choices: ["It is the channel used to find the Origin", "Damage is not applied to a victim if something between the origin and the victim blocks traces on this channel", "It prevents the Damage Causer from being damaged", "It limits the damage to one actor"]
        answer_index: 1
        explain: "The description says the victim is skipped if something blocking that channel sits between the origin and the victim, which is how a wall shields the second barrel."
      - q: "What does Apply Radial Damage say about the Damage Causer actor?"
        choices: ["It receives double damage", "It must be a Pawn", "It will not be damaged and will not block damage", "It sets the Damage Radius automatically"]
        answer_index: 2
        explain: "The Damage Causer, such as the grenade that exploded, is not damaged and does not block damage."
      - q: "What does the Return Value of Apply Damage represent?"
        choices: ["The number of actors hit", "The actual damage that ended up being applied to the actor", "True if the actor died", "The remaining health of the actor"]
        answer_index: 1
        explain: "Apply Damage returns the actual damage applied to the actor, while Apply Radial Damage returns true if at least one actor was damaged."
    flavors:
      _default: {why: "A hazard the player can read is a choice; a hazard they cannot read is a bug report."}
      level_design: {why: "Hazard zones shape routes: they add cost to shortcuts without walls.", do: "Measure how far away the player first sees the hint and write it in your metrics sheet."}
      tech_art: {why: "The hint effect must match the damage area exactly or players lose trust.", do: "Scale the Niagara system bounds to the Box Collision using the Construction Script."}

  - id: LDQ81
    rank: 2
    difficulty: adept
    track: level-design
    subjects: [world-partition, streaming, open-world, performance]
    required_for_majors: []
    taster_for_majors: []
    adjacent_for: [lookdev, programming]
    required_spine: false
    elective: true
    title: Tune the runtime grid
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-partition-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/dynamic-loading-range-scaling-in-unreal-engine"
    checklist:
      - "Open a World Partition level (File > New Level > Open World works). Save it as L_WP_Grid. Place 30 cubes in a straight line, one every 50 m, so the line is about 1.5 km long. Add a Player Start at one end."
      - "Open World Settings > World Partition Setup. Turn on Preview Grids. Write down Grid Name, Cell Size and Loading Range of the default grid."
      - "Play In Editor. Run wp.Runtime.ToggleDrawRuntimeHash2D. Count how many cells are loaded around the player. Take a screenshot."
      - "In the same session run wp.Runtime.OverrideRuntimeSpatialHashLoadingRange -grid=0 -range=25600. Watch how many cells load now. Take a second screenshot."
      - "Stop. In World Settings set Loading Range to half its old value. Play again and walk the line of cubes. Note when cubes pop in."
      - "Select two cubes far from the start and set their Runtime Grid property to None on purpose. Then set Is Spatially Loaded off on one of them. Play and check which one is always there."
      - "In World Settings > World Partition > Advanced, enable Dynamic Loading Range Scaling. Set Initial to 25 percent, Delay to 2 seconds, Duration to 10 seconds. Play In Editor and watch the cells grow during the first seconds."
    done_when: "Two Play In Editor screenshots with wp.Runtime.ToggleDrawRuntimeHash2D on: one at the default Loading Range and one with the override. Add three lines: Cell Size and Loading Range you chose, and what the player saw with the smaller range."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "In the World Partition Setup, what does Loading Range control?"
        choices: ["The draw distance of HLOD meshes", "The number of grids in the world", "The size of each grid cell", "The range from a streaming source inside which cells are loaded"]
        answer_index: 3
        explain: "Loading Range is the distance around a streaming source where cells load. Cell Size is a separate setting for the size of each cell."
      - q: "An actor has Runtime Grid set to None. What happens?"
        choices: ["The actor is placed in the HLOD grid", "The actor is never loaded", "The actor is always loaded", "The partition system chooses the grid for it"]
        answer_index: 3
        explain: "The page says: if Runtime Grid is None, the grid will be chosen by the partition system. None does not mean unloaded."
      - q: "You add a second runtime grid for big props. What does Epic warn about this?"
        choices: ["Only one grid can have HLODs", "A second grid disables One File Per Actor", "Using more than one grid can negatively impact performance", "Two grids cannot share streaming sources"]
        answer_index: 2
        explain: "A 2D Runtime Hash grid is provided by default, and the documentation states that using more than one grid can negatively impact performance."
      - q: "What does wp.Runtime.OverrideRuntimeSpatialHashLoadingRange -grid=0 -range=25600 do?"
        choices: ["Sets the cell size of grid 0 to 25600 units", "Sets the runtime loading range of grid 0 to 25600 units for this session", "Saves a new Loading Range into World Settings", "Limits the number of cells that load at once to 25600"]
        answer_index: 1
        explain: "This console command overrides the runtime loading range. -grid picks the grid index and -range gives the new loading range. It is a runtime override, not a saved setting."
      - q: "Which console command limits how many World Partition cells can load at the same time?"
        choices: ["wp.Runtime.MaxLoadingLevelStreamingCells", "wp.Runtime.ToggleDrawRuntimeHash3D", "wp.Runtime.ShowRuntimeSpatialHashGridIndex", "wp.Runtime.HLOD 0"]
        answer_index: 0
        explain: "wp.Runtime.MaxLoadingLevelStreamingCells limits the number of concurrent loading streaming cells. The others are debug display commands."
      - q: "What does Block on Slow Streaming do?"
        choices: ["Blocks loading in situations where grid cells are not loading fast enough", "Makes every cell load at start", "Turns off streaming in the editor", "Stops all streaming while the game is paused"]
        answer_index: 0
        explain: "Block on Slow Streaming is a runtime grid setting that blocks when cells are not loading fast enough, so the player does not run into unloaded space."
      - q: "Dynamic Loading Range Scaling is enabled with Initial set to 100 percent. What is the effect?"
        choices: ["PIE starts with nothing loaded", "The feature is effectively still disabled", "Cooked builds also load faster", "The loading range doubles"]
        answer_index: 1
        explain: "At 100 percent the initial range equals the full range, so nothing changes. The feature is editor-only and only affects PIE, never cooked builds."
      - q: "Why does Epic tell you to avoid an Initial Dynamic Loading Range Scaling of 0 percent?"
        choices: ["It makes the build fail", "It disables the streaming sources", "Your pawn can fall through geometry that is not loaded yet", "It deletes the runtime grid"]
        answer_index: 2
        explain: "With 0 percent almost nothing is loaded when PIE starts, so the ground under the pawn may not exist yet and the pawn can fall through."
    flavors:
      _default: {why: "Cell Size and Loading Range decide how far the player can see and how much memory the world uses. A designer must know how to read and change them."}
      level_design: {why: "You pick loading ranges by where the player can look and how fast they move.", do: "Test the grid with the fastest vehicle or sprint speed you plan to ship."}
      lookdev: {why: "Pop-in of props is often a loading range problem, not an LOD problem.", do: "Note which cubes popped in at the smaller range and how far they were."}

