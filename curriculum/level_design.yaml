    required: false
    title: Smart Object slots in your level
    brief: "A Smart Object is an object in the level that AI characters can use, such as a bench, a door or a workstation. Each Smart Object has one or more slots, which are the exact spots where a character stands or sits to use it. Placing these slots and pointing them the right way is level design work. In this quest you make a bench with two slots and place several benches in a small plaza."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/smart-objects-in-unreal-engine---overview"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/smart-objects-in-unreal-engine---quick-start"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/smart-objects-in-unreal-engine---quick-start"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/smart-objects-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open the Plugins window (Edit > Plugins) and look in the Gameplay category. Enable Smart Objects, AI Behaviors and Gameplay Behavior Smart Objects. Then restart the editor."
      - "Create a Data Asset of the class Smart Object Definition and name it SO_Definition_Bench. Open it and add two Slots."
      - "Create an Actor Blueprint named BP_SO_Bench. Give it a Static Mesh in the shape of a bench, for example a cube that you scale to be long and low, and a Smart Object component. On the component, set Definition Asset to SO_Definition_Bench."
      - "Open BP_SO_Bench and move the two slots so that each one sits on one seat of the bench and faces forward."
      - "Build a small plaza blockout: a floor with a few cubes around it. Place three BP_SO_Bench actors in it. Add a NavMeshBoundsVolume around the plaza."
      - "Optional: follow the Quick Start guide to make an AI agent claim a slot and use it."
    done_when: "Send a screenshot of the plaza with the three benches selected, so that the slot markers are visible. Add one sentence that says what Free, Claimed and Occupied mean."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Where is the slot layout and default behavior of a Smart Object stored?"
        choices: ["In the Level Blueprint of the open level", "In a Smart Object Definition data asset", "In the AI Controller of each agent", "In the NavMesh, as a custom Area Class for slots"]
        answer_index: 1
        explain: "The Smart Object Definition is a data asset with the immutable data: Slots, tags and Default Behavior Definitions. The component points to it."
      - q: "How do you make a bench actor a Smart Object?"
        choices: ["Add a Nav Modifier component and set its Area Class", "Tag it with SmartObject in the Actor Tags, and the subsystem finds it", "Place it inside a Persistent Collection volume in the level", "Add a Smart Object component and set its Definition Asset"]
        answer_index: 3
        explain: "The Smart Object component can be added to any actor to mark it as a Smart Object. It references a Smart Object Definition asset."
      - q: "An agent arrives at its claimed slot and calls Use. What is the slot state now?"
        choices: ["Occupied", "Free", "Claimed", "Reserved"]
        answer_index: 0
        explain: "Use changes the slot from Claimed to Occupied. Release later sets it back to Free."
      - q: "Two agents want the same slot. What happens?"
        choices: ["Both use it at the same time, one after the other", "The agent that is closer always wins, even after the other has claimed it", "After one agent claims it, the other cannot claim it until it is released", "The Smart Object is duplicated, so each agent has a slot"]
        answer_index: 2
        explain: "A claimed slot may not be claimed by another agent until the agent that claimed it releases it. That is the reservation system."
      - q: "Which statement about Smart Objects is true?"
        choices: ["They run the animation themselves, on any interactor", "They hold no execution logic; each interactor implements the interaction", "They only work with players, not with AI agents that use a Behavior Tree", "They replace the NavMesh for agents that use them"]
        answer_index: 1
        explain: "Smart Objects provide the information for an interaction. The agent or player does its own implementation logic."
      - q: "What does a Smart Object Persistent Collection do?"
        choices: ["Creates the NavMesh under each Smart Object so that agents can always reach it", "Stores the animations that the agents play on each slot", "Deletes unused Smart Objects from the level when it is saved, so that the simulation stays small", "Keeps listed Smart Objects in the simulation even when their actors are unloaded"]
        answer_index: 3
        explain: "The Persistent Collection is a level-placed actor. Smart Objects in it stay part of the simulation regardless of whether they are loaded or unloaded."
    flavors:
      _default: {why: "Smart Objects turn benches, doors and workstations into places AI can use. Placing and orienting slots is level design work."}
      gameplay_design: {why: "Ambient life comes from AI using the world. Slots are where that life happens.", do: "Give one bench a single slot and watch two agents from the Quick Start take turns."}

  - id: LDQ63
    rank: 1
    difficulty: apprentice
    specializations: [level_design]
    subjects: [eqs, ai, cover]
    required_spine: false
    required: false
    title: Find cover spots with EQS
    brief: "EQS, the Environment Query System, lets AI ask questions about the level, such as where the nearest spot is that the enemy cannot see. It creates many test points, removes or scores them with tests, and shows the result as colored spheres. This lets you check and fix the cover layout of a level before any enemy logic exists. In this quest you build a cover query and test it in the editor with a special testing pawn."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/environment-query-testing-pawn-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/environment-query-system-overview-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/eqs-node-reference-generators-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/eqs-node-reference-tests-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/environment-query-system-overview-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. The Environment Query System is part of UE5 and needs no setup. If you do not find Environment Query in the Add menu under Artificial Intelligence, open Edit > Plugins and enable Environment Query Editor. Then build a small arena in a new level: a floor with a NavMeshBoundsVolume and 5 to 8 cubes as cover blocks."
      - "Create an Environment Query asset named EQS_Cover. In it, add a Points: Grid generator around the Querier. The Querier is the character that runs the query."
      - "Add a Trace test on the grid, with the Querier as its context. Set Test Purpose to Filter so that only points that cannot be seen from the querier remain. Change Bool Match if the result is the wrong way around."
      - "Add a Distance test and set its Test Purpose to Score, so that points nearer to the querier get a higher score."
      - "Create a Blueprint named BP_EQSTestPawn from the EQSTestingPawn class. Place it in the arena and set its Query Template to EQS_Cover."
      - "Move the pawn around the arena and watch the spheres change. Then move one cover block so that a bad cover spot becomes a good one."
    done_when: "Send two screenshots of the spheres of the EQS Testing Pawn, taken from two positions. Add one sentence that says which cover block you moved and why."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You add a Distance test before a Trace test. Does the order matter?"
        choices: ["Yes, tests run top to bottom, and each test only sees what is left", "Yes, the first test in the list is always used as the score", "No, filter tests run before scoring tests regardless of order", "No, only the last test is used"]
        answer_index: 2
        explain: "The order of tests does not matter. Filters run first so fewer items need to be scored."
      - q: "With the EQS Testing Pawn selected, some spheres are blue. What does blue mean?"
        choices: ["The item failed a filter or a bool test returned false", "The item is the winner, with the best score of the query", "The item is far away from the Querier", "The item is on a Nav Link and cannot be picked as a result"]
        answer_index: 0
        explain: "Green to red shows the level of match. Blue spheres are failures, such as a Trace test that returned false."
      - q: "Which test checks if a point can or cannot be seen from a context?"
        choices: ["Dot", "Overlap", "Gameplay Tags", "Trace"]
        answer_index: 3
        explain: "The Trace test traces to or from an item and reports a hit. You can invert it with Bool Match. It is the typical line-of-sight test."
      - q: "Which generator creates a grid of points around the querier?"
        choices: ["Actors of Class", "Points: Grid", "Current Location", "Composite"]
        answer_index: 1
        explain: "Points: Grid generates a grid of items around the context set in Generate Around. Points: Circle, Donut and Cone are other shapes."
      - q: "Some grid points end up inside walls. Which test moves them back onto the NavMesh?"
        choices: ["Pathfinding", "Distance", "Project", "Overlap"]
        answer_index: 2
        explain: "The Project test projects items onto the NavMesh, moving items that are inside walls or blocked back onto it."
      - q: "You want a brand new kind of Test. Where can you create it?"
        choices: ["Only in C++", "In Blueprint, like generators", "In the Level Blueprint", "In the Behavior Tree editor"]
        answer_index: 0
        explain: "Custom generators can be made in Blueprint or C++, but custom tests can only be created in C++."
    flavors:
      _default: {why: "EQS shows you where AI thinks cover is. Testing it in the editor lets you fix cover layout before any enemy code exists."}
      gameplay_design: {why: "Enemy cover choice is a design decision. EQS scores make it visible and tunable.", do: "Add a second Distance test scored toward the player and compare which cover wins."}

  - id: LDQ64
    rank: 1
    difficulty: apprentice
    specializations: [level_design]
    subjects: [spline, ai, patrol]
    required_spine: false
    required: false
    title: Patrol path with spline and target points
    brief: "A patrol is an AI character that walks the same route again and again, and it is the most common kind of AI in levels. A good way to build one is to draw the route as a spline, a line through editable points, and to mark the stops with Target Point actors. Then you can change the route quickly without touching the AI logic. In this quest you build a patrol path and an NPC that walks from point to point in a loop."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-spline-components-overview-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/target-point-actors-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-spline-component-property-reference-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/target-point-actors-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/basic-navigation-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Work in a level that has a NavMeshBoundsVolume and a building or a large block to walk around. Create an Actor Blueprint named BP_PatrolPath and give it a Spline component. Place it in the level, and drag the spline points into a loop around the building."
      - "In the Details panel of the spline, enable Closed Loop. Then select one spline point and set its Type to Linear to make a sharp corner."
      - "Place four Target Point actors on the corners of the spline. Name them TP_Patrol_1 to TP_Patrol_4."
      - "Make the patrol character: duplicate BP_ThirdPersonCharacter, name the copy BP_NPC_Patrol, and delete all its input nodes. Add an array variable named Patrol Points that holds Target Point references, and turn on Instance Editable. Place the character in the level and fill the array with the four Target Points."
      - "On BeginPlay, build a loop: call AI Move To for the next point in the array, add a Delay of 2 on success, and then move to the next point. After the last point, go back to index 0."
      - "Click Simulate. Adjust the spline and the Target Points until the patrol passes a window twice in each loop."
    done_when: "Send one screenshot of the level with the closed spline and the four Target Points visible, and one screenshot taken in Simulate that shows the NPC on the path."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the difference between a Spline component and a Spline Mesh component?"
        choices: ["They are the same; Spline Mesh is the older name of the Spline component, kept for projects from Unreal Engine 4", "A Spline Mesh has more points than a Spline", "A Spline Mesh deforms one Static Mesh along a two-point spline and cannot get more points", "A Spline cannot be edited in the level, only in the viewport of the Blueprint that holds it"]
        answer_index: 2
        explain: "A Spline component is a path with many editable points. A Spline Mesh component deforms a single Static Mesh along a two-point spline."
      - q: "Which property makes the spline a loop with no start or end?"
        choices: ["Closed Loop", "Duration", "Stationary Endpoints", "Draw Debug"]
        answer_index: 0
        explain: "Closed Loop makes the spline a closed loop. Duration is the spline length in seconds and Draw Debug controls rendering."
      - q: "You want a sharp 90 degree corner at one spline point. Which point Type?"
        choices: ["Curve", "CurveClamped", "CurveCustomTangent", "Linear"]
        answer_index: 3
        explain: "Linear makes the curve straight from the selected point to the next. Curve types smooth the tangents."
      - q: "What is the default Type of a spline point?"
        choices: ["Linear", "Curve", "Constant", "CurveClamped"]
        answer_index: 1
        explain: "The property reference says Curve is the default. The neighbor points define the tangents of the selected point."
      - q: "Where do you find Target Point actors when placing?"
        choices: ["Under the Volumes category", "Under the Lights category, at the end", "Under the All Classes category", "Only by spawning them in Blueprint"]
        answer_index: 2
        explain: "Target Point actors are in the All Classes category. Drag one into the world."
      - q: "Where can you edit spline points?"
        choices: ["In the Blueprint viewport and in the Level Editor", "Only in the Blueprint viewport, never in a level", "Only in the Level Editor, after the actor is placed", "Only in the Construction Script of the Blueprint"]
        answer_index: 0
        explain: "Splines are fully editable in the Blueprint viewport and in the Level Editor. The Construction Script can also modify them further."
    flavors:
      _default: {why: "Patrols are the most common AI in levels. A visible spline plus target points lets you tune routes fast without touching AI code."}
      gameplay_design: {why: "Patrol timing sets the rhythm of stealth and combat spaces.", do: "Change the Delay at one point so the guard pauses at a window, and note how the player's safe window changes."}
      cinematics: {why: "The same spline can drive a camera or a vehicle for a cutscene.", do: "Set Draw Debug on and use the spline as a camera dolly path for a 5 second flythrough."}

  - id: LDQ65
    rank: 1
    difficulty: apprentice
    specializations: [level_design]
    subjects: [play-in-editor, playtesting, editor]
    required_spine: false
    required: false
    title: Play from the camera, with two players
    brief: "Play In Editor, often shortened to PIE, lets you test your level without leaving the editor. By default you start at the Player Start actor, but you can also start exactly where the editor camera is, which saves time when the spot you want to test is far away. You can also start with more than one player to test multiplayer. In this quest you try the different start locations and run a session with two players."
    time_min: 35
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/ineditor-testing-play-and-simulate-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/play-in-editor-multiplayer-options-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/play-in-editor-settings-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a blockout level of your own, or the level of the template. Fly the editor camera to a place that is far from the Player Start."
      - "Open the Play dropdown, the small menu next to the Play button. Under Start Location, pick Camera Location. Press Play (Alt + P) and note where you spawn, which means where your character appears."
      - "Stop the game. Right-click the floor in another room and choose Play From Here. Note where you spawn this time."
      - "Open the Play dropdown again. Set Number of Players to 2 and set Net Mode to Play As Listen Server."
      - "Press Play. You get one player in the viewport and a second player in a new window. Press Shift + F1 to get the mouse back from the game."
      - "Open the Play dropdown, choose Advanced Settings, and find New Viewport Resolution. Set a smaller size for the extra window."
    done_when: "Send one screenshot of a PIE session with 2 players, showing the viewport and the new window. Add one line that says which Start Location you now use for quick tests and why."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Which Start Location option makes the game begin where the editor camera is?"
        choices: ["Default Player Start", "Play From Here", "Camera Location", "New Window"]
        answer_index: 2
        explain: "The Play dropdown has two Start Locations. Camera Location begins gameplay at the current camera. Default Player Start uses the Player Start actor."
      - q: "How do you use Play From Here?"
        choices: ["Right-click in the viewport and pick Play From Here; play starts at the clicked spot", "Press Alt + S with an actor selected; play starts at that actor, and the camera looks along its forward axis", "Set Number of Players to 0 in the Play settings; play then starts at the camera of the viewport", "Choose Standalone Game in the Play dropdown and set a start location in the settings"]
        answer_index: 0
        explain: "Play From Here is in the viewport right-click menu. Gameplay begins at the location you clicked, shown in the Level Viewport."
      - q: "Which display type cannot be paused or stopped from the editor toolbar?"
        choices: ["Selected Viewport", "New Editor Window", "Simulate", "Standalone Game"]
        answer_index: 3
        explain: "Standalone Game runs in its own process. The page says you cannot pause or stop it, and you cannot switch to Simulate."
      - q: "During a Play In Editor session in the viewport, what does Shift + F1 do?"
        choices: ["Skips one frame of the game", "Gives the mouse cursor back to the editor", "Saves the level while the game is running", "Opens the Play settings of the Level Editor"]
        answer_index: 1
        explain: "Clicking in the viewport gives the mouse to the game. Shift + F1 returns mouse control to the editor so you can use the toolbar."
      - q: "You set Number of Players to 3 and play in the Selected Viewport. What do you see?"
        choices: ["Three players split in one viewport", "Three new windows and an empty viewport", "One player in the viewport and two in new windows", "Only one player; the setting needs Standalone Game"]
        answer_index: 2
        explain: "With more than one client and the Viewport display option, one client world is shown in the viewport and all others open in new windows."
      - q: "What happens when Net Mode is set to Play As Client?"
        choices: ["A dedicated server is launched in the background with no display or local player", "The editor becomes both server and client, with one window that shows the game", "No server is created at all, and the editor is alone in the session", "The game runs on a connected mobile device"]
        answer_index: 0
        explain: "Play As Client starts a dedicated server world behind the scenes. None of the clients run as a listen server, so you can find dedicated-server-only bugs."
    flavors:
      _default: {why: "Starting play exactly where the problem is saves minutes on every test."}
      level_design: {why: "You will test one room hundreds of times. Camera Location and Play From Here remove the walk from the Player Start.", do: "Write down the Start Location you use for room tests in your metrics sheet."}
      gameplay_design: {why: "Two-player PIE is the fastest way to see a mechanic from both sides.", do: "Run a 2-player test of one interaction and note what the second player could not see."}

  - id: LDQ66
    rank: 1
    difficulty: apprentice
    specializations: [level_design]
    subjects: [simulate-in-editor, playtesting, editor]
    required_spine: false
    required: false
    title: Simulate, tweak, keep
    brief: "Simulate is a way to run your level inside the editor without a player character. Physics, AI and Blueprints all run, but you keep the editor camera and all the editor tools, so you can select and move things while the game is running. In this quest you watch a physics ball fall, step through it one frame at a time, and keep a change that you made during the simulation."
    time_min: 35
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/playing-and-simulating-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/ineditor-testing-play-and-simulate-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. In any level, place a Static Mesh sphere above a set of stairs or a ramp and name it SM_SimBall. The level of the template has ramps, or you can build a few steps from cubes. In the Details panel of the sphere, enable Simulate Physics so the sphere can fall."
      - "Press Alt + S to start Simulate. Watch the ball fall down the stairs. Press Esc to stop."
      - "Start Simulate again and pause at once. Then click Frame Skip a few times to step through the fall one frame at a time."
      - "While the simulation runs, select SM_SimBall and move it to a better start spot. Right-click it and choose Keep Simulation Changes, or press K."
      - "Stop the simulation. Check that the new position of the ball stayed in the editor level."
      - "Start Simulate again, and then click Possess to switch to Play In Editor and take control of a player. Note where the player spawns."
    done_when: "Send a screenshot of the editor while it is simulating, with SM_SimBall selected and the Possess button visible in the toolbar. Add one line that says which change you kept with Keep Simulation Changes."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "What is the Windows shortcut to start Simulate In Editor?"
        choices: ["Alt + P", "Alt + S", "Shift + F1", "F11"]
        answer_index: 1
        explain: "Alt + S (Option + S on macOS) starts Simulate In Editor. Alt + P is Play In Editor."
      - q: "Why can you not move a character with WASD while simulating?"
        choices: ["The level is frozen, and nothing in it can be moved", "Blueprints do not run in Simulate, so input events never fire", "Physics is turned off, so the character cannot move", "No PlayerController is used, so game controls are not available"]
        answer_index: 3
        explain: "Simulating runs gameplay code but does not spawn a player or use a PlayerController. You keep the editor tools instead of game controls."
      - q: "How do you keep a change you made to an actor during simulation?"
        choices: ["Right-click the actor and choose Keep Simulation Changes, or press K", "Press Ctrl + S while simulating", "Changes are always saved automatically when the simulation is stopped", "Click Possess, then Stop, which writes the new values of the actor into the level"]
        answer_index: 0
        explain: "Changes made during play or simulation are not saved by default. Keep Simulation Changes (or the K key) copies them back to the editor level."
      - q: "When is the Frame Skip button available, and what does it do?"
        choices: ["Always; it doubles the game speed", "Only in Standalone Game; it skips to the next level", "Only while paused; it advances gameplay by one frame", "Only in New Window; it takes a screenshot"]
        answer_index: 2
        explain: "Frame Skip is grayed out while the game runs. After you pause, clicking it advances gameplay by one frame."
      - q: "While a Play or Simulate session is active, what can you still change in a Blueprint?"
        choices: ["You can add new nodes to the graph, which run at once", "You can change Blueprint defaults, which apply to all instances in the level", "You can rewire the pins of existing nodes, but you cannot add any new nodes", "Nothing; the Blueprint editor is locked until you stop"]
        answer_index: 1
        explain: "During play or simulation all Blueprint graphs are read-only. You can still change Blueprint defaults, and they apply to every instance in the tested level."
      - q: "You start with Simulate, then click Possess. Where does the Play In Editor session start?"
        choices: ["At the editor camera", "At the last place you pressed K", "At the actor you have selected", "At the Default Player Start"]
        answer_index: 3
        explain: "Possess after a fresh Simulate session is the same as Play > Selected Viewport > Default Player Start. Only if you ejected from PIE first does Possess resume where you ejected."
    flavors:
      _default: {why: "Simulate lets you watch physics, AI and Blueprints run while you keep all editor tools."}
      level_design: {why: "You can move a prop, watch it settle and keep the result without leaving the test.", do: "Use Keep Simulation Changes to settle at least three physics props in your blockout."}
      gameplay_design: {why: "Frame Skip shows exactly which frame a mechanic breaks on.", do: "Step one trap or moving platform frame by frame and note the frame where it becomes unfair."}
      cinematics: {why: "Simulate runs your Sequencer and Blueprint events without a player in the way.", do: "Simulate and select an AI pawn mid-action to inspect its values in Details."}

