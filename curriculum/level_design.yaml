  - id: LDQ96
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [reflections, reflection-captures, readability]
    required_spine: false
    required: false
    title: "Reflection captures that show the way"
    brief: "A Reflection Capture is an actor that takes a picture of its surroundings in all directions and uses it as the reflection on nearby shiny surfaces. It is a cheap way to make wet floors and metal look right. A designer can also use it on purpose, so that a bright exit is reflected on the floor and draws the player toward it. In this quest you build a wet corridor, place several captures, and check that the exit shows in the floor."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/reflections-captures-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/reflections-environment-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. In a new level, build a wet corridor from cubes. It needs a floor with a low-roughness material (a smooth, shiny one, for example a simple material with Roughness set to 0.1), one turn, and a lit exit."
      - "Place one large Sphere Reflection Capture for the corridor, and smaller ones at the turn and at the exit."
      - "Switch to the Reflection Override view mode and check the seams where one capture ends and the next begins. Move the captures away from walls."
      - "Use the Lit view, and in the Show menu open Lighting Components and turn Specular off. This shows you what the captures see."
      - "Open the Build menu and run Build Reflection Captures. Compare the floor before and after."
      - "Confirm in PIE that the bright exit is reflected on the floor when you stand at the start of the corridor."
    done_when: "Send a screenshot of the Reflection Override view, and a screenshot of the Lit view that shows the exit reflected on the floor."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which reflection capture shape is most useful in general?"
        choices: ["Box", "Plane", "Cylinder", "Sphere"]
        answer_index: 3
        explain: "The sphere never matches geometry but has no corners, so the error is uniform. Box works only for hallways and rectangular rooms."
      - q: "A small capture overlaps a large one. Which one wins?"
        choices: ["The large one", "They average equally", "The small one", "The one built last"]
        answer_index: 2
        explain: "Smaller captures override larger ones, so you refine the reflection by placing small captures in corners."
      - q: "Why should you avoid placing a capture very close to geometry?"
        choices: ["It costs more to capture than a far one", "Nearby geometry dominates and blocks details behind it", "It stops the build of the reflection captures with an error", "It becomes a box capture with the size of that geometry"]
        answer_index: 1
        explain: "Nearby geometry will dominate the capture and block important details behind it."
      - q: "Which view mode makes all surfaces mirror-like to check captures?"
        choices: ["Lighting Only", "Shader Complexity", "Reflection Override", "Detail Lighting"]
        answer_index: 2
        explain: "Reflection Override makes surfaces fully specular and smooth so capture limits are clearly visible."
      - q: "Will a moving character appear in reflection captures?"
        choices: ["Yes, always, on every reflective surface that is near", "Only if the character is set to Movable", "Only with hardware ray tracing turned on in Project Settings", "No, captures are static and dynamic objects are not reflected"]
        answer_index: 3
        explain: "Capturing happens outside the game session. Dynamic objects cannot be reflected but can receive reflections."
      - q: "What is the maximum number of reflection captures enabled at one time?"
        choices: ["64", "341", "128", "1024"]
        answer_index: 1
        explain: "Due to DX11 limits, cubemaps are 128 per side and at most 341 captures can be enabled at once."
      - q: "What does the runtime cost of the Reflection Environment depend on?"
        choices: ["How many captures influence the pixels on screen", "The sharpness of each cubemap that is on screen", "The number of lights that are in the level", "Mesh triangle count on screen"]
        answer_index: 0
        explain: "Cost depends only on how many captures influence on-screen pixels. Glossiness uses mipmaps so sharp or rough costs about the same."
      - q: "Which reflection system is static and supported on all platforms?"
        choices: ["Reflection Captures", "Lumen Reflections", "Screen Space Reflections", "Ray Tracing Reflections"]
        answer_index: 0
        explain: "Reflection Captures are static and run on all platforms. Lumen and ray tracing are dynamic and need high-end hardware."
    flavors:
      _default: {why: "Cheap captures make wet floors and metal read right, and they can bounce a bright exit toward the player."}
      level_design: {why: "A reflected exit light on a floor is a guidance cue that costs nothing at runtime.", do: "Add a second lighting condition on the other side of a wall and check for leaking. Fix it with capture placement."}

  - id: LDQ97
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [pcg, procedural, graph-parameters, debugging]
    required_spine: false
    required: false
    title: "PCG graph v2: parameters, instances, debug"
    brief: "PCG, the Procedural Content Generation framework, places things such as rocks or plants for you by following a graph of nodes instead of placing each one by hand. A graph parameter is a value of the graph that you can change from outside it, and a graph instance is a saved copy of the graph with its own parameter values. With these, one graph can fill many areas of a level in different ways. In this quest you build a rock field graph with a parameter, save an instance, and use the debug views."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-content-generation-overview"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-content-generation-framework-node-reference-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Enable the Procedural Content Generation Framework (PCG) plugin in Edit > Plugins if it is off. Open a level that has a Landscape, or create a new level and make a Landscape in Landscape Mode. Create a PCG graph named PCG_RockField. In it, connect these nodes in a chain: Get Landscape Data, then Surface Sampler, then Transform Points, then Static Mesh Spawner."
      - "In Transform Points, set Max Rotation Z to 360 and enable Absolute Rotation. Set Scale Min to 0.5 and Scale Max to 1.2."
      - "In Static Mesh Spawner, add two Mesh Entries: a big rock with Weight 3 and a small rock with Weight 1. If you have no rock meshes, any two meshes work as stand-ins, for example SM_ChamferCube and SM_Cylinder from the folder LevelPrototyping/Meshes of the template. A higher weight means the mesh is picked more often."
      - "Open Graph Settings and add a float Parameter named PointsPerSqm. Connect it to the Points Per Square Meter override pin on the Surface Sampler."
      - "Place a PCG Volume over the landscape, assign PCG_RockField to it, and click Generate. Then change PointsPerSqm in the Details panel and watch the result update."
      - "Select the PCG component and click Save Instance. Name the instance PCGI_RockField_Dense and give it a higher PointsPerSqm."
      - "In the graph, select the Surface Sampler and press D to see its debug points in the viewport. Then select the Transform Points node, press A to inspect it, and read the Attributes list."
    done_when: "Send two screenshots: (1) the PCG graph with the Attributes list open on an inspected node, and (2) the viewport with debug points visible and the Details panel showing your PointsPerSqm parameter on the PCG component."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "In the PCG debug view, what does a black point mean?"
        choices: ["Its density is 0, so it is very unlikely to exist at that position", "Its seed is 0, so it gives the same result on every run", "It has no static mesh assigned, so nothing can be spawned at that point", "It is outside the PCG Volume and is not used"]
        answer_index: 0
        explain: "Point Density is shown as a gradient on each point. A density of 0 is black and 1 is white. Density is the probability that the point exists at that position."
      - q: "A Static Mesh Spawner has four Mesh Entries and each has Weight 1. What is the chance of each entry spawning?"
        choices: ["100%, all four spawn at every point", "The first entry always wins", "25% each", "Weights only matter when By Attribute is selected"]
        answer_index: 2
        explain: "The spawner adds all weights (4) and divides each weight by the sum. With four entries of weight 1, each has a 25% chance."
      - q: "After sampling a landscape, your rocks lean to follow the slope. What does Absolute Rotation on Transform Points do?"
        choices: ["Rotates every point by 360 degrees around its up axis, so that no two rocks face the same way", "Stops the extra rotation so the points stay Z up instead of following the surface normal", "Copies the rotation of the PCG Volume to each point", "Locks the rotation of every point so that no later node in the graph can ever override it"]
        answer_index: 1
        explain: "The graph rotates points to match the landscape normal. Setting Absolute Rotation with rotation Z 0 makes sure the points point upwards after sampling."
      - q: "What is a PCG Graph Instance most similar to?"
        choices: ["A Level Instance: it places the graph in the level", "A Blueprint child class: it can add new nodes to the parent graph and remove others", "A copy of the graph asset that is fully editable and no longer linked", "A Material Instance: it reuses the graph and overrides its parameters"]
        answer_index: 3
        explain: "Graph Instances work like Material Instances. They use Graph Parameters so you can reuse an existing graph with different values. You create one with Save Instance on the PCG component."
      - q: "Which key toggles Debug Rendering on a selected PCG node?"
        choices: ["E", "A", "F", "D"]
        answer_index: 3
        explain: "D toggles Debug on the node, E toggles Enabled, and A inspects the node so its points show in the Attributes list."
      - q: "In the Attribute Selector, how do you recognise a static attribute like Position?"
        choices: ["It starts with a $ sign, for example $Position", "It starts with an @ sign, for example @Position", "It is written in capital letters, such as POSITION", "It has no name, only a number"]
        answer_index: 0
        explain: "Names that start with $ are static attributes, which are always present. Names without $ are dynamic attributes created at runtime. @Last means the last dynamic attribute that was changed."
      - q: "How do you turn a PCG Graph into a template that other members can pick when they create a new graph?"
        choices: ["Rename the asset with the prefix TPL_, which the editor reads as a template", "Open Graph Settings and enable Is Template under Asset Info", "Right-click the asset and choose Make Template in the menu", "Save it inside the Engine folder"]
        answer_index: 1
        explain: "In the graph toolbar click Graph Settings, then in the Asset Info section enable Is Template. New graphs can then start from it in the Create Graph From Template window."
      - q: "Your Surface Sampler has Point Extents of 50 and Looseness of 1.0. What is the effective cell size?"
        choices: ["50, because Looseness only changes the seed", "25, because Looseness halves the cell size", "100, because cell size is point extents times (1 + Looseness)", "150, because cell size is point extents times (2 + Looseness)"]
        answer_index: 2
        explain: "Looseness allows variation in cell size. The cell size is point extents multiplied by (1 + Looseness), so 50 x 2 = 100. Points Per Square Meter then limits overcrowding on a big grid."
    flavors:
      _default: {why: "Parameters and instances let one PCG graph serve many areas of a level without copying it."}
      level_design: {why: "You can tune density per area from the Details panel and keep the graph untouched.", do: "Make a second instance with very low density for a sparse zone near a route."}

  - id: LDQ98
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [pcg, splines, pcg-editor-mode, fences]
    required_spine: false
    required: false
    title: "Fences along a spline with PCG Mode"
    brief: "PCG, the Procedural Content Generation framework, can place meshes along a spline, which is a curved line through points that you draw. This turns a fence, a wall or a barrier into something that you draw as one line and not something you place piece by piece. The editor also has a PCG mode with drawing tools that can use your graph as a preset. In this quest you build a fence graph and then draw fences with it directly in the level."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/pcg-editor-mode-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/procedural-content-generation-framework-node-reference-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-a-fence-generator-using-shape-grammar-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Enable the Procedural Content Generation Framework (PCG) plugin in Edit > Plugins if it is off. Work in a level that has a Landscape, or create a new level and make a Landscape in Landscape Mode. Create an Actor Blueprint named BP_FenceLine. Add a Spline component and a PCG component to it."
      - "Create a PCG graph named PCG_FenceLine. Connect these nodes in a chain: Get Spline Data, then Spline Sampler (set to sample on the spline), then Transform Points, then Static Mesh Spawner with a fence panel mesh. A cube that you scale into a thin panel works as the fence mesh."
      - "Assign PCG_FenceLine to the PCG component of BP_FenceLine. Place the actor in the level and move its spline points. Confirm that the fence follows the spline."
      - "Open Graph Settings and find Tool Data. Set Display Name to Fence, add SplineTool to Compatible Tool Tags, and enable Is Preset."
      - "Switch the editor mode to PCG. With nothing selected, pick the Draw Spline tool, choose the Fence preset, and draw a second fence on the landscape. Then click Apply."
      - "In Raycast Rules, enable Landscape and Ignore PCG Components. Draw a third fence that crosses the first one, and confirm that it does not snap onto the fence meshes."
      - "Walk through the level in PIE along a route that you choose. Adjust the spline so that the fence guides the player but does not block the route."
    done_when: "Send one screenshot of the PCG mode panel with your Fence preset button visible, and one PIE screenshot that shows at least two fences drawn with the tool along the route."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Your PCG graph does not appear in the Draw Spline tool dropdown. What is the most likely cause?"
        choices: ["The graph has no Static Mesh Spawner node in it, so the tool has nothing to draw", "The graph does not list SplineTool in its Compatible Tool Tags", "The graph is not saved in the Engine folder with the other tools", "The level has no landscape for the tool to draw the spline on with the mouse"]
        answer_index: 1
        explain: "A graph must set Compatible Tool Tags to appear in the graph dropdown of a matching tool. Draw Spline uses the SplineTool tag."
      - q: "You want a field of grass filled inside a closed area you draw. Which PCG mode tool fits?"
        choices: ["Draw Spline, with a thick line", "Paint, with a big brush", "Volume, with a flat box", "Draw Spline Surface"]
        answer_index: 3
        explain: "Draw Spline Surface defines a spline-bound closed area and the graph populates the interior. Examples are fields, cornrows and grass. It uses the SplineSurfaceTool tag."
      - q: "While using the Paint tool, what happens when you hold Shift?"
        choices: ["The brush becomes red and removes points", "The brush paints on a second data instance", "The brush ignores the landscape", "The tool switches to Volume"]
        answer_index: 0
        explain: "The Paint tool creates points where raycasts hit physical objects. Holding Shift turns the brush red and removes points instead."
      - q: "The Volume tool button is greyed out. Why?"
        choices: ["Volume tools need a Landscape in the level to project the box on", "The Volume tool is only available in PIE", "The selected actor is not a volume and has no box component", "The graph has the PaintTool tag and no other tool tag in its settings"]
        answer_index: 2
        explain: "The Volume tool is disabled unless the selected actor is a volume or has a box component. Tool buttons are disabled when the selection is not the correct class for the graph."
      - q: "You start a PCG mode tool with no actor selected. What does the tool do?"
        choices: ["It shows an error and stops, because every tool needs a selected actor with a PCG component", "It adds a PCG component to the PCGWorldActor and runs the selected graph on the whole level", "It creates a new actor to perform the operation, based on the selected graph or preset", "It waits until you click an actor in the viewport, and then adds a PCG component to that actor"]
        answer_index: 2
        explain: "If an actor is selected the tool adds a PCG component to it if needed. If no actor is selected, an actor is created for the operation, using the Actor Class to Spawn from the graph settings."
      - q: "In the PCG graph, you set the Spline Sampler to sample inside the spline area, but nothing appears. What is the likely reason?"
        choices: ["The spline must be closed to sample inside it", "Spline Sampler only works on Landscape Splines", "You need a Volume Sampler first", "The spline has too many points to sample the inside"]
        answer_index: 0
        explain: "The Spline Sampler can sample directly on the curve or in the spline volume. Sampling inside the spline requires the spline to be closed."
      - q: "What does the Raycast Rule 'Ignore PCG Components' do?"
        choices: ["Hides all PCG debug points in the viewport while the tool is active, so you can see the level", "Deletes the PCG components on the selected actor, so the tool can add a new one with the chosen graph", "Stops the graph from generating at runtime", "Rejects interaction on components that PCG created, so you do not draw on top of generated meshes"]
        answer_index: 3
        explain: "Raycast Rules control how the tools interact with the world. Ignore PCG Components rejects hits on PCG-created components, so your spline lands on the real ground or meshes."
      - q: "In the fence generator guide, the grammar is set to A*. What does this mean?"
        choices: ["Spawn exactly one A module at the start of the spline, and leave the rest of the spline empty", "Place an A module, then keep filling the spline with A modules as long as there is room", "Spawn A modules only at the control points of the spline, one module for each such point", "Spawn a random module for every point of the spline, picked from all modules that begin with A"]
        answer_index: 1
        explain: "The guide sets the Grammar parameter to A*. This places an initial static mesh and then fills the rest of the spline with static meshes as long as there is room. The Static Mesh Spawner then picks meshes By Attribute named Mesh."
    flavors:
      _default: {why: "Splines plus PCG turn a fence, wall or barrier into something you draw, not place piece by piece."}
      level_design: {why: "You can redraw a boundary in seconds when the route changes during playtests.", do: "Add a post mesh as a second entry and compare readability of the boundary at distance."}

  - id: LDQ99
