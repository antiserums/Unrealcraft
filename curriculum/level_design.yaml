  - id: LDQ90
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [lighting, lumen, readability]
    required_spine: false
    required: false
    title: "Lumen dials that keep rooms readable"
    brief: "Lumen is the system in Unreal Engine 5 that calculates bounced light, also called global illumination or GI, while the game runs. It is on by default. With Lumen a room that gets little light can become so dark that the player cannot see the layout. A Post Process Volume, or PPV, is a box that changes how the picture looks inside it, and it has a few Lumen settings for this. In this quest you use them to make a dark interior easy to see without losing its mood."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/lumen-global-illumination-and-reflections-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/lumen-technical-details-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. In a new level, build a small interior from cubes with one door to the outside. Light the level with one Directional Light and one Sky Light."
      - "Walk inside. Note the places where the room goes fully black and the player cannot see the layout."
      - "Add a Post Process Volume that covers the room and name it PPV_Interior. In its Details panel, go to Global Illumination and enable the overrides under Lumen Global Illumination."
      - "Raise Skylight Leaking a little, until you can see the corners. Then try Diffuse Color Boost, and keep it below 2."
      - "Turn the sun off and on again, and measure how long the room takes to update. Then raise Final Gather Lighting Update Speed and compare."
      - "Test Max Trace Distance with a low value and look for light that leaks through walls. Then set it back to a safe value."
      - "Write a short note with the 3 values you kept and why you kept them."
    done_when: "Send screenshots from before and after your PPV changes, and add your note with the 3 values."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Where are Lumen settings found?"
        choices: ["Only in Project Settings, under the Rendering section of it", "Only in the Post Process Volume settings of the level", "In the Directional Light, under its Light category", "In Project Settings and in the Post Process Volume"]
        answer_index: 3
        explain: "Project Settings hold the project defaults. Post Process Volumes hold overrides and artist controls for an area."
      - q: "An interior corner goes fully black. Which Lumen knob is made for keeping indoor areas from going black?"
        choices: ["Max Roughness To Trace", "Lumen Scene Detail", "Skylight Leaking", "Max Reflection Bounces"]
        answer_index: 2
        explain: "Skylight Leaking is a non-physical art knob that lets a fraction of the Sky Light leak into indoor areas."
      - q: "Why should Diffuse Color Boost stay below 2?"
        choices: ["Above 2 it is ignored and has no effect on the image", "It disables Screen Traces for all surfaces in the scene", "It requires hardware ray tracing above that value", "It also makes reflections brighter than the scene"]
        answer_index: 3
        explain: "The docs say values above 1 are not physical, and above 2 reflections get brighter than the scene."
      - q: "You set Max Trace Distance very low. What problem does the doc warn about?"
        choices: ["The GPU cost goes up a lot with each step lower", "Lighting leaks into large areas like caves", "Emissive stops working on meshes that are small", "Lumen switches over to hardware ray tracing"]
        answer_index: 1
        explain: "Values that are too small cause lighting to leak into large areas such as caves. Large values cost more GPU."
      - q: "You turn off the sun and the room stays bright for several seconds. What is the reason?"
        choices: ["The Sky Light is Static and keeps the baked light of the sun", "Screen Traces are off, so the old light is still on screen", "Lumen caches lighting; global changes take time to propagate", "The PPV is Unbound, and it blends out over a number of seconds"]
        answer_index: 2
        explain: "Lumen uses caches. Global lighting changes like disabling the sun can take multiple seconds unless you raise the update speed settings."
      - q: "What is the cost of raising Lumen Scene Lighting Update Speed or Final Gather Lighting Update Speed?"
        choices: ["Higher GPU cost", "Longer light builds", "More disk space", "Lower shadow resolution"]
        answer_index: 0
        explain: "Larger scales make lighting changes propagate faster but increase GPU cost."
      - q: "Which project setting is required for Lumen Software Ray Tracing?"
        choices: ["Generate Mesh Distance Fields", "Allow Static Lighting", "High Precision Normals", "Force No Precomputed Lighting"]
        answer_index: 0
        explain: "Generate Mesh Distance Fields is enabled when Lumen is turned on. It is required for Software Ray Tracing."
      - q: "Screen Traces improve quality. What is the downside named in the docs?"
        choices: ["They cost a lot of memory on consoles, and each trace is stored for a number of frames", "They block Lumen-Scene-only changes such as emissive objects only visible in GI", "They do not work with Nanite meshes, which are skipped by every screen trace", "They disable sky shadowing for every mesh on screen"]
        answer_index: 1
        explain: "Screen traces sample scene depth and color, so changes that only exist in the Lumen Scene are not picked up."
    flavors:
      _default: {why: "Lumen is the default GI. A few PPV dials decide if a dark room is moody or unreadable."}
      level_design: {why: "You must keep the layout readable without adding fake lights everywhere.", do: "Make one PPV for a dark tunnel and one for a bright yard. Use different Skylight Leaking values."}

  - id: LDQ91
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [exposure, post-process, readability]
    required_spine: false
    required: false
    title: "Exposure per area with Post Process Volumes"
    brief: "Exposure is how bright the camera makes the picture, like the way your eyes adapt when you walk from sunlight into a dark room. Unreal adjusts exposure automatically, but the result is not always good, and a dark area can become impossible to see. A Post Process Volume is a box that changes camera settings such as exposure only inside its area. In this quest you give a bright yard and a dark tunnel their own volumes and adjust how the picture changes between them."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/auto-exposure-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. In a new level, build a bright yard that leads into a dark tunnel, both from cubes. Keep one Directional Light and one Sky Light in the level."
      - "Place two Post Process Volumes named PPV_Yard and PPV_Tunnel. Keep Infinite Extent turned off, and scale each box to fit its area."
      - "In PPV_Tunnel, set Exposure Compensation to a higher value so that you can see inside the tunnel. Set Priority so that the tunnel volume wins in the places where the two volumes overlap."
      - "Set a Blend Radius on both volumes, which makes the change gradual, and walk through the transition in PIE. Then adjust Speed Up and Speed Down, which control how fast the exposure adapts."
      - "In the viewport, open Show, then Visualization, and enable HDR (Eye Adaptation). Read the value of Average Scene EV100 in each area."
      - "Turn on Local Exposure in the tunnel volume (under Lens, then Local Exposure). Compare how the door opening looks with and without it."
    done_when: "Send a screenshot of the HDR (Eye Adaptation) view in the tunnel, and a short note with the Priority, Blend Radius and Speed values you kept."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which exposure metering mode is the default?"
        choices: ["Auto Exposure Basic", "Manual Camera Exposure", "Local Exposure", "Auto Exposure Histogram"]
        answer_index: 3
        explain: "Auto Exposure Histogram is the default. It uses a 64-bin histogram and gives finer control."
      - q: "Two PPVs overlap. Which one wins?"
        choices: ["The one with the highest Priority", "The bigger one of the two volumes", "The one placed first in the level", "The one with the largest Blend Radius"]
        answer_index: 0
        explain: "In overlapping volumes, the one with the highest Priority overrides the others. Equal priority is undefined."
      - q: "What does Blend Radius do?"
        choices: ["It scales the volume by that value", "It sets the exposure range of the volume", "It creates a transition area around the volume", "It limits the volume to the view of the camera"]
        answer_index: 2
        explain: "Blend Radius is a distance around the volume used for blending, so the look changes smoothly when you walk in."
      - q: "You want one PPV to affect the whole level. Which setting?"
        choices: ["Priority set to 100 or more", "Infinite Extent (Unbound)", "Blend Weight set to 0", "Enabled turned off"]
        answer_index: 1
        explain: "Infinite Extent makes the volume affect the entire scene regardless of its bounds."
      - q: "To mimic eyes, which is the recommended relation between Speed Up and Speed Down?"
        choices: ["Both equal, at a value of 1", "Speed Up higher, Speed Down lower", "Speed Up lower, Speed Down higher", "Speed Down must be 0, Speed Up 1"]
        answer_index: 1
        explain: "Speed Up should be higher (dark to bright adapts fast). Speed Down should be lower (bright to dark adapts slowly)."
      - q: "A tunnel has a very bright door opening that blows out. Which feature is made for this case?"
        choices: ["Local Exposure", "Bloom Threshold", "Manual metering", "Exposure Metering Mask"]
        answer_index: 0
        explain: "Local Exposure applies local adjustments to keep highlight and shadow detail, and should always be set up with Lumen."
      - q: "What does the Exposure Metering Mask texture do?"
        choices: ["It tints the scene with the colors of the texture, pixel by pixel", "It sets the EV100 value of each screen pixel directly as a map", "It masks bloom on the dark pixels of the texture", "It weights how much each screen pixel counts for auto exposure"]
        answer_index: 3
        explain: "Each pixel is weighted by the mask. Weighting the center more helps stabilize auto exposure."
      - q: "In Manual mode with Apply Physical Camera Exposure off, what controls the fixed exposure?"
        choices: ["Scene luminance of the frame", "Histogram Log Min and Histogram Log Max", "EV100 plus Exposure Compensation", "The intensity of the Sky Light"]
        answer_index: 2
        explain: "Manual mode uses Exposure = 1/(2^(EV100 + Exposure Compensation)), not the scene luminance."
    flavors:
      _default: {why: "Exposure decides if the player sees the room at all. Per-area volumes give you control."}
      level_design: {why: "Your tunnel must read as dark but still show the path.", do: "Add a third PPV for a boss room with a slower Speed Down to make it feel heavy."}

