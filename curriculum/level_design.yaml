      _default: {why: "Mobility decides both the cost of a light and what you can do with it in gameplay."}
      level_design: {why: "You will place many lights to guide players. Picking the wrong mobility breaks performance or breaks your switch logic.", do: "Add one light that a trigger volume turns on. Pick the mobility that makes this cheapest."}

  - id: LDQ90
