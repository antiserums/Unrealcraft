  - id: LDQ104
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [landscape, landscape-splines, roads, edit-layers]
    required_spine: false
    required: false
    title: "Roads that shape the terrain"
    brief: "A Landscape Spline is a path that you draw on the terrain, usually for a road or a river. It can change the terrain under it: it can raise or lower the ground to fit the path, paint a ground layer along it, and place road meshes on it. A road that shapes the ground looks planned, and it keeps players and vehicles on it. In this quest you draw a road to a landmark and set up its width, its effect on the terrain and its mesh."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/landscape-splines-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/landscape-edit-layers-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a level that has a Landscape with Edit Layers enabled, or create one: make a new level, enter Landscape Mode, choose New on the Manage tab, and check Enable Edit Layers. Sculpt a few dips and hills, and place a tall cube as a landmark. In Landscape Mode, open the Edit Layer stack and add a new Spline Edit Layer. The splines need this layer to change the terrain."
      - "Open the Manage tab and select the Spline tool. Hold Ctrl and click to lay a road from a start area to the landmark. Use Alt+drag to extend it."
      - "Select all control points. Set Half-Width to the width of your road, and set Side Falloff so that the edges blend into the terrain. Set Layer Name to a paint layer named Road."
      - "On the segments that cross a dip in the ground, enable Raise Terrain. On one other segment, disable it and compare the two results."
      - "Make a road mesh: in Modeling Mode, create a long flat Box, accept it as a Static Mesh, and name the asset SM_RoadSection. Select the spline segments and add a Spline Mesh that uses SM_RoadSection. Enable Scale to Width and choose the correct Forward Axis."
      - "Select a control point and use the scale tool to drag its tangents until the curve is smooth. Press End to snap the points to the landscape."
      - "Walk or drive along the road in PIE. Check that the raised sides of the road do not block the view of the landmark."
    done_when: "Send one editor screenshot that shows the Spline Edit Layer in the stack and the road with its Half-Width and Side Falloff lines visible. Also send one PIE screenshot taken from the road looking toward the landmark."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You drew a landscape spline but the terrain does not change. What is missing?"
        choices: ["A Spline Edit Layer in the edit layer stack", "A Static Mesh on each segment of the spline", "A NavMesh rebuild from the Build menu of the editor", "A Landscape Material with a layer for the spline"]
        answer_index: 0
        explain: "Landscape splines do not affect the heightmap until a Spline edit layer is added to the edit layer stack. After that the landscape reacts automatically."
      - q: "Which option fits a road on an embankment, and which fits a ditch?"
        choices: ["Lower Terrain for the road, Raise Terrain for the ditch", "Scale to Width for both the road and the ditch", "End Falloff for the road, Side Falloff for the ditch", "Raise Terrain for the road, Lower Terrain for the ditch"]
        answer_index: 3
        explain: "Raise Terrain raises the landscape to match the spline, good for roads on embankments. Lower Terrain lowers it, good for rivers and ditches."
      - q: "How do you make the spline paint a road texture on the landscape?"
        choices: ["Add a decal with the road texture along the spline; the decal is then written into the weightmap when you save", "Set the Layer Name on the segments to the painted blendmask layer; width and falloff shape the paint", "Enable Cast Shadow on the segments; the shadow of the mesh is then baked as paint", "Set the Mesh Vertical Offset on the segments to the height of the road; the offset also paints the layer"]
        answer_index: 1
        explain: "The Texture layer that is painted is set by the Layer Name property on segments, and the painting is affected by the spline width and falloff of the control points."
      - q: "In the viewport, what do the solid and dotted lines around a spline show?"
        choices: ["Solid = collision of the spline meshes, dotted = navigation area bounds", "Solid = tangent of the control point, dotted = mesh bounds", "Solid = Half-Width, dotted = Side Falloff (the cosine-blended region)", "Solid = raised terrain area, dotted = lowered terrain"]
        answer_index: 2
        explain: "Half-Width is shown as solid lines. Side Falloff is the width of the cosine-blended falloff region on each side and is shown as dotted lines."
      - q: "With a control point selected, what does the scale tool do?"
        choices: ["Scales the spline meshes on the segments next to the point, and nothing else at all", "Shows the tangents; dragging their ends changes how curved the segments are", "Scales the landscape component under the point and lifts the terrain with it", "Widens the road at that point, by changing the Half-Width value of the control point"]
        answer_index: 1
        explain: "Control points respond normally to translate and rotate, but the scale tool brings up the spline tangents. Dragging a tangent end alters the curve of the segment."
      - q: "Which key snaps selected control points down to the landscape?"
        choices: ["R", "T", "End", "F"]
        answer_index: 2
        explain: "End snaps the selected control points to the Landscape below. R recalculates rotation, T flips tangents and F flips segments (meshes only)."
      - q: "What does Scale to Width do on a spline mesh entry?"
        choices: ["Scales the mesh to fit the spline width instead of using it as-is", "Scales the landscape under the spline to fit the size of the mesh", "Doubles the Half-Width of the spline at each control point of the segment", "Sets the mesh forward axis, so the mesh points along the length of the spline"]
        answer_index: 0
        explain: "Scale to Width scales the mesh to fit the spline width. When it is on, the Scale value is relative to the spline width; otherwise it is relative to the mesh's natural size."
      - q: "Can you sculpt by hand on the Spline Edit Layer?"
        choices: ["Yes, it works like the base layer, and hand sculpting is mixed with the spline data on the same layer", "Only with the Erase tool, which removes the spline data under the brush and leaves the base layer as it was", "Only after Collapse, when the Spline layer is merged down and turned into a normal layer that accepts all tools", "No, the Spline edit layer only supports procedural data and cannot be sculpted or painted by hand"]
        answer_index: 3
        explain: "The Landscape Spline edit layer only supports procedural data. It cannot be sculpted or painted by hand; it lets you move splines non-destructively while the terrain updates."
    flavors:
      _default: {why: "A road that reshapes the ground reads as intended and keeps vehicles and players on it."}
      level_design: {why: "Raise/Lower and falloff settings decide if a road becomes a wall or a path for sightlines.", do: "Compare a wide Side Falloff and a narrow one from the player's eye height and note which reads better."}

  - id: LDQ105
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [navigation, nav-area, query-filter, ai]
    required_spine: false
    required: false
    title: Two agents, two lanes (Area Classes and Query Filters)
    brief: "Each area of the NavMesh has a cost, and AI characters prefer the path with the lowest total cost. An Area Class is a type of area with its own cost and color. A Navigation Query Filter can change these costs for one kind of AI only, so different characters see the same space differently. This lets you send patrols, civilians and heavy units along different lanes without building new geometry. In this quest you make three lanes and two walkers that each choose a different lane."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/custom-navigation-areas-and-query-filters-quick-start-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/custom-navigation-areas-and-query-filters-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-how-to-modify-the-navigation-mesh-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. In a test level with a floor and a NavMeshBoundsVolume, place three Nav Modifier Volumes side by side as lanes. Scale each one to about X=2, Y=6, Z=1."
      - "Create three Blueprints with the parent class Nav Area: BP_Area_Neutral, BP_Area_Lane1 and BP_Area_Lane2. Give Lane1 a blue Draw Color and Lane2 a red Draw Color."
      - "Assign one Area Class to each volume. Press P and check that the lanes show in their Draw Colors on the NavMesh."
      - "Create two Blueprints with the parent class Navigation Query Filter: BP_QueryFilter1 and BP_QueryFilter2. In each one, add the three Area Classes and use Travel Cost Override with a value of 100, so that a different lane is cheap in each filter."
      - "Make an AI walker: duplicate BP_ThirdPersonCharacter, delete its input nodes, and on Begin Play call AI Move To toward a target sphere that you place on the far side of the lanes. Add an Instance Editable variable for the Filter Class pin of the node. Place two walkers. Set Filter Class to BP_QueryFilter1 on one walker and to BP_QueryFilter2 on the other."
      - "Click Simulate. Confirm that each walker takes a different lane to the same target."
    done_when: "Send two screenshots from Simulate: one that shows both walkers on their own lanes, and one of the Details panel of one Query Filter that shows its Areas list with the Travel Cost Override values."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Two agents share one NavMesh but must prefer different lanes to the same target. Which setup does the source describe for this?"
        choices: ["Two NavMeshBoundsVolumes, one per agent, each covering only the lane that the agent is allowed to walk in", "Custom Area Classes on Nav Modifier Volumes plus a different Navigation Query Filter per agent", "Two Nav Link Proxies with opposite directions, placed at the start of each lane, with one link for each agent", "Two RecastNavMesh actors with a different Agent Radius, so each agent walks on its own NavMesh"]
        answer_index: 1
        explain: "The guide creates Area Classes for the lanes and two Query Filters that override the costs. Each agent gets its own Filter Class."
      - q: "What does a Navigation Modifier Volume use to decide the cost of the polygons inside it?"
        choices: ["Its Area Class", "Its Scale", "Its Draw Color", "Its Actor Tag"]
        answer_index: 0
        explain: "Nav Modifier Volumes use Area Classes. The Area Class holds the Default Cost multiplier and the Fixed Area Entering Cost."
      - q: "Which two cost values does an Area Class define?"
        choices: ["Path Length and Path Time for the area", "Default Cost multiplier and Fixed Area Entering Cost", "A Sight Cost multiplier and a Hearing Cost multiplier", "Tile Cost and Cell Cost of the NavMesh"]
        answer_index: 1
        explain: "Default Cost is the multiplier while moving inside the area. Fixed Area Entering Cost is paid once when the agent enters the area."
      - q: "If every polygon on the route has the same cost, what path does the agent choose?"
        choices: ["A random path", "The path with the fewest tiles", "The shortest path, usually a straight line", "The path that follows the NavMesh border"]
        answer_index: 2
        explain: "With equal costs, the agent picks the shortest path to its target, usually a straight line."
      - q: "What can a Navigation Query Filter do with the Area Classes it lists?"
        choices: ["Delete them from the level for as long as the agent that uses it walks", "Override their cost values for the agent that uses the filter", "Change their Draw Color at runtime for the agent that uses it", "Turn them into Nav Link Proxies for that agent"]
        answer_index: 1
        explain: "A Query Filter contains one or more Area Classes and can override their cost values. In the guide this is done with Travel Cost Override."
      - q: "Where do you tell an AI walker which Query Filter to use, according to the guide?"
        choices: ["In Project Settings > Navigation Mesh, under the Query section", "In the Filter Class field on the NPC Blueprint's Details panel", "In the Nav Modifier Volume, with one Filter Class for each Area Class", "In the Blackboard asset, as a key of type Class that the tree reads"]
        answer_index: 1
        explain: "The guide selects the BP_NPC in the level and sets Filter Class to BP_QueryFilter1, then to BP_QueryFilter2."
      - q: "Which parent class do you pick to create a custom area class in Blueprint?"
        choices: ["Nav Modifier Volume", "Navigation Query Filter", "Nav Area", "Nav Link Proxy"]
        answer_index: 2
        explain: "The guide creates BP_Area_Neutral, BP_Area_Lane1 and BP_Area_Lane2 from the Nav Area class."
      - q: "You want a lane to be a hard wall for pathfinding, not just more expensive. Per the Modifying the Navigation Mesh guide, which built-in Area Class does that?"
        choices: ["NavArea_Default", "NavArea_Obstacle", "NavArea_Null", "NavArea_LowHeight"]
        answer_index: 2
        explain: "NavArea_Null applies an infinite cost, so no NavMesh is generated inside. NavArea_Obstacle only makes the area expensive; agents still cross it if there is no cheaper path."
    flavors:
      _default: {why: "Lane choice per agent type lets you steer patrols, civilians and heavy units through the same space without new geometry."}
      gameplay_design: {why: "Query Filters are a tuning knob: change a cost, change an encounter.", do: "Add a third filter that makes the middle lane cheapest and show a third walker using it."}

  - id: LDQ106
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [navigation, navmesh, performance]
    required_spine: false
    required: false
    title: NavMesh resolution per zone
    brief: "The NavMesh is built in square pieces called tiles. A fine NavMesh is precise but slow to build, and a coarse one is fast but cannot fit through small gaps. Unreal lets you choose a resolution of Low, Default or High for each zone, so that only the tight areas pay for precision. This matters most in big worlds where the NavMesh is rebuilt while the game runs. In this quest you set different resolutions in two zones and compare the build times."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/navigation-mesh-resolutions-user-guide"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/navigation-mesh-settings-in-the-unreal-engine-project-settings"
    checklist:
      - "Open any project, or create one from the Third Person template. Work in a level with a large floor and a NavMeshBoundsVolume that covers it. Select the RecastNavMesh-Default actor and enable Draw Tile Build Times. Press P to see the NavMesh and the build time of each tile."
      - "Place a Nav Modifier Volume over an open area that covers several tiles. Set its Nav Mesh Resolution to Low. Compare the build times inside and outside the volume."
      - "Build a tight area from three cube obstacles with small gaps between them. Cover it with a second Nav Modifier Volume and set that one to High."
      - "On the RecastNavMesh actor, enable Draw Tile Resolutions and Draw Tile Build Times Heat Map. Check that the colors match your zones."
      - "Make BP_NavResCarrier, an Actor Blueprint with a NavModifier component that is set to Low. Drag it across the NavMesh and watch the tiles rebuild."
      - "Open Project Settings, go to Navigation Mesh, then Generation, and find Nav Mesh Resolution Params. Note the Cell Size of each resolution."
    done_when: "Send two screenshots: one of the level with Draw Tile Resolutions on, with blue, green and yellow zones visible, and one of the same view with the build time heat map. Add one line with the Cell Size values you found for Low, Default and High."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "How many tile resolutions can one Navigation Mesh use at the same time?"
        choices: ["One", "Two", "Three", "Eight"]
        answer_index: 2
        explain: "The feature generates tiles at three resolutions in the same NavMesh: high, medium (default) and low."
      - q: "What is the trade-off of a Low resolution tile?"
        choices: ["Faster to generate and less memory, but less accurate", "More accurate around obstacles, but slower to generate", "Same accuracy, only a different color in the navigation debug view", "Agents move faster on it, because the polygons are larger"]
        answer_index: 0
        explain: "Low resolution uses fewer polygons for the same space. Generation is faster and memory is smaller, at the cost of accuracy."
      - q: "An open field has no obstacles, and a warehouse has shelves with narrow gaps. Which resolution plan does the guide suggest?"
        choices: ["High everywhere", "Low in the field, Default or High in the warehouse", "Low in the warehouse, Default or High in the field", "Default everywhere; resolution cannot vary"]
        answer_index: 1
        explain: "Use low resolution in open spaces where accuracy is not needed, and default or high in dense areas with small spaces between obstacles."
      - q: "With Draw Tile Resolutions enabled, which color means a Low resolution tile?"
        choices: ["Yellow", "Green", "Red", "Blue"]
        answer_index: 3
        explain: "Blue is low, green is default and yellow is high."
      - q: "Agents cannot pass between two close obstacles in a Low zone, but they can in a Default zone. Why?"
        choices: ["Low tiles block agents by design, so that crowds stay out of all narrow places", "Low resolution does not have enough polygons to build a path in the tight gap", "Default tiles have a lower cost, so agents pick them and never try the gap in the Low zone", "Agents ignore Low tiles and treat every obstacle that stands in them as a solid wall"]
        answer_index: 1
        explain: "The guide shows this exact case: at Low resolution there is not enough resolution to create polygons between close obstacles, so no path exists."
      - q: "Where can you set a tile resolution from inside an Actor Blueprint?"
        choices: ["On a NavModifier component, Nav Mesh Resolution dropdown", "On the Static Mesh component, in the Collision section", "On the Actor's Tags, with a tag named like the resolution", "On the RecastNavMesh actor only, not in a Blueprint"]
        answer_index: 0
        explain: "Add a NavModifier component to the Actor and pick the resolution in its Nav Mesh Resolution dropdown. Tiles rebuild as the actor moves."
      - q: "In Nav Mesh Resolution Params, what does a bigger Cell Size do?"
        choices: ["Makes tiles generate faster", "Makes tiles more accurate", "Makes agents bigger", "Adds more tiles"]
        answer_index: 0
        explain: "The bigger the Cell Size, the faster the tile generates."
      - q: "For optimal performance, what relationship between Tile Size UU and the Cell Sizes does the guide recommend?"
        choices: ["Tile Size UU must be equal to the largest Cell Size, and the other Cell Sizes must be half of it", "Tile Size UU should be divisible by all the Cell Sizes, and Cell Sizes multiples of each other", "Tile Size UU should be a prime number, so that no Cell Size divides it evenly", "There is no relationship; any Tile Size UU works equally well with any Cell Size"]
        answer_index: 1
        explain: "Set each Cell Size as a multiple of the others and make sure Tile Size UU is divisible by all of them."
    flavors:
      _default: {why: "Big open worlds with dynamic NavMesh get cheaper when only the dense parts pay for precision."}
      gameplay_design: {why: "Tight arenas need precise paths; the resolution choice decides whether AI can use your cover gaps.", do: "Measure the smallest gap your AI must pass and check which resolution still finds a path through it."}

  - id: LDQ107
