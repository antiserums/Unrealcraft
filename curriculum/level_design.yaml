      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/stat-commands-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/CheatManager/Slomo"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/CheatManager/Teleport"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/CheatManager/God"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/CheatManager/Ghost"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/CheatManager/Walk"
    checklist:
      - "Play your blockout in the viewport. Press ~ to open the console. Type stat FPS and press Enter to show the frame rate counter."
      - "Type slomo 0.25 to slow the game down, and walk through your hardest jump. Then type slomo 1 to return to normal speed."
      - "Look at a ledge on the other side of a gap and type teleport. Check that you landed on the surface you were looking at."
      - "Type ghost and fly through a wall to check the far side. Then type walk to return to normal movement."
      - "Type god, and then walk into a trap or a kill volume to confirm that you take no damage."
      - "Write down which command saved you the most time and where you used it."
