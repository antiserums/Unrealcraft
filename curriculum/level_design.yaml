    specializations: [level_design]
    subjects: [geometry-script, blockout, dynamic-mesh, parametric-tools]
    required_spine: false
    required: false
    title: "Parametric blockout tools, Lyra style"
    brief: "A parametric block is a blockout piece whose shape is built from numbers, such as width, length and height. When you want a different size, you change a number and the mesh is rebuilt, so you do not have to model it again. Epic's sample game Lyra uses tools like this for its blockouts. In this quest you build a ramp tool with the Geometry Script plugin and then bake its result into a normal Static Mesh."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/lyra-geometry-tools-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/geometry-scripting-users-guide-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Enable the Geometry Script plugin and restart the editor."
      - "Create a Blueprint named BP_Tool_Ramp with GeneratedDynamicMeshActor as its parent class. Add the Instance Editable variables Width, Length, Height and Steps."
      - "In the event Event On Rebuild Generated Mesh, append boxes that use the variables, so that the actor builds a ramp or a stair block. If you need a temporary mesh, use Request and Release Mesh for it."
      - "Place three BP_Tool_Ramp actors in the level. Change their variables in the Details panel so that each one fits the character in a different way: a ramp that the character can walk up, a stair whose steps are lower than 45 cm, and a tall block that the character can only reach with a jump. Test them in PIE."
      - "Add an event named Bake with Call In Editor turned on. It copies the dynamic mesh to a Static Mesh asset. The Geometry Script library has two functions for this: Create New Static Mesh Asset from Mesh makes a new asset at the path you give it, for example /Game/Blockout/SM_Ramp_Baked, and Copy Mesh to Static Mesh writes into an asset that already exists. Use the first one the first time."
      - "Replace one ramp with a Static Mesh Actor that uses the baked asset. Move the tool actor below the level and keep it there as the template."
    done_when: "Send one screenshot of the BP_Tool_Ramp graph with On Rebuild Generated Mesh. Also send one viewport screenshot with three ramps of different sizes and the baked Static Mesh asset visible in the Content Browser."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Why does Lyra bake its parametric Tool actors to Static Mesh assets before shipping a level?"
        choices: ["Dynamic Mesh Components cannot be saved with the level or be duplicated", "Blueprints cannot be placed in levels that are shipped", "The Dynamic Mesh Component does not support Lumen, Nanite or instancing", "Static Meshes are easier to rename and to move between folders"]
        answer_index: 2
        explain: "The Dynamic Mesh Component gives rapid parametric design but does not support UE rendering features like Lumen or Nanite, and does not support instancing. Baking to a Static Mesh gives all of that back."
      - q: "You duplicate a Tool actor and later change the original's parameters. What happens to the duplicate?"
        choices: ["Nothing, the duplicate is a completely separate mesh", "It updates too, because it shares the mesh of the original", "It is deleted from the level right away", "It becomes a Static Mesh asset with the old parameters"]
        answer_index: 0
        explain: "Dynamic Mesh Actors do not support instancing. A duplicate is a separate mesh and changing the original does not affect it. That is why Lyra bakes and places instances of the baked asset."
      - q: "What is the difference between Generate New Static Mesh and Bake to Static Mesh on a Lyra Tool?"
        choices: ["They are the same button; the label changes from Generate to Bake after the first click on it", "Generate works only in PIE and makes a temporary mesh; Bake works only in the editor and writes the asset to disk", "Bake creates a new asset each time; Generate updates the one that was made by the last Bake", "Generate creates a new asset and records it as the Target Static Mesh; Bake updates that existing target asset"]
        answer_index: 3
        explain: "Generate New Static Mesh creates a new StaticMesh asset at the configured path and stores it in Target Static Mesh. Bake to Static Mesh then updates that asset at any time."
      - q: "Why does Lyra keep Tool actors below the playable level instead of deleting them?"
        choices: ["They are needed for collision, because the baked Static Mesh assets have no collision", "The Tool is the template for the baked asset; if it is deleted the settings are lost", "They cast the shadows of the level, because baked Static Mesh assets cannot cast any shadows", "The engine requires it, and the level will not save without them"]
        answer_index: 1
        explain: "The Tool actor must exist as a template for the Static Mesh asset. Deleting it loses the settings, so Lyra places the tools out of the way below the level."
      - q: "Where does the Event On Rebuild Generated Mesh exist?"
        choices: ["In every Actor Blueprint, and it runs in the editor and in the game", "Only in Blueprints derived from GeneratedDynamicMeshActor, and it is editor-only", "In the Level Blueprint, and it runs each time the level is saved", "In Editor Utility Widgets only, and it runs every time that the widget is opened"]
        answer_index: 1
        explain: "On Rebuild Generated Mesh is offered by AGeneratedDynamicMeshActor for procedural mesh actors. It only exists in Blueprints derived from that class and is currently editor-only."
      - q: "Most Geometry Script nodes take a Target Mesh and also return a Target Mesh. Why?"
        choices: ["The output is a new copy of the mesh, so the input stays unchanged and can be used again by other nodes", "The return is only used for debugging; it holds a copy of the mesh as it was before the node ran, for comparison", "It returns the static mesh asset that the Dynamic Mesh was baked to, so that the next node can edit the asset on disk", "The operation edits the input mesh in place and returns the same object so you can chain operations"]
        answer_index: 3
        explain: "Geometry Scripting operations modify the input mesh rather than creating temporary meshes. The same UDynamicMesh is returned so you can chain nodes in sequence."
      - q: "How is a UDynamicMesh stored compared to a UStaticMesh?"
        choices: ["A UDynamicMesh is not an asset; it lives in the level and each component owns its own mesh", "Both are assets in the Content Browser; a UDynamicMesh is saved in its own file and can be used by many levels", "A UDynamicMesh is stored in a text file next to the level, and it is read again each time that the level is opened", "A UDynamicMesh is shared between components; many components in a level point to one mesh asset"]
        answer_index: 0
        explain: "Unlike UStaticMesh, UDynamicMesh is not an asset. A UDynamicMeshComponent owns its mesh, it is stored in the level, and duplicating the component copies the mesh."
      - q: "How did Lyra build the Swap to Static Mesh and Swap to Generated Mesh right-click actions?"
        choices: ["With C++ editor modules that are compiled into the Lyra game project", "With Python scripts that are run from the Output Log, one for each direction", "With Actor Action Utility Blueprints, linked by a Source Generator Key", "With Level Blueprint events that are copied into each map"]
        answer_index: 2
        explain: "The swapping system is built entirely in Blueprints using Actor Action Utility Blueprints (Scripted Actions). A Source Generator Key string links a Tool to its baked Static Mesh actors."
    flavors:
      _default: {why: "A parametric block lets you change size with a number instead of rebuilding the mesh."}
      level_design: {why: "Metrics-driven blocks such as ramps and stairs can be tuned live while you test.", do: "Add a Step Height variable and check it against your metrics sheet."}

