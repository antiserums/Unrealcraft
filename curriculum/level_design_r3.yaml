      - "Resize every cover piece in L_Arena_01 to one of those two heights."
      - "In a Top orthographic view, middle-mouse drag to measure the distances between enemy positions and player cover. Write down short, mid and long."
      - "Place a Camera Actor at enemy eye height at each enemy position. Right-click → Pilot it and check what it can see."
      - "Save a bookmark (Ctrl+1..9) at each enemy view and at the player entry. Fix one sightline that's too open or too closed."
      - "Add the cover heights and engagement distances to your metrics sheet."
    done_when: "Metrics sheet with cover heights and engagement distances, plus before/after screenshots of the sightline you fixed."
    xp: 100
    verify_type: screenshot
    quiz:
      - q: "Where should cover heights come from?"
        choices: ["Your character's measured capsule and eye height", "Whatever looks nice", "The engine default grid size", "The Starter Content cube"]
        answer_index: 0
        explain: "Cover works only if it matches the character. Measure, then build to those numbers."
      - q: "How do you measure a distance quickly in the editor?"
        choices: ["Count grid squares on screen", "Middle-mouse drag in an orthographic viewport", "Use Print String", "Open the Outliner"]
        answer_index: 1
        explain: "The orthographic ruler shows the length in units (cm) as you drag."
      - q: "How can you check exactly what an enemy position can see?"
        choices: ["Lower the light intensity", "Hide all cover", "Place a camera at enemy eye height and pilot it, or bookmark that view", "Turn on wireframe"]
        answer_index: 2
        explain: "Look from the enemy's eye height, not the editor camera's."
      - q: "Cover is 110 cm tall and your standing player can't see over it. What's wrong?"
        choices: ["Nothing", "The NavMesh", "The lighting", "That piece is taller than your character's standing view line, so it acts as full cover"]
        answer_index: 3
        explain: "If players can't see over it, it's full cover. Decide which you want and build to that height."
      - q: "Why write engagement distances down?"
        choices: ["Epic requires it", "So spacing stays consistent across encounters and other people can tune against it", "It saves memory", "It speeds up NavMesh building"]
        answer_index: 1
        explain: "Written metrics are what let a team build spaces that play the same way."
    flavors:
      _default: {why: "Numbers you can measure are easier to discuss in critique than 'it feels off'."}
      level_design: {why: "Cover and sightlines are measurable. Measured spaces are easier to fix.", do: "Keep a bookmark per enemy view and walk them all after every layout change."}
      gameplay_design: {why: "Engagement distances decide which weapons and verbs matter.", do: "Note the range each of your verbs is designed for and check the arena supports it."}

