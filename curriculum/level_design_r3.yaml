      - q: "A reviewer suggests something that goes against your GDD's goal. What do you do?"
        choices: ["Ignore it silently", "Change the goal every time", "Reply with why you're keeping it, and log the decision", "Delete the post"]
        answer_index: 2
        explain: "Not every note needs a change. Every note needs an answer."
      - q: "What makes a good critique you give?"
        choices: ["One thing that works, one specific issue, one next step", "A long list of everything wrong", "Only emojis", "A rewrite of their level"]
        answer_index: 0
