    checklist:
      - "In BP_Enemy or BP_Lever, turn three hard-coded numbers into variables (e.g. MoveSpeed, WaitTime, Health)."
      - "Tick Instance Editable (the eye icon) on each, give each a Category and a Description (the tooltip)."
