      - q: "Why include the GDD link with a critique post?"
        choices: ["The bot requires links", "Reviewers can judge the space against what you meant it to do", "To fill space", "So it gets more reactions"]
        answer_index: 1
        explain: "Without the goal, reviewers critique the level they'd have made instead."
    flavors:
      _default: {why: "Other people see problems you've stopped noticing. Critique is how you get that."}
