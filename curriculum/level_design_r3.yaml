        answer_index: 3
        explain: "A specific question gets a specific answer."
      - q: "What goes in an iteration log entry?"
        choices: ["Only the changes you liked", "Date, feedback, what you changed, and what you didn't change and why", "Just screenshots", "The reviewer's rank"]
        answer_index: 1
