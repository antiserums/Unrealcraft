# plus the bay-design track (required for level_design and gameplay_design) and Design electives.
# URL prefix: https://dev.epicgames.com/documentation/en-us/unreal-engine/
# Verified slugs only (see VERIFIED_URLS.md). Backup videos are TODO_URL until a human picks a dated UE5+ video.
# The Artisan 1.25x in-Specialty XP multiplier is applied by the Quartermaster, not here.
# Rank 3+ capstone verification: one mentor approve OR two peer approves (verify_type: mentor).

quests:
  # ------------ Shared characters-anim track (required for all majors) ------------
  - id: AQ1
    rank: 3
    difficulty: expert
    track: characters-anim
    subjects: [character, movement, metrics]
    required_for_majors: [all]
    taster_for_majors: []
    adjacent_for: []
    required_spine: false
    elective: false
    title: Character anatomy
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-a-character-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 character movement component max walk speed jump z step height walkable floor angle"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/third-person-template-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/collision-in-unreal-engine"
    checklist:
      - "Open your Third Person character Blueprint. In the Components panel, find the Capsule, the Mesh and CharacterMovement."
      - "Select the Capsule and write down its Half Height and Radius. Those two numbers are your real collision size."
      - "Select CharacterMovement and find Max Walk Speed, Jump Z Velocity, Max Step Height and Walkable Floor Angle."
      - "In a test level, build a 3-step stair (20, 40, 60 cm risers) and ramps at 30°, 45° and 55°."
      - "PIE and note which steps and ramps you can walk up. Change Max Step Height or Walkable Floor Angle once and test again."
      - "Double Jump Z Velocity, jump onto a ledge, then set it back. Note the ledge height you could reach at each value."
    done_when: "Screenshot of the CharacterMovement Details with your four values, plus a 3-line note: capsule size, highest step, steepest ramp."
    xp: 90
    verify_type: screenshot
    quiz:
      - q: "What actually collides with walls and floors when a Character moves?"
        choices: ["The skeletal mesh", "The capsule component", "The camera boom", "Every bone's physics body"]
        answer_index: 1
        explain: "CharacterMovement sweeps the capsule. The mesh is visual. Build doorways and gaps to the capsule's size."
      - q: "The player walks into a 55 cm ledge and stops dead, but you want them to walk up it. Which setting?"
        choices: ["Jump Z Velocity", "Walkable Floor Angle", "Max Walk Speed", "Max Step Height"]
        answer_index: 3
        explain: "Max Step Height is the tallest step the capsule climbs without jumping. Be careful: raising it also lets players climb props you meant as barriers."
      - q: "The player slides down a ramp you meant to be walkable. Which setting decides that?"
        choices: ["Walkable Floor Angle", "Gravity Scale", "Max Step Height", "Braking Deceleration"]
        answer_index: 0
        explain: "Surfaces steeper than Walkable Floor Angle count as walls or slides. Build ramps under it, or change the value for the whole character."
      - q: "Max Walk Speed is measured in…"
        choices: ["Meters per second", "Tiles per turn", "Centimeters per second", "Units per frame"]
        answer_index: 2
        explain: "Unreal units are cm, so 600 means 6 m/s. Divide a corridor length by it to get the seconds it takes to cross."
      - q: "What mostly sets how high the character can jump?"
        choices: ["Capsule Half Height", "Jump Z Velocity, together with the character's gravity scale", "Max Step Height", "Walkable Floor Angle"]
        answer_index: 1
        explain: "Jump Z is the upward launch speed. Gravity pulls it back down. Change either and every jump gap in your level changes too."
    flavors:
      _default: {why: "Every space, animation and system is built around these few numbers."}
      level_design: {why: "Step height, jump height and floor angle decide which ledges are paths and which are walls.", do: "Keep your measured values at the top of your metrics sheet and check every blockout against them."}
      gameplay_design: {why: "Walk speed and jump height set the pace of every mechanic you tune.", do: "Record the values you test with so your tuning notes can be reproduced."}
      programming: {why: "CharacterMovement is the component your gameplay code will read and change more than any other.", do: "Note which values you'd want exposed to designers, not hard-coded."}
      lookdev: {why: "Capsule and walk speed tell you how close the player gets to your surfaces and how fast they pass.", do: "Walk past your detail at Max Walk Speed and see what the player actually notices."}
      animation: {why: "Walk speed and jump height must match the animations or feet slide and jumps look wrong.", do: "Write down the speeds your walk and run cycles need to match."}

  - id: AQ2
    rank: 3
    difficulty: expert
    track: characters-anim
    subjects: [animbp, state-machine, blendspace]
    required_for_majors: [all]
    taster_for_majors: []
    adjacent_for: []
    required_spine: false
    elective: false
    title: Read an Animation Blueprint
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-blueprints-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 animation blueprint explained state machine blendspace ground speed"
    checklist:
      - "Find which AnimBP your character uses: select the Mesh component in the character Blueprint and check Anim Class."
      - "Open that AnimBP. In the Event Graph, find Event Blueprint Update Animation and follow how it reads the pawn's velocity into a speed variable."
      - "In the AnimGraph, open the locomotion state machine. List every state and click each transition to read its rule."
      - "Open the blendspace used for idle/walk/run. Move the preview point along the speed axis and watch the blend."
      - "PIE, then in the AnimBP pick your character in the debug object dropdown. Watch the speed variable and active state change as you run and jump."
    done_when: "Screenshot of the AnimBP in debug mode during PIE with the speed value visible, plus a list of the states and their transition rules."
    xp: 90
    verify_type: screenshot
    quiz:
      - q: "Where does an Animation Blueprint usually read the character's speed?"
        choices: ["In the Level Blueprint", "In the AnimGraph's Output Pose node", "In the Event Graph, on Event Blueprint Update Animation, from the pawn's velocity", "In the skeletal mesh asset"]
        answer_index: 2
        explain: "The Event Graph gathers data (velocity, falling) every update. The AnimGraph uses those variables to pick poses."
      - q: "What does a blendspace do?"
        choices: ["Blends between animations based on one or two input values, like speed", "Plays one animation once from Blueprint", "Retargets animation to a new skeleton", "Stores collision for the character"]
        answer_index: 0
        explain: "Feed it speed and it blends idle into walk into run. No hard switch between them."
      - q: "A state machine transition rule must return…"
        choices: ["A float", "An animation asset", "A montage", "A boolean: true means take the transition"]
        answer_index: 3
        explain: "Rules such as 'IsFalling' or 'Speed > 3' decide when to switch states."
      - q: "How do you see live AnimBP values while the game runs?"
        choices: ["Recompile during PIE", "Pick the running character in the AnimBP's debug object dropdown", "Press F8 twice", "Open the Output Log only"]
        answer_index: 1
        explain: "With a debug object selected, the graphs show the values and the active state as you play."
      - q: "Your character slides while playing the idle pose. The likely cause?"
        choices: ["The speed variable isn't updating, so the blendspace stays at idle", "Lumen is off", "The capsule is too big", "The level has no Player Start"]
        answer_index: 0
        explain: "If the AnimBP never gets the real speed, the pose never changes. Check the Event Graph and the debug values first."
    flavors:
      _default: {why: "You don't need to build an AnimBP to read one. Reading it tells you why a character moves the way it does."}
      level_design: {why: "When a character looks wrong in your space, you can tell whether it's your geometry or the AnimBP.", do: "Run a ramp and a drop in your level while watching the state machine in debug."}
      gameplay_design: {why: "Speed and state variables are where feel lives between input and animation.", do: "Note which AnimBP variable you'd hook a new mechanic into."}
      programming: {why: "Your movement code feeds this graph. The Event Graph is where the two meet.", do: "Trace one variable from the pawn to the AnimGraph and note where it's set."}
      lookdev: {why: "You'll frame and light characters. Knowing the states tells you which poses you'll actually see.", do: "List the states a player sees most often in a normal walk."}
      animation: {why: "This is your home graph. Read Epic's before you build your own.", do: "Sketch the state machine on paper before you move on to AQ7."}

  - id: AQ3
    rank: 3
    difficulty: expert
    track: characters-anim
    subjects: [montage, interaction, blueprint]
    required_for_majors: [all]
    taster_for_majors: []
    adjacent_for: []
    required_spine: false
    elective: false
    title: Montage on interact
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-montage-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 play montage blueprint interact lever"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-interface-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/enhanced-input-in-unreal-engine"
    checklist:
      - "Right-click any animation sequence on your character's skeleton → Create → Create AnimMontage. Name it AM_PullLever."
      - "Open the character's AnimBP. If the AnimGraph has no Slot 'DefaultSlot' node before Output Pose, add one."
      - "Build BP_Lever: a mesh, a Box collision, and an overlap check so it only works when the player is close."
      - "On interact (an Enhanced Input action or a key event), get the player character and call Play Montage with its Mesh and AM_PullLever."
      - "From Play Montage's On Completed pin, flip the lever and do one thing in the level (open a door, turn on a light)."
      - "PIE and pull the lever. Then pull it while running and note what happens."
    done_when: "Short PIE clip of the pull plus a screenshot of the lever graph."
    xp: 110
    verify_type: screenshot
    quiz:
      - q: "Play Montage fires but the character doesn't move. What do you check first?"
        choices: ["The lever's material", "The AnimBP has a Slot node for the montage's slot, and the montage uses the same skeleton", "Lumen settings", "The level's World Settings"]
        answer_index: 1
        explain: "A montage plays through a slot. No matching Slot node in the AnimGraph means nothing shows."
      - q: "Which Play Montage output should trigger 'lever done, open the door'?"
        choices: ["On Interrupted", "On Notify Begin", "On Completed", "The white exec pin straight away"]
        answer_index: 2
        explain: "On Completed fires when the montage finishes normally. The plain exec pin fires immediately, before the animation plays."
      - q: "Which component do you pass as the skeletal mesh to Play Montage?"
        choices: ["The character's Mesh", "The capsule", "The lever's Box collision", "The camera"]
        answer_index: 0
        explain: "Montages play on the Skeletal Mesh component, which runs the AnimBP."
      - q: "Why use a Blueprint Interface for 'Interact'?"
        choices: ["It's required for montages", "It runs faster than events", "It lets you skip collision", "The player can call Interact on any actor without casting to each type"]
        answer_index: 3
        explain: "Levers, doors and buttons each implement Interact their own way. The player just sends the message."
      - q: "What is a montage for, compared with a plain animation sequence?"
        choices: ["Nothing, they're the same", "Playing an animation from gameplay code or Blueprint, with slots, sections and notifies", "Only cinematics", "Only facial animation"]
        answer_index: 1
        explain: "Montages are the gameplay-triggered animation asset. Sequences are usually driven by the AnimBP."
    flavors:
      _default: {why: "A world that reacts with the player's body feels much more solid than one that just prints a message."}
      level_design: {why: "Levers, doors and valves are how you gate progress. A pull animation tells the player the action worked.", do: "Use the montage length as your gating time, and make sure the player can see the door open from the lever."}
      gameplay_design: {why: "Montage timing is part of an interaction's feel and cost.", do: "Note how long the player is committed to the pull and whether that should be tunable."}
      programming: {why: "Interfaces and async nodes like Play Montage are patterns you'll use everywhere.", do: "Note which Play Montage output pins you'd need handled in C++ later."}
      lookdev: {why: "Interactions are where players stop and look closely. Your lighting should support the moment.", do: "Light the lever so it reads before the player reaches it."}
      animation: {why: "Your animations reach gameplay through montages. This is the plumbing.", do: "Check the pull's blend in and blend out times. Rank 3 notifies build on this."}

