  - id: GDQ64
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [ai, mass, crowds, debugging]
    required_spine: false
    required: false
    title: "Mass Avoidance: tune and debug a crowd's steering"
    brief: "In a Mass crowd, avoidance is the steering logic that keeps each agent from walking into walls and into other agents. When it is tuned badly, the crowd gets stuck in narrow places such as a doorway. In this quest you send a crowd through a narrow gap, look at the avoidance data in two debug tools, change the avoidance settings, and compare the result."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/mass-avoidance-overview-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-mass-gameplay-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-mass-entity-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/visual-logger-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. You need a Mass crowd. If you have none, build it first: enable the MassEntity, MassGameplay and MassCrowd plugins and restart the editor, add a large floor with a NavMeshBoundsVolume, create a Mass Entity Config asset named DA_Crowd_Walker with traits for movement, avoidance and visualization (with a simple Static Mesh), and place a MassSpawner with DA_Crowd_Walker, a Count of 200 and an EQS SpawnPoints Generator under Spawn Data Generators."
      - "Build a corridor from two long wall meshes with a gap of about 300 units between them, so that the crowd must squeeze through."
      - "Open Tools > Debug > Visual Logger and select the MassSimulationSubsystem track. In Editor Preferences, under Visual Logger, enable Stick to Recent Data. In the console, run the command ai.debug.mass.SetDebugEntityRange for a few entities, and then use Simulate."
      - "Look at the categories LogAvoidance, LogAvoidanceVelocity and LogAvoidanceAgents. Find the obstacle edges and the predicted collisions near the gap."
      - "Press Play. Press the apostrophe key to open the Gameplay Debugger. Then press Shift+O for the Entity Overview and Shift+V for the avoidance view. Take a screenshot at the gap."
      - "In the avoidance trait of DA_Crowd_Walker, change the moving avoidance parameters, for example the separation settings. Use Simulate again and compare how the crowd flows through the gap. Note the value of stat fps before and after."
    done_when: "Send a writeup with two screenshots. The first shows the Visual Logger with LogAvoidanceAgents data near the gap. The second shows the avoidance view of the Gameplay Debugger (Shift+V). Add three sentences that say which parameter you changed, what changed in the crowd, and what the difference is between avoidance forces and separation forces, in your own words."
    xp: 60
    verify_type: writeup
    quiz:
      - q: "What kind of system is Mass Avoidance and what does it output?"
        choices: ["A NavMesh path planner that outputs a full path into FMassMoveTargetFragment", "A force-based system that writes a steering force into FMassForceFragment", "An animation system that outputs poses", "A collision system that outputs hit events"]
        answer_index: 1
        explain: "Mass Avoidance is force-based. The moving avoidance processor sums forces and outputs a steering force in the force fragment."
      - q: "What is the difference between avoidance forces and separation forces?"
        choices: ["Avoidance is random; separation is fixed", "Avoidance forces only push entities away from walls and other static obstacles; separation forces only push entities away from each other when they overlap", "They are the same force with two names", "Avoidance forces are predictive, computed from future impact positions; separation forces are perpendicular forces that keep a loose distance"]
        answer_index: 3
        explain: "Avoidance looks ahead to where impacts would happen. Separation just keeps a loose gap from the environment."
      - q: "Which collider shapes can other entities have?"
        choices: ["Capsule for humans or pill for vehicles", "Sphere or box", "Cylinder only", "Any static mesh with simple collision"]
        answer_index: 0
        explain: "Entities are colliders with a capsule shape (humans) or a pill shape (vehicles)."
      - q: "An entity is standing still in a crowd. Which processor handles its avoidance?"
        choices: ["UMassMovingAvoidanceProcessor", "UMassNavigationObstacleGridProcessor", "UMassStandingAvoidanceProcessor", "UMassZoneGraphLaneCacheBoundaryProcessor"]
        answer_index: 2
        explain: "The standing processor is the version used when entities are standing in place."
      - q: "Where are the Mass Avoidance settings stored, and where is the full description?"
        choices: ["In the NavMesh; see RecastNavMesh", "In Project Settings > AI System, under the Avoidance section; see the Mass Avoidance Overview page of the docs", "In the MassSpawner actor", "In FMassMovingAvoidanceParameters and FMassStandingAvoidanceParameters; see MassAvoidanceFragments.h"]
        answer_index: 3
        explain: "The settings live in the moving and standing avoidance parameter structs; MassAvoidanceFragments.h documents all of them."
      - q: "Which Visual Logger category shows obstacle edges, predicted collisions and the forces?"
        choices: ["LogAvoidance", "LogAvoidanceAgents", "LogAvoidanceVelocity", "LogNavigation"]
        answer_index: 1
        explain: "LogAvoidanceAgents shows edges, predicted collisions and forces. LogAvoidance shows initial and final steering force; LogAvoidanceVelocity shows current and desired velocity."
      - q: "In the Gameplay Debugger, which keys show avoidance for Mass entities?"
        choices: ["Apostrophe then Numpad 4 (Numpad 5 for the Entity Overview)", "F1 then Numpad 2", "Backtick then Shift+V (Shift+O for the Entity Overview)", "Tab then V"]
        answer_index: 2
        explain: "Press the backtick key to activate the debugger, then Shift+O for the Entity Overview or Shift+V for avoidance."
      - q: "In MassGameplay, which representation is the cheapest for a crowd entity?"
        choices: ["An Instanced Static Mesh", "A high resolution Actor", "A low resolution Actor", "No representation is not allowed"]
        answer_index: 0
        explain: "The Mass Representation subsystem offers high-res Actor, low-res Actor, Instanced Static Mesh or none. The ISM is the cheapest visible option."
    flavors:
      _default: {why: "A crowd that jams a doorway breaks the illusion. Avoidance parameters and the debug views are how you fix it."}
      gameplay_design: {why: "Crowd flow is pacing: a slow gap is a design choice or a bug, and you must know which.", do: "Describe one scene in your game where crowd flow matters and which parameter you would expose to the level designer."}

  - id: GDQ65
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [curve-table, progression, csv, tuning, data-driven]
    required_spine: false
    required: false
    title: "Curve Tables: progression by level"
    brief: "A Curve Table is an asset where each row is a curve: a value that changes as another number grows, for example damage that rises with the player level. You can ask the table for the value at any level, also between two levels, and Unreal calculates it. This lets you tune how values grow over levels without changing a graph. In this quest you make a Curve Table from a spreadsheet, read one curve in a Blueprint, and compare two ways of calculating the values between points."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/data-driven-gameplay-elements-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open any project, or create one from the Third Person template. Read the sections Data Curves, Curve Tables and Data Hookup of the Data Driven Gameplay Elements page that is linked on this quest."
      - "Make a table in a spreadsheet. The header of the first column is Name. The next headers are 0, 1, 2 and 3, which stand for the player level. Add the rows Melee_Damage, Melee_KnockBack and Melee_StunTime with values that grow with each level. Save the table as CT_Combat.csv."
      - "In the Content Browser, click Import and pick the CSV file. Choose Import As CurveTable and the interpolation Linear. Open CT_Combat and click the graph button to see all three curves."
      - "Make an Actor Blueprint named BP_Enemy, or open one of your own, and place it in the level. Add a Curve Table Row Handle variable named DamageCurve and make it Instance Editable. Set its CurveTable to CT_Combat and its RowName to Melee_Damage. Also add a Float variable named PlayerLevel."
      - "On Begin Play, evaluate the row with PlayerLevel and print the result. To find the evaluate node, search for Curve Table in the node menu. Test with PlayerLevel set to 1.5 and note the value."
      - "Reimport the CSV file with the interpolation Constant. Play again with level 1.5 and note the value. Write one sentence that says which mode you would use for damage and why."
      - "Change one value in the CSV file in a text editor. Right-click CT_Combat and choose Reimport. Confirm that the graph updates."
    done_when: "Send a screenshot of CT_Combat in graph view with three curves. Add the two values printed at level 1.5 (one with Linear and one with Constant) and your one sentence about which interpolation you chose."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "In a Curve Table CSV, what do the column headings after the first column store?"
        choices: ["The X-axis values of the curve", "The row names", "The asset paths of the curves", "The interpolation type"]
        answer_index: 0
        explain: "Each heading after Name is an X value. The data under it is the Y value for that row, so one row is one curve."
      - q: "What must the first column of a Data Curve or Curve Table be named?"
        choices: ["Key", "Name", "Id", "Row"]
        answer_index: 1
        explain: "The first column is expected to be named Name. It holds the names by which each row is accessed in game."
      - q: "A designer imports a curve with Constant interpolation. What happens between two X data points?"
        choices: ["Y is blended linearly", "Y is smoothed with a cubic blend of both", "Y clamps to the previous known X value", "Y becomes zero"]
        answer_index: 2
        explain: "Constant does not interpolate. Values clamp to the previous known value of X. Linear and Cubic blend between points."
      - q: "What data types can Data Curves store?"
        choices: ["Any UObject property", "Strings and float values", "Only integers", "Only floating point values"]
        answer_index: 3
        explain: "Data Curves work like Data Tables but only support floating point types."
      - q: "Which of these is NOT one of the Import As options when importing a CSV?"
        choices: ["Float Curve", "Vector Curve", "Linear Color Curve", "Material Curve"]
        answer_index: 3
        explain: "The options are DataTable, CurveTable, Float Curve, Vector Curve and Linear Color Curve. There is no Material Curve option."
      - q: "Where do you create a Curve Table by hand in the Content Browser?"
        choices: ["Under Blueprints", "Under Materials and Textures", "Under the Miscellaneous section", "Under Animation"]
        answer_index: 2
        explain: "The page says you can create Curve Tables in the Content Browser by navigating to the Miscellaneous section."
      - q: "Why should code not cache a curve or row from a table longer than the local function scope?"
        choices: ["Because tables are always garbage collected at the end of every single frame", "So that a reimport takes effect at once and no invalid pointers are used", "Because the data is compressed", "Because rows are copied on every access"]
        answer_index: 1
        explain: "If the table is refreshed by reimport, cached pointers could become invalid. Reading each time makes reimported data take effect immediately."
      - q: "A Curve Table Row Handle variable exposes which two fields to a content creator?"
        choices: ["CurveTable and RowName", "Table path and interpolation", "RowName and X value", "Category and Name"]
        answer_index: 0
        explain: "Both FDataTableRowHandle and FCurveTableRowHandle expose the table reference and the RowName of the row to read."
    flavors:
      _default: {why: "Curves let you tune how a value grows over levels without touching graphs."}
      gameplay_design: {why: "Progression feel lives in these numbers. A curve you can reimport is a curve you can iterate on.", do: "Add a fourth curve for enemy health and tune it until level 3 fights last about 10 seconds."}

  - id: GDQ66
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [data-registry, data-table, curve-table, data-driven, overrides]
    required_spine: false
    required: false
    title: "Data Registries: one lookup, many tables"
    brief: "A Data Registry is an asset that gives your game one place to look up data, even when that data comes from several Data Tables. The order of the sources matters: when two tables hold a row with the same name, the first source wins. This is a base for difficulty modes and special events, because a second table can replace only the rows that should change. In this quest you set up a registry with two tables and see how the order decides which value the game uses."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/data-registries-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/quick-start-guide-for-unreal-engine-data-registries"
    checklist:
      - "Open any project, or create one from the Third Person template. Read the Data Registries page that is linked on this quest. Enable the Data Registry plugin under Edit > Plugins in the Gameplay category, and restart the editor."
      - "Open Project Settings, go to Game, then Data Registry, and add /Game/DataRegistries to Directories to Scan. Create that folder in the Content Browser."
      - "Make the data that the registry will read, if you do not have it yet: a Structure named S_EnemyStats with the float variables Health, Speed and Damage, and a Data Table named DT_Enemies with this row type and the rows Grunt, Runner and Tank. In the DataRegistries folder, right-click, choose Miscellaneous, then DataRegistry, and name the asset DR_EnemyStats. Set Registry Type to EnemyStats. Set Item Struct to S_EnemyStats."
      - "Add a DataTable Source that points to DT_Enemies, the table with Grunt, Runner and Tank. Click Refresh and check that the Registry Preview tab shows the rows."
      - "Make a Data Table named DT_Enemies_Hard that has only the row Grunt, with a higher Health. Add it as a second DataTable Source and drag it ABOVE the first one. Click Refresh and look at Runtime Sources to see both Grunt entries and which one is first."
      - "Make an Actor Blueprint named BP_Enemy, or open one of your own, and place it in the level. Add a Data Registry Id variable. Pick EnemyStats and the row Grunt from the dropdown. On Begin Play, call Acquire Data Registry Item. In its callback, read the item from the cache with the Get Data Registry Item node, and print Health."
      - "Press Play and confirm that Grunt uses the Hard value. Then move DT_Enemies_Hard below DT_Enemies, click Refresh, play again, and confirm that Grunt uses the normal value."
    done_when: "Send two screenshots: one of DR_EnemyStats with the Runtime Sources list that shows Grunt from two sources, and one of the Play In Editor output that shows the Hard Health value for Grunt. Add one line that names what you changed to make the normal value win."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "What kind of data are Data Registries intended for?"
        choices: ["General read-only data", "A player's story progress", "A character's current state", "Per-session temporary values"]
        answer_index: 0
        explain: "Data Registries are for general read-only data. Session data like story progress belongs in the Save Game system."
      - q: "Two sources in a Data Registry both contain a row named Grunt. Which one does a lookup return?"
        choices: ["The one from the larger table", "The one in the source listed first", "The one in the source listed last", "Both, merged into one row"]
        answer_index: 1
        explain: "Source order matters. If an item is not found in one source, later sources are checked. The first instance discovered is the one accessible."
      - q: "How do Data Registries differ from Composite Data Tables?"
        choices: ["They can only hold one table", "They cannot be used from Blueprint graphs, only from C++ code", "They can also store curve data and use an indirection layer", "They must be built in C++"]
        answer_index: 2
        explain: "The page says registries are similar to Composite Data Tables but can store curve data and use an indirection layer instead of compositing tables by hand."
      - q: "What does a Meta Data Registry Source do?"
        choices: ["It points to exactly one Data Table that is set in the editor and never changes while the game runs", "It stores data in a web database", "It converts curves into rows", "It creates and owns other data sources at runtime by scanning paths or accepting registered assets"]
        answer_index: 3
        explain: "Meta sources use generic rules such as scanning user-named paths to find assets, and generate data sources dynamically at runtime."
      - q: "Two Data Registry Assets have the same Registry Type name. What happens?"
        choices: ["They merge automatically", "The editor refuses to save the second one", "Both work but lookups are slower", "Only one of them is recognized and populated"]
        answer_index: 3
        explain: "Each Data Registry Asset must have a unique name in the Registry Type field. With a duplicate, the system only recognizes one."
      - q: "In the Registry Preview a row appears twice. What does this mean?"
        choices: ["The registry is corrupted and must be created once more", "The row struct is wrong", "More than one source pulled it in; this is not an error", "The plugin needs a restart"]
        answer_index: 2
        explain: "Rows can appear multiple times if several sources pull them in. It usually means a meta source found the same data as another source."
      - q: "The return value of Acquire Data Registry Item is true. What does that tell you?"
        choices: ["The item is now in the cache", "The loading operation started; the result comes through the callback", "The item exists on disk", "The item was found in the first source and is returned to you right away"]
        answer_index: 1
        explain: "The return value says whether loading could begin, not the result. Only after the callback runs can you read the item from the cache."
      - q: "After editing a Data Registry, a dropdown in another asset still shows old rows. What should you do?"
        choices: ["Click Compile in the asset that references the registry", "Delete the registry and create it again with the same name", "Restart the computer", "Change the Registry Type name"]
        answer_index: 0
        explain: "Changes may not show at once in referencing assets. Click Compile in the referencing asset, not the registry, to refresh its lists."
    flavors:
      _default: {why: "One lookup that can be overridden by a second table is the base of difficulty modes, events and live tuning."}
      gameplay_design: {why: "You can layer a small override table on top of the base data instead of copying the whole table.", do: "Add a CurveTable Source to the same registry and note in one line why that is impossible with a plain Data Table."}

  - id: GDQ67
