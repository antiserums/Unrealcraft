      - q: "How does the HUD widget receive the dispatcher call?"
        choices: ["It uses Bind on the Percent field", "It binds a Custom Event to the character's Event Dispatcher after getting the character reference on Event Construct", "It reads the Health and Energy of the character on every tick and compares them with the values from the frame before", "It casts inside the dispatcher"]
        answer_index: 1
