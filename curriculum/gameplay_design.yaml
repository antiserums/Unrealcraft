  - id: GDQ33
    rank: 3
    difficulty: expert
    specializations: [gameplay_design]
    subjects: [ai, navigation, navmesh]
    required_spine: false
    required: false
    title: "Navigation for AI: NavMesh settings and modifiers"
    brief: "AI characters find their way with a NavMesh, short for navigation mesh. It is a map of the walkable floor that Unreal builds from the collision in your level. If an AI cannot reach a place, its behavior does not matter, so the NavMesh settings decide where enemies can go. In this quest you build a NavMesh, change it with modifier volumes and a link, and make it update while the game runs."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-how-to-modify-the-navigation-mesh-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/navigation-system-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/basic-navigation-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/modifying-the-navigation-mesh-preparation-guide-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Add a NavMeshBoundsVolume that covers the play area. Press P to see the NavMesh drawn in green. Select the actor RecastNavMesh-Default and enable Draw Poly Edges and Draw Tile Bounds."
      - "Make a Blueprint named BP_NPC_NavMesh, a copy of the character with no input. Add a custom event named MoveNPC that uses Get Random Reachable Point In Radius with a radius of 1000 and then AI Move To. Make it repeat with a Delay of 4."
      - "Place three Nav Modifier Volumes: one with the default Area Class (no NavMesh is built inside it), one with NavArea_Obstacle (a high cost area), and one with NavArea_Null. Use Simulate and watch how the NPC finds its way around each one."
      - "Add a raised platform. Place a Nav Link Proxy that goes from the edge of the platform to the floor, and set its Direction to Left to Right. Confirm that the NPC drops down from the platform."
      - "Open Project Settings, then Navigation Mesh, then Runtime Generation, and choose Dynamic Modifiers Only. Make a Blueprint named BP_RotatingActor with a Cube, a Rotating Movement component and a Nav Modifier component. Use Simulate and watch the NavMesh update in red tiles."
    done_when: "Send two screenshots. The first shows the level with the NavMesh visible (press P), the three modifier volumes and the Nav Link Proxy. The second shows Project Settings with Runtime Generation set to Dynamic Modifiers Only, and the rotating actor with its Nav Modifier component. Add one sentence that says which Area Class blocked the NPC fully and which one only made it avoid the area."
    xp: 85
    verify_type: screenshot
    quiz:
      - q: "What is the Navigation Mesh built from?"
        choices: ["The visible materials in the level, with one polygon for each walkable texture", "The Landscape heightmap only", "The player's camera view", "The collision geometry in the level, split into tiles and polygons with a cost"]
        answer_index: 3
        explain: "The system generates a NavMesh from collision geometry, divides it into tiles and then polygons. Each polygon has a cost, and Agents look for the lowest cost path."
      - q: "How do you quickly show the NavMesh in the editor viewport?"
        choices: ["Press the P key", "Press the apostrophe key", "Press Ctrl+N", "Run the command stat nav"]
        answer_index: 0
        explain: "The P key toggles the NavMesh display in the editor. In play, the console command show Navigation true or false does the same."
      - q: "You drop a Nav Modifier Volume into the level and change nothing. What happens inside it?"
        choices: ["Nothing changes", "The cost of every path through it is doubled", "No NavMesh is generated inside the volume", "Agents move faster inside it"]
        answer_index: 2
        explain: "By default, no NavMesh is generated inside a Nav Modifier Volume. You change this by choosing another Area Class such as NavArea_Obstacle."
      - q: "What is the difference between NavArea_Obstacle and NavArea_Null?"
        choices: ["Obstacle assigns a high cost, so agents avoid it unless there is no cheaper path; Null applies infinite cost and no NavMesh is generated", "Obstacle blocks agents completely and no NavMesh is generated; Null is only a visual marker in the editor and has no effect on paths at all", "They are identical", "Null is cheaper than Default"]
        answer_index: 0
        explain: "NavArea_Obstacle is a high cost area. Agents avoid it but can still cross it. NavArea_Null applies infinite cost, so no navigation data is generated and the agent cannot path through."
      - q: "What is a Nav Link Proxy for?"
        choices: ["Making the NavMesh higher in resolution in a small area, such as a narrow doorway", "Connecting two NavMesh areas that have no direct path, such as a jump or a drop", "Setting the walk speed of agents", "Hiding the NavMesh from players"]
        answer_index: 1
        explain: "Nav Link Proxies add extra connections between areas with no continuous path, for example to build a bridge or let an agent fall or jump from a platform."
      - q: "Which Direction options does a Nav Link Proxy point link offer?"
        choices: ["Up, Down, Sideways, Forward and Backward", "In, Out", "Forward only", "Both Ways, Left to Right, Right to Left"]
        answer_index: 3
        explain: "Under Point Links, Direction can be Both Ways, Left to Right or Right to Left. The guide uses Left to Right for a one-way drop."
      - q: "The green arrow on your Nav Link Proxy disappeared. What does that mean?"
        choices: ["The link is now active", "The level needs to be saved before the link can be used", "The link end points do not touch the NavMesh surface", "The agent is too big"]
        answer_index: 2
        explain: "The green arrow disappears if the Nav Link Proxy does not connect with the surface of the NavMesh. Also, links can only connect adjacent NavMesh tiles."
      - q: "Which Runtime Generation mode lets modifiers and links change the existing NavMesh at runtime but never builds new surfaces?"
        choices: ["Static", "Dynamic", "Dynamic Modifiers Only", "Offline"]
        answer_index: 2
        explain: "Dynamic Modifiers Only keeps the offline NavMesh and only lets Navigation Areas, Links and dynamic objects change cost or block areas. It can be up to 50 percent cheaper than full Dynamic."
      - q: "With Dynamic Modifiers Only, your rotating cube does not update the NavMesh. What is missing?"
        choices: ["A NavMeshBoundsVolume around the cube", "A Nav Link Proxy", "A Blackboard", "A Nav Modifier component on the actor"]
        answer_index: 3
        explain: "In this mode the NavMesh only updates for actors that have a NavModifier component. The guide adds a Nav Modifier component to BP_RotatingActor and the tiles then update."
      - q: "Which two avoidance methods does the Navigation System provide for agents?"
        choices: ["RVO and the Detour Crowd Manager", "EQS and Perception", "Static and Dynamic", "Smart Links and simple Nav Links"]
        answer_index: 0
        explain: "The system offers Reciprocal Velocity Obstacles (RVO) and the Detour Crowd Manager so agents can move around dynamic obstacles and other agents."
    flavors:
      _default: {why: "If an AI cannot get there, the behavior does not matter. NavMesh settings decide where enemies can go."}
      gameplay_design: {why: "Costs and links are design tools: make a path risky, force a detour, allow a drop.", do: "Use one NavArea_Obstacle to make the NPC take the long way past a trap, and explain the intent."}
      level_design: {why: "Nav problems are usually level geometry problems. Learn to read the green mesh.", do: "Fix one place where the NavMesh has a hole because of collision, and show before and after."}

