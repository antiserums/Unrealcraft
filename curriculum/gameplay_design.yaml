      - "Add an AI Sight config: Sight Radius 1500, Lose Sight Radius 2000, Peripheral Vision Half Angle 60, Detect Neutrals on. Add an AI Hearing config with Hearing Range 1200 and Detect Neutrals on."
      - "Bind On Target Perception Updated. Break the AIStimulus and use Successfully Sensed plus Actor Has Tag 'Player' to set Blackboard keys (or Print String the sensed actor and stimulus location)."
      - "On the player character, add an AIPerception Stimuli Source component, enable Auto Register as Source, and register for Sight and Hearing. Add the actor Tag 'Player'."
      - "In the player, on a key press call Report Noise Event with Loudness 1.0 at the player location."
      - "Play. Press the apostrophe key, then Numpad 4, to see the sight cone and hearing radius. Walk behind the enemy and press the noise key."
