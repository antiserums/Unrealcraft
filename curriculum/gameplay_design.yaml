    subjects: [data-assets, data-only-blueprint, inheritance, primary-asset-type, variants]
    required_spine: false
    required: false
    title: "Data Only Blueprints: variants by inheritance"
    brief: "A Data Only Blueprint is a Blueprint that has no graph logic and only holds default values. Because it is a Blueprint class, you can make child classes of it. A child takes over, or inherits, every value from its parent and changes only the values it needs. When you change a value in the parent later, every child gets the new value. In this quest you build weapon variants this way and compare them with a normal Data Asset."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/data-assets-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open any project, or create one from the Third Person template. Read the Data Assets page that is linked on this quest. Pay special attention to the notes on Data Only Blueprint Classes and Primary Data Asset types."
      - "Make a Blueprint Class named PDA_Weapon with the parent PrimaryDataAsset. Add the variables DisplayName (Text), Damage (Float), FireRate (Float) and Range (Float)."
      - "Make a child Blueprint Class named BP_Weapon_Rifle with the parent PDA_Weapon. Do not add any graph nodes, and only set values in Class Defaults. This is a Data Only Blueprint."
      - "Make a Blueprint named BP_Weapon_Rifle_Gold with the parent BP_Weapon_Rifle. Change only Damage, and leave the other values as they are inherited."
      - "Change FireRate in BP_Weapon_Rifle. Then open BP_Weapon_Rifle_Gold and confirm that it has the new FireRate, although you did not edit it."
      - "Now make a Data Asset instance. In the Content Browser, choose Miscellaneous, then Data Asset, pick the class PDA_Weapon, and name the asset DA_Weapon_Pistol. Change a default value in PDA_Weapon and note whether DA_Weapon_Pistol updates."
      - "Write 3 sentences that say when a Data Only Blueprint child is better than a Data Asset instance, and what PrimaryAssetType your Rifle variants have and why."
    done_when: "Send a screenshot of the Class Defaults of BP_Weapon_Rifle_Gold that shows the inherited FireRate and the changed Damage. Add your 3 sentences."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Epic recommends which approach when you need data inheritance or a more complex hierarchy?"
        choices: ["Data Only Blueprint Classes", "Many Data Asset instances", "A Data Table per variant", "Structs inside a Game Instance"]
        answer_index: 0
        explain: "The page says: if you want data inheritance or a more complex hierarchy, create Data Only Blueprint Classes."
      - q: "What does inheriting from Primary Data Asset add compared to a plain Data Asset?"
        choices: ["Automatic replication of every property to all clients in a network game", "A Primary Asset Id and asset bundle support for manual load and unload", "A visual graph", "Faster loading"]
        answer_index: 1
        explain: "A Primary Data Asset implements a Primary Asset Id and has asset bundle support, so the Asset Manager can load and unload it by hand."
      - q: "Hierarchy: UPrimaryDataAsset > ParentBlueprintClass > DataOnlyBlueprintClass. What is the PrimaryAssetType?"
        choices: ["DataOnlyBlueprintClass", "PrimaryDataAsset", "ParentBlueprintClass", "None"]
        answer_index: 2
        explain: "The type is the first native class going up, or the highest-level Blueprint class. Here that is ParentBlueprintClass."
      - q: "Hierarchy: UPrimaryDataAsset > UParentNativeClass > UChildNativeClass > DataOnlyBlueprintClass. What is the PrimaryAssetType?"
        choices: ["ParentNativeClass", "DataOnlyBlueprintClass", "PrimaryDataAsset", "ChildNativeClass"]
        answer_index: 3
        explain: "The first native class going up the hierarchy is UChildNativeClass, so the type is ChildNativeClass."
      - q: "How can a programmer change which PrimaryAssetType a class reports?"
        choices: ["Rename the asset", "Move it to another folder", "Set it in the World Settings of each level that uses the asset", "Override the GetPrimaryAssetId function in the native class"]
        answer_index: 3
        explain: "To change this behavior you override GetPrimaryAssetId in your native class, or copy the functions into another native base class."
      - q: "Where do you create an instance of a Data Asset class in the editor?"
        choices: ["Tools > New C++ Class > Data Asset, then compile the project", "Window > Data Assets", "Content Browser right-click > Miscellaneous > Data Asset", "Edit > Project Settings > Game"]
        answer_index: 2
        explain: "Right-click in the Content Browser, then Miscellaneous > Data Asset, and pick the class."
      - q: "When does Epic recommend using the Asset Manager instead of automatic loading?"
        choices: ["Always, for every asset", "When you need precise control over when assets are discovered, loaded and audited", "Only for textures", "Only in packaged builds, where automatic loading of assets is turned off by default"]
        answer_index: 1
        explain: "The engine loads assets automatically, but for precise control over discovery, loading and auditing the page recommends the Asset Manager."
      - q: "Why does the page prefer Data Only Blueprint children over Data Asset instances inside a Blueprint hierarchy?"
        choices: ["To handle data inheritance and update the parent class", "Data Asset instances cannot be saved in a content folder", "Instances cannot hold floats", "Blueprint children load faster"]
        answer_index: 0
        explain: "With Blueprint subclasses, Data Only Blueprints handle data inheritance and let you update the parent class so children follow."
    flavors:
      _default: {why: "Variants that inherit from a base save hours when a base value changes."}
      gameplay_design: {why: "A weapon family with 10 variants should change in one place, not ten.", do: "Add a third level (Rifle > Rifle_Gold > Rifle_Gold_Event) and check that a change at the top flows down two levels."}

  - id: GDQ69
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [config-files, ini, config-variable, tuning, platform-overrides]
    required_spine: false
    required: false
    title: "Tuning defaults from config files"
    brief: "A config file is a text file with the ending .ini in the Config folder of your project. Unreal reads these files when it starts, and a variable that is marked as a Config Variable takes its default value from them. This lets you change a default for the whole project, or for one platform such as Windows, without opening a Blueprint. In this quest you mark two variables as config variables, set them in a file, and see how a platform file replaces the project value."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/configuration-files-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-variables-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Read the Configuration Files page that is linked on this quest, and look at the parts Syntax, Arrays and Hierarchy."
      - "Make an Actor Blueprint named BP_Tuning in /Game/Blueprints. Add a Float variable EnemyDamageMult with the default 1.0 and an Integer variable StartingLives with the default 3. For each one, expand the advanced variable properties and enable Config Variable."
      - "Close the editor. Open the file Config/DefaultEngine.ini of your project and add a section named [/Game/Blueprints/BP_Tuning.BP_Tuning_C] with the lines EnemyDamageMult=1.5 and StartingLives=5. Add a comment line that starts with ; and explains the values. (Actors read the Engine category.)"
      - "Start the editor and place BP_Tuning in the level. Print both values on Begin Play and confirm that the values from the config file are used."
      - "Add a String array variable named BannedWeapons with Config Variable on. In the same section, write these three lines: +BannedWeapons=Rocket, +BannedWeapons=Rocket and .BannedWeapons=Rocket. Print the length of the array, and compare the result with the array example on the page."
      - "Make a file named Config/Windows/WindowsEngine.ini with the same section and the line EnemyDamageMult=2.0. Restart the editor and confirm that the platform file wins over DefaultEngine.ini."
      - "Write 2 sentences that answer this: when would you put a tuning value in a config file and not in a Data Table?"
    done_when: "Send a screenshot of your section in DefaultEngine.ini and a screenshot of the Play In Editor output that shows the config values and the array length. Add your 2 sentences."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which config file section heading targets a Blueprint asset?"
        choices: ["[/PathToUAsset/UAssetName.UAssetName_C]", "[/Script/ProjectName.BlueprintName_C]", "[BP_Tuning]", "[/Game/BP_Tuning]"]
        answer_index: 0
        explain: "Configurable Blueprint assets use [/PathToUAsset/UAssetName.UAssetName_C]. The /Script/ form is for native modules and plugins."
      - q: "The same key is set in Engine/Config/BaseEngine.ini and in <PROJECT>/Config/DefaultEngine.ini. Which value is used?"
        choices: ["BaseEngine.ini, because files in the engine folder always win over project files", "DefaultEngine.ini, because later files in the hierarchy override earlier ones", "Neither; it is an error", "The larger value"]
        answer_index: 1
        explain: "Within a category, key-value pairs in later files override earlier ones. The project Default file loads after the engine Base file."
      - q: "How do you write a comment in a config file?"
        choices: ["Start the line with //", "Start the line with #", "Start the line with ;", "Wrap it in /* */"]
        answer_index: 2
        explain: "Prepend a semicolon to any line to make it a comment. This also works to comment out key-value pairs."
      - q: "What does +MyArray=Value do if Value is already in the array?"
        choices: ["Adds a duplicate", "Removes it", "Clears the array", "Nothing"]
        answer_index: 3
        explain: "+ appends only if the value does not exist yet. Use . to append a duplicate, - to remove and ! to clear."
      - q: "After these lines, what does MyConfigArray contain? MyConfigArray=7 / !MyConfigArray=ClearArray / +MyConfigArray=2 / +MyConfigArray=3 / +MyConfigArray=4 / .MyConfigArray=2 / -MyConfigArray=4"
        choices: ["[7,2,3,4,2]", "[2,3,4]", "[7,2,3]", "[2,3,2]"]
        answer_index: 3
        explain: "The array is cleared, 2, 3 and 4 are appended, a duplicate 2 is added, and 4 is removed. The result is [2,3,2]."
      - q: "Where do you put a config value that must apply to one platform only, for your project?"
        choices: ["Engine/Config/Base.ini", "<PROJECT>/Config/Default<CATEGORY>.ini", "<PROJECT>/Config/<PLATFORM>/<PLATFORM><CATEGORY>.ini", "Any file, with a platform= prefix in front of each key"]
        answer_index: 2
        explain: "Files in <PLATFORM> directories apply only to that platform, and project files apply only to that project."
      - q: "What does the Config Variable option on a Blueprint variable do?"
        choices: ["Saves the variable in every save game slot of the player", "Reads its default value from a config file if present", "Hides it from Class Defaults", "Makes it replicate"]
        answer_index: 1
        explain: "Config Variable reads the default from a config file if present, to customize defaults between projects and configurations. SaveGame is the option for save files."
      - q: "What is the correct syntax to set a struct property in a config file?"
        choices: ["MyStruct=(A=1,B=2)", "MyStruct.A=1", "MyStruct={A:1,B:2}", "[MyStruct] A=1"]
        answer_index: 0
        explain: "Structs are set on one line as MyStruct=(MyStructProperty1=Value1,MyStructProperty2=Value2,...)."
    flavors:
      _default: {why: "Config files let you change defaults per project and per platform without opening a Blueprint."}
      gameplay_design: {why: "A per-platform difficulty or lives value in a text file is easy to review and easy to diff.", do: "Put a second section for a BP_Tuning_Hard child class and note which values a child needs to repeat."}

  - id: GDQ70
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [save-game, slots, profile, async, persistence]
    required_spine: false
    required: false
    title: "Two save files: profile and run"
    brief: "A game often needs more than one save file. Profile data, such as the total kills and the unlocked levels, should stay for all time. Run data, such as the last checkpoint and the current health, belongs to one playthrough. When you keep them in two files, starting a New Game can delete the run without removing what the player has earned. In this quest you make two SaveGame classes, save them to two slots, and check that a New Game only clears the run."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/saving-and-loading-your-game-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/SaveGame/AsyncSaveGametoSlot"
    checklist:
      - "Open a project made from the Third Person template, or create one. Read the Blueprint tab of the page Saving and Loading Your Game that is linked on this quest."
      - "Make BP_ProfileSave with the parent SaveGame and the variables Difficulty (Name), TotalKills (Integer) and UnlockedLevels (Name array). Make BP_RunSave with the parent SaveGame and the variables Checkpoint (Name), Health (Float) and Inventory (Name array). Give each class a default slot name: Profile and Run."
      - "Make a Blueprint named BP_SaveGameInstance from the Game Instance class and set it as the Game Instance class in Project Settings, under Maps and Modes. In it, keep a profile object and a run object, and add an event named AddKill that adds 1 to TotalKills in the profile object and calls Async Save Game To Slot. From the Completed pin, print the Success value. To stand in for a kill, add a key press on the character that calls AddKill."
      - "Add a second key press that stands in for reaching a checkpoint. When it is pressed, fill BP_RunSave and save it with Save Game To Slot, the synchronous node that makes the game wait until the save is done. Write 1 sentence that says why a synchronous save is acceptable here or why it is not."
      - "Add a third key press for New Game. It calls Delete Game in Slot for the Run slot only. Use Does Save Game Exist to confirm that the profile file is still there."
      - "On Begin Play, call Async Load Game From Slot for both slots. Cast each result and print Difficulty, TotalKills and Checkpoint. Use the Success pin to handle a missing Run file without an error."
      - "Play: get 3 kills, reach a checkpoint, start a new game, then quit and play again. Look in the Saved/SaveGames folder and confirm that both .sav files are there."
    done_when: "Send a screenshot of Saved/SaveGames with Profile.sav and Run.sav. Also send a Play In Editor screenshot taken after New Game that shows TotalKills kept from the profile while Checkpoint was reset. Add your one sentence about synchronous saving."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Why does the save system support saving different SaveGame classes to different files?"
        choices: ["To separate globally-unlocked features from playthrough-specific data", "To make files smaller", "Because one SaveGame class cannot hold arrays or more than ten variables", "To avoid casting"]
        answer_index: 0
        explain: "The page says multiple files and classes are useful for separating globally-unlocked features from playthrough-specific game data."
      - q: "Why is Async Save Game To Slot the recommended way to save?"
        choices: ["It compresses the file", "It avoids a sudden framerate hitch and a possible certification issue on some platforms", "It works without a slot name and without a user index, so it cannot overwrite a file", "It saves to memory only"]
        answer_index: 1
        explain: "Running asynchronously prevents a hitch that players notice, and avoids a possible certification issue on some platforms."
      - q: "When is the synchronous Save Game To Slot node acceptable?"
        choices: ["Never in a shipping game", "Only on consoles", "When the data is small or you save from a menu or pause screen", "Only when the player is moving and no menu is open on screen"]
        answer_index: 2
        explain: "Save Game To Slot is fine for small data, or when saving while paused or in a menu. Auto-saving during play should use the async node."
      - q: "On Async Load Game From Slot, when are the output pins valid?"
        choices: ["Immediately from the first execution pin", "After a one second delay", "After you call Is Valid", "Only after the second execution pin fires"]
        answer_index: 3
        explain: "The first pin executes when the operation begins. Variable outputs are only valid once the second (completed) pin executes."
      - q: "Load Game From Slot returns an object of which type?"
        choices: ["Your custom SaveGame class, with no cast needed at all", "A Game Instance", "A Data Asset", "A base SaveGame object that you cast to your class"]
        answer_index: 3
        explain: "The engine returns the data as a base SaveGame object. You cast it back to your custom class to read the fields."
      - q: "Where do saved game files appear on development platforms?"
        choices: ["Content/Saves", "Config/SaveGames", "Saved/SaveGames with the .sav extension", "The Documents folder of the user, as .json"]
        answer_index: 2
        explain: "On development platforms .sav files appear in the project's Saved/SaveGames folder. On consoles this varies."
      - q: "What warning does the Async Save Game to Slot node page give?"
        choices: ["It cannot be used in Blueprint", "Some platforms may not support loading and saving at the same time", "It overwrites every slot that shares the same User Index on all platforms", "It requires User Index 1"]
        answer_index: 1
        explain: "The node page says some platforms may not support trying to load and save at the same time."
      - q: "What does the User Index input identify?"
        choices: ["The platform user doing the saving, ignored on some platforms", "The version of the save file, which is used to reject older saves", "The number of slots", "The checkpoint index"]
        answer_index: 0
        explain: "User Index is the platform user index that identifies the user saving. Some platforms ignore it."
    flavors:
      _default: {why: "Splitting profile data from run data stops a New Game from erasing what the player earned."}
      gameplay_design: {why: "Meta-progression and per-run state have different lifetimes. Two files make that rule visible.", do: "Add a SaveVersion integer to both classes and print a warning when a loaded version is older than the current one."}

  - id: GDQ71
