  - id: GDQ45
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [blueprint, splines, timelines, moving-platforms, movement-components]
    required_spine: false
    required: false
    title: "Moving platforms on a spline"
    brief: "A spline is a curved path that you draw with a few points in the level. A Timeline is a Blueprint node that changes a value smoothly over time. Together they let you move a platform along any path, and a moving platform is a timing puzzle for the player. In this quest you build a platform that travels back and forth on a spline, add a spinning hazard, and tune the timing."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-spline-components-overview-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Spline/GetLocationatDistanceAlongSpline"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Spline/GetSplineLength"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/timelines-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/movement-components-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Read the Blueprint Spline Components Overview that is linked on this quest. The nodes you need are Get Location at Distance Along Spline and Get Spline Length."
      - "Make a Blueprint named BP_SplinePlatform from Actor. Add a Spline component as the root and a Static Mesh component for the platform. Place it in the level and drag out the spline points to draw a path with 3 or more points."
      - "Add a Timeline named TL_Move with one float track named Alpha that goes from 0 to 1 over 4 seconds. Play it from Event BeginPlay. Do not set it to loop, because you will send it back and forth with the Finished pin."
      - "From the Update pin, multiply Alpha by Get Spline Length. Put the result into Get Location at Distance Along Spline with Coordinate Space set to World. Use the location it returns in Set World Location on the Static Mesh."
      - "Add a float variable named TravelTime and make it Instance Editable. Use Set Play Rate on the Timeline so that TravelTime changes the speed. From the Finished pin, add a FlipFlop node that calls Reverse from End for the way back and Play from Start for the way forward."
      - "Make a second actor named BP_SpinHazard with a Static Mesh and a Rotating Movement component. Set Rotation Rate so that it spins once every 2 seconds."
      - "Place two platforms and one spinner in a gap that the player must cross. Tune TravelTime until the player can read the jump timing but it is still not too easy."
    done_when: "Send a screenshot of the BP_SplinePlatform graph that shows the Timeline, Get Spline Length and Get Location at Distance Along Spline. Also send a screenshot of the level that shows the spline path and the spinner."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "What is a Blueprint Spline Component at its core?"
        choices: ["A path to define and use positional data", "A mesh that bends", "A rail that only cameras can move along", "A navigation mesh"]
        answer_index: 0
        explain: "The overview says a Spline Component is just a path for you to define and use positional data, for moving or placing actors and components."
      - q: "What is the key difference of a Spline Mesh Component?"
        choices: ["It has unlimited points", "It only works in C++", "It cannot be edited in Blueprints at all, and its points can only be moved in the Level Editor", "It deforms a single Static Mesh along a two-point spline and cannot get more Spline Points"]
        answer_index: 3
        explain: "The overview says a Spline Mesh Component deforms one Static Mesh along a two-point spline; you cannot add more points to it."
      - q: "Where can a Spline Component be edited?"
        choices: ["Only in the Level Editor", "In the Blueprint Viewport, in the Level Editor, and through the Construction Script", "Only in the Blueprint Viewport, because spline points are locked once the actor is placed", "Only in Sequencer"]
        answer_index: 1
        explain: "The overview says splines are fully editable in the Blueprint Viewport and Level Editor, and also editable with the Construction Script."
      - q: "Get Location at Distance Along Spline needs which inputs besides the Target?"
        choices: ["Time and Play Rate", "Point Index only", "Distance and Coordinate Space", "Alpha and Length of the Spline"]
        answer_index: 2
        explain: "The node page lists Distance (real) and Coordinate Space (enum) as inputs, returning a vector location."
      - q: "What does Get Spline Length return?"
        choices: ["The number of spline points", "The distance to the player", "The length of the first segment only", "The total length along the spline"]
        answer_index: 3
        explain: "The node page says it returns the total length along this spline. Multiply by an Alpha of 0..1 to get a distance."
      - q: "Your platform should go back the same way at the end. Which Timeline input plays it backwards from the end?"
        choices: ["Play from Start", "Reverse from End", "Set New Time", "Stop"]
        answer_index: 1
        explain: "The Timelines page lists Reverse from End: plays the Timeline backwards starting from the end."
      - q: "You call Stop on a Timeline. Does the Finished pin fire?"
        choices: ["No, Finished is not triggered by Stop", "Yes, always", "Only if the Timeline is set to looping", "Only in Standalone"]
        answer_index: 0
        explain: "The Timelines page says Finished fires when playback ends and is not triggered by the Stop function."
      - q: "What is important to know about the Rotating Movement Component?"
        choices: ["It performs collision testing on every frame, so the rotating component stops when it touches another object", "It only rotates Characters", "It rotates a component continuously at a rotation rate, and collision testing is not performed during movement", "It needs a Timeline to work"]
        answer_index: 2
        explain: "The Movement Components page says it rotates continuously at a rate, optionally around a pivot, and collision testing is not performed during movement."
    flavors:
      _default: {why: "Moving platforms are timing puzzles. The path and the speed are your design tools."}
      gameplay_design: {why: "A spline lets you design the path in the level, not in numbers. This makes iteration fast.", do: "Make one platform path that curves around a pillar so the player cannot see the landing spot until mid-jump, then decide if that is fair."}

  - id: GDQ46
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [blueprint, physics, impulse, knockback, game-feel]
    required_spine: false
    required: false
    title: "Knockback and explosions with impulses"
    brief: "An impulse is one sudden push on a physics object, and a force is a push that continues over time. Unreal has nodes for both, and a radial impulse pushes everything away from one point, like an explosion. These pushes give weight to your world. In this quest you push cubes with impulses and forces, build a bomb, and knock the player back."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Physics/AddImpulse"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Physics/AddRadialImpulse"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Physics/AddForce"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Character/LaunchCharacter"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/movement-components-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Read the node page for Add Impulse that is linked on this quest, and look up Add Radial Impulse, Add Force and Launch Character in the same Blueprint API reference."
      - "Place 10 cubes with Simulate Physics turned on. Make a Blueprint named BP_PushHit from Actor with a Box Collision. When it overlaps a physics component, call Add Impulse on that component in the forward direction of the actor. Test with Vel Change on and off, using cubes of different Mass."
      - "Make a Blueprint named BP_Bomb from Actor with a Sphere mesh. On a key press, or after a Delay of 2 seconds, use a Sphere Overlap Actors node to collect all physics components inside Radius. Call Add Radial Impulse on each one, with Origin set to the location of the bomb."
      - "Make the floats Radius and Strength and a Falloff choice Instance Editable. Test Falloff set to Constant and then to Linear, and write one line about the difference you see."
      - "Add a fan actor named BP_Fan with a Box Collision. On every tick while a physics component overlaps the box, call Add Force with a modest force. Compare the result with Add Impulse."
      - "Add knockback for the player. When BP_Bomb explodes and the player Character is inside Radius, call Launch Character away from the bomb. For the direction, take the player location minus the bomb location, normalize it, multiply it by 800, and use 300 for Z."
      - "Tune Strength and Radius so that the explosion looks strong but the cubes do not fly out of the level."
    done_when: "Send a screenshot of the BP_Bomb graph that shows Add Radial Impulse and the Launch Character branch for the player. Also send a screenshot taken during play at the moment of the explosion."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "According to the docs, what is Add Impulse good for?"
        choices: ["A continuous push every frame", "Moving Characters", "A one time instant burst", "Rotating a mesh slowly"]
        answer_index: 2
        explain: "The Add Impulse page says: add an impulse to a single rigid body, good for one time instant burst."
      - q: "What does Vel Change = true do on Add Impulse?"
        choices: ["Doubles the impulse", "Treats the value as a change in velocity, so mass has no effect", "Applies the impulse to all bones of the mesh, not only to one", "Ignores the direction"]
        answer_index: 1
        explain: "The page says with Vel Change true the strength is taken as a change in velocity instead of an impulse, so mass will have no effect."
      - q: "On Add Impulse, what does Bone Name = None mean for a Skeletal Mesh?"
        choices: ["No impulse is applied", "The impulse goes to every bone", "The node errors", "The impulse goes to the root body"]
        answer_index: 3
        explain: "The page says 'None' indicates the root body when the target is a SkeletalMeshComponent."
      - q: "How does the docs describe Add Force, compared with Add Impulse?"
        choices: ["Like a thruster: a burst over some non-zero time, called every frame for the duration", "Like a bullet: one instant hit that is applied a single time and never called again", "Like gravity: applied once at spawn", "Like a teleport"]
        answer_index: 0
        explain: "The Add Force page says it is like a 'thruster', good for a burst over some time, and should be called every frame for the duration."
      - q: "On Add Radial Impulse, what happens to bodies farther than Radius from the Origin?"
        choices: ["They get the full Strength", "They are not affected", "They get half Strength", "They are destroyed"]
        answer_index: 1
        explain: "The page says beyond the Radius distance from Origin there will be no effect."
      - q: "What does the Falloff input on Add Radial Impulse control?"
        choices: ["The strength of the impulse as a function of distance from Origin", "The sound volume", "How long the impulse lasts", "Which collision channel is used to find the components to push"]
        answer_index: 0
        explain: "The page says Falloff lets you control the strength of the impulse as a function of distance from the Origin."
      - q: "Why does Add Impulse not push a Character the way it pushes a cube?"
        choices: ["Characters have no collision", "Impulses only work on Static Meshes, and a Character uses a Skeletal Mesh instead", "The Character Movement Component moves avatars that do not use rigid body physics", "Characters are always too heavy"]
        answer_index: 2
        explain: "The Movement Components page says the Character Movement Component moves avatars not using rigid body physics. Use Launch Character for knockback on Characters."
      - q: "What is the Target type of Add Impulse and Add Radial Impulse?"
        choices: ["Actor", "Character Movement", "Game Mode", "Primitive Component"]
        answer_index: 3
        explain: "Both pages say Target is Primitive Component. You need the physics component, not the actor."
    flavors:
      _default: {why: "Impulses give weight to your world. Feel comes from mass, direction and falloff, not from animation alone."}
      gameplay_design: {why: "Explosions and pushes are feedback. Tuning them teaches you how physics numbers map to feel.", do: "Make the bomb Strength a Data Table row and tune three bomb sizes without touching the graph."}

  - id: GDQ47
    rank: 2
    difficulty: adept
