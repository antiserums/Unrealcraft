    title: "State Tree: states, tasks, transitions"
    time_min: 120
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/statetree-quick-start-guide"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/state-tree-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-state-tree-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/external-statetree-quickstart-guide"
    checklist:
      - "In a First Person project, enable the GameplayStateTree and StateTree plugins and restart the editor."
      - "Create a StateTree ST_ShootingTarget with the StateTreeComponentSchema. Create BP_ShootingTarget (Actor) with a Static Mesh, a StateTree component set to ST_ShootingTarget, an integer HitCount that increases On Component Hit, and a DelayedDestroy custom event."
      - "In ST_ShootingTarget set Context Actor Class to BP_ShootingTarget. Add states Idle and Dead. On Idle add a transition On Tick to Dead with an Integer Compare condition: Actor > Hit Count greater or equal 5."
      - "Create STT_Destroy (parent StateTreeTaskBlueprintBase) with an Actor variable in category Context. Override ExitState and call DelayedDestroy. In Dead add Debug Text, Delay 2.0 and STT_Destroy; transition On State Completed to Tree Succeeded."
      - "Create BP_SplineActor with a Spline. Create the evaluator STE_GetSpline (TreeStart, Find Nearest Actor, output variable SplineActor in category Output) and the task STT_MoveAlongSpline (Tick, Set Actor Location along the spline, Finish Task at the end)."
      - "Add a child state MoveAlongSpline under Idle, add STT_MoveAlongSpline and bind Spline Actor to the evaluator output. Place both actors, close the spline loop, play and shoot the target."
    done_when: "Two screenshots: (1) ST_ShootingTarget showing the state list with Idle, MoveAlongSpline and Dead and the Idle transitions; (2) the target destroyed in play (debug text visible). Add two sentences: one thing State Tree does differently from a Behavior Tree, in your words."
    xp: 180
    verify_type: screenshot
    quiz:
      - q: "What is a State Tree, in one sentence from the docs?"
        choices: ["A replacement for the Blackboard", "A graph that only animates characters", "A hierarchical state machine that combines behavior tree selectors with states and transitions", "A list of Gameplay Tags"]
        answer_index: 2
        explain: "StateTree is a general-purpose hierarchical state machine. It takes Selectors from behavior trees and States and Transitions from state machines."
      - q: "A State has three Tasks. How do they run when the State is active?"
        choices: ["One after another, top to bottom", "Concurrently, and the first Task that completes triggers a transition", "Only the first Task runs", "Randomly, one per tick"]
        answer_index: 1
        explain: "All Tasks in a State run concurrently while the State is active. The first Task that completes triggers a Transition, which can select a new State."
      - q: "When a leaf State is selected, which States are active?"
        choices: ["Only the leaf State", "All States in the tree", "Only the root", "The leaf State and all its parent States up to the root"]
        answer_index: 3
        explain: "Selecting a State activates all States from the root down to the leaf. Tasks of all those active States run, starting from the root."
      - q: "How does State Tree selection differ from a behavior tree, per the overview?"
        choices: ["State Tree scans the tree every tick; behavior trees do not", "State Tree runs selection on demand when a Transition triggers; behavior trees keep running selection logic", "There is no difference", "State Tree cannot have child States"]
        answer_index: 1
        explain: "Behavior trees keep executing selection logic even when a State is selected. State Tree runs selection only when a Transition fires, starting at the target State."
      - q: "In which order are Transitions evaluated?"
        choices: ["From the root down to the leaf", "All at once, highest priority number wins", "From the leaf State upward toward the root; the first that succeeds wins", "Only on the root State"]
        answer_index: 2
        explain: "Transitions are evaluated from the leaf State upward. The first Transition that succeeds and leads to a State selection is taken. This lets parents group common Transitions."
      - q: "A parent State's Enter Conditions pass, but none of its child States can be selected. What happens?"
        choices: ["The parent State is selected anyway", "The parent State is not selected", "The tree stops with an error", "The first child is forced to run"]
        answer_index: 1
        explain: "If a State has child States and none can be selected, the State is not selected even though its own Enter Conditions passed."
      - q: "Which data source lets you expose data such as a nearest spline actor to the whole tree with custom logic on TreeStart?"
        choices: ["An Evaluator", "A Gameplay Tag", "A Blackboard key", "A Level Blueprint variable"]
        answer_index: 0
        explain: "Evaluators expose data that Parameters or Context Data cannot. They run when the tree starts, stops and on tick. The quick start uses STE_GetSpline with a TreeStart override."
      - q: "In a Blueprint Task, you create an Actor variable and set its Category to 'Context'. Why?"
        choices: ["It makes the variable private", "It saves the variable to disk", "It hides the variable from the tree", "It auto-binds the variable to the Context Actor of the State Tree"]
        answer_index: 3
        explain: "The Context category binds the variable to the Context Actor in the StateTree. The Output category exposes a value for other nodes to bind to."
      - q: "Your ST_ShootingTarget does not appear in the StateTree component dropdown. What is the likely cause?"
        choices: ["The tree has too many States", "The plugin cannot be used in Blueprint projects", "The tree was created with the wrong schema; it must use StateTreeComponentSchema", "The actor has no Static Mesh"]
        answer_index: 2
        explain: "The quick start notes that if the State Tree does not appear in the dropdown, the wrong schema was selected. The component needs StateTreeComponentSchema."
      - q: "Which Transition setup makes a State run again after it finishes, as in the quick start's Idle State?"
        choices: ["Trigger On State Completed, Transition To Root", "Trigger On Tick, Transition To Tree Succeeded", "Trigger On Event with no tag", "No transition at all"]
        answer_index: 0
        explain: "Idle uses Trigger On State Completed with Transition To Root, so once the State completes the tree returns to the root and selects again. Tree Succeeded ends the tree."
    flavors:
      _default: {why: "State Tree is Epic's newer way to write AI and object logic; Mass and Smart Objects use it too."}
      gameplay_design: {why: "States and transitions map closely to how designers talk about behavior: idle, alert, attack, dead.", do: "Add a third State Hit Reaction with a Delay task and an On Event transition using a Gameplay Tag."}
      animation: {why: "State Trees drive contextual animation for crowds and characters.", do: "In the Dead state, play a montage before the delay and note where the Task would live."}

