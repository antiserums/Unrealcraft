        answer_index: 0
        explain: "Calling the Custom Events once after binding initializes the display; otherwise the bar shows nothing until the first change."
      - q: "On a Widget Component, what is the difference between Space = World and Space = Screen?"
        choices: ["World draws the widget in 2D on top of the screen and it is never occluded; Screen renders it as a mesh that can be occluded", "There is no difference", "Screen only works in the editor", "World renders the widget as a mesh in the world and it can be occluded; Screen draws it on the screen and it is never occluded"]
        answer_index: 3
        explain: "The Widget Component page: World renders the widget as a mesh that can be occluded; Screen renders it outside the world and it is never occluded."
      - q: "A Widget Component has Redraw Time set to 1. What does this mean?"
        choices: ["It redraws every frame", "It never redraws", "It redraws once per second", "It redraws only when clicked"]
        answer_index: 2
        explain: "Redraw Time is the time between draws: 0 is every frame, 1 is every second."
