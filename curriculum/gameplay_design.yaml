      - q: "How does Property Binding (Example 2) reduce the cost compared to Function Binding?"
        choices: ["It updates only when Health changes, because the property sends an event to the widget each time", "It casts once on Event Construct and stores the reference, but still reads the values each frame", "It reads the value only once at start", "It runs on a separate thread"]
        answer_index: 1
