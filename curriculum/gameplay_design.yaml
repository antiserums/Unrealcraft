      - q: "Which three nodes does the Level Blueprint use to show the menu in the example?"
        choices: ["Spawn Actor, Possess, Set View Target", "Open Level, Create Widget, Delay", "Create Widget, Add to Viewport, Set Show Mouse Cursor", "Add Child, Remove Child, Set Input Mode Game and UI"]
        answer_index: 2
        explain: "On BeginPlay it creates the HUD widget, adds it to the viewport, and sets Show Mouse Cursor to true on the Player Controller."
    flavors:
      _default: {why: "Menus are built from repeated parts; a reusable widget keeps them consistent and easy to change."}
      gameplay_design: {why: "Every menu in your game will need buttons that look the same but do different things.", do: "Add an exposed Text variable so each instance shows its own label."}
