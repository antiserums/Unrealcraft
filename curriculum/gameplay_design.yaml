    title: "Mechanic + GDD"
    brief: "A GDD, or game design document, is a short written description of a mechanic: its goal, its rules, its numbers and how it should feel. Designers hand over tuned systems together with a document like this, so other people can understand and check the work. In this quest you build one AI mechanic with three difficulty variants that come from a Data Table, test it with a player, and write a one-page design document. This is a piece you can show in a portfolio."
    time_min: 240
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/data-driven-gameplay-elements-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/behavior-tree-in-unreal-engine---quick-start-guide"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/ai-perception-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/environment-query-system-quick-start-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Pick one mechanic that uses at least one of these systems: a Behavior Tree enemy, EQS spot picking, a State Tree object, or AI Perception. One example is a guard that hears you, searches for you, and then gives up. Build the enemy from a copy of BP_ThirdPersonCharacter with its own AIController Blueprint."
      - "Make a struct named S_MechanicTuning with 3 to 5 numbers that change the feel, for example sight radius, give-up time and chase speed. Create a Data Table named DT_MechanicTuning with exactly 3 rows: Easy, Normal and Hard."
      - "Read the row at Begin Play with Get Data Table Row, and pass the values into the actor, the controller or the task. When you switch the row name, the behavior must change without opening a graph."
      - "Build a small graybox test space, made of simple shapes, with one goal such as reaching a door or grabbing an item. Put the mechanic between the player and the goal."
      - "Write a one-page design document. It must cover the goal, the core verb, the 3 variants and their values, what each variant should feel like, and how you tested it."
      - "Playtest: ask one person to try each variant. If you work alone, play each variant 3 times and record your time and result. Write one note that says what surprised you and what you changed afterwards."
      - "Record a short video clip (30 seconds or less), or take 3 screenshots, that show the 3 variants in play."
    done_when: "Send the design document (as text or as an image), a screenshot of DT_MechanicTuning with its 3 rows, the playtest note, and the short video clip or the screenshots. A mentor will check that switching rows changes the feel and that the document matches what is built."
    xp: 300
    verify_type: mentor
    quiz:
      - q: "What is a GDD?"
        choices: ["A debug window for AI characters", "A short written description of a mechanic", "A Data Table with one row per difficulty", "A graph that runs the enemy"]
        answer_index: 1
        explain: "A game design document describes the goal of a mechanic, its rules, its numbers and how it should feel."
      - q: "Why do designers hand over a tuned system together with a document?"
        choices: ["The engine needs the document to compile the game", "The document replaces the playtest", "The document is shown to the player", "So other people can understand and check the work"]
        answer_index: 3
        explain: "A graph shows how something works, but not what it is meant to do. The document gives the intent, so others can check the result against it."
      - q: "From which systems must your mechanic use at least one?"
        choices: ["A Behavior Tree enemy, EQS spot picking, a State Tree object, or AI Perception", "Niagara, Chaos, Water, or Landscape", "Sequencer, Movie Render Queue, a Control Rig asset, or the Take Recorder panel", "Lumen, Nanite, Virtual Shadow Maps, or Path Tracing"]
        answer_index: 0
        explain: "The quest is about an AI mechanic, for example a guard that hears you, searches for you, and then gives up. Each of the four systems is a way to build AI behavior."
      - q: "How do you build the enemy for the mechanic?"
        choices: ["From a Static Mesh with a Timeline", "From a Widget Blueprint with a button", "From a copy of BP_ThirdPersonCharacter with its own AIController Blueprint", "From the Level Blueprint with a Delay node and a Set Actor Location node"]
        answer_index: 2
        explain: "The copy gives you a working character with mesh and movement. The AIController Blueprint is what controls it in place of a player."
      - q: "What does the struct S_MechanicTuning hold?"
        choices: ["The meshes and the materials of the enemy character", "3 to 5 numbers that change the feel of the mechanic", "The text of the design document", "The names of the playtesters"]
        answer_index: 1
        explain: "The struct defines the tuning values of the mechanic. Each row of the Data Table then gives these values for one variant."
      - q: "Which rows does the Data Table DT_MechanicTuning have?"
        choices: ["One row for each enemy in the level", "One row for each playtest", "Five rows: Goal, Verb, Rules, Numbers and Feel", "Exactly 3 rows: Easy, Normal and Hard"]
        answer_index: 3
        explain: "Each row is one difficulty variant with its own values. Three real variants make you feel what the numbers do."
      - q: "How do you know that the mechanic is really driven by the Data Table?"
        choices: ["When you switch the row name, the behavior changes without opening a graph", "The Data Table is the largest asset in the folder and opens before the others", "The graph has no nodes left", "The enemy stops moving when the table is open"]
        answer_index: 0
        explain: "The row is read at Begin Play with Get Data Table Row, and its values are passed on. If a new row name gives new behavior with no graph edit, the data is in control."
      - q: "Where does the mechanic sit in the graybox test space?"
        choices: ["Behind the player start, out of sight", "Outside the test space", "Between the player and the goal", "On top of the goal, with no way around"]
