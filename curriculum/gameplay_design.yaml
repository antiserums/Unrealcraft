        choices: ["A HUD class", "A User Widget that can be reused inside other Widget Blueprints", "A Slate brush that can be drawn inside other Widget Blueprints", "An Actor"]
        answer_index: 1
        explain: "Every Widget Blueprint is a User Widget; both its visuals and its script carry over when placed in another widget."
      - q: "Why does the page use an Event Dispatcher instead of only the OnClicked event?"
        choices: ["OnClicked does not work on Size Boxes", "OnClicked only works in the Level Blueprint, not inside a widget", "Dispatchers are faster", "So each placed instance can run its own script when it is clicked"]
        answer_index: 3
