  - id: GDQ34
    rank: 4
    difficulty: master
    track: gameplay-design
    subjects: [data-assets, asset-manager, data-driven, blueprint]
    required_for_majors: [gameplay_design]
    taster_for_majors: []
    adjacent_for: [programming, tech_art]
    required_spine: false
    elective: false
    title: Data Assets and the Asset Manager
    time_min: 150
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/data-assets-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/asset-management-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/asynchronous-asset-loading-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/data-driven-gameplay-elements-in-unreal-engine"
    checklist:
      - "Create a Blueprint Class with parent PrimaryDataAsset and name it PDA_Enemy. Add variables: DisplayName (Text), MaxHealth (Float), MoveSpeed (Float), and Mesh as a Soft Object Reference to Skeletal Mesh. Give each a tooltip."
      - "Right-click in the Content Browser, choose Miscellaneous > Data Asset, pick PDA_Enemy, and make three assets in a folder Data/Enemies: DA_Enemy_Grunt, DA_Enemy_Brute, DA_Enemy_Boss. Fill in different values."
      - "Open Project Settings > Game > Asset Manager. Under Primary Asset Types to Scan, add a type named Enemy with base class PDA_Enemy and the directory /Game/Data/Enemies."
      - "Make BP_EnemySpawner. On Begin Play, call Get Primary Asset Id List for the type Enemy, pick one Id, and load it with Async Load Primary Asset. On Completed, cast the object to PDA_Enemy and spawn an enemy that uses its MaxHealth and MoveSpeed. Print DisplayName."
      - "Add a fourth Data Asset without touching any graph. Play again and confirm the spawner can pick it."
      - "Write 3 sentences: when would you use a Data Asset instead of a Data Table row, and when the reverse?"
    done_when: "Two screenshots: (1) the Asset Manager settings with your Enemy type in Primary Asset Types to Scan; (2) the BP_EnemySpawner graph and a Play In Editor window printing the DisplayName of a loaded Data Asset. Add your 3 sentences about Data Asset versus Data Table."
    xp: 250
    verify_type: screenshot
    quiz:
      - q: "By default, which assets are Primary Assets in the Asset Manager?"
        choices: ["Only UWorld assets (levels)", "All Blueprint classes", "All Data Assets", "All textures and meshes"]
        answer_index: 0
        explain: "By default only UWorld assets (levels) are Primary. Everything else is Secondary until its class overrides GetPrimaryAssetId to return a valid Id."
      - q: "A Primary Asset Id has two parts. Which are they?"
        choices: ["A file path and a package name", "A Primary Asset Type and the asset name", "A class name and a GUID", "A folder name and a version number"]
        answer_index: 1
        explain: "The Id is a unique Primary Asset Type that groups assets, plus the name of the specific asset. A UMyGameZoneTheme saved as Forest gets the Id MyGameZoneTheme:Forest."
      - q: "You create a Data Asset from the Content Browser (Miscellaneous > Data Asset). What is that asset?"
        choices: ["A new class you can subclass", "A Blueprint with an Event Graph", "An instance of a class, not a class itself", "A copy of the Class Default Object"]
        answer_index: 2
        explain: "A Data Asset made this way is an instance of the class. The docs say it is not the same as creating a Blueprint class, and you load it with functions without the word Class in their name."
      - q: "Your hierarchy is UPrimaryDataAsset -> BP_Parent -> BP_DataOnlyChild. What is the PrimaryAssetType of the child with default settings?"
        choices: ["BP_DataOnlyChild", "PrimaryDataAsset", "DataAsset", "BP_Parent"]
        answer_index: 3
        explain: "The type is the name of the first native class going up, or the highest-level Blueprint class. With UPrimaryDataAsset -> ParentBlueprintClass -> DataOnlyBlueprintClass, the type is ParentBlueprintClass."
      - q: "Where do you tell the Asset Manager which folders to scan for your Primary Assets, without writing code?"
        choices: ["Project Settings > Game > Asset Manager > Primary Asset Types to Scan", "Edit > Editor Preferences > Content Browser", "The Data Asset's own Details panel", "World Settings > Game Mode"]
        answer_index: 0
        explain: "The Project Settings page under Game / Asset Manager has Primary Asset Types to Scan, which lists the types, where to look for them, and what to do with them. Code can do the same with ScanPathsForPrimaryAssets."
      - q: "A designer adds a hard object reference to a big mesh on an actor placed in the map. What happens when the map loads?"
        choices: ["Nothing until the mesh is used", "The mesh is loaded together with the actor, even if never shown", "The mesh loads only on a dedicated server", "The reference is converted to a string"]
        answer_index: 1
        explain: "A hard UObject pointer property loads the referenced asset when the object containing it is loaded. If you are not careful you can end up loading 100 percent of your assets at startup. Use a Soft Object Path or Soft Object Pointer to avoid that."
      - q: "Why does the docs prefer RequestAsyncLoad over SynchronousLoad for larger assets?"
        choices: ["SynchronousLoad does not work in packaged builds", "SynchronousLoad can stall the main thread for too long", "RequestAsyncLoad uses less disk space", "RequestAsyncLoad is the only one that works with cooked data"]
        answer_index: 1
        explain: "SynchronousLoad is a blocking load. It may be fine for small objects but can stall the main thread. RequestAsyncLoad loads a group of assets and calls a delegate when done."
      - q: "After StreamableManager finishes an async load and calls your delegate, what happens to its hard references to the loaded assets?"
        choices: ["They are kept forever", "They are released, so you must hard reference the assets somewhere else to keep them", "They move to the Asset Registry", "They are saved to disk"]
        answer_index: 1
        explain: "StreamableManager keeps hard references only until the delegate is called. After that it releases them, so if you want the objects to stay in memory you must reference them yourself."
      - q: "What is an Asset Bundle?"
        choices: ["A zip file of cooked content", "A folder that is always loaded at startup", "A Blueprint that spawns several actors", "A named list of Secondary Assets associated with a Primary Asset"]
        answer_index: 3
        explain: "An Asset Bundle is a named list of specific assets tied to a Primary Asset. When you load a Primary Asset with a bundle name, the Asset Manager also loads the Secondary Assets in that bundle."
      - q: "A programmer builds a Data Table row struct for you. What must be true for the CSV importer to accept it?"
        choices: ["The struct must inherit from FTableRowBase and the first CSV column must be Name", "The struct must be a Blueprint struct", "The CSV must have exactly 5 columns", "The struct must contain only floats"]
        answer_index: 0
        explain: "Column names map 1:1 to a code UStruct that inherits from FTableRowBase. The first column is expected to be named Name and holds the row names used in game."
      - q: "A Data Table row has an icon field. Why does the example use a soft object pointer for it instead of a hard UTexture reference?"
        choices: ["Soft pointers are faster to draw", "Hard references are not allowed in tables", "With a hard reference, all icons would load whenever the table loads", "Soft pointers compress the texture"]
        answer_index: 2
        explain: "The docs say the referenced asset is lazy loaded through TSoftObjectPtr. If the field type was set to UTexture, all of the assets would be loaded whenever the Data Table was loaded."
      - q: "You want enemy types where a Boss inherits and overrides values from a Grunt. Which setup do the docs recommend?"
        choices: ["Data-Only Blueprint classes that inherit from Primary Data Asset", "Separate Data Asset instances with copied values", "A Curve Table", "A Level Streaming Volume per enemy"]
        answer_index: 0
        explain: "Data Asset instances are simpler and more memory-efficient, but if you want data inheritance or a more complex hierarchy the docs recommend Data-Only Blueprint classes, which can be subclassed and update the parent."
    flavors:
      _default: {why: "Data Assets let you add and tune content without opening a single graph, and the Asset Manager decides what is loaded and when."}
      gameplay_design: {why: "This is how you make a whole enemy roster or item list tunable by anyone on the team.", do: "Add a Rarity variable to PDA_Enemy and make the spawner pick by weight."}
      programming: {why: "Async loading through the Asset Manager is the standard way to keep startup fast.", do: "Write down which assets in your project should become Primary and which bundles they need."}

  - id: GDQ35
    rank: 4
    difficulty: master
    track: gameplay-design
    subjects: [gas, gameplay-abilities, gameplay-effects, attributes, blueprint]
    required_for_majors: [gameplay_design]
    taster_for_majors: []
    adjacent_for: [programming, animation]
    required_spine: false
    elective: false
    title: "GAS in Blueprint: attributes and effects"
    time_min: 180
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/understanding-the-unreal-engine-gameplay-ability-system"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-ability-system-for-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-attributes-and-attribute-sets-for-the-gameplay-ability-system-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-effects-for-the-gameplay-ability-system-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-gameplay-abilities-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-ability-system-component-and-gameplay-attributes-in-unreal-engine"
    checklist:
      - "Enable the Gameplay Abilities plugin and restart. Attribute Sets cannot be made in Blueprint, so add one small C++ class UAS_Basic (parent AttributeSet) with two FGameplayAttributeData properties: Health and Stamina. Copy the code from the Attributes page and compile."
      - "Add an Ability System Component to BP_ThirdPersonCharacter. In its Default Starting Data add AS_Basic and a Data Table DT_AttributeInit (row type AttributeMetaData) with AS_Basic.Health = 100 and AS_Basic.Stamina = 50."
      - "Create three Gameplay Effect Blueprints: GE_Damage (Duration Policy Instant, modifier Health Add -25), GE_SprintCost (Instant, Stamina Add -10) and GE_Regen (Has Duration 5 s, Period 1 s, Stamina Add +5)."
      - "Create GA_Slam (parent GameplayAbility). In Activate Ability: Commit Ability, play a short montage or a Delay, Apply Gameplay Effect To Owner with GE_Damage on an overlapped enemy, then End Ability. Add an Activation Blocked Tag State.Stunned."
      - "On Begin Play (server side) call Give Ability with GA_Slam. Bind a key to Try Activate Ability By Class. Add a second key that applies GE_Regen to self."
      - "Bind On Attribute Changed (or read Get Float Attribute each tick) to update a health bar widget WBP_Stats. Play, use the ability, and watch Health and Stamina move."
    done_when: "Two screenshots: (1) the GA_Slam graph with Commit Ability and End Ability visible; (2) Play In Editor with WBP_Stats showing Health and Stamina after one slam and one regen. Add one sentence: which value did you change from base to current, and which effect changed it?"
    xp: 260
    verify_type: screenshot
    quiz:
      - q: "Can a single Actor have two Ability System Components?"
        choices: ["Yes, one per Attribute Set", "Yes, but only on the server", "No; several Actors may share one ASC, but one Actor cannot own several", "No; ASCs are only allowed on Player States"]
        answer_index: 2
        explain: "The docs say GAS supports multiple Actors sharing a single ASC, but not one Actor with several. That would make querying and applying changes ambiguous."
      - q: "Why would you put the Ability System Component on the Player State instead of the Character?"
        choices: ["So that points, money or long cooldowns survive when the Pawn is destroyed and respawned", "Because Characters cannot have components", "To make abilities run faster", "Because Blueprints cannot access a Character's ASC"]
        answer_index: 0
        explain: "The ASC page gives exactly these reasons: scores or long-lasting cooldowns that must not reset when the Pawn dies or the player possesses a new Pawn. The Actor's GetAbilitySystemComponent then returns the Player State's ASC."
      - q: "Can Gameplay Attributes and Attribute Sets be created in Blueprint?"
        choices: ["Yes, with a Blueprint Struct", "No; they must be created in native C++ code", "Yes, but only inside a Gameplay Effect", "Yes, using a Data Table"]
        answer_index: 1
        explain: "The Gameplay Effects page states that Attributes and Attribute Sets must be created in native code and cannot be created in Blueprints. Everything else in this quest can be Blueprint."
      - q: "An Instant Gameplay Effect changes which attribute value, and what does that mean?"
        choices: ["The Current value, so it is undone when the effect ends", "Both values by the same amount", "Neither; Instant effects only send Gameplay Cues", "The Base value, so the change is permanent"]
        answer_index: 3
        explain: "Instant Gameplay Effects modify the Base value. Any effect with a Duration affects the Current value and is undone when the effect ends."
      - q: "Jump Height has base 100. A tired debuff sets it to 70 percent. Then a level-up raises the base to 110 while the debuff is still active. What is the current value?"
        choices: ["70", "110", "77", "100"]
        answer_index: 2
        explain: "This is the example in the Attributes page: the base becomes 110, and the active 70 percent effect gives a current value of 77 as long as it remains."
      - q: "Your AttributeMetaData Data Table has MinValue 0 and MaxValue 150 for Health. What does that clamp?"
        choices: ["Nothing; those columns have no effect in the default plugin", "Health on the server only", "Health on clients only", "Health during Gameplay Effects only"]
        answer_index: 0
        explain: "The docs say Gameplay Attributes and Attribute Sets have no built-in clamping. The MinValue and MaxValue columns are not implemented and have no effect. Clamping is done in the Attribute Set in code."
      - q: "Which Duration options does a Gameplay Effect have, and which one never enters the Active Gameplay Effects Container?"
        choices: ["Instant, Infinite, Has Duration; Instant never enters it", "Short, Medium, Long; Short never enters it", "Instant, Periodic; Periodic never enters it", "Has Duration only; nothing enters it"]
        answer_index: 0
        explain: "Duration can be Instant, Infinite or Has Duration. Effects with a duration are added to the Active Gameplay Effects Container on the ASC. An Instant effect is Executed and never makes its way into that container."
      - q: "A Gameplay Cue for a hit spark must use a tag that starts with which prefix, and what should Cues be used for?"
        choices: ["Ability.; for gameplay-critical logic", "GameplayCue.; for cosmetic feedback only", "Effect.; for damage numbers", "State.; for blocking abilities"]
        answer_index: 1
        explain: "All Gameplay Cues must be associated with a tag starting with GameplayCue, such as GameplayCue.WaterSplash.Big. Cues do not use reliable replication, so they should be cosmetic only."
      - q: "A 'Drink Potion' ability never calls End Ability. What is the likely result?"
        choices: ["Nothing; abilities end on their own after a few seconds", "The system still thinks the character is drinking, so anything the ability blocks stays blocked", "The potion is applied twice", "The ability is removed from the ASC"]
        answer_index: 1
        explain: "Failing to end the ability makes GAS believe it is still running. The docs give exactly this potion example: the character can no longer sprint, climb or drink again, indefinitely."
      - q: "Who is allowed to give or remove abilities on an Ability System Component?"
        choices: ["Any client", "Only the owning client", "Only the server", "Only the Level Blueprint"]
        answer_index: 2
        explain: "GiveAbility and ClearAbility are server-only. The docs note that only the server can give or revoke abilities, which is why the checklist calls Give Ability on the server side."
      - q: "GA_Slam has Activation Blocked Tags = State.Stunned. What does this do?"
        choices: ["Grants State.Stunned to the owner while the ability runs", "Cancels any ability tagged State.Stunned", "Requires the target to have State.Stunned", "Prevents activation while the owner has the State.Stunned tag"]
        answer_index: 3
        explain: "Activation Blocked Tags means the ability can only be activated if the activating Actor does not have any of those tags. Activation Owned Tags is the one that grants tags while running."
      - q: "For a multiplayer dash that must feel instant, which Net Execution Policy do the docs describe as running on the client immediately while the server keeps the final word?"
        choices: ["Server Only", "Server Initiated", "Local Predicted", "Local Only"]
        answer_index: 2
        explain: "Local Predicted runs the ability on the local client at once, then the server can override the result. Server Initiated adds a delay; Local Only never replicates to the server; Server Only never runs on clients."
    flavors:
      _default: {why: "GAS is the standard way big Unreal games build abilities, buffs and stats, and designers tune most of it in data."}
      gameplay_design: {why: "Once attributes and effects exist, new abilities are mostly Blueprint and Gameplay Effect assets you can iterate fast.", do: "Add a GE_Poison with Has Duration 6 s and Period 2 s and make a Gameplay Cue tag for it."}
      programming: {why: "Knowing which parts must be C++ (Attribute Sets, clamping) and which are data keeps the split clean.", do: "Override PostGameplayEffectExecute to clamp Health to 0..MaxHealth."}

  - id: GDQ36
    rank: 4
    difficulty: master
    track: gameplay-design
    subjects: [networking, replication, rpc, blueprint, multiplayer]
    required_for_majors: [gameplay_design]
    taster_for_majors: []
    adjacent_for: [programming, level_design]
    required_spine: false
    elective: false
    title: What the server must own
    time_min: 150
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/networking-overview-for-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/remote-procedure-calls-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/replicate-actor-properties-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-role-and-remote-role-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/networking-and-multiplayer-in-unreal-engine"
    checklist:
      - "In a Third Person project, set Play In Editor to Number of Players 2 and Net Mode Play As Listen Server. Play once and note which window is the server."
      - "Make BP_ScoreCrate (Actor, Static Mesh, Box collision). In Class Defaults turn Replicates on. Add an Integer variable Score with Replication set to RepNotify; in OnRep_Score update a text render above the crate."
      - "On the crate's Begin Overlap add a Switch Has Authority node. On the Authority pin add 1 to Score. On the Remote pin do nothing. Play with 2 players and touch the crate from the client window; both windows must show the new number."
      - "In BP_ThirdPersonCharacter add a Custom Event Server_Kick set to Run on Server and Reliable. It applies an impulse to the crate. Call it from an input key. Add a second Custom Event Multicast_KickFX set to Multicast, Unreliable, that spawns a particle; call it from Server_Kick."
      - "Add a Print String on Begin Play that prints Get Local Role and Get Remote Role for the character. Compare the four lines you get across the two windows."
      - "Write 4 sentences: which values in your crate are owned by the server, which are cosmetic, and why the particle is unreliable."
    done_when: "Two screenshots: (1) both Play In Editor windows side by side after the client touched the crate, with the same Score shown; (2) the character graph with Server_Kick and Multicast_KickFX and their Replicates settings visible. Add your 4 sentences."
    xp: 250
    verify_type: screenshot
    quiz:
      - q: "In Unreal's client-server model, where is the multiplayer game actually played?"
        choices: ["On each client, then averaged", "On the server, which holds the one authoritative game state", "On the client with the best connection", "On whichever machine spawned the actor"]
        answer_index: 1
        explain: "The server holds the one true authoritative state. Clients send remote procedure calls from their local pawns, and the server replicates state back so each client simulates a close approximation."
      - q: "Which network mode has a local player who is also hosting the game for others?"
        choices: ["Dedicated Server", "Client", "Standalone", "Listen Server"]
        answer_index: 3
        explain: "A Listen Server is a server that also has a local player hosting. A Dedicated Server has no local players. Standalone has no networking but still counts as a server."
      - q: "You build all gameplay with replication in mind. What happens when the game is played single-player in Standalone mode?"
        choices: ["Replicated variables stop working", "Server RPCs are dropped", "It works with no extra work because Standalone is both server and client", "You must remove all Switch Has Authority nodes"]
        answer_index: 2
        explain: "Standalone games serve as both server and client, so any logic created for multiplayer functions in single-player with no additional work. That is why the docs say to plan for multiplayer early."
      - q: "You turn Replicates on for an actor. Which of these still does NOT replicate by itself?"
        choices: ["Spawning and destroying the actor", "Location and rotation when Replicate Movement is on", "A normal Blueprint variable you did not mark as Replicated", "Creation of proxies on connected clients"]
        answer_index: 2
        explain: "Creation, destruction and movement are handled automatically, but all other gameplay data does not replicate by default. You must mark each property to replicate and any functions to run remotely."
      - q: "Which of these components or systems runs separately on every client and is not replicated even on a replicated actor?"
        choices: ["Replicated integer variables", "Skeletal Mesh Components, Materials and Animation Blueprints", "The actor's owner", "Server RPC calls"]
        answer_index: 1
        explain: "The overview lists Skeletal Mesh, Static Mesh, Materials, Animation Blueprints, Particles, Sound Emitters and Physics Objects as not replicating. If the variables that drive them are replicated, each client simulates them the same way."
      - q: "In Blueprint, when does a RepNotify function on a replicated variable get called?"
        choices: ["Only on the server, every tick", "Never in Blueprint; only C++ supports RepNotify", "When the property is replicated to a client, and also when a Set node writes it in Blueprint", "Only when the value goes to zero"]
        answer_index: 2
        explain: "A RepNotify is called on clients when the property replicates. In Blueprint a Set node on that property also calls the RepNotify automatically, but macros and functions that take the property by reference do not."
      - q: "A Server RPC is called on a client that does NOT own the actor. What happens?"
        choices: ["It runs on the server anyway", "It runs on the calling client", "It runs on the owning client", "It is dropped"]
        answer_index: 3
        explain: "A Server RPC must be called from the client that owns the actor. The RPC matrix shows: called from a client whose actor is owned by a different client, the call is Dropped."
      - q: "A NetMulticast event is called from a client. Where does it execute?"
        choices: ["On the server and all clients", "Only locally on that client", "On all other clients but not the caller", "On the owning client only"]
        answer_index: 1
        explain: "NetMulticast RPCs are designed to be called from the server. Called from a client, they only execute locally. To reach everyone, run it from the server, for example from inside a Server RPC."
      - q: "Why do the docs warn against binding Reliable RPCs directly to player input?"
        choices: ["Players can spam the key and overflow the reliable RPC queue", "Reliable RPCs cannot carry parameters", "Input cannot be read on the server", "Reliable RPCs only work on dedicated servers"]
        answer_index: 0
        explain: "Reliable RPCs are re-sent until acknowledged and cost extra bandwidth. Rapid button presses can overflow the reliable queue, so limit how often input may fire an RPC, and use Unreliable for frequent calls."
      - q: "What is the primary use case the RPC page gives for RPCs, and what can an RPC never do?"
        choices: ["Saving the game; it cannot run on clients", "Transient or cosmetic events like sounds and particles; it cannot return a value", "Loading levels; it cannot carry a float", "Replacing replicated variables; it cannot be unreliable"]
        answer_index: 1
        explain: "RPCs are unidirectional function calls with no return value. Their primary use case is unreliable, transient gameplay events such as playing sounds, spawning particles and animations."
      - q: "In the client window, your own character prints Local Role = AutonomousProxy and Remote Role = Authority. What does that mean?"
        choices: ["This client controls the pawn and the server has authority over it", "The client has full authority and the server is only watching", "The pawn is not replicated", "The pawn belongs to another player"]
        answer_index: 0
        explain: "AutonomousProxy on a client means the pawn is controlled by this client; the Authority remote role is the server. Another player's pawn shows SimulatedProxy. Only the server sees ROLE_Authority for replicated actors."
      - q: "The docs list one optimization as among the most significant you can make in network gameplay. Which is it?"
        choices: ["Using more Multicast RPCs", "Making all RPCs Reliable", "Replicating every component", "Network dormancy"]
        answer_index: 3
        explain: "The Networking Tips say to make use of network dormancy, which controls whether an actor is even considered for replication on a connection. The same tips say to use as few RPCs as possible and multicast sparingly."
    flavors:
      _default: {why: "A designer who knows what the server must own can write mechanics that work in multiplayer from day one."}
      gameplay_design: {why: "Every rule you design has an owner: server for truth, client for feel and cosmetics.", do: "For your last core loop, list each variable and mark it Server, Client or Cosmetic."}
      programming: {why: "The roles and RPC matrix are the same in C++ and Blueprint, so this transfers directly.", do: "Add a WithValidation check to a server RPC and test what happens when it fails."}

  - id: GDQ37
