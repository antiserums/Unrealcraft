        explain: "Controllers take control of a Pawn with Possess and give it up with Unpossess."
      - q: "By default, how many Pawns can one Controller control at the same time?"
        choices: ["Any number", "Two", "One", "One per player state"]
        answer_index: 2
        explain: "By default there is a one-to-one relationship: each Controller controls only one Pawn at a time. Games like RTS may change this."
      - q: "You spawn a Pawn during gameplay. What happens?"
        choices: ["The nearest Player Controller possesses it", "It is not possessed by any Controller automatically", "The Game Mode possesses it", "A new AI Controller is always created for it at once"]
        answer_index: 1
        explain: "The Pawn page says Pawns spawned during gameplay are not automatically possessed by a Controller."
      - q: "In a deathmatch game the player dies and respawns. Where should the score live so it does not reset?"
        choices: ["On the Pawn", "On the Skeletal Mesh Component", "On the Player Controller", "On the Camera"]
        answer_index: 2
        explain: "The Player Controller persists through the game while the Pawn can be transient. A new Pawn is created on respawn, so score on the Pawn would reset."
      - q: "Which three components make a Character different from a plain Pawn?"
        choices: ["Audio, Light and Camera components", "Character Movement, Capsule and Skeletal Mesh components", "Static Mesh, Camera Boom and Follow Camera components", "Box collision, Timeline and Text Render components"]
        answer_index: 1
        explain: "The Characters page says the Pawn class is extended into Character by adding a CharacterMovementComponent, a CapsuleComponent and a SkeletalMeshComponent."
      - q: "Can you add a Character Movement Component to a Pawn that is not a Character?"
        choices: ["Yes, on any Actor", "Yes, but only on a Default Pawn that has a Capsule as its root component", "No, it is specific to Characters and cannot be used by other classes", "Only in C++"]
        answer_index: 2
        explain: "The docs say the CharacterMovementComponent is specific to Characters and cannot be implemented by any other class."
      - q: "What movement style does the Default Pawn's movement component use?"
        choices: ["Walking with gravity", "No-gravity flying", "Vehicle wheels", "Rigid body physics"]
        answer_index: 1
        explain: "The DefaultPawnMovementComponent uses a no-gravity, flying style with MaxSpeed, Acceleration and Deceleration values."
