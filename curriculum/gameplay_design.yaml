  - id: GDQ59
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [ai, state-tree, blueprint]
    required_spine: false
    required: false
    title: "State Tree data flow: parameters, evaluators, global tasks"
    brief: "A State Tree stays easy to read when it is clear where its data comes from. Parameters are fixed values that you set on the tree, such as a wait time. Evaluators and Global Tasks are small pieces of logic that run for the whole tree and give fresh data to every state. In this quest you build a patrolling character whose State Tree uses parameters, a Global Task that measures how close the player is, and bindings that pass data between tasks."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-state-tree-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/statetree-quick-start-guide"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/state-tree-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one, and work in a level that has a Nav Mesh Bounds Volume. Enable the StateTree and GameplayStateTree plugins. Make a Blueprint named BP_Patroller, a copy of the Third Person character with no input and with a StateTree component. Create a State Tree named ST_Patroller with the StateTreeComponentSchema, and set its Context Actor Class to BP_Patroller."
      - "Add two State Tree Parameters: WaitTime, a float with the value 2.0, and PatrolRadius, a float with the value 800.0."
      - "Create a task named STT_AlertLevel with the parent StateTreeTaskBlueprintBase, and give it an integer variable AlertLevel in the category Output. On Tick, set it to 1 when the player is closer than 1000 units, and to 0 otherwise. Add the task to the Global Tasks of the tree, so it runs the whole time."
      - "Build the states. Under Root, add Calm with the children PickPoint, Walk and Wait, and add a second state named Alert. PickPoint runs a task that outputs a random reachable point using PatrolRadius. Walk moves to that point, so bind its input to the output of the PickPoint task. Wait uses a Delay bound to WaitTime. Link the three with Next transitions so that they loop."
      - "Give Alert an Enter Condition that checks if AlertLevel, bound to the output of the Global Task, is greater or equal to 1. On Calm, add a transition with the trigger On Tick that goes to Alert. In Alert, print Alert and go back to Calm when AlertLevel is 0."
      - "Add failure handling. On Walk, add a transition with the trigger On State Failed that goes to PickPoint, so that a bad point does not stop the loop."
      - "Place three BP_Patroller actors and press Play. Walk close to one of them and watch it switch to Alert and back."
    done_when: "Send one screenshot of ST_Patroller that shows the Parameters, the Global Task, the states Calm (with PickPoint, Walk and Wait) and Alert, and the binding on the Enter Condition of Alert. Add two sentences that say which data is a Parameter, which data comes from the Global Task, and why you used a Global Task and not a normal Task."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "A leaf State is selected. Which Tasks run?"
        choices: ["Only the Tasks of the leaf State", "One Task at a time, from top to bottom, each waiting for the one before it", "Only Global Tasks", "All Tasks of every active State from the root down to the leaf, concurrently"]
        answer_index: 3
        explain: "Selecting a State activates all States from the root to the leaf. All their Tasks run concurrently while the State stays active."
      - q: "A State has three Tasks. What triggers the completion Transition?"
        choices: ["When all three Tasks finish", "When the first Task completes", "When the tree is stopped", "When a Parameter changes"]
        answer_index: 1
        explain: "The first Task that completes triggers a Transition, which can select a new State."
      - q: "In which order are Transitions evaluated, and why is this useful?"
        choices: ["From the leaf State up toward the root; common Transitions can be grouped on a parent", "From the root down toward the leaf; it makes the Transitions of the root always win", "Random order; it avoids bias", "Only on the leaf; parents never transition"]
        answer_index: 0
        explain: "Transitions are checked from the leaf upward and the first that succeeds wins. Shared Transitions can live on a parent State."
      - q: "Why put the time-of-day or alert data in a Global Task instead of a normal Task?"
        choices: ["Global Tasks run faster", "Normal Tasks cannot have outputs, so the data could not be bound to the Enter Conditions of any other State in the tree", "Global Tasks run from tree Start to Stop and start before the Root, so the data exists for the first State selection", "Global Tasks can only be written in C++"]
        answer_index: 2
        explain: "Global Tasks are active between Start and Stop and begin before the Root State, so their data is available during the first selection."
      - q: "What is an Evaluator for, and what can its properties bind to?"
        choices: ["It runs Tasks; it binds to nothing", "It exposes data that Parameters or Context Data cannot; it binds to Parameters, Context Data or earlier Evaluators", "It replaces Transitions for States that have no Tasks; it binds to leaf States and to the Tasks of their parent States", "It draws debug shapes; it binds to the camera"]
        answer_index: 1
        explain: "Evaluators expose extra data and can run code on start, stop and tick. They can bind to Parameters, Context Data and Evaluators earlier in the list."
      - q: "A parent State's Enter Conditions pass, but every child State's Enter Conditions fail. What happens?"
        choices: ["The parent State is selected", "The first child is forced", "The tree stops and reports an error in the log", "The parent is not selected and selection moves on"]
        answer_index: 3
        explain: "A State with children is never selected directly. If no child can be selected, the parent is skipped even though its own conditions passed."
      - q: "What can an Enter Condition bind to?"
        choices: ["Common data and Tasks in all parent States", "Only Parameters", "Tasks of the same State", "Anything in the whole tree, in any State"]
        answer_index: 0
        explain: "Enter Conditions can bind to common data and to Tasks in the parent States. Tasks of the State itself are not running yet at selection time."
      - q: "How is StateTree selection different from a behavior tree?"
        choices: ["StateTree keeps running selection on every tick, like a behavior tree does; a behavior tree only stops selecting while a Task is running", "They are identical", "StateTree runs selection on demand when a Transition fires; a behavior tree keeps running selection logic even while a State is selected", "StateTree cannot select child States"]
        answer_index: 2
        explain: "Behavior trees keep evaluating selection. StateTree only runs the selection process when a Transition triggers it (plus an implicit one to the Root on the first tick)."
    flavors:
      _default: {why: "State Trees stay readable when the data that drives them is clearly separated into parameters, evaluators and global tasks."}
      gameplay_design: {why: "Exposed parameters are what let you tune one tree for many NPC types.", do: "Add a third parameter and explain who on the team would change it and when."}

  - id: GDQ60
