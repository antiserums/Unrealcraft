  - id: GDQ19
    rank: 1
    difficulty: apprentice
    specializations: [gameplay_design]
    subjects: [capstone, graybox, blueprint, umg]
    required_spine: true
    required: true
    capstone: true
    title: "Toy space"
    brief: "A toy space is the smallest thing that is still a game: one action for the player, one room, and one number on screen. Building it lets you combine several skills in one piece of work, from tunable variables to timers, pickups and widgets. In this quest you plan a small room around one player action, build it with simple shapes, tune it, and record one full run. Everything you need to build is listed in the steps."
    time_min: 180
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-01-project-setup-and-level-blockout-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-02-create-a-key-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-04-player-hud-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Pick ONE player verb, which is one action the player does, such as jump, dash, collect or push. Sketch a node map on paper with 3 to 5 spaces, and write what the verb does in each space."
      - "Graybox one room in a new level, which means you build it with basic shapes only and no art. Every space must use the verb."
      - "Build one actor for the verb with a name that starts with BP_Toy_. It must have at least one Float variable that is Instance Editable (click the eye icon next to it), with its Category set to Tuning and a Tooltip."
      - "In the logic of that actor, use at least one flow control node (Branch, Gate, DoOnce or FlipFlop) and one timer or Delay node."
      - "Add a pickup or a trigger that changes a variable, for example a coin that adds 1 to a Score variable on the character when the player overlaps it. Show that number on screen with a Widget Blueprint that you add to the viewport."
      - "Tune the speed or the jump of the character for the room, on the Character Movement component of BP_ThirdPersonCharacter. Test the room in Play In Editor, and one time as Standalone Game from the Play options."
      - "Record a short video clip (30 seconds or less) that shows one full run. Write 5 lines that name the verb, the tunable value, and what you changed after testing."
    done_when: "Send these four things: the short video clip, a photo of your paper node map, a screenshot of the tuning variable in the Details panel, and your 5-line note. A mentor reviews your work."
    xp: 250
    verify_type: mentor
    quiz:
      - q: "What is a toy space?"
        choices: ["A level full of finished art and no gameplay", "A folder for unused Blueprints", "A menu where the player picks a level", "The smallest thing that is still a game"]
        answer_index: 3
        explain: "A toy space has one action for the player, one room, and one number on screen. It is small enough to finish and still a real game."
      - q: "What is a player verb?"
        choices: ["One action the player does, such as jump or collect", "The name of the player character", "A text shown on the screen", "A variable that stores the current score of the player"]
        answer_index: 0
        explain: "A verb is an action such as jump, dash, collect or push. You pick one, and every space in the room must use it."
      - q: "What does it mean to graybox a room?"
        choices: ["To light it with gray lights only, and no color", "To hide it from the player", "To build it with basic shapes only and no art", "To copy it from another project"]
        answer_index: 2
        explain: "A graybox uses simple shapes. You can test and change the room quickly, because no art has to be redone."
      - q: "How do you make the Float variable of your BP_Toy_ actor Instance Editable?"
        choices: ["Rename it so that it starts with BP_", "Click the eye icon next to the variable", "Set its Category to Tuning", "Add a Tooltip to it"]
        answer_index: 1
        explain: "The eye icon next to a variable turns on Instance Editable. The value can then be tuned on each placed copy in the Details panel."
      - q: "Which of these is a flow control node?"
        choices: ["Branch", "Print String", "Add to Viewport", "Get Actor Location"]
        answer_index: 0
        explain: "Flow control nodes decide which path the execution takes. Branch, Gate, DoOnce and FlipFlop are flow control nodes."
      - q: "Where do you tune the speed or the jump of the character for your room?"
        choices: ["In the World Settings of the level", "In the Widget Blueprint of the score", "In the Play options of the main toolbar, under Advanced Settings", "On the Character Movement component of BP_ThirdPersonCharacter"]
        answer_index: 3
        explain: "The Character Movement component holds the movement values of the character. Changing them there fits the character to the size of your room."
    flavors:
      _default: {why: "One verb, one room, one number: the smallest thing that is still a game."}
      gameplay_design: {why: "This is the loop you will repeat for every mechanic in your career.", do: "Bring two tuning values you tried and rejected, and say why."}
      level_design: {why: "A room built around a verb teaches how space and mechanic shape each other.", do: "Show where scale, verticality or guiding lines push the player to use the verb."}

  - id: GDQ20
    rank: 1
    difficulty: apprentice
    specializations: [gameplay_design]
    subjects: [blueprint, debugging]
    required_spine: false
    required: false
    title: "Blueprint debugging"
    brief: "Debugging means finding out why your logic does something you did not expect, for example why a value is wrong. Blueprints have tools for this: a breakpoint pauses the game at a node you choose, a watch shows the value of a pin, and Print String writes a message on screen. In this quest you use these tools on a simple coin pickup."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-debugger-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/debug-panel-in-the-blueprints-visual-scripting-editor-for-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Development/PrintString"
    checklist:
      - "Open a project made from the Third Person template, or create one. You need a coin pickup that changes a Score value. If you have none, make one: add an Integer variable named Score to BP_ThirdPersonCharacter, and create an Actor Blueprint named BP_Coin with a Sphere Collision that, on overlap, casts Other Actor to BP_ThirdPersonCharacter and sets Score to Score + 1. Place a few coins in the level. Open BP_Coin, right-click the Set Score node and choose Add Breakpoint. Press Play and walk into a coin, and the game pauses at that node."
      - "While the game is paused, move the mouse over the Score pin and read its value. Then right-click the pin and choose Watch this value."
      - "Open Tools > Blueprint Debugger. Look at the Call Stack and the Execution Trace, which show the path the logic took. Then resume the game."
      - "Right-click the breakpoint and choose Disable Breakpoint. Confirm that the red octagon is now only an outline. Play again and check that the game does not pause."
      - "Add a Print String node with a Key named score and a Duration of 5. Collect several coins and notice that the new message replaces the old one."
      - "On one Print String node, change Print to Log to false. Then check the Output Log to see the difference."
    done_when: "Send a screenshot of the editor paused on your breakpoint, with the red arrow and a watched value visible. Also send a screenshot of the Blueprint Debugger window."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "How does an active breakpoint look on a node?"
        choices: ["A solid red octagon in the upper-left corner", "A yellow triangle", "A blue circle", "A thick red outline around the whole of the node"]
        answer_index: 0
        explain: "An active breakpoint is a solid red octagon; a disabled one is an outline of a red octagon."
      - q: "A breakpoint shows as a yellow icon with an exclamation point. What does that mean?"
        choices: ["It is disabled", "It is invalid and will never be reached; recompiling may fix it", "It has been hit", "It is shared with the other developers through source control"]
        answer_index: 1
        explain: "A yellow exclamation icon marks an invalid breakpoint location; compiling the Blueprint can sometimes resolve it."
      - q: "You watch a pin on a node that has not executed yet. What do you see?"
        choices: ["The default value", "Zero", "A message saying no debug information is available", "The last value that was saved with the Blueprint"]
        answer_index: 2
        explain: "Pin values only update when the node executes at least once; before that a message is shown instead of a value."
      - q: "A teammate opens your project. Do they get your breakpoints too?"
        choices: ["Yes, they are saved in the Blueprint asset and travel with it in source control", "No, they are saved in your project .ini files and not duplicated for others", "Only if the Blueprint is compiled", "Only in Standalone mode"]
        answer_index: 1
        explain: "Breakpoints persist between editor sessions in your .ini files but are not duplicated for other developers."
      - q: "Which function is at the top of the Call Stack when a breakpoint is hit?"
        choices: ["Event BeginPlay", "The Level Blueprint", "The oldest function in the stack", "The function currently executing"]
        answer_index: 3
        explain: "The currently executing function is listed at the top, with calling functions below it."
      - q: "On Print String, what does the Key input do?"
        choices: ["Makes the message replace any on-screen message with the same key", "Sets the text color", "Sends the message to a log file on disk that has that key as its name", "Delays the message"]
        answer_index: 0
        explain: "If a non-empty Key is given, the message replaces existing on-screen messages that have the same key."
    flavors:
      _default: {why: "Finding out why a value is wrong is half of tuning."}
      gameplay_design: {why: "Watching values live shows you what the player really triggers.", do: "Watch your tunable variable during play and note one value you did not expect."}
      programming: {why: "The Blueprint Call Stack and Execution Trace mirror the C++ debugger.", do: "Find where native code (BeginPlay) appears in the Call Stack."}
      tech_art: {why: "Construction Script bugs are easier to see with watches.", do: "Put a watch on a pin inside a Construction Script and move the actor."}

  - id: GDQ21
    rank: 2
