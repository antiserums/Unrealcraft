    title: "Controller, Pawn, Character"
    brief: "In Unreal, a Pawn is any body in the world that can be controlled, a Character is a Pawn that already has walking movement, a capsule and a mesh, and a Controller is the unseen class that takes control of a Pawn. Taking control is called Possess. Every mechanic starts with the choice of which class owns the input, the body and the data. In this quest you build a drone Pawn and a Player Controller, and you switch control between the drone and the character."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-framework-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-framework-quick-reference-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/controllers-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/pawn-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/characters-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/player-controllers-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/ai-controllers-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Pawn/Possess"
    checklist:
      - "Read the Gameplay Framework overview page linked on this quest, and the pages Controllers, Pawn, Characters and Player Controllers that it links to."
      - "Open a project made from the Third Person template, or create one. Make a Blueprint named BP_Drone from the Pawn class, not from Character. Add a Static Mesh and a Camera to it."
      - "Make a Blueprint named BP_MyPlayerController from the Player Controller class. Add an Input Action that calls Possess on BP_Drone, and a second one that possesses the player Character again."
      - "Open the Game Mode that the level uses (in the template its name starts with BP_ThirdPerson and ends with GameMode) and set Player Controller Class to BP_MyPlayerController."
      - "Place one BP_Drone in the level. In Play In Editor, switch control between the Character and the Drone."
      - "Add an Integer variable named Score to BP_MyPlayerController, and add a Score Integer to the Character too. Switch between the pawns and watch which value survives."
      - "Write 5 lines that say which class should own the input, the score and the mesh in your game, and why."
    done_when: "Send a screenshot of the game after you possessed BP_Drone, with the drone camera active. Add your 5-line note about which class owns the input, the score and the mesh."
    xp: 115
    verify_type: screenshot
    quiz:
      - q: "A Controller takes control of a Pawn with which function?"
        choices: ["Attach To", "Set Owner", "Spawn Actor", "Possess"]
