        explain: "NavArea_Obstacle is a high cost area. Agents avoid it but can still cross it. NavArea_Null applies infinite cost, so no navigation data is generated and the agent cannot path through."
      - q: "What is a Nav Link Proxy for?"
        choices: ["Making the NavMesh higher resolution", "Connecting two NavMesh areas that have no direct path, such as a jump or a drop", "Setting the walk speed of agents", "Hiding the NavMesh from players"]
