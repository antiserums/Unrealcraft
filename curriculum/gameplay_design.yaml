    quiz:
      - q: "What is a State Tree, in one sentence from the docs?"
        choices: ["A replacement for the Blackboard", "A graph that only animates characters, with states for poses and transitions for the blends", "A hierarchical state machine that combines behavior tree selectors with states and transitions", "A list of Gameplay Tags"]
        answer_index: 2
        explain: "StateTree is a general-purpose hierarchical state machine. It takes Selectors from behavior trees and States and Transitions from state machines."
      - q: "A State has three Tasks. How do they run when the State is active?"
        choices: ["One after another, from top to bottom, each waiting for the one before", "Concurrently, and the first Task that completes triggers a transition", "Only the first Task runs", "Randomly, one per tick"]
        answer_index: 1
        explain: "All Tasks in a State run concurrently while the State is active. The first Task that completes triggers a Transition, which can select a new State."
      - q: "When a leaf State is selected, which States are active?"
        choices: ["Only the leaf State", "All States in the whole tree, whether they were selected or not", "Only the root", "The leaf State and all its parent States up to the root"]
        answer_index: 3
        explain: "Selecting a State activates all States from the root down to the leaf. Tasks of all those active States run, starting from the root."
      - q: "How does State Tree selection differ from a behavior tree, per the overview?"
        choices: ["State Tree scans the whole tree every tick to find a new State; behavior trees only run selection at start", "State Tree runs selection on demand when a Transition triggers; behavior trees keep running selection logic", "There is no difference", "State Tree cannot have child States"]
        answer_index: 1
        explain: "Behavior trees keep executing selection logic even when a State is selected. State Tree runs selection only when a Transition fires, starting at the target State."
      - q: "In which order are Transitions evaluated?"
        choices: ["From the root down to the leaf", "All at once, and the one with the highest priority number wins every tie", "From the leaf State upward toward the root; the first that succeeds wins", "Only on the root State"]
        answer_index: 2
        explain: "Transitions are evaluated from the leaf State upward. The first Transition that succeeds and leads to a State selection is taken. This lets parents group common Transitions."
      - q: "A parent State's Enter Conditions pass, but none of its child States can be selected. What happens?"
        choices: ["The parent State is selected anyway", "The parent State is not selected", "The tree stops with an error", "The first child is forced to run"]
        answer_index: 1
        explain: "If a State has child States and none can be selected, the State is not selected even though its own Enter Conditions passed."
      - q: "Which data source lets you expose data such as a nearest spline actor to the whole tree with custom logic on TreeStart?"
        choices: ["An Evaluator", "A Gameplay Tag", "A Blackboard key", "A Level Blueprint variable"]
        answer_index: 0
        explain: "Evaluators expose data that Parameters or Context Data cannot. They run when the tree starts, stops and on tick. The quick start uses STE_GetSpline with a TreeStart override."
      - q: "In a Blueprint Task, you create an Actor variable and set its Category to 'Context'. Why?"
        choices: ["It makes the variable private", "It saves the variable to disk", "It hides the variable from the tree, so that no State can bind to it", "It auto-binds the variable to the Context Actor of the State Tree"]
        answer_index: 3
        explain: "The Context category binds the variable to the Context Actor in the StateTree. The Output category exposes a value for other nodes to bind to."
      - q: "Your ST_ShootingTarget does not appear in the StateTree component dropdown. What is the likely cause?"
        choices: ["The tree has too many States", "The plugin cannot be used in Blueprint projects, only in projects with C++ code", "The tree was created with the wrong schema; it must use StateTreeComponentSchema", "The actor has no Static Mesh"]
        answer_index: 2
        explain: "The quick start notes that if the State Tree does not appear in the dropdown, the wrong schema was selected. The component needs StateTreeComponentSchema."
      - q: "Which Transition setup makes a State run again after it finishes, as in the quick start's Idle State?"
        choices: ["Trigger On State Completed, Transition To Root", "Trigger On Tick, Transition To Tree Succeeded", "Trigger On Event with no tag", "No transition at all"]
        answer_index: 0
        explain: "Idle uses Trigger On State Completed with Transition To Root, so once the State completes the tree returns to the root and selects again. Tree Succeeded ends the tree."
    flavors:
      _default: {why: "State Tree is Epic's newer way to write AI and object logic; Mass and Smart Objects use it too."}
      gameplay_design: {why: "States and transitions map closely to how designers talk about behavior: idle, alert, attack, dead.", do: "Add a third State Hit Reaction with a Delay task and an On Event transition using a Gameplay Tag."}
      animation: {why: "State Trees drive contextual animation for crowds and characters.", do: "In the Dead state, play a montage before the delay and note where the Task would live."}

  - id: GDQ31
    rank: 3
    difficulty: expert
    specializations: [gameplay_design]
    subjects: [ai, perception, blueprint]
    required_spine: false
    required: true
    title: "AI Perception: sight and hearing"
    brief: "AI Perception is the Unreal system that lets an AI notice things, for example by sight or by hearing. Its numbers, such as how far and how wide the AI can see, decide if a stealth or combat moment feels fair to the player. In this quest you give an enemy sight and hearing, make the player something that can be seen and heard, and look at the sight cone in the debug view."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/ai-perception-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/artificial-intelligence-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/ai-debugging-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/behavior-tree-in-unreal-engine---quick-start-guide"
    checklist:
      - "Open a project made from the Third Person template, or create one. You need an enemy with an AIController Blueprint. If you have none, create an AIController Blueprint named AIC_Enemy, duplicate BP_ThirdPersonCharacter as BP_Enemy, delete its input logic, set its AI Controller Class to AIC_Enemy, and place it in the level. Open the AIController Blueprint and add an AIPerception component to it."
      - "On the component, add an AI Sight config with Sight Radius 1500, Lose Sight Radius 2000, Peripheral Vision Half Angle 60, and Detect Neutrals turned on. Then add an AI Hearing config with Hearing Range 1200 and Detect Neutrals turned on."
      - "Add the On Target Perception Updated event. Break the AIStimulus pin to see its parts. Use Successfully Sensed together with Actor Has Tag and the tag Player to set Blackboard keys. As a simpler option, you can use Print String to show the sensed actor and the stimulus location."
      - "On the player character, BP_ThirdPersonCharacter, add an AIPerception Stimuli Source component. Enable Auto Register as Source and register it for Sight and Hearing. Also add the actor Tag Player to the character."
      - "In the player character, add a key press event that calls Report Noise Event with Loudness 1.0 at the location of the player."
      - "Press Play. Press the apostrophe key and then Numpad 4 to see the sight cone and the hearing radius. Walk behind the enemy and press the noise key."
      - "Change Peripheral Vision Half Angle to 30. Note how much harder it is for the enemy to see you."
    done_when: "Send two screenshots. The first shows the Perception debug view (apostrophe, then Numpad 4) with the sight cone and a sensed player. The second shows the Senses Config of the AIPerception component. Add one sentence that says what happened when you made noise behind the enemy."
    xp: 175
    verify_type: screenshot
    quiz:
      - q: "Where does the docs say to add the AI Perception Component?"
        choices: ["On the Pawn's Static Mesh", "On the Game Mode", "On the NavMeshBoundsVolume of the level", "On the Pawn's AIController Blueprint"]
        answer_index: 3
        explain: "The AI Perception Component is added to the Pawn's AIController Blueprint. It acts as a stimuli listener and gathers registered stimuli sources."
      - q: "What is the difference between On Perception Updated and On Target Perception Updated?"
        choices: ["The first returns one Actor together with a stimulus; the second returns an array of all Actors", "The first returns an array of Actors; the second returns one Actor plus an AIStimulus struct", "They are the same event with two names", "The second only works for Hearing"]
        answer_index: 1
        explain: "On Perception Updated returns an array of Actors that signaled the update. On Target Perception Updated returns the Actor and an AI Stimulus struct you can break down."
      - q: "Which field of the AIStimulus tells you if the actor was actually sensed (true) or the stimulus was lost (false)?"
        choices: ["Age", "Strength", "Successfully Sensed", "Receiver Location"]
        answer_index: 2
        explain: "Successfully Sensed is True or False. The quick starts use it to branch: true clears the lost-sight timer, false starts it."
      - q: "Peripheral Vision Half Angle Degrees is 45. How wide is the whole sight cone?"
        choices: ["45 degrees", "90 degrees", "22.5 degrees", "180 degrees"]
        answer_index: 1
        explain: "The value is measured from the forward vector to one side, not the whole range. 45 on each side gives a 90 degree cone."
      - q: "Why do the Blueprint guides enable Detect Neutrals and then filter with Tags?"
        choices: ["Because Sight cannot detect enemies", "Because Tags are faster than affiliation", "Because affiliation (team) can only be set in C++, and actors are neutral by default", "Because Detect Neutrals is the only detection option that still works in packaged games"]
        answer_index: 2
        explain: "Currently affiliation can only be defined in C++. Actors have no affiliation by default and are neutral, so Blueprint users detect neutrals and filter by Tag."
      - q: "What produces a stimulus for the AI Hearing sense?"
        choices: ["Any sound played with Play Sound at Location", "Any actor overlapping the AI", "Only projectiles", "A Report Noise Event"]
        answer_index: 3
        explain: "AI Hearing detects sounds generated by a Report Noise Event, for example a projectile that hits something and reports a noise."
      - q: "Max Age on a sense config is 0. What does that mean?"
        choices: ["The stimulus is forgotten right away", "The sense is disabled", "The stimulus is never forgotten", "The sense only updates once per second"]
        answer_index: 2
        explain: "Max Age is the time before a stimulus is forgotten, and 0 means never forgotten. To forget actors you also need Project Settings > AI System > Forget Stale Actors set to true."
      - q: "What does Lose Sight Radius do compared to Sight Radius?"
        choices: ["Lose Sight Radius is the distance at which the AI starts to perceive a target; Sight Radius is the distance at which a seen target is lost again", "Sight Radius is the max distance to start perceiving; Lose Sight Radius is the max distance at which an already seen target is still perceived", "They must always be equal", "Lose Sight Radius only affects Hearing"]
        answer_index: 1
        explain: "Sight Radius is where perception can start. Lose Sight Radius is the larger distance at which a target that was already seen is finally lost. This avoids flicker at the edge."
      - q: "What does the AI Perception Stimuli Source component do on the player?"
        choices: ["It lets the player see AI", "It replaces the player's collision", "It stores the list of actors that the player has perceived during the game", "It registers the owning actor as a source of stimuli for the chosen senses"]
        answer_index: 3
        explain: "The Stimuli Source component registers its owning Actor as a stimuli source for the senses listed in Register as Source for Senses. With Auto Register as Source on, you do not need to call Register with Perception System."
      - q: "Which function returns actors that were perceived and are not yet forgotten, even if not currently perceived?"
        choices: ["Get Currently Perceived Actors", "Get Known Perceived Actors", "Forget All", "Request Stimuli Listener Update"]
        answer_index: 1
        explain: "Get Known Perceived Actors returns actors that have been perceived and not yet forgotten. Get Currently Perceived Actors returns only those being perceived now."
    flavors:
      _default: {why: "Perception is how an AI knows the player exists. Its numbers decide if a stealth or combat moment feels fair."}
      gameplay_design: {why: "Sight cone, radius and forget time are the tuning knobs of stealth and alert states.", do: "Write down three values (radius, half angle, Max Age) and the play feel each gave."}
      level_design: {why: "Sight lines and noise ranges decide where cover and patrol routes work.", do: "Place one wall that blocks sight but not hearing and test it."}

  - id: GDQ32
