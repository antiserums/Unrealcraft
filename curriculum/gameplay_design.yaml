      - q: "What must the one-page design document cover?"
        choices: ["The full graph, node by node", "The goal, the core verb, the 3 variants, their feel, and how you tested it", "The history of the project, the tools you installed and the videos you watched", "Only the values of the Hard variant"]
        answer_index: 1
        explain: "The page lets a reader understand the mechanic and compare it with what is built. A mentor checks that the document matches the result."
      - q: "You work alone and have nobody to playtest. What does the quest ask you to do?"
        choices: ["Skip the playtest and write the note from what you expect", "Play only the Easy variant once", "Ask the mentor to play it for you", "Play each variant 3 times and record your time and result"]
        answer_index: 3
