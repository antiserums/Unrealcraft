      - q: "You promote ChaseSpeed to a variable and enable Instance Editable in BTT_ChasePlayer. What do you gain?"
        choices: ["The value is saved to disk automatically", "The variable is shared with all Blackboards", "The task runs faster", "The value becomes a property you can edit on the task node inside the Behavior Tree"]
