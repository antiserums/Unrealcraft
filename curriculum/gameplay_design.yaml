    verify_type: screenshot
    quiz:
      - q: "By default, which assets are Primary Assets in the Asset Manager?"
        choices: ["Only UWorld assets (levels)", "All Blueprint classes", "All Data Assets", "All textures and static meshes"]
        answer_index: 0
        explain: "By default only UWorld assets (levels) are Primary. Everything else is Secondary until its class overrides GetPrimaryAssetId to return a valid Id."
      - q: "A Primary Asset Id has two parts. Which are they?"
        choices: ["A file path and a package name", "A Primary Asset Type and the asset name", "A class name and a GUID", "A folder name and an engine version number"]
        answer_index: 1
        explain: "The Id is a unique Primary Asset Type that groups assets, plus the name of the specific asset. A UMyGameZoneTheme saved as Forest gets the Id MyGameZoneTheme:Forest."
      - q: "You create a Data Asset from the Content Browser (Miscellaneous > Data Asset). What is that asset?"
        choices: ["A new class you can subclass", "A Blueprint class with its own Event Graph", "An instance of a class, not a class itself", "A copy of the Class Default Object"]
        answer_index: 2
        explain: "A Data Asset made this way is an instance of the class. The docs say it is not the same as creating a Blueprint class, and you load it with functions without the word Class in their name."
      - q: "Your hierarchy is UPrimaryDataAsset -> BP_Parent -> BP_DataOnlyChild. What is the PrimaryAssetType of the child with default settings?"
        choices: ["BP_DataOnlyChild", "PrimaryDataAsset", "DataAsset", "BP_Parent"]
        answer_index: 3
        explain: "The type is the name of the first native class going up, or the highest-level Blueprint class. With UPrimaryDataAsset -> ParentBlueprintClass -> DataOnlyBlueprintClass, the type is ParentBlueprintClass."
      - q: "Where do you tell the Asset Manager which folders to scan for your Primary Assets, without writing code?"
        choices: ["Project Settings > Game > Asset Manager > Primary Asset Types to Scan", "Edit > Editor Preferences > Content Browser", "The Details panel of each Data Asset, where you type the folder to scan", "World Settings > Game Mode"]
        answer_index: 0
        explain: "The Project Settings page under Game / Asset Manager has Primary Asset Types to Scan, which lists the types, where to look for them, and what to do with them. Code can do the same with ScanPathsForPrimaryAssets."
      - q: "A designer adds a hard object reference to a big mesh on an actor placed in the map. What happens when the map loads?"
        choices: ["Nothing until the mesh is used", "The mesh is loaded together with the actor, even if never shown", "The mesh loads only on a dedicated server, never on the clients", "The reference is converted to a string"]
        answer_index: 1
        explain: "A hard UObject pointer property loads the referenced asset when the object containing it is loaded. If you are not careful you can end up loading 100 percent of your assets at startup. Use a Soft Object Path or Soft Object Pointer to avoid that."
      - q: "Why does the docs prefer RequestAsyncLoad over SynchronousLoad for larger assets?"
        choices: ["SynchronousLoad does not work in packaged builds", "SynchronousLoad can stall the main thread for too long", "RequestAsyncLoad uses less disk space", "RequestAsyncLoad is the only one that works with cooked data"]
        answer_index: 1
        explain: "SynchronousLoad is a blocking load. It may be fine for small objects but can stall the main thread. RequestAsyncLoad loads a group of assets and calls a delegate when done."
      - q: "After StreamableManager finishes an async load and calls your delegate, what happens to its hard references to the loaded assets?"
        choices: ["They are kept forever", "They are released, so you must hard reference the assets somewhere else to keep them", "They move to the Asset Registry, which keeps the assets in memory until the level ends", "They are saved to disk"]
        answer_index: 1
        explain: "StreamableManager keeps hard references only until the delegate is called. After that it releases them, so if you want the objects to stay in memory you must reference them yourself."
      - q: "What is an Asset Bundle?"
        choices: ["A zip file of cooked content", "A folder of assets that is always loaded when the game starts up", "A Blueprint that spawns several actors", "A named list of Secondary Assets associated with a Primary Asset"]
        answer_index: 3
        explain: "An Asset Bundle is a named list of specific assets tied to a Primary Asset. When you load a Primary Asset with a bundle name, the Asset Manager also loads the Secondary Assets in that bundle."
      - q: "A programmer builds a Data Table row struct for you. What must be true for the CSV importer to accept it?"
        choices: ["The struct must inherit from FTableRowBase and the first CSV column must be Name", "The struct must be a Blueprint struct, and the first CSV column must be named Row", "The CSV must have exactly 5 columns", "The struct must contain only floats"]
        answer_index: 0
        explain: "Column names map 1:1 to a code UStruct that inherits from FTableRowBase. The first column is expected to be named Name and holds the row names used in game."
      - q: "A Data Table row has an icon field. Why does the example use a soft object pointer for it instead of a hard UTexture reference?"
        choices: ["Soft pointers are faster to draw", "Hard references are not allowed in tables, so the import would fail", "With a hard reference, all icons would load whenever the table loads", "Soft pointers compress the texture"]
        answer_index: 2
        explain: "The docs say the referenced asset is lazy loaded through TSoftObjectPtr. If the field type was set to UTexture, all of the assets would be loaded whenever the Data Table was loaded."
      - q: "You want enemy types where a Boss inherits and overrides values from a Grunt. Which setup do the docs recommend?"
        choices: ["Data-Only Blueprint classes that inherit from Primary Data Asset", "Separate Data Asset instances with the values copied by hand into each", "A Curve Table", "A Level Streaming Volume per enemy"]
        answer_index: 0
        explain: "Data Asset instances are simpler and more memory-efficient, but if you want data inheritance or a more complex hierarchy the docs recommend Data-Only Blueprint classes, which can be subclassed and update the parent."
    flavors:
      _default: {why: "Data Assets let you add and tune content without opening a single graph, and the Asset Manager decides what is loaded and when."}
      gameplay_design: {why: "This is how you make a whole enemy roster or item list tunable by anyone on the team.", do: "Add a Rarity variable to PDA_Enemy and make the spawner pick by weight."}
      programming: {why: "Async loading through the Asset Manager is the standard way to keep startup fast.", do: "Write down which assets in your project should become Primary and which bundles they need."}

  - id: GDQ35
    rank: 4
    difficulty: master
    specializations: [gameplay_design]
    subjects: [gas, gameplay-abilities, gameplay-effects, attributes, blueprint]
    required_spine: false
    required: true
    title: "GAS in Blueprint: attributes and effects"
    brief: "The Gameplay Ability System, or GAS, is the Unreal framework that many large games use for abilities, buffs and stats. It has three main parts: Attributes are numbers such as Health and Stamina, Gameplay Effects change those numbers, and Gameplay Abilities are the actions a character can do. Designers tune most of it in data. In this quest you set up two attributes, three effects and one ability, and you show the attributes in a widget."
    time_min: 180
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/understanding-the-unreal-engine-gameplay-ability-system"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-ability-system-for-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-attributes-and-attribute-sets-for-the-gameplay-ability-system-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-effects-for-the-gameplay-ability-system-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-gameplay-abilities-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-ability-system-component-and-gameplay-attributes-in-unreal-engine"
    checklist:
      - "Open a C++ project, or create one from the Third Person template with C++ selected. You need an IDE such as Visual Studio to compile one small class. Enable the Gameplay Abilities plugin and restart the editor. Attribute Sets cannot be made in Blueprint, so add one small C++ class named UAS_Basic with the parent AttributeSet. Give it two FGameplayAttributeData properties, Health and Stamina. Copy the code from the Attributes page of the Gameplay Ability System documentation and compile."
      - "Add an Ability System Component to BP_ThirdPersonCharacter. In its Default Starting Data, add AS_Basic and a Data Table named DT_AttributeInit with the row type AttributeMetaData. In the table, set AS_Basic.Health to 100 and AS_Basic.Stamina to 50."
      - "Create three Gameplay Effect Blueprints. GE_Damage has Duration Policy Instant and a modifier that adds -25 to Health. GE_SprintCost is Instant and adds -10 to Stamina. GE_Regen uses Has Duration with 5 s, has a Period of 1 s, and adds +5 to Stamina."
      - "Make an enemy to hit: a Character Blueprint named BP_SlamEnemy with its own Ability System Component and AS_Basic, placed near the player."
      - "Create a Blueprint named GA_Slam with the parent GameplayAbility. In Activate Ability, call Commit Ability, then play a short montage or use a Delay. Then damage the enemy if it is close: make Target Data from the enemy with the node Ability Target Data from Actor, and give it to Apply Gameplay Effect to Target with GE_Damage. The effect changes the Health of the actor that receives it. Finish with End Ability."
      - "In GA_Slam, add State.Stunned as an Activation Blocked Tag, so the ability cannot start while the character is stunned."
      - "On Begin Play, on the server side, call Give Ability with GA_Slam. Bind a key to Try Activate Ability By Class. Add a second key that applies GE_Regen to the character itself."
      - "Make a widget named WBP_Stats with a health bar. Update it from On Attribute Changed, or read Get Float Attribute on each tick. Press Play, use the ability, and watch Health and Stamina change."
    done_when: "Send two screenshots. The first shows the GA_Slam graph with Commit Ability and End Ability visible. The second shows Play In Editor with WBP_Stats showing Health and Stamina after one slam and one regen. Add one sentence that answers this: which value did you change from base to current, and which effect changed it?"
    xp: 260
    verify_type: screenshot
    quiz:
      - q: "Can a single Actor have two Ability System Components?"
        choices: ["Yes, one per Attribute Set", "Yes, but only on the server", "No; several Actors may share one ASC, but one Actor cannot own several", "No; Ability System Components are only allowed on Player States, never on Actors"]
        answer_index: 2
        explain: "The docs say GAS supports multiple Actors sharing a single ASC, but not one Actor with several. That would make querying and applying changes ambiguous."
      - q: "Why would you put the Ability System Component on the Player State instead of the Character?"
        choices: ["So that points, money or long cooldowns survive when the Pawn is destroyed and respawned", "Because Characters cannot have components", "To make abilities run faster", "Because Blueprints cannot access the Ability System Component of a Character, only of a Player State"]
        answer_index: 0
        explain: "The ASC page gives exactly these reasons: scores or long-lasting cooldowns that must not reset when the Pawn dies or the player possesses a new Pawn. The Actor's GetAbilitySystemComponent then returns the Player State's ASC."
      - q: "Can Gameplay Attributes and Attribute Sets be created in Blueprint?"
        choices: ["Yes, with a Blueprint Struct", "No; they must be created in native C++ code", "Yes, but only inside a Gameplay Effect asset", "Yes, using a Data Table"]
        answer_index: 1
        explain: "The Gameplay Effects page states that Attributes and Attribute Sets must be created in native code and cannot be created in Blueprints. Everything else in this quest can be Blueprint."
      - q: "An Instant Gameplay Effect changes which attribute value, and what does that mean?"
        choices: ["The Current value, so it is undone when the effect ends", "Both values by the same amount", "Neither; Instant effects only send Gameplay Cues", "The Base value, so the change is permanent"]
        answer_index: 3
        explain: "Instant Gameplay Effects modify the Base value. Any effect with a Duration affects the Current value and is undone when the effect ends."
      - q: "Jump Height has base 100. A tired debuff sets it to 70 percent. Then a level-up raises the base to 110 while the debuff is still active. What is the current value?"
        choices: ["70", "110", "77", "100"]
        answer_index: 2
        explain: "This is the example in the Attributes page: the base becomes 110, and the active 70 percent effect gives a current value of 77 as long as it remains."
      - q: "Your AttributeMetaData Data Table has MinValue 0 and MaxValue 150 for Health. What does that clamp?"
        choices: ["Nothing; those columns have no effect in the default plugin", "Health on the server only", "Health on clients only", "Health during Gameplay Effects only, not when it is set by hand"]
        answer_index: 0
        explain: "The docs say Gameplay Attributes and Attribute Sets have no built-in clamping. The MinValue and MaxValue columns are not implemented and have no effect. Clamping is done in the Attribute Set in code."
      - q: "Which Duration options does a Gameplay Effect have, and which one never enters the Active Gameplay Effects Container?"
        choices: ["Instant, Infinite, Has Duration; Instant never enters it", "Short, Medium, Long; Short never enters the container", "Instant, Periodic; Periodic never enters it", "Has Duration only; nothing enters it"]
        answer_index: 0
        explain: "Duration can be Instant, Infinite or Has Duration. Effects with a duration are added to the Active Gameplay Effects Container on the ASC. An Instant effect is Executed and never makes its way into that container."
      - q: "A Gameplay Cue for a hit spark must use a tag that starts with which prefix, and what should Cues be used for?"
        choices: ["Ability.; for gameplay-critical logic", "GameplayCue.; for cosmetic feedback only", "Effect.; for damage numbers", "State.; for blocking abilities"]
        answer_index: 1
        explain: "All Gameplay Cues must be associated with a tag starting with GameplayCue, such as GameplayCue.WaterSplash.Big. Cues do not use reliable replication, so they should be cosmetic only."
      - q: "A 'Drink Potion' ability never calls End Ability. What is the likely result?"
        choices: ["Nothing; abilities end on their own after a few seconds, and everything they block is released", "The system still thinks the character is drinking, so anything the ability blocks stays blocked", "The potion is applied twice", "The ability is removed from the ASC"]
        answer_index: 1
        explain: "Failing to end the ability makes GAS believe it is still running. The docs give exactly this potion example: the character can no longer sprint, climb or drink again, indefinitely."
      - q: "Who is allowed to give or remove abilities on an Ability System Component?"
        choices: ["Any client", "Only the owning client", "Only the server", "Only the Level Blueprint"]
        answer_index: 2
        explain: "GiveAbility and ClearAbility are server-only. The docs note that only the server can give or revoke abilities, which is why the checklist calls Give Ability on the server side."
      - q: "GA_Slam has Activation Blocked Tags = State.Stunned. What does this do?"
        choices: ["Grants the State.Stunned tag to the owner while the ability runs", "Cancels any ability tagged State.Stunned", "Requires the target to have State.Stunned", "Prevents activation while the owner has the State.Stunned tag"]
        answer_index: 3
        explain: "Activation Blocked Tags means the ability can only be activated if the activating Actor does not have any of those tags. Activation Owned Tags is the one that grants tags while running."
      - q: "For a multiplayer dash that must feel instant, which Net Execution Policy do the docs describe as running on the client immediately while the server keeps the final word?"
        choices: ["Server Only", "Server Initiated", "Local Predicted", "Local Only"]
        answer_index: 2
        explain: "Local Predicted runs the ability on the local client at once, then the server can override the result. Server Initiated adds a delay; Local Only never replicates to the server; Server Only never runs on clients."
    flavors:
      _default: {why: "GAS is the standard way big Unreal games build abilities, buffs and stats, and designers tune most of it in data."}
      gameplay_design: {why: "Once attributes and effects exist, new abilities are mostly Blueprint and Gameplay Effect assets you can iterate fast.", do: "Add a GE_Poison with Has Duration 6 s and Period 2 s and make a Gameplay Cue tag for it."}
      programming: {why: "Knowing which parts must be C++ (Attribute Sets, clamping) and which are data keeps the split clean.", do: "Override PostGameplayEffectExecute to clamp Health to 0..MaxHealth."}

  - id: GDQ36
    rank: 4
    difficulty: master
    specializations: [gameplay_design]
    subjects: [networking, replication, rpc, blueprint, multiplayer]
    required_spine: false
    required: true
    title: What the server must own
    brief: "In a multiplayer game one computer is the server, and it holds the true state of the game. The other players are clients, and they receive copies of that state, which is called replication. A mechanic only works in multiplayer when the server owns the important values, such as the score, and the clients only ask the server to act. In this quest you test with two players, make a replicated score, and send a request from a client to the server."
    time_min: 150
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/networking-overview-for-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/remote-procedure-calls-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/replicate-actor-properties-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-role-and-remote-role-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/networking-and-multiplayer-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open the Play In Editor settings. Set Number of Players to 2 and set Net Mode to Play As Listen Server. Play once and note which window is the server."
      - "Make an Actor Blueprint named BP_ScoreCrate with a Static Mesh and a Box collision. In Class Defaults, turn Replicates on. Add an Integer variable named Score and set its Replication to RepNotify. In the function OnRep_Score, which runs when the value changes, update a text render above the crate."
      - "On the Begin Overlap event of the crate, add a Switch Has Authority node. On the Authority pin, which runs only on the server, add 1 to Score. On the Remote pin, do nothing. Play with 2 players and touch the crate in the client window. Both windows must show the new number."
      - "In BP_ThirdPersonCharacter, add a Custom Event named Server_Kick and set it to Run on Server and Reliable. Make it apply an impulse to the crate, and call it from an input key. Add a second Custom Event named Multicast_KickFX, set to Multicast and Unreliable, that spawns a particle. Call it from Server_Kick."
      - "On Begin Play of the character, add a Print String that prints Get Local Role and Get Remote Role. Compare the four lines that you get across the two windows."
      - "Write 4 sentences that say which values in your crate are owned by the server, which are cosmetic (only for looks), and why the particle event is unreliable."
    done_when: "Send two screenshots. The first shows both Play In Editor windows side by side after the client touched the crate, with the same Score in both. The second shows the character graph with Server_Kick and Multicast_KickFX and their Replicates settings visible. Add your 4 sentences."
    xp: 250
    verify_type: screenshot
    quiz:
      - q: "In Unreal's client-server model, where is the multiplayer game actually played?"
        choices: ["On each client, then averaged", "On the server, which holds the one authoritative game state", "On the client with the best connection", "On whichever machine spawned the actor that is being simulated"]
        answer_index: 1
        explain: "The server holds the one true authoritative state. Clients send remote procedure calls from their local pawns, and the server replicates state back so each client simulates a close approximation."
      - q: "Which network mode has a local player who is also hosting the game for others?"
        choices: ["Dedicated Server", "Client", "Standalone", "Listen Server"]
        answer_index: 3
        explain: "A Listen Server is a server that also has a local player hosting. A Dedicated Server has no local players. Standalone has no networking but still counts as a server."
      - q: "You build all gameplay with replication in mind. What happens when the game is played single-player in Standalone mode?"
        choices: ["Replicated variables stop working", "Server RPCs are dropped", "It works with no extra work because Standalone is both server and client", "You must remove all Switch Has Authority nodes, or the Remote branch never runs"]
        answer_index: 2
        explain: "Standalone games serve as both server and client, so any logic created for multiplayer functions in single-player with no additional work. That is why the docs say to plan for multiplayer early."
      - q: "You turn Replicates on for an actor. Which of these still does NOT replicate by itself?"
        choices: ["Spawning and destroying the actor", "Location and rotation of the actor when Replicate Movement is on", "A normal Blueprint variable you did not mark as Replicated", "Creation of proxies on connected clients"]
        answer_index: 2
        explain: "Creation, destruction and movement are handled automatically, but all other gameplay data does not replicate by default. You must mark each property to replicate and any functions to run remotely."
      - q: "Which of these components or systems runs separately on every client and is not replicated even on a replicated actor?"
        choices: ["Replicated integer variables that are set only on the server", "Skeletal Mesh Components, Materials and Animation Blueprints", "The actor's owner", "Server RPC calls"]
        answer_index: 1
        explain: "The overview lists Skeletal Mesh, Static Mesh, Materials, Animation Blueprints, Particles, Sound Emitters and Physics Objects as not replicating. If the variables that drive them are replicated, each client simulates them the same way."
      - q: "In Blueprint, when does a RepNotify function on a replicated variable get called?"
        choices: ["Only on the server, every tick", "Never in Blueprint; only C++ supports RepNotify, so the function must be written in a C++ class", "When the property is replicated to a client, and also when a Set node writes it in Blueprint", "Only when the value goes to zero"]
        answer_index: 2
        explain: "A RepNotify is called on clients when the property replicates. In Blueprint a Set node on that property also calls the RepNotify automatically, but macros and functions that take the property by reference do not."
      - q: "A Server RPC is called on a client that does NOT own the actor. What happens?"
        choices: ["It runs on the server anyway", "It runs on the calling client", "It runs on the owning client", "It is dropped"]
        answer_index: 3
        explain: "A Server RPC must be called from the client that owns the actor. The RPC matrix shows: called from a client whose actor is owned by a different client, the call is Dropped."
      - q: "A NetMulticast event is called from a client. Where does it execute?"
        choices: ["On the server and all clients", "Only locally on that client", "On all other clients but not the caller", "On the owning client only"]
        answer_index: 1
        explain: "NetMulticast RPCs are designed to be called from the server. Called from a client, they only execute locally. To reach everyone, run it from the server, for example from inside a Server RPC."
      - q: "Why do the docs warn against binding Reliable RPCs directly to player input?"
        choices: ["Players can spam the key and overflow the reliable RPC queue", "Reliable RPCs cannot carry parameters", "Input cannot be read on the server", "Reliable RPCs only work on dedicated servers, not on listen servers"]
        answer_index: 0
        explain: "Reliable RPCs are re-sent until acknowledged and cost extra bandwidth. Rapid button presses can overflow the reliable queue, so limit how often input may fire an RPC, and use Unreliable for frequent calls."
      - q: "What is the primary use case the RPC page gives for RPCs, and what can an RPC never do?"
        choices: ["Saving the game; it cannot run on clients", "Transient or cosmetic events like sounds and particles; it cannot return a value", "Loading levels; it cannot carry a float", "Replacing replicated variables for all persistent state; it cannot be unreliable"]
        answer_index: 1
        explain: "RPCs are unidirectional function calls with no return value. Their primary use case is unreliable, transient gameplay events such as playing sounds, spawning particles and animations."
      - q: "In the client window, your own character prints Local Role = AutonomousProxy and Remote Role = Authority. What does that mean?"
        choices: ["This client controls the pawn and the server has authority over it", "The client has full authority, and the server is only watching it", "The pawn is not replicated", "The pawn belongs to another player"]
        answer_index: 0
        explain: "AutonomousProxy on a client means the pawn is controlled by this client; the Authority remote role is the server. Another player's pawn shows SimulatedProxy. Only the server sees ROLE_Authority for replicated actors."
      - q: "The docs list one optimization as among the most significant you can make in network gameplay. Which is it?"
        choices: ["Using more Multicast RPCs", "Making all RPCs Reliable", "Replicating every component", "Network dormancy"]
        answer_index: 3
        explain: "The Networking Tips say to make use of network dormancy, which controls whether an actor is even considered for replication on a connection. The same tips say to use as few RPCs as possible and multicast sparingly."
    flavors:
      _default: {why: "A designer who knows what the server must own can write mechanics that work in multiplayer from day one."}
      gameplay_design: {why: "Every rule you design has an owner: server for truth, client for feel and cosmetics.", do: "For your last core loop, list each variable and mark it Server, Client or Cosmetic."}
      programming: {why: "The roles and RPC matrix are the same in C++ and Blueprint, so this transfers directly.", do: "Add a WithValidation check to a server RPC and test what happens when it fails."}

  - id: GDQ37
    rank: 4
    difficulty: master
    specializations: [gameplay_design]
    subjects: [chaos, destruction, geometry-collection, fields, blueprint]
    required_spine: false
    required: true
    title: Chaos destruction as a mechanic
    brief: "Chaos is the physics system of Unreal, and Chaos Destruction lets you break objects into pieces. A mesh that can break is stored as a Geometry Collection. It breaks when the force on it, called strain, is higher than its Damage Threshold. Destruction becomes a real mechanic when it changes the state of the game and not only the picture. In this quest you make one weak wall and one strong wall, break them with a projectile, and count broken pieces to unlock a door."
    time_min: 120
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/destruction-quick-start"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/chaos-destruction-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/destruction-overview"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/geometry-collections-user-guide"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/chaos-fields-user-guide-in-unreal-engine"
    checklist:
      - "Open a project made from the First Person template with the Arena Shooter variant, or create one. The variant gives you weapons and projectiles, which the plain First Person template does not have. Place two box Static Meshes as walls. Select the first wall and switch to Fracture Mode with Shift-6. Click New under Generate, name the asset GC_Wall_Weak, and fracture it with Uniform. Do the same for the second wall, name it GC_Wall_Strong, and fracture it in two levels."
      - "In the Details of each Geometry Collection, set a Damage Threshold: 200000 for GC_Wall_Weak and 500000 for GC_Wall_Strong. Then enable Show Engine Content in the Content Browser settings and find the folder Engine > Content > EditorResources > FieldNodes."
      - "Open the projectile Blueprint of the variant, BP_ShooterProjectileBase, in Content/Variant_Shooter/Blueprints/Pickups/Projectiles. Find the place in its graph where the projectile reacts to a hit, or add Event Hit if there is none. There, use Spawn Actor to create FS_MasterField at the Hit Location. Use Set Activation Type with the value Trigger, call CE Trigger, and then add a Delay and a Destroy Actor node. Set the Strain Magnitude of the field to 400000. Epic's guide does this in BP_FirstPersonProjectile, the projectile of an older First Person template."
      - "Drag an FS_AnchorField_Generic over the base of each wall. Add it to the Initialization Fields array of the wall, so that the bottom row of pieces stays in place. Place an FS_SleepDisable_Generic on the floor and give it a high Threshold."
      - "Now make it a mechanic. On the Geometry Collection component of the wall, enable Notify Breaks and bind On Chaos Break Event. Each time it runs, add 1 to an Integer named BrokenPieces on a Game State Blueprint that you make for this level, set up so that it can be replicated later. Show the number in a small widget, and unlock a door, for example a cube that you destroy, when BrokenPieces reaches 15."
      - "Press Play, pick up a weapon in the level, and shoot the walls. One shot should crack the weak wall and leave the strong wall whole. Then add a second field setting on the projectile, with Use Decay on and Decay Amount 100000. Test how many shots the strong wall takes."
    done_when: "Send two screenshots. The first shows Play In Editor after you shot both walls, with the BrokenPieces widget visible, the weak wall broken and the strong wall still standing. The second shows the projectile graph with Spawn Actor FS_MasterField, Set Activation Type and CE Trigger. Add one sentence that says how many shots the strong wall took and which setting you changed."
    xp: 240
    verify_type: screenshot
    quiz:
      - q: "What is a Geometry Collection?"
        choices: ["A Static Mesh with LODs", "The base asset that holds the geometry and simulation properties for Chaos destruction", "A Blueprint that spawns debris meshes and adds an impulse to each one when it is hit", "A Niagara emitter for dust"]
        answer_index: 1
        explain: "Chaos Destruction uses a Geometry Collection as the base container for geometry and simulation properties. It can be built from one or more Static Meshes, Blueprints with mesh components, or other Geometry Collections, then fractured in Fracture Mode."
      - q: "How does the connection graph decide when pieces separate?"
        choices: ["Pieces separate at random after a fixed time", "Pieces separate when the actor is destroyed", "Pieces separate when the camera is close enough; each connection stores a view distance at which it breaks apart", "Each connection has a strain value; it breaks when an impulse from a collision or field exceeds that limit"]
        answer_index: 3
        explain: "At the start a connection graph is built between neighbouring rigid bodies with initial strain values. Connections break when collisions or field evaluations apply an impulse above the limit. Fields can also lower the strain values to weaken the structure."
      - q: "The quick start says the most common way to apply strain to a Geometry Collection is what?"
        choices: ["A Physics Field such as FS_MasterField", "A Radial Force Component", "Apply Damage from Blueprint", "Setting Simulate Physics on the mesh"]
        answer_index: 0
        explain: "The most common way to apply strain is a Physics Field. The quick start spawns the pre-built FS_MasterField at the projectile's impact location so the pieces break apart."
      - q: "Where do you find the pre-built Chaos Fields like FS_MasterField and FS_AnchorField_Generic?"
        choices: ["The Fab marketplace only; they must be downloaded and added to the project by hand", "Project Settings > Physics", "Engine > Content > EditorResources > FieldNodes, after enabling Show Engine Content", "The Fracture Mode toolbar"]
        answer_index: 2
        explain: "The Fields guide says to click Settings > Show Engine Content in the Content Browser, then go to Engine > Content > EditorResources > FieldNodes."
      - q: "Why does the projectile Blueprint set the field's Activation Type to Trigger and then call CE Trigger?"
        choices: ["Trigger makes the field activate only when a Blueprint tells it to, and CE Trigger fires it at once", "Trigger makes the field activate on every tick, and CE Trigger sets how strong the field is each time", "Trigger delays activation by one second", "CE Trigger destroys the field"]
        answer_index: 0
        explain: "Activation Types are Delay, OnTick, OnTickWithDelay and Trigger. Trigger means the field is activated by a Blueprint directly; the CE Trigger node immediately activates the Master Field."
      - q: "A field applies Strain Magnitude 400000. Wall A has Damage Threshold 200000, wall B has 500000. What happens?"
        choices: ["Both break", "Neither breaks", "Wall B breaks, wall A stays intact", "Wall A breaks, wall B stays intact"]
        answer_index: 3
        explain: "If the strain force is lower than the Damage Threshold, it does not cause a fracture. The Fields guide uses this exact example: the 200000 collections break and the 500000 ones remain intact."
      - q: "What does Internal Strain (decay) on a field do?"
        choices: ["Adds velocity to the pieces", "Lowers the Damage Threshold of bones inside the volume by the Decay Amount, weakening them over time", "Freezes the pieces in place", "Removes the pieces inside the volume from the simulation once they are smaller than the Decay Amount"]
        answer_index: 1
        explain: "A decay field lowers the internal Damage Threshold of the bones in its volume by the Decay Amount. This weakens a Geometry Collection gradually until external strain breaks it."
      - q: "What does an Anchor Field do, and how do you attach it to a wall?"
        choices: ["It adds gravity; drag it onto the mesh", "It sets bones inside its volume to Static; add it to the Geometry Collection's Initialization Fields array", "It plays a sound when a bone breaks; assign it in Project Settings under the Physics section of the project", "It hides pieces; set it in the material"]
        answer_index: 1
        explain: "Anchor Fields set any bone inside their volume to Static so that part stays fixed. You add the field to the Initialization Fields array in the Geometry Collection's Chaos Physics section. One anchor can serve several collections."
      - q: "What is the difference between a Sleep field, a Disable field and the Kill option?"
        choices: ["They are the same thing with different colors", "Sleep stops pieces forever; Disable only slows them; Kill respawns them", "Sleeping pieces can wake when hit; disabled pieces are removed and cannot wake; Kill ignores the threshold and removes bodies at once", "Sleep works on Static Meshes only; Disable works on Skeletal Meshes only; Kill works on both and can be undone by another field at any time"]
        answer_index: 2
        explain: "Sleeping bodies can be reawakened by an active object. Disabled bodies are removed after they rest and cannot wake. Kill ignores the Threshold value and stops and removes the body as soon as it overlaps the field."
      - q: "You raise the Threshold on a Sleep/Disable field from 2 to 200. What changes?"
        choices: ["Bodies are put to rest more aggressively", "Bodies never rest", "The field becomes an anchor", "Only the larger pieces are affected by it"]
        answer_index: 0
        explain: "The field brings bodies to rest when their velocity drops below the Threshold. Higher Threshold values stop objects more aggressively, which improves performance and reduces jitter."
      - q: "Two source meshes for a Geometry Collection overlap each other. Why is this a problem?"
        choices: ["Each piece is its own simulated object, so the solver pushes overlapping pieces apart and gives erratic results", "The editor refuses to create the collection and shows an error that lists every single pair of meshes that overlap", "The collection gets no materials", "Overlap doubles the Damage Threshold"]
        answer_index: 0
        explain: "Best practice says sources should be water tight and must not intersect. Because each piece is an individual simulated object, the Chaos solver tries to push overlapping objects away from each other, causing unpredictable results."
      - q: "After fracturing, the material slots show duplicated elements. What are the extra slots for?"
        choices: ["Debug bone colors", "LOD materials", "The internal surfaces created by the fracture", "The volume of the anchor field in the viewport"]
        answer_index: 2
        explain: "Each original material ID is duplicated to represent the internal surfaces. In the guide, Element 1 and Element 3 are the duplicates; replacing them changes how the inside of the broken pieces looks."
    flavors:
      _default: {why: "Destruction that changes the game state, not just the picture, is a real mechanic; the threshold and field numbers are your design knobs."}
      gameplay_design: {why: "Damage Threshold versus Strain Magnitude is a tuning table like any other.", do: "Put the two wall thresholds and the field strain into a Data Table and read them at Begin Play."}
      tech_art: {why: "Fields, clustering and sleep settings decide whether a destruction scene runs at frame rate.", do: "Compare frame time with and without the Sleep/Disable field on the floor."}

  - id: GDQ38
    rank: 4
    difficulty: master
    specializations: [gameplay_design]
    subjects: [capstone, data-driven, data-assets, data-tables, documentation]
    required_spine: false
    required: true
    capstone: true
    title: Data-driven system
    brief: "A data-driven system is a system where all the content and numbers are stored in data, such as Data Assets and Data Tables, and the Blueprint logic only reads that data. Another designer can then add content and tune the game without opening a graph. In this quest you build one such system, add checks that warn about bad data, and write a short guide that someone else can follow. This is a piece you can show in a portfolio."
    time_min: 480
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/data-assets-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/data-driven-gameplay-elements-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/asset-management-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Pick one system: a wave spawner, a shop economy, or an ability set. Write its goal on one page, and say what a designer should be able to change without opening a graph."
      - "Build the data layer. Make a Primary Data Asset class, for example PDA_Wave, PDA_Item or PDA_AbilityDef, and a Data Table for the numbers that change per level or per row. Give every field a tooltip and a sensible range."
      - "Build the runtime, the part that runs in the game. Make one Blueprint (BP_WaveDirector, BP_Shop, or the ability loader of the character) that reads only from the data and never from numbers typed into the graph. Register the asset type in the Asset Manager and load the assets by Primary Asset Id."
      - "Add validation. On Begin Play, check every asset and every row for mistakes such as a missing mesh, a negative cost or an empty name. Use Print String to show a clear warning that names the asset."
      - "Write a one-page file named DESIGNER_GUIDE.md. It must list every field, what it does, its safe range, and the exact steps to add a new wave, item or ability. Screenshots of graphs are not allowed in the guide."
      - "Give the guide to another person, or follow it yourself after one day, and add a third variant using only the guide. Record what was unclear and fix the guide."
      - "Record a short video clip (30 seconds or less) and take up to 6 screenshots that show the system running with all three variants. Also show one validation warning that you triggered on purpose."
    done_when: "Send your work for a mentor review: the text of DESIGNER_GUIDE.md, the short video clip, the screenshots, and your notes on what was unclear when the third variant was added from the guide. The mentor checks that a new variant can be added by following your guide, without touching a Blueprint graph."
    xp: 400
    verify_type: mentor
    quiz:
      - q: "What is a data-driven system?"
        choices: ["A system that downloads its content and numbers from the internet at startup", "A system that stores content and numbers in data that the logic only reads", "A system that writes its numbers into the graph", "A system that needs no Blueprint at all"]
        answer_index: 1
        explain: "The data lives in Data Assets and Data Tables. The logic stays the same and behaves differently because the data changes."
      - q: "What can another designer do with a data-driven system?"
        choices: ["Change the engine source code without using a compiler", "Skip the validation", "Add content and tune the game without opening a graph", "Play the game without a character"]
        answer_index: 2
        explain: "New content is a new asset or a new row. The designer never has to read or change the Blueprint logic."
      - q: "Which systems can you choose from for this quest?"
        choices: ["A wave spawner, a shop economy, or an ability set", "A lighting setup, a sky, or a fog volume", "A main menu, a pause menu, or a loading screen", "A landscape, a river, or a forest"]
        answer_index: 0
        explain: "All three are systems with many entries of the same kind: waves, items or abilities. That makes them a good fit for data."
      - q: "What does the data layer of the system consist of?"
        choices: ["A Level Blueprint and a Timeline node in it", "A Widget Blueprint and a font asset", "A GameMode and a GameState", "A Primary Data Asset class and a Data Table"]
        answer_index: 3
        explain: "The Primary Data Asset class describes one piece of content, such as a wave or an item. The Data Table holds the numbers that vary."
      - q: "What do you give every field of the data?"
        choices: ["A color and an icon", "A tooltip and a sensible range", "A password and a lock", "A random default value at start"]
        answer_index: 1
        explain: "The tooltip tells a designer what the field does. The range keeps them from entering values that break the system."
      - q: "Which rule applies to the runtime Blueprint, such as BP_WaveDirector or BP_Shop?"
        choices: ["It reads only from the data and never from numbers typed into the graph", "It stores a copy of every number in its own variables, typed in by hand", "It may only run in the editor", "It must be rebuilt for each new item"]
        answer_index: 0
        explain: "One number typed into the graph is one thing a designer cannot tune. With every value read from data, the graph never needs to change."
      - q: "How does the runtime find and load your data assets?"
        choices: ["Through the Content Browser, by the file name", "Through the Output Log, by line number", "Through the Asset Manager, by Primary Asset Id", "Through the level, by actor label"]
        answer_index: 2
        explain: "The Asset Manager knows every asset of a registered type. A new asset of that type is found by its Primary Asset Id, with no new reference in the graph."
      - q: "What does the validation do on Begin Play?"
        choices: ["It deletes every asset that has a mistake in it", "It saves all assets again", "It restarts the level", "It checks every asset and every row for mistakes"]
        answer_index: 3
        explain: "Data made by hand has mistakes. The check finds them at the start, before they show up as strange behavior in the game."
      - q: "What must a validation warning contain to be useful?"
        choices: ["A clear text that names the asset with the problem", "Only the word Warning", "The full list of all assets", "The time since the game started, in seconds and frames"]
        answer_index: 0
        explain: "The designer must know which asset to open. A warning that names the asset turns a search into a quick fix."
      - q: "What is not allowed in DESIGNER_GUIDE.md?"
        choices: ["A list of every field", "Screenshots of graphs", "The safe range of each field", "The exact steps to add new content"]
        answer_index: 1
        explain: "The guide is for people who should never need the graph. It lists the fields, what they do, their safe ranges, and the steps to add a new wave, item or ability."
      - q: "How do you test the guide?"
        choices: ["You check it for spelling mistakes", "You compare it with the guide of another learner and copy the parts that are better", "A person adds a third variant using only the guide, and you record what was unclear", "You read it once before sending it"]
        answer_index: 2
        explain: "Another person does the test, or you follow the guide yourself after one day. Whatever was unclear is fixed in the guide."
      - q: "What does the mentor check in the end?"
        choices: ["That the graph has fewer than ten nodes", "That the system has more than ten variants, each with its own Blueprint", "That the guide is longer than one page", "That a new variant can be added from your guide without touching a graph"]
        answer_index: 3
        explain: "This is the whole promise of a data-driven system. If new content needs a graph change, the system is not data-driven yet."
    flavors:
      _default: {why: "A system that anyone can tune from data is the mark of a senior designer; this is your portfolio proof."}
      gameplay_design: {why: "This is the capstone: data, runtime, validation and a doc that lets others work without you.", do: "Add one hidden field the guide does not mention and see if your tester finds it; then document it."}
      programming: {why: "Clean data boundaries make the C++ side small and stable.", do: "Move the validation into a single function library so designers can reuse it."}

  - id: GDQ39
    rank: 4
    difficulty: master
    specializations: [gameplay_design]
    subjects: [level-streaming, pacing, blueprint, levels]
    required_spine: false
    required: false
    title: Level streaming for flow
    brief: "Level streaming means that parts of the world are stored as separate levels, called sublevels, that load and unload while the game runs. One persistent level is always loaded and holds the others. Streaming is also a pacing tool, because what loads at which moment decides where the player can go next. In this quest you build a hub with two streamed sublevels, and you load them with a volume, with a Blueprint, and after a key pickup."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-streaming-overview-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-streaming-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-streaming-volumes-reference-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-streaming-using-volumes-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/loading-and-unloading-levels-using-blueprints-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a persistent level named L_Hub with a Player Start and a corridor. Create two more levels, L_Arena and L_Reward, each with a few graybox props. In L_Hub, open Window > Levels and use Add Existing to add both levels as sublevels with the streaming type Blueprint."
      - "Place a Level Streaming Volume in L_Hub that covers the corridor and the whole arena. In the Levels window, open the details of L_Arena and add the volume under Streaming Volumes. Uncheck Initially Loaded and Initially Visible. Then set the Streaming Usage of the volume to SVB Visibility Blocking on Load."
      - "Make an Actor Blueprint named BP_LevelStreamer with a Box collision and an editable Name variable called LevelToStream. When the player begins to overlap the box, call Load Stream Level with Make Visible After Load turned on. On End Overlap, call Unload Stream Level. Place one in front of the door of L_Reward and set LevelToStream to L_Reward."
      - "Now control the pacing. A level that has a streaming volume should not also be loaded from a Blueprint, so L_Reward gets no volume. In BP_LevelStreamer, add a Boolean variable named Locked that is Instance Editable, and only call Load Stream Level when Locked is false. Turn Locked on for the streamer in front of L_Reward."
      - "Make a simple key pickup in the arena: an Actor Blueprint with a mesh, a Sphere Collision and an Instance Editable reference to the streamer. When the player overlaps it, it sets Locked to false on that streamer and destroys itself. This way the reward room only starts to load after the player has the key."
      - "Test in Play In Editor, and then test again as Standalone Game. Note the difference in when the levels appear."
      - "Write 3 sentences that say where a player could see a hitch, which is a short freeze, and how you would resize a volume to hide it."
    done_when: "Send two screenshots. The first shows the Levels window with L_Hub as the persistent level, L_Arena and L_Reward as sublevels streamed by Blueprint, and the volume assigned. The second shows the BP_LevelStreamer graph with Load Stream Level and Unload Stream Level. Add your 3 sentences about hitches."
    xp: 120
    verify_type: screenshot
    quiz:
      - q: "A sublevel is set to Always Loaded. What happens to its Level Streaming Volumes and Blueprint load requests?"
        choices: ["They work as normal", "They are ignored; the level loads and shows together with the persistent level", "They only work in Standalone mode, and are ignored in Play In Editor sessions", "Only Unload requests work"]
        answer_index: 1
        explain: "Always Loaded sublevels load and become visible with the persistent level and ignore streaming volumes and any load or unload requests from Blueprint or C++. Use the Blueprint streaming type for dynamic loading."
      - q: "What position does a Level Streaming Volume test to decide whether to load a level?"
        choices: ["The player's Pawn root location", "The Player Start", "The center of the persistent level", "The active camera viewpoint"]
        answer_index: 3
        explain: "Volumes issue load requests when the player's viewpoint is inside and unload when it is outside. The docs warn that the logic tracks the active camera, so with a distant camera you may need to resize the volume."
      - q: "Where must Level Streaming Volumes be placed?"
        choices: ["In the sublevel they control", "In any level", "In the persistent level", "In a separate volumes-only level"]
        answer_index: 2
        explain: "All Level Streaming Volumes must exist in the persistent level. Volumes living in other levels cannot be used for streaming and produce warnings in map check."
      - q: "A level has a streaming volume assigned and you also call Load Stream Level on it from Blueprint. What do the docs say?"
        choices: ["Both work together, and the level loads when either one asks for it", "Blueprint wins", "Other streaming methods will not behave correctly for that level", "The volume is deleted"]
        answer_index: 2
        explain: "If a level has any streaming volumes associated with it, other methods of streaming that level will not behave correctly. Pick one method per level, or use the Disabled flag to hand control to Blueprint."
      - q: "Why is Play In Editor not a good test of streaming hitches?"
        choices: ["In PIE the levels are already in memory, so loading is just unhiding them instantly", "PIE does not support sublevels", "PIE always uses Always Loaded", "PIE runs at a lower frame rate than a packaged game, which hides every loading hitch"]
        answer_index: 0
        explain: "PIE shows where loads and unloads happen, but the levels are already in memory. The docs say to test in the standalone game on the target platform, where a load can take several seconds."
      - q: "Players see the arena pop in too late. What is the simplest fix with volume streaming?"
        choices: ["Grow the volume so the level loads sooner and unloads later", "Shrink the volume", "Set the level to Always Loaded and delete the streaming volume", "Add a second Player Start"]
        answer_index: 0
        explain: "Level loading behaviour can be changed by resizing volumes. Growing a volume causes associated levels to load sooner and unload later; shrinking causes later loads and earlier unloads."
      - q: "A player walks back and forth over a volume edge. Why does the level not unload immediately?"
        choices: ["Unloading is never automatic", "Unload requests have hysteresis, 2.0 seconds by default, set by Min Time Between Volume Unload Requests", "Loading has a delay of 2.0 seconds by default, and the level cannot unload while it is still being loaded", "The volume is disabled"]
        answer_index: 1
        explain: "Hysteresis was added to unloading to avoid needless requests; the default is 2.0 seconds and is set per streaming level. Loading has no hysteresis because a needed level should load as soon as possible."
      - q: "The docs give an example with a locked door. What is the Disabled flag on a volume used for there?"
        choices: ["To hide the door", "To remove the volume from the level for good once the door is unlocked, so that the level never unloads again", "To make the door always loaded", "To keep the level from streaming in until the door is unlocked, then toggle the volume on from Blueprint"]
        answer_index: 3
        explain: "bDisabled makes the streaming code ignore the volume without disassociating it from the level. The docs use a locked door: the level behind it should not stream until the objective unlocks the door, then Blueprint or C++ flips the flag."
      - q: "How does the Load Stream Level node identify which level to load?"
        choices: ["By a reference to the level asset", "By its name", "By its index in the Levels window", "By the Player Start inside it"]
        answer_index: 1
        explain: "The key functions are Load Stream Level and Unload Stream Level, and you designate the level to load by its name. The Blueprint tutorial promotes the Level Name pin to an editable variable."
      - q: "Which combination lets you stream several copies of the same sublevel at different transforms to build a procedural world?"
        choices: ["Get Streaming Level with Create Instance", "Two Player Starts", "Always Loaded plus World Composition tiles", "Open Level called twice"]
        answer_index: 0
        explain: "Get Streaming Level gives you the level streaming object. Combined with Create Instance you can create and stream in copies of a sublevel, apply transforms and send parameters, which the docs describe as a way to make procedural worlds."
      - q: "What is the Editor Pre Vis Only flag for?"
        choices: ["It makes the volume load levels only in packaged builds, and never while you work in the editor", "It disables the volume in the editor", "It uses the volume only for editor preview while another streaming method is used in game", "It shows the volume in the game HUD"]
        answer_index: 2
        explain: "With Editor Pre Vis Only set, the volume drives hiding and unhiding of levels in the editor viewport for previewing, while in-game streaming uses another method."
      - q: "What does the Level Streaming page say about World Composition in Unreal Engine 5?"
        choices: ["It is the recommended way to stream large worlds in 5.0 and later", "It is required for streaming volumes", "It is legacy; World Partition is recommended for 5.0 and later", "It replaced Level Streaming Volumes"]
        answer_index: 2
        explain: "World Composition is described as a legacy system. For projects using Unreal Engine 5.0 or later, the docs recommend World Partition for large-world streaming."
    flavors:
      _default: {why: "Streaming is a pacing tool: what loads when decides where the player can go and how the game breathes."}
      gameplay_design: {why: "A door that only streams after an objective is a pacing rule written in volumes.", do: "Add a third sublevel that only loads after both key and BrokenPieces goals are met."}
      level_design: {why: "Volume size and placement are level design decisions that hide load time.", do: "Measure how many seconds the reward room takes to appear in Standalone and size the volume for it."}

  - id: GDQ40
    rank: 4
    difficulty: master
    specializations: [gameplay_design]
    subjects: [mass-entity, crowds, performance, data-oriented]
    required_spine: false
    required: false
    title: Mass Entity for crowds
    brief: "An Actor is a heavy object, so hundreds or thousands of Actors moving at once can make a game slow. Mass Entity is the Unreal framework for very large numbers of simple agents, such as a crowd. It stores each agent as a light entity made only of small pieces of data, and shared logic updates all of them together. In this quest you spawn a crowd with Mass, measure the frame rate with 200 and with 1000 entities, and explain the main terms in your own words."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-mass-entity-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/mass-entity-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-mass-gameplay-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Enable the MassEntity, MassGameplay and MassCrowd plugins and restart the editor. In a level, add a large floor and a NavMeshBoundsVolume that covers a large open area."
      - "Create a Mass Entity Config asset named DA_Crowd_Walker. Add traits, which are sets of features, for collision, movement and avoidance. Also add a visualization trait that uses a low-poly Static Mesh (Instanced Static Mesh), for example a cone or a cube from the engine's basic shapes."
      - "Place a MassSpawner actor in the level. Set its Entity Types to DA_Crowd_Walker with a Count of 200. Under Spawn Data Generators, add an element and choose EQS SpawnPoints Generator. Give it an Environment Query that makes points on the nav mesh, so that the entities are spread over the open area."
      - "Press Play. Take a screenshot with stat fps and stat unit visible on screen. Then set Count to 1000 and compare the numbers."
      - "Make a second config named DA_Crowd_Runner as a child of DA_Crowd_Walker. Change only the movement speed in it. Spawn 50 of them with a second spawner."
      - "Write 5 sentences. Say in your own words what a Fragment, an Entity, an Archetype and a Processor are. Also name one case in a game where Mass would matter and one case where plain Actors are enough."
    done_when: "Send a writeup with your 5 sentences and two screenshots. The first shows the MassSpawner Details with DA_Crowd_Walker and Count 200. The second shows Play In Editor with the crowd moving and stat fps visible. Include the frame time at 200 entities and at 1000 entities."
    xp: 115
    verify_type: writeup
    quiz:
      - q: "What is a Fragment in MassEntity?"
        choices: ["An atomic piece of data such as Transform, Velocity or LOD Index", "A Blueprint function", "A piece of broken geometry that comes from a Chaos Geometry Collection", "A Niagara particle"]
        answer_index: 0
        explain: "The Fragment is MassEntity's primary data structure: an atomic piece of data used in calculations. Fragments are grouped into an Entity."
      - q: "How is an Entity built, and can its composition change at runtime?"
        choices: ["By subclassing an Actor; no", "By composing Fragments; yes, the composition can change at runtime", "By filling in a Data Table row; the row can change only in the editor", "By a Behavior Tree; no"]
        answer_index: 1
        explain: "Creating an Entity is like class instancing, but instead of declaring a class, Entities are built by Fragment composition, and that composition can be changed at runtime."
      - q: "Where does the logic live in MassEntity?"
        choices: ["Inside each Fragment, which has an update function that runs once per frame for its own Entity", "Inside each Entity", "In Processors, which are stateless classes that use EntityQuery to get batches of Fragments", "In the MassSpawner actor"]
        answer_index: 2
        explain: "Fragments and Entities are data-only and contain no logic. Processors are stateless classes that supply the processing logic and use EntityQuery to specify which Fragments they need."
      - q: "What is an Archetype and why does it matter for speed?"
        choices: ["A parent Blueprint class that all Entities inherit from, which lets the engine skip the cast for every single Entity", "The first Entity spawned", "A saved copy of the level", "A collection of Entities with identical Fragment composition, stored together in memory Chunks for fast access"]
        answer_index: 3
        explain: "An Archetype groups all Entities with the same Fragment composition, for example [Transform, Velocity]. Their data is organized in memory Chunks so retrieving Fragments of the same Archetype is fast."
      - q: "What is a Tag in MassEntity?"
        choices: ["A Gameplay Tag from the tag manager that is stored as a string on each Entity", "A string label on an Actor", "A trivial Fragment with no data, whose presence or absence is itself the data", "A name for a Chunk"]
        answer_index: 2
        explain: "A Tag is a trivial Fragment that contains no data. Whether the Tag exists on an Entity is used as information, and Tags are part of the Entity's composition."
      - q: "A Processor wants to add a Fragment to an Entity while processing it. How should it do this?"
        choices: ["Add it directly at once", "Destroy the Entity and spawn it again with the new Fragment, which the Processor can do safely in the middle of a batch", "Change the Archetype by hand", "Request the change through the MassCommandBuffer so it is batch-processed at the end of the current batch"]
        answer_index: 3
        explain: "Changing composition during processing would move the Entity between Archetypes mid-batch. Processors request the change with MassCommandBuffer, and the commands run at the end of the processing batch."
      - q: "What does EntityView provide?"
        choices: ["A debug camera", "A safe, optimized way to access data of other Entities not currently being processed", "A widget for crowds", "A list of all Archetypes in the world, sorted by the number of Entities in each one"]
        answer_index: 1
        explain: "Serial processing is most efficient, but sometimes a Processor needs another Entity. EntityView gives safe and optimized access to Entities not in the current processing queue."
      - q: "Where do Entity Templates come from, and can they inherit?"
        choices: ["From MassEntityConfig assets made in the editor; yes, a config can have a parent asset and inherit its Traits", "From Behavior Trees that are assigned to the MassSpawner; no, each tree must list all of its own Traits in full", "From the Level Blueprint; no", "From C++ only; yes"]
        answer_index: 0
        explain: "Entity Templates are generated from MassEntityConfig assets, which declare Traits added at creation. A config can have a parent asset and inherit Traits from it, which is what the DA_Crowd_Runner child uses."
      - q: "What is a Trait?"
        choices: ["A floating-point attribute on a Fragment, such as speed or health, that Processors read and write on every update of the Entity", "A collective name for the Fragments and Processors that supply one piece of functionality, such as Avoidance or Look-At", "A single Tag", "An animation notify"]
        answer_index: 1
        explain: "A Trait bundles the Fragments and Processors that give a behaviour. Each Trait instance adds and configures Fragments so the Entity shows that behaviour; examples are Avoidance, Look-At Target and using State Tree."
      - q: "Mass Representation can show an entity in four ways. Which is the cheapest?"
        choices: ["A high resolution Actor", "A low resolution Actor", "An Instanced Static Mesh", "No representation is not allowed"]
        answer_index: 2
        explain: "The four options are a high-res Actor, a low-res Actor, an Instanced Static Mesh, and no representation. The ISM is the cheapest and can be animated with vertex animation, though ISM animation is experimental."
      - q: "What does Mass LOD output for each entity, and what can you configure per level?"
        choices: ["A screen size only", "A boolean visible flag for each entity, with one view distance that is shared by all levels", "Four values High, Medium, Low and Off, with distances and a maximum entity count per level", "A texture resolution"]
        answer_index: 2
        explain: "Mass LOD produces High, Medium, Low and Off. For each level you can set the distance at which it applies and a maximum number of Entities, and it can also output a significance value from 0.0 to 3.0."
      - q: "You want your crowd to replicate custom values to clients in multiplayer. What does the Mass Gameplay page say?"
        choices: ["It works out of the box in Blueprint, in both directions, and custom values only need the Replicated flag", "Crowds cannot be replicated at all", "Use Gameplay Cues instead", "Mass Replication is experimental, one-way server to clients, and custom values need a C++ implementation"]
        answer_index: 3
        explain: "Mass Replication replicates entities from the server to clients only, is marked experimental, and requires C++ to replicate custom values. Relevancy and update frequency come from Mass Replication LOD."
    flavors:
      _default: {why: "When you need hundreds or thousands of agents, Actors are too heavy; Mass is the data-oriented tool for that scale."}
      gameplay_design: {why: "Knowing when a crowd should be Mass and when it should be Actors is a scoping decision that saves months.", do: "List three features in your game that would need a Processor and three that need a normal Actor."}
      programming: {why: "Fragments, Archetypes and Processors are the entity-component-system pattern; Mass is Unreal's version.", do: "Read one built-in Trait in the MassGameplay plugin and note which Fragments it adds."}

  - id: GDQ41
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [blueprint, character-movement, jump, game-feel]
    required_spine: false
    required: false
    title: "Variable-height jump and double jump"
    brief: "The jump is often the first thing a player tries, and its tuning sets the feel of the whole game. A variable-height jump means that a short tap gives a small jump and a long hold gives a high jump. A double jump lets the player jump one more time in the air. In this quest you set up both on a copy of the player character and tune them on a small test course."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Character/Jump"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Character/StopJumping"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Character/IsJumpProvidingForce"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Character/CanJump"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/characters-in-unreal-engine"
    checklist:
      - "Read the node page for Jump that is linked on this quest, and look up Stop Jumping, Is Jump Providing Force and Can Jump in the same Blueprint API reference."
      - "Open a project made from the Third Person template, or create one. Duplicate the player character and name the copy BP_JumpChar. Set it as the Default Pawn Class in the Game Mode of the template."
      - "In the Class Defaults of BP_JumpChar, set Jump Max Hold Time to 0.3 and Jump Max Count to 2. Make Jump Max Hold Time and Jump Z Velocity Instance Editable."
      - "In the Event Graph, call Jump from the Started pin of IA_Jump, and call Stop Jumping from its Completed pin. Test it: a short tap gives a small jump, and a long hold gives a high jump."
      - "Now add the second jump. The Jump Max Count of 2 already lets you press Jump again in the air. Add an integer variable named JumpsUsed that goes up by one on each Jump and resets to zero in Event OnLanded (Landed)."
      - "Build a small test course with three gaps of different widths and one ledge that needs a full-hold jump. Tune Jump Z Velocity, Air Control and Gravity Scale on the Character Movement component until each gap feels fair."
      - "Write your final values for Jump Z Velocity, Air Control, Gravity Scale and Jump Max Hold Time in a text box in the level."
    done_when: "Send a screenshot of the Event Graph with Jump and Stop Jumping connected to IA_Jump. Also send a screenshot of your test course with the final tuning values visible."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You want the jump height to depend on how long the player holds the key. What must you set?"
        choices: ["Jump Max Hold Time to a non-zero value", "Gravity Scale to 0 while the key is down", "Air Control to 1", "Jump Max Count to 0"]
        answer_index: 0
        explain: "The Jump page says: to jump according to the time the key is held, set JumpMaxHoldTime to a non-zero value."
      - q: "With Jump Max Hold Time set, what happens if you never call Stop Jumping when the key is released?"
        choices: ["The character will not jump at all", "The character falls through the floor, because the capsule keeps its upward velocity forever", "The character keeps receiving jump velocity until JumpKeyHoldTime reaches JumpMaxHoldTime", "The Jump node gives a compile error"]
        answer_index: 2
        explain: "Without Stop Jumping, the Z-velocity is applied until the hold time reaches Jump Max Hold Time. So a tap and a hold feel the same."
      - q: "When should you call Stop Jumping, according to the docs?"
        choices: ["Every tick while airborne", "On Event BeginPlay", "Only when the character lands, from the Event On Landed", "From an input event such as a button up (released) event"]
        answer_index: 3
        explain: "The Stop Jumping page says to call it from an input event such as a button 'up' event to stop applying jump Z-velocity."
      - q: "The Jump node is called. When does the character actually jump?"
        choices: ["Immediately inside the node", "On the next update of the character", "After Jump Max Hold Time has passed", "When the animation notify fires"]
        answer_index: 1
        explain: "The docs say Jump makes the character jump on the next update. It is a request, not an instant move."
      - q: "Is Jump Providing Force returns true when..."
        choices: ["The jump key is held and the held time is less than JumpMaxHoldTime", "The character is standing on the ground and the jump key is not pressed", "Gravity Scale is negative", "The character is crouched"]
        answer_index: 0
        explain: "Is Jump Providing Force is true while jump is actively adding force, such as when the key is held for less than Jump Max Hold Time."
      - q: "You want to block jumping while the character is stunned. Which is the documented way?"
        choices: ["Set Jump Z Velocity to 0 on every tick while stunned", "Delete the Character Movement component", "Set Jump Max Count to 1", "Implement the custom Can Jump event in the Blueprint"]
        answer_index: 3
        explain: "The Can Jump page says the default implementation may be overridden or extended by implementing the custom CanJump event in Blueprints."
      - q: "Which three components turn a Pawn into a Character?"
        choices: ["Camera, Spring Arm and Static Mesh", "Box Collision, Audio and Niagara", "CharacterMovementComponent, CapsuleComponent and SkeletalMeshComponent", "ProjectileMovementComponent, RotatingMovementComponent and TimelineComponent"]
        answer_index: 2
        explain: "The Characters page says the Pawn class is extended into the Character class by adding those three components."
      - q: "Why is the Character's collision a vertical capsule?"
        choices: ["Because it renders faster", "Because the CharacterMovementComponent assumes a vertically-oriented capsule for its movement calculations", "Because a box cannot overlap", "Because the Skeletal Mesh needs a capsule around it before any animation at all can be played on its bones"]
        answer_index: 1
        explain: "The Characters page says the CharacterMovementComponent assumes the collision component is a vertically-oriented capsule."
    flavors:
      _default: {why: "Jump is the mechanic players test in the first ten seconds. Its tuning sets the feel of the whole game."}
      gameplay_design: {why: "Variable height and a double jump change how you design every gap and ledge.", do: "Add a fourth gap that is only possible with a full hold plus a double jump, and note how many tries it took a friend."}

  - id: GDQ42
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [blueprint, character-movement, dash, timers, game-feel]
    required_spine: false
    required: false
    title: "Dash with Launch Character"
    brief: "A dash is a short, fast burst of movement in one direction. It is a small mechanic, but it changes how players dodge and how you lay out a level. In Unreal you can build it with the Launch Character node, which gives the character a sudden velocity. A cooldown, a short wait before the next dash, stops the player from using it all the time. In this quest you build a dash with a cooldown and compare a few settings."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Character/LaunchCharacter"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/variants-in-game-templates"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/SetTimerbyEvent"
    checklist:
      - "Read the Launch Character node page that is linked on this quest, and look up Set Timer by Event in the same Blueprint API reference."
      - "Open a project made from the Third Person template, or create one. Add an Input Action named IA_Dash with the value type Digital (bool). Map it to a key in IMC_Default, the asset of the template that links keys to actions."
      - "In the character Blueprint of the template, add a float DashSpeed with the value 1500, a float DashCooldown with the value 1.0, and a bool CanDash with the value true. Make DashSpeed and DashCooldown Instance Editable."
      - "From the Started pin of IA_Dash, check CanDash with a Branch. If it is true, get the Actor Forward Vector, multiply it by DashSpeed, and call Launch Character with XY Override set to true and Z Override set to false."
      - "Right after the launch, set CanDash to false. Then use Set Timer by Event with Time set to DashCooldown and Looping off, and make its event set CanDash back to true."
      - "Test three versions: XY Override on, XY Override off, and a Z value of 0 compared with 300. Write one sentence for each version about how it feels."
      - "Optional: create a second project with the Third Person Platforming variant, and compare its dash with yours."
    done_when: "Send a screenshot of the dash graph that shows Launch Character with XY Override true and the cooldown timer. Add your three one-sentence feel notes in a text box or a writeup."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Launch Character with XY Override = true does what?"
        choices: ["Adds the launch velocity on top of the current XY velocity of the Character", "Replaces the XY part of the Character's velocity instead of adding to it", "Ignores the XY part of Launch Velocity", "Rotates the character to face XY"]
        answer_index: 1
        explain: "The node page says XYOverride replaces the XY part of the velocity instead of adding to it. This gives a dash the same speed no matter how fast you were moving."
      - q: "When is the velocity from Launch Character applied?"
        choices: ["Instantly inside the node", "After the next frame of the animation has played", "When the character lands", "On the next CharacterMovementComponent tick"]
        answer_index: 3
        explain: "The page says it sets a pending launch velocity that is processed on the next CharacterMovementComponent tick."
      - q: "What movement state does Launch Character put the character into?"
        choices: ["Falling", "Walking", "Swimming", "Flying"]
        answer_index: 0
        explain: "The docs say the launch will set the character to the 'falling' state. This is why a ground dash can look like a short hop."
      - q: "Which event fires when Launch Character is called?"
        choices: ["OnLanded", "OnStartCrouch", "OnLaunched", "OnDestroyed"]
        answer_index: 2
        explain: "The page says Launch Character triggers the OnLaunched event. You can use it to play a dash sound or effect."
      - q: "You want the dash to keep the player's current jump height but replace the horizontal speed. Which settings?"
        choices: ["XY Override = false, Z Override = true", "Both true", "Both false", "XY Override = true, Z Override = false"]
        answer_index: 3
        explain: "XY Override replaces the horizontal part; Z Override false keeps the vertical velocity as it is."
      - q: "Which Third Person template variant already includes a dash mechanic and a wall jump?"
        choices: ["Platforming", "Combat", "Side Scroller", "Twin Stick"]
        answer_index: 0
        explain: "The Game Template Variants page lists Dash mechanic and Wall jump as features of the Platforming variant."
      - q: "You call Set Timer by Event again while the same timer is still running. What happens?"
        choices: ["A second timer runs in parallel", "The existing timer is reset with the updated parameters", "The node fails silently", "The first timer finishes first, then the second starts"]
        answer_index: 1
        explain: "The Set Timer by Event page says setting an existing timer resets that timer with updated parameters."
      - q: "What happens if you call Set Timer by Event with Time = 0?"
        choices: ["The event fires on every frame", "The timer loops forever", "The timer is cleared if it is set", "The editor crashes"]
        answer_index: 2
        explain: "The page says setting a timer to <= 0 seconds will clear it if it is set."
    flavors:
      _default: {why: "A dash is a small mechanic with a big effect on pacing, dodging and level layout."}
      gameplay_design: {why: "Cooldown, distance and override settings are the three dials that decide if a dash feels heavy or light.", do: "Try a dash cooldown of 0.3, 1.0 and 3.0 seconds and note which one makes players spam it."}

