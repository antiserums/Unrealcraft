      - "In BP_Target, add Event AnyDamage. Subtract Damage from Health and print Health. When Health <= 0, play a sound or an effect and then call Destroy Actor."
      - "Make a Blueprint named BP_Hazard from Actor and add a Box Collision. On overlap, call Apply Damage on the other actor with Base Damage 25, and set Damage Causer to Self."
      - "Make a Blueprint named BP_Bomb. When it overlaps the player, call Apply Radial Damage at the location of the bomb, with Base Damage 50 and Damage Radius 400."
      - "Place 3 BP_Target actors around BP_Bomb, and put one of them behind a wall. Press Play and check which targets take damage."
      - "Write 3 lines that say what Event Instigator and Damage Causer mean, and which one you passed."
    done_when: "Send a screenshot taken after the bomb goes off, with the Print String health values on screen. It must show at least one target destroyed and one target behind a wall still alive. Add your 3-line note."
    xp: 115
    verify_type: screenshot
    quiz:
      - q: "What does the Apply Damage node return?"
        choices: ["The actor that was hit", "The actual damage that ended up being applied", "The new health of the actor after the damage", "True if the actor died"]
        answer_index: 1
        explain: "Apply Damage returns a float: the actual damage that ended up being applied to the actor."
      - q: "On Apply Damage, what type of object is the Event Instigator?"
        choices: ["The Controller responsible for the damage", "The actor that exploded", "The Damage Type class", "The Static Mesh component that was hit"]
        answer_index: 0
        explain: "Event Instigator is the Controller responsible for causing the damage, such as the player who shot the weapon. Damage Causer is the actor, such as the grenade."
      - q: "Where does the Event AnyDamage event run in a networked game?"
        choices: ["On every client", "Only on the owning client", "Only on the server (authority)", "On the client that caused the damage"]
        answer_index: 2
        explain: "The node page says Authority Only: this event only fires on the server."
      - q: "Which output does Event PointDamage have that Event AnyDamage does not?"
        choices: ["Damage", "Damage Type", "Instigated By and Damage Causer", "Hit Location and Bone Name"]
        answer_index: 3
        explain: "PointDamage adds hit details such as Hit Location, Hit Normal, Hit Component, Bone Name and Shot from Direction. AnyDamage only gives Damage, Damage Type, Instigated By and Damage Causer."
      - q: "A target stands behind a wall inside the radius of Apply Radial Damage. Why does it take no damage?"
        choices: ["Radial damage only works on Characters, and the target behind the wall is a plain Actor or Pawn", "Something blocks the trace on the Damage Prevention Channel between the origin and the victim", "The wall has more health", "Radial damage only hits one actor"]
        answer_index: 1
        explain: "Damage is not applied if something between the origin and the victim blocks traces on the Damage Prevention Channel. Radial damage also only hits components that block the Visibility channel."
      - q: "Your bomb actor is also inside its own damage radius. What happens to it, per the Damage Causer description?"
        choices: ["It damages itself", "It is not damaged and does not block damage", "It takes double damage", "It blocks all the damage to the other actors"]
        answer_index: 1
        explain: "The Damage Causer actor will not be damaged and it will not block damage."
      - q: "What does Apply Radial Damage return?"
        choices: ["The number of actors that were hit by the blast", "The total damage dealt", "True if damage was applied to at least one actor", "The closest actor hit"]
        answer_index: 2
        explain: "Its Return Value is a boolean: true if damage was applied to at least one actor."
      - q: "Which node tells you what kind of damage was done, for example fire or fall damage?"
        choices: ["Damage Type Class input on Apply Damage", "Base Damage input on Apply Point Damage", "Damaged Actor input", "Hit Info output"]
        answer_index: 0
        explain: "Damage Type Class is a class that describes the damage that was done. The same class comes back on the Damage Type output of the damage events."
    flavors:
      _default: {why: "Damage and health are the base of almost every action game loop."}
      gameplay_design: {why: "Knowing the damage inputs lets you tune who gets credit, what type it is and how far it reaches.", do: "Add a second Damage Type class and make BP_Target take half damage from it."}
      programming: {why: "The Blueprint damage events map directly to TakeDamage in C++.", do: "Note in your writeup which of these events run only on the server."}

  - id: GDQ23
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [data-table, csv, struct, tuning, data-driven]
    required_spine: false
    required: true
    title: "Data Tables for tuning"
    brief: "A Data Table is an asset that works like a spreadsheet: each row has a name and holds a set of values, such as the health, speed and damage of one enemy type. When your game reads its numbers from a table, you can tune the game by changing the table and you do not need to open any Blueprint graph. In this quest you make a table of enemy stats, make an enemy read its row when the game starts, and change a value through a CSV file."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/data-driven-gameplay-elements-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/GetDataTableRow"
    checklist:
      - "Open any project, or create one from the Third Person template. Read the Data Driven Gameplay Elements page that is linked on this quest. It also describes the Get Data Table Row node."
      - "Make a Structure asset named S_EnemyStats. A Structure is a group of variables, and here it defines the columns of the table. Give it three float variables: Health, Speed and Damage."
      - "Make a Data Table named DT_Enemies and choose S_EnemyStats as its row type. Add three rows named Grunt, Runner and Tank, and give them different values."
      - "Make an Actor Blueprint named BP_Enemy with a cube mesh, three float variables named Health, Speed and Damage, and a Name variable called RowName that is Instance Editable. On Begin Play, use Get Data Table Row with DT_Enemies and RowName. From the Row Found output, break the row and set Health, Speed and Damage."
      - "From the Row Not Found output, print a red warning that includes the row name."
      - "Place 3 BP_Enemy actors in the level and give each one a different RowName value. Press Play and print the Health of each one."
      - "Export DT_Enemies to a CSV file, which is a simple text file with values separated by commas. Change one value in a text editor and reimport the file. Confirm that the value changed in the editor."
    done_when: "Send a screenshot of DT_Enemies open in the editor next to the Play In Editor print output that shows three different Health values. Add one line that names the value you changed through the CSV reimport."
    xp: 115
    verify_type: screenshot
    quiz:
      - q: "In a CSV for a Data Table, what must the first column be named?"
        choices: ["ID", "Row", "Name", "Key"]
        answer_index: 2
        explain: "The first column is expected to be named Name. It holds the names used to access each row in game."
      - q: "What does the Get Data Table Row node do when the row name does not exist?"
        choices: ["It returns a row with default values on the same pin", "It fires the Row Not Found execution pin", "It crashes the game", "It creates the row"]
        answer_index: 1
        explain: "The node has two execution outputs: Row Found and Row Not Found. Out Row is only valid when the row is found."
      - q: "Which import option makes the importer skip columns in the CSV that the row struct does not have?"
        choices: ["Ignore Missing Fields", "Import Key Field", "Ignore Extra Fields", "Reimport"]
        answer_index: 2
        explain: "Ignore Extra Fields ignores extra fields in the import data. Ignore Missing Fields is for fields the struct expects but the file lacks."
      - q: "You changed the CSV on disk. How do you update the Data Table asset?"
        choices: ["Delete the asset and import the file again with the same row struct as before", "Right-click the asset and choose Reimport; it uses the original file path", "Open the CSV in the editor", "Restart the editor"]
        answer_index: 1
        explain: "Right-click the Data Table and select Reimport. The original file path is used when reimporting."
      - q: "What is the difference between a Curve Table and a Data Table?"
        choices: ["Curve Tables only support floating point values and can be interpolated", "Curve Tables cannot be imported from CSV files and must be typed in by hand", "Data Tables can only hold text", "There is no difference"]
        answer_index: 0
        explain: "Data Curves and Curve Tables work like Data Tables but only support floating point types, and code can interpolate along a row."
      - q: "Which interpolation type clamps to the previous known X value with no blending?"
        choices: ["Linear", "Cubic", "Constant", "Rich"]
        answer_index: 2
        explain: "With Constant, Y values are not interpolated between data points; they clamp to the previous known value of X."
      - q: "Why does the docs example use a soft reference (TSoftObjectPtr) for the icon in the row struct?"
        choices: ["Soft references are faster to draw", "So the asset is lazy loaded instead of all icons loading when the table loads", "Hard references are not allowed in tables, so the import of the CSV would fail", "So the icon can be edited in Excel"]
        answer_index: 1
        explain: "A soft pointer is lazy loaded. If the field type were UTexture, all assets would be loaded whenever the Data Table was loaded."
      - q: "Why should code not cache a row struct beyond the local scope of a function?"
        choices: ["Rows are very large", "So a reimport of the table takes effect right away and no invalid pointers are used", "Blueprints cannot store structs", "Rows are deleted and created again on every frame, so a cached copy is always out of date"]
        answer_index: 1
        explain: "The page says returned structures should not be cached further than local scope, so that a refresh from reimport takes effect immediately and no invalid pointers are accessed."
    flavors:
      _default: {why: "Tuning in a table means changing numbers without touching graphs."}
      gameplay_design: {why: "Data Tables are how a designer balances a game and ships changes without engineering time.", do: "Add a fourth row and a Description text column and show it in a Print String."}
      programming: {why: "Row structs and FTableRowBase are the C++ side of the same system.", do: "Note which struct base class a C++ row type must inherit from."}

  - id: GDQ24
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [gameplay-tags, tag-container, queries, project-settings]
    required_spine: false
    required: true
    title: "Gameplay Tags"
    brief: "A Gameplay Tag is a label with a name made of words separated by dots, such as Character.Enemy.Boss. The dots form a tree, so a check for Character.Enemy can also match every tag below it. Tags give the whole project one shared set of labels and replace long lists of true or false variables. In this quest you create a small set of tags, put them on enemies, and use them to make decisions in a Blueprint."
    time_min: 55
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-gameplay-tags-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/GameplayTags/HasTag"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/GameplayTags/MatchesTag"
    checklist:
      - "Open a project made from the Third Person template, or create one. Read the Gameplay Tags page that is linked on this quest. Then open Project Settings, go to Project, then GameplayTags, and click Manage Gameplay Tags."
      - "Add these tags: Character.Enemy.Grunt, Character.Enemy.Boss, Character.Player, Status.Stunned and Status.Invisible. Give each tag a short Comment."
      - "Make an Actor Blueprint named BP_Enemy with a cube mesh and with Simulate Physics turned on, so that you can push it. If you already have an enemy Blueprint, you can use that. Add a Gameplay Tag Container variable named Tags and make it Instance Editable. A container can hold several tags. Place two enemies in the level and set the variable on each, so that one enemy is a Grunt and one is a Boss."
      - "Make a new Actor Blueprint named BP_Zone with a Box Collision. On overlap, cast Other Actor to BP_Enemy, get its Tags, and use a Has Tag node with the tag Character.Enemy and with Exact Match turned off. Print Enemy or Not enemy. Place the zone so that both enemies are inside it or can be pushed into it."
      - "Add a Gameplay Tag Query variable that matches Any of the tags Status.Stunned or Status.Invisible. Use a Does Container Match Tag Query node to check it before you apply an effect."
      - "Test it: while the game runs, give one enemy the tag Status.Stunned with an Add Gameplay Tag node. Confirm that the result of the query changes."
    done_when: "Send a screenshot of the Gameplay Tag Manager that shows your tag tree. Also send a screenshot of the Play In Editor output that shows Enemy for both the Grunt and the Boss when the check uses Character.Enemy."
    xp: 110
    verify_type: screenshot
    quiz:
      - q: "In the tag Event.Movement.Dash, which part is the broadest level of the hierarchy?"
        choices: ["Dash", "Movement", "Event", "They are equal"]
        answer_index: 2
        explain: "Tags are separated by dots. Event is the broadest identifier and Dash is the most specific."
      - q: "Which is NOT one of the three ways the docs list for defining Gameplay Tags?"
        choices: ["Adding them in Project Settings", "Importing them from a Data Table asset file", "Defining them in C++", "Typing them in a Blueprint string variable"]
        answer_index: 3
        explain: "Tags must be added to the tag dictionary through Project Settings, Data Tables (row type GameplayTagTableRow) or C++ macros. A plain string is not a defined tag."
      - q: "You edited a tag .ini source file in a text editor. What must you do to see the change?"
        choices: ["Nothing, it reloads at once", "Restart the editor", "Recompile the Blueprint", "Reimport the Data Table"]
        answer_index: 1
        explain: "You can edit the .ini files by hand, but you must restart the editor to load the changes. Data Table sources can be changed while the editor runs."
      - q: "An object needs several tags at once. Which variable type do the docs recommend?"
        choices: ["A Gameplay Tag Container", "An array of strings", "A single Gameplay Tag", "A Name variable"]
        answer_index: 0
        explain: "A Gameplay Tag Container stores multiple Gameplay Tags. You can use a single Gameplay Tag, but objects often have several tags."
      - q: "The container holds Character.Enemy.Boss. Has Tag with Character.Enemy and Exact Match false returns what?"
        choices: ["False, because the two tags are different and must match exactly", "True, because parent tags are included when Exact Match is off", "An error", "True only if the container is empty"]
        answer_index: 1
        explain: "If Exact Match is false the container includes its parent tags while matching, so Character.Enemy.Boss matches Character.Enemy."
      - q: "You call Has Any Tags with an empty Gameplay Tag Container as input. What is returned?"
        choices: ["True", "False", "It depends on the source set", "Null"]
        answer_index: 1
        explain: "Calling a conditional function with an empty container returns false, except for the All functions such as Has All Tags."
      - q: "In a Gameplay Tag Query, what does All Tags Match return when the query is empty?"
        choices: ["An error", "The same as No Tags Match: false", "False", "True"]
        answer_index: 3
        explain: "All Tags Match returns true for an empty query. No Tags Match also returns true for an empty query."
      - q: "A restricted tag was made by another team. How can it be deleted?"
        choices: ["Right-click it in the Gameplay Tag Manager and choose Delete, like any other tag", "Delete it from the Data Table", "Restart the editor", "Edit the .ini file directly; restricted tags cannot be deleted in the editor"]
        answer_index: 3
        explain: "Restricted tags cannot be deleted in the editor once created. You must edit the .ini file directly."
    flavors:
      _default: {why: "Tags replace piles of booleans with one clear, shared vocabulary."}
      gameplay_design: {why: "A good tag tree is a design document the whole team reads and uses in graphs.", do: "Write the tag tree you would use for a small shooter: 5 branches, 3 levels deep."}
      animation: {why: "Animation and ability systems use tags for states like Movement.Mode.Swimming.", do: "Add a Movement.Mode tag branch and print it when the character jumps."}

  - id: GDQ25
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [core-loop, win-lose, hud, data-table, damage, capstone]
    required_spine: false
    required: true
    capstone: true
    title: "Core loop"
    brief: "A core loop is the short cycle of actions that the player repeats through the whole game: reach a goal, face a threat, get a reward, and win or lose. A loop with a win, a loss and numbers you can tune is the smallest real game. In this quest you build one complete loop with a player, an enemy, a table of tuning numbers and a simple screen display, and you record a video of it."
    time_min: 240
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-framework-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/data-driven-gameplay-elements-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/game-mode-and-game-state-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Game/Damage/ApplyDamage"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-gameplay-tags-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Pick one verb, which is one action for the player, such as shoot, dash, throw or push. Write your loop in 5 lines: the goal, the threat, the reward, the fail state and the win state."
      - "Build BP_Player from Character with a Health variable and the verb. Build BP_Enemy so that it uses Apply Damage on the player. Both Blueprints must use Event AnyDamage to lower their health."
      - "Make a Data Table named DT_Tuning with rows for at least 5 numbers: player Health, enemy Health, enemy Damage, enemy Speed and the score needed to win. Read them with Get Data Table Row on Begin Play. Do not type any tuning numbers directly into the graphs."
      - "Give the enemies Gameplay Tags that start with Character.Enemy. Use a Has Tag node for at least one decision."
      - "Make a Game Mode named BP_CoreGameMode that keeps track of the score and the lives. When the score reaches the target, show WIN. When the player Health <= 0, show LOSE. Add an input that restarts the game."
      - "Make a widget named WBP_HUD that shows Health, Score and the score needed to win. Add it to the viewport from the Player Controller."
      - "Play 3 full runs and change one DT_Tuning row between the runs. Write 1 line that says how the feel changed. Then record a short video clip (30 seconds or less) that shows the end of one run with a win or a loss and the HUD, and take a screenshot of the other result and of the Data Table."
    done_when: "Send a short video clip (30 seconds or less) that shows a win or a loss with the HUD updating, a screenshot of the other result, and a screenshot of DT_Tuning open. Add your 5-line loop note and your 1-line tuning note. A mentor reviews your work."
    xp: 250
    verify_type: mentor
    quiz:
      - q: "What is a core loop?"
        choices: ["A Timeline that plays without end", "The first level of a game", "The short cycle of actions that the player repeats", "The event that runs on every single frame of the game"]
        answer_index: 2
        explain: "The core loop is what the player does again and again: reach a goal, face a threat, get a reward, and win or lose."
      - q: "Which five things do you write down for your loop?"
        choices: ["The goal, the threat, the reward, the fail state and the win state", "The level, the light, the sound, the camera and the menu", "The mesh, the material, the texture, the rig and the animation", "The title, the genre, the price, the platform and the date"]
        answer_index: 0
        explain: "These five lines describe the whole loop. If one of them is missing, the game has no tension or no end."
      - q: "How does damage lower health in this quest?"
        choices: ["The Data Table lowers the health on every frame", "The widget lowers the health when it is drawn", "The Game Mode lowers the health of all actors each second, whether they were hit or not", "Apply Damage sends the damage, and Event AnyDamage on the hit actor lowers its health"]
        answer_index: 3
        explain: "Apply Damage only sends an amount of damage to an actor. That actor reacts in Event AnyDamage, where both the player and the enemy lower their Health."
      - q: "How do the Blueprints get their tuning numbers?"
        choices: ["They read the numbers from the HUD", "They read the rows of DT_Tuning with Get Data Table Row on Begin Play", "They ask the player to type the numbers", "They copy the numbers from the Output Log each time the level starts"]
        answer_index: 1
        explain: "DT_Tuning holds values such as player Health and enemy Speed. Get Data Table Row reads a row, and the Blueprint stores the values when the game starts."
      - q: "Why do you not type tuning numbers directly into the graphs?"
        choices: ["Numbers in a graph are not saved", "Numbers in a graph slow down the game", "You can then tune the game from one table", "Graphs can only hold whole numbers"]
        answer_index: 2
        explain: "With all numbers in one table, tuning is fast and safe. You change a row, play again, and compare how the game feels."
      - q: "How do you mark the enemies so that your logic can recognize them?"
        choices: ["Give them Gameplay Tags that start with Character.Enemy and check with a Has Tag node", "Give them a red material and check the color", "Place them in a folder named Enemy in the Outliner", "Make their names longer than the name of the player and compare the length with a Branch"]
        answer_index: 0
        explain: "A Gameplay Tag is a label with levels, such as Character.Enemy. A Has Tag node tests for the label, so the logic does not depend on a class or a name."
      - q: "When does BP_CoreGameMode show WIN?"
        choices: ["When the player Health <= 0", "When the score reaches the target", "When the first enemy is spawned", "When the restart input is pressed"]
        answer_index: 1
        explain: "The Game Mode keeps track of the score and the lives. It shows WIN when the score reaches the target, and LOSE when the player Health <= 0."
      - q: "What does WBP_HUD show, and where is it added to the viewport?"
        choices: ["The frame rate and the memory, added from the Game Mode", "The enemy Speed and the enemy Damage from each row, added from the Data Table", "The names of all actors, added from the Level Blueprint", "Health, Score and the score needed to win, added from the Player Controller"]
        answer_index: 3
        explain: "The HUD shows the numbers the player needs to follow the loop. The Player Controller creates the widget and adds it to the viewport."
    flavors:
      _default: {why: "A loop with win, lose and numbers you can tune is the smallest real game."}
      gameplay_design: {why: "This is the portfolio piece: a loop you can hand to anyone and tune from a table.", do: "Add a second DT_Tuning row set (Easy and Hard) and pick one in the Game Mode."}
      level_design: {why: "The loop decides what the space must do.", do: "Graybox one arena that makes the loop harder in the second half."}

  - id: GDQ26
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [save-game, slots, persistence, gameplay-statics]
    required_spine: false
    required: false
    title: "Save and load"
    brief: "Players expect to close a game and come back later to the same place. In Unreal you do this with a SaveGame object, a Blueprint that only holds the values you want to keep, and you write it to a named save slot on the disk. In this quest you make a SaveGame class and add keys that save, load and delete the saved game."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/saving-and-loading-your-game-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/SaveGame"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/SaveGame/CreateSaveGameObject"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/SaveGame/DoesSaveGameExist"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/SaveGame/DeleteGameinSlot"
    checklist:
      - "Open a project made from the Third Person template, or create one. Read the page Saving and Loading Your Game that is linked on this quest (use the Blueprint tab). It shows the nodes Create Save Game Object, Does Save Game Exist and Delete Game in Slot."
      - "Make a Blueprint named BP_MySaveGame with the parent class SaveGame. Add the variables PlayerName (String), Score (Integer) and LastLocation (Vector). Also add SaveSlotName with the default value Slot1 and UserIndex with the default value 0."
      - "Open BP_ThirdPersonCharacter, or your own Player Controller if you have one. Add an Integer variable named Score and a key that adds 1 to it, so that there is a value to save. Add an event for the key F5. Call Create Save Game Object with the class BP_MySaveGame, and set the three values from the game: a name, the Score, and the location of the character. Then call Async Save Game To Slot with the slot name and the user index."
      - "Add an event for the key F9 that calls Does Save Game Exist. If the result is true, call Load Game From Slot and cast the result to BP_MySaveGame. Then move the player to LastLocation and set Score."
      - "Add an event for the key F8 that calls Delete Game in Slot, and then print the return value."
      - "Test it: move, save, move again, and load. Then find the .sav file in the Saved/SaveGames folder of your project."
    done_when: "Send a screenshot of the Saved/SaveGames folder with your .sav file in it. Also send a screenshot taken in Play In Editor after loading, where the printed Score and location match the saved values."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which parent class do you pick when you create the Blueprint for your save data?"
        choices: ["Actor", "Game Instance", "SaveGame", "Player State"]
        answer_index: 2
        explain: "Create a new Blueprint Class, expand Custom Classes in the Pick Parent Class dialog and select SaveGame."
      - q: "Why does Create Save Game Object not need a Cast To node after it?"
        choices: ["Casting is never needed in Blueprints when a node creates an object", "Its output pin changes type to match the Save Game Class input", "It returns an Actor", "It runs on the server"]
        answer_index: 1
        explain: "The node automatically changes its output pin type to match the class you pick on the Save Game Class input."
      - q: "Async Save Game To Slot has two execution output pins. When are the output values valid?"
        choices: ["From the first pin", "Both at the same time", "Only after a level restart, when the file is read again", "From the second pin, once the save operation is complete"]
        answer_index: 3
        explain: "Execution continues from the top pin immediately and from the second pin when saving is done. The outputs are not valid until the second pin has executed."
      - q: "When do the docs say the plain Save Game To Slot node is acceptable?"
        choices: ["Never", "When save data is small or you save from a menu or pause screen", "Only on consoles, where a save can never cause a hitch in the game", "Only for the first save"]
        answer_index: 1
        explain: "Async saving is recommended to avoid hitches. If data is small or you save from a menu or pause screen, Save Game To Slot is fine."
      - q: "On a development platform, where does the .sav file appear?"
        choices: ["Content/SaveGames", "Config/Saves", "The project's Saved/SaveGames folder", "The Documents/SaveGames folder of the user"]
        answer_index: 2
        explain: "Saved game files use the .sav extension and appear in the project's Saved\\SaveGames folder on development platforms."
      - q: "What do you need to give Load Game From Slot to find the right file?"
        choices: ["The slot name and user ID used when saving", "The SaveGame class and the level name only", "The file path on disk", "The level name"]
        answer_index: 0
        explain: "To load, you provide the save slot name and user ID that you used when you saved."
      - q: "Load Game From Slot returns a base SaveGame object. What must you do to read your custom variables?"
        choices: ["Nothing, the variables are already there", "Cast it to your custom SaveGame class", "Call Create Save Game Object again", "Reload the level"]
        answer_index: 1
        explain: "The engine returns a base USaveGame object. You cast it back to your custom class to access the data."
