      - q: "A Gameplay Tag Query uses the expression All Tags Match but the query has no tags. What is the result?"
        choices: ["False", "The query is invalid", "Always the same as Any Tags Match", "True"]
        answer_index: 3
        explain: "All Tags Match returns true if the query is empty. No Tags Match also returns true when empty. Any Tags Match needs at least one match."
