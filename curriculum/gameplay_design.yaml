  - id: GDQ54
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [umg, viewmodel, game-state, hud]
    required_spine: false
    required: false
    title: "HUD from the Game State with a Viewmodel"
    brief: "A Viewmodel is an object that sits between the game data and the widgets on screen. The game writes values such as the score into the Viewmodel, and the widgets update on their own when a value changes. This keeps data and visuals separate, so a designer and a programmer can each change their part without breaking the other. In this quest you make a Viewmodel for a match, fill it from the Game State, and bind a HUD to it."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/umg-viewmodel-for-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/game-mode-and-game-state-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Enable the UMG Viewmodel plugin. Create a Blueprint named VM_Match from the class MVVMViewModelBase, with an int variable Score and a float variable TimeLeft. Click the bell icon on both variables to make them FieldNotify, which means widgets are told when the value changes."
      - "Create a Blueprint named BP_MatchGameState from Game State Base. Open the Game Mode of the template and set its Game State Class to BP_MatchGameState. On BeginPlay of the Game State, construct a VM_Match object and store it in a variable named MatchVM."
      - "In the Game State, add a looping timer of 1 s that lowers TimeLeft with a Set W/Broadcast node. Add a function named AddScore that sets Score with Set W/Broadcast."
      - "Create a widget named WBP_MatchHUD with two Text widgets. Open Window > Viewmodels and add VM_Match with Creation Type set to Property Path. Give it a path that reaches Get Game State and then MatchVM. Use a helper function on the widget for this."
