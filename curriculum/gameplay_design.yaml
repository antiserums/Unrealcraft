        choices: ["It stays active in memory, because it was used at least once by an Agent before", "It is moved to the player", "It becomes a player-only object", "It does not stay active in memory, because it is not in any Persistent Collection"]
        answer_index: 3
        explain: "Runtime-spawned components are not in a Persistent Collection, so their runtime instance does not survive unloading."
