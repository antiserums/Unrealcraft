    title: "A HUD that fits every screen"
    brief: "Players use many screen sizes and shapes, from phones to wide TVs. A HUD that looks right on your monitor can be cut off on another screen. Unreal has three tools against this: anchors fix a widget to a corner or edge, DPI scaling makes the interface larger or smaller with the resolution, and the safe zone keeps widgets away from screen edges that may be hidden. In this quest you make a HUD that stays whole on very different screens."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/umg-anchors-in-unreal-engine-ui"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/dpi-scaling-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/umg-safe-zones-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open a HUD widget of your own, or create a new Widget Blueprint named WBP_HUD with a Canvas Panel, a Progress Bar as the health bar and one Text. Add a Safe Zone widget under the Canvas Panel and move your bars and text inside it. Add the widget to the viewport from the Level Blueprint with Create Widget and Add to Viewport, so that you can see it in play."
      - "Anchor the health bar to the bottom with the horizontal stretch preset, so that it grows with the viewport. Anchor a minimap Image to the bottom-right corner."
      - "Use the Screen Size button in the Designer to preview a phone in Portrait, a 4:3 monitor and a 1080p TV. Fix anything that goes outside the viewport."
      - "Open Project Settings and go to User Interface. Add a key to the DPI Curve so that the interface is larger at 720. Check that the DPI Scale Rule is Shortest Side."
      - "Set the debug title safe zone to a value less than 1: open the console with the backtick key and type r.DebugSafeZone.TitleRatio 0.9. Confirm that the red unsafe area appears and that your widgets scale to stay inside the safe area. Type the same command with the value 1 to turn it off again."
      - "Open Editor Preferences, then Level, then Play, then Game Viewport Settings, and choose a phone size. Play in a New Editor Window. Take screenshots at two very different sizes."
    done_when: "Send two screenshots of the HUD at two different screen sizes (one phone or 4:3, and one 16:9) where nothing is cut off. Also send a screenshot of the DPI Curve settings."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which Anchor values mean the upper-left corner of the Canvas Panel?"
        choices: ["Min (1,1) Max (1,1)", "Min (0,0) Max (0,0)", "Min (0.5,0.5) Max (0.5,0.5)", "Min (0,1) Max (1,0)"]
        answer_index: 1
        explain: "Min (0,0) and Max (0,0) is the upper left corner; Min (1,1) and Max (1,1) is the bottom right."
