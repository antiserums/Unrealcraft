# Unrealcraft — Gameplay Design specialization, all ranks. IDs GDQ1…
# Difficulty tiers: novice (rank 0) · apprentice (1) · adept (2) · expert (3) · master (4).
# Every URL was checked against the live UE 5.8 docs when written.

quests:
  - id: GDQ11
    rank: 0
    difficulty: novice
    specializations: [gameplay_design]
    subjects: [character-movement, tuning, blueprint]
    required_spine: false
    required: false
    taster: true
    title: "Tune the character: speed and jump"
    time_min: 30
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-09-sprint-input-action-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/third-person-template-in-unreal-engine"
    checklist:
      - "Create a Third Person template project. Open Content/ThirdPerson/Blueprints/BP_ThirdPersonCharacter."
      - "In the Components panel select the Character Movement component. Write down the current Max Walk Speed."
      - "Play. Then set Max Walk Speed to half, play again, then set it to double. Note how the level feels each time."
      - "In the same Details panel search for 'Jump'. Change the jump velocity value and test the jump on the template stairs."
      - "Pick the two values you like best. Write one line for each: what changed in the feel."
      - "Optional: add a Float variable SprintSpeed and set Max Walk Speed from it on a key press, like the tutorial."
    done_when: "Screenshot of the Character Movement details with your chosen speed and jump values, plus 2 lines on how each value changed the feel."
    xp: 30
    verify_type: screenshot
    quiz:
      - q: "Which component holds the Max Walk Speed of a Character Blueprint?"
        choices: ["The Capsule component", "The Skeletal Mesh component", "The Camera component", "The Character Movement component"]
        answer_index: 3
        explain: "The tutorial drags the Character Movement (CharMoveComp) component into the graph and reads Max Walk Speed from it."
      - q: "Why does the tutorial save Max Walk Speed into a DefaultMovementSpeed variable on Event BeginPlay?"
        choices: ["So the character can return to that speed after sprinting", "Because Max Walk Speed cannot be read later", "To make the character faster at start", "Because BeginPlay runs every frame"]
        answer_index: 0
        explain: "Saving the default speed in a variable lets the character go back to it when the sprint action ends."
      - q: "When does Event BeginPlay run?"
        choices: ["Every frame", "Once, when the game starts", "Only when the player presses a key", "Every time the character jumps"]
        answer_index: 1
        explain: "The tutorial says Event BeginPlay executes once when the game starts."
      - q: "The tutorial sets Max Walk Speed to Sprint Movement Speed on the Triggered pin. Which pin returns the default speed?"
        choices: ["Started", "Ongoing", "Completed", "Canceled"]
        answer_index: 2
        explain: "Triggered means the key is pressed; Completed means the key was released, so the speed goes back to the default."
      - q: "In the Third Person template, where is BP_ThirdPersonCharacter?"
        choices: ["Content/Characters/Mannequins", "Content/LevelPrototyping", "Content/ThirdPerson/Blueprints", "Content/Input/Actions"]
        answer_index: 2
        explain: "The template page opens Content/ThirdPerson/Blueprints and double-clicks BP_ThirdPersonCharacter."
    flavors:
      _default: {why: "Speed and jump numbers decide how a level feels before any art exists."}
      gameplay_design: {why: "Movement values are the first tuning knobs a designer owns.", do: "Write the speed you would use for a horror game and for a platformer, and say why they differ."}
      level_design: {why: "Jump height and speed set the size of gaps and rooms you can build.", do: "Measure the longest gap the character can jump with your values and note it."}

  - id: GDQ12
    rank: 0
    difficulty: novice
    specializations: [gameplay_design]
    subjects: [editor, play-in-editor, testing]
    required_spine: false
    required: false
    taster: true
    title: "Play In Editor, Simulate, Standalone"
    time_min: 25
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/playing-and-simulating-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/play-in-editor-settings-in-unreal-engine"
    checklist:
      - "Open a Third Person template project. Click Play, click in the viewport, move around, then press Shift+F1 to get the mouse back."
      - "Click Pause, then click Frame Skip a few times. Then click Eject and select an actor in the level."
      - "Change one value on that actor, right-click it and choose Keep Simulation Changes. Stop with Esc and confirm the change stayed."
      - "Press Alt+S to Simulate. Note that no player character spawns. Stop."
      - "Open the Play options (vertical ellipsis) and run the level once as New Editor Window and once as Standalone Game."
      - "Open the PIE console with the tilde key and type 'stat fps'."
    done_when: "Screenshot of the editor during Simulate (no player character) and one line naming the play mode you would use to test a menu and why."
    xp: 30
    verify_type: screenshot
    quiz:
      - q: "What is the key difference between Play In Editor and Simulate In Editor?"
        choices: ["Simulate is faster", "Play starts at the Player Start and gives you the player character; Simulate does not spawn a player or move the camera", "Simulate runs without physics", "Play cannot be paused"]
        answer_index: 1
        explain: "The page says playing always starts at the Player Start with control of the character, while simulating spawns no player and keeps the camera."
      - q: "Which keyboard shortcut starts Simulate In Editor on Windows?"
        choices: ["Alt + S", "Shift + F1", "Alt + P", "Ctrl + S"]
        answer_index: 0
        explain: "Simulate In Editor is in the Play drop-down or Alt + S (Option + S on macOS)."
      - q: "During PIE you want the mouse cursor back for the editor. What do you press?"
        choices: ["Esc", "Tilde (~)", "Shift + F1", "K"]
        answer_index: 2
        explain: "Shift + F1 gives mouse control back to the editor. Esc would stop the session."
      - q: "You changed an actor while ejected during play. How do you keep that change after you stop?"
        choices: ["Changes are always saved", "Press Ctrl + S during play", "Click Possess", "Right-click the actor and choose Keep Simulation Changes (or press K)"]
        answer_index: 3
        explain: "Changes made during play are not saved by default; Keep Simulation Changes (or K) keeps them."
      - q: "Which Play Mode runs the game outside of the editor?"
        choices: ["Selected Viewport", "New Editor Window (PIE)", "Standalone Game", "Simulate"]
        answer_index: 2
        explain: "Standalone Game launches the game in a standalone version outside the Editor. Selected Viewport is the default."
    flavors:
      _default: {why: "You will test hundreds of times; knowing the play modes saves hours."}
      gameplay_design: {why: "Tuning happens while playing; Eject and Keep Simulation Changes let you tune live.", do: "Tune one value live with Eject, keep it, and note the before/after numbers."}
      programming: {why: "Standalone and New Window catch bugs that the viewport hides.", do: "Run the same level in Standalone Game and note one difference you see."}

  - id: GDQ13
    rank: 0
    difficulty: novice
    specializations: [gameplay_design]
    subjects: [gameplay-framework, game-mode, blueprint]
    required_spine: false
    required: false
    taster: true
    title: "Read the template's game loop"
    time_min: 35
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/game-mode-and-game-state-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-a-game-mode-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-a-character-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/third-person-template-in-unreal-engine"
    checklist:
      - "Open a Third Person template project. Go to Edit > Project Settings > Maps & Modes and read the Default GameMode."
      - "Expand Selected GameMode and note the Default Pawn Class and Player Controller Class."
      - "Open the World Settings tab and find GameMode Override. Note if it is set."
      - "Create a Blueprint Class with parent Game Mode Base, name it GM_Toy. Set its Default Pawn Class to BP_ThirdPersonCharacter."
      - "Set GM_Toy as the GameMode Override in World Settings. Play to confirm the character still spawns."
      - "Draw a small diagram: Level (World Settings) -> Game Mode -> Pawn/Character and Player Controller."
    done_when: "Screenshot of World Settings with GM_Toy as GameMode Override plus your diagram (photo or image)."
    xp: 30
    verify_type: screenshot
    quiz:
      - q: "Which class defines the rules of the game, such as how players enter and whether the game can pause?"
        choices: ["Game State", "Player State", "Game Mode", "Player Controller"]
        answer_index: 2
        explain: "The page says the rules of the game make up a Game Mode; the Game State stores and syncs rule-related information."
      - q: "What does a Game Mode Blueprint let you set?"
        choices: ["Only the level name", "Default Pawn Class, HUD Class, Player Controller Class, Game State Class and more", "The project's rendering settings", "Only the Player Start location"]
        answer_index: 1
        explain: "Game Mode Blueprints set defaults like Default Pawn Class, HUD, Player Controller, Spectator, Game State and Player State classes."
      - q: "The project has a Default GameMode. How do you use a different one in only one level?"
        choices: ["Set GameMode Override in that level's World Settings", "Rename the level", "Change the Default GameMode in Project Settings", "Add a second Player Start"]
        answer_index: 0
        explain: "World Settings > GameMode Override changes the Game Mode for a single map, with higher priority than the project default."
      - q: "In a multiplayer game, where does the Game Mode instance exist?"
        choices: ["On every client", "Only on the first client", "In the Game Instance", "Only on the server"]
        answer_index: 3
        explain: "The Game Mode is not replicated; it exists only on the server. The Game State is replicated to all clients."
      - q: "What is the main job of the PlayerController in the character setup workflow?"
        choices: ["To hold the Skeletal Mesh", "To parse player input into events that drive the character", "To play animations", "To store the level geometry"]
        answer_index: 1
        explain: "The Setting Up a Character page says the PlayerController turns inputs into events, and the Character class turns those events into movement."
    flavors:
      _default: {why: "Every mechanic you add plugs into these few classes."}
      gameplay_design: {why: "Knowing who owns rules, input and body tells you where each idea goes.", do: "Write where a 'score' variable should live and why: Game Mode, Game State or Character."}
      programming: {why: "Game Mode Base is the C++ entry point for rules.", do: "Note which Game Mode functions from the page you could override in Blueprint."}

  - id: GDQ14
    rank: 1
    difficulty: apprentice
    specializations: [gameplay_design]
    subjects: [blueprint, variables, tuning]
    required_spine: true
    required: true
    title: "Variables designers can tune"
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-variables-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-02-create-a-key-in-unreal-engine"
    checklist:
      - "Create an Actor Blueprint BP_Lamp with a Point Light component and a Cube mesh."
      - "Add a Float variable Intensity and a Linear Color variable LightColor. Click the eye icon to make both Instance Editable."
      - "Set Category to 'Tuning' on both. Write a Tooltip for each. Check that the eye turns green."
      - "In the Construction Script, set the light's intensity and color from the two variables."
      - "Select Intensity and set a Slider Range (for example 0 to 5000) in the Details panel."
      - "Place three BP_Lamp instances in a level and give each a different Intensity and color from the Details panel."
      - "Add a Boolean StartOn with Expose on Spawn enabled. Compile and save."
    done_when: "Screenshot of a placed BP_Lamp instance's Details panel showing the 'Tuning' category with your two variables and a tooltip visible."
    xp: 110
    verify_type: screenshot
    quiz:
      - q: "What does the closed eye icon next to a variable mean?"
        choices: ["The variable is private and cannot be edited on instances", "The variable is hidden from the graph", "The variable is an array", "The variable is deprecated"]
        answer_index: 0
        explain: "By default the eye is closed (private). Opening it (or checking Instance Editable) makes the variable public and editable on instances."
      - q: "After you make a variable public and add a Tooltip, what happens to the eye icon?"
        choices: ["It disappears", "It turns from yellow to green", "It turns red", "It closes again"]
        answer_index: 1
        explain: "The page says the eye changes from yellow to green to show a Tooltip has been written."
      - q: "What does Expose on Spawn do?"
        choices: ["Makes the variable replicate", "Saves the variable to disk", "Makes the variable read-only", "Shows the variable as a pin on the Spawn Actor from Class node"]
        answer_index: 3
        explain: "With Expose on Spawn, the value can be set on the Spawn Actor from Class node when the Blueprint is spawned."
      - q: "What does the Category property control?"
        choices: ["The variable's type", "Where the variable appears in Class Defaults, My Blueprint and the Details tab", "Whether the variable can be replicated", "The default value"]
        answer_index: 1
        explain: "Category decides where the variable is grouped in Class Defaults, the My Blueprint tab and the Blueprint's Details tab."
      - q: "You drag a variable from My Blueprint into the graph while holding Alt. What is created?"
        choices: ["A Get node", "A Branch node", "A comment", "A Set node"]
        answer_index: 3
        explain: "Ctrl-drag creates a Get node and Alt-drag creates a Set node."
      - q: "Which variable type should hold text that the player will read and that may be translated?"
        choices: ["String", "Name", "Text", "Byte"]
        answer_index: 2
        explain: "The types table says Text is for text displayed to users that you want to localize; String is a plain group of characters."
    flavors:
      _default: {why: "A value only counts as tunable when someone can change it without opening the graph."}
      gameplay_design: {why: "Exposed, categorized, documented variables are how you hand tuning to others.", do: "Add a second category 'Debug' with one Boolean and explain why it is separate."}
      level_design: {why: "Per-instance values let one Blueprint serve many places in a level.", do: "Place 5 instances and tune each one differently in the Details panel."}
      tech_art: {why: "Construction Script plus exposed variables is the base of every art tool.", do: "Drive the cube's scale from a third exposed Float."}

  - id: GDQ15
    rank: 1
    difficulty: apprentice
    specializations: [gameplay_design]
    subjects: [blueprint, flow-control]
    required_spine: true
    required: true
    title: "Flow control: Branch, Gate, DoOnce, FlipFlop"
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/flow-control-in-unreal-engine"
    backup_url: null
    checklist:
      - "Create BP_Switch: a Box Collision and a Cube mesh. Add On Component Begin Overlap for the box."
      - "Overlap -> FlipFlop: A sets the cube material to red, B sets it to blue. Play and walk in and out."
      - "Replace the FlipFlop with DoOnce. Add a second Box Collision named ResetZone whose overlap goes into Reset."
      - "Add a Branch that checks a Boolean IsPowered before the DoOnce. Make IsPowered Instance Editable."
      - "Add a Gate: Event Tick -> Enter, ResetZone overlap -> Open, main overlap -> Close. Exit -> Print String 'tick'."
      - "Use a Sequence to print 'A' then 'B' from one overlap and watch the order in the log."
    done_when: "Screenshot of your BP_Switch event graph showing Branch, DoOnce (with Reset), FlipFlop and Gate all wired, plus one sentence on what each does."
    xp: 110
    verify_type: screenshot
    quiz:
      - q: "A DoOnce node has fired. What must happen before it fires again?"
        choices: ["Nothing, it fires on every call", "An execution pulse must go into its Reset input", "The Blueprint must be recompiled", "The Completed pin must be connected"]
        answer_index: 1
        explain: "DoOnce fires once, then stops all outgoing execution until Reset receives a pulse. It equals DoN with N = 1."
      - q: "A FlipFlop is triggered five times. Which output fires on the fifth call?"
        choices: ["A", "B", "Both", "Neither"]
        answer_index: 0
        explain: "A fires on the first and every odd call, B on every even call. The fifth call is odd, so A."
      - q: "A Gate is closed and pulses keep hitting Enter. What comes out of Exit?"
        choices: ["Every pulse", "One pulse", "Nothing", "A False value"]
        answer_index: 2
        explain: "When the gate is closed the Exit pin is nonfunctional; only an open gate passes pulses from Enter to Exit."
      - q: "What does the Toggle input on a Gate do?"
        choices: ["Resets the gate", "Sends one pulse through", "Deletes the gate", "Reverses the current state: open becomes closed and closed becomes open"]
        answer_index: 3
        explain: "Toggle reverses the current state of the gate."
      - q: "You connect three nodes to a Sequence node. How are they called?"
        choices: ["In order, with a one-frame delay between each", "In order, with no delay, so they seem to happen at the same time", "In random order", "Only the first is called"]
        answer_index: 1
        explain: "Sequence calls all outputs in order without any delay, so to a user they appear simultaneous."
      - q: "Why should you be careful with a ForLoop that runs many thousands of iterations?"
        choices: ["Loop iterations happen between frames, so large loops can hurt performance", "ForLoop can only count to 100", "It resets the Blueprint", "It only runs in Simulate mode"]
        answer_index: 0
        explain: "The page warns that loop iterations take place between frames, so large loops may incur a performance hit."
    flavors:
      _default: {why: "These four nodes are the grammar of most gameplay logic."}
      gameplay_design: {why: "Most mechanics are gates and one-time triggers dressed up.", do: "Describe one real game moment for each of the four nodes."}
      programming: {why: "Knowing the node behavior avoids re-writing them as custom logic.", do: "Note which of the nodes are macros and open one to see inside."}
      level_design: {why: "Doors, traps and checkpoints are DoOnce and Gate patterns.", do: "Build a door that opens once and can be reset by a lever."}

  - id: GDQ16
    rank: 1
    difficulty: apprentice
    specializations: [gameplay_design]
    subjects: [blueprint, timers]
    required_spine: true
    required: true
    title: "Timers and delays"
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-timers-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/SetTimerbyEvent"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/FlowControl/Delay"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/ClearandInvalidateTimerbyHandle"
    checklist:
      - "Create BP_Spawner (Actor). On Begin Play use a Delay of 2.0 then Print String 'ready'."
      - "Add a Custom Event Tick2. Use Set Timer by Event with Time 1.0 and Looping on, calling Tick2. Tick2 prints a counter."
      - "Promote the timer's Return Value to a variable TimerHandle."
      - "Add a Box Collision. On overlap, call Clear and Invalidate Timer by Handle with TimerHandle. Confirm the counter stops."
      - "Set Initial Start Delay to 3.0 and watch when the first print appears."
      - "Try calling the Delay twice quickly from a key press and note what happens the second time."
    done_when: "Screenshot of the graph with Delay, Set Timer by Event (looping) and Clear and Invalidate Timer by Handle wired, plus a screenshot of the on-screen counter."
    xp: 110
    verify_type: screenshot
    quiz:
      - q: "A Delay node is already counting down and the same node is called again. What happens?"
        choices: ["The delay restarts", "The second call is ignored", "Two delays run in parallel", "The Blueprint errors"]
        answer_index: 1
        explain: "The Delay node doc says calling it again while it is counting down is ignored."
      - q: "On Set Timer by Event, what does Looping = true do?"
        choices: ["Runs the event once after Time seconds", "Runs the event every frame", "Pauses the timer", "Keeps executing the event every Time seconds"]
        answer_index: 3
        explain: "Looping true keeps executing the delegate every Time seconds; false executes it only once."
      - q: "What does Set Timer by Event return?"
        choices: ["A Boolean", "The elapsed time", "A timer handle to pass to other timer functions", "Nothing"]
        answer_index: 2
        explain: "The Return Value is the timer handle used to manipulate this timer, for example to clear it."
      - q: "You call Set Timer with a Time of 0 on an existing timer. What is the effect?"
        choices: ["The timer fires immediately every frame", "The timer is cleared", "The timer pauses", "The time defaults to 1 second"]
        answer_index: 1
        explain: "Setting a timer to <= 0 seconds clears it if it is set; the Gameplay Timers page says the same for a rate of zero."
      - q: "An actor with a running timer is destroyed before the timer fires. What happens to the timer?"
        choices: ["It is canceled automatically and the handle becomes invalid", "It fires anyway on the Game Mode", "It crashes the game", "It restarts on the next actor"]
        answer_index: 0
        explain: "Timers are canceled automatically if the Object they would be called on is destroyed before the time is up."
      - q: "What happens to the elapsed and remaining time when a timer is paused?"
        choices: ["Both reset to zero", "Remaining time keeps counting down", "Elapsed time doubles", "They stay the same until the timer is unpaused"]
        answer_index: 3
        explain: "PauseTimer stops the function call but the elapsed and remaining times stay the same while paused."
    flavors:
      _default: {why: "Cooldowns, waves, respawns and power-ups are all timers."}
      gameplay_design: {why: "Timer numbers are tuning: cooldown lengths change the pace of play.", do: "Expose the Time value as an Instance Editable Float and tune it in the level."}
      programming: {why: "Timers replace Tick polling and are cheaper.", do: "Read the C++ example and note which Blueprint node maps to SetTimer's Looping and first delay."}

  - id: GDQ17
    rank: 1
    difficulty: apprentice
    specializations: [gameplay_design]
    subjects: [blueprint, collision, pickup]
    required_spine: true
    required: true
    title: "A pickup that changes a value"
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-02-create-a-key-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/quick-start-guide-for-blueprints-visual-scripting-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Actor/DestroyActor"
    checklist:
      - "Create an Actor Blueprint BP_Coin. Add a Capsule Collision, then add a Sphere mesh as its child. Set the mesh Collision Presets to NoCollision."
      - "Add a Rotating Movement component so the coin spins. Add an Integer variable Value = 1, Instance Editable."
      - "Open BP_ThirdPersonCharacter and add an Integer variable Score."
      - "In BP_Coin, right-click the Capsule and Add Event > On Component Begin Overlap."
      - "From Other Actor, Cast to BP_ThirdPersonCharacter. On success, Set Score = Score + Value on the character."
      - "Print String the new Score, then Delay 0.2, then Destroy Actor (target self)."
      - "Place 5 coins in the level, give one a Value of 5, play and collect them all."
    done_when: "Screenshot of the BP_Coin event graph and a screenshot of the on-screen Score after collecting all coins (should be 9 if you used 4x1 and 1x5)."
    xp: 120
    verify_type: screenshot
    quiz:
      - q: "How does the tutorial add an overlap event for the Capsule component?"
        choices: ["Right-click the component in the Components panel and choose Add Event > Add OnComponentBeginOverlap", "Add a Tick event and check distance", "Use Event BeginPlay", "Drag the component into the level"]
        answer_index: 0
        explain: "The event belongs to the collision component, so you add it from the component's Add Event menu."
      - q: "Which pin of On Component Begin Overlap tells you who touched the pickup?"
        choices: ["Target", "Other Actor", "Sweep Result", "Overlapped Component"]
        answer_index: 1
        explain: "The overlapping actor that triggered the event is passed through the Other Actor pin."
      - q: "Why does the tutorial set the key mesh to NoCollision and use a Capsule for collision instead?"
        choices: ["Meshes cannot have collision", "Capsules are the only shape that fires overlap events", "To make the key invisible", "A simple shape gives better detection and performance and stops the player bouncing off the mesh"]
        answer_index: 3
        explain: "A collision shape evens out complex geometry, improves performance, and the player collects the key without bouncing off the mesh."
      - q: "Why is there a short Delay before Destroy Actor in the key graph?"
        choices: ["Destroy Actor needs a Delay to work", "So the key disappears after a short moment and cannot be picked up again", "To let the key fall to the floor", "Delay is required after every Branch"]
        answer_index: 1
        explain: "The tutorial says the key should disappear after a short delay so it cannot be picked up again."
      - q: "In the Blueprints Quick Start, why is Cast to Character used before Launch Character?"
        choices: ["Launch Character only works on Characters, and casting checks the Pawn is one", "Casting makes the character faster", "Cast is needed for every node", "To find the Player Start"]
        answer_index: 0
        explain: "Launch Character works only on Characters, so the Pawn is cast to Character first; the cast succeeds only if it is one."
      - q: "What is the Target of the Destroy Actor node when the pickup should remove itself?"
        choices: ["The player", "The Game Mode", "Self", "The Level"]
        answer_index: 2
        explain: "The tutorial sets the Destroy Actor target to self so the key actor removes itself from the level."
    flavors:
      _default: {why: "Overlap, change a number, remove the actor: the smallest complete mechanic."}
      gameplay_design: {why: "Almost every collectible, trigger and power-up is this pattern.", do: "Make a second pickup that subtracts instead and think about where you would place it."}
      level_design: {why: "Pickups guide the player through a space.", do: "Place your coins to draw the player along one path and explain the trail."}
      programming: {why: "Casting to the player class is the first place designers create tight coupling.", do: "Note one way to avoid the cast (the tutorial uses a Blueprint Interface)."}

