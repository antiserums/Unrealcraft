  - id: GDQ87
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [multiplayer, play-in-editor, network-emulation, testing, loops]
    required_spine: false
    required: false
    title: "Play your loop with two players and a bad network"
    brief: "A game loop that works when you play alone in the editor can still fail in multiplayer. The host of a listen server is also the server, so the host sees values that other players may never receive. A slow or unstable network makes this worse. Unreal can run several players in the editor and can imitate a bad connection. In this quest you play a small round loop with two players, as a client only, and under bad network conditions, and you list what breaks."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/play-in-editor-multiplayer-options-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/game-mode-and-game-state-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. You need a small round loop with a score and a round timer. If you have none, build one. Start with a Game State Blueprint with a replicated Integer named Score and a replicated Float named TimeLeft, and a Game Mode Blueprint that uses it and lowers TimeLeft once per second with a looping timer."
      - "To finish the loop, add a pickup that adds 1 to Score when a pawn overlaps it, and a widget that shows Score and TimeLeft."
      - "Open the Play drop-down. Set Number of Players to 2 and Net Mode to Play As Listen Server. Play the loop. Note which window shows the round timer and the score correctly and which does not."
      - "Switch Net Mode to Play As Client with Number of Players set to 1, and play again. Anything that only worked because the host was also the server will now fail. List what broke."
      - "Open Editor Preferences, then Level Editor, then Play. These are the Play In settings. Enable Network Emulation, set Emulation Target to Everyone, and set Network Emulation Profile to Bad. Play with 2 players and watch the round timer and the score updates."
      - "Change the profile to Custom. Set the incoming latency, which is the delay, to 200 to 400 ms, with 5 percent packet loss. Play one more time."
      - "Open your Game Mode or Game State Blueprint. In the debug world drop-down, pick Client 1, and add a breakpoint on your score event. Confirm that the breakpoint only triggers for that world."
      - "Write 5 sentences. Say which values must come from the Game State to look the same for both players, and what looked wrong under the Bad profile. Also write one design rule that you will follow, for example to show the timer from server time and not from a local countdown."
    done_when: "Send one screenshot of the Play In settings with Network Emulation on and the Bad profile, one screenshot of both Play windows with the round timer visible, and your 5 sentences."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Number of Players is 1 and Net Mode is Play Standalone. What are you testing?"
        choices: ["A client on a dedicated server", "A listen server with no clients", "Standalone, non-networked gameplay", "Two clients in one window"]
        answer_index: 2
        explain: "With Number of Players set to 1 and Play Standalone selected, the Play In Editor session tests standalone, non-networked gameplay."
      - q: "What does Play As Client do?"
        choices: ["Makes the editor window the server and opens extra windows for the clients", "Launches a dedicated server in the background and makes the editor a client", "Disables networking", "Connects to a real online server"]
        answer_index: 1
        explain: "Play As Client creates a session that acts as a client while a dedicated server is launched in the background. The dedicated server has no display and no local player."
      - q: "The docs suggest a basic test setup for Blueprints that depend on server and client logic. Which is it?"
        choices: ["Number of Players 4, Play Standalone", "Number of Players 1, Play As Client", "Number of Players 2, Play Standalone", "Number of Players 1, Play As Listen Server"]
        answer_index: 1
        explain: "With 1 player and Play As Client you get one window that has the full functionality of a client connected to a dedicated server, which catches dedicated-server-only bugs."
      - q: "What is the trade-off of Run Under One Process?"
        choices: ["Loads much faster but is less representative of a real player's runtime", "Loads slower but is an exact copy of the runtime that a real player has", "Disables breakpoints", "Only allows one player"]
        answer_index: 0
        explain: "Run Under One Process spawns the multiplayer windows in a single engine instance. It loads much faster but is not as representative as each game instance in its own process."
      - q: "Which Emulation Targets can Network Emulation apply to?"
        choices: ["Server Only, Clients Only, or Everyone", "Only the server", "Only the first client in the PIE list", "Only packaged builds"]
        answer_index: 0
        explain: "The Emulation Target applies the emulation settings to the Server Only, Clients Only, or Everyone. The profile can be Average, Bad, or Custom."
      - q: "Which settings does the Custom network emulation profile let you set?"
        choices: ["Frame rate and resolution for each client window, plus the number of players that can connect", "Minimum and maximum latency plus a percentage of packet loss, for incoming and outgoing traffic", "Only packet loss", "Only outgoing latency"]
        answer_index: 1
        explain: "Incoming and Outgoing traffic settings add latency with minimum and maximum values, as well as a percentage amount of packet loss."
      - q: "You pick Client 1 as the debug world in a Blueprint. What happens to breakpoints?"
        choices: ["They trigger in every world", "They are disabled", "They only trigger on Actors in the server world", "They only trigger on Actors in Client 1's world"]
        answer_index: 3
        explain: "Setting the debug world to Client 1 makes breakpoints trigger only on Actors in Client 1's world. With All Worlds selected, any world can trigger them."
      - q: "How do you know which preview window is which client?"
        choices: ["By the window color", "By the mouse cursor", "By the window title, for example NetMode Client 1", "By the name of the player that the HUD shows on top"]
        answer_index: 2
        explain: "The client number is in the window title, for example a window titled with NetMode Client 1."
    flavors:
      _default: {why: "A loop that only works for the host is a loop that only works in your editor."}
      gameplay_design: {why: "Designers do not write replication, but they choose which values must be shared; bad-network tests show you which ones.", do: "Write the list of shared values for your loop and give it to a programmer."}
      programming: {why: "Network emulation is the fastest way to expose ordering bugs in your RPCs.", do: "Compare the results with Server Only against Clients Only emulation."}

  - id: GDQ88
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [game-features, modular-gameplay, plugins, components, data-asset]
    required_spine: false
    required: false
    title: "A feature in a box: Game Feature plugin with Add Components"
    brief: "A Game Feature plugin is a separate package inside your project that holds one feature, such as a double jump. When the plugin is active, it can add its own components to existing actors, so you do not have to edit the character Blueprint. You can switch the feature on or off, or move it to another project. In this quest you put a double jump into a Game Feature plugin and add it to the character with an Add Components action."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/game-features-and-modular-gameplay-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open a project made from the Third Person template, or create one. Open Edit > Plugins and enable Game Features and Modular Gameplay. Both are in the Gameplay category. Then restart the editor."
      - "In the Plugins window, click Add and choose Game Feature (Content Only). Name the plugin GF_DoubleJump. Check in the Content Browser that it is stored under /Plugins/GameFeatures/."
      - "Inside the content folder of the plugin, create a Data Asset of the class GameFeatureData. Name it GF_DoubleJump, the same name as the plugin."
      - "Inside the plugin, create an Actor Component named BPC_DoubleJump. On Begin Play, get the owner, cast it to Character, and set Jump Max Count to 2. Keep all the jump logic in the component. The character only needs one node: in BP_ThirdPersonCharacter, on Begin Play, call Add Game Framework Component Receiver with Self as the Receiver. Without this node, the character does not receive components from a Game Feature."
      - "Open the GF_DoubleJump Data Asset. In Actions, add one Add Components action. Set the Actor Class to BP_ThirdPersonCharacter, not to the base Actor class, and set the Component Class to BPC_DoubleJump. Leave Client and Server both turned on."
      - "Restart the editor one time, because the Data Asset loads at startup. Press Play and confirm that you can double jump. Then remove the action or disable the plugin, play again, and confirm that the double jump is gone."
      - "Write 3 sentences: why the component is stored in the plugin, why you chose the character class and not Actor, and what other Action type you could use for a debug cheat."
    done_when: "Send one screenshot of the GF_DoubleJump Data Asset with the Add Components action filled in, and one screenshot of the character in the air during a second jump. Add your 3 sentences."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Which two plugins must be enabled to build a standalone Game Feature?"
        choices: ["Game Features and Modular Gameplay", "Gameplay Abilities and Common UI", "Data Registry and Mass Entity", "Modular Gameplay and Online Subsystem"]
        answer_index: 0
        explain: "Enable the Game Features and Modular Gameplay plugins from the Gameplay category in Edit > Plugins, then restart the editor."
      - q: "What must you create inside the new plugin so the feature loads?"
        choices: ["A Level Blueprint in a level that is named like the plugin", "A Data Asset of class GameFeatureData, named like the plugin", "A Game Mode", "A C++ module"]
        answer_index: 1
        explain: "You create a Data Asset, choose the GameFeatureData class, and name it whatever you named the plugin. The feature then loads when the engine or editor starts."
      - q: "Where should the plugin be saved?"
        choices: ["Under /Plugins/GameFeatures/ in the project", "In the Plugins folder of the engine install", "In /Game/Blueprints", "Anywhere on disk"]
        answer_index: 0
        explain: "The docs say to make sure your plugin is saved under the /Plugins/GameFeatures/ directory within your project."
      - q: "Which Action type do the docs call the most common way to use Game Features?"
        choices: ["Add Cheats", "Add Data Registry", "Add Components", "Add World Partition Content"]
        answer_index: 2
        explain: "Add Components is the most common way to use the plugins, because Components are well suited to encapsulating a wide range of behaviors."
      - q: "You set the Actor Class of an Add Components action to the base Actor class. What happens?"
        choices: ["Every actor in the game gets the component, including lights and volumes", "That part of the action is ignored; use the narrowest subclass instead", "The editor crashes", "Only pawns get the component"]
        answer_index: 1
        explain: "Using the base Actor class is unsupported and the system ignores that part of the Action. Identify the narrowest set of Actor subclasses that need the component."
      - q: "Two unrelated classes both need the component and share no common parent. What do you do?"
        choices: ["Target the Actor class", "Set up multiple Add Components actions, one per base class", "Give up; it is not possible", "Add the component to the Game Mode and share it from there"]
        answer_index: 1
        explain: "If multiple classes should receive the Component and they do not have a common parent, you set up multiple Add Components Actions to cover each base class."
      - q: "By default, on which machines does Add Components add the component?"
        choices: ["Clients only", "Servers only", "Both clients and servers", "Only the listen server"]
        answer_index: 2
        explain: "You can specify whether Components are added on clients, servers, or both; by default they are added in both cases."
      - q: "You created a new GameFeatureData asset and added actions, but nothing happens in Play. What is the likely fix?"
        choices: ["Restart the editor once, because GameFeatureData assets load at editor startup", "Delete the plugin", "Move the asset to /Game, because assets inside plugin folders are never loaded", "Rename the actions"]
        answer_index: 0
        explain: "GameFeatureData Assets load during editor startup, so you may need to restart once after first creating the Asset. Later updates do not need a restart."
    flavors:
      _default: {why: "Features that live in their own plugin can be switched on, off or moved to another project without touching the character."}
      gameplay_design: {why: "Modes and seasonal mechanics are cleaner as Game Features than as branches in the character Blueprint.", do: "Make a second feature GF_Sprint with its own component and Add Components action."}
