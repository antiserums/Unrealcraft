    checklist:
      - "Make two small maps L_Arena_A and L_Arena_B, both using BP_GM_Rounds (World Settings > GameMode Override). Put a different colored floor in each so you can tell them apart."
      - "Make an almost empty map L_Transition (a floor only). In Project Settings > Maps & Modes set Transition Map to L_Transition."
      - "In BP_GM_Rounds Class Defaults turn on Use Seamless Travel."
      - "At the end of a round (your End Match key or timer), run a server travel to the other map. In Blueprint use Execute Console Command with servertravel L_Arena_B (or ask a programmer to expose ServerTravel). Do it only from the server."
      - "Play with 2 players as Listen Server. Trigger the travel. Both windows must arrive in L_Arena_B and the client must stay connected (no reconnect)."
      - "Now turn Use Seamless Travel off, play again, and describe the difference you see for the client window."
      - "Write 3 sentences: which travel type you used, why the transition map exists, and one thing that persisted across the travel."
    done_when: "One screenshot of both Play windows in L_Arena_B after a seamless travel, one of the Maps & Modes Transition Map setting, and your 3 sentences."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the main difference between seamless and non-seamless travel?"
        choices: ["Seamless is only for single player", "Seamless is non-blocking; non-seamless is a blocking call", "Non-seamless keeps the client connected", "Seamless needs a dedicated server"]
        answer_index: 1
        explain: "Seamless travel is a non-blocking operation, while non-seamless travel is a blocking call. Epic recommends seamless travel when possible for a smoother experience."
      - q: "During a non-seamless travel, what does the client do?"
        choices: ["It stays connected and streams the map", "It becomes the new server", "It loads the transition map", "It disconnects from the server and then reconnects to the same server"]
        answer_index: 3
        explain: "In a non-seamless travel the client disconnects from the server and then reconnects to the same server, which will have the new map ready to load."
      - q: "Which of these must be a non-seamless travel?"
        choices: ["Moving from round 2 to round 3", "Connecting to a server for the first time as a client", "Returning to the same map", "Any travel on a listen server"]
        answer_index: 1
        explain: "The three cases that must be non-seamless are: loading a map for the first time, connecting to a server for the first time as a client, and ending a multiplayer game to start a new one."
      - q: "Which function is the normal way a multiplayer game moves everyone from map to map?"
        choices: ["UEngine::Browse on each client", "APlayerController::ClientTravel called by a client", "UWorld::ServerTravel called on the server; all clients follow", "OpenLevel on every client"]
        answer_index: 2
        explain: "ServerTravel is for the server only. It jumps the server to the new level, all connected clients follow, and the server calls ClientTravel for each client."
      - q: "ClientTravel is called on a client. What does it do?"
        choices: ["Travels that client to a new server", "Moves the whole server to a new map", "Restarts the match", "Does nothing on clients"]
        answer_index: 0
        explain: "If called from a client, ClientTravel travels to a new server. If called from the server, it tells that one client to travel to the new map while staying connected."
      - q: "Why does seamless travel use a transition map?"
        choices: ["Because a world must always be loaded, and holding two big maps at once would cost too much memory", "To show a loading video", "To save the game", "Because clients cannot load maps directly"]
        answer_index: 0
        explain: "There must always be a world loaded, so the old map cannot be freed before the new one loads. A small transition map overlaps with them cheaply instead of two big maps."
      - q: "You leave the Transition Map setting empty and enable seamless travel. What happens?"
        choices: ["Seamless travel is disabled", "An empty map is created and used as the transition map", "The current map is reused", "The game crashes on travel"]
        answer_index: 1
        explain: "UGameMapsSettings::TransitionMap is empty by default. If the game leaves it empty, an empty map is created for the transition map."
      - q: "Which of these persists automatically across a seamless travel, by default?"
        choices: ["All static mesh actors", "Every enemy pawn", "The Game Mode actor on the server and the Player Controllers", "The old level's lighting"]
        answer_index: 2
        explain: "By default the Game Mode (server only), Controllers with a valid Player State (server only), all Player Controllers (server only) and local Player Controllers (server and client) persist."
