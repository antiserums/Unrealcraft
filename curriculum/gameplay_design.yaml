        choices: ["Longest Side", "Horizontal", "Vertical", "Shortest Side"]
        answer_index: 3
        explain: "Shortest Side evaluates the scale curve on the shortest side of the viewport and is the most common setting."
      - q: "Where do you change the Application Scale and DPI Curve?"
        choices: ["Project Settings > User Interface", "Each Widget Blueprint's Details panel", "The Level Blueprint", "Editor Preferences > Appearance"]
        answer_index: 0
        explain: "DPI scaling is configured in Project Settings under the User Interface section."
