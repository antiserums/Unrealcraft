      - q: "Where do your own widgets appear in the Palette of another Widget Blueprint?"
        choices: ["Under Common", "Under Panel", "Under Special Effects", "Under User Created"]
        answer_index: 3
        explain: "Custom User Widgets are listed in the Palette under User Created."
      - q: "What does the page do with the Normal image style after setting it?"
