        explain: "The Movement Components page says it updates the position of another component during its tick. Bouncing and homing are supported."
      - q: "Which behaviours does the docs list as supported by Projectile Movement?"
        choices: ["Swimming and flying", "Crouching under cover and sprinting toward a target", "Bouncing after impacts and homing toward a target", "Splines and timelines"]
        answer_index: 2
        explain: "The page says behaviour such as bouncing after impacts and homing toward a target are supported."
      - q: "By default, which component does Projectile Movement move?"
        choices: ["The root component of the owning actor", "The first Static Mesh found on the actor", "The camera", "All components at once"]
        answer_index: 0
        explain: "The page says normally the root component of the owning actor is moved, though another component may be selected with SetUpdatedComponent."
      - q: "Your projectile root is a sphere with Simulate Physics on. What does the docs say happens?"
        choices: ["Homing still works fully, and the projectile keeps steering toward its target while it bounces", "The projectile never moves", "Gravity is ignored", "Only the initial launch parameters affect it, then the physics simulation takes over"]
        answer_index: 3
        explain: "The page says if the updated component is simulating physics, only the initial launch parameters (with non-zero initial velocity) affect the projectile; physics takes over from there."
      - q: "In the Arena Shooter variant, what do projectiles do when they hit a physics-enabled actor?"
        choices: ["They apply a physics impulse to it", "They heal it", "They attach to it and stay in place", "They teleport it"]
        answer_index: 0
        explain: "The First Person Template page says projectiles are spawned on left-click and apply a physics impulse to any physics-enabled actor they collide with."
