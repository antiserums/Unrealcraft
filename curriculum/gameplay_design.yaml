      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/GetAudioTimeSeconds"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/SetTimerbyEvent"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/FlowControl/Delay"
    checklist:
      - "In a Third Person project, make BP_Dummy: a Static Mesh with a Box Collision. In BP_ThirdPersonCharacter, add a punch key event that does a Sphere Trace forward (radius 60, length 150) and finds a BP_Dummy."
      - "Make a custom event HitStop with a Float input Duration. It calls Set Global Time Dilation with 0.05, then Set Timer by Event with Time = Duration and Looping off. The timer event calls Set Global Time Dilation with 1.0."
      - "Before the hit stop starts, store Get Real Time Seconds in a variable. When time returns to 1.0, print Get Real Time Seconds minus the stored value. Test Duration 0.1 and see how many real seconds the stop lasted. Write down the number."
      - "Print Get Time Seconds, Get Unpaused Time Seconds, Get Audio Time Seconds, and Get Real Time Seconds on the same tick during the hit stop. Note which ones move slowly and which ones do not."
      - "Add a Get Global Time Dilation check at the start of HitStop: if the value is not 1.0, do nothing. This stops a second hit from breaking the first stop."
      - "Add a Delay of 0.1 after the punch that spawns a small debug text. Compare how long the Delay waits during the hit stop against the timer. Write 2 sentences about what you measured."
    done_when: "One screenshot of the HitStop event graph with Set Global Time Dilation, Set Timer by Event, and the Get Global Time Dilation guard. Plus your measured numbers: the real seconds a 0.1 hit stop lasted, and which time nodes were slowed."
    xp: 60
    verify_type: writeup
    quiz:
      - q: "Which object is the Target of the Set Global Time Dilation node?"
        choices: ["The Player Controller", "The Game Instance", "The World Settings actor", "Gameplay Statics"]
        answer_index: 3
        explain: "The node reference says Target is Gameplay Statics. It is a static library function, so you can call it from any Blueprint without a reference."
      - q: "You need a stopwatch that ignores your hit stop and also keeps running while the game is paused. Which node?"
        choices: ["Get Time Seconds", "Get Real Time Seconds", "Get Audio Time Seconds", "Get World Delta Seconds"]
        answer_index: 1
        explain: "Get Real Time Seconds returns time since the world started for play, is NOT dilated or clamped, and does NOT stop when the game pauses."
      - q: "Get Time Seconds and Get Unpaused Time Seconds are both adjusted by time dilation. What is the difference?"
        choices: ["Get Time Seconds stops on pause; Get Unpaused Time Seconds does not", "Get Time Seconds counts from level load; the other counts from engine start", "Get Time Seconds is in milliseconds", "There is no difference"]
        answer_index: 0
        explain: "Both are adjusted by time dilation. Get Time Seconds IS stopped when the game pauses, and Get Unpaused Time Seconds IS NOT stopped when the game pauses."
      - q: "Which time node is stopped by pause but NOT affected by time dilation?"
        choices: ["Get Audio Time Seconds", "Get Unpaused Time Seconds", "Get Real Time Seconds", "Get Global Time Dilation"]
        answer_index: 0
        explain: "Get Audio Time Seconds returns time since the world started for play, IS stopped when the game pauses, and is NOT dilated or clamped."
      - q: "During the hit stop, movement in Event Tick that uses Get World Delta Seconds slows down. Why?"
        choices: ["Event Tick stops firing at low dilation", "Get World Delta Seconds returns the frame delta adjusted by time dilation", "The physics engine pauses", "Delta seconds is clamped to 0 below dilation 0.1"]
        answer_index: 1
        explain: "Get World Delta Seconds returns the frame delta time in seconds, adjusted by time dilation. Movement that multiplies by delta seconds therefore slows down with the world."
      - q: "You call Set Timer by Event with the same event twice while the first timer is still running. What happens?"
        choices: ["Two timers now run in parallel", "The second call is ignored", "The existing timer is reset with the updated parameters", "The engine logs an error and clears both"]
        answer_index: 2
        explain: "The node reference says setting an existing timer will reset that timer with updated parameters."
      - q: "What does passing Time <= 0 to Set Timer by Event do?"
        choices: ["Fires the event every frame", "Fires the event once immediately", "Sets the timer to loop forever", "Clears the timer if it is set"]
        answer_index: 3
        explain: "Setting a timer to <= 0 seconds will clear it if it is set. Use this to cancel a timer through the same node."
      - q: "A Delay node is counting down and the same execution path calls it again. What happens per the docs?"
        choices: ["The delay restarts from the new Duration", "The second call is ignored", "Both delays complete, firing Completed twice", "The delay finishes immediately"]
        answer_index: 1
        explain: "Delay is a latent action, and calling it again while it is counting down will be ignored. Use Retriggerable Delay if you want a restart."
    flavors:
      _default: {why: "A few frames of frozen time is what makes a hit feel like it lands."}
      gameplay_design: {why: "Hit stop is a tuning number. Knowing which clocks are dilated keeps UI, timers, and combos honest.", do: "Try Duration 0.05, 0.1, and 0.2 and write which one felt best and why."}
      programming: {why: "Time dilation touches every system that uses delta time. You need to know what still runs at full speed.", do: "Make a UMG timer widget that uses Get Real Time Seconds so it does not freeze during the hit stop."}

  - id: GDQ75
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [force-feedback, gamepad, game-feel, blueprint]
    required_spine: false
    required: false
    title: "Controller rumble that matches the hit"
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/force-feedback-in-unreal-engine"
    backup_url: null
    checklist:
      - "In the Content Browser, click Add and choose Input > Force Feedback Effect. Name it FF_HitLight. In its one channel enable only Affects Right Small. Shift+click on the curve to add keys: (0, 1.0) and (0.15, 0)."
      - "Make FF_Explosion with two channels. Channel 0: Affects Left Large, keys (0, 1.0), (0.4, 0.6), (0.8, 0). Channel 1: Affects Right Small, keys (0, 0), (0.1, 0.8), (0.3, 0). Hover the asset icon and press the play button to preview each with a gamepad connected."
      - "In BP_ThirdPersonCharacter, on your punch event, call Get Player Controller then Client Play Force Feedback with FF_HitLight. Give it the Tag Hit."
      - "Make BP_ExplosiveBarrel. On Begin Overlap with the player, call Spawn Force Feedback at Location with FF_Explosion at the barrel location and Auto Destroy on. Give it an attenuation asset so the rumble gets weaker with distance."
      - "Add a looping test: a key that calls Client Play Force Feedback with Looping on and Tag Engine, and another key that calls Client Stop Force Feedback with the same Tag. Confirm the loop stops."
      - "Write 2 sentences: which motors you used for the light hit versus the explosion, and why."
    done_when: "Two screenshots: (1) FF_Explosion open, showing both channels and their curves; (2) the graph with Client Play Force Feedback (Tag set) and Spawn Force Feedback at Location. Add your 2 sentences about motor choice."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "A Force Feedback Effect has 3 channels whose last curve keys are at 1.25, 1.5, and 1.75 seconds. What is the duration of the effect?"
        choices: ["1.25 seconds", "1.5 seconds", "1.75 seconds", "4.5 seconds"]
        answer_index: 2
        explain: "Duration is calculated automatically from the position of the last key in the curves of all channels. The furthest key, 1.75, sets the overall duration."
      - q: "Where in the Content Browser do you create a Force Feedback Effect asset?"
        choices: ["Add > Input > Force Feedback Effect", "Add > Audio > Force Feedback", "Add > Blueprint Class > ForceFeedback", "Add > Miscellaneous > Data Asset"]
        answer_index: 0
        explain: "The docs say to click Add and choose Input > Force Feedback Effect. By default the asset has one channel and you can add more."
      - q: "What does a curve value below 0.0 do on a force feedback channel?"
        choices: ["Reverses the motor direction", "Vibrates at maximum strength", "Pulses the motor on and off", "Causes no vibration"]
        answer_index: 3
        explain: "The curve controls intensity over time. Values above 0.0 cause vibration; values below 0.0 do not cause vibration."
      - q: "Which class implements playing Force Feedback, so you need a reference to it in Blueprint?"
        choices: ["Game Mode", "Player Controller", "Character Movement Component", "Game Instance"]
        answer_index: 1
        explain: "Force Feedback is implemented in the base PlayerController class. In Blueprint you get the Player Controller and call Client Play Force Feedback on it."
      - q: "You play an effect with the Tag Hit while another effect with Tag Hit is already playing. What happens?"
        choices: ["Both play together", "The new one waits in a queue", "The old one stops and the new one plays", "The new one is ignored"]
        answer_index: 2
        explain: "If an effect with the same name is already playing, it is stopped and the new effect plays instead. The Tag also lets you stop the effect later."
      - q: "You call Client Play Force Feedback on the server for a player. What does the docs say happens?"
        choices: ["Nothing; force feedback only works on clients", "It is replicated to the owning client", "It plays on every connected client", "It plays on the server machine only"]
        answer_index: 1
        explain: "The docs state the force feedback will be replicated to the owning client if called on the server."
      - q: "You want the rumble to get weaker as the player walks away from an explosion. What is the intended tool?"
        choices: ["A Force Feedback Component at a world location with an attenuation setting", "Lowering the curve keys by hand per distance", "A second channel with Affects Left Small", "Per Device Overrides"]
        answer_index: 0
        explain: "A Force Feedback Component has a location in the world, and like sound or light its intensity changes with the player's distance according to a data-defined attenuation setting. Spawn Force Feedback at Location and Spawn Force Feedback Attached create one."
      - q: "What are Per Device Overrides for?"
        choices: ["Setting a different curve per player", "Mapping each channel to a keyboard key", "Turning rumble off in the editor", "Setting different feedback settings for each platform"]
        answer_index: 3
        explain: "Each platform implements vibration differently. Per Device Overrides let you set different feedback settings per platform, for example strong on Xbox and more nuanced on PlayStation."
    flavors:
      _default: {why: "Rumble is feedback the player feels in the hand. It sells weight without any pixels."}
      gameplay_design: {why: "You will tune rumble like any other feedback: strength, length, and which motor.", do: "Make a third effect FF_LowHealth that loops softly and stop it when health goes above 30."}
      programming: {why: "Rumble replication and tags are gameplay code details you will own later.", do: "Call the same effect from C++ with ClientPlayForceFeedback and compare the parameters."}

  - id: GDQ76
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [audio, sound-cue, metasounds, feedback]
    required_spine: false
    required: false
    title: "Hit sounds that never repeat the same way"
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/sound-cue-reference-for-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/metasounds-quick-start"
    checklist:
      - "Import or pick three short impact Sound Waves (Starter Content has some). Create a Sound Cue named SC_Hit. Add a Random node with the three waves as inputs. Set the Weights so one wave is chosen twice as often."
      - "Add a Modulator node after the Random node. Set Pitch Min 0.9, Pitch Max 1.1, Volume Min 0.8, Volume Max 1.0. Connect it to the Output node."
      - "Add a Switch node before the Output with Int Parameter Name = Surface. Input 0 = your SC_Hit chain, input 1 = a different wave for metal. In Blueprint, play the cue with Spawn Sound at Location, then call Set Integer Parameter with In Name Surface on the returned Audio Component."
      - "On the Output node, enable Override Concurrency and set Max Count to 3. Trigger the hit 10 times fast and listen to the difference against Max Count 1."
      - "Make a MetaSound Source MSS_Hit that plays a Wave Player when a Trigger Input named Impact fires. In Blueprint use Spawn Sound Attached and Execute Trigger Parameter with In Name Impact."
      - "Write 3 sentences: what the Random, Modulator, and Switch nodes each changed in how the hit sounds."
    done_when: "Two screenshots: (1) SC_Hit graph with Random, Modulator, Switch, and Output nodes visible; (2) the Blueprint graph that plays the cue and calls Set Integer Parameter with the Surface name. Add your 3 sentences."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You put a Modulator node before a Looping node. When does the pitch get re-randomized?"
        choices: ["On every loop", "Once per Sound Cue trigger, not per loop", "Never, the Modulator only sets a fixed pitch", "Only when a named parameter changes"]
        answer_index: 1
        explain: "The docs say if the Modulator node is used with the Looping node, it randomizes on each Sound Cue trigger and not on each individual loop."
      - q: "A Switch node picks an input by a runtime integer. Which Blueprint function sets that value?"
        choices: ["Set Boolean Parameter", "Set Float Parameter", "Set Integer Parameter", "Set Wave Parameter"]
        answer_index: 2
        explain: "The named-parameter table maps the Switch node to Set Integer Parameter. Branch uses Set Boolean Parameter and Continuous Modulator uses Set Float Parameter."
      - q: "You added a Branch node with Bool Parameter Name Armored but never called Set Boolean Parameter. Which input plays?"
        choices: ["True", "False", "Nothing plays", "Parameter Unset"]
        answer_index: 3
        explain: "Branch has True, False, and Parameter Unset outputs. If the parameter was never set, the Sound Cue uses the Parameter Unset input pin."
      - q: "Why does the docs warn against using the Looping node for seamless loops?"
        choices: ["The Looping node cannot loop more than 10 times", "Sounds looped by the node will not play seamlessly; use the Looping flag on the Wave Player instead", "The Looping node ignores the Mixer", "Looping node loops only in the editor"]
        answer_index: 1
        explain: "A Looping node should only be used for logical or procedural looping such as adding a delay, because these sounds will not play seamlessly. For seamless loops use the Looping flag on the Wave Player node."
      - q: "What does Retrigger Time in the Concurrency Overrides do?"
        choices: ["Sets the delay before the cue can be garbage collected", "Sets the wait time between different sounds; rejected sounds ignore virtualization", "Restarts the sound every N seconds", "Sets how long the sound fades out"]
        answer_index: 1
        explain: "Retrigger Time is the amount of time in seconds to wait between different sounds. Sounds rejected by it ignore virtualization settings."
      - q: "The Random node has Preselect at Level Load set to 2. During Play In Editor you still hear all five inputs. Why?"
        choices: ["The setting is broken", "The setting only applies in game builds outside the editor, not PIE or Simulate", "Preselect only affects weights", "PIE always ignores Random nodes"]
        answer_index: 1
        explain: "Preselect at Level Load randomly keeps that many inputs and removes the rest to save memory, but it does not apply during Play In Editor or Simulate. It applies only in game builds outside the editor."
      - q: "In the MetaSounds Quick Start, how does Blueprint fire the Explode trigger inside the MetaSound?"
        choices: ["Set Boolean Parameter with In Name Explode", "Execute Trigger Parameter with In Name Explode on the audio component", "Play Sound 2D with the trigger checked", "Set Wave Parameter with the explosion wave"]
        answer_index: 1
        explain: "The projectile Blueprint uses Spawn Sound Attached, then calls Execute Trigger Parameter with In Name Explode on the returned component when the projectile is destroyed."
      - q: "Which node plays its inputs one after another with a small delay between them?"
        choices: ["Mixer", "Delay", "Oscillator", "Concatenator"]
        answer_index: 3
        explain: "The Concatenator node plays sounds sequentially, for example a playlist, and adds a small delay between each asset. The Mixer plays inputs at the same time."
    flavors:
      _default: {why: "A hit that sounds the same every time gets boring fast. Variation is cheap and players feel it."}
      gameplay_design: {why: "You decide when a sound plays and what data drives it. Named parameters connect gameplay to audio.", do: "Add a third Switch input for a critical hit and choose it when damage is above a threshold."}
      cinematics: {why: "The same cue nodes give variety to foley in your shots.", do: "Trigger SC_Hit from an Audio track in Sequencer and compare it to a Sound Wave track."}

  - id: GDQ77
