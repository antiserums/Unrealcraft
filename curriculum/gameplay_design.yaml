      - q: "The search text is lumen|screen percentage. Which results match?"
        choices: ["Only entries containing all three words", "Entries containing lumen, or screen, or percentage, in any order at all", "Only exact phrase matches", "Entries containing lumen, or containing both screen and percentage"]
        answer_index: 3
        explain: "Pipe characters split text into OR tokens and spaces combine words into AND tokens."
      - q: "Which statement about console commands like stat unit in the editor is true?"
        choices: ["They cannot be added at all", "They are saved as variables", "They run again on every frame for as long as the row in the list is checked and the panel is open", "They may not appear in the suggestion list, and only variables can be toggled with the checkbox"]
        answer_index: 3
        explain: "Commands may not show in suggestions while typing, and the checkbox toggle currently works only for console variables."
      - q: "What does the Source column show?"
        choices: ["The plugin or the engine module that defined the variable", "The file path of the variable", "The last method used to set the variable, such as Console", "The user who changed it"]
        answer_index: 2
        explain: "Source describes the last method used to set the variable. If it was set in the Console Variables Editor, the source is Console."
      - q: "According to the Console Variables Reference, what does t.MaxFPS = 0 mean?"
        choices: ["The game pauses", "The frame rate is uncapped", "The frame rate is capped at 60", "The setting is invalid"]
        answer_index: 1
        explain: "t.MaxFPS caps FPS to the given value. Set to 0 or less, the frame rate is uncapped. Its default is 0."
      - q: "With Add All Changed Console Variables to Current Preset enabled, what gets tracked from outside the editor panel?"
        choices: ["Only console variables, not commands", "Console variables and also commands", "Only commands", "Only scalability settings"]
        answer_index: 0
        explain: "Only console variables changed outside the panel are added. Commands entered elsewhere are not tracked."
    flavors:
      _default: {why: "A saved CVar preset makes a playtest setup repeatable on every machine."}
      gameplay_design: {why: "Testing the feel at 30 FPS or low resolution should be one click, not ten typed commands.", do: "Make a third preset that only enables stat unit and stat fps and share it with your team as a file."}

  - id: GDQ73
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [camera-shake, game-feel, blueprint, feedback]
    required_spine: false
    required: false
    title: "Camera shake on hit and at a distance"
    brief: "A camera shake is a short, small movement of the camera that makes a hit or an explosion feel heavy. It costs very little to add, but too much shake can make players feel sick. In Unreal a shake is an asset that sets how strong, how fast and how long the camera moves. In this quest you make a small shake for a punch and a larger one for an explosion that gets weaker with distance."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/camera-shakes-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/CameraShakes/StartCameraShake"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Camera/PlayWorldCameraShake"
    checklist:
      - "Open a project made from the Third Person template, or create one. Add a Blueprint Class with the parent CameraShakeBase and name it CS_HitSmall. Set Root Shake Pattern to Perlin Noise Camera Shake Pattern. Give Rotation Pitch an Amplitude of about 1 and a Frequency of about 25. Set Duration to 0.25 and Blend In/Out to 0.05, and enable Single Instance."
      - "Make a second shake named CS_Explosion with the same pattern, but with a larger Amplitude of about 5, a Duration of 0.8 and a Blend Out of 0.3. Leave Single Instance off."
      - "In BP_ThirdPersonCharacter, add an Input Action or a key event for a punch. On the event, call Get Player Camera Manager, and then call Start Camera Shake with Shake Class CS_HitSmall and Scale 1.0."
      - "Make a Blueprint named BP_Barrel with a Static Mesh and a Box Collision. When the player begins to overlap the box, call Play World Camera Shake with Shake CS_Explosion and Epicenter set to the location of the barrel. Set Inner Radius to 200, Outer Radius to 1500 and Falloff to 1.0."
      - "Place three barrels at different distances. Press Play, walk into them, and note how the shake gets weaker with distance."
      - "Test the punch shake by pressing the key many times quickly. Then turn Single Instance off on CS_HitSmall and press quickly again. Write 2 sentences about the difference you saw."
    done_when: "Send two screenshots. The first shows the Details of CS_HitSmall with the Perlin pattern, the Duration and Single Instance. The second shows the BP_Barrel graph with the Play World Camera Shake node and its radius values. Add your 2 sentences about Single Instance."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You want a short punchy hit shake. Which Root Shake Pattern does Epic suggest for high-intensity shakes like rumbles or nearby explosions?"
        choices: ["Sinusoidal Wave", "Sequence Shake", "Composite with zero children", "Perlin Noise"]
        answer_index: 3
        explain: "Perlin noise samples random points by amplitude and frequency and is described as useful for high-intensity shakes such as rumbles or nearby explosions. Wave noise is for low-intensity shakes like a rocking boat."
      - q: "You set Duration to 0 on a Perlin shake. What happens?"
        choices: ["The shake never plays", "The shake plays once for one frame", "The shake plays infinitely", "The shake uses the Blend In time as its duration"]
        answer_index: 2
        explain: "Duration controls the length of the shake. If it is 0 or less than 0, the shake plays infinitely. You would then stop it from code or Blueprint."
      - q: "A player mashes the attack key and the hit shake stacks into a huge wobble. Which setting fixes this with one checkbox?"
        choices: ["Blend Out Time", "Single Instance", "Amplitude Multiplier", "Play Space = World"]
        answer_index: 1
        explain: "Single Instance allows only one instance of the shake at a time. New attempts to play it restart it instead of layering it additively."
      - q: "The Start Camera Shake node needs a target. Which of these is a valid target according to the docs?"
        choices: ["A Player Controller or a Camera Shake Source Component", "Any Actor that has a Static Mesh and a Camera Component", "The Game Mode", "A Level Sequence asset"]
        answer_index: 0
        explain: "The docs say the Start Camera Shake function requires a Player Controller or a Camera Shake Source Component as the target. The Blueprint node's target is the Player Camera Manager."
      - q: "Play World Camera Shake has Inner Radius and Outer Radius. Which cameras are affected?"
        choices: ["Cameras inside the Inner Radius only", "Cameras outside the Inner Radius and inside the Outer Radius", "Cameras outside the Outer Radius", "All cameras in the level, no matter the distance to the Epicenter"]
        answer_index: 1
        explain: "Per the node reference, cameras inside the Inner Radius are ignored, and cameras outside the Inner Radius and inside the Outer Radius are affected, with Falloff controlling the fade toward the Outer Radius."
      - q: "You use Play World Camera Shake on a listen server so every client feels the explosion. What does the docs say about replication?"
        choices: ["It replicates to all clients automatically", "It does not replicate", "It replicates only to the owning client", "It replicates only if Orient Shake Towards Epicenter is on"]
        answer_index: 1
        explain: "The node reference says the in-world camera shake affects all nearby local players and does not replicate. Each machine must play it itself."
      - q: "What does Scale = 0.5 do on the Start Camera Shake node?"
        choices: ["Halves the shake duration", "Plays the shake at half speed", "Limits the shake to half of the screen", "Plays the shake at half intensity"]
        answer_index: 3
        explain: "Scale is a scalar for how intense the shake plays. 1.0 is normal as authored, so 0.5 is half intensity."
      - q: "You want one Perlin shake to be stronger on every axis without editing each axis. What do you change?"
        choices: ["The Amplitude Multiplier on Location and Rotation", "The Initial Offset Type", "The Random Segment Duration of the shake pattern", "The Blend In Time"]
        answer_index: 0
        explain: "Location and Rotation have Amplitude and Frequency Multiplier properties that multiply the combined results of all axes, so you can make global changes instead of changing each axis."
    flavors:
      _default: {why: "Camera shake is the cheapest way to make a hit feel heavy. Doing it wrong makes players sick."}
      gameplay_design: {why: "You decide how strong and how long feedback should be. Shakes are your first dial.", do: "Try Scale 0.3, 1.0, and 2.0 on the punch shake and pick the one that feels right. Write why."}
      level_design: {why: "World shakes with radius make explosions and collapses feel real in your levels.", do: "Add a Camera Shake Source actor near a scripted event and compare it with Play World Camera Shake."}

  - id: GDQ74
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [time-dilation, hit-stop, game-feel, blueprint]
    required_spine: false
    required: false
    title: "Hit stop with time dilation"
    brief: "Hit stop is a very short freeze of the game at the moment a hit lands. It makes the hit feel strong. In Unreal you can create it with time dilation, a setting that makes game time run slower than real time. You must be careful, because timers and delays also slow down when game time does. In this quest you build a hit stop, measure how long it lasts in real time, and see which time nodes are slowed."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/SetGlobalTimeDilation"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/GetGlobalTimeDilation"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/GetWorldDeltaSeconds"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/GetRealTimeSeconds"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/GetTimeSeconds"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/GetUnpausedTimeSeconds"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/GetAudioTimeSeconds"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/SetTimerbyEvent"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/FlowControl/Delay"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make a Blueprint named BP_Dummy with a Static Mesh and a Box Collision, and place one in the level. In BP_ThirdPersonCharacter, add a key event for a punch that does a Sphere Trace forward with a radius of 60 and a length of 150, and finds a BP_Dummy."
      - "Make a custom event named HitStop with a Float input named Duration. It calls Set Global Time Dilation with 0.05. Then it calls Set Timer by Event with Time set to Duration and Looping off. The event of the timer calls Set Global Time Dilation with 1.0."
      - "Before the hit stop starts, store Get Real Time Seconds in a variable. When time returns to 1.0, print Get Real Time Seconds minus the stored value. Test with Duration 0.1, see how many real seconds the stop lasted, and write down the number."
      - "During the hit stop, print Get Time Seconds, Get Unpaused Time Seconds, Get Audio Time Seconds and Get Real Time Seconds on the same tick. Note which ones move slowly and which ones do not."
      - "Add a Get Global Time Dilation check at the start of HitStop. If the value is not 1.0, do nothing. This stops a second hit from breaking the first stop."
      - "After the punch, add a Delay of 0.1 that spawns a small debug text. Compare how long the Delay waits during the hit stop with how long the timer waits. Write 2 sentences about what you measured."
    done_when: "Send one screenshot of the HitStop event graph with Set Global Time Dilation, Set Timer by Event and the Get Global Time Dilation check. Add your measured numbers: the real seconds that a 0.1 hit stop lasted, and which time nodes were slowed."
    xp: 60
    verify_type: writeup
    quiz:
      - q: "Which object is the Target of the Set Global Time Dilation node?"
        choices: ["The Player Controller", "The Game Instance", "The World Settings actor", "Gameplay Statics"]
        answer_index: 3
        explain: "The node reference says Target is Gameplay Statics. It is a static library function, so you can call it from any Blueprint without a reference."
      - q: "You need a stopwatch that ignores your hit stop and also keeps running while the game is paused. Which node?"
        choices: ["Get Time Seconds", "Get Real Time Seconds", "Get Audio Time Seconds", "Get World Delta Seconds"]
        answer_index: 1
        explain: "Get Real Time Seconds returns time since the world started for play, is NOT dilated or clamped, and does NOT stop when the game pauses."
      - q: "Get Time Seconds and Get Unpaused Time Seconds are both adjusted by time dilation. What is the difference?"
        choices: ["Get Time Seconds stops on pause; Get Unpaused Time Seconds does not", "Get Time Seconds counts from level load; the other counts from engine start", "Get Time Seconds is in milliseconds", "There is no difference"]
        answer_index: 0
        explain: "Both are adjusted by time dilation. Get Time Seconds IS stopped when the game pauses, and Get Unpaused Time Seconds IS NOT stopped when the game pauses."
      - q: "Which time node is stopped by pause but NOT affected by time dilation?"
        choices: ["Get Audio Time Seconds", "Get Unpaused Time Seconds", "Get Real Time Seconds", "Get Global Time Dilation"]
        answer_index: 0
        explain: "Get Audio Time Seconds returns time since the world started for play, IS stopped when the game pauses, and is NOT dilated or clamped."
      - q: "During the hit stop, movement in Event Tick that uses Get World Delta Seconds slows down. Why?"
        choices: ["Event Tick stops firing at low dilation", "Get World Delta Seconds returns the frame delta adjusted by time dilation", "The physics engine pauses", "Delta seconds is clamped to 0 whenever the global time dilation is below 0.1"]
        answer_index: 1
        explain: "Get World Delta Seconds returns the frame delta time in seconds, adjusted by time dilation. Movement that multiplies by delta seconds therefore slows down with the world."
      - q: "You call Set Timer by Event with the same event twice while the first timer is still running. What happens?"
        choices: ["Two timers now run in parallel", "The second call is ignored", "The existing timer is reset with the updated parameters", "The engine logs an error and clears both of the timers"]
        answer_index: 2
        explain: "The node reference says setting an existing timer will reset that timer with updated parameters."
      - q: "What does passing Time <= 0 to Set Timer by Event do?"
        choices: ["Fires the event every frame", "Fires the event once immediately", "Sets the timer to loop forever", "Clears the timer if it is set"]
        answer_index: 3
        explain: "Setting a timer to <= 0 seconds will clear it if it is set. Use this to cancel a timer through the same node."
      - q: "A Delay node is counting down and the same execution path calls it again. What happens per the docs?"
        choices: ["The delay restarts from the new Duration", "The second call is ignored", "Both delays complete, firing Completed twice", "The delay finishes immediately"]
        answer_index: 1
        explain: "Delay is a latent action, and calling it again while it is counting down will be ignored. Use Retriggerable Delay if you want a restart."
    flavors:
      _default: {why: "A few frames of frozen time is what makes a hit feel like it lands."}
      gameplay_design: {why: "Hit stop is a tuning number. Knowing which clocks are dilated keeps UI, timers, and combos honest.", do: "Try Duration 0.05, 0.1, and 0.2 and write which one felt best and why."}
      programming: {why: "Time dilation touches every system that uses delta time. You need to know what still runs at full speed.", do: "Make a UMG timer widget that uses Get Real Time Seconds so it does not freeze during the hit stop."}

  - id: GDQ75
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [force-feedback, gamepad, game-feel, blueprint]
    required_spine: false
    required: false
    title: "Controller rumble that matches the hit"
    brief: "Rumble is the vibration of a gamepad. The player feels it in the hand, so it can show the weight of a hit without anything on screen. In Unreal a rumble is stored in a Force Feedback Effect asset. The asset holds curves that say how strong each motor of the gamepad vibrates over time. In this quest you make a light rumble for a hit and a heavy one for an explosion, and you play them from Blueprints."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/force-feedback-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open a project made from the Third Person template, or create one. You need a gamepad for this quest. In the Content Browser, click Add and choose Input, then Force Feedback Effect. Name the asset FF_HitLight. In its one channel, enable only Affects Right Small. Hold Shift and click on the curve to add two keys: (0, 1.0) and (0.15, 0)."
      - "Make a second effect named FF_Explosion with two channels. Channel 0 uses Affects Left Large with the keys (0, 1.0), (0.4, 0.6) and (0.8, 0). Channel 1 uses Affects Right Small with the keys (0, 0), (0.1, 0.8) and (0.3, 0). With a gamepad connected, move the mouse over the asset icon and press the play button to preview each effect."
      - "In BP_ThirdPersonCharacter, add a key or gamepad button event for a punch. On it, call Get Player Controller and then Client Play Force Feedback with FF_HitLight. Give it the Tag Hit."
      - "Make a Blueprint named BP_ExplosiveBarrel. When the player begins to overlap it, call Spawn Force Feedback at Location with FF_Explosion at the location of the barrel and with Auto Destroy on. Give it an attenuation asset, so that the rumble gets weaker with distance."
      - "Add a looping test. One key calls Client Play Force Feedback with Looping on and the Tag Engine. Another key calls Client Stop Force Feedback with the same Tag. Confirm that the loop stops."
      - "Write 2 sentences that say which motors you used for the light hit and which for the explosion, and why."
    done_when: "Send two screenshots. The first shows FF_Explosion open with both channels and their curves. The second shows the graph with Client Play Force Feedback (with the Tag set) and Spawn Force Feedback at Location. Add your 2 sentences about your choice of motors."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "A Force Feedback Effect has 3 channels whose last curve keys are at 1.25, 1.5, and 1.75 seconds. What is the duration of the effect?"
        choices: ["1.25 seconds", "1.5 seconds", "1.75 seconds", "4.5 seconds"]
        answer_index: 2
        explain: "Duration is calculated automatically from the position of the last key in the curves of all channels. The furthest key, 1.75, sets the overall duration."
      - q: "Where in the Content Browser do you create a Force Feedback Effect asset?"
        choices: ["Add > Input > Force Feedback Effect", "Add > Audio > Force Feedback", "Add > Blueprint Class > ForceFeedback", "Add > Miscellaneous > Data Asset"]
        answer_index: 0
        explain: "The docs say to click Add and choose Input > Force Feedback Effect. By default the asset has one channel and you can add more."
      - q: "What does a curve value below 0.0 do on a force feedback channel?"
        choices: ["Reverses the motor direction", "Vibrates at maximum strength", "Pulses the motor on and off", "Causes no vibration"]
        answer_index: 3
        explain: "The curve controls intensity over time. Values above 0.0 cause vibration; values below 0.0 do not cause vibration."
      - q: "Which class implements playing Force Feedback, so you need a reference to it in Blueprint?"
        choices: ["Game Mode", "Player Controller", "Character Movement Component", "Game Instance"]
        answer_index: 1
        explain: "Force Feedback is implemented in the base PlayerController class. In Blueprint you get the Player Controller and call Client Play Force Feedback on it."
      - q: "You play an effect with the Tag Hit while another effect with Tag Hit is already playing. What happens?"
        choices: ["Both play together", "The new one waits in a queue until it ends", "The old one stops and the new one plays", "The new one is ignored"]
        answer_index: 2
        explain: "If an effect with the same name is already playing, it is stopped and the new effect plays instead. The Tag also lets you stop the effect later."
      - q: "You call Client Play Force Feedback on the server for a player. What does the docs say happens?"
        choices: ["Nothing; force feedback only works on clients", "It is replicated to the owning client", "It plays on every connected client", "It plays on the server machine only"]
        answer_index: 1
        explain: "The docs state the force feedback will be replicated to the owning client if called on the server."
      - q: "You want the rumble to get weaker as the player walks away from an explosion. What is the intended tool?"
        choices: ["A Force Feedback Component at a world location with an attenuation setting", "Lowering the keys of the curve by hand for each distance from the explosion", "A second channel with Affects Left Small", "Per Device Overrides"]
        answer_index: 0
        explain: "A Force Feedback Component has a location in the world, and like sound or light its intensity changes with the player's distance according to a data-defined attenuation setting. Spawn Force Feedback at Location and Spawn Force Feedback Attached create one."
      - q: "What are Per Device Overrides for?"
        choices: ["Setting a different curve per player", "Mapping each channel to a key on the keyboard or mouse", "Turning rumble off in the editor", "Setting different feedback settings for each platform"]
        answer_index: 3
        explain: "Each platform implements vibration differently. Per Device Overrides let you set different feedback settings per platform, for example strong on Xbox and more nuanced on PlayStation."
    flavors:
      _default: {why: "Rumble is feedback the player feels in the hand. It sells weight without any pixels."}
      gameplay_design: {why: "You will tune rumble like any other feedback: strength, length, and which motor.", do: "Make a third effect FF_LowHealth that loops softly and stop it when health goes above 30."}
      programming: {why: "Rumble replication and tags are gameplay code details you will own later.", do: "Call the same effect from C++ with ClientPlayForceFeedback and compare the parameters."}

  - id: GDQ76
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [audio, sound-cue, metasounds, feedback]
    required_spine: false
    required: false
    title: "Hit sounds that never repeat the same way"
    brief: "A hit that sounds exactly the same every time becomes boring very fast. A Sound Cue is an asset where you connect sound nodes, so that one sound event can play a random recording with a slightly different pitch and volume each time. In this quest you build a hit sound that changes on every hit, switch it by surface type from a Blueprint, limit how many copies can play at once, and try the same idea in a MetaSound, the newer audio tool of Unreal."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/sound-cue-reference-for-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/metasounds-quick-start"
    checklist:
      - "Open a project made from the Third Person template, or create one. Import three short impact sounds as .wav files by dragging them into the Content Browser. You can record them with a phone or get free sounds from Fab. For a first test, three short engine sounds also work, such as CompileSuccess, CompileFailed and 1kSineTonePing. To see engine content, open the Settings menu of the Content Browser and turn on Show Engine Content."
      - "Create a Sound Cue named SC_Hit. Add a Random node with the three waves as inputs. Set the Weights so that one wave is chosen twice as often as the others."
      - "Add a Modulator node after the Random node. Set Pitch Min to 0.9, Pitch Max to 1.1, Volume Min to 0.8 and Volume Max to 1.0. Connect it to the Output node."
      - "Add a Switch node before the Output node and set Int Parameter Name to Surface. Connect your SC_Hit chain to input 0 and a different wave for metal to input 1. In a Blueprint, play the cue with Spawn Sound at Location. Then call Set Integer Parameter with In Name Surface on the Audio Component that the node returns."
      - "On the Output node, enable Override Concurrency and set Max Count to 3. Trigger the hit 10 times quickly, and compare what you hear with Max Count 1."
      - "Make a MetaSound Source named MSS_Hit that plays a Wave Player when a Trigger Input named Impact fires. In a Blueprint, use Spawn Sound Attached and then Execute Trigger Parameter with In Name Impact."
      - "Write 3 sentences that say what the Random node, the Modulator node and the Switch node each changed in how the hit sounds."
    done_when: "Send two screenshots. The first shows the SC_Hit graph with the Random, Modulator, Switch and Output nodes visible. The second shows the Blueprint graph that plays the cue and calls Set Integer Parameter with the name Surface. Add your 3 sentences."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You put a Modulator node before a Looping node. When does the pitch get re-randomized?"
        choices: ["On every loop", "Once per Sound Cue trigger, not per loop", "Never, the Modulator only sets a fixed pitch", "Only when a named parameter changes"]
        answer_index: 1
        explain: "The docs say if the Modulator node is used with the Looping node, it randomizes on each Sound Cue trigger and not on each individual loop."
      - q: "A Switch node picks an input by a runtime integer. Which Blueprint function sets that value?"
        choices: ["Set Boolean Parameter", "Set Float Parameter", "Set Integer Parameter", "Set Wave Parameter"]
        answer_index: 2
        explain: "The named-parameter table maps the Switch node to Set Integer Parameter. Branch uses Set Boolean Parameter and Continuous Modulator uses Set Float Parameter."
      - q: "You added a Branch node with Bool Parameter Name Armored but never called Set Boolean Parameter. Which input plays?"
        choices: ["True", "False", "Nothing plays", "Parameter Unset"]
        answer_index: 3
        explain: "Branch has True, False, and Parameter Unset outputs. If the parameter was never set, the Sound Cue uses the Parameter Unset input pin."
      - q: "Why does the docs warn against using the Looping node for seamless loops?"
        choices: ["The Looping node cannot loop more than 10 times, so longer loops need several Looping nodes in a row", "Sounds looped by the node will not play seamlessly; use the Looping flag on the Wave Player instead", "The Looping node ignores the Mixer", "Looping node loops only in the editor"]
        answer_index: 1
        explain: "A Looping node should only be used for logical or procedural looping such as adding a delay, because these sounds will not play seamlessly. For seamless loops use the Looping flag on the Wave Player node."
      - q: "What does Retrigger Time in the Concurrency Overrides do?"
        choices: ["Sets the delay before the cue can be garbage collected; virtualized sounds ignore it", "Sets the wait time between different sounds; rejected sounds ignore virtualization", "Restarts the sound every N seconds", "Sets how long the sound fades out"]
        answer_index: 1
        explain: "Retrigger Time is the amount of time in seconds to wait between different sounds. Sounds rejected by it ignore virtualization settings."
      - q: "The Random node has Preselect at Level Load set to 2. During Play In Editor you still hear all five inputs. Why?"
        choices: ["The setting is broken", "The setting only applies in game builds outside the editor, not PIE or Simulate", "Preselect only affects weights", "PIE always ignores Random nodes and plays every input in the order it is connected"]
        answer_index: 1
        explain: "Preselect at Level Load randomly keeps that many inputs and removes the rest to save memory, but it does not apply during Play In Editor or Simulate. It applies only in game builds outside the editor."
      - q: "In the MetaSounds Quick Start, how does Blueprint fire the Explode trigger inside the MetaSound?"
        choices: ["Set Boolean Parameter with In Name Explode on the same audio component", "Execute Trigger Parameter with In Name Explode on the audio component", "Play Sound 2D with the trigger checked", "Set Wave Parameter with the explosion wave"]
        answer_index: 1
        explain: "The projectile Blueprint uses Spawn Sound Attached, then calls Execute Trigger Parameter with In Name Explode on the returned component when the projectile is destroyed."
      - q: "Which node plays its inputs one after another with a small delay between them?"
        choices: ["Mixer", "Delay", "Oscillator", "Concatenator"]
        answer_index: 3
        explain: "The Concatenator node plays sounds sequentially, for example a playlist, and adds a small delay between each asset. The Mixer plays inputs at the same time."
    flavors:
      _default: {why: "A hit that sounds the same every time gets boring fast. Variation is cheap and players feel it."}
