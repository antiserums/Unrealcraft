    subjects: [world-settings, game-mode, gravity, kill-z, per-level-rules]
    required_spine: false
    required: false
    title: "One map, one rule set: World Settings overrides"
    brief: "World Settings is a panel with settings that belong to one map only. There you can give a map its own Game Mode, its own gravity and its own Kill Z, the depth below which a falling actor is destroyed. These settings win over the project defaults for that map. This is the cheapest way to make two levels play differently. In this quest you make a copy of a map with a different Game Mode, lower gravity and a different Kill Z."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/world-settings-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-a-game-mode-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-a-game-mode-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/game-mode-and-game-state-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open Project Settings, go to Maps & Modes, and look at Default GameMode. Expand Selected GameMode and note which Default Pawn Class is shown."
      - "Duplicate the map of the template, or a test map of your own, and name the copy L_Moon. Open Window > World Settings and set GameMode Override to a new BP_GM_Moon. Make BP_GM_Moon a child of the default Game Mode that uses a different Default Pawn Class or HUD. A copy of the template character with a different Max Walk Speed is enough as the other pawn."
      - "In World Settings, in the Physics section, override World Gravity in L_Moon so that the jump is clearly higher. Leave the original map unchanged."
      - "In World Settings, in the World section, change the Kill Z so that an actor that falls off the arena is destroyed quickly. Kill Z is the depth an actor can fall to before it is destroyed. Cut a hole in the floor to test it."
      - "Use the search box of World Settings to find the Game Mode group, and confirm that your override is listed there."
      - "Play the original map and then L_Moon. Write 3 sentences: which map used which Game Mode, which setting had priority, and what changed in the physics."
    done_when: "Send one screenshot of the World Settings panel of L_Moon with GameMode Override, World Gravity and Kill Z visible, and one screenshot of Maps & Modes with the Default GameMode. Add your 3 sentences."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Where do you open the World Settings panel?"
        choices: ["Edit > Project Settings", "Window > World Settings", "Tools > Level Rules", "Right-click the map in the Content Browser"]
        answer_index: 1
        explain: "From the main menu go to Window, then World Settings. The panel docks next to the Details panel by default."
      - q: "A project default Game Mode is set in Project Settings, and a map has a GameMode Override in World Settings. Which one wins for that map?"
        choices: ["The Project Settings default", "Whichever was saved last", "Neither; the template Game Mode is used", "The World Settings override"]
        answer_index: 3
        explain: "The GameMode Override in World Settings overrides the project setting for that individual map. Project Settings > Maps & Modes sets the default for the whole project."
      - q: "Ordered from lowest to highest priority, which list is correct for how the Game Mode is chosen?"
        choices: ["World Settings override, ini GlobalDefaultGameMode, URL game option, map prefixes", "ini GlobalDefaultGameMode, World Settings override, URL game option, map prefixes", "Map prefixes, URL, World Settings, ini", "URL, ini, prefixes, World Settings"]
        answer_index: 1
        explain: "The docs list, lowest to highest: GlobalDefaultGameMode in DefaultEngine.ini, the World Settings GameMode Override, the URL game option, and map prefixes and aliases."
      - q: "Which World Settings group holds the World Gravity override?"
        choices: ["Game Mode", "Lightmass", "Physics", "Navigation"]
        answer_index: 2
        explain: "The Physics section lets you override World Gravity, which affects Z-axis actions like jump height and fall speed."
      - q: "Which World Settings group holds the depth an Actor can fall to before it is destroyed?"
        choices: ["World", "Broadphase", "Cooking", "VR"]
        answer_index: 0
        explain: "The World group affects core aspects like level bounds, navigation systems, and the depth an Actor can fall to before it is destroyed."
      - q: "In VR settings, World To Meters is 10 with content built at 1 UU = 1 cm. How does the world look?"
        choices: ["Very small", "Very large", "Unchanged", "Mirrored"]
        answer_index: 1
        explain: "Setting World To Meters to 10 makes the world appear very large; 1000 makes it appear very small. 1 Unreal Unit equals 1 centimeter."
      - q: "The Tick group has an option to run Tick before BeginPlay. What do the docs advise?"
        choices: ["Disable it unless legacy code needs it, so objects tick correctly", "Always enable it for speed, so that objects start ticking earlier", "It only matters on mobile", "It controls the frame rate"]
        answer_index: 0
        explain: "Unless your game has legacy code that requires Tick before the one-time BeginPlay, you should disable this option to make sure objects tick correctly."
      - q: "Can one Game Mode be reused by several levels?"
        choices: ["No, each level needs its own", "Only with C++", "Only if the levels share a name prefix that is mapped in Project Settings", "Yes, the Game Mode is set per level and can be reused in multiple levels"]
        answer_index: 3
        explain: "The Game Mode is set for each level, and Game Modes can be reused in multiple levels. Blueprint Game Modes let you adapt one mode to many levels without code changes."
    flavors:
