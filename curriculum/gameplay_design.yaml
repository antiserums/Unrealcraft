    required_spine: false
    required: false
    title: "Impact burst from Blueprint"
    brief: "Niagara is the visual effects system of Unreal. It creates particles, which are many small images that move and fade, for effects such as sparks or dust. A short burst of particles at the point of a hit shows the player exactly where and when the hit happened. In this quest you build a small burst effect and spawn it from a Blueprint at the place where a punch lands."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/quick-start-for-niagara-effects-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-niagara-effects-for-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Niagara/SpawnSystematLocation"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Niagara/SpawnSystemAttached"
    checklist:
      - "Open a project made from the Third Person template, or create one. Right-click in the Content Browser, choose FX, then Niagara System. Pick the Simple Sprite Burst template and name the system FXS_HitBurst. Rename the emitter to HitBurst."
      - "In Emitter Update, in Emitter State, set Loop Behavior to Once and Loop Duration to 1. In Spawn Burst Instantaneous, set Spawn Count to 12."
      - "In Particle Spawn, set Lifetime to a random value from 0.2 to 0.4. Add Shape Location with Shape Primitive set to Sphere and a small radius. Then add the module Add Velocity from the Velocity group, with Velocity Mode set to From Point and a speed of about 300. If the stack shows an error, click Fix Issue."
      - "In Particle Update, add the Drag module from the Forces group and set Drag to 5. Keep Scale Color, so that the burst fades out."
      - "In BP_ThirdPersonCharacter, add a key event for a punch that does a Line Trace by Channel from the character about 150 units forward, and place a cube in the level to hit. Where the trace hits, call Spawn System at Location with System Template FXS_HitBurst at the Impact Point and with Auto Destroy on. Rotate it so that it faces along the Impact Normal."
      - "Make a second call with Spawn System Attached, attached to the root component of the hit actor, with Location Type set to Keep Relative Offset. If the hit actor has a skeletal mesh, you can set Attach Point Name to a socket or a bone. Move the target and note which burst follows it."
      - "Drag FXS_HitBurst into the level one time, next to the character, to check its size. Then remove it."
    done_when: "Send two screenshots. The first shows FXS_HitBurst open in the Niagara Editor with the Emitter Update and Particle Spawn modules. The second shows the Blueprint graph with Spawn System at Location connected to the Impact Point of the trace. Say which spawn node followed the moving target."
