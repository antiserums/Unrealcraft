    verify_type: screenshot
    quiz:
      - q: "Where does Unreal save log files?"
        choices: ["Saved/Logs as .txt files", "Content/Logs as .log files", "Config/Logs", "The desktop"]
        answer_index: 0
        explain: "Logs are saved in a .txt file in your project's Saved/Logs directory, and shown live in Window > Output Log."
      - q: "Print String is called with Print to Log set to false. What happens to the message?"
        choices: ["It is still shown in the Output Log", "It is logged only as Verbose, so it generally will not show", "It causes an error", "It is written to a separate text file in the Saved/Logs folder"]
        answer_index: 1
        explain: "The node page says that if Print to Log is false the message is logged only as Verbose, so it generally does not show up."
