        answer_index: 3
        explain: "The system generates a NavMesh from collision geometry, divides it into tiles and then polygons. Each polygon has a cost, and Agents look for the lowest cost path."
      - q: "How do you quickly show the NavMesh in the editor viewport?"
        choices: ["Press the P key", "Press the apostrophe key", "Press Ctrl+N", "Run the command stat nav"]
