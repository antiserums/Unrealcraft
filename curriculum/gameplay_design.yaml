      - q: "What does the AI Touch sense detect?"
        choices: ["Sounds within a small radius", "Damage under a threshold", "Objects that come within one meter of the eyes of the AI pawn", "When the AI bumps into something or something bumps into it"]
        answer_index: 3
        explain: "Touch fires when the AI touches something or is touched, for example a player who brushes a guard in a stealth game."
      - q: "You want Sight to detect only enemies of a team, in a Blueprint-only project. What does the page say?"
        choices: ["Set Detection by Affiliation to Enemies only; it works out of the box in a Blueprint project", "Use the Dominant Sense field", "Affiliation is C++ only; use Detect Neutrals to sense everyone, then filter with Tags", "Use a Hearing sense instead"]
        answer_index: 2
