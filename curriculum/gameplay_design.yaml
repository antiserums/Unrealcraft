  - id: GDQ78
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [anim-notifies, montage, game-feel, blueprint]
    required_spine: false
    required: false
    title: "Attack windows with notifies"
    brief: "The feel of an attack depends on timing. An Animation Notify is a marker that you place on a frame of an animation. When the animation reaches that frame, the notify can play an effect or a sound, or tell your Blueprint that the hit happens now. A notify window marks a span of time with a start and an end. In this quest you add notifies to a punch montage for the effects, for the hit, and for a window in which the player may cancel the attack."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-notifies-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open a project made from the Third Person template, or create one. Pick an attack animation for the Third Person mannequin. If you have none, any short animation of the mannequin can stand in for a punch. Right-click it and create an Animation Montage named AM_Punch. Make sure that the montage plays through a slot that the Animation Blueprint of the character uses: its AnimGraph needs a Slot 'DefaultSlot' node before Output Pose."
      - "In AM_Punch, add a notify track named Feel. Right-click at the moment the fist reaches the target, choose Add Notify, and then Play Niagara Particle Effect, and pick any Niagara System, for example one that you make from the Simple Sprite Burst template. Then add a Sound notify with any short sound and a Pitch Multiplier of 1.1. Set Attach Name to the hand socket or bone."
      - "Add a Montage Notify named HitFrame at the same frame. In BP_ThirdPersonCharacter, play the montage from a key event with the Play Montage node. From On Notify Begin, check that the Notify Name equals HitFrame, and then run your hit logic. A Print String with the text Hit is enough, and a trace with damage is a bonus."
      - "Add a Montage Notify Window named Cancel over the last third of the animation. When On Notify Begin runs with the name Cancel, allow the next input to interrupt the montage. When On Notify End runs, stop allowing it."
      - "Set the Montage Tick Type of the HitFrame notify to Branching Point. Set a Notify Trigger Chance of 0.5 on the sound notify, and play the montage 10 times to hear the sound skip."
      - "Write 3 sentences: why the hit is in the animation and not on the input, what the Cancel window does for the feel, and why you chose Branching Point."
    done_when: "Send two screenshots. The first shows the AM_Punch timeline with the Feel track and the Niagara, Sound, HitFrame and Cancel notifies. The second shows the Blueprint with Play Montage and the On Notify Begin check for HitFrame. Add your 3 sentences."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You added a Montage Notify but On Notify Begin never fires. What is the likely cause?"
        choices: ["You used Play Anim Montage instead of Play Montage", "The notify track of the montage is not named Default", "The notify is a Skeleton Notify", "The montage has two slots"]
        answer_index: 0
        explain: "Montage Notify and Montage Notify Window execute On Notify Begin and On Notify End on the Play Montage node. This requires the Play Montage node, not Play Anim Montage."
      - q: "For a hit frame that branches gameplay, which Montage Tick Type does the docs recommend?"
        choices: ["Queued, because it is cheaper", "Branching Point, for maximum frame accuracy", "Either, they are identical", "Queued, because it also runs on the server"]
        answer_index: 1
        explain: "Queued is asynchronous and cheaper but less precise. Branching Point is synchronous and higher cost but frame accurate, and is useful for gameplay-altering decisions."
      - q: "What does Notify Trigger Chance = 0 mean?"
        choices: ["The notify always executes", "The notify executes only in the editor", "The notify executes once per session", "The notify never executes"]
        answer_index: 3
        explain: "Notify Trigger Chance defines the chance of the notify executing. 0 means it never executes, 1 means it always executes."
      - q: "Your attack animation is blended at 10 percent weight with a locomotion animation and its notify still fires. Why?"
        choices: ["Notifies ignore blending", "The default Trigger Weight Threshold is 0.00001, so even a barely blended animation fires notifies", "Blending is disabled while a montage plays, so every animation counts as fully blended in for notifies", "Only Notify States care about weight"]
        answer_index: 1
        explain: "Trigger Weight Threshold sets how much weight the animation needs to trigger the notify. The default 0.00001 means a barely blended-in animation still fires; raise it to require more weight."
      - q: "A Notify State provides three events. Which set is correct?"
        choices: ["Start, Update, End", "Start, Pause, Stop", "Begin, Loop, Finish", "Enter, Tick, Exit"]
        answer_index: 0
        explain: "Notify States operate over a duration and provide a start, an update, and an end event, which you can access in Notify State child classes as Received Notify Begin, Tick, and End."
      - q: "Where are Skeleton Notifies stored, and what does that mean when you add one?"
        choices: ["In the Animation Sequence, so only that sequence changes", "On the Skeleton asset, so you must save the Skeleton", "In the Anim Blueprint, so you must recompile", "In the Montage slot"]
        answer_index: 1
        explain: "Skeleton Notifies are saved on the Skeleton asset. Creating one edits the Skeleton, which then requires you to save it."
      - q: "By default, which animations in a Sync Group execute their notifies?"
        choices: ["All animations in the group", "Only the leader, unless Trigger on Follower is enabled", "Only followers", "None, because sync groups disable notifies by default"]
        answer_index: 1
        explain: "By default only Sync Group leader animations execute their notifies. Enabling Trigger on Follower makes the notify also fire when the animation is a follower."
      - q: "The Sound notify has Follow enabled. What does that change?"
        choices: ["The sound plays on the listener instead of in the world", "The sound loops until the animation ends", "The sound ignores attenuation in game", "The sound source follows the animated mesh as it moves"]
        answer_index: 3
        explain: "With Follow enabled the sound effect source follows the animated mesh as it moves, and Attach Name can choose a bone or socket. Disabled, the sound stays where it spawned."
    flavors:
      _default: {why: "The feel of an attack lives in the timing. Notifies put your effects and your hit on the exact frame."}
      gameplay_design: {why: "Active frames, cancel windows, and hit frames are the language of combat design.", do: "Move the HitFrame notify 5 frames earlier and later and write how each felt."}
      animation: {why: "Notifies are how your animation talks to gameplay without a programmer in the middle.", do: "Add a custom AnimNotifyState class with Received Notify Tick that prints the normalized progress."}

  - id: GDQ79
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [post-process, materials, screen-effects, feedback]
    required_spine: false
    required: false
    title: "Damage vignette with a post process material"
    brief: "A post process material is a material that changes the whole picture after the scene is drawn. A vignette is a darker or colored border around the screen. A red vignette that flashes when the player is hurt is feedback that nobody can miss. In this quest you build a post process material with a parameter named Intensity, add it to the level and to the camera, and make it flash and fade from a Blueprint when damage happens."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-materials-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine"
    checklist:
      - "Create a material named M_PP_Damage. In the Details panel, set Material Domain to Post Process and set Blendable Location to After Tonemapping."
      - "Build the graph. Add a SceneTexture node set to PostProcessInput0, which gives you the color of the scene. Make a round mask from Screen Position, using the distance from the point 0.5, 0.5. Use a Lerp node to blend from the scene color to a red color. For the blend amount, multiply the mask by a Scalar Parameter named Intensity with the default value 0. Connect the result to Emissive Color."
      - "Make a Material Instance named MI_PP_Damage. Add an unbound Post Process Volume to the level, which is a volume that affects the whole level. Add MI_PP_Damage to its Blendables array, under Post Process Materials."
      - "Open a project made from the Third Person template for this step, or create one. In BP_ThirdPersonCharacter, on Begin Play, call Create Dynamic Material Instance with MI_PP_Damage as the parent and store the result in a variable. A dynamic instance is a copy of the material that a Blueprint can change while the game runs."
      - "Then call Add or Update Blendable on the Camera Component with this dynamic instance and a Weight of 1, so that the camera uses the copy you can change."
      - "Add a key press event that stands in for taking damage. On it, call Set Scalar Parameter Value on the dynamic instance to set Intensity to 1.0, and then bring it back to 0 over 0.5 seconds with a Timeline."
      - "Test it. With the default Intensity of 0, confirm that the screen looks unchanged. Then change the default of the parameter to 1 and confirm that the red vignette is always on. Set it back to 0."
      - "Write 2 sentences: why the default parameter value must make the screen look as if nothing happened, and why you chose After Tonemapping."
    done_when: "Send two screenshots. The first shows the M_PP_Damage graph with Material Domain and Blendable Location visible in Details. The second shows a Play In Editor frame with the red vignette after damage. Add your 2 sentences."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Which material output should a post process material use to write the new color?"
        choices: ["Base Color", "Opacity", "World Position Offset", "Emissive Color"]
        answer_index: 3
        explain: "The docs say the material should only use Emissive Color to output the new color, with the Material Domain set to Post Process."
      - q: "Which Blendable Location is the preferred one for performance?"
        choices: ["Before Tonemapping", "After Tonemapping", "Before Translucency", "Replacing the Tonemapper"]
        answer_index: 1
        explain: "After Tonemapping is the preferred location for performance because the color is LDR and needs less precision and bandwidth."
      - q: "You want to read the scene color that the pass before yours produced. Which is the correct approach per the docs?"
        choices: ["SceneTexture with PostProcessInput0", "The SceneColor expression", "A Texture Sample of the render target", "Particle Color"]
        answer_index: 0
        explain: "The typical post process input comes from the pass before and is accessed through the SceneTexture expression using PostProcessInput0. Using SceneColor might not give the right results."
      - q: "Two volumes blend two instances of the same post process material. What decides the order of blending between those instances?"
        choices: ["The Blendable Priority on the material", "The Priority on the Post Process Volume", "The Blend Radius", "The material name, alphabetically"]
        answer_index: 1
        explain: "The Priority on the Post Process Volume affects blending order for multiple instances of the same blendable material. Blendable Priority on the material orders different blendable materials."
      - q: "Why does the docs call a setup bad when the material parameter defaults do not make the pass look like it has no effect?"
        choices: ["The material will not compile", "You see a hard transition when the camera enters the volume's blend radius", "The volume becomes unbound", "The pass costs twice as much on the GPU while the camera is outside the volume"]
        answer_index: 1
        explain: "A good setup has default values that make the pass appear to have no effect, for example multiply by white or lerp with 0. Then entering the blend radius gives a smooth transition instead of a hard one."
      - q: "What does the docs advise about using post process materials in general?"
        choices: ["Use them for all color correction", "Use them sparingly and only when needed; prefer Post Process Volume settings when they can do the job", "Always place them Before Translucency", "They replace the need for Post Process Volumes, so use them for every effect and remove the volumes"]
        answer_index: 1
        explain: "Post Process Materials should be used sparingly. For color correction, bloom, depth of field and similar, the built-in Post Process Volume settings are optimized and more efficient."
      - q: "You want an outline only on enemies. Which mesh setting makes them available to a post process material?"
        choices: ["Cast Shadow", "Translucent Sort Priority", "Receive Decals", "Render Custom Depth"]
        answer_index: 3
        explain: "Custom Depth renders chosen meshes into a separate depth buffer. It is enabled on the mesh with Render Custom Depth, and a Custom Depth Stencil Value can then mask specific objects."
      - q: "When you blend a material instance through a Post Process Volume, which properties get blended?"
        choices: ["Only the properties whose checkbox is ticked", "All material instance properties, ticked or not", "Only scalar parameters", "Only the Blendable Priority"]
        answer_index: 1
        explain: "All material instance properties are blended, whether the checkbox is checked or not. This differs from post process settings, where an unchecked property has no effect."
    flavors:
      _default: {why: "A screen effect is feedback the player cannot miss. It must be fast, clear, and cheap."}
      gameplay_design: {why: "Damage, low health, and status effects need a screen signal that reads in a fraction of a second.", do: "Add a second Scalar Parameter for a blue Shield hit and drive it from a different event."}
      tech_art: {why: "Designers will ask you for parameterized screen effects. Build them so the default is a no-op.", do: "Move the vignette to Before Tonemapping and write what changed in the look and why."}

  - id: GDQ80
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [enhanced-input, input-buffering, game-feel, blueprint]
    required_spine: false
    required: false
    title: "Input buffer and trigger states"
    brief: "Players often press a button a little too early, for example they press attack while the last attack is still playing. An input buffer remembers that press for a short time and uses it as soon as the character is free, so the game feels responsive. Unreal's Enhanced Input system also reports the state of each press, such as Started, Triggered and Completed. In this quest you read these states, build an input buffer for an attack, and add a hold trigger and a chorded trigger."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/enhanced-input-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open a project made from the Third Person template, or create one. Create an Input Action named IA_Attack of the type bool, and a second one named IA_HeavyAttack. Add IA_Attack to the Input Mapping Context of the template on a keyboard key and on a gamepad face button. Add a mapping of the same key for IA_HeavyAttack with a Hold trigger that has a Hold Time Threshold of 0.4."
      - "In BP_ThirdPersonCharacter, add the IA_Attack event. Print a separate line from each of the Started, Triggered and Completed pins. Watch the order of the lines in the log for one press."
      - "Make a montage named AM_Punch from any short animation of the mannequin, and make sure the Animation Blueprint of the character has a Slot 'DefaultSlot' node before Output Pose. Add a Boolean variable named IsBusy that is true while the punch montage plays. From the Started pin of IA_Attack, check IsBusy. If it is false, attack: set IsBusy to true and play the montage with Play Montage. If it is true, store Get Real Time Seconds in a Float variable named BufferedAt."
      - "When the montage ends, set IsBusy to false. Then check if Get Real Time Seconds minus BufferedAt is less than 0.25. If it is, attack again and clear BufferedAt. This is your input buffer."
      - "Test with quick double presses. Then set the buffer window to 0.05 and to 1.0 and feel the difference. Pick a value and write why you chose it."
      - "Add a Chorded Action trigger so that IA_HeavyAttack only fires while a Block action is held. Type showdebug enhancedinput in the console to see the actions."
      - "Write 3 sentences that say what the buffer does for a player who presses early, and which Trigger State you used to start it."
    done_when: "Send one screenshot of the Blueprint with the IA_Attack event, the IsBusy branch and the BufferedAt time check. Add the buffer window you chose, in seconds, and your 3 sentences."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "For a press-and-hold trigger, which Trigger State fires every tick while the button is held before the hold time is reached?"
        choices: ["Triggered", "Started", "Ongoing", "Completed"]
        answer_index: 2
        explain: "Ongoing means the trigger is still being processed, for example a press-and-hold action while the user holds the button before the duration is reached. It can fire every tick."
      - q: "A player lets go of the button before a Hold trigger finishes. Which state is sent?"
        choices: ["Completed", "Triggered", "None", "Canceled"]
        answer_index: 3
        explain: "Canceled means the triggering was canceled, for example when a user lets go of a button before a press-and-hold action can be triggered."
      - q: "Which Input Trigger is the exception that needs another Input Action instead of analyzing the input itself?"
        choices: ["Hold And Release", "Tap", "Chorded Action", "Pressed"]
        answer_index: 2
        explain: "Most triggers analyze the input for taps, holds, press or release. The Chorded Action trigger is the exception: it is only triggered together with another Input Action."
      - q: "A mapping has two Implicit triggers and one Explicit trigger. When does the input succeed?"
        choices: ["When any one of the three fires", "When both implicits and at least one explicit fire", "When the explicit fires; the implicits are ignored", "Never; you cannot mix types"]
        answer_index: 1
        explain: "With Implicits > 0 and Explicits > 0, all implicits and at least one explicit must fire. Blockers override everything and force a failure."
      - q: "Two Input Mapping Contexts map the same Input Action to the same key. Which one wins?"
        choices: ["The one added first", "The one with the highest priority", "Both fire, two times for each press", "The one with more actions"]
        answer_index: 1
        explain: "When multiple contexts map the same Input Action, the context with the highest priority is considered and the others are ignored. You give the priority when adding the context."
      - q: "In what order does raw input pass through Enhanced Input before reaching your event?"
        choices: ["Triggers, then Modifiers", "Modifiers, then Triggers", "Triggers only; modifiers run after the event", "Modifiers and triggers run at the same time"]
        answer_index: 1
        explain: "Input Modifiers pre-process the raw value and hand it to the first Input Trigger. Triggers then decide if the action activates."
      - q: "What does the Hold trigger's Is One Shot setting control?"
        choices: ["Whether the hold can be used on gamepads", "Whether it fires only once or every frame once the hold threshold is met", "Whether it cancels other triggers", "Whether the hold threshold is measured in frames instead of in seconds"]
        answer_index: 1
        explain: "The UInputTriggerHold code shows bIsOneShot: should this trigger fire only once, or fire every frame once the hold time threshold is met."
      - q: "Which console command shows the input action and axis mappings in use?"
        choices: ["stat input", "Input.+key", "showdebug devices", "showdebug enhancedinput"]
        answer_index: 3
        explain: "showdebug enhancedinput displays the available input action and axis mappings used by your project. Input.+key injects simulated input and showdebug devices shows devices."
    flavors:
      _default: {why: "Players press early. A game that forgives that by a few frames feels responsive; one that does not feels broken."}
      gameplay_design: {why: "Buffer windows, hold times, and chords are feel numbers you will own on every action.", do: "Log how many buffered attacks fired during one minute of play and adjust the window."}
      programming: {why: "Trigger states and mapping priority decide which code runs. Debugging input starts here.", do: "Write a custom Input Trigger Blueprint child that returns Triggered only above a stick value of 0.8."}

  - id: GDQ81
