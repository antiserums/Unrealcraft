    quiz:
      - q: "Where does the docs say to add the AI Perception Component?"
        choices: ["On the Pawn's Static Mesh", "On the Game Mode", "On the NavMeshBoundsVolume", "On the Pawn's AIController Blueprint"]
        answer_index: 3
        explain: "The AI Perception Component is added to the Pawn's AIController Blueprint. It acts as a stimuli listener and gathers registered stimuli sources."
      - q: "What is the difference between On Perception Updated and On Target Perception Updated?"
        choices: ["The first returns one Actor with a stimulus; the second returns an array of Actors", "The first returns an array of Actors; the second returns one Actor plus an AIStimulus struct", "They are the same event with two names", "The second only works for Hearing"]
        answer_index: 1
        explain: "On Perception Updated returns an array of Actors that signaled the update. On Target Perception Updated returns the Actor and an AI Stimulus struct you can break down."
      - q: "Which field of the AIStimulus tells you if the actor was actually sensed (true) or the stimulus was lost (false)?"
        choices: ["Age", "Strength", "Successfully Sensed", "Receiver Location"]
        answer_index: 2
        explain: "Successfully Sensed is True or False. The quick starts use it to branch: true clears the lost-sight timer, false starts it."
      - q: "Peripheral Vision Half Angle Degrees is 45. How wide is the whole sight cone?"
        choices: ["45 degrees", "90 degrees", "22.5 degrees", "180 degrees"]
        answer_index: 1
        explain: "The value is measured from the forward vector to one side, not the whole range. 45 on each side gives a 90 degree cone."
      - q: "Why do the Blueprint guides enable Detect Neutrals and then filter with Tags?"
        choices: ["Because Sight cannot detect enemies", "Because Tags are faster than affiliation", "Because affiliation (team) can only be set in C++, and actors are neutral by default", "Because Neutrals is the only option that works in packaged games"]
        answer_index: 2
        explain: "Currently affiliation can only be defined in C++. Actors have no affiliation by default and are neutral, so Blueprint users detect neutrals and filter by Tag."
      - q: "What produces a stimulus for the AI Hearing sense?"
        choices: ["Any sound played with Play Sound at Location", "Any actor overlapping the AI", "Only projectiles", "A Report Noise Event"]
        answer_index: 3
        explain: "AI Hearing detects sounds generated by a Report Noise Event, for example a projectile that hits something and reports a noise."
      - q: "Max Age on a sense config is 0. What does that mean?"
        choices: ["The stimulus is forgotten right away", "The sense is disabled", "The stimulus is never forgotten", "The sense only updates once per second"]
        answer_index: 2
        explain: "Max Age is the time before a stimulus is forgotten, and 0 means never forgotten. To forget actors you also need Project Settings > AI System > Forget Stale Actors set to true."
      - q: "What does Lose Sight Radius do compared to Sight Radius?"
        choices: ["Lose Sight Radius is where the AI starts to see; Sight Radius is where it stops", "Sight Radius is the max distance to start perceiving; Lose Sight Radius is the max distance at which an already seen target is still perceived", "They must always be equal", "Lose Sight Radius only affects Hearing"]
        answer_index: 1
        explain: "Sight Radius is where perception can start. Lose Sight Radius is the larger distance at which a target that was already seen is finally lost. This avoids flicker at the edge."
      - q: "What does the AI Perception Stimuli Source component do on the player?"
        choices: ["It lets the player see AI", "It replaces the player's collision", "It stores perceived actors", "It registers the owning actor as a source of stimuli for the chosen senses"]
        answer_index: 3
        explain: "The Stimuli Source component registers its owning Actor as a stimuli source for the senses listed in Register as Source for Senses. With Auto Register as Source on, you do not need to call Register with Perception System."
      - q: "Which function returns actors that were perceived and are not yet forgotten, even if not currently perceived?"
        choices: ["Get Currently Perceived Actors", "Get Known Perceived Actors", "Forget All", "Request Stimuli Listener Update"]
        answer_index: 1
        explain: "Get Known Perceived Actors returns actors that have been perceived and not yet forgotten. Get Currently Perceived Actors returns only those being perceived now."
    flavors:
      _default: {why: "Perception is how an AI knows the player exists. Its numbers decide if a stealth or combat moment feels fair."}
      gameplay_design: {why: "Sight cone, radius and forget time are the tuning knobs of stealth and alert states.", do: "Write down three values (radius, half angle, Max Age) and the play feel each gave."}
      level_design: {why: "Sight lines and noise ranges decide where cover and patrol routes work.", do: "Place one wall that blocks sight but not hearing and test it."}

