  - id: GDQ28
    rank: 3
    difficulty: expert
    specializations: [gameplay_design]
    subjects: [ai, behavior-tree, blackboard, blueprint]
    required_spine: false
    required: true
    title: "Behavior Trees: an enemy that reacts"
    brief: "A Behavior Tree is an asset that decides what an AI character does, by choosing between branches such as chase and patrol. It reads its facts from a Blackboard, a small list of named values called keys, for example whether the enemy can see the player. Behavior Trees are the standard way to build enemies in Unreal whose behavior is easy to read and tune. In this quest you build an enemy that patrols and then chases the player when it sees them."
    time_min: 120
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/behavior-tree-in-unreal-engine---quick-start-guide"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/behavior-trees-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/behavior-tree-in-unreal-engine---overview"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-behavior-tree-node-reference-decorators"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-behavior-tree-node-reference-services"
    checklist:
      - "Open a project made from the Third Person template, or create one. Copy BP_ThirdPersonCharacter into a folder named AI and name the copy Enemy_Character. Delete its input script. Create an AIController Blueprint named Enemy_Controller, and set it as the AI Controller Class of Enemy_Character."
      - "Create a Blackboard named BB_Enemy with three keys: EnemyActor (type Object, with base class Actor), HasLineOfSight (type Bool) and PatrolLocation (type Vector)."
      - "Create a Behavior Tree named BT_Enemy. Add a Selector node named AI Root and give it two Sequence children named Chase Player and Patrol. Add a Wait task as the last fallback, which runs when the other branches fail."
      - "Create two task Blueprints named BTT_ChasePlayer and BTT_FindRandomPatrol. In each one, start from Event Receive Execute AI, call a function on the character, and end with Finish Execute. Make the variables ChaseSpeed and PatrolRadius Instance Editable."
      - "In Enemy_Controller, run BT_Enemy from Event On Possess. Add an AIPerception component with an AI Sight config, which lets the enemy see. On the On Target Perception Updated event, set HasLineOfSight and EnemyActor in the Blackboard."
      - "Put a Blackboard decorator, which is a condition, on Chase Player. Set its key to HasLineOfSight and set Observer aborts to Both. Add a NavMeshBoundsVolume to the level so the enemy can find paths, place the enemy, and press Play."
      - "While the game runs, open BT_Enemy and watch which branch is active. Change ChaseSpeed on the task node and test again."
    done_when: "Send two screenshots. The first shows BT_Enemy in the Behavior Tree editor while the game runs, with the active branch highlighted and the Blackboard values visible. The second shows the AI Perception graph in Enemy_Controller. Add one sentence that says what value of ChaseSpeed felt right and why."
    xp: 180
    verify_type: screenshot
    quiz:
      - q: "What does the Blackboard do in this setup?"
        choices: ["It runs the logic of the tree from left to right and picks the next task", "It replaces the AI Controller", "It draws the navigation mesh", "It stores keys (values) that the Behavior Tree reads to make decisions"]
        answer_index: 3
        explain: "The Behavior Tree runs the logic. The Blackboard is the 'brain' that holds keys such as HasLineOfSight, and the tree reads those keys to choose a branch."
      - q: "A Selector has three children. In what order does the tree try them, and when does it stop?"
        choices: ["Left to right; it stops at the first child that succeeds", "Right to left; it stops at the first child that fails", "All at the same time; it stops when all finish", "Random order; it never stops"]
        answer_index: 0
        explain: "Behavior Trees run left to right and top to bottom. A Selector stops moving between subtrees when one succeeds. The small number in the top-right corner of a node shows the order."
      - q: "A Sequence has children Move To, Check Range, Attack. Check Range fails. What happens?"
        choices: ["Attack still runs, because a Sequence ignores the failures of its children", "The Sequence keeps trying Check Range forever", "Attack does not run; the Sequence stops and fails back up the tree", "The tree restarts from the Root immediately"]
        answer_index: 2
        explain: "A Sequence runs its children in order until one fails. When a child fails, the rest of the sequence is not run and the branch fails back up to its parent."
      - q: "Where should a condition such as 'Can the AI see the player?' live in an Unreal Behavior Tree?"
        choices: ["As a Task leaf node that returns success or fail", "As a Service on the Root node", "As a variable inside the Pawn only", "As a Decorator attached to the branch it controls"]
        answer_index: 3
        explain: "The docs recommend Decorators (conditionals) instead of conditional Tasks. The decorator sits at the top of the branch it closes off, so the tree is easier to read and it can observe the value and abort."
      - q: "Chase Player has a Blackboard decorator with Observer aborts = Lower Priority. What does that setting do?"
        choices: ["Aborts only the Chase Player branch itself", "Aborts nothing; it only changes the color of the node in the graph", "Aborts branches to the right of this node when the key changes", "Aborts the whole tree and stops the AI"]
        answer_index: 2
        explain: "Lower Priority aborts any nodes to the right of this node. Self aborts this branch and its subtrees. Both does both. None aborts nothing."
      - q: "You want the AI to re-check the best target every 0.5 seconds while it keeps doing its current branch. Which node type fits?"
        choices: ["A Service attached to the Composite node", "A second Root node", "A Wait task with a wait time of 0.5 seconds", "A Force Success decorator"]
        answer_index: 0
        explain: "Services attach to Composite or Task nodes and run at their Interval while their branch is active. They are used for checks and Blackboard updates and replace parallel nodes from other systems."
      - q: "Why are Unreal Behavior Trees described as event-driven?"
        choices: ["They only run when the player presses a key", "They check the whole tree every frame to find changes", "They listen for changes (for example a Blackboard key) instead of scanning the tree every tick", "They can only be started from an event in the Level Blueprint, such as BeginPlay or a custom event"]
        answer_index: 2
        explain: "The tree passively listens for events, such as a Blackboard key changing, and reacts. This avoids doing work every frame and makes debugging history cleaner."
      - q: "Where does the quick start call Run Behavior Tree?"
        choices: ["In the Level Blueprint on Event Begin Play", "In the enemy Character on Tick", "In the AI Controller on Event On Possess", "In the Blackboard asset"]
        answer_index: 2
        explain: "The AI Controller possesses the Pawn. On Event On Possess it calls Run Behavior Tree with BT_Enemy. Run Behavior Tree targets AI Controller Blueprints."
      - q: "In a custom Blueprint task, what must happen at the end of the logic?"
        choices: ["Call Finish Execute with Success true or false", "Call Run Behavior Tree again on the controller", "Destroy the task", "Set the Blackboard to null"]
        answer_index: 0
        explain: "A task runs from Event Receive Execute AI and must call Finish Execute. Success true means the task finished; Success false marks it as failed and aborts it."
      - q: "You promote ChaseSpeed to a variable and enable Instance Editable in BTT_ChasePlayer. What do you gain?"
        choices: ["The value is saved to disk automatically", "The variable is shared with all Blackboards and can be read as a key in any other tree", "The task runs faster", "The value becomes a property you can edit on the task node inside the Behavior Tree"]
        answer_index: 3
        explain: "Instance Editable variables of a task show up as properties on the task node in the Behavior Tree, so a designer can tune them without opening the task graph."
    flavors:
      _default: {why: "Behavior Trees are the standard way to give enemies readable, tunable behavior in Unreal."}
      gameplay_design: {why: "An enemy that reacts to the player is the heart of most action loops. You need to read and tune a tree, not only build it.", do: "Add a Cooldown decorator on the Chase branch and write one line about how it changes the feel."}
      programming: {why: "Blueprint tasks are fast to iterate; native tasks are faster to run. Knowing the structure helps you move code later.", do: "Note which task you would move to C++ first and why."}

  - id: GDQ29
    rank: 3
    difficulty: expert
    specializations: [gameplay_design]
    subjects: [ai, eqs, behavior-tree, blueprint]
    required_spine: false
    required: true
    title: "EQS: pick a good spot"
    brief: "The Environment Query System, or EQS, lets an AI ask questions about the space around it, such as which nearby point can see the player and is closest to them. A query generates many candidate points, tests remove or score them, and the best point wins. This lets an AI pick a good spot by rules that you can read and tune, and you do not need to place fixed positions by hand. In this quest you build a query, use it from a Behavior Tree, and look at the scores while the game runs."
    time_min: 120
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/environment-query-system-quick-start-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/environment-query-system-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/environment-query-system-overview-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/eqs-node-reference-tests-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/ai-debugging-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. This quest follows the EQS Quick Start page that is linked on it, so keep that page open for the details. If the Environment Query asset type is missing from the Artificial Intelligence menu of the Content Browser, enable the Environment Query Editor plugin."
      - "Create a Blackboard named BB_Enemy, a Behavior Tree named BT_Enemy, an Environment Query named EQS_FindPlayer, an AIController named AIC_Enemy that runs BT_Enemy when it possesses a pawn, and a Blueprint named EQC_PlayerContext with the parent class EnvQueryContext_BlueprintBase."
      - "For the enemy, duplicate BP_ThirdPersonCharacter, delete its input logic, set its AI Controller Class to AIC_Enemy, and place it in a level that has a Nav Mesh Bounds Volume."
      - "In EQC_PlayerContext, override the function Provide Single Actor and return Get Player Character. This tells the query who the player is."
      - "In EQS_FindPlayer, add a Points: Grid generator with GridHalfSize 800 and Space Between 150. Add a Trace test set to Filter Only, with Context EQC_PlayerContext and Bool Match turned off. Add a Distance test set to Score Only, with Scoring Factor -1.0."
      - "Build BT_Enemy with a selector named In Combat that has two sequences, Attack and Move into Position, and add a sequence named Patrolling. In Move into Position, use a Run EQSQuery node that writes its result to the key MoveToLocation, followed by Move To and Rotate to face BB entry."
      - "In AIC_Enemy, add an AIPerception component with a Sight config that has Detect Neutrals turned on. From the On Target Perception Updated event, update the Blackboard keys HasLineOfSight and TargetActor."
      - "Press Play. Press the apostrophe key and then Numpad 3 to open the EQS debug view. It shows the grid points, their scores and the point marked Winner."
      - "Change the Scoring Factor of the Distance test to 1.0 and watch how the chosen spot changes. Then set it back to -1.0."
    done_when: "Send two screenshots. The first shows the EQS debug view during play (apostrophe, then Numpad 3) with scored points and the Winner label. The second shows the EQS_FindPlayer graph with both tests. Add one sentence that says what changed when the Scoring Factor was 1.0 and not -1.0."
    xp: 180
    verify_type: screenshot
    quiz:
      - q: "What are the three main parts of an Environment Query?"
        choices: ["Generator, Contexts, Tests", "Blackboard, Selector, Sequence", "Pawn, Controller, Character", "Trace, Overlap, Pathfinding"]
        answer_index: 0
        explain: "A Generator produces Items (points or actors), Contexts are the frame of reference, and Tests filter or score the Items. The Behavior Tree gets the highest weighted result."
      - q: "You add a Distance test and a Trace test to the grid. Does the order you added them in matter?"
        choices: ["Yes, tests always run in the order you added them, from the top to the bottom", "Yes, the last test always wins", "No, all tests run at the same time on the GPU", "No, filters are sorted first and cheaper filters run before expensive ones"]
        answer_index: 3
        explain: "The order is irrelevant. EQS puts filter tests first so later tests handle fewer items, and sorts filters by cost, so a distance filter runs before a line-of-sight trace."
      - q: "What does Test Purpose = Filter Only do?"
        choices: ["Gives every item a weight between 0 and 1 and removes none", "Runs the test only once per game", "Removes items that fail the test; it does not score them", "Makes the test visible in the debugger only"]
        answer_index: 2
        explain: "Filter Only removes Items that fail. Score Only gives Items a weight. Filter and Score does both. Filtering happens before scoring."
      - q: "Why does the quick start set the Distance test Scoring Factor to -1.0?"
        choices: ["To turn the test into a filter that removes every point that is too far from the player", "To make the AI prefer points closer to the player instead of the furthest points", "To disable the test", "To make the grid smaller"]
        answer_index: 1
        explain: "With 1.0 the furthest points score highest and the AI may run past the player. A negative factor flips the score so closer points win."
      - q: "On the Trace test, Bool Match is disabled and the Context is the player. What does this filter out?"
        choices: ["Points that can see the player", "Points that are too far from the player", "Points that are on stairs", "Points that cannot see the player"]
        answer_index: 3
        explain: "Bool Match is the value to match. With it disabled and a Trace to the player context, points that cannot see the player are removed."
      - q: "How does a Behavior Tree use the result of the query?"
        choices: ["The Run EQSQuery task writes the result into a Blackboard key such as MoveToLocation", "The query moves the Pawn directly to the best point, with no task or Blackboard key in between", "The result is printed on screen", "The query changes the NavMesh"]
        answer_index: 0
        explain: "The Run EQSQuery node runs a Query Template and updates the assigned Blackboard Key. A following Move To task then uses that key."
      - q: "Which one can you create in Blueprint without C++?"
        choices: ["A custom Test", "A new scoring equation type", "A custom Generator or Context", "A new normalization type"]
        answer_index: 2
        explain: "Custom Generators can be made in Blueprint (or C++). Custom Tests can only be created through C++."
      - q: "What is the grid half size and spacing warning about?"
        choices: ["A grid that is too large can hurt performance because more points are tested", "A grid smaller than 800 does not work", "Spacing must be a whole number", "The grid must be square to the world axes, or the points are placed in the wrong spots"]
        answer_index: 0
        explain: "GridHalfSize and Space Between define how many points are generated. The docs say to keep this manageable because a very large grid can impact performance."
      - q: "How do you see the EQS points and their scores while playing?"
        choices: ["Press P in the editor viewport", "Open the Blackboard panel", "Use the console command stat eqs in play", "Press the apostrophe key, then Numpad 3"]
        answer_index: 3
        explain: "The apostrophe key opens the AI Debugging tools. Numpad 3 shows EQS. Points are drawn with score values and the chosen point is marked Winner."
      - q: "You want to check the query in the editor without pressing Play. What does the docs suggest?"
        choices: ["An EQS Testing Pawn with the Query Template assigned", "A Level Blueprint that calls the query on construction", "A Print String in the context", "A second Behavior Tree"]
        answer_index: 0
        explain: "The EQS Testing Pawn is a special Pawn class. Place it and set the Query Template to see results in the editor. The context may need Provide Actors Set with Get All Actors of Class."
    flavors:
      _default: {why: "EQS lets AI choose a spot by rules you can read and tune, instead of hard-coded positions."}
      gameplay_design: {why: "Where an enemy stands changes how a fight feels. EQS turns 'find a good spot' into scores you can tweak.", do: "Add a second Distance test that keeps the AI at least 500 units away and note the effect."}
      level_design: {why: "Layouts change EQS results. Cover and sight lines are level design problems.", do: "Move one wall and screenshot how the Winner point changes."}

  - id: GDQ30
