  - id: GDQ48
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [blueprint, melee, traces, animation-notifies, combat]
    required_spine: false
    required: false
    title: "Melee hit detection with sphere traces"
    brief: "In a melee attack, such as a punch, the game must decide the exact moment and place where the hit lands. A common way is a sphere trace: Unreal moves an unseen sphere along a short line and reports what it touches. An Animation Notify is a marker inside an animation that tells your Blueprint when the right frame is reached. In this quest you play a punch animation and run a sphere trace at the frame where the arm is extended."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Collision/SphereTraceByChannel"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Collision/MultiSphereTraceByChannel"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/traces-with-raycasts-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-a-multi-line-trace-raycast-by-channel-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-notifies-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Animation/Montage/PlayMontage"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/variants-in-game-templates"
    checklist:
      - "Read the node page for Sphere Trace By Channel that is linked on this quest, and look up Multi Sphere Trace By Channel and Play Montage in the same Blueprint API reference."
      - "Optional but useful: create a Third Person project with the Combat variant. Play its hand combat and combo attack to feel a good example."
      - "Open a project made from the Third Person template, or create one. Make an Animation Montage named AM_Punch from any short attack or gesture animation of the mannequin: right-click the animation and choose Create, then Create AnimMontage. In the montage, right-click the Notify track and add a Montage Notify named HitWindow at the frame where the hand is extended. Make sure the Animation Blueprint of the character has a Slot 'DefaultSlot' node before Output Pose."
      - "Create an Input Action named IA_Attack and map it to a key or mouse button in the Input Mapping Context of the template. In the character, from the Started pin of IA_Attack, call Play Montage (not Play Anim Montage) with AM_Punch on the Mesh. Store a bool named IsAttacking, and set it to false from both On Completed and On Interrupted."
      - "From the On Notify Begin pin of the Play Montage node, check that Notify Name == HitWindow. Then run Multi Sphere Trace By Channel from the actor location to 120 units forward, with Radius 40 and the channel Visibility. Set Draw Debug Type to For Duration, and add Self to Actors to Ignore."
      - "Add a For Each Loop over Out Hits. For each hit, use Break Hit Result, call Apply Damage with 10 on the Hit Actor, and print its display name. To test, make a target dummy: an Actor Blueprint named BP_Target with a cube mesh and an Event AnyDamage that prints the damage. Place three of them in a row."
      - "Tune the Radius, the distance and the frame of the notify until a hit lands only when the arm is extended and only on the enemy in front. Then compare Sphere Trace By Channel, which returns the first hit only, with the Multi version, which returns many hits."
    done_when: "Send a screenshot of the attack graph that shows Play Montage with On Notify Begin leading into Multi Sphere Trace By Channel. Also send a screenshot taken during play that shows the debug sphere hitting a target dummy."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "What does Sphere Trace By Channel return?"
        choices: ["All hits along the line, sorted by distance from the start of the trace", "Only overlapping actors", "The closest actor in the level", "The first blocking hit encountered while sweeping a sphere along the line"]
        answer_index: 3
        explain: "The node page says it sweeps a sphere along the given line and returns the first blocking hit encountered."
      - q: "What does Multi Sphere Trace By Channel return in Out Hits?"
        choices: ["All hits up to and including the first blocking hit, sorted from start to finish", "Only the blocking hit", "Random hits", "Hits behind the start point, sorted from the nearest one to the very furthest one"]
        answer_index: 0
        explain: "The page says it returns all hits up to and including the first blocking hit, sorted along the trace, with the blocking hit last if there is one."
      - q: "The Return Value of Multi Sphere Trace By Channel is true when..."
        choices: ["Any overlap was found", "Radius is above 0", "There was a blocking hit", "Trace Complex is on"]
        answer_index: 2
        explain: "The page says Return Value is true if there was a blocking hit, false otherwise. Overlaps alone do not make it true."
      - q: "Your punch hits the attacker himself. Which trace inputs solve this?"
        choices: ["Trace Complex and Draw Time", "Ignore Self and Actors to Ignore", "Trace Color and Trace Hit Color", "Radius and End"]
        answer_index: 1
        explain: "Both trace nodes list Ignore Self and an Actors to Ignore array. The single line trace tutorial also explains Actors to Ignore."
      - q: "A glass window is set to Overlap the trace channel and an enemy behind it Blocks. What does a multi trace by channel give you?"
        choices: ["Only the glass window", "Only the enemy", "The window and the enemy", "Nothing"]
        answer_index: 2
        explain: "The Multi Line Trace page says you receive all overlapping objects up to and including the first blocking hit, so both the window and the enemy."
      - q: "What is the difference between a trace by Channel and a trace by Object?"
        choices: ["By Channel returns objects that respond to the trace channel; by Object returns only the specified object types", "They are identical", "By Object only works in C++", "By Channel cannot use a sphere or a box shape; by Object can use any shape and also returns every hit along the line"]
        answer_index: 0
        explain: "The Traces with Raycasts overview explains trace by channel uses collision responses to a channel, while trace by object returns specified object types."
      - q: "You add a Montage Notify to the montage. Which node do you need to receive On Notify Begin?"
        choices: ["Play Anim Montage", "Play Sound at Location", "Set Timer by Event", "Play Montage"]
        answer_index: 3
        explain: "The Animation Notifies page says Montage Notify fires On Notify Begin on the Play Montage function, and this requires Play Montage instead of Play Anim Montage."
      - q: "How is a Notify State different from a normal Notify?"
        choices: ["It has no events", "It operates over a duration and gives a start, an update and an end event", "It only plays sounds", "It is saved in the Level Blueprint and not in the animation asset itself"]
        answer_index: 1
        explain: "The page says Notify States operate over a duration rather than a single event and provide start, update and end events."
    flavors:
      _default: {why: "Melee feel is timing. The hit must land on the frame the eye expects, on the target the player aimed at."}
      gameplay_design: {why: "A trace in a notify window is the standard prototype for melee. Learn its three dials: window, reach and radius.", do: "Add a second montage for a heavy attack with a wider radius and a longer window, and compare how safe each one feels to use."}

  - id: GDQ49
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [umg, hud, event-dispatchers, blueprint]
    required_spine: false
    required: false
    title: "Health bar that updates only on change"
    brief: "A health bar can ask for the health value on every frame, or it can wait until the game tells it that the value changed. The second way does less work and is easier to understand. In Unreal you build it with an Event Dispatcher, a kind of signal that one Blueprint sends and other Blueprints can listen to. In this quest you make a health bar that updates only when the Health of the character changes."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/driving-ui-updates-with-events-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/widget-components-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. In BP_ThirdPersonCharacter, add a float variable Health with the value 100 and an Event Dispatcher named OnHealthChanged. Call the dispatcher at the end of every script that changes Health, for example a key press that removes 10."
      - "Create a Widget Blueprint named WBP_HealthBar with a Progress Bar named barHealth. Do NOT use the Bind option on the Percent field."
      - "In the widget graph, on Event Construct, get the player character, cast it to BP_ThirdPersonCharacter, and store it in a variable."
      - "Add a Custom Event named UpdateHealth that sets the Percent of barHealth to Health / 100. Right after the cast, use a Bind Event node to bind UpdateHealth to OnHealthChanged."
      - "Call UpdateHealth one time after the bind, so the bar is correct on the first frame. Then, on BeginPlay, create the widget and call Add to Viewport."
      - "Bonus: add a Widget Component to any enemy or prop actor. Set its Widget Class to WBP_HealthBar and its Space to Screen, and compare it with Space set to World."
    done_when: "Send a screenshot of the widget graph that shows the cast, the Bind Event node and UpdateHealth. Also send a screenshot of the game with the bar partly empty after you took damage."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "The page shows three ways to send Health to a HUD. Which one does it call the most cost effective?"
        choices: ["Function Binding", "Property Binding", "Event Driven with Event Dispatchers", "A Print String node on every frame"]
        answer_index: 2
        explain: "The third example, Event Driven, moves the update away from tick and only updates when the value changes."
      - q: "Why is Function Binding the most expensive of the three?"
        choices: ["It casts to the character and reads the value every frame", "It needs a Data Table", "It only works on the server, so every value is sent twice", "It cannot show progress bars"]
        answer_index: 0
