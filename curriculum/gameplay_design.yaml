    required: false
    title: "Tune a query with the EQS Testing Pawn"
    brief: "An EQS query scores many points in the level and picks the best one, but those scores are hard to tune when you cannot see them. The EQS Testing Pawn is a special actor that runs a query inside the editor and draws every point as a colored sphere with its score, before the game even runs. In this quest you build a query that finds a spot to flee to, study it with the Testing Pawn, and then use it in the Behavior Tree of an enemy."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/environment-query-testing-pawn-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/environment-query-system-overview-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/eqs-node-reference-contexts-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-behavior-tree-node-reference-tasks"
    checklist:
      - "Open a project made from the Third Person template, or create one, and work in a level that has a Nav Mesh Bounds Volume. If the Environment Query asset type is missing from the Artificial Intelligence menu, enable the Environment Query Editor plugin. Create a query context named EQC_PlayerContext, if you do not have one: make a Blueprint with the parent EnvQueryContext_BlueprintBase, override Provide Single Actor, and return Get Player Character."
      - "Create an Environment Query named EQS_FleeSpot with a Points: Donut generator around the Querier. Add a Distance test to EQC_PlayerContext set to Score Only with Scoring Factor 1.0. Add a Trace test to EQC_PlayerContext set to Filter Only, so that spots the player can see are removed."
      - "Create a Blueprint named BP_EQSTester from the EQSTestingPawn class. Place it in the level and set its Query Template to EQS_FleeSpot. Turn on Draw Labels. Move the pawn and read the colors and numbers on the spheres."
      - "Set Highlight Mode so that it shows the best 25 percent. Then set Querying Mode to Single Result, and change Step to Debug Draw to see the Distance test alone and the Trace test alone."
      - "Clear the Query Template on the pawn, change the donut radius in EQS_FleeSpot, and then set the template again. Do not edit the query while it is assigned to the pawn."
      - "Use the Behavior Tree of an enemy of your own, or make a small one now: a copy of BP_ThirdPersonCharacter without input, an AIController Blueprint that calls Run Behavior Tree, a Blackboard with a Vector key named FleeLocation, and a Behavior Tree named BT_Enemy. In the tree, add a Flee branch. It holds a Run EQS Query task with Query Template EQS_FleeSpot and Blackboard Key FleeLocation, followed by Move To with FleeLocation. Test the Run Mode Single Best Item, and then Single Random Item from Best 25 percent."
      - "Play twice with each Run Mode and watch where the enemy goes."
    done_when: "Send two screenshots. The first shows BP_EQSTester selected in the level with labelled spheres, from green to red and with some blue ones. The second shows the details of the Run EQS Query node with the Run Mode you kept. Add one sentence that says why a random item from the best 25 percent can be better than the single best item."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "A sphere from the EQS Testing Pawn is blue. What does that mean?"
        choices: ["A Test failed at that item, so it is culled from the results", "It is the best item", "The item has no score yet", "The item is outside the NavMesh and cannot be reached at all"]
        answer_index: 0
        explain: "Blue spheres are items where a test failed (for example a Trace test) and the item was completely removed from the results."
      - q: "Two spheres are green and red. Which is more desirable, and what is the number on them?"
        choices: ["Red is better; the number is the distance to the querier in cm", "They are equal; the number is the item index", "Red is better; the number is the test count", "Green is better; the number is the weighted score of the item"]
        answer_index: 3
        explain: "Green means more desirable than red, and the label shows the weighted score of that item."
      - q: "Why does the page tell you to clear the Query Template on the Testing Pawn while you edit the query?"
        choices: ["Edits to the query are not saved to disk while the template is assigned", "Changing an active template can make the editor hang for a very long time", "The pawn deletes the query on edit", "The colors will be wrong"]
        answer_index: 1
        explain: "The Testing Pawn is processor intensive. Changing its active Query Template can hang your system, so clear it while you edit."
      - q: "What does Re Run Query Only on Finished Move do, and what is the advice?"
        choices: ["Runs the query every frame; turn it off", "Runs the query once at the start of the session and never again; always turn it off before you edit", "Updates the debug view only when you stop moving the pawn; keep it on unless the query is very fast", "Disables the query while moving; never use it"]
        answer_index: 2
        explain: "It updates the visualization only after the pawn stops moving. The page advises keeping it enabled unless the query is very quick."
      - q: "Run EQS Query is set to Single Random Item from Best 25 percent. Which items can be picked?"
        choices: ["Any item that passed the filters, whatever its score may be", "The 25 closest items", "Only the single best item", "A random item with a score from 75 to 100 percent of the max"]
        answer_index: 3
        explain: "Best 25 percent means a random item whose score is between 75 and 100 percent of the maximum score."
      - q: "You add a Distance test first and a Trace filter second. Does the order change the result?"
