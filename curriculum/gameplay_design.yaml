    brief: "When several people add Gameplay Tags to one project, the list of tags grows fast. A tag source is a separate config file that holds one group of tags, and a tag table is a Data Table that adds tags. Both keep a large tag tree in order. A tag query is a saved question about tags that can combine several conditions. In this quest you add tags from a new source file and from a table, build a query with two conditions, and add one tag by hand in the file."
    time_min: 60
