      - q: "What color does the editor log use for Warning messages?"
        choices: ["Red", "Grey", "White", "Yellow"]
        answer_index: 3
        explain: "The verbosity table shows Warning in yellow and Error in red. Display and Log are grey."
      - q: "Which console command changes the verbosity of a log category at runtime?"
        choices: ["verbosity LogDerivedDataCache verbose", "setlog LogDerivedDataCache=verbose", "log LogDerivedDataCache verbose", "LogCmds LogDerivedDataCache verbose"]
        answer_index: 2
        explain: "The console syntax is log <Category> <Verbosity>, for example log LogDerivedDataCache verbose. -LogCmds= is the command line form."
