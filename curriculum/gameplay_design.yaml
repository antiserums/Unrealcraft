        choices: ["In each Widget Blueprint", "In the Level Blueprint", "In a CommonUIInputData Blueprint assigned in Project Settings > Game > Common Input Settings > Input Data", "In DefaultEngine.ini only, in a section that lists the Click action and the Back action for each platform"]
        answer_index: 2
        explain: "A CommonUIInputData asset holds the default Click and Back actions and is set under Common Input Settings > Input Data."
      - q: "A gamepad's icons do not show. Which rule from the page is the likely cause?"
        choices: ["The widget that shows the icon is not focusable, so it never receives the gamepad input type", "Anchors are not set", "The DPI curve is wrong", "The Default Gamepad Name does not exactly match the Gamepad Name in a Controller Data asset"]
        answer_index: 3
        explain: "The Default Gamepad Name must exactly match the Gamepad Name field of a Controller Data Asset or it is not recognized."
      - q: "How are Common UI widgets styled?"
        choices: ["With the normal per-widget style options, set one by one in each Widget Blueprint", "With Common Style assets; changing the asset updates every widget that uses it", "Only in C++", "With Material Instances"]
        answer_index: 1
        explain: "Common UI widgets do not have the base styling options; they reference Common Style Assets, and Template Styles give project defaults."
      - q: "What does the page say about Common UI with Enhanced Input?"
        choices: ["It is fully supported and recommended for shipping since UE 5.0; it is always enabled and has no setting at all", "It is impossible", "Support is limited and, as of UE 5.2, not recommended for shipping; enable it in Game > Common Input Settings", "It requires C++"]
        answer_index: 2
