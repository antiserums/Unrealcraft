    brief: "A match in Unreal can move through fixed states: WaitingToStart before the players appear, InProgress while the game is played, and WaitingPostMatch after it ends. These match states are built into the Game Mode class, which is a more complete version of Game Mode Base. Rounds, lobbies and end screens all depend on them, so it is better to use them than to build your own version. In this quest you make a Game Mode that waits for a key before it starts the match and that ends the match on another key."
