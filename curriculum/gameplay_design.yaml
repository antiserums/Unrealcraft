    title: "Senses beyond sight: damage, touch and a dominant sense"
    brief: "Sight is only one of the senses in the AI Perception system. An enemy can also notice that it was damaged or that something touched it. These senses let an enemy react when the player breaks the rules of stealth, for example by hitting a guard from behind. In this quest you add the damage and touch senses to an enemy and make a sleepy guard wake up when it is hit or touched."
