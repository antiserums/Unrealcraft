    verify_type: screenshot
    quiz:
      - q: "What must the Game Viewport Client Class be set to for Common UI input routing?"
        choices: ["GameViewportClient", "CommonGameViewportClient", "SlateViewportClient", "UMGViewportClient"]
        answer_index: 1
        explain: "The Viewport is the base of Common UI input routing; you set the class to CommonGameViewportClient, or extend it."
      - q: "Which row structure does a Common UI Input Action Data Table use?"
        choices: ["InputActionDataRow", "GameplayTagTableRow", "EnhancedInputAction", "CommonInputActionDataBase"]
        answer_index: 3
        explain: "You create a Data Table asset and select CommonInputActionDataBase as the row structure."
