  - id: GDQ57
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [ai, behavior-tree, blackboard, gameplay-tags]
    required_spine: false
    required: false
    title: "Sub-trees, cooldowns and Simple Parallel"
    brief: "A real enemy is rarely one very large Behavior Tree. It is built from smaller trees that you can reuse, from cooldowns that stop an action from repeating too fast, and from actions that run at the same time. In this quest you improve an enemy that patrols and chases with a sub-tree for patrol, a Simple Parallel node that moves and plays a sound together, and an attack with a cooldown."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/behavior-tree-in-unreal-engine---user-guide"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-behavior-tree-node-reference-composites"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-behavior-tree-node-reference-tasks"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-behavior-tree-node-reference-decorators"
    checklist:
      - "Open a project made from the Third Person template, or create one. You need an enemy with a Behavior Tree that patrols and chases the player: a Blackboard named BB_Enemy with the keys EnemyActor, HasLineOfSight and PatrolLocation, a Behavior Tree named BT_Enemy with a Selector that has a Chase Player sequence and a Patrol sequence, and an AIController named Enemy_Controller that runs the tree. Epic's Behavior Tree Quick Start Guide builds exactly this enemy step by step, so follow it if you have none. Duplicate BT_Enemy, name the copy BT_Enemy_v2, and run BT_Enemy_v2 from the controller."
      - "Move the whole Patrol sequence into its own asset named BT_Patrol that uses the same Blackboard. In BT_Enemy_v2, replace the sequence with a Run Behavior task that runs BT_Patrol."
      - "Under Chase Player, add a Simple Parallel node. Its main task is Move To with the key EnemyActor. Its background tree is a Sequence with Play Sound and a Wait of 1.0 with Random Deviation 0.5. Set Finish Mode to Immediate."
      - "Add an Attack sequence before Chase Player. It holds Rotate to face BB entry with EnemyActor, then a custom task named BTT_Attack that prints Attack, then Set Tag Cooldown with the tag AI.Cooldown.Attack for 3 seconds. Put a Tag Cooldown decorator with the same tag on the Attack sequence."
      - "Put a Time Limit decorator of 8 seconds on Chase Player. A chase that never reaches the player then fails, and the tree falls back to patrol."
      - "Give every composite node a clear Node Name, so that the tree reads like a sentence. Press Play and open BT_Enemy_v2 while the game runs. Watch the cooldown block Attack and watch Attack come back after 3 seconds."
      - "Change Finish Mode to Delayed and play again. Note the difference in one sentence."
    done_when: "Send one screenshot of BT_Enemy_v2 in the Behavior Tree editor while the game runs. It must show the Run Behavior node, the Simple Parallel node and the Tag Cooldown decorator. Add one sentence that says which Finish Mode you kept and why."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which node type is the only one that can be connected to the Root node of a Behavior Tree?"
        choices: ["A Task node", "A Decorator node", "A Composite node", "A Service node"]
        answer_index: 2
        explain: "Only Composite nodes (Selector, Sequence, Simple Parallel) can attach to the Root. Tasks, Decorators and Services hang under Composites."
      - q: "A Simple Parallel has Finish Mode set to Immediate. What happens when its main Task finishes?"
        choices: ["The background tree is aborted right away", "The background tree is allowed to finish first", "The main Task restarts", "The whole Behavior Tree stops"]
        answer_index: 0
        explain: "Immediate aborts the background tree as soon as the main Task ends. Delayed lets the background tree finish first."
      - q: "You want to swap a sub-tree asset while the game runs. Which task do you need?"
        choices: ["Run Behavior, because it accepts any asset and can change it at any time during play", "Run EQS Query", "Push Pawn Action", "Run Behavior Dynamic, set with SetDynamicSubtree on the Behavior Tree Component"]
        answer_index: 3
        explain: "Run Behavior cannot change its subtree at runtime. Run Behavior Dynamic can, through SetDynamicSubtree and an Injection Tag."
      - q: "What is the trade-off of Run Behavior Dynamic compared with Run Behavior?"
        choices: ["It runs slower on every tick", "It does not support the subtree's Root-level Decorators", "It cannot use the Blackboard of the parent tree at all", "It only works in C++"]
        answer_index: 1
        explain: "Run Behavior injects the subtree's Root-level Decorators into the parent tree. Run Behavior Dynamic does not support them."
      - q: "Set Tag Cooldown has Add to Existing Duration enabled and the tag is already cooling down. What happens?"
        choices: ["The new duration is added to the remaining time", "The old cooldown is replaced by the new duration", "The cooldown is cancelled", "Nothing, the node fails"]
        answer_index: 0
        explain: "Add to Existing Duration adds more time to a cooldown that already exists on that Gameplay Tag."
      - q: "A Time Limit decorator is on a branch. When does its timer reset?"
        choices: ["Never, it counts once per game", "Only when the Blackboard changes", "Every time the node gains focus", "When the Pawn stops moving"]
        answer_index: 2
        explain: "Time Limit gives the branch a set time to finish, then fails it. The timer resets each time the node gains focus."
      - q: "Where do Services attach, and when do they run?"
        choices: ["On Task nodes only, once when the Task starts", "On Composite nodes, at their set frequency while that branch is executing", "On the Root node, every frame", "On Decorators, each time the condition of that Decorator changes its value"]
        answer_index: 1
        explain: "Services attach to Composite nodes and tick at their defined frequency as long as the branch is active. They replace parallel nodes from other systems."
      - q: "What does Apply Decorator Scope on a Selector or Sequence do?"
        choices: ["Copies its Decorators to every child", "Makes its Decorators abort all lower priority nodes when the branch is left", "Disables the Decorators on this node", "Removes all Decorators in the branch below when execution leaves the branch"]
        answer_index: 3
        explain: "With Apply Decorator Scope set, Decorators in the branch below are removed when the flow leaves the branch. Decorators on the node itself are not affected."
    flavors:
      _default: {why: "Real enemies are built from reusable sub-trees, timed cooldowns and parallel actions, not one giant tree."}
      gameplay_design: {why: "Cooldowns and time limits are the knobs that make a fight feel fair.", do: "Write down the attack cooldown and chase time limit that felt right and why."}

  - id: GDQ58
    rank: 2
