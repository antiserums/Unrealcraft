  - id: GDQ51
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [umg, input-mode, pause, blueprint]
    required_spine: false
    required: false
    title: "Pause menu and input modes"
    brief: "The input mode decides where key presses and mouse clicks go: to the game, to the interface, or to both. Menus often seem broken only because the input mode is wrong, for example the buttons cannot be clicked or the character keeps moving. In this quest you build a pause menu and switch the input mode and the mouse cursor yourself when the menu opens and closes."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-widgets-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a Widget Blueprint named WBP_PauseMenu. Put a Vertical Box in the center that holds a Text with the word PAUSED and two Buttons, Resume and Quit."
      - "In BP_ThirdPersonCharacter, add an input event for the P key. When it is pressed, check if the PauseMenu variable is valid. If it is not valid, add a Create Widget node with WBP_PauseMenu and store the result in PauseMenu. Then call Add to Viewport."
      - "After you add the widget, call Get Player Controller. Use Set Show Mouse Cursor with true, then Set Input Mode UI Only, and then Set Game Paused with true."
      - "On the OnClicked event of the Resume button, call Remove from Parent, then Set Input Mode Game Only, then Set Show Mouse Cursor with false, and then Set Game Paused with false."
      - "On the Quit button, use the Quit Game node. Then test: pause, move the mouse over the buttons, resume, and check that the character moves again."
      - "Write 2-3 sentences that answer this: which Input Mode would you use for a shop interface where the player can still walk, and why?"
    done_when: "Send a screenshot of the character graph that shows the pause path and the resume path, and a screenshot of the paused game with the cursor over Resume. Add your short note about the input mode."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which Input Mode does the page recommend for non-interactive UI like Health or Time displays?"
        choices: ["Set Input Mode Game Only", "Set Input Mode UI Only", "Set Input Mode Game and UI", "No input mode is needed"]
        answer_index: 0
        explain: "Game Only enables input for the game and ignores UI elements, which is perfect for display-only UI."
      - q: "What does the page say about Set Input Mode UI Only?"
        choices: ["It is the default for all widgets, so you never need to call it yourself", "It disables all game controls; UI consumes all input, so use it sparingly", "It only works with gamepads", "It hides the widget"]
        answer_index: 1
        explain: "UI Only is called an edge case: it completely disables game controls and the UI consumes all input."
      - q: "A player should walk around AND click shop buttons. Which mode fits?"
        choices: ["UI Only", "Game Only", "Game and UI", "Remove from Parent"]
        answer_index: 2
        explain: "Game and UI lets the player control the game and also click buttons or other UI elements."
      - q: "How do you show the mouse cursor from a Blueprint?"
        choices: ["Add a Cursor widget to the viewport", "Enable Show Mouse Cursor in the Details panel of the Widget Blueprint root", "Set Input Mode Game Only", "Drag off Get Player Controller and use Set Show Mouse Cursor set to true"]
        answer_index: 3
        explain: "The page drags off a Get Player Controller node and uses Set Show Mouse Cursor checked to True."
      - q: "Which node removes a displayed widget from the screen?"
        choices: ["Destroy Actor", "Set Visibility Collapsed only", "Remove from Parent", "Remove from Viewport Class"]
        answer_index: 2
        explain: "To stop displaying a widget, use Remove from Parent with the widget as Target."
      - q: "Why does the page store the Create Widget return value in a variable such as Main Menu?"
        choices: ["Widgets cannot be created without a variable, and the node fails to compile", "So the widget can be accessed later and removed instead of being created again", "To replicate it to clients", "To make it tick"]
        answer_index: 1
        explain: "Storing the result lets you access the widget later and remove it if needed, instead of re-creating it."
      - q: "The Owning Player pin of Create Widget is left empty. What happens?"
        choices: ["The widget is not created", "It shows for all players", "The widget belongs to the server only", "The default Player Controller is used"]
        answer_index: 3
        explain: "Owning Player is the Player Controller; a blank pin uses the default Player Controller."
      - q: "You want to put a Scroll Box widget inside another widget at runtime. Which node is correct?"
        choices: ["Add Child on the parent widget", "Add to Viewport on the child", "Create Widget twice", "Set Input Mode Game and UI"]
        answer_index: 0
        explain: "Add Child parents one widget to another in a panel; Add to Viewport is for adding to the root viewport."
    flavors:
      _default: {why: "Menus break when the input mode is wrong; this quest makes the switch explicit."}
      gameplay_design: {why: "Pause is the first system state every game needs; the input mode choice decides how it feels.", do: "Add a Settings button that opens a second widget with Add Child."}
      programming: {why: "Input modes and focus are a common bug source in shipped UI.", do: "Note which class should own the pause logic (Character vs Player Controller) and why."}

  - id: GDQ52
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [umg, widget-animation, menus]
    required_spine: false
    required: false
    title: "Menu that slides in and blinks"
    brief: "Movement on the screen tells the player where to look. Widget Blueprints have their own animation tool: you set a value at one time and another value at a later time, and Unreal moves smoothly between them. Each stored value is called a key. In this quest you make a main menu where the buttons slide in from below and the START button blinks."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animating-umg-widgets-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open any project, or create one from the Third Person template. Create a Widget Blueprint named WBP_MainMenu with two Vertical Boxes. One holds a Text with the words GAME TITLE, and the other holds two Buttons, START and QUIT."
      - "Select the Vertical Box with the buttons. Set the anchor as shown on the documentation page, and set Position X to -300, Position Y to 500, Size X to 600 and Size Y to 200. Then change Position Y to 1200, which places the box below the screen."
      - "Click +Animation and name the new animation StartAnimation. Add a key for Position Y at the time 0.00. Move the Timeline Bar to 1.00, set Position Y back to 500, and add a second key."
      - "Add a second animation named BlinkingButton. Add keys for the Background Color of the START button at 1.00, 1.50 and 2.00, so that the color changes and then comes back."
      - "In the Graph, on Event Construct, play StartAnimation. Then add a Set Timer by Event node with Looping on and a time of 2 s. Connect it to a Custom Event named StartBlinking that plays BlinkingButton."
      - "Create the widget from the character Blueprint or the Level Blueprint and call Add to Viewport. Press Play and watch the buttons slide up and the START button blink."
    done_when: "Send a short video clip (30 seconds or less), or 2 screenshots that show the buttons in the middle of the slide and the START button in its blink color. Also send a screenshot of the Timeline with both animations."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which two windows at the bottom of the Widget Blueprint Editor control animation?"
        choices: ["Palette and Hierarchy", "Sequencer and Curve Editor", "Details and Graph", "Animations and Timeline"]
        answer_index: 3
        explain: "The Animations window creates animation tracks; the Timeline window places keyframes over time."
      - q: "What does the Auto Key checkbox do?"
        choices: ["Deletes all keys", "Adds keys automatically when you change a value that supports keyframing", "Plays the animation in the editor each time you change a keyframed value", "Locks the timeline"]
        answer_index: 1
        explain: "With Auto Key on, changing a keyable value adds a key at the current time on the Timeline."
      - q: "What is the second way to add a key, without Auto Key?"
        choices: ["Click the Add Key button next to a setting that supports keyframing", "Press Space", "Drag the widget in the Hierarchy onto the timeline at the right time", "Right-click the Palette"]
        answer_index: 0
        explain: "Each keyable setting has an icon next to it; clicking it adds a key at the current Timeline position."
      - q: "How do you select several keys at one time so you can edit their values together?"
        choices: ["Double-click the Timeline", "Hold Alt and drag", "Hold Ctrl and click the keys", "Use the Details panel search"]
        answer_index: 2
        explain: "Holding Ctrl and clicking keys selects them so you can set values manually via the Details panel."
      - q: "How do you get a node to Play or Stop an animation in the Graph?"
        choices: ["Hold Ctrl and drag the animation from the Animation list in My Blueprint into the graph", "Right-click in the graph, search for Sequencer and add a Play Sequence node for the widget", "Use Play Sound", "Call Add to Viewport"]
        answer_index: 0
        explain: "Each animation becomes a variable; Ctrl-dragging it into the graph lets you call Play or Stop."
      - q: "In the example menu, how is the blinking repeated?"
        choices: ["Event Tick plays it every frame", "A looping Set Timer calls a Custom Event StartBlinking every 2 seconds", "The animation is set to loop forever in the Details panel of the widget", "The button plays it on hover"]
        answer_index: 1
        explain: "On construct, a Set Timer node (Looping) calls StartBlinking every 2 seconds, which plays the animation."
      - q: "Can a single widget have more than one animation track at the same time?"
        choices: ["No, a widget can only have one single track in each animation", "Only in C++", "Yes, for example a button can move and flash at the same time", "Only with Sequencer"]
        answer_index: 2
        explain: "The page says you can have multiple animation tracks per widget, such as moving and flashing together."
      - q: "In the example, how do the buttons start off screen and end in the center?"
        choices: ["Their Visibility is animated", "A Delay node moves them", "Their Scale is keyed from 0 at 0.00 to 1 at the time 1.00", "Their Position Y is keyed from 1200 at 0.00 to 500 at 1.00"]
        answer_index: 3
        explain: "Position Y is set to 1200 for the first key and back to 500 at time 1.00, so the box slides up."
    flavors:
      _default: {why: "Motion tells the player where to look; small UI animations add polish cheaply."}
      gameplay_design: {why: "A blinking START button is a call to action; you will use the same tools for damage flashes and pickup pops.", do: "Add a third animation that shakes a health bar and play it from a damage event."}
      cinematics: {why: "UMG animation uses the same keyframe thinking as Sequencer.", do: "Add ease-in on the slide by placing an extra key and compare the feel."}

  - id: GDQ53
