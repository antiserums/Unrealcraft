    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Does a Smart Object contain the logic that runs the interaction?"
        choices: ["Yes, it runs the animation and the gameplay logic itself for every interactor", "Only if it has a Behavior Tree", "Only for players", "No, it only provides the information; each interactor implements its own logic"]
        answer_index: 3
        explain: "Smart Objects hold the data for an interaction. The Agent or Player that uses it does the implementation."
      - q: "Put the slot states in the right order for a normal interaction."
        choices: ["Free, Claimed, Occupied, Free", "Free, Occupied, Claimed, Free", "Claimed, Free, Occupied, Claimed", "Occupied, Claimed, Free, Occupied"]
        answer_index: 0
        explain: "Claim sets the slot to Claimed, Use changes it to Occupied, Release returns it to Free."
      - q: "ClaimSmartObject returns a Claim Handle that is not valid. What should the Agent do?"
        choices: ["Use the slot anyway and release it when the behavior ends", "Destroy the Smart Object", "Try to claim another slot from the Smart Object Results", "Wait forever"]
        answer_index: 2
