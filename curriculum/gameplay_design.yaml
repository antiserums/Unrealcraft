        choices: ["They are not related; Common UI tables are only for UI input", "They are the same asset", "They replace Enhanced Input in every project that uses them", "They must share names"]
        answer_index: 0
        explain: "The page states these tables are not related to the input actions of Project Settings or the Advanced Input System."
