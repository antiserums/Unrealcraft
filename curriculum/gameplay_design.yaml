    brief: "A playtest gives you feelings, such as that the game is too hard. An event log gives you numbers. If the game writes one line to the log each time something important happens, such as a kill or a death, you can count these lines afterwards and compare one version of the game with the next. In this quest you build a small logging function, call it from three places, and count the results in a spreadsheet."
