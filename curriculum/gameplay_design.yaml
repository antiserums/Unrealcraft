    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/game-mode-and-game-state-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-a-game-mode-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-framework-quick-reference-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create BP_GM_Rounds with the parent class Game Mode (not Game Mode Base), and create BP_GS_Rounds with the parent class Game State. In the Class Defaults of BP_GM_Rounds, set Game State Class to BP_GS_Rounds and Default Pawn Class to the template character."
      - "Open World Settings and set GameMode Override to BP_GM_Rounds for the level you test in."
      - "In BP_GM_Rounds, override the function Ready To Start Match so that it returns a Boolean variable named bReady with the default false. In the character or the Level Blueprint, bind a key that sets bReady to true on the Game Mode. Press Play: the pawn must NOT appear until you press the key."
      - "On Begin Play of BP_GM_Rounds, add a looping timer of 1 second that prints Get Match State. Watch the state move from WaitingToStart to InProgress."
      - "Add a second key that calls End Match. Confirm that the printed state becomes WaitingPostMatch. Also confirm that actors keep ticking, which you can see because your timer keeps printing."
      - "In BP_GS_Rounds, add an Integer variable named RoundNumber. When the match starts, add 1 to it and show it on screen with a Print String."
      - "Write 3 sentences: which class holds the rules, which class holds the shared state, and why the state must be in the Game State and not in the Game Mode."
    done_when: "Send one screenshot of the BP_GM_Rounds graph that shows the Ready To Start Match override, the state printer and the End Match key. Also send one screenshot of the Play window that shows the printed match state WaitingPostMatch and RoundNumber. Add your 3 sentences."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which base class has the built-in match state machine (WaitingToStart, InProgress, and so on)?"
        choices: ["AGameModeBase", "AGameMode", "AGameStateBase", "APlayerState"]
        answer_index: 1
        explain: "AGameMode is a child of AGameModeBase that adds the match state machine and other multiplayer match support. AGameModeBase is simpler and is the default for new projects."
      - q: "You change the parent of your Game Mode from Game Mode Base to Game Mode. What should you also do?"
        choices: ["Nothing, Game State does not matter", "Delete the Player State class", "Turn off replication on the Game Mode, because the match state machine only runs on clients", "Make your Game State inherit from AGameState too, so it supports the match state machine"]
        answer_index: 3
        explain: "The docs say: if you inherit from AGameMode, you should also inherit your game state from AGameState, which also supports the match state machine."
      - q: "In which match state is BeginPlay called on all Actors?"
        choices: ["EnteringMap", "WaitingToStart", "InProgress", "WaitingPostMatch"]
        answer_index: 2
        explain: "When the match enters InProgress, HandleMatchHasStarted is called, which then calls BeginPlay on all Actors. This is why the match state is almost always InProgress."
      - q: "The match is in WaitingToStart. What moves it to InProgress?"
        choices: ["ReadyToStartMatch returns true, or StartMatch is called", "Any actor calls BeginPlay", "The first player presses any key on the keyboard or gamepad", "A map transfer starts"]
        answer_index: 0
        explain: "WaitingToStart transitions to the next state if ReadyToStartMatch returns true, or if StartMatch is called. Players have not yet spawned in during WaitingToStart."
      - q: "What is true about the WaitingPostMatch state?"
        choices: ["Actors stop ticking and the world unloads", "Actors still tick, but new players cannot join", "It is the failure state after an unrecoverable error", "Players respawn automatically every 5 seconds"]
        answer_index: 1
        explain: "In WaitingPostMatch, HandleMatchHasEnded is called, actors still tick, but new players cannot join. It transitions to LeavingMap when a map transfer starts. Aborted is the failure state."
      - q: "Where does the Game Mode instance exist in a multiplayer game?"
        choices: ["On every client and the server", "Only on the clients", "Only on the server", "On the client that hosts the lobby"]
        answer_index: 2
        explain: "The Game Mode is not replicated to remote clients; it exists only on the server. Information players need is kept on the Game State, which is replicated to all clients."
      - q: "How many Game Modes can be in use at the same time in one running level?"
        choices: ["One per player", "Exactly one", "One per Player Start", "Any number, as long as they are Blueprints"]
        answer_index: 1
        explain: "A game may have many Game Mode subclasses, but only one Game Mode may be in use at any given time. A Game Mode Actor is created each time a level is initialized for play."
      - q: "Which of these is NOT a default that a Game Mode Blueprint sets?"
        choices: ["Player Controller Class", "HUD Class", "Player State Class", "Default Material Class"]
        answer_index: 3
        explain: "A Game Mode Blueprint sets Default Pawn, HUD, Player Controller, Spectator, Game State and Player State classes. There is no material setting there."
    flavors:
