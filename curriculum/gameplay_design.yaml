    title: "Impact burst from Blueprint"
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/quick-start-for-niagara-effects-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-niagara-effects-for-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Niagara/SpawnSystematLocation"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Niagara/SpawnSystemAttached"
    checklist:
      - "Right-click in the Content Browser, choose FX > Niagara System, pick the Simple Sprite Burst template, and name it NS_HitBurst. Rename the emitter to HitBurst."
      - "In Emitter Update, set Emitter State to Loop Behavior Once, Loop Duration 1. In Spawn Burst Instantaneous, set Spawn Count to 12."
      - "In Particle Spawn, set Lifetime to Random 0.2 to 0.4. Add Shape Location with Shape Primitive Sphere, small radius. Add Velocity > Add Velocity with Velocity Mode From Point and speed about 300. If the stack shows an error, click Fix Issue."
      - "In Particle Update, add Forces > Drag with Drag 5. Keep Scale Color so the burst fades out."
      - "In BP_ThirdPersonCharacter, on your punch trace hit, call Spawn System at Location with System Template NS_HitBurst at the Impact Point, Auto Destroy on. Rotate it to face the Impact Normal."
      - "Make a second call with Spawn System Attached to the hit actor's mesh, Attach Point Name a socket or bone, Location Type Keep Relative Offset. Move the target and note which burst follows it."
      - "Drag NS_HitBurst into the level once, next to the character, to check size in context, then remove it."
    done_when: "Two screenshots: (1) NS_HitBurst open in the Niagara Editor showing the Emitter Update and Particle Spawn modules; (2) the Blueprint graph with Spawn System at Location connected to the trace Impact Point. Say which spawn node followed the moving target."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You added Add Velocity to Particle Spawn and got an error. What is the cause?"
        choices: ["Velocity modules only work in Particle Update", "The new module was placed below Solve Forces and Velocity and must be above it", "Velocity needs a Mesh Renderer", "Spawn Count must be greater than 1"]
        answer_index: 1
        explain: "Added modules go to the bottom of the group stack, after Solve Forces and Velocity. All velocity and force modules must be above the solver. Fix Issue moves it for you."
      - q: "Which module in the Quick Start decides how many particles the one-shot burst creates?"
        choices: ["Emitter State", "Initialize Particle", "Spawn Burst Instantaneous", "Shape Location"]
        answer_index: 2
        explain: "Spawn Burst Instantaneous has the Spawn Count. The guide sets it to 10 for a dust cloud that is visible but plausible."
      - q: "What does Velocity Mode = From Point do in the Add Velocity module?"
        choices: ["Moves particles toward the camera", "Copies the velocity of the owning actor", "Makes particles follow a spline", "Applies velocity radially outwards from the system origin"]
        answer_index: 3
        explain: "From Point applies velocity radially outwards from the origin point of the Niagara system, which is what a burst needs."
      - q: "Where do you set the region in which new particles are born?"
        choices: ["Shape Location in Particle Spawn", "Emitter State in Emitter Update", "Mesh Renderer in Render", "Drag in Particle Update"]
        answer_index: 0
        explain: "The Shape Location module lets you set a region in which new particles are created when they are born, for example a cylinder or sphere."
      - q: "Why does the Quick Start add a Drag module in Particle Update after using Acceleration Force?"
        choices: ["To make particles spawn faster", "To slow the upward momentum so the motion looks less unrealistic", "To fix the Solve Forces error", "To change the particle color"]
        answer_index: 1
        explain: "Drag interacts with the acceleration force and keeps the dust cloud's upward movement from seeming too unrealistic. Particle Update runs every frame per particle."
      - q: "Which group of an emitter runs every frame for each particle?"
        choices: ["Emitter Spawn", "Particle Spawn", "Particle Update", "Render"]
        answer_index: 2
        explain: "Particle Update behaviors are calculated on each particle every frame. Particle Spawn applies only when particles are first born."
      - q: "What does Spawn System at Location return?"
        choices: ["A Niagara System asset", "A boolean success flag", "Nothing; it is a pure fire-and-forget node", "The spawned Niagara Component"]
        answer_index: 3
        explain: "The node reference says the Return Value is the spawned UNiagaraComponent, so you can keep manipulating it, for example setting parameters or deactivating it."
      - q: "You want the burst to stay on a moving enemy limb. Which node and input do you use?"
        choices: ["Spawn System at Location with Auto Activate", "Spawn System Attached with Attach to Component and Attach Point Name", "Spawn System at Location with Pre Cull Check", "Play Niagara Particle Effect notify with Attached off"]
        answer_index: 1
        explain: "Spawn System Attached takes Attach to Component and Attach Point Name, so the effect follows that socket or bone. Spawn System at Location only takes a world location."
    flavors:
      _default: {why: "A burst on impact tells the player exactly where and when the hit happened."}
      gameplay_design: {why: "You will call effects from gameplay events far more often than you will author them.", do: "Spawn a different burst when the hit was a critical and write how you chose the size difference."}
      tech_art: {why: "Designers spawning your systems from BP is the normal handoff. Make the parameters they need obvious.", do: "Expose a User parameter for burst size and set it from the Blueprint on the returned component."}

  - id: GDQ78
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
