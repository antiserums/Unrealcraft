        choices: ["The subsystem, every 10 seconds, whatever the Agent is doing", "The Agent, when its behavior completes or is interrupted", "The level, on unload", "The player only"]
        answer_index: 1
        explain: "Agents must release their claimed slots when the behavior finishes or is aborted, so others can claim them."
