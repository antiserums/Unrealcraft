# Unrealcraft — Gameplay Design specialization, all ranks. IDs GDQ1…
# Difficulty tiers: novice (rank 0) · apprentice (1) · adept (2) · expert (3) · master (4).
# Every URL was checked against the live UE 5.8 docs when written.

quests:
  - id: GDQ11
    rank: 0
    difficulty: novice
    specializations: [gameplay_design]
    subjects: [character-movement, tuning, blueprint]
    required_spine: false
    required: false
    taster: true
    title: "Tune the character: speed and jump"
    brief: "How fast a character walks and how high it jumps decide how a level feels to play, long before the level has any art. In Unreal these numbers are stored on the Character Movement component, the part of the character that handles walking, jumping and falling. In this quest you change the walk speed and the jump value, test each change, and keep the values you like best."
    time_min: 30
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-09-sprint-input-action-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/third-person-template-in-unreal-engine"
    checklist:
      - "Create a new project from the Third Person template. In the Content Browser, open the Blueprint Content/ThirdPerson/Blueprints/BP_ThirdPersonCharacter."
      - "In the Components panel, select the Character Movement component. Find Max Walk Speed in the Details panel and write down its current value."
      - "Press Play and walk around. Then set Max Walk Speed to half of the value and play again, and after that set it to double and play again. Note how the level feels each time."
      - "In the same Details panel, type Jump in the search box. Change the jump velocity value and test the jump on the stairs of the template level."
      - "Pick the walk speed and the jump value that you like best. Write one line for each value that says what changed in the feel."
      - "Optional: add a Float variable named SprintSpeed, and set Max Walk Speed from it when a key is pressed, like the tutorial does."
    done_when: "Send a screenshot of the Character Movement details that shows the speed and jump values you chose. Add 2 lines that say how each value changed the feel."
    xp: 30
    verify_type: screenshot
    quiz:
      - q: "Which component holds the Max Walk Speed of a Character Blueprint?"
        choices: ["The Capsule Component at the root", "The Skeletal Mesh component", "The Camera component", "The Character Movement component"]
        answer_index: 3
        explain: "The tutorial drags the Character Movement (CharMoveComp) component into the graph and reads Max Walk Speed from it."
      - q: "Why does the tutorial save Max Walk Speed into a DefaultMovementSpeed variable on Event BeginPlay?"
        choices: ["So the character can return to that speed after sprinting", "Because Max Walk Speed cannot be read again after BeginPlay", "To make the character faster at start", "Because BeginPlay runs every frame"]
        answer_index: 0
        explain: "Saving the default speed in a variable lets the character go back to it when the sprint action ends."
      - q: "When does Event BeginPlay run?"
        choices: ["Every frame", "Once, when the game starts", "Only when the player presses a key", "Every time the character jumps"]
        answer_index: 1
        explain: "The tutorial says Event BeginPlay executes once when the game starts."
      - q: "The tutorial sets Max Walk Speed to Sprint Movement Speed on the Triggered pin. Which pin returns the default speed?"
        choices: ["Started", "Ongoing", "Completed", "Canceled"]
        answer_index: 2
        explain: "Triggered means the key is pressed; Completed means the key was released, so the speed goes back to the default."
      - q: "In the Third Person template, where is BP_ThirdPersonCharacter?"
        choices: ["Content/Characters/Mannequins", "Content/LevelPrototyping", "Content/ThirdPerson/Blueprints", "Content/Input/Actions"]
        answer_index: 2
        explain: "The template page opens Content/ThirdPerson/Blueprints and double-clicks BP_ThirdPersonCharacter."
    flavors:
      _default: {why: "Speed and jump numbers decide how a level feels before any art exists."}
      gameplay_design: {why: "Movement values are the first tuning knobs a designer owns.", do: "Write the speed you would use for a horror game and for a platformer, and say why they differ."}
      level_design: {why: "Jump height and speed set the size of gaps and rooms you can build.", do: "Measure the longest gap the character can jump with your values and note it."}

  - id: GDQ12
    rank: 0
    difficulty: novice
    specializations: [gameplay_design]
    subjects: [editor, play-in-editor, testing]
    required_spine: false
    required: false
    taster: true
    title: "Play In Editor, Simulate, Standalone"
    brief: "You will test your game hundreds of times, and Unreal gives you several ways to do it. Play In Editor (PIE) runs the game inside the editor, Simulate runs the level without a player character, and Standalone Game runs the game in its own window outside the editor. In this quest you try each play mode and the tools for pausing and inspecting a running game."
    time_min: 25
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/playing-and-simulating-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/play-in-editor-settings-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Click Play, click inside the viewport, and move around. Then press Shift+F1 to get the mouse cursor back without stopping the game."
      - "Click Pause, and then click Frame Skip a few times to move the game forward one frame at a time. Then click Eject, which lets go of the character, and select an actor in the level."
      - "Change one value on that actor. Then right-click the actor and choose Keep Simulation Changes. Stop the game with Esc and confirm that the change is still there."
      - "Press Alt+S to start Simulate. Notice that no player character appears in the level. Then stop."
      - "Open the Play options, which is the button with three vertical dots next to Play. Run the level once as New Editor Window and once as Standalone Game."
      - "While the game runs in the editor, press the tilde key to open the console, a line where you can type commands. Type stat fps to show the frame rate."
    done_when: "Send a screenshot of the editor during Simulate, with no player character in the level. Add one line that names the play mode you would use to test a menu and says why."
    xp: 30
    verify_type: screenshot
    quiz:
      - q: "What is the key difference between Play In Editor and Simulate In Editor?"
        choices: ["Simulate is faster", "Play starts at the Player Start and gives you the player character; Simulate does not spawn a player or move the camera", "Simulate runs the level without physics and without Blueprint logic; Play runs both and also lets you pause the game at any time", "Play cannot be paused"]
        answer_index: 1
        explain: "The page says playing always starts at the Player Start with control of the character, while simulating spawns no player and keeps the camera."
      - q: "Which keyboard shortcut starts Simulate In Editor on Windows?"
        choices: ["Alt + S", "Shift + F1", "Alt + P", "Ctrl + S"]
        answer_index: 0
        explain: "Simulate In Editor is in the Play drop-down or Alt + S (Option + S on macOS)."
      - q: "During PIE you want the mouse cursor back for the editor. What do you press?"
        choices: ["Esc", "Tilde (~)", "Shift + F1", "K"]
        answer_index: 2
        explain: "Shift + F1 gives mouse control back to the editor. Esc would stop the session."
      - q: "You changed an actor while ejected during play. How do you keep that change after you stop?"
        choices: ["Changes are always saved", "Press Ctrl + S during play, which saves the level with the new change", "Click Possess", "Right-click the actor and choose Keep Simulation Changes (or press K)"]
        answer_index: 3
        explain: "Changes made during play are not saved by default; Keep Simulation Changes (or K) keeps them."
      - q: "Which Play Mode runs the game outside of the editor?"
        choices: ["Selected Viewport", "New Editor Window (PIE)", "Standalone Game", "Simulate"]
        answer_index: 2
        explain: "Standalone Game launches the game in a standalone version outside the Editor. Selected Viewport is the default."
    flavors:
      _default: {why: "You will test hundreds of times; knowing the play modes saves hours."}
      gameplay_design: {why: "Tuning happens while playing; Eject and Keep Simulation Changes let you tune live.", do: "Tune one value live with Eject, keep it, and note the before/after numbers."}
      programming: {why: "Standalone and New Window catch bugs that the viewport hides.", do: "Run the same level in Standalone Game and note one difference you see."}

  - id: GDQ13
    rank: 0
    difficulty: novice
    specializations: [gameplay_design]
    subjects: [gameplay-framework, game-mode, blueprint]
    required_spine: false
    required: false
    taster: true
    title: "Read the template's game loop"
    brief: "A Game Mode is the class that holds the rules of a game and decides which character the player gets and which Player Controller reads the input. Every mechanic you build later connects to these few classes, so it helps to know where they are set. In this quest you find the Game Mode of the Third Person template, make your own simple Game Mode, and use it in one level."
    time_min: 35
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/game-mode-and-game-state-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-a-game-mode-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-a-character-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/third-person-template-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open Edit, then Project Settings, then Maps & Modes, and read which class is set as Default GameMode."
      - "Expand Selected GameMode. Note the Default Pawn Class, which is the character the player controls, and the Player Controller Class."
      - "Open the World Settings tab and find GameMode Override. This setting can change the Game Mode for this one level only. Note if it is set."
      - "Create a new Blueprint Class with Game Mode Base as its parent, and name it GM_Toy. Open it and set its Default Pawn Class to BP_ThirdPersonCharacter."
      - "In World Settings, set GameMode Override to GM_Toy. Press Play to confirm that the character still appears."
      - "Draw a small diagram that shows this chain: Level (World Settings) leads to Game Mode, and Game Mode leads to Pawn/Character and Player Controller."
    done_when: "Send a screenshot of World Settings with GM_Toy set as GameMode Override, and send your diagram as a photo or an image."
    xp: 30
    verify_type: screenshot
    quiz:
      - q: "Which class defines the rules of the game, such as how players enter and whether the game can pause?"
        choices: ["Game State", "Player State", "Game Mode", "Player Controller"]
        answer_index: 2
        explain: "The page says the rules of the game make up a Game Mode; the Game State stores and syncs rule-related information."
      - q: "What does a Game Mode Blueprint let you set?"
        choices: ["Only the level name", "Default Pawn Class, HUD Class, Player Controller Class, Game State Class and more", "The rendering settings of the project, such as anti-aliasing and the global illumination method", "Only the Player Start location"]
        answer_index: 1
        explain: "Game Mode Blueprints set defaults like Default Pawn Class, HUD, Player Controller, Spectator, Game State and Player State classes."
      - q: "The project has a Default GameMode. How do you use a different one in only one level?"
        choices: ["Set GameMode Override in that level's World Settings", "Rename the level", "Change the Default GameMode in the Project Settings", "Add a second Player Start"]
        answer_index: 0
        explain: "World Settings > GameMode Override changes the Game Mode for a single map, with higher priority than the project default."
      - q: "In a multiplayer game, where does the Game Mode instance exist?"
        choices: ["On every client", "Only on the first client", "In the Game Instance", "Only on the server"]
        answer_index: 3
        explain: "The Game Mode is not replicated; it exists only on the server. The Game State is replicated to all clients."
      - q: "What is the main job of the PlayerController in the character setup workflow?"
        choices: ["To hold the Skeletal Mesh", "To parse player input into events that drive the character", "To play animations", "To store the geometry of the level that the player walks on"]
        answer_index: 1
        explain: "The Setting Up a Character page says the PlayerController turns inputs into events, and the Character class turns those events into movement."
    flavors:
      _default: {why: "Every mechanic you add plugs into these few classes."}
      gameplay_design: {why: "Knowing who owns rules, input and body tells you where each idea goes.", do: "Write where a 'score' variable should live and why: Game Mode, Game State or Character."}
      programming: {why: "Game Mode Base is the C++ entry point for rules.", do: "Note which Game Mode functions from the page you could override in Blueprint."}

  - id: GDQ14
    rank: 1
    difficulty: apprentice
    specializations: [gameplay_design]
    subjects: [blueprint, variables, tuning]
    required_spine: true
    required: true
    title: "Variables designers can tune"
    brief: "A variable is a named value in a Blueprint, such as the brightness of a lamp. A value is only easy to tune when a designer can change it on an object in the level without opening the Blueprint graph. Unreal calls such a variable Instance Editable. In this quest you build a lamp with two tunable variables, give them a category, a tooltip and a slider range, and set different values on three lamps."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-variables-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-02-create-a-key-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Create an Actor Blueprint named BP_Lamp. Add a Point Light component and a Cube mesh to it."
      - "Add a Float variable named Intensity and a Linear Color variable named LightColor. Click the eye icon next to each variable to make it Instance Editable, which means you can change it on each lamp in the level."
      - "Set Category to Tuning on both variables. Write a Tooltip, a short help text, for each one. Check that the eye icon turns green."
      - "Open the Construction Script, the graph that runs when the actor is placed or changed in the editor. There, set the intensity and the color of the light from the two variables."
      - "Select the Intensity variable. In the Details panel, set a Slider Range, for example from 0 to 5000."
      - "Place three BP_Lamp instances in a level. In the Details panel, give each lamp a different Intensity and a different color."
      - "Add a Boolean variable named StartOn and enable Expose on Spawn for it. Then click Compile and save the Blueprint."
    done_when: "Send a screenshot of the Details panel of a BP_Lamp that you placed in the level. It must show the Tuning category with your two variables, and one tooltip must be visible."
    xp: 110
    verify_type: screenshot
    quiz:
      - q: "What does the closed eye icon next to a variable mean?"
        choices: ["The variable is private and cannot be edited on instances", "The variable is hidden from the graph and from My Blueprint", "The variable is an array", "The variable is deprecated"]
        answer_index: 0
        explain: "By default the eye is closed (private). Opening it (or checking Instance Editable) makes the variable public and editable on instances."
      - q: "After you make a variable public and add a Tooltip, what happens to the eye icon?"
        choices: ["It disappears from the row", "It turns from yellow to green", "It turns red", "It closes again at once"]
        answer_index: 1
        explain: "The page says the eye changes from yellow to green to show a Tooltip has been written."
      - q: "What does Expose on Spawn do?"
        choices: ["Makes the variable replicate to clients when the actor is spawned", "Saves the variable to disk", "Makes the variable read-only", "Shows the variable as a pin on the Spawn Actor from Class node"]
        answer_index: 3
        explain: "With Expose on Spawn, the value can be set on the Spawn Actor from Class node when the Blueprint is spawned."
      - q: "What does the Category property control?"
        choices: ["The variable's type", "Where the variable appears in Class Defaults, My Blueprint and the Details tab", "Whether the variable can be replicated, saved to disk or edited on placed instances", "The default value"]
        answer_index: 1
        explain: "Category decides where the variable is grouped in Class Defaults, the My Blueprint tab and the Blueprint's Details tab."
      - q: "You drag a variable from My Blueprint into the graph while holding Alt. What is created?"
        choices: ["A Get node", "A Branch node", "A comment", "A Set node"]
        answer_index: 3
        explain: "Ctrl-drag creates a Get node and Alt-drag creates a Set node."
      - q: "Which variable type should hold text that the player will read and that may be translated?"
        choices: ["String", "Name", "Text", "Byte"]
        answer_index: 2
        explain: "The types table says Text is for text displayed to users that you want to localize; String is a plain group of characters."
    flavors:
      _default: {why: "A value only counts as tunable when someone can change it without opening the graph."}
      gameplay_design: {why: "Exposed, categorized, documented variables are how you hand tuning to others.", do: "Add a second category 'Debug' with one Boolean and explain why it is separate."}
      level_design: {why: "Per-instance values let one Blueprint serve many places in a level.", do: "Place 5 instances and tune each one differently in the Details panel."}
      tech_art: {why: "Construction Script plus exposed variables is the base of every art tool.", do: "Drive the cube's scale from a third exposed Float."}

  - id: GDQ15
    rank: 1
    difficulty: apprentice
    specializations: [gameplay_design]
    subjects: [blueprint, flow-control]
    required_spine: true
    required: true
    title: "Flow control: Branch, Gate, DoOnce, FlipFlop"
    brief: "Flow control nodes decide which way the logic in a Blueprint runs. Branch picks one of two paths from a true or false value, FlipFlop switches between two outputs, DoOnce lets the logic pass only one time until it is reset, and Gate lets the logic pass only while it is open. Most gameplay logic is built from these few nodes. In this quest you build a switch actor and try each node on it."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/flow-control-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open a project made from the Third Person template, or create one, so that you have a player character to walk into the switch. Create an Actor Blueprint named BP_Switch with a Box Collision and a Cube mesh. Add the On Component Begin Overlap event for the box, which runs when something enters the box."
      - "Connect the overlap event to a FlipFlop node. Make output A set the cube material to red and output B set it to blue. Press Play and walk in and out of the box."
      - "Replace the FlipFlop with a DoOnce node. Add a second Box Collision named ResetZone, and connect its overlap event to the Reset input of the DoOnce."
      - "Add a Branch node before the DoOnce that checks a Boolean variable named IsPowered. Make IsPowered Instance Editable, so you can change it on the actor in the level."
      - "Add a Gate node. Connect Event Tick to Enter, the ResetZone overlap to Open, and the main overlap to Close. Connect Exit to a Print String node with the text tick."
      - "Use a Sequence node to print A and then B from one overlap. Watch the order of the two messages in the log."
    done_when: "Send a screenshot of your BP_Switch event graph that shows Branch, DoOnce (with Reset), FlipFlop and Gate all connected. Add one sentence for each node that says what it does."
    xp: 110
    verify_type: screenshot
    quiz:
      - q: "A DoOnce node has fired. What must happen before it fires again?"
        choices: ["Nothing, it fires on every call", "An execution pulse must go into its Reset input", "The Blueprint must be recompiled", "The Completed pin must be connected to another node"]
        answer_index: 1
        explain: "DoOnce fires once, then stops all outgoing execution until Reset receives a pulse. It equals DoN with N = 1."
      - q: "A FlipFlop is triggered five times. Which output fires on the fifth call?"
        choices: ["A", "B", "Both", "Neither"]
        answer_index: 0
        explain: "A fires on the first and every odd call, B on every even call. The fifth call is odd, so A."
      - q: "A Gate is closed and pulses keep hitting Enter. What comes out of Exit?"
        choices: ["Every pulse", "One pulse", "Nothing", "A False value"]
        answer_index: 2
        explain: "When the gate is closed the Exit pin is nonfunctional; only an open gate passes pulses from Enter to Exit."
      - q: "What does the Toggle input on a Gate do?"
        choices: ["Resets the gate", "Sends one pulse through the gate and then closes it again right after", "Deletes the gate", "Reverses the current state: open becomes closed and closed becomes open"]
        answer_index: 3
        explain: "Toggle reverses the current state of the gate."
      - q: "You connect three nodes to a Sequence node. How are they called?"
        choices: ["In order, with a delay of exactly one frame between each of the three", "In order, with no delay, so they seem to happen at the same time", "In random order", "Only the first is called"]
        answer_index: 1
        explain: "Sequence calls all outputs in order without any delay, so to a user they appear simultaneous."
      - q: "Why should you be careful with a ForLoop that runs many thousands of iterations?"
        choices: ["Loop iterations happen between frames, so large loops can hurt performance", "A ForLoop can only count to 100, so larger loops stop early without a warning", "It resets the Blueprint", "It only runs in Simulate mode"]
        answer_index: 0
        explain: "The page warns that loop iterations take place between frames, so large loops may incur a performance hit."
    flavors:
      _default: {why: "These four nodes are the grammar of most gameplay logic."}
      gameplay_design: {why: "Most mechanics are gates and one-time triggers dressed up.", do: "Describe one real game moment for each of the four nodes."}
      programming: {why: "Knowing the node behavior avoids re-writing them as custom logic.", do: "Note which of the nodes are macros and open one to see inside."}
      level_design: {why: "Doors, traps and checkpoints are DoOnce and Gate patterns.", do: "Build a door that opens once and can be reset by a lever."}

  - id: GDQ16
    rank: 1
    difficulty: apprentice
    specializations: [gameplay_design]
    subjects: [blueprint, timers]
    required_spine: true
    required: true
    title: "Timers and delays"
    brief: "Many game mechanics need to wait: a cooldown, a wave of enemies, a respawn, a power-up that ends. In Blueprints you can wait with a Delay node, which pauses the logic once, or with a timer, which can call an event again and again until you stop it. In this quest you build a small actor that uses a delay, starts a looping timer and then stops the timer."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-timers-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/SetTimerbyEvent"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/FlowControl/Delay"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/ClearandInvalidateTimerbyHandle"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create an Actor Blueprint named BP_Spawner and place it in the level. On Begin Play, add a Delay node with a Duration of 2.0, and after it a Print String node with the text ready."
      - "Add a Custom Event named Tick2. Add a Set Timer by Event node with Time 1.0 and Looping turned on, and connect its Event pin to Tick2. Make Tick2 print a counter that goes up by one each time."
      - "Right-click the Return Value pin of the timer node and promote it to a variable named TimerHandle. The handle is the reference you need to control the timer later."
      - "Add a Box Collision. On its overlap event, call Clear and Invalidate Timer by Handle with TimerHandle. Play and confirm that the counter stops."
      - "On the timer node, set Initial Start Delay to 3.0. Play and watch when the first message appears."
      - "Try to call the Delay node twice quickly from a key press. Note what happens the second time."
    done_when: "Send a screenshot of the graph with Delay, Set Timer by Event (with Looping on) and Clear and Invalidate Timer by Handle connected. Also send a screenshot of the counter on screen."
    xp: 110
    verify_type: screenshot
    quiz:
      - q: "A Delay node is already counting down and the same node is called again. What happens?"
        choices: ["The delay restarts", "The second call is ignored", "Two delays run in parallel", "The Blueprint errors"]
        answer_index: 1
        explain: "The Delay node doc says calling it again while it is counting down is ignored."
      - q: "On Set Timer by Event, what does Looping = true do?"
        choices: ["Runs the event once after Time seconds have passed", "Runs the event every frame", "Pauses the timer", "Keeps executing the event every Time seconds"]
        answer_index: 3
        explain: "Looping true keeps executing the delegate every Time seconds; false executes it only once."
      - q: "What does Set Timer by Event return?"
        choices: ["A Boolean", "The elapsed time since the timer was started", "A timer handle to pass to other timer functions", "Nothing"]
        answer_index: 2
        explain: "The Return Value is the timer handle used to manipulate this timer, for example to clear it."
      - q: "You call Set Timer with a Time of 0 on an existing timer. What is the effect?"
        choices: ["The timer fires immediately every frame", "The timer is cleared", "The timer pauses", "The time defaults to 1 second"]
        answer_index: 1
        explain: "Setting a timer to <= 0 seconds clears it if it is set; the Gameplay Timers page says the same for a rate of zero."
      - q: "An actor with a running timer is destroyed before the timer fires. What happens to the timer?"
        choices: ["It is canceled automatically and the handle becomes invalid", "It fires anyway, and the event runs on the Game Mode instead", "It crashes the game", "It restarts on the next actor"]
        answer_index: 0
        explain: "Timers are canceled automatically if the Object they would be called on is destroyed before the time is up."
      - q: "What happens to the elapsed and remaining time when a timer is paused?"
        choices: ["Both reset to zero", "Remaining time keeps counting down while paused", "Elapsed time doubles", "They stay the same until the timer is unpaused"]
        answer_index: 3
        explain: "PauseTimer stops the function call but the elapsed and remaining times stay the same while paused."
    flavors:
      _default: {why: "Cooldowns, waves, respawns and power-ups are all timers."}
      gameplay_design: {why: "Timer numbers are tuning: cooldown lengths change the pace of play.", do: "Expose the Time value as an Instance Editable Float and tune it in the level."}
      programming: {why: "Timers replace Tick polling and are cheaper.", do: "Read the C++ example and note which Blueprint node maps to SetTimer's Looping and first delay."}

  - id: GDQ17
    rank: 1
    difficulty: apprentice
    specializations: [gameplay_design]
    subjects: [blueprint, collision, pickup]
    required_spine: true
    required: true
    title: "A pickup that changes a value"
    brief: "A pickup is an object that the player collects by walking into it, such as a coin. It is the smallest complete game mechanic: something touches the object, a number changes, and the object disappears. In this quest you build a coin that adds to a Score variable on the character and then removes itself."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-02-create-a-key-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/quick-start-guide-for-blueprints-visual-scripting-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Actor/DestroyActor"
    checklist:
