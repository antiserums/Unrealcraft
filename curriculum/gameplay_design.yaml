    brief: "Many games are played with a mouse and also with a gamepad, and a menu must work with both. Common UI is a plugin from Epic that helps with this. It sends input to the right widget, shows the right button icons for each device, and lets many buttons share one style asset. In this quest you set up Common UI in a project and build a small menu with two styled buttons."
