    specializations: [gameplay_design]
    subjects: [ai, state-tree, blueprint]
    required_spine: false
    required: false
    title: "State Tree data flow: parameters, evaluators, global tasks"
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-state-tree-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/statetree-quick-start-guide"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/state-tree-in-unreal-engine"
    checklist:
      - "Enable the StateTree and GameplayStateTree plugins. Make BP_Patroller: a copy of the Third Person character with no input and a StateTree component. Create ST_Patroller with the StateTreeComponentSchema and set the Context Actor Class to BP_Patroller."
      - "Add two State Tree Parameters: WaitTime (float 2.0) and PatrolRadius (float 800.0)."
      - "Create the Global Task STT_AlertLevel (parent StateTreeTaskBlueprintBase) with an Output integer AlertLevel. On Tick set it to 1 when the player is closer than 1000 units, else 0. Add it to the tree's Global Tasks."
      - "Build states: Root > Calm (with children PickPoint, Walk, Wait) and Alert. PickPoint runs a task that outputs a random reachable point using PatrolRadius. Walk moves to that point (bind to the PickPoint task output). Wait uses Delay bound to WaitTime. Link them with Next transitions so they loop."
      - "Give Alert an Enter Condition: AlertLevel (bound to the Global Task output) greater or equal 1. Add an On Tick transition on Calm to Alert. In Alert print Alert and go back to Calm when AlertLevel is 0."
      - "Add failure handling: on Walk, transition On State Failed to PickPoint so a bad point does not stop the loop."
      - "Place three BP_Patroller and play. Walk close to one and watch it switch to Alert and back."
    done_when: "One screenshot of ST_Patroller showing the Parameters, the Global Task, the states Calm (PickPoint, Walk, Wait) and Alert, and the binding on the Alert Enter Condition. Add two sentences: which data is a Parameter, which comes from the Global Task, and why the Global Task and not a normal Task."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "A leaf State is selected. Which Tasks run?"
        choices: ["Only the Tasks of the leaf State", "One Task at a time, top to bottom", "Only Global Tasks", "All Tasks of every active State from the root down to the leaf, concurrently"]
        answer_index: 3
        explain: "Selecting a State activates all States from the root to the leaf. All their Tasks run concurrently while the State stays active."
      - q: "A State has three Tasks. What triggers the completion Transition?"
        choices: ["When all three Tasks finish", "When the first Task completes", "When the tree is stopped", "When a Parameter changes"]
        answer_index: 1
        explain: "The first Task that completes triggers a Transition, which can select a new State."
      - q: "In which order are Transitions evaluated, and why is this useful?"
        choices: ["From the leaf State up toward the root; common Transitions can be grouped on a parent", "From the root down; it makes the root win", "Random order; it avoids bias", "Only on the leaf; parents never transition"]
        answer_index: 0
        explain: "Transitions are checked from the leaf upward and the first that succeeds wins. Shared Transitions can live on a parent State."
      - q: "Why put the time-of-day or alert data in a Global Task instead of a normal Task?"
        choices: ["Global Tasks run faster", "Normal Tasks cannot have outputs", "Global Tasks run from tree Start to Stop and start before the Root, so the data exists for the first State selection", "Global Tasks can only be written in C++"]
        answer_index: 2
        explain: "Global Tasks are active between Start and Stop and begin before the Root State, so their data is available during the first selection."
      - q: "What is an Evaluator for, and what can its properties bind to?"
        choices: ["It runs Tasks; it binds to nothing", "It exposes data that Parameters or Context Data cannot; it binds to Parameters, Context Data or earlier Evaluators", "It replaces Transitions; it binds to leaf States", "It draws debug shapes; it binds to the camera"]
        answer_index: 1
        explain: "Evaluators expose extra data and can run code on start, stop and tick. They can bind to Parameters, Context Data and Evaluators earlier in the list."
      - q: "A parent State's Enter Conditions pass, but every child State's Enter Conditions fail. What happens?"
        choices: ["The parent State is selected", "The first child is forced", "The tree stops with an error", "The parent is not selected and selection moves on"]
        answer_index: 3
        explain: "A State with children is never selected directly. If no child can be selected, the parent is skipped even though its own conditions passed."
      - q: "What can an Enter Condition bind to?"
        choices: ["Common data and Tasks in all parent States", "Only Parameters", "Tasks of the same State", "Anything in the whole tree"]
        answer_index: 0
        explain: "Enter Conditions can bind to common data and to Tasks in the parent States. Tasks of the State itself are not running yet at selection time."
      - q: "How is StateTree selection different from a behavior tree?"
        choices: ["StateTree keeps running selection every tick, like a behavior tree", "They are identical", "StateTree runs selection on demand when a Transition fires; a behavior tree keeps running selection logic even while a State is selected", "StateTree cannot select child States"]
        answer_index: 2
        explain: "Behavior trees keep evaluating selection. StateTree only runs the selection process when a Transition triggers it (plus an implicit one to the Root on the first tick)."
    flavors:
      _default: {why: "State Trees stay readable when the data that drives them is clearly separated into parameters, evaluators and global tasks."}
      gameplay_design: {why: "Exposed parameters are what let you tune one tree for many NPC types.", do: "Add a third parameter and explain who on the team would change it and when."}

