      programming: {why: "Ready To Start Match and End Match are the hooks a coder will ask you to use.", do: "Print HasMatchStarted and IsMatchInProgress next to Get Match State and compare."}

  - id: GDQ82
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [game-mode, respawn, player-start, blueprint, rounds]
    required_spine: false
    required: false
    title: "Respawn flow: PostLogin to RestartPlayer"
    brief: "To respawn means to put a player back into the game after they die. In Unreal the Game Mode controls this. It has events that run when a player joins, when a player is restarted and when a player leaves, and it has functions that create a new pawn at a Player Start. Every respawn rule, such as lives, a waiting time or a checkpoint, is built on these. In this quest you print the order of these events, add lives, and respawn the player at a tagged Player Start after a delay."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/game-mode-and-game-state-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/player-start-actor-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/player-start-actor-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a Game Mode Blueprint named BP_GM_Respawn with the parent class Game Mode, set its Default Pawn Class to the template character, and set it as the GameMode Override of your level in World Settings. If you already have a Game Mode Blueprint of your own, you can use that. Add the events OnPostLogin, OnRestartPlayer and OnLogout. Print the name of the controller in each one. Press Play and read the order of the printed lines."
      - "Make a Player State Blueprint named BP_PS_Lives with an Integer variable Lives that has the default 3. Set it as Player State Class on the Game Mode."
      - "In the character, add a key press that calls Destroy Actor on the character itself to act as a death. You can use your health system if you have one. Before the character is destroyed, tell the Game Mode through a custom event named PlayerDied and pass the Controller."
      - "In PlayerDied, subtract 1 from Lives on the Player State of that controller. If Lives is above 0, use Set Timer by Event with 3 seconds, and then call Restart Player with the Controller. If Lives is 0, print OUT OF LIVES and do not respawn the player."
      - "Place two Player Start actors. Set Player Start Tag to Checkpoint on one of them. In OnRestartPlayer, or before Restart Player, call Find Player Start with Incoming Name Checkpoint. Then use Restart Player at Player Start, so that the respawn uses the tagged start."
      - "If a Player Start shows the label BADsize, move it out of the geometry until the label is gone."
    done_when: "Send one screenshot of the Game Mode graph with OnPostLogin, PlayerDied, the timer and Restart Player at Player Start. Also send one screenshot of the Play window after a respawn at the Checkpoint start, with the printed Lives value."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which Game Mode function is the first safe place to call replicated functions on the new PlayerController?"
        choices: ["PreLogin", "InitGame", "PostLogin", "Logout"]
        answer_index: 2
        explain: "PostLogin is called after a successful login and is the first place it is safe to call replicated functions on the PlayerController. OnPostLogin is the Blueprint version."
      - q: "How can PreLogin reject a player who is trying to join?"
        choices: ["By returning false", "By setting ErrorMessage to a non-empty string", "By destroying the PlayerController of the player", "By calling Logout"]
        answer_index: 1
        explain: "PreLogin accepts or rejects a joining player. It makes the Login function fail if it sets ErrorMessage to a non-empty string."
      - q: "By default, what does HandleStartingNewPlayer do?"
        choices: ["It creates a pawn for the player", "It loads the next map for everyone", "It saves the game", "It pauses the match"]
        answer_index: 0
        explain: "HandleStartingNewPlayer is called after PostLogin or after seamless travel and by default creates a pawn for the player. It can be overridden in Blueprint."
      - q: "You want to respawn a player at an exact transform you computed, not at a Player Start. Which function fits?"
        choices: ["RestartPlayerAtTransform", "SpawnDefaultPawn", "InitGame", "ChoosePlayerStart"]
        answer_index: 0
        explain: "RestartPlayer has the variants RestartPlayerAtPlayerStart and RestartPlayerAtTransform for when you want to decide where the Pawn spawns."
      - q: "A level has no Player Start actor. Where does the player spawn?"
        choices: ["At the camera position", "At the world origin 0,0,0", "At a random actor", "The game refuses to start"]
        answer_index: 1
        explain: "The Player Start page says that if your Level has no Player Start Actor, the player always starts at the 0,0,0 coordinates."
      - q: "A level has several Player Starts and you do nothing special. How is one chosen?"
        choices: ["Always the first one placed", "The one nearest the camera of the player that is joining now", "A random one, preferring Player Starts that are unobstructed", "The one with the highest Z"]
        answer_index: 2
        explain: "With more than one Player Start, the player starts from a random Player Start each time, prioritizing Player Start Actors that are unobstructed."
      - q: "What does the Incoming Name parameter of FindPlayerStart match against?"
        choices: ["The Player Start's Player Start Tag", "The actor's display name in the Outliner", "The player's Player State name", "The level name"]
        answer_index: 0
        explain: "If an Incoming Name is provided, the default FindPlayerStart looks for a Player Start whose Player Start Tag matches that string. The engine does not provide this name in most internal calls."
      - q: "InitGame is called at what point?"
        choices: ["After all actors in the level have run their BeginPlay events", "Before any other scripts, including PreInitializeComponents", "When the first player logs out", "Only in packaged builds"]
        answer_index: 1
        explain: "InitGame is called before any other scripts, including PreInitializeComponents, and is used by the Game Mode to initialize parameters and spawn its helper classes."
    flavors:
      _default: {why: "Every respawn rule (lives, delay, where) hangs on the Game Mode login and restart functions."}
      gameplay_design: {why: "A respawn that feels fair is a design decision; the hooks are already there.", do: "Add a rule: respawn delay grows by 1 second each death, capped at 6."}
      level_design: {why: "Tagged Player Starts are how the level tells the Game Mode where a checkpoint is.", do: "Add a third tagged start and a trigger that changes which tag is used."}

  - id: GDQ83
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [game-state, player-state, scoring, win-state, blueprint]
    required_spine: false
    required: false
    title: "Score in the right class: Game State vs Player State"
    brief: "In a multiplayer game it matters which class holds each value. The Game Mode holds the rules and exists only on the server, the Game State holds data that every player must see, such as a team score, and the Player State holds the data of one player, such as that player's own score. A score in the wrong class is a mistake that you only notice with two players. In this quest you store a personal score and a team score in the right classes and show them in both player windows."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-framework-quick-reference-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/game-mode-and-game-state-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/game-mode-and-game-state-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create BP_PS_Score with the parent Player State and an Integer variable Score. Create BP_GS_Score with the parent Game State and the variables TeamScore (Integer), TargetScore (Integer, default 10) and bGameOver (Boolean). Set Score and TeamScore to Replicated. Create a Game Mode Blueprint named BP_GM_Score with the parent Game Mode, assign both classes and the template character as Default Pawn Class in its Class Defaults, and set it as the GameMode Override of your level."
      - "In the Game Mode, create a function named AddScore with the inputs Controller and Amount. It adds Amount to Score on the Player State of that controller, and to TeamScore on the Game State. Never write these values from the pickup itself."
      - "Make a Blueprint named BP_ScoreOrb. When a pawn overlaps it, get the Game Mode and call AddScore with the Controller of the pawn and the amount 1. Then the orb destroys itself."
      - "In AddScore, after adding, compare TeamScore with TargetScore. When the target is reached, set bGameOver to true and call End Match. If you use Game Mode Base, print WIN."
      - "Make a small widget named WBP_Scores. It calls Get Game State, casts the result to BP_GS_Score, and loops over Player Array. It lists the Score of each player, the TeamScore, and the server world time from Get Server World Time Seconds."
      - "Test with 2 players in Play In Editor with the Listen Server mode. Both windows must show the same TeamScore and the Score of each player."
      - "Write 4 sentences: one each for Game Mode, Game State and Player State that says what you stored there and why, and one about what you did NOT store in the Game Mode."
    done_when: "Send one screenshot of both Play windows with WBP_Scores showing matching values, and one screenshot of AddScore. Add your 4 sentences."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "A per-player score in a team match. Which class should hold it?"
        choices: ["Game Mode", "Game State", "Player State", "HUD"]
        answer_index: 2
        explain: "Player State holds the state of one participant, for example name, score or whether they carry the flag. Game State is not the best place for player-specific points."
      - q: "The team score in Capture The Flag. Which class should hold it?"
        choices: ["Game State", "Player Controller", "Game Instance", "Game Mode"]
        answer_index: 0
        explain: "Game State tracks game-wide properties that all clients need, such as team score, the list of players or completed missions. It exists on the server and all clients."
      - q: "Why is the Game Mode a bad place for the current score?"
        choices: ["Game Mode cannot hold integers", "Game Mode exists only on the server, so clients cannot read its data", "Game Mode is deleted right after BeginPlay, so its variables are lost", "Scores must be floats"]
        answer_index: 1
        explain: "The Game Mode exists only on the server and should not hold transient data that clients need to know about. Data clients need goes on the Game State or Player State."
      - q: "Which statement about Player States is true?"
        choices: ["They exist only on the owning client and on the server, like Controllers", "They exist for all players on all machines, unlike Player Controllers", "Every AI enemy has one", "They are not replicated"]
        answer_index: 1
        explain: "Player States for all players exist on all machines and can replicate freely, unlike Player Controllers. Non-player AI that is part of the game does not have a Player State."
      - q: "A bot that plays like a human in a deathmatch. Does it get a Player State?"
        choices: ["No, only humans get one", "Yes, a bot simulating a player is a participant", "Only if it has a HUD", "Only on dedicated servers, never on a listen server"]
        answer_index: 1
        explain: "A Player State is the state of a participant, such as a human player or a bot that is simulating a player."
      - q: "You need to loop over every player from the Game State. Which member gives you that?"
        choices: ["PlayerArray", "GetAllActorsOfClass", "Default Pawn Class", "MatchState"]
        answer_index: 0
        explain: "PlayerArray on the Game State is the array of all Player State objects, useful when doing something to all players in a game."
      - q: "You want a round clock that is the same on server and clients. Which function is made for that?"
        choices: ["Get Game Time in Seconds on each of the clients", "Get Server World Time Seconds on the Game State", "Get Real Time Seconds", "Delta Seconds summed on each client"]
        answer_index: 1
        explain: "GetServerWorldTimeSeconds is the server's version of the world time and is synchronized on both client and server, so it is a reliable time to use for replication."
      - q: "Which class typically owns the HUD and the Player Camera Manager?"
        choices: ["Game State Base", "Player State", "Player Controller", "Game Mode"]
        answer_index: 2
        explain: "Each Player Controller typically has one HUD and one PlayerCameraManager. The Player Controller represents the human player's will."
    flavors:
      _default: {why: "Score that lives in the wrong class is a bug you only see with two players."}
      gameplay_design: {why: "Win states and scoreboards are design; putting data in the right class is what makes them work for everyone.", do: "Add a per-player Deaths counter and show a K/D style line in the widget."}
      programming: {why: "This is the class layout a coder expects when they replicate your values.", do: "Mark Score and TeamScore as Replicated and confirm the client window updates without extra code."}

  - id: GDQ84
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [timers, waves, timer-handle, blueprint, loops]
    required_spine: false
    required: false
    title: "A wave director built on timer handles"
    brief: "A timer calls an event after some time, or again and again. When you start a timer you get a timer handle, a reference that lets you pause, read or stop that timer later. Waves of enemies, cooldowns and round clocks all depend on timers, and handles are how you keep them under control. In this quest you build a wave director, an actor that spawns a new wave of enemies on a looping timer, and you pause, read, clear and replace that timer through its handle."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-timers-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open a project made from the Third Person template, or create one. Create an Actor Blueprint named BP_WaveDirector. Add the variables Wave (Integer, 0), MaxWaves (Integer, 5) and WaveTime (Float, 20.0), and a Timer Handle variable named WaveHandle."
      - "On Begin Play, use Set Timer by Event with Looping on and the time WaveTime, bound to a custom event named NextWave. Store the result in WaveHandle. NextWave adds 1 to Wave and spawns Wave x 2 enemies. Any pawn or a cube is fine as an enemy."
      - "Add a trigger named BP_SafeZone. When the player enters it, call Pause Timer by Handle with WaveHandle. When the player leaves, call Unpause Timer by Handle. Print Get Timer Remaining Time by Handle on both events, to prove that the remaining time did not change during the pause."
      - "Add a debug widget, or a Print String every 0.5 s, that shows Get Timer Remaining Time by Handle and Get Timer Elapsed Time by Handle. Check that elapsed plus remaining equals WaveTime."
      - "In NextWave, when Wave reaches MaxWaves, call Clear and Invalidate Timer by Handle and print WAVES DONE. Then read Get Timer Remaining Time by Handle one more time and note what value an invalid handle returns."
      - "Add a key that calls Set Timer by Event again with the same WaveHandle but with the time 5.0. Notice that the old 20-second timer is replaced and that you do not get two timers."
    done_when: "Send one screenshot of the BP_WaveDirector graph. Also send one screenshot of the Play window that shows the remaining time printed during the pause, the WAVES DONE message, and the value returned for the invalid handle."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Where do timers live?"
        choices: ["In a timer list on each Actor, which is deleted with the Actor only", "In a global Timer Manager on the Game Instance and one on each World", "In the Player Controller", "In the Level Blueprint"]
        answer_index: 1
        explain: "Timers are managed by a global Timer Manager (FTimerManager). One exists on the Game Instance and one on each World. Actors reach the world one through GetWorldTimerManager."
      - q: "The actor that owns a running timer is destroyed before the time is up. What happens?"
        choices: ["The timer still fires on a null object and logs an Accessed None error", "The timer moves to the Game Instance", "The engine crashes", "The timer is cancelled automatically and the handle becomes invalid"]
        answer_index: 3
        explain: "Timers are cancelled automatically if the Object they will be called on is destroyed. The timer handle becomes invalid and the function is not called."
      - q: "You call SetTimer again with a timer handle that already points to a running timer. What happens?"
        choices: ["Both timers run", "It is ignored", "The old timer is cleared and replaced with the new one", "The old rate is added to the new one and both keep running"]
        answer_index: 2
        explain: "Calling SetTimer with an existing timer handle clears the timer referenced by that handle and replaces it with a new one."
      - q: "What happens to the elapsed and remaining time while a timer is paused?"
        choices: ["Both reset to zero", "They stay the same", "Remaining keeps going down", "Elapsed keeps going up"]
        answer_index: 1
        explain: "PauseTimer prevents the function call, but the elapsed and remaining times stay the same while paused. UnPauseTimer resumes it."
      - q: "GetTimerRemaining returns -1. What does that mean?"
        choices: ["The timer fires next frame", "The timer is paused", "The timer handle is not valid", "The timer rate is one second"]
        answer_index: 2
        explain: "GetTimerElapsed, GetTimerRemaining and GetTimerRate all return -1 if the timer handle is invalid."
      - q: "How do you change the rate of a running timer?"
        choices: ["You cannot change it directly; call SetTimer again with the handle and the new rate", "Call SetTimerRate on the handle", "Pause the timer with its handle, edit the rate on the handle, then unpause the timer", "Rates are fixed at 1 second"]
        answer_index: 0
        explain: "A timer's rate cannot be changed directly, but SetTimer can be called with its handle to clear it and create a new timer that is the same except for the rate."
      - q: "What is special about SetTimerForNextTick?"
        choices: ["It runs on the next frame and does not fill out a timer handle", "It repeats on every frame forever until you clear its handle", "It only works in C++", "It pauses the game one frame"]
        answer_index: 0
        explain: "SetTimerForNextTick runs on the next frame instead of a timed interval, and it does not fill out a timer handle."
      - q: "Calling SetTimer with a rate of 0 or less does what?"
        choices: ["Fires the timer on every single frame", "Is identical to calling ClearTimer", "Sets the rate to 1 second", "Pauses the timer"]
        answer_index: 1
        explain: "The docs say calling SetTimer with a rate less than or equal to zero is identical to calling ClearTimer."
    flavors:
      _default: {why: "Waves, cooldowns and round clocks all break in the same ways; handles are how you keep them under control."}
      gameplay_design: {why: "A wave director you can pause and read is the core of any horde or survival mode.", do: "Add an Intermission: after each wave pause the loop for 5 seconds with a separate timer, then unpause."}
      programming: {why: "The C++ API on the page maps one to one to the Blueprint timer nodes you use here.", do: "Note which node matches ClearAllTimersForObject and use it on End Play."}

  - id: GDQ85
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [travel, seamless-travel, rounds, level-transition, multiplayer]
    required_spine: false
    required: false
    title: "Between rounds: travel to the next map"
    brief: "Travel means that the server and all connected players move from one map to another, for example between rounds. With seamless travel the players stay connected, and a small transition map is loaded for a moment while the big maps change. Without it, each client disconnects and connects again. In this quest you set up two arena maps and a transition map, travel between them with two players, and compare seamless travel with the other kind."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/travelling-in-multiplayer-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/game-mode-and-game-state-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a Game Mode Blueprint named BP_GM_Travel with the parent class Game Mode and the template character as Default Pawn Class, or use a Game Mode of your own with that parent. Make two small maps named L_Arena_A and L_Arena_B, each with a floor and a Player Start. In World Settings, set GameMode Override to this Game Mode on both. Give each map a floor of a different color, so that you can tell them apart."
      - "Make an almost empty map named L_Transition with only a floor. Open Project Settings, go to Maps & Modes, and set Transition Map to L_Transition."
      - "In the Class Defaults of the Game Mode, turn on Use Seamless Travel."
      - "Add a key press event in the character that stands in for the end of a round and runs a server travel to the other map. In a Blueprint, use Execute Console Command with the text servertravel L_Arena_B, or ask a programmer to expose ServerTravel. Run it only from the server."
      - "Seamless travel does not work in a normal Play In Editor session, so test it as a standalone game. Open the dropdown next to the Play button, set Number of Players to 2 and Net Mode to Play As Listen Server, and choose Standalone Game. Trigger the travel. Both windows must arrive in L_Arena_B, and the client must stay connected without a reconnect."
      - "Now turn Use Seamless Travel off and play again. Describe the difference that you see in the client window."
      - "Write 3 sentences: which travel type you used, why the transition map exists, and one thing that was kept across the travel."
    done_when: "Send one screenshot of both Play windows in L_Arena_B after a seamless travel, one screenshot of the Transition Map setting in Maps & Modes, and your 3 sentences."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the main difference between seamless and non-seamless travel?"
        choices: ["Seamless is only for single player", "Seamless is non-blocking; non-seamless is a blocking call", "Non-seamless keeps the client connected; seamless does not", "Seamless needs a dedicated server"]
        answer_index: 1
        explain: "Seamless travel is a non-blocking operation, while non-seamless travel is a blocking call. Epic recommends seamless travel when possible for a smoother experience."
      - q: "During a non-seamless travel, what does the client do?"
        choices: ["It stays connected and streams the new map in the background as it plays", "It becomes the new server", "It loads the transition map", "It disconnects from the server and then reconnects to the same server"]
        answer_index: 3
        explain: "In a non-seamless travel the client disconnects from the server and then reconnects to the same server, which will have the new map ready to load."
      - q: "Which of these must be a non-seamless travel?"
        choices: ["Moving from round 2 to round 3", "Connecting to a server for the first time as a client", "Returning to the same map", "Any travel on a listen server that has clients connected"]
        answer_index: 1
        explain: "The three cases that must be non-seamless are: loading a map for the first time, connecting to a server for the first time as a client, and ending a multiplayer game to start a new one."
      - q: "Which function is the normal way a multiplayer game moves everyone from map to map?"
        choices: ["UEngine::Browse on each client", "APlayerController::ClientTravel called by one of the clients", "UWorld::ServerTravel called on the server; all clients follow", "OpenLevel on every client"]
        answer_index: 2
        explain: "ServerTravel is for the server only. It jumps the server to the new level, all connected clients follow, and the server calls ClientTravel for each client."
      - q: "ClientTravel is called on a client. What does it do?"
        choices: ["Travels that client to a new server", "Moves the whole server to a new map", "Restarts the match", "Does nothing on clients"]
        answer_index: 0
        explain: "If called from a client, ClientTravel travels to a new server. If called from the server, it tells that one client to travel to the new map while staying connected."
      - q: "Why does seamless travel use a transition map?"
        choices: ["Because a world must always be loaded, and holding two big maps at once would cost too much memory", "To show a loading video", "To save the game", "Because clients cannot load maps directly from the server, so a small map on the client has to do it"]
        answer_index: 0
        explain: "There must always be a world loaded, so the old map cannot be freed before the new one loads. A small transition map overlaps with them cheaply instead of two big maps."
      - q: "You leave the Transition Map setting empty and enable seamless travel. What happens?"
        choices: ["Seamless travel is disabled until a map is set there", "An empty map is created and used as the transition map", "The current map is reused", "The game crashes on travel"]
        answer_index: 1
        explain: "UGameMapsSettings::TransitionMap is empty by default. If the game leaves it empty, an empty map is created for the transition map."
      - q: "Which of these persists automatically across a seamless travel, by default?"
        choices: ["All static mesh actors that are set to Movable in the old map", "Every enemy pawn", "The Game Mode actor on the server and the Player Controllers", "The old level's lighting"]
        answer_index: 2
        explain: "By default the Game Mode (server only), Controllers with a valid Player State (server only), all Player Controllers (server only) and local Player Controllers (server and client) persist."
    flavors:
      _default: {why: "Map rotation and round-to-round travel are the glue of any multi-map loop."}
      gameplay_design: {why: "How players move between rounds decides whether your loop feels like one game or a restart.", do: "Add a round counter on the Game State and check whether it survived the travel; explain why or why not."}
      programming: {why: "Browse, ServerTravel and ClientTravel are the three functions you will be asked about.", do: "Expose a ServerTravel Blueprint function in C++ or a Blueprint Function Library."}

  - id: GDQ86
