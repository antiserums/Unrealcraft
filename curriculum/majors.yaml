# Unrealcraft — ranks, majors, tasters, capstones.
# The quest picker reads this file. Quest files hold the quests themselves.

ranks:
  # xp is CUMULATIVE. A rank-up needs BOTH xp >= threshold AND this major's capstone for the rank at Pass.
  # The brief's example thresholds (0/200/500/1000/1800/3000/5000) are lower than the XP the Starter Quests
  # alone pays out (~620 + ~95 Orientation), so XP would never be the gate. The values below are rescaled so
  # XP roughly equals "the required quests for that rank are done". Tune after the first 30 days.
  # Level Design cumulative XP from required quests only: end R0 ≈ 705, end R1 ≈ 1675, end R2 ≈ 2635,
  # end R3 ≈ 3825 raw (≈ 4050 with the 1.25× in-Specialty bonus). Each threshold sits a little below that, so the
  # capstone is the real gate. Phase 4 TODO: rebalance Programming and Environment Art quest XP to land near the same totals.
  # Each rank opens a quest difficulty tier (`tier`, see TIERS in bot/registrar/curriculum.py).
  # `quests_to_leave`: how many quests of that tier (your major's own + shared ones required for it) you must
  # finish, on top of the core path, before the next promotion. Capped at what exists while content grows.
  - {n: 0, key: novice,       title: "Novice",       tier: novice,     xp: 0,     color: "#7A8C7E", hoist: false, opens: "🟢 Novice quests: #quest-log, #starter-quests and the major forums (read all, post in your major's)"}
  - {n: 1, key: apprentice,     title: "Apprentice",     tier: apprentice, quests_to_leave: 30, xp: 650,   color: "#B5714B", hoist: false, opens: "🔵 Apprentice quests and the Blockout tag in #showcase"}
  - {n: 2, key: adept,      title: "Adept",      tier: adept, quests_to_leave: 60,      xp: 1500,  color: "#3D7DD8", hoist: false, opens: "🟣 Adept quests and peer reviews: you can approve Rank 0–1 turn-ins"}
  - {n: 3, key: expert,        title: "Expert",        tier: expert, quests_to_leave: 120,     xp: 2500,  color: "#D9824A", hoist: false, opens: "🟠 Expert quests, your major on the nameplate (e.g. Expert · Level Design) and /critique"}
  - {n: 4, key: master, title: "Master", tier: master, quests_to_leave: 220,     xp: 3700,  color: "#8A9BA8", hoist: true, opens: "🔴 Master quests and reviewing Rank 2 work"}
  - {n: 5, key: senior,    title: "Senior",    tier: master,     xp: 6500,  color: "#8E6CCF", hoist: true, human_review: true, opens: "the Lecture Hall stage and writing quests"}
  - {n: 6, key: lead,    title: "Lead",    tier: master,     xp: 9500,  color: "#D4AF37", hoist: true, human_review: true, vouchers: 2, opens: "#curriculum-wip and full mentor tools"}


community:
  # Quests and checklist lines marked needs_others (playtests, critique, reviewing others) stay hidden and
  # optional until the server has this many real (non-bot) members.
  min_members: 20

xp_rules:
  quiz_first_try_bonus_pct: 20
  peer_review: {xp: 15, daily_cap: 3}
  showcase_fire: {reactions: 5, xp: 25, weekly_cap: 1}
  chat_xp: 0                       # OFF. Never counts toward ranks.
  submit_cooldown_after_fail_min: 120
  spot_check_every: 5                # every Nth Rank 0-1 turn-in (accepted on trust) is also shown to mentors
  in_major_multiplier_rank3plus: 1.25   # Expert+ earn more on quests in their own major
  post_spine_mix: {major: 70, adjacent: 15, opposite: 10, social: 5}

majors:
  level_design:
    title: "Level Design"
    prefix: LDQ
    blurb: "Spaces, flow, encounters. You make the player go where you need them to."
    adjacent: [lighting, bp-interact, foliage]
    opposite: [cpp-hello, gas-video]      # one of
    required_tasters:                     # rank -> list of any_of groups; each group needs one quest
      1: [[EAQ11]]                      # foliage pass (adjacent)
      2: [[PQ17, PQ18]]      # opposite: C++ hello OR GAS video
      3: []                                # shared characters-anim required quests cover it
    capstones:
      1: {id: LDQ20, title: "Three-route courtyard", brief: "3-route courtyard, readable nav, lighting for readability."}
      2: {id: LDQ32, title: "Beats & playtest",      brief: "3 beats + 2 BP interacts + metrics sheet + one peer playtest."}
      3: {id: LDQ40, title: "Encounter space",       brief: "Encounter space + 1-page GDD + one critique iteration."}
      4: {id: R4-LD-CAP, title: "Modular kit + naming law", brief: "Modular kit + naming law + handoff doc so a Novice can place it. PCG optional. NOT a C++ shooter."}
      5: {id: R5-LD-CAP, title: "Streamed slice",       brief: "World Partition or data layers slice + encounter spawn notes."}
      6: {id: R6-LD-CAP, title: "Shipped level",        brief: "Packaged level + notes from 3 playtesters."}

  programming:
    title: "Programming"
    prefix: PQ
    blurb: "Systems, C++, the code everyone else's work runs on."
    adjacent: [cpp, bp-interop, logging]
    opposite: [lighting-pass]
    required_tasters:
      1: [[LDQ19]]                      # walk-and-note a courtyard (shared LD taster)
      2: [[EAQ22]]
      3: []
    capstones:
      1: {id: PQ8, title: "Debug room", brief: "Small debug space + notes (or shared courtyard taster)."}
      2: {id: PQ19, title: "Pickup/win loop", brief: "Pickup/win loop in Blueprint."}
      3: {id: PQ30, title: "C++ base, BP children", brief: "C++ actor that Blueprint children use."}
      4: {id: R4-PR-CAP, title: "Port or kit", brief: "C++ rewrite of the loop OR component kit + writeup on what belongs in C++ vs BP."}
      5: {id: R5-PR-CAP, title: "Net or GAS", brief: "Listen-server toy OR one GAS ability + AttributeSet + how a designer adds a second ability."}
      6: {id: R6-PR-CAP, title: "Ship + postmortem", brief: "Packaged build + postmortem."}

  lookdev:
    title: "Environment Art"
    prefix: EAQ
    blurb: "Materials, light and mood. You set how the world looks."
    adjacent: [lighting, landscape-material, decals]
    opposite: [pickup-game]
    required_tasters:
      1: []
      2: [[GDQ5]]
      3: []
    capstones:
      1: {id: EAQ12, title: "Lit diorama", brief: "Lit diorama."}
      2: {id: EAQ24, title: "Walkable diorama", brief: "Walkable diorama + master material + instances."}
      3: {id: EAQ35, title: "Reference scene", brief: "A reference scene the server can use."}
      4: {id: R4-LK-CAP, title: "Material function library", brief: "Material function library + usage doc."}
      5: {id: R5-LK-CAP, title: "Lighting scenarios", brief: "Time-of-day / weather / lighting scenario system."}
      6: {id: R6-LK-CAP, title: "Shipped shot", brief: "Packaged shot or level + breakdown."}

  # ---------- stubbed majors (titles + capstones only in Phase 1) ----------
  tech_art:
    title: "Tech Art"
    prefix: TAQ
    blurb: "Tools, shaders and VFX that make artists faster."
    adjacent: [materials, niagara, cpp-utility]
    opposite: [full-net]
    required_tasters: {1: [], 2: [], 3: []}
    capstones:
      1: {id: TAQ9,  title: "Lit test bed", brief: "Lit test room: view-mode notes, a construction-script prop, one Niagara system, one scripted action."}
      2: {id: TAQ15, title: "Master + FX", brief: "Master material + instances, and one Niagara system driven by a Blueprint parameter."}
      3: {id: TAQ23, title: "Artist tool", brief: "One editor tool (EUW, Scriptable Tool or Python) an artist uses without help, with a usage doc."}
      4: {id: TAQ29, title: "Pipeline piece", brief: "Validated import/naming tool OR material function library with docs, plus a Low-vs-Epic scalability check."}
      5: {id: R5-TA-CAP, title: "Perf budget", brief: "Scene perf budget + Insights capture + fixes."}
      6: {id: R6-TA-CAP, title: "Shipped toolkit", brief: "Toolkit used by 3 others + changelog."}

  gameplay_design:
    title: "Gameplay Design"
    prefix: GDQ
    blurb: "Rules, loops and feel. You make a thing fun."
    adjacent: [blueprint, umg, ld-graybox]
    opposite: [master-material-from-scratch]
    required_tasters: {1: [[EAQ11]], 2: [[EAQ23]], 3: []}
    capstones:
      1: {id: GDQ19, title: "Toy space", brief: "A graybox toy room built around one verb, with one tunable variable and one on-screen number."}
      2: {id: GDQ25, title: "Core loop", brief: "Playable loop with win/lose + HUD + tuning variables in a Data Table."}
      3: {id: GDQ32, title: "Mechanic + GDD", brief: "One mechanic with 3 tuned variants, a 1-page design doc and one playtest note."}
      4: {id: GDQ38, title: "Data-driven system", brief: "A system tuned entirely from Data Assets/Tables, with a doc a designer can follow without opening graphs."}
      5: {id: R5-GD-CAP, title: "Balance pass", brief: "Economy/difficulty curve + telemetry-ish log + one GAS ability (BP)."}
      6: {id: R6-GD-CAP, title: "Shipped slice", brief: "Packaged slice + notes from 3 playtesters."}

  animation:
    title: "Animation"
    prefix: AQ
    blurb: "Characters that move and react believably."
    adjacent: [animbp, mannequin-in-space]
    opposite: [world-partition]
    required_tasters: {1: [], 2: [[GDQ5]], 3: []}
    capstones:
      1: {id: AQ17, title: "Stage for motion", brief: "Lit stage with metrics marks and the mannequin playing a looping sequence."}
      2: {id: AQ23, title: "Triggered montage", brief: "A Blueprint interaction plays a montage with a notify that spawns an effect or sound."}
      3: {id: AQ29, title: "Locomotion set", brief: "AnimBP with idle/walk/run blend space, jump states and one upper-body layer."}
      4: {id: AQ36, title: "Control Rig kit", brief: "A Control Rig + retargeted animation set another member can apply, with a doc."}
      5: {id: R5-AN-CAP, title: "Motion system", brief: "Motion Matching or layered locomotion + docs."}
      6: {id: R6-AN-CAP, title: "Shipped reel", brief: "Packaged playable with character + breakdown."}

  cinematics:
    title: "Cinematics"
    prefix: CQ
    blurb: "Cameras, Sequencer and shots."
    adjacent: [sequencer, cameras, lookdev-still]
    opposite: [gas]
    required_tasters: {1: [], 2: [[GDQ5]], 3: []}
    capstones:
      1: {id: CQ9,  title: "Three-shot board", brief: "3 camera setups on a lit set, with storyboard stills and a one-line description each."}
      2: {id: CQ15, title: "First sequence", brief: "A 15-second Sequencer shot with 2+ cameras, triggered in-game via Blueprint, rendered with MRQ."}
      3: {id: CQ23, title: "Scene", brief: "A 30–45 s scene with character animation, 3+ shots, graded, rendered with MRQ."}
      4: {id: CQ29, title: "Shot kit", brief: "Reusable camera rigs/templates and a render preset, with a doc another member can follow."}
      5: {id: R5-CN-CAP, title: "Pipeline shot", brief: "Multi-shot sequence with takes/subsequences, reviewed."}
      6: {id: R6-CN-CAP, title: "Shipped short", brief: "Finished short + breakdown."}

  undecided:
    title: "Undecided"
    blurb: "Try things. Must pick by Rank 2."
    adjacent: []
    opposite: []
    required_tasters: {1: [], 2: [], 3: []}
    capstones:
      1: {id: LDQ20, title: "Three-route courtyard (default)", brief: "Undecided follows the Level Design R1 capstone as the neutral default."}
