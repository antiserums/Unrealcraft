    specializations: [tech_art]
    subjects: [niagara, events, event-handlers, cpu-simulation]
    required_spine: false
    required: false
    title: Fireworks with events
    brief: "An event is a message that a particle in one emitter sends to another emitter, for example \"I am here\" or \"I just died\". The other emitter can react by spawning its own particles at that place. This is how one effect becomes a chain of effects. Events only work with CPU simulation. In this quest you build fireworks: a rocket that leaves a trail behind it and explodes when its life ends."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/events-and-event-handlers-in-niagara-effects-for-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/add-event-handler-group-reference-for-niagara-effects-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/emitter-settings-reference-for-niagara-effects-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Create a Niagara System named FXS_TA_Fireworks with an emitter named Rocket (CPU sim, from the Sprite Burst or Fountain template). Give the rockets a lifetime of about 2 s and a strong upward velocity."
      - "In the Rocket emitter, open Emitter Properties and enable Requires Persistent ID. Events need this so that each particle can be identified."
      - "In the Particle Update group of Rocket, click the + button. Under Events, add Generate Location Event and Generate Death Event."
      - "Add a second emitter named Trail. Click the + button next to Emitter Properties and add an Event Handler. Set Source to the location event of Rocket, set Execution Mode to Spawned Particles and set Spawn Number to 3. Then add a Receive Location Event module."
      - "Add a third emitter named Explosion. Add an Event Handler with Source set to the death event of Rocket and a Spawn Number of about 60, and add a Receive Death Event module. Give the explosion particles a short lifetime and a random sphere velocity."
      - "As a test, set Execution Mode to Every Particle on the Trail handler and watch what happens. Then set it back to Spawned Particles."
      - "Optional: add a Collision module to Rocket and then a Generate Collision Event. Make the explosion also start when a rocket hits something."
    done_when: "Send a screenshot of the three emitters in the System Overview with the Event Handler stages visible, and of the viewport that shows a trail behind a rocket and an explosion when the rocket dies."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Your rocket emitter runs on the GPU and the trail never spawns. What is the most likely reason?"
        choices: ["The trail material is wrong for a ribbon", "Events only work with CPU simulation, not GPU", "Spawn Number must be above 100 per event", "The Receive Event must be in Particle Spawn"]
        answer_index: 1
        explain: "The docs state that events with GPU simulations will not work. Events only work with CPU simulation."
      - q: "Which Emitter Properties setting must be enabled on an emitter that generates events?"
        choices: ["Local Space Enabled", "Interpolated Spawning", "Requires Persistent ID", "Fixed Bounds Enabled"]
        answer_index: 2
        explain: "In order to use events, enable Requires Persistent IDs in the Emitter Properties of the generating emitter."
      - q: "In which group do you add a Generate Location Event module?"
        choices: ["Emitter Spawn", "Particle Update", "Render", "System Update"]
        answer_index: 1
        explain: "Events happen as the particle ages, so event modules are added to the Particle Update group under the Events section."
      - q: "What two parts make up an Event Handler in the listening emitter?"
        choices: ["A Collision module and a Kill module", "A Spawn Rate and a Spawn Burst", "A Sprite Renderer and a Mesh Renderer in the Render group", "Event Handler Properties and a Receive Event module"]
        answer_index: 3
        explain: "For each event you respond to, you add an Event Handler Properties item and a matching Receive Event module."
      - q: "You want an explosion when the rocket particle reaches the end of its lifetime. Which event type fits?"
        choices: ["Location event", "Collision event", "Spawn event", "Death event"]
        answer_index: 3
        explain: "A Generate Death Event fires at the end of each particle's lifetime. Combine it with location data to place the explosion."
      - q: "Before you can add a Generate Collision Event to an emitter, what must that emitter already have?"
        choices: ["A Mesh Renderer", "A Collision module", "A Light Renderer", "A Ribbon Renderer"]
        answer_index: 1
        explain: "You need to add a Collision module first so the particles can collide with the world."
      - q: "What does the Every Particle execution mode do, and why does the docs warn about it?"
        choices: ["Runs the event script on every existing particle in the emitter, which can create a large amount of runtime work", "Spawns one particle for every event that arrives, which is cheap, but the docs warn that some events can be lost", "Deletes every particle in the emitter when an event arrives, which the docs warn can make an effect vanish in the middle of a shot", "Runs only on the first particle that was spawned, which the docs warn is easy to miss, because the other particles ignore the event"]
        answer_index: 0
        explain: "Every Particle runs the event script on all existing particles. The docs say to be careful, as it can lead to a lot of work."
      - q: "What happens when more events are generated in a frame than Max Events Per Frame allows?"
        choices: ["The extra events are queued for the next frame", "The extra events are ignored", "The emitter stops spawning for a frame", "The system resets and starts again"]
        answer_index: 1
        explain: "Max Events Per Frame sets how many events are consumed. Additional events beyond that value are ignored."
    flavors:
      _default: {why: "Events let emitters talk to each other, which is how one effect becomes a chain of effects."}
      tech_art: {why: "Gameplay teams will ask for 'when this dies, do that'. Events are the Niagara-native answer.", do: "Use the Attribute Spreadsheet to confirm the Trail particles inherit the rocket velocity."}

  - id: TAQ66
