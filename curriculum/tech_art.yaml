    title: Per-object variation without dynamic instances
    brief: "Custom Primitive Data, or CPD, is a way to store a few numbers, such as a color, on each object in the level. A material can read these numbers, so many objects can share one material and still look different. The older way is to give each object its own Dynamic Material Instance (MID), but that stops the engine from drawing the objects together in one step. Each such step is called a draw call, and fewer draw calls mean better performance. In this quest you build both versions and compare their draw calls."
