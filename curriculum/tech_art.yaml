  - id: TAQ73
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [materials, customized-uvs, vertex-shader, optimization, mobile]
    required_spine: false
    required: false
    title: UV math in the vertex shader
    brief: "A material is calculated in two stages. The vertex shader runs once for each vertex (corner point) of the mesh, and the pixel shader runs once for each pixel on screen, which is usually far more often. Customized UVs are extra pins on a material that let you move UV math, the math that decides where a texture is placed, into the cheaper vertex shader. This only gives a correct result for some kinds of math. In this quest you move UV math into Customized UVs, compare the cost, and see where it stops working."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/customized-uvs-in-unreal-engine-materials"
    backup_url: null
    checklist:
      - "Open any project, or create one from the Third Person template. Create a material named M_TA_CustomUV. Select the main material node and set Num Customized UVs to 2. Two CustomizedUV pins appear on the node."
      - "Build two UV setups. The first is a tiling setup: a TexCoord node multiplied by a Scalar Parameter named Tiling. The second is a world-space mapping: the Y and Z of WorldPosition divided by a scale. Plug the tiling into CustomizedUV0 and the world mapping into CustomizedUV1."
      - "Add two Texture Sample nodes. Leave the first one with no UV input, because it then reads TexCoord 0. Give the second one a TexCoord node with index 1. Blend the two samples into Base Color."
      - "Duplicate the material as M_TA_PixelUV. In the copy, move the same UV math into the UV inputs of the Texture Sample nodes, so that it runs in the pixel shader. Compare the instruction counts in the Stats panel of both materials."
      - "Now add a non-linear operation (a Sine of the UV) to CustomizedUV0. Apply the material to a 1x1 plane and to a subdivided plane, which is a plane with many more vertices, and compare the result."
      - "Write two lines: which math you would keep in Customized UVs and which math you would not, and why."
    done_when: "Send a screenshot of M_TA_CustomUV with the two CustomizedUV pins connected and the Stats panel visible, plus a side-by-side image of the Sine test on a low-poly plane and a high-poly plane. Add your two lines of reasoning."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Why can moving UV math into Customized UVs make a material faster?"
        choices: ["Customized UVs run in the vertex shader, and there are usually far fewer vertices than pixels", "Customized UVs are cached between frames, so the math only runs when the mesh or camera moves", "The texture is sampled at a lower mip, which costs less memory and less bandwidth", "The math is compiled to a lookup table that the pixel shader reads with one fetch"]
        answer_index: 0
        explain: "Almost all material nodes run per pixel. Customized UVs run only in the vertex shader, which usually does much less work because there are fewer vertices."
      - q: "You put a Sine on the UVs in CustomizedUV0. When will the result look different from doing it per pixel?"
        choices: ["Never, the results are always identical, because the GPU evaluates the Sine again for each pixel", "Only on mobile, where the vertex shader uses a lower precision than it does on a desktop GPU", "Only when the texture has mipmaps, because the lower mips are sampled at vertex positions", "When the mesh has few vertices, because non-linear math is interpolated between vertices"]
        answer_index: 3
        explain: "Non-linear operations like sine, squaring or length depend on mesh tessellation. Linear math (multiply, add) gives the same result in both shaders."
      - q: "A Texture Sample has nothing connected to its UVs pin. After you modify CustomizedUV0, what does it read?"
        choices: ["The original mesh UVs, because unconnected samplers ignore Customized UVs", "The modified UV value, because Texture Samples use TexCoord 0 by default", "Nothing, it turns black, because it has no UVs", "CustomizedUV1, the channel after the one you changed"]
        answer_index: 1
        explain: "The Texture Sample node has an implicit TexCoord0 inside. If CustomizedUV0 is modified, TexCoord 0 returns the modified value."
      - q: "How many Customized UVs can Shader Model 5 on PC use, and how many can OpenGL ES2 on mobile use?"
        choices: ["4 and 2", "16 and 8", "8 and 3", "2 and 1"]
        answer_index: 2
        explain: "The docs state SM5 on PC can use 8 custom UVs, while OpenGL ES2 on mobile can only use 3."
      - q: "Which component type does the docs say does NOT support Customized UVs?"
        choices: ["Static Meshes", "Sprite particles", "Landscape", "Skeletal Meshes"]
        answer_index: 1
        explain: "Customized UVs work for Static Meshes, Skeletal Meshes, BSP, landscape and mesh particles. Sprite particles do not support them yet."
      - q: "When can the extra vertex shader work become the bottleneck instead of a saving?"
        choices: ["When the mesh is very high-poly or has no LODs, because vertex work is the same whether the mesh covers 4 pixels or the whole screen", "When the texture is compressed, because compressed textures have to be decoded once for each vertex of the mesh", "When the material is two-sided, because the vertex shader then runs twice for each vertex, once per face side", "When there are more than two Customized UVs, because each extra channel doubles the cost of the vertex shader on every platform and device"]
        answer_index: 0
        explain: "Vertex shader cost does not shrink with distance. A high-poly mesh without LODs can make vertex work the bottleneck."
      - q: "On mobile, what problem do Customized UVs avoid for a tiling texture?"
        choices: ["Texture streaming pops, which happen when the mip level of a tiling texture changes as the camera moves closer", "Dependent texture fetches, which take a slow path when texture coordinates are manipulated in the pixel shader", "Vertex color loss, which happens when a tiling texture overwrites the color channel", "Lightmap bleeding, which happens when a tiling texture shares UVs with the lightmap"]
        answer_index: 1
        explain: "On mobile, any texture sample whose coordinates are manipulated takes a slow dependent-fetch path. Customized UVs keep the fetches independent."
      - q: "Your mobile texture looks blocky when UV math is done per pixel. Why do Customized UVs fix this?"
        choices: ["They use a larger texture on mobile, because Customized UVs load one more mip level than normal UVs", "They disable mipmaps on mobile, so that the top mip is used at any distance", "They add anti-aliasing to the texture, which hides the blocks at the edges", "Pixel shader math on mobile uses half precision, while Customized UVs are computed in full precision"]
        answer_index: 3
        explain: "Everything in the mobile pixel shader is half precision, which causes blocky textures. Customized UV inputs run at full precision."
    flavors:
      _default: {why: "Knowing which shader stage runs your math is the difference between cheap and slow."}
      tech_art: {why: "This is the first optimization you apply to any master material.", do: "Add a comment box in the graph listing which UV operations are linear and safe to move."}

  - id: TAQ74
