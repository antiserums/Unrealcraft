    required: false
    title: Drive values with dynamic inputs and curves
    brief: "In Niagara, most values in a module do not have to be one fixed number. A dynamic input is a small function that you put in the place of a value, for example a random number in a range. A curve changes a value over the life of a particle. With these two tools you can get many different looks from the standard modules, without building a module of your own. In this quest you add several dynamic inputs and curves to a fountain of embers."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/editor-ui-reference-for-niagara-effects-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-create-a-sparks-effect-in-niagara-for-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-niagara-effects-for-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Create a Niagara System named FXS_TA_Embers from the Fountain template and drag it into a level."
      - "In Particle Spawn, open Initialize Particle. Enable Sprite Rotation and set the mode to Direct Angle (Degrees). Then click the dropdown arrow next to the value, choose Dynamic Inputs, then Random Range Float, and set the range from -10 to 30."
      - "In Add Velocity, click the dropdown arrow next to the value and choose Dynamic Inputs, then Random Range Vector. Give it a small range for X and Y and a larger range for Z."
      - "In Particle Update, open Scale Color. Turn off Scale RGB, and apply the Smooth Ramp Down template to the Scale Alpha curve so each particle fades out over its life."
      - "Add a Scale Sprite Size module to Particle Update. Set Scale Factor to a curve so that particles grow and then shrink. Then open Window > Curves and edit the same curve in that panel."
      - "Chain two dynamic inputs: on any float value, pick a dynamic input, and then pick another dynamic input on one of its own inputs. Note the result."
      - "Find the Library Only checkbox in the dynamic input list. Uncheck it and see which extra entries appear in the list."
    done_when: "Send a screenshot of the stack with at least three dynamic inputs visible (Random Range Float, Random Range Vector and a curve) and the Curves panel open that shows your Scale Sprite Size curve."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the key difference between a dynamic input and a module, according to the Overview?"
        choices: ["Dynamic inputs run only on GPU emitters, while modules run on CPU and GPU emitters", "Dynamic inputs cannot use graph logic, while modules are built from a graph", "Dynamic inputs are written in Python, while modules are written in a node graph", "Dynamic inputs act on a value type, while modules act on a parameter map"]
        answer_index: 3
        explain: "Modules act on the parameter map. Dynamic inputs act on a single value type and can be dropped onto any value in the stack."
      - q: "Why does Epic suggest chaining dynamic inputs instead of writing a new module for every small change?"
        choices: ["It reduces module bloat and can improve performance", "New modules are not allowed in systems", "Dynamic inputs are always deterministic and cheap", "Modules cannot read Particle parameters"]
