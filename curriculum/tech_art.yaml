      - "In Initialize Particle set the lifetime range to 3 to 7, the color to white (1, 1, 1) and the sprite size to 100 to 200. Set Add Velocity so it pushes sideways and up (X 16 to 32, Y -5 to 5, Z 35 to 50). Set the sphere radius to 20."
