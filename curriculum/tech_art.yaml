    flavors:
      _default: {why: "Fast previewing is how you iterate. Knowing the viewport tools saves many compile waits."}
      tech_art: {why: "Previewing single nodes and parameters is how you debug a graph without recompiling the whole thing.", do: "Time one full compile of a big master material and one parameter change. Note the difference for your team."}
      cinematics: {why: "Preview Scene Settings let you check a material under the lighting of your shot before you set it up."}

  - id: TAQ54
    rank: 1
    difficulty: apprentice
    specializations: [tech_art]
    subjects: [textures, texture-groups, lod-bias, mips, streaming, memory]
    required_spine: false
    required: false
    title: Texture groups and mip bias
    brief: "A texture is stored with mips, which are smaller copies of the image that are used when it is far away. LOD Bias tells Unreal to skip the largest mips, so the texture uses less memory. A Texture Group applies settings like this to all the textures of one kind at once. Together they let you shrink hundreds of textures with one setting, and you do not have to import them again. In this quest you change these settings on one texture and write down what each change does."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/texture-asset-editor-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/texture-format-support-and-settings-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a large texture in the Texture Asset Editor, for example a duplicate of T_Manny_01_D from the folder Characters/Mannequins/Textures, or a 2048 texture of your own. Write down the values of Imported, Max In-Game, Combined LOD Bias, Number of Mips and Method (streamed or not)."
      - "Enable the Mip Level selector in the toolbar and step through the mips. Note how the Displayed size changes."
      - "Set Maximum Texture Size to 1024 and note the new Max In-Game value. Then set it back to 0."
      - "Set LOD Bias to -1 and then to 2. Note Combined LOD Bias and Max In-Game each time."
      - "Change the Texture Group to UI and then to World. Check the Filter and the Number of Mips each time."
      - "Enable Never Stream and check the Method field. Then set Mip Gen Settings to NoMipMaps and see what happens to Number of Mips."
    done_when: "Send a short table with Max In-Game, Combined LOD Bias, Number of Mips and Method for each setting you tried. Also send one screenshot of the Details panel of the Texture Editor."
    xp: 55
    verify_type: writeup
    quiz:
      - q: "What does Max In-Game show?"
        choices: ["The size of the imported source file on disk; never smaller than the texture in-game, but maybe much larger", "The largest size the texture can be in-game; never larger than the import, but maybe smaller due to settings", "The size of the smallest mip that can be streamed in; never larger than 64, but maybe smaller", "The size on disk"]
        answer_index: 1
        explain: "Max In-Game is the maximum size the texture can have in-game. It is never bigger than the imported size but can be smaller because of settings like LOD Bias."
      - q: "Maximum Texture Size is set to 0. What does that mean?"
        choices: ["The texture is not rendered at all in the game", "The texture is 1x1 on every platform in the game", "The maximum size for the format on each platform is used", "The texture is limited to 1024 pixels on every platform"]
        answer_index: 2
        explain: "A Maximum Texture Size of 0 means the maximum size allowed for the format on each platform."
      - q: "The Texture Group has LODBias 1 and the texture's own LOD Bias is -1. What is the final LOD Bias?"
        choices: ["2", "1", "-1", "0"]
        answer_index: 3
        explain: "The texture LOD Bias is added to the group value and can be negative: 1 + (-1) = 0."
      - q: "In what order are LOD Bias and the group's Min/Max LOD Size applied?"
        choices: ["Min/Max first, then the bias is added to the result and can go past the limits", "Bias first, then the result is clamped to the group's MinLODSize and MaxLODSize", "Only the bias is used, and the Min/Max LOD Size of the group is ignored", "Only Min/Max are used, and the LOD Bias of the texture is ignored"]
        answer_index: 1
        explain: "The final LOD Bias is calculated first. Then the chosen mip is checked against the TextureGroup's Min/Max LODSize range and adjusted if needed."
      - q: "A group has MaxLODSize 1024 and you ship 2048 textures in it. What does the page say?"
        choices: ["They render at 2048 anyway, on all platforms", "Package size grows with no rendering quality benefit", "The editor blocks the import of textures over 1024", "They lose their mips when the project is cooked"]
        answer_index: 1
        explain: "Textures above the group's MaxLODSize never render larger than that size, so shipping them only increases package size with no quality gain."
      - q: "NumStreamedMips for a group is set to 0. What happens?"
        choices: ["No mips stream; textures in that group are always fully loaded", "All mips stream", "The textures have no mips, so each one is drawn at its top resolution only", "Only the top mip loads, and the lower mips are never used at all"]
        answer_index: 0
        explain: "NumStreamedMips 0 means no mips are streamed and the textures are always fully loaded. The default -1 lets all mips stream."
    flavors:
      _default: {why: "Groups and bias let you shrink hundreds of textures with one setting instead of reimporting."}
      tech_art: {why: "Texture groups in DefaultDeviceProfiles.ini are the lever you pull for a whole platform.", do: "Find TextureLODGroups in your project's DefaultDeviceProfiles.ini and note the MaxLODSize for the World group."}
      lookdev: {why: "If your texture looks blurry in-game, LOD Bias or the group's MaxLODSize is usually why."}

  - id: TAQ55
    rank: 1
    difficulty: apprentice
    specializations: [tech_art]
    subjects: [niagara, vfx, sprites]
    required_spine: false
    required: false
    title: "Sparks"
    brief: "A good spark effect is not one emitter but several that work together. An emitter is the part of a Niagara system that creates one kind of particle. Here you combine three: soft smoke, a bright flash at the center, and fast sparks that fly out, fall and bounce. In this quest you build a system with these three emitters. Epic's tutorial page uses materials from the Starter Content, which current engine versions no longer include, so you use the default sprite material of Niagara."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-create-a-sparks-effect-in-niagara-for-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-create-a-smoke-effect-using-sprite-particles-in-niagara-for-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Start with the smoke: right-click in the Content Browser, choose FX, then Niagara System, pick New system from selected emitters and add the Simple Sprite Burst template. Name the system SparksSystem, rename the emitter to FX_Sparks_Smoke, and drag the system into a level. If you already have a smoke emitter asset of your own, you can add that emitter to the system instead. Keep the default sprite material, which is a soft round dot."
      - "In FX_Sparks_Smoke, find Emitter State and set Life Cycle Mode to System. Delete Spawn Burst Instantaneous and add a Spawn Rate module with the value 20. In Initialize Particle, make the lifetime random from 2 to 3, make the color dark gray (0.3), and set the sprite size to a random value from 75 to 200. Add an Add Velocity module that points mostly upward, with Z from 25 to 35, and a Shape Location module with a sphere of radius 5."
      - "In the Particle Update group of the smoke emitter, open Scale Color. Turn off Scale RGB, and give Scale Alpha the Smooth Ramp Down shape so the smoke fades out. Add an Acceleration Force module and set it to Z 20."
      - "Add a second emitter from the Simple Sprite Burst template and name it FX_SparkBurst. Delete Sprite Burst Instantaneous, set Life Cycle Mode to System, add a Spawn Rate of 50, set Lifetime to 0.2, and set the RGB of Scale Color to 2, 6, 25. This is the bright flash at the center."
      - "Add a third Simple Sprite Burst emitter and name it FX_Sparks_Radial. In its Sprite Renderer, set Alignment to Velocity Aligned, so each spark points the way it moves. Use a Spawn Rate of 500, a random lifetime from 0.2 to 0.7, a small sprite size, and Add Velocity with a random range where Z goes from 300 to 500."
      - "In the Particle Update group of FX_Sparks_Radial, add Gravity Force with Z -4500, Drag with 1.7, and Collision with Restitution 0.4 and Friction 0.2. Remove Scale Color, and add Scale Sprite Size by Speed with a Velocity Threshold of 2000."
      - "Look at the effect in the level and adjust one value that you do not like, for example the gravity or the spawn rate of the radial emitter."
    done_when: "Send one screenshot of the Niagara System Overview that shows all three emitters (FX_Sparks_Smoke, FX_SparkBurst and FX_Sparks_Radial). Also send one screenshot of the effect in the level with sparks bouncing on the floor."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Why does the tutorial start the smoke part of the sparks effect from a copy of FX_Smoke instead of a template?"
        choices: ["Templates cannot be used twice in one project, so the second effect has to start from an existing emitter", "Systems and emitters are independent, so you can build a system from an emitter you already made", "A copy runs on the GPU and a template does not, so the sparks effect is cheaper when it starts from a copy", "Only copied emitters can use the M_smoke_subUV material; a template would reset its Sub Image Size"]
        answer_index: 1
        explain: "Emitters and systems are separate assets. Epic recommends building systems from existing emitters or templates, so a copy of FX_Smoke is a quick start."
      - q: "The radial sparks should look like thin lines that follow their direction of movement. Which renderer setting does the tutorial change for this?"
        choices: ["Sub Image Size to 8 by 8 images", "Sort Mode to View Depth", "Alignment to Velocity Aligned", "Material to M_Spark"]
        answer_index: 2
        explain: "In the Sprite Renderer of FX_Sparks_Radial the Alignment is set to Velocity Aligned, so the sprites line up with the particle velocity."
      - q: "Which two modules make the radial sparks fall fast and slow down in the air?"
        choices: ["Acceleration Force and Curl Noise Force", "Gravity Force (Z -4500) and Drag (1.7)", "Point Attraction Force and Vortex Force", "Scale Velocity and Kill Particles"]
        answer_index: 1
        explain: "The tutorial adds Gravity Force with Z set to -4500 and a Drag module set to 1.7 in Particle Update of the radial emitter."
      - q: "Sparks that hit the floor should bounce back. Which module and setting control how strong the bounce is?"
        choices: ["Collision module, Restitution value", "Solve Forces and Velocity, Bounce value", "Shape Location, Sphere Radius", "Emitter State, Loop Behavior"]
        answer_index: 0
        explain: "The Collision module handles hits with the world. Under Bounce, Restitution (0.4 in the tutorial) sets how much energy the bounce keeps."
      - q: "The Simple Sprite Burst template has Life Cycle Mode set to Self. Why does the tutorial change it to System?"
        choices: ["Self mode only works for mesh particles, and this effect uses sprites, not meshes", "The system then calculates the life cycle, which usually optimizes performance", "Self mode disables the Spawn Rate module of the emitter", "System mode is required for Velocity Aligned sprites, which this effect uses"]
        answer_index: 1
        explain: "System mode lets the system calculate life cycle settings, which usually optimizes performance. By default the system loops forever every 5 seconds."
      - q: "The fast radial sparks should stretch when they move fast. Which module does the tutorial add for this after removing Scale Color?"
        choices: ["Scale Sprite Size by Speed", "Sprite Rotation Rate", "SubUV Animation", "Scale Mesh Size by Speed"]
        answer_index: 0
        explain: "Scale Sprite Size by Speed scales the sprite by particle speed. The tutorial sets a Y range of 3 to 6 and a Velocity Threshold of 2000."
    flavors:
      _default: {why: "A real spark effect is three emitters working together, not one."}
      tech_art: {why: "This is the standard way to layer emitters into one system, which you will do in every production effect.", do: "Turn the spark color into a User Parameter so a designer can change it from the level."}

  - id: TAQ56
    rank: 1
    difficulty: apprentice
    specializations: [tech_art]
    subjects: [niagara, vfx, sprites]
    required_spine: false
    required: false
    title: "Sprite smoke"
    brief: "A sprite is a flat 2D image that always turns to face the camera, and it is the most common kind of particle. A sprite sheet is one texture that holds many small images in a grid, and playing them one after the other makes the particle look animated. Niagara is the visual effects system of Unreal, and an emitter is the part of a Niagara System that creates particles. In this quest you build a steady column of smoke from sprites. Epic's tutorial page uses a smoke sprite sheet from the Starter Content, which current engine versions no longer include, so you make a simple smoke material yourself."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-create-a-smoke-effect-using-sprite-particles-in-niagara-for-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/tutorials-for-niagara-effects-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Make a folder for the effect, for example NiagaraFX/SpriteEffect. In it, create a material named M_SmokeSoft. Set its Blend Mode to Translucent and its Shading Model to Unlit. Add a Particle Color node and a RadialGradientExponential node. Connect the color of Particle Color to Emissive Color, and multiply the gradient by the alpha of Particle Color and connect the result to Opacity. This gives a soft round puff that the emitter can tint and fade."
      - "Right-click in the Content Browser and choose FX, then Niagara System. Pick New system from selected emitters and add the Simple Sprite Burst template. Name the system SmokeSystem and rename the emitter to FX_Smoke."
      - "In the Sprite Renderer, set the material to M_SmokeSoft. Then drag SmokeSystem into a level. If you have a smoke sprite sheet of your own, with for example 8 by 8 images, use a material with that texture instead, set Sub Image Size to 8 by 8 so that the renderer knows how many images are in the sheet, and turn on Sub UV Blending."
      - "In Emitter Update, delete Spawn Burst Instantaneous, add a Spawn Rate module and set it to 50, so the smoke comes out all the time and not in one burst. In Emitter State, set Life Cycle Mode to Self and Loop Behavior to Infinite."
      - "In Initialize Particle, set a random lifetime (2 to 3), a gray color, a random uniform sprite size (75 to 200) and a random sprite rotation (Direct Normalized Angle, 0.25 to 0.5). Add an Add Velocity module with a random range (Z 50 to 200). Add a Shape Location module that uses a sphere with a radius of 64."
      - "In Particle Update, add an Acceleration Force module with Z set to 500 so the smoke keeps rising, and keep Scale Color so that the smoke fades out. If you use a sprite sheet, also add a SubUV Animation module, which plays the images of the sheet one after the other: set its mode to Linear, Start Frame to 0 and End Frame to 63 for a sheet of 8 by 8 images."
      - "Click the Gear icon on the emitter and choose Create Asset From This, so that FX_Smoke becomes its own emitter asset that you can use again. Save everything."
    done_when: "Send a screenshot of the Niagara Editor with the FX_Smoke stack open, where Spawn Rate and Acceleration Force are visible, and a screenshot of the smoke column in the level. Also show the FX_Smoke emitter asset in the Content Browser."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "What is a sprite in Niagara?"
        choices: ["A 2D plane that always faces the camera and shows a texture or material", "A small static mesh that is placed at the position of each particle", "A light that follows a particle and lights the surfaces that are near it", "A sound attached to a particle"]
        answer_index: 0
        explain: "Sprites are 2D camera-facing planes. The renderer draws a texture or material on them."
      - q: "Why does the tutorial set Sub Image Size to X 8, Y 8 in the Sprite Renderer?"
        choices: ["It makes each sprite 8 times bigger on both axes, which the smoke needs to fill the whole screen from a distance", "The smoke material of the tutorial is a sprite sheet, so the renderer must know how many images are in the grid", "It limits the emitter to 8 particles", "It sets the number of LODs of the sprite sheet, so that far smoke uses the smaller images of the grid and costs less"]
        answer_index: 1
        explain: "A sprite sheet holds many images in a grid. Sub Image Size tells the Sprite Renderer how many images there are in each direction, here 8 by 8."
      - q: "The tutorial deletes Spawn Burst Instantaneous and adds Spawn Rate. What is the reason?"
        choices: ["Spawn Burst only works on the GPU", "Spawn Rate is needed for SubUV materials", "The goal is a constant column of smoke, not one burst", "Spawn Burst cannot be used together with Shape Location"]
        answer_index: 2
        explain: "A burst spawns everything at once. Spawn Rate (50 per second here) gives a steady column of smoke."
      - q: "Without the SubUV Animation module, what happens to the smoke sprite sheet?"
        choices: ["The particles are invisible until it is added", "All 64 images of the sheet show on it at the same time", "The material turns black on all particles", "The renderer only shows the first image of the sheet"]
        answer_index: 3
        explain: "If nothing plays the sheet, the renderer uses only the first sprite. SubUV Animation with Linear mode from frame 0 to 63 plays all 64 images."
      - q: "Which module makes the smoke rise over time, and in which group is it?"
        choices: ["Add Velocity in Cone in Particle Spawn", "Acceleration Force in Particle Update", "Spawn Rate in Emitter Update", "Shape Location in Particle Spawn"]
        answer_index: 1
        explain: "Add Velocity only gives a start push. Acceleration Force (Z 500) in Particle Update keeps pushing the smoke up every frame."
      - q: "How do you save the FX_Smoke emitter so other systems can reuse it?"
        choices: ["Right-click the system in the Content Browser and choose Asset Actions, then Export", "Drag the emitter into the level and save the level", "Click the Gear icon on the emitter and choose Create Asset From This", "Save the level, which also stores every emitter in it as an asset"]
        answer_index: 2
        explain: "The Emitter Settings menu (Gear icon) has Create Asset From This, which makes an independent Niagara Emitter asset."
    flavors:
      _default: {why: "Sprites with a sprite sheet are the most common particle type you will see."}
      tech_art: {why: "Sub UV setup and the spawn group vs update group split are the base of almost every Niagara effect.", do: "Make your own 4 by 4 sprite sheet material and swap it in, updating Sub Image Size and End Frame to match."}

  - id: TAQ57
