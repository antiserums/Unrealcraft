    title: One parent emitter, three children
    brief: "In Niagara, an emitter inside a system can be a child of an emitter asset, which is then called the parent. The child takes all its settings from the parent, and you can change, or override, single values in the child. When you later change the parent, every child gets the change, but keeps its own overrides. This keeps many effects in a project consistent and easy to update. In this quest you make one parent emitter for hit effects and use it three times in one system."
