    difficulty: apprentice
    specializations: [tech_art]
    subjects: [foliage, instancing, static-mesh]
    required_spine: false
    required: false
    title: Instanced foliage from any mesh
    brief: "Foliage Mode is a tool for painting many copies of a mesh onto the ground with a brush. It is made for grass and trees, but it works with any Static Mesh, such as rocks. The copies are drawn as instances, which is much cheaper than placing each one as its own actor. In this quest you paint rocks, erase some, and set the distance at which they stop being drawn."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/foliage-mode-in-unreal-engine"
    backup_url: null
    community_urls:
      - {title: "Unreal 5 Foliage Mode Explained in 2 minutes (Royal Skies)", url: "https://www.youtube.com/watch?v=lFXOnCea728"}
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a level that has a Landscape or a large floor mesh. Switch to Foliage Mode with Shift+3."
      - "Pick a small mesh that stands in for a rock, for example SM_ChamferCube from the folder LevelPrototyping/Meshes, or a rock mesh of your own. Drag it into the Mesh List of the Foliage panel. Select it, and in the Painting section set Density to 100 and Radius to 50."
      - "Under Placement, set Scale X Min to 0.3 and Max to 1.2, and turn on Align to Normal so the rocks follow the slope of the surface. Set Brush Size to 512 and paint a patch of rocks."
      - "Hold Shift and paint to erase part of the patch. Then try the Single tool and the Fill tool once each."
      - "Set End Cull Distance to 3000 and move the camera away until the rocks disappear. Then set Start Cull Distance to 2000, and note what the material would need so that the rocks fade out."
      - "Open the Outliner and find the actor that holds your foliage instances. Note its component type. If you like, run stat unit and compare the Draw time with 200 rocks that are placed as separate actors."
    done_when: "Send a screenshot of the painted rocks with the Foliage panel open, so that your Density, Radius and Scale settings are visible. Add one line that names the actor and the component that hold the instances."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Why is Static Mesh Foliage cheaper to render than Actor Foliage?"
        choices: ["It uses smaller textures", "Its instances are grouped into batches drawn with hardware instancing, many in a single draw call; Actor Foliage costs the same as normal actors", "It has no collision and casts no shadows, so each instance costs almost nothing to draw; Actor Foliage always has collision and shadows turned on", "It is always Nanite, and Nanite meshes are drawn with no draw calls at all; Actor Foliage cannot use Nanite and is drawn one mesh at a time"]
        answer_index: 1
        explain: "Static meshes placed with Foliage Mode are batched and rendered with hardware instancing, so many instances share a draw call. Actor Foliage is as costly as placing normal actors."
      - q: "How do you erase foliage while using the Paint tool?"
        choices: ["Right-click", "Hold Ctrl and paint", "Hold Shift and paint", "Hold Alt and paint"]
        answer_index: 2
        explain: "The Paint tool erases instances of the selected type when you hold Shift while painting. Erase Density controls how much is left behind."
      - q: "The Paint Density value in Brush Options is a multiplier of what?"
        choices: ["The Brush Size", "The landscape resolution, in vertices for each of the components", "The number of foliage types that are checked in the palette", "The Density property in the selected foliage type's details"]
        answer_index: 3
        explain: "Paint Density multiplies the Density set in the foliage type's details. Both together decide how many instances you get."
      - q: "You set an End Cull Distance. What happens at that distance?"
        choices: ["Instances fade out one by one, starting with the ones furthest from the camera", "The whole cluster of instances is culled, so groups of meshes disappear at once", "Only shadows are removed, and the meshes stay visible at any distance", "The foliage switches to LOD1 and keeps that LOD until it is close again"]
        answer_index: 1
        explain: "Foliage renders as clusters, and each cluster is culled beyond End Cull Distance. That makes groups pop out. Start Cull Distance plus a PerInstanceFadeAmount node in the material can fade them."
      - q: "Which filter checkbox lets you paint foliage onto Static Mesh surfaces?"
        choices: ["Static Mesh", "Landscape", "BSP", "Translucent"]
        answer_index: 0
        explain: "The Filters section has Landscape, Static Mesh, BSP, Foliage and Translucent. Static Mesh must be on to paint on mesh surfaces."
      - q: "Which statement about LODs on foliage is true?"
        choices: ["Foliage does not support LODs", "Each instance switches LOD by its own distance to the camera", "The entire cluster of instances changes LOD at the same time", "LODs only work with Nanite foliage, which picks a LOD for each cluster"]
        answer_index: 2
        explain: "Static Mesh LOD is supported, but currently the whole cluster of instances changes LODs together."
    flavors:
      _default: {why: "Foliage Mode places thousands of meshes fast and renders them as cheap instances."}
      tech_art: {why: "Instancing is the core of cheap large scenes. Foliage Mode is the easiest way to see it work.", do: "Turn on Enable Density Scaling for your rock type and run foliage.DensityScale 0.5 to watch half of the instances disappear."}
      level_design: {why: "Rocks, debris and clutter are faster to paint than to place by hand."}
      lookdev: {why: "Culling and fading of foliage need material support. Know the PerInstanceFadeAmount node."}

  - id: TAQ47
