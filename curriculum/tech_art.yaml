    required: false
    title: Resolution that bends with the GPU
    brief: "Screen percentage is the resolution at which the 3D scene is drawn, compared to the resolution of the screen. Dynamic resolution lowers this value by itself when the GPU is too slow, and raises it again when there is time left. Temporal upsampling then uses data from earlier frames to scale the image up to the full screen size, so it still looks sharp. Games use both to keep a steady frame rate on weak hardware. In this quest you turn both on and look at their effect."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/dynamic-resolution-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/screen-percentage-with-temporal-upscale-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open a heavy level, or make the level of the template heavy by adding many lights and meshes. Run the console commands stat unit and stat unitgraph. Confirm that the DynRes line says that dynamic resolution is off."
      - "In a Blueprint (for example in the Level Blueprint on BeginPlay), call Get Game User Settings and then Set Dynamic Resolution Enabled with the value true."
      - "In the console, set r.DynamicRes.OperationMode 1 and r.DynamicRes.FrameTimeBudget 16.6, and then play. Read the primary and secondary screen percentages on the DynRes line."
      - "Run stat raw. Watch the curve of the primary screen percentage drop during a camera cut or a big effect."
      - "Stop playing. Move the Screen Percentage slider of the editor viewport to 50, and look closely at a thin object such as a fence or a grill."
      - "Compare the same object at 50 percent with and without a temporal upscaler. In UE5 the default anti-aliasing method, Temporal Super Resolution (TSR), is the temporal upscaler. Type r.AntiAliasingMethod 1 in the console to switch to FXAA, which has no temporal upscaling, and take a screenshot. Then type r.AntiAliasingMethod 4 to go back to TSR and take a second one. The older command r.TemporalAA.Upsampling only applies to the TAA method."
      - "Run profileGPU once at 100 percent and once at 50 percent. Note which passes get cheaper."
    done_when: "Send a screenshot of stat unitgraph that shows the DynRes line with a changing primary screen percentage, plus two viewport screenshots of a thin object at 50 percent, one with the temporal upscaler (TSR) and one without it (FXAA)."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What does Dynamic Resolution adjust, and based on what?"
        choices: ["The primary screen percentage, based on the previous frames' GPU workload", "The secondary screen percentage, based on the CPU time of the last frames", "The texture mip bias, based on the VRAM that the texture pool has left", "The window resolution, based on the refresh rate of the monitor in use"]
        answer_index: 0
        explain: "Dynamic Resolution changes the primary screen percentage according to the GPU workload of previous frames, to hold the target frame rate."
      - q: "What are the default values of r.DynamicRes.MinScreenPercentage, MaxScreenPercentage and FrameTimeBudget?"
        choices: ["25, 100, 16.6", "50, 200, 16.6", "70, 100, 33.3", "50, 100, 33.3"]
        answer_index: 3
        explain: "The page lists defaults of 50 for the minimum, 100 for the maximum and 33.3 ms for the frame time budget."
      - q: "Why does the DynRes line in stat unit show the screen percentage for both X and Y?"
        choices: ["Because the two axes can use different values, and the engine always scales the wider axis first", "To remind you that pixels drawn are proportional to screen percentage times screen percentage", "Because the secondary upscale is anisotropic and applies a different scale to each of the axes", "Because VR renders two eyes, and each of the two values belongs to one of the eye views"]
        answer_index: 1
        explain: "The number of pixels the GPU draws is proportional to Screen Percentage x Screen Percentage, so the page shows both axes as a reminder."
      - q: "r.DynamicRes.OperationMode is set to 2. What does that mean?"
        choices: ["Dynamic resolution is disabled, whatever the settings say", "It follows the boolean that is stored in the Game User Settings", "Dynamic resolution is enabled regardless of Game User Settings", "It is paused until the next level has finished loading"]
        answer_index: 2
        explain: "Mode 0 disables it, mode 1 follows the GameUserSettings state, and mode 2 enables it regardless of that state."
      - q: "What is the panic switch in the dynamic resolution heuristic?"
