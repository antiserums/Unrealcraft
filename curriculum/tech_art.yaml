    verify_type: screenshot
    quiz:
      - q: "A Material uses a Texture. Which way does the reference go?"
        choices: ["The Texture references the Material", "The Material references the Texture, and the Texture has no reference back", "Both reference each other, so loading one of the two always loads the other one as well", "Neither, because only Actors in a level can reference assets in the project"]
        answer_index: 1
        explain: "References are one-way. The Material depends on the Texture. The referenced asset has no reference back to its referrer."
      - q: "You select three assets and open the Reference Viewer. What does the graph show?"
        choices: ["Three separate graphs side by side", "Only the references the three assets have in common", "The references of the first asset only", "An error, because the tool takes one asset at a time"]
        answer_index: 1
        explain: "With multiple assets selected, the Reference Viewer shows only the references your selected assets have in common."
      - q: "In the graph, an arrow points from asset A to asset B. What does it mean?"
        choices: ["A references B", "B references A", "A and B are in the same folder", "B is a newer version of A"]
        answer_index: 0
