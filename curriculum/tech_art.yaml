    quiz:
      - q: "Your tool spawns temporary preview actors while it runs. Why is a Scriptable Tool safer than an Editor Utility Widget for this?"
        choices: ["Scriptable Tools cannot spawn actors", "A Scriptable Tool is modal: it shuts down before save, level change or PIE, so you can remove temporary actors before they are saved", "Editor Utility Widgets delete all actors on close", "Scriptable Tools run only at runtime"]
        answer_index: 1
        explain: "Interactive tools are modal and the editor state is strictly managed. Autosave waits until you exit the tool."
      - q: "Which plugin do you enable to use the Scriptable Tools mode and nodes?"
        choices: ["Scriptable Tools Framework only", "Modeling Tools Editor Mode", "Editor Scripting Utilities", "Scriptable Tools Editor Mode; it includes the framework"]
        answer_index: 3
        explain: "You enable Scriptable Tools Editor Mode. You do not need to enable the framework module separately."
      - q: "Your tool must react to left click, right click and Ctrl + left click in different ways. Which base class fits best?"
        choices: ["EditorScriptableModularBehaviorTool", "EditorScriptableClickDragTool", "A plain Actor Blueprint", "EditorUtilityWidget"]
        answer_index: 0
        explain: "The modular behavior tool lets you add many behaviors, even several click behaviors, in one tool. ClickDragTool is deprecated."
      - q: "You made the tool from a normal Blueprint Class, and now you cannot reach editor subsystems. Why?"
        choices: ["The plugin is off", "Editor subsystems need C++", "Only an Editor Utility Blueprint gives access to editor-only functionality, even for an editor tool class", "You need to compile twice"]
        answer_index: 2
        explain: "The tutorial warns that a Blueprint Class cannot access editor subsystems and other editor-only features."
      - q: "How do you give your tool user-visible settings like Mesh and MaxScale?"
        choices: ["Add them as variables on a UMG widget", "Create a ScriptableInteractiveToolPropertySet subclass with public variables and add it with Add Property Set of Type", "Put them in Project Settings", "Use a Data Table"]
        answer_index: 1
        explain: "Public variables of the property set show in the standard settings panel. Add it, usually in On Script Setup, with a unique Identifier."
      - q: "You want an event when the user changes MaxScale, a float. Which approach do the docs suggest?"
        choices: ["The type-matching property watcher for a float, with the exact variable name", "The general Watch Property function, because it is cheapest", "An Event Dispatcher on the property set", "Nothing; tools cannot react to changes"]
        answer_index: 0
        explain: "Use the watcher that matches the variable type. The general Watch Property is more expensive and gives no New Value."
      - q: "You add a Custom startup condition that searches the whole level. Why is that risky?"
        choices: ["Custom conditions only run once", "Custom conditions cannot read the selection", "It stops the tool from appearing in the palette", "The tool builder graph runs every tick, so heavy checks can slow the editor"]
        answer_index: 3
        explain: "OnCanBuildTool runs on tick. Keep custom conditions light."
      - q: "Artists complain that the tool forgets their settings every time they reopen it. What fixes this?"
        choices: ["Store settings in a Save Game object", "Call Save Property Set Settings on shutdown and Restore Property Set Settings on setup", "Set Visible in Editor to false", "Use Group Tags"]
        answer_index: 1
        explain: "These functions store and restore property set values. An optional Save Key keeps separate values per tool."
      - q: "You draw guide lines with Event On Script Render. The lines flicker and you must redraw them all yourself. What is the better option?"
        choices: ["Use Print String", "Spawn a new actor per line every tick", "Use the Drawing API line sets, which the tool keeps and you can update over the tool's lifetime", "Move the drawing into On Script Shutdown"]
        answer_index: 2
        explain: "On Script Render is legacy: it redraws every tick with no persistence. Line, point and triangle sets are kept by the tool."
      - q: "You have a base tool Blueprint that only exists to be subclassed. How do you keep it out of the tool palette?"
        choices: ["Turn off Visible in Editor", "Delete its Category", "Set Shutdown Type to Complete", "Give it no Tool Name"]
        answer_index: 0
        explain: "Visible in Editor hides the class from the mode UI. It is meant for in-development tools and base classes."
    flavors:
      _default: {why: "Some jobs need clicks in the viewport, not buttons in a window. Scriptable Tools give artists that kind of tool without C++."}
      tech_art: {why: "Interactive tools save artists hours of repeated placing and fixing. You can build them in Blueprint.", do: "Add a gizmo or a line preview so the artist sees the result before they click."}
      level_design: {why: "A click-to-place tool made for your level's rules speeds up dressing a lot."}
      programming: {why: "This is the Interactive Tools Framework from Modeling Mode, exposed to Blueprint. Know its modal rules."}

