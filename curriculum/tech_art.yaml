  - id: TAQ106
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [pso, shaders, hitches, profiling]
    required_spine: false
    required: false
    title: Stop the first-time shader hitch
    brief: "Before the GPU can draw something with a certain material for the first time, the engine must prepare a Pipeline State Object, or PSO. Creating a PSO in the middle of the game can take long enough to cause a short freeze, which players call a hitch. PSO precaching prepares these objects early, in the background, so the hitch does not happen. In this quest you read how the system works, turn on its statistics, and check how many PSOs were ready in time in your own project."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/pso-precaching-for-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/optimizing-rendering-with-pso-caches-in-unreal-engine"
    checklist:
      - "Use any project, or create one from the Third Person template. Read the PSO Precaching page that is linked on this quest, and the PSO Caches overview page that it links to. Write two lines: what a PSO is, and how precaching is different from a bundled cache."
      - "Set r.PSOPrecache.Validation=1 in the file DefaultEngine.ini, or set it in the console at startup. This turns on the statistics."
      - "Package or launch a Development build of the project with -clearPSODriverCache on the command line. This clears the cache of the graphics driver, so you see what a first-time player sees."
      - "Play a level that has many different materials. Run stat PSOPrecache and take a screenshot of the numbers for Missed, Too late, Hit and Precached."
      - "Set r.PSOPrecache.ProxyCreationDelayStrategy 1 and play the same level again. Note where you see the default (grey) material for a moment."
      - "Write down what your loading screen should wait for before it hides."
    done_when: "Send a screenshot of stat PSOPrecache from a build that was launched with -clearPSODriverCache, plus your notes on the delay strategy and on the rule for the loading screen."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Per the PSO Caches overview, why must PSOs be created long before they are used?"
        choices: ["Because each one uses 2 GB of memory and must be loaded piece by piece", "Because generating a new PSO on demand can take 100 or more milliseconds", "Because Direct3D 11 does not support them and needs a fallback path", "Because they are stored in the Derived Data Cache and must be downloaded"]
        answer_index: 1
        explain: "Generating a PSO on demand can take 100 ms or more, which is a visible hitch, so the engine tries to create them early."
      - q: "How does PSO precaching differ from a bundled PSO cache?"
        choices: ["Precaching needs you to play a build and record what is drawn; a bundled cache is collected automatically at load time", "They are the same thing with two names; precaching is the newer name that the documentation uses for a bundled cache", "Precaching collects and compiles PSOs automatically and asynchronously; a bundled cache is collected by playing a build", "Precaching only works on mobile and compiles PSOs at install time; a bundled cache only works on PC and consoles"]
        answer_index: 2
        explain: "Manual (bundled) caching requires playing a build to collect PSOs; precaching collects and compiles all possible PSOs automatically in the background."
      - q: "A component's PSOs are still compiling when its proxy is created. With the default settings, what happens?"
        choices: ["The draw blocks until compilation finishes", "The component uses the default material", "The component is deleted", "The draw is skipped until the PSO is ready"]
        answer_index: 3
        explain: "r.PSOPrecache.ProxyCreationDelayStrategy defaults to 0, which skips the draw until the PSO is ready. Value 1 uses the default material instead."
      - q: "What must be enabled before stat PSOPrecache shows useful numbers?"
        choices: ["r.PSOPrecache.Validation set to 1 or 2", "r.PSOPrecache.GlobalShaders set to 1", "Shipping build configuration", "The RenderDoc plugin"]
        answer_index: 0
        explain: "Stats are collected only when validation is active. Value 1 is lightweight tracking usable in shipped titles; 2 adds detailed logging on misses."
      - q: "In the stat PSOPrecache output, what does Too late mean?"
        choices: ["The PSO was never requested by the precaching system, so no compile was started at all", "The PSO was compiled twice, once by precaching and once more when it was first used", "The PSO was queued for precaching but was not compiled in time for when it was needed", "The driver cache was cleared after the PSO had been compiled, so it must compile again"]
        answer_index: 2
        explain: "Too late counts PSOs that were queued for precaching but were still compiling when the draw needed them."
      - q: "Why does the page recommend the -clearPSODriverCache argument for every smoothness test?"
        choices: ["It makes the game start faster, so each test run takes less time", "Without it, the driver cache from earlier runs can hide hitches", "It enables stat PSOPrecache, which is hidden in normal runs", "It reduces memory use, so hitches from paging do not show up"]
        answer_index: 1
        explain: "The graphics driver keeps its own PSO cache between runs, which can mask hitches. Clearing it reproduces the first-time startup experience."
      - q: "By default, how long must a runtime PSO compile take before it counts as a hitch?"
        choices: ["20 ms", "2 ms", "100 ms", "One full frame"]
        answer_index: 0
        explain: "The default threshold is 20 milliseconds, set by r.PSO.RuntimeCreationHitchThreshold. The page says to keep it as small as possible."
      - q: "What should the initial loading screen wait for, according to the page?"
        choices: ["All textures to reach their full mip level, checked with the Required Pool value of the stat streaming command", "The first frame of the level to render, checked with the frame counter that the stat unit command displays", "Garbage collection to complete, checked with the time since the last purge that the stat gc command shows", "All outstanding PSO precache requests to finish, checked with FShaderPipelineCache::NumPrecompilesRemaining()"]
        answer_index: 3
        explain: "Keep the loading screen up until NumPrecompilesRemaining() reaches zero, or you may see popping and hitches, for example on landscape."
    flavors:
      _default: {why: "First-time shader hitches are one of the most common complaints players notice, and precaching is the tool that removes them."}
      tech_art: {why: "Every new material permutation you add is a PSO someone must compile; tech artists own that cost.", do: "Use Unreal Insights and add the PSOPrecache: Missed and PSOPrecache: Too Late timers to find your largest PSO hitch."}

  - id: TAQ107
