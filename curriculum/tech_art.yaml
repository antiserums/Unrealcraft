    required: false
    title: Nanite by the numbers
    brief: "Nanite is the system in Unreal Engine 5 that draws very detailed meshes and picks the right amount of detail by itself, so you do not have to make LODs by hand. It is not free, though. Overdraw (drawing the same pixel more than once), streaming (loading mesh data when it is needed) and disk size still cost time and memory. In this quest you use the Nanite view modes and the NaniteStats command to see these costs in a level."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/nanite-technical-details"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/nanite-virtualized-geometry-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/nanite-virtualized-geometry-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a level that has many Nanite meshes. If you have none, place 10 or more meshes in the level of the template, select them in the Content Browser, right-click them, and choose Nanite, then Enable."
      - "In the View Modes menu of the viewport, open Nanite Visualization. Look at the modes Overview, Mask, Triangles, Clusters and Overdraw."
      - "Stack several small Nanite props close together. Compare their Overdraw with the Overdraw of one large prop."
      - "Run the console command NaniteStats and read the overlay in the top-right corner. Then run NaniteStats List, and then NaniteStats VirtualShadowMaps."
      - "Open Show, then Nanite, and turn off Streaming Geometry. Take a screenshot of the quality that is always kept in memory."
      - "Run r.Nanite 0 and take a screenshot of the same view, which now shows the fallback meshes. Then run r.Nanite 1 to turn Nanite on again."
      - "Pick one heavy mesh and try Keep Triangle Percent 50 on it. Compare the disk size in the tooltip of the asset before and after."
    done_when: "Send three screenshots: the Overdraw visualization, the NaniteStats overlay, and the view with Streaming Geometry off. Also write the disk size of your trimmed mesh before and after."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "In the Nanite Mask visualization, what do green and red mean?"
        choices: ["Green is culled geometry, red is visible geometry", "Green is static geometry, red is movable geometry", "Green is opaque material, red is masked material", "Green is Nanite geometry, red is non-Nanite geometry"]
        answer_index: 3
        explain: "The Mask visualization marks Nanite geometry green and non-Nanite geometry red."
      - q: "Which statement about the Overdraw visualization is correct per the page?"
        choices: ["Masked-out pixels are not counted, and only opaque Nanite meshes in the primary view add to the overdraw", "All evaluated pixels count, including masked-out ones, and small closely stacked objects create more overdraw", "Large objects always create more overdraw than small ones, and masked-out pixels are never counted in the view", "It only shows translucent overdraw, because Nanite meshes are opaque and can never draw over each other"]
        answer_index: 1
        explain: "All evaluated pixels, including masked-out pixels, are added to the overdraw view. Small objects stacked closely create more overdraw than larger ones."
      - q: "What does the NaniteStats command do with no argument?"
        choices: ["Shows culling statistics for the primary view as an overlay in the top-right of the viewport", "Lists all views by name in the Output Log, so that you can pick one of them as the argument", "Prints a memory report for all Nanite meshes of the level to the Output Log and to a file", "Opens the Nanite section of the Project Settings in a new tab next to the Level Viewport"]
        answer_index: 0
        explain: "NaniteStats adds an overlay of Nanite culling statistics in the top-right. With no argument the primary view is used; NaniteStats List shows the other views."
      - q: "Your Nanite streaming pool is too small for the current view. What does the page say happens?"
        choices: ["The engine grows the pool automatically until all pages fit", "Nanite switches every mesh in the view over to its fallback mesh", "Cache thrashing: streaming never settles, even for a static view", "The editor shows a warning and pauses streaming for the level"]
        answer_index: 2
        explain: "If r.Nanite.Streaming.StreamingPoolSize is too small to fit the data for a view, streaming never settles even when the camera is still."
      - q: "What happens when you disable Show > Nanite > Streaming Geometry?"
        choices: ["Nanite meshes disappear from the viewport until streaming has finished", "Nanite meshes render only at the quality that is always resident in memory", "All Nanite meshes use the fallback mesh until the option is turned on again", "Streaming becomes faster, because the highest detail pages are skipped"]
        answer_index: 1
