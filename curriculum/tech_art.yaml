      - "Wire a Texture Object into Tex, a TexCoord into UV, and two Scalar Parameters into r and dist. Set Description to 'Box Blur' so the node title is clear."
      - "Add one extra output with Additional Outputs (for example a luminance value) and use it somewhere in the graph."
