    required_spine: false
    required: false
    title: Convert a legacy material to Substrate
    brief: "Substrate is the newer material system of Unreal Engine 5. The older, legacy system describes a surface with Base Color, Metallic and Roughness. Substrate describes it with a building block called a Slab, which uses inputs such as Diffuse Albedo (the diffuse color) and F0 (how strongly the surface reflects when you look straight at it). Old materials do not have to be built again, because they can be converted. In this quest you convert a legacy copper material, build the same copper by hand in Substrate, and compare the two."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-substrate-materials-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/substrate-materials-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/substrate-materials-in-unreal-engine"
    checklist:
      - "Use a test project with Substrate enabled. To make one, create a project from the Third Person template, turn on Substrate materials in Project Settings under Rendering, and restart the editor. You need an old style material that uses Base Color, Metallic and Roughness. If you have none, make a simple copper material with a Base Color of about 0.95, 0.64, 0.54, Metallic 1 and Roughness 0.3. Duplicate it and name the copy M_TA_LegacyCopper. Right-click its root node and choose Convert to Substrate. Look at the Slab node that appears and at how the old inputs were connected to it."
      - "Build a material named M_TA_SubCopper by hand. Use a Substrate Slab, and set Diffuse Albedo and F0 from the copper values in the F0 table on the page (F0 linear is about 0.95, 0.64, 0.54)."
      - "Make a third material named M_TA_SubHelper and add a Substrate Metalness-To-DiffuseAlbedo-F0 helper node to it. Feed your old Base Color, Specular and Metallic into the node and connect its outputs to the Slab. Compare the result with the version you built by hand."
      - "On M_TA_SubCopper, add a Second Roughness and set Second Roughness Weight to 0.5. Then make a copy, try Fuzz Amount 0.3 on it, and see which of the two looks like fabric."
      - "Set the Sub-Surface Type on a Slab to Diffusion, and then to Simple Volume. Read the tag at the bottom of the Slab node each time."
      - "Open Window > Substrate and read whether any of your materials was simplified. Switch the GBuffer format of the project to the other option, restart, and check again."
      - "Write three lines: which legacy inputs map to which Slab inputs, and which feature disappeared in Blendable GBuffer."
    done_when: "Send screenshots of M_TA_LegacyCopper after the conversion and of M_TA_SubCopper with the Slab inputs visible, plus a screenshot of the Substrate window for one of them. Add your three lines of mapping notes."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "You open an old non-Substrate material in a Substrate project and do nothing else. What happens to the asset?"
        choices: ["It is converted and saved as Substrate at once, and it can no longer be opened in projects that do not use Substrate", "It renders black until converted with the Convert to Substrate option, and a warning is shown in the Stats panel", "It is not altered; it is converted to Substrate at compile time and stays compatible with non-Substrate projects", "It loses its Metallic input, which is replaced by F0 as soon as the editor opens the material"]
        answer_index: 2
        explain: "Existing non-Substrate materials work out of the box and are converted at compile time only. Opening them no longer alters the asset."
      - q: "How do you explicitly convert a material, and can you undo it?"
        choices: ["Right-click the root node and choose Convert to Substrate; the conversion is permanent", "Project Settings > Convert All Materials; undo it with Ctrl+Z in the same session", "Save As with a Substrate suffix in the asset name; delete the copy to undo the conversion", "Add a Slab node to the graph and connect it; remove the node to undo it"]
        answer_index: 0
        explain: "Convert to Substrate on the root node creates a Slab wired to Front Material. The conversion is permanent and cannot be reverted."
      - q: "Substrate has no Metallic input. Which three attributes define reflectance instead?"
        choices: ["Base Color, Specular, Roughness", "Diffuse Albedo, F0 and F90", "Coverage, Transmittance, MFP", "Albedo, Metalness, IOR"]
        answer_index: 1
        explain: "Reflective properties are defined with DiffuseAlbedo, F0 and F90. Energy conservation is enforced, so higher F0 reduces the visible diffuse."
      - q: "What is a typical F0 range (linear) for a dielectric such as plastic?"
        choices: ["0.5 to 1.0", "Exactly 0.0", "About 0.2 to 0.4", "About 0.02 to 0.06"]
        answer_index: 3
        explain: "Dielectrics usually have F0 between 0.02 and 0.06 in linear space; gemstones go up to about 0.18; conductors are beyond 0.5 up to 1."
      - q: "You still have Base Color / Specular / Metallic textures. Which node maps them onto a Slab?"
        choices: ["Substrate Coverage Weight operator", "Substrate Select operator", "Substrate Metalness-To-DiffuseAlbedo-F0 helper", "Substrate Transmittance-To-MeanFreePath helper"]
        answer_index: 2
        explain: "The Metalness-To-DiffuseAlbedo-F0 helper takes BaseColor, Specular and Metallic and converts them to Diffuse Albedo and F0."
      - q: "Which Sub-Surface Type is the only valid one for the upper layers of a vertically layered slab?"
        choices: ["Simple Volume", "Wrap", "Diffusion", "Two-Sided Wrap"]
        answer_index: 0
        explain: "For vertically layered slabs, only the Simple Volume sub-surface type is valid on upper layers. The tag at the bottom of the Slab shows what is actually used."
      - q: "Your project uses the Blendable GBuffer format. Which of these slab features will be visually missing?"
        choices: ["Roughness and Normal", "Emissive Color and Normal", "Anisotropy and Tangent", "F90, Haziness and Glints"]
        answer_index: 3
        explain: "In Blendable GBuffer format, F90, diffusion SSS with per-pixel MFP, Haziness and Glints are not supported and are visually missing."
      - q: "Glint Density does nothing in your material. What is required?"
        choices: ["A Subsurface Profile asset", "Setting Second Roughness Weight to a value of 1", "r.Substrate.Glints=1 in ConsoleVariables.ini", "Enabling Use Parameter Blending"]
        answer_index: 2
        explain: "Glint Density and Glint UVs require r.Substrate.Glints=1 to be set in the ConsoleVariables.ini configuration file."
    flavors:
      _default: {why: "New projects start in Substrate. Old content needs a translation, not a rewrite."}
      tech_art: {why: "You will be the one who migrates the material library.", do: "Write a short migration checklist for artists: what to convert, what to leave, and which GBuffer format the project uses."}

