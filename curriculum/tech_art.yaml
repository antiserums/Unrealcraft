    subjects: [materials, shader-complexity, material-properties, optimization, stats]
    required_spine: false
    required: false
    title: Cheaper pixels, same look
    brief: "Every pixel that a material covers costs some GPU time, and this cost depends on how many instructions and texture samples the material uses. Much of that cost comes from simple settings and habits, not from complex math. The Shader Complexity view mode colors the scene from green (cheap) to red and white (expensive), so you can find the worst material fast. In this quest you find the most expensive material in a scene, make it cheaper without changing how it looks, and measure the result."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-material-properties"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/viewport-modes-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/viewport-modes-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-material-editor-ui"
    checklist:
      - "Open a project made from the Third Person template, or create one. Pick a small scene that has 5 or more different materials: a scene of your own, or the level of the template with a few mannequins and props added. Press Alt+8 (or run viewmode shadercomplexity) and take a screenshot. Find the most expensive material on screen."
      - "Open that material. If it belongs to the template or the engine, duplicate it, assign the copy and work on the copy. Open Window > Stats and Window > Platform Stats, and write down the instruction counts and the number of texture samplers."
      - "With the main node selected, look at the Usage flags in the Details panel. Turn off any Used with flag that this material does not need (for example Used with Mesh Particles). Note that Automatically Set Usage in Editor is on by default."
      - "If the material is matte (its roughness is near 1 everywhere), enable Fully Rough and read the Stats again. Compare the look in the viewport."
      - "Duplicate the material and try one more change: remove a Transform node if you also use VertexColor, or replace a runtime channel multiply with a static mask. Compare the Stats before and after."
      - "Open Window, then Shader Code, then HLSL Code for your platform. Find the line that samples your biggest texture, just to see the code that the editor generates."
      - "Take the Shader Complexity screenshot again. Write three lines: what you changed, how many instructions you saved, and what you refused to change because the look would suffer."
    done_when: "Send two Shader Complexity screenshots (before and after), a screenshot of the Stats panel of the optimized material, and your three lines of notes."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "What does the Fully Rough property do for you?"
        choices: ["Forces the material to be completely rough, which saves material instructions and one sampler", "Disables the normal map, which saves one sampler and a few instructions", "Turns off specular reflections in Lumen only, which saves one reflection ray for each pixel", "Sets roughness to 0.5, which saves the Roughness texture and its sampler"]
        answer_index: 0
        explain: "Fully Rough forces complete roughness and saves a number of instructions and one texture sampler."
      - q: "What happens in-game if a material is missing the usage flag for the mesh type it is applied to?"
        choices: ["It renders unlit, with only its Base Color", "The default world grid material is used instead, with a message in the game log", "The game crashes when the mesh comes into view of the camera for the first time in the level", "The flag is set automatically at runtime, and the shader is compiled on first use"]
        answer_index: 1
        explain: "Without the appropriate usage flag, the engine uses the default world grid material in-game and logs a message."
      - q: "Why should you not leave every Used with flag enabled just in case?"
        choices: ["Usage flags change the blend mode of the material when the mesh type does not support the mode that was set in the material", "Flags block Material Instances from overriding the parent, for example Used with Skeletal Mesh locks the Blend Mode setting", "Each flag compiles extra shader versions, for example Used with Mesh Particles increases compile time and memory usage", "Flags only work on Static Meshes, so a flag that is set on a material for another mesh type just wastes a little memory"]
        answer_index: 2
        explain: "Usage flags make the engine compile special versions of the material. The docs note mesh particle support increases shader compile time and memory usage."
      - q: "Tangent-space normal maps versus world-space normals: what does the docs say about cost?"
        choices: ["World space costs much more, because every normal is transformed twice", "They cost the same, so pick the one that your tools export", "Only tangent space works with Lumen, so world space costs a fallback", "Tangent space calculations are slightly more costly but more convenient"]
        answer_index: 3
        explain: "Tangent space calculations are slightly more costly than world space, but tangent-space maps are the common kind made in 2D tools."
      - q: "In the Shader Complexity view mode, what do pink and white pixels mean?"
        choices: ["A large jump to very expensive pixels", "Unlit materials with no cost", "Translucent overdraw only, not cost", "Missing materials on a mesh"]
        answer_index: 0
        explain: "Green to red is a linear range from inexpensive to expensive; pink and white indicate a large jump to very expensive pixels. Small white areas are tolerable."
      - q: "The view mode only counts instructions. When can that be misleading?"
        choices: ["When the scene has fog, because fog adds instructions to every pixel that the view mode does not show at all", "When a shader has many texture lookups or loops that are not unrolled, which are slower than the count suggests", "When using Nanite, because Nanite materials are drawn in a different pass that the view mode does not read", "It is never misleading"]
        answer_index: 1
        explain: "A shader with 16 texture lookups is much slower than one with 16 math instructions, and non-unrolled loops are not represented accurately."
      - q: "Which setting defines the top of the Shader Complexity color range, and what is its default?"
        choices: ["r.ShaderComplexity.MaxInstructionCount, 500", "MaxPixelShaderAdditiveComplexityCount, 2000", "ShaderComplexityColors.MaxCount, 100", "r.MaterialQualityLevel.MaxCost, 3000"]
        answer_index: 1
        explain: "MaxPixelShaderAdditiveComplexityCount defaults to 2000 in BaseEngine.ini (800 for ES3 preview) and can be overridden in DefaultEngine.ini."
      - q: "You want to read the generated shader for DirectX SM6. Where is it?"
        choices: ["Window > Stats > Shader Code > Desktop > DirectX SM6 > Show", "Tools > Audit > Material Shader Code > Desktop > DirectX SM6", "Window > Shader Code > HLSL Code > Desktop > DirectX SM6", "File > Export > HLSL Code"]
        answer_index: 2
        explain: "The Material Editor's Window menu has Shader Code > HLSL Code with desktop, Android and iOS targets, plus Stats and Platform Stats panels."
    flavors:
      _default: {why: "Most shader cost is settings and habits, not clever math."}
      tech_art: {why: "A per-material optimization pass is a standard tech-art deliverable.", do: "Keep a before/after table of instruction counts for every material you touch and share it with the team."}

