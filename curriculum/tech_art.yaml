      - q: "What does Max In-Game show?"
        choices: ["The size of the imported source file", "The largest size the texture can be in-game; never larger than the import, but maybe smaller due to settings", "The size of the smallest mip", "The size on disk"]
        answer_index: 1
        explain: "Max In-Game is the maximum size the texture can have in-game. It is never bigger than the imported size but can be smaller because of settings like LOD Bias."
      - q: "Maximum Texture Size is set to 0. What does that mean?"
        choices: ["The texture is not rendered", "The texture is 1x1", "The maximum size for the format on each platform is used", "The texture is limited to 1024"]
        answer_index: 2
        explain: "A Maximum Texture Size of 0 means the maximum size allowed for the format on each platform."
      - q: "The Texture Group has LODBias 1 and the texture's own LOD Bias is -1. What is the final LOD Bias?"
        choices: ["2", "1", "-1", "0"]
        answer_index: 3
        explain: "The texture LOD Bias is added to the group value and can be negative: 1 + (-1) = 0."
      - q: "In what order are LOD Bias and the group's Min/Max LOD Size applied?"
        choices: ["Min/Max first, then bias", "Bias first, then the result is clamped to the group's MinLODSize and MaxLODSize", "Only the bias is used", "Only Min/Max are used"]
        answer_index: 1
        explain: "The final LOD Bias is calculated first. Then the chosen mip is checked against the TextureGroup's Min/Max LODSize range and adjusted if needed."
      - q: "A group has MaxLODSize 1024 and you ship 2048 textures in it. What does the page say?"
        choices: ["They render at 2048 anyway", "Package size grows with no rendering quality benefit", "The editor blocks the import", "They lose their mips"]
        answer_index: 1
        explain: "Textures above the group's MaxLODSize never render larger than that size, so shipping them only increases package size with no quality gain."
      - q: "NumStreamedMips for a group is set to 0. What happens?"
        choices: ["No mips stream; textures in that group are always fully loaded", "All mips stream", "The textures have no mips", "Only the top mip loads"]
