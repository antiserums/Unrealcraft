    title: Read the Stats panel
    brief: "Every material is turned into shader code, and more code means more work for the graphics card. The Stats panel in the Material Editor shows how many instructions and texture samplers a material uses. You cannot make a material cheaper if you cannot measure it, so this is the first number to read. In this quest you read the stats of a material, look at the code Unreal generates, and make one expensive material cheaper."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-material-editor-ui"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/essential-unreal-engine-material-concepts"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/viewport-modes-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a material that has several texture samples, for example M_Mannequin from the folder Characters/Mannequins/Materials. Work on a duplicate, so that the original stays unchanged. If the Stats panel is hidden, open it from the Window menu."
      - "Write down the instruction count and the number of texture samplers."
      - "Add three Texture Sample nodes and do not connect them to anything. Check the Stats panel again. Then click the Clean Up button in the toolbar to remove the unconnected nodes."
      - "Open Window > Platform Stats and compare the cost of the material for two different renderers."
      - "Open Window > Shader Code > HLSL Code, which shows the shader code that Unreal made from your graph. Find where one of your texture samples appears in that code."
      - "In the level viewport, press Alt+8 to switch to the Shader Complexity view mode. Find the object that is the most red and open its material. Remove or simplify one expensive part, and then compare the color again."
    done_when: "Send two screenshots of the Stats panel, one from before and one from after your change, with the instruction counts visible. Also send a Shader Complexity screenshot of the object you improved."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "What does the Stats panel show?"
        choices: ["The number of shader instructions and any compiler errors", "The frame rate and the memory use of the level that is open", "The list of Material Instances of the material", "The texture memory that each texture uses"]
        answer_index: 0
        explain: "The Stats panel shows the number of shader instructions in the Material and any compiler errors. Fewer instructions means a less costly Material."
      - q: "You add ten nodes that are not connected to the Main Material Node. What happens to the instruction count?"
        choices: ["It goes up by ten, because every node in the graph adds exactly one instruction", "It doubles, because the compiler adds each node and one extra node to pass its result", "It does not change, because unconnected nodes do not contribute to the cost", "It goes down, because unconnected nodes replace the connected ones in the compiler"]
        answer_index: 2
        explain: "Material expression nodes that are not connected to the base Material node do not contribute to the instruction count."
      - q: "Where can you see the cost of a material for different platforms?"
        choices: ["The HLSL Code panel", "The Platform Stats window", "The Details panel", "The Preview Scene Settings"]
        answer_index: 1
        explain: "Platform Stats shows the Material cost per platform. You pick the renderer in its Settings option. Android stats need the Mali Offline Compiler installed."
      - q: "Can you edit the HLSL code shown in the HLSL Code panel?"
        choices: ["Yes, and the material then recompiles automatically", "Yes, but only for SM6, and only until you press Apply", "No, it is a read-only viewer of the generated code", "Only in a packaged build, where the code is stored as text"]
        answer_index: 2
        explain: "The HLSL Code panel is a viewer, not an editor. You can look at the generated code but cannot change it."
      - q: "Which is the hotkey and console command for the Shader Complexity view mode?"
        choices: ["Alt+5 and viewmode lit", "Alt+8 and viewmode shadercomplexity", "Alt+0 and viewmode lightmapdensity", "F1 and viewmode wireframe"]
        answer_index: 1
        explain: "Shader Complexity uses Alt+8 or the console command viewmode shadercomplexity. Alt+0 is Lightmap Density."
      - q: "Why can Shader Complexity be misleading?"
        choices: ["It only counts instructions, and 16 texture lookups are much slower than 16 math instructions", "It only works on mobile previews, so the colors on a desktop renderer are not based on real data", "It ignores translucent objects, so a scene full of smoke and glass shows as green in the view mode", "It shows draw calls, not shader cost, so a scene with few large meshes always looks cheap in it"]
        answer_index: 0
        explain: "Only instruction count is used. A shader with 16 texture lookups is much slower than one with 16 math instructions, and loops that are not unrolled are also not shown correctly."
    flavors:
      _default: {why: "You cannot make a material cheaper if you cannot measure it. The Stats panel is the first number to read."}
      tech_art: {why: "Instruction count and sampler count are what you will quote in a material budget.", do: "Note the default MaxPixelShaderAdditiveComplexityCount (2000) and explain in one line what changing it in DefaultEngine.ini would do to the view."}
      gameplay_design: {why: "A quick look at Shader Complexity tells you if a level is heavy before anyone profiles it."}

