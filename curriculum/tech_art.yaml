    required: true
    title: A panel with buttons
    brief: "An Editor Utility Widget is a small panel with buttons and text that you build yourself and that runs inside the Unreal editor. You make it the same way as a game menu, but its buttons do editor work, such as changing all the actors you have selected. One button like this can save a team hundreds of repeated clicks. In this quest you build a panel with two buttons that change the rotation and the scale of selected actors."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/editor-utility-widgets-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/scripting-the-unreal-editor-using-blueprints"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/scripted-actions-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. In the Content Browser, right-click, choose Editor Utilities, and then click Editor Utility Widget. Name the new asset EUW_ActorTools."
      - "Open it. In the Designer, the tab where you lay out the panel, add a Vertical Box with two Buttons inside. Label the buttons Randomize Rotation and Snap Scale 1."
      - "Build the logic for Randomize Rotation. Get the selected level actors (for example with Get Selection Set), loop over them, and set a random Yaw on each one. Yaw is the rotation around the up axis."
      - "Build the logic for Snap Scale 1. Loop over the selected actors and set the scale of each one to 1, 1, 1."
      - "Add a Text block to the panel that shows how many actors the last click changed."
      - "In the Content Browser, right-click EUW_ActorTools and choose Run Editor Utility Widget. Drag the new tab and dock it next to the Details panel."
      - "Select 5 or more props in a level, for example cubes that you place now, and test both buttons."
    done_when: "Send a screenshot of the docked EUW_ActorTools panel next to a level where several selected props have a random rotation. Also send one screenshot of the button's graph."
    xp: 110
    verify_type: screenshot
    quiz:
      - q: "Editor Utility Widgets are based on which system?"
        choices: ["Slate widgets written in C++", "Unreal Motion Graphics (UMG)", "Niagara systems with a UI renderer", "Python scripts, with no UI"]
        answer_index: 1
        explain: "Editor Utility Widgets are based on UMG, so you build them like any other Widget Blueprint."
      - q: "How do you open your Editor Utility Widget as an editor tab?"
        choices: ["Play in Editor, with the asset selected in the browser", "Drag it into the level and select the actor that it makes", "Right-click the asset → Run Editor Utility Widget", "Add it to the Level Blueprint and then press Play"]
        answer_index: 2
        explain: "Run Editor Utility Widget opens an editor tab with your widget."
      - q: "After you run it once, where else can you find your widget?"
        choices: ["In the Level Editor's Tools dropdown, under Editor Utility Widgets", "In Project Settings → Plugins, under the Editor Utility Widgets section", "In the Modes panel, next to Landscape and Foliage, as a mode of its own", "In the World Settings, under the Editor Utilities section"]
        answer_index: 0
        explain: "Once run, it appears in the Level Editor's Tools dropdown under the Editor Utility Widgets category."
      - q: "You need a tool that renames selected assets. It needs no custom panel, just a right-click menu item. What fits best?"
        choices: ["An Editor Utility Widget with one single button on it", "A Level Blueprint with a key event that renames the assets", "A Niagara system with a custom script module", "An Editor Utility Blueprint used as a Scripted Action"]
        answer_index: 3
        explain: "Editor Utility Blueprints are for editor logic that needs no custom UI. Scripted Actions run from the right-click menu."
      - q: "When is an Editor Utility Widget the better choice?"
        choices: ["When the tool must run in the shipped game", "When you need a rich UI to control your Blueprint logic", "When you want the logic to run on every Actor tick", "When you only need a Details panel button on one actor"]
        answer_index: 1
        explain: "The page says Editor Utility Widgets are best when you need a rich UI. They are recommended for most editor scripting work."
      - q: "Which node returns the Actors currently selected in the level?"
        choices: ["Get Selected Assets", "Get All Actors of Class", "Get Selection Set", "Get Player Pawn"]
        answer_index: 2
        explain: "Get Selection Set returns the selected Actors in the level. Get Selected Assets returns the assets selected in the Content Browser."
      - q: "You look for editor-only functions inside a normal Actor Blueprint and see only a few. Why?"
        choices: ["Editor-only functions are only fully available in editor-only Blueprint classes, such as Editor Utility Widgets", "You need to enable Lumen in the Project Settings, because the editor hides those functions when it is off", "The functions only exist in C++; no Blueprint class of any kind, editor-only or not, is ever able to call them", "You must be in Play in Editor, because editor-only functions are loaded when the game starts to run"]
        answer_index: 0
        explain: "Most editor operations can't work at runtime. The full set shows only in editor-only classes like Editor Utility Widgets or Editor Utility Blueprints."
      - q: "How can Blueprint or C++ open an Editor Utility Widget panel by code?"
