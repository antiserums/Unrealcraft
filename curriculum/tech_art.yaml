    title: A 3D gas explosion with Niagara Fluids
    brief: "Niagara Fluids is a plugin that simulates gas, fire and liquid in real time. A gas simulation divides a box of space into a grid of small cells, and each cell stores values such as density, temperature and velocity. More cells give a sharper result but cost much more performance, so you need to know which settings to change. In this quest you place a ready-made gas explosion, make it collide with a sphere, change how it behaves and measure its cost."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/niagara-fluids-quick-start-guide-for-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/fluid-simulation-in-unreal-engine---overview"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/niagara-fluids-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open Edit > Plugins and search for Niagara. Enable Niagara Fluids, accept the Beta warning and restart the editor."
      - "Right-click in the Content Drawer and choose Niagara System. Under Niagara Fluids, then 3D Gas, pick Grid3D_Gas_Explosion. Name the system FXS_TA_GasExplosion and drag it into the level."
      - "Select the system in the level. In the Details panel, under Override Parameters, set WorldSpaceSize to 300, 300, 600 and ResolutionMaxAxis to 300. Turn ShowOverlays off and on again to restart the explosion."
      - "Add a Sphere above the explosion, inside the bounds of the simulation. Add an actor tag named collider to the sphere, and watch the gas flow around it."
      - "Open the system. In Grid3D_Gas_CONTROLS_Emitter, open Emitter Summary. Set Density Dissipation to 3.0, Temperature Dissipation to 1.5, Velocity Dissipation to 0.8 and Temperature Buoyancy to 3.5. Dissipation is how fast a value fades away, and buoyancy makes hot gas rise."
      - "In the Render section, set Render Density Gain to 0.5. Switch Render Temperature to Curve and edit the color curve."
      - "Note the frame time with ResolutionMaxAxis at 300 and then at 150, and write both numbers down."
    done_when: "Send a screenshot of the explosion colliding with the tagged sphere in the level, plus a screenshot of the Emitter Summary with your changed dissipation and buoyancy values. Write your two frame-time numbers in the message."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Where do the Niagara Fluids templates come from?"
        choices: ["They are built into every project by default, with no plugin", "They are added when you enable the Niagara Fluids plugin", "They must be downloaded from Fab and added to the project by hand", "They are created by the Baker when you bake your first simulation"]
        answer_index: 1
        explain: "Niagara Fluids is a plugin. Enabling it adds the fluid templates to the new Niagara System browser."
      - q: "How does the quick start make a sphere collide with the gas explosion?"
        choices: ["By adding a Collision module to the grid emitter of the system", "By giving the sphere an actor tag named collider", "By enabling Simulate Physics on the sphere in its Details panel", "By parenting the sphere to the system in the Outliner"]
        answer_index: 1
        explain: "The tutorial adds the tag 'collider' under Actor > Advanced > Tags on the sphere so the explosion collides with it."
      - q: "What is the trade-off of increasing ResolutionMaxAxis?"
        choices: ["Less pixelation but more memory and GPU cost", "Bigger bounding box only, at no extra cost", "Faster simulation, with a softer look", "More particles per frame with no extra cost"]
        answer_index: 0
        explain: "Higher resolution reduces pixelation. The docs say to keep it as small as possible to preserve memory and performance."
      - q: "In the CONTROLS emitter, what does a higher Density Dissipation value do?"
        choices: ["Makes the gas rise faster to the top of the box", "Increases the size of the whole bounding box", "Changes the color of the gas to blue over its life", "Makes the density data fade to zero faster"]
        answer_index: 3
        explain: "Dissipation defines how quickly data fades over time. A higher number drops the value to zero faster."
      - q: "Which parameter makes the explosion rise faster in the quick start?"
        choices: ["Temperature Buoyancy", "Render Density Gain", "WorldSpaceSize", "SourceOffset"]
        answer_index: 0
        explain: "Buoyancy from temperature makes the simulation rise. The tutorial raises Temperature Buoyancy to 3.5."
      - q: "Gas simulations in Niagara Fluids are represented how?"
        choices: ["As a ribbon that follows the path of the gas, with a width that grows over time", "As a skeletal mesh with one bone for each puff of gas in the simulation", "As a single sprite sheet that is played back on one large particle", "As a grid where each cell stores density, temperature and velocity"]
        answer_index: 3
        explain: "The overview explains gas is simulated on a grid. Each cell holds density, temperature and velocity."
      - q: "Which Niagara feature runs each step of the fluid algorithm over all grid cells before moving on?"
        choices: ["Event Handlers", "Simulation Stages", "Dynamic Inputs", "The Timeline"]
        answer_index: 1
        explain: "Simulation Stages process all cells for each step, and Num Iterations lets a stage run several times."
      - q: "Which liquid solver type is meant for pools of water without many splashes, like boat wakes?"
        choices: ["3D FLIP Liquid", "2D FLIP Liquid", "Shallow Water", "3D Gas Volume"]
        answer_index: 2
        explain: "Shallow Water is a height field for pools and simple object interaction. FLIP solvers handle splashes and complex liquids."
    flavors:
      _default: {why: "Real-time fluid sims are heavy. Knowing the dials lets you use them without killing the frame rate."}
      tech_art: {why: "You will be the one asked why a gas sim costs 8 ms. The resolution and dissipation dials are your answer.", do: "Compare a 2D Gas template to the 3D one and record the GPU cost of each with the Niagara Debugger."}

  - id: TAQ68
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [niagara, lightweight-emitters, performance, debugger]
    required_spine: false
    required: false
    title: Lightweight emitters, 400 fountains
    brief: "A level often has hundreds of small effects, and each normal Niagara emitter costs a little CPU time every frame. A lightweight emitter, also called a stateless emitter, is a simpler kind of emitter that needs almost no work per frame. The price is that it can only use a fixed set of modules. In this quest you place 400 normal fountains and 400 lightweight fountains and measure the difference with the Niagara Debugger."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/lightweight-emitters-quick-start-for-niagara-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/niagara-lightweight-emitters-overview"
    checklist:
      - "Open any project, or create one from the Third Person template. Create a Niagara System named FXS_Fountain from the Default System and add the Fountain emitter to it. Rename the emitter to Fountain-R."
      - "Create a second system from the FountainLightweight template and name it FXS_Fountain_LW. Rename its emitter to Fountain-LW, set Spawn Rate to 300 and set Scale Color to red."
      - "Make a new Basic level named NiagaraLWTest. Place FXS_Fountain in a grid of 20 by 20 copies, and then place FXS_Fountain_LW in a second grid of 20 by 20 copies."
      - "Open Tools, then Debug, then Niagara Debugger. In the HUD section, enable Show Overview, and set the Debug Overview dropdown to Performance."
      - "Select each system in the Outliner. Write down the Game Thread Average for the regular version and for the lightweight version."
      - "Turn the overlay off and run the console command stat UNIT. Compare the Frame and Draw values for both grids."
      - "In FXS_Fountain_LW, try to add a dynamic input to a module, and note what happens."
    done_when: "Send two screenshots of the Niagara Debugger Performance overlay (one for each system) with the Game Thread Average readable. Write your stat UNIT Frame and Draw numbers in the message."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is another name for a lightweight emitter?"
        choices: ["Stateless emitter", "Static emitter", "Sprite emitter", "Cached emitter"]
        answer_index: 0
        explain: "Lightweight emitters are also called stateless emitters. They minimize or remove tick during the simulation."
      - q: "Which of these can a lightweight emitter NOT do?"
        choices: ["Use Gravity Force on all of its particles", "Use Sub UV Animation with a sprite sheet material", "Use custom modules, scratch pads or dynamic inputs", "Use Shape Location to place its particles"]
        answer_index: 2
        explain: "Stateless emitters are fixed-function. They cannot use custom modules, scratch pads or dynamic inputs."
      - q: "Why is a lightweight emitter faster to iterate on?"
        choices: ["It uses fewer sprites per emitter", "It does not need to be compiled", "It runs only in the Baker", "It has no renderer to set up at all"]
        answer_index: 1
        explain: "Lightweight emitters do not need compilation, which the docs say results in a faster workflow."
      - q: "How do you add a stateless emitter to a system?"
        choices: ["Drag a Blueprint into the stack of the system and pick Stateless in the list", "Right-click in the System Overview and select Add stateless emitter", "Enable a plugin per emitter and restart the editor", "Set Sim Target to Stateless in the Emitter Properties of the emitter"]
        answer_index: 1
        explain: "Right-click inside the System Overview and choose Add stateless emitter from the menu."
      - q: "Can a system mix regular and lightweight emitters?"
        choices: ["No, a system must be all of one type, or it does not compile", "Yes, and a mix of both types is always the fastest setup", "Only in cinematics, where the cost of the mix does not matter", "Yes, but a pure stateless system is the most performant"]
        answer_index: 3
        explain: "Both types can work in one system, but a fully stateless system gives the best performance."
      - q: "In the quick start, which Niagara Debugger metric is highlighted for comparing the two systems?"
        choices: ["Total Particle Count", "Game Thread Average", "GPU Memory Used", "Draw Calls"]
        answer_index: 1
        explain: "The Performance overlay shows several stats. The tutorial highlights the Game Thread Average."
      - q: "Which console command does the quick start use to show Frame and Draw metrics?"
        choices: ["stat FPS", "stat GPU", "stat UNIT", "stat NIAGARA"]
        answer_index: 2
        explain: "stat UNIT shows a list in the upper right including Frame and Draw."
      - q: "A stateless emitter is missing a behavior you need. What does the overview say you can do?"
        choices: ["Nothing; the feature set is final, so you must build the effect with a different tool", "Add a Scratch Pad module to the stateless emitter and write the missing behavior there yourself", "Add an Event Handler that calls a normal emitter for that behavior", "Convert it to a stateful emitter inside the system, or extend the feature set in C++"]
        answer_index: 3
        explain: "You can convert a stateless emitter to stateful (or back) in the system, and the feature set can be expanded via C++."
    flavors:
      _default: {why: "Hundreds of small effects are common in a level. Lightweight emitters make them almost free."}
      tech_art: {why: "Picking stateless versus stateful per effect is a tech art budget decision.", do: "Write a short rule for your team: which effect types should default to lightweight emitters and why."}

  - id: TAQ69
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [niagara, scratch-pad, modules, dynamic-inputs]
    required_spine: false
    required: false
    title: Scratch Pad first, asset later
    brief: "A Niagara module is a small script that changes particle values, such as position or size. The Scratch Pad lets you write your own module or dynamic input inside the system you are working on, so you can test an idea at once without making a new asset. When the idea works, you can turn it into a real asset that other systems can use. In this quest you write a scratch module that pushes particles sideways, and then you save it as an asset."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/editor-ui-reference-for-niagara-effects-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/particle-spawn-group-reference-for-niagara-effects-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-niagara-effects-for-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Create a Niagara System named FXS_TA_Scratch from the Fountain template and drag it into the level."
      - "In Particle Update, click the + button and choose New Scratch Pad Module. Confirm that the Scratch Pad panel opens and that an empty module is already in your stack."
      - "In the scratch module, add a float input named Strength. Read Particles.Position, push the particle sideways by Strength * Particles.NormalizedAge, and write the result back to Particles.Position. Click Apply and watch the viewport."
      - "Now open Window > Scratch Pad. Click the + button next to Dynamic Inputs and make a scratch dynamic input that returns a float from a sine of Engine.Time. Attach it to Sprite Size in Initialize Particle."
      - "Right-click the scratch module in the Scratch Script Selector and choose Create Asset. Name the asset NMS_TA_SidePush."
      - "Delete the scratch version from the stack and add the NMS_TA_SidePush asset from the library in its place. Confirm that the effect looks the same."
      - "Add a Set new or existing parameter directly item to the stack. Use it to create a new Particle float parameter that stores the push amount."
    done_when: "Send a screenshot of the Scratch Pad panel with your module graph and the stack that shows the scratch module and the scratch dynamic input. Also send a screenshot of the Content Browser that shows NMS_TA_SidePush."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the main purpose of the Scratch Pad?"
        choices: ["To bake flipbooks from a simulation into a texture, so that the effect can be played back as a cheap sprite", "To build modules or dynamic inputs that live locally in the current emitter or system, and see results at once", "To edit materials that the renderers of the emitter use, without leaving the Niagara editor", "To profile the GPU cost of each module in the stack, with a timer shown next to its name"]
        answer_index: 1
        explain: "The Scratch Pad makes reusable modules or dynamic inputs contained in the active asset, so you can test them immediately."
      - q: "You opened the Scratch Pad from the Window menu and built a module, but nothing changes in the viewport. Why?"
        choices: ["Scratch modules never run in the preview, only in a level", "Opening from the Window menu means you must add the module to your stack manually", "You need to restart the editor before a new scratch module can run in any stack", "The system must be GPU, because scratch modules cannot run on the CPU"]
        answer_index: 1
        explain: "From the Window menu, you must add the module to the script yourself. Using + > New Scratch Pad Module adds it automatically."
      - q: "What is the advantage of using + > New Scratch Pad Module in a group?"
        choices: ["It compiles faster than a module asset, because scratch graphs skip the validation step", "It creates a Content Browser asset right away, so that other systems can use the module too", "It disables Library Only for the group, so that every scratch module is shown in the menu", "It places the module in the stack and adds a shell to the Scratch Pad graph automatically"]
        answer_index: 3
        explain: "That option puts a Scratch Pad module in the stack and creates the module shell in the graph, already connected to your script."
      - q: "How do you turn a scratch script into a reusable asset?"
        choices: ["Save the system, which writes each scratch script to its own asset", "Right-click it in the Scratch Script Selector and choose Create Asset", "Drag it to the level, which makes an asset in the folder of the level", "Set Library Visibility to Exposed in the Script Details of the module"]
        answer_index: 1
        explain: "Right-click the Scratch Script Selector and select Create Asset, or copy-paste the script into an existing asset."
      - q: "When is keeping a script in the Scratch Pad, instead of an asset, a good choice?"
        choices: ["When it is very specific to this emitter or system and does not need to be its own asset", "When many systems need it and every system should always get the newest version of it", "When it must be versioned, because only scratch scripts support major versions", "Never, because scratch scripts are deleted when the editor is closed again"]
        answer_index: 0
        explain: "The docs say the Scratch Pad is for things very specific to the active asset that do not need to be a separate asset."
      - q: "What does 'Set new or existing value directly' add to the stack?"
        choices: ["A Scratch Pad module with an empty graph that you must fill in by hand first", "A Sprite Renderer that draws the value of the parameter as text, for debugging in the preview", "An Event Handler that sets the value when an event arrives from another emitter of the system", "A Set Parameter module where you can Add Parameter or Create New Parameter"]
        answer_index: 3
        explain: "It places a Set Parameter module. Its + lets you add an existing parameter or create a new one."
      - q: "Modules in the Particle group can write to which namespace?"
        choices: ["System", "Emitter", "Particle", "User"]
        answer_index: 2
        explain: "Particle group modules can read System, Emitter, Particle, Engine and User, but only write to Particle."
      - q: "Where does the Scratch Pad panel dock by default when opened from the + menu?"
        choices: ["Next to the System Overview", "Under the Preview and Parameters panels", "Inside the Curves panel", "In a separate window"]
        answer_index: 0
        explain: "The Particle Spawn reference says the Scratch Pad opens docked next to the System Overview by default."
    flavors:
      _default: {why: "The Scratch Pad is the fastest way to test an idea before you commit to an asset."}
      tech_art: {why: "Prototype in the Scratch Pad, promote to an asset only when a second system needs it. This keeps your library clean.", do: "Open the Generated Code panel and find the HLSL your scratch module produced."}

  - id: TAQ70
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [niagara, sequencer, sim-cache, determinism, movie-render-queue]
    required_spine: false
    required: false
    title: Niagara on the Sequencer timeline
    brief: "Sequencer is the timeline editor of Unreal that you use to make cinematics. An effect in a cinematic must look the same every time you play it, and it must follow the timeline when you scrub, which means dragging the playhead back and forth. By default a Niagara system does neither of these things. In this quest you put a Niagara system on a Sequencer timeline and set it up so that it scrubs, repeats and starts already running."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/controlling-your-niagara-systems"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/caching-and-reusing-your-system"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-pre-roll"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/niagara-for-linear-content"
    checklist:
      - "Open any project, or create one from the Third Person template. Enable the Niagara MRQ Support plugin and the Niagara SIM Caching plugin, and restart the editor."
      - "Create a Level Sequence named LS_TA_FXShot with a Cine Camera and a Camera Cuts track. Place any looping Niagara system (a fountain is fine) where the camera can see it."
      - "Drag the system from the Outliner into Sequencer. Add a Niagara Component track, and then a Niagara System Life Cycle Track. Set the Section Range so that the red bar starts about one second into the shot."
      - "Scrub back and forth with the default mode. Then right-click the Life Cycle track, set Age Update Mode to Desired Age, and scrub again. Note the difference."
      - "Open the system and turn on Determinism in the Emitter Properties of each emitter. This makes the random values the same every time. Scrub again and confirm that the simulation repeats."
      - "Set a Warmup Time on the system instance, so that the fountain is already flowing on the first frame of the Life Cycle track."
      - "Add a User Parameter track under the Niagara Component track. Add keys to it so that the value changes during the shot."
    done_when: "Send a screenshot of Sequencer that shows the Niagara Component track, the Life Cycle track in Desired Age mode and a keyed User Parameter track, with the fountain visible in the viewport at a scrubbed frame."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "With the default Life Cycle track mode, what happens when you pause the sequence?"
        choices: ["The system freezes on the current frame, because Sequencer controls the age of every particle", "The system keeps emitting as long as it is active, because Sequencer does not control its age", "The system resets to its first frame and waits there until you press play", "The system is destroyed and spawned again when the sequence continues"]
        answer_index: 1
        explain: "In default mode Sequencer only controls when the system is active or inactive, not its age, so it keeps emitting when paused."
      - q: "Which Age Update Mode does Epic say is preferred in almost all cases?"
        choices: ["Tick Delta Time", "Desired Age No Seek", "Real Time", "Desired Age"]
        answer_index: 3
        explain: "Desired Age lets Sequencer set the system age so scrubbing works. The docs say it is preferred in almost all scenarios."
      - q: "In Desired Age mode, what happens when you scrub backward?"
        choices: ["The system runs in reverse, and each particle moves back along the path it came from", "The system resets and ticks up from the start of the Life Cycle track to the new time", "The system pauses forever and must be activated again by hand", "Nothing changes, because the track ignores time that goes backward"]
        answer_index: 1
        explain: "Scrubbing backward forces a reset and a tick-up to the current time from the beginning of the track."
      - q: "Why is the effect different every time you scrub backward, and what fixes it?"
        choices: ["The camera moves a little on each scrub; lock the camera to the cut track", "Random values differ on each reset; enable Determinism on the emitter", "The material flickers; disable bloom", "The sim cache is missing; add a Light Renderer and cache it one more time"]
        answer_index: 1
        explain: "Each reset produces new random values. Determinism makes the random seed the same on every reset."
      - q: "By default, where is a Niagara Sim Cache stored when cached from Sequencer?"
        choices: ["In a separate Sim Cache asset in Content", "In the Niagara System asset", "In the project config folder", "Embedded inside the Level Sequence asset"]
        answer_index: 3
        explain: "By default the cache data is embedded in the Level Sequence, which can bloat it. You can point the cache track to your own Sim Cache asset instead."
      - q: "You need the same system used many times with variation but still deterministic. What does the docs suggest?"
        choices: ["Duplicate the asset for each copy and edit them", "Use a different renderer for each copy of the system", "Disable Determinism on each of the emitters", "Use the Random Seed Offset on each component instance"]
        answer_index: 3
        explain: "Each instance has a Random Seed Offset parameter on its component, giving variation while keeping determinism."
      - q: "Your effect must already be visible on frame one of the shot. Which is a documented option?"
        choices: ["Set a Warmup Time on the system or its instance", "Increase Spawn Rate", "Delete the Camera Cuts track and add the system to the first frame", "Set Age Update Mode to Tick Delta Time on the track"]
        answer_index: 0
        explain: "Warmup Time ticks the system before it renders. The Life Cycle track offset and MRQ warm up are the other documented options."
      - q: "When would you need MRQ's Render Warm Up Frames instead of engine-only warm up?"
        choices: ["When using GPU Depth Map collisions or anything that reads the GBuffer", "For every CPU sprite emitter that uses a Spawn Burst at the start of a shot", "When the shot has no camera, and the engine cannot tick without a view to render", "Only for ribbons, which need rendered frames to build their first segment"]
        answer_index: 0
        explain: "Depth map collisions and GBuffer queries need rendered frames to exist, so warm-up frames must actually be rendered."
    flavors:
      _default: {why: "Cinematics need effects that scrub, repeat and render the same every time."}
      tech_art: {why: "Cinematics teams will hand you effects that look wrong when scrubbed. Life cycle modes and determinism are the fix.", do: "Cache the system to a separate Niagara Simulation Cache asset and compare the Level Sequence file size before and after."}

  - id: TAQ71
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [materials, material-functions, function-inputs, api-design]
    required_spine: false
    required: false
    title: Function inputs that explain themselves
    brief: "A Material Function is a piece of material graph that you save once and use in many materials. Its Function Inputs are the pins where another material sends data in, and its Function Outputs are the pins where the result comes out. If the inputs have clear names, types, defaults and descriptions, other people can use your function without asking you how it works. In this quest you build a wear function with a well planned set of inputs and test it in a material."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/material-function-expressions-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-and-using-material-functions-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-and-using-material-functions-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Create a Material Function named MF_TA_Wear. It should make a surface darker and rougher where a mask says so. Plan the interface first: before you place a node, write the list of inputs on paper with a name, a type and a default for each one."
      - "Add these Function Inputs: BaseColor (Vector3), Roughness (Scalar), WearMask (Texture Object), WearAmount (Scalar) and UseDetail (Static Bool). Give every input a Description and a Sort Priority, so that they appear in the order you planned."
      - "Set a Preview Value on WearAmount and turn on Use Preview Value As Default. Leave BaseColor without a default, so that anyone who uses the function must connect it."
      - "Inside the function, connect WearMask to a Texture Sample node, because a Texture Object cannot be sampled by itself. Use a StaticSwitch node that is driven by the UseDetail input to add or skip an extra detail texture."
      - "Add two Function Outputs named Color and Roughness, and give them Descriptions and Sort Priorities. Click Apply, and then save."
      - "In a test material named M_TA_WearTest, hold F and left-click to place an Unspecified Function node, and assign MF_TA_Wear to it. Hover over each pin to read your tooltips. Connect nothing to WearAmount and confirm that the preview default is used."
      - "Connect a Scalar (a value with 1 channel) to the BaseColor input and note what the compiler says. Then fix the connection."
    done_when: "Send a screenshot of MF_TA_Wear that shows the Details panel of one Function Input with Input Type, Preview Value, Use Preview Value As Default and Sort Priority filled in. Also send a screenshot of M_TA_WearTest with the function node and a tooltip visible. Add one line that says what happened when you connected the wrong type."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "A caller connects data of the wrong type to a Function Input. What does the docs say happens?"
        choices: ["The data is silently converted to the closest type, and no warning or error is shown", "The data is cast to the Input Type, and a compiler error is thrown if the cast fails", "The input is ignored and the Preview Value is used in its place, without a message", "The function refuses to be placed in the graph until the data type has been fixed"]
        answer_index: 1
        explain: "Data passed to a Function Input is cast to its Input Type. If the data is not compatible, the compiler throws an error."
      - q: "You want an input to be optional so that callers can leave it unconnected. Which setting does that?"
        choices: ["Sort Priority set to 0 on the input", "Use Preview Value As Default turned on", "Description left empty on the input", "Input Type set to Static Bool for the input"]
        answer_index: 1
        explain: "With Use Preview Value As Default enabled, the Preview Value is used as the default when no data is passed in. Otherwise the Preview Value is only for editing the function."
      - q: "What does Sort Priority on a Function Input change?"
        choices: ["The order of inputs shown on the MaterialFunctionCall node", "Which input is evaluated first when the function is compiled", "The default value of the input when nothing is connected to it", "The compile order of the material that calls the function node"]
        answer_index: 0
        explain: "Sort Priority sets the order in which inputs (and, on Function Outputs, outputs) are displayed on the MaterialFunctionCall node."
      - q: "Where does the text you write in a Function Input's Description appear?"
        choices: ["In the thumbnail of the function in the Content Browser, below its name", "In the Stats panel, next to the instruction count of it", "As a tooltip when you hover the input connector on the function call node", "Nowhere, it is only for the author of the function to read"]
        answer_index: 2
        explain: "The Description is displayed as a tooltip when the connector for that input on a MaterialFunctionCall expression is hovered over."
      - q: "Inside a function you placed a TextureObject node and connected it directly to Base Color. Why does this fail?"
        choices: ["TextureObject only works in Material Instances, where the texture can be overridden", "TextureObject does not sample the texture; it must be used with a TextureSample node", "TextureObject has no Sampler Type, so it only works for normals", "Base Color only accepts Scalars, and a texture is a vector type"]
        answer_index: 1
        explain: "The docs state that TextureObject provides a default texture for a texture input and does not actually sample it, so it must be used together with a TextureSample node."
      - q: "What is the difference between StaticBool and StaticSwitch inside a function?"
        choices: ["StaticBool does the switching between its two inputs; StaticSwitch only holds a default value for the function", "They are the same node with different names; StaticBool is the old name, kept so that older material functions still load", "StaticBool only provides a default bool value and must be used with a StaticSwitch, which does the switching", "StaticSwitch creates a parameter in instances and StaticBool does not, so StaticBool is used when a value must stay hidden"]
        answer_index: 2
        explain: "StaticBool provides a default bool for a static bool input and switches nothing. StaticSwitch implements the switch without creating a parameter."
      - q: "If you could write only one description in your whole function, where does Epic say it matters most?"
        choices: ["On the function itself, with the graph background selected", "On the first Function Output, in its Details panel", "On the Function Input that callers use the most in materials", "In the asset name, because it is shown in the Palette"]
        answer_index: 0
        explain: "The function's own Description becomes the tooltip in the Material Function Library and in the Material Editor. Epic calls it by far the most important place to comment."
      - q: "You want to test a change to an engine function without breaking other materials. What does the docs advise?"
        choices: ["Edit the engine function and click Apply, because changes to engine content are only kept until the editor is closed again", "Rename the engine function first, because a renamed function is no longer used by the materials that called it by its old name", "Turn off Expose to Library before editing, because functions that are not in the library are not used by any material in the project", "Duplicate the function in the Content Browser and edit the copy, because saved changes propagate to all instances of the function"]
        answer_index: 3
        explain: "Changes to a function propagate to every material that uses it. Unless you want that, right-click and Duplicate the function and edit the copy."
