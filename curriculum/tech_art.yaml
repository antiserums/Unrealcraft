    xp: 85
    verify_type: screenshot
    quiz:
      - q: "Why use an Effect Type asset instead of setting culling on each Niagara system?"
        choices: ["Effect Types make effects look better, because they raise the quality level", "You configure the settings once and apply them to many systems", "Only Effect Types can use the GPU, so systems without one run on the CPU", "Systems without an Effect Type cannot be placed in a level at all"]
        answer_index: 1
        explain: "Effect Types hold settings once for a whole group of systems. The docs suggest giving every system an Effect Type."
      - q: "You set Max Global Budget Usage to 0.8. What happens?"
        choices: ["Any system is culled as soon as budget use reaches 80%; this favors performance over visuals", "Systems slow down to 80% speed, so each of them costs less per frame while the budget is in use", "Only 80% of particles spawn in each system, and the rest are skipped until the budget use drops", "Nothing happens until the budget use is above 100%; then 80% of the systems are culled at once"]
        answer_index: 0
        explain: "It is a cull threshold. Values are usually 0 to 1; you can go to 1.5 to be more permissive."
      - q: "When budget use is high, you want far effects to disappear first but close ones to stay. Which option?"
        choices: ["Max Instance Count Scale by Global Budget Use", "Max System Instance Count Scale by Global Budget Use", "Max Distance Scale by Global Budget Use", "Show Global Budget Info"]
        answer_index: 2
        explain: "This curve lowers the cull distance as budget use goes up, so only close systems render."
      - q: "What is the difference between the Instance Count and the System Instance Count scaling options?"
        choices: ["No difference; both options do the same thing, and the second name is only kept for systems made in older engine versions", "Instance Count only affects GPU systems; System Instance Count only affects CPU systems", "System Instance Count only works in the editor preview; Instance Count is the one that is used in the packaged game build", "Instance Count scales all instances of all systems with this Effect Type; System Instance Count scales the count per system"]
        answer_index: 3
        explain: "One scales across all matching systems together; the other culls a number of instances inside each system."
      - q: "A system is not visible in PIE and you think scalability culled it. How do you confirm this with the Debug HUD?"
        choices: ["Set System Debug Verbosity to Basic or Verbose and turn off System Show Active Only in World", "Turn on Enable GPU Readback and read the particle count of the system on the HUD", "Set fx.Niagara.Debug.PlaybackMode to 1 and step through the frames until the system appears", "Open the Session Browser tab and pick the PIE session, which lists culled systems"]
        answer_index: 0
        explain: "Basic and Verbose show if and why a system is culled. With Active Only off, culled systems show as black locators."
      - q: "You turn on Enable GPU Readback to see GPU particle attributes. What should you expect?"
        choices: ["No cost, because the data is already on the GPU", "The GPU emitters switch to CPU simulation while on", "A few frames of latency and an extra memory cost", "The Debug HUD turns off while it is on"]
        answer_index: 2
        explain: "Data is copied from the GPU back to the CPU, so there is delay and a memory cost."
      - q: "In the FX Outliner Performance view, each block has two numbers. What are they?"
        choices: ["CPU memory on the left, GPU memory on the right side", "Game thread cost on the left, render thread cost on the right", "Spawn time on the left, update time on the right", "The particle count on the left, the emitter count on the right"]
        answer_index: 1
        explain: "Left is game thread, right is render thread. Emitters show only state data, not performance."
      - q: "You moved all emitters of a system to GPU simulation, but the CPU cost barely changed. Why?"
        choices: ["GPU emitters also simulate every particle on the CPU, as a backup for the GPU readback", "The Effect Type forces CPU simulation for all systems that use it", "The debugger doubles the cost of every emitter while it is attached", "System and emitter scripts still run on the CPU, so each emitter keeps a fixed overhead"]
        answer_index: 3
        explain: "Only particle scripts move to the GPU. To cut the fixed cost, reduce the number of emitters or instances."
      - q: "An explosion spawns 5,000 particles in one frame and causes a hitch. What do the best practices suggest?"
        choices: ["Spread the spawn over several frames", "Add warmup time to the system", "Turn on sorting for the emitter", "Use dynamic bounds for the emitter"]
        answer_index: 0
        explain: "Spawning a large burst in one frame can hitch. Spreading it spreads the work. Warmup also causes hitches."
      - q: "Four emitters in a system have the same behavior and only use different meshes. What is a cheaper setup?"
        choices: ["Keep four emitters and lower the spawn rate of each", "One emitter with a mesh array or several renderers", "Four systems with one emitter each, spawned together", "Turn on Require Current Frame Data on all four emitters"]
        answer_index: 1
        explain: "Every emitter has overhead. When behavior is the same, merge them and vary the look with renderers or a mesh index."
    flavors:
      _default: {why: "Effects can take the whole frame if nobody sets limits. Budgets keep the game smooth when many effects play."}
      tech_art: {why: "Tech artists set the FX rules for the team. Effect Types and the debugger are how you enforce them.", do: "Make a small table: each Effect Type, what it is for, and its cull rules."}
      lookdev: {why: "Your beautiful effect is only useful if it survives the budget in a busy scene."}
      programming: {why: "The fx.Budget cvars and the debugger connect effects cost to the frame budget you track."}

  - id: TAQ25
    rank: 4
    difficulty: master
    specializations: [tech_art]
    subjects: [scalability, performance, config, device-profiles]
    required_spine: false
    required: true
    title: Quality levels that hold up
    brief: "Scalability settings are the quality levels of a game, from Low to Epic. They let the same game run on weak and strong computers by changing things like shadow quality, foliage density and texture detail. A game that only looks right on your own PC is not finished, so the low levels must still look acceptable. In this quest you compare one scene on Low and on Epic, change a quality group in a config file, and make a material cheaper on Low."
    time_min: 120
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/scalability-reference-for-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/scalability-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/customizing-device-profiles-and-scalability-in-unreal-engine-projects-for-android"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-device-profiles-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Pick one scene: a finished level of your own, or the level of the template. Save a camera bookmark, which is a stored camera position, so that every capture uses the same view."
      - "Open Settings > Engine Scalability Settings. Capture the view on Low and on Epic, with stat unit visible in both captures."
      - "Create the file Config/DefaultScalability.ini in the project. In it, override one quality group, for example the sections [FoliageQuality@0] to [FoliageQuality@2]. Restart the editor and check that the change works."
      - "If you use foliage, turn on Enable Density Scaling on the foliage types. Then compare the console commands sg.FoliageQuality 0 and sg.FoliageQuality 3."
      - "Open a material that is used in the scene, or make one with an extra detail branch, such as a second texture that is multiplied in. Add a Quality Switch node that removes the costly branch on Low. Check the result with the Shader Complexity view mode."
      - "Type the name of one sg.* setting in the console with no value after it. Note the current value that it prints and where that value was set."
    done_when: "Send the Low and Epic screenshots from the same bookmark with stat unit visible, and the block you wrote in DefaultScalability.ini. Add 3 to 5 lines that say what changed most between Low and Epic, and what you would fix before you ship Low."
    xp: 250
    verify_type: writeup
    quiz:
      - q: "In the Scalability Groups, which sg.* values match Low and Epic?"
        choices: ["1 and 4", "0 and 3", "0 and 10", "-1 and 100"]
        answer_index: 1
        explain: "Each group runs from 0 to 3. The Low setting equals 0 and Epic equals 3, as defined in BaseScalability.ini."
      - q: "Your team wants less foliage on every quality level for this project only. What is the documented way?"
        choices: ["Edit Engine/Config/BaseScalability.ini in the engine install and change every [FoliageQuality@N]", "Lower the Density on each foliage type by hand", "Create Config/DefaultScalability.ini in the project and add [FoliageQuality@N] sections", "Set r.ViewDistanceScale to 0 in the Level Blueprint of each level that has foliage"]
        answer_index: 2
        explain: "The reference page adds a DefaultScalability.ini to the project Config folder with new [FoliageQuality@0..2] values. The engine files stay untouched."
      - q: "sg.FoliageQuality 0 makes no change to your painted foliage. What is the likely cause?"
        choices: ["Enable Density Scaling is off on the foliage static meshes", "Foliage only scales on mobile platforms, never on a desktop PC", "The level needs a lighting build before the density can change", "Foliage Quality only affects Landscape grass on the Epic level"]
        answer_index: 0
        explain: "For Foliage Static Meshes to work with the Scalability settings, you must enable the Enable Density Scaling option."
      - q: "Going from sg.TextureQuality 3 to 0 changes which settings, per the reference page?"
        choices: ["Only the texture compression format, which changes from BC7 to BC1 on each of the textures", "Only the anisotropy level, r.MaxAnisotropy, and nothing else in that group", "Nothing on PC, only on consoles", "A higher r.Streaming.MipBias, a smaller r.Streaming.PoolSize and lower r.MaxAnisotropy"]
        answer_index: 3
        explain: "The table shows TextureQuality 0 with MipBias 2.5, MaxAnisotropy 0 and PoolSize 200, and TextureQuality 3 with MipBias 0, MaxAnisotropy 8 and PoolSize 1000."
      - q: "You compare Texture Low and Epic in a small scene and see almost no difference except filtering. Why?"
        choices: ["Texture quality is broken in the editor and only works in a packaged build of the project", "Your textures fit in the pool at full resolution, so the streamer never has to drop mips", "Texture quality only affects UI textures, so a 3D scene never changes", "You need to rebuild lighting first, because lightmaps hide the change"]
        answer_index: 1
        explain: "If full resolution mips do not use all of the texture pool, you will not see a difference between high and low settings, apart from anisotropy."
      - q: "What does lowering r.MaxAnisotropy save?"
        choices: ["Texture bandwidth, but not texture memory", "Texture memory, but not texture bandwidth", "Both memory and bandwidth equally", "Only CPU time"]
        answer_index: 0
        explain: "Limiting the anisotropic sample count reduces texture bandwidth, but does not save texture memory."
      - q: "A designer wants to use Detail Mode to hide some physics props on Low. What is the risk?"
        choices: ["Detail Mode only works on lights and decals, so the props would stay visible on every quality level", "There is no risk; Detail Mode is made for exactly this kind of object", "Objects that affect gameplay can cause problems with network play, save games or consistency", "Detail Mode doubles draw calls for every object that has a mode set on Low"]
        answer_index: 2
        explain: "The page says to use Detail Mode only on objects that have no effect on gameplay, like decals or small effects."
      - q: "Why is the Quality Switch node NOT a tool for distance LOD?"
        choices: ["It only works on translucent materials, not on opaque ones", "It only runs in the editor, not in a packaged game", "It needs Nanite on every mesh that uses the material", "You cannot have two material quality levels at the same time"]
        answer_index: 3
        explain: "Material Quality Level is global. The node picks one pin for the whole run, so it cannot switch per distance. It also adds shader permutations."
      - q: "On Android, which config file wins if all four set the same scalability value?"
        choices: ["Project/Config/Android/Android*.ini", "Engine/Config/Base*.ini", "Project/Config/Default*.ini", "Engine/Config/Android/Android*.ini"]
        answer_index: 0
        explain: "The order is Engine Base, Project Base, Engine Android, then Project Android. The project Android file overrides all the others."
      - q: "Why does Epic recommend changing values in *Scalability.ini and setting only sg.* in device profiles?"
        choices: ["Device profiles cannot hold cvars, only the names of scalability groups", "So Preview Rendering Level in the editor shows the same mobile scalability values", "sg.* values are faster to parse when the game starts on a slow device", "Device profiles are ignored in Shipping builds, so cvars set there would be lost"]
        answer_index: 1
        explain: "Keeping small-scale changes in the scalability files and using groups in the device profile keeps Preview Rendering Level accurate."
      - q: "QA says shadows look wrong on one test PC. You type sg.ShadowQuality with no number. What do you get?"
        choices: ["It resets shadows to the Epic level", "An error, because a value is always required", "The current value and the last place it was set", "A list of all shadow cvars of the group"]
        answer_index: 2
        explain: "Typing a scalability name with no value prints its current value and where it was last set. Good for finding which config or code overrode it."
      - q: "Why is lowering resolution scale often a good trade on weak GPUs?"
        choices: ["It also lowers texture memory to zero, because textures are scaled with the screen", "It turns off Lumen below 70 percent, which removes the largest cost of the frame", "It is applied to the whole frame, including the UI, so every part of it gets cheaper", "The 3D scene renders smaller, UI is not scaled, and the upsample pass costs little"]
        answer_index: 3
        explain: "Unreal does not apply resolution scale to 2D UI. The up-sampling pass has a minor cost. It also benefits from good anti-aliasing quality."
    flavors:
      _default: {why: "A game that only looks right on your PC is not finished. Quality levels must hold up on all target hardware."}
      tech_art: {why: "You own the scalability ini files and device profiles. Bad defaults here cost the whole team.", do: "Add a memory bucket line like +CVars_Smallest=r.Streaming.PoolSize=... to one device profile and explain your number."}
      lookdev: {why: "Your look must survive Low. Know what each group removes before the art review."}
      programming: {why: "Settings menus call Game User Settings. Know what each sg.* group really changes."}

  - id: TAQ26
    rank: 4
    difficulty: master
    specializations: [tech_art]
    subjects: [interchange, import, pipeline, python, tools]
    required_spine: false
    required: true
    title: Own the import pipeline
    brief: "Interchange is the system Unreal uses to import files such as meshes and textures. Each import goes through a pipeline stack, which is an ordered list of pipelines, and each pipeline can change how the asset is created. If you add your own pipeline, your team's rules are applied to every import, and nobody has to fix each asset by hand. In this quest you write a Blueprint pipeline that enforces one rule and add it to the import stack of a project."
    time_min: 120
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/importing-assets-using-interchange-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/interchange-framework-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/interchange-import-reference-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/importing-assets-directly-into-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/fbx-import-options-reference-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open Project Settings and go to Engine, then Interchange. Take a screenshot of the pipeline stack that is used for Import Content."
      - "Create a Blueprint class with the parent class InterchangePipelineBase. Name it BP_IP_StudioRules."
      - "Override the function Scripted Execute Pipeline or the function Scripted Execute Post Import Pipeline. Make it enforce one rule, for example a name prefix such as SM_, or a fixed LOD Group."
      - "Add BP_IP_StudioRules to the pipeline stack of the project. Put it after the default pipelines."
      - "Import 3 test meshes. If you have no mesh files, export three from Unreal first: right-click a Static Mesh, such as a cube, choose Asset Actions, then Export, and save it as an FBX file under three different names. Use Preview in the import window to check the assets before you click Import."
      - "Change one of the source files and reimport it. Check that the same stack and options come back."
    done_when: "Send screenshots of the pipeline stack with your pipeline in it, the override graph, and the Content Browser after the import with the rule applied. Add 2 to 3 lines on what happened when you reimported."
    xp: 250
    verify_type: screenshot
    quiz:
      - q: "In Interchange, which part actually generates the asset from the imported data?"
        choices: ["The Pipeline Stack", "The Translator window", "The Factory", "The Content Browser"]
        answer_index: 2
        explain: "A pipeline processes the data and exposes options. A pipeline stack is an ordered list of pipelines. A factory generates the asset."
      - q: "Where do you add, remove or reorder the pipeline stacks for the whole project?"
        choices: ["Project Settings > Engine > Interchange", "Editor Preferences > General > Import", "World Settings > Pipelines", "The Static Mesh Editor > Import"]
        answer_index: 0
        explain: "The pipeline stacks live in Project Settings under Engine > Interchange."
      - q: "What is the correct order of the Interchange import process?"
        choices: ["Factories make an empty asset first, then the pipeline stack fills it, then translation reads the source file as the last step", "The pipeline stack runs first, then translation turns the file into nodes, then factories write those nodes back into the source file", "Translation and factories run at the same time, and the pipeline stack runs later, when the asset is saved to disk", "Data becomes an intermediary node structure, then goes through the pipeline stack, then factories make the asset"]
        answer_index: 3
        explain: "Interchange converts the file to intermediary nodes, runs them through the pipeline stack, then uses factories to generate the asset."
      - q: "An artist imports a file format that Interchange does not support. What happens?"
        choices: ["The import fails with an error message", "Unreal uses the legacy import framework", "Interchange converts it to glTF first", "It imports as a Data Asset with raw bytes"]
        answer_index: 1
        explain: "If the format is not supported by Interchange, Unreal Engine uses the legacy framework to import the file."
      - q: "What does Unreal remember when you reimport an asset that was imported with Interchange?"
        choices: ["The pipeline stack and options that were used", "Nothing; you choose everything again each time", "Only the file path of the source file", "Only the material slots of the old asset"]
        answer_index: 0
        explain: "On reimport, Unreal remembers the pipeline stack and options from the first import and shows them."
      - q: "On reimport, the Conflicts Preview shows a changed material slot. How do you fix the assignment with Interchange?"
        choices: ["Click Preserve Original in the conflict preview window", "Delete the asset and import again", "Fix it in the source file or in the Static Mesh Editor", "Turn off the Default Material Pipeline"]
        answer_index: 2
        explain: "You can no longer keep or replace the material from the conflict window. Change the source file or use the Static Mesh Editor."
      - q: "You want an import option to be hidden and read-only for all artists. What is the documented method?"
        choices: ["Write a Python startup script that hides the import window and sets the option for each artist", "Ask artists not to touch it, and check each imported asset by hand afterwards", "Edit BaseEngine.ini in the engine install and remove the line of that option", "Open the default pipeline asset and change its default value, visibility and read-only status"]
        answer_index: 3
        explain: "The default pipelines live in Engine > Plugins > Interchange Framework Content > Pipelines. You can edit defaults, visibility and read-only there. Turn on Show Engine Content to see them."
      - q: "Which override runs after the asset is fully imported and PostEditChange has been called?"
        choices: ["Scripted Execute Pipeline", "Scripted Execute Post Import Pipeline", "Scripted Execute Post Factory Pipeline", "Scripted Set Reimport Source Index"]
        answer_index: 1
        explain: "Post Factory runs after the factory but before PostEditChange. Post Import runs after the asset is completely imported and PostEditChange is called."
      - q: "Your custom pipeline is slow and blocks imports. Which override tells the Interchange Manager it can run in async mode?"
        choices: ["Scripted Can Execute on Any Thread", "Scripted Execute Export Pipeline", "Scripted Execute Pipeline", "Call In Editor"]
        answer_index: 0
        explain: "Scripted Can Execute on Any Thread tells the Interchange Manager that the pipeline can run async."
      - q: "A skeletal mesh has one source file for geometry and another for skinning. Which override chooses which source to reimport?"
        choices: ["Scripted Execute Post Import Pipeline", "Scripted Can Execute on Any Thread", "Scripted Execute Export Pipeline", "Scripted Set Reimport Source Index"]
        answer_index: 3
        explain: "Scripted Set Reimport Source Index tells the pipeline which source index to reimport, for assets with more than one source."
      - q: "You write a pipeline in Python. What else must you do so the editor knows about it?"
        choices: ["Nothing; Python pipelines are found automatically on start", "Compile it with Live Coding, like any other class", "Add the script to the Startup Scripts in Project Settings", "Save it as a .uasset in the Interchange folder"]
        answer_index: 2
        explain: "The page says to create the script and use Project Settings to add it to the Startup Scripts. The class derives from InterchangePythonPipelineBase."
      - q: "Your shipped app imports files at runtime with Interchange, but it fails in the cooked build. What is missing?"
        choices: ["The Interchange folder in Additional Asset Directories to Cook", "Nanite on all meshes that are imported at runtime by the app", "The FBX SDK plugin, which is not included in cooked builds by default", "A Python startup script that loads Interchange in the cooked build"]
        answer_index: 0
        explain: "For runtime use in a cooked application, add the Interchange folder under Project Settings > Packaging > Additional Asset Directories to Cook."
    flavors:
      _default: {why: "Every asset enters the project through import. Fix the rules there once, not by hand on each asset."}
      tech_art: {why: "A custom pipeline turns a style guide into something the engine enforces.", do: "Make a second pipeline that sets collision by name prefix (UCX_ and others) and explain when your team should use it."}
      programming: {why: "Interchange pipelines are C++, Blueprint or Python classes with clear override points. You can extend them."}
      lookdev: {why: "Wrong import options mean wrong normals, tangents or materials. Know where they are set."}

  - id: TAQ27
    rank: 4
    difficulty: master
    specializations: [tech_art]
    subjects: [virtual-shadow-maps, nanite, shadows, profiling, performance]
    required_spine: false
    required: true
    title: Shadows and geometry at scale
    brief: "Nanite is the system that lets Unreal draw meshes with very many triangles, and Virtual Shadow Maps (VSM) is the shadow system made to work with it. VSM saves time by caching: it keeps shadow pages that have not changed and does not draw them again. Things that move, such as foliage with a wind material that uses World Position Offset (WPO), make the cached pages invalid, and then the frame cost rises. In this quest you find what breaks the shadow cache in a test level, fix one cause, and measure the difference."
    time_min: 120
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/virtual-shadow-maps-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/nanite-virtualized-geometry-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/nanite-technical-details"
    checklist:
      - "Open any project, or create one from the Third Person template. Build a test level with Nanite rock and building meshes, one mesh that is not Nanite, and a foliage mesh with a WPO wind material. Simple stand-ins work: boxes and dense spheres made in Modeling Mode with Nanite enabled, one cube without Nanite, and a few meshes with a material in which a Sine of a Time node, multiplied by a small vector, is connected to World Position Offset. Use one Directional Light."
      - "Keep the camera still. Switch the viewport to View Modes > Virtual Shadow Map > Cached Page. Take a screenshot of the red areas, which are the pages that are not cached."
      - "Use the Shadow Casters view to find what invalidates the pages. Fix one cause: either set World Position Offset Disable Distance, or change Shadow Cache Invalidation Behavior."
      - "Run the console commands r.ShaderPrintEnable 1 and r.Shadow.Virtual.Stats 1. Note the numbers of Allocated, Cached and Invalidated pages before and after your fix."
      - "Open the Nanite Visualization menu. Check the Overdraw view and the Evaluate WPO view on your foliage."
      - "Capture a short Unreal Insights trace. Find the Shadow Depths cost for VSM before and after your fix."
    done_when: "Send the Cached Page screenshots from before and after, and the VSM stats numbers from before and after. Add 4 to 6 lines that say what caused the invalidations, what you changed, and how the Shadow Depths time changed."
    xp: 250
    verify_type: writeup
    quiz:
      - q: "How do Virtual Shadow Maps keep a 16k x 16k virtual resolution affordable?"
        choices: ["They render the full 16k map once when the level loads and reuse it for every frame until the sun or a mesh moves", "They use lower resolution on consoles only, and render the full 16k map on PC, where there is enough memory", "They split the map into 128x128 pages, render only pages needed for on-screen pixels, and cache them between frames", "They bake shadows into lightmaps when the level is built, and use the 16k map only for objects that move"]
        answer_index: 2
        explain: "Pages are allocated and rendered only as needed, based on the depth buffer, and cached unless moving objects or lights invalidate them."
      - q: "In the Cached Page view, what does a blue page mean?"
        choices: ["Only the static page is cached, the dynamic part is not", "The page is fully cached, static and dynamic", "The page overflowed the pool and was dropped", "The page belongs to a point light and is never cached"]
        answer_index: 0
        explain: "Green is cached, red is uncached. Blue means only the static page is cached and the dynamic part is uncached."
      - q: "Your foliage uses WPO wind and the shadow cost is high even with a still camera. Why?"
        choices: ["WPO disables Nanite on the foliage, and meshes without Nanite are never cached by Virtual Shadow Maps at all", "WPO forces ray-traced shadows for the foliage, and ray-traced shadows are computed again on every single frame", "Foliage never uses VSM; it always falls back to cascaded shadow maps, which are rendered again each frame", "Geometry with WPO invalidates its cached pages every frame, because the real offset is not known until render"]
        answer_index: 3
        explain: "The cache must assume a WPO object needs redrawing. Use World Position Offset Disable Distance or other ways to stop animation far away."
      - q: "A static WPO mesh never really moves but keeps invalidating shadows. Which Shadow Cache Invalidation Behavior fits?"
        choices: ["Always", "Rigid", "Auto", "None of them, turn off shadows"]
        answer_index: 1
        explain: "Rigid suppresses invalidations caused by, for example, World Position Offset. Static also ignores transform changes, and moving it gives undefined results."
      - q: "VSM stats show many invalidated static pages. What does Epic recommend?"
        choices: ["Switch the actors that cause them to Movable", "Raise r.Shadow.Virtual.MaxPhysicalPages", "Turn off caching with r.Shadow.Virtual.Cache 0", "Lower screen percentage"]
        answer_index: 0
        explain: "Static page invalidations should be near zero. Find the actors that invalidate the static cache and switch them to Movable."
      - q: "Why should large shadow casters like buildings use Nanite, even if they are low poly?"
        choices: ["Nanite meshes have no shadows of their own, so a building costs nothing in the shadow pass and frees pages for the other meshes", "Nanite turns off WPO on all meshes that are near the building, so the cached pages around it are never invalidated by the wind", "Invalidations fully in the shadow of Nanite objects can be skipped, and Nanite renders into VSM far more cheaply", "Non-Nanite meshes cannot cast VSM shadows at all, so a building without Nanite would have no shadow in the level"]
        answer_index: 2
        explain: "Only Nanite occluders allow skipping those invalidations. Non-Nanite geometry is also much more expensive to render into VSM."
      - q: "Shadows show a checkerboard pattern or go missing, and a warning appears in the log. What happened?"
        choices: ["The lighting build is out of date", "Nanite streaming pool is full", "Contact shadows are on", "The physical page pool overflowed"]
        answer_index: 3
        explain: "If Pages exceed Max Pages, corruption can occur. Raise r.Shadow.Virtual.MaxPhysicalPages or lower shadow resolution or the number of shadow-casting lights."
      - q: "A mesh with WPO shows parts of its shadow missing. What should you check first?"
        choices: ["Its bounds, for example set Max World Position Offset Displacement in the material", "The texture streaming pool, because the shadow needs the opacity mask at full resolution", "The Skylight intensity, because a dark sky makes parts of the shadow blend into the ground", "The mesh UV density, because shadow pages are picked by the texel size of the surface"]
        answer_index: 0
        explain: "Page marking uses object bounds. Bounds that are too small cause missing shadows. Too large bounds cause extra invalidations."
      - q: "A low-poly smooth sphere near the camera shows shadow terminator artifacts. What is the best fix?"
        choices: ["Raise r.Shadow.Virtual.NormalBias for the whole project", "Add more polygons to that mesh, or a more detailed LOD", "Turn off VSM for the whole level in the settings", "Lower Source Angle to 0 on the Directional Light"]
        answer_index: 1
        explain: "Adding geometry reduces the problem without hurting other shadows. Raising normal bias loses fine shadow detail everywhere."
      - q: "An artist assigns a Translucent material to a Nanite mesh. What happens?"
        choices: ["It renders as translucent with a small cost", "The mesh becomes a non-Nanite mesh automatically and keeps the material", "The editor crashes on save, and the material has to be removed from the mesh in a text editor", "A default material is assigned and a warning appears in the Output Log"]
        answer_index: 3
        explain: "Nanite supports Opaque and Masked blend modes. For unsupported material types, a default material is used and a warning is logged."
      - q: "The Nanite Overdraw view is very hot on a dense masked foliage patch. Why can masked materials look worse there?"
        choices: ["All evaluated pixels, including masked-out ones, count as overdraw", "Masked materials are not supported by Nanite and fall back to opaque", "Masked materials disable VSM for the patch", "Overdraw only counts translucent pixels, and masked pixels are treated as translucent"]
        answer_index: 0
        explain: "Nanite Overdraw adds all evaluated pixels, including masked-out ones. Small, closely stacked objects create more overdraw."
      - q: "The shadow projection pass is too expensive. What should you try before lowering SMRT ray and sample counts?"
        choices: ["Disable async compute in the shipping build and move the pass to the CPU threads", "Increase clipmap levels on the Directional Light", "Reduce Source Radius on local lights or Source Angle on the Directional Light", "Turn off page caching, so that each page is traced only once and then dropped again"]
        answer_index: 2
        explain: "Projection cost depends on samples across the screen, not on pages or caching. Softer shadows use more rays, so reduce the light size first."
    flavors:
      _default: {why: "Nanite and VSM make big scenes possible. They also have clear rules. Break them and the frame cost jumps."}
      tech_art: {why: "You set the rules for WPO, bounds and Nanite use that every artist follows.", do: "Write a 5-line team rule sheet: when to use WPO, required Disable Distance, and which meshes must be Nanite."}
      lookdev: {why: "Soft shadows come from light size. Know what that costs before you raise Source Radius."}
      cinematics: {why: "Close-ups with moving foliage can blow the shadow budget. r.Shadow.Virtual.MaxDOFResolutionBias can help for out-of-focus areas."}

  - id: TAQ28
    rank: 4
    difficulty: master
    specializations: [tech_art]
    subjects: [substrate, materials, layering, shading, performance]
    required_spine: false
    required: true
    title: Layered materials with Substrate
    brief: "Substrate is the newer material system in Unreal that replaces the fixed shading models. In Substrate you build a material from Slabs, where a Slab describes one layer of matter such as metal or a clear coat. You can put Slabs on top of each other or mix them side by side. This gives real layering, but each extra Slab costs more to light. In this quest you build one layered material and one blended material, read their cost in the Substrate panel, and try a cheaper way to blend."
    time_min: 120
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-substrate-materials-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/substrate-materials-in-unreal-engine"
    checklist:
      - "Use a test project that has Substrate turned on. To make one, create a project from the Third Person template, open Project Settings, go to Rendering, turn on Substrate materials and restart the editor. In Project Settings > Rendering, check which GBuffer format it uses."
      - "Create a material named M_Sub_CarPaint. Use a metal Slab as the base and put a clear coat Slab on top of it with a Substrate Vertical Layer node. Expose Top Thickness as a parameter."
      - "Create a material named M_Sub_WetGround. Mix two Slabs side by side with a Substrate Horizontal Blend node, and drive the mix with a mask texture."
      - "In the Material Editor, open Window > Substrate and read the stats for both materials. Note the bytes per pixel and any simplification that is reported."
      - "Turn on Use Parameter Blending on the last operator node before the root node. Compare the stats and the look with the earlier result."
      - "In the level, put both materials on screen. Check the view modes View Modes > Substrate > Material Count and Material Classification."
    done_when: "Send screenshots of both graphs, the Substrate panel with and without parameter blending, and the Material Classification view. Add 3 to 5 lines that say which version you would ship and why."
    xp: 250
    verify_type: screenshot
    quiz:
      - q: "A Substrate Slab is made of two parts. Which ones?"
        choices: ["Base Color and Metallic", "An interface and a medium", "A front face and a back face", "A shading model and a blend mode"]
        answer_index: 1
        explain: "The interface is where light meets the surface (Roughness, Normal, F0, F90). The medium is the matter below, defined mainly by Mean Free Path and Diffuse Albedo."
      - q: "Substrate uses F0 / Diffuse Albedo instead of Base Color / Specular / Metalness. What F0 range fits most dielectrics?"
        choices: ["About 0.02 to 0.06 linear", "About 0.5 to 1.0 linear", "Exactly 0.18 linear", "Always 1.0 linear"]
        answer_index: 0
        explain: "Dielectrics usually sit between 0.02 and 0.06 in linear space. Conductors go from beyond 0.5 up to 1."
      - q: "You need varnish over wood, with the wood look changed by the coat thickness. Which operator?"
        choices: ["Substrate Horizontal Blend", "Substrate Add Operator", "Substrate Vertical Layer", "Substrate Select Operator"]
        answer_index: 2
        explain: "Vertical Layer puts a Top slab over a Bottom slab and uses Top Thickness for transmittance and scattering. It fits car paint, varnish and wetness."
      - q: "Why should you avoid the Substrate Add operator in most materials?"
        choices: ["It only works on translucent materials and shows an error on opaque surfaces", "It is removed in UE 5.8, so materials that use it will stop compiling after an update", "It forces Adaptive GBuffer for the whole project, even when only one material uses it", "It can send out more energy than comes in, so it is not physically plausible"]
        answer_index: 3
        explain: "Add can produce more outgoing energy than incoming energy. Use it only when art direction matters more than physical plausibility."
      - q: "Where do you enable Use Parameter Blending in a graph with several operators?"
        choices: ["Only on the rightmost operator before the root node; the others then blend automatically", "On every operator by hand, starting with the leftmost one and ending at the root node", "On the root node only, in its Details panel, for the whole graph of the material", "In Project Settings only, under Rendering > Substrate, for every material at once"]
        answer_index: 0
        explain: "Only the rightmost operator before the Material Root node must have it on. All other nodes in the graph apply parameter blending automatically."
      - q: "A material uses two BSDFs per pixel without parameter blending. What does that do to lighting cost?"
        choices: ["No change, the second slab is free", "About 10% more", "About twice as slow as one BSDF", "Lighting cost goes down"]
        answer_index: 2
        explain: "Lighting two BSDFs is twice as slow as one. More slabs after that raise the cost almost linearly."
      - q: "Your project targets 60 Hz on many platforms. Which GBuffer format fits, and why?"
        choices: ["Adaptive, because it is faster", "Blendable, because it has fixed memory, predictable speed and parity with the legacy path", "Adaptive, because it lowers the cook time and gives the same frame cost on every platform", "Neither, Substrate cannot run at 60 Hz on any platform and must be disabled for such a project"]
        answer_index: 1
        explain: "Blendable targets 60 Hz projects with fixed memory and speed similar to non-Substrate. Adaptive costs more and adds about 15% cook time."
      - q: "On Blendable GBuffer, a material with Haziness and Glints looks plain. Why?"
        choices: ["The textures did not stream in, so the material shows only its flat default values", "The material needs Nanite on the mesh before Haziness and Glints are drawn", "Glints only work on mobile, and Haziness only works with the Path Tracer", "Those features are not supported on Blendable GBuffer, so they are visually missing"]
        answer_index: 3
        explain: "On Blendable GBuffer, F90, per-pixel MFP diffusion SSS, Haziness and Glints are not supported. The feature is simply missing."
      - q: "Where do you see why a Substrate material was simplified?"
        choices: ["In the Substrate panel (Window > Substrate) in the Material Editor", "In the Output Log only, as a warning that is printed when the material is compiled and saved", "In the tooltip of the material asset in the Content Browser window", "In stat unit, which adds a line for each material on screen that was simplified by Substrate"]
        answer_index: 0
        explain: "When a material goes over the closure or bytes-per-pixel budget it is simplified. The reasons show in the Substrate stats panel."
      - q: "A lead wants to convert all legacy materials with Convert to Substrate before a release. What is the risk?"
        choices: ["None, you can switch back any time", "Converted materials lose their textures, and every Texture Sample must be assigned again", "Conversion is permanent, and converted materials render black if Substrate is turned off", "It doubles texture memory, because each converted material keeps a copy of its old textures"]
        answer_index: 2
        explain: "Explicit conversion cannot be reverted, and Substrate materials render black when Substrate is disabled. Legacy materials already compile to Substrate without conversion."
      - q: "What can Substrate layering do that legacy Material Layers and Material Attributes cannot?"
        choices: ["Blend two materials across a surface with a mask, for example rust that is painted over metal", "Use material functions to share a group of nodes between several materials", "Use texture parameters that an artist can swap in a Material Instance", "Put a real slab of matter on top of another, for example a top layer with colored transmittance"]
        answer_index: 3
        explain: "Material Layers only blend parameters side by side (horizontal mixing). They cannot layer a slab of matter on top of another."
      - q: "The Material Classification view shows red tiles over a large part of the screen. What does red mean?"
        choices: ["Multiple slabs are mixed or layered in the tile, or Anisotropy is on", "The material failed to compile, and the default material is drawn in the tile", "The texture pool is over budget, and the tile uses textures at a lower mip level", "The tile uses a simple legacy slab that could be made cheaper to shade"]
        answer_index: 0
        explain: "Green is a simple material, yellow is a single slab with features, red is several slabs or Anisotropy. Red over large areas means high lighting cost."
    flavors:
      _default: {why: "Substrate replaces the fixed shading models. Layering is now real, and so is its cost."}
      tech_art: {why: "You set the slab budget and decide when parameter blending is on.", do: "Try r.Substrate.BytesPerPixel at a lower value and note which of your materials get simplified first."}
      lookdev: {why: "Car paint, wet surfaces and coated metals look more correct with real layers. Know the price."}
      cinematics: {why: "Cinematic shots can use Adaptive GBuffer features that a 60 Hz game cannot afford."}

  - id: TAQ29
    rank: 4
    difficulty: master
    specializations: [tech_art]
    subjects: [capstone, tools, pipeline, validation, material-functions, scalability]
    required_spine: false
    required: true
    capstone: true
    title: "CAPSTONE: Pipeline piece"
    brief: "The most useful work of a technical artist is often a tool or a library that other people use every day. In this quest you make one finished piece that someone else can install and use. You choose between an import or naming tool and a library of material functions, write the documentation, let another person test it, and check how a scene that uses it holds up on Low and Epic quality. Everything you need to build is listed in the steps."
    time_min: 480
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/data-validation-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/recommended-asset-naming-conventions-in-unreal-engine-projects"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/importing-assets-using-interchange-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/material-functions-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/scripting-the-unreal-editor-using-python"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/scalability-reference-for-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Pick one path. Path A is an import or naming tool: an Interchange pipeline, an Editor Utility Widget (EUW_), or a validator based on EditorValidatorBase. Path B is a library of at least 6 material functions with names that start with MF_."
      - "Write short documentation. It should say what the piece does, how to install it, its rules or inputs, and one known limit."
      - "For Path A, make the tool report clear errors in the Message Log, and run it on a full folder. For Path B, build 3 materials from the library and document the inputs of each function."
      - text: "Give it to at least one other person. They use it on their own assets and tell you what worked and what did not. If nobody can test it, migrate it into a new empty project and use it there yourself, following only your documentation."
        needs_others: true
      - text: "Fix at least one problem that the test found, and write the change down in a change log."
        needs_others: true
      - "Do a scalability check. Take one scene that uses your work, capture it on Low and on Epic from the same camera bookmark with stat unit visible, and note the biggest difference."
    done_when: "Send a writeup that contains the documentation of the tool or library, a short video clip (30 seconds or less) or screenshots of it running, the feedback from the test and your fix, and the Low and Epic screenshots with 2 to 3 lines on the result. A mentor must approve it."
    done_when_solo: "Writeup with: a link to the tool or library and its docs, a test project that proves it on 20 or more assets (screenshots of the results and any errors it caught), and the Low vs Epic screenshots with 2–3 lines on the result. Approved by a mentor."
    xp: 400
    verify_type: mentor
    quiz:
      - q: "What is often the most useful work of a technical artist?"
        choices: ["A single beautiful screenshot of one scene", "A tool or a library that other people use every day", "The largest and sharpest texture in the whole project", "A level with the most lights in the project"]
        answer_index: 1
        explain: "A technical artist makes the work of others faster and safer. The best pieces are used daily without anyone thinking about them."
      - q: "What is Path A of this capstone?"
        choices: ["An import or naming tool", "A library of material functions", "A lit test room for materials", "A character rig with controls"]
        answer_index: 0
        explain: "Path A is a tool that controls how assets come in or how they are named. It can be an Interchange pipeline, an Editor Utility Widget or a validator."
      - q: "What is Path B of this capstone?"
        choices: ["A Python script that renames levels", "A set of 3 Niagara systems", "A validator based on EditorValidatorBase", "A library of at least 6 material functions"]
        answer_index: 3
        explain: "Path B is a library that material artists build on. The MF_ prefix marks each asset as a material function."
      - q: "What does a validator based on EditorValidatorBase do?"
        choices: ["It renders a scene at two quality levels and compares the two final results", "It writes the documentation for you", "It checks assets against your rules and reports the ones that break them", "It imports meshes from other programs and gives them the right prefix and the right folder"]
        answer_index: 2
        explain: "A validator is part of the Data Validation system. It looks at an asset, decides if it follows the rule, and reports an error if it does not."
      - q: "What does the short documentation of your piece say?"
        choices: ["What it does, how to install it, its rules or inputs, and one limit", "How many hours you worked on it, day by day, from the start", "Which other tools you looked at before you started", "Why the other tools are worse than yours, with one example for each"]
        answer_index: 0
        explain: "These points let a new user install the piece and use it correctly. The known limit tells them where it stops being useful."
      - q: "Where does a Path A tool report its errors?"
        choices: ["In a text file saved on the desktop", "In the Message Log, as clear errors", "In the name of the asset, as a suffix", "In the README only, in a list at the end"]
        answer_index: 1
        explain: "The Message Log is where the editor shows errors to the user. Clear errors there tell an artist which asset is wrong and why."
      - q: "What do you do with the library on Path B?"
        choices: ["You run it on a full folder of meshes and textures", "You pack it into one large function with many inputs", "You hide the inputs of each function from the users", "You build 3 materials from it and document the inputs"]
        answer_index: 3
        explain: "The three materials prove that the functions work together. The documented inputs tell other artists how to use each function."
      - q: "Who tests your piece?"
        choices: ["Nobody, because you built it yourself", "Only the mentor, some time after the quest has been approved", "At least one other person, who uses it on their own assets", "A person who has never opened Unreal Engine"]
        answer_index: 2
        explain: "Other assets bring cases you did not think of. The tester tells you what worked and what did not."
      - q: "Nobody can test your piece. What do you do?"
        choices: ["Migrate it into a new empty project and use it from your documentation", "Skip the test and write that it works", "Test it in the project where you built it, with the same assets that you used before", "Ask the mentor to approve it without a test and explain why none was done"]
        answer_index: 0
        explain: "An empty project has none of your helpers or settings. If the piece installs and works there from the documentation alone, others can use it too."
      - q: "What do you do after the test found problems?"
        choices: ["You remove the feature that caused them and say nothing about it to anyone", "You fix at least one problem and write the change down in a change log", "You start again from zero and build the piece a second time, with another approach", "You ask the tester to fix them, because the tester knows best what went wrong in the test"]
        answer_index: 1
        explain: "A change log records what was changed and why. Users of the piece can see that feedback leads to fixes."
      - q: "How do you do the scalability check?"
        choices: ["You run the tool two times in a row and compare the time of both runs", "You open the scene on two monitors and compare the picture on each of them", "You render the scene with Movie Render Queue at two resolutions", "You capture one scene on Low and on Epic with stat unit visible"]
        answer_index: 3
        explain: "Low and Epic are quality levels of the engine. The two captures with stat unit show how a scene that uses your work holds up on each, and you note the biggest difference."
      - q: "Why do you take the Low and the Epic capture from the same camera bookmark?"
        choices: ["The bookmark sets the quality level of the viewport for you", "The bookmark turns on stat unit for both captures", "The view is then the same, so only the quality level differs", "The bookmark saves the screenshots to the same folder"]
        answer_index: 2
        explain: "The numbers of stat unit depend on what the camera sees. With one fixed view, the two captures can be compared fairly."
    flavors:
      _default: {why: "A tech artist's best work is the tool other people use every day without thinking about it."}
      tech_art: {why: "This is your portfolio proof: a pipeline piece that others used, with docs, tested at more than one quality level.", do: "Add a command line run with -run=DataValidation, or a one-click install, so a new team member can start in 5 minutes."}

  - id: TAQ30
    rank: 4
    difficulty: master
    specializations: [tech_art]
    subjects: [texture-streaming, memory, textures, profiling]
    required_spine: false
    required: false
    title: Texture memory on a budget
    brief: "Texture streaming is the system that loads only the texture detail that is needed for what the camera sees. It works inside a fixed amount of memory called the streaming pool. When the pool is too small, the streamer loads lower detail versions (mips) of some textures, and those surfaces look blurry. In this quest you read the streaming numbers of a level, make the pool too small on purpose, find one object that wastes or lacks texture detail, and fix it."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/texture-streaming-overview-for-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/texture-streaming-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/texture-streaming-configuration-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/texture-streaming-metrics-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/building-texture-streaming-data-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open a level that uses many textures. If you have none, place several mannequins and other textured meshes in the level of the template. Run Build > Build Texture Streaming."
      - "Start PIE and run the console command STAT STREAMING. Write down the values of Streaming Pool, Required Pool and Wanted Mips."
      - "Lower the value of r.Streaming.PoolSize until Required Pool goes over 100%. Take a screenshot that shows which surfaces go blurry first."
      - "Check the view modes Mesh UV Density Accuracy and Material Texture Scale Accuracy. Find one object that is shown in red or green."
      - "Fix one cause. For example, change the Streaming Distance Multiplier on a mesh, or fix a texture that is far too big for its size on the screen."
      - "Set the pool back to its old value. Compare the STAT STREAMING numbers from before and after your fix."
    done_when: "Send STAT STREAMING screenshots from before and after, and one screenshot of an accuracy view mode with the problem object marked. Add 3 to 4 lines on what you changed and why."
    xp: 120
    verify_type: writeup
    quiz:
      - q: "When the ideal resolutions do not fit in the pool, what does the streamer do?"
        choices: ["It lowers all textures by one mip at once, again and again, until the plan fits", "It drops one mip at a time on selected textures until the plan is under budget", "It stops loading new textures", "It raises the pool size automatically, by as much as the plan needs, until all of the mips fit"]
        answer_index: 1
        explain: "The streamer reduces the planned quality for selected textures, one mip at a time, until the plan fits the streaming pool."
      - q: "Which mips does the streamer drop first when it must drop some?"
        choices: ["Landscape textures, as they are large", "Character textures, from the top mip", "Visible mips on screen, with the largest textures first", "Mips that are not visible, least recently seen first"]
        answer_index: 3
        explain: "Retention keeps landscape, forced and visible mips, then character and small textures. It drops non-visible mips, least recently seen first."
      - q: "What does r.Streaming.PoolSize include?"
        choices: ["UI textures, NeverStream textures, cubemaps and streaming textures", "Only streaming textures, and no other kind of texture", "Only the textures of the current level, of any type and any group", "Only render targets and the textures of the UI widgets"]
        answer_index: 0
        explain: "The pool contains UI, NeverStream, cubemaps and streaming textures. On some platforms it can also hold non-texture resources. 0 means unlimited."
      - q: "You set a global r.Streaming.MipBias to fit a small pool. Which textures are NOT affected?"
        choices: ["Character and weapon textures", "Terrain and Landscape textures", "UI textures and fonts", "Normal maps of props"]
        answer_index: 1
        explain: "The bias has no effect on terrain and landscape textures. For HLOD textures it does not limit max resolution, and for lightmaps it only limits max resolution."
      - q: "For a showcase build you want every used texture at full resolution. Why use r.Streaming.FullyLoadUsedTextures instead of turning streaming off?"
        choices: ["Turning streaming off is not possible in a packaged build, so the cvar is the only way to do it", "They do the same thing", "Turning streaming off loads all mips of every texture, even unused ones, so it needs more memory", "FullyLoadUsedTextures also raises the pool size by itself, so no texture can ever go over the budget"]
        answer_index: 2
        explain: "With the streamer disabled, all mips load even for textures never used. FullyLoadUsedTextures only loads textures that are used."
      - q: "STAT STREAMING shows Required Pool at 130%. What does that mean?"
        choices: ["Some textures will not load at their required resolution", "Memory is leaking", "The streaming data of the level has not been built at all yet", "The GPU is out of VRAM, and the game will crash on the next level"]
        answer_index: 0
        explain: "Required Pool can go over 100% of the streaming pool. Then the streamer makes a compromise and some textures stay below the required resolution."
      - q: "Textures keep streaming in and out in a loop. Non-streaming memory swings more than the Safety Pool. What is the fix?"
        choices: ["Raise r.Streaming.Boost, so that every texture asks for a higher resolution than before", "Turn off mips on all textures", "Lower r.Streaming.FramesForFullUpdate so the streamer reacts faster to each swing", "Reduce those non-streaming allocations or increase the safety pool (MemoryMargin)"]
        answer_index: 3
        explain: "If a normal fluctuation is bigger than the safety pool, the streamer keeps changing its budget. This can create endless cycles of streaming in and out."
      - q: "What must be true about the Temporary Pool (r.Streaming.MaxTempMemoryAllowed)?"
        choices: ["It must be 0 on consoles, because their memory is fixed and no temporary allocation is allowed there at all", "It must be at least as large as the largest resource to stream, but not so large that it wastes memory", "It must be equal to the streaming pool, so that every texture in the pool can be updated in the same frame", "It only matters in the editor"]
        answer_index: 1
        explain: "Too small slows streaming. Too large wastes reserved memory and gives less control over load order."
      - q: "Streaming is slow and Inflight Requests often shows 0. What does that suggest?"
        choices: ["The streamer is not using all the IO bandwidth; raise MaxTempMemoryAllowed or lower FramesForFullUpdate", "The disk is full, so the streamer cannot read any new mips from it and waits until space has been freed", "All textures are already loaded at full resolution, so no request is needed and nothing has to be changed", "The pool is too big, so the streamer has nothing to drop and stops sending requests until memory is used up"]
        answer_index: 0
        explain: "0 inflight while still streaming means the IO system is idle. Each fix has a cost: more wasted memory, or longer update time."
      - q: "In the texture streaming accuracy view modes, what does red mean?"
        choices: ["Good data, nothing missing", "1 extra mip is loaded there", "2 or more mips missing", "The shader failed to build"]
        answer_index: 2
        explain: "Red is 2X+ mips missing, yellow 1 mip missing, white good, cyan 1 extra mip, green 2X+ extra mips. A checkerboard means the shader could not build."
      - q: "A material samples a texture with world-position UVs. What does the streaming build assume for it?"
        choices: ["It skips the texture completely", "It always loads the top mip", "It uses the Landscape rules", "UV channel 0 with a scale of 1"]
        answer_index: 3
        explain: "The analysis cannot follow world position or vertex color sampling. It then assumes UV channel 0 and a scale of 1."
      - q: "You want to test if the streamer loads the right mips at the right time, with no caching or prefetch. Which setting helps?"
        choices: ["r.Streaming.UseAllMips 1", "r.Streaming.DropMips 2", "r.TextureStreaming 0", "r.Streaming.Boost 10"]
        answer_index: 1
        explain: "DropMips 2 keeps only visible mips, so caching and prefetching are off. Use it with the Required Texture Resolution view mode."
    flavors:
      _default: {why: "Texture memory is the first budget to break on low-end hardware. The streamer decides what gets blurry."}
      tech_art: {why: "Over-budget warnings are your problem to diagnose. You need to read STAT STREAMING, not guess.", do: "Set r.Streaming.PoolSize per memory bucket in a device profile, for example with +CVars_Smallest, and test the smallest one."}
