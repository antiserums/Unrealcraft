    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/nanite-virtualized-geometry-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/nanite-technical-details"
    checklist:
      - "Build a test level: Nanite rock and building meshes, one non-Nanite mesh, and a foliage mesh with a WPO wind material. Use one Directional Light."
      - "With a still camera, switch the viewport to View Modes > Virtual Shadow Map > Cached Page. Screenshot the red areas."
      - "Use the Shadow Casters view to find what invalidates pages. Fix one cause: set World Position Offset Disable Distance, or change Shadow Cache Invalidation Behavior."
      - "Run r.ShaderPrintEnable 1 and r.Shadow.Virtual.Stats 1. Note Allocated, Cached and Invalidated pages before and after your fix."
      - "Open the Nanite Visualization menu and check Overdraw and Evaluate WPO on your foliage."
      - "Capture a short Unreal Insights trace and find the Shadow Depths cost for VSM before and after."
    done_when: "Before and after Cached Page screenshots, the VSM stats numbers before and after, and 4–6 lines: what caused the invalidations, what you changed, and the change in Shadow Depths time."
    xp: 250
    verify_type: writeup
    quiz:
      - q: "How do Virtual Shadow Maps keep a 16k x 16k virtual resolution affordable?"
        choices: ["They render the full 16k map once per level load", "They use lower resolution on consoles only", "They split the map into 128x128 pages, render only pages needed for on-screen pixels, and cache them between frames", "They bake shadows into lightmaps"]
        answer_index: 2
        explain: "Pages are allocated and rendered only as needed, based on the depth buffer, and cached unless moving objects or lights invalidate them."
      - q: "In the Cached Page view, what does a blue page mean?"
        choices: ["Only the static page is cached, the dynamic part is not", "The page is fully cached", "The page overflowed the pool", "The page belongs to a point light"]
        answer_index: 0
        explain: "Green is cached, red is uncached. Blue means only the static page is cached and the dynamic part is uncached."
      - q: "Your foliage uses WPO wind and the shadow cost is high even with a still camera. Why?"
        choices: ["WPO disables Nanite", "WPO forces ray-traced shadows", "Foliage never uses VSM", "Geometry with WPO invalidates its cached pages every frame, because the real offset is not known until render"]
        answer_index: 3
        explain: "The cache must assume a WPO object needs redrawing. Use World Position Offset Disable Distance or other ways to stop animation far away."
      - q: "A static WPO mesh never really moves but keeps invalidating shadows. Which Shadow Cache Invalidation Behavior fits?"
        choices: ["Always", "Rigid", "Auto", "None of them, turn off shadows"]
        answer_index: 1
        explain: "Rigid suppresses invalidations caused by, for example, World Position Offset. Static also ignores transform changes, and moving it gives undefined results."
      - q: "VSM stats show many invalidated static pages. What does Epic recommend?"
        choices: ["Switch the actors that cause them to Movable", "Raise r.Shadow.Virtual.MaxPhysicalPages", "Turn off caching with r.Shadow.Virtual.Cache 0", "Lower screen percentage"]
        answer_index: 0
        explain: "Static page invalidations should be near zero. Find the actors that invalidate the static cache and switch them to Movable."
      - q: "Why should large shadow casters like buildings use Nanite, even if they are low poly?"
        choices: ["Nanite meshes have no shadows", "Nanite turns off WPO", "Invalidations fully in the shadow of Nanite objects can be skipped, and Nanite renders into VSM far more cheaply", "Non-Nanite meshes cannot cast VSM shadows"]
        answer_index: 2
        explain: "Only Nanite occluders allow skipping those invalidations. Non-Nanite geometry is also much more expensive to render into VSM."
      - q: "Shadows show a checkerboard pattern or go missing, and a warning appears in the log. What happened?"
        choices: ["The lighting build is out of date", "Nanite streaming pool is full", "Contact shadows are on", "The physical page pool overflowed"]
        answer_index: 3
        explain: "If Pages exceed Max Pages, corruption can occur. Raise r.Shadow.Virtual.MaxPhysicalPages or lower shadow resolution or the number of shadow-casting lights."
      - q: "A mesh with WPO shows parts of its shadow missing. What should you check first?"
        choices: ["Its bounds, for example set Max World Position Offset Displacement in the material", "The texture streaming pool", "The Skylight intensity", "The mesh UV density"]
        answer_index: 0
        explain: "Page marking uses object bounds. Bounds that are too small cause missing shadows. Too large bounds cause extra invalidations."
      - q: "A low-poly smooth sphere near the camera shows shadow terminator artifacts. What is the best fix?"
        choices: ["Raise r.Shadow.Virtual.NormalBias for the whole project", "Add more polygons to that mesh, or a more detailed LOD", "Turn off VSM", "Lower Source Angle to 0"]
        answer_index: 1
        explain: "Adding geometry reduces the problem without hurting other shadows. Raising normal bias loses fine shadow detail everywhere."
      - q: "An artist assigns a Translucent material to a Nanite mesh. What happens?"
        choices: ["It renders as translucent with a small cost", "The mesh becomes non-Nanite automatically", "The editor crashes on save", "A default material is assigned and a warning appears in the Output Log"]
        answer_index: 3
        explain: "Nanite supports Opaque and Masked blend modes. For unsupported material types, a default material is used and a warning is logged."
      - q: "The Nanite Overdraw view is very hot on a dense masked foliage patch. Why can masked materials look worse there?"
        choices: ["All evaluated pixels, including masked-out ones, count as overdraw", "Masked materials are not supported by Nanite", "Masked materials disable VSM", "Overdraw only counts translucent pixels"]
        answer_index: 0
        explain: "Nanite Overdraw adds all evaluated pixels, including masked-out ones. Small, closely stacked objects create more overdraw."
      - q: "The shadow projection pass is too expensive. What should you try before lowering SMRT ray and sample counts?"
        choices: ["Disable async compute in the shipping build", "Increase clipmap levels", "Reduce Source Radius on local lights or Source Angle on the Directional Light", "Turn off page caching"]
        answer_index: 2
        explain: "Projection cost depends on samples across the screen, not on pages or caching. Softer shadows use more rays, so reduce the light size first."
    flavors:
      _default: {why: "Nanite and VSM make big scenes possible. They also have clear rules. Break them and the frame cost jumps."}
      tech_art: {why: "You set the rules for WPO, bounds and Nanite use that every artist follows.", do: "Write a 5-line team rule sheet: when to use WPO, required Disable Distance, and which meshes must be Nanite."}
      lookdev: {why: "Soft shadows come from light size. Know what that costs before you raise Source Radius."}
      cinematics: {why: "Close-ups with moving foliage can blow the shadow budget. r.Shadow.Virtual.MaxDOFResolutionBias can help for out-of-focus areas."}

