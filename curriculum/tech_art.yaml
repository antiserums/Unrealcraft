    checklist:
      - "In your DCC (Maya, 3ds Max or Blender) take a simple skinned mesh, duplicate it, push some vertices (for example an Inflate or a Wink shape) and create a blend shape / morph channel from the duplicate. In Maya the Unreal name will be [BlendShapeNode]_[BlendShape]; in 3ds Max it is the Morpher channel name, and the Morpher must sit before Skin in the stack."
      - "Export the base mesh and its joints to FBX. Enable Animations and all Deformed Models (Maya) or Deformations (Max) options in the export dialog."
      - "Import into Unreal with Import Morph Targets enabled. Name the result SK_MorphTest. Open it and use the Morph Target Previewer to drag the weight from 0 to 1."
      - "Turn on Show > Mesh Overlay > Selected MorphTarget Vertices and select the morph target to see which vertices it moves. Right-click it and use Copy Morph Target Names."
      - "Create ABP_MorphTest. In the Event Graph add a float variable Amount and call Set Morph Target (Target self, Morph Target Name from your copied name, Value Amount) each update. Assign the ABP to a mesh in the level and change Amount in the Details panel."
      - "Open Project Settings > Rendering > Optimizations and find Use GPU for computing morph targets. Write one line about when you would turn it on."
    done_when: "Screenshot of the Morph Target Previewer with the weight at 1 and the vertex overlay on, plus a screenshot of the Set Morph Target node in ABP_MorphTest and your one-line note on GPU morph targets."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You export a wink blend shape from Maya. What name will the morph target have in Unreal?"
        choices: ["[BlendShapeNode]_[BlendShape]", "The mesh name plus _Morph", "The name of the target mesh only", "Morph_0, Morph_1 and so on"]
        answer_index: 0
        explain: "For Maya the name is the blend shape node name joined to the blend shape name. In 3ds Max it is the channel name in the Morpher modifier."
      - q: "In 3ds Max, where must the Morpher modifier sit in the stack?"
        choices: ["After the Skin modifier", "Anywhere, the order does not matter", "Before the Skin modifier", "It must be collapsed into the mesh"]
        answer_index: 2
        explain: "The page says the Morpher modifier needs to be before the Skin modifier in the stack."
      - q: "Which FBX export options are required so morph targets come through?"
        choices: ["Smoothing Groups and Triangulate", "Animations plus all Deformed Models / Deformations options", "Embed Media and Bake Animation", "Only Geometry, animation must be off"]
        answer_index: 1
        explain: "For morph targets you must enable the Animations checkbox and all of the Deformed Models (Maya) or Deformations (Max) options."
      - q: "You import new morph targets onto a Skeleton that already has morph targets applied. What happens to the old ones?"
        choices: ["They are kept and the new ones are appended", "The import fails", "They are merged by name", "The existing ones are overridden"]
        answer_index: 3
        explain: "If you import and add morph targets to an existing Skeleton with morph targets already applied, the existing ones will be overridden."
      - q: "A facial animation in the DCC uses twenty blend shapes. What do you get after FBX import?"
        choices: ["Twenty Animation Sequences", "A Pose Asset only", "One Animation Sequence, with the morph data available as curves", "Twenty static mesh morphs"]
        answer_index: 2
        explain: "Any number of morph targets can drive a single animation. It imports as one Animation Sequence and you still reach each morph target through curves."
      - q: "What is the valid range for the Value pin of Set Morph Target?"
        choices: ["0.0 to 1.0", "0 to 100", "-1 to 1", "Any positive integer"]
        answer_index: 0
        explain: "The Morph Target Previewer page lists Value as a float between 0.0 and 1.0."
      - q: "How do you see which vertices a morph target moves?"
        choices: ["Enable Wireframe view", "Show > Mesh Overlay > Selected MorphTarget Vertices, then select the morph", "Open the Skeleton Tree and select the bone", "Use stat morph"]
        answer_index: 1
        explain: "The Morph Target Debug View Mode is under Show > Mesh Overlay > Selected MorphTarget Vertices. Then pick any morph in the previewer."
      - q: "When would you enable Use GPU for computing morph targets?"
        choices: ["On any platform, it is always faster", "Only when using Nanite skeletal meshes", "Only for mobile", "When the game is CPU bound, you have GPU time to spare, and the platform supports Shader Model 5"]
        answer_index: 3
        explain: "The setting is in Project Settings > Rendering > Optimizations. It needs Shader Model 5 and moves the work off the CPU, so it helps when you are CPU bound with spare GPU."
