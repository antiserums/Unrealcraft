        answer_index: 3
        explain: "Anything inherited can be overridden for a child emitter, modules can be added, and values can be reverted to the parent value."
      - q: "Which emitter-level behaviors can also be overridden in a child, according to the Overview?"
        choices: ["Only the renderer and its material", "Spawning, lifetime, looping and bursts", "Only the material of the Sprite Renderer", "None; only particle modules can change"]
        answer_index: 1
        explain: "The Overview lists emitter-level behaviors such as spawning, lifetime, looping and bursts as overridable in children."
