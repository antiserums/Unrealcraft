      - q: "How many masks can one image file hold at most?"
        choices: ["Two, in the red and green", "Three, one per RGB channel", "Four, one per RGBA channel", "As many as you want to add"]
        answer_index: 2
        explain: "You only have four channels (R, G, B, A) in an image file, so use each one wisely."
      - q: "A mask has bad compression artifacts. Which channel does the page suggest trying first?"
        choices: ["Red", "Blue", "Alpha", "Green"]
        answer_index: 3
        explain: "Because of a DirectX quirk, the green channel often gets the best compression. If that does not help, try the Alpha channel."
      - q: "You turn off sRGB on a mask texture that a Material already samples. What happens?"
        choices: ["Nothing; the Material updates by itself and picks the right Sampler Type for it", "The Material fails to compile until you change the Sampler Type to Linear Color", "The mask turns black", "The texture loses its alpha channel, and the Material reads white in its place"]
        answer_index: 1
        explain: "Existing Texture Sample nodes keep their old Sampler Type. The Material fails to compile and shows a message in the Stats log until you change the type from Color to Linear Color."
      - q: "Why should masks not have sRGB enabled?"
        choices: ["Masks should not be gamma corrected", "sRGB makes the texture larger on disk", "sRGB is only for normal maps", "sRGB disables the alpha channel"]
        answer_index: 0
        explain: "Masks are data, not color. The page says to uncheck sRGB because masks should not be gamma corrected, and this also helps sharpness."
      - q: "What does the page say is a great way to get many variations from one mask setup?"
        choices: ["Making a new Material for each color you need", "Importing a new mask for each color", "Combining texture masks with Material Instances", "Using a higher texture resolution"]
        answer_index: 2
        explain: "A mask defines which areas get a property, and Material Instances let artists change the color or value of that area without editing the graph."
    flavors:
