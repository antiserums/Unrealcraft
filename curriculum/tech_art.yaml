        choices: ["Use the Screen Percentage slider in any editor viewport", "Set r.SetRes to 720p and play in a Standalone window", "Lower the resolution of the monitor in the system settings", "Use Movie Render Queue to render the shot at half size"]
        answer_index: 0
        explain: "Every editor viewport has a Screen Percentage slider so artists can inspect their content at the high and low ends of the range."
      - q: "How is the secondary screen percentage different from the primary one?"
        choices: ["It runs before the UI and scales the HUD as well", "It is controlled by the dynamic resolution heuristic", "It is static and cannot change dynamically in game", "It only applies to VR and is ignored on monitors"]
        answer_index: 2
        explain: "The secondary spatial upscale happens after TAAU and is static; it is set in config with r.SecondaryScreenPercentage.GameViewport."
      - q: "Automatic View Mip Bias on a Texture Sample only takes effect when which feature is on?"
        choices: ["Multisample Anti-Aliasing (MSAA) at 4x", "Temporal Anti-Aliasing Upsample (TAAU)", "Fast Approximate Anti-Aliasing (FXAA)", "Dynamic Resolution with a panic switch"]
        answer_index: 1
        explain: "Automatic View Mip Bias only happens when TAAU is enabled; TAA, MSAA and FXAA cannot use it."
    flavors:
      _default: {why: "Dynamic resolution and temporal upsample are how shipped games hold a frame rate on weak hardware without redoing content."}
      tech_art: {why: "Tech artists set the budgets and check that materials and thin geometry survive at low screen percentages.", do: "Find one texture that turns to noise at 50 percent and fix it with a Mip Bias input or by turning off Automatic View Mip Bias."}

  - id: TAQ108
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [gpu-memory, texture-streaming, profiling, memory]
    required_spine: false
    required: false
    title: Where did the VRAM go?
    brief: "VRAM is the memory of the graphics card. Textures, meshes and other render data are stored there, and the amount is limited. When it is full, textures become blurry or the game can crash. The Render Resource Viewer is a tool that lists every resource in GPU memory with its size and its owner, so you can see what uses the memory. In this quest you use it together with the stat streaming command to find the largest users of memory in a level."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/render-resource-viewer-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/texture-streaming-metrics-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a level with several skeletal meshes and static meshes. The level of the template works if you drag a few mannequins into it. Then open Tools > Render Resource Viewer."
      - "Sort the list by Size. Note the five largest resources, their type and their Owner."
      - "Search for the path of one skeletal mesh, for example the mannequin of the template (its name starts with SKM_), and record the total size of all its resources. Note the LOD index that is shown at the end of the owner path."
      - "Tick the Transient filter. Compare the totals with the filter on and with the filter off."
      - "Select an entry and press Ctrl+B to jump to the asset in the Content Browser."
      - "Run the console command stat streaming. Write down the values of Texture Pool, Streaming Pool, Required Pool, Wanted Mips and Cached Mips."
      - "Place 10 more props with textures in view, for example 10 more mannequins. Click Refresh in the viewer, and read both sets of numbers again."
    done_when: "Send a screenshot of the Render Resource Viewer sorted by size with your search applied, plus the stat streaming values before and after you added the props."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "When does the Render Resource Viewer update its data?"
        choices: ["Every frame, while the window is open and in focus", "When you save the level or any asset that is listed", "Only when the window opens and when you press Refresh", "Each time that a texture streams in or out of the pool"]
        answer_index: 2
        explain: "The viewer is a snapshot taken when the window opens. It does not update in real time; press Refresh for a new snapshot."
      - q: "A resource shows Owner as None. What does this mean?"
        choices: ["The resource owner is not tracked yet (tracked types are static meshes, skeletal meshes, textures and hair/groom)", "The resource leaked: its owner was destroyed, but the memory of the resource was never returned to the GPU pool", "The asset was deleted from the Content Browser, but the editor still holds the resource until the next restart", "The resource is transient: it lives for one frame only and is shared by render passes, so it can have no owner"]
        answer_index: 0
        explain: "None means the owner is not currently tracked. Tracked resources include static meshes, skeletal meshes, textures and groom assets."
      - q: "Which filter is unchecked by default, and what does it show?"
        choices: ["Resident: resources that the GPU can access right now, because all of their data is loaded into memory", "Streaming: streamable textures and meshes whose mips or LODs are loaded and dropped as the camera moves", "Render Target: buffers that the GPU writes to during a frame, such as the scene color and the shadow maps", "Transient: resources allocated only during the passes where they are active, sharing memory with others"]
        answer_index: 3
        explain: "Transient resources live only during their render passes and share memory with other resources; this filter is off by default."
      - q: "How do you get the total GPU memory of one skeletal mesh in the viewer?"
        choices: ["Open the Stats panel of the mesh editor and add up the listed sizes", "Search for the owner path; the totals show only the filtered results", "Sort by Type, then read the size on the first skeletal mesh row", "Press Ctrl+B on the mesh, then read the size in the asset tooltip"]
        answer_index: 1
        explain: "The search box matches Resource Name and Owner, and Resource Totals show the count and size of the filtered list."
      - q: "What does the Safety Pool in stat streaming represent?"
        choices: ["Memory reserved for unexpected non-streaming allocations, set by MemoryMargin under [TextureStreaming]", "Memory for textures that are forced in by gameplay code, set by the pool size under [TextureStreaming]", "Memory used while resizing textures, when the old and the new copy of a texture exist at the same time", "Mips that are no longer needed, but are kept in memory until other mips that are wanted need the space"]
        answer_index: 0
        explain: "Safety Pool comes from MemoryMargin in the Engine config and reserves memory for unexpected, non-streaming allocations."
      - q: "Required Pool shows more than 100 percent of the streaming pool. What follows?"
        choices: ["The engine grows the pool until every texture fits into it", "The game crashes as soon as the next texture is requested", "Some textures will not be loaded to their required resolution", "Cached mips are locked and can never be dropped again"]
        answer_index: 2
        explain: "If the required mip data exceeds the pool, the streamer makes a compromise and some textures stay below their required resolution."
      - q: "What are Cached Mips?"
        choices: ["Mips that are visible right now and were loaded during the last few frames", "Mips that are no longer needed but kept until other wanted mips need the memory", "Mips that are forced in by gameplay code and can never be dropped by the streamer", "Mips still being loaded from disk, which do not count for the pool yet"]
        answer_index: 1
        explain: "Cached Mips are texture mips that are not needed anymore; they stay in memory unless wanted mips need the space."
      - q: "Inflight Requests reads 0 while the streamer is still streaming content. What does the page say this indicates?"
        choices: ["Streaming is finished and all mips are in memory", "The safety pool is too small for the textures of the level", "The texture pool is full and no mip can be loaded", "The streamer is not using all the available IO bandwidth"]
        answer_index: 3
        explain: "Zero inflight requests during streaming means the IO system is idle. Raising r.Streaming.MaxTempMemoryAllowed or lowering FramesForFullUpdate can increase bandwidth."
    flavors:
      _default: {why: "GPU memory is a hard limit; when it is full you get blurry textures or a crash, and this tool shows who is using it."}
      tech_art: {why: "Tech artists set texture pool sizes and find the assets that break them.", do: "Find the one asset with the most GPU memory in your level and write one line on how you would halve it."}

  - id: TAQ109
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [culling, occlusion, profiling, rendering-thread]
    required_spine: false
    required: false
    title: Cull before you draw
    brief: "Culling means that the engine does not draw objects that the camera cannot see. An object can be skipped because it is too far away, because it is outside the view of the camera, or because it is hidden behind something else, which is called occlusion. Every object that is not drawn costs nothing, so good culling is one of the cheapest ways to make a level faster. In this quest you build two rooms and use stat commands and view tools to see what the engine culls."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/visibility-and-occlusion-culling-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cull-distance-volumes-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. In a new level, build a small interior from cubes: two rooms with a wall and a door between them. Put 30 or more props in the far room. Simple shapes work as props."
      - "Play in the editor and run the console command stat initviews. Record the values of Processed Primitives, Frustum Culled Primitives, Occluded Primitives, Occlusion Queries and Visible Static Mesh Elements."
      - "Run r.VisualizeOccludedPrimitives 1. Confirm that green boxes appear around the props that are fully hidden."
      - "Stand in the doorway and run FreezeRendering, which stops the engine from updating what it draws. Then walk into the far room and take a screenshot of what is missing."
      - "Add a Cull Distance Volume around the map, with a small size and a short distance. Read stat initviews again from far away."
      - "Select one prop and set its Bounds Scale to 3. Explain in one line why this can hurt culling and shadows."
    done_when: "Send a screenshot of stat initviews taken from the doorway, a screenshot with r.VisualizeOccludedPrimitives 1 active, and your stat numbers before and after you added the Cull Distance Volume."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "In what order does the page say the culling methods are applied, based on cost?"
        choices: ["Dynamic Occlusion, Precomputed Visibility, View Frustum, Distance", "View Frustum, Distance, Dynamic Occlusion, Precomputed Visibility", "Precomputed Visibility, Distance, Dynamic Occlusion, View Frustum", "Distance, View Frustum, Precomputed Visibility, Dynamic Occlusion"]
        answer_index: 3
        explain: "The order is Distance, then View Frustum, then Precomputed Visibility, then Dynamic Occlusion, cheapest first."
      - q: "Why can objects pop in when the camera moves fast with Hardware Occlusion Queries?"
        choices: ["Because the queries run on the CPU and take several frames", "Because visibility results are read back one frame later", "Because bounds are recomputed on every frame for each mesh", "Because the depth buffer is cleared when the camera moves"]
        answer_index: 1
        explain: "The GPU answers each per-actor query one frame later, so a fast camera can show an object before its result arrives."
      - q: "Which stat initviews counter does the page say to watch most closely?"
        choices: ["Visible Static Mesh Elements, the biggest contributor to rendering thread time", "Occlusion Queries, the number of queries the CPU has to wait for each frame", "Frustum Culled Primitives, the largest contributor to GPU time in the base pass", "Decompress Occlusion, the time spent on reading precomputed visibility"]
        answer_index: 0
        explain: "The page says Visible Static Mesh Elements is the single biggest contributor to rendering thread time and should be watched and optimized."
      - q: "What does r.VisualizeOccludedPrimitives 1 draw?"
        choices: ["A red outline around visible actors", "The view frustum", "A green bounding box around any occluded actor", "The cells that precomputed visibility has built"]
        answer_index: 2
        explain: "With that command enabled, a green bounding box is drawn around every occluded actor."
      - q: "You raise an actor's Bounds Scale. What side effect does the page warn about?"
        choices: ["The mesh gets larger on screen, which can hurt performance and the quality of its shadows", "The actor is culled later than it should be, which can hurt performance and shadow quality", "Collision stops working at the edge of the mesh, because the collision is scaled as well", "The actor becomes movable, so its baked lighting is lost and must be built once more"]
        answer_index: 1
        explain: "Bigger bounds keep the actor from being culled as soon as it otherwise would, which costs performance and shadow quality."
      - q: "How does Hierarchical Z-Buffer occlusion differ from Hardware Occlusion Queries?"
        choices: ["It culls more objects than queries do, but it costs more time on the rendering thread", "It works only on mobile, where hardware queries are not supported by the GPU", "It needs a lighting build first, because it reads the baked visibility cells", "It is more conservative, so fewer objects are culled, using a mipmapped scene depth"]
        answer_index: 3
        explain: "HZB occlusion works like hardware queries but is more conservative, so fewer objects get culled; it checks bounds against a mip-mapped depth target."
      - q: "For which case does the page recommend Precomputed Visibility?"
        choices: ["Large open worlds with many movable actors, trading memory for a lower cost on the rendering thread", "Any level with a lot of foliage, because foliage instances cannot be tested with occlusion queries", "Small to medium levels on lower-end hardware and mobile, trading rendering thread cost for memory", "VR only, because drawing two eyes makes occlusion queries on the GPU twice as expensive to run"]
        answer_index: 2
        explain: "Precomputed visibility is built offline during a lighting build, works best on small to medium levels, and trades rendering thread time for runtime memory."
      - q: "Where should you read stat initviews for the most accurate results, and what is one thing to remember?"
        choices: ["In PIE or Standalone; occlusion culling is disabled in Wireframe view mode", "In the editor viewport in Wireframe mode; occlusion is most exact in there", "Only in a Shipping build; the stat commands are most exact when shipped", "In the Static Mesh Editor; its preview viewport shows one mesh at a time"]
        answer_index: 0
        explain: "Use PIE or Standalone Game for accurate results, and note that occlusion culling is disabled in Wireframe view mode."
    flavors:
      _default: {why: "Everything you do not draw is free; culling is the cheapest optimization in the engine when it is set up right."}
      tech_art: {why: "Tech artists diagnose why the render thread is busy, and culling counters are the first place to look.", do: "Try r.HZBOcclusion=1 and compare Occluded Primitives with the default hardware queries in the same view."}

  - id: TAQ110
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [virtual-textures, texture-streaming, materials, memory]
    required_spine: false
    required: false
    title: Stream only the pixels you see
    brief: "A normal texture is loaded into memory as a whole, even when only a small part of it is on screen. A virtual texture is split into small tiles, and the engine loads only the tiles that the visible pixels need. This lets you use very large textures without paying for all of them in memory. In this quest you convert the textures of a ground material to virtual textures and measure what changes."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/streaming-virtual-texturing-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/texture-streaming-metrics-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Enable Virtual Textures in Project Settings if it is not enabled yet. You need a material named M_Ground that has three large textures (base color, normal and mask) that use the same UVs. If you have no 4K textures, make M_Ground from copies of three mannequin textures of the template: a color texture (name ending in _D), a normal texture (_N) and a packed mask (_MRA). Apply the material to a floor."
      - "Select the three textures in the Content Browser, right-click them, and choose Convert to Virtual Texture. Confirm that the Texture Sample nodes in the material now show VT and a Virtual sampler type."
      - "Open M_Ground and read the Stats panel. Count the texture fetches, which are the texture reads of the material. Then give the mask a different UV tiling and read the count again."
      - "In the level, run the console commands stat virtualtexturing and stat virtualtexturememory. Take a screenshot of both."
      - "Run r.VT.Borders 1. Move the camera close and far, and look at the grid of tiles. Turn it off again with r.VT.Borders 0."
      - "Compare the Streaming Pool value of stat streaming before and after the conversion."
    done_when: "Send screenshots of the material with the VT samples, of the Stats panel fetch counts with the same UVs and with different UVs, and of stat virtualtexturememory."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the key difference in how SVT decides what to load, compared with mip-based streaming?"
        choices: ["SVT loads whole mip levels, and the CPU decides which ones by the visibility of meshes", "SVT splits mips into small tiles and the GPU decides which visible tiles are needed", "SVT never unloads data, so the whole texture stays in memory once it has been seen", "SVT uses distance only, and loads the full texture when the camera gets close"]
        answer_index: 1
        explain: "Mip streaming uses conservative CPU visibility and loads full mips. SVT splits every mip into fixed-size tiles and the GPU finds the tiles visible pixels touch."
      - q: "You enable Virtual Texture Streaming on a texture by hand, without the conversion menu. What happens to materials that use it?"
        choices: ["They keep working, because the sampler type is updated when the texture is saved", "They switch to the default material forever, even if you fix the sampler type later", "They are invalidated until their Texture Sample nodes use a Virtual sampler type", "They compile faster, because virtual textures need fewer shader permutations"]
        answer_index: 2
        explain: "Manual conversion immediately invalidates referencing materials; you must set each Texture Sample to a Virtual sampler type such as Virtual Color."
      - q: "A base material has a normal (non-virtual) Texture Sample Parameter. Can a Material Instance assign a virtual texture to it?"
        choices: ["Yes, instances convert the sampler type automatically on save", "Yes, if the texture is a UDIM set with more than one tile", "Only for base color, not for normal or packed mask textures", "No, the base material's sampler type applies to all instances"]
        answer_index: 3
        explain: "The base material applies the sampler type to all child instances; you cannot assign a virtual texture to a parameter that is not already Virtual."
      - q: "Two VT samples use the same UVs and Sampler Source. How many texture fetches does the page count?"
        choices: ["Three: two lookups plus one shared stack", "Two: one texture fetch for each sample", "Four: two lookups plus two separate stacks", "One: both samples share a single fetch"]
        answer_index: 0
        explain: "Each VT sample adds a lookup, and samples with the same UVs and Sampler Source share one stack, so three fetches. Different UVs make it four."
      - q: "Up to how many VT samples can be combined into one stack?"
        choices: ["2", "4", "8", "16"]
        answer_index: 2
        explain: "The page says stacks combine up to 8 VT texture samples that share UVs and Sampler Source."
      - q: "Which console commands show virtual texturing cost and memory?"
        choices: ["stat streaming and stat memory in a packaged build", "stat virtualtexturing and stat virtualtexturememory", "stat GPU and stat unit with the VT overlay enabled", "stat scenerendering, stat RHI and NaniteStats on PC"]
        answer_index: 1
        explain: "stat virtualtexturing shows scene cost in ms and page table counters; stat virtualtexturememory shows the memory counters."
      - q: "What does the Tile Border setting (default 4) limit?"
        choices: ["Anisotropic filtering; raising it allows more but uses more memory", "The number of UDIM tiles that one virtual texture asset can hold", "The lowest mip level that the streamer is allowed to load in", "The number of stacks that one material can sample at a time"]
        answer_index: 0
        explain: "Anisotropic filtering support is limited by the Tile Border size. The default of 4 allows less than typical textures; increasing it costs memory."
      - q: "Why can SVT show visible pop-in as the camera moves?"
        choices: ["Because tiles are compressed, and each tile has to be unpacked on the CPU before the GPU can sample it", "Because it disables mipmaps, so each tile is loaded at full size and that takes far longer per tile", "Because the GPU cannot read the depth buffer for virtual textures, so tiles behind other objects load first", "Because VT streaming is reactive: the CPU learns a tile is needed only after a rendered frame required it"]
        answer_index: 3
        explain: "The CPU does not know a tile is needed until a frame has already asked for it, so higher resolution tiles can pop in after the camera moves."
    flavors:
      _default: {why: "Virtual texturing lets you use very large textures while paying only for the pixels that are on screen."}
      tech_art: {why: "Tech artists decide which texture sets go virtual and keep the extra fetch cost in check by sharing UVs.", do: "Import a small UDIM set with the _1001 naming convention and confirm it arrives as one virtual texture asset."}
