      - "Add a Drag module. When the 'unmet dependencies' error appears, click Fix Issue. Set Drag to 0.8."
    done_when: "Screenshot of the Steam system in your level next to a prop (for example a pipe or a cup) and a screenshot of the Particle Update group showing Acceleration Force, Scale Color and Drag in the correct order."
    xp: 50
