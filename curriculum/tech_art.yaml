      - q: "You want an artist to type the bone name in the editor without opening the Blueprint. What do you do?"
        choices: ["Add it to the Skeleton's Details panel", "Expose it as a pin on OnApply", "Make the variable Instance Editable so it appears in the Animation Data Modifiers tab", "Put it in a Data Table"]
        answer_index: 2
        explain: "Properties set as Instance Editable are shown in the Animation Data Modifiers tab, where the artist can edit them before applying."
      - q: "Which helper node gives you a list of bone names from a bone up to the root?"
        choices: ["Get Bone Poses for Time", "Get Frame at Time", "Add Animation Sync Markers", "Find Bone Path to Root"]
        answer_index: 3
        explain: "Find Bone Path to Root takes a sequence and a bone name and outputs the chain of bone names. Get Time at Frame and Get Frame at Time are for converting frames and time."
      - q: "The page shows a classic use of an Anim Modifier. Which one?"
        choices: ["Compressing animations for mobile", "Auto foot sync markers on frames where a foot bone is at its lowest point", "Retargeting between skeletons", "Generating LODs for a skeletal mesh"]
        answer_index: 1
