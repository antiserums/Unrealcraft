      _default: {why: "Sprites with a sprite sheet are the most common particle type you will see."}
      tech_art: {why: "Sub UV setup and the spawn group vs update group split are the base of almost every Niagara effect.", do: "Make your own 4 by 4 sprite sheet material and swap it in, updating Sub Image Size and End Frame to match."}

