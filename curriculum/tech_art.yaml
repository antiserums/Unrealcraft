    quiz:
      - q: "Where do you switch an emitter from CPU to GPU simulation?"
        choices: ["Render group > Sprite Renderer", "Emitter Settings > Emitter Properties > Sim Target", "Project Settings > Niagara", "Particle Update > Solve Forces and Velocity"]
        answer_index: 1
        explain: "Sim Target in Emitter Properties is set to GPUComputeSim to run the simulation on the GPU."
      - q: "Why must you set Fixed Bounds for a GPU emitter?"
        choices: ["The GPU has no memory for bounds", "Fixed Bounds enables the Spawn Rate module", "Fixed Bounds sets the particle color", "The system cannot read how big the effect is when the simulation runs on the GPU"]
        answer_index: 3
        explain: "With GPU simulation the system cannot read back the size of the effect, so you give it fixed bounds on the emitter or the system."
