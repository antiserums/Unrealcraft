      - q: "In the Edit Skeleton tool, you are in Add mode and select a bone, then drag out a new bone. What decides the parent of the new bone?"
        choices: ["The bone closest to the mouse when you release", "The root bone is always the parent", "You pick the parent in a dialog after Accept", "The first selected bone becomes the parent"]
        answer_index: 3
        explain: "The first selected bone acts as the parent to the new bone. Press Accept to confirm the bone and its placement."
      - q: "You multi-select a chain and rename the first bone to tail_##1. What do the next bones become?"
        choices: ["tail_002, tail_003", "tail_##2, tail_##3", "tail_1, tail_2 (the # signs are removed)", "The rename fails because # is not allowed in names"]
        answer_index: 0
        explain: "The # operator adds a successive number. tail_##1 gives tail_001, and the following bones become tail_002, tail_003."
      - q: "A vertex has weight 0.7 on the forearm and 0.3 on the upper arm. You set the forearm to 0.6. What happens?"
        choices: ["The vertex now has a total weight of 0.9 and moves late", "The extra 0.1 goes to the root bone", "Unreal changes the upper arm to 0.4 so the total stays 1", "The change is rejected until you add a third influence"]
        answer_index: 2
        explain: "Skin weights are normalized so each vertex totals 1. Removing weight from one bone pushes it onto the other influences, here the upper arm goes from 0.3 to 0.4."
      - q: "A vertex has only one influence. You try to set that bone's weight to 0.5. What is the result?"
        choices: ["The weight becomes 0.5 and the vertex lags behind the bone", "The other half goes to the parent bone automatically", "The vertex becomes unskinned", "Normalization sets it back to 1.0"]
        answer_index: 3
        explain: "With a single influence there is nothing to give weight to. The page says setting it to anything other than 1.0 triggers normalization which returns it to 1.0."
      - q: "You are painting weights on a mouth. The bottom lip keeps getting weight when you paint the top lip. Which brush type fixes this?"
        choices: ["Volume brush, because it ignores connectivity", "Surface brush, because it uses geodesic distance along the mesh", "Relax brush with a smaller radius", "The Vertices mode Flood operation"]
        answer_index: 1
        explain: "The Surface brush affects vertices by distance along the surface (geodesic distance), so painting the bottom lip does not touch the top lip. The Volume brush uses straight-line distance."
      - q: "In Bind Skin you lower the Stiffness value. What changes?"
        choices: ["More distant bones can contribute to the bind", "The brush gets softer", "Fewer bones can influence each vertex", "The voxel grid gets finer"]
        answer_index: 0
        explain: "Stiffness sets the stiffness of the binding. Lower values allow more distant bones to contribute. Max Influences limits the bone count and Voxel Resolution controls the grid."
      - q: "In Vertices mode you flood a bone's weights to 0.0 on all its vertices. Where does that weight go?"
        choices: ["It is deleted and the vertices stop moving", "It goes to the nearest bone by distance", "It is sent back to the root bone of the hierarchy", "It is split evenly between all other bones"]
        answer_index: 2
        explain: "The page states that if weights on a bone are flooded to 0.0, that bone's weights are sent back to the Root bone of the hierarchy."
    flavors:
      _default: {why: "Many props need a bend or a swing. Rigging them inside Unreal skips a whole DCC round trip."}
      tech_art: {why: "You are the person who turns a static prop into something animators can use. Bones, orientation and weights are your job.", do: "Add an Attribute Map (Edit Attributes > Add Weight Map Layer), paint it, and note that a Deformer Graph can read it later."}

  - id: TAQ96
