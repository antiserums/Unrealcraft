    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/tutorials-for-niagara-effects-in-unreal-engine"
    checklist:
      - "Make sure your project has the Starter Content (it holds M_smoke_subUV). Make a folder for the effect, for example NiagaraFX/SpriteEffect."
      - "Right-click in the Content Browser, choose FX > Niagara System, pick New system from selected emitters and add the Simple Sprite Burst template. Name the system SmokeSystem and rename the emitter to FX_Smoke."
      - "In the Sprite Renderer set the material to M_smoke_subUV, Sub Image Size to 8 by 8 and turn on Sub UV Blending. Drag SmokeSystem into your level."
      - "In Emitter Update delete Spawn Burst Instantaneous, add Spawn Rate and set it to 50. In Emitter State set Life Cycle Mode to Self and Loop Behavior to Infinite."
      - "In Initialize Particle set a random lifetime (2 to 3), a random uniform sprite size (75 to 200) and a random sprite rotation (Direct Normalized Angle, 0.25 to 0.5). Add Add Velocity with a random range (Z 50 to 200) and Shape Location with a sphere of radius 64."
      - "Add a SubUV Animation module, set the mode to Linear, Start Frame 0 and End Frame 63. In Particle Update add Acceleration Force with Z 500."
      - "Click the Gear icon on the emitter and choose Create Asset From This so FX_Smoke becomes its own emitter asset. Save everything."
    done_when: "Screenshot of the Niagara Editor with the FX_Smoke stack open (Spawn Rate, SubUV Animation and Acceleration Force visible) and a screenshot of the smoke column in your level. Also show the FX_Smoke emitter asset in the Content Browser."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "What is a sprite in Niagara?"
        choices: ["A 2D plane that always faces the camera and shows a texture or material", "A small static mesh", "A light that follows a particle", "A sound attached to a particle"]
        answer_index: 0
        explain: "Sprites are 2D camera-facing planes. The renderer draws a texture or material on them."
      - q: "Why does the tutorial set Sub Image Size to X 8, Y 8 in the Sprite Renderer?"
        choices: ["It sets the size of each sprite in centimeters", "M_smoke_subUV is a sprite sheet, so the renderer must know how many images are in the grid", "It sets how many particles spawn per second", "It limits the effect to 8 emitters"]
        answer_index: 1
        explain: "The material uses a SubUV sprite sheet with an 8 by 8 grid of images. The renderer needs that grid size to pick the right image."
      - q: "The tutorial deletes Spawn Burst Instantaneous and adds Spawn Rate. What is the reason?"
        choices: ["Spawn Burst only works on the GPU", "Spawn Rate is needed for SubUV materials", "The goal is a constant column of smoke, not one burst", "Spawn Burst cannot be used with Shape Location"]
        answer_index: 2
        explain: "A burst spawns everything at once. Spawn Rate (50 per second here) gives a steady column of smoke."
      - q: "Without the SubUV Animation module, what happens to the smoke sprite sheet?"
        choices: ["The particles are invisible", "All 64 images show at the same time", "The material turns black", "The renderer only shows the first image of the sheet"]
        answer_index: 3
        explain: "If nothing plays the sheet, the renderer uses only the first sprite. SubUV Animation with Linear mode from frame 0 to 63 plays all 64 images."
      - q: "Which module makes the smoke rise over time, and in which group is it?"
        choices: ["Add Velocity in Particle Spawn", "Acceleration Force in Particle Update", "Spawn Rate in Emitter Update", "Shape Location in Particle Spawn"]
        answer_index: 1
        explain: "Add Velocity only gives a start push. Acceleration Force (Z 500) in Particle Update keeps pushing the smoke up every frame."
      - q: "How do you save the FX_Smoke emitter so other systems can reuse it?"
        choices: ["Right-click the system and choose Export", "Drag the emitter into the level", "Click the Gear icon on the emitter and choose Create Asset From This", "Save the level"]
