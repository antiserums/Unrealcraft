    checklist:
      - "Place a wall and a sphere in front of it. Create M_BlendTest with a texture in Base Color and a black-and-white stripe texture ready."
      - "Set Blend Mode to Masked. Plug the stripes into Opacity Mask. Change Opacity Mask Clip Value and watch which stripes disappear."
