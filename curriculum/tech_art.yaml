        choices: ["Uniform Ranged Float", "Float from Curve", "Uniform Ranged Int", "Random Range Vector 2D"]
        answer_index: 3
        explain: "The tutorial sets Scale Factor to Dynamic Inputs > Random Range Vector 2D with separate X and Y ranges."
      - q: "The Sparks tutorial fades particles out with Scale Color. How?"
        choices: ["It applies the Smooth Ramp Down template to the Scale Alpha curve", "It sets Scale RGB to black at the very end of the life of each particle", "It adds a Kill Particles module at the very end of Particle Update", "It lowers the Lifetime of every particle to zero"]
        answer_index: 0
