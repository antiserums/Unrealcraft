        answer_index: 1
        explain: "Click the Plus sign in the Render group and pick Light Renderer. It spawns a light with each particle."
      - q: "What does Radius Scale on the Light Renderer control?"
        choices: ["How many lights are spawned for each particle", "The sprite size of each particle", "How far from the particle the light spreads", "The color of the light of each of the particles"]
        answer_index: 2
        explain: "Radius Scale (5 in the tutorial) sets how far the light reaches from the particle position."
      - q: "The Light Renderer Color Add fields are labeled X, Y and Z. What do they mean?"
        choices: ["Position of the light", "Red, Green and Blue", "Radius, falloff and intensity", "Start, middle and end time"]
        answer_index: 1
        explain: "X, Y and Z map to R, G and B. Setting Z to 15 gives a strong blue light that matches the particle color."
      - q: "Why does the tutorial add a Collision module to the fountain?"
        choices: ["Without it the particles fall through the floor", "Without it the light does not render", "Collision is required for the Fountain template", "Collision makes particles spawn faster"]
        answer_index: 0
        explain: "Without collision the particles fall through the floor and other solid objects. The module is moved with Fix Issue after adding."
      - q: "In Add Velocity in Cone, where is the point of the cone?"
        choices: ["At the camera", "At the level origin", "At the end of the particle life", "At the particle spawn point"]
