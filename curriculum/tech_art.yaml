  - id: TAQ39
    rank: 1
    difficulty: apprentice
    specializations: [tech_art]
    subjects: [import, fbx, static-mesh]
    required_spine: false
    required: false
    title: Import a static mesh right
    brief: "Models are usually made in another 3D program and saved as an FBX file, a common file format for 3D models. When you import the file into Unreal, the import options decide things like the scale, the normals (which control how light shades the surface) and the collision. Current versions of Unreal show these options in the Interchange import window, and older versions show a window named FBX Import Options. In this quest you import the same mesh two times with different options and compare the results."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/fbx-static-mesh-pipeline-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/importing-assets-using-interchange-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/fbx-import-options-reference-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Get an FBX file of a simple prop. If you have no modeling program, export one from Unreal: right-click a Static Mesh, for example SM_ChamferCube from the folder LevelPrototyping/Meshes, choose Asset Actions, then Export, and save it as FBX."
      - "In the Content Browser, click Add/Import, then Import, and pick the FBX file. The import window opens. In current versions it is named Interchange Pipeline Configuration, and older versions show FBX Import Options. Do not press Import yet. Take a screenshot of the window."
      - "In the window, find the options that do these five jobs, and write one line for each that says what it does: combining all meshes of the file into one (Combine Static Meshes, or Combine Meshes in the old window), Generate Lightmap UVs, the collision options, the option that recomputes or imports the normals (Recompute Normals, or Normal Import Method in the old window), and Convert Scene Unit."
      - "Keep the normals from the file (leave Recompute Normals off, or set Normal Import Method to Import Normals in the old window) and turn Generate Lightmap UVs on. Then import the mesh with the name SM_ImportTest."
      - "Open SM_ImportTest in the Static Mesh Editor. Check the triangle count, the number of UV channels and the material slots. Turn on the collision display."
      - "Import the same FBX file a second time with the name SM_ImportTest_Combine. This time turn the combine option on and let Unreal compute the normals (turn Recompute Normals on, or set Normal Import Method to Compute Normals in the old window). Compare the two results."
    done_when: "Send a screenshot of the import window and a screenshot of SM_ImportTest in the Static Mesh Editor with collision shown. Add one or two lines that say what changed between your two imports."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "You export three separate meshes into one FBX file and import it with default settings. What do you get?"
        choices: ["One static mesh asset with three sections", "Three separate static mesh assets", "One skeletal mesh", "An error, because one FBX can hold only one mesh"]
        answer_index: 1
        explain: "The importer separates multiple meshes into multiple assets. It only combines them if you turn on the combine option at import time, which is named Combine Static Meshes in the current import window and Combine Meshes in the older one."
      - q: "You tell the importer to compute the normals itself (Recompute Normals in the current import window, Normal Import Method set to Compute Normals in the older one). What happens to the normals and smoothing groups stored in the FBX file?"
        choices: ["They are converted to vertex colors, which the material can then read", "They are kept as they are, and the tangents are imported from the file as well", "They are discarded, and the engine computes normals and tangents itself", "They are used only for LOD1 and above, and LOD0 gets computed normals"]
        answer_index: 2
        explain: "When the engine computes the normals and tangents, the smoothing group and normal information from the FBX file is thrown away. Leave the option off, or use Import Normals in the older window, to keep the normals of the 3D program."
      - q: "What does 'Convert Scene Unit' do?"
        choices: ["It changes the FBX units to Unreal's unit, which is centimeters", "It doubles the mesh size", "It rotates the mesh so that the Z axis points up, as it does in Unreal", "It converts inches to meters and scales the mesh by that amount"]
        answer_index: 0
        explain: "The page says Convert Scene Unit converts the scene from the FBX units of measure to UE's unit of measure, centimeters."
      - q: "Where should the pivot of a mesh be when you export it from a modeling program?"
        choices: ["At the center of the mesh, always, so that the mesh rotates around its middle when it is placed", "Anywhere, because Unreal recenters the pivot on import and places it at the bottom of the mesh", "At the top of the mesh", "At the world origin (0,0,0), usually at one corner of the mesh, so it snaps to the grid well"]
        answer_index: 3
        explain: "The pivot is always at the origin on export. Epic says to build the mesh at the origin, usually with the origin at one corner, for good grid snapping in the editor."
      - q: "Your FBX contains a collision mesh named UCX_Crate_01 next to a render mesh named Crate_01. What happens on import?"
        choices: ["Both are imported as visible meshes, and you must delete the UCX mesh by hand in the Static Mesh Editor", "The importer removes UCX_Crate_01 from the render mesh and turns it into the collision of Crate_01", "The importer ignores it, because collision can only be made in the Static Mesh Editor after import", "The importer renames it to SM_Crate_01"]
        answer_index: 1
        explain: "Collision meshes are found by name. UCX_ plus the exact render mesh name marks a convex collision shape, and the importer converts it into the collision model."
      - q: "After importing a mesh with its textures, which texture inputs are connected automatically in the new material?"
        choices: ["All of them, including Ambient Occlusion", "Only Specular", "Only Color and Normal", "None; you always connect them by hand"]
        answer_index: 2
        explain: "Only Color and Normal get connected. Specular maps are imported but not connected, and some other maps are not imported at all, so check the material after import."
    flavors:
      _default: {why: "A bad import makes every later step harder: wrong scale, wrong normals, missing collision."}
      tech_art: {why: "Tech artists set the import rules for the whole team. You must know every option in that dialog.", do: "Write a short 'how we import props' note with the settings your project should use, and why."}
      lookdev: {why: "Normals and smoothing decide how your materials look. Get them in cleanly."}
      level_design: {why: "Props with correct scale and pivots are much faster to place."}

  - id: TAQ40
    rank: 1
    difficulty: apprentice
    specializations: [tech_art]
    subjects: [collision, physics, static-mesh]
    required_spine: false
    required: false
    title: Simple vs complex collision
    brief: "Collision is the invisible shape that the game uses to decide what an object blocks. Simple collision is made of a few basic shapes such as boxes, and it is fast. Complex collision uses the real triangles of the mesh, so it is exact but more expensive. With the wrong collision, players walk through walls or get stuck on invisible boxes. In this quest you try several collision shapes on an open crate and test how objects land on them."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-collisions-with-static-meshes-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/simple-versus-complex-collision-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/collision-response-reference-in-unreal-engine"
    community_urls:
      - {title: "The RIGHT Way to Make Custom Collision in Unreal Engine 5 (Matt Aspland)", url: "https://www.youtube.com/watch?v=7NEXKiLTOWg"}
    checklist:
      - "Open a project made from the Third Person template, or create one. Make a prop with a hollow shape: in Modeling Mode, create a Box as a Static Mesh, create a second, smaller Box that sticks into its top, and cut it out with the Boolean tool so that you get an open crate. Name the asset SM_Crate_Col and open it in the Static Mesh Editor. Open the Collision menu and choose Remove Collision."
      - "In the Collision menu, try Add Box Simplified Collision, and then Add 26DOP Simplified Collision. Look at how each one covers the opening of the crate. Then remove them again."
      - "Choose Collision > Auto Convex Collision. Raise Hull Count and Hull Precision, click Apply, and compare the result with what the default values give."
      - "Make a second copy of the crate named SM_Crate_Complex. In the Details panel, in the Collision section, set Collision Complexity to Use Complex Collision As Simple."
      - "Place both crates in a level. Drop a physics cube (a cube with Simulate Physics turned on) into each crate and press Play. Note where the cube lands."
      - "Select one crate actor in the level and open Collision Presets in the Details panel. Switch it to Custom and set Pawn to Overlap. Press Play and walk into the crate."
    done_when: "Send two screenshots: one of the Static Mesh Editor that shows your Auto Convex collision on SM_Crate_Col, and one of the level with both crates and where the cube landed on each. Add one line on the difference."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You add a Box Simplified Collision to a mesh that already has a Sphere Simplified Collision. What happens?"
        choices: ["The box replaces the sphere", "The box is added; the mesh now has both shapes", "The editor shows an error and adds no new shape", "The sphere becomes a box of the same size, and no second shape is added"]
        answer_index: 1
        explain: "Adding a simplified collision does not replace the existing one, it adds to it. Use Remove Collision to clear all shapes first."
      - q: "What does the K in 10-DOP, 18-DOP and 26-DOP mean?"
        choices: ["The number of triangles in the hull, in units of one thousand (K) triangles", "The number of axis-aligned planes pushed against the mesh to build the hull", "The number of hulls that the option makes, which are then merged into one single shape", "The size of the box in centimeters, measured along the longest side of the mesh"]
        answer_index: 1
        explain: "K-DOP is K discrete oriented polytope. It takes K axis-aligned planes and pushes them as close to the mesh as possible; 10, 18 and 26 are the options in the Static Mesh Editor."
      - q: "In the Convex Decomposition panel, what happens when you raise Hull Count, Max Hull Verts and Hull Precision?"
        choices: ["Collision gets more precise but also more complex", "Collision gets simpler and cheaper to compute", "The render mesh gets more triangles and vertices", "The mesh is converted to Nanite with more hulls"]
        answer_index: 0
        explain: "The page says: the higher these values, the more precise the collision mesh, but also the more complex."
      - q: "A mesh is set to Use Complex Collision As Simple. What is the trade-off?"
        choices: ["It can simulate physics, but only on Nanite meshes, because the fallback mesh is then used as the shape", "It uses less memory than simple shapes, because no extra collision data is stored", "The mesh cannot simulate physics itself, but other simulated objects can collide with its exact triangles", "Traces will ignore it"]
        answer_index: 2
        explain: "With UseComplexAsSimple the trimesh is used for physics collision. You cannot simulate that object, but it can collide with other simulated (simple) objects."
      - q: "In the Details panel, Collision Presets shows 'Default'. What does that mean?"
        choices: ["The actor has no collision at all, and every trace and every other actor passes through its mesh in the level", "The actor blocks everything in the level, whatever was set for the mesh asset in the Static Mesh Editor", "The actor uses the settings from the Static Mesh Editor; nothing has been overridden on this instance", "The actor is a Pawn"]
        answer_index: 2
        explain: "Default means the preset was not changed from what the Static Mesh asset has. Any other name, like BlockAll, means this actor or component overrides it."
      - q: "Which Collision Enabled setting gives raycasts, sweeps and overlaps but no physics simulation, and is useful for character movement?"
        choices: ["No Collision", "Physics Only", "Collision Enabled", "Query Only"]
        answer_index: 3
        explain: "Query Only is used only for spatial queries. It cannot be used for simulation, and the page names character movement as a good use."
    flavors:
      _default: {why: "Wrong collision means players walk through walls or get stuck on invisible boxes."}
      tech_art: {why: "Tech artists set the collision rules for props and fix the ones that break gameplay.", do: "Add the Collision view mode (Player Collision) screenshot of a small scene and mark one mesh whose collision is too loose."}
      level_design: {why: "You will test collision every day. Knowing the shapes helps you ask for the right fix."}
      animation: {why: "Characters interact with props. A chair you cannot sit on is a collision problem, not an animation problem."}

  - id: TAQ41
    rank: 1
    difficulty: apprentice
    specializations: [tech_art]
    subjects: [lightmap, uv, static-mesh, lighting]
    required_spine: false
    required: false
    title: Lightmap UVs that don't bleed
    brief: "A lightmap is a texture that stores baked light and shadow for a mesh. Baked means the lighting is calculated once in the editor and saved. To use a lightmap, the mesh needs a lightmap UV, which is a flat layout of its surface where no two parts overlap and there is some empty space (padding) between the parts. Bad lightmap UVs cause dark lines, spots and light leaks after a light build. In this quest you let Unreal generate lightmap UVs and see how one setting changes the padding."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/generating-lightmap-uvs-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/understanding-lightmapping-in-unreal-engine"
    community_urls:
      - {title: "Auto-generating Lightmap UVs quick tip (Jona Marklund)", url: "https://www.youtube.com/watch?v=BHhDnuhSFnY"}
    checklist:
      - "Open a project made from the Third Person template, or create one. Duplicate a prop mesh, for example SM_ChamferCube from the folder LevelPrototyping/Meshes, name the copy SM_Prop_LM, and open it in the Static Mesh Editor. Turn on the UV display and look at UV channel 0 and UV channel 1, if the mesh has one."
      - "In the Details panel, open LOD0 and then Build Settings. Enable Generate Lightmap UVs. Set Min Lightmap Resolution to 32, Source Lightmap Index to 0 and Destination Lightmap Index to 1. Click Apply Changes."
      - "Look at UV channel 1 again. Take a screenshot of the packed lightmap UV."
      - "In General Settings, set Lightmap Resolution to 64 and Lightmap Coordinate Index to 1."
      - "Change Min Lightmap Resolution to 128 and click Apply Changes again. Compare the padding between the UV charts (the separate pieces of the layout) with your first screenshot."
      - "Write two lines: one that says why the padding changed, and one that says why a texture UV may overlap but a lightmap UV may not."
    done_when: "Send two screenshots of UV channel 1, one with Min Lightmap Resolution 32 and one with 128, and a screenshot of the Build Settings panel. Add your two lines."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "When does a static mesh need a lightmap UV at all?"
        choices: ["Always, for every mesh, whatever lighting is used", "Only when the mesh uses Nanite and Lumen together", "Only when it will be lit by baked (precomputed) lighting", "Only when it has more than one material slot assigned"]
        answer_index: 2
        explain: "Lightmaps store baked light and shadow. If a project uses only dynamic lighting, there is no need to set up lightmaps."
      - q: "Which UV channel does the auto-generated lightmap UV use as its source by default?"
        choices: ["UV channel 0, the texture UV", "UV channel 1, the second one", "The last UV channel of the mesh, whatever it holds", "It builds a new UV from scratch, with no source"]
        answer_index: 0
        explain: "The generator repacks the existing UV charts from UV channel 0. It needs a source UV to work from."
      - q: "What does the generator NOT do while repacking?"
        choices: ["Normalize the scale of the charts", "Add padding between charts", "Split or cut UV charts into new islands", "Store the result in the destination index"]
        answer_index: 2
        explain: "During repacking, UE will not split UV chart edges. It only repacks the existing charts. Split them in your modeling tool before import if needed."
      - q: "What does Min Lightmap Resolution control?"
        choices: ["The size of the lightmap texture that the mesh gets in the level, in pixels along each side", "The minimum padding between UV charts, so the pack is texel accurate down to that resolution", "The number of UV channels that the mesh has after the build has finished", "The Lightmass quality that is used for the mesh in a bake of the level"]
        answer_index: 1
        explain: "It sets the minimum padding for the charts. This limits light and shadow bleed when the mesh is used at that lowest resolution."
      - q: "Why is at least four texels of padding usually needed between charts?"
        choices: ["Because Lightmass ignores the first four texels of a chart", "Because UVs are stored as 4-byte values in the mesh file on disk", "Because the editor rounds padding to 4 when it builds the mesh", "Because DXT texture compression works on 4x4 texel blocks"]
        answer_index: 3
        explain: "DXT compression operates on 4x4 blocks, so charts closer than four texels can share a block and bleed into each other."
      - q: "You set Lightmap Coordinate Index in General Settings. What should it match?"
        choices: ["The Source Lightmap Index", "The Destination Lightmap Index used when generating", "The number of material slots that the mesh has in all", "The Min Lightmap Resolution of the mesh, set in the Build Settings"]
        answer_index: 1
        explain: "The Lightmap Coordinate Index tells the light build which UV channel to use. It should be the channel where the generated lightmap UV was stored, the Destination Lightmap Index."
    flavors:
      _default: {why: "Bad lightmap UVs give dark lines, splotches and light leaks after a light build."}
      tech_art: {why: "You will be the one who finds why a prop bakes badly. Padding and resolution are the usual causes.", do: "Enable the Lightmap Density view mode on a small scene and find one mesh whose density is far from its neighbors."}
      lookdev: {why: "Baked light artifacts look like material bugs. Knowing lightmap UVs saves you hours."}
      level_design: {why: "Lightmap Resolution per actor is your knob for baked light quality vs memory."}

  - id: TAQ42
    rank: 1
