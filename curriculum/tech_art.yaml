  - id: TAQ100
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [cloth, chaos, dataflow, pipeline]
    required_spine: false
    required: false
    title: "Panel cloth: a reusable cloth asset with Dataflow"
    brief: "Cloth simulation makes a cape, a flag or a skirt move by physics while the game runs. Since Unreal Engine 5.3 you can build cloth as its own Cloth Asset, which is separate from the character and can be used on other characters too. You build it in the Chaos Cloth Panel node editor with a Dataflow graph, a graph of nodes where each step can be changed later without starting again. In this quest you model a cape, turn it into a Cloth Asset and test it on a character."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/panel-cloth-editor-overview"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cloth-simulation-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one, and use the mannequin as the character. You need two static meshes for a simple cape or flag: a render mesh that the player sees, and a simulation mesh with fewer polygons that the physics uses."
      - "Model them in a DCC (a 3D modeling program such as Blender, which is free) over the exported mannequin and export both as FBX files. For a first test you can also make them in Modeling Mode: a Rectangle with many subdivisions, placed behind the shoulders of the mannequin, and a copy of it with fewer subdivisions."
      - "Import both static meshes into Unreal. Create a new Cloth Asset named CA_Cape from the meshes with a new Dataflow graph, and open it in the Chaos Cloth Panel node editor."
      - "Build the node graph step by step, so that the asset is generated in a non-destructive way. Transfer the skin weights from the skeletal mesh of the character onto the cloth mesh, so the cloth follows the bones."
      - "Configure the cloth settings. Add at least one weight map on the cloth mesh, which is a map you paint to give each area its own value. For example, paint a max-distance style map with 0 at the shoulders and a high value at the lower edge."
      - "Set the Physics Asset of the character on the cloth asset, so that the cloth collides with the body."
      - "Open the character Blueprint, add a Chaos Cloth Component and assign CA_Cape to it. Test the simulation in Play In Editor (PIE) with a run animation."
      - "Write 3 short lines: what the panel workflow gives you that the legacy Clothing Tool does not, and what it costs at render time."
    done_when: "Send a screenshot of the Dataflow graph in the Chaos Cloth Panel editor, a PIE screenshot with the cape moving on the character, and your 3-line note."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Which engine version introduced the Chaos Cloth Panel node editor?"
        choices: ["Unreal Engine 4.27", "Unreal Engine 5.0", "Unreal Engine 5.3", "Unreal Engine 5.6"]
        answer_index: 2
        explain: "The overview says Unreal Engine 5.3 introduced this new way of authoring cloth with the Chaos Cloth Panel node editor."
      - q: "How is a panel cloth asset built?"
        choices: ["By painting weights on a section of the skeletal mesh in its editor", "By importing an APEX file that was made in an external DCC tool", "With a Niagara system that spawns one particle per cloth vertex", "With a Dataflow graph that generates the asset non-destructively"]
        answer_index: 3
        explain: "The cloth asset holds everything needed to generate and simulate it, and you build it in the node editor using a Dataflow graph, which is non-destructive."
      - q: "Does the new panel editor use a different physics solver than the legacy cloth editor?"
        choices: ["Yes, it uses the PhysX solver, while the legacy cloth editor still runs on the Chaos solver", "No, both use the same Chaos solver, but the panel editor adds optional XPBD constraint types", "Yes, it uses a GPU-only solver, so the panel editor needs a graphics card with compute support", "No, both use the same Chaos solver, but the panel editor cannot use any of the constraints at all"]
        answer_index: 1
        explain: "Both use the same Chaos solver for simulation. The panel node editor has expanded functionality with optional XPBD constraint types."
      - q: "What kind of collision does the panel workflow mention for the simulation?"
        choices: ["LSV (Level Set Volume) collision", "Per-triangle mesh collision only", "Sphere collision only", "No collision, cloth ignores the body"]
        answer_index: 0
        explain: "You can add XPBD cloth constraints and use LSV (Level Set Volume) collision for the simulation. A Physics Asset is set on the cloth for collision."
      - q: "Why can one panel cloth asset be used on several characters?"
        choices: ["Because it is baked into the skeleton, so every mesh that shares the skeleton gets the same cloth", "Because it copies the character's materials and skin weights each time it is added to a new mesh", "Because it uses a shared Physics Asset that every character with the same skeleton can collide with", "Because the cloth asset is separate from the skeletal mesh and used through a Chaos Cloth component"]
        answer_index: 3
        explain: "The workflow separates clothing assets from their skeletal meshes. The asset is used with any skeletal or static mesh via the Chaos Cloth component."
      - q: "What is the render-time cost of the panel cloth workflow compared to legacy cloth?"
        choices: ["It is slightly more expensive because a separate component renders it, with more object management and draw calls", "It is cheaper because it uses fewer materials, and all cloth parts of a character are merged into one draw call", "It is the same, because both workflows end up with the same render mesh and the same number of draw calls", "It is much more expensive, because the cloth mesh is skinned again on the CPU for every frame and for every single LOD"]
        answer_index: 0
        explain: "The overview says the clothing assets are rendered separately by a component, which has more overhead with object management and draw calls."
      - q: "What should you prepare in the external DCC before importing?"
        choices: ["One skeletal mesh with the cloth already skinned in, exported as one FBX", "An Alembic cache of the full simulation, baked at the game frame rate", "Separate render and simulation meshes exported as static meshes in FBX", "A texture that stores vertex offsets for each frame of the simulation"]
        answer_index: 2
        explain: "Create the clothing in the DCC, make separate render and simulation meshes, and export both static meshes in FBX format."
      - q: "Why does the overview say the panel editor can look better even with the old constraints?"
        choices: ["It runs at a higher tick rate than the legacy cloth solver", "It does not bake the clothing metrics to the draped pose", "It uses ray tracing for cloth shadows and self collision", "It disables gravity on the cloth while the pose is draped"]
        answer_index: 1
        explain: "The panel editor gives finer control over the setup and does not bake the clothing metrics to the draped pose, which gives a better-looking simulation with the right setup."
    flavors:
      _default: {why: "Cloth that can be reused across characters saves a lot of setup on a real project."}
      tech_art: {why: "You decide between legacy per-mesh cloth and reusable panel cloth. Knowing the trade-offs (iteration speed vs draw calls) is the job.", do: "Put the same cape on a second character with a different body and note what had to change."}

  - id: TAQ101
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [groom, hair, lod, optimization]
    required_spine: false
    required: false
    title: "Groom LODs: strands, cards and meshes"
    brief: "A groom is a hair asset in Unreal that is made of many thousands of single strands. Strands look very good but are one of the most expensive things to draw. LOD means level of detail: when the hair is far from the camera, the engine switches to a cheaper version with fewer strands, or to flat hair cards or a simple mesh. In this quest you set up three LODs on a groom and see how each one changes the hair and its cost."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-level-of-detail-for-grooms-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-cards-and-meshes-for-grooms-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/groom-asset-editor-user-guide-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, with the Groom plugin enabled. Use a groom asset: a hair groom of a free MetaHuman from Epic, or a free groom from Fab. No template includes one. Open it in the Groom Asset Editor. In the Show menu, turn on Vis. Clusters and then Hair CVs, and look at the strands."
      - "In the LOD panel, set LOD Mode to Manual. For the first hair group, click the Add (+) button until you have three LOD entries. LOD0 keeps the full strands. LOD1 has Curve Decimation and Vertex Decimation around 0.5 and a Screen Size around 0.5. LOD2 has stronger decimation, a Screen Size around 0.2 and Simulation set to Disable."
      - "On LOD1 and LOD2, raise Thickness Scale a little, so that the hair does not look thin after strands were removed."
      - "Use the LODs dropdown in the viewport to step through LOD0, LOD1 and LOD2. Read the stats for each one: geometry type, curves and points."
      - "Switch LOD Mode to Auto. Then change Auto LOD Bias and zoom the camera out slowly. Note where you start to see that strands are removed."
      - "If your groom has a card mesh, add an entry in the Cards panel with Guide Type set to Generated, Group Index 0 and LOD Index 2, and then set the Geometry Type of LOD2 to Cards. If it has no card mesh, write one line about why cards or meshes would be used for the far LOD."
    done_when: "Send a screenshot of the LOD panel with three LOD entries in Manual mode, and a screenshot of the viewport at LOD2 that shows the LOD stats. Add your one-line note if you had no cards."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What does LOD Mode Auto do for a groom?"
        choices: ["Generates cards automatically for the far LODs, so no cards have to be imported", "Turns off simulation at distance, so far grooms only follow the skinned mesh", "Copies the LOD settings from the Project Settings, so every groom uses the same values", "Adapts the number of strand curves based on screen size, with no manual LOD entries"]
        answer_index: 3
        explain: "Auto automatically adapts the number of curves based on the groom's screen size, so manual LOD entries are not needed. Default uses the project setting and Manual uses your entries."
      - q: "How many LOD entries can each hair group have?"
        choices: ["3", "5", "8", "Unlimited"]
        answer_index: 2
        explain: "For each colored hair group you can create up to 8 LOD entries."
      - q: "You set a far LOD to Meshes geometry (a hair helmet). Which feature is still supported on it?"
        choices: ["RBF only", "Skinning and simulation", "Simulation only", "Skinning only"]
        answer_index: 0
        explain: "Strands and Cards support skinning, RBF and simulation. Meshes only support RBF."
      - q: "After decimating strands the hair looks thin. Which property is meant to compensate for this?"
        choices: ["Angular Threshold", "Thickness Scale", "Auto LOD Bias", "Vertex Decimation"]
        answer_index: 1
        explain: "Thickness Scale scales the strand radius and is there only to manually compensate for the reduction of curves."
      - q: "In Auto mode the reduction of curves is too visible up close. What does the page suggest?"
        choices: ["Set Curve Decimation to 1 on every LOD of the groom", "Switch the Geometry Type of all the close LODs to Cards", "Increase Auto LOD Bias so reduction starts further away", "Enable RBF Interpolation in the groom binding asset"]
        answer_index: 2
        explain: "Auto LOD Bias increases the distance at which the groom starts to reduce the number of curves, which helps when the automatic reduction is too visible."
      - q: "What is the difference between Curve Decimation and Vertex Decimation?"
        choices: ["Curve removes points on each strand; Vertex removes whole strands uniformly", "Curve removes whole strands uniformly; Vertex removes points on each strand", "They are the same setting, shown under two names for cards and strands", "Curve affects cards only; Vertex affects only the meshes of far LODs"]
        answer_index: 1
        explain: "Curve Decimation reduces the number of hair strands uniformly. Vertex Decimation reduces the number of points for each strand."
      - q: "A LOD entry has Binding Type set to Rigid. How does the groom attach to the skeletal mesh?"
        choices: ["It uses the attachment name provided on the groom component", "It is deformed by the skinned surface of the skeletal mesh", "It uses RBF samples to follow the nearest triangles", "It does not attach and stays at the world origin"]
        answer_index: 0
        explain: "Rigid uses the attachment name on the groom component. Skinning deforms the groom by the skeletal mesh's skinned surface."
      - q: "In the Cards panel, what does Guide Type Generated do?"
        choices: ["Uses the guides of the groom itself, by picking the guide that is closest to each vertex of every single card", "Imports the deformation guides from an Alembic file that must be exported together with the cards", "Disables card deformation, so the cards only follow the transform of the bone they are attached to", "Generates deformation guides through the middle of each card, assuming the card is made of triangle bands"]
        answer_index: 3
        explain: "Generated builds guides that run through the middle of each hair card geometry. Guide-Based instead skins the cards using the groom's guides, picking the closest guide for each card vertex."
    flavors:
      _default: {why: "Hair is one of the most expensive things on screen. LODs are what make it shippable."}
      tech_art: {why: "Groom LODs are your budget tool: curves, points and geometry type per distance.", do: "Note the curve and point counts at each LOD and compute how much LOD2 saves compared with LOD0."}

  - id: TAQ102
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [groom, hair, materials, interpolation]
    required_spine: false
    required: false
    title: "Groom binding and a Hair Attributes material"
    brief: "A groom, the strand hair asset of Unreal, must follow the head when the character moves. This is done by a binding to the Skeletal Mesh. Only a small number of strands, called guides, are moved directly, and all other strands copy the nearest guides. The hair material can read data from each strand, such as how far along the strand a point is, through the Hair Attributes node. In this quest you look at the guides and the binding of a groom, and you build a hair material that goes from a root color to a tip color."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/groom-interpolation-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/groom-materials-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/groom-asset-editor-user-guide-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, with the Groom plugin enabled. Place a character with a groom that is bound to its skeletal mesh in a level. A free MetaHuman from Epic comes with bound grooms. In the View Modes menu of the viewport, choose Groom, then Guides, and after that Groom, then Strands Guides Influences. Take a screenshot of the clumps."
      - "Open the groom in the Groom Asset Editor. In the Interpolation panel, read the settings Interpolation Quality and Interpolation Distance. Enable Randomize Guide and note how long the rebuild takes."
      - "Enable RBF Interpolation in the Interpolation panel. In the level, use Lit, then Groom, then Root Bindings to see the RBF samples. Play a strong animation (a big head turn or a crouch) with RBF on and with RBF off, and compare."
      - "In the LOD panel, set RBF Interpolation to Disable on the last LOD only."
      - "Create a material named M_Hair_TA. Set the Shading Model to Hair, and check that Use with Hair Strands is enabled in the Usage section. Add a Hair Attributes node. Use a Lerp node to blend from a root color to a tip color with the U output, and use Seed to change the color of each strand a little."
      - "Add a slot in the Materials panel of the groom asset and assign M_Hair_TA to it. Then override that slot on the Groom component in the level with a second instance, and confirm that the override works."
    done_when: "Send a screenshot of the Strands Guides Influences view, a screenshot of the M_Hair_TA graph with the Hair Attributes node connected, and a screenshot of the groom in the level with your material."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Global (RBF) interpolation only works under which condition?"
        choices: ["When the groom is bound to a skeletal mesh and skinning is used for deformation", "When the groom uses Cards geometry and has at least two LOD entries in the asset", "When simulation is enabled and the guides are driven by the physics solver", "When Use Unique Guide is on and the groom has only one group of strands"]
        answer_index: 0
        explain: "RBF uses samples on the skinned mesh to correct the groom shape, so it only works when the groom is bound to a skeletal mesh and skinning is used."
      - q: "For a short hair groom, which Interpolation Quality does the page recommend?"
        choices: ["High, because short hair needs the most precision of all", "Low, because it is fast and the quality loss is small", "Medium always, because it is the safe default value", "It does not matter for short hair, all levels look the same"]
        answer_index: 1
        explain: "For short hair Low is recommended (nearest neighbor, minutes to build). High uses curve shape matching and is better for medium and long hair, but is slow to build."
      - q: "What does the Use Unique Guide setting do?"
        choices: ["Makes each strand its own guide, so the simulation runs on every single strand", "Imports guides from the Alembic file and does not generate any new guides on import", "Uses a single guide for motion interpolation to reduce the cost of hair interpolation", "Locks the guides so that the simulation cannot move them away from the skinned surface"]
        answer_index: 2
        explain: "Use Unique Guide uses a single guide for motion interpolation. The page lists it as a way to reduce the cost of hair interpolation for look or performance reasons."
      - q: "The hair shows visible clumps that follow the guides. Which setting is meant to break this up?"
        choices: ["Vertex Decimation", "RBF Type Rigid Transform", "Hair to Guide Density set to 0", "Randomize Guide"]
        answer_index: 3
        explain: "When Randomize Guide is enabled, the guides used for interpolation are slightly randomized to break up clumps."
      - q: "How do you see the RBF samples on a groom placed in a level?"
        choices: ["Show > Guide in the Groom Asset Editor", "Lit > Groom > Root Bindings in the level viewport", "stat groom", "Enable Debug Simulation on the Groom component itself"]
        answer_index: 1
        explain: "The page says to select Lit > Groom > Root Bindings and hover over the deformed RBF check box in the viewport."
      - q: "A material does not show up on the groom. What are the two requirements from the Groom Materials page?"
        choices: ["Two-sided and Masked blend mode in the material Details", "Translucent blend mode and a Depth texture from the cards", "Hair shading model and the Use with Hair Strands usage flag", "Substrate enabled and Nanite off in the Project Settings"]
        answer_index: 2
        explain: "The material must use the Hair shading model and the Use with Hair Strands flag must be enabled. The flag is set automatically the first time you apply the material to a groom."
      - q: "In the Hair Attributes node, what does U mean?"
        choices: ["The U coordinate of the UV of the scalp mesh at the root", "The strand thickness, from 0 at the tip to 1 at the root", "The hair group index, starting at 0 for the first group", "Position along the strand, 0 at the root and 1 at the tip"]
        answer_index: 3
        explain: "The U coordinate is always along the hair, with 0 at the root and 1 at the tip. Root UV is the UV of the underlying mesh at the root."
      - q: "Which Hair Attributes outputs are used only for cards and mesh geometry?"
        choices: ["Depth, Coverage, AuxiliaryData and AtlasUVs", "U, V, Length, Radius and Root UV", "Seed, World Tangent and Group Index", "BaseColor, Roughness, Tangent, Seed and Length"]
        answer_index: 0
        explain: "Depth, Coverage, AuxiliaryData and AtlasUVs are listed as only used for cards and mesh geometry. Seed, U/V, Length and Tangent apply to strands."
    flavors:
      _default: {why: "How hair follows the head, and how its material reads strand data, decides if hair looks real or floats."}
      tech_art: {why: "Binding settings are a quality-versus-build-time trade you will be asked about. The Hair Attributes node is your only way into strand data.", do: "Expose the root and tip colors as parameters and make two instances (blonde, black) that share M_Hair_TA."}

