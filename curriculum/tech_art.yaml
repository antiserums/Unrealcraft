    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/static-mesh-editor-ui-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-collisions-with-static-meshes-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-and-using-lods-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a prop mesh in the Static Mesh Editor, for example SM_ChamferCube or SM_Ramp from the folder LevelPrototyping/Meshes of the template. To keep the original unchanged, duplicate it first and work on the copy."
      - "Read the stats text in the corner of the viewport: LOD count, Triangles, Vertices, UV channels and Num Collision Primitives. Write these numbers down."
      - "Click UV in the toolbar. Show UV Channel 0 in the viewport, and then UV Channel 1. A UV channel is a flat layout of the mesh surface that tells textures where to go."
      - "Open the Collision menu and choose Remove Collision. Then add an 18DOP Simplified Collision from the same menu. Turn Show > Simple Collision on and off to see the new shape."
      - "In the Details panel, find LOD Settings and the Number of LODs value. Set the LOD picker to LOD 0."
      - "Open Window > Socket Manager, and note that this panel is not shown by default. Then save the mesh."
    done_when: "Send one screenshot of the Static Mesh Editor that shows the stats overlay, the 18DOP collision, and UV channel 0."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which panel is NOT shown by default in the Static Mesh Editor?"
        choices: ["Viewport", "Details panel", "Socket Manager", "Toolbar"]
        answer_index: 2
        explain: "The Window menu lists Socket Manager and Convex Decomposition as panels that are not displayed by default."
      - q: "What does the 26DOP Simplified Collision option generate?"
        choices: ["A sphere around the mesh, with 26 segments", "A capsule that is aligned to the longest axis", "Collision for every triangle of the render mesh", "A box with all edges and corners beveled, 26 sides"]
        answer_index: 3
        explain: "26DOP makes an axis-aligned box with all edges and corners beveled, 26 total sides. 18DOP bevels only edges, 10DOP bevels four edges."
      - q: "You add a Box Simplified Collision to a mesh that already has a Sphere collision. What happens?"
        choices: ["The box replaces the sphere", "The box is added, so the mesh now has both", "The editor asks which one you want to keep", "Nothing, one collision per mesh"]
        answer_index: 1
        explain: "A new simplified collision does not replace the old one. It adds to it. Use Remove Collision to clear all."
      - q: "Which viewport overlay stat tells you about the mesh's UVs?"
        choices: ["Approx Size", "UV channels", "Distance Field", "Current Screen Size"]
        answer_index: 1
        explain: "UV channels shows the number of UV channels. The page notes unique, non-overlapping UVs are required for shadow mapping."
      - q: "With Auto Compute LOD Distances and 2 LODs, when does LOD1 show?"
        choices: ["When the mesh is more than 100 units away from the camera", "When the mesh takes less than 50 percent of the screen", "Only when forced with LOD 1 in the viewport menu", "When the frame rate drops below the target rate"]
        answer_index: 1
        explain: "Auto Compute divides screen size equally between LODs. With 2 LODs, LOD0 shows at 50 percent or more and LOD1 below that."
      - q: "What does Auto Convex Collision do?"
        choices: ["Adds a single box", "Generates convex collision based on the mesh shape, with a Convex Decomposition panel", "Removes all collision from the mesh, and then adds one convex hull around the whole mesh", "Converts the complex collision of the mesh to simple shapes, one box per material slot"]
        answer_index: 1
        explain: "Auto Convex Collision builds convex hulls from the mesh shape. Hull Count, Max Hull Verts and Hull Precision control the result."
    flavors:
      _default: {why: "Every prop passes through this editor. Knowing its panels saves hours of guessing."}
      tech_art: {why: "Tech artists check triangle counts, UV channels and collision here before a mesh goes into the level.", do: "Use Auto Convex Collision on the chair with Hull Count 8 and compare the primitive count to the 18DOP version."}

