  - id: TAQ24
    rank: 3
    difficulty: expert
    specializations: [tech_art]
    subjects: [niagara, performance, scalability, effect-types, debugging]
    required_spine: false
    required: false
    title: Budget your effects
    brief: "Effects can use up the whole frame time if nobody sets limits. A Niagara Effect Type is an asset that holds shared rules for a group of effects, such as when to turn effects off because they are far away or because too many are playing. Turning off an effect in this way is called culling. In this quest you create an Effect Type with a budget, give it to two systems, and use the Niagara Debugger to watch effects get culled."
