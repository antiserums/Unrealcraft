    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/niagara-debugger-for-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/scalability-and-best-practices-for-niagara"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create an Effect Type named EFT_TA_Ambient. In the Content Browser, choose FX, then Niagara Effect Type."
      - "Open it. Under Budget Scaling, set Max Global Budget Usage and one curve, for example Max Distance Scale by Global Budget Use."
      - "Assign EFT_TA_Ambient to two Niagara systems in their System Properties. If you have no systems, make two from templates such as Fountain with FX, then Niagara System. Place about 30 copies of them in a level named L_TA_FXBudget."
