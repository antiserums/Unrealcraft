        explain: "The burst gives a big group of particles at start. Spawn Rate then keeps a stream of 500 per second while the emitter is active."
      - q: "In Curl Noise Force, what happens when you lower Noise Frequency?"
        choices: ["The sphere of particles gets more warped", "The particles turn red", "Fewer particles spawn", "The particles stop moving"]
        answer_index: 0
        explain: "The tutorial says the smaller the Noise Frequency, the more the sphere of particle locations becomes warped."
      - q: "What does Kill Radius do in Point Attraction Force?"
        choices: ["It sets where particles are removed at the end of their life", "It sets the spawn sphere size", "It sets the color curve length", "It sets how many particles the GPU can hold"]
        answer_index: 0
        explain: "Kill Radius is the area where particles dissolve at the end of their life cycle. The tutorial sets it to 4."
      - q: "When is a GPU sprite emitter the right choice?"
        choices: ["Always, it is faster in every case", "Only for ribbon effects", "When you need tens of thousands of particles and the CPU would struggle", "Only when the effect uses collision"]
        answer_index: 2
        explain: "The guide is for effects that need tens of thousands of particles, where CPU simulation can cause performance problems."
    flavors:
      _default: {why: "Big particle counts need the GPU, and GPU emitters have rules."}
      tech_art: {why: "Knowing when to move an emitter to GPUComputeSim and why bounds matter is a core optimization skill.", do: "Set Spawn Count to 25000 and compare stat fps between the GPU emitter and a CPU copy."}

