    flavors:
      _default: {why: "Light from particles sells fire, magic and sparks."}
      tech_art: {why: "Particle lights are expensive. Learn the setup so you can budget them.", do: "Raise Spawn Rate until stat unit shows a clear cost, then note the number in your writeup."}

  - id: TAQ61
    rank: 1
