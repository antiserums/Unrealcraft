      - q: "You created a dynamic input but it is missing from the dropdown list. What does the docs suggest?"
        choices: ["Restart the editor", "Uncheck Library Only", "Set Sim Target to GPU", "Enable Requires Persistent ID"]
        answer_index: 1
        explain: "If a module or dynamic input you created does not appear, try unchecking Library Only."
      - q: "For a property to be editable in the Curves panel, what must be true?"
        choices: ["It must be a User parameter that is exposed on the system", "It must be in the Render group of the emitter and have a material assigned", "It must be an integer, because curves cannot hold floats", "It must use a Distribution type that uses a curve, such as Float from Curve"]
        answer_index: 3
