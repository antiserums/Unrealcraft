    verify_type: screenshot
    quiz:
      - q: "What does Partitioned Generation change compared with the default PCG component?"
        choices: ["It converts every spawned mesh to Nanite, so the graph can place far more instances", "It disables debug rendering for the component, so large graphs generate much faster", "It bakes the result to one static mesh, so the whole graph only costs a single draw call", "It generates results across a user-defined grid, so data is split per cell for streaming"]
        answer_index: 3
        explain: "By default everything lives in the component's domain. Partitioned Generation splits the output across grid cells, which streams better."
      - q: "Where should the Grid Size node be placed in a Hierarchical Generation graph?"
        choices: ["After the Static Mesh Spawner", "At the very end of the graph", "Before any sampler nodes", "Inside a subgraph only"]
        answer_index: 2
        explain: "The Grid Size node sets the grid for everything downstream and should be placed before any sampler nodes."
      - q: "Which meshes belong on the larger grid size, per the guidelines?"
        choices: ["Small and numerous meshes, like grass and pebbles", "Large, less numerous meshes like trees and boulders", "All meshes with collision, whatever their size is", "Only Nanite meshes, since they have no LOD cost"]
        answer_index: 1
        explain: "Large meshes are fewer and go on a larger grid. Small, numerous meshes go on a smaller grid."
      - q: "A Mesh Sampler on the default HiGen grid runs once per cell. What does the page recommend?"
        choices: ["Use the Unbounded grid size so it runs once, then apply Grid Size nodes after", "Increase the Partition Grid Size until one single cell covers the whole level", "Disable Hierarchical Generation and split the level into several PCG volumes", "Add more PCG volumes, one per cell, so that each sampler runs only one time"]
        answer_index: 0
        explain: "Unbounded removes the grid restriction so the expensive node runs once. Grid restrictions can then be applied downstream."
      - q: "Data passed from a larger grid to a smaller one can be duplicated in every small cell. Which node removes the extra points?"
        choices: ["Difference with the Actor Bounds", "Density Filter with a low bound", "Cull Points Outside Actor Bounds", "Self Pruning with a large radius"]
        answer_index: 2
        explain: "The page names Cull Points Outside Actor Bounds to remove points that exist outside the smaller grid cell."
      - q: "How is a runtime-generated component cleaned up?"
        choices: ["When it leaves the generation radius scaled by the Cleanup Radius Multiplier", "It is never cleaned up; it stays in memory until the level is unloaded", "When the level is saved, or when the editor runs its next garbage collection", "When the player has looked away from it for more than one second in a row"]
        answer_index: 0
        explain: "Components generate inside the Generation Radius and are cleaned up when they are no longer within that radius scaled by the Cleanup Radius Multiplier."
      - q: "What is the rule for Generation Radii across grid sizes?"
        choices: ["All radii must be equal, so that every grid loads at the same time", "Small grids should have a larger radius than the large grids above them", "Radii only apply to the Unbounded grid, and the other grids ignore them", "Each radius should be larger than the previous smaller grid's radius"]
        answer_index: 3
        explain: "The page says to avoid small grid sizes having a larger radius than larger grids. Radii should increase with grid size."
      - q: "What do PCG subgraphs do with grid sizes?"
        choices: ["They define their own grid size, which replaces the one of the parent graph", "Their grid sizes are disabled and they use the input data or parent graph grid", "They always use Unbounded, whatever grid sizes are set in the parent graph", "They double the parent grid, so each subgraph cell covers four parent cells"]
        answer_index: 1
        explain: "Subgraphs have their grid sizes disabled and use the grid size of their input data or parent graph."
    flavors:
      _default: {why: "Generation modes are how PCG stays fast in open worlds. Without them a big volume regenerates everything at once."}
      tech_art: {why: "Grid sizes and radii are the performance dials of a PCG tool. You own them.", do: "Try the Direction Weight in the scheduling policy and note how generation order changes."}

  - id: TAQ91
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [uv, modeling-mode, uv-editor, texturing]
    required_spine: false
    required: false
    title: "UV Editor: seams, unwrap, pack, UDIMs"
    brief: "UVs are the 2D layout of a 3D mesh. They tell the engine which part of a texture goes on which part of the surface. A seam is a cut in that layout, and each separate piece is called an island. Unreal has its own UV Editor, so you can fix UVs without going back to another 3D program. In this quest you cut seams, unwrap a mesh, pack the islands, and try UDIMs, which are extra numbered tiles next to the normal UV square."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/uv-editor-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/uvs-category-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Make a mesh in Modeling Mode that has PolyGroups, which are named groups of faces (a box with a few extrusions works). Name it SM_UVTest."
      - "Right-click the mesh in the level and open the UV Editor."
      - "Use the Seam tool in Split mode to cut seams. Then use Sew to join one seam back together."
      - "Run Unwrap with the ExpMap method, and then with the SpectralConformal method. Compare the distortion with the help of the checker background."
      - "Run Layout in Repack mode, which arranges the islands so they do not overlap. Then try Stack on two islands that share a texture."
      - "In Display, enable a texture background and turn on the UDIM labels. Move one island into the tile 1002."
      - "Add a second UV channel with Channels. Then click Apply to save the changes to the mesh."
    done_when: "Send a screenshot of the UV Editor that shows the 2D viewport with repacked islands and UDIM labels visible, and the 3D viewport with the checker texture on the mesh. Add a screenshot of the Channels list with two channels."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which Layout type packs islands into a unit square with no overlap?"
        choices: ["Repack", "Stack", "Transform", "Align"]
        answer_index: 0
        explain: "Repack scales and moves islands collectively with no overlap. Stack packs each island with overlap. Transform keeps the layout."
      - q: "When is Stack a good choice?"
        choices: ["When the islands must never overlap at all", "When you need lightmap UVs for baked lighting", "When islands share the same texture design", "When the mesh is Nanite and has no UVs"]
        answer_index: 2
        explain: "Stack overlaps islands. It is useful when two islands share the same texturing so you do not replicate the texture."
      - q: "Which Unwrap type gives the least distortion but is slowest to compute?"
        choices: ["ExpMap projection", "Conformal", "Island Merging", "SpectralConformal"]
        answer_index: 3
        explain: "SpectralConformal reduces distortion further than Conformal but costs more compute. ExpMap is fast but limited."
      - q: "What does the Sew tool do?"
        choices: ["Cuts the selected edge into a new seam, making two islands out of one", "Connects the selected edge to its counterpart edge, making one island", "Scales the selected islands so that each one fills a whole UDIM tile", "Creates a new UV channel and copies the selected islands over to it"]
        answer_index: 1
        explain: "Sew joins the red selected edge with its green counterpart. If the edge is already connected or is a boundary you get a warning."
      - q: "Which AutoUV method is the built-in default and supports large models like Nanite meshes?"
        choices: ["UV Atlas", "Patch Builder", "XAtlas", "Lightmass Packer"]
        answer_index: 1
        explain: "Patch Builder is the default built in-engine and supports large models. UV Atlas suits organic shapes. XAtlas suits light maps and mechanical meshes."
      - q: "How are UDIM tiles numbered?"
        choices: ["Starting at 0001, going up by one for each new tile", "By the UV channel index, so channel 0 is tile 1000", "Starting at 1000, ten down a column, then the next one", "Starting at 1001, ten across a row, then the next row"]
        answer_index: 3
        explain: "The 2D viewport grid uses unit squares. UDIMs start at 1001 and fill 10 tiles horizontally before moving to the next row."
      - q: "A texture background shows only in the 0-1 square. What is needed to see it in other squares?"
        choices: ["UDIMs must be set for those squares", "A second UV channel on the same mesh", "The Apply button must be clicked", "A larger texture must be imported"]
        answer_index: 0
        explain: "The background displays for 0-1 automatically. Other unit squares need UDIMs set to show correctly."
      - q: "In the Split tool, what is a bowtie vertex?"
        choices: ["A vertex on a seam that is shared by exactly two UV islands", "A vertex that lies outside the 0-1 space of the UV channel in use", "A vertex that joins triangles by one point instead of an edge", "A vertex with two UV channels that hold different positions"]
        answer_index: 2
        explain: "Bowtie vertices join triangles by a single point. Splitting islands disconnects UV topology at any bowtie vertices in the selection."
    flavors:
      _default: {why: "Good UVs are the base for every texture, decal and bake. In-engine UV tools fix meshes without a round trip."}
      tech_art: {why: "Knowing the unwrap and pack options lets you script or document a UV pipeline for the team.", do: "Compare the same mesh unwrapped with all three Unwrap types and write down which one you would use for organic props."}

  - id: TAQ92
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [merge-actors, proxy-mesh, lod, optimization]
    required_spine: false
    required: false
    title: "Proxy meshes: Simplify vs Approximate"
    brief: "A proxy mesh is one simple mesh with one material that stands in for a whole group of meshes when the player sees them from far away. It replaces many objects and materials with one cheap object. The Merge Actors tool can build a proxy in two ways: Simplify, which reduces the existing meshes, and Approximate, which builds a new mesh around them and also works with very dense Nanite meshes. In this quest you build a proxy with each method and compare them."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/merging-actors-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/proxy-geometry-tool-overview-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Build a small structure out of 10 or more static meshes, and make some of them Nanite meshes. Boxes and other shapes made in Modeling Mode work, with Enable Nanite Support turned on for some of them. Note how many triangles and how many materials the structure has."
      - "Select the actors and open Actor, then Merge Actors, then Merge Actor Settings. Run Simplify with Screen Size set for a view from far away. Save the result as SM_Proxy_Simplify."
      - "Run Approximate with Output Type set to Mesh and Materials and Simplify Method set to Fixed Triangle Count. Save the result as SM_Proxy_Approx."
      - "In the Approximate settings, enable Base Capping (Convex Solid) and Fill Gaps, and run it again. Compare the result with the one before."
      - "Try the Ground Clipping option Cut And Fill With ZPlane, so that no part of the proxy hangs below the ground."
      - "Open both proxies in the Static Mesh Editor. Compare their triangle count, material count and texture quality."
      - "Write a short note that says which method you would use for this set of meshes and why."
    done_when: "Send a screenshot of the Merge Actor Settings for Approximate, and a side-by-side screenshot of the two proxies in the Static Mesh Editor with the triangle and material counts visible. Include your note of one paragraph."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the key difference between Simplify and Approximate?"
        choices: ["Approximate keeps all source materials and UVs, while Simplify bakes them into one material", "Simplify is only for landscapes, while Approximate works on every kind of static mesh", "Approximate handles much more complex sources such as Nanite meshes where Simplify would fail", "Simplify produces instanced components, while Approximate always makes one static mesh"]
        answer_index: 2
        explain: "Approximate is new in UE5 and similar to Simplify, but it works on complex sources like Nanite meshes that make Simplify fail during simplification or baking."
      - q: "Which LOD of each source mesh does Simplify use to build the proxy?"
        choices: ["LOD0, the most detailed LOD of each mesh", "The LOD matching the current screen size", "A random LOD picked for each mesh", "The lowest-detail LOD of each mesh"]
        answer_index: 3
        explain: "Simplify merges the lowest-detail LOD of each selected mesh, then reduces geometry further."
      - q: "How many draw calls does a Simplify result use?"
        choices: ["One for each source material", "One, with one baked material", "One per source actor", "Two: mesh and shadow"]
        answer_index: 1
        explain: "Simplify bakes a single material and gives one draw call. Merge keeps one section per material."
      - q: "Which merge method creates instanced static mesh components from identical meshes?"
        choices: ["Batch", "Simplify", "Merge", "Approximate"]
        answer_index: 0
        explain: "Batch groups identical Static Mesh components into instanced components. It preserves UVs."
      - q: "In Approximate, which Simplify Method keeps the result within a maximum distance from the input surface?"
        choices: ["Fixed Triangle Count", "Triangles Per Area", "Screen Size", "Geometric Tolerance"]
        answer_index: 3
        explain: "Geometric Tolerance limits simplification to a maximum geometric deviation set by the Geometric Deviation option."
      - q: "When does the page suggest Convex Solid base capping over Convex Polygon?"
        choices: ["For a mountain scan that is open at the bottom and needs no cap", "For many kitbashed open parts where an open mesh causes problems", "Never, because Convex Solid is deprecated and will be removed", "Only for skeletal meshes, which always need a closed base cap"]
        answer_index: 1
        explain: "A large uncapped scan should use the polygon. Many kitbashed open parts can be more reliable with the solid."
      - q: "What does Group Identical Meshes for Baking do, and what is its risk?"
        choices: ["Bakes identical meshes once for speed, but can differ for materials using world position or per-instance data", "Merges all materials of the identical meshes into one, but loses the UVs that the lightmaps of the proxy need", "Removes triangles that are hidden inside other meshes before baking, but can break the collision of the result", "Doubles the texture size for meshes that repeat, but can use up the texture memory budget on large levels"]
        answer_index: 0
        explain: "It bakes identical meshes or instances only once, which is faster and cleaner, but materials driven by world position or per-instance data can look different."
      - q: "Why would you disable Allow Distance Field on a proxy?"
        choices: ["To make it cast shadows from the Directional Light only", "To enable Nanite on the proxy mesh after it is built", "To save memory when the mesh is only seen in the distance", "To keep the UVs of the source meshes in the proxy"]
        answer_index: 2
        explain: "The page says to disable it to save memory if the merged mesh is only rendered far away."
    flavors:
      _default: {why: "Proxies turn dozens of meshes and materials into one cheap object for distance views."}
      tech_art: {why: "Choosing the method and its settings is a tech-art call that affects memory, draw calls and look.", do: "Use Print Debug Messages once and note the timing difference between the first and second bake, as the Proxy Geometry page describes."}

  - id: TAQ93
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [instancing, ism, blueprint, modeling-mode, materials]
    required_spine: false
    required: false
    title: "ISM tooling: custom data, harvest, edit"
    brief: "An Instanced Static Mesh component, or ISM, draws many copies of the same mesh as one object, which is the cheapest way to show many copies. Each copy is called an instance. Every instance can carry a few numbers of its own, called custom data, that a material can read to make the copies look different. In this quest you build a shelf of books with one ISM, tint each book through custom data, and turn separate actors into instances with the editor tools."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/instanced-static-mesh-component-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/merging-actors-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Make a Blueprint named BP_ShelfBooks with an Instanced Static Mesh component that uses a cube scaled to the shape of a book. In the Construction Script, add N instances in a row, each with a small random tilt."
      - "Set Num Custom Data Floats to 1 on the component. Write a random value for each instance with the Set Custom Data Value node."
      - "Make a material named M_Book that reads PerInstanceCustomData at index 0 and uses it to tint each book. Apply the material to the ISM."
      - "Place 30 copies of a prop in the level as separate actors, for example a cube or a cylinder. Open Modeling Mode, go to the XForm category, and use Harvest Instances to combine them into one ISM."
      - "Use the ISM Editor tool to move some instances, and replace one instance with another mesh. Note what happens to the list of components."
      - "Select another group of actors and run Actor, then Merge Actors, then Batch. Compare the result with Harvest Instances."
      - "Compare the stat unit values and the draw counts before and after you batch the actors."
    done_when: "Send a screenshot of BP_ShelfBooks in the level with the tint of each instance visible, and a screenshot of its Construction Script. Also send a screenshot of the Details panel after Harvest Instances that shows one actor with an ISM component."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Per the page, roughly how much GPU memory does a primitive use compared to a basic instance?"
        choices: ["About the same, near 64 bytes for each one", "About ten times more, 672 bytes vs 64 bytes", "About half, 32 bytes compared to 64 bytes", "Instances use more, about 672 bytes for each"]
        answer_index: 1
        explain: "The page gives 672 bytes for a primitive versus 64 bytes for an instance, roughly ten times more."
      - q: "What is different about the Details panel when you click a single instance inside an ISM?"
        choices: ["Only transform properties are available; other properties are shared", "You can change its material, but not the mesh that it is based on", "You can set a separate LOD for it, but the transform is locked", "Nothing; it is the same panel that you get for a Static Mesh Actor"]
        answer_index: 0
        explain: "Instances share everything except transform, which is what makes the component efficient."
      - q: "What did HISM traditionally do that ISM did not, and what changed?"
        choices: ["HISM supported Nanite meshes; ISM can now use Nanite meshes as well", "HISM had collision per instance; ISM now has collision per instance too", "HISM applied LODs per instance; ISM can now use per-instance LODs as well", "HISM used vertex colors per instance; ISM still cannot use them"]
        answer_index: 2
        explain: "HISM applied LODs per instance while ISM used component bounds. Now ISM can also use per-instance LODs."
      - q: "What is Per Instance Custom Data used for?"
        choices: ["Storing a collision shape for each instance, without a separate component", "Saving LOD screen sizes for each instance, so every one can switch on its own", "Naming instances, so that you can find each one by name in the Outliner", "Passing values to the material without a dynamic material instance per mesh"]
        answer_index: 3
        explain: "Custom Primitive Data and Per Instance Custom Data feed values into a material so you avoid a dynamic material instance per mesh."
      - q: "In the ISM Editor, what happens when you replace an instance with a new static mesh asset?"
        choices: ["A second ISM component is added", "The whole component switches mesh", "The instance is deleted", "The mesh becomes a static mesh actor"]
        answer_index: 0
        explain: "An ISM holds one mesh asset. Replacing an instance with another asset adds a second ISM component."
      - q: "Which Modeling Mode tool batches selected static mesh actors into an ISM or HISM?"
        choices: ["Pattern Instances", "Merge Instances", "Harvest Instances", "Convert to Instances"]
        answer_index: 2
        explain: "Harvest Instances in the XForm category collects selected actors into one instanced component. Pattern creates tiled copies."
      - q: "In Merge Actors > Batch, what does Instance Replacement Threshold control?"
        choices: ["The maximum instance count that one single instanced component is allowed to hold", "The largest distance between two instances that are still merged into one component", "The LOD to use for every instance when the batched component is first created", "The minimum number of instances before a mesh is replaced with an instanced version"]
        answer_index: 3
        explain: "A mesh is only converted to instances when it has at least that many copies."
      - q: "Why would you enable Skip Meshes with Vertex Colors when batching?"
        choices: ["To speed up baking, because meshes with vertex colors take much longer to be processed", "Because instanced static meshes do not support vertex colors per instance, so data would be lost", "Because vertex colors break Nanite, and instanced static meshes are always built as Nanite meshes", "To reduce draw calls, because each vertex color set adds one more draw call per instance"]
        answer_index: 1
        explain: "Instances cannot carry per-instance vertex colors. Skipping those meshes prevents data loss."
    flavors:
      _default: {why: "Instancing is the cheapest way to draw many copies, and the tooling around it is often built by tech art."}
      tech_art: {why: "Per-instance custom data plus Construction Script placement is the pattern behind many prop-kit tools.", do: "Expose a curve or seed on BP_ShelfBooks so an artist can re-roll the tilt and tint without opening the graph."}

  - id: TAQ94
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [modeling-mode, polygroups, mesh-editing, topology]
    required_spine: false
    required: false
    title: "PolyGroups: box modeling in engine"
    brief: "Unreal stores every mesh as triangles, which are hard to edit one by one. A PolyGroup is a set of triangles that you treat as one face, for example the two triangles that form one side of a cube. The PolyGroup Edit tool in Modeling Mode lets you extrude, inset and bevel these faces, much like box modeling in other 3D programs. In this quest you set up PolyGroups on a cube and shape it with these tools."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/polygroup-edit-tool-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/understanding-polygroups-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/polygroup-edit-tool-reference-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Import or create a plain cube. Use Tri Select to put the two triangles of each side into one PolyGroup, so that each side becomes a quad (a face with four corners)."
      - "Set Face Color Mode to By Group, which colors each group differently, and check that the groups are correct."
      - "Open PolyGroup Edit. Use Extrude on the top face to pull it out, then use Inset on it to make a smaller face inside, and then use Bevel on the edges to make them less sharp."
      - "Use Insert Edge Loop with Position Mode set to Even and Number of Loops set to 2. Then try the Distance Offset mode."
      - "Merge two side faces into one PolyGroup. Then use Decompose to split it back into one group per triangle."
      - "Run Simplify by Groups and check the result in the wireframe."
      - "In the UVs section, use Planar Projection on one face, and check it with the checkerboard material."
    done_when: "Send a screenshot of the edited mesh in PolyGroup Edit with Face Color Mode set to By Group and Show Wireframe on. It must show the extrusion, the inset, the bevel and the inserted loops."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Why do PolyGroups exist in Unreal's modeling tools?"
        choices: ["They store collision, so each PolyGroup becomes one simple collision shape on the mesh", "They are required for Nanite, which builds all of its clusters from the PolyGroups of each mesh", "They replace materials, so each PolyGroup is drawn with its own color and shader", "Unreal renders only triangles, so groups approximate quads and n-gons for a DCC-like workflow"]
        answer_index: 3
        explain: "The engine stores meshes as triangles. Grouping triangles gives surfaces you can edit like quads in other tools."
      - q: "What happens to triangles you did not assign to a PolyGroup?"
        choices: ["They are deleted from the mesh when you accept the tool", "They are grouped together automatically into one PolyGroup", "They cannot be edited until you assign them to a group", "They each become a PolyGroup of their own, one per triangle"]
        answer_index: 1
        explain: "The page says triangles not assigned a PolyGroup are automatically grouped into one."
      - q: "Insert Edge Loop works only on which kind of faces?"
        choices: ["Quad-like faces with exactly four corners", "Any triangle that has three visible edges", "Faces that share one material slot only", "Faces that lie on the border of the mesh"]
        answer_index: 0
        explain: "Edge loops can only cross quad-like PolyGroups. Highlight Problem Groups marks the ones that stop the loop."
      - q: "A cube top has two PolyGroups of one triangle each. What does the docs FAQ say about inserting a loop there?"
        choices: ["The loop goes straight across, as it would on a single quad face", "The tool refuses to run and shows a warning about the groups", "The loop slants to the side; one group for both triangles fixes it", "The loop is inserted twice, once for each of the two triangles"]
        answer_index: 2
        explain: "With single-triangle groups the loop slants. One PolyGroup representing the quad lets the loop continue straight."
      - q: "What is the difference between the Retriangulate and Plane Cut insertion modes?"
        choices: ["Retriangulate keeps the existing triangles and only adds new edges; Plane Cut deletes all triangles in the group and builds new ones", "Retriangulate rebuilds groups with simple topology but breaks non-planar groups; Plane Cut keeps the shape but can fragment triangles", "They are the same; Plane Cut is only the older name of Retriangulate, kept so that tools from earlier engine versions still work", "Plane Cut only works on UVs and leaves the mesh as it is; Retriangulate only works on the mesh and leaves the UV islands as they are"]
        answer_index: 1
        explain: "Retriangulate deletes existing groups and makes new triangles. Plane Cut cuts existing triangles, preserving non-planar shapes."
      - q: "Why can you not select an interior vertex of a PolyGroup?"
        choices: ["Interior vertices are locked by the engine and can never be moved in any tool", "They are part of the collision, so only the Physics tools can select them", "They are hidden by wireframe; turn off the wireframe overlay to see them", "Only bordering vertices are selectable; use Decompose to reach interior ones"]
        answer_index: 3
        explain: "Only bordering vertices are selectable. Decompose splits the group per triangle so the interior vertices become borders."
      - q: "When does the reference warn against Simplify by Groups?"
        choices: ["On meshes with UVs, because the tool always removes every UV channel", "On meshes with fewer than 100 triangles, which the tool cannot reduce further", "On PolyGroup topologies with non-planar faces, which can lose their shape", "On Nanite meshes, because their clusters cannot be simplified at all"]
        answer_index: 2
        explain: "Simplify by Groups removes interior and colinear vertices and retriangulates. Non-planar faces lose their shape or fail."
      - q: "How is a PolyGroup vertex generated?"
        choices: ["Where three or more PolyGroup edges connect", "Wherever two faces touch along one edge", "At every mesh vertex inside a PolyGroup", "Only where Add Extra Corners is turned on"]
        answer_index: 0
        explain: "Two or more connecting faces create a PolyGroup edge. Three or more connecting edges create a PolyGroup vertex. Add Extra Corners adds more at sharp bends."
    flavors:
      _default: {why: "PolyGroup Edit is the closest thing to box modeling inside Unreal. It fixes props without leaving the editor."}
      tech_art: {why: "PolyGroups also drive UV islands, material assignment and Geometry Script selections, so understanding them pays off everywhere.", do: "Create a second PolyGroup Layer with Edit Attributes and use it only for UV islands."}

  - id: TAQ95
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [rigging, skeletal-mesh, skinning, animation-tech]
    required_spine: false
    required: false
    title: "Rig a prop without leaving the editor"
    brief: "To rig a mesh means to give it bones, and to skin it means to decide how much each bone moves each vertex. That amount is called a skin weight. This work is normally done in another 3D program (often called a DCC, a digital content creation tool), but Unreal has its own tools for simple cases. In this quest you turn a static prop into a Skeletal Mesh, add three bones, paint the skin weights and test the bend, all inside the editor."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/skeleton-editing-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open any project, or create one from the Third Person template. Open Edit > Plugins, look in the Animation section, and enable the Skeletal Mesh Editing Tools plugin. Restart the editor."
      - "Pick a simple static mesh prop that should bend, for example an antenna, a lamp arm or a tall cylinder made in Modeling Mode. Right-click it in the Content Browser, choose Convert to Skeletal Mesh, and pick Create New for the Skeleton. Name the result SK_Antenna."
      - "Open the new Skeletal Mesh SK_Antenna, not the Skeleton asset. In the toolbar of the Skeletal Mesh Editor, click Editing Tools and choose the Skeleton mode. With the Edit Skeleton tool in Add mode (N), select the root bone and drag three new bones up the prop, one after the other. Click Accept."
      - "Select the three new bones together and rename the first one to seg_##1, so that they become seg_001, seg_002 and seg_003. In Edit mode, use Orient with Primary X and Orient Children turned on, so that all bones point the same way."
      - "Switch to the Skin mode and run Bind Skin with Binding Type set to Geodesic Voxel and Max Influences set to 4. Then open Edit Weights, select a bone, and paint with the Brush in Add mode. Hold Shift to Relax (smooth) the weights where two bones meet, and click Accept."
      - "Test the rig: select seg_002 in the Skeleton Tree, rotate it with the gizmo, and check that the prop bends smoothly. If the bend looks bad, go back and paint the weights again."
    done_when: "Send two screenshots: one of the Skeleton Tree that shows the root plus seg_001, seg_002 and seg_003, and one of the viewport with seg_002 rotated so that the prop bends without broken vertices."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You use Convert to Skeletal Mesh on a static mesh and choose Create New for the Skeleton. What does the new Skeleton contain at first?"
        choices: ["A full biped skeleton that fits a mannequin", "One root bone at the origin of the static mesh", "One bone for each material section of the mesh", "No bones at all until you import an FBX file"]
        answer_index: 1
        explain: "The page says that when creating a new Skeleton asset, a single root bone is created at the origin point of the Static Mesh."
      - q: "In the Edit Skeleton tool, you are in Add mode and select a bone, then drag out a new bone. What decides the parent of the new bone?"
        choices: ["The bone closest to the mouse when you release", "The root bone is always the parent", "You pick the parent in a dialog after Accept", "The first selected bone becomes the parent"]
        answer_index: 3
        explain: "The first selected bone acts as the parent to the new bone. Press Accept to confirm the bone and its placement."
      - q: "You multi-select a chain and rename the first bone to tail_##1. What do the next bones become?"
        choices: ["tail_002, tail_003", "tail_##2, tail_##3", "tail_1, tail_2 (the # signs are removed)", "The rename fails because # is not allowed in names"]
        answer_index: 0
        explain: "The # operator adds a successive number. tail_##1 gives tail_001, and the following bones become tail_002, tail_003."
      - q: "A vertex has weight 0.7 on the forearm and 0.3 on the upper arm. You set the forearm to 0.6. What happens?"
        choices: ["The vertex now has a total weight of 0.9 and moves late", "The extra 0.1 goes to the root bone", "Unreal changes the upper arm to 0.4 so the total stays 1", "The change is rejected until you add a third influence"]
        answer_index: 2
        explain: "Skin weights are normalized so each vertex totals 1. Removing weight from one bone pushes it onto the other influences, here the upper arm goes from 0.3 to 0.4."
      - q: "A vertex has only one influence. You try to set that bone's weight to 0.5. What is the result?"
        choices: ["The weight becomes 0.5 and the vertex lags behind the bone", "The other half goes to the parent bone automatically", "The vertex becomes unskinned", "Normalization sets it back to 1.0"]
        answer_index: 3
        explain: "With a single influence there is nothing to give weight to. The page says setting it to anything other than 1.0 triggers normalization which returns it to 1.0."
      - q: "You are painting weights on a mouth. The bottom lip keeps getting weight when you paint the top lip. Which brush type fixes this?"
        choices: ["Volume brush, because it ignores how the vertices are connected", "Surface brush, because it uses geodesic distance along the mesh", "Relax brush with a smaller radius, so it reaches fewer vertices", "The Vertices mode Flood operation, because it fills one lip only"]
        answer_index: 1
        explain: "The Surface brush affects vertices by distance along the surface (geodesic distance), so painting the bottom lip does not touch the top lip. The Volume brush uses straight-line distance."
      - q: "In Bind Skin you lower the Stiffness value. What changes?"
        choices: ["More distant bones can contribute to the bind", "The brush gets softer near its outer edge", "Fewer bones can influence each of the vertices", "The voxel grid gets finer around thin parts"]
        answer_index: 0
        explain: "Stiffness sets the stiffness of the binding. Lower values allow more distant bones to contribute. Max Influences limits the bone count and Voxel Resolution controls the grid."
      - q: "In Vertices mode you flood a bone's weights to 0.0 on all its vertices. Where does that weight go?"
        choices: ["It is deleted and the vertices stop moving", "It goes to the nearest bone by distance", "It is sent back to the root bone of the hierarchy", "It is split evenly between all other bones"]
        answer_index: 2
        explain: "The page states that if weights on a bone are flooded to 0.0, that bone's weights are sent back to the Root bone of the hierarchy."
    flavors:
      _default: {why: "Many props need a bend or a swing. Rigging them inside Unreal skips a whole DCC round trip."}
      tech_art: {why: "You are the person who turns a static prop into something animators can use. Bones, orientation and weights are your job.", do: "Add an Attribute Map (Edit Attributes > Add Weight Map Layer), paint it, and note that a Deformer Graph can read it later."}

  - id: TAQ96
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [animation-modifiers, blueprint, curves, pipeline]
    required_spine: false
    required: false
    title: "Bake a bone height curve with an Anim Modifier"
    brief: "An Animation Modifier is a small Blueprint that changes animation assets for you, for example by adding a curve to an Animation Sequence. A curve is a value that changes over the time of the animation. You write the modifier once and then apply it to one sequence or to every sequence of a Skeleton with one click. In this quest you write a modifier that records the height of one bone into a curve, and you apply it and revert it."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-modifiers-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a Blueprint Class with the parent Animation Modifier (search for it under All Classes) and name it BP_BoneHeightCurveModifier."
      - "Add two variables and mark both as Instance Editable: BoneName (type Name) and CurveName (type Name, with the default value BoneHeight)."
      - "Implement the OnApply event with nodes from the Animation Blueprint Library. First add a Curve track with CurveName, and then loop over the frames of the sequence. For each frame, call Get Bone Pose for Frame with BoneName, read the Z of the location, convert the frame to a time with Get Time at Frame, and add a float curve key at that time."
      - "Implement the OnRevert event so that it removes the curve track again."
      - "Open a walk or jump Animation Sequence of the template mannequin, go to Window > Animation Data Modifiers, click Add Modifier and pick BP_BoneHeightCurveModifier. Set BoneName to a bone whose parent is the root (for example pelvis), because Get Bone Pose returns values in local space, which means relative to the parent bone."
      - "Right-click the modifier and choose Apply Modifier. Check that the BoneHeight curve now appears in the sequence. Then choose Revert, and confirm that the curve is gone."
      - "Add the same modifier to the Skeleton asset and apply it there. Open a second sequence and confirm that the curve was added to it too."
    done_when: "Send one screenshot of the OnApply graph of BP_BoneHeightCurveModifier, and one screenshot of an Animation Sequence that shows the BoneHeight curve with the Animation Data Modifiers tab open. The modifier must be applied and not marked Out of Date."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You add your Anim Modifier to the Skeleton asset instead of one Animation Sequence. What is the effect?"
        choices: ["Nothing, since modifiers only work when added to single sequences", "It only runs on the preview animation that is set on the Skeleton", "It is applied to every Animation Sequence based on that Skeleton", "It is applied to the retarget pose of the Skeleton, not to sequences"]
        answer_index: 2
        explain: "Applying a modifier to a Skeleton applies it to all Animation Sequences based on that Skeleton. On a sequence it affects only that sequence."
      - q: "Which two events should you implement in an Anim Modifier before using library functions?"
        choices: ["OnApply and OnRevert", "BeginPlay and EndPlay", "Construction Script and Tick", "OnImport and OnExport"]
        answer_index: 0
        explain: "OnApply lets you change, add or remove animation data. OnRevert removes your changes and returns the sequence to its original state. Both give you the Animation Sequence to work on."
      - q: "Where do you add and apply an Anim Modifier to an animation?"
        choices: ["Content Browser right-click > Asset Actions > Apply Modifier, then pick it from the list", "Project Settings > Animation > Modifiers, Add Modifier, then click Apply to All Animations", "The Details panel of the Animation Blueprint, in the Modifiers list, then compile it", "Window > Animation Data Modifiers tab, Add Modifier, then right-click > Apply Modifier"]
        answer_index: 3
        explain: "In the Skeleton Editor or Animation Editor open Window > Animation Data Modifiers. Add the modifier there, then right-click it and choose Apply Modifier (or Revert Modifier)."
      - q: "After adding a modifier, it shows a status of Out of Date. What does that mean?"
        choices: ["The Blueprint failed to compile", "It has not been applied yet", "The engine version does not support it", "The animation was re-imported"]
        answer_index: 1
        explain: "The page says your Anim Modifier is listed as Out of Date until you apply it."
      - q: "Get Bone Pose for Frame gives you a transform. In which space is it?"
        choices: ["Local space (relative to the parent bone)", "World space (relative to the level origin)", "Component space (relative to the mesh root)", "Mesh space of the Skeleton reference pose"]
        answer_index: 0
        explain: "Bone transforms from these nodes are in local space. If you need component space, you must convert the transforms yourself."
      - q: "You want an artist to type the bone name in the editor without opening the Blueprint. What do you do?"
        choices: ["Add it to the Details panel of the Skeleton, in a new category with the modifier name", "Expose it as a pin on the OnApply event so that the editor asks for it on every apply", "Make the variable Instance Editable so it appears in the Animation Data Modifiers tab", "Put it in a Data Table and let the artist change the row in the Content Browser"]
        answer_index: 2
        explain: "Properties set as Instance Editable are shown in the Animation Data Modifiers tab, where the artist can edit them before applying."
      - q: "Which helper node gives you a list of bone names from a bone up to the root?"
        choices: ["Get Bone Poses for Time", "Get Frame at Time", "Add Animation Sync Markers", "Find Bone Path to Root"]
        answer_index: 3
        explain: "Find Bone Path to Root takes a sequence and a bone name and outputs the chain of bone names. Get Time at Frame and Get Frame at Time are for converting frames and time."
      - q: "The page shows a classic use of an Anim Modifier. Which one?"
        choices: ["Compressing animations for mobile by removing keys that change very little", "Auto foot sync markers on frames where a foot bone is at its lowest point", "Retargeting animations between two skeletons that have different bone names", "Generating LODs for a skeletal mesh from the bones that an animation uses"]
        answer_index: 1
        explain: "The example modifier finds the frames where a foot bone touches the floor and adds Animation Sync Markers there."
    flavors:
      _default: {why: "A modifier does in one click what would take hours by hand across many clips."}
      tech_art: {why: "This is the tool for batch-editing animation data in a pipeline: curves, notifies and sync markers by script.", do: "Add a second Instance Editable float Offset and add it to every key, so the curve can be shifted without changing the graph."}

  - id: TAQ97
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [vehicles, physics-asset, animation-blueprint, rigging]
    required_spine: false
    required: false
    title: "Rig a Chaos vehicle: wheels, physics asset, Wheel Controller"
    brief: "A drivable vehicle in Unreal is made of several parts that work together. It needs a Skeletal Mesh with a bone for each wheel, a physics asset that gives the body and wheels their collision shapes, an Animation Blueprint that turns the wheel bones, and a vehicle Blueprint that holds the engine and wheel settings. Chaos is the physics system of Unreal Engine 5, and its vehicle plugin provides these building blocks. In this quest you set up the whole chain and drive the vehicle."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-set-up-vehicles-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/vehicles-in-unreal-engine"
    checklist:
      - "Get a vehicle skeletal mesh that has wheel bones. The easiest source is a new project made from the Vehicle template in the Games category, which includes the skeletal mesh SKM_SportsCar. Work in that project. Open Edit > Plugins, look in the Physics category, and make sure ChaosVehiclesPlugin is enabled. The documentation page uses a Buggy from an older sample project, and the steps are the same for any vehicle mesh."
      - "Create two Blueprints from the class ChaosVehicleWheel. Name one BP_WheelFront, with Affected by Steering on and Axle Type set to front. Name the other BP_WheelRear, with Affected by Handbrake and Affected by Engine on. Set Wheel Radius to match the size of the visible wheel in cm. You can measure the wheel in the Skeletal Mesh Editor."
      - "Create the physics asset: right-click the skeletal mesh, choose Create, then Physics Asset, then Create and Assign, with Single Convex Hull. In the Physics Asset Editor, select all wheel bones, set Primitive Type to Sphere and click Re-generate Bodies. Then select the suspension bones and choose Collision, then No Collision."
      - "Create a Curve Float asset named TorqueCurve (under Miscellaneous, then Curve). Give it the shape of an upside-down U, where X is the engine RPM and Y is the torque, the turning force of the engine."
      - "Create an Animation Blueprint named ABP_Vehicle with the parent class VehicleAnimationInstance and the Skeleton of the vehicle. In the AnimGraph, connect Mesh Space Ref Pose to Wheel Controller for WheeledVehicle, then to Component To Local, then to Output Pose. If the mesh has suspension bones, add Look At nodes so that they follow the wheel joints."
      - "Create a Blueprint named BP_Vehicle from WheeledVehiclePawn. Set the Skeletal Mesh and the Anim Class, and turn on Simulate Physics. On the Vehicle Movement Component, fill Wheel Setups with a Wheel Class and a Bone Name for each of the four wheels, using the names of the wheel bones from the Skeleton Tree of the mesh, and set the Torque Curve External Curve to TorqueCurve. Add a Spring Arm and a Camera."
      - "Make a Game Mode with BP_Vehicle as the Default Pawn, and set it as GameMode Override in World Settings. Add key events for the throttle and the steering in BP_Vehicle and connect them to Set Throttle Input and Set Steering Input, and press Play. Watch the wheels spin and steer."
    done_when: "Send a screenshot of the Physics Asset Editor with sphere bodies on the wheels, a screenshot of the ABP_Vehicle AnimGraph with the Wheel Controller node, and a screenshot taken in Play In Editor (PIE) with the vehicle moving."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "You enabled ChaosVehiclesPlugin but vehicles do not work. What does the page warn about?"
        choices: ["The plugin needs Nanite enabled", "It only works in packaged builds of the game", "It requires a Static Mesh vehicle", "The plugin will not work with PhysX enabled"]
        answer_index: 3
        explain: "The page notes that you must restart after enabling the plugin and that it will not work with PhysX enabled."
      - q: "What value must Wheel Radius on a wheel Blueprint match?"
        choices: ["The collision sphere in the physics asset", "The size of the render model in centimeters", "The suspension length", "The bone length in the skeleton"]
        answer_index: 1
        explain: "Wheel Radius needs to match the size of the render model in cm. For the Buggy example both wheels use 58."
      - q: "You want an all-wheel-drive car. Which wheel setting do you enable on all wheels?"
        choices: ["Affected by Handbrake", "Affected by Steering", "Affected by Engine", "Max Steer Angle"]
        answer_index: 2
        explain: "Affected by Engine is enabled on rear wheels for RWD, front wheels for FWD, and on all wheels for AWD. Handbrake is normally rear only."
      - q: "Why would you set a negative Max Steer Angle on rear wheels?"
        choices: ["For rear-wheel counter-steering on an all-wheel drive vehicle", "To disable steering on them without changing the wheel class", "To make them spin backwards when the vehicle is in reverse gear", "It is not allowed; the engine clamps the value back to zero"]
        answer_index: 0
        explain: "Max Steer Angle is normally positive, but a negative value is allowed on the rear wheels for counter-steering, which gives all-wheel steering."
      - q: "What do the axes of the engine torque curve represent?"
        choices: ["X is time in seconds, Y is speed in km per hour", "X is engine RPM, Y is torque in Newton meters", "X is the gear number, Y is the engine RPM", "X is throttle input, Y is acceleration in m/s2"]
        answer_index: 1
        explain: "The X axis is engine RPM from 0 to max RPM and the Y axis is torque in NM. A typical curve is an inverted U that peaks mid range."
      - q: "In the physics asset, what does the page do with the wheel bones and the suspension bones?"
        choices: ["Wheels get Box bodies, suspension gets Capsule bodies", "Both get Single Convex Hulls", "Wheels get No Collision, suspension gets Spheres", "Wheels get Sphere bodies, suspension gets No Collision"]
        answer_index: 3
        explain: "Select the wheel bones, set Primitive Type to Sphere and Re-generate Bodies. Then select the suspension bones and choose Collision > No Collision."
      - q: "Which parent class does the vehicle Animation Blueprint use, and what does the Wheel Controller node do?"
        choices: ["AnimInstance; it plays a spin montage on each wheel bone, with a play rate that follows the vehicle speed", "ControlRig; it drives the wheels through controls that are keyed in Sequencer and then baked to the bones", "VehicleAnimationInstance; it reads wheel data (spin, handbrake, suspension) and animates the wheel bones", "WheeledVehiclePawn; it applies the physics forces of the engine and the brakes to each of the wheel bones"]
        answer_index: 2
        explain: "The ABP is created with the VehicleAnimationInstance parent class. The Wheel Controller node gets the information from the wheels and turns it into animation on the associated bone."
      - q: "In the Wheel Setups array you listed the wheels in the order BL, BR, FL, FR. Does this change which wheel is front or rear?"
        choices: ["No, only Bone Name and Wheel Class have any effect", "Yes, the first two entries are always the front", "Yes, the order must match the skeleton hierarchy", "No, but the vehicle will not compile"]
        answer_index: 0
        explain: "The order has no bearing on front or rear. Only the Bone Name and the Wheel Class matter. Epic still recommends a fixed order (FL, FR, BL, BR) so wheel index lookups stay consistent."
    flavors:
      _default: {why: "A vehicle is a rig, a physics asset and an AnimBP working together. Knowing the chain lets you fix any of them."}
      tech_art: {why: "Vehicle setup is a classic tech-art hand-off: artists give you a mesh, and you make it drivable and animated.", do: "Write a 5-line naming and export checklist for vehicle meshes (wheel bone names, pivot, units) that an artist could follow."}

  - id: TAQ98
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [morph-targets, fbx, skeletal-mesh, pipeline]
    required_spine: false
    required: false
    title: "Morph targets from DCC to Set Morph Target"
    brief: "A morph target is a saved second shape of a mesh in which some vertices sit in a different place. You blend between the normal shape and the morph target with a value from 0 to 1. It is the standard way to move vertices without bones, for example for faces, muscles and damage. Morph targets are made in a 3D program (a DCC, short for digital content creation tool), where they are also called blend shapes. In this quest you make one morph target, import it into Unreal and control it from an Animation Blueprint."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/fbx-morph-target-pipeline-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/morph-target-previewer"
    checklist:
      - "This quest needs a DCC (Maya, 3ds Max or Blender, which is free). In it, take a simple skinned mesh and duplicate it. Move some vertices on the copy (for example an Inflate or a Wink shape) and create a blend shape or morph channel from the copy. In Maya, the name in Unreal will be [BlendShapeNode]_[BlendShape]. In 3ds Max, it is the name of the Morpher channel, and the Morpher must sit before Skin in the stack."
      - "Export the base mesh and its joints to an FBX file. In the export dialog, enable Animations and all the Deformed Models options (in Maya) or the Deformations options (in Max)."
      - "Open any project, or create one from the Third Person template. Import the file into Unreal with Import Morph Targets enabled in the import window, and name the result SK_MorphTest. Open it and drag the weight from 0 to 1 in the Morph Target Previewer."
      - "Open Show, then Mesh Overlay, and turn on Selected MorphTarget Vertices. Select the morph target to see which vertices it moves. Then right-click it and use Copy Morph Target Names."
      - "Create an Animation Blueprint named ABP_MorphTest. In the Event Graph, add a float variable named Amount and call Set Morph Target on each update, with Target set to self, Morph Target Name set to the name you copied, and Value set to Amount. Assign the Animation Blueprint to a mesh in the level and change Amount in the Details panel."
      - "Open Project Settings, then Rendering, then Optimizations, and find Use GPU for computing morph targets. Write one line about when you would turn it on."
    done_when: "Send a screenshot of the Morph Target Previewer with the weight at 1 and the vertex overlay on, plus a screenshot of the Set Morph Target node in ABP_MorphTest. Add your one-line note about GPU morph targets."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You export a wink blend shape from Maya. What name will the morph target have in Unreal?"
        choices: ["[BlendShapeNode]_[BlendShape]", "The mesh name plus _Morph", "The name of the target mesh only", "Morph_0, Morph_1 and so on"]
        answer_index: 0
        explain: "For Maya the name is the blend shape node name joined to the blend shape name. In 3ds Max it is the channel name in the Morpher modifier."
      - q: "In 3ds Max, where must the Morpher modifier sit in the stack?"
        choices: ["After the Skin modifier", "Anywhere, the order does not matter", "Before the Skin modifier", "It must be collapsed into the mesh"]
        answer_index: 2
        explain: "The page says the Morpher modifier needs to be before the Skin modifier in the stack."
      - q: "Which FBX export options are required so morph targets come through?"
        choices: ["Smoothing Groups and Triangulate, with Animations turned off", "Animations plus all Deformed Models / Deformations options", "Embed Media and Bake Animation, with Smoothing Groups off", "Only Geometry, because the animation options must all be off"]
        answer_index: 1
        explain: "For morph targets you must enable the Animations checkbox and all of the Deformed Models (Maya) or Deformations (Max) options."
      - q: "You import new morph targets onto a Skeleton that already has morph targets applied. What happens to the old ones?"
        choices: ["They are kept and the new ones are appended", "The import fails", "They are merged by name", "The existing ones are overridden"]
        answer_index: 3
        explain: "If you import and add morph targets to an existing Skeleton with morph targets already applied, the existing ones will be overridden."
      - q: "A facial animation in the DCC uses twenty blend shapes. What do you get after FBX import?"
        choices: ["Twenty Animation Sequences, with one sequence for each blend shape", "A Pose Asset only, with one pose for each of the blend shapes", "One Animation Sequence, with the morph data available as curves", "Twenty static mesh morphs, with one mesh asset for each shape"]
        answer_index: 2
        explain: "Any number of morph targets can drive a single animation. It imports as one Animation Sequence and you still reach each morph target through curves."
      - q: "What is the valid range for the Value pin of Set Morph Target?"
        choices: ["0.0 to 1.0", "0 to 100", "-1 to 1", "Any positive integer"]
        answer_index: 0
        explain: "The Morph Target Previewer page lists Value as a float between 0.0 and 1.0."
      - q: "How do you see which vertices a morph target moves?"
        choices: ["Enable the Wireframe view mode, then look for the vertices drawn in yellow", "Show > Mesh Overlay > Selected MorphTarget Vertices, then select the morph", "Open the Skeleton Tree, select the bone and read the vertex list in Details", "Use the stat morph console command, then read the vertex list on screen"]
        answer_index: 1
        explain: "The Morph Target Debug View Mode is under Show > Mesh Overlay > Selected MorphTarget Vertices. Then pick any morph in the previewer."
      - q: "When would you enable Use GPU for computing morph targets?"
        choices: ["On any platform, because the GPU is always faster than the CPU at computing morph targets", "Only when using Nanite skeletal meshes, because Nanite cannot compute morph targets on the CPU", "Only for mobile, because phones have slow CPUs and cannot skin morph targets in time", "When the game is CPU bound, you have GPU time to spare, and the platform supports Shader Model 5"]
        answer_index: 3
        explain: "The setting is in Project Settings > Rendering > Optimizations. It needs Shader Model 5 and moves the work off the CPU, so it helps when you are CPU bound with spare GPU."
    flavors:
      _default: {why: "Morph targets are the standard way to move vertices without bones: faces, muscles, damage states."}
      tech_art: {why: "You own the DCC-to-engine naming and export rules. A wrong export option silently drops every blend shape.", do: "Write a 4-line export checklist for your DCC (naming, modifier order, export flags, import flag) and add it to your project notes."}

  - id: TAQ99
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [deformer-graph, hlsl, skeletal-mesh, animation-tech]
    required_spine: false
    required: false
    title: "Twist a character with a Deformer Graph kernel"
    brief: "A Deformer Graph is an asset that changes the shape of a mesh on the GPU, the graphics card, after the bones have moved it. It lets you add your own deformation without changing any animation. The work is done by a compute kernel, a small program written in HLSL, the shader language that Unreal uses. In this quest you build a Deformer Graph with a custom kernel that twists the mannequin around its up axis."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-create-a-custom-deformer-graph-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/deformer-graph-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open Edit > Plugins, look in the Animation section, enable the Deformer Graph plugin and restart. Use the mannequin of the template."
      - "Select the character in the level. In the Details panel, enable Mesh Deformer and create a new Deformer Graph asset named DG_Twist. Open the asset and set its Mesh property to the mannequin."
      - "In the Update Graph, add a Skeletal Mesh Component Binding node. Connect these nodes to it: Write Skinned Mesh, Execute Skinned Mesh (with Domain set to Vertex), Scene Data (for Time) and Skinned Mesh (for Position, Tangent X and Tangent Z)."
