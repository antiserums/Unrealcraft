    required_spine: false
    required: false
    title: Measure and tune Lumen
    brief: "Lumen is the system in Unreal Engine 5 that calculates bounced light (global illumination, or GI) and reflections while the game runs. It looks very good, but it is often the largest GPU cost in a scene. When a frame takes too long, the Lumen settings are among the first things to adjust. In this quest you measure the three Lumen passes, which are the stages of the frame that Lumen uses, and see how a few settings change their cost."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/lumen-performance-guide-for-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/lumen-technical-details-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open a level that uses Lumen GI and Lumen reflections, which is the default in new projects. Add a few smooth surfaces with low roughness, for example a floor with a material that has a roughness of 0.2."
      - "Run the console command stat GPU. Write down the times of the three Lumen passes: Lumen Scene Lighting, Lumen Screen Probe Gather and Lumen Reflections."
      - "Run r.Lumen.AsyncCompute 0 and read the Lumen timings again. Note the difference. With this setting off, the numbers show the cost of Lumen alone."
      - "Switch the viewport to the Performance Overview view mode. Find the pixels that trace their own reflection rays."
      - "In a Post Process Volume, lower Max Roughness To Trace, and watch how the Lumen Reflections time changes."
      - "Try r.Lumen.Reflections.DownsampleFactor 2, and note the change in the timing and in the image."
      - "Set sg.GlobalIlluminationQuality and sg.ReflectionQuality to 3 (Epic), then to 2 (High), and then to 1 (Medium). Record the times of the three Lumen passes for each setting."
    done_when: "Send a short table with the three Lumen pass times at Epic, High and Medium, measured with async compute off, plus a screenshot of the Performance Overview view mode."
    xp: 65
    verify_type: writeup
    quiz:
      - q: "Which three passes does the guide say Lumen is divided into for profiling?"
        choices: ["Base pass lighting, shadow depth pass and the post process material", "Ray generation, the temporal denoise pass and the final composite", "Lumen Scene Lighting, Lumen Screen Probe Gather and Lumen Reflections", "Distance field build, probe cache update and the tonemap of the frame"]
        answer_index: 2
        explain: "The Profiling Lumen section lists Lumen Scene Lighting, Lumen Screen Probe Gather and Lumen Reflections as the three passes."
      - q: "Why does the guide say to run r.Lumen.AsyncCompute 0 before you profile Lumen?"
        choices: ["Async compute overlaps Lumen with other passes, so timings include other work", "Async compute is not supported in the editor, so stat GPU would show zero", "It doubles the quality of Lumen, so the numbers are cleaner and easier to read", "It turns on stat GPU and adds a Lumen line to the list of passes"]
        answer_index: 0
        explain: "With Async Compute, Lumen overlaps other passes and its timings include that other work. Disable it to measure Lumen alone."
      - q: "By default, which pixels trace a dedicated Lumen reflection ray?"
        choices: ["Pixels with roughness above 0.4", "All pixels on metals only", "Only pixels on Two Sided Foliage materials", "Pixels with roughness below 0.4"]
        answer_index: 3
        explain: "By default all pixels with roughness below 0.4 trace a reflection ray; rougher pixels get a free approximation from Lumen GI."
      - q: "Which scalability level for the Global Illumination and Reflections groups targets a 60 fps console budget?"
        choices: ["Cinematic", "High", "Epic", "Low"]
        answer_index: 1
        explain: "Epic targets 30 fps on consoles; High targets 60 fps. Low disables Lumen features."
      - q: "What does r.Lumen.Reflections.DownsampleFactor 2 do?"
        choices: ["Traces one reflection ray for one pixel in each quad, then reconstructs full resolution", "Halves the reflection roughness threshold, so only half as many pixels trace rays", "Renders reflections at double resolution and then scales the result down for each pixel", "Disables reflections on foliage and on every other material that is two-sided"]
        answer_index: 0
        explain: "At 2, Lumen traces one ray per quad of pixels. It is faster, but reflections can become more blurry and less stable."
      - q: "Software Ray Tracing traces a single merged Global Distance Field. Why does the guide say component mobility matters here?"
        choices: ["Movable objects are never traced, so they are missing from all reflections", "Static actors are drawn twice, once into each of the two distance fields", "Moving a static actor invalidates the static cache, which can be very expensive", "The distance field only exists for movable meshes, and static ones are skipped"]
        answer_index: 2
        explain: "The Global Distance Field caches static and movable objects separately. Moving a static actor invalidates the static cache."
      - q: "With Hardware Ray Tracing, which stat and value does the guide use to check the ray tracing scene size on consoles?"
        choices: ["stat unit, with a Draw time that stays under 8 ms on every one of the consoles", "Stat SceneRendering, Ray tracing active instances under about 100,000 after culling", "stat GPU, with a Lumen Scene Lighting time that stays under 4 ms per frame", "NaniteStats, ClustersHW under about 1 million after culling on each of the consoles"]
        answer_index: 1
        explain: "Use Stat SceneRendering and look at Ray tracing active instances; good console performance generally needs fewer than 100,000 instances after culling."
      - q: "The guide suggests setting the foliage reflection roughness threshold to 0. Why?"
        choices: ["Foliage cannot reflect light at all, so the threshold has no effect on other materials", "It enables Hit Lighting on leaves, which makes foliage reflections sharper for free", "It forces foliage to use Screen Space Reflections, which look better on leaves than Lumen does", "Foliage reflections are often hard to see, so skipping them saves cost with little visible loss"]
        answer_index: 3
        explain: "Reflections on foliage are often hard to see, so r.Lumen.Reflections.MaxRoughnessToTraceForFoliage 0 gives performance wins without visible loss."
    flavors:
      _default: {why: "Lumen is often the largest GPU cost in a UE5 scene, and its dials are the first thing to tune when the frame is over budget."}
      tech_art: {why: "Tech artists set the scalability levels and roughness thresholds that decide what Lumen costs on each platform.", do: "Write the High and Medium Lumen settings you chose into a custom scalability .ini and show the file."}

  - id: TAQ105
