      - "Create M_Sub_CarPaint: a metal base Slab, a clear coat Slab on top with Substrate Vertical Layer, and Top Thickness exposed as a parameter."
      - "Create M_Sub_WetGround: two Slabs mixed with Substrate Horizontal Blend, driven by a mask texture."
      - "Open Window > Substrate and read the stats for both. Note bytes per pixel and any simplification."
      - "Turn on Use Parameter Blending on the last operator before the root. Compare the stats and the look."
