  - id: TAQ77
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [materials, static-switch, shader-permutations, material-analyzer, optimization]
    required_spine: false
    required: false
    title: Static switches on a permutation budget
    brief: "A static switch is a material parameter that turns a part of the material on or off when the shader is compiled, so the unused part costs nothing while the game runs. The cost is that every different combination of switch values needs its own compiled shader, called a permutation. Too many permutations make compiling and cooking slow and use more memory. In this quest you add static switches to a master material, check its instances with the Material Analyzer, and lower the number of permutations."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/material-parameter-expressions-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-material-analyzer-tool"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-material-analyzer-tool"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a master material of your own, or make a small one named M_Master_Prop with a color parameter, a normal map, an emissive color and a packed mask texture, which is a texture that stores a different mask in each color channel. The texture T_Manny_01_MRA of the template mannequin is such a texture."
      - "Add three StaticSwitchParameter nodes named UseDetailNormal, UseEmissive and UseWear, and let each one turn a part of the graph on or off. Add one StaticComponentMaskParameter that picks the channel of the packed mask texture. Give them all a Group."
      - "Find any place where you multiplied a mask texture by a Vector Parameter to pick a channel, and replace it with the StaticComponentMaskParameter."
      - "Create eight instances. Make half of them share the same switch values, and give the other half unique combinations. Also give each instance a different color."
      - "Open Tools, then Audit, then Material Analyzer. Pick your master in Material to Analyze, and read the instance list and the Static Switch Parameters column."
      - "Read the suggestion list below the hierarchy. Click Create Local Collection on one suggestion, and open the collection in the Content Browser."
      - "Create one new intermediate instance that holds the shared switch values, and reparent the grouped instances to it. Then remove the static overrides from the children, and run the analyzer again."
      - "Write two lines: how many permutations you had before and after. Count them by counting the unique switch combinations."
    done_when: "Send a screenshot of the Material Analyzer that shows your master, the Static Switch Parameters column and the suggestion list, plus a screenshot of one reparented child instance with no static overrides. Add two lines with your permutation count before and after."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "What does a static switch cost at runtime?"
        choices: ["One branch instruction per pixel, which the GPU evaluates again on every frame", "A texture lookup per pixel, which reads the value of the switch", "Nothing, because the dropped branch is removed at compile time and never executed", "A draw call per instance that has the switch turned on"]
        answer_index: 2
        explain: "Static switches are applied at compile time. The dropped branch is never executed, so they are effectively free at runtime."
      - q: "What is the hidden price of static parameters?"
        choices: ["A new version of the material must be compiled for every used combination of static parameters", "They double texture memory, because both branches keep their textures loaded for every instance", "They cannot be grouped, so the parameter list of an instance gets long and is hard to read", "Instances become read-only as soon as one static parameter of the parent has been changed"]
        answer_index: 0
        explain: "Every used combination of static parameters compiles a new shader, which can lead to a massive increase in permutations if abused."
      - q: "Why does Epic say to prefer StaticComponentMaskParameter over multiplying a mask texture by a Vector Parameter?"
        choices: ["Vector Parameters cannot be changed in instances, so every different mask would need its own parent material", "The vector approach wastes texture bandwidth and shader instructions when the mask never changes at runtime", "Component masks work in Blueprint, so the mask can be changed while the game runs", "It avoids a compile"]
        answer_index: 1
        explain: "If the mask is static, use the Static Component Mask instead of multiplying by a vector, since the latter wastes bandwidth and instructions."
      - q: "Can a StaticSwitchParameter be changed from Blueprint during play?"
        choices: ["Yes, with Set Scalar Parameter Value on a dynamic instance", "Yes, but only on MIDs", "Only if it has a Group that is exposed to Blueprint graphs", "No, it can only be set in the Material Instance Editor"]
        answer_index: 3
        explain: "Static parameters cannot change at runtime. They are set in the Material Instance Editor and applied at compile time."
      - q: "What does StaticBoolParameter do that StaticSwitchParameter does not?"
        choices: ["It creates only a bool parameter without implementing a switch, useful for passing a value into a function's boolean input", "It switches between three inputs instead of two, which is useful when a function has a low, medium and high quality path", "It can change at runtime from a Blueprint, which a StaticSwitchParameter is never able to do", "It creates a Scalar parameter with a value of 0 or 1, which can be used in math nodes"]
        answer_index: 0
        explain: "StaticBoolParameter only creates the bool parameter. It is typically used to pass a default into a Material Function's boolean input."
      - q: "Where do you open the Material Analyzer?"
        choices: ["Window > Stats", "Tools > Audit > Material Analyzer", "Project Settings > Rendering", "Right-click a material > Analyze"]
        answer_index: 1
        explain: "The Material Analyzer opens from Tools > Audit > Material Analyzer. You then pick a Material to Analyze."
      - q: "What does the analyzer's suggestion list group together?"
        choices: ["Instances that have the same parent material or instance", "Instances that share textures", "Material instances with the same set of static overrides", "Unused instances that no mesh or level in the project references"]
        answer_index: 2
        explain: "The suggestion list groups all instances with the same set of static overrides. Create Local Collection collects them for editing."
      - q: "After reparenting instances to a new intermediate instance, what must you still do or the savings do not happen?"
        choices: ["Recompile the parent material and save every instance that uses it", "Rename the children", "Delete the old parent material from the Content Browser of the project", "Remove the static parameter overrides from the reparented instances"]
        answer_index: 3
        explain: "If the children keep their static overrides, the additional data is still stored. Remove the overrides so only the unique overrides remain."
    flavors:
      _default: {why: "Shader permutations are a compile-time and memory tax that nobody sees until the cook is slow."}
      tech_art: {why: "You own the permutation count of the project.", do: "Add a rule to the material guide: a new static switch needs a written reason and an analyzer check."}

  - id: TAQ78
