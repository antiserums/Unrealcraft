      - q: "A node is still connected to a pin that became disabled after you changed the Blend Mode. What happens?"
        choices: ["The material fails to compile until you remove the connection", "The node is deleted automatically when you save the material", "The pin is forced back on, and the Blend Mode change is undone", "The node is ignored; it does not affect the compiled material"]
        answer_index: 3
        explain: "Nodes stay connected to disabled inputs but are ignored when the Material compiles. The wire and pin are grayed out."
      - q: "What does the default Specular value of 0.5 mean?"
        choices: ["50% reflectivity", "No reflection at all", "About 4% reflectivity", "A mirror surface"]
        answer_index: 2
        explain: "The Material Inputs page says the default of 0.5 represents approximately 4% reflectivity."
      - q: "You use World Position Offset to push vertices far outside the mesh. What problem does the page warn about?"
        choices: ["The material becomes translucent", "The renderer still uses the original bounds, so you may get culling and shadow errors", "The normal map stops working, because normals are not moved together with the vertices", "The instruction count drops, because moved vertices are no longer shaded by the pixel shader"]
        answer_index: 1
        explain: "The renderer keeps the original bounds. You may see culling and shadowing errors, and can raise the mesh's Scale Bounds at some performance cost."
      - q: "When is the Ambient Occlusion input silently ignored?"
        choices: ["When the material is Two Sided and Masked", "When the material uses a normal map on the surface", "When the material is used with Movable light sources", "When Roughness is 1 on the whole surface"]
        answer_index: 2
        explain: "The Ambient Occlusion input needs built lighting from Static or Stationary lights. With Movable lights it is ignored."
    flavors:
      _default: {why: "Every material ends at this node. If you know each pin, you know what a surface can and cannot do."}
      tech_art: {why: "Wrong default values and ignored pins are the source of many 'why does it look flat' bugs.", do: "Try the Shading Model input with From Material Expression and switch between Default Lit and Clear Coat using a mask."}
      lookdev: {why: "Roughness, Metallic and Specular defaults decide the look of every material you have not finished yet."}

  - id: TAQ53
    rank: 1
    difficulty: apprentice
    specializations: [tech_art]
    subjects: [materials, material-editor, preview, workflow]
    required_spine: false
    required: false
    title: Preview and apply
    brief: "When you build a material, you change it and look at the result many times. The Material Editor has a preview viewport with tools that let you check your work fast: you can preview a single node, change the preview shape, and change the preview light. In this quest you use these tools and then apply your material to actors in a level in two different ways."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/previewing-and-applying-your-materials-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-material-editor-ui"
    checklist:
      - "Open any project, or create one from the Third Person template. Open a material that has a Fresnel node, or add one to a new material named M_Preview. Right-click the Fresnel node and choose Start Previewing Node. Then stop previewing it."
      - "Switch the preview shape between cylinder, sphere, plane and cube. Then select a Static Mesh in the Content Browser, for example a mesh of the template or one of your own, and click the teapot icon to preview the material on that mesh."
      - "Open Window > Preview Scene Settings. Change the light direction, the light intensity and the background. Hold L and drag in the viewport to rotate the light."
      - "Click Apply and then Save. Drag the material from the Content Browser onto an actor in the level."
      - "Select a second actor. In the Materials section of its Details panel, click the Use Selected Asset from Content Browser button to apply the same material to one material slot."
      - "Add a Vector Parameter to the material. While the material is applied in the level, change the parameter value inside the Material Editor, and watch the level viewport update without a recompile."
    done_when: "Send a screenshot of the Material Editor that previews the material on the mesh you selected, with changed Preview Scene Settings. Also send a level screenshot with the material on two actors."
    xp: 50
    verify_type: screenshot
    quiz:
      - q: "Is the Realtime preview on by default, and where do you toggle it?"
        choices: ["Off by default; toggle in the Details panel of the material", "On by default; toggle in the Viewport Options menu", "Off by default; toggle with the Enter key in the viewport", "On by default; toggle in the Project Settings window"]
        answer_index: 1
        explain: "Realtime is enabled by default. You can turn it on and off from the Viewport Options menu of the viewport."
      - q: "How do you preview one node on its own in the viewport?"
        choices: ["Double-click the node", "Drag the node into the viewport of the Material Editor", "Press Spacebar with the mouse over the node that you want to see", "Right-click the node and choose Start Previewing Node"]
        answer_index: 3
        explain: "Right-click a node and choose Start Previewing Node. The node turns blue. Use Stop Previewing Node to stop."
      - q: "How do you preview the material on your own Static Mesh?"
        choices: ["Select the Static Mesh in the Content Browser, then click the teapot icon in the viewport", "Import the mesh into the material with the Import button, then select it in the Details panel", "Set Material Domain to Custom and choose the mesh in the Preview Mesh field of the material Details", "Drag the mesh from the Content Browser into the material graph, then connect it to the output node"]
        answer_index: 0
        explain: "Select any Static Mesh in the Content Browser and click the teapot icon in the bottom right of the viewport. The preview mesh is saved with the material."
      - q: "Before a material can be applied and seen in the level, what must happen?"
        choices: ["It must be compiled with Apply or Save", "It must have a Material Instance first", "It must be in the Engine folder", "Its preview mesh must be a cube"]
        answer_index: 0
        explain: "Changes are not visible in the level until the material is compiled. Click Apply or Save in the toolbar."
      - q: "Which two ways to apply a material to an object does the page describe?"
        choices: ["Copy and paste; Ctrl+S", "Drag-and-drop from the Content Browser; the Use Selected Asset from Content Browser button in the Details panel", "Add the material to the Level Blueprint with a Set Material node; call a Material Function that applies it to the mesh", "Merge Actors with the material selected; the Reference Viewer, with a right-click on the material node and Apply"]
        answer_index: 1
        explain: "You can drag a material onto an object in the level, or select the material, select the actor, and click Use Selected Asset from Content Browser in the Materials section of Details."
      - q: "You change a value in the Material Editor and want to see it in the level right away with no recompile. What must the value be?"
        choices: ["A Constant or a Constant3Vector", "A Texture Sample with a texture", "A Scalar or Vector Parameter", "A Static Switch Parameter node"]
        answer_index: 2
