    subjects: [editor, console, profiling]
    required_spine: false
    required: false
    title: Console variables you will use every day
    brief: "A console variable is a named engine setting that you can change while the editor is running, for example r.ScreenPercentage, which sets the resolution the scene is rendered at. Console variables let you test quality and performance without changing any asset. The Console Variables Editor is a panel where you can collect the variables you use often, switch them on and off, and save them as a preset. In this quest you turn on that panel, add a few variables and save your own preset."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/console-variables-editor"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/stat-commands-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/screen-percentage-with-temporal-upscale-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/viewport-show-flags-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Enable the Console Variables Editor plugin and restart the editor. Then open the panel from Window > Console Variables."
      - "Click Add Console Variable and add r.ScreenPercentage. Set it to 50 and watch the viewport get blurry, then set it back to 100."
      - "Hover over the value field and read the Custom, Preset and Startup values in the tooltip. Untick the row and see the value go back to the startup value. Then tick it again."
      - "Add the command stat unit through the same input box. This command shows frame times on screen. Then use Search All with the text lumen|screen percentage, and add one Lumen variable from the global list with Add CVAR."
      - "Open the Presets panel and save the list as a preset named CVP_DailyCheck."
      - "In the Show menu of the viewport, turn Particles Sprite off and on again. Then press Alt + C to turn the Collision view on and off."
    done_when: "Send a screenshot of the Console Variables Editor that shows at least three rows (including r.ScreenPercentage and stat unit) and the Presets panel with CVP_DailyCheck saved."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "How do you open the Console Variables Editor after enabling its plugin?"
        choices: ["Edit > Project Settings > Console", "Window > Console Variables", "Tools > Debug > CVars", "Help > Console"]
        answer_index: 1
        explain: "The panel opens from Window > Console Variables and can be docked anywhere in the editor."
      - q: "What happens when you untick the checkbox of a row in the list?"
        choices: ["The variable is deleted from the engine until the editor is started the next time", "The row is hidden from the list until you clear the search field at the top of the panel", "The variable is saved to the preset with its current value, and the row is locked afterwards", "The variable is set back to the value it had when the plugin loaded at startup"]
        answer_index: 3
        explain: "Unticking temporarily reverts the variable to its startup value. Ticking again restores the last cached value."
      - q: "You type lumen|screen percentage in the search box. What does the search return?"
        choices: ["Only variables that have the full text, with the pipe, in their name", "Variables that contain lumen, or contain both screen and percentage", "Only Lumen variables, because the text after the pipe is read as a comment", "Nothing, because the pipe is not allowed in a search"]
        answer_index: 1
        explain: "A pipe splits OR tokens and a space joins AND tokens, so the search matches lumen, or screen and percentage together."
      - q: "What does stat unit show?"
        choices: ["Only the frames per second, as one number", "Memory used by textures and meshes, in megabytes", "Frame time plus game thread, render thread and GPU times", "A list of all the streaming levels and their load state"]
        answer_index: 2
        explain: "stat unit shows the overall frame time and the game thread, rendering thread and GPU times. Epic calls it a great place to start."
      - q: "You set r.ScreenPercentage to 50. What does the renderer do?"
        choices: ["It renders the frame at a lower resolution and upscales it before the UI is drawn", "It draws the UI at half its size and keeps the 3D scene at the full screen resolution", "It halves the frame rate, so the GPU has twice the time for each of the frames that it draws", "It disables anti-aliasing for the frame and draws the UI first"]
        answer_index: 0
        explain: "Primary screen percentage renders at a fraction of the screen resolution and scales the image up before the user interface is drawn."
      - q: "When you load a preset in the Presets panel, what happens to the variables already in the list?"
        choices: ["They are removed from the list but their values are not changed", "They are reset to default, and then removed from the list of the panel", "They are merged into the new preset and are saved together with it", "They are deleted from the project, and cannot be typed in the console again"]
        answer_index: 0
        explain: "Loading a preset clears the list without touching those values. The variables in the new preset are then set to their saved values."
    flavors:
      _default: {why: "Console variables are how you test quality and performance without changing any asset."}
      tech_art: {why: "A saved preset of cvars is a repeatable test setup you can share with the team.", do: "Add r.Upscale.Quality to the preset and write down the difference between value 0 and value 3 on a thin fence or wire."}

