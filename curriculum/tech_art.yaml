  - id: TAQ18
    rank: 3
    difficulty: expert
    specializations: [tech_art]
    subjects: [materials, hlsl, custom-node, shader-cost]
    required_spine: false
    required: true
    title: Write shader code in a node
    brief: "Materials are normally built from nodes, but the Custom node lets you type shader code directly. The code is written in HLSL, the language that graphics cards use for shaders. This helps when the node graph cannot express what you need, but it has a cost: Unreal cannot optimize the code inside a Custom node as well as it optimizes normal nodes. In this quest you build a blur with a Custom node and then compare the cost of a Custom node with the same effect made from built-in nodes."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/custom-material-expressions-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-material-editor-ui"
    checklist:
      - "Open any project, or create one from the Third Person template. Make a new material named M_TA_CustomBlur. Add a Custom node to the graph. You can find it with the right-click search or in the Custom category of the Palette."
      - "Select the Custom node. In its Inputs array, add four inputs named Tex, UV, r and dist. Set Output Type to a 3-channel float. Copy the blur code from the Custom Material Expressions page that is linked on this quest, and paste it into the Code field."
      - "Connect a Texture Object node to Tex, a TexCoord node to UV, and two Scalar Parameters to r and dist. Set Description to 'Box Blur' so that the title of the node is clear."
      - "Add one extra output to the node with Additional Outputs, for example a luminance (brightness) value, and use it somewhere in the graph."
      - "Build a second, simple effect two times: once in a Custom node and once with built-in nodes (for example Sin, Multiply by a parameter, and Add). Compare the two instruction counts in the Stats panel. A lower count means a cheaper material."
      - "Write 3 short lines that say when you would keep the Custom node here, and when you would replace it with nodes."
    done_when: "Send a screenshot of the blurred result with the Details panel of the Custom node visible. Also add the two instruction counts from the Stats panel and your 3 lines."
    xp: 180
    verify_type: screenshot
    quiz:
      - q: "A teammate rebuilt a simple Sin, Multiply by parameter, Add chain inside a Custom node 'to keep the graph clean'. What is the main problem?"
        choices: ["The Custom node only runs on the CPU, so the value is computed once per frame and then sent to the GPU as a parameter", "Custom nodes cannot read parameters, so the value of the parameter is fixed at compile time and never changes in an instance", "The Custom node blocks constant folding, so the shader can use more instructions than the built-in nodes", "Custom nodes are removed in packaged builds, so the material falls back to the default material at runtime"]
        answer_index: 2
        explain: "Unreal cannot collapse anything inside a Custom node. The same chain made from built-in nodes can be folded into fewer instructions."
      - q: "Why can Unreal fold a Sin, Multiply by parameter, Add chain into one instruction when it is built from normal nodes?"
        choices: ["Its inputs are constant for the whole draw call and do not change per pixel", "Sin is always free on the GPU, so the whole chain of nodes costs nothing at all there", "Parameters are baked into the texture when the material is compiled or saved", "The Stats panel removes unused math from the shader code"]
        answer_index: 0
        explain: "Constant folding works because the inputs (a parameter) are the same for every pixel in the draw call, so the result can be computed once."
      - q: "According to the docs, when is the Custom node the right choice?"
        choices: ["Always, because HLSL that you write by hand is faster than the code that the nodes generate", "When you want fewer nodes on screen, because one Custom node is always easier to read than a graph", "When the material must work on mobile, because built-in nodes are not supported on mobile devices", "When it gives you something the built-in nodes cannot do, such as the looping blur example"]
        answer_index: 3
        explain: "The docs say to use the Custom node only when it gives access to functionality not possible with existing nodes."
      - q: "You add an input named dist to the Inputs array. How do you use its value in the Code field?"
        choices: ["Write Inputs[1], because inputs are passed to the code as an array in the order of the list", "Write dist, because the input name is also the variable name in the HLSL", "Write Param('dist'), because input names are strings that must be looked up in the code", "You cannot; inputs only show as pins on the node and have no name in code"]
        answer_index: 1
        explain: "Input Name is shown on the node and is also the name used inside the HLSL code."
      - q: "Your Code returns a float3 blur. What else must be set so the node compiles and connects correctly?"
        choices: ["Include File Paths, with one path per type", "Additional Defines, with one define for the type", "Output Type, to match what the code returns", "Description, with the name of the type"]
        answer_index: 2
        explain: "You must specify the output data type in Output Type. Description is only the title text."
      - q: "Inside the Custom code you write a struct with a member function that samples Tex at UV. It fails to compile. Why?"
        choices: ["Inputs are parameters of a hidden outer function, so they are function-local and not visible inside the struct", "Structs are not valid HLSL in Unreal Engine, so any Custom node that declares one fails on every platform and in every material", "Texture2DSample only works in Material Functions, so any call to it inside a Custom node fails on all platforms", "The node needs Output Type set to a struct before member functions can be used, and that option is missing in the dropdown"]
        answer_index: 0
        explain: "The Custom node is wrapped in another function. Its inputs are local to that function, so you must pass them into the struct by hand."
      - q: "The node needs a second result pin, for example a mask next to the color. What do you use?"
        choices: ["A second Custom node with the same code and a different return statement", "Additional Defines, with one define for each extra result that the code returns", "Include File Paths, with a header that declares the mask", "Additional Outputs, with an Output Name and Output Type for each element"]
        answer_index: 3
        explain: "Additional Outputs adds more output pins. Each element needs its Output Name and Output Type."
      - q: "Your team keeps shared HLSL helper functions in a shader source file outside the common engine paths. How do you use them in a Custom node?"
        choices: ["Paste the whole file into Description", "Add the file under Include File Paths", "Put the path in Additional Outputs", "Custom nodes cannot use outside code"]
        answer_index: 1
        explain: "Include File Paths points the node to shader code outside the common shader paths."
      - q: "On one platform the Custom node reports syntax errors on 'vector' and 'matrix' types. What do the docs suggest?"
        choices: ["Replace the Custom node with a Material Function asset", "Turn off constant folding for the whole material in its Details", "Be explicit and use types such as float4 and float4x4", "Move the code into Additional Defines, where types are not checked"]
        answer_index: 2
        explain: "Some backends use the older HLSLcc compiler. Explicit types like float4 or float4x4 avoid those errors."
      - q: "You want to prove that your node version is cheaper than the Custom version. Where do you look, and what does it tell you?"
        choices: ["The Palette panel; it lists the price of each node next to its name, and a lower total means a cheaper material", "The HLSL Code panel; you edit the generated code there, and fewer lines of code means a cheaper material", "The Details panel of the Custom node; it shows the cost in milliseconds, and a lower time means a cheaper material", "The Stats panel; it shows the shader instruction count, and fewer instructions means a cheaper material"]
        answer_index: 3
        explain: "The Stats panel shows the instruction count. Fewer instructions means less cost. The HLSL Code panel is view-only."
    flavors:
      _default: {why: "Sometimes the node graph cannot express what you need. Then a little HLSL solves it, but it has a cost."}
      tech_art: {why: "You are the person who decides when code in a material is worth it, and you must prove it with numbers.", do: "Add a comment box next to the Custom node that says why nodes could not do this job."}
      lookdev: {why: "Custom nodes appear in shared materials. Know what they cost before you copy one."}
      programming: {why: "HLSL in materials has a hidden wrapper function and no constant folding. Know the rules before you write it."}

  - id: TAQ19
    rank: 3
    difficulty: expert
    specializations: [tech_art]
    subjects: [runtime-virtual-texturing, landscape, materials, blending]
    required_spine: false
    required: true
    title: Blend meshes into the landscape
    brief: "A Runtime Virtual Texture (RVT) is a large texture that Unreal fills in while the game runs, usually with the colors and surface details of the landscape. Other materials can read it, so a rock can take the color of the ground under it and meet the ground softly. Without this, rocks and props stop sharply at the ground and look fake. In this quest you set up an RVT for a landscape, blend a rock into it, and add a decal-like plane that draws into it."
    time_min: 120
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/runtime-virtual-texturing-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/runtimevirtual-texturing-quick-start-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. You need a level with a Landscape that has a landscape material. If you have none, create a Landscape in a new level and give it a simple material with a Landscape Layer Blend node and two layers with different colors. Open Project Settings and go to Engine, then Rendering, then the Virtual Textures section. Turn on Enable virtual texture support, and then restart the editor."
      - "Create a Runtime Virtual Texture asset named RVT_Terrain. Set its type to Base Color, Normal, Roughness, Specular."
      - "In the landscape material, turn on Use Material Attributes. Write the layer blend into a Runtime Virtual Texture Output node, read it back with a Runtime Virtual Texture Sample node, and send both through a Virtual Texture Feature Switch node."
      - "Place a Runtime Virtual Texture Volume in the level and assign RVT_Terrain to it. Under Transform from Bounds, use Set Bounds on the landscape so the volume covers it. Then add RVT_Terrain to the Draw in Virtual Textures list of the landscape."
      - "Place a rock on the landscape. Any mesh works as the rock, for example a sphere that you scale and push halfway into the ground. Make a material for it named M_TA_RockBlend. In this material, sample RVT_Terrain and blend its Base Color into the bottom of the rock, so that the rock meets the ground softly."
      - "Add a plane mesh with a masked material that works like a decal and writes to the RVT. Set Draw in Main Pass to Never on the plane, and turn off its collision."
      - "Run the console command stat virtualtexturing and note the cost in ms (milliseconds)."
    done_when: "Send a before and after screenshot of the rock where it meets the ground, one screenshot of the decal plane on the terrain, and the numbers from stat virtualtexturing."
    xp: 185
    verify_type: screenshot
    quiz:
      - q: "Which piece links the RVT Volume, the materials and the scene components together?"
        choices: ["The Runtime Virtual Texture asset", "The Landscape actor of the level", "The Post Process Volume of the level", "The World Settings"]
        answer_index: 0
        explain: "The RVT asset holds the settings and connects the volume, the materials and the components that render into it."
      - q: "You finished the setup and the landscape renders black. What should you check first?"
        choices: ["That Lumen is turned off, because Lumen cannot light a landscape that reads its shading from a Runtime Virtual Texture and draws it black in that case", "That the landscape uses Nanite, because only Nanite landscapes can draw into a Runtime Virtual Texture, and other landscapes show up as black", "That every part is set up: the volume has the asset, it covers the landscape, and the landscape lists the asset in Draw in Virtual Textures", "That the size of the RVT asset is larger than 8K, because smaller virtual textures cannot be drawn on a landscape and always show up as black"]
        answer_index: 2
        explain: "The quick start says the terrain renders black when something is not set up correctly. Every writer and reader must be inside the volume bounds."
      - q: "An artist wants a moving, animated skeletal mesh to write into the RVT. What do you tell them?"
        choices: ["Fine, the RVT updates fully every frame, so anything that moves is drawn at its new place right away", "Only if the mesh uses Nanite, because Nanite meshes are the only ones that may write to an RVT", "Set Draw in Main Pass to Always on the mesh and it will work, because the RVT is then updated on every frame", "It is a poor fit: the RVT is a shading cache that is not fully updated every frame, so writers should be static"]
        answer_index: 3
        explain: "RVT content is a cache. Skinned, animated and movable meshes are listed as non-ideal writers."
      - q: "A decal-like plane should only appear inside the RVT. On a platform without virtual texture support it should not render at all. Which Draw in Main Pass option?"
        choices: ["Always", "Never", "From Virtual Texture", "Hide Primitives on the component"]
        answer_index: 1
        explain: "Never skips the main pass. Without an RVT the plane does not render, which suits decal-type items that are not required."
      - q: "A road spline mesh writes into the RVT. If virtual texturing is not available, the road must still be visible. Which option fits?"
        choices: ["From Virtual Texture", "Never", "Always, in all passes", "Virtual Texture Skip Mips"]
        answer_index: 0
        explain: "From Virtual Texture renders into the RVT when possible, and into the main pass when there is no valid RVT or no support."
      - q: "In the landscape material, which work belongs before the Runtime Virtual Texture Output?"
        choices: ["Camera-dependent effects such as distance fades and Fresnel", "Nothing; the output node must be first in the graph", "Only the Virtual Texture Feature Switch and its two inputs", "The camera-independent layer blending, which can be cached"]
        answer_index: 3
        explain: "Camera-independent shading is cached in the RVT. Keep the part after the Sample small, because less work there makes the material cheaper."
      - q: "A mesh writes to the RVT but you cannot see it, because the landscape spline draws over it. What do you change?"
        choices: ["Virtual Texture LOD Bias: give the mesh a lower bias value than the spline", "Translucency Sort Priority: give the mesh a higher value than the spline", "The RVT tile size: raise it until the mesh is larger than one tile of the texture", "r.VT.Flush"]
        answer_index: 1
        explain: "RVT has no Z-buffer. Smaller Translucency Sort Priority values render first, larger values render on top. Equal values have undefined order."
      - q: "Base Color gradients in your RVT show banding. You switch to a YCoCg material type. What is the cost?"
        choices: ["No cost; it is only a different encoding of the same data", "It disables normals in the RVT, so they come from the mesh", "About 25% extra memory and some extra sampling and decoding work", "It forces the RVT to update on every frame for all of its tiles"]
        answer_index: 2
        explain: "YCoCg reduces color shifts and banding, but the docs list 25% extra memory and extra decode cost."
      - q: "Several meshes and the landscape write normals into the same RVT. Which space do the docs recommend for those normals?"
        choices: ["World space", "Tangent space of each mesh", "Screen space", "View space"]
        answer_index: 0
        explain: "A common world space gives better blending when many primitives write and read the RVT. No hidden transform is applied by the output node."
      - q: "Your RVT covers a big world. Rendering the low mips is slow and far actors must stay loaded. What is the suggested fix?"
        choices: ["Raise r.VT.MaxUploadsPerFrame until all mips are rendered in one frame, and keep every actor of the world loaded", "Split the landscape into many small RVT volumes with one mip each, and unload all the volumes that are far from the camera", "Turn off virtual texture support for far areas, and draw the landscape there with its full material", "Bake and stream the low mips as a Streaming Virtual Texture (set Streaming Levels and Build), and keep high mips at runtime"]
        answer_index: 3
        explain: "Baking the low mips removes the slow runtime rendering and the need to keep far actors resident. High mips still render at runtime."
    flavors:
      _default: {why: "Rocks and props that stop sharply at the ground look fake. RVT lets them take the ground's color."}
      tech_art: {why: "RVT is a system with many parts and a real memory cost. You set it up once so artists can use it every day.", do: "Write the Draw in Main Pass choice for each writer type in a short team note."}
      lookdev: {why: "Soft ground contact makes props look like they belong in the scene."}
      level_design: {why: "Roads and decals that follow the terrain come from the same system. Know what it needs from your level."}

  - id: TAQ20
