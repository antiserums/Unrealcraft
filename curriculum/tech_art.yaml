        choices: ["Burst is GPU only, Rate is CPU only", "Burst makes 2500 particles at once at time 0, Rate makes a continuous 500 per second after that", "They do the same thing", "Rate is used only for ribbons"]
        answer_index: 1
        explain: "The burst gives a big group of particles at start. Spawn Rate then keeps a stream of 500 per second while the emitter is active."
