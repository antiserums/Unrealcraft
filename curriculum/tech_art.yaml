  - id: TAQ14
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [data-validation, pipeline, tools]
    required_spine: false
    required: true
    title: Catch bad assets before they ship
    brief: "Data Validation is an editor feature that checks assets against rules and reports the ones that break a rule. A rule that runs by itself catches mistakes, such as a badly named texture, before they reach the finished game. You can write your own rules as Blueprints. In this quest you run the built-in validation once, and then you write a validator that fails every texture whose name does not start with T_."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/data-validation-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/scripting-the-unreal-editor-using-blueprints"
    checklist:
      - "Open any project, or create one from the Third Person template. Open Edit, then Plugins, and check that the Data Validation plugin is enabled."
      - "Right-click a content folder and choose Validate Assets in Folder. Read the results in the Message Log."
      - "Create a new Blueprint Class and pick EditorValidatorBase as its parent class. Name it EV_TextureNaming."
      - "Override the function Can Validate Asset. Make it return true only when the asset is a Texture2D, so the rule is used for textures only."
      - "Override the function Validate Loaded Asset. If the asset name does not start with T_, call Asset Fails with a clear message. Otherwise call Asset Passes. Every path through the function must end in one of these two calls."
      - "Save the Blueprint, and restart the editor if the validator is not picked up. Then import or rename one texture so its name has no T_, and run Validate Assets on it."
    done_when: "Send a screenshot of the Message Log that shows your EV_TextureNaming failure message on a badly named texture. Also send one screenshot of the Validate Loaded Asset graph."
    xp: 110
    verify_type: screenshot
    quiz:
      - q: "How do you validate every asset in the project from the editor?"
        choices: ["File → Save All", "Tools → Validate Data...", "Build → Build All Levels", "Window → Message Log → Clear"]
        answer_index: 1
        explain: "Tools → Validate Data... validates all assets in the project's content directory."
      - q: "Your build server must check assets on every change. What do you run?"
        choices: ["The DataValidation commandlet: UnrealEditor-Cmd.exe <Project>.uproject -run=DataValidation", "Play in Editor with -nosound, started by the build server after each change that is submitted", "The Cook command only, because it also validates every asset that it cooks for the target platform", "A Level Blueprint on Begin Play, which the build server starts in a test level after each change"]
        answer_index: 0
        explain: "The page gives the -run=DataValidation commandlet for Continuous Integration systems."
      - q: "You wrote a Blueprint validator, but the command-line run ignores it. What does the page say?"
        choices: ["Blueprint validators never work, neither in the editor nor on the command line; the class only exists so that C++ validators can be listed", "You must rename it with a V_ prefix, because the command line only loads validator assets whose names start with those two characters", "By default the command line runs only C++ validation rules; you must extend it to support Blueprint and Python rules", "Command-line validation only checks textures and meshes; Blueprint assets and their validators are skipped by design"]
        answer_index: 2
        explain: "The Data Validation system only runs C++ rules by default from the command line. It can be extended for Blueprint and Python."
      - q: "Which two functions are key in a UEditorValidatorBase validator?"
        choices: ["BeginPlay and Tick of the validator", "IsEnabled and Destroy of the validator", "IsDataValid_Implementation and PreSave", "CanValidateAsset and ValidateLoadedAsset"]
        answer_index: 3
        explain: "CanValidateAsset decides if the validator applies to an asset. ValidateLoadedAsset does the check."
      - q: "What must ValidateLoadedAsset do on every execution path?"
        choices: ["Call AssetPasses or AssetFails", "Save the asset to disk after the check", "Print to screen which asset was checked", "Return a texture or a mesh asset"]
        answer_index: 0
        explain: "Each path must end with AssetPasses or AssetFails, so the result is always clear."
      - q: "You want to validate your own custom C++ class and need its private data. Which method fits best?"
        choices: ["A Python validator that is registered with AddValidator", "Override IsDataValid in your UObject-derived class", "A Level Blueprint that checks the class", "An Editor Utility Widget button that reads the data"]
        answer_index: 1
        explain: "Overriding IsDataValid works best for your own classes and can access private and protected data."
      - q: "How are Python validators registered, compared with C++ and Blueprint ones?"
        choices: ["All three are registered by hand, each with a call to AddValidator on the UEditorValidatorSubsystem when the editor has finished its startup", "All three are found automatically on editor startup, as long as each class is saved in the project", "Python validators register with UEditorValidatorSubsystem using AddValidator; C++ and Blueprint are found on editor startup", "Python validators are added in Project Settings → Maps & Modes; C++ and Blueprint validators are registered by hand in code"]
        answer_index: 2
        explain: "C++ and Blueprint validators are discovered automatically on editor startup. Python ones must call AddValidator."
      - q: "When does validation run, besides the menus and CI?"
        choices: ["Only when you package the game for a platform", "Every frame in PIE, for the actors in the level", "Only when the editor closes, for all open assets", "On asset save, which is enabled by default"]
        answer_index: 3
        explain: "Validation runs through CI, menu options and on asset save (enabled by default). Failures show in the Message Log."
    flavors:
      _default: {why: "A rule that runs by itself catches mistakes before anyone ships them."}
      tech_art: {why: "Naming and budget rules only work if a machine checks them. Validators are how a tech artist enforces standards.", do: "Write the fail message as an instruction: what is wrong and how to fix it."}
      programming: {why: "Validators plug into CI, so broken content fails the build instead of reaching players."}

  - id: TAQ15
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [materials, material-instances, niagara, blueprint]
    required_spine: false
    required: true
    capstone: true
    title: Master + FX
    brief: "A master material is one material with many parameters, and artists make Material Instances from it to get different looks without building new materials. In a real team, a technical artist hands over reusable materials like this together with effects that the game can control. In this quest you build a master material with several instances, a Niagara effect with a value that a Blueprint changes during play, and a short note that tells artists how to use them."
    time_min: 180
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/instanced-materials-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-and-using-material-instances-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-material-parameter-collections-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/system-settings-reference-for-niagara-effects-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Build a material named M_Master_Prop with clear parameters, such as a color tint, a roughness value, and a texture switch or a scale. Put the parameters in groups and give them names that artists will understand."
      - "Make at least 3 Material Instances from it, with names that start with MI_, that look clearly different. Use them on props in one small scene."
      - "Build one Niagara system, with a name that starts with FXS_, that has at least one User parameter (for example SpawnRate or TintColor). You may drive it from an MPC value instead. MPC is short for Material Parameter Collection."
      - "Make one Blueprint, with a name that starts with BP_, that changes that value during play. It can use a key press, a trigger or a timer."
      - "If you use an MPC, let the same value also change M_Master_Prop, so that the props and the effect react together."
      - "Write a short usage note for artists. It should list each parameter, its safe range, and which Blueprint call drives the effect."
      - "Record a short video clip (30 seconds or less), or take before and after screenshots, in Play In Editor (PIE)."
    done_when: "Send the scene with the 3 or more instances, the effect before and after the Blueprint change, the parameter list in M_Master_Prop, and your usage note for artists. A mentor reviews it."
    xp: 250
    verify_type: mentor
    quiz:
      - q: "What is a master material?"
        choices: ["A material that only one prop may use, and that is locked for all other meshes", "One material with many parameters, from which artists make Material Instances", "A material that is made by the engine for each level, and that artists cannot open", "A folder that holds all of the materials of one project"]
        answer_index: 1
        explain: "A master material leaves values open as parameters. Artists get different looks from instances and do not have to build new materials."
      - q: "What does MPC stand for?"
        choices: ["Material Parameter Collection", "Mesh Parameter Collection Asset", "Master Prop Class Configuration", "Material Property Copy Channel"]
        answer_index: 0
        explain: "MPC is short for Material Parameter Collection. It is an asset that stores parameters which many materials can read."
      - q: "What is a User parameter on a Niagara system, such as SpawnRate or TintColor?"
        choices: ["A note for the artist that has no effect on the system, shown as a tooltip in the editor", "A setting that only works in the editor preview and is ignored while the game runs", "A password that locks the system, so that other people cannot open it", "A value of the system that can be set from outside, for example by a Blueprint"]
        answer_index: 3
        explain: "A User parameter is exposed on the system. A Blueprint can change it during play, and the effect reacts."
      - q: "With which prefixes do the names of the Material Instances and of the Niagara system start?"
        choices: ["M_ and BP_", "T_ and SM_", "MI_ and FXS_", "MPC_ and L_"]
        answer_index: 2
        explain: "Material Instances start with MI_ and the Niagara system starts with FXS_. The prefix tells the kind of asset from the name alone."
      - q: "What must the Blueprint with the BP_ prefix do?"
        choices: ["Change the value of the effect during play", "Create the master material when the game starts", "Rename the instances in the Content Browser", "Delete the effect after one second"]
        answer_index: 0
        explain: "The Blueprint changes the value while the game runs, started by a key press, a trigger or a timer. This shows that gameplay can control the effect."
      - q: "If you drive the effect from an MPC value, what else should that same value change?"
        choices: ["The size of the level, so that the room grows when the value goes up", "The names of the Material Instances that use the master material", "The frame rate of the game, so that the effect runs slower at night", "M_Master_Prop, so that the props and the effect react together"]
        answer_index: 3
        explain: "Materials can read a Material Parameter Collection too. One value then changes the props and the effect at the same moment."
      - q: "What does your usage note for artists list?"
        choices: ["The time you spent on each asset, and the tools that you used to make each of them", "Each parameter, its safe range, and which Blueprint call drives the effect", "The engine version and the installed plugins of the project", "The meshes of the scene, their triangle counts and all their texture sizes"]
        answer_index: 1
        explain: "The note tells artists what they can change, how far they can go, and how the effect is driven. They can then use your work without asking you."
      - q: "Why do you give the parameters groups and names that artists will understand?"
        choices: ["So the material compiles faster each time that you press Apply", "So the Niagara system can read them without a Blueprint in between", "So artists can find and use them in an instance without opening the graph", "So the parameters cannot be changed by mistake while an instance is open"]
        answer_index: 2
        explain: "Artists work in the Material Instance, where they only see the parameter list. Clear names and groups make that list easy to use."
    flavors:
      _default: {why: "This is a real tech art handoff: reusable materials plus an effect that gameplay can drive."}
      tech_art: {why: "Master materials and driven FX are two of the most common things a tech artist delivers.", do: "Add one validator or naming check to your MI_ and FXS_ assets and show it passes."}
      lookdev: {why: "A good master material lets you tune many props fast and keep them consistent."}

  - id: TAQ16
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [niagara, collision, performance]
    required_spine: false
    required: false
    title: Particles that hit the world
    brief: "By default, particles pass through floors and walls, and this makes sparks, rain and debris look fake. The Collision module makes particles hit surfaces and bounce. An emitter can run on the processor (CPU) or on the graphics card (GPU), and each one finds surfaces in a different way. In this quest you make sparks that bounce, build a CPU version and a GPU version, and compare how they behave."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/collisions-in-niagara-for-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/particle-update-group-reference-for-niagara-effects-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/gpu-raytracing-collisions-in-niagara-for-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-create-a-sparks-effect-in-niagara-for-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/emitter-settings-reference-for-niagara-effects-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Make a Niagara system named FXS_BouncingSparks that uses a fountain emitter. Place it above a floor and a box in a test level."
      - "In the Particle Update group, click the + button and choose Collision, then Collision, to add the Collision module. Keep it right before the solver module in the stack."
      - "Set Bounce Restitution to about 0.4 and Friction to about 0.2. Restitution controls how much speed a particle keeps after a bounce. Check that the sparks bounce off the floor."
      - "Duplicate the emitter. On the copy, open Emitter Properties and set Sim Target to GPU. Keep the first emitter on CPU."
      - "On the GPU copy, try the options of GPU Collision Type. Turn the camera so the floor leaves the screen, and note what changes."
      - "Write 3 lines that say what each version used to find surfaces, and which version you would ship for this effect."
    done_when: "Send a screenshot of both emitters bouncing on the floor, and add your 3-line note that compares CPU and GPU collision."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Where must the Collision module sit in Particle Update?"
        choices: ["At the very top of the stack, above all", "Immediately before the solver module", "In the Render group, below the Sprite Renderer", "In System Spawn, above the Emitter State module"]
        answer_index: 1
        explain: "The module reference says Collision must be placed immediately before the solver module."
      - q: "How does the Collision module find surfaces on a CPU emitter?"
        choices: ["It casts rays", "It reads the scene depth buffer", "It uses Lumen reflections", "It cannot collide on CPU"]
        answer_index: 0
        explain: "On CPU emitters the module casts rays to find collisions with the world."
      - q: "What can a GPU emitter use to find collision surfaces?"
        choices: ["Only physics bodies of Skeletal Meshes", "Only Nav Mesh data of the open level", "The scene depth or the global distance field", "The thumbnails shown in the Content Browser"]
        answer_index: 2
        explain: "With GPU emitters, the Collision module uses the scene depth or the global distance field."
      - q: "GPU particles use depth buffer collision. The camera turns and the floor leaves the screen. What is the known weakness?"
        choices: ["The particles turn into meshes when they leave the screen", "Collision gets more accurate when the floor is off screen", "The effect switches to the CPU, which is more accurate but much slower", "It is low cost but low accuracy; particles that go off screen disappear"]
        answer_index: 3
        explain: "The page calls depth buffer collision low cost and low accuracy. Shapes are not accurate, and a particle that goes off screen disappears."
      - q: "What is true about GPU Ray Traces collision?"
        choices: ["It is experimental and one frame behind, because the calculation is asynchronous", "It is the default for all emitters, and it always gives exact results in each frame", "It works on any RHI, including DirectX 11 and Vulkan, without an extra project setting", "It only works on CPU emitters, and a GPU emitter has to use the depth buffer in its place"]
        answer_index: 0
        explain: "GPU Ray Traces is experimental. The calculation is asynchronous, so collision is one frame behind."
      - q: "What does GPU Ray Traces collision need in Project Settings?"
        choices: ["Forward Shading turned on and Default RHI set to DirectX 11 only", "Default RHI set to DirectX 12 and Support Hardware Ray Tracing on", "Mobile HDR off and the Forward Renderer turned on for all of the platforms", "Nanite disabled for the project and for every mesh"]
        answer_index: 1
        explain: "The project must use DirectX 12 and have hardware ray tracing support enabled."
      - q: "Ray tracing is not available on a player's machine. What does the default Async Gpu Trace DI setting do?"
        choices: ["Turns off the effect on that machine, without a message", "Crashes with an error that names the missing feature", "Falls back from HW Ray Tracing to Global Signed Distance Fields", "Switches the emitter to CPU simulation and uses physics bodies"]
        answer_index: 2
        explain: "The default array tries HW Ray Tracing first, then falls back to Global Signed Distance Fields."
      - q: "You want a second emitter to spawn smoke where sparks hit. Which module helps?"
        choices: ["Scale Color, with a curve that goes to gray at the end of life", "Spawn Rate, with a higher value in the emitter of the sparks", "Sprite Renderer, with a second material slot for the smoke particles", "Generate Collision Event, read by an Event Handler in another emitter"]
