      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-a-scriptable-tool-in-unreal-engine"
    checklist:
      - "Enable the Scriptable Tools Editor Mode plugin (and Geometry Script if you need its nodes). Restart."
      - "Create an Editor Utility Blueprint from EditorScriptableModularBehaviorTool named BP_Tool_PlaceProp. Set Tool Name, Category and Tooltip."
      - "Create BP_ToolProps_PlaceProp from ScriptableInteractiveToolPropertySet with public variables: Mesh, MinScale, MaxScale. Add it in On Script Setup with Add Property Set of Type."
      - "Add a Single Click Behavior. In IfHitByClick, line trace from the click ray and return the hit. On click, spawn the chosen mesh at the hit point with a random scale."
      - "Show a Display User Help Message with short instructions. Save the property set on shutdown and restore it on setup."
      - "Open the Scriptable Tools mode and place 10 props with the tool."
