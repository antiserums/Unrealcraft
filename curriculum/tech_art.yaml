  - id: TAQ97
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [vehicles, physics-asset, animation-blueprint, rigging]
    required_spine: false
    required: false
    title: "Rig a Chaos vehicle: wheels, physics asset, Wheel Controller"
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-set-up-vehicles-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/vehicles-in-unreal-engine"
    checklist:
      - "Enable ChaosVehiclesPlugin (Settings > Plugins, Physics category) and restart. Get a vehicle skeletal mesh with wheel bones: the Buggy from the Vehicle Game sample (Launcher > Learn) or a free vehicle from Fab."
      - "Create two Blueprints from ChaosVehicleWheel: BP_WheelFront (Affected by Steering on, Axle Type front) and BP_WheelRear (Affected by Handbrake and Affected by Engine on). Set Wheel Radius to match the render model in cm (58 for the Buggy)."
      - "Create the physics asset: right-click the skeletal mesh > Create > Physics Asset > Create and Assign with Single Convex Hull. In the Physics Asset Editor select all wheel bones, set Primitive Type to Sphere and Re-generate Bodies. Select the suspension bones and set Collision > No Collision."
      - "Create a Curve Float named TorqueCurve (Miscellaneous > Curve) with an inverted U shape: X is engine RPM, Y is torque."
      - "Create ABP_Vehicle with parent class VehicleAnimationInstance and the vehicle Skeleton. In the AnimGraph connect Mesh Space Ref Pose > Wheel Controller for WheeledVehicle > Component To Local > Output Pose. If the mesh has suspension bones, add Look At nodes so they follow the wheel joints."
      - "Create BP_Vehicle from WheeledVehiclePawn. Set the Skeletal Mesh, Anim Class and Simulate Physics. On the Vehicle Movement Component fill Wheel Setups with Wheel Class and Bone Name for each wheel (FL, FR, BL, BR) and set the Torque Curve External Curve to TorqueCurve. Add a Spring Arm and Camera."
      - "Make a Game Mode with BP_Vehicle as Default Pawn, set it as GameMode Override in World Settings, hook up Set Throttle Input and Set Steering Input, and press Play. Watch the wheels spin and steer."
    done_when: "Screenshot of the Physics Asset Editor with sphere bodies on the wheels, screenshot of the ABP_Vehicle AnimGraph with the Wheel Controller node, and a short PIE screenshot with the vehicle moving."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "You enabled ChaosVehiclesPlugin but vehicles do not work. What does the page warn about?"
        choices: ["The plugin needs Nanite enabled", "It only works in packaged builds", "It requires a Static Mesh vehicle", "The plugin will not work with PhysX enabled"]
        answer_index: 3
        explain: "The page notes that you must restart after enabling the plugin and that it will not work with PhysX enabled."
      - q: "What value must Wheel Radius on a wheel Blueprint match?"
        choices: ["The collision sphere in the physics asset", "The size of the render model in centimeters", "The suspension length", "The bone length in the skeleton"]
        answer_index: 1
        explain: "Wheel Radius needs to match the size of the render model in cm. For the Buggy example both wheels use 58."
      - q: "You want an all-wheel-drive car. Which wheel setting do you enable on all wheels?"
        choices: ["Affected by Handbrake", "Affected by Steering", "Affected by Engine", "Max Steer Angle"]
        answer_index: 2
        explain: "Affected by Engine is enabled on rear wheels for RWD, front wheels for FWD, and on all wheels for AWD. Handbrake is normally rear only."
      - q: "Why would you set a negative Max Steer Angle on rear wheels?"
        choices: ["For rear-wheel counter-steering on an all-wheel drive vehicle", "To disable steering on them", "To make them spin backwards", "It is not allowed"]
        answer_index: 0
        explain: "Max Steer Angle is normally positive, but a negative value is allowed on the rear wheels for counter-steering, which gives all-wheel steering."
      - q: "What do the axes of the engine torque curve represent?"
        choices: ["X is time, Y is speed", "X is engine RPM, Y is torque in Newton meters", "X is gear, Y is RPM", "X is throttle, Y is acceleration"]
        answer_index: 1
        explain: "The X axis is engine RPM from 0 to max RPM and the Y axis is torque in NM. A typical curve is an inverted U that peaks mid range."
      - q: "In the physics asset, what does the page do with the wheel bones and the suspension bones?"
        choices: ["Wheels get Box bodies, suspension gets Capsules", "Both get Single Convex Hulls", "Wheels get No Collision, suspension gets Spheres", "Wheels get Sphere bodies, suspension gets No Collision"]
        answer_index: 3
        explain: "Select the wheel bones, set Primitive Type to Sphere and Re-generate Bodies. Then select the suspension bones and choose Collision > No Collision."
      - q: "Which parent class does the vehicle Animation Blueprint use, and what does the Wheel Controller node do?"
        choices: ["AnimInstance; it plays a spin montage", "ControlRig; it drives the wheels through controls", "VehicleAnimationInstance; it reads wheel data (spin, handbrake, suspension) and animates the wheel bones", "WheeledVehiclePawn; it applies physics to the wheels"]
        answer_index: 2
        explain: "The ABP is created with the VehicleAnimationInstance parent class. The Wheel Controller node gets the information from the wheels and turns it into animation on the associated bone."
      - q: "In the Wheel Setups array you listed the wheels in the order BL, BR, FL, FR. Does this change which wheel is front or rear?"
        choices: ["No, only Bone Name and Wheel Class have any effect", "Yes, the first two entries are always the front", "Yes, the order must match the skeleton hierarchy", "No, but the vehicle will not compile"]
        answer_index: 0
        explain: "The order has no bearing on front or rear. Only the Bone Name and the Wheel Class matter. Epic still recommends a fixed order (FL, FR, BL, BR) so wheel index lookups stay consistent."
    flavors:
      _default: {why: "A vehicle is a rig, a physics asset and an AnimBP working together. Knowing the chain lets you fix any of them."}
      tech_art: {why: "Vehicle setup is a classic tech-art hand-off: artists give you a mesh, and you make it drivable and animated.", do: "Write a 5-line naming and export checklist for vehicle meshes (wheel bone names, pivot, units) that an artist could follow."}

