    required_spine: false
    required: false
    title: Make UVs move
    brief: "UVs are the coordinates that tell a material where each part of a texture goes on a surface. If you change the UVs over time, the texture slides or turns on the surface. This is the cheapest way to add motion to a material, and water, fire, smoke and holograms all start with it. In this quest you make a texture scroll with a Panner node, turn with a Rotator node, and control the speed with parameters."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animating-uv-coordinates-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/coordinates-material-expressions-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a material named M_Flow. Drag a tiling texture into the graph, for example T_GridChecker_A from the folder LevelPrototyping/Textures, or a tiling texture of your own."
      - "Hold P and left-click in the graph to add a Panner node, which slides UVs over time. Connect its output to the UVs input of the Texture Sample. Set Speed X to 0.1 and watch the preview move."
      - "Add three Scalar Parameters named Tiling, SpeedX and SpeedY. Multiply a TextureCoordinate node by Tiling and connect the result to the Coordinate input of the Panner. Use the two speed parameters for the pan speed."
      - "Select all the nodes and press Ctrl+D to duplicate them. Give the copy a different speed and scale, and connect it to Emissive Color."
      - "Add a Rotator node to a second Texture Sample. Set CenterX and CenterY to 0.5 so it turns around the middle, and give it a small Speed."
      - "Make a Material Instance named MI_Flow_Fast from M_Flow and change only the speed parameters. Apply it to a plane in the level."
    done_when: "Send a screenshot of the M_Flow graph with the Panner, the Rotator and the three parameters visible. Add a short note that says which speed values you used in MI_Flow_Fast."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "What are the two inputs of the Panner node?"
        choices: ["Coordinates and Time", "Speed and Direction", "UV and Texture", "Offset and Scale"]
        answer_index: 0
        explain: "The Panner takes Coordinates (base UVs to modify) and Time (a value that sets the current pan position)."
      - q: "What is usually connected to the Time input, and what else can you use there?"
        choices: ["A Texture Sample that holds the animation frames; nothing else works, because the input only accepts texture nodes", "A Time expression for constant motion; a Constant or Scalar Parameter to set an offset or drive it from Blueprint", "A Panner for a moving texture; a Rotator or a second Panner to change its direction over time", "A Constant only, with a value from 0 to 1; no other node can be connected to the input"]
        answer_index: 1
        explain: "The page says Time is usually a Time expression for constant panning, but a Constant or Scalar Parameter can also set a specific offset or control the panning through Blueprints."
      - q: "Which hotkey drops a Panner node when you hold it and left-click in the graph?"
        choices: ["U", "T", "P", "M"]
        answer_index: 2
        explain: "Hold P and left-click to insert a Panner at the mouse pointer."
      - q: "What does the Fractional Part option on the Panner do?"
        choices: ["Halves the pan speed", "Outputs only the fractional part of the pan, a value from 0 up to (but not including) 1, for greater precision", "Pans only in the U direction, and ignores the Speed Y value, which is useful for textures that scroll sideways", "Rounds the UVs to whole numbers, so the texture jumps from one tile to the next and never shows a partial tile"]
        answer_index: 1
        explain: "Fractional Part outputs only the fractional part of the pan calculation for more precision. The output is greater than or equal to 0 and less than 1."
      - q: "On what kind of mesh does UV animation work best?"
        choices: ["Meshes with a large number of UV seams", "Meshes with no UVs", "Meshes with contiguous (unbroken) UVs", "Meshes with two UV channels"]
        answer_index: 2
        explain: "Any gaps or seams in the UVs show when the UVs move, so panning works best on contiguous UV layouts."
      - q: "What do CenterX and CenterY set on a Rotator node?"
        choices: ["The speed of the rotation, in full turns for each second", "The pan direction of the texture, as a vector with U and V", "The texture tiling in U and V, before the rotation is applied", "The U and V coordinate used as the center of rotation"]
        answer_index: 3
        explain: "CenterX is the U coordinate and CenterY is the V coordinate that the Rotator turns around. Speed sets how fast it rotates clockwise."
    flavors:
      _default: {why: "Moving UVs are the cheapest way to add motion. Water, fire, smoke and holograms all start here."}
      tech_art: {why: "Panner and Rotator cost almost nothing, so they are your first tool for motion before you reach for Niagara or flipbooks.", do: "Expose the speed as a parameter and drive it from a Blueprint with a Dynamic Material Instance."}
      cinematics: {why: "A panning material can sell a moving river or screen without any animation work."}

  - id: TAQ49
    rank: 1
    difficulty: apprentice
    specializations: [tech_art]
    subjects: [materials, blend-modes, shading-models, two-sided, optimization]
    required_spine: false
    required: false
    title: Blend modes and two-sided
    brief: "The Blend Mode of a material decides how its surface mixes with what is behind it. Opaque is solid, Masked cuts holes in the surface, and Translucent, Additive and Modulate let the background show through in different ways. This choice sets what the material can do and what it costs, before you add any nodes. In this quest you make four materials with different blend modes and compare them side by side."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/material-blend-modes-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-material-properties"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/shading-models-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Place a wall in a level, for example a scaled cube, and place a sphere in front of it. Create a material named M_BlendTest with a texture connected to Base Color, for example T_GridChecker_A from the folder LevelPrototyping/Textures. Also have a pattern with clear black and white areas ready, such as a striped texture of your own or the same checker texture."
      - "Set Blend Mode to Masked and connect the stripes to Opacity Mask. Change the Opacity Mask Clip Value, which is the limit below which a pixel is not drawn, and watch which stripes disappear."
      - "Turn on Two Sided, which makes the material draw on the back of each surface too. Look inside the sphere and note the change."
      - "Duplicate the material and name the copy M_BlendTest_Trans. Set its Blend Mode to Translucent, connect a gradient to Opacity, and note that the reflections are gone."
      - "Make two more copies, one with the Additive blend mode and one with Modulate. Put all four spheres in a row in front of the wall."
      - "For each blend mode, write down whether it supports lighting and what happens where two spheres overlap."
    done_when: "Send one screenshot of the four spheres in front of the wall, each labeled with its blend mode, and add your lighting notes."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "In Masked mode, what decides if a pixel is drawn?"
        choices: ["The pixel is drawn if Opacity Mask is greater than the Opacity Mask Clip Value", "The pixel is drawn if its Base Color is not black, whatever the Opacity Mask is", "The pixel is drawn if Opacity is above 0.5 on the main node", "All pixels are drawn, then blended with the pixels behind them"]
        answer_index: 0
        explain: "Masked: Final color = Source color if OpacityMask > OpacityMaskClipValue; otherwise the pixel is discarded."
      - q: "Why can Masked be cheaper than Translucent for a chain-link fence?"
        choices: ["Masked materials use fewer textures, because the Opacity Mask replaces the Base Color", "Masked pixels that are culled are not calculated at all, so the GPU does less work", "Translucent materials cannot use textures for their opacity", "Masked materials skip the vertex shader on all culled triangles"]
        answer_index: 1
        explain: "Culled pixels in Masked mode simply do not draw and are not calculated, which gives performance savings on the GPU."
      - q: "Which statement about Translucent materials is correct per the docs?"
        choices: ["They support dynamic lighting fully, including sharp reflections of every light source", "They are always cheaper than Opaque materials, because no depth is written for their pixels", "They ignore the Opacity input and take their transparency from the alpha of the Base Color", "They do not currently support specularity, so you see no reflections on the surface"]
        answer_index: 3
        explain: "Translucent Blend Mode does not support specularity. Reflections can only be faked, for example with a cubemap added to Base Color."
      - q: "An Additive effect is hard to see on a bright sky. What does the page suggest?"
        choices: ["Switch to Modulate, which is brighter on bright skies", "Turn on Two Sided, which doubles the light of the effect", "Use the AlphaComposite blend mode instead", "Raise the Opacity Mask Clip Value up to 1"]
        answer_index: 2
        explain: "Additive materials are often hard to see against light backgrounds. AlphaComposite can improve saturation and visibility in bright scenes."
      - q: "What does Two Sided do, and what is its known limit?"
        choices: ["It doubles the polygons of the mesh so both sides exist; it costs twice as much to render in every pass", "It flips the normal on back faces so both sides are lit; it does not work correctly with static lighting", "It makes the material translucent on its back faces; it needs the Opacity input to work", "It mirrors the UVs on the back faces; it breaks normal maps on meshes that are curved"]
        answer_index: 1
        explain: "Two Sided flips the normal on back faces so lighting is calculated for both sides. With static lighting both sides are shaded the same, because the mesh has only one lightmap UV set."
      - q: "Which advanced property saves several instructions and one sampler?"
        choices: ["Fully Rough", "Disable Depth Test", "Dithered LOD Transition", "Cast Ray Traced Shadows"]
        answer_index: 0
        explain: "Fully Rough forces the material to be completely rough, which saves a number of material instructions and one sampler. Disable Depth Test makes rendering significantly slower."
    flavors:
      _default: {why: "Blend mode and shading model decide what a material can do and what it costs before you add a single node."}
      tech_art: {why: "Translucency and two-sided are the most common hidden costs in a scene. Knowing when Masked is enough saves frames.", do: "List every Translucent material in your test level and mark which could be Masked instead."}
      lookdev: {why: "Glass, foliage and fences each need a different blend mode to look right."}

