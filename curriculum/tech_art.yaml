# Unrealcraft — Tech Art specialization, all ranks. IDs TAQ1…
# Difficulty tiers: novice (rank 0) · apprentice (1) · adept (2) · expert (3) · master (4).
# Every URL was checked against the live UE 5.8 docs when written.

quests:
  - id: TAQ1
    rank: 0
    difficulty: novice
    specializations: [tech_art]
    subjects: [viewport, view-modes, debugging]
    required_spine: false
    required: false
    title: See what the renderer sees
    brief: "A view mode changes how the viewport draws your level. The normal mode is called Lit, but other modes show only one part of the picture, such as the lighting alone or how much work each surface costs the graphics card. Technical artists use these modes to understand what the engine is doing and to find problems. In this quest you look at the same camera view in several view modes and compare them."
    time_min: 25
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/viewport-modes-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open any project, or create one from the Third Person template. Open any level that has a few meshes, lights and materials in it. The level of the template is fine."
      - "Pick one camera view and keep it for the whole quest. Take a screenshot of it in the Lit, Unlit and Wireframe view modes."
      - "Switch to the Detail Lighting view mode, and then to Lighting Only. Look at what changes on surfaces that use normal maps, which are textures that add small surface detail."
      - "Switch to the Shader Complexity view mode, which colors each surface by how expensive its material is to draw. Find the most expensive color on the screen and note which object it is."
      - "Switch to the Light Complexity view mode. Note which surface is affected by the most lights."
      - "When you are done, switch the viewport back to Lit."
    done_when: "Send one image that shows 7 labeled views from the same camera (Lit, Unlit, Wireframe, Detail Lighting, Lighting Only, Shader Complexity and Light Complexity). Add one line about the most expensive object you found."
    xp: 30
    verify_type: screenshot
    quiz:
      - q: "What does the Unlit view mode show?"
        choices: ["Only the polygon edges of meshes", "The final scene with all of its lighting", "Base Color only, with all lighting removed", "Only the shadows of the lights"]
        answer_index: 2
        explain: "Unlit removes all lighting from the scene and shows Base Color only."
      - q: "How is Detail Lighting different from Lighting Only?"
        choices: ["Detail Lighting keeps the normal maps of the original materials; Lighting Only does not", "Detail Lighting shows the Base Color of the original materials; Lighting Only does not", "Detail Lighting turns off all lights; Lighting Only shows them without shadows", "There is no difference; both names open the same view mode in the viewport"]
        answer_index: 0
        explain: "Both use a neutral material. Detail Lighting still uses the normal maps, Lighting Only does not."
      - q: "In Shader Complexity, most of the screen is bright red and white. What does that mean?"
        choices: ["The scene is very cheap to render on any graphics card", "Performance will be poor; many pixels are very expensive", "The lights are too bright for the materials", "The materials are missing on most meshes"]
        answer_index: 1
        explain: "Green to red goes from very cheap to expensive. Pink and white mean very expensive. A screen full of red or white means poor performance."
      - q: "Shader Complexity counts shader instructions per pixel. Why is it not always accurate?"
        choices: ["It only works on landscapes, so the colors on meshes and on particles are not based on any data", "It ignores translucent materials, which are often the most expensive ones in a scene to draw", "It only counts lights, so a material with many nodes shows as green when few lights touch it", "It counts instructions only, but 16 texture lookups are much slower than 16 math instructions"]
        answer_index: 3
        explain: "The mode uses only the instruction count. Different instructions have different costs, so it is a guide, not an exact number."
      - q: "What does the Light Complexity view mode show?"
        choices: ["The color of each light, as a tint on the geometry that it reaches", "The lightmap resolution of each object in the open level", "The number of non-static lights affecting your geometry", "Which lights cast shadows, with one color for each kind of shadow"]
        answer_index: 2
        explain: "Light Complexity shows how many non-static lights affect each surface. More lights means more expensive shading."
    flavors:
      _default: {why: "View modes let you see what the engine is doing, not only the final picture."}
      tech_art: {why: "View modes are your first diagnostic tool. Before you open a profiler, look at the scene through them.", do: "Also try LOD Coloration and note at what distance one mesh changes LOD."}
      lookdev: {why: "Unlit and Detail Lighting tell you if a problem comes from the texture or from the light."}
      level_design: {why: "Shader Complexity and Light Complexity show which parts of your level are expensive."}

  - id: TAQ2
    rank: 0
    difficulty: novice
    specializations: [tech_art]
    subjects: [performance, profiling, stat-commands]
    required_spine: false
    required: false
    title: "Read the frame: stat fps and stat unit"
    brief: "Frames per second (fps) tells you how smoothly the game runs, but it does not tell you why it is slow. The console command stat unit splits the time of one frame into parts: the game logic, the rendering thread (called Draw) and the graphics card (GPU). The part that takes the longest is called the bottleneck, and it shows you where to look. In this quest you read these numbers, make the level heavier on purpose, and read them again."
    time_min: 30
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/stat-commands-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/introduction-to-performance-profiling-and-configuration-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/common-memory-and-cpu-performance-considerations-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open a level and start Play In Editor (PIE), which runs the game inside the editor."
      - "Press the ~ key to open the console, the line where you can type commands. Type stat fps and press Enter, then type stat unit and press Enter."
      - "Write down the Frame, Game, Draw (rendering thread) and GPU times. They are shown in milliseconds."
      - "Stop PIE. Add something heavy to the level, for example 20 movable point lights close together, or many translucent planes."
      - "Start PIE again with stat unit turned on. Write down the new numbers."
      - "Compare the two sets of numbers and see which time grew the most. That time shows where your bottleneck is."
    done_when: "Send two screenshots with stat unit visible, one from before and one from after you added the heavy objects. Add two lines: one that says which time grew the most, and one that says what you think caused it."
    xp: 30
    verify_type: screenshot
    quiz:
      - q: "What does stat unit show?"
        choices: ["Only the frames per second, as one number in the corner of the viewport", "Overall frame time plus game thread, rendering thread and GPU times", "Memory used by textures, split into streaming pool and non-streaming", "The number of Actors in the level and how many of them tick each frame"]
        answer_index: 1
        explain: "stat unit shows the overall frame time and the game thread, rendering thread and GPU times. The docs call it a great stat to start with."
      - q: "Which thread handles Actor logic in C++ and Blueprint, and UI logic?"
        choices: ["RHI thread", "Audio thread", "Loading thread", "Game thread"]
        answer_index: 3
        explain: "The game thread handles UObject and Actor logic in C++ and Blueprint, and UI logic. Most of your code runs there."
      - q: "What does the rendering thread do?"
        choices: ["Converts the scene structure into draw commands", "Plays sound and music for the scene", "Loads and unloads data from the disk in play", "Runs Blueprint logic and physics"]
        answer_index: 0
        explain: "The rendering thread turns the scene into draw commands. The RHI thread then sends them to the GPU."
      - q: "Your GPU time is much bigger than your game thread time. What does that suggest?"
        choices: ["Too much gameplay logic: Blueprints and physics take more time than the frame has", "The project is GPU-bound: rendering or post-processing is doing too much work", "The RAM is full, so the game thread has to wait", "Vsync is off, which lets the GPU render more frames than the monitor can show in a second"]
        answer_index: 1
        explain: "If the GPU is the tighter limit, the project is GPU-bound. That points at rendering or post-processing work."
      - q: "Why can performance look a little worse while a profiler is attached?"
        choices: ["Profilers turn off Lumen while they record", "Profilers lower the resolution of the game", "The profiler uses the same CPU, RAM and disk as the game", "Profilers only work in shipping builds, which are slower"]
        answer_index: 2
        explain: "Profiling uses the same resources as the game. So if you hit your target while profiling, you have some spare room."
    flavors:
      _default: {why: "Frames per second tells you there is a problem. stat unit tells you where it is."}
      tech_art: {why: "Finding the bottleneck is the first step of every performance task you will get.", do: "Also try stat gpu and note the biggest item in the list."}
      programming: {why: "A high game thread time often points at your code or your Blueprints."}
      level_design: {why: "Too many lights or objects in one view show up here first."}

  - id: TAQ3
    rank: 0
    difficulty: novice
    specializations: [tech_art]
    subjects: [naming, content-browser, pipeline]
    required_spine: false
    required: false
    title: Names tools can find
    brief: "A naming convention is a set of rules for how you name your assets. A common rule is to start each name with a short prefix that shows the type, such as SM_ for a Static Mesh or T_ for a texture. Clear names help you, your team and your tools find assets fast. In this quest you build a tidy folder structure, rename some assets with prefixes, and write a short naming rule of your own."
    time_min: 25
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/recommended-asset-naming-conventions-in-unreal-engine-projects"
    backup_url: null
    checklist:
      - "Open any project, or create one from the Third Person template. In the Content Browser, make a folder named TechArt. Inside it, make the sub-folders Meshes, Materials, Textures, FX and Tools."
      - "Move or create at least 6 assets in these folders. Use a mix of meshes, materials, material instances and textures. You can duplicate assets that came with the template, or create new empty ones."
      - "Rename each asset in the form Prefix_AssetName_Descriptor. For example: SM_Crate, M_Crate, MI_Crate_Red, T_Crate_BaseColor and T_Crate_Normal."
      - "After you have moved things, right-click the TechArt folder and choose Fix Up Redirectors. Redirectors are small leftover files that point from the old location of an asset to the new one, and this command cleans them up."
      - "Type T_ in the search box of the Content Browser. Check that only textures show up."
      - "Write a short naming rule of 5 lines for your own project and save it in a text file."
    done_when: "Send a screenshot of the TechArt folder tree with the renamed assets visible, and add your 5-line naming rule."
    xp: 25
    verify_type: screenshot
    quiz:
      - q: "What is the naming pattern Epic recommends?"
        choices: ["[AssetName]_[AssetTypePrefix]_[OptionalVariantLetterOrNumber]", "[AssetTypePrefix]_[AssetName]_[Descriptor]_[OptionalVariantLetterOrNumber]", "[Descriptor]_[AssetName]_[AssetTypePrefix]_[DateCreated]", "[FolderName]_[AssetName]_[DateCreated]_[OptionalVariantLetterOrNumber]"]
        answer_index: 1
        explain: "The pattern starts with the type prefix, then the name, then a descriptor, then an optional variant."
      - q: "Which prefix is recommended for a Material Instance?"
        choices: ["MI_", "M_", "MAT_", "INST_"]
        answer_index: 0
        explain: "M_ is for a Material. MI_ is for a Material Instance."
      - q: "Which prefix does Epic's list use for a Niagara System?"
        choices: ["NS_", "PS_", "FXE_", "FXS_"]
        answer_index: 3
        explain: "Epic's list uses FXS_ for Niagara Systems, FXE_ for Niagara Emitters and FXF_ for Niagara Functions."
      - q: "What is the Descriptor part of a name for?"
        choices: ["The date on which the asset was made, written as year, month and day in numbers", "The name of the artist who made the asset, written as two or three letters", "Extra context about how the asset is used, for example normal map or opacity map", "The file size of the asset, so that large files are easy to find"]
        answer_index: 2
        explain: "The Descriptor tells you how the asset is used, for example whether a texture is a normal map or an opacity map."
      - q: "Your team already uses a different naming rule. What does the page say?"
        choices: ["You must switch to Epic's rule before you add any new asset to the project at all", "The convention is only a recommendation; your project's requirements come first", "The engine will not load assets that have other names than the ones in the table", "Only Blueprints need prefixes; the other asset types can have any name you like"]
        answer_index: 1
        explain: "The page says the convention is a recommendation. Your own requirements always take precedence."
    flavors:
      _default: {why: "Clear names help you and your team find assets fast and avoid confusion."}
      tech_art: {why: "Your scripts and tools find assets by name and folder. Bad names break tools.", do: "Add one line to your rule that a script could check, for example: every texture starts with T_."}
      lookdev: {why: "Material and texture sets are much easier to swap when their names match."}
      programming: {why: "Code that loads assets by path depends on stable names and folders."}

  - id: TAQ4
    rank: 1
    difficulty: apprentice
    specializations: [tech_art]
    subjects: [blueprint, construction-script, tools]
    required_spine: false
    required: true
    title: A prop that builds itself
    brief: "The Construction Script is a graph inside a Blueprint that runs in the editor each time you place the Blueprint or change one of its settings. You can use it to make a Blueprint build itself, so you do not have to place every piece by hand. In this quest you make a fence Blueprint that creates a row of meshes from two numbers: how many posts there are and how far apart they stand."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/construction-script-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-variables-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/instanced-static-mesh-component-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Create an Actor Blueprint named BP_FenceRow. Add an Instanced Static Mesh component, which draws many copies of one mesh in a cheap way, and give it a simple mesh such as a cube or a fence post."
      - "Add a variable named Count of type Integer and a variable named Spacing of type Float. Click the eye icon next to each one so that it is open. This makes both variables Instance Editable, which means you can change them on each copy in the level."
      - "Open the Construction Script. First call Clear Instances on the component, and then add a For Loop that goes from 0 to Count - 1."
      - "Inside the loop, call Add Instance. Give it a relative location where X is Index * Spacing, so each new copy is placed a little further along."
      - "Place BP_FenceRow in the level. Change Count and Spacing in the Details panel and watch the fence rebuild itself."
      - "Place a second copy of BP_FenceRow and give it different values."
    done_when: "Send a screenshot that shows two BP_FenceRow copies with different Count values and the Details panel visible. Also send a screenshot of the Construction Script graph."
    xp: 110
    verify_type: screenshot
    quiz:
      - q: "When does the Construction Script run?"
        choices: ["Only when you press Play, once for each instance that is in the level at that time", "When an instance of the Blueprint Class is created, after the Components list", "Only when the level is saved, so that the result is stored with the level file itself", "Once per frame during gameplay, before the Event Tick of the same Blueprint runs"]
        answer_index: 1
        explain: "It runs after the Components list when an instance of the Blueprint Class is created, so it can set up that instance."
      - q: "Which of these has no Construction Script?"
        choices: ["An Actor Blueprint", "A Pawn Blueprint", "The Level Blueprint", "A Character Blueprint"]
        answer_index: 2
        explain: "Only Blueprint Classes have Construction Scripts. Level Blueprints do not."
      - q: "You want to change Count on each placed copy from the level's Details panel. What must you do?"
        choices: ["Open the eye icon (Instance Editable) on the variable", "Mark it Private in the Details panel of the variable", "Set Expose on Spawn only, and leave the eye icon closed", "Put it in a Data Table that has one row for each copy"]
        answer_index: 0
        explain: "A public (Instance Editable) variable can be changed from the Details panel of the level editor. The eye is closed by default."
      - q: "What does Expose on Spawn do?"
        choices: ["Shows the variable in the World Outliner", "Makes the variable read-only in all Blueprints that spawn the actor in a level", "Rebuilds the Construction Script on every frame of the game", "Lets you set the variable on the Spawn Actor from Class node"]
        answer_index: 3
        explain: "With Expose on Spawn, the value appears as a pin on Spawn Actor from Class, so it can be set when the Actor spawns."
      - q: "Why use an Instanced Static Mesh component for many identical fence posts?"
        choices: ["It gives each post its own material, so that no two posts in the fence look the same", "It combines the draw calls of identical meshes and uses less memory", "It turns on Nanite for the posts, which removes the cost of their triangles", "It adds collision to each post that you can then edit one by one in the level"]
        answer_index: 1
        explain: "An ISM groups identical meshes into one component. It combines draw calls. All instances share material and collision."
      - q: "The docs give a fence example for the Construction Script. What does that fence do?"
        choices: ["Traces out in each direction to find how long the fence must be", "Plays a sound when the player touches one of the fence posts", "Spawns enemies along the fence when the level starts to play", "Changes color at night, when the sun is below the horizon"]
        answer_index: 0
        explain: "The fence uses traces to measure the space and decide how long it needs to be. The setup depends on where it is placed."
    flavors:
      _default: {why: "A Construction Script lets one Blueprint set itself up in the editor, so you do not place every piece by hand."}
      tech_art: {why: "Props that build themselves are one of the most common tools a tech artist makes for the team.", do: "Add a Random Seed variable and use it to give each post a small random rotation."}
      level_design: {why: "One fence you can stretch in the Details panel is faster than 40 hand-placed posts."}
      lookdev: {why: "You can dress a set with repeated props and still change them all from one place."}

  - id: TAQ5
    rank: 1
    difficulty: apprentice
    specializations: [tech_art]
    subjects: [niagara, vfx]
    required_spine: false
    required: true
    title: Your first Niagara system
    brief: "Niagara is the system Unreal uses to make visual effects such as fire, smoke, sparks and magic. An effect is saved as a Niagara System, and inside it are one or more emitters, which are the parts that create the particles. Each emitter is built from small blocks called modules that you can change. In this quest you create a system from a template, change how many particles it makes, how long they live and what color they have, and place it in a level."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/quick-start-for-niagara-effects-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-niagara-effects-for-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Right-click in the Content Browser and choose FX, then Niagara System. Pick a template that spawns particles all the time, such as Fountain."
      - "Name the new asset FXS_TestFountain. Double-click it to open it in the Niagara Editor."
      - "Find the Spawn Rate module in the Emitter Update group. Change the rate, which is the number of new particles each second, and watch the preview."
      - "In the Particle Spawn group, open the Initialize Particle module. Set Lifetime Mode to Random and enter a Minimum and a Maximum, so each particle lives for a different time."
      - "Change the particle Color in the Initialize Particle module."
      - "Drag FXS_TestFountain from the Content Browser into a level, and check that it looks right there."
    done_when: "Send a screenshot of the Niagara Editor with the emitter stack open, so that Spawn Rate and Initialize Particle are visible. Also send one screenshot of the effect in the level."
    xp: 110
    verify_type: screenshot
    quiz:
      - q: "What is the difference between a Niagara system and an emitter?"
        choices: ["They are the same thing; emitter is the old name from Cascade, and system is the new name in Niagara", "An emitter is the container for the whole effect; systems are where particles are generated", "A system is the container for the whole effect; emitters are where particles are generated", "A system only holds materials; emitters hold the meshes and sprites that use those materials"]
        answer_index: 2
        explain: "A system is the container for everything in the effect. Emitters inside it generate the particles."
      - q: "Which group runs once per particle, when the particle is born?"
        choices: ["Particle Spawn", "Particle Update", "Emitter Update", "Render"]
        answer_index: 0
        explain: "Particle Spawn is called once per particle at birth. Use it for start location, color and size."
      - q: "Particles should shrink as they age. Which group should that module go in?"
        choices: ["Emitter Spawn", "Render", "Particle Spawn", "Particle Update"]
        answer_index: 3
        explain: "Particle Update runs per particle every frame, so it is the place for changes over time."
      - q: "You want particles to keep spawning every frame. Which group holds that spawning module?"
        choices: ["Particle Spawn", "Emitter Update", "Render", "Event Handler"]
        answer_index: 1
        explain: "Emitter Update runs every frame. The docs say to use it when you want particles to keep spawning."
      - q: "In the Quick Start, how does each particle get a slightly different lifetime?"
        choices: ["Lifetime Mode set to Random in Initialize Particle, with a Minimum and Maximum", "A Drag module that slows each particle by a random amount, set in Particle Update", "A second emitter with another lifetime", "The Facing Mode of the Mesh Renderer, set to a random value for every particle"]
        answer_index: 0
        explain: "Setting Lifetime Mode to Random adds Minimum and Maximum fields, so each particle lives a different time."
      - q: "Your effect uses a 3D model for each particle. Which renderer do you need?"
        choices: ["Sprite Renderer", "Ribbon Renderer", "Mesh Renderer", "Light Renderer"]
        answer_index: 2
        explain: "The Quick Start deletes the Sprite Renderer and adds a Mesh Renderer because it uses a 3D model."
    flavors:
      _default: {why: "Niagara is how Unreal makes fire, smoke, sparks and magic. Every project uses it."}
      tech_art: {why: "Tech artists often own VFX setup and VFX performance. You need to read an emitter stack fast.", do: "Look at the effect in Shader Complexity view mode and note how much overdraw it makes."}
      lookdev: {why: "Small effects like dust or steam make a scene feel alive."}
      cinematics: {why: "Shots often need an effect that starts and stops on cue."}

  - id: TAQ6
    rank: 1
    difficulty: apprentice
    specializations: [tech_art]
    subjects: [python, editor-scripting, tools]
    required_spine: false
    required: true
    title: Run Python in the editor
    brief: "Python is a programming language that the Unreal editor can run. With a short Python script you can automate boring editor work, such as checking or renaming many assets, that you would otherwise do by hand. In this quest you turn on Python in the editor, run two lines in the Python console, and then save the code as a script file and run it."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/scripting-the-unreal-editor-using-python"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/scripting-and-automating-the-unreal-editor"
    checklist:
      - "Open any project, or create one from the Third Person template. Open Edit > Plugins and look in the Scripting category. Enable the Python Editor Script Plugin and Editor Scripting Utilities, and then restart the editor."
      - "Open the Output Log. Next to the input line at the bottom, switch the input from Cmd to Python. Then type this line and press Enter: unreal.log(\"Hello from Python\")"
      - "Select 3 or more assets in the Content Browser."
      - "In the Python console, type this line and press Enter: print([a.get_name() for a in unreal.EditorUtilityLibrary.get_selected_assets()])"
      - "Save the same code in a file named list_selected.py inside the Content/Python folder of the project (create the folder if it does not exist). Add the line import unreal at the top of the file."
      - "Run the file with Tools > Execute Python Script, and check the result in the Output Log. The documentation page lists this command under the File menu, where it was in older versions."
    done_when: "Send a screenshot of the Output Log that shows your Hello line and the list of selected asset names. Also add the text of list_selected.py."
    xp: 110
    verify_type: screenshot
    quiz:
      - q: "Which plugin gives the Unreal Editor its Python support?"
        choices: ["Python Editor Script Plugin", "Editor Scripting Utilities", "Modeling Tools Editor Mode", "Remote Control Web Interface"]
        answer_index: 0
        explain: "Python support comes from the Python Editor Script Plugin. The docs also recommend Editor Scripting Utilities."
      - q: "What is the only way to run Python code line by line?"
        choices: ["File > Execute Python Script", "A startup script in Project Settings", "The Python console in the Output Log", "The command line with -run=pythonscript"]
        answer_index: 2
        explain: "The Python console runs each line right away. All the other ways run a script file."
      - q: "What happens to a file called init_unreal.py in your project's Content/Python folder?"
        choices: ["Nothing happens until you run it by hand in the editor", "The editor runs it automatically when it starts", "It is packaged into the game and runs there", "It is deleted when you save the project"]
        answer_index: 1
        explain: "If the editor finds init_unreal.py in one of its Python paths, it runs it automatically at startup."
      - q: "You need to move an asset to another folder with Python. What should you use?"
        choices: ["os.rename on the .uasset file on disk", "shutil.move on the .uasset file on disk", "Delete it and import it again in the new folder", "unreal.EditorAssetLibrary or unreal.AssetTools"]
        answer_index: 3
        explain: "Never move asset files with Python file functions. That can break internal references. Use the Unreal API."
      - q: "Why use set_editor_property() instead of setting the property directly?"
        choices: ["It runs the same pre- and post-edit code as changing the value in the Details panel", "It is faster, because the value is written straight to memory with no checks at all", "It works without the unreal module, so the script can run outside of the editor too", "It saves the level automatically after each change, so no work can be lost by a crash"]
        answer_index: 0
        explain: "set_editor_property() triggers the editor's pre- and post-edit changes, as if you changed it in the Details panel."
      - q: "Your script changes 200 Actors. How do you make one Undo revert all of it?"
        choices: ["Call unreal.log() after each one of the 200 changes", "Wrap the changes in unreal.ScopedEditorTransaction", "Use unreal.ScopedSlowTask", "Save after each change, so that every step is stored in the level file on disk"]
        answer_index: 1
        explain: "A ScopedEditorTransaction bundles many operations into one entry in the Undo history. ScopedSlowTask only shows progress."
    flavors:
      _default: {why: "Python lets you automate boring editor work that you would otherwise do by hand."}
      tech_art: {why: "Python is the main pipeline language. Most tech art tools start as a small editor script.", do: "Extend the script to print each asset's class with a.get_class().get_name()."}
      programming: {why: "The unreal module mirrors what is exposed to Blueprints, including your own C++ code."}

  - id: TAQ7
    rank: 1
    difficulty: apprentice
    specializations: [tech_art]
    subjects: [editor-utility, blueprint, tools]
    required_spine: false
    required: true
    title: Right-click batch tools
    brief: "An Editor Utility Blueprint is a Blueprint that runs in the editor and not in the game. When its parent class is AssetActionUtility, its functions appear in the right-click menu of the Content Browser, and they work on all the assets you have selected. This can turn a long manual task into one click. In this quest you build a right-click action that adds a prefix to the names of many assets at once."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/scripted-actions-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/scripting-and-automating-the-unreal-editor"
    checklist:
      - "Open any project, or create one from the Third Person template. In a folder of your choice, for example TechArt/Tools, right-click and choose Editor Utilities, then Editor Utility Blueprint. Pick AssetActionUtility as the parent class, and name the new asset EUB_AssetActions."
      - "Open it and add a function named AddPrefix. Give the function a String input called Prefix."
      - "Inside the function, add Get Selected Assets and connect it to a For Each Loop. In the loop, call Rename Asset, and make the new name from Prefix followed by the old object name."
      - "Click Compile and then Save. Make a few test assets that have no prefix in their names."
      - "Select the test assets in the Content Browser and right-click them. Run your action from the Scripted Asset Actions menu."
      - "Add a check to the function so the action skips assets whose names already start with the prefix."
    done_when: "Send a screenshot of the right-click menu that shows your action, a before and after screenshot of the renamed assets, and a screenshot of the function graph."
    xp: 115
    verify_type: screenshot
    quiz:
      - q: "Your Scripted Action should work on assets selected in the Content Browser. Which parent class do you pick?"
        choices: ["ActorActionUtility", "AssetActionUtility", "Actor", "GameModeBase"]
        answer_index: 1
        explain: "AssetActionUtility is for Content Browser assets. ActorActionUtility is for Actors in the level or Outliner."
      - q: "You made the action with a Custom Event, but it does not appear in the menu. What is the likely cause?"
        choices: ["Call In Editor is not checked on the Custom Event", "The Blueprint has no components in its list yet", "The level is not saved yet, so menus are empty", "Python is not enabled in the Plugins window"]
        answer_index: 0
        explain: "Call In Editor must be checked. New functions get it automatically; Custom Events do not."
      - q: "Which node returns the Actors currently selected in the level?"
        choices: ["Get Selected Assets", "Get All Actors of Class", "Get Selection Set", "Get Owner"]
        answer_index: 2
        explain: "Get Selection Set returns the selected Actors. Get Selected Assets returns the selected Content Browser assets."
      - q: "Your Actor action should only appear for Static Mesh Actors. Where do you set that?"
        choices: ["Project Settings > Input", "The World Outliner filter", "The World Settings of the open level", "Class Defaults > Supported Classes"]
        answer_index: 3
        explain: "Add the class to Supported Classes in Class Defaults so the action only shows for that type."
      - q: "What happens when your Scripted Action function has inputs?"
        choices: ["The action cannot be run until you remove all of the inputs again", "The editor shows a small window so you can enter the values", "The inputs are always empty, and the function runs with default values", "The inputs are read from a config file in the project folder"]
        answer_index: 1
        explain: "Each time you run it, the editor pops up a window to set the input values."
      - q: "The editor checks that each input is the right type. What else should your script still do?"
        choices: ["Nothing, because the editor already checks everything", "Recompile every time before you run the action", "Handle empty inputs and check that the values make sense", "Restart the editor after each change to an input"]
        answer_index: 2
        explain: "The editor checks the type only. It does not check that a value exists or makes sense, so your script must validate it."
    flavors:
      _default: {why: "A right-click action turns a 10-minute manual task into one click on many assets."}
      tech_art: {why: "Batch tools for artists are core tech art work. Scripted Actions are the fastest way to ship one.", do: "Add a second action to the same Blueprint, for example one that prints each selected asset's name to the log."}
      level_design: {why: "An ActorActionUtility can fix many placed Actors at once."}
      lookdev: {why: "You can batch-fix names or settings on a whole texture set."}

  - id: TAQ8
    rank: 1
    difficulty: apprentice
    specializations: [tech_art]
    subjects: [textures, compression, mips, optimization]
    required_spine: false
    required: true
    title: Texture settings that matter
    brief: "Textures are the images that materials use, and they take up a large part of a game's memory. A few settings on each texture decide how good it looks and how much memory it costs. One of them is sRGB, which should be on for color images and off for images that store data. In this quest you bring three textures for one asset into a project and give each one the correct settings."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/textures-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/texture-asset-editor-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/texture-format-support-and-settings-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. You need three textures for one asset: a color map, a normal map and a packed mask. A packed mask stores a different grayscale image in each color channel. Import your own image files, or duplicate three textures of the template mannequin from the folder Characters/Mannequins/Textures: a color map (name ending in _D), a normal map (_N) and a packed mask (_MRA). Name them T_Crate_BaseColor, T_Crate_Normal and T_Crate_ORM."
      - "Double-click each texture to open it in the Texture Editor. Keep sRGB turned on for the color map, and turn sRGB off for the mask."
      - "Set Compression Settings on two of them: choose Normalmap for the normal map and Masks for the mask texture."
      - "Set a Texture Group for each texture, for example World and WorldNormalMap."
      - "Note the Resource Size of each texture, which is how much memory it uses. Then set LOD Bias to 1 on one texture and note its new size."
      - "Import one more texture whose size is not a power of two (powers of two are sizes such as 512 or 1024). A cropped screenshot saved as a PNG file works. Check how many mips it has. Mips are the smaller copies of a texture that are used when it is far away."
    done_when: "Send a screenshot of the Details panel for T_Crate_ORM with sRGB off and the Masks compression visible. Also add a short table of the 3 textures that lists size, sRGB, compression and Resource Size for each."
    xp: 110
    verify_type: screenshot
    quiz:
      - q: "Why use power-of-two sizes like 512 or 2048?"
        choices: ["They import faster, because the importer can skip the step that resizes every other texture to fit the memory", "They look sharper in the editor, because pixels line up with the screen", "They can be mipmapped and streamed; non-power-of-two textures get no mips and are never streamed", "They are required for normal maps only; color textures of any size are always mipmapped and streamed"]
        answer_index: 2
        explain: "Power-of-two textures can have mipmaps and can stream. Non-power-of-two textures never stream and get no mipmaps."
      - q: "You pack three masks into the R, G and B channels. What should the sRGB setting be?"
        choices: ["Off, because the channels are used as masks", "On, always, because every texture that has color channels uses sRGB", "It does not matter, because masks are read the same way in both cases", "On, but only for the mask in the alpha channel"]
        answer_index: 0
        explain: "sRGB is for color. The docs say to uncheck it when you use channels as masks."
      - q: "Why pack several masks into one texture?"
        choices: ["It makes colors brighter", "The engine can only load one texture per material", "It turns on streaming", "It saves draw calls and disk space"]
        answer_index: 3
        explain: "The Textures page says packing values into one texture saves draw calls and reduces disk space."
      - q: "A 1024x1024 texture has a final LOD Bias of 1. Which size is used for rendering?"
        choices: ["2048x2048", "512x512", "1024x1024", "256x256"]
        answer_index: 1
        explain: "LOD Bias 1 means one mip down, so the 512x512 mip is used."
      - q: "The Texture Group has LOD Bias 1 and the texture's own LOD Bias is 1. What is the final LOD Bias?"
        choices: ["0", "1", "2", "The texture value replaces the group value"]
        answer_index: 2
        explain: "The texture's LOD Bias is added to the Texture Group's LOD Bias, so 1 + 1 = 2."
      - q: "A far-away floor shows ugly shimmering (aliasing). What helps?"
        choices: ["Turning off mips, so that the full resolution is used at every distance", "Using mipmaps, so lower-resolution levels are used at a distance", "Turning on sRGB for the normal map of the floor material in use", "Setting Never Stream on the texture of the floor"]
        answer_index: 1
        explain: "Mips give lower-resolution versions for far distances. Textures without mips cause aliasing in the distance."
    flavors:
      _default: {why: "Textures are one of the biggest parts of memory. A few settings decide how good they look and how much they cost."}
      tech_art: {why: "Wrong sRGB or compression settings are some of the most common texture bugs you will fix.", do: "Write a 3-line texture rule for your team: color, normal and mask settings."}
      lookdev: {why: "A mask with sRGB on gives wrong roughness and metallic values, so your material looks wrong."}

  - id: TAQ9
    rank: 1
    difficulty: apprentice
    specializations: [tech_art]
    subjects: [capstone, view-modes, construction-script, niagara, editor-utility]
    required_spine: false
    required: true
    capstone: true
    title: Lit test bed
    brief: "A test bed is a small level that you build only for testing. It gives you one known place where you can check materials, effects and tools. In this quest you build a lit test room with a prop that builds itself, a Niagara effect and tidy folders, and you measure what the room costs. Everything you need to build is listed in the steps, and you may reuse your own earlier work where it fits."
    time_min: 150
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/viewport-modes-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/construction-script-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/overview-of-niagara-effects-for-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/scripted-actions-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Build a small room in a level named L_TA_TestBed. It needs a floor, walls, one directional light and at least two point lights."
      - "Put a notes board in the room, made from a text render or a textured plane. On it, list the view modes and stat commands you use to check the room."
      - "Place a prop that builds itself in the room, with at least two different settings. If you have none, make an Actor Blueprint named BP_FenceRow with an Instanced Static Mesh component and two Instance Editable variables, Count and Spacing. In its Construction Script, call Clear Instances and then Add Instance in a For Loop, with X set to the loop index times Spacing."
      - "Place one Niagara system in the room. Its name should start with FXS_. You can make one from the Fountain template with FX, then Niagara System in the Content Browser."
      - "Keep all the assets of the room in a folder named TechArt and give them the correct prefixes, such as BP_, FXS_, M_ and L_. If you have a right-click tool that renames assets, use it here."
      - "Check the room in the Lit view mode, in the Shader Complexity view mode, and with stat unit. Write down the numbers you see."
      - "Write 5 lines that say what the room tests, what the most expensive thing in it is, and one fix you would try."
    done_when: "Send screenshots of the room in Lit and in Shader Complexity, one screenshot with stat unit visible, a screenshot of the Content Browser folder, and your 5-line writeup. A mentor reviews it."
    xp: 250
    verify_type: mentor
    quiz:
      - q: "What is a test bed for a technical artist?"
        choices: ["A small level built only for testing", "A tool that renames assets by a rule", "A list of all the stat commands", "A material with many parameters"]
        answer_index: 0
        explain: "A test bed is one known place where you check things under the same light every time. That makes problems easy to spot."
      - q: "In the Construction Script of BP_FenceRow, why do you call Clear Instances before the loop?"
        choices: ["So the mesh gets a new material each time that the script runs again", "So the loop starts at index 1 and does not place a post at the very origin", "So old instances do not pile up each time the script runs again", "So the actor is deleted from the level before the loop runs again"]
        answer_index: 2
        explain: "The Construction Script runs again when you change a setting of the actor in the editor. Clearing first removes the old instances before the loop adds the new ones."
      - q: "In the loop, X is set to the loop index times Spacing. What does this do?"
        choices: ["It makes each instance larger than the last one in the row", "It places each instance one Spacing further along a row", "It rotates each instance around the first", "It gives each instance a random position"]
        answer_index: 1
        explain: "Index 0 gives X 0, index 1 gives one Spacing, index 2 gives two, and so on. The instances form an even row."
      - q: "How do you make the Niagara system for the room?"
        choices: ["Open Landscape Mode, choose New and pick Niagara", "Add a Timeline to the Level Blueprint and name it Niagara", "Enable the Water plugin, restart the editor and place a Niagara body", "In the Content Browser, choose FX, then Niagara System"]
        answer_index: 3
        explain: "Niagara System is in the FX group of the Content Browser menu. The Fountain template gives you a working effect, and its name should start with FXS_."
      - q: "What does the Shader Complexity view mode show?"
        choices: ["How many lights touch each mesh in the level", "How many triangles each mesh has, shown as colors on screen", "How costly the materials are to draw on each pixel", "How much memory each of the textures uses on the GPU"]
        answer_index: 2
        explain: "Shader Complexity colors the picture by the cost of the materials on each pixel. Cheap areas are green and costly areas go toward red and white."
      - q: "Which prefixes do the assets in the TechArt folder get?"
        choices: ["BP_ for Blueprints, FXS_ for Niagara systems, M_ for materials and L_ for levels", "A_ for all assets, followed by a number in the order in which the assets were made", "TA_ for every asset in the folder, whatever its type is, so that the folder name is in each name", "No prefixes, because the folder name is enough to tell which assets belong to the room"]
        answer_index: 0
        explain: "A prefix tells the kind of asset from the name alone. With correct prefixes, anyone can search and sort the folder."
    flavors:
      _default: {why: "A test room brings your tools together in one place you can reuse."}
      tech_art: {why: "Tech artists keep a test bed to check new assets, effects and tools under the same light and budget.", do: "Save the room as a template level so you can reuse it for later quests."}
      level_design: {why: "A test room is a safe place to try props and lights before they go into a real level."}
      lookdev: {why: "Checking assets in the same light every time makes problems easy to spot."}

  - id: TAQ10
    rank: 1
    difficulty: apprentice
    specializations: [tech_art]
    subjects: [lod, static-mesh, optimization]
    required_spine: false
    required: false
    title: Automatic LODs for a mesh
    brief: "LOD means Level of Detail. A mesh can have several versions with fewer and fewer triangles, and Unreal shows a simpler version when the object is far from the camera. This saves work for the graphics card, because far-away objects do not need all their triangles. In this quest you let Unreal create LODs for a mesh in two ways, with a preset group and by hand, and you watch them switch in the level."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/static-mesh-automatic-lod-generation-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/viewport-modes-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Pick a mesh with at least a few thousand triangles. Two options that everyone has: make a Sphere with a high subdivision level in Modeling Mode, or copy SM_MatPreviewMesh_01 from the engine content (turn on Show Engine Content in the settings of the Content Browser to see it). Duplicate the mesh and name the copy SM_Rock_LODTest."
      - "Double-click it to open it in the Static Mesh Editor. In the LOD Settings section, set LOD Group to SmallProp and accept the change when the editor asks."
      - "Check that Auto Compute LOD Distances is turned on. Note the triangle count of each LOD."
      - "Make a second copy of the mesh and set it up by hand. Set Number of LODs to 4, and then set Percent Triangles to 75, 25 and 12 for LOD1, LOD2 and LOD3."
      - "Place both meshes in a level. Turn on the LOD Coloration view mode, which gives each LOD its own color, and move the camera away slowly."
    done_when: "Send a screenshot of the LOD Settings that shows the triangle count of each LOD. Also send one screenshot in the LOD Coloration view mode with at least two LOD colors visible."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "How does automatic LOD generation reduce a mesh?"
        choices: ["It deletes random triangles from the mesh, again and again, until it reaches the target triangle count for the LOD", "It collapses the edge with the least visual impact, again and again, until it reaches the target triangle count", "It lowers the texture size of the materials on the mesh, again and again, until the mesh uses less memory than the target", "It converts the mesh to Nanite, which then removes triangles by itself for each frame, based on the distance to the camera"]
        answer_index: 1
        explain: "Quadratic mesh simplification picks the edge whose collapse changes the look the least, and repeats until it hits the target."
      - q: "Which method does Epic recommend for creating LODs?"
        choices: ["Setting every LOD by hand", "Importing each LOD from another program", "Using LOD Group presets", "Using Nanite fallback meshes"]
        answer_index: 2
        explain: "Epic recommends LOD Groups. You set up good categories once and pick them per mesh."
      - q: "Where are the LOD Group presets like SmallProp defined?"
        choices: ["In BaseEngine.ini under [StaticMeshLODSettings]", "In World Settings, under LOD System", "In the Material Editor, in the Details panel", "In Project Settings > Input, under LOD Groups"]
        answer_index: 0
        explain: "The presets live in the [StaticMeshLODSettings] section of BaseEngine.ini. Change them there to change the groups."
      - q: "Why keep Auto Compute LOD Distances turned on?"
        choices: ["It makes LOD0 higher quality; turning it off means that LOD0 is built with the reduction settings of the last LOD", "It turns on shadows for LODs; turning it off means that only LOD0 casts a shadow, and the shadow pops when the LOD changes", "It is required for Nanite; turning it off means the mesh cannot be built as a Nanite mesh", "It picks the screen size for each LOD; turning it off means setting screen sizes by hand, which can cause errors"]
        answer_index: 3
        explain: "The tool knows how much visual error each LOD adds, so it can pick when each LOD should switch."
      - q: "With the SmallProp settings shown on the page, how many LODs does the mesh get?"
        choices: ["1", "4", "6", "8"]
        answer_index: 1
        explain: "SmallProp has NumLODs=4, so you get LOD0 to LOD3."
      - q: "Which view mode shows the current LOD index of each mesh, so you can see where LODs switch?"
        choices: ["Lightmap Density", "Shader Complexity", "LOD Coloration", "Wireframe"]
        answer_index: 2
        explain: "LOD Coloration colors each primitive by its current LOD index. It helps you see at what distance LODs switch."
    flavors:
      _default: {why: "Far-away objects do not need all their triangles. LODs save work for the GPU."}
      tech_art: {why: "Setting LOD rules for the whole project is a typical tech art job.", do: "Compare stat unit GPU time with 50 copies of the mesh, with and without LODs."}
      level_design: {why: "Big levels with many props stay fast when props have good LODs."}
      lookdev: {why: "You need to check that LODs do not pop or change the shape too much."}

  - id: TAQ11
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [materials, material-parameter-collection, blueprint]
    required_spine: false
    required: true
    title: One knob, many materials
    brief: "A Material Parameter Collection (MPC) is an asset that holds a list of named values. Any material can read these values, so when you change one value, every material that uses it changes at the same moment. This is how one number can control the look of a whole level, such as weather, time of day or damage. In this quest you make a collection with a Wetness value and a tint color, use it in two materials, and change it from a Blueprint while the game runs."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-material-parameter-collections-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-and-using-material-instances-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. In the Content Browser, right-click, choose Material, and then click Material Parameter Collection. Name the new asset MPC_World."
      - "Open MPC_World. Add a Scalar Parameter (a single number) named Wetness with a default of 0, and a Vector Parameter (a color) named WorldTint with a default of white."
      - "Open two different materials of your own. If you have none, make two simple ones named M_Rock and M_Ground, each with a different color connected to Base Color and a value of 0.8 connected to Roughness. In each one, add a Collection Parameter node set to MPC_World. Use Wetness to darken Base Color and to lower Roughness, and multiply Base Color by WorldTint."
      - "Place meshes that use both materials, or instances of them, in a test level. Change Wetness in MPC_World and watch every mesh update at once."
      - "Make a Blueprint named BP_WeatherControl. On Begin Play, use a Timeline that goes from 0 to 1 over 5 seconds to drive a Set Scalar Parameter Value node. On that node, set Collection to MPC_World and Parameter to Wetness."
      - "Add a key press event that calls Set Vector Parameter Value to change WorldTint to a warm evening color."
      - "Start Play in Editor and test both parts: first the world gets wet, and then the tint changes when you press the key."
    done_when: "Send two screenshots from PIE, one dry and one wet with the new tint. Also send one screenshot of the BP_WeatherControl graph that shows the Set Scalar Parameter Value node with MPC_World selected."
    xp: 110
    verify_type: screenshot
    quiz:
      - q: "What does a Material Parameter Collection store?"
        choices: ["Textures shared by many materials, loaded only one time", "A set of scalar and vector parameters that any material can reference", "A list of all the Material Instances that are used in the open level", "Compiled shader code for one material and its instances"]
        answer_index: 1
        explain: "An MPC is an asset with scalar and vector parameters. Any material can reference it, so it passes global data into many materials at once."
      - q: "You change a value inside an MPC. What happens to the materials that reference it?"
        choices: ["Nothing until you open and recompile each material that uses the value, one by one", "Only the base materials change; their instances keep the value they had before", "They all update, because the value lives in the MPC, not in the materials", "Only materials in the current level update; those in other levels keep the old value"]
        answer_index: 2
        explain: "The values are stored in a separate asset. Every material that references the MPC uses the new value, including instances of those materials."
      - q: "A snow amount must change on 60 different materials during gameplay. Why use an MPC instead of setting a parameter on 60 Material Instances?"
        choices: ["Updating values in an MPC is much more efficient than setting many parameters on many instances", "MPCs support textures and instances do not, so the snow texture can only be swapped through a collection", "Material Instances cannot be changed at runtime at all, so an MPC is the only possible way to do it", "MPCs do not need a Blueprint, because their values follow the weather of the level without any node at all"]
        answer_index: 0
        explain: "The page says updating an MPC is much more efficient than setting many different parameters on various Material Instances. It is one change instead of 60."
      - q: "How many different Material Parameter Collections can one material reference?"
        choices: ["One", "Four", "Unlimited", "Two"]
        answer_index: 3
        explain: "A material can reference at most two MPCs. A common setup is one for game-wide values and one for level values."
      - q: "You rename the Wetness parameter inside MPC_World. What breaks?"
        choices: ["Every material that uses Wetness; each one shows an error until you open and fix it", "Blueprint nodes that reference Wetness; you must pick the parameter name again on them", "Nothing, everything updates by itself, in the materials and in the Blueprints that use the name", "The MPC asset itself becomes invalid and has to be made again"]
        answer_index: 1
        explain: "Materials keep working after a rename. Blueprints that operate on the collection break until you reassign the Parameter Name."
      - q: "You plan to add many parameters to an MPC over time. What does the page warn about?"
        choices: ["Changing the number of parameters recompiles every material that references the collection", "Each new parameter doubles GPU memory for every material that uses the MPC", "MPCs can only hold 16 parameters, and the rest are dropped without a warning", "New parameters are ignored by all materials until you restart the editor and resave them"]
        answer_index: 0
        explain: "Adding or removing parameters recompiles all referencing materials. Adding many parameters up front can be faster."
      - q: "Which node brings an MPC value into a material graph?"
        choices: ["Scalar Parameter", "Texture Sample", "Collection Parameter", "Material Function Call"]
        answer_index: 2
        explain: "The Collection Parameter node reads from an MPC. In its Details you pick the Collection and the Parameter Name."
      - q: "In Blueprint, which node changes a scalar value in an MPC?"
        choices: ["Set Scalar Parameter Value, with the Collection set to your MPC", "Set Material, on each mesh that uses a material with the collection in it", "Create Dynamic Material Instance, with the Collection as its Parent input", "Set Float Parameter on a Niagara component that reads the collection"]
        answer_index: 0
        explain: "The page uses Set Scalar Parameter Value and picks the MPC in the Collection drop-down, then the parameter name."
    flavors:
      _default: {why: "One value can change the look of a whole level: weather, time of day, damage."}
      tech_art: {why: "An MPC is the tech artist's global control. Artists build materials, gameplay moves one number.", do: "Write a short list of every MPC parameter with its name, range and what it does, so the team uses the same names."}
      lookdev: {why: "Global wetness or tint lets you test many moods in your scene without opening each material."}
      gameplay_design: {why: "Gameplay can drive the world look (danger level, weather) from one Blueprint call."}

  - id: TAQ12
    rank: 2
    difficulty: adept
    specializations: [tech_art]
    subjects: [niagara, user-parameters, blueprint]
    required_spine: false
    required: true
    title: Effects that listen to gameplay
    brief: "A User parameter is a value on a Niagara system that can be set from outside the effect, for example from a Blueprint. With User parameters, one effect can react to what happens in the game, and you do not need to make a new copy of the effect for each case. In this quest you add two User parameters to a fountain effect, one for the spawn rate and one for the color, and you change them with a key press while the game runs."
