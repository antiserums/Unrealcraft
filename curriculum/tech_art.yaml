      - q: "Every emitter in the system needs the same expensive value each frame. Where is the best place to compute it?"
        choices: ["Once in a System group module, stored in the System namespace, then read by each emitter", "In Particle Update, so that each particle has its own copy and never reads an old value", "In a Module Local in every emitter, so that no emitter depends on another one", "In a Static Switch, which is evaluated when the system is compiled"]
        answer_index: 0
        explain: "Work done once in the System group can be read by the Emitter and Particle groups, so it is not repeated."
      - q: "You need a temporary value only inside one module's math. It must not persist to the next frame. Which parameter category?"
        choices: ["Particle Attributes", "Emitter Attributes", "Engine Provided", "Module Locals"]
        answer_index: 3
        explain: "Module Locals are transient. They live within a single module and do not persist between frames or stages."
      - q: "An option in your module changes the graph path and never needs to change while the game runs. Which category fits?"
        choices: ["Module Inputs", "Static Switch", "Engine Provided", "System Attributes"]
        answer_index: 1
        explain: "Static Switch values can only be set at edit time."
      - q: "Your module only makes sense in particle scripts. How do you stop artists adding it to the wrong kind of script?"
        choices: ["Set the Module Usage Bitmask in Script Details", "Add a Deprecation Message to it", "Mark it Experimental in the details", "Put the word particle in the Keywords field"]
        answer_index: 0
        explain: "Module Usage Bitmask selects the kinds of scripts that may reference this module."
      - q: "Twenty effects use your module without versioning. You change the module and save. What happens?"
        choices: ["Nothing until each artist clicks Fix Issue on the module in their effect", "Only new effects get the change; the twenty old ones stay as they were", "The change is pushed directly to every asset that uses the module", "Unreal makes a copy of the old module automatically for each effect"]
        answer_index: 2
        explain: "Without versioning, changes go straight to all users. With versioning, users upgrade by hand."
      - q: "What is the technical difference between a major and a minor module version?"
        choices: ["Major versions recompile all systems; minor versions recompile none at all", "Minor versions cannot add inputs or outputs; major versions can add and remove them", "Major versions need source control; minor versions can be made without a check-out", "There is none; it is a label that tells users how risky the upgrade is"]
        answer_index: 3
        explain: "The docs say there is no internal difference. Major means you may not be able to go back without breaking settings."
      - q: "You are still testing a new version and nobody should see or use it yet. What do you set?"
        choices: ["Leave Is Exposed Version and Is Visible in Version Select unchecked", "Mark the module Deprecated until the test is done", "Delete the old version, so that only one is left", "Turn off Expose to Library for the whole module until you are done"]
        answer_index: 0
        explain: "Keep the version unexposed and hidden from the selector while you iterate. Turn them on when it is ready."
      - q: "Version 2 replaces a bool input with an enum that has three values. How do you keep each artist's old setting after they upgrade?"
        choices: ["Ask artists to write down their settings first, and to enter them again by hand in the new enum input after the upgrade", "Write a Python upgrade script that reads the old input with get_old_input and sets the enum with set_enum_input", "Make it a minor version, so that the values of the old input are copied over to the new input by the editor itself", "Keep both inputs forever"]
        answer_index: 1
        explain: "When the mapping is not clear, an upgrade script on upgrade_context maps old inputs to new ones. This feature is experimental."
    flavors:
      _default: {why: "Stock modules cover a lot, but a team often needs one behavior many times. A module makes it reusable."}
      tech_art: {why: "Your modules are used by other artists. Namespaces keep them correct and versioning keeps their effects from breaking.", do: "Write one line in the module Description that says which group it belongs in and why."}
      lookdev: {why: "A good custom module gives you one clean slider instead of ten copied nodes."}
      programming: {why: "Niagara modules are data-flow code with strict read/write rules per namespace. It is close to writing shaders."}

  - id: TAQ21
    rank: 3
    difficulty: expert
    specializations: [tech_art]
    subjects: [profiling, unreal-insights, performance]
    required_spine: false
    required: true
    title: Find the slow part with Unreal Insights
    brief: "Unreal Insights is a tool that records what the engine does over time and shows it frame by frame. A recording is called a trace. With a trace you do not have to guess what is slow, because you can see how many milliseconds each part of the code took. In this quest you record a trace of a heavy moment, find the slowest frame and the function that costs the most, fix one thing, and measure again."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-insights-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/introduction-to-performance-profiling-and-configuration-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/trace-in-unreal-engine-5"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/timing-insights-in-unreal-engine-5"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-the-timers-and-counters-tabs-in-unreal-insights-for-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/measuring-performance-in-niagara"
    checklist:
      - "Open any project, or create one from the Third Person template. Make a test level named L_TA_Profile that has a known heavy moment. For example, use 50 Niagara systems, or many actors that spawn at the same time."
      - "In the toolbar at the bottom of the editor, open the Trace menu. Check which channels are turned on, and click Start Trace. Then play in PIE for about 20 seconds."
      - "Right before the heavy moment, add a Trace Bookmark, which is a marker you can find later in the recording. You can do this from the Trace menu or with the trace.bookmark command. Then stop the trace."
      - "Open the trace from the Unreal Insights Session Browser. In the Frames panel, find the tallest frame, which is the slowest one, and select it."
      - "In the Timers panel, sort by exclusive time, which is the time spent in a function itself without the functions it calls. Pick the top timer, and use Callers and Callees to see where it sits in the code."
      - "Change one thing to fix the problem and capture a second trace. Compare the same timer in both traces over a longer time range."
    done_when: "Send a screenshot of Timing Insights with the spike frame selected and the Timers panel sorted. Add a 4-line writeup: the timer, its time in ms before, your change, and its time in ms after."
    xp: 180
    verify_type: writeup
    quiz:
      - q: "Where do recorded trace sessions live, and what file type are they?"
        choices: [".uasset files in the Content folder, with one asset per session", ".utrace files, with extra data in .ucache files next to them", ".log files in Saved/Logs, with extra data in the Output Log window", ".csv files in the project root, with one file for each thread"]
        answer_index: 1
        explain: "Traces are stored as .utrace files. Companion data goes into .ucache files in the same folder."
      - q: "You want to see which frames in a 30-second capture are spikes. Which panel do you look at first?"
        choices: ["Log panel", "Callers panel", "Frames panel", "Session Browser"]
        answer_index: 2
        explain: "The Frames panel shows each frame's total time as a bar graph, so spikes stand out."
      - q: "In the Timing panel, what does the width of an event block tell you?"
        choices: ["How much time the thread spent on that event", "How many instances of the system were spawned", "How much memory it used", "How many draw calls it made in that frame"]
        answer_index: 0
        explain: "Each track is a thread. The width of an event shows how long the thread spent processing it."
      - q: "A timer has a large inclusive time but a small exclusive time. What does that tell you?"
        choices: ["The trace is broken, and the numbers cannot be trusted", "The timer itself is the slow part, so its own code must be optimized", "It only ran on the GPU, so the CPU time of it is small", "Most of the time is spent in its child timers, so look at its Callees"]
        answer_index: 3
        explain: "Inclusive time includes child timers. If exclusive time is small, the cost is in what it calls."
      - q: "You found a slow function. Which panel shows the functions that call it?"
        choices: ["Callees", "Callers", "Counters", "Log"]
        answer_index: 1
        explain: "Callers lists the functions that call the selected event. Callees lists what it calls."
      - q: "You add -StatNamedEvents to see Niagara asset names in the trace. What is the catch?"
        choices: ["It adds overhead, so use it to find the problem, then capture again without it for true timings", "It turns off the GPU track, so you only see CPU timers for as long as the option is active", "It only works in shipping builds, so you must package the game before each capture of that kind", "It deletes older traces from the Trace Store each time that you start the editor with it"]
        answer_index: 0
        explain: "Named events cost time to capture. Use them to find the bottleneck, then capture without them for representative numbers."
      - q: "While profiling, your game runs slightly slower than without the profiler. What is the right way to read that?"
        choices: ["The trace is invalid and must be thrown away; capture again with fewer channels until the frame time is the same", "The profiler uses the GPU only, so ignore CPU times and compare just the GPU track with the numbers from a run without it", "Profiling uses the same CPU, RAM and disk; if you meet your goal while profiling, you likely have some room left", "Turn off Trace Server to fix it, because the server is the only part of the profiler that uses resources of the machine"]
        answer_index: 2
        explain: "The profiler shares the machine's resources. The docs call this useful: hitting the target under profiling means you are above it without."
      - q: "The GPU finishes its work early every frame but the CPU is always late. How is the project described?"
        choices: ["GPU-bound", "Display-bound", "Memory-bound", "CPU-bound"]
        answer_index: 3
        explain: "The side with the tighter margin sets the limit. Here the CPU causes the bottleneck, so it is CPU-bound."
      - q: "You want to find in the trace the exact moment you pressed the button that spawns effects. What helps most?"
        choices: ["Add a Trace Bookmark or Trace Screenshot at that moment", "Turn on Auto Open Live Trace before you press the button", "Sort Timers by name and look for the spawn function in the list", "Restart the Trace Server right before you press the button"]
        answer_index: 0
        explain: "Bookmarks and screenshots appear as markers under the time ruler in Timing Insights."
      - q: "One frame shows an emitter costing 0.06 ms. Is that enough to decide what to optimize?"
        choices: ["Yes, one frame is always representative of the whole session for any looping effect", "No; select a longer, representative time range and compare averages before you decide", "No; only memory numbers matter for a Niagara emitter, not time", "Yes, if the frame was the first frame after the effect was spawned"]
        answer_index: 1
        explain: "The Niagara measuring guide looks at a larger window and averages, which were much lower than the single-frame numbers."
    flavors:
      _default: {why: "Guessing what is slow wastes days. A trace shows you where the milliseconds go."}
      tech_art: {why: "Tech artists are asked 'why is this scene slow?'. You answer with a trace, not a feeling.", do: "Keep your before and after .utrace files and name them with the date and change."}
      programming: {why: "Insights is the same tool you will use for code. Learn to read timers and callers early."}
      level_design: {why: "A heavy moment in your level shows up as a spike. You can find it yourself before QA does."}

  - id: TAQ22
    rank: 3
    difficulty: expert
    specializations: [tech_art]
    subjects: [scriptable-tools, blueprint, editor-tools, interactive-tools]
    required_spine: false
    required: true
    title: An interactive editor tool
    brief: "A Scriptable Tool is an editor tool that you build with Blueprints and that works directly in the level viewport, for example by reacting to mouse clicks on surfaces. It suits jobs where an artist needs to click in the scene and not press buttons in a window, and it needs no C++. In this quest you build a tool that places a prop with a random scale at each point you click."
    time_min: 120
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/scriptable-tools-system-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-a-scriptable-tool-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Enable the Scriptable Tools Editor Mode plugin. Also enable Geometry Script if you need its nodes. Then restart the editor."
      - "Create an Editor Utility Blueprint with the parent class EditorScriptableModularBehaviorTool and name it BP_Tool_PlaceProp. Set its Tool Name, Category and Tooltip."
      - "Create a Blueprint named BP_ToolProps_PlaceProp with the parent class ScriptableInteractiveToolPropertySet. This holds the settings of the tool. Give it the public variables Mesh, MinScale and MaxScale. Add it to the tool in On Script Setup with the node Add Property Set of Type."
      - "Add a Single Click Behavior to the tool. In the IfHitByClick function, do a line trace along the click ray and return the hit. When a click happens, spawn the chosen mesh at the hit point with a random scale."
      - "Show short instructions to the user with Display User Help Message. Save the property set when the tool shuts down, and restore it when the tool is set up."
      - "Open the Scriptable Tools mode in the editor and place 10 props with your tool."
    done_when: "Send a screenshot of the Scriptable Tools mode with your tool active, its settings panel visible, and the props you placed. Also send a screenshot of the IfHitByClick function."
    xp: 185
    verify_type: screenshot
    quiz:
      - q: "Your tool spawns temporary preview actors while it runs. Why is a Scriptable Tool safer than an Editor Utility Widget for this?"
        choices: ["Scriptable Tools cannot spawn actors, so nothing temporary can ever be left behind in the level after the tool has been closed", "A Scriptable Tool is modal: it shuts down before save, level change or PIE, so you can remove temporary actors before they are saved", "Editor Utility Widgets delete all actors of the level when they close, so the preview actors and your real work would both be lost", "Scriptable Tools run only at runtime, in a packaged game, where preview actors are never saved to a level file on disk"]
        answer_index: 1
        explain: "Interactive tools are modal and the editor state is strictly managed. Autosave waits until you exit the tool."
      - q: "Which plugin do you enable to use the Scriptable Tools mode and nodes?"
        choices: ["Scriptable Tools Framework only; the mode is built in", "Modeling Tools Editor Mode; the nodes are a part of it", "Editor Scripting Utilities; it adds the mode and its nodes", "Scriptable Tools Editor Mode; it includes the framework"]
        answer_index: 3
        explain: "You enable Scriptable Tools Editor Mode. You do not need to enable the framework module separately."
      - q: "Your tool must react to left click, right click and Ctrl + left click in different ways. Which base class fits best?"
        choices: ["EditorScriptableModularBehaviorTool", "EditorScriptableClickDragTool", "A plain Actor Blueprint with key events", "EditorUtilityWidget"]
        answer_index: 0
        explain: "The modular behavior tool lets you add many behaviors, even several click behaviors, in one tool. ClickDragTool is deprecated."
      - q: "You made the tool from a normal Blueprint Class, and now you cannot reach editor subsystems. Why?"
        choices: ["The plugin is off, and editor subsystems are only loaded when Scriptable Tools Editor Mode is enabled", "Editor subsystems need C++; no Blueprint class of any kind can reach them, whatever its parent class is", "Only an Editor Utility Blueprint gives access to editor-only functionality, even for an editor tool class", "You need to compile twice, because the first compile of a tool class only builds its property sets"]
        answer_index: 2
        explain: "The tutorial warns that a Blueprint Class cannot access editor subsystems and other editor-only features."
      - q: "How do you give your tool user-visible settings like Mesh and MaxScale?"
        choices: ["Add them as variables on a UMG widget, then add that widget to the tool with the Create Widget and Add to Viewport nodes", "Create a ScriptableInteractiveToolPropertySet subclass with public variables and add it with Add Property Set of Type", "Put them in Project Settings, in a new section that the tool adds for itself when it is first compiled", "Use a Data Table with one row per setting, and read the rows with Get Data Table Row when the tool starts"]
        answer_index: 1
        explain: "Public variables of the property set show in the standard settings panel. Add it, usually in On Script Setup, with a unique Identifier."
      - q: "You want an event when the user changes MaxScale, a float. Which approach do the docs suggest?"
        choices: ["The type-matching property watcher for a float, with the exact variable name", "The general Watch Property function, because it is the cheapest one for any type", "An Event Dispatcher on the property set, which you call by hand", "Nothing; tools cannot react to changes of their settings"]
        answer_index: 0
        explain: "Use the watcher that matches the variable type. The general Watch Property is more expensive and gives no New Value."
      - q: "You add a Custom startup condition that searches the whole level. Why is that risky?"
        choices: ["Custom conditions only run once, so the tool may miss later changes", "Custom conditions cannot read the selection, so the search is of no use", "It stops the tool from appearing in the palette until the search has finished", "The tool builder graph runs every tick, so heavy checks can slow the editor"]
        answer_index: 3
        explain: "OnCanBuildTool runs on tick. Keep custom conditions light."
      - q: "Artists complain that the tool forgets their settings every time they reopen it. What fixes this?"
        choices: ["Store the settings in a Save Game object and load it with Load Game from Slot on setup", "Call Save Property Set Settings on shutdown and Restore Property Set Settings on setup", "Set Visible in Editor to false on each property, so its value is kept", "Use Group Tags on the tool, which store the settings of each group"]
        answer_index: 1
        explain: "These functions store and restore property set values. An optional Save Key keeps separate values per tool."
      - q: "You draw guide lines with Event On Script Render. The lines flicker and you must redraw them all yourself. What is the better option?"
        choices: ["Use Print String to show the positions of the lines as text on the screen", "Spawn a new actor for each line on every tick and destroy the old ones at the end of the frame", "Use the Drawing API line sets, which the tool keeps and you can update over the tool's lifetime", "Move the drawing into On Script Shutdown, so it runs only one time"]
        answer_index: 2
        explain: "On Script Render is legacy: it redraws every tick with no persistence. Line, point and triangle sets are kept by the tool."
      - q: "You have a base tool Blueprint that only exists to be subclassed. How do you keep it out of the tool palette?"
        choices: ["Turn off Visible in Editor", "Delete its Category", "Set Shutdown Type to Complete", "Give it no Tool Name"]
        answer_index: 0
        explain: "Visible in Editor hides the class from the mode UI. It is meant for in-development tools and base classes."
    flavors:
      _default: {why: "Some jobs need clicks in the viewport, not buttons in a window. Scriptable Tools give artists that kind of tool without C++."}
      tech_art: {why: "Interactive tools save artists hours of repeated placing and fixing. You can build them in Blueprint.", do: "Add a gizmo or a line preview so the artist sees the result before they click."}
      level_design: {why: "A click-to-place tool made for your level's rules speeds up dressing a lot."}
      programming: {why: "This is the Interactive Tools Framework from Modeling Mode, exposed to Blueprint. Know its modal rules."}

  - id: TAQ23
