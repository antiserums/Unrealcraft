        explain: "A beam is a ribbon. The Ribbon Renderer is used together with beam-specific modules such as Beam Emitter Setup."
      - q: "What do you set in the Spawn Beam module?"
        choices: ["The beam color at its start point", "Nothing, it only needs to be present", "The number of beams that are spawned", "The material that the beam uses"]
