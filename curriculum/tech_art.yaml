    title: "Groom LODs: strands, cards and meshes"
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-level-of-detail-for-grooms-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-cards-and-meshes-for-grooms-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/groom-asset-editor-user-guide-in-unreal-engine"
    checklist:
      - "Use a groom asset (a MetaHuman hair or a free groom from Fab). Open it in the Groom Asset Editor. In Show turn on Vis. Clusters and then Hair CVs and look at the strands."
      - "In the LOD panel set LOD Mode to Manual. For the first hair group add LOD entries with the Add (+) button until you have three: LOD0 full strands, LOD1 with Curve Decimation and Vertex Decimation around 0.5 and a Screen Size around 0.5, LOD2 with stronger decimation, Screen Size around 0.2 and Simulation set to Disable."
      - "On LOD1 and LOD2 raise Thickness Scale a little so the hair does not look thin after decimation."
      - "Use the LODs dropdown in the viewport to step through LOD0, LOD1 and LOD2 and read the stats: geometry type, curves, points."
      - "Switch LOD Mode to Auto, then change Auto LOD Bias and zoom the camera out slowly. Note where the curve reduction becomes visible."
      - "If your groom has a card mesh, add an entry in the Cards panel with Guide Type Generated, Group Index 0 and LOD Index 2, then set LOD2 Geometry Type to Cards. If not, write one line on why cards or meshes would be the far LOD."
    done_when: "Screenshot of the LOD panel with three LOD entries (Manual mode) and a screenshot of the viewport at LOD2 showing the LOD stats, plus your one-line note if you had no cards."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What does LOD Mode Auto do for a groom?"
        choices: ["Generates cards automatically", "Turns off simulation at distance", "Copies the LOD settings from the project", "Adapts the number of strand curves based on screen size, with no manual LOD entries"]
        answer_index: 3
        explain: "Auto automatically adapts the number of curves based on the groom's screen size, so manual LOD entries are not needed. Default uses the project setting and Manual uses your entries."
      - q: "How many LOD entries can each hair group have?"
        choices: ["3", "5", "8", "Unlimited"]
        answer_index: 2
        explain: "For each colored hair group you can create up to 8 LOD entries."
      - q: "You set a far LOD to Meshes geometry (a hair helmet). Which feature is still supported on it?"
        choices: ["RBF only", "Skinning and simulation", "Simulation only", "Skinning only"]
        answer_index: 0
        explain: "Strands and Cards support skinning, RBF and simulation. Meshes only support RBF."
      - q: "After decimating strands the hair looks thin. Which property is meant to compensate for this?"
        choices: ["Angular Threshold", "Thickness Scale", "Auto LOD Bias", "Vertex Decimation"]
        answer_index: 1
        explain: "Thickness Scale scales the strand radius and is there only to manually compensate for the reduction of curves."
      - q: "In Auto mode the reduction of curves is too visible up close. What does the page suggest?"
        choices: ["Set Curve Decimation to 1", "Switch Geometry Type to Cards", "Increase Auto LOD Bias so reduction starts further away", "Enable RBF Interpolation"]
        answer_index: 2
        explain: "Auto LOD Bias increases the distance at which the groom starts to reduce the number of curves, which helps when the automatic reduction is too visible."
      - q: "What is the difference between Curve Decimation and Vertex Decimation?"
        choices: ["Curve removes points per strand; Vertex removes whole strands", "Curve removes whole strands uniformly; Vertex removes points on each strand", "They are the same setting for cards and strands", "Curve affects cards, Vertex affects meshes"]
        answer_index: 1
        explain: "Curve Decimation reduces the number of hair strands uniformly. Vertex Decimation reduces the number of points for each strand."
      - q: "A LOD entry has Binding Type set to Rigid. How does the groom attach to the skeletal mesh?"
        choices: ["It uses the attachment name provided on the groom component", "It is deformed by the skinned surface", "It uses RBF samples", "It does not attach"]
        answer_index: 0
        explain: "Rigid uses the attachment name on the groom component. Skinning deforms the groom by the skeletal mesh's skinned surface."
      - q: "In the Cards panel, what does Guide Type Generated do?"
        choices: ["Uses the groom's own guides by picking the closest guide per card vertex", "Imports guides from an Alembic file", "Disables card deformation", "Generates deformation guides through the middle of each card, assuming the card is made of triangle bands"]
        answer_index: 3
        explain: "Generated builds guides that run through the middle of each hair card geometry. Guide-Based instead skins the cards using the groom's guides, picking the closest guide for each card vertex."
    flavors:
      _default: {why: "Hair is one of the most expensive things on screen. LODs are what make it shippable."}
      tech_art: {why: "Groom LODs are your budget tool: curves, points and geometry type per distance.", do: "Note the curve and point counts at each LOD and compute how much LOD2 saves compared with LOD0."}

  - id: TAQ102
    rank: 2
