      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-use-a-solid-mesh-to-create-a-balloon-effect-in-niagara-for-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/render-module-reference-for-niagara-effects-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a Niagara System named FXS_TA_MeshSpawn from the Fountain template. Remove the modules Add Velocity in Cone and Shape Location."
      - "In Particle Spawn, add a Static Mesh Location module. Set its Static Mesh data interface to a simple mesh. The Sphere from the engine's basic shapes is fine, and you see it in the asset picker when Show Engine Content is turned on. Confirm that particles appear on the surface of the mesh."
      - "Add a second emitter. In its Particle Spawn group, add a Skeletal Mesh Location module and point the data interface at a skeletal mesh. The mannequin of the template works (its name starts with SKM_). Try both bone/socket sampling and surface sampling."
      - "In the second emitter, replace the Sprite Renderer with a Mesh Renderer, which draws each particle as a 3D mesh. Set Particle Mesh to a small mesh. Enable Override Materials and add a material that has the Niagara Mesh Particles flag checked."
      - "In Initialize Particle, set the Sprite attributes to Unset, because a Mesh Renderer does not use them. Set Mesh Scale Mode to Random Uniform with a small range."
      - "On the Mesh Renderer, set Facing Mode to Velocity and compare the result with Default."
      - "Place the system in the level next to the source mesh, and check that the particles follow its surface."
    done_when: "Send a screenshot of both emitters in the stack with Static Mesh Location and Skeletal Mesh Location visible, and of the viewport that shows particles sitting on each mesh, with the Mesh Renderer details open."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "What does the Skeletal Mesh Location module do?"
        choices: ["Renders the skeletal mesh itself as one particle, with all of its materials", "Places particles on a bone, socket, triangle or vertex of a Skeletal Mesh", "Kills particles inside the mesh, so that none are drawn under the surface of the skin", "Copies the mesh materials to the particles, so that each sprite looks like the surface"]
        answer_index: 1
        explain: "Skeletal Mesh Location can spawn particles on bones, sockets, triangles or vertices of a skeletal mesh."
      - q: "Which module spawns particles from the surface of a static mesh?"
        choices: ["Static Mesh Velocity", "Sample Static Mesh", "Static Mesh Location", "System Location"]
        answer_index: 2
        explain: "Static Mesh Location spawns particles from the surface of a static mesh. Sample Static Mesh only writes sampled values to parameters."
      - q: "What is a Data Interface parameter type in Niagara?"
        choices: ["A fixed set of named values, from which you pick one entry in a dropdown", "A numeric type of varying precision, such as a float or a half float", "A combined struct of primitive values, like a position and a color, that modules pass around", "A parameter that defines functions providing data from external sources, like meshes or audio"]
        answer_index: 3
        explain: "Data Interfaces provide functions to read data from outside the simulation, such as mesh data, audio or external files."
      - q: "The Mesh Renderer shows the mesh's own material even though you assigned an override. Why might that be?"
        choices: ["The override material is missing the Niagara Mesh Particles flag or an array entry is None", "Mesh Renderers cannot use override materials at all; they always draw the material of the mesh", "Facing Mode is set to Velocity, which makes the renderer read the material of the mesh and not the override", "Sort Mode is None, and override materials are only applied when the particles are sorted by their distance"]
        answer_index: 0
        explain: "All override materials must have the Niagara Mesh Particles flag. If an entry is None or too few exist, the mesh's own material is used."
      - q: "Which Facing Mode makes the mesh's local X axis follow the particle velocity?"
