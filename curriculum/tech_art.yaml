    title: "Modeling Mode: fix a mesh in-engine"
    brief: "Modeling Mode is a set of tools inside the Unreal editor for creating and changing meshes. With it you can make small fixes, such as adding a shape or lowering the triangle count, and you do not have to go back to a separate modeling program. In this quest you create a box mesh, edit its faces, simplify a prop, and inspect the results."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/modeling-mode-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/modeling-tools-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/polygroup-edit-tool-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/modeling-mode-quick-start-in-unreal-engine"
    community_urls:
      - {title: "50 Tips and Tricks in Modeling Mode, Unreal Fest 2024 (Unreal Engine channel)", url: "https://www.youtube.com/watch?v=xIMudHNX9JM"}
    checklist:
      - "Open a project made from the Third Person template, or create one. Switch to Modeling Mode with Shift+5. If the mode is missing, enable the Modeling Tools Editor Mode plugin first. Find the four panels: Tool Category, Tool Palette, Tool Properties and Quick Settings."
      - "Choose Create, then Box. Set Output Type to Static Mesh and click in the level to place the box. Name the asset SM_ModelTest."
      - "Choose Model, then PolyGroup Edit. Select one face and Extrude it, which pushes the face outward. Then Bevel one edge, which cuts the sharp edge into a small slope. Click Accept. Press Ctrl+Z once and see what is undone."
      - "Place a prop with some detail in the level and select it, for example SM_ChamferCube from the folder LevelPrototyping/Meshes. Choose XForm, then Duplicate, and click Accept. This makes a new mesh asset that is a copy, so the original prop stays as it is. With the copy selected, choose Mesh, then Simplify, reduce it to about half the triangles, and click Accept."
      - "In the viewport, turn on Show > Advanced > Mesh Edges. Use Attribs > Inspect on the simplified copy and look at the result. Then use Attribs > Inspect Collision."
      - "Open Quick Settings and turn off Combined Gizmo. Note how the gizmo changes."
    done_when: "Send a screenshot of SM_ModelTest after PolyGroup Edit with the extrude and the bevel visible. Also send a screenshot of the simplified prop with Mesh Edges on and the triangle count visible."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the hotkey to switch to Modeling Mode?"
        choices: ["Shift+3", "Shift+5", "Ctrl+M", "F5"]
        answer_index: 1
        explain: "Shift+5 switches to Modeling Mode directly. Shift+3 is Foliage Mode."
      - q: "You are inside a Modeling Mode tool and switch to another editor mode without clicking Accept. What happens to your edits?"
        choices: ["They are saved automatically to the mesh asset on disk", "They are kept as a preview until you return to the tool", "They are discarded and the mesh goes back to how it was", "The editor asks you to save"]
        answer_index: 2
        explain: "Most tools only preview changes. If you exit Modeling Mode or press Cancel, the changes are discarded. Accept applies them."
      - q: "After you press Accept in the Vertex Sculpt tool, what does Undo do?"
        choices: ["It undoes one brush stroke, the last one that you made in the tool before Accept", "It undoes the combined result of all strokes made in that tool session", "Nothing; the changes cannot be undone once they have been accepted in a tool", "It reopens the tool"]
        answer_index: 1
        explain: "Inside the tool you can undo each stroke. After Accept, the undo history only tracks the mesh before and after the tool."
      - q: "Which Output Type saves the mesh as an asset in the Content Browser?"
        choices: ["Dynamic Mesh", "Volume", "Static Mesh", "Instance"]
        answer_index: 2
        explain: "Static Mesh is saved in the Content Browser and an instance is placed in the level. Dynamic Mesh and Volume are saved in the level only."
      - q: "PolyGroup Edit is grayed out for a mesh you imported. What is the most likely reason?"
        choices: ["The mesh has no PolyGroup information", "The mesh is too big", "The mesh has more than one material", "PolyGroup Edit only works on boxes"]
        answer_index: 0
        explain: "PolyGroup Edit is not available for meshes with no PolyGroup information. Generate PolyGroups, Paint PolyGroups or Tri Select can create them."
      - q: "Which Mesh category tool removes hidden triangles from a mesh?"
        choices: ["Weld", "Fill Holes", "Remesh", "Jacket"]
