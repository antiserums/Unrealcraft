      - "In Emitter Update set Life Cycle Mode to System and Spawn Rate to 500."
      - "In Initialize Particle set a random lifetime (1.75 to 2.5), the color to R 0.1, G 0.3, B 50, and a random uniform sprite size (2.5 to 8). Set the Sphere Location radius to 15."
      - "In Add Velocity in Cone set Velocity Strength to a random range of 300 to 600."
      - "Keep Gravity Force and Drag at their defaults. Add a Collision module and click Fix Issue when the error appears."
      - "In Render add a Light Renderer. Set Radius Scale to 5 and Color Add to X 0, Y 0, Z 15."
