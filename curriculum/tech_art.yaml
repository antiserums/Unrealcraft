  - id: TAQ59
    rank: 1
    difficulty: apprentice
    specializations: [tech_art]
    subjects: [niagara, vfx, gpu]
    required_spine: false
    required: false
    title: "GPU sprites, thousands of them"
    brief: "Normally the CPU, the main processor of the computer, calculates how particles move. When an effect needs many thousands of particles, this becomes too slow, so you move the work to the GPU, the graphics card. A GPU emitter has one extra rule: you must give it fixed bounds, a box that tells the engine how large the effect is. In this quest you build a swirling ball of thousands of small sprites that runs on the GPU."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-create-a-gpu-sprite-effect-in-niagara-for-unreal-engine"
    backup_url: null
    extra_urls: []
    checklist:
      - "Open any project, or create one from the Third Person template. Create a Niagara System from the Simple Sprite Burst template. Name it GPUSprite, rename the emitter to FX_GPUSprite and drag the system into a level."
      - "Open Emitter Settings, then Emitter Properties, and set Sim Target to GPUComputeSim so the particles are calculated on the graphics card. Tick Fixed Bounds to clear the warning that appears."
      - "In Emitter Update, set Life Cycle Mode to System. Set the Spawn Burst Instantaneous count to 2500, and add a Spawn Rate module set to 500."
      - "In Initialize Particle, set Lifetime to 5 and Sprite Size to 5 by 5. Then add a Sphere Location module, which spawns the particles inside a sphere shape."
      - "In Particle Update, add a Scale Sprite Size module and set it to Non-Uniform. For Scale Factor choose Vector2D from Float, then choose Float from Curve and pick the Ramp Up Down shape, so each particle grows and then shrinks."
      - "Add a Curl Noise Force module (Noise Strength 72, Noise Frequency 0.02), which makes the particles swirl. Add a Point Attraction Force module (Attraction Strength 5.5, Attraction Radius 300, Falloff Exponent 0.6, Kill Radius 4 enabled), which pulls the particles toward one point."
      - "Add a Color module and set it to Color from Curve. Build a gradient with at least four color stops, and make the alpha (the opacity) fade to 0 at the end."
    done_when: "Send a screenshot of Emitter Properties that shows Sim Target set to GPUComputeSim and Fixed Bounds ticked, plus a screenshot of the swirling particle ball in the level."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Where do you switch an emitter from CPU to GPU simulation?"
        choices: ["Render group > Sprite Renderer > Sim Target", "Emitter Settings > Emitter Properties > Sim Target", "Project Settings > Plugins > Niagara > Default Sim Target", "Particle Update > Solve Forces and Velocity > Target"]
        answer_index: 1
        explain: "Sim Target in Emitter Properties is set to GPUComputeSim to run the simulation on the GPU."
      - q: "Why must you set Fixed Bounds for a GPU emitter?"
        choices: ["The GPU has no memory for bounds, so they must be stored in the system asset itself", "Fixed Bounds enables the Spawn Rate module, which is turned off for GPU emitters until bounds are set", "Fixed Bounds sets the particle color for particles that leave the box, so that you can find them easily", "The system cannot read how big the effect is when the simulation runs on the GPU"]
        answer_index: 3
        explain: "With GPU simulation the system cannot read back the size of the effect, so you give it fixed bounds on the emitter or the system."
      - q: "What is the difference between Spawn Burst Instantaneous and Spawn Rate in this effect?"
        choices: ["Burst only works on GPU emitters and Rate only works on CPU emitters, so the effect needs both", "Burst makes 2500 particles at once at time 0, Rate makes a continuous 500 per second after that", "They do the same thing; the tutorial only uses both to show two modules", "Rate is used only for ribbons, and Burst is used only for sprite particles"]
        answer_index: 1
        explain: "The burst gives a big group of particles at start. Spawn Rate then keeps a stream of 500 per second while the emitter is active."
      - q: "In Curl Noise Force, what happens when you lower Noise Frequency?"
        choices: ["The sphere of particles gets more warped", "The particles turn red in the sphere", "Fewer particles spawn in the sphere", "The particles stop moving in the sphere"]
        answer_index: 0
        explain: "The tutorial says the smaller the Noise Frequency, the more the sphere of particle locations becomes warped."
      - q: "What does Kill Radius do in Point Attraction Force?"
        choices: ["It sets where particles are removed at the end of their life", "It sets the spawn sphere size for the new particles", "It sets the color curve length for each particle", "It sets how many particles the GPU can hold at any one time"]
        answer_index: 0
        explain: "Kill Radius is the area where particles dissolve at the end of their life cycle. The tutorial sets it to 4."
      - q: "When is a GPU sprite emitter the right choice?"
        choices: ["Always, because it is faster than a CPU emitter in every possible case", "Only for ribbon effects, which do not run on the CPU", "When you need tens of thousands of particles and the CPU would struggle", "Only when the effect uses collision with the level meshes"]
        answer_index: 2
        explain: "The guide is for effects that need tens of thousands of particles, where CPU simulation can cause performance problems."
    flavors:
      _default: {why: "Big particle counts need the GPU, and GPU emitters have rules."}
      tech_art: {why: "Knowing when to move an emitter to GPUComputeSim and why bounds matter is a core optimization skill.", do: "Set Spawn Count to 25000 and compare stat fps between the GPU emitter and a CPU copy."}

  - id: TAQ60
