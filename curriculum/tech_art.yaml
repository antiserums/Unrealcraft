      - q: "Your module runs in the Particle group. Which namespace can it write to?"
        choices: ["System only", "Emitter only", "Particle only", "User only"]
        answer_index: 2
        explain: "Each group writes only to its own namespace. Particle group modules can read System, Emitter, Particle, Engine and User, but write only Particle."
      - q: "A module in the System group tries to read an Emitter parameter. What happens according to the namespace rules?"
        choices: ["It works, because all of the groups can read all namespaces at any time", "It is not allowed: the System group reads only System, Engine and User", "It works only on GPU emitters, which share their parameters with the system", "It works after you enable versioning for the module"]
