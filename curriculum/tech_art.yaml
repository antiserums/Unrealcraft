    title: Pivots, units and scale
    brief: "The pivot is the point of a mesh that it moves, rotates and scales around. Unreal measures distance in centimeters, and Z is the up direction. These basics decide if a prop snaps to the grid, turns around the right point and collides correctly. In this quest you practice with the transform tools, move the pivot of a mesh to its bottom, and bake a scale into a mesh."
