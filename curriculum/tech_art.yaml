      - q: "The tutorial sets the particle Blue value to 50. What does a color value above 1 do?"
        choices: ["It makes the color emissive, so the particles glow", "It is clamped back to 1", "It turns the particle into a mesh", "It makes the particle transparent"]
        answer_index: 0
        explain: "The color picker normally works from 0 to 1. A value above 1 becomes emissive color, so the particles glow."
