    title: Particles born on a mesh
    brief: "Some effects must start on the surface of an object, such as sparks on a prop or magic that covers a character. For this, Niagara needs to read the shape of a mesh. It does that through a data interface, which is a way for Niagara to read data from outside the particle simulation. In this quest you spawn particles on a static mesh and on a skeletal mesh (a mesh with bones), and you draw the particles as small 3D meshes in place of sprites."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/particle-spawn-group-reference-for-niagara-effects-in-unreal-engine"
