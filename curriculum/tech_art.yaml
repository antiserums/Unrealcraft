    title: "Twist a character with a Deformer Graph kernel"
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-create-a-custom-deformer-graph-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/deformer-graph-in-unreal-engine"
    checklist:
      - "Enable the Deformer Graph plugin (Edit > Plugins, Animation section) and restart. Use the mannequin from the Third Person template."
      - "Select the character in the level. In Details enable Mesh Deformer and create a new Deformer Graph asset named DG_Twist. Open it and set its Mesh property to the mannequin."
      - "In the Update Graph add a Skeletal Mesh Component Binding. Connect Write Skinned Mesh, Execute Skinned Mesh (Domain Vertex), Scene Data (for Time) and Skinned Mesh (Position, Tangent X, Tangent Y) to it."
      - "Add a Custom Compute Kernel. In its Details add inputs Num Threads (Int Vector 3, Parameter), Twist, Start, End, Time (Float, Parameter), Position (Vector 3, Vertex x1), Tangent X and Tangent Y (Vector 4, Vertex x1). Add outputs Out Position (Vector 3) and OutTangentX, OutTangentZ (Vector 4), all Vertex x1. Set Execution Domain to Vertex. Save and Compile."
      - "Check the Declarations tab lists ReadPosition, ReadTwist and WriteOutPosition. Then paste the HLSL twist program from the page into the Shader Text tab."
      - "Wire the read nodes into the kernel inputs and the kernel outputs into Write Skinned Mesh. Add three Float Constants: Twist 180, Start 0, End 100. Save and Compile, and watch the character twist in the viewport and the level."
      - "Replace the Twist constant with a Deformer Graph Variable named TwistAmount so it can be changed from outside. Set it to 45 and compare."
    done_when: "Screenshot of the full DG_Twist Update Graph with the Custom Compute Kernel wired, and a screenshot of the mannequin visibly twisted in the level or preview viewport."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Which subgraph does a new Deformer Graph contain by default, and how often does it run?"
        choices: ["A Setup Graph, once per level load", "An Update Graph, once per frame", "A Trigger Graph, on demand", "A Construction Graph, once at compile"]
        answer_index: 1
        explain: "By default a Deformer Graph only contains an Update Graph which runs once per frame. A Setup Graph runs when the owning object initializes, and Trigger Graphs run on request from Blueprint or C++."
      - q: "How many Setup Graphs and Trigger Graphs can you add?"
        choices: ["One Setup Graph, any number of Trigger Graphs", "Any number of both", "Any number of Setup Graphs, one Trigger Graph", "One of each"]
        answer_index: 0
        explain: "You can add only one Setup Graph and no extra Update Graphs, but as many Trigger Graphs as your project needs."
      - q: "In which language do you write the Custom Compute Kernel?"
        choices: ["Blueprint only", "Python", "C# compute scripts", "HLSL, in the Shader Text Editor"]
        answer_index: 3
        explain: "The Shader Text Editor operates in HLSL. Each Custom Compute Kernel gets its own tab with read-only Declarations and an editable Shader Text section."
      - q: "What must you do on a Custom Compute Kernel before writing HLSL or connecting it?"
        choices: ["Set its material domain", "Compile the graph once", "Create the input and output pins in the Details panel", "Assign a Skeleton"]
        answer_index: 2
        explain: "Before writing the HLSL or connecting the node you must create the input and output pins. The Declarations tab then shows them as HLSL functions like ReadPosition and WriteOutPosition."
      - q: "Where does the kernel's Num Threads input come from in the twist example?"
        choices: ["The Execute Skinned Mesh node's Num Threads output", "A Float Constant of 3", "The Scene Data node", "The Skeleton node's Num Bones"]
        answer_index: 0
        explain: "Execute Skinned Mesh sets the domain (Vertex) and its Num Threads output feeds the kernel. The kernel's Execution Domain is also set to Vertex."
      - q: "You want linear blend skinning, morph targets and cloth in one deformer with no extra cost over the simpler graphs. Which default asset do you pick?"
        choices: ["DG_LinearBlendSkin", "DG_LinearBlendSkin_Morph", "DG_TwistExample", "DG_LinearBlendSkin_Morph_Cloth"]
        answer_index: 3
        explain: "DG_LinearBlendSkin_Morph_Cloth is a superset of the other two and can replace them without any performance penalty. The simpler graphs exist as reference."
      - q: "The Engine folder and the default DG_ assets do not appear when you pick a Deformer Graph. What is the usual fix?"
        choices: ["Reinstall the plugin", "Enable Plugin Content in the Content Browser view settings", "Convert the mesh to Nanite", "Restart the GPU driver"]
        answer_index: 1
        explain: "The page says to ensure Plugin Content is enabled in the Content Browser View Settings if the Engine folder or default Deformer Graphs are not visible."
      - q: "A resource pin refuses to connect to a kernel input. What does the page tell you to check?"
        choices: ["That both are in the Setup Graph", "That the resource is marked public", "That the Data Domain dimension and values-per-entry match on both sides", "That the mesh has Nanite disabled"]
        answer_index: 2
        explain: "Data points must match in dimension and in the number of data values per entry. Kernel input and output bindings must match the exact data type they connect to."
    flavors:
      _default: {why: "Deformer Graphs run on the GPU after skinning. They are how you add custom deformation without changing the animation."}
      tech_art: {why: "This is shader-level control over skinned vertices: muscle bulge, wobble, wind, all without a DCC.", do: "Drive Twist from an animation curve instead of a constant, so an animator can key the twist per clip."}

