      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/groom-asset-editor-user-guide-in-unreal-engine"
    checklist:
      - "Place a character with a groom bound to its skeletal mesh in a level. In the viewport View Modes choose Groom > Guides and then Groom > Strands Guides Influences. Take a screenshot of the clumps."
      - "Open the groom in the Groom Asset Editor. In the Interpolation panel read the Interpolation Quality and Interpolation Distance settings. Enable Randomize Guide and note how long the rebuild takes."
      - "Enable RBF Interpolation in the Interpolation panel. In the level use Lit > Groom > Root Bindings to see the RBF samples. Play a strong animation (a big head turn or a crouch) with RBF on and off and compare."
      - "In the LOD panel set RBF Interpolation to Disable on the last LOD only."
      - "Create M_Hair_TA: set the Shading Model to Hair and check that Use with Hair Strands is enabled in Usage. Add a Hair Attributes node. Lerp a root color to a tip color with the U output, and use Seed to vary the color per strand a little."
      - "Add a slot in the Materials panel of the groom asset and assign M_Hair_TA. Then override that slot on the Groom component in the level with a second instance and confirm the override works."
    done_when: "Screenshot of the Strands Guides Influences view, a screenshot of the M_Hair_TA graph with the Hair Attributes node wired, and a screenshot of the groom in the level with your material."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Global (RBF) interpolation only works under which condition?"
        choices: ["When the groom is bound to a skeletal mesh and skinning is used for deformation", "When the groom uses Cards geometry", "When simulation is enabled", "When Use Unique Guide is on"]
        answer_index: 0
        explain: "RBF uses samples on the skinned mesh to correct the groom shape, so it only works when the groom is bound to a skeletal mesh and skinning is used."
      - q: "For a short hair groom, which Interpolation Quality does the page recommend?"
        choices: ["High, because short hair needs precision", "Low, because it is fast and the quality loss is small", "Medium always", "It does not matter for short hair"]
        answer_index: 1
        explain: "For short hair Low is recommended (nearest neighbor, minutes to build). High uses curve shape matching and is better for medium and long hair, but is slow to build."
      - q: "What does the Use Unique Guide setting do?"
        choices: ["Makes each strand its own guide", "Imports guides from the Alembic file", "Uses a single guide for motion interpolation to reduce the cost of hair interpolation", "Locks the guides so simulation cannot move them"]
        answer_index: 2
        explain: "Use Unique Guide uses a single guide for motion interpolation. The page lists it as a way to reduce the cost of hair interpolation for look or performance reasons."
      - q: "The hair shows visible clumps that follow the guides. Which setting is meant to break this up?"
        choices: ["Vertex Decimation", "RBF Type Rigid Transform", "Hair to Guide Density set to 0", "Randomize Guide"]
        answer_index: 3
        explain: "When Randomize Guide is enabled, the guides used for interpolation are slightly randomized to break up clumps."
      - q: "How do you see the RBF samples on a groom placed in a level?"
        choices: ["Show > Guide in the Groom Asset Editor", "Lit > Groom > Root Bindings in the level viewport", "stat groom", "Enable Debug Simulation on the component"]
        answer_index: 1
        explain: "The page says to select Lit > Groom > Root Bindings and hover over the deformed RBF check box in the viewport."
      - q: "A material does not show up on the groom. What are the two requirements from the Groom Materials page?"
        choices: ["Two-sided and Masked blend mode", "Translucent blend mode and a Depth texture", "Hair shading model and the Use with Hair Strands usage flag", "Substrate enabled and Nanite off"]
        answer_index: 2
        explain: "The material must use the Hair shading model and the Use with Hair Strands flag must be enabled. The flag is set automatically the first time you apply the material to a groom."
      - q: "In the Hair Attributes node, what does U mean?"
        choices: ["The UV of the scalp mesh", "The strand thickness", "The hair group index", "Position along the strand, 0 at the root and 1 at the tip"]
        answer_index: 3
        explain: "The U coordinate is always along the hair, with 0 at the root and 1 at the tip. Root UV is the UV of the underlying mesh at the root."
      - q: "Which Hair Attributes outputs are used only for cards and mesh geometry?"
        choices: ["Depth, Coverage, AuxiliaryData and AtlasUVs", "U, V and Length", "Seed and Tangent", "BaseColor and Roughness"]
        answer_index: 0
        explain: "Depth, Coverage, AuxiliaryData and AtlasUVs are listed as only used for cards and mesh geometry. Seed, U/V, Length and Tangent apply to strands."
    flavors:
      _default: {why: "How hair follows the head, and how its material reads strand data, decides if hair looks real or floats."}
      tech_art: {why: "Binding settings are a quality-versus-build-time trade you will be asked about. The Hair Attributes node is your only way into strand data.", do: "Expose the root and tip colors as parameters and make two instances (blonde, black) that share M_Hair_TA."}

