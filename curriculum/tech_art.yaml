        choices: ["Content Browser > Add > Merge", "Actor > Merge Actors in the top menu bar", "Right-click the mesh asset > Merge", "Window > Merge Tool"]
        answer_index: 1
        explain: "With the actors selected, go to Actor > Merge Actors and pick Merge, Simplify, Batch or Approximate. Merge Actor Settings is in the same menu."
      - q: "With the Merge method and Merge Materials turned OFF, how many draw calls does the result have?"
        choices: ["One", "One per source actor", "One per material", "One per triangle"]
