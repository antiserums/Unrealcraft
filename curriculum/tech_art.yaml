      - "Add two variables and mark both Instance Editable: BoneName (Name) and CurveName (Name, default BoneHeight)."
      - "Implement the OnApply event. Use the Animation Blueprint Library: add a Curve track with CurveName, then loop over the frames of the sequence. For each frame call Get Bone Pose for Frame with BoneName, read the Z of the location, convert the frame with Get Time at Frame and add a float curve key at that time."
      - "Implement the OnRevert event so it removes the curve track again."
      - "Open a walk or jump Animation Sequence, go to Window > Animation Data Modifiers, click Add Modifier and pick AM_BoneHeightCurve. Set BoneName to a bone whose parent is the root (for example pelvis), because Get Bone Pose returns local space."
      - "Right-click the modifier and choose Apply Modifier. Check that the BoneHeight curve now appears in the sequence. Then Revert, and confirm the curve is gone."
      - "Add the same modifier to the Skeleton asset and apply it there. Open a second sequence and confirm the curve was added to it too."
    done_when: "One screenshot of the AM_BoneHeightCurve OnApply graph and one of an Animation Sequence showing the BoneHeight curve with the Animation Data Modifiers tab open (modifier applied, not Out of Date)."
