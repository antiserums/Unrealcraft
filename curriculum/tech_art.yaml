    verify_type: screenshot
    quiz:
      - q: "You add your Anim Modifier to the Skeleton asset instead of one Animation Sequence. What is the effect?"
        choices: ["Nothing, modifiers only work on sequences", "It only runs on the preview animation", "It is applied to every Animation Sequence based on that Skeleton", "It is applied to the Skeleton's retarget pose"]
        answer_index: 2
        explain: "Applying a modifier to a Skeleton applies it to all Animation Sequences based on that Skeleton. On a sequence it affects only that sequence."
      - q: "Which two events should you implement in an Anim Modifier before using library functions?"
        choices: ["OnApply and OnRevert", "BeginPlay and EndPlay", "Construction Script and Tick", "OnImport and OnExport"]
        answer_index: 0
        explain: "OnApply lets you change, add or remove animation data. OnRevert removes your changes and returns the sequence to its original state. Both give you the Animation Sequence to work on."
      - q: "Where do you add and apply an Anim Modifier to an animation?"
        choices: ["Content Browser right-click > Apply Modifier", "Project Settings > Animation > Modifiers", "The Details panel of the Animation Blueprint", "Window > Animation Data Modifiers tab, Add Modifier, then right-click > Apply Modifier"]
        answer_index: 3
        explain: "In the Skeleton Editor or Animation Editor open Window > Animation Data Modifiers. Add the modifier there, then right-click it and choose Apply Modifier (or Revert Modifier)."
      - q: "After adding a modifier, it shows a status of Out of Date. What does that mean?"
        choices: ["The Blueprint failed to compile", "It has not been applied yet", "The engine version does not support it", "The animation was re-imported"]
        answer_index: 1
        explain: "The page says your Anim Modifier is listed as Out of Date until you apply it."
      - q: "Get Bone Pose for Frame gives you a transform. In which space is it?"
        choices: ["Local space (relative to the parent bone)", "World space", "Component space", "Mesh space of the reference pose"]
        answer_index: 0
