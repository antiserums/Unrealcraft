    checklist:
      - "Open Edit > Editor Preferences. In the Auto Save section check that Enable AutoSave is on and set Frequency in Minutes and Warning in Seconds to values you like."
      - "In Level Editor > Viewports > Controls, pick the Flight Camera Control type you prefer (for example Use WASD Only When Right Mouse Button is Held) and try it in the viewport."
      - "Turn on Highlight Objects Under Mouse Cursor and hover over a few actors."
      - "In the Content Browser section turn on Auto Reimport Textures. Edit a texture source file outside Unreal and confirm it re-imports."
      - "Open the Keyboard Shortcuts section. Bind a new shortcut to a command you use often. If a warning says the keys are taken, decide between Override and cancel."
      - "Click Export at the top of the Keyboard Shortcuts editor and save your keybinds as an .ini file."
    done_when: "Screenshot of the Keyboard Shortcuts section showing your new binding, and a screenshot of the Auto Save section with your values. Name the exported .ini file in your message."
    xp: 50
    verify_type: screenshot
    quiz:
      - q: "Where do you change keyboard shortcuts in Unreal Editor?"
        choices: ["Edit > Editor Preferences > Keyboard Shortcuts", "Edit > Project Settings > Input", "Window > Shortcuts", "Tools > Keybinds"]
        answer_index: 0
        explain: "Keyboard shortcuts live in the Editor Preferences window, in the Keyboard Shortcuts section."
      - q: "How many keyboard shortcuts can one command have?"
        choices: ["One", "Up to two", "Up to four", "No limit"]
        answer_index: 1
        explain: "Each command can have up to two keyboard shortcuts."
      - q: "You press a key combination that is already used by another command. What does the Override button do?"
        choices: ["It cancels your new shortcut", "It binds both commands to the same keys", "It removes the old binding and gives the shortcut to the new command", "It resets all shortcuts"]
        answer_index: 2
        explain: "A warning appears for a conflict. Override removes the existing binding and assigns the shortcut to the new command. Clicking outside cancels."
      - q: "How do you move your custom keybinds to another computer or a fresh install?"
        choices: ["Copy the project folder", "Export them as an .ini file and Import it in the other installation", "They sync through your Epic account", "Take a screenshot of the list"]
        answer_index: 1
        explain: "The Export and Import buttons at the top of the Keyboard Shortcuts editor save and load an .ini file."
      - q: "What does Auto Reimport Textures do?"
        choices: ["It compresses all textures on save", "It imports every texture in the Content folder", "It resizes textures to a power of two", "It watches texture source files and re-imports a texture when its source file changes"]
        answer_index: 3
        explain: "With this option on, source files are monitored and textures are automatically re-imported when the file is modified."
