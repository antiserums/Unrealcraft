    required_spine: false
    required: false
    title: Turn on Nanite for a mesh
    brief: "Nanite is a system in Unreal Engine 5 that can draw meshes with a very high number of triangles. It adjusts the detail by itself, so you do not have to make LODs by hand for those meshes. It only works with some kinds of meshes and materials, so you turn it on for each mesh. In this quest you enable Nanite on a dense mesh and use a view mode to check which meshes use it."
    time_min: 35
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/nanite-virtualized-geometry-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/nanite-technical-details"
    community_urls:
      - {title: "How To Enable And Use Nanite In Unreal Engine 5 (Matt Aspland)", url: "https://www.youtube.com/watch?v=I_rHKEjajSc"}
    checklist:
      - "Open any project, or create one from the Third Person template. Make a dense mesh that stands in for a rock: in Modeling Mode, create a Sphere with a high subdivision level as a Static Mesh and name it SM_Rock. Duplicate it and name the copy SM_Rock_Nanite. Open the copy, and in the Details panel under Nanite Settings, check Enable Nanite Support. Then click Apply."
      - "Place 30 copies of SM_Rock_Nanite and 30 copies of the original SM_Rock in a level."
      - "In the viewport, open View Modes, then Nanite Visualization, and choose Mask. Note which rocks are green and which are red."
      - "Try the Triangles visualization and the Clusters visualization. Take a screenshot of one of them."
      - "Select three other meshes in the Content Browser. Right-click them and use Nanite > Enable to turn on Nanite for all of them at once."
      - "Open the Output Log and search for 'Nanite'. Write one line about any warning you see, or note that there is none."
    done_when: "Send a screenshot of the Nanite Visualization > Mask view with both green and red rocks visible. Also send a screenshot of the Nanite Settings section with Enable Nanite Support checked."
    xp: 50
    verify_type: screenshot
    quiz:
      - q: "Which of these is NOT a way to enable Nanite on a mesh?"
        choices: ["Check Build Nanite when importing", "Check Enable Nanite Support in the Static Mesh Editor", "Right-click meshes in the Content Browser and choose Nanite > Enable", "Set the mesh LOD Group to Nanite"]
        answer_index: 3
        explain: "The page lists three ways: on import, per mesh in its editor, and batched in the Content Browser. There is no Nanite LOD Group."
      - q: "Which material blend modes does Nanite support?"
        choices: ["Opaque and Masked", "Translucent and Additive", "All blend modes", "Only Opaque"]
        answer_index: 0
        explain: "Nanite supports Opaque and Masked. An unsupported material is replaced by a default material and a warning appears in the Output Log."
      - q: "In the Nanite Visualization 'Mask' view mode, what do green and red mean?"
        choices: ["Green is cheap geometry, red is expensive geometry", "Green is Nanite geometry, red is non-Nanite geometry", "Green is opaque geometry, red is masked geometry", "Green is visible geometry, red is culled geometry"]
        answer_index: 1
        explain: "Mask marks Nanite geometry green and non-Nanite geometry red. It is the fastest way to check that Nanite is on."
      - q: "Which of these meshes is the weakest candidate for Nanite, according to the page?"
        choices: ["A rock with many tiny triangles", "A wall with hundreds of instances", "A sky sphere", "A large building that hides other geometry"]
        answer_index: 2
        explain: "A sky sphere has big triangles on screen, does not occlude anything and there is only one. The page names it as the example exception."
      - q: "Which of these is NOT supported with Nanite meshes?"
        choices: ["Multiple UV channels", "Vertex colors", "Morph target deformation", "Non-uniform scaling of the mesh"]
        answer_index: 2
        explain: "Nanite supports multiple UVs, vertex colors and dynamic translation, rotation and non-uniform scale. Deformation with Morph Targets is not supported."
      - q: "What does the console variable r.Nanite 0 do?"
        choices: ["It deletes the Nanite data from all meshes in the project, which is useful to make the project smaller", "It turns Nanite rendering off globally at runtime, which is useful to emulate platforms without Nanite", "It sets Nanite quality to the lowest level, which is useful to test how the meshes look on a slow machine", "It turns off Nanite visualization only, which is useful when the view modes get in the way of your work"]
        answer_index: 1
        explain: "r.Nanite 0 disables Nanite rendering globally. The page recommends it as a way to see how the scene behaves on platforms that do not support Nanite."
    flavors:
      _default: {why: "Nanite removes LOD work and lets you use dense meshes, but only for the right mesh and material types."}
      tech_art: {why: "Deciding which meshes get Nanite is a project rule you will help write. Start with the simple on/off check.", do: "Use the Overdraw visualization on your rock scene and note if the Nanite or non-Nanite rocks show more overdraw."}
      lookdev: {why: "Nanite only takes Opaque and Masked materials. Plan your material blend modes early."}
      level_design: {why: "Many instances of detailed props are cheap with Nanite. It changes how you dress a level."}

  - id: TAQ45
    rank: 1
    difficulty: apprentice
    specializations: [tech_art]
    subjects: [merge-actors, optimization, static-mesh]
    required_spine: false
    required: false
    title: Merge actors into one mesh
    brief: "Each separate object on screen needs at least one draw call, which is one drawing command sent to the graphics card. Many small actors mean many draw calls, and that makes a level slower to render. The Merge Actors tool can turn a group of actors into one mesh or into instances. In this quest you try three of its methods, Merge, Simplify and Batch, on the same group of props and compare the results."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/merging-actors-in-unreal-engine"
    backup_url: null
    community_urls:
      - {title: "Combine Meshes and Merge Actors in UE5 (Francesco Milanese)", url: "https://www.youtube.com/watch?v=UjyNjBBE5Gc"}
    checklist:
      - "Open a project made from the Third Person template, or create one. Build a small group of props close together from the meshes in the folder LevelPrototyping/Meshes: 4 SM_ChamferCube, 2 SM_Cylinder and 3 SM_Ramp. Give the cylinders a different material than the other meshes, so that the group uses at least two materials."
      - "Select all of them. Open Actor > Merge Actors > Merge Actor Settings. Turn off Replace Source Actors and turn on Pivot Point at Zero. Run Merge and save the result as SM_Cluster_Merge."
      - "Open SM_Cluster_Merge. Count its material slots and its triangles, and compare them with the source actors."
      - "Select the same actors again. Run Simplify (Proxy) and save the result as SM_Cluster_Simplify. Open it and count its materials and triangles."
      - "Select only the 4 chamfer cubes and run Batch. Look in the Outliner to see what was created and which component type it uses."
      - "Write three lines, one each for Merge, Simplify and Batch. Each line should say how many draw calls the method gives and whether the UVs are kept."
    done_when: "Send a screenshot of SM_Cluster_Merge and SM_Cluster_Simplify side by side in the Static Mesh Editor, with the material count and the triangle count visible. Add your three lines."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Where do you start a merge of selected static mesh actors?"
        choices: ["Content Browser > Add > Merge", "Actor > Merge Actors in the top menu bar", "Right-click the mesh asset > Merge Actors", "Window > Merge Tool"]
        answer_index: 1
        explain: "With the actors selected, go to Actor > Merge Actors and pick Merge, Simplify, Batch or Approximate. Merge Actor Settings is in the same menu."
      - q: "With the Merge method and Merge Materials turned OFF, how many draw calls does the result have?"
        choices: ["One", "One per source actor", "One per material", "One per triangle"]
        answer_index: 2
        explain: "Merge creates one mesh section per material, so the number of draw calls equals the number of materials. UVs are preserved."
      - q: "What does the Simplify method do that Merge does not?"
        choices: ["It keeps every material and every UV channel of the source meshes, so nothing has to be baked at all", "It builds a proxy mesh from the lowest-detail LODs, reduces vertices and bakes one material, giving one draw call", "It keeps the actors separate, but gives all of them one shared material instance and one shared lightmap texture", "It preserves UVs"]
        answer_index: 1
        explain: "Simplify makes a Proxy Mesh from the lowest-detail LOD of each mesh, simplifies geometry, bakes one material and does not preserve UVs."
      - q: "What does the Batch method create?"
        choices: ["A single baked static mesh with one material, made from all of the selected actors", "Instanced Static Mesh components from identical static mesh components", "A Blueprint class that holds all of the selected actors as its children", "A Nanite mesh"]
        answer_index: 1
        explain: "Batch turns identical static mesh components into instanced components. It preserves UVs and does not change occlusion culling."
      - q: "When would you pick Approximate instead of Simplify?"
        choices: ["When the source meshes are very complex, for example Nanite meshes, and Simplify would fail", "When you want to keep all the materials and all UV channels of the source meshes as they are", "When you want instancing of identical meshes, with the UVs of each source mesh kept in the result", "When the meshes have no LODs, because Simplify can only read LOD1 and lower levels of a source mesh"]
        answer_index: 0
        explain: "Approximate is similar to Simplify but can handle much more complex sources like Nanite meshes, where Simplify fails in simplification or texture baking."
      - q: "Pivot Point at Zero is turned off. Where is the pivot of the merged actor?"
        choices: ["At the world origin, at 0,0,0", "At the center of the bounds of all the selected meshes", "At the pivot of the first static mesh actor you selected", "At the bottom of the bounds of all meshes"]
        answer_index: 2
        explain: "If Pivot Point at Zero is disabled, the merged actor uses the pivot of the first Static Mesh Actor selected for the merge."
    flavors:
      _default: {why: "Fewer actors and draw calls make a level cheaper to render."}
      tech_art: {why: "Merging is a common optimization pass. Knowing the three methods lets you pick the right one.", do: "Compare stat unit Draw time with the source actors and with the merged version, and note the difference."}
      level_design: {why: "You can merge finished set dressing to reduce actor counts, but you lose the ability to edit the pieces."}
      lookdev: {why: "Merge Materials bakes textures. Check texture size and gutter so the baked look stays close to the source."}

  - id: TAQ46
