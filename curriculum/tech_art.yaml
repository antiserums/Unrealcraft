    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/render-module-reference-for-niagara-effects-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. In the Content Drawer, choose FX, then Niagara System, then New system from selected emitters, and pick Simple Sprite Burst. Name the system FXS_RibbonTrail and drag it into a level."
      - "In the Render group, delete the Sprite Renderer and add a Ribbon Renderer. Pick DefaultRibbonMaterial as its material. To find this material, turn on Show Engine Content and Show Plugin Content."
      - "In the Emitter Update group, set the Life Cycle Mode of Emitter State to System. Then add a Spawn Rate module with a rate of about 100."
      - "In the Particle Spawn group, set Lifetime, Color and Ribbon Width. Add a Shape Location module set to Ring / Disk and an Add Velocity module set to From Point, so that the ribbon spirals."
      - "In the Particle Update group, remove Scale Color. Add an Acceleration Force module with a negative Z value so that the ribbon falls."
      - "Try one setting of the Ribbon Renderer, either UV0 Tiling Distance or Tessellation, and note what changed."
    done_when: "Send a screenshot of the spiral ribbon in the level. Add one line that says which Ribbon Renderer setting you changed and what it did."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Your system came from the Simple Sprite Burst template. What must change so it draws a ribbon?"
        choices: ["Set Sim Target to GPU in the Emitter Properties", "Add a second Sprite Renderer and stretch its sprites", "Delete the Sprite Renderer and add a Ribbon Renderer", "Change the material only, to one that draws a long strip"]
        answer_index: 2
        explain: "The template uses a Sprite Renderer. The tutorial deletes it and adds a Ribbon Renderer."
      - q: "DefaultRibbonMaterial does not show in the Material dropdown. What do you do?"
        choices: ["In View Options, turn on Show Engine Content and Show Plugin Content", "Import it from another project with the Migrate option of that project", "Restart the editor with the Niagara plugin turned off and then on again", "Enable Nanite on the ribbon material in its Details"]
        answer_index: 0
        explain: "The material is plugin content. Show Engine Content and Show Plugin Content make it visible."
      - q: "Why set Emitter State Life Cycle Mode to System here?"
        choices: ["It makes the ribbon wider, because the system then scales the width of all of its emitters", "The system then calculates life cycle settings, which usually optimizes performance", "It is required for any ribbon; a ribbon emitter in Self mode never draws anything at all", "It turns on collision for the ribbon particles of the emitter"]
        answer_index: 1
        explain: "Self mode is for full custom life cycle logic. System mode lets the system handle it, which usually optimizes performance."
      - q: "The ribbon should be one continuous stream, not a single burst. Which module gives that?"
        choices: ["Scale Color", "Shape Location", "Acceleration Force", "Spawn Rate"]
        answer_index: 3
        explain: "Spawn Rate creates a continuous stream of particles while the emitter is active."
      - q: "Acceleration Force Z is set to -200. What happens if you make it +200?"
        choices: ["The ribbon spirals upward instead of falling", "The ribbon disappears after the first frame", "The ribbon gets wider toward its end", "Nothing changes, the sign is ignored"]
        answer_index: 0
        explain: "A negative Z makes the ribbon drop. A positive Z makes it spiral upward."
      - q: "What does UV0 Tiling Distance do on a Ribbon Renderer?"
        choices: ["Sets the ribbon width, as a factor of the distance between two of its particles", "Tiles UV channel 0 by the distance the ribbon travels, and turns off UV offset by age", "Changes the draw order of the emitters, so the ribbon is drawn on top of the sprites", "Adds tessellation to the ribbon, one extra segment for each unit of distance"]
        answer_index: 1
