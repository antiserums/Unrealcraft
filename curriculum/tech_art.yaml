        choices: ["They are unsaved assets that sit between two assets that have been saved to disk", "They are excluded by your filters but sit between two assets that are not excluded", "They are engine content, which is drawn in a lighter color than project content", "They are missing on disk, and the graph only shows where they used to be"]
