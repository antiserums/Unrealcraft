        choices: ["Type the actor name in Beam End, in the Beam Emitter Setup module, and the system then finds the actor in the level by that name on each frame", "Use a Scratch Pad dynamic input with an Actor Component Interface, expose it as a user parameter and set the Source Actor in Override Parameters", "Set Life Cycle Mode to System", "Attach the actor to the Niagara component in the Outliner, then set Beam End to the name of the actor in the Details panel of the placed system"]
