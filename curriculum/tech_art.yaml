    quiz:
      - q: "What is the fastest way to get a system that contains an emitter asset you already have?"
        choices: ["Right-click the emitter and choose Create Niagara System", "Drag the emitter into the level", "Open Project Settings > Niagara", "Rename the emitter with the System prefix"]
        answer_index: 0
        explain: "Right-click on the emitter asset and pick Create Niagara System. The new system already contains that emitter."
      - q: "Why does the steam drift sideways instead of going straight up?"
        choices: ["The sphere radius is 20", "Add Velocity and Acceleration Force both have positive X values", "Life Cycle Mode is set to System", "Scale Color uses Pulse Out"]
        answer_index: 1
        explain: "Add Velocity uses X 16 to 32 and Acceleration Force uses X 25 to 55, so the particles move along X as well as up."
      - q: "You add Drag and see 'The module has unmet dependencies'. What happened and what do you click?"
        choices: ["Drag needs a GPU emitter; click Convert", "Drag needs a material; click Assign", "Drag is not allowed in Particle Update; click Remove", "Drag was added below Solve Forces and Velocity; click Fix Issue to move it"]
        answer_index: 3
        explain: "New modules go to the bottom of the group, after Solve Forces and Velocity. Fix Issue moves Drag above it so the force is solved."
      - q: "Which curve shape does the tutorial use in Scale Color for steam?"
        choices: ["Smooth Ramp Down", "Ramp Up Down", "Pulse Out", "Linear Up"]
        answer_index: 2
        explain: "Scale Color gets the Pulse Out template, so the steam fades in and out over its life."
      - q: "Compared with the smoke emitter it was copied from, how does steam get a longer life?"
        choices: ["Spawn Rate is raised to 30", "Lifetime minimum and maximum are set to 3 and 7 in Initialize Particle", "Drag is set to 0.8", "Life Cycle Mode is set to System"]
