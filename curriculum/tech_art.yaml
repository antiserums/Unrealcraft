    title: "Particles that cast light"
    brief: "Particles can do more than show an image: each one can also carry a small light that shines on the floor and walls around it. This makes fire, magic and sparks look like a real part of the scene. In Niagara you do this with a Light Renderer, which you add next to the normal Sprite Renderer. In this quest you build a blue fountain of particles that lights up a dark corner of a level."
    time_min: 40
