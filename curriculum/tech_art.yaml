    title: A ribbon trail
    brief: "Most particles are drawn as sprites, which are small flat images that face the camera. A Ribbon Renderer works differently: it connects the particles of an emitter into one long strip. Ribbons are used for trails, smoke paths and magic streaks that sprites cannot draw well. In this quest you change a simple sprite emitter into a ribbon that spirals and falls."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-create-a-ribbon-effect-in-niagara-for-unreal-engine"
