# Unrealcraft — Cross-specialization taster quests
# Tasters are short (60 min max) looks into another specialization's work. specializations.yaml → required_tasters
# says which ones each specialization owes at each rank.
# URL prefix: https://dev.epicgames.com/documentation/en-us/unreal-engine/
# Verified slugs only (see VERIFIED_URLS.md). Backup videos are TODO_URL until a human picks a dated UE5+ video.

quests:
  - id: PQ17
    rank: 2
    difficulty: adept
    specializations: [level_design, lookdev, animation, cinematics]
    subjects: [cpp, reflection, awareness]
    required_spine: false
    required: false
    taster: true
    title: "Hello, C++"
    brief: "C++ is the programming language that Unreal Engine itself is written in. Programmers use it to build features and then make some of them visible to the editor and to Blueprints. A header file, which ends in .h, lists what a C++ class contains, and special words such as UCLASS, UPROPERTY and UFUNCTION mark what the engine and the editor can see. In this quest you do not write any code: you read one header file and learn what these words mean."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-cpp-quick-start"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 c++ actor uclass uproperty ufunction explained beginner"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/programming-with-cplusplus-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/coder-01-set-up-and-compile-a-cplusplus-project-in-unreal-engine"
    checklist:
      - "Read the Programming Quick Start page in the Unreal Engine documentation. You do not need an IDE, which is a program for writing code, to follow along."
      - "Open the example Actor .h file from the quick start. You can read it in the documentation, or open any header in the Source folder of a C++ template project. In it, find UCLASS(), GENERATED_BODY(), one UPROPERTY and one UFUNCTION."
      - "Look at the words inside the UPROPERTY brackets, which are called specifiers: EditAnywhere, VisibleAnywhere, BlueprintReadWrite and Category. Match each one to what it does."
      - "Work out where that UPROPERTY would appear in the Details panel when the actor is placed in a level. Look for the heading that has the same name as its Category."
      - "Bonus, optional: install the IDE, compile the quick start actor, and place it in a level."
    done_when: "Send 3 lines that say what UCLASS, UPROPERTY and UFUNCTION each do, and a screenshot of a C++ property in the Details panel. Compiling is optional, but say whether you did it."
    xp: 60
    verify_type: writeup
    quiz:
      - q: "What does UPROPERTY(EditAnywhere) on a variable do?"
        choices: ["Makes it save to a text file in the project folder each time the value changes during the game", "Shows it in the Details panel so it can be edited on the class defaults and on placed instances", "Makes it replicate from the server to every client, on each frame of the game", "Hides it from Blueprint graphs and from the Details panel of every instance"]
        answer_index: 1
        explain: "That's how a programmer gives designers a tuning knob."
      - q: "What is the .h file for, compared with the .cpp?"
        choices: [".h declares the class and its members; .cpp holds the function bodies", "They're identical copies of the same code, kept in two files as a backup for each other", ".h is the file for Mac builds; .cpp is the file for Windows builds only", ".cpp is only for comments about the class; .h holds the code that is compiled"]
        answer_index: 0
        explain: "Header declares, source implements. You'll mostly read headers to see what's exposed."
      - q: "Which macro lets a C++ function be called from Blueprint?"
        choices: ["UCLASS(Blueprintable)", "GENERATED_BODY()", "UFUNCTION(BlueprintCallable)", "UPROPERTY(VisibleAnywhere)"]
        answer_index: 2
        explain: "BlueprintCallable makes the function show up as a node."
      - q: "A property is marked VisibleAnywhere. What do you see in Details?"
        choices: ["Nothing at all in the panel", "An editable field with a slider next to it", "A Blueprint node for the value", "The value, but you can't change it there"]
        answer_index: 3
        explain: "Visible means read-only in Details. EditAnywhere means editable."
      - q: "Do you have to compile C++ to finish this taster?"
        choices: ["Yes, or the task fails, because the property only exists after you have compiled the class", "No. Compiling is an optional bonus; reading and finding the property is the task", "Only on Linux, where the editor cannot open a C++ project that has not been compiled yet", "Only if you want to become a programmer and plan to take the C++ quests later on"]
        answer_index: 1
        explain: "This taster is about reading C++, not setting up a toolchain."
    flavors:
      _default: {why: "Being able to read a header means you can see what a programmer exposed to you."}
      level_design: {why: "The C++ opposite taster. You'll know what to ask a programmer for when you want a number in Details.", do: "Find one UPROPERTY and say which Details category it lands in."}
      lookdev: {why: "Material and light parameters exposed from C++ show up the same way in Details."}
      animation: {why: "Character and anim classes are often C++ bases. This is how to read what they expose."}
      cinematics: {why: "Sequencer can keyframe properties exposed from C++. Now you'll know where they come from."}

  - id: PQ18
    rank: 2
    difficulty: adept
    specializations: [level_design, cinematics]
    subjects: [gas, abilities, awareness]
    required_spine: false
    required: false
    taster: true
    title: "What GAS is"
    brief: "The Gameplay Ability System, often shortened to GAS, is a framework inside Unreal for things characters can do, such as attacks, heals and dashes, and for the numbers these actions change, such as health. Many Unreal games use it, so you will hear its words often. In this quest you do not build anything: you read the overview and learn the five main terms well enough to describe a game mechanic with them."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-ability-system-for-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 gameplay ability system overview explained abilities attributes effects tags"
    checklist:
      - "Read the Gameplay Ability System overview page in the Unreal Engine documentation. You can skip the code samples if you like."
      - "Write a one-line definition for each of these five terms: Ability System Component, Gameplay Ability, Attribute, Gameplay Effect, and Gameplay Tag."
      - "Pick a mechanic from a game you know, such as a dash, a heal or a stun. Describe how it works using those five terms."
      - "Name one thing in a game level that could apply a Gameplay Effect, for example a hazard, a pickup or a zone."
    done_when: "Send your five one-line definitions and your description of the mechanic. You also need to pass the quiz of this quest."
    xp: 60
    verify_type: quiz
    quiz:
      - q: "In GAS, what is an Attribute?"
        choices: ["A number on an actor, like Health or Stamina, stored in an AttributeSet", "An animation that plays on an actor", "A level that an ability can load when it is activated by the player", "A parameter of a material, like Roughness, that an ability can change"]
        answer_index: 0
        explain: "Attributes are the numbers that abilities and effects read and change."
      - q: "What does a Gameplay Effect do?"
        choices: ["Plays a sound only, at the place of the actor, each time an ability starts or ends", "Spawns a particle at the place of the actor, and removes it again when the ability has ended", "Changes attributes and/or applies tags, instantly, for a duration, or indefinitely", "Loads a level in the background while an ability is active, and shows it when it is done"]
        answer_index: 2
        explain: "Damage, heals, buffs and debuffs are all Gameplay Effects."
      - q: "What is a Gameplay Ability?"
        choices: ["A Blueprint Interface that actors add when they want to react to damage, with one function for each hit", "An action an actor can perform, like a dash or a fireball, with its own logic, cost and cooldown", "A navmesh setting that tells AI characters which areas they can cross with a jump or with a dash move", "A camera that follows an actor while it performs an action"]
        answer_index: 1
        explain: "Abilities are what the actor does. Effects are what that does to attributes."
      - q: "What are Gameplay Tags used for?"
        choices: ["Naming files in the Content Browser, so that abilities and effects are easy to find", "Names that replace the materials of an actor while an effect is active, like Material.Burning or Frozen", "Rendering order, so that the effects of an ability are drawn on top of the actor that owns it and not behind", "Hierarchical labels, like State.Stunned, that abilities and effects check to block or allow things"]
        answer_index: 3
        explain: "Tags let systems ask questions like \"is this actor stunned?\" without hard references."
      - q: "Which component does an actor need to use GAS?"
        choices: ["Character Movement Component", "Ability System Component", "Audio Component", "Spring Arm Component"]
        answer_index: 1
        explain: "The Ability System Component holds the actor's abilities, attributes and active effects."
    flavors:
      _default: {why: "A lot of Unreal games use GAS. The vocabulary lets you follow the conversation."}
      level_design: {why: "The GAS opposite taster. Hazards, pickups and buff zones in your levels may end up applying Gameplay Effects.", do: "Describe one of your R2 traps or pickups as a Gameplay Effect."}
      cinematics: {why: "Your opposite taster. In-game cinematics often trigger on ability events or tags."}

  - id: EAQ22
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [lighting, readability]
    required_spine: false
    required: false
    taster: true
    title: "One lighting pass on your loop"
    brief: "Players look first at the brightest part of the screen and at the places with the most contrast. This means lighting is a tool for guiding the player, not only for making a level look good. In this quest you do one lighting pass on a level with pickups, so that the pickups and the way to them are easy to see."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/lighting-the-environment-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 lighting for gameplay readability guide the player"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/environment-light-mixer-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/light-types-and-their-mobility-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/auto-exposure-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open a level of your own that has pickups to collect. If you have none, create a new level with File, New Level, Empty Level, build two or three rooms from cubes with one dead end, and place three small spheres as pickups. Move the camera to the view the player has at the start, and save a camera bookmark there (Ctrl plus a number key). Take the before screenshot now."
      - "Set up the basic lighting with the Env. Light Mixer window. Use it to add a Directional Light, a Sky Light, a Sky Atmosphere and Height Fog."
      - "Make each pickup stand out. You can put a small Point Light on it, or you can place the pickup in the brightest area."
      - "Make the dead ends darker or less noticeable, so that the player sees the route to the pickups first."
      - "Add a Post Process Volume and turn on Infinite Extent so that it affects the whole level. Then bring the minimum and maximum values of the auto exposure closer together, so that the brightness does not jump when the player moves between rooms."
    done_when: "Send one screenshot from before and one from after your lighting pass, both taken from the same camera bookmark. Add one line that says how a player finds the first pickup now."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What's the goal of this lighting pass?"
        choices: ["Photorealism, as close to a photo as you can get in the time that you have", "The player can spot the pickups and the route without being told", "Maximum brightness everywhere, so that no corner of the level is dark", "Testing Nanite on the meshes of the level while the lights are moved around"]
        answer_index: 1
        explain: "Readable first. Contrast shows where to look."
      - q: "Every surface is lit evenly and nothing stands out. What's the fix?"
        choices: ["Add contrast: brighter on pickups and the route, darker on dead ends", "Add more fog to the level, so that far walls fade out", "Turn off shadows on all lights, so nothing is hidden", "Raise the intensity of every light until the whole level is bright"]
        answer_index: 0
        explain: "Players look at the brightest, highest-contrast area first."
      - q: "With Lumen on (the UE5 default), do you need to build lighting to see changes?"
        choices: ["Yes, always, after each change to a light", "Only for the point lights and spot lights", "No. Movable lights with Lumen update live", "Only after packaging the project for a platform"]
        answer_index: 2
        explain: "Baking is an option, not a requirement, in a default UE5 project."
      - q: "Brightness keeps shifting as you walk between rooms. Where do you control that?"
        choices: ["World Settings → Kill Z, in the World section of the panel", "Material Editor → Details → Usage, on each material in the rooms", "The GameMode → Class Defaults → Exposure, set once for the level", "A Post Process Volume's Exposure settings (min/max EV)"]
        answer_index: 3
        explain: "Auto exposure adapts to the scene. Narrow its range so it stays steady."
      - q: "Which light is the quickest way to highlight one pickup?"
        choices: ["A second Directional Light on top", "A small Point Light near the pickup", "A Sky Light with a high intensity", "Height Fog"]
        answer_index: 1
        explain: "A local light draws the eye. Keep only one Directional Light as the sun."
    flavors:
      _default: {why: "Lighting decides where players look first."}
      programming: {why: "Your opposite taster. When lighting makes the loop readable, playtesters test your code instead of looking for pickups.", do: "Light the pickups first. Everything else can stay flat."}
      level_design: {why: "This pass is how LD would light a gameplay space: readable first."}

  - id: GDQ5
    rank: 2
    difficulty: adept
    specializations: [lookdev, animation, cinematics]
    subjects: [blueprint, pickups, game-loop]
    required_spine: false
    required: false
    taster: true
    title: "A pickup game"
    brief: "A win condition is the rule that says when the player has won. Together with something to collect, it makes the smallest complete game you can build. The count of collected coins is kept in the GameMode, a Blueprint that holds the rules of the game and stays alive while the coins are destroyed. In this quest you make coins the player can pick up, count them, and show a win message when all three are collected."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/module-5-building-the-coin-pickup-and-speed-boost-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 collect coins win condition blueprint beginner"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/module-3-create-a-coin-pickup-with-modeling-tools-and-blueprints"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/game-mode-and-game-state-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a Blueprint named BP_UUGameMode as a child of the GameMode of the template: right-click the GameMode Blueprint of the template in the Content Browser and choose Create Child Blueprint Class. Give it an Integer variable named Collected, and an Integer variable named Target that is set to 3. Then set BP_UUGameMode as the GameMode Override of the level in World Settings."
      - "Make a Blueprint named BP_Coin with a mesh and a Sphere Collision. In its On Component Begin Overlap event, compare Other Actor with Get Player Pawn and use a Branch, so that the coin only reacts to the player. Then use Get Game Mode, then Cast to BP_UUGameMode, then call a function named AddCoin, and after that call Destroy Actor."
      - "Inside the AddCoin function, add 1 to Collected. Then use a Branch node that checks whether Collected >= Target."
      - "On the True output of the Branch, show a win message. A Print String node is enough, and a widget on screen is a bonus."
      - "Place 3 coins in the level in spots where the player has to move around to reach them. Play in the editor (PIE) until you win."
    done_when: "Send a short video clip (30 seconds or less), or two or three screenshots, taken while playing in the editor, that show you collecting all 3 coins and the win message appearing. Also send a screenshot of the AddCoin function."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Where should the coin count live?"
        choices: ["On each coin, in a variable that every coin keeps only for itself", "In the GameMode (or another single place every coin reports to)", "In the material of the coin, as a parameter that goes up on each pickup", "In World Settings, in a field that every level has for its coins"]
        answer_index: 1
        explain: "Coins get destroyed. The count needs to live somewhere that stays."
      - q: "Why Destroy Actor (or disable collision) right after pickup?"
        choices: ["To save disk space in the project folder", "It's required before lighting can update", "So the same coin can't be counted twice", "It resets the level for the next player"]
        answer_index: 2
        explain: "Overlaps can fire again. Removing the coin makes each pickup count once."
      - q: "How does a coin reach your GameMode's AddCoin function?"
        choices: ["Get Game Mode, then Cast to BP_UUGameMode, then call AddCoin", "Print String with the name AddCoin in its text", "Through the Construction Script of each coin in the level", "The Content Drawer, by dragging the coin"]
        answer_index: 0
        explain: "Get Game Mode returns the base class. The cast gives you your own functions."
      - q: "Why make Target a variable instead of typing 3 into the Branch?"
        choices: ["Variables are faster than numbers in a graph", "A Branch node can't take numbers, only variables from the GameMode", "It's required to compile the GameMode", "So you can change the goal per level without editing the graph"]
        answer_index: 3
        explain: "Tuning values belong in variables."
      - q: "Where do you check for the win?"
        choices: ["On Event Tick", "Right after incrementing the count", "In the Construction Script of a coin", "Only when the level loads"]
        answer_index: 1
        explain: "Check when the count changes. Nothing else can change it."
    flavors:
      _default: {why: "A win condition is the smallest complete game you can make."}
      lookdev: {why: "Your opposite taster. Your environments will host loops like this, so see how one is wired.", do: "Give the coins an emissive MI_ so they read in your lighting."}
      animation: {why: "The same overlap-to-GameMode wiring will later trigger montages and reactions."}
      cinematics: {why: "Your R2 capstone triggers a sequence from BP. This loop is where it gets triggered from."}
      level_design: {why: "Placing the 3 coins is level design: they decide the route."}

  - id: EAQ23
    rank: 2
    difficulty: adept
    specializations: [gameplay_design]
    subjects: [materials, master-material, parameters]
    required_spine: false
    required: false
    taster: true
    title: "Master material from scratch (small)"
    brief: "A master material is one material built with parameters, which are values such as a color or a roughness that you leave open to change. From it you make Material Instances, which are light copies that only change those parameters. This way one material can give many objects different looks. In this quest you build a small master material and three instances, and use their colors to show the player what each object in a level is for."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/artist-03-create-materials-and-material-instances"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 master material parameters beginner base color roughness"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-materials"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/instanced-materials-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Create a new material named M_UC_Master in the folder /Content/UC/Materials (create the folder if it does not exist yet)."
      - "Add these parameters to it: a Vector parameter named BaseColor, two Scalar parameters named Roughness and Metallic, and a Scalar parameter named EmissiveStrength. Multiply EmissiveStrength by the color and connect the result to the Emissive input."
      - "Give every parameter a Group in its Details panel. Groups keep the parameter list tidy when you open an instance."
      - "Make 3 Material Instances from it: MI_Gameplay_Interact (bright, with a little emissive glow), MI_Gameplay_Hazard (red), and MI_Gameplay_Neutral (matte gray)."
      - "Apply the instances to three objects in a level: one that the player can use, one that is a hazard, and one that is only scenery. If your level has no such objects, place three cubes that stand for them. Players should be able to tell the role of each object by its color."
    done_when: "Send a screenshot of the master material graph, and a screenshot of the 3 instances applied in your level."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is a master material?"
        choices: ["A material that can only be used on one mesh", "A material that is locked and cannot be opened", "A material that the engine creates by itself for every new project", "One material built with parameters, from which you make instances"]
        answer_index: 3
        explain: "A master material leaves some values open as parameters. Many instances can then reuse the same graph with different values."
      - q: "What is a parameter in a material?"
        choices: ["A value, such as a color, that you leave open to change", "A texture that is imported from a file", "A comment that explains the graph to other people who open the material", "A mesh that the material is applied to in the open level"]
        answer_index: 0
        explain: "A parameter is a named value in the graph. Instances of the material can set it to their own value."
      - q: "What is a Material Instance?"
        choices: ["A full copy of the material graph that you edit node by node", "A light copy of a material that only changes its parameters", "A screenshot of a material that is saved as a texture", "A material that has no parent and no parameters"]
        answer_index: 1
        explain: "A Material Instance has no graph of its own. It uses the graph of its parent and only sets the parameters."
      - q: "Which kind of parameter do you use for BaseColor?"
        choices: ["A Scalar parameter", "A Texture parameter", "A Vector parameter", "A Boolean parameter"]
        answer_index: 2
        explain: "A color has several channels, so it needs a Vector parameter. Roughness, Metallic and EmissiveStrength are single numbers, so they are Scalar parameters."
      - q: "How do you build the glow of the master material?"
        choices: ["Connect Roughness to the Emissive input and set the Metallic input to a value of 1 on the main node", "Multiply EmissiveStrength by the color and connect the result to the Emissive input", "Add Metallic to the color and connect the result to the Base Color input of the node", "Connect EmissiveStrength to the Roughness input and leave the Emissive input of the node empty"]
        answer_index: 1
        explain: "The color gives the glow its tint and EmissiveStrength sets how strong it is. With the value at 0, the material does not glow."
      - q: "Why do you give every parameter a Group?"
        choices: ["Groups keep the parameter list tidy when you open an instance", "Groups make the material render faster, because each group is one draw call", "Groups are needed before the material can be saved or compiled", "Groups lock the parameters against changes, so nobody edits them by mistake"]
        answer_index: 0
        explain: "In a Material Instance, the parameters are listed by group. Good groups make the right value easy to find."
      - q: "What should the three instances tell the player?"
        choices: ["How many materials the level uses in all", "Which object was placed first", "How large each object is", "The role of each object, by its color"]
        answer_index: 3
        explain: "One instance marks things the player can use, one marks hazards, and one marks scenery. The player learns the rule from the colors."
      - q: "You need a fourth look, for example blue for a goal object. What is the right way to add it?"
        choices: ["Copy the whole master material and change the nodes inside the new copy", "Paint the mesh blue in another program and import it again", "Make another Material Instance from the master and change its parameters", "Add a second Emissive input to the master material node"]
        answer_index: 2
        explain: "That is what the master material is for. A new instance only needs new parameter values, and the graph is not touched."
    flavors:
      _default: {why: "One master material with parameters can color-code a whole game."}
      gameplay_design: {why: "Your opposite taster. Color-coded interactables are how players learn your rules at a glance.", do: "Make the hazard instance instantly distinct from the interact one."}
      level_design: {why: "The same color language marks interactables in your levels."}
