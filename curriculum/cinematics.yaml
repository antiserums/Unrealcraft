    brief: "This quest is a complete scene that you take from an empty level to graded final frames. It combines shots, an animated character, following cameras, lighting for each shot, color grading, and a final render. You build a scene of 30 to 45 seconds and write a short breakdown that explains your choices. Everything you need to build is listed in the steps."
