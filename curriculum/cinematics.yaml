  - id: CQ63
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [sequencer, post-process, property-tracks, grading]
    required_spine: false
    required: false
    title: Animate the grade inside a shot
    brief: "A color grade does not have to stay the same for a whole shot. The picture can slowly lose its color or get darker at the edges as part of the story. Sequencer can key almost any setting of a Post Process Volume, the actor that controls the look of the image. In this quest you add a Post Process Volume to a sequence and animate its vignette, bloom and saturation over the shot."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-transform-and-property-tracks-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-actor-tracks-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, and work in a lit level. Place a Post Process Volume named PPV_Shot. In its Details panel, set Priority to 10 and leave Infinite Extent (Unbound) off. Scale it so that your camera will be inside it. Place a second one named PPV_World with Infinite Extent on and Priority 0."
      - "Create a Level Sequence named SEQ_Grade and click the Camera button in the Sequencer toolbar, which adds a Cine Camera and a Camera Cuts track. Select PPV_Shot and add it with Add Track (+), then Actor To Sequencer."
      - "On the PPV_Shot track, click Add Track (+) and open Settings. This submenu lists the post process settings of the volume. Add the property tracks Vignette Intensity, Bloom Intensity and Saturation (found under Color Grading > Global)."
      - "Key Vignette Intensity with the value 0 at frame 0 and 0.8 at the last frame. Key Bloom Intensity so that it is highest in the middle of the shot. Right-click each float section, open Display and choose Show Curve."
      - "Key Saturation (under Color Grading > Global) so that the picture goes from full color to almost gray over the shot. Drag the playhead to check that the values change smoothly between the keys."
      - "Add PPV_World to the sequence too. Key its Blend Weight from 1 to 0 across the shot. Drag the playhead and watch which volume wins at each point."
      - "Play the shot. Write a short text that says which property tracks changed smoothly between keys and which did not."
    done_when: "Send a screenshot of SEQ_Grade that shows the PPV_Shot track with at least three keyed property tracks from its Settings, and one curve drawn inside its track. Also send a viewport frame from the middle of the shot."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You want the full list of a Post Process Volume's properties in Sequencer, not only the filtered common ones. What do you do?"
        choices: ["Add a component track from the Components category, then Add Track (+) on that component", "Right-click the Object Binding track and choose Show All", "Enable Auto Key", "Add a second Object Binding for the same Actor"]
        answer_index: 0
        explain: "Only common properties are filtered onto the Actor. Adding the component track from the Components category exposes all of that component's properties."
      - q: "A Boolean property track has a key set to off at frame 0 and on at frame 60. What happens at frame 30?"
        choices: ["It is half on, blended", "It is on, because Sequencer rounds up", "It is still off; Boolean tracks do not interpolate", "Sequencer shows an error"]
        answer_index: 2
        explain: "Boolean, Integer, String, Enum and Object tracks do not interpolate. The timeline is red while disabled and green while enabled."
      - q: "Which track types interpolate and can use custom tangents and curves?"
        choices: ["Float and Vector tracks", "Integer and String tracks", "Enum and Object tracks", "Boolean tracks only"]
        answer_index: 0
        explain: "Float keyframes interpolate with custom tangents and curves. Vector 2, 3 and 4 tracks also interpolate."
      - q: "How do you show a float track's curve directly inside its section on the timeline?"
        choices: ["Open the Curve Editor and pin the track", "Hold Alt while dragging a key", "Right-click the float section and select Display > Show Curve", "Enable Show 3D Trajectory"]
        answer_index: 2
        explain: "The Display > Show Curve option on a float section draws the curve inline in the track for quick visual checks."
      - q: "Two Post Process Volumes overlap and both have Priority 5. What does the docs page say about the result?"
        choices: ["The larger volume wins", "The order is undefined", "They blend 50/50", "The newer volume wins"]
        answer_index: 1
        explain: "The highest Priority overrides lower ones. If two or more overlapping volumes share the same priority, the order is undefined."
      - q: "What does a Blend Weight of 0 do on a Post Process Volume?"
        choices: ["Makes the volume affect the whole scene", "Disables its bounds", "Gives it full effect", "Gives it no effect"]
        answer_index: 3
        explain: "Blend Weight is the amount of influence. 1 is full effect and 0 is no effect, so keying it is a clean way to fade a look in or out."
      - q: "Where are the default post process settings that apply when a Level has no Post Process Volume?"
        choices: ["Project Settings > Rendering > Default Settings", "Editor Preferences > Viewport", "The Level Blueprint", "World Settings > Lightmass"]
        answer_index: 0
        explain: "The engine uses default post processing settings that live in Project Settings under Rendering > Default Settings."
      - q: "You override a float channel with Double Perlin Noise but want it to wobble between 100 and 200 instead of around 0. What is the documented approach?"
        choices: ["Set Amplitude to 150", "Keep a base section at the value and put the noise on an extra additive section", "Noise cannot be offset", "Use an Integer track instead"]
        answer_index: 1
        explain: "Noise channels animate relative to 0. The docs say to create extra additive sections for the noise so it adds on top of a base value."
    flavors:
      _default: {why: "A grade that changes over the shot is part of the story, and Sequencer can key almost any post process property."}
      cinematics: {why: "Directors ask for looks that shift mid-shot. Keying a Post Process Volume gives you that without touching the level.", do: "Add Blend Radius to your rig: key the camera through a bounded volume and note where the blend starts."}
      lookdev: {why: "The same property tracks drive any Actor's settings, so this is a reusable skill for look tests.", do: "Key Film Slope in the shot and write one line about why the docs say Film settings should stay project-wide."}

  - id: CQ64
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [color-grading, lut, post-process, color-grading-panel]
    required_spine: false
    required: false
    title: "LUT for a quick look, panel for the real grade"
    brief: "A LUT (lookup table) is a small texture that remaps every color of the picture to another color. You can build a look in an image editor and bring it into Unreal as a LUT, which is the fastest way to try a look. A LUT has limits, though, so the final grade is better made with the Color Grading settings of Unreal. In this quest you make a LUT, apply it, and then rebuild the same look in the Color Grading panel."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-lookup-tables-for-color-grading-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/color-grading-panel-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/color-grading-and-the-filmic-tonemapper-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Frame a shot of a lit level and take a high-resolution screenshot of it. Open it in an image editor such as Photoshop or GIMP. Add adjustment layers, for example Vibrance and Brightness/Contrast, until you like the look."
      - "Open a neutral LUT image of 256x16 pixels (a 16x16x16 table laid out flat). You can download one from the documentation page linked on this quest. Drag your adjustment layers onto it and save it as T_LUT_ShotLook.png. Import the file into the project."
      - "Open T_LUT_ShotLook in the Texture Editor. Set Mip Gen Settings to NoMipMaps and Texture Group to Color Lookup Table."
      - "Place a Post Process Volume named PPV_Shot in the level and turn on Infinite Extent (Unbound). On it, go to Color Grading > Global and enable Color Grading LUT. Assign the texture and set Color Grading LUT Intensity to 1. Compare this with an intensity of 0.5."
      - "Open Window > Color Grading and select PPV_Shot in the Object Mixer panel. Rebuild the same look with the Shadows, Midtones and Highlights wheels. Then set LUT Intensity back to 0."
      - "Place a Cine Camera Actor. Create a Color Grading collection named ShotA and add PPV_Shot and the Cine Camera to it. Use the Solo icon (headphones) to check the camera on its own."
      - "Write three lines that say what the LUT gave you quickly, and why the documentation says to finish with the Color Grading properties."
    done_when: "Send two viewport frames of the same shot: one with the LUT at intensity 1, and one with the grade made with the wheels and the LUT intensity at 0. Also send a screenshot of the Color Grading panel with your ShotA collection visible, and your three lines."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the size and layout of a LUT texture used by Unreal Engine?"
        choices: ["A 32x32x32 cube saved as a .cube file", "A 16x16x16 color neutral LUT unwrapped to a 256x16 texture", "A 1D 256x1 strip per channel", "Any square texture with sRGB on"]
        answer_index: 1
        explain: "Unreal uses one 3D 16x16x16 lookup table stored as a 256x16 image. A neutral one changes nothing; a graded one applies the look."
      - q: "Which two Texture Editor settings does the docs page tell you to set on a LUT for best results?"
        choices: ["sRGB off and Never Stream", "Compression Masks and LOD Bias 1", "Power of two and Streaming Priority high", "Mip Gen Settings NoMipMaps and Texture Group Color Lookup Table"]
        answer_index: 3
        explain: "A LUT must not be mipmapped and belongs in the Color Lookup Table texture group so it is handled correctly."
      - q: "Where do you enable the LUT on a Post Process Volume?"
        choices: ["Film > Slope", "Lens > Bloom", "Color Grading > Global > Color Grading LUT", "Rendering Features > Post Process Materials"]
        answer_index: 2
        explain: "The Color Grading LUT and its Intensity live in the Color Grading > Global section of the Post Process Volume."
      - q: "Why does the docs page recommend the Color Grading properties over a LUT for the final look?"
        choices: ["LUTs are slower to render", "LUTs apply in LDR after tonemapping in the display's sRGB space, so the result is not consistent on HDR or Rec709 displays", "LUTs only work in the Path Tracer", "LUTs cannot be authored in GIMP"]
        answer_index: 1
        explain: "A LUT is a snapshot for one display. Color Grading properties work in scene-referred linear space before tone mapping, so they hold across displays."
      - q: "What does Color Grading LUT Intensity do?"
        choices: ["Scales how strongly the LUT color correction is applied", "Changes the LUT resolution", "Blends between two LUTs", "Sets the exposure of the LUT"]
        answer_index: 0
        explain: "It is a scaling factor for the LUT's effect. 1 is the full LUT, 0 is off."
      - q: "How do you open the Color Grading panel and where does it appear?"
        choices: ["Window > Color Grading; it opens at the bottom of the level viewport", "Right-click a Post Process Volume > Grade", "Tools > Color Grading; it opens as a floating window only", "Edit > Editor Preferences > Color"]
        answer_index: 0
        explain: "The Color Grading panel is under Window > Color Grading and docks at the bottom of the level viewport."
      - q: "Which of these Actors is NOT listed as supported in the Color Grading panel's Object Mixer?"
        choices: ["Cine Camera Actor", "Color Correction Region", "Post Process Volume", "Directional Light"]
        answer_index: 3
        explain: "Supported types are Post Process Volume, Cine Camera Actor, Camera Actor, nDisplay Root Actor, Color Correction Region and Color Correction Window. Lights are not color grading actors."
      - q: "Per the Filmic Tonemapper page, how should you use the Film section (Slope, Toe, Shoulder) versus Color Grading?"
        choices: ["Film per shot, Color Grading project-wide", "Both per shot", "Film project-wide for one look; Color Grading for artistic per-shot changes", "Neither; use LUTs"]
        answer_index: 2
        explain: "The docs recommend Film settings be used project-wide and not changed shot by shot. Artistic adjustments belong in Color Grading."
    flavors:
      _default: {why: "A LUT is the fastest way to try a look, but you must know its limits before you ship a grade."}
      cinematics: {why: "Clients send LUTs. You need to load one, judge it and rebuild it in a display-safe way.", do: "Export the same frame twice through Movie Render Queue, LUT and wheel grade, and put them side by side."}
      lookdev: {why: "The Color Grading panel is the artist's home for scene looks across many volumes.", do: "Add a Color Correction Region to the ShotA collection and grade one prop on its own."}

  - id: CQ65
