  - id: CQ14
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [movie-render-queue, rendering, output]
    required_spine: false
    required: true
    title: Render a shot with Movie Render Queue
    brief: "A shot that you can only see in the viewport cannot be shared with anyone. Movie Render Queue, often shortened to MRQ, is the tool that renders a Level Sequence to image files at final quality. In this quest you enable the tool, add a sequence as a render job, choose a few settings, save them as a preset, and render about 60 frames as PNG images."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/rendering-high-quality-frames-with-movie-render-queue-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-render-out-final-images-and-video"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/movie-render-pipeline-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-rendering-export-formats-in-unreal-engine"
    community_urls:
      - {title: "The 2025 Guide to Rendering in Unreal Engine 5 (William Faucher)", url: "https://www.youtube.com/watch?v=fVg5ihB8Wdc"}
    checklist:
      - "Open any project, or create one from the Third Person template. You need a Level Sequence with a camera in it. If you have none, click the Cinematics dropdown in the main toolbar, choose Add Level Sequence, click the Camera button in the Sequencer toolbar, and set two keys on the Transform track of the camera. Then enable the Movie Render Pipeline plugin: open Edit > Plugins, look under Built-In, and turn it on. Restart the editor if it asks you to."
      - "Open Window > Cinematics > Movie Render Queue. Click + Render and add the Level Sequence, or drag it in from the Content Browser."
      - "Click Unsaved Config* to open the settings of the job. Use + Setting to add .png Sequence [8bit], Deferred Rendering and Anti-aliasing."
      - "In Anti-aliasing, set Spatial Sample Count to 1 and Temporal Sample Count to 8. Enable Override Anti Aliasing Mode and set it to None."
      - "In Output, set an Output Directory, which is the folder where the images are saved. Keep the resolution 1920x1080. Enable Use Custom Playback Range and render only about 60 frames."
      - "Open Presets and choose Save As Preset. Name the preset MRQ_Preview. Then click Render (Local) and wait until the preview window closes."
      - "Open the output folder with the link in the Output column and check the PNG files."
    done_when: "Send a screenshot of the Movie Render Queue window with your job and the MRQ_Preview preset selected. Also send a screenshot of the output folder that shows the PNG frame files."
    xp: 115
    verify_type: screenshot
    quiz:
      - q: "Where do you open the Movie Render Queue?"
        choices: ["Window > Cinematics > Movie Render Queue", "Edit > Project Settings > Rendering", "Tools > Render", "File > Export"]
        answer_index: 0
        explain: "It is under Window > Cinematics > Movie Render Queue. The Movie Render Pipeline plugin must be enabled first."
      - q: "You need a transparent background in the final frames. Which output format supports an alpha channel?"
        choices: [".jpg Sequence", ".png Sequence", ".bmp Sequence", ".wav"]
        answer_index: 1
        explain: "The table lists .png and .exr as having an alpha channel; .bmp and .jpg do not. Alpha support must also be enabled in Project Settings (linear color space only)."
      - q: "Which output format is described as lossy and good for previews?"
        choices: [".exr", ".png", ".jpg", ".bmp"]
        answer_index: 2
        explain: ".jpg is lossy with small files, so it is good for previews. .png, .bmp and .exr are lossless."
      - q: "In the Setting/Presets window, which setting cannot be deleted?"
        choices: ["Anti-aliasing", "Console Variables", "Deferred Rendering", "Output"]
        answer_index: 3
        explain: "Output is the only setting that cannot be deleted. Other settings can be removed or just toggled off for one render."
      - q: "Console variables added in the MRQ Console Variables setting take effect when?"
        choices: ["Only when rendering from the queue; they do not change the level permanently", "Always, in editor and in game", "Only in Play In Editor", "Only after restarting the editor"]
        answer_index: 0
        explain: "The CVARs listed in the queue execute only when the image is rendered from the queue and do not permanently change level settings."
      - q: "What is the difference between Render (Local) and Render (Remote)?"
        choices: ["Local renders at lower quality", "Local renders in the current Editor like PIE; Remote launches a separate process", "Remote requires a render farm", "Remote only makes .exr"]
        answer_index: 1
        explain: "Render (Local) renders in the current editor instance, similar to PIE, and is recommended for fast iteration. Render (Remote) launches a separate process by default."
      - q: "You save a preset with Save As Preset. Where does it go and what is it?"
        choices: ["A text file in Saved/Config", "A section inside the Level Sequence", "An asset in Cinematics > MoviePipeline > Presets that can be copied to other projects", "A setting in Project Settings"]
        answer_index: 2
        explain: "Presets are saved as assets, by default under Cinematics > MoviePipeline > Presets, so they can be reused and copied between projects."
      - q: "Which statement about temporal samples is correct per the docs?"
        choices: ["They render the same moment with camera offsets", "They only change the output resolution", "They are cheaper than TAA", "They slice the shutter open time into sub-frames and are good for motion blur quality"]
        answer_index: 3
        explain: "Temporal samples split the shutter open time into sub-frames and use engine motion blur between them. Spatial samples render the same moment with small camera offsets."
    flavors:
      _default: {why: "A shot that only lives in the viewport cannot be shared. MRQ is how Unreal makes final frames."}
      cinematics: {why: "MRQ is your delivery tool. Presets, formats and frame ranges are daily work.", do: "Render the same 60 frames as .jpg and compare file sizes and quality with the .png output."}
      lookdev: {why: "Offline rendering removes real-time limits so materials and lighting can be judged fairly.", do: "Add the Console Variables setting and raise r.Tonemapper.Quality and r.BloomQuality as the guide shows."}
      tech_art: {why: "Render presets and CVAR lists are pipeline assets you will maintain for a team.", do: "Add the Burn In setting and render a short test with frame numbers on the image."}

