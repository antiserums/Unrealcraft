    subjects: [sequencer, curve-editor, tangents, retime, buffer-curves]
    required_spine: false
    required: false
    title: Curve Editor tools
    brief: "The Curve Editor shows each animated value as a line over time, and good motion is shaped there. It has tools that go beyond moving single keys: you can store a copy of a curve, move many keys in time at once, scale groups of keys, and bake a curve into many keys. In this quest you try each of these tools on a simple animated mesh."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-curve-editor-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open any project, or create one from the Third Person template. Open any Level Sequence, or create a new one, and add a mesh from the level to it, such as a cube. Animate the Location of the mesh with at least five keys. Open the Curve Editor from the Sequencer toolbar."
      - "Select the Location Z track in the Curve Editor Outliner. Press F to Zoom to Fit. Try the three View Modes: Absolute, Stacked and Normalized."
      - "Select one key. Turn on Weighted Tangents and stretch a tangent handle. Hold Shift while you move a tangent to snap it to 45 degrees."
      - "Right-click a curve segment and choose Buffer Curves, which stores a copy of the curve. Move some keys. Then right-click and choose Apply 1 Buffered Curves to go back to the stored curve."
      - "Enable the Retime Tool (Ctrl + E). Double-click in the graph to add an anchor. Drag the anchors to move the keys in time."
      - "Enable the Multi Select Tool (Ctrl + M). Select several keys and scale them with Pivot Type set to First Key."
      - "Open the Filter Tool. Bake the selected keys with Use Frame Bake turned on and Bake Interval in Frames set to 2. Then set Post Infinity to Oscillate (Ping Pong) on the curve, which decides how the curve continues after its last key."
    done_when: "Send two screenshots: one of the Curve Editor in Stacked view with the faint image of a buffered curve visible, and one after baking that shows the dense keys and the Oscillate post-infinity. Add one line that says which tool you found most useful."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Which Curve Editor view mode stacks each curve in its own group, normalized between -1 and 1?"
        choices: ["Stacked", "Absolute", "Normalized", "Isolated"]
        answer_index: 0
        explain: "Stacked View Mode separates each curve into its own group and stacks them. Normalized overlaps all curves in one -1 to 1 range."
      - q: "What does Buffer Curves let you do?"
        choices: ["Copy a curve to another track", "Store a curve so you can revert or swap to it after experiments", "Bake keys every frame", "Lock the curve from edits"]
        answer_index: 1
        explain: "Buffering stores a curve. You can Apply the buffered curve to revert, or Swap it. The stored data is lost when you close Sequencer."
      - q: "Can you apply buffered data from one curve onto a different curve?"
        choices: ["Yes, with Swap", "Yes, with copy and paste", "No, buffered data is locked to the curve it was stored on", "Only in Normalized view"]
