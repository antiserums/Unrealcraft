  - id: CQ72
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [metasounds, audio, procedural-sound]
    required_spine: false
    required: false
    title: "MetaSounds: an explosion and a wind bed"
    brief: "MetaSounds is the modern sound system of UE5. A MetaSound Source is a sound that is built from a graph of nodes, so it can create and change audio while the game runs. With it you can make effects and background sound for your shots yourself. In this quest you build two MetaSounds: a bomb that sizzles and then plays a random explosion, and a wind sound that gets stronger when the player moves faster."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/metasounds-quick-start"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/metasounds-reference-guide-in-unreal-engine"
    extra_urls: []
    checklist:
      - "Create a project from the First Person template, or open one. Epic's guide uses sounds from the Starter Content, which current engine versions no longer include, so you use sounds of the engine. To see them, open the Settings menu of the Content Browser and turn on Show Engine Content. Click Add, then Audio, then MetaSound Source, and name the asset MSS_Bomb."
      - "Click the Source button. In Attenuation Settings, create a new Sound Attenuation asset named SA_Bomb."
      - "Build the graph. Drag from the On Play input and create a Wave Player (Mono) node. Set its Wave Asset to the engine sound WhiteNoise and turn on Loop. This is the sizzle. Connect its Out Mono pin to a Mono Mixer (2) node, and connect the Out pin of the mixer to the Out Mono output."
      - "Add a second Wave Player (Mono) for the explosion. Connect its Out Mono pin to the second input of the mixer and its On Finished pin to the On Finished output."
      - "Add a Random Get (WaveAsset:Array) node and connect its Value pin to the Wave Asset pin of the second Wave Player. Connect its On Next pin to the Play pin of the second Wave Player and to the Stop pin of the first one, so that the sizzle stops when the explosion starts."
      - "Drag from the In Array pin of the Random Get node, choose Promote to Graph Variable, and add two short sounds to the array. Two explosion .wav files that you import are best. For a first test, the engine sounds CompileSuccess and CompileFailed work."
      - "Drag from the Next pin of the Random Get node, choose Promote to Graph Input, and rename the new input Explode. Play the MetaSound and press the Execute arrow on the Explode node to hear the random explosion."
      - "Make an Actor Blueprint named BP_Bomb with a Sphere component. From Event BeginPlay, call Set Life Span with 3 seconds, then call Spawn Sound Attached with MSS_Bomb, attach it to the Sphere, and promote its Return Value to a variable. From Event Destroyed, call Execute Trigger Parameter on that variable with In Name set to Explode."
      - "Place BP_Bomb in the level and test it in Play In Editor: you hear the sizzle, and after 3 seconds the bomb disappears and you hear one of the two sounds. Epic's guide does the same in the projectile Blueprint of an older First Person template."
      - "Create MSS_Wind. Remove the UE.Source.OneShot interface and set Output Format to Stereo. Build a graph that goes from Noise to a One-Pole Low Pass Filter to a Stereo Mixer. Put an LFO on the cutoff (0.1 Hz, range 20 to 80), and put a float input named PawnSpeed on the gain."
      - "In the Level Blueprint, call Spawn Sound 2D with MSS_Wind on BeginPlay. On Tick, take the length of the pawn velocity, pass it through Map Range Clamped (200 to 1000 into 0 to 1), and send it to Set Float Parameter with the name PawnSpeed."
    done_when: "Send two screenshots: the MSS_Bomb graph with the Explode trigger input, and the MSS_Wind graph with the LFO and the PawnSpeed input. Add one line that says what happened to the wind when you sprinted."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "What does the guide say a MetaSound gives an audio designer?"
        choices: ["A list of pre-made sound effects", "Complete control over a DSP graph that generates sound sources", "A replacement for Sequencer audio tracks", "A way to import MP3 files"]
        answer_index: 1
        explain: "MetaSound is a high-performance audio system that gives designers complete control over a Digital Signal Processing (DSP) graph to generate sound sources."
      - q: "The bomb is a 3D sound. What does the guide create right after the MetaSound Source?"
        choices: ["A Sound Class", "A Submix", "A Sound Attenuation asset from the Source button's Attenuation Settings", "A Sound Cue that wraps the MetaSound"]
        answer_index: 2
        explain: "Because the bomb is a source in 3D space, you click Source, then create a new Sound Attenuation asset in Attenuation > Attenuation Settings."
      - q: "How is the Explode trigger input made in the graph?"
        choices: ["Drag off the Next pin of Random Get and choose Promote to Graph Input", "Add an Input node from the Palette and name it", "Right-click the On Play node and rename it", "Enable Trigger on the Wave Player"]
        answer_index: 0
        explain: "Dragging off the Next pin and selecting Promote to Graph Input creates a Trigger Input node, which you rename to Explode in the Details panel."
      - q: "How can you fire a trigger input while the MetaSound plays in the editor?"
        choices: ["Press Space", "Click the Play button twice", "Set the input's default value to true", "Click the Execute (down arrow) button on the Trigger Input node"]
        answer_index: 3
        explain: "The Execute (Down Arrow) button on the top-right of a Trigger Input node simulates the trigger while the MetaSound is playing."
      - q: "Why does the guide remove the UE.Source.OneShot interface from the wind MetaSound?"
        choices: ["OneShot makes the sound mono", "It removes the On Finished output, which persistent sounds like ambience and music do not use", "OneShot disables attenuation", "It makes the graph compile faster"]
        answer_index: 1
        explain: "Removing UE.Source.OneShot removes the On Finished Output node, which is not used on persistent sounds such as ambience or music."
      - q: "How do you get Out Left and Out Right outputs instead of Out Mono?"
        choices: ["Add a Stereo Mixer node", "Duplicate the Out Mono node", "Click the MetaSound button and set Output Format to Stereo", "Set the Wave Player to stereo"]
        answer_index: 2
        explain: "In the MetaSound Details, Output Format set to Stereo replaces the Out Mono output with Out Left and Out Right outputs."
      - q: "Which Blueprint node fires the Explode trigger on the spawned bomb sound?"
        choices: ["Execute Trigger Parameter with In Name Explode", "Set Boolean Parameter", "Play Sound at Location", "Trigger Event"]
        answer_index: 0
        explain: "The guide uses Execute Trigger Parameter on the audio component returned by Spawn Sound Attached, with In Name set to Explode, called from Event Destroyed."
      - q: "How is the wind volume linked to the player's movement?"
        choices: ["The MetaSound reads the pawn directly", "A Sound Class ducks it", "Through the Attenuation asset", "Set Float Parameter PawnSpeed on Tick, fed by the pawn velocity length through Map Range Clamped"]
        answer_index: 3
        explain: "Event Tick gets the player pawn velocity, its Vector Length goes through Map Range Clamped (200 to 1000 mapped to 0 to 1) and into Set Float Parameter with In Name PawnSpeed."
    flavors:
      _default: {why: "MetaSounds are the modern sound engine in UE5. Once you can build one, ambience and effects for shots are in your hands."}
      cinematics: {why: "A wind bed that reacts to values gives your shots living atmosphere without editing audio files.", do: "Drive PawnSpeed from a Sequencer float track instead of the player velocity."}
      gameplay_design: {why: "Parameter-driven sound is how gameplay talks to audio.", do: "Add a second trigger input that plays a different sound when the projectile bounces."}
      tech_art: {why: "MetaSound graphs are procedural DSP. That is your language.", do: "Replace the Noise generator with a Wave Player and compare the CPU cost in the audio stats."}

  - id: CQ73
