    required_spine: false
    required: false
    title: VCam operator tools
    brief: "The person who holds a virtual camera is called the operator. The Unreal VCam app gives the operator tools to change how far the camera moves for each real step (scale), how much shaky motion is smoothed (stabilization), and which object the camera rides on (parenting). In this quest you try these tools on a phone or tablet, save bookmarks, and record and rate a take."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-vcam-tools-and-configuration-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/controlling-a-virtual-camera-actor-using-live-link-in-unreal-engine"
    checklist:
      - "You need a supported phone or tablet with the Unreal VCam app for this quest. Open any project, or create one from the Third Person template. Enable the VirtualCamera, Live Link and Take Recorder plugins in Edit > Plugins and restart the editor. Drag a VCam Actor from the Place Actors panel into the level. Put the device on the same network as your PC, open the Pixel Streaming dropdown in the editor, read the Signaling Server URL, enter it in the app and press Connect."
      - "Tap the Wrench icon to open Tools, then open Scale and Gain. Set Axis to Planar and Scale to 2, then lower Joystick Rotation Gain. Walk a few steps and compare the result with Scale 1."
      - "Tap Stabilization. Try Rotation Stabilization at 0x and at 100x while you do a slow pan. Then enable Kill Roll and Local Space Flight Mode, and fly with the left joystick while you look down."
      - "In the editor, place a Cine Camera Attach Mount and name it AM_Hero. Set its Target Actor to a character that moves. For example, drag SKM_Manny_Simple into the level and move it with two Transform keys in a Level Sequence, or use the player character in Play In Editor. In the app, tap the parenting dropdown and attach the camera to AM_Hero."
      - "Create three bookmarks from different positions and move through them with Bookmark Navigation. Check Re-inherit Camera Settings and jump to a bookmark that has a different focal length."
      - "Tap Take Recorder and record a take of 10 seconds. Open the Take Viewer, give the take two stars and a flag, and try the smoothing slider. Then open the Takes Browser and filter by flagged."
    done_when: "Send one screenshot of the app HUD that shows the Scale and Stabilization values and the parent dropdown set to AM_Hero, and one screenshot of the Takes Browser with your flagged take. Add one line that says which stabilization value felt best and why."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What does the Hold toggle do?"
        choices: ["Freezes the virtual camera location and rotation so you can reposition the device without losing the shot", "Pauses the sequence", "Locks the focal length", "Stops Live Link"]
        answer_index: 0
        explain: "Hold freezes the virtual camera's location and rotation. This lets you move the physical device without losing the camera position in the scene."
      - q: "Zero to Parent is tapped on a camera with no parent. Where does the camera go?"
        choices: ["Nothing happens", "To the world origin", "To the last bookmark", "To the PlayerStart"]
        answer_index: 1
        explain: "Zero to Parent snaps the camera onto its parent with a relative location of 0, 0, 0. If there is no parent, it snaps to the world origin."
      - q: "What does Kill Roll change?"
        choices: ["It removes the joystick vertical movement", "It disables rotation along the X-axis so the camera stays level", "It stops recording", "It resets the tilt offset"]
        answer_index: 1
        explain: "Kill Roll toggles whether the virtual camera rotation along the X-axis is disabled, keeping the camera level while the device moves."
      - q: "Local Space Flight Mode is on and you push the left joystick forward while looking down. What happens?"
        choices: ["The camera moves forward on the world plane", "The camera moves down, in the direction it is pointing", "The camera rotates", "The camera teleports"]
        answer_index: 1
        explain: "In Local Space Flight Mode the forward joystick follows the forward direction of the camera, so looking down and pushing forward moves the camera down."
      - q: "You raise the Scale dial to a larger value. How does device movement translate?"
        choices: ["Smaller physical movement gives larger movement in the scene", "Larger physical movement gives smaller movement in the scene", "Only rotation is affected", "Movement is frozen"]
        answer_index: 0
        explain: "Larger scale values translate smaller physical space movement into larger digital space movement. Small values do the opposite."
      - q: "How does a high stabilization value change the camera?"
        choices: ["More responsive and rougher", "Smoother but less responsive", "Faster playback", "No change; it only affects recording"]
        answer_index: 1
        explain: "Higher stabilization gives smoother movement at the cost of responsiveness. Lower values are more responsive but rougher. The page shows 0x, 50x (default) and 100x."
      - q: "Which parents can the handheld operator choose from in the app?"
        choices: ["Any actor in the level", "Only Cine Camera Actors", "Cine Camera Rig Rails, Cine Camera Actors and Cine Camera Attach Mounts", "Only Level Sequence Actors"]
        answer_index: 2
        explain: "The camera can be attached to anything from the desktop, but the handheld options are limited to Cine Camera Rig Rails, Cine Camera Actors and Cine Camera Attach Mounts."
      - q: "A take is marked No Good in the Takes Browser. What happened to the Level Sequence?"
        choices: ["It was deleted", "It was moved to the trash folder", "It is only hidden from the Takes Browser list by default; it still exists", "It was renamed with a NG suffix"]
        answer_index: 2
        explain: "No Good does not delete the level sequence. It only hides it from the Takes Browser list by default, and a filter can show it again."
