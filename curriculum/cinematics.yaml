    title: Cinematic to gameplay without a pop
    brief: "When a cutscene ends, the game gives the character and the camera back to the player. If the pose or the view jumps at that moment, players see a pop. To avoid it, the cutscene animation plays through a Slot in the same Animation Blueprint the character uses in gameplay, and both the animation and the camera blend out at the end. In this quest you set up that Slot, the blends and the player binding, and check the end of the cutscene for a pop."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blend-gameplay-animation-to-cinematic-animation-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-reference-the-player-in-unreal-engine-cinematics"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/dynamic-binding-in-sequencer"
    checklist:
      - "Open a project made from the Third Person template, or create one, and open ABP_Unarmed, the Animation Blueprint of the template character. In Window > Anim Slot Manager, add a slot named CineSlot and save."
      - "In the AnimGraph, add a Slot node and set its Slot Name to CineSlot. Connect it directly before the Output Pose node."
      - "Create a Level Sequence named LS_Outro. Drag BP_ThirdPersonCharacter from the Content Browser into Sequencer to make a spawnable proxy, a stand-in for the player. Add a short animation and a camera with a Camera Cut."
      - "Open the Properties of the animation section and set Slot Name to CineSlot. Drag a blend-out at the end of the section. On the transform section, set When Finished to Keep State."
      - "On the Camera Cut track, enable Can Blend and add a blend-out region. On the Cine Camera, disable Constrain Aspect Ratio."
      - "Right-click the character track and add the tag Player. In the Level Blueprint, call Set Binding by Tag with Get Player Pawn, then Play the sequence."
      - "On the Level Sequence Actor, enable Disable Movement Input and Disable Look at Input. Play in the editor and check if there is a pop at the end."
    done_when: "Send a short video clip (30 seconds or less) of the end of the cutscene, where the game takes over again. Also send screenshots that show the Slot node in the Animation Blueprint, the Properties of the animation section with Slot Name, and the Level Blueprint with Set Binding by Tag. Add one line that says if the blend at the end looked smooth."
    xp: 65
    verify_type: writeup
    quiz:
      - q: "Why can the character not stay in Use Custom Mode when you want to blend from Sequencer to gameplay?"
        choices: ["Custom Mode is a Sequencer-only Animation Blueprint, so it cannot blend with the gameplay one", "Custom Mode is slower", "Custom Mode does not support keyframes", "Custom Mode only works in Play In Editor"]
        answer_index: 0
        explain: "Custom Mode is a special Sequencer-specific Animation Blueprint. To blend, the character must use the same Animation Blueprint it uses in gameplay."
      - q: "Where are Anim Slots stored?"
        choices: ["On the Level Sequence", "On the Skeleton", "On the Skeletal Mesh Actor", "In Project Settings"]
        answer_index: 1
        explain: "Slots are stored on the Skeleton. Clicking Save in the Anim Slot Manager saves the Skeleton."
      - q: "The gameplay Anim Graph adjusts feet with IK on uneven ground. Where should the blend Slot go?"
        choices: ["After Output Pose", "Before the IK adjustment node", "In a separate Animation Blueprint", "It does not matter"]
        answer_index: 1
        explain: "If the Slot runs before the IK node, the IK adjustment still applies to the Sequencer animation. Otherwise the feet may visibly snap when the blend ends."
      - q: "Which setting keeps the character at its final position when the sequence ends?"
        choices: ["Transform section: When Finished = Keep State", "Animation section: Play Rate = 0", "Camera Cut: Can Blend", "Level Sequence Actor: Auto Play"]
        answer_index: 0
        explain: "Right-click the transform section, open Properties, and set When Finished to Keep State."
      - q: "Which two options on the Level Sequence Actor stop the player from fighting the cinematic?"
        choices: ["Loop and Auto Play", "Hide Player and Hide HUD", "Restore State and Keep State", "Disable Movement Input and Disable Look at Input"]
        answer_index: 3
        explain: "Disable Movement Input and Disable Look at Input suppress player input for the whole sequence. Set Cinematic Mode gives finer control."
      - q: "You bind the player pawn with Set Binding by Tag. Allow Bindings from Asset is left enabled. What happens?"
        choices: ["The sequence does not play", "The proxy is deleted", "Both the proxy actor and the player pawn are bound to the track", "The tag is removed"]
        answer_index: 2
        explain: "If Allow Bindings from Asset is enabled, the proxy stays bound too, so both actors are bound to the track. Disable it."
      - q: "Why does the guide use a spawnable made from the Character Blueprint as a proxy instead of the PlayerStart?"
        choices: ["PlayerStart cannot be selected", "PlayerStart has no player mesh to animate", "Spawnables render faster", "PlayerStart is always hidden in Sequencer"]
        answer_index: 1
        explain: "The PlayerStart is only a spawn point. It has no mesh, so a spawnable proxy from the Character Blueprint is used to animate."
      - q: "What does a Replaceable binding do?"
        choices: ["Shows a preview actor while editing and binds to an existing in-game actor at runtime", "Replaces the Level Sequence at runtime", "Swaps the camera each frame", "Deletes the actor when the sequence ends"]
        answer_index: 0
        explain: "A Replaceable binding uses a preview actor in the editor and dynamically binds to an existing actor at runtime. The Quick Bind Resolve to Player Pawn is one example."
