        choices: ["Cycle", "Cycle with Offset", "Linear", "Oscillate (Ping Pong)"]
        answer_index: 3
        explain: "Oscillate (Ping Pong) repeats the curve and mirrors each loop. Cycle repeats using the absolute values, Cycle with Offset compounds."
      - q: "Which tool draws two vertical green anchors that you drag to retime keys?"
        choices: ["Transform Tool", "Retime Tool", "Multi Select Tool", "Filter Tool"]
        answer_index: 1
        explain: "The Retime Tool shows Retime Anchors as vertical green lines. Double-click adds anchors, the Delete (X) button removes them."
      - q: "In the Multi Select Tool, which Pivot Type places the pivot at the left-most selected key?"
        choices: ["Average", "Bound Center", "First Key", "Last Key"]
        answer_index: 2
        explain: "First Key puts the pivot at the location of the left-most selected keyframe."
      - q: "With Use Frame Bake enabled, what does Bake Interval in Frames = 1 do?"
        choices: ["Bakes one key in total", "Bakes every second", "Skips all frames", "Bakes a key every frame"]
        answer_index: 3
        explain: "A value of 1 bakes every frame; higher values skip that number of frames."
      - q: "Selecting tracks in Sequencer filters what the Curve Editor Outliner shows. Which preferences turn that off?"
        choices: ["Synchronize Curve Editor Selection and Isolate Curve Editor to Selection", "Auto Frame Curves and Snap Time to Selection", "Link Curve Editor Time Range only", "Buffered Curves and Curve Tooltips"]
        answer_index: 0
