        choices: ["Seed and Octaves", "Min and Max", "Speed and Phase", "Frequency and Amplitude"]
        answer_index: 3
        explain: "Right-click the track > Double Perlin Noise Parameters lets you edit Frequency and Amplitude."
      - q: "A noise-driven light keeps dropping to zero. What does the docs page suggest?"
        choices: ["Increase Frequency", "Keep a base section at the wanted value and put the noise on an additive section", "Switch the track to Integer", "Turn on Auto Key"]
        answer_index: 1
        explain: "Noise animates relative to 0. Extra additive sections let the noise add on top of a base value so it stays inside a range."
      - q: "With Volumetric Fog on, a fast flickering light leaves lighting trails. What is the documented cause and fix?"
        choices: ["Shadow bias; raise it", "Bloom threshold; lower it", "Temporal reprojection of the fog voxels; set the light's Volumetric Scattering Intensity to 0", "Motion blur; disable it in the camera"]
        answer_index: 2
        explain: "Volumetric Fog uses heavy temporal reprojection, so fast-changing lights leave trails. Setting Volumetric Scattering Intensity to 0 removes that light from the fog."
      - q: "Where do you change which tracks are auto-created when a light is added to Sequencer?"
        choices: ["Editor Preferences > Level Sequence Editor", "The light's Details panel", "Project Settings > Plugins > Level Sequencer > Track Settings", "Window > Sequencer Options"]
        answer_index: 2
        explain: "The Track Settings array in the Level Sequencer plugin project settings maps an Actor class to its default tracks and property tracks."
    flavors:
      _default: {why: "Moving light is mood. A fade, a color shift or a flicker sells a scene faster than a new asset."}
      cinematics: {why: "Practical lights in shots are keyed all the time; noise overrides save hours of hand-keyed flicker.", do: "Key Attenuation Radius through a component track on PL_Lamp and see how the pool of light grows."}
      tech_art: {why: "Perlin noise channels are procedural animation without Blueprint; know the limits (float and transform only).", do: "Override one Transform axis of the lamp with noise and check the Show 3D Trajectory option."}

  - id: CQ67
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [fog, volumetrics, local-fog-volumes, atmosphere]
    required_spine: false
    required: false
    title: "Fog for the frame: local volumes and volumetrics"
    brief: "Fog gives a picture depth and mood. Unreal has two fog tools that matter for shots. A Local Fog Volume is a cheap ball of fog that you place where you need it. Volumetric Fog is a more expensive option of the Exponential Height Fog that lets lights cast visible beams and shadows in the fog. In this quest you use both, measure the cost, and animate the fog in a sequence."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/local-fog-volumes-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/volumetric-fog-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open a level that has an Exponential Height Fog, or add one from the Place Actors panel. Place a subject, such as a mannequin or a cube, and a Point Light near it as a lamp. Place two Local Fog Volumes from the Place Actors panel, or from Create, then Visual Effects. Name them LFV_Ground and LFV_Beam. Put LFV_Ground low behind the subject and LFV_Beam near the lamp. Only scale them equally on all axes."
      - "On LFV_Ground, set a small Radial Fog Density and a larger Height Fog Density. Adjust Height Fog Falloff and Height Fog Offset until the fog sits on the floor."
      - "On LFV_Beam, set Fog Albedo to a warm color and add a small Fog Emissive. Compare Scattering Distribution 0 and 0.8 while you look toward the lamp and away from it."
      - "Make the two volumes overlap. Set Fog Sort Priority so that LFV_Ground is drawn behind LFV_Beam. Take a frame."
      - "Enable Volumetric Fog on the Exponential Height Fog. Note what happens to the sorting. On the lamp, set Volumetric Scattering Intensity to 2 and turn on Cast Volumetric Shadow. Take a second frame."
      - "Run the console command profilegpu once with the volumetric shadow on and once with it off. Write the two costs in a text note."
      - "Add both fog volumes to a Level Sequence. Key the Radial Fog Density of LFV_Beam from 0 to its full value during the shot."
    done_when: "Send two frames of the same shot (one with only the Local Fog Volumes, and one with Volumetric Fog and the volumetric shadow), a screenshot of the Sequencer track with the keyed density, and your note with the two GPU costs."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What shape and falloff does a Local Fog Volume have, and what scaling is not supported?"
        choices: ["Box with linear falloff; rotation not supported", "Any mesh; scaling not supported", "Cylinder; translation not supported", "Sphere with radial falloff; non-uniform scaling not supported"]
        answer_index: 3
        explain: "A Local Fog Volume is a sphere of fog that fades out radially. It can be moved, rotated and scaled uniformly, but non-uniform scale is not supported."
      - q: "In which order are the volumetric elements composed?"
        choices: ["Volumetric Fog, Local Fog Volumes, Exponential Height Fog, Sky Atmosphere", "Exponential Height Fog, Sky Atmosphere, Volumetric Fog, Local Fog Volumes", "Sky Atmosphere aerial perspective, Exponential Height Fog, Local Fog Volumes, Volumetric Fog", "Local Fog Volumes first, then everything else"]
        answer_index: 2
        explain: "The docs list the order: Sky Atmosphere Aerial Perspective, Exponential Height Fog, other Local Fog Volumes, then Volumetric Fog when enabled."
      - q: "Which is a documented advantage of Local Fog Volumes over Volumetric Fog?"
        choices: ["They cast volumetric shadows", "They work across low-end and high-end platforms", "They support any mesh shape", "They are only visible in a set range"]
        answer_index: 1
        explain: "Local Fog Volumes work on all platforms with scalability levels. Volumetric Fog gives shadowing and any shape, but costs more and does not run on some low-end platforms."
      - q: "Where do you turn on Volumetric Fog so it also lights and shadows your Local Fog Volumes?"
        choices: ["On each Local Fog Volume", "In Project Settings > Rendering", "In the Exponential Height Fog Details, the Volumetric Fog checkbox", "On the Sky Atmosphere"]
        answer_index: 2
        explain: "Volumetric Fog is an option of the Exponential Height Fog component. Enabling it there makes local volumes voxelized with lighting and shadowing."
      - q: "How does Fog Sort Priority work, and when is it ignored?"
        choices: ["Higher value draws behind; ignored when the camera moves", "It sets density; ignored at night", "It only affects the Sky Atmosphere", "Lower value is treated as farther away and draws behind; ignored when Volumetric Fog is enabled"]
        answer_index: 3
        explain: "Lower priority means farther away, so it draws behind higher ones. With Volumetric Fog on, volumes are voxelized instead of sorted, so the setting is not used."
      - q: "Scattering Distribution is set to 0. What does that mean?"
        choices: ["Light scatters equally in all directions", "Light scatters mostly toward the light direction", "The fog is invisible", "The fog has no albedo"]
        answer_index: 0
        explain: "0 scatters light equally in all directions. Values close to 1 scatter mainly in the direction of the light, so you must look at the light to see it."
      - q: "You enable Cast Volumetric Shadow on a Spot Light. What does the docs page say about the cost?"
        choices: ["No extra cost", "Only costs on mobile", "About three times more expensive than a non-shadowing point or spot light", "It is free if the light is Static"]
        answer_index: 2
        explain: "Shadow-casting Point and Spot Lights contribute to the shadowing volume textures and cost roughly three times more than non-shadowing ones."
      - q: "You increase the Volumetric Fog View Distance a lot and see banding. Why, and what console variable helps?"
        choices: ["Bloom kernel too small; r.Bloom.Quality", "The fog volume texture has a limited number of Z slices, so a longer distance under-samples; r.VolumetricFog.GridSizeZ", "Shadow cascades; r.Shadow.CSM", "The fog is unlit; r.Fog.Lit"]
        answer_index: 1
        explain: "The fog volume texture has limited Z slices over the view distance. Increasing the distance causes under-sampling; r.VolumetricFog.GridSizeZ raises quality at more cost."
    flavors:
      _default: {why: "Fog gives depth and mood to a frame, and knowing the two fog tools lets you pick the cheap one when it is enough."}
      cinematics: {why: "Shots often need fog only where the camera looks. Local volumes put it there without fogging the whole map.", do: "Key the Fog Albedo color of LFV_Beam so the fog shifts from warm to cold with your light change."}
      level_design: {why: "Local fog volumes are cheap and run everywhere, so you can use them in gameplay areas too.", do: "Place one local fog volume as a mood marker at a doorway and check it in PIE on Low scalability."}

  - id: CQ68
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [depth-of-field, cine-camera, focus, lens]
    required_spine: false
    required: false
    title: Focus that tells the story
    brief: "The sharp part of a picture tells the viewer where to look. A rack focus is a move where the focus shifts from one subject to another during the shot, and it is a classic way to tell a story with the camera. How much of the picture is blurred depends on the aperture (the f-stop number) and the focal length. In this quest you compare f-stops, look at the depth of field layers, and key a rack focus in Sequencer."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-depth-of-field-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/depth-of-field-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Place two subjects in a level, such as two mannequins or two cubes. Place a Cine Camera Actor named CC_Focus so that one subject is near, at about 3 m, and one is far, at about 10 m. Pilot the camera from the Perspective menu of the viewport."
      - "In Lens Settings, set Min FStop to 1.4, Max FStop to 8.0 and Diaphragm Blade Count to 5. Set Current Focal Length to 75 mm. Try Current Aperture 1.4, 2.8 and 5.6, and take a frame of each."
      - "Set Focus Method to Manual and enable Draw Debug Focus Plane. Move Manual Focus Distance from the near subject to the far one. Turn the debug plane off before you take the final frames."
      - "In the viewport, open Show > Visualize > Depth of Field Layers. Find the green, black and blue areas in your shot."
      - "Add CC_Focus to a Level Sequence. Key Manual Focus Distance so that the focus moves from near to far over 2 seconds. Enable Smooth Focus Changes and test two values of Focus Smoothing Interp Speed."
      - "Switch Focus Method to Tracking and pick the far subject as the tracked actor. Move the actor and watch the focus follow it."
      - "Write three lines that give the f-stop you chose for the final rack focus and say why the bokeh (the shape of blurred bright spots) looked like a polygon at one setting."
    done_when: "Send three frames at f/1.4, f/2.8 and f/5.6, one frame of the Depth of Field Layers view, a screenshot of the Sequencer track with the Focus Distance keys, and your three lines."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which three factors does the docs page name as the core of setting up depth of field for a shot?"
        choices: ["ISO, shutter speed, white balance", "Sensor size, bloom and exposure", "Resolution, frame rate and overscan", "Lens focal length, aperture (f-stop) and distance to the subject"]
        answer_index: 3
        explain: "The page lists focal length, aperture and focus distance to the subject as the three things that shape the effect."
      - q: "You lower the f-stop from 5.6 to 1.4. What happens?"
        choices: ["Deeper focus, less blur", "Shallower depth of field, more foreground and background blur", "The image gets brighter", "The field of view narrows"]
        answer_index: 1
        explain: "Smaller f-stop numbers mean a larger aperture and a shallower focal region, so more of the scene is blurred."
      - q: "In Unreal, changing the aperture also changes the exposure of the image. True or false, per the docs?"
        choices: ["True, like a real camera", "True, but only with Manual exposure", "False; aperture does not control light intensity so you do not have to fix exposure at the same time", "False; aperture only changes FOV"]
        answer_index: 2
        explain: "The docs say this choice was made so you do not need to adjust exposure every time you change the f-stop."
      - q: "What does Focus Method = None do on a Cine Camera?"
        choices: ["Uses the Post Process Volume focus", "Auto-focuses on the center of the frame", "Disables depth of field entirely", "Locks focus at 1 m"]
        answer_index: 2
        explain: "None disables DOF. Manual lets you set or animate an exact distance, and Tracking locks focus on a chosen object."
      - q: "Your bokeh shows round circles even though Diaphragm Blade Count is 5. What is the likely reason?"
        choices: ["The Engine Scalability is below Epic, so the diaphragm simulation falls back to circle bokeh", "Blade count only works in the Path Tracer", "Focus Method is Tracking", "The camera is not piloted"]
        answer_index: 0
        explain: "For performance, the diaphragm simulation only runs on Epic and Cinematic scalability. Lower levels use circular bokeh of equal area."
      - q: "In the Depth of Field Layers visualization, what do the colors mean?"
        choices: ["Red near, white focus, black far", "Green near, black in-focus region, blue far", "Blue near, green focus, red far", "Black near, green focus, blue far"]
        answer_index: 1
        explain: "Green is the near (foreground) layer, black is the focal region and blue is the far (background) layer."
      - q: "Min FStop is 1.4 and Max FStop is 4.0. You type 8.0 into Current Aperture. What happens?"
        choices: ["The camera accepts 8.0", "Max FStop is raised to 8.0 automatically", "Depth of field turns off", "It is rejected; Current Aperture only takes values between Min FStop and Max FStop"]
        answer_index: 3
        explain: "Current Aperture only accepts values inside the lens's Min FStop to Max FStop range."
      - q: "Focus Smoothing Interp Speed has no effect on your rack focus. What is the most likely reason?"
        choices: ["Smooth Focus Changes is not enabled, so the speed is ignored", "The sequence frame rate is too low", "Draw Debug Focus Plane is on", "Focus Offset is 0"]
        answer_index: 0
        explain: "The docs state the interp speed is ignored unless Smooth Focus Changes is enabled."
    flavors:
      _default: {why: "Focus is the cheapest way to tell the viewer where to look, and a rack focus is a classic story beat."}
      cinematics: {why: "Every shot has a focus decision. Knowing f-stop, blades and focus methods makes it a choice, not an accident.", do: "Add Focus Offset keys on top of Tracking to lead the focus slightly ahead of a moving actor."}
      animation: {why: "Character shots depend on eyes in focus; Tracking focus plus a debug plane makes that reliable.", do: "Track a character's head bone offset by attaching an empty actor to it and use it as the tracked actor."}

  - id: CQ69
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [bloom, lens-flares, post-process, lens-effects]
    required_spine: false
    required: false
    title: Bloom, flare and dirt on the lens
    brief: "Real lenses are not perfect. Bright lights glow (bloom), throw streaks and ghost shapes (lens flare), and show smudges on the glass (dirt). Adding these effects makes a render look like it was filmed with a camera, but each effect costs render time and needs the right setting. In this quest you set up bloom in two ways, add a dirt mask and a lens flare, and measure the cost."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/bloom-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Build a dark shot: a closed room made from cubes, with a bright emissive sign or a strong lamp in it. Place a Post Process Volume named PPV_Shot and turn on Infinite Extent (Unbound). On PPV_Shot, open Lens, then Bloom. Compare Intensity 0, 1 and 5 with the Standard method, and take frames."
      - "Set Threshold to -1 and look at the whole image. Then raise Threshold until only the sign blooms. Note both values."
      - "Switch Method to Convolution. You need a kernel texture, the image that gives the bloom its shape. Use the default bloom kernel from the engine content (turn on Show Engine Content in the settings of the Content Browser to find it), or import an .exr file with a bright center and name it T_BloomKernel. If you import your own, open it in the Texture Editor, set Mip Gen Settings to NoMipmaps and turn on Never Stream."
      - "Assign the kernel as Convolution Kernel. Try Convolution Scale 1.0 and 0.5 and note the change."
      - "Make a smudge texture in any image editor: a black image with a few soft gray smudges, with a size that is not a power of two, for example 1920 x 1080. Import it as T_DirtMask. Enable Dirt Mask Texture and assign it. Adjust Dirt Mask Intensity and Dirt Mask Tint so that the smudge only shows near the sign."
      - "Open Lens, then Lens Flares. Set Intensity, and raise Threshold until only the sign makes a flare. Change one Tints entry, where RGB is the color and Alpha is the position."
      - "Add Chromatic Aberration Intensity and Vignette Intensity as the final touch. Run profilegpu once with Convolution on and once with Standard, and write three lines about what each lens effect cost you."
    done_when: "Send frames of the shot with Standard bloom, Convolution bloom, the dirt mask and the lens flare. Also send your note with the two profilegpu numbers and the two Threshold values."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What Threshold value makes every scene color contribute to bloom?"
        choices: ["0", "1", "-1", "100"]
        answer_index: 2
        explain: "Threshold is in luminance units, with a one-unit linear ramp. The docs say a value of -1 makes all scene colors contribute."
      - q: "How is standard bloom built, and which blur is the widest?"
        choices: ["One full-resolution blur", "A single FFT convolution", "A radial blur in screen space", "Five Gaussian blurs from 1/2 resolution (Blur1) to 1/32 (Blur5); Blur5 is the widest and cheapest"]
        answer_index: 3
        explain: "Standard bloom combines Blur1 to Blur5 at 1/2 down to 1/32 resolution. Wide blurs should use the low-resolution passes for performance."
      - q: "Per the docs, which projects should use Bloom Convolution?"
        choices: ["Every mobile game", "In-game or offline cinematics and high-end hardware; Standard bloom for most game applications", "Only the Path Tracer", "Projects without HDR"]
        answer_index: 1
        explain: "Convolution is more realistic and energy conserving but costs more. Standard bloom is faster but can brighten the whole image."
      - q: "Which two Texture Editor settings does the page require on a convolution kernel image?"
        choices: ["sRGB on and Streaming Priority high", "Compression Masks and LOD Group UI", "Mips Gen Setting No Mipmaps and Never Stream enabled", "Power of two size and Virtual Texture"]
        answer_index: 2
        explain: "The kernel must be fully on the GPU at full resolution, so no mipmaps and Never Stream. Otherwise a low-res kernel degrades the bloom."
      - q: "What does Convolution Scale do, and what is its default?"
        choices: ["Sets the kernel brightness; default 0", "Sets the relative size of the kernel in viewport units; default 1, mainly used to shrink the bloom", "Sets the kernel center; default 0.5", "Sets the number of blurs; default 5"]
        answer_index: 1
        explain: "Convolution Scale is the kernel's relative size in viewport units. It defaults to 1 and is mostly used to make the bloom smaller."
      - q: "You key Dirt Mask Texture differently on two overlapping Post Process Volumes. What does the docs page warn?"
        choices: ["The textures blend by Blend Weight", "Only the larger texture is used", "It works only with Convolution", "Dirt Mask Texture cannot be blended with other Post Process Volumes"]
        answer_index: 3
        explain: "The Dirt Mask Texture property cannot be blended between Post Process Volumes, unlike most post settings."
      - q: "Why does the docs page say the Lens Flare Threshold should be as high as possible?"
        choices: ["To avoid the performance cost of blurring content that is too dark to see", "To make flares more colorful", "Because low values crash on mobile", "To disable bloom"]
        answer_index: 0
        explain: "Threshold is the minimum brightness where flares start. Higher values skip blurring dark content, which saves performance."
      - q: "In the Lens Flare Tints array, what do the RGB and Alpha values control?"
        choices: ["RGB is the flare color, Alpha is its position", "RGB is position, Alpha is size", "RGB is bokeh shape, Alpha is threshold", "RGB is intensity, Alpha is tint"]
        answer_index: 0
        explain: "Each Tints entry uses RGB for the color of the flare element and Alpha for its position along the flare line."
    flavors:
      _default: {why: "Lens effects say 'camera' to the viewer, but each one has a cost and a right setting."}
      cinematics: {why: "Bloom and flare choices define the finish of a shot. Convolution bloom is made for cinematics, so learn its rules.", do: "Key Bloom Intensity and Lens Flare Intensity in Sequencer so they rise only when the sign turns on."}
      tech_art: {why: "Knowing the multi-resolution blur structure lets you keep bloom cheap on games.", do: "Set #1 Size small and push the width into #4 and #5, then compare profilegpu numbers."}

  - id: CQ70
    rank: 2
