      tech_art: {why: "This is pipeline glue: tokens, project settings and a command line format string.", do: "Add Additional Command Line Args that change the output pixel format and confirm it in the file properties."}
      lookdev: {why: "A fast preview movie lets you check material and light motion without a frame viewer.", do: "Render the same shot at Quality Low and Epic and compare the file sizes."}

  - id: CQ74
