    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/import-and-export-edl-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-render-settings-and-formats-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, with the Movie Render Pipeline plugin enabled. Open Edit > Plugins, go to Media Players, and enable Apple ProRes Media. Restart the editor."
      - "Open a sequence that has at least 3 shots in a Shot track. To make one, click Cinematics in the main toolbar, choose Add Level Sequence with Shots with 3 shots, and add a camera to each shot. Add it as a job in Movie Render Queue. In Settings, add Apple ProRes [10-12bit] with the codec Apple ProRes 422 HQ, and add WAV Audio."
      - "Add Final Cut Pro XML and set Data Source to Sequence Data. In Output, set File Name Format to {sequence_name}/{shot_name}, so that every shot gets its own file."
      - "Click Render (Local). Check the output folder: it should hold one .mov file for each shot, a .wav file and the .xml file."
      - "Import the XML file into editing software, such as DaVinci Resolve (which has a free version), Premiere or Final Cut. Confirm that the shots are in the right order and have the right lengths."
      - "Extra: use the older Render Movie dialog with Output Format set to Video Sequence, {shot} in the file name, and Write Edit Decision List turned on. Import the EDL (edit decision list) and the clips into your editor. Change one cut and export an EDL. Then right-click the Shot track in Sequencer and choose Import EDL."
    done_when: "Send a screenshot of the MRQ settings list (ProRes, WAV Audio, Final Cut Pro XML) and the output folder, and a screenshot of the timeline in your editing software with the shots loaded. Add one line that says which ProRes codec you chose and why."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You render Apple ProRes and the .mov has no sound. Why?"
        choices: ["You forgot to enable the audio track in Sequencer", "ProRes does not export audio; you add a WAV Audio export and combine them in post", "The codec must be 4444 for audio", "The sequence frame rate must be 24"]
        answer_index: 1
        explain: "Apple ProRes (and Avid DNx) export no audio. The page says to add a .wav Audio export and combine it in post-production."
      - q: "Which container does the Avid DNx export write?"
        choices: [".mov", ".avi", ".mp4", ".mxf"]
        answer_index: 3
        explain: "Avid DNx outputs an .mxf file, while Apple ProRes writes .mov. Both need their Media plugin enabled."
      - q: "You need an alpha channel in the ProRes file. Which codecs support it?"
        choices: ["Apple ProRes 4444 and 4444 XQ", "Apple ProRes 422 Proxy", "Apple ProRes 422 HQ", "All ProRes codecs"]
        answer_index: 0
        explain: "Only the 4444 codecs support alpha channels. 4444 XQ keeps 12 bits for RGB and 16 bits for alpha. The 422 family has no alpha."
      - q: "The WAV Audio export is marked experimental. What problem does the page describe?"
        choices: ["It only records the left channel", "It is limited to 8-bit audio", "Audio not controlled by Sequencer can have gaps between shots, because the engine runs warm-up frames between shots", "It cannot be used with EXR"]
        answer_index: 2
        explain: "The renderer runs the engine between shots for warm-up frames, so audio that Sequencer does not control gets gaps, and Sequencer clips may show minor distortion between shots."
      - q: "Which Final Cut Pro XML Data Source should you pick if the XML must be re-imported into Sequencer later?"
        choices: ["Output Metadata", "Sequence Data", "Either, they are identical", "Shot Metadata"]
        answer_index: 1
        explain: "Sequence Data builds the XML directly from the sequence and is intended for re-importing. Output Metadata is built from the files written to disk and does not support re-import."
      - q: "Where can the Final Cut Pro XML export be used?"
        choices: ["Only on macOS", "In any packaged game", "In shipping builds only", "Only in Unreal Editor, not in shipping builds"]
        answer_index: 3
        explain: "Final Cut XML depends on editor-only functionality, so it is not available in shipping builds."
      - q: "For the older Render Movie EDL workflow, what must the Output Format be?"
        choices: ["Video Sequence, with the {shot} token in the file name", "Image Sequence PNG", "EXR", "Any format works"]
        answer_index: 0
        explain: "Writing an EDL only works with Output Format set to Video Sequence and the {shot} token, so each shot becomes its own file. It does not work with individual frames."
      - q: "What are Frame Handles in the EDL export?"
        choices: ["Markers added to the timeline", "Handles on the Sequencer sections", "Extra frames that pad each shot so the editor can adjust cuts", "A way to lock the frame rate"]
        answer_index: 2
        explain: "Frame Handles add a number of extra frames to each shot. The EDL cuts into and out of them, so the editor can move the cuts between shots."
    flavors:
      _default: {why: "Most cinematics are finished in an editing program. Knowing the export formats keeps that hand-off clean."}
      cinematics: {why: "Editors expect shots, timecode and an XML or EDL, not a single long movie.", do: "Set Handle Frame Count to 12 in Output and check the shot lengths in the editor."}
      tech_art: {why: "Format and file-name conventions are the contract between Unreal and post.", do: "Write a one-paragraph delivery spec (codec, container, file names, audio) for your team."}
      lookdev: {why: "10-bit ProRes keeps your grading intact when the picture leaves Unreal.", do: "Compare a 422 Proxy and a 4444 file of the same shot on a gradient sky."}

  - id: CQ76
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [take-recorder, microphone, timecode, sequencer]
    required_spine: false
    required: false
    title: "Take Recorder v2: voice, takes and timecode"
    brief: "A real production records many takes of the same line, with the actor's voice and with timecode. Timecode is a clock value stored with each frame so that picture and sound from different devices can be lined up later. Take Recorder can record a microphone, name the files by rule, and save your list of sources as a preset. In this quest you set up Take Recorder for dialogue, record two takes, and read the timecode and other data of a take."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/take-recorder-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-sequencer-movie-tool-overview"
    checklist:
      - "Open a project made from the Third Person template, or create one, with the Take Recorder plugin enabled. Open Window > Cinematics > Take Recorder and click the Settings (gear) button. In User Settings, set Countdown to 3 and turn Auto Lock off. In the Take Recorder settings, turn Record Timecode on and keep Record Sources Into Sub Sequences on."
      - "Add these sources: the player character (with From Actor), Camera Cuts, and Microphone Audio. In the microphone source, set Audio Asset Name to {slate}_T{take} and Audio Sub Directory to Audio."
      - "Click Presets in the Sources panel and choose Save As Preset. Name the preset TP_Dialogue."
      - "Set the Slate to Line01 and add a short description. Press Play, then press Record. Speak one line while you move the character, and press Esc to stop."
      - "Record a second take. Then try to set the take number back to 1, and click the warning to see it correct the number."
      - "Click Review Last Recording. Double-click the subscene of the character, open the Properties of a section and find the timecode under Section Range Start. Then open the Takes Browser in columns view and read the metadata."
    done_when: "Send a screenshot of Take Recorder with the three sources and the TP_Dialogue preset. Also send a screenshot of the reviewed take that shows the recorded audio track and the timecode in the properties of a section."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What does the Record button in the Sequencer playback controls do?"
        choices: ["It only works with the Take Recorder window open", "It records the whole level", "It records any selected actor into the current sequence, without needing the Take Recorder window", "It starts Movie Render Queue"]
        answer_index: 2
        explain: "Sequencer's own record button starts recording any selected actor into the current sequence and does not require the Take Recorder window."
      - q: "You reuse a take number that already exists. What does the warning offer?"
        choices: ["Click it to change the take number to the next available one", "It deletes the old take", "It merges both takes", "Nothing, recording is blocked"]
        answer_index: 0
        explain: "Take Recorder warns that a take with that number exists and tells you where it is. Clicking the warning changes the number to the next available one."
      - q: "Which of these is NOT a token you can use in the microphone Audio Asset Name?"
        choices: ["{slate}", "{take}", "{day}", "{camera}"]
        answer_index: 3
        explain: "The supported tokens are {day}, {month}, {year}, {hour}, {minute}, {second}, {take} and {slate}. There is no {camera} token."
      - q: "You disable Record Sources Into Sub Sequences. What do you lose?"
        choices: ["Audio recording", "The ability to swap takes per source with the Sequence Take UI", "Timecode metadata", "Camera Cuts"]
        answer_index: 1
        explain: "With it disabled, all sources go into the root sequence and you cannot swap between takes of one source with the Sequence Take UI. You can still copy and paste between sequences."
      - q: "For a Live Link source, Use Source Timecode is disabled. What is the effect?"
        choices: ["Recording stops", "Samples are dropped", "Data is keyed on the Live Link thread with engine time, no timecode track is made, and the link to the source timecode is lost", "The subject is recorded twice"]
        answer_index: 2
        explain: "Without Use Source Timecode, each sample is stamped with engine time, no timecode track is created, and the relationship between the source timecode and the sequence is lost."
      - q: "After recording, all tracks are grayed out and you cannot edit them. Why, and what do you do?"
        choices: ["Auto Lock locked the take; click the Lock button in the Sequencer toolbar or disable Auto Lock before recording", "The sequence is read-only on disk", "The take must be saved first", "You must re-record"]
        answer_index: 0
        explain: "Auto Lock locks the take after recording to prevent edits. Unlock it with the Lock button in Sequencer, or disable Auto Lock in User Settings before recording."
      - q: "What does Remove Redundant Tracks do?"
        choices: ["Deletes empty subsequences", "Merges duplicate actors", "Removes the Camera Cuts track", "Keeps only tracks that actually changed during the recording"]
        answer_index: 3
        explain: "By default Take Recorder records all possible tracks. Remove Redundant Tracks keeps only tracks with changes."
      - q: "Stop at Playback End is enabled on a brand new sequence. When does the recording stop?"
        choices: ["Never, you must press Esc", "At 5 seconds, the default end time of a new sequence", "At 60 seconds", "When the microphone goes silent"]
        answer_index: 1
        explain: "Recording stops when the sequence end time is reached. On new sequences the end time defaults to 5 seconds."
    flavors:
      _default: {why: "Real productions record many takes with voice and timecode. Managing them well saves hours."}
      cinematics: {why: "A scratch voice track recorded with the performance keeps timing honest through the whole edit.", do: "Record a third take with Engine Time Dilation 0.5 and note how the audio and animation line up."}
      animation: {why: "Take Recorder is how you capture performance to clean up later.", do: "Enable Reduce Keys on the actor source and compare key counts before and after."}
      tech_art: {why: "Naming tokens and save directories are pipeline rules a team relies on.", do: "Set Take Save Dir to {slate}/{take} and check the folder tree after two takes."}

  - id: CQ77
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [live-link, live-link-hub, virtual-production, take-recorder]
    required_spine: false
    required: false
    title: "Live Link v2: Hub, controllers and presets"
    brief: "Live Link is the Unreal system that receives live data, such as camera tracking or motion capture, from outside devices. Live Link Hub is a separate application that collects these sources in one place and sends them to one or more editors at once. In this quest you connect a live source through the Hub, let it drive a camera with a Live Link Controller component, save the setup as a preset, and record the data with Take Recorder."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/live-link-hub-quick-start-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/live-link-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-live-link-data-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/take-recorder-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open Edit > Plugins and make sure that Live Link and Live Link Hub are enabled. Restart the editor. Open Tools > Live Link Hub. Confirm that your editor is listed in the Clients panel and that the editor shows the green Live Link Connected banner."
      - "Open Window > Live Link. If no Live Link Hub source is listed, add it with + Add Source."
      - "In Live Link Hub, click + Add Source and connect a real-time source that you have, such as the Unreal VCam app on a phone or tablet, a face app on a phone, or a motion capture tool. Confirm that the subject appears in the Subjects panel of the Hub and in the Live Link panel of the editor with a green light."
      - "Place a Cine Camera Actor and add a Live Link Controller component to it. Set Subject Representation to your subject and check which Component to Control was chosen. Move the source and watch the camera move."
      - "In the Live Link panel, click Presets and choose Save As Preset. Name it LLP_Shot. Then open Edit > Project Settings > Plugins > Live Link and set Default Live Link Preset to LLP_Shot."
      - "Open Take Recorder. Click + Source and choose From Live Link, set the Subject Name, and enable Use Source Timecode. Record a take of 10 seconds and review it in Sequencer."
    done_when: "Send a screenshot of Live Link Hub with your client and subject, a screenshot of the Live Link panel of the editor with a green light, a screenshot of the Live Link Controller details of the camera, and a screenshot of the recorded take in Sequencer. Add one line that says which source you used."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "How do you launch Live Link Hub from inside the editor?"
        choices: ["Window > Cinematics > Live Link Hub", "Tools > Live Link Hub", "Edit > Plugins > Launch", "It starts with the editor automatically"]
        answer_index: 1
        explain: "After the Live Link Hub plugin is enabled and the editor restarts, a new Tools > Live Link Hub entry launches the Hub on your machine."
      - q: "What does the editor message bar show when the Hub connection works?"
        choices: ["A red Recording light", "A Take Recorder icon", "Nothing, you must open the Live Link panel", "A green Live Link Connected banner"]
        answer_index: 3
        explain: "The quick start says the message bar shows a green Live Link Connected banner, or a warning message if there is an error."
      - q: "The Live Link panel in the editor shows no Live Link Hub source. What do you do?"
        choices: ["Add it manually with + Add Source", "Reinstall the plugin", "Restart the Hub only", "Change the engine version"]
        answer_index: 0
        explain: "Normally the Hub source appears by itself. If it does not, the quick start says to add it manually by clicking + Add Source."
      - q: "You want to run Live Link Hub on a computer without Unreal Engine installed. Is that possible?"
        choices: ["No, it needs an engine install", "Only on macOS", "Yes, you can download Live Link Hub from the Epic Games store", "Only through Perforce"]
        answer_index: 2
        explain: "Live Link Hub is a stand-alone application, and the quick start says you can download it from the Epic Games store for machines without Unreal Engine."
      - q: "After you add a Live Link Controller component and pick a Subject Representation, what does Unreal do?"
        choices: ["Creates a new camera", "Selects the Component to Control for you based on the subject, which you can change", "Records a take", "Disables the actor's transform"]
        answer_index: 1
        explain: "Unreal selects the Component to Control based on your subject selection, and a role is assigned automatically. Both can be adjusted."
      - q: "The Camera controller can animate focus distance. What condition does the page give?"
        choices: ["Only with Auto Focus", "Only at 24 fps", "Only with a Cine Camera Actor rig", "It works only with manual focus"]
        answer_index: 3
        explain: "The Camera controller lists focus distance in cm and notes that it works only with manual focus. It also drives field of view, aspect ratio, focal length, aperture and projection mode."
      - q: "Which of these is a documented way to apply a Live Link preset?"
        choices: ["The Apply to Client Blueprint node, the Default Live Link Preset project setting, or the LiveLink.Preset.Apply command line", "Drag the preset into the viewport", "Rename the preset to Default", "Presets apply only from Take Recorder"]
        answer_index: 0
        explain: "Presets can be applied with the Apply to Client node, the Presets button in the Live Link panel, the Default Live Link Preset project setting, or the LiveLink.Preset.Apply command line."
      - q: "A subject in the Live Link panel shows a yellow light. What does it mean?"
        choices: ["The subject is recording", "The role is wrong", "You are connected to the source but no data arrived in the configured time", "The preset is missing"]
        answer_index: 2
        explain: "Green means data is arriving. Yellow means the source is connected but did not deliver data within the time set in Project Settings."
    flavors:
      _default: {why: "Live Link Hub is how modern stages stream tracking and mocap into many editors at once."}
      cinematics: {why: "A tracked camera with a saved preset is a set-up you can reuse on every shoot day.", do: "Add a Transform controller to a light and drive it from the same subject."}
      animation: {why: "Live performance data comes in through Live Link before it becomes an animation asset.", do: "Add a Live Link Pose node in an Animation Blueprint and preview the subject on a Skeletal Mesh."}
      tech_art: {why: "Presets, controllers and timecode settings are the parts a TA sets up for the crew.", do: "Set the source Evaluation Mode to Timecode and note what the page warns about timecode providers."}

  - id: CQ78
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [multi-user-editing, review, collaboration, sequencer]
    required_spine: false
    required: false
    title: "Review together: a Multi-User session for a shot"
    brief: "A review of a shot usually happens with other people. Multi-User Editing lets several Unreal Editors join one shared session, so everyone sees the same level, the same changes and the same sequence playback at the same moment. In this quest you start a session, join it from a second editor, review a shot together, and save the changes of the session into the project."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/getting-started-with-multi-user-editing-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/multi-user-editing-overview-for-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/multi-user-editing-reference-for-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, and make sure it has a Level Sequence with a camera and a light in the level. Open Edit > Plugins, go to Editor, and enable Multi-User Editing. Restart the editor. In Project Settings > Plugins > Multi-User Editing, turn on Enable Multi-User Toolbar Button and set a Display Name and an Avatar Color. Restart again."
      - "Click the Multi-User button in the toolbar (it says Browse). In the Multi-User Browser, click Launch to start a server. Click Create a New Session, name it ShotReview and confirm."
      - "Open a second Unreal Editor with this project. This can be a teammate on the same network, or a second editor on your own PC. Set a different Display Name and color, open the Multi-User Browser, and join ShotReview."
      - "Open the same Level Sequence in both editors. Press Play in one editor and watch it play in the other. Try to stop it from the other editor and note what happens."
      - "In one editor, move a light in the shot. In the other editor, see the change and the new entry in the change history of the session. Then right-click the sequence asset, open Multi-User and choose Lock Asset(s). Try to save the asset from the other editor."
      - "In the first editor, click the arrow of the Source Control button and choose Persist Session Changes. Check the modified files and apply. Then leave the session and delete it from the Multi-User Browser."
    done_when: "Send a screenshot of the Multi-User Browser with both clients connected and the change history visible, and a screenshot of the Persist & Submit Files window. Add three lines that say what happened when you tried to stop the playback, save the locked asset, and delete the session from the second editor."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "A teammate drags an actor in the level during a session. When do you see it?"
        choices: ["When they save the level", "Immediately, even before they release the mouse", "At the end of the session", "Only after Persist Session Changes"]
        answer_index: 1
        explain: "Level changes sync instantly. Dragging creates multiple transactions, so other users see the move before the drag is released."
      - q: "A teammate edits a Material in a session. When do you receive the change?"
        choices: ["Instantly, like level changes", "Never, materials are not shared", "When they save the asset, which sends the saved package and hot-reloads it on your side", "Only if you lock the asset first"]
        answer_index: 2
        explain: "Most assets (Materials, Static Meshes, Blueprints) sync on save. The transaction is the saved asset, and each editor hot-reloads it."
      - q: "One user starts playback of a Level Sequence that several people have open. Who can stop it?"
        choices: ["Only the user who began playback", "Anyone in the session", "Only the session creator", "Only the server"]
        answer_index: 0
        explain: "Playback starts for every user with that sequence open, and only the user who began it can stop it. After it stops, anyone can restart it."
      - q: "Which console command makes the Sequencer UI open on every client when one user opens it?"
        choices: ["Sequencer.SyncClients 1", "MultiUser.OpenSequencer", "Concert.SyncSequencerUI", "Concert.EnableOpenRemoteSequencer"]
        answer_index: 3
        explain: "The overview names Concert.EnableOpenRemoteSequencer for Sequencer UI sync. Playback sync happens anyway, but frame-accurate results between machines are not promised."
      - q: "How do you write the changes made in the session to your project files on disk?"
        choices: ["They are written automatically when you leave", "Source Control button arrow > Persist Session Changes, then choose the files", "File > Save All", "Delete the session"]
        answer_index: 1
        explain: "Session transactions are not in your local files until you persist them. Persist Session Changes opens the Persist & Submit Files window, with an option to submit to source control."
      - q: "Who can delete a session, and what must they do first?"
        choices: ["Anyone connected, at any time", "The server owner while connected", "Only the user who created it, after disconnecting from it", "Only from the command line"]
        answer_index: 2
        explain: "Only the creator sees the delete option, and you cannot delete a session while connected. Other users still connected are disconnected when it is deleted."
      - q: "An asset thumbnail shows a white overlay with another user's avatar. What does that mean for you?"
        choices: ["Another user locked it; you can still change it locally but cannot save until they unlock it", "The asset is deleted", "You own the lock", "The asset is dirty on your machine"]
        answer_index: 0
        explain: "White with avatar means another user holds the lock. Plain white means you locked it. An asterisk means it is modified but unsaved on another computer."
      - q: "Can you undo a change made by another user in the session?"
        choices: ["Yes, with Ctrl+Z", "Yes, from the change history", "Only the session creator can", "No, each user can only undo and redo their own actions"]
        answer_index: 3
        explain: "Each user has only their own operation history. You can undo your own actions, but not those of other users."
    flavors:
      _default: {why: "Reviews happen with other people. A shared session lets everyone see the same shot at the same moment."}
      cinematics: {why: "Directors and leads want to scrub and comment while you adjust the shot live.", do: "Assign a different Avatar Color per role and use the teleport icon to jump to the reviewer's viewpoint."}
      level_design: {why: "Blocking a set together in one session is faster than passing files around.", do: "Move three props while your teammate watches and check the transaction list."}
      tech_art: {why: "Servers, sessions and persisting changes are infrastructure the TA usually owns.", do: "Start the server from the command line using the reference page and connect an editor to it."}
