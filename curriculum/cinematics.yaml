# Unrealcraft — Cinematics major, all ranks. IDs CQ1…
# Difficulty tiers: novice (rank 0) · apprentice (1) · adept (2) · expert (3) · master (4).
# Every URL was checked against the live UE 5.8 docs when written.

quests:
  - id: CQ1
    rank: 0
    difficulty: novice
    track: cinematics
    subjects: [viewport, camera, navigation, piloting]
    required_for_majors: []
    taster_for_majors: []
    adjacent_for: [level_design, lookdev]
    required_spine: false
    elective: true
    title: Bookmarks and camera speed
    time_min: 25
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/viewport-controls-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-cameras-in-unreal-engine"
    checklist:
      - "Open a level with a few meshes. Hold RMB and scroll the mouse wheel to change the camera speed. Find a speed that feels good for close work."
      - "Select one mesh and press F to focus on it. Hold Alt + LMB and drag to orbit around it. Try Alt + RMB (dolly) and Alt + MMB (track)."
      - "Find three nice views of the level. Save each one as a viewport bookmark (Ctrl + 1, Ctrl + 2, Ctrl + 3). Press 1, 2, 3 to jump between them."
      - "Place a Cine Camera Actor (Place Actors > Cinematic). Right-click it in the viewport and choose Pilot CineCameraActor. Move the view with the normal controls."
      - "Click the eject icon to stop piloting. Select the camera again and press Ctrl + Shift + P to pilot it with the keyboard."
      - "Press G to toggle Game View and see the shot without editor icons."
    done_when: "One screenshot of the viewport while piloting the Cine Camera Actor (the pilot bar must be visible at the top of the viewport) and one line saying which camera speed you settled on."
    xp: 30
    verify_type: screenshot
    quiz:
      - q: "How do you change the movement speed of the viewport camera while flying?"
        choices: ["Hold RMB and scroll the mouse wheel", "Press F", "Press G", "Hold Alt and drag with LMB"]
        answer_index: 0
        explain: "Holding RMB and scrolling the wheel increases or decreases the camera movement speed."
      - q: "You selected an object and want the camera to orbit around it. What do you press?"
        choices: ["Press G, then drag with RMB", "Press F to focus, then hold Alt + LMB and drag", "Hold RMB + W", "Press F11"]
        answer_index: 1
        explain: "F focuses on the selected object. Alt + LMB drag then orbits around that pivot."
      - q: "What does the G key do in the Level viewport?"
        choices: ["Groups the selected actors", "Opens the Game settings", "Toggles Game View, hiding editor-only gizmos and icons", "Toggles the grid"]
        answer_index: 2
        explain: "G toggles Game Mode (Game View). The viewport then shows only what would be seen in-game."
      - q: "Which shortcut starts piloting the selected Cine Camera Actor?"
        choices: ["Ctrl + P", "Alt + P", "Shift + F", "Ctrl + Shift + P"]
        answer_index: 3
        explain: "The Cine Camera Actor page lists Ctrl + Shift + P to jump into pilot mode for the selected camera."
      - q: "While piloting a camera, what does the eject icon in the viewport do?"
        choices: ["Deletes the camera", "Stops piloting and unlocks the viewport from the actor, keeping the camera selected", "Resets the camera transform", "Takes a screenshot"]
        answer_index: 1
        explain: "The eject icon exits camera pilot mode. The viewport is unlocked but the camera stays selected."
    flavors:
      _default: {why: "Fast, precise viewport movement is the base skill for every shot you will ever frame."}
      cinematics: {why: "Framing a shot starts with moving the editor camera exactly where you want it, then handing that view to a real camera.", do: "Pilot the camera, frame a shot, then open Editor Preferences > Level Editor > Viewports and lower the camera speed for fine framing."}
      level_design: {why: "Bookmarks let you jump between key spots in your level while you work."}
      lookdev: {why: "Orbit and dolly around one asset is how you inspect materials from every angle."}

  - id: CQ2
    rank: 0
    difficulty: novice
    track: cinematics
    subjects: [cine-camera, filmback, lens, focus]
    required_for_majors: []
    taster_for_majors: []
    adjacent_for: [lookdev, level_design]
    required_spine: false
    elective: true
    title: The Cine Camera Actor
    time_min: 30
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-cameras-in-unreal-engine"
    backup_url: null
    checklist:
      - "Add a Cine Camera Actor with Place Actors (Window > Place Actors > Cinematic)."
      - "Select it. Look at the Picture-in-Picture (PIP) window in the bottom right of the viewport. Click the pin so it stays visible."
      - "In Details, open Filmback. Change the Filmback preset (for example to a 16:9 one) and watch Sensor Width, Sensor Height and Sensor Aspect Ratio change."
      - "Open Lens Settings. Pick a lens preset. Then set Current Focal Length to 24 mm, then 85 mm, and compare the PIP."
      - "Enable Constrain Aspect Ratio in Camera Options and note the black bars in the PIP."
      - "Set Focus Method to Manual and use the eyedropper next to Manual Focus Distance to pick one object."
    done_when: "One screenshot with the Cine Camera Actor selected, its Details panel showing Filmback and Lens Settings, and the pinned PIP visible."
    xp: 30
    verify_type: screenshot
    quiz:
      - q: "What does the Cine Camera Actor add over a normal Camera Actor?"
        choices: ["A built-in Sequencer", "Filmback, Lens and Focus settings that copy real film cameras", "A wider field of view", "Automatic camera cuts"]
        answer_index: 1
        explain: "The page says the Cine Camera Actor is a specialized Camera Actor with Filmback, Lens and Focus settings that replicate real-world film camera behavior."
      - q: "You select a Filmback preset. Which values change?"
        choices: ["Focal Length and F-Stop", "Sensor Width and Sensor Height", "Crop Settings", "Manual Focus Distance"]
        answer_index: 1
        explain: "Filmback presets set the Sensor Width and Height to emulate the chosen camera body. The aspect ratio and base field of view follow from that."
      - q: "Why can you not type a value into Sensor Aspect Ratio?"
        choices: ["It is locked by the Filmback preset until you remove it", "It only changes in Sequencer", "It is read-only and computed from the sensor dimensions", "It is a project setting"]
        answer_index: 2
        explain: "Sensor Aspect Ratio is computed from Sensor Width and Height. It is intended for read-only reference."
      - q: "How do you emulate a prime lens (a lens that cannot zoom)?"
        choices: ["Set Min Focal Length and Max Focal Length to the same value", "Set Squeeze Factor to 1", "Disable Constrain Aspect Ratio", "Set Focus Method to Disable"]
        answer_index: 0
        explain: "The Lens Settings table says to set Min and Max Focal Length to the same value to emulate a prime lens."
      - q: "When does the Picture-in-Picture (PIP) window appear?"
        choices: ["Only while piloting the camera", "Only in Play In Editor", "Only when the camera is in Sequencer", "When a Cine Camera Actor is selected; it hides while you pilot the camera"]
        answer_index: 3
        explain: "Selecting a Cine Camera Actor shows a PIP preview in the bottom right of the viewport. The PIP is not displayed while piloting."
    flavors:
      _default: {why: "The Cine Camera Actor is the camera you will film everything with. Learn its panels once and every shot goes faster."}
      cinematics: {why: "Filmback and lens choices set the look of a shot before you add a single keyframe.", do: "Set Focus Method to Tracking, pick an actor, and enable Draw Debug Focus Plane to see where focus sits."}
      lookdev: {why: "Lens and focus settings decide how your materials are seen in a still or a turntable."}
      level_design: {why: "A quick Cine Camera in the level is the fastest way to check how a space reads from a player-like view."}

  - id: CQ3
    rank: 0
    difficulty: novice
    track: cinematics
    subjects: [screenshots, high-resolution-screenshot, hdr]
    required_for_majors: []
    taster_for_majors: []
    adjacent_for: [lookdev, level_design]
    required_spine: false
    elective: true
    title: High-resolution screenshots
    time_min: 25
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/taking-screenshots-in-unreal-engine"
    backup_url: null
    checklist:
      - "Frame a shot in the viewport. Open Viewport Options and choose High Resolution Screenshot."
      - "Set the Screenshot Size Multiplier to 2 and click the camera icon. Click the message in the bottom right to open the Saved/Screenshots folder."
      - "Click Specify Region, drag a rectangle in the viewport, and take a second screenshot of only that region."
      - "Select one mesh, enable Render CustomDepth Pass in its Details. In the tool, enable Use custom depth as mask and capture again."
      - "Start Play In Editor, press ~ and type HighResShot 3840x2160. Find the file in the same folder."
      - "Compare file sizes and pixel sizes of the four images."
    done_when: "One 2x (or larger) high-resolution screenshot of your shot, plus one screenshot of the Saved/Screenshots folder showing your files with their pixel sizes."
    xp: 30
    verify_type: screenshot
    quiz:
      - q: "Where are screenshots saved by default?"
        choices: ["In the Content folder of the project", "In Saved/Screenshots inside the project folder", "On the Desktop", "In the Engine folder"]
        answer_index: 1
        explain: "By default screenshots go to Saved\\Screenshots\\Windows in your project folder. The message in the bottom right opens that folder."
      - q: "How does the HighResShot command produce an image larger than the screen?"
        choices: ["It lowers the quality of the scene", "It stretches the normal screenshot", "It renders the frame several times, one tile at a time, and joins the tiles", "It uses the Movie Render Queue"]
        answer_index: 2
        explain: "HighResShot renders the game frame multiple times, one tile at a time at full resolution, then concatenates the tiles into one image."
      - q: "What does the command HighResShot 2 do?"
        choices: ["Takes two screenshots", "Takes a screenshot twice as big as the screen resolution", "Takes a screenshot at 2K", "Waits two seconds before the screenshot"]
        answer_index: 1
        explain: "A single number is a multiplier. HighResShot 2 gives an image twice as big as the screen resolution."
      - q: "You want an HDR image from the High Resolution Screenshot Tool. Which option do you enable?"
        choices: ["Use custom depth as mask", "Include Buffer Visualization Targets", "Force 128-bit rendering only", "Write HDR format visualization targets, which writes OpenEXR files"]
        answer_index: 3
        explain: "The tool supports OpenEXR output. Enabling the HDR option writes .EXR files with full 16-bit color depth."
      - q: "What must you enable on an object before Use custom depth as mask can cut it out from the background?"
        choices: ["Render CustomDepth Pass in the object's Details panel", "Cast Shadows", "Constrain Aspect Ratio", "Game View"]
        answer_index: 0
        explain: "The custom depth mask uses the Custom Depth buffer. Objects must have Render CustomDepth Pass enabled to appear in the mask."
    flavors:
      _default: {why: "A clean high-resolution still is the fastest proof of your work, and the format most portfolios use."}
      cinematics: {why: "Storyboard stills and lookdev frames come from this tool long before you render a movie.", do: "Take the same framing at 1x and 4x and compare fine detail like text or thin edges."}
      lookdev: {why: "EXR output and the GBuffer passes let you inspect your materials outside the editor."}
      level_design: {why: "High-res captures of your blockout are great for review documents."}

  - id: CQ4
    rank: 1
    difficulty: apprentice
    track: cinematics
    subjects: [sequencer, level-sequence, keyframes, camera]
    required_for_majors: [cinematics]
    taster_for_majors: []
    adjacent_for: [animation, level_design]
    required_spine: false
    elective: false
    title: Your first Level Sequence
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-sequencer-movie-tool-overview"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-make-movies-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-animate-cinematic-cameras-in-unreal-engine"
    checklist:
      - "In the main toolbar, click the Cinematics dropdown and choose Add Level Sequence. Name it LS_FirstMove and save it in a Sequences folder."
      - "Sequencer opens. Click the Create New Camera button in the Sequencer toolbar. Note that the viewport now pilots the new Cine Camera Actor."
      - "At frame 0, frame a wide view of your level. Select the camera's Transform track and press Enter to set a key."
      - "Drag the playhead to about 5 seconds. Move the camera to a new position. Select the Transform track and press Enter again."
      - "Press Play in Sequencer and scrub the playhead back and forth to check the move."
      - "Select the Level Sequence Actor in the Outliner. In Details, enable Auto Play. Press Play In Editor and watch the move run."
    done_when: "One screenshot of Sequencer showing LS_FirstMove with a Cine Camera Actor track, at least two Transform keyframes, and the Camera Cuts track, plus one line saying how long your move is."
    xp: 110
    verify_type: screenshot
    quiz:
      - q: "What is the difference between a Level Sequence Asset and a Level Sequence Actor?"
        choices: ["They are the same thing with two names", "The Asset lives in the Content Browser and holds the data; the Actor lives in the Level and binds that data to the Level", "The Actor holds the keyframes; the Asset only holds the camera", "The Asset is only used for rendering"]
        answer_index: 1
        explain: "The Level Sequence Asset contains tracks, cameras and keyframes. It is assigned to a Level Sequence Actor in the Level to bind its data to that Level."
      - q: "Which is one correct way to create a Level Sequence?"
        choices: ["Window > Levels > New Level", "Right-click the viewport and choose Add Sequence", "Click the Cinematics dropdown in the main toolbar and choose Add Level Sequence", "Edit > Project Settings > Sequencer"]
        answer_index: 2
        explain: "The Cinematics dropdown in the Level Editor toolbar has Add Level Sequence. You can also right-click in the Content Browser and choose Cinematics > Level Sequence."
      - q: "You click Create New Camera in the Sequencer toolbar. What happens?"
        choices: ["A Camera Actor is placed at the world origin, nothing else", "A Cine Camera Actor is created as a spawnable and the viewport starts piloting it", "The current viewport view is saved as a bookmark", "A Level Sequence Actor is created"]
        answer_index: 1
        explain: "The button creates a Cine Camera Actor as a spawnable for the sequence and updates the viewport to the camera's perspective (piloting)."
      - q: "The fastest way described to set a transform keyframe on the camera is:"
        choices: ["Select the Transform track and press Enter", "Right-click the viewport and choose Add Key", "Press Ctrl + S", "Drag the camera into the timeline"]
        answer_index: 0
        explain: "Select the camera's Transform track and press Enter. This sets a keyframe at the playhead."
      - q: "You open a Level Sequence by double-clicking it in the Content Browser, but no Level that references it is open. What happens?"
        choices: ["Unreal creates a new Level for it", "The sequence opens but its contents are unbound", "The Level Sequence Actor is deleted", "Sequencer refuses to open"]
        answer_index: 1
        explain: "When opening from the Content Browser you must have a Level open that references the sequence. Otherwise the contents are unbound."
      - q: "On the Level Sequence Actor, what does Auto Play do?"
        choices: ["Plays the sequence in the editor every time you save", "Loops the sequence forever", "Renders the sequence to a movie", "Plays the sequence automatically when the actor is created"]
        answer_index: 3
        explain: "Auto Play makes the sequence play automatically when the Level Sequence Actor is created, for example when the level starts."
    flavors:
      _default: {why: "Every cinematic, cutscene and trailer in Unreal starts with a Level Sequence and a camera move."}
      cinematics: {why: "This is the core loop of the major: place a camera, key it, scrub, refine.", do: "Add a third key in the middle of the move and make the camera slow down near the subject."}
      animation: {why: "Sequencer is also where you will place and blend character animation later."}
      level_design: {why: "A short fly-through sequence is the best way to show a level to your team."}

  - id: CQ5
    rank: 1
    difficulty: apprentice
    track: cinematics
    subjects: [sequencer, camera-cuts, editing]
    required_for_majors: [cinematics]
    taster_for_majors: []
    adjacent_for: [animation, level_design]
    required_spine: false
    elective: false
    title: "Camera Cuts: which camera when"
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-camera-cut-track-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-camera-cuts-using-sequencer-in-unreal-engine"
    checklist:
      - "Create LS_ThreeCuts. Add a moving object (a cube with two Transform keys is enough) so there is action to cut on."
      - "Click Create Camera. This makes Cine Camera Actor and a Camera Cuts track. Frame a wide shot at frame 0."
      - "Move the playhead to where you want the first cut. Click Create Camera again for camera 2 and frame a closer shot."
      - "On the Camera Cuts track, click Add Camera (+) and pick camera 2 under New Binding or Existing Bindings. A cut appears at the playhead."
      - "Repeat for a third camera. Drag the touching edges of the cut sections to adjust timing."
      - "Enable the Camera Lock button on the Camera Cuts track and press Play to watch the cuts. Then right-click the track, enable Can Blend, and overlap two sections to try a blend."
    done_when: "One screenshot of Sequencer showing the Camera Cuts track with three sections bound to three different cameras (thumbnails visible), plus one line: at which frame is each cut and why there."
    xp: 120
    verify_type: screenshot
    quiz:
      - q: "What is the job of the Camera Cut Track?"
        choices: ["To store the camera's transform keys", "To choose which camera is active at each point in the sequence", "To render the sequence to disk", "To add depth of field"]
        answer_index: 1
        explain: "The Camera Cut Track controls which camera Sequencer looks through over time, and can blend cameras or blend to and from gameplay."
      - q: "How do you make a cut to another camera at a specific time?"
        choices: ["Move the playhead there, click Add Camera (+) on the Camera Cut Track and pick the camera", "Delete the old camera", "Press S with the camera selected", "Drag the camera actor into the viewport"]
        answer_index: 0
        explain: "Move the playhead to the cut point, then Add Camera (+) creates a new Camera Cut section bound to the chosen camera at the playhead."
      - q: "By default, what is special about the edges of Camera Cut sections?"
        choices: ["They can only be moved with the keyboard", "They snap to whole seconds", "They do not allow gaps or overlaps between cuts", "They cannot be moved at all"]
        answer_index: 2
        explain: "Unlike most sections, Camera Cut sections by default do not allow gaps or overlaps. You drag the touching edges to change cut timing."
      - q: "The viewport is locked to the Camera Cut Track and you cannot move the active camera. What is going on?"
        choices: ["The camera is a spawnable", "The sequence is playing", "The camera has no Transform track", "Viewport camera control is disabled while locked to the Camera Cut Track; enable the camera's own track to move it"]
        answer_index: 3
        explain: "Locking the view to the Camera Cut Track disables viewport camera control. To move or key the active camera, enable that Camera Track first."
      - q: "What does enabling Can Blend on the Camera Cut Track allow?"
        choices: ["Cuts that fade to black", "Overlapping sections that blend transforms and camera properties like focal length and depth of field", "Faster thumbnail rendering", "Mixing two Level Sequences"]
        answer_index: 1
        explain: "With Can Blend on, you can overlap Camera Cut sections and blend from one camera to another, including camera component properties, or blend to and from gameplay."
      - q: "For a long cinematic with many cameras, what does the documentation recommend?"
        choices: ["Put all cameras and cuts in one Camera Cut Track", "Use one camera and animate it everywhere", "Build it from shots, each with a single camera and camera cut", "Use Blueprints instead of Sequencer"]
        answer_index: 2
        explain: "The page does not recommend full-length sequences made of many cameras and cuts in one track. Use shots, each partitioning one camera and one Camera Cut."
    flavors:
      _default: {why: "Editing is choosing which camera the viewer sees and when. The Camera Cuts track is that decision inside Unreal."}
      cinematics: {why: "Cutting on action is the first real editing skill. Everything after this builds on the Camera Cuts track.", do: "Disable Draw Thumbnails on the track and note the editor speed difference on a heavy scene."}
      animation: {why: "Cuts hide and reveal animation; you decide what the audience sees of a performance."}
      level_design: {why: "A three-cut sequence is a quick way to present the key views of a level."}

  - id: CQ6
    rank: 1
    difficulty: apprentice
    track: cinematics
    subjects: [sequencer, keyframes, curve-editor, tangents]
    required_for_majors: [cinematics]
    taster_for_majors: []
    adjacent_for: [animation, tech_art]
    required_spine: false
    elective: false
    title: Keys and curves
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-animation-keyframes-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-curve-editor-in-unreal-engine"
    checklist:
      - "Open LS_FirstMove (or a new sequence) with a camera move of at least two Transform keys."
      - "Select the camera in the viewport and press S at a new time. Check that a full Transform key was added. Try Shift + W for Location only."
      - "Enable Auto Key. Move the playhead, move the camera, and watch keys appear. Open the keyframe options and set it to Key Changed."
      - "Select the last key. Press 4 for Linear, then 5 for Constant, then 1 for Cubic (Auto). Scrub and feel the difference."
      - "Open the Curve Editor from the Sequencer toolbar. Select the Location Z curve, press F to frame it, and drag a tangent handle to add an ease-out."
      - "Add a key with MMB on the curve. Then hold Ctrl + MMB to add one without changing the curve shape. Compare the two."
    done_when: "One screenshot of the Curve Editor showing your camera curve with at least three keys and one edited tangent, plus one line naming which tangent type you used for the final key and why."
    xp: 120
    verify_type: screenshot
    quiz:
      - q: "With an actor selected, pressing S in Sequencer does what?"
        choices: ["Saves the sequence", "Creates a Transform track if needed and keys Location, Rotation and Scale", "Solos the track", "Keys only the Scale"]
        answer_index: 1
        explain: "S creates a Transform Track if there is none and keys the full transform. It also works with focus on the viewport and adds the actor to Sequencer if needed."
      - q: "Auto Key is on but no new keys appear when you move an actor. The most likely reason is:"
        choices: ["Auto Key only works in Play In Editor", "The Curve Editor is open", "The actor is a spawnable", "The track has no keyframes yet; an empty track is not auto keyed"]
        answer_index: 3
        explain: "The track you auto key must already contain keyframes. An empty track will not be auto keyed."
      - q: "Which is the default tangent type for new keys, and what does it do?"
        choices: ["Linear: no easing between keys", "Cubic (Auto): keeps a smooth curve and eases both ends, adjusting itself when keys move", "Constant: holds the value until the next key", "Cubic (Break): separate in and out angles"]
        answer_index: 1
        explain: "Cubic (Auto) is the default. It maintains a smooth curve, eases start and end, and re-adjusts whenever keys are added or moved."
      - q: "You want a value to jump at a key with no interpolation before it. Which tangent do you pick?"
        choices: ["Cubic (User)", "Linear", "Constant", "Weighted"]
        answer_index: 2
        explain: "Constant tangents keep the current value until the next keyframe is reached, like a non-interpolating key."
      - q: "In the Curve Editor, how do you add a key on a curve without changing the shape of the curve?"
        choices: ["Hold Ctrl and click MMB on the curve segment", "Press Enter", "Double-click the curve", "Press Ctrl + D"]
        answer_index: 0
        explain: "MMB on a curve adds a key. Holding Ctrl while clicking MMB adds a key without disturbing the curve structure."
      - q: "Two keys of Location are the same in Sequencer and you set Key Group in the Auto Key options. You edit only the X location. What gets keyed?"
        choices: ["Only X location", "X, Y and Z location", "Location, Rotation and Scale", "Nothing until you press Enter"]
        answer_index: 1
        explain: "Key Group keys all axes within the changed channel. Key Changed keys only the axis that changed, and Key All keys every channel and group."
    flavors:
      _default: {why: "Keys say where; curves say how. The feel of a camera move lives in its tangents."}
      cinematics: {why: "A move that eases in and out reads as intentional. A linear move reads as a machine.", do: "Use Weighted Tangents on one key and stretch the handle to make a very long ease-out."}
      animation: {why: "The same Curve Editor edits animation curves everywhere in the engine."}
      tech_art: {why: "Curve Editor skills carry to Niagara and Curve Assets."}

  - id: CQ7
    rank: 1
    difficulty: apprentice
    track: cinematics
    subjects: [cine-camera, lens, depth-of-field, focus]
    required_for_majors: [cinematics]
    taster_for_majors: []
    adjacent_for: [lookdev]
    required_spine: false
    elective: false
    title: "Lens: focal length, aperture, focus"
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-depth-of-field-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-cameras-in-unreal-engine"
    checklist:
      - "Place a Cine Camera Actor in front of a subject with something in the foreground and something in the background. Pilot the camera."
      - "Set Current Focal Length to 35 mm, then 85 mm. Note how the field of view and the background blur change."
      - "Set Focus Method to Manual. Use the eyedropper on Manual Focus Distance to pick the subject. Enable Draw Debug Focus Plane."
      - "Set Current Aperture to 1.4, then 5.6. Screenshot both."
      - "Set Focus Method to Tracking and set Actor to Track to the subject. Move the subject and check that focus follows. Enable Smooth Focus Changes."
      - "Set Diaphragm Blade Count to 5, then 12, and look at the bokeh shapes on small bright spots in the background."
    done_when: "Two screenshots of the same framing, one at f/1.4 and one at f/5.6, both with the subject in focus, plus one line with your focal length and focus method."
    xp: 120
    verify_type: screenshot
    quiz:
      - q: "You raise the focal length from 50 mm to 100 mm. What happens?"
        choices: ["The field of view gets narrower and out-of-focus areas become more pronounced", "The field of view gets wider", "The image gets brighter", "The focus distance doubles"]
        answer_index: 0
        explain: "As focal length increases the FOV decreases, like zooming in, and background and foreground blur become more noticeable."
      - q: "Which aperture gives a shallower depth of field with more blur?"
        choices: ["f/8.0", "f/5.6", "f/1.4", "They are all the same"]
        answer_index: 2
        explain: "Smaller F-stop numbers create a shallower depth of field with more background and foreground blur. Larger F-stops keep more in focus."
      - q: "In Unreal, changing the F-stop also changes how much light reaches the sensor. True or false?"
        choices: ["True, you must fix exposure every time", "False; the aperture does not control light intensity in Unreal, so exposure stays the same", "True, but only in Sequencer", "False, because Unreal has no exposure"]
        answer_index: 1
        explain: "Unlike a real camera, adjusting the F-stop and diaphragm in Unreal does not control light intensity. This is a deliberate choice so you do not have to re-adjust exposure."
      - q: "Which Focus Method turns depth of field off completely, ignoring even a Post Process Volume?"
        choices: ["Do Not Override", "Manual", "Tracking", "Disable"]
        answer_index: 3
        explain: "Disable turns depth of field off entirely. Do Not Override only stops the camera from influencing it, so other sources like a post process volume still apply."
      - q: "You type 5m into Manual Focus Distance. What does Unreal store?"
        choices: ["An error, the field only accepts numbers", "5 units", "500 cm, because the field is type-aware and converts units", "5 mm"]
        answer_index: 2
        explain: "Manual Focus Distance is in centimeters and is a type-aware field. Typing 5m converts to 500cm."
      - q: "You set Diaphragm Blade Count to 5 but the bokeh stays round. What is a likely cause?"
        choices: ["The Engine Scalability is below Epic, so the diaphragm simulation falls back to circular bokeh", "Blade count only works with Tracking focus", "You need at least 8 blades", "Bokeh is always round in Unreal"]
        answer_index: 0
        explain: "The diaphragm simulation is only supported at Epic and Cinematic scalability. Lower settings fall back to circle bokeh of equal area."
    flavors:
      _default: {why: "Focal length, aperture and focus distance are the three choices that make a frame look like film."}
      cinematics: {why: "Choosing a lens is choosing how the audience feels about the subject. This is the language you will speak in every shot.", do: "Key Manual Focus Distance in Sequencer to do a rack focus from foreground to subject."}
      lookdev: {why: "A long lens with a wide aperture isolates one asset and hides the background."}

