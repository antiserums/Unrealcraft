    brief: "The aspect ratio is the shape of the picture: its width divided by its height. On a Cine Camera Actor the shape comes from the sensor size in Filmback, and Crop Settings can cut the picture to a different shape, such as the wide 2.39 format of cinema films. You should set this before you compose a shot. In this quest you try crops, make the camera preview larger, and use the Cine Capture component to send the camera picture into a texture."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-cameras-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open any project, or create one from the Third Person template. Place a Cine Camera Actor named CAM_Frame in front of a prop, such as a cube or a mannequin. Pick a Filmback preset and write down its Sensor Width and Sensor Height. Enable Constrain Aspect Ratio in Camera Options."
      - "In Crop Settings, choose 2.39. Then choose Custom and type 1.5 into Cropped Aspect Ratio. Compare the black bars in the Picture-in-Picture (PIP) window each time."
      - "Go to Edit > Editor Preferences > Level Editor. Set Camera Preview Size to 8 and check that the PIP gets larger. Pin the PIP so that it stays visible."
      - "In the Post Process settings of the camera, set Vignette Intensity to 0.8. Set Post Process Blend Weight to 0, then to 1, and pilot the camera to see the difference. Also enable Use Field Of View for LOD."
      - "Go to Edit > Plugins, search for CineCameraCapture, enable the plugin and restart the editor. Select CAM_Frame, click Add in the Details panel, and add a Cine Capture Component 2D. Drag it under the CineCameraComponent so that it becomes its child."
      - "Create a Render Target asset, a texture that a camera can draw into. Set it as the Texture Target of the capture component and set Render Target Highest Dimension to 1000. Open the Render Target to see the captured view."
    done_when: "Send one screenshot of the pinned PIP with crop bars and the Details panel showing Crop Settings. Also send one screenshot of the Cine Capture Component 2D under the CineCameraComponent with its Render Target open. Add one line with your sensor size and the render target size you got."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the default value of Crop Settings on a Cine Camera Actor?"
        choices: ["1.77 (16:9)", "No Crop", "2.39", "Custom"]
        answer_index: 1
        explain: "The Crop Settings table lists No Crop, 1.33, 1.77, 2.39 and Custom, and says the default is No Crop."
      - q: "You type a number into Cropped Aspect Ratio. What happens to Crop Settings?"
        choices: ["It stays on the preset you picked", "It resets to No Crop", "It switches to Custom", "It locks until you restart"]
        answer_index: 2
        explain: "Changing the Cropped Aspect Ratio value sets Crop Settings to Custom. Its default value is 0.0."
      - q: "What does Constrain Aspect Ratio draw in the preview?"
        choices: ["A rule-of-thirds grid", "The focus plane", "Black bars that preview the sensor dimensions and their base aspect ratio", "A safe-area frame"]
        answer_index: 2
        explain: "Constrain Aspect Ratio enables black bars which preview the Sensor Dimension and its base aspect ratio."
      - q: "Post Process Blend Weight is set to 0. What does the camera's post process layer do?"
        choices: ["It falls through to other layers, so the camera's own settings have no effect", "It is fully enabled", "It is applied at double strength", "It disables all post processing in the level"]
        answer_index: 0
        explain: "A weight of 1 makes the camera's Post Process layer fully enabled, and 0 causes it to fall through to other layers."
      - q: "Which problem does Use Field Of View for LOD fix?"
        choices: ["Objects popping when the camera moves fast", "Low-quality objects rendered by a far-away camera that is zoomed in on the subject", "Flickering shadows on thin objects", "Wrong depth of field with long lenses"]
        answer_index: 1
        explain: "With this option the field of view influences the level of detail instead of only camera distance. This fixes low-quality objects seen from far-away cameras that are zoomed in."
      - q: "Where must the Cine Capture Component 2D sit in the component tree, and why?"
        choices: ["Anywhere on the actor; components are independent", "Under the root scene component so it captures the whole level", "As a child of the CineCameraComponent, because it relies on settings propagated from that component", "On a separate Scene Capture actor that references the camera"]
        answer_index: 2
        explain: "The page says you must drag the CineCaptureComponent under the CineCameraActor's camera component. The parent-child relationship is required because settings are propagated from the Cine Camera Component."
      - q: "Sensor width is 35 mm, sensor height is 20 mm, Render Target Highest Dimension is 1000. What size is the render target?"
        choices: ["1000 x 1000", "1000 x 571", "1750 x 1000", "1000 x 350"]
        answer_index: 1
        explain: "The aspect ratio comes from the Filmback sensor. The lower dimension is 1000 divided by (35 / 20), which is 571, so the target is 1000 x 571."
      - q: "What is the default Camera Preview Size for the PIP window in Editor Preferences?"
        choices: ["1.0", "10.0", "2.5", "5.0"]
        answer_index: 3
        explain: "The Level Editor preferences list Preview Selected Cameras (enabled by default) and Camera Preview Size, which defaults to 5.0."
    flavors:
      _default: {why: "Aspect ratio and crop decide the shape of every frame you deliver. Set them before you compose."}
      cinematics: {why: "A 2.39 frame and a 16:9 frame need different compositions. The crop and constrain tools show you the real frame while you work.", do: "Frame the same shot at 1.77 and 2.39 and note which headroom you had to change."}
      lookdev: {why: "A Cine Capture Component gives you a live render target of a cine camera, useful for turntables and material review screens."}
      tech_art: {why: "Cine Capture keeps camera settings in one place instead of duplicating them on a Scene Capture actor.", do: "Use the render target as a texture on a plane to build a small in-level monitor."}

  - id: CQ40
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [template-sequences, camera-animation, sequencer, blueprint]
    required_spine: false
    required: false
    title: Reusable camera moves
    brief: "A good camera move should be built once and then used on any camera. A Camera Animation Sequence is an asset that stores a camera move on its own, without a level. You apply it to a camera in a Level Sequence with a Template Sequence track, or play it from Blueprint. In this quest you build two reusable moves, apply them to two cameras, change their strength, and play one from a Blueprint."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/template-sequences-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open any project, or create one from the Third Person template. Right-click in the Content Browser and choose Animation, then Camera Animation Sequence. Name it CAS_PushIn. Open it and notice that a Cine Camera Actor is already bound as a Spawnable."
      - "Key a slow push in: the Transform Location X goes from 0 to 150 over 3 seconds. Right-click the section and set Blend Type to Additive, so that the move is added on top of the position of any camera."
      - "Make a second asset named CAS_Orbit with a Rotation Yaw turn from 0 to 40 over 5 seconds. Set it to Additive too."
      - "Create a Level Sequence named LS_Reuse with two Cine Camera Actors. On the first camera track, click + Track, then Template Sequence, and pick CAS_PushIn. On the second camera, pick CAS_Orbit."
      - "Right-click the CAS_PushIn section and open Property Multipliers. Add the Transform multiplier. Expand the track and set the multiplier to 0.5. Then key it from 0 to 2 over the shot and watch the difference."
      - "Make a Blueprint named BP_CamPlayer. Add a Create Template Sequence Player node with CAS_PushIn. Call Set Binding with the Out Actor and a Cine Camera Actor in the level, then call Play. Test it in Play In Editor."
    done_when: "Send one screenshot of LS_Reuse that shows two Template Sequence tracks, one of them expanded with a keyed Property Multiplier. Also send one screenshot of the BP_CamPlayer graph with Create Template Sequence Player, Set Binding and Play."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which actors can play the animation of a Template Sequence?"
        choices: ["Only the actor that was used to create it", "Any actor of the same class or a class that inherits from the bound class", "Any actor with a Transform", "Only Spawnables created in the same Level Sequence"]
        answer_index: 1
        explain: "Template Sequences reuse animation for actors of a compatible class, the same or inherited, like an animation sequence on a compatible Skeletal Mesh."
      - q: "How do you create a template that is already bound to a camera?"
        choices: ["Right-click the Content Browser and choose Animation > Camera Animation Sequence", "Cinematics > Level Sequence, then add a camera", "Right-click a Cine Camera Actor and choose Make Template", "Use the Camera button in Sequencer"]
        answer_index: 0
        explain: "Animation > Camera Animation Sequence creates a Template Sequence with a default binding to a camera. Opening it shows a Cine Camera Actor already added."
      - q: "In a Camera Animation Sequence, what does the Bind Actor Class button do?"
        choices: ["Adds a second camera", "Locks the sequence so it cannot be edited", "Swaps between the Cine Camera Actor and the Legacy Camera Actor", "Converts the camera to a Possessable"]
        answer_index: 2
        explain: "In a camera template the Bind Actor Class button changes its behavior to swap between the Cine Camera Actor and the Legacy Camera Actor."
      - q: "You drag a Point Light into a Template Sequence that is bound to a Cine Camera Actor. What happens?"
        choices: ["The light is added as a second track", "The current binding changes to the light; a template can hold only one actor", "Sequencer refuses the drop", "The light becomes a child of the camera"]
        answer_index: 1
        explain: "Only a single actor can be added to a Template Sequence. Adding another actor from a different class changes the current binding."
      - q: "Your push-in should add on top of wherever the camera already is. What must you set?"
        choices: ["The section Blend Type to Additive, Relative or Additive from Base", "The Property Multiplier to 2", "The camera to Possessable", "Auto Key on the template"]
        answer_index: 0
        explain: "If the template content is meant to be additive, the animation sections must be set to Additive, Relative or Additive from Base in the Blend Type submenu."
      - q: "How do you apply a template to a camera inside a Level Sequence?"
        choices: ["Drag the template asset into the viewport", "Click + Track on the camera track, choose Template Sequence, and pick the asset", "Add it to the Camera Cuts track", "Right-click the camera and choose Play Template"]
        answer_index: 1
        explain: "In your Level Sequence, click + Track on the actor, navigate to Template Sequence, and select the Template Sequence asset."
      - q: "Which Property Multipliers can you add to a template instance?"
        choices: ["Any property of the actor class", "Only Transform", "Only the properties that have Property Tracks in the template", "Only float properties"]
        answer_index: 2
        explain: "The multipliers available depend on the Property Tracks added to the actor class in the Template Sequence. They typically default to 1 and can be keyframed."
      - q: "In Blueprint, which node decides which actor the runtime template animates?"
        choices: ["Play", "Create Template Sequence Player", "Set Playback Position", "Set Binding on the Template Sequence Player, with the actor connected to its Actor pin"]
        answer_index: 3
        explain: "After Create Template Sequence Player, you call Set Binding with the Out Actor as Target and a reference to the actor you want to animate on the Actor pin, then Play."
    flavors:
      _default: {why: "A good camera move should be built once and reused on any camera. Templates make that possible."}
      cinematics: {why: "Push-ins, orbits and handheld layers are the same on every shot. A library of Camera Animation Sequences saves hours.", do: "Stack CAS_PushIn and CAS_Orbit on the same camera and key their multipliers in opposite directions."}
      animation: {why: "Template Sequences work for any actor class, not only cameras. The same workflow drives props and rigs."}
      gameplay_design: {why: "Create Template Sequence Player lets you trigger a stored camera move from gameplay without a Level Sequence in the map."}

  - id: CQ41
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [camera-shake, template-sequences, sequencer, blueprint]
    required_spine: false
    required: false
    title: Shakes from sequences
    brief: "A camera shake made from noise is fast to set up, but it is random. When you need a shake with one exact feel, such as a single hard hit, you can animate it by hand in a Camera Animation Sequence and use that as the shake. In this quest you build shakes from hand-made animations, combine two patterns in one shake, and play the shakes in Sequencer and from a shake source in the level."
    time_min: 55
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/camera-shakes-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/template-sequences-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Create a Camera Animation Sequence named CAS_Impact that is about 0.5 seconds long: right-click in the Content Browser and choose Animation, then Camera Animation Sequence. Animate a sharp dip of Rotation Pitch that settles back to 0. Leave the blend type of the section as it is."
      - "Make a Blueprint Class from CameraShakeBase and name it CS_Impact. Set Root Shake Pattern to Sequence Camera Shake Pattern, set Sequence to CAS_Impact, and set Play Rate to 1 and Scale to 1."
      - "Create CAS_Rumble with 10 seconds of noisy handheld keys. Make a shake named CS_Rumble with the Sequence pattern. Enable Random Segment and set Random Segment Duration to 1.0, so that each time a random part of the animation plays."
      - "Make a shake named CS_Combo with Root Shake Pattern set to Composite Camera Shake Pattern. Add two Child Patterns: a Perlin Noise pattern with a low amplitude, and a Sequence pattern that uses CAS_Impact. Enable Single Instance."
      - "Create a Level Sequence named LS_Shakes and click the Camera button in the Sequencer toolbar to add a Cine Camera Actor. Go to the frame where the hit should happen. On the Cine Camera Actor track, click + Track, then Camera Shake, then CS_Impact. Right-click the section and open Properties. Set Play Scale to 0.5 and Play Space to World, then compare it with Camera Local."
      - "Place a Camera Shake Source and set its Camera Shake to CS_Rumble, its Attenuation to Linear, and enable Auto Start. Open Window > Camera Shake Previewer, enable Allow Camera Shakes and press Play Selected."
    done_when: "Send one screenshot of the CS_Combo details that shows the Composite pattern with its two child patterns, and one screenshot of the properties of the shake section in Sequencer with Play Scale and Play Space visible. Add one line that says why you turned on Random Segment for CS_Rumble."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "How long does a Sequence Camera Shake play?"
        choices: ["The Duration value in the Timing category", "As long as the Camera Animation Sequence it uses", "One second by default", "Until the sequence section ends"]
        answer_index: 1
        explain: "For the Sequence Camera Shake Pattern, the duration of the shake is based on the length of the camera animation sequence."
      - q: "You build a Camera Animation Sequence only for use as a shake pattern. Must its section be additive?"
        choices: ["Yes, always", "Only if Play Space is World", "No; unlike typical Template Sequence workflows, a shake pattern does not need an additive section", "Only for rotation keys"]
        answer_index: 2
        explain: "The page notes that when creating a Camera Animation Sequence for a camera shake pattern, you do not need to set the section to additive."
      - q: "You enable Random Segment on a long shake animation. What else is required?"
        choices: ["A Random Segment Duration to define the new length of the shake", "A Play Rate above 1", "A Composite parent pattern", "Single Instance enabled"]
        answer_index: 0
        explain: "Random Segment starts the shake at a random point in the animation, and you must set Random Segment Duration to define the new length. This is useful for playing small parts of a very long shake."
      - q: "You set Play Rate to 0.5 on a Sequence pattern. What changes?"
        choices: ["The shake is half as strong", "The shake plays at half speed", "The shake plays twice", "Nothing; Play Rate only affects Perlin patterns"]
        answer_index: 1
        explain: "Play Rate is the speed of the shake. 1 is normal, values below 1 play slower and values above 1 play faster. Scale is the intensity multiplier."
      - q: "What does the Composite Camera Shake Pattern let you do?"
        choices: ["Play a shake on several cameras at once", "Blend two Level Sequences", "Layer Perlin, Wave and Sequence patterns as child patterns in one shake", "Record a shake from Take Recorder"]
        answer_index: 2
        explain: "Composite shakes combine Perlin, Wave and Sequence shakes in a layer system. You add child patterns with the + button next to Child Patterns."
      - q: "Single Instance is enabled and the shake is started again while it is still playing. What happens?"
        choices: ["The second start is ignored", "The shake restarts instead of layering additively", "Both play, doubling the amplitude", "The shake stops"]
        answer_index: 1
        explain: "Single Instance allows only one instance of the shake at a time. Later attempts to play it restart it instead of layering additively."
      - q: "In the Sequencer shake section, what does Play Space set to Camera Local mean?"
        choices: ["The shake is relative to the camera position, making it additive", "The shake uses the Level's coordinates", "The shake uses the rotation typed in User Defined Play Space", "The shake only affects field of view"]
        answer_index: 0
        explain: "Camera Local makes the shake relative to the camera's position, an additive shake. World uses Level coordinates, and User Defined uses the rotation you enter."
      - q: "Which Attenuation type on a Camera Shake Source gives an ease in and out as the camera approaches?"
        choices: ["Linear", "Constant", "Exponential", "Quadratic"]
        answer_index: 3
        explain: "Attenuation can be Quadratic, which provides an ease in and out blend, or Linear, which provides a linear blend between the outer and inner radius."
    flavors:
      _default: {why: "Procedural noise is fast, but a hand-made shake is the only way to get a specific feel."}
      cinematics: {why: "Impacts, landings and explosions each want a designed shake. Sequence shakes give you full control of the curve.", do: "Key a Field of View punch inside CAS_Impact and see how it reads compared to rotation only."}
      gameplay_design: {why: "A Composite shake with Single Instance is the safe way to trigger hit feedback from gameplay without stacking noise.", do: "Fire CS_Combo from Start Camera Shake on a Player Controller when the player lands."}
      animation: {why: "A shake built in a sequence can be timed to the exact contact frame of an animation."}

  - id: CQ42
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [camera-cuts, blending, gameplay, sequencer, blueprint]
    required_spine: false
    required: false
    title: Cuts that blend with gameplay
    brief: "Most cinematics in a game start from gameplay and return to gameplay. If the view jumps suddenly to the cinematic camera, it feels like a hard cut. Sequencer can blend the view smoothly from the gameplay camera into the cinematic camera and back. In this quest you add these blends to an intro sequence and make the sequence animate the real player character by using a tag."
    time_min: 70
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-camera-cut-track-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-reference-the-player-in-unreal-engine-cinematics"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a Level Sequence named LS_Intro. Click the Camera button in the Sequencer toolbar to get a spawnable Cine Camera Actor and a Camera Cuts track, and name the camera CAM_Intro. Frame a wide shot of the start area."
      - "Right-click the Camera Cuts track and enable Can Blend. Drag the upper corner of the cut section at its start and at its end, to create a blend in and a blend out of about one second each."
      - "Drag BP_ThirdPersonCharacter from the Content Browser into Sequencer. This creates a spawnable proxy, a stand-in for the player. Key a short walk. Right-click its track, open Tags, and add the tag Player."
      - "Place a Level Sequence Actor for LS_Intro and create a reference to it in the Level Blueprint. Add Get Player Pawn and Set Binding by Tag. Set Binding Tag to Player, connect Get Player Pawn to Actors, and turn Allow Bindings from Asset off. Then call Play."
      - "Play in Editor. The view should blend from the gameplay camera into CAM_Intro, and back to gameplay at the end."
      - "Right-click the cut section, open Properties and enable Lock Previous Camera. Then open Thumbnails and enable Draw Single Thumbnail. Notice how the height of the track changes."
    done_when: "Send one screenshot of the Camera Cuts track with the blend handles and the section Properties visible, and one screenshot of the Level Blueprint with Set Binding by Tag. Add one line that says what Lock Previous Camera protects you from."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Besides overlapping two cuts, what does blending the edge of a single Camera Cut section give you?"
        choices: ["A slow-motion effect", "A blend of the sequence camera in from or out to gameplay", "A fade to black", "A cut to the next shot"]
        answer_index: 1
        explain: "Dragging the upper corner of a section blends it in and out. Blending a Camera Cut section this way can make the sequence camera blend in or out to gameplay."
      - q: "When two cameras blend, which values are blended?"
        choices: ["Only the location", "Only post process settings", "Only the rotation and field of view", "The transforms and camera component properties such as Depth of Field and Focal Length"]
        answer_index: 3
        explain: "Blending cameras blends the transforms and the camera component properties, for example Depth of Field, Focal Length and other properties."
      - q: "Why would you enable Lock Previous Camera on a cut section?"
        choices: ["To stop the camera from being moved in the viewport", "To keep the outgoing camera from switching if gameplay camera logic changes during a blend from gameplay", "To lock the section timing", "To prevent thumbnails from refreshing"]
        answer_index: 1
        explain: "Lock Previous Camera ensures outgoing cameras do not switch when blending from gameplay. It locks the last used camera as the view to blend from."
      - q: "Why is the PlayerStart actor a poor choice to animate in Sequencer?"
        choices: ["It is not selectable", "It cannot be tagged", "It has no player mesh; it is only the spawn point", "It is deleted at runtime"]
        answer_index: 2
        explain: "PlayerStart is the spawn point and does not include the player mesh or the spawned object, so the page recommends a proxy actor instead."
      - q: "What is the recommended proxy for the player in a sequence?"
        choices: ["A spawnable made by dragging the Character Blueprint into Sequencer", "A static mesh with the same name", "A Camera Actor", "The PlayerStart with a tag"]
        answer_index: 0
        explain: "Dragging the Character Blueprint asset into Sequencer creates a spawnable, temporary Sequencer-only character that does not pollute the level."
      - q: "Set Binding by Tag is called with Allow Bindings from Asset enabled. What goes wrong?"
        choices: ["The sequence does not play", "The tag is deleted", "Nothing; it is the recommended setting", "The proxy remains, so both the proxy and the player pawn are bound to the track"]
        answer_index: 3
        explain: "The page says to keep Allow Bindings from Asset disabled. If it is enabled, the proxy actor is not overridden and both the proxy and the player pawn end up bound."
      - q: "The editor slows down while a sequence with many cuts is open. What does the page suggest?"
        choices: ["Disable Draw Thumbnails, because generating thumbnails has a performance cost", "Remove the Camera Cuts track", "Lower the Quality of the level", "Close the viewport"]
        answer_index: 0
        explain: "Generating thumbnails has a performance cost. If the editor is slow while a sequence is open, try disabling Draw Thumbnails."
      - q: "You add an existing Camera Actor with Add Track > Actor To Sequencer. What is created for you?"
        choices: ["A Shot track", "A Template Sequence", "A Camera Cut Track that is bound to that camera", "A second spawnable camera"]
        answer_index: 2
        explain: "Adding a currently existing Camera Actor this way creates a Camera Cut Track automatically and binds it to the camera."
    flavors:
      _default: {why: "Most in-game cinematics start and end in gameplay. A smooth handover is the difference between a cutscene and a cut."}
      cinematics: {why: "Blending to and from gameplay is a camera skill, not a programmer task. Own the handover.", do: "Try a 2 second blend out that lands exactly on the gameplay follow camera position."}
      gameplay_design: {why: "Rebinding a proxy to the real player pawn is how scripted moments use the player's own character.", do: "Trigger the sequence from a Trigger Volume and confirm the player regains control at the end."}
      level_design: {why: "An intro camera that blends into the player view is the cleanest way to reveal a space."}

  - id: CQ43
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [gameplay-camera-system, camera-rigs, blueprint, data-assets]
    required_spine: false
    required: false
    title: Gameplay Camera rigs
    brief: "The camera that follows the player during the game is a camera too, and it needs design. The Gameplay Camera System is a plugin that lets you build such cameras from nodes. A camera rig is one camera behavior, such as first person or top down, and a Camera Director decides which rig is active. In this quest you build three rigs and switch between them with the keys 1, 2 and 3."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-camera-system-quick-start"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-camera-system-overview"
    checklist:
      - "Make a Third Person project. In Edit > Plugins, enable Gameplay Cameras and restart the editor. Create a Basic level."
      - "Right-click in the Content Browser and choose Gameplay, then Camera Asset. Pick Blueprint Camera Director. Name the asset CA_PlayerCameras."
      - "In Rigs, rename the default rig to FirstPerson. Add a Sequence node, a Boom Arm node with Boom Offset 50, 0, 50, and a Field of View node set to 100."
      - "Add a rig named ThirdPerson. Give it a Sequence node, a Boom Arm with Boom Offset -500, 0, 50, an Input Axis Binding 2D with IA_Look (Clamp Y from -80 to 10, and the Revert Axis Y checkbox turned on, which flips the up and down direction), a Field of View node, a Dampen Position node with Forward Damping Factor 5, and an Occlusion Material. Expose Boom Offset as a Camera Rig Parameter. Then add a rig named TopDown with Boom Offset -1000, 0, 0."
      - "In Transitions of each rig, add an Exit Transition with Smooth Blend. In the Director tab, click + to make CDE_PlayerCameras, and click Build."
      - "In BP_ThirdPersonCharacter, delete CameraBoom and FollowCamera. Add a GameplayCamera component, set Camera to CA_PlayerCameras, and set Auto Activate for Player to Player 0. Make the keys 1, 2 and 3 set an integer variable named ActiveCameraRig."
      - "In CDE_PlayerCameras, add Find Evaluation Context Owner Actor (set to BP_ThirdPersonCharacter). From it, get Active Camera Rig, connect it to a Switch on Int, and call Activate Camera Rig for each rig. Press Play and switch rigs with 1, 2 and 3."
    done_when: "Send one screenshot of the node graph of the ThirdPerson rig, one screenshot of the CDE_PlayerCameras graph, and one Play In Editor screenshot from each of the three rigs (three images or one combined image)."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "What does a Camera Asset contain?"
        choices: ["One Cine Camera Actor and its lens", "A Level Sequence with camera cuts", "A list of Player Controllers", "One or more Camera Rigs, their transitions and the Camera Director"]
        answer_index: 3
        explain: "The Camera Asset holds data about Camera Rigs, transitions and the Camera Director that decides which rig is active during gameplay."
      - q: "Which of these is NOT a Camera Director type in the overview?"
        choices: ["Blueprint Camera Director", "Single Camera Director", "Sequencer Camera Director", "State Tree Camera Director"]
        answer_index: 2
        explain: "The overview lists three director types: Blueprint, Single and State Tree. There is no Sequencer Camera Director."
      - q: "How do you make the Boom Offset of a rig editable from Blueprints?"
        choices: ["Drag from the BoomOffset pin and choose Camera Rig Parameter", "Mark the node as Public", "Add a Camera Variable Collection to the level", "Set the rig to Instance Editable"]
        answer_index: 0
        explain: "In the quick start you drag from the BoomOffset pin and click Camera Rig Parameter to expose the variable to Blueprints."
      - q: "Which two components must you remove from BP_ThirdPersonCharacter before adding the GameplayCamera component?"
        choices: ["Mesh and Capsule", "CharacterMovement and Arrow", "CameraBoom and FollowCamera", "PlayerStart and SpringArm"]
