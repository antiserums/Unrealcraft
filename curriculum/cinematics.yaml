  - id: CQ18
    rank: 3
    difficulty: expert
    specializations: [cinematics]
    subjects: [movie-render-queue, anti-aliasing, output-formats, movie-render-graph]
    required_spine: false
    required: true
    title: MRQ settings that matter
    brief: "The settings of a Movie Render Queue job decide if you get a noisy preview or a clean final frame. The most important ones are the file format, the number of samples (how many times each frame is rendered and averaged to smooth edges and motion blur), and where the files are saved. In this quest you build a final-quality settings list, save it as a preset, and render with it."
    time_min: 100
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-rendering-image-quality-settings-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-render-settings-and-formats-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-rendering-export-formats-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/transitioning-to-the-movie-render-graph-from-movie-render-queue-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/movie-render-pipeline-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. You need a Level Sequence with a camera move. If you have none, choose Add Level Sequence in the Cinematics dropdown of the main toolbar, click the Camera button in Sequencer, and set two keys on the camera. Enable the Movie Render Pipeline plugin if it is off. Open Window > Cinematics > Movie Render Queue and add the sequence as a job. Check that the Map field shows the correct level."
      - "Open the Settings of the job. Delete the default .jpg Sequence [8bit] export. Add an EXR Sequence and a .png Sequence [8bit]."
      - "Add the Anti-Aliasing setting. Set Temporal Sample Count to 8 and Spatial Sample Count to 1. Enable Override Anti-Aliasing and set the method to None."
      - "Add the Console Variables setting. Add one variable that raises quality, for example a higher value for r.MotionBlurQuality. Note that the variable goes back to its old value after the render."
      - "In Output, set File Name Format to {sequence_name}/{shot_name}.{frame_number} and enable Auto Version. Set the Output Directory to a folder named Renders."
      - "Save the settings as a preset named MRQ_Final. Then click Render (Local)."
      - "Extra: switch the job to Movie Render Graph and make a new graph asset. Find where Temporal Samples and Spatial Samples are set in the graph."
    done_when: "Send a screenshot of the Render Settings window that shows your settings list (Output, Anti-Aliasing, Console Variables, and the EXR and PNG exports). Also send a screenshot of the output folder with both an .exr frame and a .png frame. Add one sentence that says why you turned TAA off."
    xp: 180
    verify_type: screenshot
    quiz:
      - q: "Temporal sampling and spatial sampling both add samples. Why does the documentation say it is usually more efficient to put samples into temporal sampling?"
        choices: ["Temporal samples render faster because the GPU skips lighting", "Both give the same anti-aliasing pattern for still objects, and temporal samples also blur moving objects, which hides aliasing", "Spatial samples only work with the Path Tracer", "Temporal samples do not tick the engine, so there is no extra cost"]
        answer_index: 1
        explain: "Any mix of spatial and temporal gives the same offset pattern, so still objects look the same. Temporal samples also produce motion blur on moving objects, which hides aliasing."
      - q: "You set 16 total samples and leave Temporal Anti-Aliasing (TAA) on. What does the documentation recommend?"
        choices: ["Nothing, TAA always benefits from more samples", "Switch the export to EXR so the extra samples are stored", "Enable Override Anti-Aliasing and set the method to None, or raise r.TemporalAASamples to match the sample count", "Lower the Output Frame Rate so TAA has more time per frame"]
        answer_index: 2
        explain: "TAA limits the number of unique sample positions to r.TemporalAASamples, which defaults to 8. With more than 8 samples you should disable TAA (None) or raise that variable."
      - q: "With Temporal Sample Count above 1, what extra step may be needed in Sequencer?"
        choices: ["Extend tracks to cover the time just before the sequence start; some tracks like animation and audio cannot be auto-expanded", "Convert all cameras to possessables", "Delete the Camera Cuts track so every camera is sampled", "Set the sequence frame rate to 60 fps"]
        answer_index: 0
        explain: "The sequence is evaluated on both sides of each frame. Sections are auto-expanded when possible, but animation and audio sections are skipped and you are told to expand them by hand."
      - q: "What does the Console Variables setting do with the variables you add?"
        choices: ["Writes them into DefaultEngine.ini permanently", "Applies them only in the editor viewport, not in the render", "Applies them when the render begins and reverts them when the render completes", "Sends them to the remote render farm only"]
        answer_index: 2
        explain: "Console Variables are set when the render begins so you can use quality settings too expensive for real-time preview. They are reverted after the render."
      - q: "Which statement about the EXR Sequence export is correct?"
        choices: ["EXR applies the sRGB encoding curve like PNG", "EXR clamps values to the 0 to 1 range, so no HDR is kept", "EXR keeps HDR values, and disabling the Tone Curve writes linear values that can go far above 1", "EXR requires the Apple ProRes plugin"]
        answer_index: 2
        explain: "EXR preserves HDR values and no sRGB curve is applied. With the Tone Curve disabled, linear values are written in a 0 to 100 or higher range."
      - q: "Where do you disable the Tone Curve for a render without using an OCIO workflow?"
        choices: ["In the Game Overrides setting", "In the Color Output setting", "In the Burn In setting", "In the High Resolution setting"]
        answer_index: 1
        explain: "Color Output overrides the color space with an OCIO config, and it can also disable the Tone Curve part of post-processing even without OCIO."
      - q: "You render frames -2 to 10 and your compositing tool cannot read negative frame numbers. Which Output property solves this?"
        choices: ["Zero Pad Frame Numbers", "Handle Frame Count", "Output Frame Step", "Frame Number Offset"]
        answer_index: 3
        explain: "Frame Number Offset adds a number to every frame number when writing files, so -2, -1, 0, 1 can become 98, 99, 100, 101."
      - q: "Why does Movie Render Queue have a Render Warm Up Count?"
        choices: ["To let the GPU driver load shaders before the first job", "To rebuild the temporal history after a camera cut, so the first frame is anti-aliased without ghosts of the camera angle before the cut", "To give cloth and particles time to settle before rendering", "To check that the output directory is writable"]
        answer_index: 1
        explain: "The TAA history is cleared at each camera cut to avoid ghosts. Render Warm Up samples rebuild that history right before rendering starts. Engine Warm Up Count is the one for cloth and particles."
      - q: "In Movie Render Graph, how are the anti-aliasing sample settings organized differently from the MRQ config?"
        choices: ["Both are on the Game Overrides node", "Temporal samples are global in the Sampling Method node, and spatial samples are per render layer on the Renderer node", "Both are set on the File Type Output node", "MRG has no sample settings; it always uses 1 sample"]
        answer_index: 1
        explain: "MRG splits them because temporal samples must be set globally, while spatial samples and the anti-aliasing method can differ per render layer on the Renderer node."
      - q: "Which feature is listed as NOT yet supported when using Movie Render Graph?"
        choices: ["EXR output", "Console Variables", "High Resolution (tiled) rendering", "Path Tracer rendering"]
        answer_index: 2
        explain: "The transition page lists nDisplay, High Resolution Rendering, Apple ProRes, Final Cut Pro XML, Prestreaming Recorder and 32-bit post process material rendering as unsupported in MRG."
    flavors:
      _default: {why: "The right MRQ settings are the difference between a noisy preview and a final frame you can deliver."}
      cinematics: {why: "Final pixels are your job. You must know what each sample and format does to the image.", do: "Render the same 24 frames twice: 1 temporal sample and 8 temporal samples. Put both PNGs side by side in your proof."}
      lookdev: {why: "Your materials and lights are only judged on the final render. MRQ decides how they are sampled.", do: "Use a Console Variable to raise one rendering quality setting and compare the frame before and after."}
      tech_art: {why: "Render presets and file name tokens are pipeline glue that other people rely on.", do: "Build a File Name Format that puts each shot in its own folder and includes {version}."}

  - id: CQ19
    rank: 3
    difficulty: expert
    specializations: [cinematics]
    subjects: [lighting, lighting-channels, spawnables, exposure]
    required_spine: false
    required: true
    title: Light a shot, not a level
    brief: "In film, the light is set up again for every shot, because what looks good from one camera can look bad from another. Unreal gives you two tools for this. A Spawnable light exists only while its shot plays, and a lighting channel makes a light affect only the objects that use the same channel. In this quest you give two shots their own lights and lock the exposure so that the brightness does not change by itself."
    time_min: 100
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-lighting-channels-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/spawn-temporary-actors-in-unreal-engine-cinematics"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/auto-exposure-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-animate-lights-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-actor-tracks-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/sequencer-track-list-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a sequence that has at least 2 shots. To make one, click Cinematics in the main toolbar, choose Add Level Sequence with Shots, set Number of Shots to 2, and add a camera to each shot. Place a hero mesh in the level as the main subject, for example SKM_Manny_Simple. In shot 1, drag a Spot Light from the Place Actors panel into Sequencer, so that it becomes a Spawnable. Name it L_Key_Shot01."
      - "Set the Mobility of the light to Movable. Set the character or hero mesh (the main subject of the shot) to Movable too."
      - "On L_Key_Shot01, open Light, then Advanced, and enable only Lighting Channel 1. On the hero mesh, enable Channel 1 in its Lighting category. Confirm that this light does not light the background."
      - "Add keyframes on the Intensity track and the Light Color track, so that the key light changes during shot 1."
      - "Add a Post Process Volume and enable Infinite Extent. Set Exposure Metering Mode to Manual and choose a fixed Exposure Compensation. Drag the playhead between the shots and confirm that the brightness does not drift."
      - "Do the same for shot 2 with a second spawnable light. Play the sequence and check that each light exists only in its own shot."
    done_when: "Send two screenshots, one of shot 1 and one of shot 2 in the viewport. Each must show the Sequencer outliner with its spawnable light (lightning bolt icon) and the Details panel with the Lighting Channel settings. Add one sentence that says why you used Manual exposure."
    xp: 180
    verify_type: screenshot
    quiz:
      - q: "How many lighting channels does Unreal Engine support, and which one is enabled by default on lights and lit Actors?"
        choices: ["8 channels, channel 1 by default", "3 channels, channel 0 by default", "4 channels, none by default", "2 channels, both by default"]
        answer_index: 1
        explain: "The page says the engine supports up to 3 lighting channels, and Directional, Spot and Point Lights plus lightable Actors all have channel 0 enabled by default."
      - q: "For a light to affect only your hero mesh through channel 1, what must be true?"
        choices: ["Only the light needs channel 1 enabled", "Only the mesh needs channel 1 enabled", "Channel 1 must be enabled on both the light and the mesh", "The mesh must have channel 0 disabled on the light's Details panel"]
        answer_index: 2
        explain: "Lights only affect objects when their lighting channels overlap. You must enable the channel on both the Actor and the light."
      - q: "Your lighting channel setup does nothing on a Static Mesh Actor. What is the most likely cause per the documentation?"
        choices: ["The mesh Mobility is Static; channels are applied dynamically and need Movable meshes and Stationary or Movable lights", "The light is a Spot Light, which does not support channels", "The mesh has Nanite enabled", "You did not rebuild lighting"]
        answer_index: 0
        explain: "Lighting channel influence is dynamic. It does not work with Static lights or Static-mobility meshes. Movable meshes with Stationary or Movable lights do work."
      - q: "Which materials are affected by lighting channels?"
        choices: ["All materials including translucent", "Only translucent and masked materials", "Only direct lighting on opaque materials", "Only unlit materials"]
        answer_index: 2
        explain: "The Limitations section says lighting channels only affect direct lighting on opaque materials; translucent or masked materials will not work."
      - q: "Where do you find the Lighting Channels property on a light versus on a lit Actor?"
        choices: ["Both are in the Rendering category", "On the light under Light > Advanced; on the Actor under the Lighting category", "On the light under Transform; on the Actor under Collision", "Both are only in Project Settings"]
        answer_index: 1
        explain: "For lights, the property is in the Advanced pulldown of the Light category. For lightable Actors it is in the Lighting category of the Details panel."
      - q: "Why does the Spawnables documentation suggest adding shot lights as Spawnables instead of placing them in the level?"
        choices: ["Spawnable lights render with higher quality", "They exist only for that shot and do not clutter the level with lights that must be enabled or disabled by hand", "Spawnable lights ignore lighting channels", "Placed lights cannot be keyframed"]
        answer_index: 1
        explain: "The Lighting Scenes workflow says spawnable lights exist only for the shot, so you avoid many level lights that need manual enabling and disabling per shot."
      - q: "What happens automatically when you add a light Actor to Sequencer?"
        choices: ["A Transform track and an Animation track are created", "The light is converted to a Spawnable", "The light Mobility is set to Movable", "A Light Component with Intensity and Light Color property tracks is created"]
        answer_index: 3
        explain: "Track Settings in the Level Sequencer plugin settings make Light Actors automatically create a Light Component with Intensity and Light Color tracks."
      - q: "You want the exposure to stay fixed across every shot. Which Exposure Metering Mode gives a single fixed exposure value?"
        choices: ["Auto Exposure Histogram", "Auto Exposure Basic", "Manual", "Local Exposure"]
        answer_index: 2
        explain: "Manual mode lets you pick one fixed exposure value that is not affected by scene luminance. Histogram is the default auto mode and Basic is a faster auto mode."
      - q: "What does Exposure Compensation do on top of the metered exposure?"
        choices: ["It adds a scale of 2 to the power of the compensation value", "It multiplies exposure by the value directly, so 3 means 3 times brighter", "It changes the histogram bin count", "It only works in Manual mode"]
        answer_index: 0
        explain: "The page defines Exposure Compensation as an additional scale of 2^ExpComp on top of the exposure from the current metering mode (except with the editor EV100 override)."
      - q: "You mute a light's Object Binding Track in Sequencer to check a shot. What does the documentation say happens?"
        choices: ["The light is deleted from the level", "The Actor is hidden in the viewport, but this is editor-only and does not affect the level at runtime unless previewing in PIE", "The light is baked into a lightmap", "All other tracks are muted as well"]
        answer_index: 1
        explain: "Muting an Object Binding Track hides the Actor in the viewport. Mute and solo are editor-only operations and do not change the level at runtime."
    flavors:
      _default: {why: "Film lighting is per shot. Channels and spawnables let you cheat the light without breaking the level."}
      cinematics: {why: "A shot needs its own key, fill and rim, and it must not leak into the next shot.", do: "Add a rim light on channel 2 that lights only the hero and keyframe its intensity to fade out at the cut."}
      lookdev: {why: "Channels let you light a material test object without touching the rest of the scene.", do: "Put a lookdev sphere on channel 2 with its own light and show the background unaffected."}
      level_design: {why: "Cinematic lights should not become permanent level lights that cost performance.", do: "Confirm none of your shot lights exist in the Outliner when the sequence is not playing."}

  - id: CQ20
    rank: 3
    difficulty: expert
    specializations: [cinematics]
    subjects: [post-process, color-grading, tonemapper, lut, ocio]
    required_spine: false
    required: true
    title: Grade the picture
    brief: "Color grading means changing the colors, contrast and brightness of the finished picture to give it a certain look. In Unreal you do this in a Post Process Volume, an actor that changes how the image looks inside its area. A base volume holds the look of the whole project, and smaller volumes with a higher Priority change single shots. In this quest you set up both, try a LUT (a small texture that remaps colors), and give a camera its own lens look."
    time_min: 100
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/color-grading-and-the-filmic-tonemapper-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-lookup-tables-for-color-grading-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/color-management-with-opencolorio-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-cameras-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, and work in any lit level with a few objects. Place a Post Process Volume and name it PPV_Grade_Base. Enable Infinite Extent (Unbound) and set Priority to 0. This volume holds the look of the whole project."
      - "In PPV_Grade_Base, set the Film settings (Slope, Toe, Shoulder) once. Do not change them again after that."
      - "Add a second volume named PPV_Shot02 around one area of the level, the place where a second shot would be filmed. Give it Priority 1 and a Blend Radius. Grade it in Color Grading: first use Global (Saturation, Contrast, Gamma), then Shadows and Highlights."
      - "Set Temperature Type to White Balance. Adjust Temp until white objects look white under the main light of the level."
      - "Take a high-resolution screenshot and build a LUT from it in an image editor. Import the LUT, set Mip Gen Settings to NoMipMaps and Texture Group to Color Lookup Table, and try it in Color Grading, under Global. Then turn the LUT off and match the same look with the grading wheels."
      - "Place a Cine Camera Actor. On it, set Post Process Blend Weight to 1 and add a small Vignette. This way the camera carries its own lens look."
      - "Extra: create an OpenColorIO Configuration Asset and add a Color Output setting to a Movie Render Queue job."
    done_when: "Send before and after screenshots of one shot (one without the grade and one with it). Also send a screenshot of the Details panel of PPV_Shot02 that shows Priority, Blend Radius and your Color Grading values. Add one sentence that says why the Film settings are only in the base volume."
    xp: 175
    verify_type: screenshot
    quiz:
      - q: "Which industry standard does the Unreal filmic tonemapper match?"
        choices: ["Rec. 2020", "DCI-P3", "sRGB IEC 61966", "ACES (Academy Color Encoding System)"]
        answer_index: 3
        explain: "The page says the filmic tonemapper matches the ACES standard for television and film, so color stays consistent across formats and displays."
      - q: "The documentation says the Film settings (Slope, Toe, Shoulder, clips) should be used how?"
        choices: ["Keyframed per shot for artistic control", "Project-wide for one look, not changed per shot; use Color Grading for shot adjustments", "Only when rendering to EXR", "Only inside a Cine Camera post process layer"]
        answer_index: 1
        explain: "Film properties are recommended for a project-wide look and should not change dynamically or shot by shot. Artistic per-shot changes belong in Color Grading."
      - q: "What does a larger Slope value do to the tonemapper curve?"
        choices: ["Makes the S-curve steeper and the image darker", "Makes the S-curve flatter and the image lighter", "Moves the black clip point", "Increases bloom"]
        answer_index: 0
        explain: "Slope adjusts the steepness of the S-curve. Larger values make it steeper (darker), lower values less steep (lighter)."
      - q: "Why are the Color Grading controls said to work better than a LUT for HDR output?"
        choices: ["They run on the GPU while LUTs run on the CPU", "They work in Scene Referred Linear Space before tonemapping, so one grade looks correct on both HDR and LDR displays", "LUTs cannot desaturate an image", "LUTs are limited to 8 colors"]
        answer_index: 1
        explain: "A LUT is applied in LDR after tonemapping and is a snapshot for one display. Color Grading happens before tonemapping in scene-referred linear space, so it stays consistent on any display."
      - q: "What is the layout of a LUT texture that Unreal expects?"
        choices: ["A 32x32x32 cube saved as a .cube file", "A 1D 256x1 gradient strip", "A 16x16x16 color-neutral LUT unwrapped to a 256x16 texture", "A 512x512 square with three gradients"]
        answer_index: 2
        explain: "The LUT page says Unreal uses a 16x16x16 color neutral LUT unwrapped to a 256x16 texture."
      - q: "After importing your LUT texture, which Texture Editor settings does the page recommend?"
        choices: ["Compression: Normalmap, sRGB on", "Power of two padding and Streaming enabled", "Virtual Texture Streaming on", "Mip Gen Settings: NoMipMaps and Texture Group: Color Lookup Table"]
        answer_index: 3
        explain: "For best results the LUT image should use Mip Gen Settings NoMipMaps and Texture Group Color Lookup Table before it is used in a Post Process Volume."
      - q: "Your image is too dark and you are tempted to raise Global Gain. What does the workflow advice say?"
        choices: ["Gain is the correct tool for exposure", "Use Offset instead of Gain for exposure", "Do not use Gain for exposure; adjust Exposure Bias in the Lens > Auto-Exposure section instead", "Lower Slope to brighten the frame"]
        answer_index: 2
        explain: "The workflow section says not to use Gain to adjust exposure. Gain is for fine color tweaks; use Exposure Bias under Lens > Auto-Exposure."
      - q: "Two Post Process Volumes overlap the same shot. Which one wins?"
        choices: ["The one with the larger Blend Radius", "The one placed first in the Outliner", "The one with the higher Priority; the order is undefined if priorities are equal", "The one with Infinite Extent enabled always wins"]
        answer_index: 2
        explain: "Priority decides: the highest priority overrides lower ones. If two overlapping volumes share a priority the order is undefined."
      - q: "On a Cine Camera Actor, what does a Post Process Blend Weight of 0 do?"
        choices: ["Turns the camera's post process layer fully on", "Makes the camera's post process layer fall through to other layers, so it has no effect", "Disables all Post Process Volumes in the level", "Locks exposure to EV100 0"]
        answer_index: 1
        explain: "A weight of 1 makes the camera post process layer fully enabled; 0 causes it to fall through to other layers."
      - q: "Where does OpenColorIO fit into a Movie Render Queue render?"
        choices: ["MRQ can apply a color space transformation from an OpenColorIO Configuration Asset to the output image sequence", "OCIO only works in the viewport, not in exports", "OCIO replaces the Film settings in the Post Process Volume", "OCIO is only for nDisplay LED walls"]
        answer_index: 0
        explain: "The OCIO page lists exporting through Movie Render Queue as one place where a color space transformation from an OCIO Configuration Asset can be applied to the output."
    flavors:
      _default: {why: "Grading is the last thing between your render and the viewer's eyes. Do it in the right place and in the right order."}
      cinematics: {why: "Every shot needs a consistent base look plus a per-shot grade that cuts cleanly with the next one.", do: "Grade two adjacent shots so the cut between them does not jump in brightness or temperature."}
      lookdev: {why: "You must know when a look comes from the material and when it comes from the grade.", do: "Take a screenshot with Show > Post Processing off and compare it to the graded frame."}
      tech_art: {why: "OCIO and LUT pipelines are how Unreal talks to compositing tools.", do: "Set up an OCIO Configuration Asset and describe in one line what it references."}

  - id: CQ21
