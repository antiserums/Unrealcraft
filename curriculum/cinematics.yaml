        choices: ["The property cannot be keyframed, so it has no track Sequencer can play back", "The actor is too far from the camera", "The take number is too high", "Only cameras can be recorded"]
        answer_index: 0
        explain: "Take Recorder only records a source that has a recorder and a track Sequencer can play. If a property cannot be keyframed, it cannot be recorded."
      - q: "You add Camera Cuts as a source. What does Take Recorder do when the active camera changes during recording?"
        choices: ["Stops the recording", "Creates a new camera actor and a new camera cut section", "Ignores the new camera", "Records only the first camera"]
