    title: One click to a video file with the Command Line Encoder
    brief: "Movie Render Queue normally gives you a folder of single images, but clients usually want one video file. The Command Line Encoder is an MRQ setting that starts an outside program, FFmpeg, at the end of the render to join the images and the sound into one movie. FFmpeg is a free tool that converts video and audio. In this quest you connect FFmpeg to Unreal and render a sequence directly to a video file."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-rendering-export-formats-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-render-settings-and-formats-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-rendering-image-quality-settings-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, with the Movie Render Pipeline plugin enabled. Install FFmpeg on your PC. Note the full path to the file ffmpeg.exe."
      - "Open Edit > Project Settings > Plugins > Movie Pipeline CLI Encoder. Set Executable Path to your ffmpeg.exe."
      - "In the Output Log, run MovieRenderPipeline.DumpCLIEncoderCodecs and find the codec names. A codec is the method used to compress video or audio. Set Video Codec to libvpx-vp9, Audio Codec to libvorbis, and Output File Extension to mkv. This is the example from the documentation page."
      - "Set Encode Settings High to -crf 20 -b:v 0. Leave the Command Line Format and the input formats at their defaults."
      - "Open Movie Render Queue and add a Level Sequence as a job. Any sequence with a camera works, and it is best if it also has an Audio Track with a sound. In Settings, add .jpg Sequence [8bit], WAV Audio and Command Line Encoder. Set Quality to High. Leave Delete Source Files off."
      - "Click Render (Local). Open the .mkv file and check that the picture and the audio play together."
      - "Extra: set File Name Format Override on the encoder to {sequence_name}_master, so that one movie is made even when the shots go to separate folders. Render again with Delete Source Files on."
    done_when: "Send a screenshot of the Movie Pipeline CLI Encoder project settings, a screenshot of the MRQ settings list with the three exports, and a screenshot of the output folder that shows the .mkv file (and the .wav file). Add one line with the exact codec names you used."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You add only the Command Line Encoder to a job and render. What is wrong?"
        choices: ["Nothing, the encoder renders frames by itself", "You also need the Path Tracer pass", "The encoder needs an image sequence export in the same job, plus a WAV Audio export if you want sound", "You need to enable the Apple ProRes plugin first"]
        answer_index: 2
        explain: "The Command Line Encoder builds a movie from an image sequence, so an image sequence export is required. Audio needs a .wav Audio export too."
      - q: "Where do you set the path to the encoder executable?"
        choices: ["In the MRQ Output setting", "Edit > Project Settings > Plugins > Movie Pipeline CLI Encoder", "In the Command Line Encoder setting of each job", "In DefaultGame.ini only"]
        answer_index: 1
        explain: "The Executable Path, codecs, extension and encode settings live in the Movie Pipeline CLI Encoder project settings under Plugins."
      - q: "Which console command lists valid codecs for your encoder?"
        choices: ["MovieRenderPipeline.DumpCLIEncoderCodecs", "ffmpeg -codecs", "r.MovieCodecs 1", "MRQ.ListCodecs"]
        answer_index: 0
        explain: "Running MovieRenderPipeline.DumpCLIEncoderCodecs in the Output Log queries the executable and prints the audio and video codecs. It needs Executable Path set first."
      - q: "How should the Output File Extension be written?"
        choices: ["With a leading period, like .mp4", "As a full file name", "In upper case", "Without the period, like mp4, mkv or webm"]
        answer_index: 3
        explain: "The extension is written without the period. You must also pick a container that matches your codec."
      - q: "You set Quality to High in the encoder details. Which value is used?"
        choices: ["A fixed bitrate chosen by Unreal", "The Encode Settings High string from the project settings", "The value of r.ScreenPercentage", "The highest bitrate FFmpeg supports"]
        answer_index: 1
        explain: "The {Quality} token inserts the Encode Settings Low, Med, High or Epic string from the project settings, depending on the Quality chosen on the job."
      - q: "What does Delete Source Files do?"
        choices: ["Deletes the Level Sequence after the render", "Clears the Output Directory before rendering", "Deletes the source image sequence after the movie is encoded, so only the movie remains", "Removes the temporary input text file only"]
        answer_index: 2
        explain: "With Delete Source Files enabled, the image sequence is deleted after encoding finishes and only the movie is left."
      - q: "Which statement about encoding passes is true for the Command Line Encoder?"
        choices: ["Only single pass encoding is supported", "Two-pass encoding is the default", "It always encodes twice for audio and video", "Passes are set by the Quality field"]
        answer_index: 0
        explain: "The page states that only single pass encoding is supported with the Command Line Encoder."
      - q: "What is the {InputFile} token in the Video Input String Format?"
        choices: ["The first frame of the sequence", "The Level Sequence asset path", "The output movie path", "A temporary text file that lists every rendered frame in order"]
        answer_index: 3
        explain: "During the render a temporary text file itemizes every frame. It is deleted after encoding unless you enable Write All Samples in Debug Options."
