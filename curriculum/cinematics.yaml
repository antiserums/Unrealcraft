    title: Live Link and virtual cameras
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/controlling-a-virtual-camera-actor-using-live-link-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/live-link-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/virtual-cameras-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/take-recorder-in-unreal-engine"
    checklist:
      - "Edit > Plugins: enable VirtualCamera, Live Link and Take Recorder. Restart."
      - "Install the Unreal VCam app on an iOS (15+, ARKit) or Android (ARCore) device. Put the device on the same network as your PC."
      - "In the Place Actors panel search VCAM and drag a VCam Actor into your scene. Notice the viewport starts piloting it."
      - "Open the Pixel Streaming dropdown (not Pixel Streaming 2) and read the Signaling Server URL that matches your network. Enter it in the app and press Connect."
      - "Walk with the device to frame a shot. Then use the touch joysticks to add extra movement on top of the tracked motion."
      - "Open Window > Live Link. Find the source and subject for your device and confirm the green status light."
      - "Record a 10-second camera take with Take Recorder and play it back in Sequencer."
    done_when: "Screenshot of the Live Link window showing the connected source and subject with a green light, plus the recorded take open in Sequencer, plus a short clip or screenshot of the VCam app view."
    xp: 120
    verify_type: screenshot
    quiz:
      - q: "Which plugin is NOT in the list you must enable for the virtual camera guide?"
        choices: ["VirtualCamera", "Live Link", "Niagara", "Take Recorder"]
        answer_index: 2
        explain: "The guide lists VirtualCamera, Live Link and Take Recorder. Niagara is not needed."
      - q: "Which device requirement matches the docs?"
        choices: ["iOS 15 or later with ARKit; Android 24 (Nougat) or higher with ARCore", "Any phone with a camera", "iOS 12 with ARKit only", "Android 10 with Bluetooth"]
        answer_index: 0
        explain: "The page lists iOS/iPadOS 15.0 or later with ARKit support, and Android 24 or higher with ARCore support."
      - q: "Where do you find the IP address to type into the Unreal VCam app?"
        choices: ["Project Settings > Network", "Window > Live Link > Presets", "The Output Log", "The Pixel Streaming toolbar dropdown, under Signaling Server URLs"]
        answer_index: 3
        explain: "The Pixel Streaming dropdown lists signaling server URLs. Use the one on the same network as the device."
      - q: "You see two dropdowns: Pixel Streaming and Pixel Streaming 2. Which one do you use for VCam?"
        choices: ["Either one", "Pixel Streaming, because Virtual Camera does not support Pixel Streaming 2", "Pixel Streaming 2 only", "Neither; use Live Link presets"]
        answer_index: 1
        explain: "The docs say Virtual Camera does not currently support Pixel Streaming 2. Use the Pixel Streaming dropdown."
      - q: "What happens in the viewport as soon as you drag a VCam Actor into the level?"
        choices: ["Nothing until the device connects", "A Take Recorder window opens", "The viewport automatically starts piloting the virtual camera", "The level switches to Play mode"]
        answer_index: 2
        explain: "The viewport changes to pilot the virtual camera immediately after the VCam Actor is placed."
      - q: "Your scene has three VCam Actors. What happens when the app connects?"
        choices: ["You must select which one to connect to", "It connects to all three", "It connects to the newest", "It refuses to connect"]
        answer_index: 0
        explain: "With one virtual camera the app connects automatically. With several, you must choose one."
      - q: "How do the touch screen joysticks relate to ARKit tracking?"
        choices: ["Joysticks replace tracking", "Joysticks only work when tracking is off", "Joysticks scale the tracking", "Joystick movement is layered on top of the tracked movement"]
        answer_index: 3
        explain: "Motion tracking happens automatically, and joystick movement is added on top of it."
      - q: "Which of these is NOT a Live Link role listed in the docs?"
        choices: ["Camera", "Material", "Character", "Transform"]
        answer_index: 1
        explain: "Supported roles are Cameras, Lights, Characters, Transforms and a Basic role for generic data. There is no Material role."
      - q: "A Live Link subject is made of which data?"
        choices: ["A network address only", "A Blueprint and a level", "A name, static data such as a skeleton, and one or more frames of data", "A texture and a sound"]
        answer_index: 2
        explain: "A subject has a name, static data that does not change, and frames of data such as bone transforms."
      - q: "In the Live Link window a subject shows a yellow light. What does that mean?"
        choices: ["Connected to the source, but no data arrived within the time set in Project Settings", "The subject is recording", "The role is wrong", "The plugin is disabled"]
        answer_index: 0
        explain: "Green means data is arriving. Yellow means the source is connected but no data came in the expected time."
      - q: "Your PC has two network adapters and Live Link gets no data. Where does the docs page say to fix this?"
        choices: ["Project Settings > Rendering", "The VCam app settings", "Edit > Plugins", "Project Settings > UDP Messaging, set the Unicast Endpoint to the adapter's IP with :0"]
        answer_index: 3
        explain: "The Message Bus source uses the first adapter it finds. Set the Unicast Endpoint to the adapter you want; :0 means all ports."
      - q: "Which Evaluation Mode should you avoid if the engine has no Timecode provider?"
        choices: ["Engine Time", "Timecode", "Latest", "All modes work without one"]
        answer_index: 1
        explain: "Timecode mode evaluates using the engine timecode and the docs say not to use it without a Timecode provider. Engine Time is for smooth motion and Latest uses the newest frame with no interpolation."
    flavors:
