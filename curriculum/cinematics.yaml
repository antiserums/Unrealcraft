        choices: ["Play Rate Curve is for cameras only", "Time Warp Curve cannot be muted", "Play Rate Curve is a fixed rate that cannot be keyframed; Time Warp Curve can be animated with keys", "There is no difference"]
        answer_index: 2
        explain: "The doc says a Play Rate Curve sets a fixed play rate that cannot be keyframed, while a Time Warp Curve has a variable rate you animate with keyframes."
