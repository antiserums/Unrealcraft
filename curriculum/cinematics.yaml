  - id: CQ59
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [movie-render-graph, render-layers, collections, holdout]
    required_spine: false
    required: false
    title: "Render layers: Collections and Modifiers"
    brief: "A render layer is a separate image of one part of the scene, for example only the characters. Layers let a compositor change the character without a new render of the whole world. In Movie Render Graph, a Collection node chooses a group of actors, and a Modifier node changes how that group is rendered, for example hidden or as a holdout (a black cutout with the shape of the actors). In this quest you render a character layer and a background layer of the same shot."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/movie-render-graph-nodes-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/movie-render-pipeline-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/transitioning-to-the-movie-render-graph-from-movie-render-queue-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open Edit > Project Settings > Engine > Rendering > Default Settings. Enable Alpha Output and Support Primitive Alpha Holdout (Deferred). Restart the editor if it asks."
      - "You need a shot with characters and a background. If you have none, drag two mannequins into a level that has a floor and a few cubes behind them, create a Level Sequence, and add a camera with the Camera button. Rename the character actors so that their names start with CHAR_. Put the background actors in an Outliner folder named BG."
      - "Open a Movie Render Graph asset, or make a new one: in Movie Render Queue, add the shot as a job, click the arrow next to its config in the Settings column, choose Movie Render Graph and create a new graph. Add a Collection node named col_Chars with a Condition Group that uses Actor Name CHAR_*. Add a second Collection named col_BG that uses Editor Folder BG. Click the arrow icon in the Details panel to select the members of a collection in the level."
      - "Make a render layer named rl_Chars with this chain: Render Layer, then a Modifier named mod_HideBG, then Deferred Renderer, then EXR, then Output. In the Modifier, set Collections to col_BG and turn on Is Hidden, Cast Shadows While Hidden and Affect Indirect Lighting While Hidden."
      - "Make a render layer named rl_BG with this chain: a Modifier named mod_HoldChars, then Deferred Renderer, then EXR, then Output. In the Modifier, set Collections to col_Chars and turn on Holdout."
      - "Add a Set Metadata Attributes node to rl_Chars, with the key artist and your name as the value. Keep the File Name {sequence_name}.{layer_name}.{frame_number}."
      - "Render 24 frames. Open both EXR files, and check the alpha of the holdout region and the EXR metadata."
    done_when: "Send a screenshot of the graph with both render layers. Also send one frame from each layer side by side, which shows the hidden background (with its shadow and bounce light kept) and the black holdout of the character."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Two Collection nodes in the graph have the same name. What happens?"
        choices: ["They merge into one collection", "The collection later in the graph overrides the original", "The graph refuses to evaluate", "Both are ignored"]
        answer_index: 1
        explain: "Each Collection node needs a unique name. Otherwise a collection of the same name later in the graph overrides the original."
      - q: "Which names does the wildcard Foo?Bar match?"
        choices: ["FooBar only", "Any name that starts with Foo", "FooBar and BarFoo", "Foo.Bar and Foo_Bar, but not FooBar"]
        answer_index: 3
        explain: "The ? wildcard matches exactly one character, so Foo?Bar matches Foo.Bar and Foo_Bar but not FooBar."
      - q: "A Condition Group has: actor name matches CHAR_*, Subtract, actor is in sublevel FG_SUBLEVEL. Which actors are in the collection?"
        choices: ["All CHAR_* actors except those in FG_SUBLEVEL", "Only CHAR_* actors inside FG_SUBLEVEL", "All actors in FG_SUBLEVEL", "CHAR_* actors plus everything in FG_SUBLEVEL"]
        answer_index: 0
        explain: "Subtract removes the second condition's results from the first. And would keep only the intersection, Add would keep both sets."
      - q: "You want a Sequencer spawnable in a collection. What does the documentation say?"
        choices: ["Spawnables cannot be in collections", "Use the Actor Type condition", "Use an Actor Name condition, an applied Actor Tag, or the Is Spawnable property", "Convert it to a possessable first"]
        answer_index: 2
        explain: "Spawnables are transient, so you get them by Actor Name, by an applied Actor Tag, or with Is Spawnable. Tags on components are lost on respawn, so tag the asset instead."
      - q: "You enable Holdout on a collection. What is true about the result?"
        choices: ["The actors vanish and stop casting shadows", "The actors render black, poke a hole in the layer's RGBA with black alpha, but still cast shadows and stay in the Lumen scene", "The actors become fully transparent with white alpha", "The actors are rendered to a separate layer"]
        answer_index: 1
        explain: "Holdout blacks out the actors and their alpha, but they still cast shadows and still contribute GI and reflections in the Lumen scene."
      - q: "What does Affect Indirect Lighting While Hidden control?"
        choices: ["Whether hidden actors still cast a shadow", "Whether hidden actors write to alpha", "Whether hidden actors stay in the Lumen scene for GI and reflections", "Whether hidden actors are ticked"]
        answer_index: 2
        explain: "It keeps the collection visible to the Lumen scene, both GI and reflections, while it is not visible to primary pixels. Shadows are the separate Cast Shadows While Hidden flag."
      - q: "You add a Set Metadata Attributes node. Which output types can receive that metadata?"
        choices: ["EXR only", "EXR and PNG", "All image formats", "ProRes movies only"]
        answer_index: 0
        explain: "EXR is the only Output Type that can receive metadata. JPG, PNG and TIF do not support it."
      - q: "The graph warns you when you enable Holdout in a Modifier. Which project setting is it asking for?"
        choices: ["Enable Path Tracing", "Support Compute Skin Cache", "Enable Multilayer EXR", "Support Primitive Alpha Holdout (Deferred)"]
        answer_index: 3
        explain: "Support Primitive Alpha Holdout (Deferred) is required for holdouts in the Deferred Renderer. Film/TV templates turn it on, and MRG notifies you if it is off."
    flavors:
      _default: {why: "Layers let a compositor fix the character without re-rendering the whole world."}
      cinematics: {why: "Collections and Modifiers replace the old stencil-layer tricks with rules you can reuse per shot.", do: "Make a subgraph that only holds the two collections and load it into a second graph."}

  - id: CQ60
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [path-tracer, movie-render-graph, light-passes]
    required_spine: false
    required: false
    title: "Path Tracer in the graph: per-layer and light passes"
    brief: "The Path Tracer gives the best lighting but is slow, so it makes sense to use it only where it shows. In Movie Render Graph each render layer can use its own renderer, so the hero can be path traced while the background uses the faster Deferred Renderer. In this quest you build such a graph with a switch between the two renderers, and you also render the diffuse light and the specular light (the reflections) of a shot as separate passes."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/movie-render-graph-nodes-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/path-tracer-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/transitioning-to-the-movie-render-graph-from-movie-render-queue-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, with a lit level, a hero object such as a mannequin, and a Level Sequence with a camera. Open Project Settings and make sure that Default RHI is DirectX 12 and that Support Hardware Ray Tracing and Enable Path Tracing are on. Restart the editor if you changed them. In Movie Render Queue, add the sequence as a job and make a Movie Render Graph for it named MRG_PT."
      - "Build two render layers on the same job. The layer rl_Hero uses the Path Traced Renderer node with Spatial 8 and Reference Motion Blur on. The layer rl_BG uses the Deferred Renderer node. Set the temporal count to 4 in Sampling Method."
      - "Insert a Branch node before the renderer in rl_Hero. Promote its condition to a bool variable (true or false) named bUsePathTracer. Set it on each job in the queue and render once each way."
      - "Make a Blueprint named BP_PTPasses: an Actor with a Post Process Volume that has Infinite Extent (Unbound) and a high Priority. Add two custom events named RenderDiffuse and RenderSpecular that set the checkboxes under Path Tracer Lighting Components."
      - "In a legacy MRQ config, add Console Variables with this Start Console Command: Ke * RenderSpecular. Duplicate the job and give it a second config that calls Ke * RenderDiffuse."
      - "Render the queue. Compare the specular-only frame and the diffuse-only frame, and compare the time per frame of each job."
      - "Write down where the Reference Motion Blur option is found and why the deferred layer does not have it."
    done_when: "Send a screenshot of MRG_PT with the Branch node and both renderer nodes. Also send a specular-only frame and a diffuse-only frame from the same shot with their render times."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Can one Movie Render Graph render one layer with the Path Tracer and another with the Deferred renderer?"
        choices: ["No, the render path is global per job", "Yes, the render path is chosen per render layer by the renderer node you connect", "Only with two separate graph assets", "Only in Quick Render"]
        answer_index: 1
        explain: "The Path Traced and Deferred renderer nodes are per-layer nodes. One graph can have one layer of each."
      - q: "What does the Branch node take as input?"
        choices: ["A True/False boolean that tells the graph which branch to compute", "An integer frame number", "A render layer name", "A file name token"]
        answer_index: 0
        explain: "Branch takes a boolean. The docs example uses it to choose between the Path Tracer and Deferred path for one layer."
      - q: "Reference Motion Blur is enabled with the Path Tracer. What changes about denoising and sampling?"
        choices: ["Denoising is disabled", "Spatial samples must be at least 16", "All temporal samples are taken before denoising, so keep Spatial at 1 and drive sampling with temporal samples", "Temporal samples are ignored"]
        answer_index: 2
        explain: "With Reference Motion Blur all temporal samples are taken before denoising. The docs recommend Spatial 1 and many temporal samples for the best motion blur."
      - q: "What is the console command syntax to call a Blueprint custom event named RenderSpecular from a render config?"
        choices: ["Exec RenderSpecular", "Ke * RenderSpecular", "Call RenderSpecular", "r.PathTracing.RenderSpecular 1"]
        answer_index: 1
        explain: "Custom events are executed with the syntax Ke * [Custom Event Name] from a Start Console Command."
      - q: "You want diffuse, specular and emissive passes from the Path Tracer through MRQ. How is this set up?"
        choices: ["One job with three Output File Type nodes", "Enable Multilayer EXR", "Turn on Object Ids", "The shot is queued once per pass, each job with its own config that calls a different custom event"]
        answer_index: 3
        explain: "The shot must be called multiple times in MRQ, once per lighting component configuration, each referencing a config that calls a different custom event."
      - q: "Why does rendering three lighting-component passes not take exactly three times as long?"
        choices: ["The Path Tracer has early outs, so render times do not scale linearly", "The GPU caches the first pass", "Passes share samples", "Denoising is skipped for passes"]
        answer_index: 0
        explain: "The docs note the Path Tracer has early outs, so there is no direct linear scale on render times across multiple component configurations."
      - q: "An emissive light bulb material sits next to a point light. Which Lighting Component would you turn off to avoid double counting?"
        choices: ["Indirect Emissive", "Direct Specular", "Direct Diffuse", "Indirect Diffuse"]
        answer_index: 0
        explain: "Indirect Emissive controls bounce lighting from emissive materials. Turning it off avoids double-counted illumination when a real light also represents the bulb."
      - q: "A scene has several Heterogeneous Volumes. You set one to holdout in a Path Traced Renderer layer. What happens?"
        choices: ["Only that volume becomes a holdout", "Holdout is ignored for volumes", "All heterogeneous volumes in the scene render as holdouts", "The render fails"]
        answer_index: 2
        explain: "With the Path Traced Renderer, setting one HV to holdout makes all HVs holdouts. Per-actor holdouts on volumes only work with the Deferred Renderer."
    flavors:
      _default: {why: "Mixing render paths per layer lets you spend Path Tracer time only where it shows."}
      cinematics: {why: "Light-component passes give the grade room to rebalance a shot without a re-render.", do: "Add a Select node with an enum to pick between three spatial sample counts."}

  - id: CQ61
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [path-tracer, denoising, nfor, nne]
    required_spine: false
    required: false
    title: "Denoise the Path Tracer: NFOR and NNE"
    brief: "A path-traced image is noisy (grainy) until it has many samples, and many samples take a long time. A denoiser is a tool that removes the noise from an image with few samples, so a frame can finish much faster. Unreal has a spatial denoiser that cleans each frame on its own (NNE with Open Image Denoise) and a temporal one that also looks at the frames before and after (NFOR). In this quest you try both, compare how much the result flickers, and compare the render times."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/nfor-denoiser-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/nne-denoiser-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/movie-render-graph-nodes-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, with a lit level and a Level Sequence that has a camera move of 48 frames. In Project Settings, make sure that Default RHI is DirectX 12 and that Support Hardware Ray Tracing and Enable Path Tracing are on. Open Edit > Plugins and confirm that NFORDenoise and NNEDenoiser are enabled. Open Project Settings > NNE Denoiser. Pick an Open Image Denoise asset (balanced) and set Runtime Type to RDG. If no assets show, tick Show Engine Content and Show Plugin Content in the browse settings."
      - "Set the viewport to Path Tracing. Place a Post Process Volume with Infinite Extent (Unbound) turned on, or use the one in your level, and enable Denoiser in it. Run r.PathTracing.Denoiser.Name NNEDenoiser in the console. Then compare the fast and the high quality OIDN assets on one still image."
      - "Open a Movie Render Graph that has a Path Traced Renderer node. To make one, add your sequence as a job in Movie Render Queue, switch its config to Movie Render Graph, create a new graph named MRG_PT, and build the chain Render Layer, Path Traced Renderer, PNG or EXR output, Output. Select the Path Traced Renderer node. Under Denoiser, enable Denoiser Type and set it to Temporal. Set Frame Count to 2. Render the camera move of 48 frames, and search the Output Log for LogNFORDenoise."
      - "Render the same shot with Frame Count 0. Compare the flicker between frames in a viewer."
      - "Now do it the legacy way. In an MRQ config, add Console Variables with r.PathTracing.SpatialDenoiser.Type 1 and r.NFOR.FrameCount 2, and enable Denoiser in the Post Process Volume. Look at the first and the last frames of the shot."
      - "Enable Reference Motion Blur with Temporal 8. Compare the render time with the time when Reference Motion Blur is off."
      - "Write 5 lines that say which setup was cleanest, which was fastest, and what the log line showed."
    done_when: "Send a screenshot of the Path Traced Renderer node with Denoiser Type set to Temporal and Frame Count 2, the Output Log line from LogNFORDenoise, and two frames that compare spatial and temporal denoising."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the NFOR denoiser designed for, and what is it NOT meant to fix?"
        choices: ["Real-time games; not offline renders", "Temporal stability for offline path-traced renders; not extremely low sample counts or fast moving objects", "Fireflies; not noise", "Lumen scenes; not the Path Tracer"]
        answer_index: 1
        explain: "NFOR gives high temporal stability for offline path tracing through MRQ. It is not intended to rescue very low sample counts or fast moving objects."
      - q: "In the Path Traced Renderer node, Frame Count is 2. What does that mean?"
        choices: ["Two frames are rendered per output frame", "The denoiser runs twice", "Only every second frame is denoised", "Two frames on each side (past and future) of the current frame are used for denoising"]
        answer_index: 3
        explain: "Frame Count is how many frames on both sides of the current frame NFOR uses. Values go from 0 to 3, and 0 means NFOR works spatially."
      - q: "How can you verify that the temporal denoiser really ran?"
        choices: ["The render preview shows a green border", "The Output Log shows LogNFORDenoise lines with Denoised NumOfHistory", "The EXR has a denoise layer", "The frame time doubles"]
        answer_index: 1
        explain: "The log prints lines like LogNFORDenoise: Frame 322: Denoised NumOfHistory = 5. If missing, check that Enable Denoiser is ticked on the node."
      - q: "Why does the legacy MRQ path give noisy first frames and missing last frames per shot, while MRG does not?"
        choices: ["MRQ uses a lower sample count", "MRQ cannot run the Path Tracer", "NFOR needs future frames, and only the Movie Render Graph path handles that correctly", "MRG renders more frames"]
        answer_index: 2
        explain: "NFOR needs future frames. In MRQ this leaves noisy initial frames and missing frames at the end of each shot; the Movie Render Graph path does not have this issue."
      - q: "You use many temporal sub-samples with NFOR. What does the documentation recommend?"
        choices: ["Turn on Reference Motion Blur so each sub-sample does not trigger its own denoise", "Set Frame Count to 3", "Use spatial samples instead", "Disable the denoiser"]
        answer_index: 0
        explain: "Without Reference Motion Blur each temporal sub-sample triggers denoising, adding time. The tip applies to both MRG and MRQ."
      - q: "Which NNE Runtime Type is recommended, and why?"
        choices: ["CPU, because it needs no GPU", "GPU, because it is fastest", "RDG, because the image is denoised on device without copying to the CPU", "Any; they are equal"]
        answer_index: 2
        explain: "RDG is the most efficient because there are no device copies. GPU mode makes four copies and is not recommended unless nothing else is available."
      - q: "Which artefact does the documentation say the denoiser cannot remove?"
        choices: ["Fireflies", "Aliasing", "Banding", "Ghosting"]
        answer_index: 0
        explain: "The listed limitations are that fireflies cannot be removed by the denoiser and that it needs a decent amount of samples."
      - q: "The Open Image Denoise assets do not appear in the Denoiser Asset dropdown. What is the fix?"
        choices: ["Reinstall the engine", "Set r.PathTracing.Denoiser.Name to OIDN", "Import a custom model", "Tick Show Engine Content and Show Plugin Content in the browse settings"]
        answer_index: 3
        explain: "The OIDN assets are engine and plugin content, so both checkboxes must be ticked in the Browse Settings for them to show."
    flavors:
      _default: {why: "A good denoiser is the difference between 64 samples overnight and 8 samples before lunch."}
      cinematics: {why: "Temporal denoising kills the flicker that makes path-traced animation look cheap.", do: "Try r.NFORPredivideAlbedo.Offset 0.1 versus 0.3 on a textured surface and note the detail change."}

  - id: CQ62
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [overscan, high-resolution, tiles, multi-camera]
    required_spine: false
    required: false
    title: Overscan and big frames
    brief: "Overscan means rendering extra pixels around the edges of the frame. Compositors use this border for lens effects and for steadying a shaky picture. A tiled render splits one very large image into several pieces that are rendered one by one, because a poster-size frame is too big for the graphics card to draw at once. In this quest you render with overscan, render a 4K frame in tiles, and render from two cameras into separate folders."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-rendering-image-quality-settings-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/rendering-from-multiple-camera-angles-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/movie-render-graph-nodes-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/transitioning-to-the-movie-render-graph-from-movie-render-queue-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, with the Movie Render Pipeline plugin enabled. You need a shot of 12 frames: any Level Sequence with a Cine Camera works. Make a job for it in Movie Render Queue. Add the Camera setting with Overscan Percentage 0.1 and export EXR. Render. Open a frame in a viewer that shows the EXR data window, and note the pixel size."
      - "Render the same job to PNG. Compare the image size and the framing with the EXR."
      - "Remove the overscan from MRQ. Set the Overscan property on the Cine Camera Actor itself, render again, and confirm that the value was passed through. Then set a different value in MRQ and see which one wins."
      - "Add High Resolution with Output 3840x2160, Tile Count 2, Overlap Ratio 0.1 and Texture Sharpness Bias -1. Render with depth of field on. Watch the preview window during the render."
      - "If you have a character with subsurface skin (skin that lets light pass a little way into it), such as a MetaHuman, put it in the shot. Enable Override Sub Surface Scattering and raise Burley Sample Count. Compare the skin at a tile seam, the line where two tiles meet. If you have no such character, look at the tile seams on the objects in your shot and note if you can see them."
      - "Add a second Cine Camera to the shot. In the Camera setting, enable Render All Cameras, and set Output Directory so that it ends with {camera_name}/. Render."
      - "Add {overscan_percentage} and {tile_count} to the File Name Format. Then switch the job to Movie Render Graph and check if a High Resolution node exists."
