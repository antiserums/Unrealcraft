        choices: ["Time Scale", "Start Frame Offset", "Can Loop", "Hierarchical Bias"]
        answer_index: 1
        explain: "Start Frame Offset offsets the start time like slip editing, without affecting duration. You can also hold Shift and drag along the clip."
