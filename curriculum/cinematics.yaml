    subjects: [constraints, control-rig, props, space-switching, sequencer]
    required_spine: false
    required: false
    title: Props in hands with constraints
    brief: "A constraint makes one object follow another object. With a Parent constraint, a prop follows the hand of a character, and you can turn the constraint off at the frame where the character lets go. This solves one of the most common shot problems: a character who picks something up and puts it down. In this quest you constrain a prop to a hand control, release it, and try a LookAt constraint and a custom space."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-constraint-tools-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/re-parent-control-rig-controls-in-real-time-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-editor-mode-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Drag the Control Rig asset of the mannequin, CR_Mannequin_Body, from the Content Browser into the level. A Level Sequence with a Control Rig track opens. If you already have such a sequence, you can use it. Place a Static Mesh prop, such as a cube or a cylinder, near the hand and name it SM_Prop."
      - "Select SM_Prop in the viewport. In the Animation panel, click Add Constraint (+) and choose Parent, then use the eyedropper to pick the hand control. Move the hand and check that the prop follows it."
      - "Move the playhead 48 frames later. Use the key button to add a key that deactivates the constraint. Animate the prop falling to a table. Drag the playhead over the release and look for a sudden jump (a pop). Fix it with Compensate Key while the playhead is on the constraint key."
      - "Select the control of the other hand. Add a LookAt constraint to SM_Prop. Change its Axis so that the hand aims correctly."
      - "Select the hand control and open Spaces. Add SM_Prop as a custom space and switch to it at one frame. Then switch back to Parent at a later frame."
      - "Right-click the Parent constraint and choose Bake. Then open the Constraints Manager actor and count your constraints."
    done_when: "Send a screenshot of the Constraints section of the Animation panel with the Parent and LookAt constraints listed. Also send a screenshot of Sequencer that shows the constraint keys and a space-switch key with its own color."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the order of actions to create a constraint?"
        choices: ["Select the parent, click Add Constraint, then pick the child with the eyedropper", "Select the child, click Add Constraint (+), choose a type, then pick the parent with the eyedropper", "Drag the child onto the parent in the Outliner", "Add a Constraint track in Sequencer"]
        answer_index: 1
        explain: "Select the controls or object to constrain (child), click Add Constraint (+), select a type, then use the eyedropper on the parent."
      - q: "Can you constrain a normal Static Mesh Actor without a Control Rig?"
        choices: ["No, only rig controls can be constrained", "Yes, any object or actor can be constrained, even without Sequencer open", "Only if it is a spawnable", "Only cameras"]
        answer_index: 1
        explain: "Constraining is not limited to Control Rig. Any object or Actor can be constrained, and Actors can be constrained without Sequencer open."
      - q: "By default, which channel does a Parent Constraint NOT include?"
        choices: ["Translation", "Rotation", "Scale", "It includes all three"]
        answer_index: 2
        explain: "Scale is not included in a Parent Constraint by default. Enable Scaling on the constraint entry to include it."
      - q: "The prop pops when the constraint activates because you moved the parent later. What fixes it?"
        choices: ["Delete the constraint", "Put the playhead on the constraint key and use Compensate Key", "Disable Maintain Offset", "Lower the Order value"]
        answer_index: 1
        explain: "Compensate Key re-creates the compensating keyframes for the new parent position. The playhead must be on the constraint keyframe."
      - q: "Two Parent constraints are active on the same control. Which one wins?"
        choices: ["The older one", "The newer one, which is lower on the list and has higher priority", "Neither, the control is locked", "They blend 50/50"]
        answer_index: 1
        explain: "Constraints are hierarchical. New constraints take priority and are placed lower on the list, overriding older ones on the same channels."
      - q: "What does disabling Dynamic Offset do?"
        choices: ["Removes the constraint", "Allows scale", "Bakes the keys", "Locks the child at its current transform so it only moves with the parent"]
        answer_index: 3
        explain: "With Dynamic Offset off, the constrained object can no longer be keyframed on its own. It only moves if the parent moves."
      - q: "What is special about the LookAt constraint compared with other aim setups?"
        choices: ["It uses two up vectors", "It does not use up vectors, and you animate the roll axis by hand", "It only works on cameras", "It cannot be keyframed"]
        answer_index: 1
        explain: "LookAt does not use up vectors. You animate the roll axis manually, which also helps avoid rotation flipping."
      - q: "In space switching, which shortcut opens a temporary Spaces menu in the viewport?"
        choices: ["Tab", "Space", "Ctrl + S", "Shift + 7"]
        answer_index: 0
        explain: "Press Tab while the cursor is on the viewport to open a temporary Spaces menu. Parent and World are the two default spaces."
    flavors:
      _default: {why: "A character picking up a cup and putting it down is one of the most common shot problems, and constraints solve it."}
      animation: {why: "Constraints and spaces are the base of contact animation.", do: "Use the Snapper tool instead of a constraint for the same pickup and compare the baked keys."}

  - id: CQ55
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [movie-render-queue, presets, pipeline]
    required_spine: false
    required: false
    title: "Presets you can share: master, shot, queue"
    brief: "By default, the settings of a render job in Movie Render Queue are lost when you close the editor. A preset saves them as an asset that a whole team can reuse. There are three kinds: a primary config (called a master config in older versions) for a whole job, a shot config for one shot inside a job, and a queue asset that saves the full list of jobs. In this quest you create one of each and learn the difference between editing a job's copy of a preset and editing the asset itself."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-render-settings-and-formats-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/movie-render-pipeline-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/movie-render-queue-in-runtime-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, with the Movie Render Pipeline plugin enabled. You need a Level Sequence that has at least 2 shots. To make one, click Cinematics in the main toolbar, choose Add Level Sequence with Shots with 2 shots, and add a camera to each shot. Open Window > Cinematics > Movie Render Queue and add a job for it. Check the Map field in Job Details and type your name in Author."
      - "Click Settings for the job. Add EXR Sequence and Anti-Aliasing with Temporal 4. Click Load/Save Preset and choose Save As Preset. Save it as MPC_Final, which is a Movie Pipeline Primary Config asset."
      - "Expand the job to see its shots and click Edit on one shot. Add Anti-Aliasing with Temporal 8. Try to add an Export setting and notice that you cannot. Use Save As Preset and name it MPSC_Hero, which is a Movie Pipeline Shot Config asset."
      - "Add a second job with another sequence. Any other Level Sequence works, for example one of the two shots. In its Settings dropdown, pick MPC_Final. Then click Unsaved Queue, choose Save Queue As, and save the queue as MPQ_Weekly."
      - "Click the name MPC_Final in the Settings column, change Output Directory, and close the window. Then double-click MPC_Final in the Content Browser and see that the change is not there. Set the directory in the asset editor and click Save."
      - "Remove both jobs from the queue. Pick MPQ_Weekly from the queue menu and confirm that both jobs come back with their presets."
      - "Click Render (Local). Open the Output link and confirm that both jobs rendered into the directory you set in the asset."
    done_when: "Send a screenshot of Movie Render Queue that shows the queue named MPQ_Weekly, two jobs that use MPC_Final, and one shot that uses MPSC_Hero. Also send a screenshot of the Content Browser with the three assets MPC_Final, MPSC_Hero and MPQ_Weekly."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You set up render settings for a job but never save a preset. What happens to those settings?"
        choices: ["They are saved into the Level Sequence asset", "They are temporary for the editor session and are lost when the session closes", "They are written to DefaultEngine.ini", "They are copied to every other job automatically"]
        answer_index: 1
        explain: "By default render settings are temporary for the editor session. Saving a preset makes them shareable and reusable."
      - q: "What is a Master preset meant for?"
        choices: ["The top-level job, so its settings propagate to the camera cuts beneath it", "One single camera only", "The editor viewport Quick Render", "Runtime builds only"]
        answer_index: 0
        explain: "Master presets are applied to the top-level job and propagate their settings to the camera cuts (shots) below it. They are saved as Movie Pipeline Primary Config assets (formerly Master Config)."
      - q: "Which of these can you NOT do in a Shot preset?"
        choices: ["Add an Anti-Aliasing setting", "Add a Console Variables setting", "Add an Export category setting or change the output directory", "Add a Camera setting"]
        answer_index: 2
        explain: "Shot settings cannot conflict with required settings from the Master, so Export settings and the output directory are not allowed at shot level."
      - q: "You try to assign a Movie Pipeline Shot Config asset to a top-level job. Why does it not appear in the list?"
        choices: ["The asset is not saved yet", "Shot presets need the Path Tracer", "The job has no shots", "Master and Shot Config assets are different asset types and cannot be used interchangeably"]
        answer_index: 3
        explain: "The docs state that Master and Shot Config assets are different asset types. A shot preset only applies to a shot entry, a master preset only to a job."
      - q: "You click a preset name in the Settings column and change a value. What did you change?"
        choices: ["The preset asset on disk", "A temporary copy of the preset, not the asset itself", "All jobs that use the preset", "The project settings"]
        answer_index: 1
        explain: "Editing from the queue only modifies a temporary copy. To change the asset, use Save As Preset over the existing one or edit the asset from the Content Browser."
      - q: "You load a saved Movie Pipeline Queue asset and then delete a job from the list. What happened to the asset?"
        choices: ["Nothing; loading imports a copy and the asset changes only when you choose Save Queue", "The job was removed from the asset at once", "The asset was deleted", "The asset was marked dirty and auto-saved"]
        answer_index: 0
        explain: "Selecting a queue asset imports a copy of the queue into the jobs area. Changes do not affect the asset unless you save them with Save Queue."
      - q: "The Job Details Map field lets you render the same sequence in a different Level. When is this most useful?"
        choices: ["When the sequence uses Spawnables", "When the sequence has audio", "When you render with the Path Tracer", "When you use a Shot preset"]
        answer_index: 0
        explain: "The docs say that if your sequence uses Spawnables you can render the same scene in different Levels by changing the Map field."
      - q: "Why must you save your changes before clicking Render (Remote), but not before Render (Local)?"
        choices: ["Remote renders always use the Path Tracer", "Remote launches a separate process that reads the saved files from disk", "Local renders skip Sequencer", "Remote renders ignore presets"]
        answer_index: 1
        explain: "Render (Local) renders in the same process with a Play in Editor session. Render (Remote) launches a separate process, so it can only see what is saved on disk."
    flavors:
      _default: {why: "Presets and queue assets turn a one-time render setup into something a whole team can reuse."}
      cinematics: {why: "A shot that needs more samples than the rest gets its own shot preset without touching the master.", do: "Add a third preset for fast previews (Temporal 1, JPG) and put it on the second job."}

  - id: CQ56
    rank: 2
