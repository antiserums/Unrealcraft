  - id: CQ24
    rank: 3
    difficulty: expert
    specializations: [cinematics]
    subjects: [sequencer, audio-track, sound]
    required_spine: false
    required: false
    title: Sound in the sequence
    brief: "A scene without sound feels unfinished. In Sequencer, an Audio Track holds sound clips on the same timeline as the picture, so music and effects stay in sync with the cuts. A sound can also be attached to an actor, so that it seems to come from that actor in the 3D world. In this quest you add music and a sound effect, fade and loop them, attach one to a character, and render the sound to a file."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-audio-track-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-rendering-export-formats-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-rendering-image-quality-settings-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open a sequence that has a character and at least 2 shots. To make one, drag SKM_Manny_Simple from the folder Characters/Mannequins/Meshes into the level and click Cinematics in the main toolbar. Choose Add Level Sequence with Shots with 2 shots, add a camera to each shot, and add the mannequin from the level to the master sequence."
      - "Add an Audio Track with Track (+) and drop a music Sound Wave at frame 0. To get one, drag a .wav file of your own into the Content Browser. For a first test any Sound Wave works, for example the engine sound WhiteNoise. To see engine content, open the Settings menu of the Content Browser and turn on Show Engine Content."
      - "Add a second Audio Track for a footstep sound or a door sound. Trim its edges, and drag its end past the length of the clip so that it loops."
      - "Drag the upper corners of the music section to make a fade in and a fade out. Then make two clips overlap and adjust the crossfade handles."
      - "Expand the sound-effect track and set Attach to the character. Right-click the section, open Properties, and set an Attenuation Settings asset, which makes the sound quieter with distance. Move the camera away and listen to how the sound gets quieter."
      - "Use Start Frame Offset (hold Shift and drag) to slide the sound inside its section, so that it lands exactly on the frame of the footstep."
      - "Add the sequence to Movie Render Queue as a job (Window > Cinematics > Movie Render Queue). Add the WAV Audio export and a .png Sequence export to the job, and render 5 seconds."
    done_when: "Send a screenshot of Sequencer with both audio tracks, with the fades and the crossfade visible and the Attach and Attenuation settings shown. Also send a screenshot of the output folder with the .wav file next to the PNG frames. Add one line that says what you did if the trimmed clip did not play correctly."
    xp: 85
    verify_type: screenshot
    quiz:
      - q: "Which asset types can you add to an Audio Track?"
        choices: ["Sound Waves and Sound Cues", "Only .wav files imported as Sound Waves", "MetaSounds only", "Any .mp3 file from disk"]
        answer_index: 0
        explain: "The page says you can add Sound Waves and Sound Cues with the Audio Track, either from the Audio (+) dropdown or by dragging them from the Content Browser."
      - q: "How do you make an audio section loop?"
        choices: ["Right-click and choose Duplicate until it fills the timeline", "Drag the end of the section past the duration of the clip", "Set Pitch to 0", "Enable Suppress Subtitles"]
        answer_index: 1
        explain: "Dragging the end time past the clip duration causes the sound to loop for the trimmed duration."
      - q: "A trimmed audio section does not play correctly. What fix does the page give?"
        choices: ["Re-import the sound at 48 kHz", "Convert the section to a Sound Cue", "Set the Sound Wave's Sound Asset Compression Type to Bink Audio or PCM", "Disable Looping on the section"]
        answer_index: 2
        explain: "Trimmed or edited sections may fail due to platform-specific codec settings; setting Sound Asset Compression Type to Bink Audio or PCM fixes it."
      - q: "How do you create a volume fade on an audio section?"
        choices: ["Add a Fade track above it", "Keyframe the Attach track", "Set Start Frame Offset", "Drag the upper corner edges of the section"]
        answer_index: 3
        explain: "Dragging the upper corner edges of an audio section blends the volume up and down for the duration of the blend."
      - q: "What happens when two audio sections on the same track overlap?"
        choices: ["The later one replaces the earlier one", "They crossfade for the duration of the overlap, with adjustable fade handles", "Sequencer shows an error", "The pitch of both is doubled"]
        answer_index: 1
        explain: "Intersecting sections crossfade for the overlap. You can adjust the crossfade by dragging each clip's fade handles independently."
      - q: "Which actors can you choose in an Audio Track's Attach property?"
        choices: ["Only actors that are currently referenced in the Level Sequence", "Any actor in the level", "Only Skeletal Mesh actors", "Only the active camera"]
        answer_index: 0
        explain: "You can only attach Audio Tracks to actors that are currently referenced in your Level Sequence."
      - q: "After attaching an audio track to an actor, what must you still set for 3D behavior?"
        choices: ["A Camera Cut", "An Attenuation Mode on each clip, unless the sound asset already has a Sound Attenuation", "The Looping flag", "A Time Dilation track"]
        answer_index: 1
        explain: "After attaching, you must specify an Attenuation Mode per audio clip to drive 3D audio, unless the Sound Wave or Cue already has attenuation assigned."
      - q: "You add an audio asset directly under a character's track with the character's Track (+). What is different about this Audio Track?"
        choices: ["It cannot be trimmed", "It plays only in Play In Editor", "It is attached to that actor and the attachment cannot be changed; there is no Attach track", "It ignores Attenuation"]
        answer_index: 2
        explain: "A dedicated Audio Track created under an actor is automatically attached to that actor, and its attachment cannot be changed to any other actor."
      - q: "What does Start Frame Offset do?"
        choices: ["Delays the section start on the timeline", "Changes the sequence start frame", "Sets the frame at which looping begins", "Offsets the playable region of the sound without changing the section duration, like slip editing; Shift + drag is the shortcut"]
        answer_index: 3
        explain: "Start Frame Offset works like slip editing: it adjusts which part of the sound plays without changing the duration. Holding Shift and dragging the clip is the mouse shortcut."
      - q: "You render with MRQ using 8 temporal samples and an audio track. What does the Image Settings page warn about?"
        choices: ["Audio sections cannot be auto-expanded for the extra evaluated time and may be skipped; you are notified after the render", "Audio is rendered at half speed", "WAV export is disabled above 4 samples", "The audio must be converted to a Sound Cue first"]
        answer_index: 0
        explain: "With Temporal Sample Count above 1 the sequence is evaluated before the frame start. Animation and audio sections cannot be auto-expanded and you are told after the render which sections to expand by hand."
    flavors:
      _default: {why: "Picture without sound is half a scene. Sequencer can carry music, effects and spatial sound in sync with the cut."}
      cinematics: {why: "Cutting to sound, and fading across cuts, is a basic editing skill.", do: "Place a music hit exactly on your hardest camera cut and show the frame in Sequencer."}
      animation: {why: "Footsteps and impacts attached to bones sell the weight of the motion.", do: "Attach a footstep sound to a foot bone using the Skeletal Mesh Component and Bone options."}
      tech_art: {why: "Attenuation assets and compression settings are shared pipeline decisions.", do: "Create one Sound Attenuation asset and reuse it on two audio sections."}

  - id: CQ25
