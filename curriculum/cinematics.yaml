  - id: CQ16
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [take-recorder, sequencer, recording]
    required_spine: false
    required: false
    title: Take Recorder
    brief: "Take Recorder is a tool that records what happens while the game runs and saves it as a Level Sequence. Recording a character or a camera is often faster than setting keys by hand. Each recording is called a take, and every take is saved, so you keep all your attempts. In this quest you record the player character walking around, review the recording, and record a second take."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/take-recorder-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/record-gameplay-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one, so that you have a player character. Enable the Take Recorder plugin in Edit > Plugins and restart the editor."
      - "Open Window > Cinematics > Take Recorder. Set the Slate name to Walk and the take number to 1. The slate is the name that groups your takes."
      - "Add the player character as a source, which is a thing that will be recorded. Click + Source and choose From Actor, or drag the character from the Outliner into Sources. If the character only exists while the game runs, press Play first and then pick it. Set Record Type to Spawnable."
      - "Also add Camera Cuts as a source."
      - "Press Play in the editor, then click the red Record button. Walk and turn for about 10 seconds. Then press the button again, or press Esc, to stop."
      - "Click Review Last Recording. Then open the Takes Browser and find the take under Cinematics > Takes."
      - "Record a second take with the same slate. Check that the take number went up to 2."
    done_when: "Send a screenshot of the Take Recorder panel with your two sources. Also send a screenshot of the recorded sequence open in Sequencer that shows the recorded transform and animation tracks."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Take Recorder will not record a property of an actor. What is the most likely reason per the docs?"
        choices: ["The property cannot be keyframed, so it has no track Sequencer can play back", "The actor is too far from the camera", "The take number is too high", "Only cameras can be recorded"]
        answer_index: 0
        explain: "Take Recorder only records a source that has a recorder and a track Sequencer can play. If a property cannot be keyframed, it cannot be recorded."
      - q: "You add Camera Cuts as a source. What does Take Recorder do when the active camera changes during recording?"
        choices: ["Stops the recording", "Creates a new camera actor and a new camera cut section", "Ignores the new camera", "Records only the first camera"]
        answer_index: 1
        explain: "With Camera Cuts as a source, all active cameras are recorded. Each camera change creates a new camera actor and camera cut section."
      - q: "What does the Level Visibility source record?"
        choices: ["Every level load during the take", "Level streaming distance", "Only the visible state of all levels at the start of the recording", "Actor visibility per frame"]
        answer_index: 2
        explain: "It records the visibility states of all Levels at the start. It does not record changes during the session."
      - q: "What does Record Speed change?"
        choices: ["The output frame rate", "The number of takes", "The camera focal length", "The engine's time dilation while recording"]
        answer_index: 3
        explain: "Record Speed edits the recording speed and overall time dilation of the engine, useful to match animation at a slower pace."
      - q: "You try to record with a take number that already exists. What happens?"
        choices: ["Take Recorder warns you and can switch to the next free number when you click the warning", "The old take is overwritten silently", "The editor crashes", "The record button turns green"]
        answer_index: 0
        explain: "A warning says a take with that number exists and where it is. Clicking the warning changes to the next available take number."
      - q: "Record Type on an actor source is set to Project Default. What decides possessable vs spawnable?"
        choices: ["The actor's mobility", "The Record to Possessable value in Take Recorder settings", "The current level name", "The frame rate"]
        answer_index: 1
        explain: "Project Default uses the project's Take Recorder setting Record to Possessable (true or false). Possessable or Spawnable override it."
      - q: "What does Reduce Keys do?"
        choices: ["Records fewer bones", "Lowers the frame rate", "Runs a Simplify on all keyframes after recording finishes", "Deletes the first keyframe"]
        answer_index: 2
        explain: "When enabled, Reduce Keys executes a Simplify operation on all keyframes once recording finishes."
      - q: "Which keyboard key stops a recording and saves the take?"
        choices: ["Space", "Enter", "F", "Esc"]
        answer_index: 3
        explain: "Click the record button again or press Esc to stop and save the current take."
    flavors:
      _default: {why: "Recording play and cameras is often faster than keyframing. Takes let you keep every attempt."}
      cinematics: {why: "Recorded camera moves and performances become shots you can edit like any clip.", do: "Use Layered Take Recording: review the first take, start a new recording from it, and add a second actor."}
      animation: {why: "Take Recorder turns gameplay or mocap into Animation data you can clean in Sequencer.", do: "Enable Reduce Keys on the source and compare the curve count with a take recorded without it."}

  - id: CQ17
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [sequencer, event-track, blueprint, director-blueprint]
    required_spine: false
    required: false
    title: "Event track: sequence talks to Blueprint"
    brief: "An Event Track lets a sequence run Blueprint logic at an exact frame, for example to play a sound, start an effect or open a door. The logic lives in the Director Blueprint, a Blueprint that belongs to the Level Sequence. Each event key calls an endpoint, which is a custom event inside that Blueprint. In this quest you make one event that passes a value to its endpoint, and a second event that calls a function on an actor in the sequence."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-event-track-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/fire-blueprint-events-during-cinematics-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/trigger-level-blueprint-events-from-sequencer-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open any Level Sequence, or make a new one with the Cinematics dropdown in the main toolbar and Add Level Sequence. Click Add Track (+), then Event Track, then Trigger. Add a key at frame 60."
      - "Right-click the key, open Properties, then Unbound, and choose Create New Endpoint. The Director Blueprint opens. Rename the endpoint to SpawnFX."
      - "In the Director Blueprint, connect SpawnFX to a Spawn Emitter at Location node, or to a node that prints a string, so that something visible happens."
      - "Select the endpoint and click Add Parameter (+). Name the parameter Scale and make it a float, which is a number with decimals. On the key, set the Payload value to 2.0, and use the value in the graph."
      - "Place a Point Light in the level and add it to the sequence with Track (+), then Actor to Sequencer. Add a second Event Track under this light. Use Quick Bind to call Set Visibility on it."
      - "Enable Call In Editor on the first key. Drag the playhead over frame 60 and see the event fire without pressing Play."
    done_when: "Send a screenshot of the Director Blueprint that shows the SpawnFX endpoint with the Scale parameter and the Quick Bind event that is bound to the object. Also send a screenshot of the Sequencer timeline with both Event tracks."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the difference between a Trigger event and a Repeater event?"
        choices: ["Trigger fires once per keyframe; Repeater fires every frame for the duration of its section", "Trigger is for cameras; Repeater is for lights", "Repeater fires once at the end", "There is no difference"]
        answer_index: 0
        explain: "Trigger events evaluate on the same frame as the keyframe. Repeater events evaluate for each frame while their section is active."
      - q: "Where does the logic for Event Track endpoints live?"
        choices: ["In the Level Blueprint", "In the Director Blueprint of that Level Sequence", "In the Game Mode", "In the Camera Actor"]
        answer_index: 1
        explain: "Each Level Sequence has its own Director Blueprint containing all logic for its events."
      - q: "You create a Trigger key. What must you do before it can run any logic?"
        choices: ["Set Call In Editor", "Add a Camera Cuts track", "Bind it to an Event Endpoint (Properties > Unbound > Create New Endpoint)", "Save the level"]
        answer_index: 2
        explain: "Both trigger and repeater events must be bound to an Event Endpoint. Creating a new endpoint opens the Director Blueprint."
      - q: "How do you send a value (for example a float) from the keyframe to the event?"
        choices: ["Use a Camera Shake", "Rename the endpoint", "Set Hierarchical Bias", "Add a parameter on the endpoint and set its value in the key's Payload"]
        answer_index: 3
        explain: "Add Parameter (+) on the endpoint creates a pin. Right-click the key and set the value under Payload; it is sent when the event fires."
      - q: "An Event Track is added under an actor binding. What extra benefit does this give?"
        choices: ["The event's target object is bound to that actor, and Quick Bind can call functions on it directly", "The event fires twice", "The actor becomes a spawnable", "The event becomes a Repeater"]
        answer_index: 0
        explain: "Creating the Event Track under a bound object makes an Object Binding, so the target object is that actor and you can Quick Bind its functions."
      - q: "What does Call In Editor do?"
        choices: ["Compiles the Director Blueprint", "Lets the event logic run in the editor without Play or Simulate", "Sends the event to the Level Blueprint", "Makes the key repeat"]
        answer_index: 1
        explain: "Call In Editor lets the event evaluate in the editor session. It appears once the event is bound to an endpoint."
      - q: "You preview a sequence many times and want a reset chain to run when scrubbing backward. Which properties help?"
        choices: ["Event Position and Time Scale", "Pass Bound Object To", "Fire Event when Forwards and Fire Event when Backwards", "Hierarchical Bias"]
        answer_index: 2
        explain: "One track can fire forward only (normal chain) and another backward only (reset chain), using the Forwards and Backwards properties."
      - q: "An event must run after spawnable actors exist. Which Event Position do you choose?"
        choices: ["At Start Of Evaluation", "At End Of Evaluation", "Before Spawn", "After Spawn"]
        answer_index: 3
        explain: "After Spawn fires after Spawnables have spawned and evaluated. At Start fires before anything else; At End fires last."
    flavors:
      _default: {why: "Events let a sequence call game logic at exact frames: sounds, VFX, doors, UI."}
