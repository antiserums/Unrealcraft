        choices: ["Draw Single Thumbnail", "Keep Cursor in Playback Range", "Lock the shot section", "Evaluate Sub Sequences In Isolation, in the Playback menu"]
        answer_index: 3
        explain: "By default a shot is shown in the context of the root sequence. Evaluate Sub Sequences In Isolation turns this context view off."
