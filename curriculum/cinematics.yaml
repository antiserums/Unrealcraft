    title: Render passes and layers
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-render-passes-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-render-settings-and-formats-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/transitioning-to-the-movie-render-graph-from-movie-render-queue-in-unreal-engine"
    checklist:
      - "Edit > Plugins: enable Movie Render Queue Additional Render Passes. Restart the editor."
      - "Open Movie Render Queue and add a job for a short shot (24 to 48 frames) from your Scene capstone."
      - "Under Deferred Rendering: enable Disable Multisample Effects and enable both MovieRenderQueue_WorldDepth and MovieRenderQueue_MotionVectors in Additional Post Process Materials."
      - "Add the Object Ids pass. Set Id Type to Actor."
      - "Add Anti-Aliasing: Spatial Sample Count 8, Override Anti Aliasing on, method None."
      - "Remove other exports. Add EXR Sequence with Multilayer enabled. Set File Name Format to {render_pass}/{sequence_name}.{frame_number}."
      - "Render. Open the output folder and one EXR in an image viewer or compositing tool that can read layers. Find the Object Ids (cryptomatte), WorldDepth and MotionVectors layers."
    done_when: "Screenshot of the MRQ settings list for the job, plus a screenshot of the output folder with pass subfolders, plus one frame shown with its Object Ids or depth layer visible."
    xp: 250
    verify_type: screenshot
    quiz:
      - q: "Which plugin must be enabled to render the Object Ids pass?"
        choices: ["Movie Render Graph", "OpenColorIO", "Movie Render Queue Additional Render Passes", "Composure"]
        answer_index: 2
        explain: "Object Ids need the Movie Render Queue Additional Render Passes plugin (Rendering section). The editor must restart after enabling it."
      - q: "Why can MRQ not output common AOVs like Ambient Occlusion or Sub-surface Scattering as separate passes?"
        choices: ["Because of the limits of Deferred Rendering, the final image cannot be assembled from all passes", "Because they need the Path Tracer", "Because EXR cannot store them", "Because they are only in shipping builds"]
        answer_index: 0
        explain: "The docs state that Deferred Rendering makes it impossible to output every pass needed to rebuild the final image. Only the listed passes are supported."
      - q: "Which File Name Format token puts each pass in its own subfolder?"
        choices: ["{shot_name}", "{camera_name}", "{version}", "{render_pass}"]
        answer_index: 3
        explain: "Using {render_pass}/{sequence_name}.{frame_number} separates passes into pass-named subfolders under the Output Directory."
      - q: "How are Object Ids stored in the output file?"
        choices: ["As a PNG mask per actor", "In the EXR using the Cryptomatte specification", "As a JSON list of actor names", "In the WAV metadata"]
        answer_index: 1
        explain: "Object Ids are written into the multilayer EXR using the Cryptomatte specification, which third-party plugins can read."
      - q: "For the Object Ids pass the docs say to use at least 8 Spatial Samples, not Temporal Samples. Why?"
        choices: ["Temporal samples are slower to compute", "Temporal samples need TAA, which is disabled", "Without motion blur between samples, temporal sampling gives faint multiple copies of objects", "Spatial samples support alpha"]
        answer_index: 2
        explain: "Temporal samples move objects in time but there is no motion blur covering the gap, so you get several faint copies of each object superimposed."
      - q: "What does Disable Multisample Effects do, and why does the Object Ids workflow need it?"
        choices: ["It turns off DoF, TAA, motion blur and chromatic aberration so IDs line up with crisp edges", "It disables spatial sampling", "It removes stencil layers", "It halves render time"]
        answer_index: 0
        explain: "Those post effects blend many pixels together. Turning them off keeps edges crisp so the ID pass matches the final image."
      - q: "Where can the Object Ids render pass be used?"
        choices: ["Only in packaged Android builds", "In any shipping build", "Only with the Path Tracer", "Only in the Unreal Editor, not in shipping builds"]
        answer_index: 3
        explain: "The pass is experimental and editor-only. It cannot be used in shipping builds."
      - q: "How is World Depth stored in the post process pass?"
        choices: ["Normalized 0 to 1 in the alpha channel", "In world units in the red channel", "In centimeters in the blue channel", "As a separate PNG"]
        answer_index: 1
        explain: "World Depth is written in world units into the red channel, and camera focal data in the EXR metadata lets a compositor rebuild depth of field."
      - q: "In the Motion Vectors pass, what value means no motion?"
        choices: ["0, 0", "1, 1", "0.5, 0.5", "-1, -1"]
        answer_index: 2
        explain: "Motion vectors are stored in 0 to 1 space for X and Y, with 0.5, 0.5 meaning no motion."
      - q: "Which statement about Stencil Layers is true?"
        choices: ["They are not true layers: translucent objects show other layers behind them, and background layers have black holes where foreground objects are", "Each layer renders only its own objects and nothing else", "They support a different post process material per layer", "They cannot keep an alpha channel"]
        answer_index: 0
        explain: "The whole scene renders for each layer and other pixels are clipped to black. The docs warn it is not a true layer system and lists those limits."
      - q: "You want to recombine stencil layers in a compositing tool. Which output setup does the docs page recommend?"
        choices: ["PNG with tone curve on", "JPG at 100 quality", "BMP with alpha", "EXR in linear space with the Tone Curve disabled, using an OCIO workflow"]
        answer_index: 3
        explain: "To recombine images they should be exported linear (Disable Tone Curve in Color Output), and an OCIO-based workflow is recommended."
      - q: "In Movie Render Graph, where are Temporal and Spatial sample counts set?"
        choices: ["Both on the Output node", "Temporal on the global Sampling Method node, Spatial per render layer on the Renderer node", "Both on the Game Overrides node", "Temporal per layer, Spatial global"]
        answer_index: 1
        explain: "MRG splits them: Temporal Samples are global in the Sampling Method node, while Spatial Samples and the AA method are per render layer on the Renderer node."
    flavors:
      _default: {why: "Passes let a compositor fix or restyle parts of a frame without a full re-render."}
      cinematics: {why: "A pass hand-off is how cinematics work leaves Unreal and enters post. Getting IDs, depth and motion vectors right saves days.", do: "Use the Object Ids layer in a compositing tool to recolor one object, then show before and after."}
      lookdev: {why: "Stencil layers and IDs let you tune one material in post without touching the rest of the shot.", do: "Render one stencil layer for a single hero prop and hue-shift it in post."}
      tech_art: {why: "The same MRQ setup can be built as a Movie Render Graph and reused across shots.", do: "Rebuild this job in Movie Render Graph with two render layers and note what differs."}

