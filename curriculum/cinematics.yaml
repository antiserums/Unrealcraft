  - id: CQ50
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [retargeting, ik-rig, ik-retargeter, animation]
    required_spine: false
    required: false
    title: Retarget a clip for a new actor
    brief: "Retargeting means copying an animation from one character to another character that has a different skeleton. Shots often need a clip that only exists for another character, and retargeting gives it to your actor in minutes. Unreal does this with an IK Rig for each character, which names the main bone chains such as arms and legs, and an IK Retargeter, which maps the chains of one rig to the other. In this quest you retarget a mannequin clip the automatic way and then the manual way."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/retargeting-bipeds-with-ik-rig-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/auto-retargeting-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Get a second two-legged character that has a different skeleton. The template has only one skeleton, so add a free character from Fab, Epic's asset store, to the project. Keep the Mannequin from the template as the source."
      - "Try the quick way first. Right-click an Animation Sequence of the Mannequin and choose Retarget Animation Assets. Set Target Preview Mesh to your new character and export one clip with the suffix _Auto."
      - "Now do it by hand. Create an IK Rig for each mesh with Add (+), then Animation, then IK Rig. In each rig, right-click the pelvis or hip bone and choose Set Retarget Root."
      - "In each IK Rig, make chains for Spine, Left Arm, Right Arm, Neck, Head, Left Leg and Right Leg. Select the bones of a chain and use New Retarget Chain from Selected Bones, and choose No Goal."
      - "Create an IK Retargeter from the source rig with Add (+), then Animation, then IK Retargeter. Set the Target IKRig Asset. Check the Chain Mapping and the reference poses of both characters."
      - "Preview a walk clip, then use Export Selected Animations. Put the exported clip on your new character in a Level Sequence named LS_Retarget and frame it with a camera."
    done_when: "Send a screenshot of the IK Retargeter editor that shows both characters and the Chain Mapping panel. Also send a screenshot of LS_Retarget playing the retargeted clip on the new character."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which bone is normally set as the Retarget Root in each IK Rig?"
        choices: ["The head", "The pelvis or hip bone", "The left foot", "The root of the Level Sequence"]
        answer_index: 1
        explain: "The Retarget Root is typically the pelvis or hip bone. It lets root motion transfer in a proportional way."
      - q: "Both characters have similar proportions and similar bone hierarchies. What does the guide suggest?"
        choices: ["Compatible Skeletons may be the better choice", "IK Rig is the only option", "Use a Geometry Cache instead", "Retargeting is not possible"]
        answer_index: 0
        explain: "IK Rig retargeting is for very different skeletons. For similar characters, Compatible Skeletons may be better."
      - q: "When you create a retarget chain, the dialog asks for a Goal. What is the usual choice?"
        choices: ["Full Body IK goal", "Limb IK goal", "No Goal", "Two goals per chain"]
        answer_index: 2
        explain: "Select No Goal. IK Goals are only needed for extra adjustments such as speed planting or stride warping."
      - q: "A chain with only one bone (for example the head). Is this valid?"
        choices: ["No, chains need at least two bones", "Only for legs", "Only if a goal is added", "Yes, Start Bone and End Bone are the same bone"]
        answer_index: 3
        explain: "A chain can be a single bone. The chain entry has the same bone as Start Bone and End Bone."
      - q: "The source is T-posed and the target is A-posed. What must you do before retargeting?"
        choices: ["Nothing, poses are ignored", "Delete the target IK Rig", "Adjust one retarget pose so both reference poses match", "Set Play Rate to 1"]
        answer_index: 2
        explain: "Both characters need matching reference poses. Adjust one of the retarget poses so they match."
      - q: "What suffix do exported retargeted animations get?"
        choices: ["_Retargeted", "_IK", "_Copy", "_Target"]
        answer_index: 0
        explain: "Exported animations are placed in the output folder with the postfix _Retargeted."
      - q: "In the Content Browser you use Retarget Animation Assets. Auto Generate Retargeter is enabled. What happens?"
        choices: ["You must pick an IK Retargeter asset", "IK Rig assets and an IK Retargeter are created automatically", "Only the first animation is retargeted", "The export button is hidden"]
        answer_index: 1
        explain: "With Auto Generate Retargeter enabled (the default), the tool creates IK Rigs and an IK Retargeter for the source and target meshes by itself."
      - q: "What does the Auto Retarget Chains tool in the IK Rig editor rely on?"
        choices: ["Vertex colors", "Bone names matched against templates", "The Physics Asset", "The Animation Blueprint"]
        answer_index: 1
        explain: "It analyzes the skeleton hierarchy and tries to match bone chains with pre-configured templates based on bone names. Exact matches are not required."
    flavors:
      _default: {why: "Shots often need a clip that only exists for another character. Retargeting gives it to your actor in minutes."}
      animation: {why: "Retargeting is the base of animation sharing between characters.", do: "Add Limb IK goals on the feet and adjust the root settings to change the bounce of the walk."}

  - id: CQ51
