      - "Drag a Skeletal Mesh or a Blueprint from the Content Browser into an empty area of Sequencer. Note the lightning bolt icon. This is a Spawnable."
      - "Right-click the possessable prop and choose Convert to Spawnable. Play the sequence and watch the Outliner as the actor appears and disappears."
      - "Right-click the spawnable track, open the Spawnable category and set Spawned Object Owner to External. Play again and confirm the actor stays after the sequence ends. Set it back to This Sequence."
