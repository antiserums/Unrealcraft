    difficulty: expert
    specializations: [cinematics]
    subjects: [sequencer, spawnables, possessables, bindings]
    required_spine: false
    required: true
    title: Spawnables vs possessables
    brief: "An actor in a sequence is bound to it in one of two ways. A Possessable is an actor that already exists in the level, and the sequence only takes control of it. A Spawnable is created by the sequence when it plays and removed when it ends. Choosing the wrong type is a common reason why a cinematic breaks when the level changes. In this quest you create both types, convert one into the other, and change who owns a spawned actor."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/spawn-temporary-actors-in-unreal-engine-cinematics"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-actor-tracks-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/dynamic-binding-in-sequencer"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-cameras-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a Level Sequence named LS_Bindings. Place a prop in the level, for example a cube, select it and add it with Track (+), then Actor to Sequencer. This is a Possessable. Add keyframes to its Transform."
      - "Drag a Skeletal Mesh or a Blueprint from the Content Browser into an empty area of Sequencer. Notice the lightning bolt icon. This is a Spawnable."
