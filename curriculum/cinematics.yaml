        explain: "SRT files import as Basic Overlay assets. The Convert Basic Overlays to Subtitles scripted action turns them into Subtitle assets."
      - q: "Where do you change the font and color of subtitles?"
        choices: ["In the DefaultSubtitleWidget set in Project Settings > Game > Subtitles and Closed Captions", "On each subtitle asset", "In the Sound Wave details", "In the Sequencer track color"]
        answer_index: 0
        explain: "Subtitles are displayed with a TextBlock widget. The DefaultSubtitleWidget holds independent display settings for subtitles, closed captions and audio descriptions."
      - q: "Which item is NOT part of the Movie Render Queue Burn In?"
        choices: ["Focal length, f-stop and focus distance of the camera", "The Level name", "The GPU model of the render machine", "The job name"]
