      - "In LS_Master, click Tracks (+) > Shots Track. Then use (+) Shot > Insert Shot three times. Keep the default shot names."
      - "Open each shot (double-click). Add a Cine Camera and a small camera move in each one. Use the breadcrumbs to go back to LS_Master."
      - "Trim the three shots so they play one after another with no gaps. Give each shot a different Color Tint (right-click > Properties > Color Tint)."
      - "Right-click shot 2 and choose New Take. Change the camera move in the take. Switch between Take 1 and Take 2 from the Takes menu."
      - "Right-click shot 1 > Edit Meta Data. Enter your name and a one-line note."
      - "Add a Folder track and move any loose tracks into it so the root sequence is tidy."
    done_when: "Screenshot of LS_Master showing the Shots track with 3 colored shots, the Takes menu open on shot 2 showing two takes (star on the active one), and the meta-data tooltip on shot 1."
    xp: 170
