    title: Trigger a sequence from Blueprint
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/play-cinematics-from-blueprints-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/what-happens-when-my-cinematic-ends-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/sequencer-blueprint-component-in-unreal-engine"
    checklist:
      - "Place a Box Trigger in your level. Create a Level Sequence LS_Cutscene with one camera move and a Point Light that goes from Intensity 0 to a bright value."
      - "Open the Level Blueprint. Add OnActorBeginOverlap for the trigger. Create a reference to the LS_Cutscene actor and call Play on its Sequence Player."
      - "Add Set Playback Position (position 0) before Play so the cutscene can play again when you re-enter the trigger."
      - "Add an F key event: Branch on Is Playing, then Go to End and Stop. Test that F skips the cutscene."
      - "Right-click the light Intensity track > Properties > When Finished = Keep State. Check the Level Sequence Actor does not have Restore State on."
      - "Play in Editor. Enter the trigger, watch the cutscene, leave and enter again, then skip with F."
    done_when: "Screenshot of the Level Blueprint graph (overlap > Set Playback Position > Play, and the F key > Branch > Go to End and Stop) plus a screenshot in PIE after skipping that shows the light still on."
    xp: 170
    verify_type: screenshot
    quiz:
      - q: "In the Level Blueprint, which node starts the Level Sequence when the player enters the trigger?"
        choices: ["Play (SequencePlayer), from a reference to the Level Sequence actor", "Open Level", "Set Actor Hidden In Game", "Spawn Actor from Class"]
        answer_index: 0
        explain: "You create a reference to the Level Sequence actor, drag off it, and call Play on its Sequence Player. Connect it after OnActorBeginOverlap."
      - q: "The cutscene plays the first time you enter the trigger, but not the second time. What is the fix from the docs?"
        choices: ["Enable Auto Play", "Call Set Playback Position with position 0 before Play", "Use a second trigger box", "Set Loop to true"]
        answer_index: 1
        explain: "After playing to the end the player stays at the end. Set Playback Position 0 (or the start) before Play rewinds it so it can play again."
      - q: "The player presses F to skip. You want the light that the cutscene turns on to still be on afterward. Which node?"
        choices: ["Stop", "Pause", "Go to End and Stop", "Set Play Rate 0"]
        answer_index: 2
        explain: "Go to End and Stop jumps to the end so every change Sequencer would have made is applied. Plain Stop would stop where it is and the light might not be fully on."
      - q: "A track's When Finished property is set to Restore State. What happens when the section ends?"
        choices: ["The value freezes at its last keyframe", "The track is deleted", "The sequence loops", "The property returns to its value before Sequencer animated it"]
        answer_index: 3
        explain: "Restore State returns the actor to its pre-animated state. Keep State keeps the change. Restore State is the default shown in the docs."
      - q: "You set a track to Keep State but the change is still lost when the sequence stops. What is the most likely cause?"
        choices: ["The Level Sequence Actor has Restore State enabled, which overrides the track setting", "Keep State only works in Standalone game", "You need a Camera Cuts track", "Keep State needs a Shots track"]
        answer_index: 0
        explain: "The Level Sequence actor has a global Restore State option. If it is on, it overrides the local Keep State on the track."
      - q: "Where do you turn on Auto Play so the sequence starts when the level starts?"
        choices: ["Project Settings > Cinematics", "In the Details panel of the Level Sequence Actor in the level", "Inside the Director Blueprint", "In the Content Browser asset settings"]
        answer_index: 1
        explain: "Select the Level Sequence Actor in the level and set Auto Play to True in its Details panel."
      - q: "In the how-to, what does the Branch before Go to End and Stop check?"
        choices: ["Is Valid", "Has Authority", "Is Playing", "Is Looping"]
        answer_index: 2
        explain: "The F key event goes through a Branch with condition Is Playing, so the skip only happens while the sequence is playing."
      - q: "You want the same small animation on many copies of one Blueprint actor, with no dependency on a level. Which tool from the docs fits?"
        choices: ["A Camera Rig Rail", "A Shots track", "Take Recorder", "An Actor Sequence Component embedded in the Actor Blueprint"]
        answer_index: 3
        explain: "The (experimental) Actor Sequence plugin lets you embed a sequence in an Actor Blueprint. It can Auto Play or be played from the Event Graph, and works in any level."
