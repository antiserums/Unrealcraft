        answer_index: 0
        explain: "Higher priority wins, even for partial overlap. When a queued subtitle is not displayed because of a priority conflict, a warning is sent to the debug log."
      - q: "In Sequencer, what controls how long a subtitle is displayed?"
        choices: ["The Duration property", "The Sound Wave length", "The Priority value", "The section's range start and end"]
        answer_index: 3
        explain: "In Sequencer the subtitle duration is controlled by the selection range start and end, not by the Duration property."
      - q: "What is the quickest way to give a Sound Wave a subtitle?"
        choices: ["Rename the Sound Wave", "Right-click the Sound Wave > Scripted Actions > Sound > Add Blank Subtitle", "Type text in the Sound Wave comment", "Add a Text Render actor"]
        answer_index: 1
        explain: "Add Blank Subtitle creates a new Subtitle asset and makes the Sound Wave reference it in its Asset User Data."
