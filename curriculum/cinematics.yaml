  - id: CQ26
    rank: 4
    difficulty: master
    specializations: [cinematics]
    subjects: [movie-render-queue, render-passes, compositing, exr]
    required_spine: false
    required: true
    title: Render passes and layers
    brief: "A render pass is an extra image that holds one kind of information about a frame, such as the distance of each pixel from the camera or which object each pixel belongs to. A compositor, the person who finishes the picture in another program, uses passes to fix or restyle parts of a frame without a new render. In this quest you render a short shot with depth, motion and Object Ids passes into EXR files that hold several layers."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-render-passes-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-render-settings-and-formats-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/transitioning-to-the-movie-render-graph-from-movie-render-queue-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open Edit > Plugins and enable Movie Render Queue Additional Render Passes. Restart the editor."
      - "You need a short shot of 24 to 48 frames with a camera and a few actors in view. If you have none, choose Add Level Sequence in the Cinematics dropdown of the main toolbar, click the Camera button in Sequencer, and set two keys on the camera. Open Movie Render Queue and add a job for this shot."
      - "Under Deferred Rendering, enable Disable Multisample Effects. In Additional Post Process Materials, enable both MovieRenderQueue_WorldDepth and MovieRenderQueue_MotionVectors."
      - "Add the Object Ids pass and set Id Type to Actor. This pass gives every actor its own mask."
      - "Add the Anti-Aliasing setting. Set Spatial Sample Count to 8, turn on Override Anti Aliasing, and set the method to None."
      - "Remove the other exports. Add EXR Sequence and enable Multilayer. Set File Name Format to {render_pass}/{sequence_name}.{frame_number}."
      - "Render the job. Open the output folder, and open one EXR file in an image viewer or compositing tool that can read layers. Find the Object Ids (cryptomatte), WorldDepth and MotionVectors layers."
    done_when: "Send a screenshot of the MRQ settings list of the job, a screenshot of the output folder with the pass subfolders, and one frame shown with its Object Ids layer or its depth layer visible."
    xp: 250
    verify_type: screenshot
    quiz:
      - q: "Which plugin must be enabled to render the Object Ids pass?"
        choices: ["Movie Render Graph", "OpenColorIO", "Movie Render Queue Additional Render Passes", "Composure"]
        answer_index: 2
        explain: "Object Ids need the Movie Render Queue Additional Render Passes plugin (Rendering section). The editor must restart after enabling it."
      - q: "Why can MRQ not output common AOVs like Ambient Occlusion or Sub-surface Scattering as separate passes?"
        choices: ["Because of the limits of Deferred Rendering, the final image cannot be assembled from all passes", "Because they need the Path Tracer", "Because EXR cannot store them", "Because they are only in shipping builds"]
        answer_index: 0
        explain: "The docs state that Deferred Rendering makes it impossible to output every pass needed to rebuild the final image. Only the listed passes are supported."
      - q: "Which File Name Format token puts each pass in its own subfolder?"
        choices: ["{shot_name}", "{camera_name}", "{version}", "{render_pass}"]
        answer_index: 3
        explain: "Using {render_pass}/{sequence_name}.{frame_number} separates passes into pass-named subfolders under the Output Directory."
      - q: "How are Object Ids stored in the output file?"
        choices: ["As a PNG mask per actor", "In the EXR using the Cryptomatte specification", "As a JSON list of actor names", "In the WAV metadata"]
        answer_index: 1
        explain: "Object Ids are written into the multilayer EXR using the Cryptomatte specification, which third-party plugins can read."
      - q: "For the Object Ids pass the docs say to use at least 8 Spatial Samples, not Temporal Samples. Why?"
        choices: ["Temporal samples are slower to compute", "Temporal samples need TAA, which is disabled", "Without motion blur between samples, temporal sampling gives faint multiple copies of objects", "Spatial samples support alpha"]
        answer_index: 2
        explain: "Temporal samples move objects in time but there is no motion blur covering the gap, so you get several faint copies of each object superimposed."
      - q: "What does Disable Multisample Effects do, and why does the Object Ids workflow need it?"
        choices: ["It turns off DoF, TAA, motion blur and chromatic aberration so IDs line up with crisp edges", "It disables spatial sampling", "It removes stencil layers", "It halves render time"]
        answer_index: 0
        explain: "Those post effects blend many pixels together. Turning them off keeps edges crisp so the ID pass matches the final image."
      - q: "Where can the Object Ids render pass be used?"
        choices: ["Only in packaged Android builds", "In any shipping build", "Only with the Path Tracer", "Only in the Unreal Editor, not in shipping builds"]
        answer_index: 3
        explain: "The pass is experimental and editor-only. It cannot be used in shipping builds."
      - q: "How is World Depth stored in the post process pass?"
        choices: ["Normalized 0 to 1 in the alpha channel", "In world units in the red channel", "In centimeters in the blue channel", "As a separate PNG"]
        answer_index: 1
        explain: "World Depth is written in world units into the red channel, and camera focal data in the EXR metadata lets a compositor rebuild depth of field."
      - q: "In the Motion Vectors pass, what value means no motion?"
        choices: ["0, 0", "1, 1", "0.5, 0.5", "-1, -1"]
        answer_index: 2
        explain: "Motion vectors are stored in 0 to 1 space for X and Y, with 0.5, 0.5 meaning no motion."
      - q: "Which statement about Stencil Layers is true?"
        choices: ["They are not true layers: translucent objects show other layers behind them, and background layers have black holes where foreground objects are", "Each layer renders only its own objects and nothing else", "They support a different post process material per layer", "They cannot keep an alpha channel"]
        answer_index: 0
        explain: "The whole scene renders for each layer and other pixels are clipped to black. The docs warn it is not a true layer system and lists those limits."
      - q: "You want to recombine stencil layers in a compositing tool. Which output setup does the docs page recommend?"
        choices: ["PNG with tone curve on", "JPG at 100 quality", "BMP with alpha", "EXR in linear space with the Tone Curve disabled, using an OCIO workflow"]
        answer_index: 3
        explain: "To recombine images they should be exported linear (Disable Tone Curve in Color Output), and an OCIO-based workflow is recommended."
      - q: "In Movie Render Graph, where are Temporal and Spatial sample counts set?"
        choices: ["Both on the Output node", "Temporal on the global Sampling Method node, Spatial per render layer on the Renderer node", "Both on the Game Overrides node", "Temporal per layer, Spatial global"]
        answer_index: 1
        explain: "MRG splits them: Temporal Samples are global in the Sampling Method node, while Spatial Samples and the AA method are per render layer on the Renderer node."
    flavors:
      _default: {why: "Passes let a compositor fix or restyle parts of a frame without a full re-render."}
      cinematics: {why: "A pass hand-off is how cinematics work leaves Unreal and enters post. Getting IDs, depth and motion vectors right saves days.", do: "Use the Object Ids layer in a compositing tool to recolor one object, then show before and after."}
      lookdev: {why: "Stencil layers and IDs let you tune one material in post without touching the rest of the shot.", do: "Render one stencil layer for a single hero prop and hue-shift it in post."}
      tech_art: {why: "The same MRQ setup can be built as a Movie Render Graph and reused across shots.", do: "Rebuild this job in Movie Render Graph with two render layers and note what differs."}

  - id: CQ27
    rank: 4
    difficulty: master
    specializations: [cinematics]
    subjects: [path-tracer, rendering, movie-render-queue, ray-tracing]
    required_spine: false
    required: true
    title: Path Tracer for final frames
    brief: "The Path Tracer is a render mode that follows the path of light rays through the scene very exactly. It gives lighting that is very close to reality with almost no setup, but each frame takes much longer to render. In this quest you turn the Path Tracer on, render a still frame and a moving shot with it, and compare the result and the render time with the normal renderer."
    time_min: 120
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/path-tracer-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-render-passes-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/nne-denoiser-in-unreal-engine"
    community_urls:
      - {title: "Introduction to Path Tracing | Unreal Engine 5.1 (WINBUSH)", url: "https://www.youtube.com/watch?v=ZRLuaGuvrdw"}
    checklist:
      - "Open any project, or create one from the Third Person template, and work in a lit level with a few objects. Open Project Settings. Set Default RHI to DirectX 12, and enable Support Hardware Ray Tracing and Enable Path Tracing. Accept Support Compute Skin Cache when the editor asks. Restart the editor."
      - "In the viewport, open View Modes and choose Path Tracing. Let the frame converge, which means waiting until the noise is gone. Note how long it takes to become clean."
      - "Place a Post Process Volume with Infinite Extent (Unbound) turned on, or select the one your level already has. Open its PathTracing category. Set Max Bounces, Samples Per Pixel and Max Path Intensity. Turn Emissive Materials off and on, and look for places that are lit twice."
      - "Check the materials in the level. Keep the diffuse Base Color below 0.8, and fix any bright white walls."
      - "Make a Level Sequence with a camera for the render: choose Add Level Sequence in the Cinematics dropdown of the main toolbar, click the Camera button in Sequencer, and set two keys on the camera that are 48 frames apart. Create a job for it in Movie Render Queue (MRQ). Remove Deferred Rendering and add the Path Tracer renderer. For a still frame, use Spatial Sample Count 16 and Temporal 1. Render one frame and note the time."
      - "For a moving shot of 48 frames, use Spatial 1 and Temporal 8, and enable Reference Motion Blur. Render it and note the seconds per frame."
      - "Compare a Path Tracer frame with the same frame rendered with Deferred Rendering. Write three differences that you can see."
    done_when: "Send one path-traced still and one frame from the moving shot, a screenshot of the MRQ settings list, and a short note with the seconds per frame for both renders and the three differences you saw."
    xp: 250
    verify_type: screenshot
    quiz:
      - q: "Which project setting is NOT part of the Path Tracer requirements listed in the docs?"
        choices: ["Default RHI set to DirectX 12", "Support Hardware Ray Tracing enabled", "Lumen Global Illumination enabled", "Enable Path Tracing enabled"]
        answer_index: 2
        explain: "The Path Tracer needs DX12, Support Hardware Ray Tracing and Enable Path Tracing. Lumen is not part of the requirement list."
      - q: "When you enable Support Hardware Ray Tracing, a pop-up asks about another setting. Which one?"
        choices: ["Support Compute Skin Cache", "Nanite", "Virtual Shadow Maps", "Enable Alpha Channel Support"]
        answer_index: 0
        explain: "Support Compute Skin Cache is required for hardware ray tracing and path tracing, so the editor asks you to enable it."
      - q: "An interior render is very slow. Which material change does the docs page recommend?"
        choices: ["Set roughness to 1", "Use only Unlit materials", "Increase Max Bounces", "Keep diffuse Base Color below 0.8"]
        answer_index: 3
        explain: "Albedo close to 1.0 makes rays bounce for a long time before Russian Roulette can end them. The docs recommend Base Color under 0.8."
      - q: "In the editor viewport a skinned character looks blurred and streaky under the Path Tracer. What is the correct fix?"
        choices: ["Increase Samples Per Pixel in the Post Process Volume", "Render the final frames with Movie Render Queue", "Disable Compute Skin Cache", "Turn off denoising"]
        answer_index: 1
        explain: "Animation does not invalidate the accumulated samples in the editor, so it streaks. MRQ renders each frame cleanly, so use it for final output."
      - q: "In MRQ, how is the total number of samples per pixel computed?"
        choices: ["Spatial plus Temporal", "Spatial only", "Spatial multiplied by Temporal", "Temporal only"]
        answer_index: 2
        explain: "The total is the product of the two counts, so 4 spatial and 4 temporal gives 16 samples per pixel."
      - q: "The docs give a sampling recommendation for stills and for animations. Which is it?"
        choices: ["Stills: all spatial with 1 temporal. Animations: 1 spatial with many temporal and Reference Motion Blur on", "Stills: many temporal. Animations: many spatial", "Always 4 and 4", "Stills: 1 and 1. Animations: 16 spatial"]
        answer_index: 0
        explain: "For stills put everything in spatial samples. For moving shots use 1 spatial and many temporal samples with Reference Motion Blur for the best blur."
      - q: "You set Samples Per Pixel in the Post Process Volume, but MRQ ignores it. Why?"
        choices: ["The volume must be Unbound", "Samples Per Pixel only works on Windows 11", "The Path Tracer plugin is missing", "MRQ uses its own Spatial Sample Count; the volume's Samples Per Pixel is ignored in MRQ"]
        answer_index: 3
        explain: "The docs state that the Post Process Volume samples per pixel setting is ignored when using MRQ. Use the Anti-aliasing Spatial Sample Count."
      - q: "You turn off Emissive Materials in the PathTracing post process settings. What happens?"
        choices: ["Emissive surfaces turn black", "Emissive surfaces are still visible to the camera but no longer light the scene", "All lights are disabled", "Emissive surfaces double their brightness"]
        answer_index: 1
        explain: "The colors stay visible to camera rays but do not emit light. This helps avoid double counting when a light fixture has both emissive geo and a real light."
      - q: "Which setting exists mainly to reduce firefly artifacts?"
        choices: ["Reference Atmosphere", "Max Bounces", "Max Path Intensity", "Filter Width"]
        answer_index: 2
        explain: "Max Path Intensity clamps the maximum exposure allowed for a path, which reduces firefly artifacts."
      - q: "You use an HDRIBackdrop with the Path Tracer and get double lighting. What does the docs page suggest?"
        choices: ["Use a Sky Light with the texture and set r.PathTracing.VisibleLights 2 so the backdrop shows", "Increase Max Bounces to 32", "Enable Emissive Materials", "Switch to Lumen"]
        answer_index: 0
        explain: "HDRIBackdrop is not compatible with the Path Tracer. Use a Sky Light with the HDRI and make it visible with r.PathTracing.VisibleLights 2."
      - q: "Reference Motion Blur is enabled in MRQ. How does sampling change?"
        choices: ["Spatial samples are doubled", "Denoising happens after each spatial sample", "Temporal samples are ignored", "All temporal samples are taken before denoising, so keep Spatial at 1 and use temporal samples"]
        answer_index: 3
        explain: "With Reference Motion Blur, temporal samples are accumulated before the denoiser runs. The docs recommend Spatial 1 and driving quality with temporal samples."
      - q: "The Denoiser toggle in the Post Process Volume does nothing. What is the most likely reason?"
        choices: ["Max Bounces is too low", "The denoiser plugin (NNE Denoiser by default) is not enabled", "The camera is orthographic", "Temporal samples are above 8"]
        answer_index: 1
        explain: "The toggle uses the loaded denoiser plugin. If no denoiser plugin is enabled it has no effect on the output."
    flavors:
      _default: {why: "The Path Tracer gives ground-truth lighting with almost no setup, but it costs render time. You must know when it pays off."}
      cinematics: {why: "Final-frame cinematics often go through the Path Tracer for hero shots. Knowing sampling and its limits keeps a render farm night from being wasted.", do: "Render the same 48 frames at temporal 4 and temporal 16 and show the time and quality difference."}
      lookdev: {why: "The Path Tracer is your reference for checking that real-time materials and lights are believable.", do: "Compare one material under Lumen and the Path Tracer and note where they differ."}
      tech_art: {why: "Firefly clamps, denoiser plugins and CVars are the knobs a tech artist tunes for the team.", do: "Add a Console Variables setting to the MRQ job with one Path Tracer CVar and explain what it does."}

  - id: CQ28
    rank: 4
    difficulty: master
    specializations: [cinematics]
    subjects: [movie-render-queue, anti-aliasing, high-resolution, render-budget]
    required_spine: false
    required: true
    title: High-quality settings and their cost
    brief: "Every quality setting in Movie Render Queue makes a render take longer, and the costs multiply. Before you start a long render, you should know what each setting costs on your machine. In this quest you render the same 48-frame shot three times with rising quality, measure the time of each render, and write a rule for what fits into one night of rendering."
    time_min: 120
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-rendering-image-quality-settings-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-workflow-tips-for-sequencer-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-render-settings-and-formats-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Pick a shot of 48 frames with a moving camera and one moving object. To make one, choose Add Level Sequence in the Cinematics dropdown of the main toolbar, click the Camera button in Sequencer, set two keys on the camera, and add a cube with two Transform keys. Add the sequence to Movie Render Queue as a job. Add a Burn In setting, which prints information on the image, so that each frame shows the job name and frame number."
      - "Render A: in Anti-Aliasing use Spatial 1 and Temporal 1, and export a PNG Sequence at 1920x1080. Write down the seconds per frame and the total time."
      - "Render B: use Spatial 1 and Temporal 8, turn on Override Anti Aliasing and set the method to None. Extend your tracks one frame before the start, so that the first temporal sample has data. Note the time."
      - "Render C: use the same settings as B, and add High Resolution with Tile Count 2 and Overlap Ratio 0.1 at 3840x2160. Note the time."
      - "Add a particle effect to the shot: in the Content Browser, create a Niagara System from one of the templates, such as a fountain, and place it in view of the camera. Add Engine Warm Up Count 32 and Render Warm Up Count 8 to the job. Compare the first frame with warm-up and without it."
      - "Make a table with these columns: render, settings, seconds per frame, total minutes, and what got better. Add the file name format you used, which must include the {ts_count} and {ss_count} tokens."
      - "Write a budget rule of 3 lines: for a film of 60 seconds at 24 fps, which settings fit into an overnight render on your machine."
    done_when: "Send a writeup with the table for renders A, B and C (seconds per frame and total time), one frame from each render, a comparison of the first frame with and without warm-up, and your budget rule."
    xp: 250
    verify_type: writeup
    quiz:
      - q: "How does Temporal sampling produce motion blur?"
        choices: ["It jitters the camera position each sample", "It slices the time the shutter is open into steps, renders each and blends them, which gives rotational blur", "It blurs the image in post with a vector pass", "It renders at half resolution and upsamples"]
        answer_index: 1
        explain: "Temporal samples divide the shutter-open time into slices. The engine ticks to each slice and the results accumulate, so blur can curve and rotate."
      - q: "Spatial and Temporal samples give the same anti-aliasing offsets. Why does the docs page say temporal is usually more efficient?"
        choices: ["Temporal samples are free on the GPU", "Spatial samples cannot exceed 4", "Temporal samples skip post processing", "Static objects get the same anti-aliasing, and moving objects also get blur that hides aliasing"]
        answer_index: 3
        explain: "With temporal samples, non-moving objects are anti-aliased the same, and moving objects are blurred, so you get more benefit per sample."
      - q: "TAA is on and you use 16 samples. What does the docs page recommend?"
        choices: ["Enable Override Anti-Aliasing and set it to None, or raise r.TemporalAASamples to match the sample count", "Nothing, TAA handles it", "Lower the resolution", "Use MSAA"]
        answer_index: 0
        explain: "TAA limits the unique positions to r.TemporalAASamples, which defaults to 8. With more samples, disable TAA or raise that value."
      - q: "You set Temporal Sample Count above 1. What must you check in Sequencer?"
        choices: ["The frame rate must be 60", "Cameras must be spawnables", "Tracks must cover the time before the first frame; animation and audio sections cannot auto-expand", "The shot must be a subsequence"]
        answer_index: 2
        explain: "The sequence is evaluated on both sides of each frame. Sections auto-expand where possible, but animation and audio cannot, so you extend them by hand."
      - q: "High Resolution Tile Count is set to 2. How many tiles are rendered per frame?"
        choices: ["2", "4", "8", "16"]
        answer_index: 1
        explain: "Tile Count uses square formatting, so a Tile Count of 2 gives a 2x2 grid, which is four tiles."
      - q: "What is the Overlap Ratio for, and what does it cost?"
        choices: ["It sharpens textures at no cost", "It sets the tile size and lowers memory use", "It blends tile edges to reduce seams, mainly for Depth of Field, at the cost of extra render time", "It adds motion blur to tiles"]
        answer_index: 2
        explain: "Overlap makes tiles share an edge region that is blended. This helps DoF seams but makes the render take longer."
      - q: "Which feature does High Resolution tiled rendering NOT support?"
        choices: ["Temporal anti-aliasing and screen space effects like SSR and lens flares", "PNG output", "Spatial samples", "Burn In"]
        answer_index: 0
        explain: "The docs state that High Resolution does not support TAA and screen-space features such as screen space reflections, convolution bloom, lens flares and fast motion blur."
      - q: "What is the difference between Engine Warm Up Count and Render Warm Up Count?"
        choices: ["They are the same setting with two names", "Engine Warm Up renders to disk; Render Warm Up does not", "Render Warm Up ticks physics; Engine Warm Up does not", "Engine Warm Up ticks the engine for N frames so physics settle; Render Warm Up rebuilds the TAA history with samples taken at the same time, right before rendering"]
        answer_index: 3
        explain: "Engine warm-up lets time pass for cloth and particles. Render warm-up takes samples without ticking, to rebuild temporal history after a camera cut."
      - q: "A cloth character starts in an idle pose and settles visibly on frame 1. What does the tips page suggest?"
        choices: ["Set Spatial Sample Count to 8", "Set Engine Warm Up Count to a value above 30", "Enable High Resolution", "Disable the Tone Curve"]
        answer_index: 1
        explain: "For objects with no starting motion, Engine Warm Up Count gives physics time to settle. The docs suggest a value greater than 30."
      - q: "You add console variables to an MRQ job. What happens to them after the render?"
        choices: ["They stay changed in the editor", "They are saved into the level", "They are restored to their original values", "They are written into DefaultEngine.ini"]
        answer_index: 2
        explain: "MRQ saves the original value before the render and restores it when the render finishes."
      - q: "Shutter Timing is set to Frame Close. Where does the motion blur come from?"
        choices: ["From the motion before the frame in Sequencer", "From the motion after the frame", "Centered around the frame", "There is no motion blur"]
        answer_index: 0
        explain: "Frame Close represents the shutter closing, so the blur shows what comes before the frame. Frame Open shows what comes after, and Frame Center is balanced."
      - q: "Which output format is Overscan Percentage designed for, and what happens with other formats?"
        choices: ["PNG; other formats crash", "JPG; other formats ignore it", "WAV; other formats ignore it", "EXR, which stores the region data; other formats simply come out larger with changed framing"]
        answer_index: 3
        explain: "Overscan encodes the region information in a way unique to EXR. Other formats still work but the output is larger than expected and the framing changes."
    flavors:
      _default: {why: "Quality settings multiply render time. A master knows the price of each one before pressing Render."}
      cinematics: {why: "A production budget is measured in frames per hour. Sampling, tiles and warm-up are where the hours go.", do: "Add a fourth render with Spatial 2, Temporal 8 and show whether it is worth the time."}
      tech_art: {why: "Warm-up counts and CVars are how you make a render deterministic across machines.", do: "Save the B settings as a Movie Pipeline Master Config asset and share it with the team."}
      lookdev: {why: "DoF seams and TAA history bugs are look problems that come from render settings, not materials.", do: "Show a tile seam with Overlap 0 and the fix with Overlap 0.1."}

