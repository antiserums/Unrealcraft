  - id: CQ13
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [sequencer, animation-track, skeletal-mesh, blending]
    required_spine: false
    required: true
    title: Animate a character in Sequencer
    brief: "In Sequencer, a character is animated with an Animation track. You place animation clips on the track as sections, and where two sections overlap Unreal blends from one clip to the next. You can also trim, loop, split, slow down and reverse each section. In this quest you put a mannequin into a sequence and practice all of these edits on two clips."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-animation-track-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-add-cinematic-animation-to-a-character-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blend-gameplay-animation-to-cinematic-animation-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Drag a Skeletal Mesh, for example SKM_Manny_Simple, into the level."
      - "Create a Level Sequence named LS_CharacterTest. With the mesh selected, click Add Track (+) and choose Actor to Sequencer. Check that an Animation track and a Transform track were created."
      - "On the Animation track, click Add Animation (+) and pick an idle clip. Then add a walk or run clip, and place it so that the two sections overlap by about 20 frames."
      - "Drag the blend handle on the overlap to make the blend longer. Right-click the blend curve and try a different curve shape from Options."
      - "Drag the right edge of the second clip outward so that the clip loops. Put the playhead in the middle of it and press Ctrl + / to split the section into two parts."
      - "Right-click one section and open Properties. Set Play Rate to 0.5, and enable Reverse on the part you split off. Then play the sequence."
    done_when: "Send a screenshot of Sequencer that shows the Animation track with two overlapping clips and a visible blend, one looped section with notches, and the Properties menu open with Play Rate 0.5."
    xp: 115
    verify_type: screenshot
    quiz:
      - q: "You add a Skeletal Mesh Actor to Sequencer. What happens to its Animation track?"
        choices: ["It is created automatically under the actor's track", "You must create it from the Content Browser", "It only appears after you press Play", "It needs the Take Recorder plugin"]
        answer_index: 0
        explain: "By default the Animation track is created automatically when a Skeletal Mesh Actor class is added. If deleted, add it again with Add Track (+) > Animation."
      - q: "Which animations appear in the Add Animation (+) list?"
        choices: ["Every animation in the project", "Only animations compatible with the Skeletal Mesh", "Only animations in the same folder", "Only Animation Blueprints"]
        answer_index: 1
        explain: "The list is filtered to only show animations compatible with the Skeletal Mesh."
      - q: "When Sequencer animates a Skeletal Mesh, its Animation Mode switches to Use Custom Mode. When does this NOT happen?"
        choices: ["When the level is not saved", "When the clip is looped", "When an Animation Blueprint is already assigned to the mesh", "When Play Rate is not 1"]
        answer_index: 2
        explain: "If an Animation Blueprint is assigned, the mode does not switch. Then the Anim BP needs a Slot to receive animation from Sequencer (see Slot Name)."
      - q: "Two animation sections overlap on the same actor. What does Sequencer do by default?"
        choices: ["Plays only the top one", "Stops at the overlap", "Shows an error", "Creates an automatic blend curve over the overlap"]
        answer_index: 3
        explain: "Intersecting two sections creates an automatic blend, and the animations blend over the duration of the intersection. You can move the blend handles."
      - q: "What is the keyboard shortcut to split a selected animation section at the playhead?"
        choices: ["Ctrl + /", "Shift + S", "Alt + X", "Ctrl + B"]
        answer_index: 0
        explain: "Ctrl + / splits the selected section at the current playhead time. Trim and split are also in the right-click Edit menu."
      - q: "You hold Ctrl while hovering the edge of a section and drag. What happens?"
        choices: ["The clip is duplicated", "The clip's play rate is scaled instead of trimming or looping", "The clip is deleted", "The clip moves to a new track"]
        answer_index: 1
        explain: "Holding Ctrl on a section edge engages the Play Rate modifier, so dragging scales playback rate rather than trimming or looping."
      - q: "When Finished is set to Keep State on an animation section. What does the character do when the section ends?"
        choices: ["Snaps back to its state before Sequencer", "Plays its Animation Blueprint again", "Holds on its last animation frame", "Becomes invisible"]
        answer_index: 2
        explain: "Keep State keeps the actor in Sequencer's animation mode and holds the last frame. Restore State returns it to its pre-Sequencer state."
      - q: "A looped or trimmed clip should return to its original length. Which command does this?"
        choices: ["Edit > Reset Transform", "Properties > Reverse", "Edit > Simplify", "Edit > Auto Size"]
        answer_index: 3
        explain: "Right-click the section and choose Edit > Auto Size to restore the original clip length."
    flavors:
      _default: {why: "Characters make a scene. You need clean clip editing and blends to tell a story in Sequencer."}
