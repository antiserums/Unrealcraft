    subjects: [color-management, opencolorio, working-color-space, movie-render-queue]
    required_spine: false
    required: false
    title: "OCIO from viewport to render"
    brief: "Color management makes sure that a color looks the same in Unreal, on your monitor, and in the other programs of a film production. OpenColorIO, or OCIO, is the standard system for this. In Unreal you create an OCIO configuration asset that lists the color spaces you need, and you apply it to the viewport and to renders. In this quest you set up one configuration, use it in the viewport and in Movie Render Queue, and compare renders with and without it."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/color-management-with-opencolorio-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/opencolorio-quick-start-for-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/apply-color-conversion-to-the-level-viewport-and-play-in-editor-with-opencolorio-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/working-color-space-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-rendering-image-quality-settings-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open Edit > Plugins and check that OpenColorIO is enabled. Open Edit > Project Settings > Rendering > Working Color Space and write down the current value. Leave it at the default."
      - "In the Content Browser, right-click and choose Miscellaneous, then OpenColorIO Configuration. Name it OCIO_Shot. Open it and keep Configuration File at ocio://default."
      - "Under Desired Color Spaces, click Add (+) and pick a linear working space and a display view, for example an sRGB monitor output. Add only what you need. Save the asset."
      - "In the level viewport, click View Mode and choose OCIO Display. Select OCIO_Shot, set the source and the destination, and click Enable Display. Take one frame with it on and one with it off."
      - "You need a short shot: any Level Sequence with a camera works, and you can make one with Add Level Sequence in the Cinematics dropdown and the Camera button in Sequencer. Add it to Movie Render Queue as a job. Add the Color Output setting, assign OCIO_Shot and the same source and destination. Render 10 frames of the shot as EXR."
      - "Render the same 10 frames again with Color Output removed. Open one frame from each render side by side."
      - "Write three lines that say what changed between the two renders, and where the documentation says the viewport inserts the OCIO conversion."
    done_when: "Send a screenshot of OCIO_Shot with your color spaces, a viewport frame with OCIO Display enabled, a screenshot of the MRQ Color Output setting with OCIO_Shot assigned, and your three lines."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "How do you create an OpenColorIO Configuration Asset?"
        choices: ["Import a .ocio file through the Content Drawer Import button", "Content Browser right-click > Miscellaneous > OpenColorIO Configuration", "Project Settings > Rendering > Add OCIO", "Window > OCIO > New"]
        answer_index: 1
        explain: "The asset is created from the Content Browser context menu under Miscellaneous. It then references an OCIO config file or a built-in config."
      - q: "What is the default Configuration File path of a new OpenColorIO Configuration Asset?"
        choices: ["ocio://default", "Engine/Config/aces.ocio", "ocio://studio-config-v1.0.0_aces-v1.3_ocio-v2.1", "Empty"]
        answer_index: 0
        explain: "New assets use ocio://default, a built-in ACES CG config that needs no external file. The ACES Studio config is another built-in option."
      - q: "You have a custom .ocio file. How do you get it into the project?"
        choices: ["Drag it into the Content Drawer", "Use the Import button in the Content Browser", "Copy it into the project's Content folder with your operating system's file explorer", "Paste its text into the asset"]
        answer_index: 2
        explain: "UE does not recognize .ocio or .ocioz files in the Content Drawer, so you must place them in the Content folder using the file explorer."
      - q: "Why does the quick start say to add only the color spaces you need to the asset?"
        choices: ["Extra spaces crash the viewport", "To keep the configuration asset lightweight", "Only two are allowed", "Because MRQ ignores extra spaces"]
        answer_index: 1
        explain: "The docs recommend setting up only the profiles you actually use so the configuration asset stays as lightweight as possible."
      - q: "Where do you enable OCIO for the level viewport, and what happens to the Tone Curve?"
        choices: ["Show > Post Processing; Tone Curve stays on", "Project Settings > Rendering; nothing changes", "Lit > Exposure; Tone Curve doubles", "View Mode > OCIO Display; the viewport disables Tone Curve and inserts the conversion right after the Tone Map"]
        answer_index: 3
        explain: "OCIO Display lives in the View Mode menu. When enabled, Tone Curve is disabled and the color conversion is inserted after the tone map, before everything else."
      - q: "How do you apply OCIO to the Play in Editor view?"
        choices: ["Add a Create In-Game OpenColorIO Display Extension node on BeginPlay in your camera Blueprint with an OCIO display configuration variable", "It is automatic when the viewport has OCIO on", "Enable it in the Game Mode", "Use a Post Process Material"]
        answer_index: 0
        explain: "The in-game viewport needs the Create In-Game OpenColorIO Display Extension Blueprint node, fed by an OpenColorIO Display Configuration variable, usually on Event BeginPlay."
      - q: "Which Movie Render Queue setting applies an OCIO configuration to the render, and what else can it do?"
        choices: ["Output; set the frame rate", "Anti-Aliasing; disable TSR", "Color Output; it can also disable the Tone Curve even without OCIO", "Game Overrides; change scalability"]
        answer_index: 2
        explain: "Color Output overrides the default color space with a custom OCIO configuration and can also turn off the Tone Curve part of post processing."
      - q: "What is Unreal's default Working Color Space and where do you change it?"
        choices: ["ACES AP1; Editor Preferences", "Rec2020; World Settings", "sRGB / Rec709; Project Settings > Rendering > Working Color Space", "P3D65; the Post Process Volume"]
        answer_index: 2
