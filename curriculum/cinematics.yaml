    checklist:
      - "In the toolbar click Cinematics > Add Level Sequence with Shots. Name it SEQ_Master, set Number of Shots to 3, Shot Prefix to sh, Shot Num Digits to 4, Shot Increment to 10."
      - "Open the first shot (sh0010). Add a Cine Camera, a Camera Cuts section and one keyframed camera move. Do the same for sh0020 and sh0030 with different framing."
      - "Right-click sh0020 > New Take. Save it in the same folder. Change the camera move in the take. Open the Takes menu and confirm the star is on the new take."
      - "Right-click each shot > Edit Meta Data. Enter your name, the date and a one-line note. Hover a shot to see the tooltip."
      - "Give each shot a different Color Tint (right-click > Properties > Color Tint)."
      - "Add one light to SEQ_Master (root) and also to sh0010. Keyframe two different colors. Right-click sh0010 > Properties and change Hierarchical Bias to -50, then back to 0. Watch which color wins."
      - "Write a short naming and folder rule for your team (shot prefix, digits, take separator, where takes live) in a text file next to SEQ_Master."
    done_when: "Screenshot of the SEQ_Master timeline showing 3 color-tinted shots and the Takes menu open with the star on Take 2, plus the metadata tooltip visible, plus your naming rule text."
    xp: 250
    verify_type: screenshot
    quiz:
      - q: "Where do you create a new sequence that already contains shots?"
        choices: ["Content Browser > Add > Cinematics > Level Sequence", "Toolbar Cinematics button > Add Level Sequence with Shots", "Window > Sequencer > New Shot List", "Right-click a Cine Camera > Make Shots"]
        answer_index: 1
        explain: "The Cinematics toolbar button has Add Level Sequence with Shots. It opens a settings window for the name, path and number of shots."
      - q: "Which setting controls how many digits are added to each generated shot name, like sh0010?"
        choices: ["Shot Increment", "First Shot Number", "Shot Num Digits", "Take Separator"]
        answer_index: 2
        explain: "Shot Num Digits sets the total number of digits added to the end of generated shot names. First Shot Number and Shot Increment set the numbers themselves."
      - q: "You leave Sequence to Duplicate empty when creating a Level Sequence with Shots. What do the new shots contain?"
        choices: ["A Camera and a Camera Cut Track", "Nothing, they are empty", "A copy of the current level", "A Skeletal Mesh Actor"]
        answer_index: 0
        explain: "If no sequence is given, every shot is created preconfigured with a Camera and a Camera Cut Track."
      - q: "What does Instance Sub Sequences do when it is enabled?"
        choices: ["It copies every sub-sequence into every shot", "It disables sub-sequences", "It makes each shot a spawnable", "It creates the sub-sequence assets only for the first shot; other shots reference them"]
        answer_index: 3
        explain: "With Instance Sub Sequences on, only the first shot gets its own sub-sequence assets. The other shots reference those same assets instead of getting unique ones."
      - q: "Two Shots tracks are used and their sections overlap in time. Which one plays?"
        choices: ["The one created first", "The section on the top-most track", "The section on the bottom track", "Both blend together automatically"]
        answer_index: 1
        explain: "Shot sections on the top tracks are prioritized. Where they overlap sections below, the top-most track evaluates instead."
      - q: "A sub-sequence sits inside a shot, which sits inside the root sequence. With default values, what is the sub-sequence's cumulative Hierarchical Bias?"
        choices: ["0", "100", "200", "-100"]
        answer_index: 2
        explain: "The root is 0 and every sub-sequence level adds 100. A shot is 100, and a sub-sequence inside it is 200, so the deepest level wins by default."
      - q: "The same light is keyed red in the root, green in a shot and blue in a sub-sequence. You set all Hierarchical Bias values to 0. What happens?"
        choices: ["All three evaluate together and blend, giving white", "Only the root red plays", "Only the deepest blue plays", "Sequencer shows an error"]
        answer_index: 0
        explain: "Equal bias means all sources evaluate together and blend when possible. The docs example blends red, green and blue into white."
      - q: "You right-click a shot and choose New Take, then save. Which version does the shot play now?"
        choices: ["Still the original Take 1", "It asks each time", "Both takes at once", "The new take; the star in the Takes menu marks it as active"]
        answer_index: 3
        explain: "When a new take is created the shot switches to it. The active take is shown with a star icon in the Takes menu."
      - q: "Why does the docs page suggest using Edit Meta Data on shots?"
        choices: ["It changes the shot's frame rate", "To store a name, date and notes as a tooltip, useful when many people work on one scene", "It locks the shot for other users", "It exports an EDL"]
        answer_index: 1
        explain: "Edit Meta Data stores your name, date and time, and notes. They appear as a tooltip on the shot and help teams track changes."
      - q: "What does Evaluate Sub Sequences In Isolation change when you open a shot?"
        choices: ["It renders the shot with MRQ", "It deletes tracks from the root", "Tracks that are not in the shot no longer evaluate alongside it, so you lose the root context", "It makes the shot loop"]
        answer_index: 2
        explain: "By default a shot is shown in the context of its root sequence. Evaluate Sub Sequences In Isolation stops the other tracks from evaluating with the shot."
      - q: "You changed the start and end inside a shot. What is the fastest way to make the parent shot section match?"
        choices: ["Right-click the shot > Edit > Auto Size", "Re-trim the section by hand", "Delete and re-insert the shot", "Change the Time Scale property"]
        answer_index: 0
        explain: "Auto Size matches the parent shot section to the internal edits, so you do not need to re-trim by hand."
      - q: "You drag a new actor into the level and want it added to Sequencer as a possessable. Which key do you hold?"
        choices: ["Alt", "Shift", "Space", "Ctrl"]
        answer_index: 3
        explain: "Holding Ctrl adds the new actor as a possessable. Holding Shift adds it as a spawnable."
    flavors:
      _default: {why: "A real production has many shots, many takes and many people. A clear structure keeps the master sequence safe."}
      cinematics: {why: "Shots, takes and hierarchical bias are how you keep a big edit under control without breaking other people's work.", do: "Record a 30-second video walking through your folder structure and say why each rule exists."}
      animation: {why: "Animators work inside shots; knowing bias and context view avoids fights over the same character.", do: "Put a character animation in a shot and override its transform in the root, then fix it with bias."}

  - id: CQ26
    rank: 4
    difficulty: master
    track: cinematics
    subjects: [movie-render-queue, render-passes, compositing, exr]
    required_for_majors: [cinematics]
    taster_for_majors: []
