    title: "Event track: sequence talks to Blueprint"
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-event-track-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/fire-blueprint-events-during-cinematics-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/trigger-level-blueprint-events-from-sequencer-in-unreal-engine"
    checklist:
      - "Open LS_Cutscene (or any sequence). Click Add Track (+) > Event Track > Trigger. Add a key at frame 60."
      - "Right-click the key > Properties > Unbound > Create New Endpoint. The Director Blueprint opens. Rename the endpoint to SpawnFX."
      - "In the Director Blueprint, from SpawnFX call Spawn Emitter at Location (or print a string) so something visible happens."
      - "Select the endpoint and Add Parameter (+) named Scale (float). On the key, set the Payload value to 2.0 and use it in the graph."
      - "Add a second Event Track under a bound actor (for example a light) and use Quick Bind to call Set Visibility on it."
      - "Enable Call In Editor on the first key and scrub over frame 60 to see it fire without Play."
    done_when: "Screenshot of the Director Blueprint with the SpawnFX endpoint (with the Scale parameter) and the object-bound Quick Bind event, plus a screenshot of the Sequencer timeline with both Event tracks."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the difference between a Trigger event and a Repeater event?"
        choices: ["Trigger fires once per keyframe; Repeater fires every frame for the duration of its section", "Trigger is for cameras; Repeater is for lights", "Repeater fires once at the end", "There is no difference"]
        answer_index: 0
        explain: "Trigger events evaluate on the same frame as the keyframe. Repeater events evaluate for each frame while their section is active."
      - q: "Where does the logic for Event Track endpoints live?"
        choices: ["In the Level Blueprint", "In the Director Blueprint of that Level Sequence", "In the Game Mode", "In the Camera Actor"]
        answer_index: 1
        explain: "Each Level Sequence has its own Director Blueprint containing all logic for its events."
      - q: "You create a Trigger key. What must you do before it can run any logic?"
        choices: ["Set Call In Editor", "Add a Camera Cuts track", "Bind it to an Event Endpoint (Properties > Unbound > Create New Endpoint)", "Save the level"]
        answer_index: 2
        explain: "Both trigger and repeater events must be bound to an Event Endpoint. Creating a new endpoint opens the Director Blueprint."
      - q: "How do you send a value (for example a float) from the keyframe to the event?"
        choices: ["Use a Camera Shake", "Rename the endpoint", "Set Hierarchical Bias", "Add a parameter on the endpoint and set its value in the key's Payload"]
        answer_index: 3
        explain: "Add Parameter (+) on the endpoint creates a pin. Right-click the key and set the value under Payload; it is sent when the event fires."
      - q: "An Event Track is added under an actor binding. What extra benefit does this give?"
        choices: ["The event's target object is bound to that actor, and Quick Bind can call functions on it directly", "The event fires twice", "The actor becomes a spawnable", "The event becomes a Repeater"]
        answer_index: 0
        explain: "Creating the Event Track under a bound object makes an Object Binding, so the target object is that actor and you can Quick Bind its functions."
      - q: "What does Call In Editor do?"
        choices: ["Compiles the Director Blueprint", "Lets the event logic run in the editor without Play or Simulate", "Sends the event to the Level Blueprint", "Makes the key repeat"]
        answer_index: 1
        explain: "Call In Editor lets the event evaluate in the editor session. It appears once the event is bound to an endpoint."
      - q: "You preview a sequence many times and want a reset chain to run when scrubbing backward. Which properties help?"
        choices: ["Event Position and Time Scale", "Pass Bound Object To", "Fire Event when Forwards and Fire Event when Backwards", "Hierarchical Bias"]
        answer_index: 2
        explain: "One track can fire forward only (normal chain) and another backward only (reset chain), using the Forwards and Backwards properties."
      - q: "An event must run after spawnable actors exist. Which Event Position do you choose?"
        choices: ["At Start Of Evaluation", "At End Of Evaluation", "Before Spawn", "After Spawn"]
        answer_index: 3
        explain: "After Spawn fires after Spawnables have spawned and evaluated. At Start fires before anything else; At End fires last."
    flavors:
      _default: {why: "Events let a sequence call game logic at exact frames: sounds, VFX, doors, UI."}
