  - id: CQ35
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [sequencer, bindings, replaceable, director-blueprint, runtime]
    required_spine: false
    required: false
    title: Bind to the player at runtime
    brief: "In a game, a cutscene often has to use the character that the player controls, and that character does not exist until the game runs. A custom binding solves this. A Replaceable binding shows a preview actor while you edit, and when the game runs it uses a real actor that a function in the Director Blueprint chooses. In this quest you bind a sequence to the player pawn, look at the Blueprint that does the binding, and then remove the binding again."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/dynamic-binding-in-sequencer"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/spawn-temporary-actors-in-unreal-engine-cinematics"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make a Level Sequence named LS_PlayerBind. Drag the player character Blueprint, BP_ThirdPersonCharacter, from the Content Browser into Sequencer, so that it becomes a spawnable preview."
      - "Right-click the character track and choose Convert Selected Binding(s) To…, then Replaceable from Director Blueprint…, then Quick Bind, then Resolve to Player Pawn."
      - "Add a Camera Cut and a short camera move that frames the character. Add an Animation track on the character with any animation."
      - "Place a Level Sequence Actor in the level and turn on Auto Play. Press Play In Editor and confirm that the real player pawn is used, not the preview."
      - "Right-click the track and choose Convert Selected Binding(s) To…, then Replaceable from Director Blueprint…, then Create New Binding Endpoint. Open the Director Blueprint and look at the binding node and its return node."
      - "Split the Return Value struct pin so that you see its parts. Set Return Value Object to an actor you choose, and test with Is Possessed Object turned on and turned off."
      - "Right-click the track, open Binding Properties, and use the trash icon to remove the custom binding. Notice that the Blueprint functions are still there."
    done_when: "Send one screenshot of Play In Editor with the cinematic running on the real player pawn, and one screenshot of the Director Blueprint that shows the Dynamic Binding node with its split Return Value pin. Add one line that says which binding type you kept and why."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "What does a Replaceable binding do?"
        choices: ["Uses a preview actor while editing, then binds to an existing in-game actor at runtime", "Spawns a new actor at runtime and destroys it at the end", "Possesses an actor that already exists in the level, in editor and at runtime", "Replaces the actor's mesh"]
        answer_index: 0
        explain: "Replaceable creates a preview actor for editing, and at runtime dynamically binds to an existing in-game actor."
      - q: "Which default Quick Bind option binds the player's pawn to a track?"
        choices: ["Bind to Player Controller", "Resolve to Player Pawn", "Possess Player", "Get Player Camera Manager"]
        answer_index: 1
        explain: "Resolve to Player Pawn is a default Quick Bind that creates an endpoint in the Director Blueprint using that function."
      - q: "You create a new binding endpoint from a Cube track. What is the binding node called?"
        choices: ["Cube Resolve", "Binding Cube", "Cube Dynamic Binding", "On Cube Bound"]
        answer_index: 2
        explain: "The binding node name is the object name followed by Dynamic Binding, for example Cube Dynamic Binding."
      - q: "On the return node, what does unchecking Return Value Is Possessed Object do?"
        choices: ["The object is deleted", "The binding is removed", "The track is muted", "The object is spawned instead of possessed"]
        answer_index: 3
        explain: "Checked means the returned object is possessed. Unchecked means the object is spawned."
      - q: "Which node does a custom Replaceable Binding Class give you to write your logic in?"
        choices: ["Evaluate Condition", "Resolve Runtime Binding", "On Sequence Start", "Get Bound Objects"]
        answer_index: 1
        explain: "Creating a replaceable binding class creates a Resolve Runtime Binding node and a return node. It is called at runtime."
      - q: "You remove a custom binding with the trash icon in Binding Properties. What happens to the Blueprint it created?"
        choices: ["It is deleted", "It is moved to the level Blueprint", "It stays; you must delete its functions from the Director Blueprint yourself", "It becomes a condition"]
        answer_index: 2
        explain: "Removing the custom binding does not delete the Blueprints it created. Unused functions must be deleted from the Director Blueprint by hand."
      - q: "Where is the binding function created when you make a custom binding endpoint for a UMG widget?"
        choices: ["In the Level Sequence Director Blueprint", "In the Level Blueprint", "In the Game Mode", "Inside the UMG asset's own Blueprint graph"]
        answer_index: 3
        explain: "For UMG assets the function is created inside the UMG asset, because a UI Blueprint graph is already tied to that asset."
      - q: "Which menu path starts a custom binding?"
        choices: ["Right-click the track > Convert Selected Binding(s) To…", "Actions > Fix Actor References", "Playback Options > Bindings", "Right-click the section > Properties"]
        answer_index: 0
        explain: "Custom bindings are made from Convert Selected Binding(s) To… in the track's right-click menu, with Spawnable, Replaceable or Custom Bindings options."
    flavors:
      _default: {why: "Custom bindings are how one cinematic works on whatever the player is using, without a fixed actor in the level."}
      cinematics: {why: "Replaceable bindings let you author with a preview character and ship a cinematic that grabs the real player.", do: "Try a custom Replaceable Binding Class that returns the closest actor of a given class to the camera."}
      gameplay_design: {why: "Dynamic bindings let cutscenes use the player's chosen character and the enemies that are actually alive."}
      programming: {why: "Binding endpoints and Resolve Runtime Binding are where cinematic and gameplay code meet."}

  - id: CQ36
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [sequencer, hotkeys, workflow, keyframing]
    required_spine: false
    required: false
    title: Sequencer by keyboard
    brief: "Sequencer has a keyboard shortcut for almost every common action. When you know the shortcuts, you work much faster than with the toolbar buttons. In this quest you go through playback, keying, key editing and section editing with the keyboard only, and you write down what each shortcut did."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/sequencer-hotkeys-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-workflow-tips-for-sequencer-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open any sequence that has a camera and a mesh. To make one, choose Add Level Sequence in the Cinematics dropdown of the main toolbar, click the Camera button in Sequencer, and add a cube from the level with Add Track (+), then Actor To Sequencer. Do this whole quest without the toolbar buttons wherever a hotkey exists."
      - "Practice playback. Press Space to play, Up Arrow to jump to the start, and Ctrl + Up Arrow to jump to the end. Press L and J to shuttle forward and backward, and press comma and period to step between keys."
      - "Set the playback range with [ and ] at the playhead. Press Home to reframe the timeline."
      - "Select the mesh in the viewport. Press S to key the full transform. Then move the mesh and press Shift + W to key only the Location."
      - "Select two keys and press 4 (Linear), then 1 (Cubic Auto). Move them by one frame with Ctrl + Right Arrow. Then press Ctrl + M and move them by 12 frames."
      - "Select a section, put the playhead in the middle of it, and press Ctrl + / to split it. Trim the pieces with Ctrl + , and Ctrl + . (comma and period)."
      - "Drag a new actor into the level while you hold Shift, then drag another one while you hold Ctrl. Check which one became a spawnable in Sequencer. Then drag the playhead with MMB to move the time without evaluating the sequence."
    done_when: "Send a short writeup of 8 to 12 lines that lists each hotkey you used and what it did. Also send one screenshot that shows the split section and the two actors that were added as a spawnable and as a possessable."
    xp: 55
    verify_type: writeup
    quiz:
      - q: "Which key steps forward through keyframes and section bounds?"
        choices: [".", "Right Arrow", "Ctrl + Right Arrow", "Page Down"]
        answer_index: 0
        explain: "The period key steps forward by each keyframe and section bound. Right Arrow steps one frame. Ctrl + Right moves a selected key."
      - q: "What do 1 through 5 do with keys selected?"
        choices: ["Jump to shot 1-5", "Set tangent type: Cubic Auto, Cubic User, Cubic Break, Linear, Constant", "Set playback speed", "Set the key value"]
        answer_index: 1
        explain: "The hotkeys page lists 1-5 as keyframe interpolation modes in that order."
      - q: "Ctrl + , and Ctrl + . versus Alt + [ and Alt + ]. What is the difference?"
        choices: ["No difference", "Ctrl works on shots, Alt on keys", "Ctrl trims only remove data; Alt versions trim all sections on the track and can add or remove data", "Alt versions split instead of trim"]
        answer_index: 2
        explain: "Ctrl + , / . trim the selected section and only remove data. Alt + [ / ] trim all sections on the selected track and can add or remove section data."
      - q: "You press Space with focus on the viewport and nothing plays. Why, and what is the documented fix?"
        choices: ["Sequencer is locked; unlock it", "Auto-scroll is off; press Shift + S", "The sequence has no Camera Cut track", "Space cycles transform modes in the viewport; unbind that shortcut and enable Cinematic Viewport"]
        answer_index: 3
        explain: "The workflow tips page says Space cycles translate/rotate/scale when the viewport has focus. Unbind that shortcut and turn on Cinematic Viewport."
      - q: "Holding which key while placing a new actor adds it to Sequencer as a spawnable?"
        choices: ["Ctrl", "Shift", "Alt", "S"]
        answer_index: 1
        explain: "Shift adds the new actor as a spawnable. Ctrl adds it as a possessable."
      - q: "What does Ctrl + Shift + V do in Sequencer?"
        choices: ["Pastes the last copied keys only", "Pastes a section", "Pastes from Sequencer's clipboard history so you can pick any earlier copied set of keys", "Pastes a track"]
        answer_index: 2
        explain: "Each copy is added to a special Sequencer clipboard history. Ctrl + Shift + V lets you paste any set from that history."
      - q: "Which hotkey creates a Transform track if needed and keys only Rotation?"
        choices: ["Shift + W", "Shift + R", "S", "Shift + E"]
        answer_index: 3
        explain: "Shift + W keys Location, Shift + E keys Rotation, Shift + R keys Scale, S keys all three."
      - q: "Why does the playhead turn yellow when you drag it with the middle mouse button?"
        choices: ["It shows the sequence is not evaluating, so you can change time without changing values", "It shows a warning about frame rate", "It shows Auto Key is on", "It shows the range is locked"]
        answer_index: 0
        explain: "MMB dragging changes time without evaluating. The yellow playhead shows this. It is useful for setting same-value bracketing keys."
    flavors:
      _default: {why: "Hotkeys turn Sequencer from a slow tool into a fast one."}
      cinematics: {why: "A cinematic artist keys, trims and splits hundreds of times per day. Doing that by keyboard saves hours.", do: "Write your ten most used hotkeys on a sticky note and use only those for one full shot."}
      animation: {why: "The keying hotkeys (S, Shift + W/E/R, 1-5) match what animators expect from other tools."}

