      - "Right-click a possessable track, open Assign Actor and use Replace with Selected to rebind it to a different actor of the same class."
      - "Extra: use Convert Selected Binding(s) To > Replaceable from Director Blueprint > Quick Bind > Resolve to Player Pawn and test in PIE."
