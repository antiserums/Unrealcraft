    quiz:
      - q: "Overscan Percentage is 0.1. What happens to the camera framing?"
        choices: ["The image is cropped by 10 percent", "The camera zooms in 10 percent", "Only the resolution changes; the field of view is fixed", "Extra pixels are rendered and the field of view is inflated so the original image inside the non-overscanned region stays the same"]
        answer_index: 3
        explain: "Overscan renders extra pixels around the edges and inflates the field of view proportionally, so the original framing is kept inside the overscan border."
      - q: "Why is Overscan meant mainly for EXR output?"
        choices: ["Other formats cannot go above 1080p", "EXR encodes the overscan region information; other formats just get a larger image and a changed framing", "EXR is the only format with motion vectors", "EXR is lossless"]
        answer_index: 1
        explain: "EXR stores the region information in a format unique to EXR. With other formats it still works, but the output is larger than expected and the framing changes."
      - q: "You set Overscan on the Cine Camera Actor and render with MRQ. What is true?"
        choices: ["The camera value passes through as if set in MRQ, and MRQ can still override it", "MRQ ignores the camera value", "The two values are added", "MRQ shows an error"]
        answer_index: 0
        explain: "Camera Actors have an official Overscan property. MRQ recognises it as if set in its own Overscan setting, and you can still override it in MRQ."
      - q: "What does a more negative Texture Sharpness Bias do in a tiled render?"
        choices: ["Blurs the textures", "Increases the tile count", "Selects a higher-detail mipmap more often; too far and the image gets grainy", "Disables mipmaps"]
        answer_index: 2
        explain: "The bias makes the engine pick a higher resolution mip than it normally would. Too much causes grain, and it has no effect on textures already at their top mip."
      - q: "Why does the High Resolution setting have an Override Sub Surface Scattering option?"
        choices: ["Subsurface is disabled in tiles", "Some subsurface methods rely on TAA history, and TAA is not supported in tiling, so more samples are needed", "Tiles cannot render skin", "It is only for the Path Tracer"]
        answer_index: 1
        explain: "TAA is not supported in high resolution tiling, so subsurface methods that need TAA history can instead use a higher Burley Sample Count."
      - q: "During a tiled render, what does the Render Preview window show?"
        choices: ["Only the bottom-right corner tile", "The full stitched frame", "Only the top-left tile", "A wireframe"]
        answer_index: 0
        explain: "When tiling is enabled the preview only displays the bottom-right corner tile. The full image is only assembled on disk."
      - q: "You switch the job to Movie Render Graph and look for High Resolution tiling. What does the documentation say?"
        choices: ["It is on the Camera Settings node", "It is on the Global Output Settings node", "High Resolution Rendering is listed as not yet supported in Movie Render Graph", "It is on the Deferred Renderer node"]
        answer_index: 2
        explain: "The transition page lists High Resolution Rendering among features supported by MRQ that do not yet have support in MRG. Overscan, however, is on the Camera Settings node."
      - q: "Render All Cameras is enabled but you did not use {camera_name} in the File Name Format. What happens?"
        choices: ["Files overwrite each other", "The render fails", "MRQ automatically adds the camera name as a suffix to avoid a conflict", "Only the first camera renders"]
        answer_index: 2
        explain: "MRQ adds the camera name suffix automatically when Render All Cameras is on. Using {camera_name} yourself gives you control over folders instead."
