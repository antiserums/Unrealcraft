    required_spine: false
    required: false
    title: Subtitles in the sequence and burn-ins on the frame
    brief: "Spoken lines in a cinematic often need subtitles, the text that shows what is said. Review renders need a burn-in, which is information such as the shot name and frame number printed on the picture. Unreal has both built in: a Subtitles plugin with its own Sequencer track, and a Burn In setting in Movie Render Queue. In this quest you add subtitles to a line of dialogue and render frames with a burn-in."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/subtitles-and-closed-captions-plugin-in-unreal-engine"
