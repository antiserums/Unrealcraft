    title: Cloth that moves in the shot
    brief: "Cloth simulation makes parts of a character, such as a cape or a skirt, move by physics when the character moves. In close shots this shows the weight and speed of the character. You set it up by creating a cloth asset from a part of the mesh and painting how far each point of the cloth may move. In this quest you make a cape simulate and watch it in a sequence."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/clothing-tool-in-unreal-engine"
