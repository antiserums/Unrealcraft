  - id: CQ71
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [sound-cue, attenuation, audio, sequencer]
    required_spine: false
    required: false
    title: Footsteps that never repeat
    brief: "When every step of a character plays the same sound, the ear notices it quickly and the scene sounds cheap. A Sound Cue is an asset where you connect nodes to change how sounds play. With a few nodes it can pick a random footstep each time and change its pitch a little. In this quest you build such a Sound Cue, make it get quieter with distance, and attach it to a character in a sequence."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/sound-cue-editor-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/sound-cue-reference-for-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/sound-attenuation-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/importing-audio-files"
    checklist:
      - "Open a project made from the Third Person template, or create one. Import 3 short footstep .wav files by dragging them into the Content Browser. You can record three taps with a phone, or get free footstep sounds from Fab. For a first test, three short engine sounds also work, such as CompileSuccess, CompileFailed and 1kSineTonePing. To see engine content, open the Settings menu of the Content Browser and turn on Show Engine Content. Create a Sound Cue named SC_Footsteps with Add, then Sounds, then Sound Cue."
      - "In the Sound Cue Editor, add a Random node. Click Add input until it has 3 pins and connect one Wave Player to each pin. Enable Randomize Without Replacement, which plays all sounds once before any sound repeats."
      - "Add a Modulator node after the Random node. Set Pitch Min to 0.9 and Pitch Max to 1.1. Keep Volume Min and Volume Max at the same value."
      - "Create a Sound Attenuation asset named SA_Footsteps, which controls how the sound gets quieter with distance. Set Attenuation Function to Logarithmic, Shape to Sphere, Inner Radius to 200 and Falloff Distance to 1500. Add an Attenuation node before the Output node and set it to SA_Footsteps."
      - "Press Play Cue several times. Watch the wires turn red and check that a different footstep plays each time."
      - "Open a Level Sequence with a character, or make one: drag SKM_Manny_Simple into the level, create a Level Sequence, add the actor, and click the Camera button to add a camera. Under the character track, add SC_Footsteps to an Audio Track, so that the sound is attached to the character. Drag the playhead through the sequence and listen while the camera moves away."
    done_when: "Send a screenshot of the SC_Footsteps graph with the Random, Modulator, Attenuation and Output nodes visible. Also send a screenshot of the sequence with the audio section under the character. Add one line that says which attenuation function you chose and why."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which node must exist in every Sound Cue and works as the end point of the signal path?"
        choices: ["Output node", "Wave Player node", "Mixer node", "Attenuation node"]
        answer_index: 0
        explain: "The Output node is required in every Sound Cue. Its properties, like Volume Multiplier and Class, affect all audio that leaves the Sound Cue."
      - q: "While a Sound Cue plays in the editor, how can you see which path is active?"
        choices: ["Active nodes blink yellow", "The Details panel lists them", "The wires of active nodes turn red", "Inactive nodes are hidden"]
        answer_index: 2
        explain: "The page says that during playback the wires of currently active nodes turn red, so you can follow the construction in real time."
      - q: "You want all three footstep sounds to play once before any of them repeats. Which Random node setting does this?"
        choices: ["Preselect at Level Load", "Randomize Without Replacement", "Should Exclude from Branch Culling", "Weights set to equal values"]
        answer_index: 1
        explain: "Randomize Without Replacement exhausts the whole list of connected nodes before it repeats a sound."
      - q: "A Modulator node is used together with a Looping node. When is the random pitch picked?"
        choices: ["On every loop", "Only once, when the asset is loaded", "Never, Modulator does not work with Looping", "On each Sound Cue trigger, not on each individual loop"]
        answer_index: 3
        explain: "The reference says that with a Looping node the Modulator randomizes on each Sound Cue trigger and not on each loop."
      - q: "How do you get a fixed, non-random volume from a Modulator node?"
        choices: ["Set Volume Max to 0", "Delete the volume pins", "Set the same value for Volume Min and Volume Max", "Enable Override Attenuation"]
        answer_index: 2
        explain: "To set a consistent level for volume or pitch, use the same value for the minimum and the maximum."
      - q: "Which attenuation function is recommended for spot sounds that need good 3D positioning while staying audible at reasonable distances?"
        choices: ["Linear", "Logarithmic", "Log Reverse", "Custom"]
        answer_index: 1
        explain: "Logarithmic changes volume more at close distances and less far away. The page recommends it for spot sounds with good 3D positioning. Linear is for large background sounds."
      - q: "Which attenuation shape does the documentation suggest for a room tone or ambience?"
        choices: ["Sphere", "Cone", "Capsule", "Box"]
        answer_index: 3
        explain: "A Box shape can match the shape of the room. Capsule is suggested for things like pipes, Cone for directional sources like PA speakers."
      - q: "Falloff Distance is measured from where?"
        choices: ["From the edge of the inner area", "From the listener", "From the center of the level", "From the camera"]
        answer_index: 0
        explain: "Falloff Distance defines the size of the outer area and is measured from the edge of the inner area, for every shape."
    flavors:
      _default: {why: "A cinematic with the same footstep every step sounds cheap. Sound Cues fix that with a few nodes."}
      cinematics: {why: "Attached, attenuated sound sells the space of a shot as much as the lens does.", do: "Add a second Sound Cue for cloth movement and attach it to the same character."}
      gameplay_design: {why: "The same Sound Cue drives gameplay footsteps through Anim Notifies.", do: "Play SC_Footsteps from an Anim Notify on the walk animation."}
