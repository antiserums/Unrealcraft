    flavors:
      _default: {why: "Good motion is made in the curves, not in the timeline."}
      cinematics: {why: "Retime, buffer and bake are the tools that turn a rough camera move into a smooth one under deadline.", do: "Retime a camera push-in so it slows into the final frame, and keep a buffered copy to compare."}
