      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-geometry-cache-track-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Get a character whose cape, skirt or scarf is a separate material section, for example your own character or a free one from Fab, Epic's asset store. If you have none, you can practice on a copy of SKM_Manny_Simple: use one of its material sections as the cloth, and paint the mask so that only a small area is allowed to move. Open the character in the Skeletal Mesh Editor."
      - "Click Section Selection and left-click the cloth part. Right-click it and choose Create Cloth Asset from Selection. Name the asset CA_Cape and set the Physics Asset of the character. Then right-click again and use Apply Clothing Asset."
      - "Open Window > Clothing and click Activate Cloth Paint. Paint the top of the cape with the value 0, so that it stays fixed, and the bottom with a higher value, so that it can move. Hold H to preview the result."
      - "Try the Gradient tool. Click with LMB to set the start value, click with Ctrl + LMB to set the end value, and press Enter to paint. Compare this with the brush result."
      - "Add a Mask, set its Target to Anim Drive Multiplier, and paint it. Note what this target does for cinematics."
      - "Create a Level Sequence named LS_Cape with the character and a run clip. Drag the playhead through it and play it. Write down one setting you changed to make the cloth look better."
    done_when: "Send a screenshot of the Skeletal Mesh Editor with the Clothing panel open and your painted cape visible, and a screenshot of LS_Cape in the middle of the run. Add one line that says which mask targets you set."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the first step to make part of a Skeletal Mesh into cloth?"
        choices: ["Add a Cloth Track in Sequencer", "Select the material section with Section Selection and create a Cloth Asset from it", "Import an Alembic file", "Paint vertex colors in the level"]
        answer_index: 1
        explain: "In the Skeletal Mesh Editor click Section Selection, pick the section, then right-click > Create Cloth Asset from Selection."
      - q: "Why set the Physics Asset when creating a cloth asset for a character?"
        choices: ["To reduce the polygon count", "To enable Nanite", "To allow painting", "So the cloth gets proper collision with the body"]
        answer_index: 3
        explain: "The Physics Asset gives the cloth simulation proper collision with the character."
      - q: "A vertex is painted with value 0. What does that mean?"
        choices: ["It can move one meter", "It cannot move from its skinned position", "It is deleted", "It has no material"]
        answer_index: 1
        explain: "A value of 0 means the skinned vertex cannot move. A value of 100 lets it move one meter from its original position."
      - q: "Which key previews the painted cloth in the editor?"
        choices: ["P", "Space", "H", "Ctrl + P"]
        answer_index: 2
        explain: "Hold H to preview your painted cloth. Paint is LMB and Erase is Shift + LMB."
      - q: "How do you paint a gradient?"
        choices: ["LMB for start value, Ctrl + LMB for end value, then Enter", "Drag with RMB", "Alt + LMB twice", "Double-click the mesh"]
        answer_index: 0
        explain: "The green dot (LMB) is the start value, the red dot (Ctrl + LMB) is the end value, and Enter paints the gradient."
      - q: "Which mask target pulls the cloth toward its animated pose so animators can control it in cinematics?"
        choices: ["Max Distance", "Backstop Radius", "Anim Drive Multiplier", "Backstop Distance"]
        answer_index: 2
        explain: "Anim Drive Multiplier drives springs that pull clothing toward its animated position. It can also be driven at runtime from Blueprints."
      - q: "How many masks of the same target can be assigned at the same time?"
        choices: ["Any number", "Two", "Only one of each target", "None, masks are for preview only"]
        answer_index: 2
        explain: "You can have many masks per target but only one of each target is assigned at a time. This lets you test setups non-destructively."
      - q: "You have a cloth simulation exported from another program as Alembic. How do you play it in Sequencer?"
        choices: ["Import as a Geometry Cache, add it to the sequence, and add a Geometry Cache track", "Import as Skeletal Mesh and add an Animation track", "Use a Media track", "Use a Level Visibility track"]
        answer_index: 0
        explain: "Alembic files import as a Geometry Cache. Add the actor to Sequencer and add the Geometry Cache track to scrub it with frame accuracy."
    flavors:
      _default: {why: "Moving cloth sells the weight and speed of a character in close shots."}
      tech_art: {why: "Cloth setup is a tech art job on most teams.", do: "Adjust the Cloth Config to feel like a heavy cape, then like a light silk scarf, and compare."}

