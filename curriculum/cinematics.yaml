    title: Shot structure for a real production
    brief: "A real production has many shots, many takes of each shot, and many people who work on them. A clear structure with fixed names keeps the master sequence safe and easy to read. Unreal can create a master sequence with numbered shots for you. In this quest you create that structure, add takes and notes, test which sequence wins when two of them animate the same light, and write a naming rule for a team."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/sequences-shots-and-takes-in-unreal-engine"
    backup_url: null
