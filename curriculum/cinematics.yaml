    subjects: [movie-render-graph, rendering, pipeline]
    required_spine: false
    required: false
    title: Your first Movie Render Graph
    brief: "Movie Render Graph is the newer way to set up renders in Unreal. You do not fill in a list of settings. You connect nodes in a graph, and each chain of nodes that ends in the Output node describes one image to render. Render layers and variables are only available in the graph. In this quest you create your first graph, build one chain that renders PNG files, and turn one setting into a variable that you can change for each job."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/movie-render-graph-nodes-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/movie-render-pipeline-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/transitioning-to-the-movie-render-graph-from-movie-render-queue-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, with the Movie Render Pipeline plugin enabled. You need a Level Sequence with a camera. To make one, choose Add Level Sequence in the Cinematics dropdown of the main toolbar and click the Camera button in Sequencer. In Movie Render Queue, add a job for it. In the Settings column, click the arrow next to Unsaved Config and choose Movie Render Graph (Beta). Under Create New Asset, click Movie Render Graph and save it as MRG_Base."
      - "Open MRG_Base. Find the Globals chain and click each of its nodes: Sampling Method, Global Output Settings, Warm Up Settings and Global Game Overrides. Set the output directory and the resolution in Global Output Settings."
      - "In the Members tab, under OUTPUTS, click + and name the output beauty. Build this chain of nodes: Render Layer, then Deferred Renderer, then PNG Output File Type, then Output. Set the File Name to {sequence_name}.{layer_name}.{frame_number}."
      - "Right-click the Sampling Method node and expose the TemporalSampleCount pin. Right-click the pin and choose Promote to Variable. Go back to the queue and set the variable to 4 on the job."
      - "Open the Active Render Settings tab and click Evaluate Graph to see the final settings. Break the chain between the renderer and the output, evaluate again, and then reconnect it."
      - "Right-click the Deferred Renderer node and choose Disable. Evaluate, then enable the node again. Click Render (Local) and check the names of the PNG files."
      - "Click the three dots next to Quick Render in the main toolbar and open Quick Render Settings. Set After Render to Open Output Directory and render the Current Viewport."
    done_when: "Send a screenshot of MRG_Base that shows the Globals chain and your beauty chain, with the exposed TemporalSampleCount pin promoted to a variable. Also send a screenshot of the queue that shows the variable value on the job."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Where do you switch a job from the legacy config to a Movie Render Graph?"
        choices: ["Edit > Project Settings > Movie Pipeline", "Sequencer > Render Movie Options > Graph", "In the Settings column, the arrow next to Unsaved Config > Movie Render Graph (Beta)", "Right-click the Level Sequence > Convert to Graph"]
        answer_index: 2
        explain: "The graph is reached through the queue. The Settings column arrow offers Movie Render Graph (Beta), and then you create or pick a graph asset."
      - q: "A chain is connected to an Output but has no Render Layer node. What happens?"
        choices: ["The chain renders with default settings", "The logic is passed out of the graph and nothing is rendered from that chain", "The editor shows an error and refuses to render", "The chain renders as a Path Tracer layer"]
        answer_index: 1
        explain: "The Render Layer node signals that the chain should be rendered. Without it the logic is only executed, which is useful for subgraphs and pipeline tools."
      - q: "Where are Temporal Samples and Spatial Samples set in the graph?"
        choices: ["Both on the Renderer node", "Both on the Sampling Method node", "Temporal on the Output File Type node, Spatial on Globals", "Temporal on the global Sampling Method node, Spatial per layer on the Renderer node"]
        answer_index: 3
        explain: "Temporal samples can only be set once per job, in the Sampling Method node. Spatial samples and the anti-aliasing method live on the renderer node and can differ per layer."
      - q: "Two nodes in the same chain set the same property to different values. Which one wins?"
        choices: ["The node closest to the Output node", "The node closest to the Input", "The first one created", "Neither; the graph shows an error"]
        answer_index: 0
        explain: "The graph is evaluated from the Output backward, so nodes closest to the Output have the highest precedence."
      - q: "What is the reason for exposing a pin and promoting it to a variable?"
        choices: ["To make the graph run faster", "To set the value per job in the queue instead of making one graph per shot", "To save the graph as a subgraph", "To export the value as EXR metadata"]
        answer_index: 1
        explain: "Exposed properties promoted to variables can be set at the job level in the Movie Render Queue UI. The docs call this powerful in a source-controlled environment."
      - q: "You delete the Global Game Overrides node from the graph. How does this differ from the legacy config?"
        choices: ["It behaves the same as in the config", "The render fails without it", "In the graph the node no longer controls the render when deleted or disconnected", "It reappears automatically"]
        answer_index: 2
        explain: "In the graph the Game Overrides node stops affecting the render when deleted or disconnected, unlike the config file behaviour."
      - q: "You want an Unreal Insights trace of a render and a RenderDoc capture. Which node is that?"
        choices: ["Debug Settings", "Set CVar Value", "Execute Script", "Burn-In"]
        answer_index: 0
        explain: "The Debug Settings node captures Unreal Insights traces from the queue and can send frames to RenderDoc."
      - q: "Quick Render uses a Movie Render Graph config. If a value is set both in Quick Render Settings and in the graph, which applies?"
        choices: ["The graph always wins", "The editor asks each time", "The lower value is used", "Quick Render Settings take priority over the graph configuration"]
        answer_index: 3
        explain: "The options chosen in Quick Render Settings take priority over the graph configuration. Exposed graph variables appear under Primary Graph Variables so you can override them."
    flavors:
      _default: {why: "The graph is the future of rendering in Unreal; the legacy config is still there, but layers and variables live in the graph."}
      cinematics: {why: "One graph with variables replaces a folder of near-identical presets.", do: "Promote the output resolution to a variable too and render one job at half size."}

  - id: CQ57
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [anti-aliasing, sampling, warm-up, movie-render-queue]
    required_spine: false
    required: false
    title: Samples, warm-up and the AA method
    brief: "A sample is one render of a frame. Movie Render Queue renders each frame several times and averages the results, which gives smooth edges and motion blur. Warm-up means running the scene for some frames before the first rendered frame, so that effects such as particles are already moving on frame 1. In this quest you compare sample settings and anti-aliasing methods, and you use warm-up to fix the first frame of a shot."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-rendering-image-quality-settings-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/movie-render-graph-nodes-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/transitioning-to-the-movie-render-graph-from-movie-render-queue-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Pick a shot of 48 frames with a moving character and a Niagara effect. To make one, create a Level Sequence, click the Camera button in Sequencer, add SKM_Manny_Simple with a walk animation, and place a Niagara System made from one of the templates, such as a fountain, in view. Add the shot to Movie Render Queue. Add the Anti-Aliasing setting with Spatial 1 and Temporal 4, turn on Override Anti-Aliasing, and set the method to None. Render it to PNG. This is render A."
      - "Render B: use Spatial 2 and Temporal 8 (16 samples in total) with the method TemporalAA. Add Console Variables and set r.TemporalAASamples to 16. Compare the edges with render A."
      - "Render C: use the same settings as B, but delete the console variable. Look for sample positions that repeat, which you see as less smooth edges."
      - "Add a Camera Cuts section that starts 24 frames before the start of the playback range. Enable Use Camera Cut for Warm Up and Render Warm Up Frames, and set Engine Warm Up Count to 24. Compare the Niagara effect on frame 1 with render A."
      - "Add Debug Options and enable Write All Samples. Render only 2 frames with Custom Playback Range. Open the sample images that are saved next to the output."
      - "Set Output Frame Step to 2 for a quick preview. Count the output files."
      - "Switch the job to a Movie Render Graph. Show where the temporal count is set (the Sampling Method node) and where the spatial count and the AntiAliasing Method are set (the Deferred Renderer node)."
    done_when: "Send a screenshot with renders B and C side by side on one high-contrast edge, a screenshot of the Write All Samples folder with the sub-sample files, and a short note that says which warm-up settings fixed frame 1."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which anti-aliasing method is listed as not supported when you use Override Anti-Aliasing?"
        choices: ["FXAA", "TemporalAA", "MSAA", "None"]
        answer_index: 2
        explain: "The Anti Aliasing Method list has None, FXAA, TemporalAA and MSAA, and MSAA is marked Not supported."
      - q: "TAA is on and you use more than 8 samples. Why can extra samples stop helping?"
        choices: ["The GPU limits samples to 8", "r.TemporalAASamples (default 8) limits how many unique positions are chosen for anti-aliasing", "Temporal samples are ignored with TAA", "PNG cannot store more than 8 samples"]
        answer_index: 1
        explain: "With TAA enabled the number of unique positions is limited by r.TemporalAASamples, which defaults to 8. Set the method to None or raise the variable to Spatial x Temporal."
      - q: "You set a very high Temporal Sample Count. What does the documentation warn about?"
        choices: ["The delta time becomes too small for the engine and you get warnings after the render", "The output becomes black", "Spatial samples are disabled", "Motion blur is removed"]
        answer_index: 0
        explain: "Too many temporal samples create too small a delta time for the engine to handle, which results in warnings after a render."
      - q: "What does Use Camera Cut for Warm Up do?"
        choices: ["It adds a camera cut track to the output", "It renders the camera cut twice", "It determines the warm-up frame count from the Camera Cut section before the start time and evaluates those frames during warm-up", "It disables Engine Warm Up Count"]
        answer_index: 2
        explain: "The warm-up length comes from the camera cut section before the start time. Those frames are evaluated, so cloth or particles can continue their motion from the shot before."
      - q: "How is Render Warm Up Count different from Engine Warm Up Count?"
        choices: ["They are the same setting with two names", "Render Warm Up Count ticks the game thread but never renders", "Render Warm Up Count only works with the Path Tracer", "Render Warm Up Count rebuilds the TAA history with samples taken at the same time without ticking the engine, right before rendering starts"]
        answer_index: 3
        explain: "Render Warm Up Count builds the temporal history after a camera cut clears it. All samples are taken at the same time and it happens regardless of the Engine Warm Up Count."
      - q: "Engine Warm Up frames are ticked but not rendered by default. Which option submits them to the GPU, and why would you?"
        choices: ["Use LODZero, for foliage", "Render Warm Up Frames, for content like GPU particles or virtual texturing that must render to warm up", "Write All Samples, for debugging", "Override Anti-Aliasing, for TAA"]
        answer_index: 1
        explain: "Render Warm Up Frames sends each Engine Warm Up frame to the GPU. This matters when content must actually render to warm up, such as GPU particles or virtual textures."
      - q: "What does the Write All Samples debug option write to disk?"
        choices: ["Every single render sample so you can inspect individual temporal or spatial sub-samples", "Only the final accumulated frames", "A log file with sample counts", "A RenderDoc capture per frame"]
        answer_index: 0
        explain: "Write All Samples writes every render sample produced by the GPU next to the output so you can see sub-sample renders without accumulation."
      - q: "Output Frame Step is set to 2. What is true about the skipped frames?"
        choices: ["The game does not tick for them", "They are rendered at half resolution", "They are written as black frames", "The game still ticks for them so results stay consistent, and the feature is experimental"]
        answer_index: 3
        explain: "With a frame step the skipped frames still tick the game to keep results close to rendering every frame. The docs mark the feature as experimental."
    flavors:
      _default: {why: "Samples and warm-up decide whether frame 1 and every edge look finished or broken."}
      cinematics: {why: "Knowing what each warm-up count does saves hours of re-renders on cloth and particle shots.", do: "Add {ts_count} and {ss_count} to the File Name Format so every test render names itself."}

