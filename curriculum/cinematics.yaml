    quiz:
      - q: "According to the documentation, when is a Possessable the better choice?"
        choices: ["When the actor is temporary and only needed during the scene", "When you need to render the same scene in several levels", "When the scene needs a high degree of interaction with actors that already exist in the level", "When the actor must respawn every tick"]
        answer_index: 2
        explain: "Possessables reference existing level actors through a soft object path. The page says possessing is likely best when the scene interacts a lot with existing actors."
      - q: "What is the default lifetime of a Spawnable actor?"
        choices: ["It exists permanently after the first play", "It is spawned when the sequence starts and destroyed when it ends", "It exists only while the editor is open", "It is spawned only during Play In Editor"]
        answer_index: 1
        explain: "By default a Spawnable is spawned when the sequence starts and destroyed and removed when the sequence ends. The Spawn Track can control the exact frames."
      - q: "You have an actor already in the level and want it to become a Spawnable. What are the documented steps?"
        choices: ["Delete it from the level and drag the asset from the Content Browser", "Set its Mobility to Movable and it becomes spawnable automatically", "Enable Create Spawnable Actors in Project Settings", "Add it to Sequencer as a Possessable, then right-click it and choose Convert to Spawnable"]
        answer_index: 3
        explain: "The page says to add the actor to Sequencer (Track > Add Actor to Sequencer) and then right-click the track and select Convert to Spawnable."
      - q: "How can you identify a Spawnable in Sequencer and the Outliner?"
        choices: ["It shows a lightning bolt overlay on the actor icon", "Its name is written in red", "It has a lock icon", "It is placed in a folder called Spawnables"]
        answer_index: 0
        explain: "Once spawned, a lightning bolt overlay appears on the actor in Sequencer and in the Outliner."
      - q: "What does Spawned Object Owner = External do?"
        choices: ["The actor spawns at the sequence start but is not destroyed at the end; you can destroy it later via Blueprints using Sequencer Tags and Groups", "The actor is spawned by the root sequence instead of the current one", "The actor is owned by the server for networking", "The actor is spawned into an external level file"]
        answer_index: 0
        explain: "External keeps the actor alive after the sequence ends. The page points to Sequencer Tags and Groups for destroying it through Blueprints."
      - q: "What is the difference between This Sequence and Root Sequence as Spawned Object Owner?"
        choices: ["There is no difference; they are aliases", "This Sequence spawns the actor only for the current sequence; Root Sequence keeps it for the whole master sequence, so it can exist outside the current sequence bounds", "Root Sequence disables the Spawn track", "This Sequence only works in subsequences"]
        answer_index: 1
        explain: "This Sequence (the default) spawns and destroys for the current sequence. Root Sequence spawns for the duration of the master sequence, which may be outside the current sequence bounds."
      - q: "What does the Change Class option on a Spawnable preserve?"
        choices: ["All object properties but not tracks", "Nothing; it resets the spawnable", "The Sequencer tracks already added, but not non-Sequencer data such as object properties", "Only the Transform track"]
        answer_index: 2
        explain: "Change Class swaps the spawned class while preserving Sequencer tracks. It does not preserve non-Sequencer data like object properties."
      - q: "When would you enable Continuously Respawn?"
        choices: ["To make the actor spawn on every level load", "When something outside Sequencer may destroy the actor and you want it re-created while its Spawn track says it should exist", "To spawn a copy each frame", "To make the actor visible in the editor only"]
        answer_index: 1
        explain: "Continuously Respawn checks every tick that the actor still exists (based on the Spawn track) and respawns it if an external destroy event removed it."
      - q: "How do you rebind an Object Binding Track to a different actor?"
        choices: ["Delete the track and add the actor again; rebinding is not possible", "Rename the track to the new actor name", "Drag the new actor onto the old track's keyframes", "Right-click the track, open the Assign Actor menu and pick the new actor or use Replace with Selected"]
        answer_index: 3
        explain: "The Object Binding Track page says bindings can be changed or removed from the Assign Actor menu, including Replace with Selected and Remove All."
      - q: "What is a Replaceable binding?"
        choices: ["A binding that uses a preview actor while editing and dynamically binds to an existing in-game actor at runtime", "A spawnable that changes class at runtime", "A possessable that can be renamed", "A binding that is replaced by the Camera Cuts track"]
        answer_index: 0
        explain: "The Custom Binding page lists Replaceable as a binding type: a preview actor in the editor, then a dynamic bind to an existing in-game actor at runtime."
