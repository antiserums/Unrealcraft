      - "Right-click the spawnable track, open the Spawnable category and set Spawned Object Owner to External. Play again and confirm that the actor stays after the sequence ends. Then set it back to This Sequence."
      - "On the Spawn track, trim the section so that the actor spawns 1 second after the sequence starts."
      - "Right-click a possessable track and open Assign Actor. Use Replace with Selected to bind the track to a different actor of the same class."
      - "Extra: make a track follow the real player. Right-click the track of a character, open Convert Selected Binding(s) To, then Replaceable from Director Blueprint, then Quick Bind, and choose Resolve to Player Pawn. Unreal now creates a small function in the Director Blueprint of the sequence that finds the player pawn when the sequence plays. Test it in Play In Editor."
    done_when: "Send a screenshot of Sequencer that shows one possessable track and one spawnable track (with the lightning bolt visible), the Spawnable properties panel open, and the Outliner during playback. Add three sentences: one case where you would use a possessable, one case where you would use a spawnable, and what changes when Spawned Object Owner is set to External."
    xp: 170
    verify_type: screenshot
    quiz:
      - q: "According to the documentation, when is a Possessable the better choice?"
        choices: ["When the actor is temporary and only needed during the scene", "When you need to render the same scene in several levels", "When the scene needs a high degree of interaction with actors that already exist in the level", "When the actor must respawn every tick"]
        answer_index: 2
        explain: "Possessables reference existing level actors through a soft object path. The page says possessing is likely best when the scene interacts a lot with existing actors."
      - q: "What is the default lifetime of a Spawnable actor?"
        choices: ["It exists permanently after the first play", "It is spawned when the sequence starts and destroyed when it ends", "It exists only while the editor is open", "It is spawned only during Play In Editor"]
        answer_index: 1
        explain: "By default a Spawnable is spawned when the sequence starts and destroyed and removed when the sequence ends. The Spawn Track can control the exact frames."
      - q: "You have an actor already in the level and want it to become a Spawnable. What are the documented steps?"
        choices: ["Delete it from the level and drag the asset from the Content Browser", "Set its Mobility to Movable and it becomes spawnable automatically", "Enable Create Spawnable Actors in Project Settings", "Add it to Sequencer as a Possessable, then right-click it and choose Convert to Spawnable"]
        answer_index: 3
        explain: "The page says to add the actor to Sequencer (Track > Add Actor to Sequencer) and then right-click the track and select Convert to Spawnable."
      - q: "How can you identify a Spawnable in Sequencer and the Outliner?"
        choices: ["It shows a lightning bolt overlay on the actor icon", "Its name is written in red", "It has a lock icon", "It is placed in a folder called Spawnables"]
        answer_index: 0
        explain: "Once spawned, a lightning bolt overlay appears on the actor in Sequencer and in the Outliner."
      - q: "What does Spawned Object Owner = External do?"
        choices: ["The actor spawns at the sequence start but is not destroyed at the end; you can destroy it later via Blueprints using Sequencer Tags and Groups", "The actor is spawned by the root sequence instead of the current one", "The actor is owned by the server for networking", "The actor is spawned into an external level file"]
        answer_index: 0
        explain: "External keeps the actor alive after the sequence ends. The page points to Sequencer Tags and Groups for destroying it through Blueprints."
      - q: "What is the difference between This Sequence and Root Sequence as Spawned Object Owner?"
        choices: ["There is no difference; they are aliases", "This Sequence spawns the actor only for the current sequence; Root Sequence keeps it for the whole master sequence, so it can exist outside the current sequence bounds", "Root Sequence disables the Spawn track", "This Sequence only works in subsequences"]
        answer_index: 1
        explain: "This Sequence (the default) spawns and destroys for the current sequence. Root Sequence spawns for the duration of the master sequence, which may be outside the current sequence bounds."
      - q: "What does the Change Class option on a Spawnable preserve?"
        choices: ["All object properties but not tracks", "Nothing; it resets the spawnable", "The Sequencer tracks already added, but not non-Sequencer data such as object properties", "Only the Transform track"]
        answer_index: 2
        explain: "Change Class swaps the spawned class while preserving Sequencer tracks. It does not preserve non-Sequencer data like object properties."
      - q: "When would you enable Continuously Respawn?"
        choices: ["To make the actor spawn on every level load", "When something outside Sequencer may destroy the actor and you want it re-created while its Spawn track says it should exist", "To spawn a copy each frame", "To make the actor visible in the editor only"]
        answer_index: 1
        explain: "Continuously Respawn checks every tick that the actor still exists (based on the Spawn track) and respawns it if an external destroy event removed it."
      - q: "How do you rebind an Object Binding Track to a different actor?"
        choices: ["Delete the track and add the actor again; rebinding is not possible", "Rename the track to the new actor name", "Drag the new actor onto the old track's keyframes", "Right-click the track, open the Assign Actor menu and pick the new actor or use Replace with Selected"]
        answer_index: 3
        explain: "The Object Binding Track page says bindings can be changed or removed from the Assign Actor menu, including Replace with Selected and Remove All."
      - q: "What is a Replaceable binding?"
        choices: ["A binding that uses a preview actor while editing and dynamically binds to an existing in-game actor at runtime", "A spawnable that changes class at runtime", "A possessable that can be renamed", "A binding that is replaced by the Camera Cuts track"]
        answer_index: 0
        explain: "The Custom Binding page lists Replaceable as a binding type: a preview actor in the editor, then a dynamic bind to an existing in-game actor at runtime."
    flavors:
      _default: {why: "Choosing the wrong binding type is the most common reason a cinematic breaks when the level changes."}
      cinematics: {why: "Shots must be portable. Spawnables make a shot carry its own props, lights and cameras.", do: "Set the MRQ job Map to a second level and render the same spawnable-based shot there."}
      animation: {why: "Characters are usually spawnables in shots and possessables in gameplay cinematics.", do: "Use Resolve to Player Pawn so your sequence animates the real player character in PIE."}
      tech_art: {why: "Binding rules decide what Blueprint code must do when a sequence plays.", do: "Rebind a track from Blueprint using the Sequencer > Player > Bindings functions and describe what you called."}

  - id: CQ22
    rank: 3
    difficulty: expert
    specializations: [cinematics]
    subjects: [cine-camera, look-at-tracking, camera-rigs, transform-track]
    required_spine: false
    required: true
    title: Cameras that follow
    brief: "Many cinematic shots use a camera that follows the subject. The Cine Camera Actor can turn by itself to keep an actor in view (Look at Tracking) and keep that actor sharp (Tracking focus). A rail or a crane can carry the camera along with the action. In this quest you set up a tracking camera, put it on a rail, add a crane shot, and add a little noise so that one camera feels handheld."
    time_min: 100
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-cameras-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/camera-jibs-and-dollies-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-transform-and-property-tracks-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-animate-cinematic-cameras-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a Level Sequence named LS_Follow. It needs a moving character or a prop that travels across the set. To make one, drag SKM_Manny_Simple into the level, add it to the sequence, give it a walk clip on its Animation track, and set two keys on its Transform track so that it moves about 10 m."
      - "Add a Cine Camera Actor named CAM_Track. In Current Camera Settings, open Lookat Tracking Settings and enable Look at Tracking. Set Actor to Track to the character, and set a Relative Offset so that the head is framed. Enable Draw Debug Look at Tracking Position to check the point the camera aims at."
      - "Set Look at Tracking Interp Speed to a value above 0. Compare how the camera follows with this value and with 0."
      - "Set Focus Method to Tracking and choose the same actor. Enable Draw Debug Focus Plane and Smooth Focus Changes."
      - "Place a Camera Rig Rail. Add spline points and curve the track. Attach CAM_Track by dragging it onto the rail in the Outliner. Add the rail to Sequencer and keyframe Current Position on Rail from 0 to 1."
      - "Add a Camera Rig Crane with a second camera named CAM_Crane. Keyframe Crane Pitch, Crane Yaw and Crane Arm Length so that the camera rises and reveals the scene."
      - "On the Transform track of one camera, right-click a rotation channel and choose Override with Double Perlin Noise. This adds small random movement for a light handheld feel. Set a low Amplitude."
    done_when: "Send a screenshot of the viewport with the debug look-at cube and the rail visible, and a screenshot of Sequencer that shows the rail, crane and camera tracks with keys. Add a short note that says which Interp Speed you chose and why."
    xp: 180
    verify_type: screenshot
    quiz:
      - q: "What does enabling Look at Tracking do to the camera?"
        choices: ["Moves the camera along a spline toward the actor", "Overrides the camera rotation so it aims at the specified actor", "Sets the focus distance to the actor", "Locks the camera to the actor's socket"]
        answer_index: 1
        explain: "Look at Tracking overrides the camera's rotation and modifies it to aim at the actor set in Actor to Track."
      - q: "You enable Look at Tracking but leave Actor to Track empty. What does the camera look at?"
        choices: ["The last selected actor", "Nothing; tracking is ignored", "The world origin at 0, 0, 0", "The player pawn"]
        answer_index: 2
        explain: "The property table says that if no actor is specified, the camera tracks the world origin (0, 0, 0)."
      - q: "What does a Look at Tracking Interp Speed of 0 mean?"
        choices: ["The camera never updates its aim", "The camera tracks instantly; values above 0 add an increasing delay", "The camera tracks at 1 degree per frame", "Tracking uses the sequence frame rate"]
        answer_index: 1
        explain: "The default of 0 makes the camera track instantly. Numbers greater than 0 add an increasingly large delay to the tracking."
      - q: "Can the tracked actor change during a shot?"
        choices: ["No, Actor to Track is fixed per camera", "Only by using two cameras and a Camera Cut", "Only through the Camera Rig Crane", "Yes, Actor to Track can be keyframed in Sequencer so the camera changes target over time"]
        answer_index: 3
        explain: "The Actor to Track property can be keyframed in Sequencer, letting the camera change its tracked target over time."
      - q: "How do you attach a Cine Camera to a Camera Rig Rail per the documentation?"
        choices: ["Set the camera's Actor to Track to the rail", "Drag the camera actor onto the rig rail in the World Outliner", "Add a Rail component to the camera Blueprint", "Use the Attach track on the rail"]
        answer_index: 1
        explain: "After placing the rail, you move the camera to its position and attach it by dragging the camera actor onto the rig rail in the World Outliner."
      - q: "What range does Current Position on Rail use?"
        choices: ["0 to 100 in percent", "Centimeters along the spline", "0 to 1, where 0 is the start and 1 is the end of the track", "-1 to 1"]
        answer_index: 2
        explain: "Current Position on Rail is clamped between 0 and 1; 0 is the start point of the track and 1 is the end point."
      - q: "The camera on your rail keeps pointing the same world direction as the rail curves. Which option changes this?"
        choices: ["Show Rail Visualization", "Preview Mesh Scale", "Lock Orientation to Rail", "Allow Roll"]
        answer_index: 2
        explain: "By default the camera orientation is independent from the dolly. Lock Orientation to Rail makes the camera rotation relative to the dolly rotation."
      - q: "Which three properties animate a Camera Rig Crane shot?"
        choices: ["Crane Pitch, Crane Yaw and Crane Arm Length", "Focal Length, Aperture and Focus Distance", "Rail Position, Rail Speed and Rail Offset", "Roll, Dutch and Tilt"]
        answer_index: 0
        explain: "The crane controls are Crane Pitch, Crane Yaw and Crane Arm Length (in centimeters), plus Lock Mount Pitch / Yaw options."
      - q: "Your camera rotation flips strangely between two transform keys. Which Transform section property does the page suggest?"
        choices: ["Show 3D Trajectory", "Use Quaternion Interpolation, which reduces gimbal lock and other Euler rotation problems", "Active Channels", "Display > Show Curve"]
        answer_index: 1
        explain: "Use Quaternion Interpolation enables quaternion linear interpolation between transform keys and helps reduce gimbal lock and Euler-based problems."
      - q: "You override a camera rotation channel with Double Perlin Noise. Around what value does the noise animate?"
        choices: ["Around 0; to center it on another value, use an additive section", "Around the last keyframe value", "Around the actor being tracked", "Around the Amplitude value"]
        answer_index: 0
        explain: "Noise channels animate relative to 0. To get noise in a range like 100 to 200 you keep a base section and add an additive section converted to noise."
    flavors:
      _default: {why: "A camera that follows the subject smoothly is the core of most cinematic shots."}
      cinematics: {why: "Tracking, dollies and cranes are the three moves every operator must own.", do: "Attach the rail to the crane and animate both together for one combined move."}
      animation: {why: "Tracked cameras must read the character's motion, so the offset and interp speed matter.", do: "Set Relative Offset so the camera tracks the head bone region, not the actor root."}
      level_design: {why: "A rail spline is a path through your space; it shows what the player will see.", do: "Lay a rail that shows the whole graybox in one 10 second move."}

  - id: CQ23
