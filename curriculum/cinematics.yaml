      - "In MRQ create a job. Remove Deferred Rendering and add the Path Tracer renderer. For a still frame use Spatial Sample Count 16, Temporal 1. Render one frame and note the time."
      - "For a 48-frame moving shot use Spatial 1, Temporal 8 and enable Reference Motion Blur. Render and note seconds per frame."
      - "Compare a Path Tracer frame with the same frame from Deferred Rendering. Write three differences you can see."
    done_when: "One path-traced still and one frame from the moving shot, the MRQ settings list, and a short note with seconds per frame for both renders and your three observed differences."
    xp: 250
    verify_type: screenshot
    quiz:
      - q: "Which project setting is NOT part of the Path Tracer requirements listed in the docs?"
        choices: ["Default RHI set to DirectX 12", "Support Hardware Ray Tracing enabled", "Lumen Global Illumination enabled", "Enable Path Tracing enabled"]
        answer_index: 2
        explain: "The Path Tracer needs DX12, Support Hardware Ray Tracing and Enable Path Tracing. Lumen is not part of the requirement list."
      - q: "When you enable Support Hardware Ray Tracing, a pop-up asks about another setting. Which one?"
        choices: ["Support Compute Skin Cache", "Nanite", "Virtual Shadow Maps", "Enable Alpha Channel Support"]
        answer_index: 0
        explain: "Support Compute Skin Cache is required for hardware ray tracing and path tracing, so the editor asks you to enable it."
      - q: "An interior render is very slow. Which material change does the docs page recommend?"
        choices: ["Set roughness to 1", "Use only Unlit materials", "Increase Max Bounces", "Keep diffuse Base Color below 0.8"]
        answer_index: 3
        explain: "Albedo close to 1.0 makes rays bounce for a long time before Russian Roulette can end them. The docs recommend Base Color under 0.8."
      - q: "In the editor viewport a skinned character looks blurred and streaky under the Path Tracer. What is the correct fix?"
        choices: ["Increase Samples Per Pixel in the Post Process Volume", "Render the final frames with Movie Render Queue", "Disable Compute Skin Cache", "Turn off denoising"]
        answer_index: 1
        explain: "Animation does not invalidate the accumulated samples in the editor, so it streaks. MRQ renders each frame cleanly, so use it for final output."
      - q: "In MRQ, how is the total number of samples per pixel computed?"
        choices: ["Spatial plus Temporal", "Spatial only", "Spatial multiplied by Temporal", "Temporal only"]
        answer_index: 2
        explain: "The total is the product of the two counts, so 4 spatial and 4 temporal gives 16 samples per pixel."
      - q: "The docs give a sampling recommendation for stills and for animations. Which is it?"
        choices: ["Stills: all spatial with 1 temporal. Animations: 1 spatial with many temporal and Reference Motion Blur on", "Stills: many temporal. Animations: many spatial", "Always 4 and 4", "Stills: 1 and 1. Animations: 16 spatial"]
        answer_index: 0
        explain: "For stills put everything in spatial samples. For moving shots use 1 spatial and many temporal samples with Reference Motion Blur for the best blur."
      - q: "You set Samples Per Pixel in the Post Process Volume, but MRQ ignores it. Why?"
        choices: ["The volume must be Unbound", "Samples Per Pixel only works on Windows 11", "The Path Tracer plugin is missing", "MRQ uses its own Spatial Sample Count; the volume's Samples Per Pixel is ignored in MRQ"]
        answer_index: 3
        explain: "The docs state that the Post Process Volume samples per pixel setting is ignored when using MRQ. Use the Anti-aliasing Spatial Sample Count."
      - q: "You turn off Emissive Materials in the PathTracing post process settings. What happens?"
        choices: ["Emissive surfaces turn black", "Emissive surfaces are still visible to the camera but no longer light the scene", "All lights are disabled", "Emissive surfaces double their brightness"]
        answer_index: 1
        explain: "The colors stay visible to camera rays but do not emit light. This helps avoid double counting when a light fixture has both emissive geo and a real light."
      - q: "Which setting exists mainly to reduce firefly artifacts?"
        choices: ["Reference Atmosphere", "Max Bounces", "Max Path Intensity", "Filter Width"]
        answer_index: 2
        explain: "Max Path Intensity clamps the maximum exposure allowed for a path, which reduces firefly artifacts."
      - q: "You use an HDRIBackdrop with the Path Tracer and get double lighting. What does the docs page suggest?"
        choices: ["Use a Sky Light with the texture and set r.PathTracing.VisibleLights 2 so the backdrop shows", "Increase Max Bounces to 32", "Enable Emissive Materials", "Switch to Lumen"]
        answer_index: 0
        explain: "HDRIBackdrop is not compatible with the Path Tracer. Use a Sky Light with the HDRI and make it visible with r.PathTracing.VisibleLights 2."
      - q: "Reference Motion Blur is enabled in MRQ. How does sampling change?"
        choices: ["Spatial samples are doubled", "Denoising happens after each spatial sample", "Temporal samples are ignored", "All temporal samples are taken before denoising, so keep Spatial at 1 and use temporal samples"]
        answer_index: 3
        explain: "With Reference Motion Blur, temporal samples are accumulated before the denoiser runs. The docs recommend Spatial 1 and driving quality with temporal samples."
      - q: "The Denoiser toggle in the Post Process Volume does nothing. What is the most likely reason?"
        choices: ["Max Bounces is too low", "The denoiser plugin (NNE Denoiser by default) is not enabled", "The camera is orthographic", "Temporal samples are above 8"]
        answer_index: 1
        explain: "The toggle uses the loaded denoiser plugin. If no denoiser plugin is enabled it has no effect on the output."
    flavors:
      _default: {why: "The Path Tracer gives ground-truth lighting with almost no setup, but it costs render time. You must know when it pays off."}
      cinematics: {why: "Final-frame cinematics often go through the Path Tracer for hero shots. Knowing sampling and its limits keeps a render farm night from being wasted.", do: "Render the same 48 frames at temporal 4 and temporal 16 and show the time and quality difference."}
      lookdev: {why: "The Path Tracer is your reference for checking that real-time materials and lights are believable.", do: "Compare one material under Lumen and the Path Tracer and note where they differ."}
      tech_art: {why: "Firefly clamps, denoiser plugins and CVars are the knobs a tech artist tunes for the team.", do: "Add a Console Variables setting to the MRQ job with one Path Tracer CVar and explain what it does."}

  - id: CQ28
    rank: 4
    difficulty: master
    track: cinematics
    subjects: [movie-render-queue, anti-aliasing, high-resolution, render-budget]
    required_for_majors: [cinematics]
    taster_for_majors: []
    adjacent_for: [tech_art, lookdev]
    required_spine: false
    elective: false
    title: High-quality settings and their cost
    time_min: 120
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-rendering-image-quality-settings-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-workflow-tips-for-sequencer-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-render-settings-and-formats-in-unreal-engine"
    checklist:
      - "Pick a 48-frame shot with a moving camera and one moving object. Add a Burn In setting so each frame shows the job name and frame number."
      - "Render A: Anti-Aliasing Spatial 1, Temporal 1, PNG Sequence at 1920x1080. Write down seconds per frame and total time."
      - "Render B: Spatial 1, Temporal 8, Override Anti Aliasing on with method None. Extend your tracks one frame before the start so the first temporal sample has data. Note the time."
      - "Render C: same as B, plus High Resolution with Tile Count 2 and Overlap Ratio 0.1 at 3840x2160. Note the time."
      - "Add Engine Warm Up Count 32 to the shot that has cloth or particles, and Render Warm Up Count 8. Compare the first frame with and without warm-up."
      - "Make a table: render, settings, seconds per frame, total minutes, what got better. Add the file name format you used, including {ts_count} and {ss_count} tokens."
      - "Write a 3-line budget rule: for a 60-second film at 24 fps, which settings fit an overnight render on your machine."
    done_when: "A writeup with the table for renders A, B and C (seconds per frame and total time), one frame from each, a first-frame comparison with and without warm-up, and your budget rule."
    xp: 250
    verify_type: writeup
    quiz:
      - q: "How does Temporal sampling produce motion blur?"
        choices: ["It jitters the camera position each sample", "It slices the time the shutter is open into steps, renders each and blends them, which gives rotational blur", "It blurs the image in post with a vector pass", "It renders at half resolution and upsamples"]
        answer_index: 1
        explain: "Temporal samples divide the shutter-open time into slices. The engine ticks to each slice and the results accumulate, so blur can curve and rotate."
      - q: "Spatial and Temporal samples give the same anti-aliasing offsets. Why does the docs page say temporal is usually more efficient?"
        choices: ["Temporal samples are free on the GPU", "Spatial samples cannot exceed 4", "Temporal samples skip post processing", "Static objects get the same anti-aliasing, and moving objects also get blur that hides aliasing"]
        answer_index: 3
        explain: "With temporal samples, non-moving objects are anti-aliased the same, and moving objects are blurred, so you get more benefit per sample."
      - q: "TAA is on and you use 16 samples. What does the docs page recommend?"
        choices: ["Enable Override Anti-Aliasing and set it to None, or raise r.TemporalAASamples to match the sample count", "Nothing, TAA handles it", "Lower the resolution", "Use MSAA"]
        answer_index: 0
        explain: "TAA limits the unique positions to r.TemporalAASamples, which defaults to 8. With more samples, disable TAA or raise that value."
      - q: "You set Temporal Sample Count above 1. What must you check in Sequencer?"
        choices: ["The frame rate must be 60", "Cameras must be spawnables", "Tracks must cover the time before the first frame; animation and audio sections cannot auto-expand", "The shot must be a subsequence"]
        answer_index: 2
        explain: "The sequence is evaluated on both sides of each frame. Sections auto-expand where possible, but animation and audio cannot, so you extend them by hand."
      - q: "High Resolution Tile Count is set to 2. How many tiles are rendered per frame?"
        choices: ["2", "4", "8", "16"]
        answer_index: 1
        explain: "Tile Count uses square formatting, so a Tile Count of 2 gives a 2x2 grid, which is four tiles."
      - q: "What is the Overlap Ratio for, and what does it cost?"
        choices: ["It sharpens textures at no cost", "It sets the tile size and lowers memory use", "It blends tile edges to reduce seams, mainly for Depth of Field, at the cost of extra render time", "It adds motion blur to tiles"]
        answer_index: 2
        explain: "Overlap makes tiles share an edge region that is blended. This helps DoF seams but makes the render take longer."
      - q: "Which feature does High Resolution tiled rendering NOT support?"
        choices: ["Temporal anti-aliasing and screen space effects like SSR and lens flares", "PNG output", "Spatial samples", "Burn In"]
        answer_index: 0
        explain: "The docs state that High Resolution does not support TAA and screen-space features such as screen space reflections, convolution bloom, lens flares and fast motion blur."
      - q: "What is the difference between Engine Warm Up Count and Render Warm Up Count?"
        choices: ["They are the same setting with two names", "Engine Warm Up renders to disk; Render Warm Up does not", "Render Warm Up ticks physics; Engine Warm Up does not", "Engine Warm Up ticks the engine for N frames so physics settle; Render Warm Up rebuilds the TAA history with samples taken at the same time, right before rendering"]
        answer_index: 3
        explain: "Engine warm-up lets time pass for cloth and particles. Render warm-up takes samples without ticking, to rebuild temporal history after a camera cut."
      - q: "A cloth character starts in an idle pose and settles visibly on frame 1. What does the tips page suggest?"
        choices: ["Set Spatial Sample Count to 8", "Set Engine Warm Up Count to a value above 30", "Enable High Resolution", "Disable the Tone Curve"]
        answer_index: 1
        explain: "For objects with no starting motion, Engine Warm Up Count gives physics time to settle. The docs suggest a value greater than 30."
      - q: "You add console variables to an MRQ job. What happens to them after the render?"
        choices: ["They stay changed in the editor", "They are saved into the level", "They are restored to their original values", "They are written into DefaultEngine.ini"]
        answer_index: 2
        explain: "MRQ saves the original value before the render and restores it when the render finishes."
      - q: "Shutter Timing is set to Frame Close. Where does the motion blur come from?"
        choices: ["From the motion before the frame in Sequencer", "From the motion after the frame", "Centered around the frame", "There is no motion blur"]
        answer_index: 0
        explain: "Frame Close represents the shutter closing, so the blur shows what comes before the frame. Frame Open shows what comes after, and Frame Center is balanced."
      - q: "Which output format is Overscan Percentage designed for, and what happens with other formats?"
        choices: ["PNG; other formats crash", "JPG; other formats ignore it", "WAV; other formats ignore it", "EXR, which stores the region data; other formats simply come out larger with changed framing"]
        answer_index: 3
        explain: "Overscan encodes the region information in a way unique to EXR. Other formats still work but the output is larger than expected and the framing changes."
    flavors:
      _default: {why: "Quality settings multiply render time. A master knows the price of each one before pressing Render."}
      cinematics: {why: "A production budget is measured in frames per hour. Sampling, tiles and warm-up are where the hours go.", do: "Add a fourth render with Spatial 2, Temporal 8 and show whether it is worth the time."}
      tech_art: {why: "Warm-up counts and CVars are how you make a render deterministic across machines.", do: "Save the B settings as a Movie Pipeline Master Config asset and share it with the team."}
      lookdev: {why: "DoF seams and TAA history bugs are look problems that come from render settings, not materials.", do: "Show a tile seam with Overlap 0 and the fix with Overlap 0.1."}

