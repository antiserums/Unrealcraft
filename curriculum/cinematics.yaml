    specializations: [cinematics]
    subjects: [virtual-camera, vcam-component, output-providers, modifiers]
    required_spine: false
    required: false
    title: Build your own VCam
    brief: "The ready-made VCam Actor is a normal Cine Camera with a VCam Component added to it. The component has two kinds of parts: Modifiers, which change how the camera behaves, and Output Providers, which decide where the camera picture is shown. When you know these parts, you can build a virtual camera for your own way of working. In this quest you build one by hand from a Cine Camera Actor."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/configuring-a-virtual-camera-component-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/virtual-cameras-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open Edit > Plugins, enable the VirtualCamera and Live Link plugins, and restart the editor."
      - "Place a Cine Camera Actor named CAM_VCam. In the Details panel, click Add and add a VCam Component. Drag it onto the CameraComponent so that it is a direct child of it."
      - "Under Output Providers, click + and pick the Viewport Output Provider. Turn on Is Active and set Target Viewport. Enable Use Override Resolution and set 1280 x 720. Then turn Is Active off and on again."
      - "In the Content Browser, enable Show Plugin Content and open Engine > Plugins > VirtualCamera Content > Modifiers. Add two of these modifiers to the Modifier Stack and swap their order."
      - "Enable Disable Component when Spawned by Sequencer. Add a second provider, Pixel Streaming, and give it a unique Streamer Id."
      - "Optional, if you have a supported phone or tablet: connect the Unreal VCam app and enable Auto Set Live Link Subject on the Pixel Streaming provider. The documentation page of this component still uses the older app name, Live Link VCAM."
    done_when: "Send one screenshot of the component hierarchy with the VCam Component under the CameraComponent, and one screenshot of the Details panel that shows the Output Providers list and the Modifier Stack. Add one line that says why the resolution override needed the Is Active toggle."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Where must the VCam Component sit for the virtual camera to work?"
        choices: ["On the root of the actor", "As a direct child of the CameraComponent", "On a separate empty actor", "Anywhere; order does not matter"]
        answer_index: 1
        explain: "The page warns that the Virtual Camera will not function if the VCam Component is not a direct child of the CameraComponent."
      - q: "In the VCam architecture, which part is the model and which is the view?"
        choices: ["Modifiers are the model, Output Providers are the views", "Output Providers are the model, Modifiers are the views", "Live Link is the model, UMG is the view", "The Cine Camera is the model, the viewport is the view"]
        answer_index: 0
        explain: "Modifiers implement the logic that changes the Cine Camera Component, so they are the model. Output Providers create and render widgets, so they are the views."
      - q: "You set Use Override Resolution but nothing changes. What does the page say to do?"
        choices: ["Restart the editor", "Add a second output provider", "Toggle Is Active off and then back on", "Set the Streamer Id"]
        answer_index: 2
        explain: "For Use Override Resolution to take effect, you must toggle Is Active off then back on."
      - q: "In what order are modifiers in the Modifier Stack applied?"
        choices: ["Alphabetically", "Random each frame", "From top to bottom", "From bottom to top"]
        answer_index: 2
        explain: "Each modifier in the stack is applied and rendered in order from top to bottom. The same is true for Output Providers."
      - q: "Which output provider is described as the primary one for virtual cameras?"
        choices: ["Viewport", "Media", "Composure", "Pixel Streaming"]
        answer_index: 3
        explain: "The Pixel Streaming Output Provider streams the viewport over WebRTC to remote devices such as the Live Link VCam app, and is called the primary output provider. The component supports a single stream."
      - q: "What does Disable Component when Spawned by Sequencer prevent?"
        choices: ["Two VCam Components becoming active at the same time when a sequence with a spawnable VCam plays", "The camera being recorded by Take Recorder", "The sequence from spawning the camera", "Live Link from connecting"]
        answer_index: 0
        explain: "It disables the VCam Component when spawned by a sequence, so two VCam Components do not become active at once."
      - q: "Why should each Pixel Streaming provider have a unique Streamer Id?"
        choices: ["The editor refuses to start without one", "Duplicate streamer IDs between VCams can cause issues with the signalling server", "It sets the stream resolution", "It is used as the Live Link subject name"]
        answer_index: 1
        explain: "The Streamer Id is reported to the signalling server. The page recommends a unique name because a duplicate ID can cause issues."
      - q: "Which of these is NOT in the list of Output Providers?"
        choices: ["Unreal Remote", "Media", "Composure", "Take Recorder"]
        answer_index: 3
        explain: "The available providers are Viewport, Pixel Streaming, Unreal Remote, Media and Composure. Take Recorder is a separate tool."
    flavors:
      _default: {why: "The VCam Actor is only one assembly of parts. Knowing the parts lets you build a camera for your own workflow."}
      cinematics: {why: "A custom VCam can show your own overlays and limit movement the way a real rig would.", do: "Add a UMG Overlay to the Viewport provider with a simple framing grid."}
      tech_art: {why: "Modifiers and Output Providers are Blueprint-extensible, which makes VCam a tools problem you can own.", do: "Open one of the default modifiers in the plugin content and read how it changes the camera."}
