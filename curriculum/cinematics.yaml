# Unrealcraft — Cinematics specialization, all ranks. IDs CQ1…
# Difficulty tiers: novice (rank 0) · apprentice (1) · adept (2) · expert (3) · master (4).
# Every URL was checked against the live UE 5.8 docs when written.

quests:
  - id: CQ1
    rank: 0
    difficulty: novice
    specializations: [cinematics]
    subjects: [viewport, camera, navigation, piloting]
    required_spine: false
    required: false
    title: Bookmarks and camera speed
    brief: "Before you can film anything in Unreal, you need to move the view of the editor quickly and exactly. A viewport bookmark is a saved view that you can jump back to with one key. Piloting means that you look through a camera and move it with the normal viewport controls. In this quest you practice camera speed, orbiting and bookmarks, and you pilot your first Cine Camera Actor, the camera type used for filming."
    time_min: 25
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/viewport-controls-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-cameras-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template, and open a level that has a few meshes in it. The level of the template works. Hold RMB (the right mouse button) and scroll the mouse wheel to change the camera speed. Find a speed that feels good for close work."
      - "Select one mesh and press F to focus the view on it. Hold Alt + LMB and drag to orbit around it. Then try Alt + RMB, which moves the view closer or farther (dolly), and Alt + MMB, which slides the view sideways or up and down (track)."
      - "Find three nice views of the level. Save each one as a viewport bookmark with Ctrl + 1, Ctrl + 2 and Ctrl + 3. Then press 1, 2 and 3 to jump between them."
      - "Place a Cine Camera Actor in the level. You find it in the Place Actors panel under Cinematic. Right-click it in the viewport and choose Pilot CineCameraActor, then move the view with the normal controls."
      - "Click the eject icon to stop piloting. Select the camera again and press Ctrl + Shift + P to pilot it with the keyboard shortcut."
      - "Press G to turn Game View on and off. Game View shows the shot without the editor icons."
    done_when: "Send one screenshot of the viewport while you pilot the Cine Camera Actor. The pilot bar must be visible at the top of the viewport. Add one line that says which camera speed you chose."
    xp: 30
    verify_type: screenshot
    quiz:
      - q: "How do you change the movement speed of the viewport camera while flying?"
        choices: ["Hold RMB and scroll the mouse wheel", "Press F", "Press G", "Hold Alt and drag with LMB"]
        answer_index: 0
        explain: "Holding RMB and scrolling the wheel increases or decreases the camera movement speed."
      - q: "You selected an object and want the camera to orbit around it. What do you press?"
        choices: ["Press G, then drag with RMB", "Press F to focus, then hold Alt + LMB and drag", "Hold RMB + W", "Press F11"]
        answer_index: 1
        explain: "F focuses on the selected object. Alt + LMB drag then orbits around that pivot."
      - q: "What does the G key do in the Level viewport?"
        choices: ["Groups the selected actors", "Opens the Game settings", "Toggles Game View, hiding editor-only gizmos and icons", "Toggles the grid"]
        answer_index: 2
        explain: "G toggles Game Mode (Game View). The viewport then shows only what would be seen in-game."
      - q: "Which shortcut starts piloting the selected Cine Camera Actor?"
        choices: ["Ctrl + P", "Alt + P", "Shift + F", "Ctrl + Shift + P"]
        answer_index: 3
        explain: "The Cine Camera Actor page lists Ctrl + Shift + P to jump into pilot mode for the selected camera."
      - q: "While piloting a camera, what does the eject icon in the viewport do?"
        choices: ["Deletes the camera", "Stops piloting and unlocks the viewport from the actor, keeping the camera selected", "Resets the camera transform", "Takes a screenshot"]
        answer_index: 1
        explain: "The eject icon exits camera pilot mode. The viewport is unlocked but the camera stays selected."
    flavors:
      _default: {why: "Fast, precise viewport movement is the base skill for every shot you will ever frame."}
      cinematics: {why: "Framing a shot starts with moving the editor camera exactly where you want it, then handing that view to a real camera.", do: "Pilot the camera, frame a shot, then open Editor Preferences > Level Editor > Viewports and lower the camera speed for fine framing."}
      level_design: {why: "Bookmarks let you jump between key spots in your level while you work."}
      lookdev: {why: "Orbit and dolly around one asset is how you inspect materials from every angle."}

  - id: CQ2
    rank: 0
    difficulty: novice
    specializations: [cinematics]
    subjects: [cine-camera, filmback, lens, focus]
    required_spine: false
    required: false
    title: The Cine Camera Actor
    brief: "The Cine Camera Actor is the camera you will use to film everything in Unreal. It copies a real film camera: the Filmback is the sensor inside the camera body, and the lens settings control how wide the view is and what is sharp. In this quest you place one, look at its small preview window, and try its main settings."
    time_min: 30
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-cameras-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open any project, or create one from the Third Person template. Add a Cine Camera Actor to the level from the Place Actors panel. Open Window > Place Actors and look under Cinematic."
      - "Select the camera. Look at the Picture-in-Picture (PIP) window in the bottom right of the viewport, which shows what the camera sees. Click the pin so that it stays visible."
      - "In the Details panel, open Filmback. Change the Filmback preset, for example to a 16:9 one, and watch Sensor Width, Sensor Height and Sensor Aspect Ratio change."
      - "Open Lens Settings and pick a lens preset. Then set Current Focal Length to 24 mm, then to 85 mm, and compare what the PIP shows each time."
      - "In Camera Options, enable Constrain Aspect Ratio. Notice the black bars that appear in the PIP."
      - "Set Focus Method to Manual. Click the eyedropper next to Manual Focus Distance and then click one object, so the camera focuses on that object."
    done_when: "Send one screenshot with the Cine Camera Actor selected. It must show the Details panel with Filmback and Lens Settings, and the pinned PIP window."
    xp: 30
    verify_type: screenshot
    quiz:
      - q: "What does the Cine Camera Actor add over a normal Camera Actor?"
        choices: ["A built-in Sequencer", "Filmback, Lens and Focus settings that copy real film cameras", "A wider field of view", "Automatic camera cuts"]
        answer_index: 1
        explain: "The page says the Cine Camera Actor is a specialized Camera Actor with Filmback, Lens and Focus settings that replicate real-world film camera behavior."
      - q: "You select a Filmback preset. Which values change?"
        choices: ["Focal Length and F-Stop", "Sensor Width and Sensor Height", "Crop Settings", "Manual Focus Distance"]
        answer_index: 1
        explain: "Filmback presets set the Sensor Width and Height to emulate the chosen camera body. The aspect ratio and base field of view follow from that."
      - q: "Why can you not type a value into Sensor Aspect Ratio?"
        choices: ["It is locked by the Filmback preset until you remove it", "It only changes in Sequencer", "It is read-only and computed from the sensor dimensions", "It is a project setting"]
        answer_index: 2
        explain: "Sensor Aspect Ratio is computed from Sensor Width and Height. It is intended for read-only reference."
      - q: "How do you emulate a prime lens (a lens that cannot zoom)?"
        choices: ["Set Min Focal Length and Max Focal Length to the same value", "Set Squeeze Factor to 1", "Disable Constrain Aspect Ratio", "Set Focus Method to Disable"]
        answer_index: 0
        explain: "The Lens Settings table says to set Min and Max Focal Length to the same value to emulate a prime lens."
      - q: "When does the Picture-in-Picture (PIP) window appear?"
        choices: ["Only while piloting the camera", "Only in Play In Editor", "Only when the camera is in Sequencer", "When a Cine Camera Actor is selected; it hides while you pilot the camera"]
        answer_index: 3
        explain: "Selecting a Cine Camera Actor shows a PIP preview in the bottom right of the viewport. The PIP is not displayed while piloting."
    flavors:
      _default: {why: "The Cine Camera Actor is the camera you will film everything with. Learn its panels once and every shot goes faster."}
      cinematics: {why: "Filmback and lens choices set the look of a shot before you add a single keyframe.", do: "Set Focus Method to Tracking, pick an actor, and enable Draw Debug Focus Plane to see where focus sits."}
      lookdev: {why: "Lens and focus settings decide how your materials are seen in a still or a turntable."}
      level_design: {why: "A quick Cine Camera in the level is the fastest way to check how a space reads from a player-like view."}

  - id: CQ3
    rank: 0
    difficulty: novice
    specializations: [cinematics]
    subjects: [screenshots, high-resolution-screenshot, hdr]
    required_spine: false
    required: false
    title: High-resolution screenshots
    brief: "A high-resolution screenshot is an image that Unreal saves at a larger size than your screen, so it stays sharp when people zoom in. It is the quickest way to show your work, and most portfolios use this kind of image. In this quest you take screenshots with the High Resolution Screenshot tool in four different ways and compare the results."
    time_min: 25
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/taking-screenshots-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open any project, or create one from the Third Person template. Frame a shot in the viewport. Open Viewport Options and choose High Resolution Screenshot."
      - "Set the Screenshot Size Multiplier to 2 and click the camera icon. Then click the message that appears in the bottom right to open the Saved/Screenshots folder."
      - "Click Specify Region and drag a rectangle in the viewport. Take a second screenshot, which will contain only that region."
      - "Select one mesh and enable Render CustomDepth Pass in its Details panel. In the screenshot tool, enable Use custom depth as mask and capture again. The mask keeps only the objects that have this option turned on."
      - "Start Play In Editor. Press the ~ key to open the console and type HighResShot 3840x2160. Find the new file in the same folder."
      - "Compare the file sizes and the pixel sizes of the four images."
    done_when: "Send one high-resolution screenshot of your shot taken at 2x or larger. Also send one screenshot of the Saved/Screenshots folder that shows your files with their pixel sizes."
    xp: 30
    verify_type: screenshot
    quiz:
      - q: "Where are screenshots saved by default?"
        choices: ["In the Content folder of the project", "In Saved/Screenshots inside the project folder", "On the Desktop", "In the Engine folder"]
        answer_index: 1
        explain: "By default screenshots go to Saved\\Screenshots\\Windows in your project folder. The message in the bottom right opens that folder."
      - q: "How does the HighResShot command produce an image larger than the screen?"
        choices: ["It lowers the quality of the scene", "It stretches the normal screenshot", "It renders the frame several times, one tile at a time, and joins the tiles", "It uses the Movie Render Queue"]
        answer_index: 2
        explain: "HighResShot renders the game frame multiple times, one tile at a time at full resolution, then concatenates the tiles into one image."
      - q: "What does the command HighResShot 2 do?"
        choices: ["Takes two screenshots", "Takes a screenshot twice as big as the screen resolution", "Takes a screenshot at 2K", "Waits two seconds before the screenshot"]
        answer_index: 1
        explain: "A single number is a multiplier. HighResShot 2 gives an image twice as big as the screen resolution."
      - q: "You want an HDR image from the High Resolution Screenshot Tool. Which option do you enable?"
        choices: ["Use custom depth as mask", "Include Buffer Visualization Targets", "Force 128-bit rendering only", "Write HDR format visualization targets, which writes OpenEXR files"]
        answer_index: 3
        explain: "The tool supports OpenEXR output. Enabling the HDR option writes .EXR files with full 16-bit color depth."
      - q: "What must you enable on an object before Use custom depth as mask can cut it out from the background?"
        choices: ["Render CustomDepth Pass in the object's Details panel", "Cast Shadows", "Constrain Aspect Ratio", "Game View"]
        answer_index: 0
        explain: "The custom depth mask uses the Custom Depth buffer. Objects must have Render CustomDepth Pass enabled to appear in the mask."
    flavors:
      _default: {why: "A clean high-resolution still is the fastest proof of your work, and the format most portfolios use."}
      cinematics: {why: "Storyboard stills and lookdev frames come from this tool long before you render a movie.", do: "Take the same framing at 1x and 4x and compare fine detail like text or thin edges."}
      lookdev: {why: "EXR output and the GBuffer passes let you inspect your materials outside the editor."}
      level_design: {why: "High-res captures of your blockout are great for review documents."}

  - id: CQ4
    rank: 1
    difficulty: apprentice
    specializations: [cinematics]
    subjects: [sequencer, level-sequence, keyframes, camera]
    required_spine: false
    required: true
    title: Your first Level Sequence
    brief: "A Level Sequence is the asset that holds a cinematic in Unreal. You edit it in Sequencer, a timeline editor where each track animates one thing over time. A keyframe, or key, stores a value at one moment, and Unreal fills in the movement between two keys. In this quest you create a Level Sequence, add a camera, and make a simple camera move with two keys."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-sequencer-movie-tool-overview"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-make-movies-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-animate-cinematic-cameras-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. In the main toolbar, click the Cinematics dropdown and choose Add Level Sequence. Name it LS_FirstMove and save it in a folder named Sequences."
      - "Sequencer opens. Click the Camera button in the Sequencer toolbar, which creates a new camera. Notice that the viewport now pilots the new Cine Camera Actor, which means you look through it."
      - "At frame 0, frame a wide view of the level. Select the Transform track of the camera and press Enter to set a key."
      - "Drag the playhead, the marker that shows the current time, to about 5 seconds. Move the camera to a new position. Select the Transform track and press Enter again."
      - "Press Play in Sequencer. Then drag the playhead back and forth to check the move."
      - "Select the Level Sequence Actor in the Outliner. In the Details panel, enable Auto Play. Press Play In Editor and watch the move run."
    done_when: "Send one screenshot of Sequencer that shows LS_FirstMove with a Cine Camera Actor track, at least two Transform keyframes, and the Camera Cuts track. Add one line that says how long your move is."
    xp: 110
    verify_type: screenshot
    quiz:
      - q: "What is the difference between a Level Sequence Asset and a Level Sequence Actor?"
        choices: ["They are the same thing with two names", "The Asset lives in the Content Browser and holds the data; the Actor lives in the Level and binds that data to the Level", "The Actor holds the keyframes; the Asset only holds the camera", "The Asset is only used for rendering"]
        answer_index: 1
        explain: "The Level Sequence Asset contains tracks, cameras and keyframes. It is assigned to a Level Sequence Actor in the Level to bind its data to that Level."
      - q: "Which is one correct way to create a Level Sequence?"
        choices: ["Window > Levels > New Level", "Right-click the viewport and choose Add Sequence", "Click the Cinematics dropdown in the main toolbar and choose Add Level Sequence", "Edit > Project Settings > Sequencer"]
        answer_index: 2
        explain: "The Cinematics dropdown in the Level Editor toolbar has Add Level Sequence. You can also right-click in the Content Browser and choose Cinematics > Level Sequence."
      - q: "You click the Camera button in the Sequencer toolbar. What happens?"
        choices: ["A Camera Actor is placed at the world origin, nothing else", "A Cine Camera Actor is created as a spawnable and the viewport starts piloting it", "The current viewport view is saved as a bookmark", "A Level Sequence Actor is created"]
        answer_index: 1
        explain: "The button creates a Cine Camera Actor as a spawnable for the sequence and updates the viewport to the camera's perspective (piloting)."
      - q: "The fastest way described to set a transform keyframe on the camera is:"
        choices: ["Select the Transform track and press Enter", "Right-click the viewport and choose Add Key", "Press Ctrl + S", "Drag the camera into the timeline"]
        answer_index: 0
        explain: "Select the camera's Transform track and press Enter. This sets a keyframe at the playhead."
      - q: "You open a Level Sequence by double-clicking it in the Content Browser, but no Level that references it is open. What happens?"
        choices: ["Unreal creates a new Level for it", "The sequence opens but its contents are unbound", "The Level Sequence Actor is deleted", "Sequencer refuses to open"]
        answer_index: 1
        explain: "When opening from the Content Browser you must have a Level open that references the sequence. Otherwise the contents are unbound."
      - q: "On the Level Sequence Actor, what does Auto Play do?"
        choices: ["Plays the sequence in the editor every time you save", "Loops the sequence forever", "Renders the sequence to a movie", "Plays the sequence automatically when the actor is created"]
        answer_index: 3
        explain: "Auto Play makes the sequence play automatically when the Level Sequence Actor is created, for example when the level starts."
    flavors:
      _default: {why: "Every cinematic, cutscene and trailer in Unreal starts with a Level Sequence and a camera move."}
      cinematics: {why: "This is the core loop of the major: place a camera, key it, scrub, refine.", do: "Add a third key in the middle of the move and make the camera slow down near the subject."}
      animation: {why: "Sequencer is also where you will place and blend character animation later."}
      level_design: {why: "A short fly-through sequence is the best way to show a level to your team."}

  - id: CQ5
    rank: 1
    difficulty: apprentice
    specializations: [cinematics]
    subjects: [sequencer, camera-cuts, editing]
    required_spine: false
    required: true
    title: "Camera Cuts: which camera when"
    brief: "A cut is the moment when the picture changes from one camera to another. In Sequencer, the Camera Cuts track decides which camera the viewer sees at each moment. In this quest you build a sequence with three cameras, cut between them, and try a blend, which is a smooth change from one camera to the next."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-camera-cut-track-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-camera-cuts-using-sequencer-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Create a Level Sequence named LS_ThreeCuts. Add a moving object so that there is action to cut on. A cube with two Transform keys is enough."
      - "Click the Camera button in the Sequencer toolbar. This makes a Cine Camera Actor and a Camera Cuts track. Frame a wide shot at frame 0."
      - "Move the playhead to the time where you want the first cut. Click the Camera button again to make camera 2, and frame a closer shot."
      - "On the Camera Cuts track, click Add Camera (+) and pick camera 2 under New Binding or Existing Bindings. A cut appears at the playhead."
      - "Do the same for a third camera. Then drag the edges where two cut sections touch to change the timing of the cuts."
      - "Enable the Camera Lock button on the Camera Cuts track and press Play to watch the cuts. Then right-click the track, enable Can Blend, and make two sections overlap to try a blend."
    done_when: "Send one screenshot of Sequencer that shows the Camera Cuts track with three sections bound to three different cameras, with the thumbnails visible. Add one line that says at which frame each cut is and why you put it there."
    xp: 120
    verify_type: screenshot
    quiz:
      - q: "What is the job of the Camera Cut Track?"
        choices: ["To store the camera's transform keys", "To choose which camera is active at each point in the sequence", "To render the sequence to disk", "To add depth of field"]
        answer_index: 1
        explain: "The Camera Cut Track controls which camera Sequencer looks through over time, and can blend cameras or blend to and from gameplay."
      - q: "How do you make a cut to another camera at a specific time?"
        choices: ["Move the playhead there, click Add Camera (+) on the Camera Cut Track and pick the camera", "Delete the old camera", "Press S with the camera selected", "Drag the camera actor into the viewport"]
        answer_index: 0
        explain: "Move the playhead to the cut point, then Add Camera (+) creates a new Camera Cut section bound to the chosen camera at the playhead."
      - q: "By default, what is special about the edges of Camera Cut sections?"
        choices: ["They can only be moved with the keyboard", "They snap to whole seconds", "They do not allow gaps or overlaps between cuts", "They cannot be moved at all"]
        answer_index: 2
        explain: "Unlike most sections, Camera Cut sections by default do not allow gaps or overlaps. You drag the touching edges to change cut timing."
      - q: "The viewport is locked to the Camera Cut Track and you cannot move the active camera. What is going on?"
        choices: ["The camera is a spawnable", "The sequence is playing", "The camera has no Transform track", "Viewport camera control is disabled while locked to the Camera Cut Track; enable the camera's own track to move it"]
        answer_index: 3
        explain: "Locking the view to the Camera Cut Track disables viewport camera control. To move or key the active camera, enable that Camera Track first."
      - q: "What does enabling Can Blend on the Camera Cut Track allow?"
        choices: ["Cuts that fade to black", "Overlapping sections that blend transforms and camera properties like focal length and depth of field", "Faster thumbnail rendering", "Mixing two Level Sequences"]
        answer_index: 1
        explain: "With Can Blend on, you can overlap Camera Cut sections and blend from one camera to another, including camera component properties, or blend to and from gameplay."
      - q: "For a long cinematic with many cameras, what does the documentation recommend?"
        choices: ["Put all cameras and cuts in one Camera Cut Track", "Use one camera and animate it everywhere", "Build it from shots, each with a single camera and camera cut", "Use Blueprints instead of Sequencer"]
        answer_index: 2
        explain: "The page does not recommend full-length sequences made of many cameras and cuts in one track. Use shots, each partitioning one camera and one Camera Cut."
    flavors:
      _default: {why: "Editing is choosing which camera the viewer sees and when. The Camera Cuts track is that decision inside Unreal."}
      cinematics: {why: "Cutting on action is the first real editing skill. Everything after this builds on the Camera Cuts track.", do: "Disable Draw Thumbnails on the track and note the editor speed difference on a heavy scene."}
      animation: {why: "Cuts hide and reveal animation; you decide what the audience sees of a performance."}
      level_design: {why: "A three-cut sequence is a quick way to present the key views of a level."}

  - id: CQ6
    rank: 1
    difficulty: apprentice
    specializations: [cinematics]
    subjects: [sequencer, keyframes, curve-editor, tangents]
    required_spine: false
    required: true
    title: Keys and curves
    brief: "A key says where the camera is at one moment. The curve between two keys says how the camera gets from one to the other, for example at a steady speed or with a soft start and stop. The shape of the curve at a key is controlled by its tangent, a small handle you can drag. In this quest you add keys in several ways, try the tangent types, and edit a curve in the Curve Editor."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-animation-keyframes-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-curve-editor-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Open a Level Sequence that has a camera move with at least two Transform keys. To make one, click the Cinematics dropdown in the main toolbar, choose Add Level Sequence, click the Camera button in the Sequencer toolbar, and set a key on the Transform track of the camera with Enter at frame 0 and again at a later time with the camera in a new position."
      - "Move the playhead to a new time, select the camera in the viewport and press S. Check that a full Transform key was added. Then try Shift + W, which keys only the Location."
      - "Enable Auto Key. Move the playhead, move the camera, and watch keys appear by themselves. Then open the keyframe options and set them to Key Changed."
      - "Select the last key. Press 4 for Linear, then 5 for Constant, then 1 for Cubic (Auto). Drag the playhead through the move each time and notice the difference."
      - "Open the Curve Editor from the Sequencer toolbar. Select the Location Z curve and press F to frame it. Drag a tangent handle so that the move slows down at the end (an ease-out)."
      - "Click the curve with MMB (the middle mouse button) to add a key. Then hold Ctrl and click with MMB to add a key that does not change the shape of the curve. Compare the two."
    done_when: "Send one screenshot of the Curve Editor that shows your camera curve with at least three keys and one edited tangent. Add one line that names the tangent type you used for the final key and says why."
    xp: 120
    verify_type: screenshot
    quiz:
      - q: "With an actor selected, pressing S in Sequencer does what?"
        choices: ["Saves the sequence", "Creates a Transform track if needed and keys Location, Rotation and Scale", "Solos the track", "Keys only the Scale"]
        answer_index: 1
        explain: "S creates a Transform Track if there is none and keys the full transform. It also works with focus on the viewport and adds the actor to Sequencer if needed."
      - q: "Auto Key is on but no new keys appear when you move an actor. The most likely reason is:"
        choices: ["Auto Key only works in Play In Editor", "The Curve Editor is open", "The actor is a spawnable", "The track has no keyframes yet; an empty track is not auto keyed"]
        answer_index: 3
        explain: "The track you auto key must already contain keyframes. An empty track will not be auto keyed."
      - q: "Which is the default tangent type for new keys, and what does it do?"
        choices: ["Linear: no easing between keys", "Cubic (Auto): keeps a smooth curve and eases both ends, adjusting itself when keys move", "Constant: holds the value until the next key", "Cubic (Break): separate in and out angles"]
        answer_index: 1
        explain: "Cubic (Auto) is the default. It maintains a smooth curve, eases start and end, and re-adjusts whenever keys are added or moved."
      - q: "You want a value to jump at a key with no interpolation before it. Which tangent do you pick?"
        choices: ["Cubic (User)", "Linear", "Constant", "Weighted"]
        answer_index: 2
        explain: "Constant tangents keep the current value until the next keyframe is reached, like a non-interpolating key."
      - q: "In the Curve Editor, how do you add a key on a curve without changing the shape of the curve?"
        choices: ["Hold Ctrl and click MMB on the curve segment", "Press Enter", "Double-click the curve", "Press Ctrl + D"]
        answer_index: 0
        explain: "MMB on a curve adds a key. Holding Ctrl while clicking MMB adds a key without disturbing the curve structure."
      - q: "Two keys of Location are the same in Sequencer and you set Key Group in the Auto Key options. You edit only the X location. What gets keyed?"
        choices: ["Only X location", "X, Y and Z location", "Location, Rotation and Scale", "Nothing until you press Enter"]
        answer_index: 1
        explain: "Key Group keys all axes within the changed channel. Key Changed keys only the axis that changed, and Key All keys every channel and group."
    flavors:
      _default: {why: "Keys say where; curves say how. The feel of a camera move lives in its tangents."}
      cinematics: {why: "A move that eases in and out reads as intentional. A linear move reads as a machine.", do: "Use Weighted Tangents on one key and stretch the handle to make a very long ease-out."}
      animation: {why: "The same Curve Editor edits animation curves everywhere in the engine."}
      tech_art: {why: "Curve Editor skills carry to Niagara and Curve Assets."}

  - id: CQ7
    rank: 1
    difficulty: apprentice
    specializations: [cinematics]
    subjects: [cine-camera, lens, depth-of-field, focus]
    required_spine: false
    required: true
    title: "Lens: focal length, aperture, focus"
    brief: "Three lens settings give a picture its film look. Focal length decides how wide or how zoomed in the view is. Aperture, written as an f-stop number, decides how much of the picture is sharp. Focus distance decides which object is sharp. In this quest you change all three on a Cine Camera Actor and watch what each one does to the picture."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-depth-of-field-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-cameras-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Place a Cine Camera Actor in front of a subject, with something in the foreground and something in the background. A few cubes or props at different distances are enough. Pilot the camera so that you look through it."
      - "Set Current Focal Length to 35 mm, then to 85 mm. Notice how the field of view and the blur of the background change."
      - "Set Focus Method to Manual. Click the eyedropper on Manual Focus Distance and pick the subject. Enable Draw Debug Focus Plane, which shows a colored plane at the distance that is in focus."
      - "Set Current Aperture to 1.4, then to 5.6. Take a screenshot of both."
      - "Set Focus Method to Tracking and set Actor to Track to the subject. Move the subject and check that the focus follows it. Then enable Smooth Focus Changes."
      - "Set Diaphragm Blade Count to 5, then to 12. Look at the bokeh shapes, the shapes that small bright spots in the blurred background take."
    done_when: "Send two screenshots of the same framing, one at f/1.4 and one at f/5.6, both with the subject in focus. Add one line with your focal length and focus method."
    xp: 120
    verify_type: screenshot
    quiz:
      - q: "You raise the focal length from 50 mm to 100 mm. What happens?"
        choices: ["The field of view gets narrower and out-of-focus areas become more pronounced", "The field of view gets wider", "The image gets brighter", "The focus distance doubles"]
        answer_index: 0
        explain: "As focal length increases the FOV decreases, like zooming in, and background and foreground blur become more noticeable."
      - q: "Which aperture gives a shallower depth of field with more blur?"
        choices: ["f/8.0", "f/5.6", "f/1.4", "They are all the same"]
        answer_index: 2
        explain: "Smaller F-stop numbers create a shallower depth of field with more background and foreground blur. Larger F-stops keep more in focus."
      - q: "In Unreal, changing the F-stop also changes how much light reaches the sensor. True or false?"
        choices: ["True, you must fix exposure every time", "False; the aperture does not control light intensity in Unreal, so exposure stays the same", "True, but only in Sequencer", "False, because Unreal has no exposure"]
        answer_index: 1
        explain: "Unlike a real camera, adjusting the F-stop and diaphragm in Unreal does not control light intensity. This is a deliberate choice so you do not have to re-adjust exposure."
      - q: "Which Focus Method turns depth of field off completely, ignoring even a Post Process Volume?"
        choices: ["Do Not Override", "Manual", "Tracking", "Disable"]
        answer_index: 3
        explain: "Disable turns depth of field off entirely. Do Not Override only stops the camera from influencing it, so other sources like a post process volume still apply."
      - q: "You type 5m into Manual Focus Distance. What does Unreal store?"
        choices: ["An error, the field only accepts numbers", "5 units", "500 cm, because the field is type-aware and converts units", "5 mm"]
        answer_index: 2
        explain: "Manual Focus Distance is in centimeters and is a type-aware field. Typing 5m converts to 500cm."
      - q: "You set Diaphragm Blade Count to 5 but the bokeh stays round. What is a likely cause?"
        choices: ["The Engine Scalability is below Epic, so the diaphragm simulation falls back to circular bokeh", "Blade count only works with Tracking focus", "You need at least 8 blades", "Bokeh is always round in Unreal"]
        answer_index: 0
        explain: "The diaphragm simulation is only supported at Epic and Cinematic scalability. Lower settings fall back to circle bokeh of equal area."
    flavors:
      _default: {why: "Focal length, aperture and focus distance are the three choices that make a frame look like film."}
      cinematics: {why: "Choosing a lens is choosing how the audience feels about the subject. This is the language you will speak in every shot.", do: "Key Manual Focus Distance in Sequencer to do a rack focus from foreground to subject."}
      lookdev: {why: "A long lens with a wide aperture isolates one asset and hides the background."}

  - id: CQ8
    rank: 1
    difficulty: apprentice
    specializations: [cinematics]
    subjects: [camera-rigs, rail, crane, sequencer]
    required_spine: false
    required: true
    title: Rails and cranes
    brief: "A camera rig is a helper actor that carries the camera and moves it in a smooth, physical way. The Camera Rig Rail works like a dolly on a track, and the Camera Rig Crane works like a long arm that lifts and swings the camera. Moves like these are hard to get by keying the camera by hand. In this quest you attach a camera to each rig and animate both rigs in Sequencer."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/camera-jibs-and-dollies-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open any project, or create one from the Third Person template, and choose or place a subject to film, such as a prop or a mannequin. In the Place Actors panel, under Cinematic, find Camera Rig Rail and drag it into the level. Move its two spline points so that the track passes by the subject. Right-click the spline and use Add Spline Point Here to add a curve to the track."
      - "Place a Cine Camera Actor and position it near the dolly, the small cart on the rail. In the Outliner, drag the camera onto the Camera Rig Rail to attach it."
      - "Create a Level Sequence named LS_Rigs. Add the rail and the camera to Sequencer. On the rail track, click + Track, open Properties, and add Current Position on Rail."
      - "Key Current Position on Rail with the value 0 on frame 0 and the value 1 at the end. Then enable Lock Orientation to Rail and compare how the camera turns."
      - "Place a Camera Rig Crane and attach a second Cine Camera Actor to it. Add the crane to Sequencer, and add the tracks Crane Pitch, Crane Yaw and Crane Arm Length."
      - "Key a crane move that starts low and rises. Then add both cameras to the Camera Cuts track, with the rail shot first and the crane shot second."
    done_when: "Send one screenshot of Sequencer that shows the Camera Rig Rail track with a keyed Current Position on Rail, and the Camera Rig Crane track with a keyed Pitch or Arm Length. Also send one short video clip (30 seconds or less) of the crane shot, or two frames of it (the start and the end)."
    xp: 120
    verify_type: screenshot
    quiz:
      - q: "Which real-world equipment does the Camera Rig Rail emulate, and for what kind of shot?"
        choices: ["A tripod, for static shots", "A camera dolly, for tracking shots", "A boom arm, for crane shots", "A handheld rig, for shaky shots"]
        answer_index: 1
        explain: "The Camera Rig Rail emulates a camera dolly system used to create tracking shots. The crane emulates a jib or boom arm."
      - q: "How do you attach a camera to a rig?"
        choices: ["Set the camera's Actor to Track to the rig", "Add the rig as a component of the camera", "Drag the camera actor onto the rig in the Outliner", "Use the Camera Cuts track"]
        answer_index: 2
        explain: "Move the camera near the rig, then drag the camera Actor onto the rig in the World Outliner. It can still be moved to fine-tune after that."
      - q: "What does the Current Position on Rail property do and what is its range?"
        choices: ["Moves the dolly along the track, from 0 (start) to 1 (end)", "Sets the rail length in centimeters", "Rotates the camera, from 0 to 360", "Sets the rail speed in cm per second"]
        answer_index: 0
        explain: "Current Position on Rail moves the dolly along the track. It is clamped between 0 at the start point and 1 at the end point."
      - q: "By default, does the camera turn with the rail as the dolly follows a curve?"
        choices: ["Yes, always", "No; the camera orientation is independent unless you enable Lock Orientation to Rail", "Only in Sequencer", "Only if the rail is straight"]
        answer_index: 1
        explain: "The camera's orientation is set independently from the dolly by default. Lock Orientation to Rail makes the camera rotation relative to the dolly."
      - q: "Which three properties animate the Camera Rig Crane?"
        choices: ["Speed, Height, Weight", "Roll, Pitch, Yaw", "Position, Rotation, Scale", "Crane Pitch, Crane Yaw, Crane Arm Length"]
        answer_index: 3
        explain: "The crane exposes Crane Pitch, Crane Yaw and Crane Arm Length (in centimeters, type-aware). Lock Mount Pitch/Yaw control whether the camera follows."
      - q: "How do you add the rail's animatable properties to Sequencer?"
        choices: ["They appear automatically when the rail is added", "Drag the property from the Details panel into the viewport", "Click + Track on the rig's track and choose from the Properties category", "Use Add Track > Camera Cut Track"]
        answer_index: 2
        explain: "On the rig's track in Sequencer, click + Track and pick the property from the Properties category. You also add the attached camera as its own track."
    flavors:
      _default: {why: "Rigs give you the smooth, physical camera moves that hand-keyed transforms rarely match."}
      cinematics: {why: "Dolly and crane moves are the two most common camera moves in film. Rigs make them repeatable.", do: "Attach the rail to the crane and animate both together for a combined move."}
      level_design: {why: "A rail fly-through is a clean, controlled way to record a level walkthrough."}

  - id: CQ9
    rank: 1
    difficulty: apprentice
    specializations: [cinematics]
    subjects: [storyboard, cine-camera, lighting, screenshots, capstone]
    required_spine: false
    required: true
    capstone: true
    title: Three-shot board
    brief: "A shot board is one page that shows a few still images in order, so that together they tell a small story. Making one shows that you can frame, light and focus a shot. In this quest you plan three shots of one small set, take them as high-resolution screenshots from three cameras, and put them together on one board."
    time_min: 120
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-cameras-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/taking-screenshots-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-viewport-controls-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-depth-of-field-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Pick a small set, such as one room or one outdoor spot. If you have none, build one from a few cubes and props around one clear subject. Do a simple lighting pass: one key light (the main light), one fill light or sky light, and a clear subject."
      - "Plan three shots on paper: a wide establishing shot that shows the whole place, a medium shot, and a close-up. Write one line for each shot that says what the viewer should notice."
      - "Place three Cine Camera Actors and name them CAM_Wide, CAM_Medium and CAM_Close. Give each one a different focal length and a focus setting that matches its subject."
      - "Save a viewport bookmark at each camera position so that you can return to it. Turn on the Cinematic Viewport and use the Grid (3x3) overlay to check your framing."
      - "Take a high-resolution screenshot from each camera, with a multiplier of 2 or more. Name the files Shot01_Wide, Shot02_Medium and Shot03_Close."
      - "Put together a one-page board. It shows the three stills in order, and each still has its one-line description, focal length and aperture."
    done_when: "Send one board image with the three stills in order, each with a one-line description, its focal length and its f-stop. Also send one screenshot of the level that shows the three named cameras and your lights. A mentor reviews your work."
    xp: 250
    verify_type: mentor
    quiz: []
    flavors:
      _default: {why: "Three stills that tell a small story prove you can frame, light and focus. That is the whole apprentice rank in one piece."}
      cinematics: {why: "Every sequence starts as a board. Learn to sell a shot in a still before you animate it.", do: "Add a fourth still that breaks the 180-degree line on purpose, and explain in one line why it feels wrong."}
      lookdev: {why: "A lit three-shot board is also the standard way to present an asset or a material set."}
      level_design: {why: "Establishing, medium and close views are how you pitch a space to the rest of the team."}

  - id: CQ10
    rank: 1
    difficulty: apprentice
    specializations: [cinematics]
    subjects: [camera-shake, blueprint, sequencer]
    required_spine: false
    required: false
    title: Camera shake
    brief: "A camera shake is a small, fast movement added on top of the camera, for example when something explodes nearby. In Unreal a shake is an asset built on the class CameraShakeBase, and its shake pattern decides what kind of movement it makes. In this quest you make two shakes with different patterns, play one in Sequencer, and place a shake source in the level that shakes cameras that come near it."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/camera-shakes-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open any project, or create one from the Third Person template. In the Content Browser, add a Blueprint Class and choose CameraShakeBase as its parent. Name it CS_Rumble."
      - "Set Root Shake Pattern to Perlin Noise Camera Shake Pattern. Give Rotation Pitch and Yaw an Amplitude of about 2 and a Frequency of about 20. Set Duration to 1.5 and Blend In/Out to 0.2."
      - "Open a Level Sequence that has a Cine Camera Actor. To make one, click the Cinematics dropdown in the main toolbar, choose Add Level Sequence, and click the Camera button in the Sequencer toolbar. On the camera track, click + Track, then Camera Shake, and pick CS_Rumble. Play the sequence."
      - "Make a second shake named CS_Sway that uses the Wave Oscillator pattern. Give it a low amplitude and a low frequency, and set Duration to 0. Notice how different it feels from CS_Rumble."
      - "Place a Camera Shake Source actor in the level. Set Camera Shake to CS_Sway and enable Auto Start. Set Inner and Outer Attenuation Radius, for example to 200 and 1000, which controls how the shake gets weaker with distance."
      - "Open Window > Camera Shake Previewer and enable Allow Camera Shakes in the viewport options. Press Play Selected, then move the editor camera toward the source."
    done_when: "Send one screenshot of the CS_Rumble Blueprint details with the pattern and the timing visible, and one screenshot of Sequencer with the Camera Shake section on the camera track. Add one line that says when you would use Perlin and when you would use Wave."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Which parent class do you pick to create a camera shake asset?"
        choices: ["CameraShakeBase", "CineCameraActor", "PlayerCameraManager", "ActorComponent"]
        answer_index: 0
        explain: "Create a Blueprint Class and choose CameraShakeBase. The asset then exposes Root Shake Pattern and other details."
      - q: "Which shake pattern does the documentation suggest for a nearby explosion or a rumble?"
        choices: ["Sinusoidal Wave", "Composite", "Perlin Noise", "Sequence Shake"]
        answer_index: 2
        explain: "Perlin Noise is described as useful for high-intensity shakes such as rumbles or nearby explosions. Wave is for low-intensity effects like a rocking boat."
      - q: "In a Perlin or Wave shake, what do Amplitude and Frequency control?"
        choices: ["Amplitude is the duration, Frequency is the blend time", "Amplitude is the size of the movement, Frequency is its speed", "Amplitude is the FOV, Frequency is the frame rate", "They only affect Location, not Rotation"]
        answer_index: 1
        explain: "Amplitude sets how far the shake moves from center on that axis. Frequency sets how rapid the movement is."
      - q: "You set Duration to 0. What happens?"
        choices: ["The shake does not play", "The shake plays for one frame", "The shake plays infinitely", "Unreal uses the default of one second"]
        answer_index: 2
        explain: "If Duration is 0 or less, the shake plays infinitely. That is how the looping source example works."
      - q: "How do you add a shake to a camera in Sequencer?"
        choices: ["Add Track (+) > Camera Cut Track", "Drag the shake asset onto the timeline", "Click + Track on the Cine Camera Actor track and pick the shake under Camera Shake", "Use the Event track"]
        answer_index: 2
        explain: "Click + Track on the Cine Camera Actor track (or its CameraComponent) and choose your shake asset in the Camera Shake menu."
      - q: "What does the Start Camera Shake Blueprint node need as its target?"
        choices: ["A Player Controller or a Camera Shake Source Component", "A Level Sequence Actor", "A Cine Camera Actor", "The Game Mode"]
        answer_index: 0
        explain: "The Start Camera Shake function requires a Player Controller or a Camera Shake Source Component as the target."
    flavors:
      _default: {why: "A small shake sells impact and weight. Knowing when not to use it is the real skill."}
      cinematics: {why: "Shakes add life to a static camera and punch to hits, but too much reads as noise.", do: "Set Play Scale on the Sequencer section to 0.3 and compare against 1.0 on the same frame."}
      tech_art: {why: "Camera Shake Source with attenuation is a clean way to tie shakes to gameplay events without code."}
      animation: {why: "A shake timed to an animation contact frame makes hits feel heavier."}

  - id: CQ11
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [sequencer, shots, subsequences, organization]
    required_spine: false
    required: true
    title: Shots and subsequences
    brief: "A long cinematic is not built as one big sequence. It is built from shots, where each shot is its own small Level Sequence placed on a Shots track inside a main sequence. This lets you trim and reorder shots, and lets several people work on the same cinematic. In this quest you build a main sequence with three shots, make a second take (a copy for experiments) of one shot, and tidy up the result."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/sequences-shots-and-takes-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/organize-cinematic-tracks-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/what-happens-when-my-cinematic-ends-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. In the Content Browser, click Add, then Cinematics, then Level Sequence. Name the new Level Sequence LS_Master."
      - "Open LS_Master. Click Tracks (+) and choose Shots Track. Then click (+) Shot and choose Insert Shot, and do this three times. Keep the default shot names."
      - "Double-click each shot to open it. Add a Cine Camera and a small camera move in each one. Use the breadcrumbs, the path shown at the top of Sequencer, to go back to LS_Master."
      - "Trim the three shots so that they play one after another with no gaps. Give each shot a different Color Tint: right-click the shot, open Properties, and set Color Tint."
      - "Right-click shot 2 and choose New Take. Change the camera move in the new take. Then switch between Take 1 and Take 2 from the Takes menu."
      - "Right-click shot 1 and choose Edit Meta Data. Enter your name and a one-line note."
      - "Add a Folder track and move any loose tracks into it, so that the root sequence is tidy."
    done_when: "Send a screenshot of LS_Master that shows the Shots track with 3 colored shots, the Takes menu open on shot 2 with two takes (a star marks the active one), and the meta-data tooltip on shot 1."
    xp: 115
    verify_type: screenshot
    quiz:
      - q: "You click (+) Shot > Insert Shot on a Shots track. What does Unreal create?"
        choices: ["A new Level Sequence asset, added to the master sequence as a sub-sequence shot", "A new Camera Cuts section only", "A copy of the master sequence", "A new Cine Camera Actor in the level"]
        answer_index: 0
        explain: "Insert Shot makes a new Level Sequence asset and adds it to the main sequence as a Sub-Sequence Shot. A save dialog asks where to put it."
      - q: "Two shot sections overlap on two different Shots tracks. Which one plays in the overlap?"
        choices: ["The one on the lower track", "The one on the top-most track", "Both blend together", "The one created last"]
        answer_index: 1
        explain: "Shot Sections on the top tracks are prioritized. Where they overlap with lower tracks, the top track evaluates instead."
      - q: "What is the default Hierarchical Bias of a shot (sub-sequence), compared to the root sequence?"
        choices: ["Root 100, sub-sequence 0", "Root 0, sub-sequence 0", "Root 0, sub-sequence 100", "Root 1, sub-sequence 2"]
        answer_index: 2
        explain: "The root sequence has bias 0 and each sub-sequence adds 100. So the deepest sequence wins by default when the same actor is animated in several places."
      - q: "The root sequence and a shot both animate the same light. You set both bias values to 0. What happens?"
        choices: ["The root wins", "The shot wins", "Sequencer shows an error", "Both evaluate together and the results blend"]
        answer_index: 3
        explain: "Equal bias means all sources evaluate together and blend when possible. In the doc example, red, green and blue light colors combined to white."
      - q: "What does New Take do?"
        choices: ["Creates a separate copy of the shot so you can edit it without changing the original", "Renders the shot to disk", "Deletes the old shot and starts empty", "Creates a bookmark in the timeline"]
        answer_index: 0
        explain: "Takes are copies of a shot for experiments. After creating one, the shot switches to it; you can switch back in the Takes menu. The active take has a star icon."
      - q: "You want to adjust the playable region of a shot (slip it) without changing its length. Which property does this?"
        choices: ["Time Scale", "Start Frame Offset", "Can Loop", "Hierarchical Bias"]
        answer_index: 1
        explain: "Start Frame Offset offsets the start time like slip editing, without affecting duration. You can also hold Shift and drag along the clip."
      - q: "You add Time Warp to a shot. What is the difference between a Play Rate Curve and a Time Warp Curve?"
        choices: ["Play Rate Curve is for cameras only", "Time Warp Curve cannot be muted", "Play Rate Curve is a fixed rate that cannot be keyframed; Time Warp Curve can be animated with keys", "There is no difference"]
        answer_index: 2
        explain: "The doc says a Play Rate Curve sets a fixed play rate that cannot be keyframed, while a Time Warp Curve has a variable rate you animate with keyframes."
      - q: "You are inside a shot and want to see only its own tracks, without the root sequence and neighboring shots. What do you enable?"
        choices: ["Draw Single Thumbnail", "Keep Cursor in Playback Range", "Lock the shot section", "Evaluate Sub Sequences In Isolation, in the Playback menu"]
        answer_index: 3
        explain: "By default a shot is shown in the context of the root sequence. Evaluate Sub Sequences In Isolation turns this context view off."
    flavors:
      _default: {why: "Real cinematics are built from shots. Shots let you cut, trim and reorder, and let several people work on one sequence."}
      cinematics: {why: "Shots and takes are how you edit non-linearly and try ideas without breaking the original.", do: "Also try shot blending: overlap two shots on the same track and drag the blend handles."}
      animation: {why: "Animators usually work inside a shot while the editor keeps the master.", do: "Put a character animation inside one shot and check it evaluates in the master context."}
      level_design: {why: "Level sequences in your levels will be organized like this by the cinematics team.", do: "Use Origin Overrides to move one whole shot to a different place in the level."}

  - id: CQ12
    rank: 2
    difficulty: adept
    specializations: [cinematics]
    subjects: [sequencer, blueprint, level-sequence-actor, gameplay]
    required_spine: false
    required: true
    title: Trigger a sequence from Blueprint
    brief: "A cutscene is only useful in a game when the game can start it at the right moment, let the player skip it, and leave the world in the correct state when it ends. You control this from Blueprint through the Sequence Player, the part of a Level Sequence Actor that plays the sequence. In this quest you start a cutscene when the player walks into a trigger, let the player skip it with the F key, and make a light stay on after the cutscene."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/play-cinematics-from-blueprints-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/what-happens-when-my-cinematic-ends-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/sequencer-blueprint-component-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one, so that you have a player character. Place a Box Trigger in the level. Create a Level Sequence named LS_Cutscene with one camera move and a Point Light whose Intensity goes from 0 to a bright value."
      - "Open the Level Blueprint. Add the event OnActorBeginOverlap for the trigger. Create a reference to the LS_Cutscene actor, and call Play on its Sequence Player."
      - "Add a Set Playback Position node with position 0 before Play. This rewinds the cutscene so that it can play again when you enter the trigger a second time."
      - "Add an F key event. Connect it to a Branch that checks Is Playing, and when that is true, call Go to End and Stop. Test that the F key skips the cutscene."
      - "Right-click the Intensity track of the light, open Properties, and set When Finished to Keep State. Also check that Restore State is turned off on the Level Sequence Actor."
      - "Play in Editor. Enter the trigger and watch the cutscene. Leave the trigger and enter it again, then skip the cutscene with F."
    done_when: "Send a screenshot of the Level Blueprint graph that shows the overlap event going to Set Playback Position and then Play, and the F key going to Branch and then Go to End and Stop. Also send a screenshot taken in Play In Editor after you skipped the cutscene, which shows that the light is still on."
    xp: 115
    verify_type: screenshot
    quiz:
      - q: "In the Level Blueprint, which node starts the Level Sequence when the player enters the trigger?"
        choices: ["Play (SequencePlayer), from a reference to the Level Sequence actor", "Open Level", "Set Actor Hidden In Game", "Spawn Actor from Class"]
        answer_index: 0
        explain: "You create a reference to the Level Sequence actor, drag off it, and call Play on its Sequence Player. Connect it after OnActorBeginOverlap."
      - q: "The cutscene plays the first time you enter the trigger, but not the second time. What is the fix from the docs?"
        choices: ["Enable Auto Play", "Call Set Playback Position with position 0 before Play", "Use a second trigger box", "Set Loop to true"]
        answer_index: 1
        explain: "After playing to the end the player stays at the end. Set Playback Position 0 (or the start) before Play rewinds it so it can play again."
      - q: "The player presses F to skip. You want the light that the cutscene turns on to still be on afterward. Which node?"
        choices: ["Stop", "Pause", "Go to End and Stop", "Set Play Rate 0"]
        answer_index: 2
        explain: "Go to End and Stop jumps to the end so every change Sequencer would have made is applied. Plain Stop would stop where it is and the light might not be fully on."
      - q: "A track's When Finished property is set to Restore State. What happens when the section ends?"
        choices: ["The value freezes at its last keyframe", "The track is deleted", "The sequence loops", "The property returns to its value before Sequencer animated it"]
        answer_index: 3
        explain: "Restore State returns the actor to its pre-animated state. Keep State keeps the change. Restore State is the default shown in the docs."
      - q: "You set a track to Keep State but the change is still lost when the sequence stops. What is the most likely cause?"
        choices: ["The Level Sequence Actor has Restore State enabled, which overrides the track setting", "Keep State only works in Standalone game", "You need a Camera Cuts track", "Keep State needs a Shots track"]
        answer_index: 0
