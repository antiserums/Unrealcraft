    done_when: "Screenshot of the UC folder tree with prefixed assets."
    xp: 50
    verify_type: screenshot
    quiz:
      - q: "Prefix for a Static Mesh?"
        choices: ["M_", "SM_", "S_", "ST_"]
        answer_index: 1
        explain: "SM_ = Static Mesh. SK_ is Skeletal Mesh."
      - q: "Prefix for a Material Instance?"
        choices: ["M_", "MI_", "MAT_", "I_"]
        answer_index: 1
        explain: "M_ is the parent material. MI_ is an instance of it."
      - q: "Which prefix goes on a level (map)?"
        choices: ["L_", "MAP_", "LV_", "W_"]
        answer_index: 0
        explain: "L_ is the convention used here."
      - q: "Why move assets inside the editor and never in File Explorer?"
        choices: ["File Explorer is slower", "The editor updates references; File Explorer breaks them", "Only Epic can move files", "No reason"]
        answer_index: 1
        explain: "Assets reference each other. The Content Browser fixes those references when you move something."
      - q: "What's the shortcut for the Content Drawer?"
        choices: ["Ctrl+Space", "Ctrl+D", "Tab", "F11"]
        answer_index: 0
        explain: "Ctrl+Space opens and closes the drawer."
