    checklist:
      - "Open the Content Drawer (Ctrl+Space)."
      - "Create /Content/UC/ with subfolders Maps, Meshes, Materials, Textures, Blueprints."
      - "Rename or duplicate one asset of each kind with the correct prefix: SM_, M_, MI_, T_, BP_, L_."
