    quiz:
      - q: "What do inputs on an Event Dispatcher give you?"
        choices: ["Variables sent to every event bound to the dispatcher", "A return value from each bound event", "A way to filter which listeners fire", "A delay before the call"]
        answer_index: 0
        explain: "Dispatcher inputs let you send data to each bound event, inside the class and also to the Level Blueprint."
      - q: "You want the dispatcher to have exactly the same inputs as an existing custom event. What is the fastest way?"
        choices: ["Retype every input by hand", "Duplicate the custom event", "Use the Copy Signature from dropdown in the dispatcher Details", "Bind the event first, the pins copy themselves"]
        answer_index: 2
        explain: "The Details panel of a dispatcher has Copy Signature from, which copies the inputs of another event."
      - q: "A Bind node inside a Blueprint Class has its Target set to Self. What does that mean?"
        choices: ["Only the first placed instance is affected", "The event list of the class changes, so every instance of the class changes", "The binding lives only in the Level Blueprint", "The Target must be replaced before compiling"]
        answer_index: 1
