  - id: PQ88
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [cpp, asset-manager, async-loading, data]
    required_spine: false
    required: false
    title: Register and load with the Asset Manager
    brief: "The Asset Manager is the engine system that knows about your Primary Assets and loads them when you ask, by id. You tell it which asset types exist and in which folders to look. An Asset Bundle is a named group of extra assets, such as meshes, that belong to a Primary Asset and can be loaded together with it. Loading only what you need, when you need it, keeps the start of the game fast. In this quest you register weapon Data Assets, list them, and load one in the background."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/asset-management-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/asynchronous-asset-loading-in-unreal-engine"
    community_urls: []
    checklist:
      - "Open a C++ project, or create one from the Third Person template with C++ selected. You need a Primary Data Asset class named UWeaponDefinition. If you have none, make it now with Tools, then New C++ Class, with PrimaryDataAsset as the parent, and give it the UPROPERTY(EditAnywhere) members FText DisplayName, int32 Damage and TSoftObjectPtr<UStaticMesh> Mesh. Create two or three Data Assets from it (right-click in the Content Browser, Miscellaneous, Data Asset) and put them all in one folder: Content/Data/Weapons."
      - "Open Project Settings and go to Game, then Asset Manager. Under Primary Asset Types to Scan, add a type named WeaponDefinition with the base class WeaponDefinition and the directory /Game/Data/Weapons."
      - "In the header, add meta=(AssetBundles=\"Visual\") to the UPROPERTY of the Mesh member, so that the mesh goes into a bundle named Visual."
      - "In a GameMode or a Blueprint Function Library, ask the Asset Manager for all Primary Asset Ids of the type WeaponDefinition and print them. In Blueprint the node is Get Primary Asset Id List."
      - "Load one weapon asynchronously (in the background) by its Primary Asset Id. In Blueprint use Async Load Primary Asset, and in C++ use LoadPrimaryAsset. Print its DisplayName in the completion callback, the code that runs when the load is finished."
      - "Load it again with the bundle list [Visual] and confirm that the mesh is now loaded. To check, print Is Valid on the object that the soft pointer resolves to."
    done_when: "Send a screenshot of the Asset Manager settings page, and a screenshot of the Output Log with the list of ids and the loaded DisplayName."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Where does the Asset Manager learn which folders to scan for a Primary Asset Type?"
        choices: ["From the asset names", "From Primary Asset Types to Scan in Project Settings, or from ScanPathsForPrimaryAssets in a custom Asset Manager", "From the Content Browser filters", "From the level Blueprint"]
        answer_index: 1
        explain: "You register types either in Project Settings under Game / Asset Manager, or in code by overriding StartInitialLoading and calling ScanPathsForPrimaryAssets."
      - q: "What is an Asset Bundle?"
        choices: ["A zip file of assets", "A Primary Asset Type", "A packaging chunk", "A named list of Secondary Assets linked to a Primary Asset"]
        answer_index: 3
        explain: "An Asset Bundle is a named list of specific assets associated with a Primary Asset. You create one with the AssetBundles meta tag on a soft pointer UPROPERTY."
      - q: "You pass a bundle name to LoadPrimaryAsset. What extra happens?"
        choices: ["The asset is loaded synchronously", "The Secondary Assets referenced by that bundle are loaded too", "The asset is cooked", "Nothing; bundle names are only for the editor"]
        answer_index: 1
        explain: "Loading with a list of bundles makes the Asset Manager also load the Secondary Assets those bundles reference."
      - q: "Why does the page recommend putting all Primary Assets of one type in a single subfolder?"
        choices: ["Discovery and registration are faster", "Cooking requires it", "Blueprints cannot find them otherwise", "Soft pointers only work inside one folder"]
        answer_index: 0
        explain: "When scanning paths for Primary Assets, keeping one type in one subfolder makes discovery and registration faster."
      - q: "Which object actually performs the asynchronous loading and holds Streamable Handles?"
        choices: ["The Streamable Manager inside the Asset Manager", "The Content Browser", "The Asset Registry", "The Game Instance"]
        answer_index: 0
        explain: "The Asset Manager is the singleton for discovery and loading. A Streamable Manager inside it does the real async loading and keeps objects alive via Streamable Handles."
      - q: "You want to use a custom Asset Manager class. Where do you tell the engine?"
        choices: ["In DefaultGame.ini under [Core.Log]", "In the .uproject file", "In DefaultEngine.ini, AssetManagerClassName under [/Script/Engine.Engine]", "In the level Blueprint"]
        answer_index: 2
        explain: "Set AssetManagerClassName under the [/Script/Engine.Engine] section of DefaultEngine.ini. Skip this if you do not need special functionality."
      - q: "Only Cook Production Assets is checked. What happens with an asset marked DevelopmentCook?"
        choices: ["It is silently skipped", "It is cooked into a separate chunk", "The cook process reports an error", "It is converted to a Primary Asset"]
        answer_index: 2
        explain: "With that setting on, DevelopmentCook assets cause errors during the cook. This helps keep test assets out of shipping builds."
      - q: "FStreamableManager::RequestAsyncLoad finished and called your delegate. What happens to the loaded assets after the delegate returns?"
        choices: ["They stay in memory forever", "They are unloaded immediately", "They are moved to the Asset Registry", "The Streamable Manager releases its hard references, so you must hold them somewhere else to keep them"]
        answer_index: 3
        explain: "The Streamable Manager keeps hard references only until the delegate is called. After that it releases them, so keep your own reference if the assets must stay loaded."
    flavors:
      _default: {why: "Loading only what you need, when you need it, is the difference between a game that starts fast and one that stalls."}
      programming: {why: "The Asset Manager is the official way to find and stream Primary Assets. Most large projects build on it.", do: "Add a second bundle named UI with an icon texture and load only that bundle for a menu."}
      gameplay_design: {why: "Understanding scan folders tells you where new data must live so the game can find it.", do: "Add a new weapon asset in the wrong folder and show it does not appear in the id list."}

  - id: PQ89
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [cpp, data-tables, csv, data]
    required_spine: false
    required: false
    title: Data Tables from C++
    brief: "A Data Table is an asset that works like a spreadsheet: each row has a name and the same set of columns. The columns come from a struct that you define, and the rows can be imported from a CSV file, a plain text file that spreadsheet programs can save. Designers can then tune numbers in a spreadsheet while the code stays the same. In this quest you define the row struct in C++, import a CSV file as a Data Table, and read one row from C++."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/data-driven-gameplay-elements-in-unreal-engine"
    backup_url: null
    community_urls: []
    checklist:
      - "Open a C++ project, or create one from the Third Person template with C++ selected. You need an IDE such as Visual Studio to compile. In C++, declare USTRUCT(BlueprintType) FLevelUpRow : public FTableRowBase with the members int32 XPtoLvl, int32 AdditionalHP and TSoftObjectPtr<UTexture> Icon. Build the project."
      - "Write a file named LevelUp.csv. Its first column must be named Name, and after that it has one column for each member of the struct. Add 5 rows."
      - "Import the CSV file in the Content Browser. Choose DataTable and the row type LevelUpRow. Name the asset DT_LevelUp."
      - "Add a UPROPERTY(EditAnywhere) FDataTableRowHandle LevelRow to an actor. In BeginPlay, call LevelRow.FindRow<FLevelUpRow>() and write the XPtoLvl value to the log with UE_LOG."
      - "Edit one number in the CSV file. Right-click DT_LevelUp and choose Reimport. Play again and confirm that the log shows the new number."
      - "Also import the same CSV file once as a CurveTable to see the difference, and then delete that asset."
    done_when: "Send a screenshot of DT_LevelUp open in the editor, and a screenshot of the Output Log line with the value that was read from C++."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What must a C++ struct inherit from so the importer can use it as a Data Table row?"
        choices: ["FTableRowBase", "UDataAsset", "FDataTableRowHandle", "UObject"]
        answer_index: 0
        explain: "The row struct must inherit from FTableRowBase to be recognized by the importer. Its members map 1:1 to the CSV columns."
      - q: "What must the first column of the CSV be called?"
        choices: ["Id", "Key", "Name", "Row"]
        answer_index: 2
        explain: "The first column is expected to be named Name. It holds the names used to access each row in game."
      - q: "Why does the sample CSV put double quotes around Texture2D'/Game/Textures/Icon1'?"
        choices: ["CSV needs quotes on every text cell", "Without quotes the importer reads the text as the type Texture2d and the reference fails", "Quotes mark the cell as a comment", "Quotes make the asset load faster"]
        answer_index: 1
        explain: "The page says the quotes around the asset type are important for the import pipeline. Without them the text is imported as Texture2d."
      - q: "You cache the FLevelUpRow pointer from FindRow in a member variable. Why is that a bad idea?"
        choices: ["FindRow returns a copy, so it uses memory", "After a reimport the table data changes and the old pointer can become invalid", "Members cannot hold struct pointers", "Rows are garbage collected every frame"]
        answer_index: 1
        explain: "Returned structs and curves should not be cached beyond the local scope of a function. A reimport refreshes the table and old pointers may be invalid."
      - q: "The Icon column type is changed from TSoftObjectPtr<UTexture> to UTexture*. What is the effect?"
        choices: ["Nothing changes", "The CSV import fails", "All icons load whenever the Data Table loads", "Icons can no longer be edited"]
        answer_index: 2
        explain: "With a hard UTexture field, every referenced texture loads when the Data Table loads. TSoftObjectPtr keeps them lazy."
      - q: "Which import option lets the importer skip CSV columns that your struct does not have, without warnings?"
        choices: ["Import Key Field", "Ignore Missing Fields", "Ignore Extra Fields", "Reimport"]
        answer_index: 2
        explain: "Ignore Extra Fields ignores extra fields in the import data. Ignore Missing Fields is the opposite case: expected fields that are absent."
      - q: "What does a Curve Table hold that a Data Table does not?"
        choices: ["Any UObject property per cell", "Only floating point values, one curve per row, with X values as column headers", "Asset references", "Strings"]
        answer_index: 1
        explain: "Data Curves support only floating point types. Each column header after Name is an X value, and each row is a curve you can interpolate."
      - q: "Which handle type do you expose so a designer can pick a table and a row in the Details panel?"
        choices: ["FDataTableRowHandle", "FSoftObjectPath", "FPrimaryAssetId", "FName"]
        answer_index: 0
        explain: "FDataTableRowHandle exposes two subfields: the DataTable reference and the RowName. FCurveTableRowHandle is the same idea for Curve Tables."
    flavors:
      _default: {why: "Tables let designers tune numbers in a spreadsheet while code stays the same."}
      programming: {why: "You own the row struct. The columns, types and asset references are your contract with the designers.", do: "Add a second table with a FCurveTableRowHandle and read one curve with GetCurve()."}
      gameplay_design: {why: "You will edit these CSVs. Knowing the Name column and the quoting rule saves broken imports.", do: "Break the CSV on purpose (remove a column) and read the import warning."}

  - id: PQ90
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [cpp, config, ini, settings]
    required_spine: false
    required: false
    title: Config variables in C++ classes
    brief: "Config files are the .ini text files where Unreal keeps its settings. A C++ class can mark some of its variables as Config, and the engine then fills them from an .ini file when the class loads. This lets you change behavior per project, per platform or per machine without building the code again. In this quest you read values from an .ini file in three ways and override one of them from the command line."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/configuration-files-in-unreal-engine"
    backup_url: null
    community_urls: []
    checklist:
      - "Open a C++ project, or create one from the Third Person template with C++ selected. You need an IDE such as Visual Studio to compile. Make a C++ class UGameTuning : public UObject and mark it with UCLASS(config=Game). Add UPROPERTY(Config) int32 StartingLives and UPROPERTY(Config) float RespawnDelay."
      - "In the file Config/DefaultGame.ini of the project, add a section named [/Script/YourModule.GameTuning] and set both values in it. Replace YourModule with the name of your module."
      - "In BeginPlay of any actor, read the value with GetDefault<UGameTuning>()->StartingLives and write it to the log with UE_LOG. Run the game and confirm that the value from the .ini file appears."
      - "Add a section [MyTuning] with the line Difficulty=2 to DefaultGame.ini. Read it with GConfig->GetInt(TEXT(\"MyTuning\"), TEXT(\"Difficulty\"), Value, GGameIni) and log the value."
      - "In the console, run: GetIni Game:/Script/YourModule.GameTuning StartingLives. Compare the result with your log."
      - "Start the editor once with -ini:Game:[/Script/YourModule.GameTuning]:StartingLives=9 on the command line. Show that the log now says 9."
    done_when: "Send a screenshot of the Output Log with the values from the .ini file, from GConfig and from the command-line override. Also send your section of DefaultGame.ini."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Your class is AMyConfigActor in module MyGameModule with UCLASS(config=Game). Which ini section sets its Config properties?"
        choices: ["[MyGameModule.AMyConfigActor]", "[/Script/MyGameModule.MyConfigActor]", "[Game.MyConfigActor]", "[/Script/Engine.MyConfigActor]"]
        answer_index: 1
        explain: "The section is [/Script/ModuleName.ClassName] and ClassName drops the U or A prefix."
      - q: "UCLASS(config=Game) means the values are read from which file hierarchy?"
        choices: ["The Game category: BaseGame.ini, DefaultGame.ini and the rest of that chain", "Only DefaultEngine.ini", "Only the .uproject file", "GameUserSettings.ini only"]
        answer_index: 0
        explain: "The config= specifier picks the category. Game means the Game category files, such as DefaultGame.ini in the project."
      - q: "Both Engine/Config/BaseEngine.ini and MyProject/Config/DefaultEngine.ini set GameDefaultMap. Which value wins?"
        choices: ["BaseEngine.ini, because it loads last", "Neither; it is an error", "The project's DefaultEngine.ini, because later files in the hierarchy override earlier ones", "The one with the shorter path"]
        answer_index: 2
        explain: "Files later in the hierarchy override earlier ones. The project Default file comes after the engine Base file, so the project value wins."
      - q: "You have [MyTuning] Difficulty=2 in DefaultGame.ini but no matching UPROPERTY(Config). Can code read it?"
        choices: ["No, sections without a class are dropped", "Yes, with GConfig->GetInt and the GGameIni category", "Only from Blueprint", "Only after a rebuild"]
        answer_index: 1
        explain: "The config system loads every declaration whether a variable exists or not. Custom sections are read manually with GConfig functions like GetInt."
      - q: "Which config array line appends a value only if it is not already in the array?"
        choices: ["+MyArray=Value", ".MyArray=Value", "!MyArray=Value", "-MyArray=Value"]
        answer_index: 0
        explain: "+ appends if the value does not exist yet. . appends even if it is a duplicate, ! empties the array and - removes an exact match."
      - q: "What does the -ini: command-line override NOT support?"
        choices: ["Strings", "Integers", "Arrays", "Structs in the Engine category"]
        answer_index: 2
        explain: "The page states that command-line overrides do not work with arrays."
      - q: "You changed a Config property on GetMutableDefault<UGameTuning>() at runtime. How do you write it back to a file?"
        choices: ["Call SaveConfig on the object", "Call GConfig->Flush", "It is saved automatically on exit", "Edit the .uasset"]
        answer_index: 0
        explain: "The page shows Settings->SaveConfig(CPF_Config, *PathToConfigFile) to save the new value to a config file."
      - q: "GetIni Windows@Engine:URL Protocol returns nothing. What is a likely reason?"
        choices: ["GetIni only works in packaged games", "The setting lives in a config file that is not loaded, because GetIni searches only loaded files", "The Platform@ part is not allowed", "Engine is not a valid category"]
        answer_index: 1
        explain: "GetIni only searches loaded configuration files. If the setting is in a file that is not loaded, the query can fail."
    flavors:
      _default: {why: "Config files let you change behavior per project, per platform and per machine without a rebuild."}
      programming: {why: "UPROPERTY(Config) is the cheapest settings system you will ever write. Know the section naming and the override chain.", do: "Add a Windows/WindowsGame.ini in your project and override one value only for Windows."}
      tech_art: {why: "Many rendering and scalability values you tune live in this same hierarchy.", do: "Use GetIni to find where r.Shadow.MaxResolution is set in your project."}

  - id: PQ91
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [editor-utility, data-validation, blueprint, tools]
    required_spine: false
    required: false
    title: A Data Validation rule for your assets
    brief: "Data Validation is an editor system that checks assets against rules, for example a naming rule, and reports the ones that break a rule. A validator is one such rule. It runs when an asset is saved or when you ask for a check, so broken data is caught before it reaches a build or another person. In this quest you write a validator in an Editor Utility Blueprint that checks the names of Static Meshes."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/data-validation-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/scripting-the-unreal-editor-using-blueprints"
    community_urls: []
    checklist:
      - "Open any project, or create one from the Third Person template. Open Edit > Plugins. Search for Data Validation and confirm that the plugin is enabled."
      - "Right-click in the Content Browser and choose Editor Utilities, then Editor Utility Blueprint. Pick EditorValidatorBase as the parent class and name the asset EUB_Validate_StaticMeshNames."
      - "Override the function Can Validate Asset. Make it return true only when the asset is a Static Mesh."
      - "Override the function Validate Loaded Asset. If the name of the asset does not start with SM_, call Asset Fails with a clear message. In every other case, call Asset Passes."
      - "Make a Static Mesh named BadName, for example by duplicating any mesh and renaming the copy. Right-click it and choose Asset Actions, then Validate Assets. Read the Message Log."
      - "Run Tools > Validate Data... on the whole project and count the failures. Rename the bad asset and validate again."
    done_when: "Send a screenshot of the Message Log that shows your failure message, and one screenshot after the fix that shows the asset passes."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which two functions must a UEditorValidatorBase validator implement?"
        choices: ["BeginPlay and Tick", "IsDataValid and PostLoad", "Construct and Destruct", "CanValidateAsset and ValidateLoadedAsset"]
        answer_index: 3
        explain: "A UEditorValidatorBase-derived validator uses CanValidateAsset and ValidateLoadedAsset, both taking the UObject to validate."
      - q: "What must ValidateLoadedAsset do on every execution path?"
        choices: ["Return a bool", "Print a string", "Call AssetPasses or AssetFails", "Save the asset"]
        answer_index: 2
        explain: "The page states ValidateLoadedAsset must call AssetPasses or AssetFails for each of its execution paths."
      - q: "You want validation logic that can read private members of your own C++ class. Which approach fits best?"
        choices: ["Override IsDataValid in that UObject-derived class", "A UEditorValidatorBase Blueprint", "A Python validator", "A Scripted Action"]
        answer_index: 0
        explain: "Overriding IsDataValid on your own class gives access to private and protected data that a UEditorValidatorBase validator would not have."
      - q: "Your Blueprint validator works in the editor, but the CI command line -run=DataValidation ignores it. Why?"
        choices: ["Blueprints cannot be validators", "By default the Data Validation system runs only C++ rules from the command line; it must be extended for Blueprint and Python", "The commandlet needs -game", "Validators must be in a plugin"]
        answer_index: 1
        explain: "The page notes the system only runs C++ validation rules by default, and developers can extend it to support Blueprint and Python rules."
      - q: "How is a Python validator different from C++ and Blueprint validators at startup?"
        choices: ["It runs first", "It cannot fail an asset", "It only runs on save", "It must register itself with UEditorValidatorSubsystem using AddValidator; the others are discovered automatically"]
        answer_index: 3
        explain: "C++ and Blueprint validators are discovered automatically on editor startup. Python validators need to call AddValidator on the subsystem."
      - q: "Where do you go to validate every asset in the project from the editor UI?"
        choices: ["Tools > Validate Data...", "File > Validate Project", "Edit > Plugins", "Window > Output Log"]
        answer_index: 0
        explain: "Tools > Validate Data... validates all assets in the project's content directory. Right-click options cover single assets, dependencies or folders."
      - q: "Which validation run happens without anyone choosing a menu item?"
        choices: ["On editor startup", "On asset save, which is enabled by default", "On Play In Editor", "On level load"]
        answer_index: 1
        explain: "Validation runs in CIS, through the menus, and on asset save. The on-save run is enabled by default."
      - q: "How can you turn a validator off without deleting it?"
        choices: ["Rename it", "Move it to a Developers folder", "Override IsEnabled or change the bIsEnabled variable shown in the Details panel", "Set its parent class to Object"]
        answer_index: 2
        explain: "IsEnabled returns the protected bIsEnabled by default, which is exposed to the Details panel, and you can override it."
    flavors:
      _default: {why: "A validator catches broken data at save time, before it reaches a build or another person."}
      programming: {why: "This is a tool other people never have to run by hand. It runs on save and in CI.", do: "Add a second rule that fails any Static Mesh with more than 8 material slots."}
      tech_art: {why: "Naming and budget rules are your rules. Put them in a validator instead of a wiki page.", do: "Validate a whole folder of textures for a power-of-two size rule."}

  - id: PQ92
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [python, editor-scripting, tools, automation]
    required_spine: false
    required: false
    title: "Python tools: transactions, progress, startup"
    brief: "The Unreal Editor can run Python scripts, which is very useful for work on many assets at once, such as renaming hundreds of meshes. A safe tool does three things: it wraps its changes in a transaction so that one Undo reverts everything, it shows a progress window that can be canceled, and it writes what it did to the log. In this quest you write a rename script with all three, and a startup script that runs each time the editor opens."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/scripting-the-unreal-editor-using-python"
    backup_url: null
    community_urls: []
    checklist:
      - "Open any project, or create one from the Third Person template. Enable the plugins Python Editor Script Plugin and Editor Scripting Utilities, and restart the editor. Create the folder Content/Python in the project. Also make a test folder named Content/RenameTest and copy five Static Meshes into it, with names that do not start with SM_."
      - "Write a script named rename_meshes.py. It gets all Static Mesh assets in the RenameTest folder with unreal.EditorAssetLibrary, and adds the prefix SM_ to every name that does not have it yet. Rename with the Unreal API and never with os.rename."
      - "Wrap the loop in unreal.ScopedEditorTransaction(\"Prefix meshes\") and in unreal.ScopedSlowTask, so that the editor shows a progress dialog with a Cancel button."
      - "Log each rename with unreal.log and each skipped asset with unreal.log_warning. Run the script from the Tools > Execute Python Script menu. The documentation page lists this command under the File menu, where it was in older versions."
      - "Open Edit > Undo History and check that it shows one entry named Prefix meshes. Undo it and confirm that the old names come back."
      - "Create the file Content/Python/init_unreal.py and make it print a message with unreal.log. Restart the editor and find the message in the Output Log."
    done_when: "Send a screenshot of the Output Log with your log lines and the startup message, and a screenshot of the Undo History entry."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "You need to move an asset to another folder from Python. Which is correct?"
        choices: ["shutil.move on the .uasset file", "os.rename on the .uasset file", "The Unreal Python API such as unreal.EditorAssetLibrary or unreal.AssetTools", "Any of these, they are equivalent"]
        answer_index: 2
        explain: "Never use Python file modules on asset files. Assets contain internal references that break. Use the Unreal API instead."
      - q: "Why does Epic recommend set_editor_property(\"play_on_open\", True) instead of obj.play_on_open = True?"
        choices: ["Direct assignment is slower", "set_editor_property runs the pre- and post-edit code, the same as changing the value in the Details panel", "Direct assignment is read-only", "set_editor_property works offline"]
        answer_index: 1
        explain: "Setting directly skips the editor's pre- and post-edit changes. set_editor_property triggers them like the UI does."
      - q: "What does unreal.ScopedEditorTransaction give you?"
        choices: ["One Undo / Redo entry for all operations inside the scope", "Faster script execution", "A progress bar", "A lock on the asset"]
        answer_index: 0
        explain: "All operations inside the scoped transaction become a single entry in the Undo History, so one Undo reverts all of them."
      - q: "Why wrap a long loop in unreal.ScopedSlowTask?"
        choices: ["It runs the loop on another thread", "It makes the loop faster", "It is required for transactions", "The editor UI is blocked while Python runs, so the dialog shows progress and lets the user cancel"]
        answer_index: 3
        explain: "While a Python script runs the editor UI is blocked. ScopedSlowTask shows progress and should_cancel lets the user stop."
      - q: "Which file runs automatically when the editor finds it in a configured Python path?"
        choices: ["main.py", "startup.py", "init_unreal.py", "unreal_init.py"]
        answer_index: 2
        explain: "A script named init_unreal.py in any configured path, such as Content/Python, is run automatically when the editor starts."
      - q: "You want to run a script headless from the command line, without opening the editor UI, as fast as possible. Which option?"
        choices: ["-ExecutePythonScript=", "-run=pythonscript -script=", "-ExecCmds=\"py script.py\"", "Startup scripts in Project Settings"]
        answer_index: 1
        explain: "The pythonscript commandlet is very fast and can run headless. Note it does not load a level, so your script must load one itself if needed."
      - q: "Why does Epic warn against running py in the ExecCmd command-line parameter?"
        choices: ["The script can run before the editor is ready, for example before the startup level is loaded", "It is not supported on Windows", "It prints nothing to the log", "It cannot take arguments"]
        answer_index: 0
        explain: "ExecCmd can run your script too early. Use -ExecutePythonScript or Startup scripts, which run after the level is loaded."
      - q: "Where can you call the Execute Python Script Blueprint node?"
        choices: ["In any Actor Blueprint", "In the Level Blueprint at runtime", "In Animation Blueprints", "Only in editor-only Blueprint classes such as Editor Utility Widgets and Editor Utility Blueprints"]
        answer_index: 3
        explain: "Python is editor-only. The Python execution nodes are only available in editor-only Blueprint classes, not in runtime classes."
    flavors:
      _default: {why: "Batch work on assets is where Python saves whole days. Doing it safely means undo, progress and proper logging."}
      programming: {why: "A script that others run must be undoable, cancelable and loud about what it did. This quest builds that habit.", do: "Add a dry-run argument that logs what would change without changing it."}
      tech_art: {why: "Renames, reimports and property fixes across hundreds of assets are your daily work.", do: "Extend the script to set a Static Mesh editor property with set_editor_property."}

  - id: PQ93
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [cpp, testing, automation, spec]
    required_spine: false
    required: false
    title: A C++ Automation Spec for your code
    brief: "An Automation Spec is a way to write C++ tests so that they read like sentences: you Describe a thing and then say what It should do. Each It block shows up as its own test in the Automation tab, so a failure points at the exact case that broke. In this quest you write a spec for one small C++ function, run it, make it fail on purpose and fix it."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/automation-spec-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/write-cplusplus-tests-in-unreal-engine"
    community_urls: []
    checklist:
      - "Open a C++ project, or create one from the Third Person template with C++ selected. You need an IDE such as Visual Studio to compile. Pick a small pure C++ function of your own (for example a damage formula in a static library). If you have none, write FDamageCalc::Apply(int32 Base, float Multiplier)."
      - "Create the file Source/YourModule/Private/Tests/DamageCalc.spec.cpp. Use BEGIN_DEFINE_SPEC and END_DEFINE_SPEC, with a member variable for the object under test and the flags ProductFilter | ApplicationContextMask."
      - "In Define(), add Describe(\"Apply()\") with at least three It() blocks whose names start with the word should. Use TestEqual and TestTrue to check the results."
      - "Add a BeforeEach() block that resets the member before each test. Also add a loop over an array of inputs that creates 3 It() blocks, one for each input."
      - "Build the project. Open Tools > Session Frontend, go to Automation, and run your group of tests. Make one expectation fail on purpose, and then fix it."
      - "Disable one block by changing it to xIt(), and confirm that it disappears from the run."
    done_when: "Send a screenshot of the Automation tab with your Describe and It tree all green, and one screenshot of the failing run before the fix."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "In a Spec you implement Define() instead of which function used by Simple and Complex tests?"
        choices: ["RunTest()", "GetTests()", "Update()", "BeginPlay()"]
        answer_index: 0
        explain: "Other test types implement RunTest. A Spec implements Define(), where Describe and It build the expectations."
      - q: "What does each It() call become?"
        choices: ["A comment in the report", "One individual test that can run and fail in isolation", "A latent command", "A Describe scope"]
        answer_index: 1
        explain: "Every It() becomes its own test in the Automation UI, so one failure does not hide the others."
      - q: "When does the code inside a Describe() lambda run?"
        choices: ["Every frame", "Once per test run for each It()", "Only once, when the Spec first defines its expectations", "Never"]
        answer_index: 2
        explain: "Describe is not a test. It runs once when expectations are defined and only collects the It, BeforeEach and AfterEach blocks."
      - q: "Two BeforeEach() calls are in the same Describe. In what order do they run before each It()?"
        choices: ["Random", "The last one defined runs first", "In the order they were defined", "Only the first one runs"]
        answer_index: 2
        explain: "Multiple BeforeEach (and AfterEach) calls run in the order they are defined."
      - q: "A BeforeEach() is defined in an outer Describe. Which It() calls does it affect?"
        choices: ["Only It() calls in that same Describe, not nested ones", "It() calls inside that Describe scope, including nested Describes", "Every It() in the whole Spec", "None; BeforeEach is global"]
        answer_index: 1
        explain: "BeforeEach and AfterEach are scoped to the Describe they are called in and apply to It() calls within that scope, including nested ones."
      - q: "Your expectation waits for a query that finishes several frames later. Which Spec feature do you use?"
        choices: ["LatentIt() with a Done delegate", "Sleep in the lambda", "xIt()", "Redefine()"]
        answer_index: 0
        explain: "LatentIt, LatentBeforeEach and LatentAfterEach pass a Done delegate. The next block does not run until Done is executed."
      - q: "Why does Epic suggest .spec.cpp files should not have the word Test in the name?"
        choices: ["The compiler rejects it", "It is a naming guideline to tell Specs apart from other test types, not a technical restriction", "Files with Test are excluded from builds", "The Automation UI hides them"]
        answer_index: 1
        explain: "The page calls it a suggested guideline and not a technical restriction."
      - q: "Where do Simple and Complex Automation Tests conventionally live in a module?"
        choices: ["Public/Tests", "Private/Tests", "Content/Tests", "Config/Tests"]
        answer_index: 1
        explain: "The convention is the Private\\Tests directory of the relevant module, with [ClassFilename]Test.cpp naming."
    flavors:
      _default: {why: "Tests that read like sentences are tests people keep. Specs make the failing part obvious."}
      programming: {why: "A Functional Test runs inside a level. A Spec tests pure logic with no level and runs in seconds.", do: "Add an AsyncExecution::ThreadPool It() and check it still passes."}
      tech_art: {why: "Tool code with math in it deserves tests too.", do: "Write a Spec for one helper function in your editor tool module."}

  - id: PQ94
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [cpp, logging, verbosity, debugging]
    required_spine: false
    required: false
    title: Log verbosity you can switch at runtime
    brief: "A log category is a name that groups your log lines, such as LogInventory. Verbosity is the level of detail of a line, from Error and Warning down to Verbose and VeryVerbose. You can set, for each category, which levels are shown, and you can change this while the game runs. This keeps logs quiet by default and detailed when you ask for it. In this quest you make your own category and change its verbosity in three different ways."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/logging-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/configuration-files-in-unreal-engine"
    community_urls: []
    checklist:
      - "Open a C++ project, or create one from the Third Person template with C++ selected. You need an IDE such as Visual Studio to compile. Declare a category named LogInventory with DECLARE_LOG_CATEGORY_EXTERN(LogInventory, Log, All) in a header, and with DEFINE_LOG_CATEGORY(LogInventory) in a .cpp file."
      - "In one function that runs during play, for example the BeginPlay of an actor that you place in the level, write four UE_LOG lines at the levels Display, Log, Verbose and VeryVerbose. Play and note which of the four lines appear in the Output Log."
      - "In the console, type: log LogInventory verbose. Play again and compare. Then try veryverbose."
      - "In DefaultEngine.ini, add the section [Core.Log] with the line LogInventory=Warning. Restart and show that the Display and Log lines are gone."
      - "Include Logging/StructuredLog.h and rewrite one line with UE_LOGFMT. Use the named fields {ItemName} and {Count}."
      - "Start the editor once with -LogCmds=\"LogInventory VeryVerbose\" on the command line, and confirm that every line appears."
    done_when: "Send three screenshots of the Output Log: one with the defaults, one after the console command, and one after the override in the .ini file. Your UE_LOGFMT line must also be visible."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "A UE_LOG at Log verbosity is written where?"
        choices: ["Console and log file", "Log file only, not the console", "Screen only", "Nowhere unless Verbose is enabled"]
        answer_index: 1
        explain: "Log prints to the log file but not to the console. Display and above print to both."
      - q: "Your category is declared with default verbosity Log. Does a Verbose line show?"
        choices: ["Yes, always", "Yes, but in grey", "Only in shipping builds", "No, only when Verbose logging is enabled for that category"]
        answer_index: 3
        explain: "Verbose prints only if Verbose logging is enabled for the given category, for example with the log console command or -LogCmds."
      - q: "Which console command raises LogInventory to verbose while the game runs?"
        choices: ["setlog LogInventory 5", "log LogInventory verbose", "verbosity LogInventory", "LogCmds LogInventory verbose"]
        answer_index: 1
        explain: "The page shows the console syntax log <Category> <verbosity>, for example log LogDerivedDataCache verbose."
      - q: "How do you set verbosity for a category from the command line at launch?"
        choices: ["-Verbosity=", "-log=", "-LogCmds=\"Category Level\"", "-ini:Log"]
        answer_index: 2
        explain: "-LogCmds= sets verbosity per category and accepts multiple categories, including all."
      - q: "Which verbosity level crashes the session even when logging is disabled?"
        choices: ["Error", "Warning", "Fatal", "VeryVerbose"]
        answer_index: 2
        explain: "Fatal always prints a fatal error and then crashes, even if logging is disabled."
      - q: "What is different about an Error compared with a Warning in a commandlet?"
        choices: ["Error messages result in a commandlet failure; warnings are only collected and reported", "Errors print in yellow", "Warnings are not logged", "There is no difference"]
        answer_index: 0
        explain: "Both are collected and reported, but errors make the commandlet fail."
      - q: "UE_LOGFMT(LogCore, Warning, \"Loading {Name} failed {Error}\", (\"Name\", N), (\"Error\", E), (\"Flags\", F)) has an extra Flags field. Is that valid?"
        choices: ["Yes, with named parameters extra fields are permitted and order does not matter", "No, fields must match exactly", "Only if Flags is first", "Only with positional parameters"]
        answer_index: 0
        explain: "Named parameters must contain every referenced field; extra fields are permitted and order is irrelevant. Positional parameters must match exactly."
      - q: "Where does the [Core.Log] section belong to override a category's level for your project?"
        choices: ["In the .uproject", "In DefaultEngine.ini with lines like LogTemp=warning", "In DefaultGame.ini under [/Script/Engine.Log]", "In the Output Log filter"]
        answer_index: 1
        explain: "The Configuration Files page shows [Core.Log] in DefaultEngine.ini with lines like LogTemp=warning to set the display level of a category."
    flavors:
      _default: {why: "Good logs are quiet by default and loud when you ask. Verbosity control is how you get both."}
      programming: {why: "A log category is only useful if you can turn it up and down. Here you control one from the console, the command line and the ini without a rebuild.", do: "Add a second category and show that log all warning silences both at once."}
      tech_art: {why: "Turning one noisy category up or down is how you read tool output without drowning.", do: "Raise LogPython to verbose while running one of your scripts."}

  - id: PQ95
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [networking, replication, cpp]
    required_spine: false
    required: false
    title: Replicated properties with conditions
    brief: "In a multiplayer game the server holds the true state and copies some variables to the clients. This copying is called replication. A replication condition limits who receives a variable, for example only the client that owns the actor, so you send less data and private values stay private. In this quest you make a C++ actor with two replicated variables, one of them only for the owner, and you watch a client get told when a value changes."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/replicate-actor-properties-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/networking-overview-for-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/replicated-object-execution-order-in-unreal-engine"
    checklist:
      - "Open a C++ project, or create one from the Third Person template with C++ selected. You need an IDE such as Visual Studio to compile. Make a class named ANetCrate with Actor as the parent. In the constructor, set bReplicates = true."
      - "Add UPROPERTY(ReplicatedUsing=OnRep_Health) int32 Health and UPROPERTY(Replicated) int32 SecretCode. Include Net/UnrealNetwork.h in the .cpp file."
      - "Override GetLifetimeReplicatedProps. Call Super first, and then add DOREPLIFETIME(ANetCrate, Health) and DOREPLIFETIME_CONDITION(ANetCrate, SecretCode, COND_OwnerOnly)."
      - "Write the function OnRep_Health(int32 LastHealth), which runs on clients when Health changes. Add a UE_LOG in it that prints the old value and the new value."
      - "Add a function named DamageCrate that runs only on the server and lowers Health by 10. Call it from a key press in a Blueprint child named BP_NetCrate, but only on the Authority pin of a Switch Has Authority node."
      - "Set Play In Editor to 2 players and Play As Listen Server. Press the key in the server window. Check the Output Log of the client for the OnRep line with the old and new values."
      - "Write 3 sentences that say why SecretCode never reaches the second client, and what NotReplicated would be used for."
    done_when: "Send one screenshot of NetCrate.cpp that shows GetLifetimeReplicatedProps with both macros, and one screenshot of the Output Log with the OnRep_Health line printed on a client. Add your 3 sentences."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which specifier makes a property replicate AND call a function on the client each time it arrives?"
        choices: ["Replicated", "NotReplicated", "ReplicatedUsing", "Transient"]
        answer_index: 2
        explain: "ReplicatedUsing needs a RepNotify function named OnRep_ something. It is called on clients when the property is replicated. Replicated alone only copies the value."
      - q: "You added UPROPERTY(Replicated) to a property, but clients never get the value. Which step did you most likely skip?"
        choices: ["Marking the property BlueprintReadWrite", "Making the property public", "Adding a Tick function", "Adding a DOREPLIFETIME line in GetLifetimeReplicatedProps"]
        answer_index: 3
        explain: "The page's steps are: add the specifier, set bReplicates = true in the constructor, then override GetLifetimeReplicatedProps and add DOREPLIFETIME for the property. Without the macro the property is not registered."
      - q: "A property uses DOREPLIFETIME_CONDITION with COND_OwnerOnly. Who receives it?"
        choices: ["Only the actor's owner", "Every connected client", "Every connection except the owner", "Only the server"]
        answer_index: 0
        explain: "COND_OwnerOnly only replicates to the actor's owner. COND_SkipOwner is the opposite: it goes to every connection except the owner."
      - q: "By default, when does a registered replicated property send an update?"
        choices: ["Every tick", "Only when its value has changed", "Only when the actor spawns", "Every second"]
        answer_index: 1
        explain: "Every replicated property only replicates on the condition that it has changed. Unchanged properties do not use bandwidth."
      - q: "What does the NotReplicated specifier mainly help with?"
        choices: ["Turning off replication for a whole actor", "Marking a member inside a replicated struct so that member is not sent", "Stopping RPCs on the actor", "Making a property client-only"]
        answer_index: 1
        explain: "The page says it may not seem useful at first, but it is helpful to set a property inside a replicated struct to not replicate."
      - q: "You declare OnRep_Health(int32 LastHealth). What value does the engine put in LastHealth?"
        choices: ["The new value", "Always zero", "The server's tick count", "The previous value of the replicated property"]
        answer_index: 3
        explain: "If the RepNotify has a parameter of the same type as the property, the replication system passes the previous value of the property automatically."
      - q: "In Blueprint, which action automatically calls a variable's RepNotify?"
        choices: ["Any macro that takes the variable by reference", "Reading the variable with a Get node", "A Set node on the replicated variable", "Compiling the Blueprint"]
        answer_index: 2
        explain: "In Blueprint, a Set node on a replicated property calls its RepNotify. Macros and functions that take the property by reference generally do not call it, even if they change the value."
      - q: "Why does the page warn against using COND_Custom for every property?"
        choices: ["They cost more time and cannot change per connection", "Custom conditions do not work in packaged builds", "They only work in Blueprint", "They replicate every tick"]
        answer_index: 0
        explain: "Custom replication conditions take more resources and time, and they are decided per actor, not per connection. So they cannot use state that changes per connection."
    flavors:
      _default: {why: "Replication conditions are how you send less data and keep private values private."}
      programming: {why: "Most multiplayer bugs are a missing DOREPLIFETIME or a wrong condition; you must be able to read this code.", do: "Add a third property with DOREPLIFETIME_CONDITION_NOTIFY and REPNOTIFY_Always, and explain in one line when its OnRep fires."}

  - id: PQ96
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [networking, rpc, blueprint, cpp]
    required_spine: false
    required: false
    title: "Server, Client and Multicast RPCs"
    brief: "An RPC (Remote Procedure Call) is a function that you call on one computer and that runs on another. A Server RPC lets a client ask the server to do something. A Client RPC lets the server run something on one client only. A Multicast RPC lets the server run something on all clients, which is good for effects. In this quest you write all three kinds in C++ and one in Blueprint, and you see in which window each one runs."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/remote-procedure-calls-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/replicated-object-execution-order-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-owner-and-owning-connection-in-unreal-engine"
    checklist:
      - "Open a C++ project made from the Third Person template, or create one with C++ selected. You need an IDE such as Visual Studio to compile. In the C++ Character class of the template, add UFUNCTION(Server, Reliable, WithValidation) void ServerFire(int32 Ammo). Write ServerFire_Implementation and ServerFire_Validate, and make the validate function return false when Ammo < 0."
      - "Add UFUNCTION(NetMulticast, Unreliable) void MulticastFireFX(). In its _Implementation function, spawn a sound or a particle effect at the actor."
      - "Add UFUNCTION(Client, Reliable) void ClientShowHit(). In its _Implementation function, print a message on the screen."
      - "In ServerFire_Implementation, call MulticastFireFX and ClientShowHit. Bind ServerFire to an input key on the owning client, the client that controls this character."
      - "In a Blueprint child, add a Custom Event named Multicast_Cheer. In its Details, set Replicates to Multicast and leave it unreliable. Call it from a second key."
      - "Test with 2 players and Play As Listen Server. Press both keys in the client window. Note which window plays the effect and which window shows the hit message."
      - "Call ServerFire with Ammo = -1 from the client and watch what happens to that client."
    done_when: "Send a screenshot of the header with the three UFUNCTION lines, and a screenshot of both Play In Editor windows after the client fired. Add 2 sentences about what happened with Ammo = -1."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the main intended use of RPCs according to the page?"
        choices: ["Transient or cosmetic events like sounds, particles and animations", "Replacing all replicated properties", "Saving the game", "Loading levels"]
        answer_index: 0
        explain: "RPCs are one-way calls with no return value. Their primary use is unreliable, transient gameplay events such as playing sounds, spawning particles and performing animations."
      - q: "A Server RPC is called on a client, but the actor is owned by a different client. What happens?"
        choices: ["It runs on the server anyway", "It runs on the other client", "It is dropped", "It runs locally"]
        answer_index: 2
        explain: "The execution matrix shows a Server RPC called from a client whose actor's owning connection is a different client is Dropped. Server RPCs must be called from the owning client."
      - q: "A NetMulticast RPC is called from a client. Where does it execute?"
        choices: ["On the server and all clients", "Only on the invoking client", "Only on the server", "It is dropped"]
        answer_index: 1
        explain: "NetMulticast RPCs are designed to be called from the server. Called from a client, a multicast only executes locally on that client."
      - q: "What is the default reliability of an RPC, and why should Reliable be used with care?"
        choices: ["Unreliable by default; Reliable needs more bandwidth and blocks later RPCs until acknowledged", "Reliable by default; Unreliable costs more bandwidth", "Both are equal", "Reliable by default; there is no cost"]
        answer_index: 0
        explain: "RPCs are unreliable by default. A Reliable RPC is re-sent until acknowledged and all later RPC executions are suspended until then, so it uses extra bandwidth. Use it sparingly."
      - q: "A Server RPC has WithValidation and the _Validate function returns false. What happens to the caller?"
        choices: ["The RPC runs anyway with a warning", "The invoking client is disconnected", "The RPC is queued for later", "Only the return value is ignored"]
        answer_index: 1
        explain: "The validation function runs first on the server. If inputs fail validation, the invoking client is disconnected from the server. If they pass, the implementation runs."
      - q: "Which RPC type from C++ is NOT available in Blueprint?"
        choices: ["Server", "Client", "Remote", "NetMulticast"]
        answer_index: 2
        explain: "The page says Remote RPCs are not currently exposed to Blueprints. Server, Client and Multicast can be set in a Custom Event's Replicates setting."
      - q: "Two reliable RPCs are called on the same actor, RPC_A then RPC_B. What does the engine guarantee on the receiving machine?"
        choices: ["Nothing about their order", "RPC_B executes first", "Only one of them arrives", "RPC_A executes before RPC_B"]
        answer_index: 3
        explain: "The execution-order page says reliable RPCs on the same actor keep their call order on the receiving machine. Across different actors there is no order guarantee."
      - q: "In one frame you call a reliable RPC and also change a replicated property. In what order does the client process them?"
        choices: ["Property first, then RPC", "Random order", "Only the property arrives", "RPC first, then the property update"]
        answer_index: 3
        explain: "RPCs are executed first and property updates are applied second. Unreliable multicasts are the exception: they are queued last and run after the property updates."
    flavors:
      _default: {why: "RPCs are how a client asks the server to do something and how the server tells clients to show effects."}
      programming: {why: "Knowing the execution matrix saves hours of 'why did my event not fire' debugging.", do: "Make the multicast reliable and write one line on when that is a mistake."}

  - id: PQ97
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [networking, net-roles, blueprint]
    required_spine: false
    required: false
    title: Read local role and remote role
    brief: "In a network game each copy of an actor has a role. The role says if this copy has the authority to change the actor, if it is the copy that a player controls from a client, or if it only shows what the server sends. The local role is the role on this machine, and the remote role is the role on the other side of the connection. In this quest you build a small label that shows both roles above each actor, and you compare what the server and a client see."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-role-and-remote-role-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/networking-overview-for-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-owner-and-owning-connection-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make an Actor Component named BP_RoleLabel. On Begin Play, it adds a Text Render component above the owner. Then, every 0.5 s with a timer, it sets the text to the Get Local Role and Get Remote Role of the owner."
      - "Add BP_RoleLabel to BP_ThirdPersonCharacter. Make two simple Actor Blueprints, each with a cube mesh: BP_NetCrate with Replicates turned on in its Class Defaults, and BP_Rock with Replicates turned off. Place one of each in the level and add the component to both."
      - "Play with 3 players and Play As Listen Server. In the server window, read the labels on your own pawn, on another pawn, on the crate and on the rock."
      - "Open a client window and read the same four labels. Write them into a small table with the columns actor, window, local role and remote role."
      - "While the game is running, select the crate in the server world. In its Details panel, find the Role and Remote Role values and compare them with your text."
      - "Lower Net Update Frequency on BP_NetCrate to 1 and move the crate with a timeline on the server. Watch how the movement looks on the client."
    done_when: "Send a screenshot of a client window with at least three role labels visible, and your table with the four actors in the server window and in a client window."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Which role holds the true state and replicates property changes to clients?"
        choices: ["ROLE_SimulatedProxy", "ROLE_Authority", "ROLE_AutonomousProxy", "ROLE_None"]
        answer_index: 1
        explain: "ROLE_Authority has authoritative control. It holds the true state, may change it, and keeps track of property changes to replicate them to connected clients."
      - q: "On a client, your own pawn shows Local Role = AutonomousProxy and Remote Role = Authority. What does this mean?"
        choices: ["This pawn is controlled by another client", "This pawn is not replicated", "This pawn is controlled by this client", "This client is the server"]
        answer_index: 2
        explain: "The matrix says AutonomousProxy local with Authority remote, seen on a client, is the pawn controlled by this connected client. An autonomous proxy may change state and call remote functions."
      - q: "On a client, another player's pawn shows Local Role = SimulatedProxy. What can this actor do locally?"
        choices: ["Change the true state and call RPCs", "Act as the server", "Nothing; it is not replicated", "Simulate the true state but not change it or call remote functions"]
        answer_index: 3
        explain: "A simulated proxy simulates the true state but has no authority to change it or call remote functions. Replicated actors not controlled by any client also use this combination."
      - q: "A client shows an actor with Local Role = Authority and Remote Role = None. What is it?"
        choices: ["A bug in replication", "The server's pawn", "A dormant actor", "A non-replicated actor"]
        answer_index: 3
        explain: "Non-replicated actors have a local role of ROLE_Authority on clients and a remote role of ROLE_None. For replicated actors only the server should ever see ROLE_Authority."
      - q: "Are role and remote role the same thing as ownership?"
        choices: ["Yes, they are synonyms", "Yes, but only for pawns", "No, the page says they are not the same; ownership is a separate concept", "Only in Blueprint"]
        answer_index: 2
        explain: "The page states clearly that actor role and remote role are not the same as ownership and points to the Owning Connection page."
      - q: "Why do simulated characters move in steps when Net Update Frequency is low?"
        choices: ["Because the server only replicates the actor at that frequency, so time passes between updates", "Because the client renders at low FPS", "Because the actor is dormant", "Because RPCs are unreliable"]
        answer_index: 0
        explain: "Servers do not replicate every actor every update. They replicate at the frequency in AActor::NetUpdateFrequency, so time passes on the client between updates; the client simulates movement in between."
      - q: "Which Blueprint or C++ call tells you how much control the LOCAL machine has over an actor?"
        choices: ["GetLocalRole", "GetRemoteRole", "GetOwner", "GetNetMode"]
        answer_index: 0
        explain: "AActor::GetLocalRole returns how much control the local machine has; GetRemoteRole returns how much control the remote machine has."
      - q: "What does GetTearOff being true mean for an actor?"
        choices: ["The actor was destroyed on the server", "The actor is no longer replicated to new clients and becomes ROLE_Authority on the clients that had it", "The actor lost its owner", "The actor is hidden"]
        answer_index: 1
        explain: "A torn-off actor is no longer replicated to new clients and becomes ENetRole::ROLE_Authority on clients to which it was being replicated."
    flavors:
      _default: {why: "Reading the role tells you which window is allowed to change an actor."}
      programming: {why: "Switch Has Authority and Get Local Role are the first checks in almost every networked function.", do: "Add a branch in BP_RoleLabel that colors the text green for Authority, blue for AutonomousProxy, grey for SimulatedProxy."}

  - id: PQ98
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [networking, pie, testing]
    required_spine: false
    required: false
    title: Listen server and dedicated server in PIE
    brief: "You can test multiplayer inside the editor with Play In Editor (PIE). A listen server is one player who is also the server. A dedicated server is a server with no player on it, and every player is a client. The editor can also simulate a bad network connection, so you can find bugs that only show up with delay. In this quest you try both server types, turn on network emulation, and debug one client world."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/play-in-editor-multiplayer-options-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-network-emulation-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/network-debugging-for-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open the Play drop-down in the Level Editor toolbar. Set Number of Players to 3 and Net Mode to Play As Listen Server. Press Play and note the title of each window."
      - "Stop the game. Set Net Mode to Play As Client with Number of Players 1 and play again. Write one sentence that says what is different and where the server is."
      - "Open Editor Preferences and go to Level Editor, then Play. Turn on Enable Network Emulation, set Emulation Target to Everyone, and choose the profile Bad. Play as a client, walk around, and note how it feels."
      - "Set the profile to Custom with 250 ms for the minimum and maximum latency and 10% packet loss in both directions. Make a replicated test actor: an Actor Blueprint with a cube mesh, Replicates and Replicate Movement turned on, that moves back and forth on the server with a Timeline. Play again and watch how the cube updates in the client window."
      - "In BP_ThirdPersonCharacter, add a breakpoint on Begin Play. In the debug world drop-down of the Blueprint Editor, pick Client 1 only. Play with 2 players and count how many times the breakpoint hits."
      - "Turn off Run Under One Process, play with 2 players, and compare the start time with the earlier run. Then turn the setting back on."
    done_when: "Send two screenshots: (1) the Play In settings page with your network emulation values, and (2) the debug world drop-down of the Blueprint Editor set to a client world while the game is stopped at the breakpoint. Add your sentence about Play As Client."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "You choose Play As Client with Number of Players 1. What runs?"
        choices: ["One standalone game with no networking", "Two listen servers", "One client window plus a dedicated server with no display", "One listen server window"]
        answer_index: 2
        explain: "Play As Client launches a dedicated server world in the background with no display or local player. The page calls one client plus Play As Client a basic test setup for server/client logic."
      - q: "What is the special value of testing with a dedicated server in PIE?"
        choices: ["It runs faster than a listen server", "It renders better graphics", "It removes the need for replication", "It catches bugs in code that wrongly relies on a local player on the server"]
        answer_index: 3
        explain: "With a dedicated server none of your clients runs as a listen server, so you can find dedicated-server-only bugs, such as code that relies on a local player."
      - q: "What does Run Under One Process change?"
        choices: ["Each window gets its own machine", "It turns off the server", "It sets the FPS to 60", "All windows run in one Unreal instance; faster to start but less like a real player setup"]
        answer_index: 3
        explain: "Run Under One Process spawns the multiplayer windows in a single instance. It loads much faster but is less representative of the real runtime where each game instance is its own process."
      - q: "How do you know which PIE window is Client 1?"
        choices: ["The window title shows NetMode Client 1", "It is always the left window", "It has a red border", "It is the viewport window"]
        answer_index: 0
        explain: "The window title shows the client number, for example a title ending in [NetMode Client 1]."
      - q: "You set the Blueprint Editor debug world to Client 1. What happens to breakpoints?"
        choices: ["They trigger in all worlds", "They only trigger on actors in Client 1's world", "They are disabled", "They trigger only on the server"]
        answer_index: 1
        explain: "The selected world filters the actor list and the breakpoints. With Client 1 chosen, only actors in that world trigger breakpoints; with All Worlds any world can."
      - q: "Network Emulation profile Bad is on. What does it add?"
        choices: ["Extra frame rate", "Latency and packet loss to incoming and outgoing traffic", "More players", "A second server"]
        answer_index: 1
        explain: "Network emulation applies latency (min and max) and a percentage of packet loss to incoming and outgoing packets, on the Server Only, Clients Only or Everyone."
      - q: "Why does the emulation page recommend testing with very harsh settings like 500 ping and 10% loss?"
        choices: ["To make the game slower for fun", "Because that is the default for all players", "Because many bugs only appear with poor connectivity and would otherwise be missed", "To reduce CPU usage"]
        answer_index: 2
        explain: "Games with perfect connectivity do not show bugs that only happen under poor connectivity. Harsh local tests catch these bugs and exploits and push you to optimize."
      - q: "Which setting starts a separate server even when the chosen Net Mode does not need it?"
        choices: ["Launch Separate Server", "Server Fixed FPS", "Route Gamepad to Second Window", "Client Fixed FPS"]
        answer_index: 0
        explain: "Launch Separate Server starts a server even if the net mode does not require it, which is useful to test offline-to-server workflows."
    flavors:
      _default: {why: "A multiplayer bug you cannot reproduce in PIE is a bug you cannot fix."}
      programming: {why: "Testing under lag is the only way to see prediction and reliability problems before players do.", do: "Set NetEmulation.PktLag from the console at runtime and confirm the value in the log."}

  - id: PQ99
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [networking, character-movement, prediction]
    required_spine: false
    required: false
    title: How character movement replicates
    brief: "In a network game your own character must react at once, but the server still has the final say. The Character Movement Component solves this with prediction and correction: the client moves first, tells the server, and the server checks the move and corrects the client if they do not agree. This is why your own character feels instant while other players lag a little. In this quest you watch this happen, try to cheat with the speed, and draw the steps as a diagram."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/understanding-networked-movement-in-the-character-movement-component-for-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-role-and-remote-role-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-network-emulation-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Play it with 2 players, Play As Listen Server, and the network emulation profile Bad on Everyone. You set the profile in Editor Preferences, under Level Editor, then Play. Move the client character and watch it in the server window."
      - "In BP_ThirdPersonCharacter, print Get Local Role each second. Confirm which window is the autonomous proxy, which is the authority and which is the simulated proxy for that character."
      - "Make BP_Rock, an Actor with a Static Mesh and with Replicates on. Move it with a Timeline on Begin Play, but only on the Authority pin. Play and note if the client sees it move. Then turn Replicate Movement on and compare."
      - "In BP_ThirdPersonCharacter, set Max Walk Speed to 3000 on Begin Play, but only when Has Authority is false. Play with emulation on and describe what the server does to the client pawn."
      - "Read the Movement Replication Summary table on the documentation page. Draw the 9 steps as a small diagram on paper or in a drawing tool, with three columns: autonomous proxy, server and simulated proxy."
      - "Write 3 sentences that say why ServerMove is an unreliable RPC and what ClientAdjustPosition does."
    done_when: "Send a photo or screenshot of your diagram with the 9 steps, and a screenshot of the client window after the speed change. Add your 3 sentences."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which component provides replicated walking, falling, swimming and flying by default?"
        choices: ["Character Movement Component on ACharacter", "Floating Pawn Movement", "Projectile Movement", "Rotating Movement"]
        answer_index: 0
        explain: "UCharacterMovementComponent comes pre-attached to ACharacter. Its default movement modes are built to replicate by default."
      - q: "Why is ACharacter not just a Pawn with a Character Movement Component added?"
        choices: ["Because Pawns cannot have components", "Because ACharacter is faster to render", "Because Pawns cannot be possessed", "Because ACharacter overrides replicated variables and functions the movement component needs for replication"]
        answer_index: 3
        explain: "ACharacter and UCharacterMovementComponent are designed together. ACharacter overrides several replicated variables and functions to support replication in the movement component."
      - q: "On the owning client, what does the character do after PerformMovement each tick?"
        choices: ["It waits for the server before moving", "It records an FSavedMove_Character, queues it, and sends a condensed ServerMove RPC", "It sends its full mesh transform to all clients", "It calls a multicast RPC"]
        answer_index: 1
        explain: "The autonomous proxy moves locally, builds an FSavedMove_Character, queues it in SavedMoves, combines similar moves and sends the condensed data to the server with a ServerMove RPC."
      - q: "The server's end position does not match the client's reported position. What does the server send?"
        choices: ["A new pawn", "A ClientAdjustPosition correction", "Nothing; the client wins", "A Destroy call"]
        answer_index: 1
        explain: "The server reproduces the move with PerformMovement and compares positions. If they match it confirms the move; otherwise it sends a ClientAdjustPosition RPC and the client replays its saved moves."
      - q: "How do simulated proxies on other clients learn where a character is?"
        choices: ["The server replicates the ReplicatedMovement structure and network smoothing cleans up the motion", "They receive every ServerMove RPC", "They run the same input locally", "They ask the owning client directly"]
        answer_index: 0
        explain: "The server sends its location, rotation and state to simulated proxies by replicating the ReplicatedMovement structure. Simulated proxies apply it directly, with network smoothing for visual cleanup."
      - q: "Why is ServerMove an unreliable RPC?"
        choices: ["Because movement is not important", "Because unreliable RPCs are faster to compile", "Because reliable calls that frequent could overflow the reliable buffer and disconnect the player; the saved-move buffer already resends lost data", "Because the server does not run movement"]
        answer_index: 2
        explain: "ServerMove is called very often. As reliable RPCs it could overflow the reliable function buffer and force a disconnect. The saved-move system already resubmits lost moves and discards moves that are too old."
      - q: "Why does the server compute movement delta time from its own timestamps and not the client's?"
        choices: ["Client clocks are always wrong", "The client sends no timestamp", "To save bandwidth", "So a client cannot speed-hack by speeding up its local game clock"]
        answer_index: 3
        explain: "Most calculations use the server's timestamps instead of the client's to prevent clients from hacking their speed by speeding up the local game clock."
      - q: "Which role runs PerformMovement first, in response to real player input?"
        choices: ["Simulated Proxy", "Authority", "Autonomous Proxy", "None; the server does it"]
        answer_index: 2
        explain: "Step 1 of the summary: the owning client controls the autonomous proxy locally and PerformMovement runs the movement logic there. The server later reproduces it from the ServerMove."
    flavors:
      _default: {why: "Prediction and correction are why your own character feels instant while others lag slightly."}
      programming: {why: "Any custom movement mode must fit into this saved-move cycle or it will rubber-band.", do: "Find MaxSimulationIterations in the component defaults and write one line on what it limits."}

  - id: PQ100
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [networking, ownership, blueprint]
    required_spine: false
    required: false
    title: Owner and owning connection
    brief: "In a network game an actor can have an owner, and through its owner it belongs to the connection of one player. This is called the owning connection. A client may only call a Server RPC on an actor that its own connection owns, and ownership also decides who receives private data. In this quest you try to toggle a lantern from a client before and after the client becomes its owner, and you see the difference."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-owner-and-owning-connection-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/remote-procedure-calls-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-relevancy-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make an Actor Blueprint named BP_Lantern with Replicates on and Replicate Movement on. Add a Custom Event named Server_Toggle and set it to Run on Server and Reliable. It flips a replicated bool named bLit, and the OnRep function of bLit updates a point light."
      - "Place one BP_Lantern in the level. In BP_ThirdPersonCharacter, on the E key, get the nearest BP_Lantern and call Server_Toggle on it. Play with 2 players and press E in the client window. Note if the light changes."
      - "Add a second key, F, that calls a Server event named Server_Pickup on the character. On the server, this event calls Set Owner on the lantern with the character as the new owner, and attaches the lantern to the hand."
      - "After the pickup, press E again from the client. Note the difference, and explain it with the owning connection rule."
      - "On Begin Play of the lantern, start printing Get Owner every second. Compare what the server window and the client windows print before and after the pickup."
      - "Write 3 sentences: who owns a pawn on the server, how an actor component finds its owning connection, and why a lantern with no owner cannot run a Server RPC from a client."
    done_when: "Send a screenshot of the lantern graph with Server_Toggle and its Replicates settings, and a screenshot of the client window after the pickup with the light toggled. Add your 3 sentences."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "When a client connects to the server, what does the server create and link to that connection?"
        choices: ["A GameMode", "A Player Controller associated with the connection", "A new level", "A Game Instance"]
        answer_index: 1
        explain: "When a client connects, a player controller is created on the server associated with that connected client. It then possesses a pawn, and the player controller is the owner of the pawn."
      - q: "What is an actor's owning connection?"
        choices: ["The first client that saw it", "The server's socket", "The connection associated with the actor's owning player controller", "The last client that touched it"]
        answer_index: 2
        explain: "The owning connection of an actor is the connection of the actor's owning player controller. You find it by walking to the outermost owner; if that is a player controller, its connection is the owning connection."
      - q: "A pawn is unpossessed by its player controller. What happens to the pawn's owning connection?"
        choices: ["It stays with the old connection forever", "It moves to the server", "It moves to the next client", "The connection is no longer the owning connection for the pawn"]
        answer_index: 3
        explain: "The pawn is owned by the connection only while the player controller possesses it. As soon as the controller no longer possesses it, that connection is no longer the owning connection."
      - q: "A client calls a Server RPC on a placed actor that has no owner. What happens?"
        choices: ["It runs on the server", "It runs on all clients", "It runs on the owning client", "It is dropped because the actor has no valid owning connection"]
        answer_index: 3
        explain: "An RPC can only be executed from a replicated actor or actor component with a valid owner and owning connection. With no owner the Server RPC from a client is dropped."
      - q: "Why does each client only receive updates for its own player controller?"
        choices: ["Because player controllers are not replicated", "Because of dormancy", "Because player controllers are only relevant to their owner by default", "Because of the GameMode"]
        answer_index: 2
        explain: "For actors with bOnlyRelevantToOwner true, only the owning connection gets property updates. By default all player controllers are only relevant to their owner."
      - q: "How do you find the owning connection of an actor COMPONENT?"
        choices: ["Walk the component's outer chain to its owning actor, then use that actor's owning connection", "Components cannot have one", "Use the GameState", "Ask the client"]
        answer_index: 0
        explain: "For actor components you first walk the outer chain until the owning actor is found, then apply the same process as for actors."
      - q: "Which C++ call returns an actor's owning connection directly?"
        choices: ["AActor::GetNetConnection", "AActor::GetOwner", "AActor::GetLocalRole", "UActorComponent::GetOwner"]
        answer_index: 0
        explain: "AActor::GetOwner returns the owner actor; AActor::GetNetConnection returns the owning connection."
      - q: "Inventory items carried by a pawn: which connection owns them?"
        choices: ["No connection", "The same connection that owns the pawn", "The server connection only", "All connections"]
        answer_index: 1
        explain: "The page says the same logic applies to inventory items belonging to a character pawn: they are owned by the same connection that owns the pawn."
    flavors:
      _default: {why: "Ownership decides who may ask the server to act, and who receives private data."}
      programming: {why: "Most 'my Server RPC does nothing' reports are ownership problems.", do: "Add a Client RPC on the lantern and show it only runs on the owning client after pickup."}

  - id: PQ101
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [networking, relevancy, dormancy, optimization]
    required_spine: false
    required: false
    title: Relevancy and dormancy
    brief: "A server does not send every actor to every client all the time. Relevancy decides, for each client, if an actor matters to that client at all, for example because it is close enough. Dormancy puts an actor to sleep on the network, so the server stops checking it for changes until you wake it. These are the two main ways to keep the server cost and the amount of sent data low. In this quest you test both on two simple actors."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-relevancy-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-network-dormancy-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/networking-overview-for-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make an Actor Blueprint named BP_Beacon with Replicates on and a Static Mesh that has collision. In Class Defaults, in the Replication section, set Net Cull Distance Squared to 90000 (3 m squared)."
      - "Spawn one BP_Beacon on the server while the game runs. Play with 2 players and walk the client away from the beacon. Note the distance at which it disappears on the client, and check that it still exists in the server window."
      - "Turn on Always Relevant on BP_Beacon and do the test again. Then turn on Only Relevant To Owner and do it once more."
      - "Make an Actor Blueprint named BP_Sign with Replicates on, a replicated string named Message, and a text render that is updated in OnRep. Set Net Dormancy to Initial in Class Defaults and place the sign in the level."
      - "Add a key on the server that sets Message with a normal Set node, and watch the client. Then call Flush Net Dormancy on the sign before the Set node and watch again."
      - "Write 4 sentences: what relevancy does to a dynamic actor on the client, what dormancy does instead, and which of your two actors is a good candidate for each."
    done_when: "Send two screenshots: the client window with the beacon gone while the server window still shows it, and the Class Defaults of BP_Sign with Net Dormancy set. Add your 4 sentences."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What happens to a dynamically spawned replicated actor on a client when it stops being relevant?"
        choices: ["It is hidden but kept", "It is destroyed on that client", "It is frozen", "It becomes dormant"]
        answer_index: 1
        explain: "Relevancy is per connection. Dynamically spawned, replicated actors are destroyed on the client when they are no longer relevant; that is why the example actor disappears."
      - q: "Which property makes an actor relevant for every connection, even overriding Only Relevant To Owner?"
        choices: ["bNetUseOwnerRelevancy", "NetCullDistanceSquared", "bRelevantForNetworkReplays", "bAlwaysRelevant"]
        answer_index: 3
        explain: "bAlwaysRelevant marks the actor always relevant for replication and overrides bOnlyRelevantToOwner."
      - q: "Your replicated actor has no collision on its root component. What does the relevancy logic do?"
        choices: ["It is not relevant for the connection", "It is always relevant", "It uses the owner's relevancy", "It crashes"]
        answer_index: 0
        explain: "The base AActor logic marks an actor not relevant if it is hidden, or if it has no root component or the root has collision disabled."
      - q: "What does NetCullDistanceSquared hold?"
        choices: ["The distance in meters", "The number of clients", "The square of the maximum distance from the client viewport where the actor is relevant", "The update rate"]
        answer_index: 2
        explain: "NetCullDistanceSquared is the square of the maximum distance from the client's viewport at which this actor is relevant and replicates. It is used when distance-based relevancy is enabled."
      - q: "Which function forces an actor to be relevant when it is not by default?"
        choices: ["IsNetRelevantFor", "FlushNetDormancy", "ForceNetRelevant", "GetNetConnection"]
        answer_index: 2
        explain: "AActor::ForceNetRelevant forces the actor to be network relevant. IsNetRelevantFor is the check the net driver runs; overriding it needs caution."
      - q: "Why is dormancy called one of the most impactful server optimizations?"
        choices: ["It reduces client render cost", "Dormant actors are skipped when the NetDriver gathers and compares replicated actors each update", "It compresses packets", "It removes the actor from memory"]
        answer_index: 1
        explain: "Each net update the NetDriver gathers relevant actors and compares their properties. Dormant actors are not added to that list, saving server CPU, especially with many rarely changing actors."
      - q: "A dormant actor's replicated property is changed without waking it. What is the risk?"
        choices: ["Nothing; it replicates normally", "The client crashes", "The actor becomes always relevant", "The change is not sent and may be lost when the actor wakes"]
        answer_index: 3
        explain: "While dormant the actor is not considered for replication, so changes are not sent and might be lost. Call FlushNetDormancy, ForceNetUpdate or SetNetDormancy(DORM_Awake) before changing properties."
      - q: "How do dormant actors differ from non-relevant actors on the client?"
        choices: ["Dormant actors still exist on server and client; non-relevant dynamic actors are destroyed on the client", "Both are destroyed on the client", "Dormant actors are destroyed; non-relevant ones stay", "There is no difference"]
        answer_index: 0
        explain: "The dormancy page says dormant actors still exist on both server and client although their channel closes, unlike relevancy where dynamic replicated actors are destroyed on the client."
    flavors:
      _default: {why: "Relevancy and dormancy are the two main dials for keeping server cost and bandwidth low."}
      programming: {why: "A level with 2000 replicated props needs dormancy or the server tick will not survive.", do: "Set DORM_DormantAll in a C++ constructor and wake it with SetNetDormancy from a key press."}

  - id: PQ102
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [networking, profiling, tools]
    required_spine: false
    required: false
    title: "Record a Networking Insights session"
    brief: "Networking Insights is the part of Unreal Insights that shows the network traffic of your game. It reads a trace, which is a recording made while the game runs, and shows every packet that was sent or received and what was inside it. You cannot lower the amount of data your game sends until you can see what is sending it. In this quest you record a short multiplayer session with network tracing turned on, open it in Networking Insights, and find the biggest users."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/networking-insights-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/network-debugging-for-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/stat-commands-in-unreal-engine"
    checklist:
      - "Use a project made from the Third Person template, or create one, and close the editor. Start Unreal Insights first: run UnrealInsights.exe from the folder Engine/Binaries/Win64 of your engine and leave it open."
      - "Start the editor from a command prompt with network tracing turned on, for example: UnrealEditor.exe YourProject.uproject -trace=net -NetTrace=1 -tracehost=localhost. The argument -tracehost=localhost is needed in the editor, because the editor runs its own data store for trace data."
      - "In the editor, play with 2 players and Play As Listen Server. Move both characters and jump around for about 30 seconds. Then stop playing and close the editor."
      - "In Unreal Insights, open the newest trace from the list of sessions. Open the Networking Insights window from the menu of Unreal Insights. In the connection selection area, pick a Game Instance and a Connection, and switch Connection Mode between outgoing and incoming data."
      - "In the Packet Overview panel, hover over a packet to read its index, size and status. Click one large packet to select it, and hold Shift and click to select several. Dropped packets are shown in red."
      - "Look at the Packet Content panel for your selection and find the character in it, with its replicated properties and remote function calls. Tick By NetId and type the NetId of one object to filter the view. Then filter by type and turn on Highlight."
      - "Open the Net Stats panel and sort it by total size. Write down the top 3 entries. Then write 3 sentences: which object or remote function call used the most data, one idea to reduce it, and why the reported packet size can be larger than what really goes over the wire."
    done_when: "Send a screenshot of Networking Insights with the Packet Overview and the Packet Content of a selected packet, and a screenshot of the Net Stats panel sorted by total size. Add your 3 sentences."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which command-line arguments record a networking trace?"
        choices: ["-stats on its own", "-netprofile=true", "-log -verbose", "-trace=net together with -NetTrace=1, or another value above zero"]
        answer_index: 3
        explain: "The trace needs the net channel (-trace=net) and a NetTrace verbosity greater than zero, for example -NetTrace=1."
      - q: "You record from the editor. Which extra argument does the documentation say you need, and why?"
        choices: ["-game, because the editor cannot record traces", "-nosound, to keep the trace small", "-windowed, so that Unreal Insights can attach", "-tracehost=localhost, because the editor runs its own data store for trace data"]
        answer_index: 3
        explain: "The editor runs its own data store for trace data, so you need to specify the tracehost to collect network trace data while running in the editor."
      - q: "Which panel shows a timeline of the packets and their sizes?"
        choices: ["Packet Overview", "Packet Content", "Net Stats", "Net Stats Counters"]
        answer_index: 0
        explain: "The Packet Overview panel visualizes the packets that were transmitted or received during the game, with their sizes."
      - q: "What does the Packet Content panel show?"
        choices: ["The frame rate of each client", "A list of all levels that were loaded", "What is inside the selected packets, such as replicated objects, properties and remote function calls", "The CPU time of the server"]
        answer_index: 2
        explain: "Packet Content reveals the content of the selected packet or packets: replicated objects, properties and remote function calls."
      - q: "How are dropped packets shown in the Packet Overview?"
        choices: ["In red", "In green", "They are not shown at all", "With a dotted outline"]
        answer_index: 0
        explain: "Dropped packets are displayed in red."
      - q: "Which selection decides whether you see incoming or outgoing data?"
        choices: ["Game Instance", "Connection Mode", "Connection", "Net Stats"]
        answer_index: 1
        explain: "Connection Mode controls whether incoming or outgoing data is shown. Game Instance and Connection choose whose data you look at."
      - q: "The trace reports the size of each packet. How does this size relate to the data that really goes over the wire?"
        choices: ["It is always exactly the same", "It counts every packet twice", "It is the size before compression, so the real data may be smaller", "It only counts the packet headers"]
        answer_index: 2
        explain: "The reported size of each packet is the size before compression, so the actual data on the wire may be smaller than what the report shows."
      - q: "How do you select several packets at once in the Packet Overview?"
        choices: ["Double-click one packet", "Hold Shift and click", "Press Ctrl+A in the Net Stats panel", "You can only select one packet"]
        answer_index: 1
        explain: "Click selects one packet. Hold Shift and click to select several packets."
    flavors:
      _default: {why: "You cannot cut bandwidth until you can see which actor is spending it."}
      programming: {why: "The profiler turns 'the game feels laggy' into a named actor, property or RPC with a byte count.", do: "Compare two recordings: one with your multicast Reliable, one Unreliable, and note the size difference on the All RPCs tab."}

  - id: PQ103
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [profiling, unreal-insights, cpu]
    required_spine: false
    required: false
    title: Find the slow frame in Timing Insights
    brief: "Unreal Insights is a separate program that reads a trace, which is a recording of what the engine did in each frame. Its Timing Insights window shows how long each frame took and which functions used that time. With it, a general complaint such as \"the game hitches\" becomes one named function that you can fix. In this quest you cause a slow frame on purpose, record it, and find the work that made it slow."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/timing-insights-in-unreal-engine-5"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-the-timers-and-counters-tabs-in-unreal-insights-for-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-the-frames-panel-in-unreal-insights-for-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Make an actor named BP_SlowSpawner that spawns 200 actors in one frame when you press a key, and writes one line to the log with Print String at that moment. Set Auto Receive Input to Player 0 in its Class Defaults, and place it in the level."
      - "Record a trace of a Play In Editor (PIE) session in which you press the key. Open the trace in Unreal Insights and go to the Timing Insights window."
      - "In the Frames panel, click the tall bar that belongs to the spawn frame. Then look at the track of the Game thread in the Timing panel."
      - "Open the Timers panel and set the Modes dropdown to Instance. Sort the list by Inclusive time and find the spawn work."
      - "Double-click the spawn timer to plot it in the main graph. Then select it and read the Callers and Callees panels, which show what calls it and what it calls."
      - "Use the Log panel to find your own log line from the spawn frame. Click the line to jump to that moment."
      - "Write down the name of the timer, its Inclusive time and Exclusive time, and one caller."
    done_when: "Send a screenshot of Timing Insights that shows the Frames panel with the spike selected and the Timers panel with your spawn timer highlighted. Add a short note with the timer name, the Inclusive and Exclusive times, and one caller."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You want to see which frames took the most time in a trace. Which panel do you look at first?"
        choices: ["Frames panel", "Log panel", "Modules panel", "Investigation panel"]
        answer_index: 0
        explain: "The Frames panel shows the total time of each frame as a bar graph, so spikes are easy to see."
      - q: "In the Timing panel, what does the width of an event box mean?"
        choices: ["How many threads ran it", "How much time the thread spent on it", "How much memory it used", "Its call depth"]
        answer_index: 1
        explain: "Each track is a thread, and the width of each event shows how much time that thread spent processing it."
      - q: "In the Timers panel, what is the difference between Inclusive and Exclusive time?"
        choices: ["Inclusive is per frame, Exclusive is per session", "Inclusive is Game thread, Exclusive is Render thread", "Inclusive includes time of called functions, Exclusive does not", "They are the same value in different units"]
        answer_index: 2
        explain: "Inclusive duration counts the whole timer including callees; Exclusive counts only the timer's own time."
      - q: "You selected a timer. Where do you see which functions call it?"
        choices: ["Counters panel", "Quick Find panel", "Frames panel", "Callers panel"]
        answer_index: 3
        explain: "The Callers panel lists functions that call the selected event; the Callees panel lists what it calls."
      - q: "How do you plot a timer from the Timers list onto the main graph?"
        choices: ["Drag it onto the Frames panel", "Press CTRL+S", "Double-click the event in the list", "Enable it in the Modules panel"]
        answer_index: 2
        explain: "Double-clicking an event highlights it and plots it in the main graph in a matching color. Double-click again to remove it."
      - q: "Which aggregation mode gives you Max/Avg/Median inclusive time per game frame?"
        choices: ["Instance", "Game Frame", "Flat", "Timer Type"]
        answer_index: 1
        explain: "Game Frame and Rendering Frame modes compute per-frame inclusive durations; Instance mode works per timer instance."
      - q: "What shortcut opens the Quick Find panel when the Timing view has focus?"
        choices: ["CTRL+F", "CTRL+Q", "F3", "SHIFT+F"]
        answer_index: 0
        explain: "Quick Find opens from the Timing panel context menu or with CTRL+F, and lets you build filters for events."
      - q: "You want CPU context switches in the trace. What must you do?"
        choices: ["Enable it in Project Settings", "It is always recorded", "Turn on stat unit", "Run with the ContextSwitch trace channel in -trace="]
        answer_index: 3
        explain: "Some workflows are off by default. You add channels like ContextSwitch or Task to the -trace= command line parameter."
    flavors:
      _default: {why: "Timing Insights turns a vague 'it hitches' into one named function you can fix."}
      programming: {why: "Insights is the main CPU profiler in UE, and Callers/Callees is how you find who caused the spike.", do: "Export the selected timers with CTRL+S to a .csv and attach it."}
      tech_art: {why: "Spikes often come from spawning or material work; Insights shows which one.", do: "Also plot the GPU track and compare to the Game thread."}

  - id: PQ104
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [profiling, stat-commands, session-frontend]
    required_spine: false
    required: false
    title: "Stat groups and a trace"
    brief: "A stat command is a console command that shows live numbers about the running game on the screen, such as the time spent in ticks. The stats are sorted into groups. They are the fastest way to see what your game is doing right now. To study a session later, you record a trace and open it in Unreal Insights. Older versions recorded stat files for the Profiler tab of the Session Frontend, but that tab no longer exists in the current engine. In this quest you try several stat groups, record a trace, and open it in Unreal Insights."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/stat-commands-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/introduction-to-performance-profiling-and-configuration-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Start Play In Editor (PIE), open the console and run stat Help. Then run stat List Groups and note three groups that you did not know."
      - "Make an Actor Blueprint named BP_StatTest that does a little work on Event Tick, for example a loop that adds numbers, and place it in the level. Run stat Game, stat TickGroups and stat Dumpticks. Find the tick of BP_StatTest in the output."
      - "Run stat Levels in a level that has at least one streaming sub-level. To add one, open Window > Levels and create a new sub-level from the Levels menu. Note the colour of each level in the list."
      - "Record a trace: click Trace in the bar at the bottom of the editor window and choose Start Trace. You can also open Tools > Session Frontend, go to the Trace Control tab and click Start Trace there. Play for 20 seconds, stop playing, and then stop the trace."
      - "Open the trace in Unreal Insights: in the Trace menu, choose Unreal Insights (Session Browser) and open the newest trace in the list. Go to the Timing Insights window and open the Timers panel."
      - "Sort the timers by time and find the most expensive Game thread timer in the capture. Write it down."
    done_when: "Send two screenshots: the Editor viewport with stat Game and stat Levels visible, and Unreal Insights with your trace loaded and the Timers panel visible. Add the name of the most expensive timer."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which command lists every stat command?"
        choices: ["stat All", "stat Help", "stat Quick", "stat Engine"]
        answer_index: 1
        explain: "stat Help lists all stat commands. stat List shows groups or sets of statistics."
      - q: "Which stat command dumps info about tick functions?"
        choices: ["stat Dumpticks", "stat TickGroups", "stat Game", "stat Tickables"]
        answer_index: 0
        explain: "stat Dumpticks dumps info about tick functions. stat TickGroups shows performance per tick group."
      - q: "In stat Levels, a level shown in blue means what?"
        choices: ["Loaded and visible", "Loaded but not visible", "Pre-loading", "Unloaded but still in memory until garbage collection"]
        answer_index: 3
        explain: "Blue means the level is unloaded but still in memory; it is cleaned up when garbage collection runs. Green is loaded and visible."
      - q: "In the current engine, which tab of the Session Frontend lets you start and stop a trace?"
        choices: ["Automation", "Console", "Trace Control", "Screen Comparison"]
        answer_index: 2
        explain: "The Session Frontend has the tabs Session Browser, Trace Control, Console, Automation and Screen Comparison. Trace Control has the Start Trace and Stop Trace commands. The old Profiler tab no longer exists."
      - q: "You stopped playing but forgot to stop the trace. What is the risk?"
        choices: ["The trace is deleted", "Nothing, a trace always stops together with PIE", "The trace keeps recording the editor and its file keeps growing", "The Editor crashes"]
        answer_index: 2
        explain: "A trace that you started from the editor records the editor process, not only the PIE session. It keeps running until you stop it, so the file keeps growing."
      - q: "Which tool opens a recorded trace for analysis?"
        choices: ["Unreal Insights", "The Output Log", "The Material Editor", "The Blueprint Debugger"]
        answer_index: 0
        explain: "Unreal Insights opens traces. Its Timing Insights window shows the frames, the threads and the timers of the recording."
      - q: "Which stat command is the recommended starting point to decide where to profile?"
        choices: ["stat Memory", "stat Object", "stat RHI", "stat Unit"]
        answer_index: 3
        explain: "stat Unit shows overall frame time plus game thread, render thread and GPU times; the docs call it a great starting point."
      - q: "Which stat is described as the single most important one for rendering-thread performance?"
        choices: ["Visible section count under stat InitViews", "Frame time under stat Unit", "Draw calls under stat RHI", "Triangle count under stat Engine"]
        answer_index: 0
        explain: "stat InitViews notes that Visible section count is the most important stat for rendering-thread performance."
    flavors:
      _default: {why: "Stat commands are the fastest way to see what your game is doing right now."}
      programming: {why: "Knowing the groups lets you check one system without a full trace.", do: "Add a console command in BP that toggles your three favourite stat groups."}
      level_design: {why: "stat Levels shows if your streaming setup really unloads.", do: "Use stat Levels to check a sub-level goes from green to red after you leave its volume."}

  - id: PQ105
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [debugging, visual-logger, cpp]
    required_spine: false
    required: false
    title: Draw your bug with the Visual Logger
    brief: "The Visual Logger records what your actors do during play, so that you can go back in time after a bug happened. From C++ you can send it text and also shapes, such as arrows and cones, which it draws in the level at the moment they were logged. This makes rare bugs much easier to find. In this quest you add Visual Logger calls to a C++ actor and look at the recording."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/visual-logger-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open a C++ project, or create one from the Third Person template with C++ selected. You need an IDE such as Visual Studio to compile. Use a C++ actor of your own that fires at a target, or make a simple one named AProjectileTurret with a Fire function that picks a target location in front of it and is called from a timer every 2 seconds. Add IVisualLoggerDebugSnapshotInterface to the list of classes that it inherits from."
      - "Override GrabDebugSnapshot and put it inside #if ENABLE_VISUAL_LOG. In it, add one category with two values: the target name and the cooldown."
      - "In the fire function, call UE_VLOG with a log category and the verbosity Verbose to log the target and its location."
      - "Add UE_VLOG_LOCATION for the target point, and UE_VLOG_ARROW to draw an arrow from the muzzle to the target."
      - "Add UE_VLOG_CONE for the detection cone. It takes the origin, direction, length, angle and colour."
      - "Open Tools > Debug > Visual Logger. Play in PIE and fire. Then stop and drag the timeline to move through the recording."
      - "Select your actor in the Actor list and expand your snapshot category."
    done_when: "Send a screenshot of the Visual Logger with your actor selected, your snapshot category expanded, and the arrow and cone shapes visible in the viewport at the time you moved to."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Which interface must an actor implement to add data to the Actor Snapshot view?"
        choices: ["IVisualLoggerDebugSnapshotInterface", "IGameplayDebuggerInterface", "IVisualLogSnapshot", "IDebugDrawInterface"]
        answer_index: 0
        explain: "The interface has one function, GrabDebugSnapshot, which you override to feed data to the Visual Logger."
      - q: "Why wrap GrabDebugSnapshot code in #if ENABLE_VISUAL_LOG?"
        choices: ["It makes the code run faster", "It only runs in builds with Visual Logging enabled", "It is required by the compiler for all interfaces", "It enables replication"]
        answer_index: 1
        explain: "GrabDebugSnapshot should only exist in builds that support Visual Logging, so the docs recommend checking that macro."
      - q: "Do you need #if ENABLE_VISUAL_LOG around a UE_VLOG call?"
        choices: ["Yes, always", "Yes, but only in Shipping", "No, the macro removes itself in builds without Visual Logging", "No, but it will crash in Shipping"]
        answer_index: 2
        explain: "UE_VLOG cleanly removes itself from compilation in builds that do not support the system, so it is safe on its own."
      - q: "You want the same message in the Visual Logger and in the standard log. Which macro?"
        choices: ["UE_VLOG_UELOG", "UE_LOG_VISUAL", "UE_VLOG_TEXT", "UE_DUAL_LOG"]
        answer_index: 0
        explain: "UE_VLOG_UELOG sends a duplicate message to the standard log instead of calling UE_VLOG and UE_LOG separately."
      - q: "Your actor calls the Visual Logger twice in the same frame. What happens to the first call's data?"
        choices: ["Both are stored as a list", "The second call is ignored", "The first data is overwritten", "The engine asserts"]
        answer_index: 2
        explain: "Multiple visual logging calls in the same frame from the same actor overwrite the previously captured data."
      - q: "Which macro draws a sphere?"
        choices: ["UE_VLOG_SPHERE", "UE_VLOG_OBOX", "UE_VLOG_CAPSULE", "UE_VLOG_LOCATION"]
        answer_index: 3
        explain: "UE_VLOG_LOCATION draws a sphere from a location, radius and colour. There is no UE_VLOG_SPHERE macro on the page."
      - q: "Which extra parameters does UE_VLOG_CONE need?"
        choices: ["Center, half-height, radius, rotation, colour", "Start, end, radius, colour", "Origin, direction, length, angle in degrees, colour", "Tail, head, colour"]
        answer_index: 2
        explain: "A cone needs origin point, direction, length, angle in degrees and colour. Start/end/radius is a cylinder."
      - q: "Text logged with UE_VLOG shows in the Text Window for how long?"
        choices: ["Until the session ends", "Until the next UE_VLOG from any actor", "For 5 seconds", "Only in the frame it was logged"]
        answer_index: 3
        explain: "The Text Window shows information per frame, so only text logged in the current frame appears as you scrub."
    flavors:
      _default: {why: "A recorded log with shapes lets you find a rare bug after it happened, not while you watch."}
      programming: {why: "Snapshots plus shapes give you a replayable picture of your system's state every frame.", do: "Add a UE_VLOG_SEGMENT_THICK for the last hit trace and colour it red on miss."}
      gameplay_design: {why: "You can see exactly why an AI or turret made a choice.", do: "Ask your programmer for one shape that shows a decision you care about."}

  - id: PQ106
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [debugging, gameplay-debugger, cpp]
    required_spine: false
    required: false
    title: A custom Gameplay Debugger category
    brief: "The Gameplay Debugger is the overlay that shows live data about a selected actor during play. It sorts its data into categories, such as Navmesh and AI, and it also works on clients in a network game. With C++ you can add a category that shows your own data. The documentation page still describes an older way to do this, with component classes and an .ini file. The current engine uses a category class that you register in code. In this quest you add one category named MyData that shows a single value."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-the-gameplay-debugger-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-debugger-settings-in-the-unreal-engine-project-settings"
    checklist:
      - "Open a C++ project, or create one from the Third Person template with C++ selected. You need an IDE such as Visual Studio to compile. Add GameplayDebugger to the dependency modules in the Build.cs file of the project. Place a NavMeshBoundsVolume and an AI pawn in a level. A copy of the template character with its input removed, which walks to a point with AI Move To, is enough."
      - "In PIE, point at the AI pawn and press the apostrophe key to open the Gameplay Debugger. Use the keys of the numeric keypad to switch categories on and off."
      - "Open the file Engine/Source/Runtime/GameplayDebugger/Public/GameplayDebuggerCategory.h in your engine folder and read the comment at the top. It explains the two sides of a category: CollectData runs where the game has authority and gathers the data, and DrawData runs locally and shows it."
      - "Create a class named FGameplayDebuggerCategory_MyData that derives from FGameplayDebuggerCategory, inside an #if WITH_GAMEPLAY_DEBUGGER block. Override CollectData(APlayerController* OwnerPC, AActor* DebugActor). In it, read one value from the debug actor, for example its speed, and call AddTextLine with a colour tag, such as {red}Speed: {white} followed by the number."
      - "Give the class a static function named MakeInstance that returns a new instance as a TSharedRef<FGameplayDebuggerCategory>. Register the category when your game module starts: call IGameplayDebugger::Get().RegisterCategory with the name MyData, a delegate made with IGameplayDebugger::FOnGetCategory::CreateStatic for MakeInstance, and the state EGameplayDebuggerCategoryState::EnabledInGameAndSimulate. Then call NotifyCategoriesChanged. Call UnregisterCategory when the module shuts down."
      - "Build the project. Play, select the AI pawn with the apostrophe key, and find MyData in the category list at the top of the overlay. Check that your value is shown in colour."
      - "Open Project Settings, go to Gameplay Debugger, and look at the Input section to see the activation key."
    done_when: "Send a screenshot taken in Play mode with the Gameplay Debugger overlay that shows your MyData category and your value in colour. Also send a screenshot of your code that registers the category."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Which key opens the Gameplay Debugger by default?"
        choices: ["Tilde (~)", "Apostrophe (')", "Semicolon (;)", "F8"]
        answer_index: 1
        explain: "The apostrophe key or the EnableGDT cheat activates it. Semicolon opens the Debug Camera."
      - q: "Why does the Gameplay Debugger only replicate data from enabled categories?"
        choices: ["To save replication channel bandwidth", "Because disabled categories are not compiled", "To avoid crashes on clients", "Because only the server can see categories"]
        answer_index: 0
        explain: "Only enabled categories are replicated, which saves the replication channel's bandwidth."
      - q: "Which function of a category runs on the side that has authority (the server, or a standalone game) to gather the data?"
        choices: ["DrawData", "OnDataPackReplicated", "CreateDebugSceneProxy", "CollectData"]
        answer_index: 3
        explain: "CollectData is called in the category that has authority. The text lines and shapes that it adds are replicated, so a client can see the state of the server."
      - q: "Can you extend the Gameplay Debugger with Blueprint only?"
        choices: ["Yes, with a Blueprint subclass", "Yes, with an Editor Utility Widget", "No, it can only be extended with C++", "Only in Simulate mode"]
        answer_index: 2
        explain: "The page says it can only be extended with C++. Blueprint projects can use it as-is."
      - q: "Which function of a category runs locally on every tick to show the gathered data?"
        choices: ["CollectData", "DrawData", "AddShape", "MarkDataPackDirty"]
        answer_index: 1
        explain: "DrawData is called locally in every tick to present the data. Everything added with AddTextLine and AddShape is shown before DrawData is called."
      - q: "Where do you tell the current engine about your custom category?"
        choices: ["Project Settings > Input", "DefaultGame.ini under [Debug]", "In code, with IGameplayDebugger::Get().RegisterCategory, best in the startup of the module that owns the category", "The GameMode class defaults"]
