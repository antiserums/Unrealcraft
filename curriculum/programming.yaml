  - id: PQ48
    rank: 1
    difficulty: apprentice
    specializations: [programming]
    subjects: [config, ini, project-settings]
    required_spine: false
    required: false
    title: Read and edit config .ini files
    brief: "Unreal saves its settings in plain text files that end in .ini, called config files. Each file has sections with a name in square brackets, and under each section there are lines in the form KEY=VALUE. Every change you make in Project Settings ends up in one of these files, so reading them lets you see and share settings exactly. In this quest you read some config files, add your own test value, and read it back in the editor."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/configuration-files-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/project-settings-in-unreal-engine"
    community_urls: []
    checklist:
      - "Use any project, or create one from the Third Person template. Close the Editor. Open the folder <ProjectDirectory>\\Config and look at its files with a text editor. List the Default*.ini files you find (DefaultEngine, DefaultGame, DefaultInput, and so on)."
      - "In DefaultEngine.ini, find the section [/Script/EngineSettings.GameMapsSettings] and, inside it, the key GameDefaultMap."
      - "Open the engine file Engine\\Config\\BaseEngine.ini. Only read it and do not edit it. Find the same section and compare the two values."
      - "In DefaultGame.ini, add your own section [MyTestSection] with the line MyValue=42 under it. Above it, add a comment line that starts with ; (a semicolon)."
      - "Open the Editor. In the console, type: GetIni Game:MyTestSection MyValue. Confirm that the value 42 is printed."
      - "In Project Settings, change one setting (for example Project Name). Close the editor and check that DefaultGame.ini changed."
    done_when: "Send one screenshot of DefaultGame.ini that shows your [MyTestSection], and a second screenshot of the Output Log with the GetIni result."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "What is the basic structure of a config file?"
        choices: ["JSON objects with keys and values", "Sections in [brackets], each holding KEY=VALUE lines", "XML tags with attributes", "One value per line, no sections"]
        answer_index: 1
        explain: "Config files contain lists of key-value pairs organized into sections. Every variable must belong to a [SECTION] and use KEY=VALUE."
      - q: "How do you write a comment in an .ini file?"
        choices: ["Start the line with //", "Start the line with #", "Start the line with ;", "Wrap the line in /* */"]
        answer_index: 2
        explain: "Prepend a semicolon ( ; ) to any line to make a comment. This also works for commenting out a key-value pair."
      - q: "A key exists in Engine/Config/BaseEngine.ini and also in your project's Config/DefaultEngine.ini. Which value wins?"
        choices: ["The project DefaultEngine.ini value, because later files in the hierarchy override earlier ones", "The BaseEngine.ini value, because engine files always win", "Both are used at the same time", "Neither; the engine reports a conflict error"]
        answer_index: 0
        explain: "Files in the same category form a hierarchy. Later files override earlier ones. The project DefaultEngine.ini comes after the engine BaseEngine.ini, so its value wins."
      - q: "In a config file, what does the line +MyArray=Value do?"
        choices: ["Empties the array", "Removes Value from the array", "Appends Value even if it already exists", "Appends Value only if it is not already in the array"]
        answer_index: 3
        explain: "The + operator appends the value if it does not exist yet. The . operator appends even duplicates, - removes, and ! empties the array."
      - q: "Which console command shows the value of a config setting from the loaded config files?"
        choices: ["ShowIni", "GetIni", "DumpConfig", "PrintSetting"]
        answer_index: 1
        explain: "GetIni [Platform@]IniFile:Section Key prints the value of a configuration setting. It only searches loaded configuration files."
      - q: "In C++, how do you make a member variable load its value from the config hierarchy automatically?"
        choices: ["Mark the class UCLASS(config=Game) and the variable UPROPERTY(Config)", "Call LoadConfig() in the constructor", "Name the variable the same as the ini key", "Mark the variable UPROPERTY(EditAnywhere)"]
        answer_index: 0
        explain: "You set the config category in the UCLASS (for example config=Game) and mark the variable UPROPERTY(Config). Then a [/Script/Module.Class] section in that category sets it."
    flavors:
      _default: {why: "Every Project Setting ends up in a text file. Reading .ini files lets you see and share settings exactly."}
      programming: {why: "Config files are how you ship default values, override them per platform, and expose your own C++ settings.", do: "Add a UPROPERTY(Config) int32 to one of your C++ classes with UCLASS(config=Game), set it in DefaultGame.ini, and log the value at BeginPlay."}
      tech_art: {why: "Rendering and scalability defaults live in .ini files. Knowing the hierarchy helps you debug why a setting does not stick.", do: "Find the [/Script/Engine.RendererSettings] section in DefaultEngine.ini and list three keys you recognise from Project Settings > Rendering."}

