    title: Interfaces that answer back
    brief: "A Blueprint Interface is a list of function names that different Actors can each answer in their own way. Interface functions can also return values, so one system can ask many kinds of Actors the same question, such as \"Can I use you?\", without any Cast node. In this quest you build a Usable interface with functions that return data, implement it in a parent, a child and an unrelated Actor, and call it from the player."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/implementing-blueprint-interfaces-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-interface-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/DoesObjectImplementInterface"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-communication-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a Blueprint Interface named BPI_Usable with three functions: CanUse with a Boolean output, GetPrompt with a Text output, and Use with an input named Instigator of the type Actor Object Reference. An object reference input cannot have a default value, so the caller must always pass the Instigator."
      - "Make an Actor Blueprint named BP_UsableBase that implements BPI_Usable. Implement CanUse so that it returns true, and GetPrompt so that it returns the text Use. Click Compile."
      - "Make BP_Chest as a child of BP_UsableBase. Open the inherited GetPrompt function, right-click its entry node and choose Add Call to Parent Function. Append the word Chest to the text that the parent returns. Then override CanUse so that it returns false after the first Use."
      - "Make an Actor Blueprint named BP_Vendor that has no parent Blueprint and also implements BPI_Usable. Make it return a different prompt and print a line in Use."
      - "In the player character, BP_ThirdPersonCharacter, add a Sphere Collision component with Radius 200. On its begin overlap event, call Does Object Implement Interface with BPI_Usable on the Other Actor and store the actor in a variable. If the result is true, call CanUse and GetPrompt with the Interface call type and show the prompt with Print String. On the E key, call Use (Message) on the stored actor with the player as Instigator."
      - "Place BP_Chest, BP_Vendor and a plain cube in the level and press Play. The cube should give no prompt, the chest prompt should show the parent text plus Chest, and after one Use the chest should report CanUse = false."
      - "Open Class Settings on BP_Chest and take a screenshot of the Inherited Interfaces list."
    done_when: "Send a screenshot of the GetPrompt graph of BP_Chest with the Parent call node, and a screenshot in Play mode that shows the prompt text and the CanUse result after the first Use."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "A Blueprint Interface function has outputs but no implementation. Where does its behaviour come from?"
        choices: ["From the interface asset's own graph", "From each Blueprint that implements it and fills in the function graph", "From the Blueprint that calls it", "From the Class Default Object of the interface"]
        answer_index: 1
        explain: "Interface functions are only a definition of inputs and outputs. Every implementing Blueprint gives them its own body."
      - q: "You call a function with the Message call type on an object that does not implement the interface. What happens?"
        choices: ["The Blueprint compiler reports an error", "The engine crashes with an assert", "The object is cast to the interface automatically", "The call fails silently"]
        answer_index: 3
        explain: "The docs say Message calls work on any object; if the object lacks the interface the call fails silently. It is also slower than the Object and Interface call types."
      - q: "Which call type is the right one when your pin already holds a reference of the interface type?"
        choices: ["Message", "Object", "Interface", "Cast To"]
        answer_index: 2
        explain: "The Interface variant calls on an object that implements this interface. Object calls on an object of a given class that implements it, and Message works on anything."
      - q: "BP_Chest is a child of BP_UsableBase, which implements BPI_Usable. Where does BPI_Usable show up in BP_Chest's Class Settings?"
        choices: ["Under Inherited Interfaces, filled automatically", "Under Implemented Interfaces, added by hand", "It does not show, only the parent lists it", "Under Imports"]
        answer_index: 0
        explain: "The Inherited Interfaces section fills itself with interfaces that come from the parent Blueprint or C++ class."
      - q: "A child Blueprint implements an interface function that the parent already implemented. By default, what runs when the function is called on the child?"
        choices: ["Both bodies, parent first", "Only the parent body", "Only the child body, because it overrides the parent", "The compiler refuses the duplicate"]
        answer_index: 2
        explain: "Blueprint implementations of interface functions override parent implementations by default. Use Add Call to Parent Function if you also want the parent body."
      - q: "How do you run the parent's implementation before your own code in an overridden interface function?"
        choices: ["Call the function on Self at the start", "Right-click the entry node and choose Add Call to Parent Function", "Mark the function Pure", "Turn on Replicates in Class Settings"]
        answer_index: 1
        explain: "The docs show the Parent node added from the entry node's right-click menu. Your extra nodes go after the Parent call."
