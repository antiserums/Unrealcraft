    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Which statement about an actor's transform is correct?"
        choices: ["The actor stores its own location and the components copy it", "The actor's location, rotation and scale come from its root component", "Every component stores the actor's transform", "Only Primitive Components can give an actor a transform"]
        answer_index: 1
        explain: "Actors do not store transform data. The transform of the actor's Root Component (a Scene Component) is used instead."
      - q: "A Rotating Movement Component has no position in the world. Which component family is it in?"
        choices: ["Primitive Component", "Scene Component", "Actor Component (no transform)", "Child Actor Component"]
        answer_index: 2
        explain: "Actor Components (UActorComponent) are for abstract behaviors such as movement or inventory. They have no transform, so no location or rotation in the world."
      - q: "What is the difference between a Scene Component and a Primitive Component?"
        choices: ["A Primitive Component is a Scene Component that also has geometry to render or collide with", "A Scene Component can render meshes, a Primitive Component cannot", "A Primitive Component has no transform", "There is no difference; the names are aliases"]
        answer_index: 0
        explain: "Scene Components have a transform but no geometry (spring arms, cameras, audio). Primitive Components are Scene Components with geometric representation, like meshes and collision shapes."
      - q: "You move a parent component in the Blueprint viewport. What happens to its children?"
        choices: ["Nothing; each component moves alone", "They are detached", "They move with the parent, because transforms propagate down to all child components", "They snap back to the root"]
        answer_index: 2
        explain: "Transforming, rotating or scaling a parent component propagates the change to all of its child components."
      - q: "How can you quickly rename a component in the Components window?"
        choices: ["Double-click the viewport", "Select it and press F2", "Right-click and choose Compile", "Press Delete and add it again"]
        answer_index: 1
        explain: "The docs say you can quickly rename a component by selecting it in the Components window and pressing F2. The Variable Name field in Details also works."
      - q: "Which of these can you drag from the Content Browser straight into the Components window to make a component?"
        choices: ["A Material", "A Level", "A Texture", "A Static Mesh"]
        answer_index: 3
        explain: "Dragging assets into the Components window works for Static Meshes, Sound Cues, Skeletal Meshes and Particle Systems."
    flavors:
