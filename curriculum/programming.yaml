  - id: PQ65
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [components, scene-component, attachment, architecture, blueprint]
    required_spine: false
    required: false
    title: A Scene Component with a job
    brief: "A Scene Component is a component that has a transform, which means a position, rotation and scale, but no visible shape. Other components can be attached under it and then follow it. When you write your own Scene Component, you can pack movement or placement logic into a part that any Actor can reuse. In this quest you write a component that moves in a circle around its parent, and you use it to make spheres orbit each other."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/components-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Components/Tick/SetComponentTickEnabled"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-blueprint-classes-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a Blueprint Class with Scene Component as the parent and name it BPC_Orbit. Add the float variables Radius (150), Speed (90) and Angle."
      - "In BPC_Orbit, on Event Tick, add Speed times Delta Seconds to Angle. Then call Set Relative Location with (cos(Angle) * Radius, sin(Angle) * Radius, 0). This makes the component move itself in a circle around its parent."
      - "Make an Actor Blueprint named BP_Planet with a Static Mesh sphere as the root. Add BPC_Orbit as a child of the root, and add a second, smaller sphere Static Mesh as a child of BPC_Orbit. Press Play and check that the small sphere orbits."
      - "Add a second BPC_Orbit under the first small sphere, with a third mesh under it. Notice that the tree now goes root, Orbit, mesh, Orbit, mesh, and that each orbit uses the transform of its parent."
      - "In BP_Planet, add an event for the T key that calls Set Component Tick Enabled (false) on the first BPC_Orbit, and an event for the Y key that sets it to true. An Actor only receives key presses when input is enabled for it, so open Class Defaults and set Auto Receive Input to Player 0. Press Play and confirm that the outer orbit stops and starts again."
      - "Add an event for the A key that spawns a new BP_Planet. Use Attach Component to Component (or Attach Actor to Component) to attach it under the outer mesh while the game runs. Confirm that it follows."
      - "Write three lines: why BPC_Orbit must be a Scene Component and not an Actor Component, why the mesh needs BPC_Orbit as its parent, and one thing that would need a Primitive Component instead."
    done_when: "Send a screenshot of the Components tree of BP_Planet that shows both BPC_Orbit levels, a screenshot in Play mode of the orbiting spheres, and your three lines."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which component class is the smallest one that has a transform (location, rotation, scale)?"
        choices: ["Actor Component", "Scene Component", "Primitive Component", "Static Mesh Component"]
        answer_index: 1
        explain: "Actor Components have no transform. Scene Components add a transform; Primitive Components add geometry on top of that."
      - q: "Why can a mesh attach under BPC_Orbit, but not under a plain Actor Component?"
        choices: ["Actor Components cannot tick", "Actor Components are always the root", "Meshes can only attach to other meshes", "Only Scene Components can attach to each other, because attachment needs transforms"]
        answer_index: 3
        explain: "The docs say only Scene Components can attach to one another, because the parent-child relation is described by transforms."
      - q: "How many parents can one Scene Component have?"
        choices: ["Exactly one, or none if placed directly in the world", "Any number", "Two, one for location and one for rotation", "One per tick group"]
        answer_index: 0
        explain: "A Scene Component can have many children but only one parent, and attachment cycles are not supported."
      - q: "What does making a Scene Component the root of the actor mean?"
        choices: ["It ticks first", "It cannot have children", "The actor's world location, rotation and scale come from that component", "It becomes a Primitive Component"]
        answer_index: 2
        explain: "The actor's transform is drawn from its root Scene Component."
      - q: "Which attach method is right during play, after the components already exist and are registered?"
        choices: ["SetupAttachment", "AttachToComponent", "RegisterComponent", "MarkRenderStateDirty"]
        answer_index: 1
        explain: "SetupAttachment is for constructors and unregistered components. AttachToComponent attaches immediately and is meant for use during play."
      - q: "Which component types create a physics state by default?"
        choices: ["Actor Components only", "Scene Components only", "All components", "Primitive Components"]
        answer_index: 3
        explain: "Actor and Scene Components have no physics state by default. Primitive Components do, because they carry geometry for collision."
      - q: "You create and register a component during play. What does the docs page warn about?"
        choices: ["Registering during play can impact performance, so do it only when necessary", "It will not render until the level restarts", "It cannot be attached afterwards", "It skips BeginPlay forever"]
        answer_index: 0
        explain: "Registration happens automatically for spawn-time components. Manual registration during play is possible but has a performance cost."
      - q: "Several Static Mesh Actors in a level are only containers for their meshes. Which Convert Selection to Blueprint Class method fits best?"
        choices: ["New Subclass", "Child Actors", "Harvest Components", "Data-Only"]
        answer_index: 2
        explain: "Harvest Components pulls all the meshes into one actor with many components. It is meant for actors that are mostly component containers."
    flavors:
      _default: {why: "A Scene Component packages movement or placement logic that any actor can reuse in its tree."}
      tech_art: {why: "Reusable transform behaviours keep rigs and effects out of every actor's Event Graph.", do: "Expose Radius and Speed as instance-editable and drive them from a Curve."}
      gameplay_design: {why: "Orbiting shields, satellites and camera rigs are the same component with different numbers.", do: "Use BPC_Orbit to make a shield orb that circles the player."}

  - id: PQ66
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [blueprint, functions, libraries, math-expression, architecture]
    required_spine: false
    required: false
    title: Pure helpers and Math Expression
    brief: "A pure function is a helper that only calculates and returns a value and does not change anything in the game. The Math Expression node lets you type a formula as text, and Unreal builds the math nodes for you. Functions also have access rules (Public, Protected, Private) that decide which Blueprints may call them. In this quest you build a small library of helpers, write formulas with Math Expression, and test the access rules."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/functions-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/math-expression-node-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-function-libraries-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Create a Blueprint Function Library named BFL_Gameplay. Add a Pure function named MapRange01 with the float inputs Value, InMin and InMax and a float output named Alpha. Build it with one Math Expression node that has this formula: clamp((value-inMin)/(inMax-inMin),0,1)."
      - "Add a Pure function named RingPosition with the inputs Center (Vector), Radius (float) and AngleDeg (float), and a Vector output named Pos. Use a Math Expression with vector(...) and sin/cos. Double-click the node and take a screenshot of the sub-graph that Unreal generated."
      - "Add an impure function (not Pure) named ApplyKnockback with the inputs Target (Actor) and Force (Vector). Give it the Category Gameplay and a Description. It calls Add Impulse on the root of the target if the root simulates physics."
      - "Add a function named TallyHits with an Integer input that is passed by reference. To do this, expand the input and tick Pass-by-Reference. The function adds 1 to the input. Call it three times from one actor and print the variable."
      - "Make an Actor Blueprint named BP_Turret with a function named Aim that is Protected and a function named Fire that is Private. Make BP_TurretChild as a child of it and try to call both functions from its graph. Note which call compiles."
      - "In BP_TurretChild, call RingPosition on Tick for 8 angles and use Draw Debug Sphere at each result. Press Play and check that the spheres form a ring."
    done_when: "Send a screenshot of the Math Expression sub-graph for RingPosition and a screenshot in Play mode of the debug ring. Add one line that says which turret function the child could call."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "A function is set to Protected. Who can call it?"
        choices: ["Any object", "Only the current Blueprint", "The current Blueprint and Blueprints that derive from it", "Only the Level Blueprint"]
        answer_index: 2
        explain: "Protected allows the current Blueprint and any child Blueprints. Private allows only the current Blueprint. Public is the default."
      - q: "What is the main promise of a Pure function?"
        choices: ["It does not modify state or class members", "It runs faster than an impure one", "It never returns a value", "It runs once per frame"]
        answer_index: 0
        explain: "Pure functions promise not to modify state; they are typical for getters and operators. Impure functions may change state and need an exec wire."
      - q: "You type the expression (1+x)*sin(myVar) into a Math Expression node and the Blueprint has no variable named x or myVar. What appears on the node?"
        choices: ["A compile error", "Two new class variables", "Nothing until you add the variables", "Two float input pins, X and MyVar"]
        answer_index: 3
        explain: "An alphabetic name that is not an existing variable or a function call becomes a float input pin on the node."
      - q: "Which of these is NOT supported inside a Math Expression node?"
        choices: ["clamp(y,0,20)", "vector(x,y,z)", "a ? b : c", "x >= 3 && y < 2"]
        answer_index: 2
        explain: "The conditional operator ?: is listed as unsupported, along with bitwise, unary prefix and postfix operators. Comparison and logical operators are supported."
      - q: "What is a Math Expression node under the hood?"
        choices: ["A C++ function compiled at edit time", "A collapsed graph that is regenerated when you rename the node", "A material expression", "A macro library entry"]
        answer_index: 1
        explain: "The node acts like a collapsed graph. Renaming it parses the new expression and builds a new sub-graph."
      - q: "Which inputs and outputs can a Function have, compared to a Macro?"
        choices: ["Only data pins, no execution pins", "Only execution pins", "Any number of execution inputs", "Wildcard pins only"]
        answer_index: 0
        explain: "Unlike Macros, Functions can only add data inputs and outputs. They always have one entry and one exec output."
      - q: "Where do you turn on Pass-by-Reference for a function input?"
        choices: ["In the call node's right-click menu", "In Class Settings", "It is always on for Integers", "By expanding the parameter entry in the function's Details tab"]
        answer_index: 3
        explain: "The docs say you expand the parameter entry to set a default value and whether it is passed by reference."
      - q: "The library page says a helper that is called very often would be better written where?"
        choices: ["In the Level Blueprint", "In C++ as a function library, for performance", "As a Blueprint Macro", "As an Event Dispatcher"]
        answer_index: 1
        explain: "The example notes that a Blueprint version is possible, but if it is called often the C++ version gives better performance."
    flavors:
      _default: {why: "Small pure helpers with clear access rules keep big Blueprints readable and safe to change."}
      tech_art: {why: "Math Expression nodes replace long chains of math nodes in tools and procedural setups.", do: "Rewrite one existing 10-node math chain as a single Math Expression."}
      gameplay_design: {why: "Remap and ring helpers are the bread and butter of tuning and spawning.", do: "Use MapRange01 to drive a health-bar colour."}

  - id: PQ67
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [blueprint, references, soft-references, async-loading, memory, architecture]
    required_spine: false
    required: false
    title: Soft references and Async Load
    brief: "A normal (hard) reference to an asset makes Unreal load that asset together with the Blueprint that uses it. A soft reference only stores the path of the asset, so the asset stays out of memory until you ask for it. Async Load Asset loads it in the background, so the game does not freeze while it loads. This decides what your game loads at the start and what it loads later. In this quest you compare hard and soft references and load a mesh and a class only when a key is pressed."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/asynchronous-asset-loading-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/referencing-assets-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/AsyncLoadAsset"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/AsyncLoadClassAsset"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/LoadAssetBlocking"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/IsValidSoftObjectReference"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make an Actor Blueprint named BP_Showcase with a Static Mesh Component, and set Auto Receive Input to Player 0 in its Class Defaults so that it receives key presses. Add a variable named HeavyMesh with the type Static Mesh, choose Soft Object Reference, and make it Instance Editable."
      - "Place a copy in the level and assign a mesh to HeavyMesh on that copy. In a real game this would be a large mesh. For the test any mesh works, for example SM_Ramp from the folder LevelPrototyping/Meshes of the template."
      - "Right-click BP_Showcase in the Content Browser and open the Reference Viewer, which shows the assets it depends on. Take a screenshot. Then change HeavyMesh to a hard Object Reference, assign the mesh again, and take a second screenshot of the Reference Viewer. Compare the two."
      - "Set the variable back to Soft Object Reference. Add an event for the L key: first check Is Valid Soft Object Reference, then call Async Load Asset. On its Completed pin, call Set Static Mesh with the loaded object and print Loaded."
      - "Add a variable named SpawnClass with the type Actor and choose Soft Class Reference. Add an event for the K key that calls Async Load Class Asset and then uses Spawn Actor from Class with the result at the location of the actor."
      - "Add an event for the B key that uses Load Asset Blocking instead. Open stat unit, and press B right after you start a fresh Play In Editor session. Then start again and press L. Write one line that says which one made the game hitch."
      - "Add a second soft mesh variable and load both meshes one after the other. Write two lines: why the loaded mesh stays in memory after Set Static Mesh, and what would happen to a loaded object that nothing holds a hard reference to."
    done_when: "Send the two Reference Viewer screenshots (one with the soft reference and one with the hard reference), a screenshot in Play mode after the async load, and your three lines."
    xp: 60
    verify_type: writeup
    quiz:
      - q: "An actor Blueprint has a hard reference to a big mesh. When is that mesh loaded?"
        choices: ["Only when Set Static Mesh runs", "Never, until Async Load Asset", "Only in packaged builds", "When the actor is placed or its Blueprint is loaded, together with everything it references"]
        answer_index: 3
        explain: "Hard references load the referenced asset when the referencing object loads. Careless hard references can load almost everything at startup."
      - q: "What does a soft reference store instead of a direct pointer?"
        choices: ["A copy of the asset", "The full path name of the asset as a string", "An index into the level", "A Class Default Object"]
        answer_index: 1
        explain: "A soft object path is a simple struct with the full asset name. It handles cooking and redirects, so it also works on devices."
      - q: "A designer must pick an asset in the Details panel, but the asset must not load until needed. Which variable type is right?"
        choices: ["Object Reference", "Class Reference", "Soft Object Reference", "Name"]
        answer_index: 2
        explain: "Soft references show the same picker UI as a hard reference but do not load the asset until you load it yourself."
      - q: "What is the risk of Load Asset Blocking on a big asset during play?"
        choices: ["It stalls the game thread and causes a hitch", "It returns a wrong type", "It loads the asset twice", "It fails in packaged builds"]
        answer_index: 0
        explain: "The node description says blocking loads cause hitches and Async Load Asset should be used if possible."
      - q: "Async Load Asset has an Out pin and a Completed pin. Where should Set Static Mesh be connected?"
        choices: ["Out, because the object is ready at once", "Either pin works the same", "Neither, use Tick", "Completed, because the object is only valid after the load finishes"]
        answer_index: 3
        explain: "The load runs in the background. The Object output is valid on Completed, not on the immediate Out."
      - q: "During an async load, what keeps the assets from being garbage collected before the completion delegate runs?"
        choices: ["Nothing, you must add them to the root", "The streamable manager holds hard references until the delegate is called", "The Level Blueprint", "The asset registry"]
        answer_index: 1
        explain: "The docs say the Streamable Manager keeps hard references until the delegate runs, then releases them. You must hard-reference the asset elsewhere to keep it."
      - q: "You want to spawn an actor from a soft reference to a Blueprint class. Which node loads it without a hitch?"
        choices: ["Async Load Class Asset", "Load Class Asset Blocking", "Cast To", "Get Class"]
        answer_index: 0
        explain: "Async Load Class Asset loads a Soft Class Reference in the background and returns the class on Completed."
      - q: "A code path needs to find many unloaded assets of one base type in a folder, without loading them all. What do the docs suggest?"
        choices: ["A hard reference array", "A Level Blueprint search", "The asset registry with an Object Library", "Spawning each one"]
        answer_index: 2
        explain: "An Object Library holds asset data for unloaded assets from a path and lets you query and then load only what you need."
    flavors:
      _default: {why: "Soft references decide what your game loads at startup and what it streams in later."}
      gameplay_design: {why: "Item and enemy tables stay light when they hold soft references instead of hard ones.", do: "Make a Data Asset with three soft mesh references and load one on demand."}
      lookdev: {why: "Big props and materials referenced softly do not bloat load times.", do: "Check one heavy prop in the Reference Viewer and list what hard-references it."}

  - id: PQ68
