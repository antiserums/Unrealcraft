    title: Tick, tick groups and tick interval
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-ticking-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Actor/Tick/SetTickGroup"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Actor/Tick/SetActorTickInterval"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Actor/Tick/SetActorTickEnabled"
    checklist:
      - "Make BP_Ticker (Actor) with a Static Mesh. On Event Tick, add Delta Seconds to a float Elapsed and print it each frame."
      - "In Class Defaults, find Actor Tick. Set Tick Interval to 0.5 and play. The print now appears twice per second. Set it back to 0."
      - "On key press P: call Set Actor Tick Enabled with Enabled = false. On key press O: set it to true. Play and confirm the print stops and resumes."
      - "On key press G: call Set Tick Group with Post Physics. Play, press G, and read the Tick Group value in the Details panel of the actor during PIE."
      - "Make BP_Follower with a Static Mesh that sets its location each Tick to BP_Ticker's location plus 200 on X. Set BP_Follower's tick group to Post Physics and BP_Ticker's to Pre Physics."
      - "In BP_Follower's BeginPlay call Add Tick Prerequisite Actor with BP_Ticker. Write one line: why this is not needed when the two actors are already in different tick groups."
    done_when: "A screenshot of BP_Ticker's Actor Tick settings and the graph with Set Actor Tick Enabled and Set Tick Group, plus your line about tick dependency vs tick groups."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "A laser sight must draw exactly at the gun's final position for this frame. Which tick group should the reticule use?"
        choices: ["TG_PrePhysics", "TG_DuringPhysics", "TG_PostPhysics", "It does not matter"]
        answer_index: 2
        explain: "In TG_PostPhysics the physics results are complete, so traces see objects in their final positions. The docs give laser sights as the example."
      - q: "Which tick group is recommended for an inventory screen or minimap that does not care about physics data?"
        choices: ["TG_DuringPhysics", "TG_PrePhysics", "TG_PostUpdateWork", "TG_PostPhysics"]
        answer_index: 0
        explain: "TG_DuringPhysics runs at the same time as the physics simulation, so its data may be one frame old. That is fine for inventory screens or minimaps."
      - q: "Your actor moves and should be seen by physics objects this frame. Which tick group?"
        choices: ["TG_PostUpdateWork", "TG_PrePhysics", "TG_PostPhysics", "TG_DuringPhysics"]
        answer_index: 1
        explain: "TG_PrePhysics is for actors that interact with physics objects. Their movement is complete before simulation, so physics can use it."
      - q: "Set Actor Tick Interval is called on an actor whose tick is disabled. What happens?"
        choices: ["The tick is enabled with the new interval", "The interval is stored but the tick stays disabled", "The Blueprint fails at runtime", "The actor is destroyed"]
        answer_index: 1
        explain: "The node sets the interval of the primary tick function but will not enable a disabled tick function. It takes effect on the next tick."
      - q: "When should you use a tick prerequisite (Add Tick Prerequisite Actor) instead of moving an actor to a later tick group?"
        choices: ["When the actor must tick before physics", "When the actor needs to tick after all cameras update", "When it only depends on one or two specific actors and should not wait for a whole group", "Never; tick groups always replace it"]
        answer_index: 2
        explain: "Tick dependency makes one actor wait only for specific actors. Moving to a new group would wait for the whole group to finish, which may be less efficient."
      - q: "Two actors are in different tick groups. Is a tick dependency between them needed?"
        choices: ["Yes, always", "Only if they share a mesh", "Yes, if they are in the same level", "No; each tick group finishes all its actors before the next group begins"]
        answer_index: 3
        explain: "Each tick group completes ticking all of its actors and components before the next tick group can begin, so the order is already guaranteed."
    flavors:
      _default: {why: "Wrong tick order causes one-frame lag bugs that are very hard to see and easy to avoid."}
      tech_art: {why: "Effects that follow the camera belong in TG_PostUpdateWork.", do: "Put a Niagara actor that follows the camera into Post Update Work and compare against Pre Physics."}
      gameplay_design: {why: "Tick interval is the cheapest performance win for logic that does not need every frame.", do: "Set a 0.2 s tick interval on an AI sensing check and note the saving in stat game."}

  - id: PQ46
    rank: 1
    difficulty: apprentice
    track: programming
    subjects: [actors, spawning, garbage-collection, performance, blueprint]
    required_for_majors: []
    taster_for_majors: []
    adjacent_for: [gameplay_design, tech_art]
    required_spine: false
    elective: true
    title: Reuse instead of spawn
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-object-handling-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-actor-lifecycle"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Actor/SetLifeSpan"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/coder-06-create-a-respawning-pickup-item-in-unreal-engine"
    checklist:
      - "Make BP_Bullet: a small sphere mesh with a Projectile Movement Component. On BeginPlay call Set Life Span 2.0 so it destroys itself."
      - "In the character, on left mouse: Spawn Actor from Class BP_Bullet at the camera location. Hold the button with a 0.05 s loop for 10 seconds. Open the console and run stat game. Note the spawn cost lines while shooting."
      - "Make BP_BulletPool (Actor). On BeginPlay spawn 30 BP_Bullet, hide each (Set Actor Hidden In Game), disable its collision and set Projectile Movement inactive. Store them in an array Pool."
      - "Add a function GetBullet: find the first hidden bullet, unhide it, enable collision, activate the movement, and return it. Add a function ReturnBullet that does the opposite."
      - "Change BP_Bullet: remove Set Life Span. Instead, set a 2 s timer on BeginPlay reuse that calls ReturnBullet on the pool. Change the character to call GetBullet instead of Spawn Actor."
      - "Shoot for 10 seconds again with stat game open. Write three lines: what changed, why destroyed actors are not freed immediately, and one case where pooling is not worth it."
    done_when: "Two stat game screenshots (spawn/destroy version and pool version) and your three lines. The Blueprint graph of GetBullet must be visible in one screenshot."
    xp: 60
    verify_type: writeup
    quiz:
      - q: "An actor is destroyed during play. When is its memory actually freed?"
        choices: ["Immediately inside Destroy", "At the end of the current tick", "On a later garbage collection pass, after it has been marked pending kill", "When the level is saved"]
        answer_index: 2
        explain: "Destroy marks the actor pending kill. The engine de-allocates it on the next garbage collection cycle, not right away."
      - q: "How does the garbage collector decide that an object can be removed?"
        choices: ["The object is not reachable from the root set through the reference graph", "The object has no components", "The object has not ticked for one second", "The object is hidden in game"]
        answer_index: 0
        explain: "The engine builds a reference graph from the root set. Any object not found by that search is treated as unneeded and removed."
      - q: "Set Life Span is called with 0. What happens?"
        choices: ["The actor is destroyed immediately", "The lifespan timer is cleared and the actor will not be destroyed", "The actor is destroyed on the next frame", "The actor is hidden"]
        answer_index: 1
        explain: "If the requested lifespan is 0, the timer is cleared and the actor will not be destroyed. Any other value destroys the actor when it expires."
      - q: "Which Project Setting can reduce hitches by cleaning up unreachable objects more often, in smaller batches?"
        choices: ["Create Garbage Collector UObject Clusters", "Actor Clustering Enabled", "Merge GC Clusters", "Time Between Purging Pending Kill Objects"]
        answer_index: 3
        explain: "Shortening Time Between Purging Pending Kill Objects means fewer unreachable objects pile up before each pass, which helps avoid hitches when many actors are cleaned up at once."
      - q: "In the respawning pickup tutorial, how is the pickup 'removed' when collected, so it can come back later?"
        choices: ["It is destroyed and a new one is spawned", "Its mesh is hidden and collision is disabled, then a timer restores them", "It is moved under the floor", "Its level is unloaded"]
        answer_index: 1
        explain: "The tutorial hides the mesh with SetVisibility(false), disables collision, and uses a timer (SetTimer) to restore the pickup after a few seconds. No spawn or destroy is needed."
      - q: "Why are actors usually NOT collected as garbage even when your Blueprint holds no reference to them?"
        choices: ["Actors are never garbage collected", "The Level references them, and the Level links back to the root set", "Actors have their own memory pool", "Blueprints keep a hidden reference"]
        answer_index: 1
        explain: "Actors are usually referenced by the Level they belong to, which links back to the root set. Their components are referenced by the actor. That is why Destroy is the normal way to remove an actor."
    flavors:
      _default: {why: "Spawning and destroying many actors per second is a common cause of hitches. Pooling is the standard fix."}
      gameplay_design: {why: "Bullets, pickups and enemies that respawn all benefit from reuse.", do: "Make the pool size an editable variable and find the smallest size that never runs out."}
      tech_art: {why: "Particle-like actors (debris, shells) are the first candidates for pooling.", do: "Compare Niagara for the same effect and note when an actor pool is still needed."}

