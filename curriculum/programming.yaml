    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-a-single-line-trace-raycast-by-channel-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/traces-with-raycasts-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-a-single-line-trace-raycast-by-object-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-a-multi-line-trace-raycast-by-channel-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-interface-in-unreal-engine"
    checklist:
      - "Make a Blueprint Interface BPI_Interactable with two functions: Interact (input Instigator Actor) and GetPrompt (output Text)."
      - "Make an Actor Component BP_InteractComponent. On Event Tick run Line Trace By Channel from the camera location to camera location + forward vector * 300. Set Draw Debug Type to For One Frame while testing."
      - "Break the Hit Result. Store Hit Actor in a variable FocusedActor only if it implements BPI_Interactable (Does Implement Interface). Clear it when the trace misses."
      - "Add the ThirdPersonCharacter as an actor to ignore so the trace does not hit the player."
      - "Make BP_Chest and BP_Lever that implement BPI_Interactable. Interact opens the chest or flips the lever; GetPrompt returns a text like Open or Pull."
      - "Add the component to the character. On an Interact input action, call Interact (Message) on FocusedActor. Show the prompt on screen with Print String each tick FocusedActor is valid."
      - "Place both actors and a plain cube. Play and confirm the cube gives no prompt and both actors respond."
    done_when: "One screenshot of the BP_InteractComponent graph with the Line Trace By Channel node and the Does Implement Interface check, and one PIE screenshot with the debug line and a prompt printed while looking at the chest."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Line Trace By Channel returns what?"
        choices: ["Every object along the line", "The first object the trace hits", "Only objects with the Interactable tag", "The closest object within a sphere"]
        answer_index: 1
        explain: "A single Line Trace By Channel performs a collision trace along a line and returns the first object it hits. Use a Multi trace to get more hits."
      - q: "In the official example, how is the End point of the trace built?"
        choices: ["Camera location + camera forward vector * 1500", "Actor location + actor up vector * 1500", "Player Start location + 1500 on X", "Mouse world position"]
        answer_index: 0
        explain: "The example takes the camera's world location, then adds Get Forward Vector (from the camera rotation) multiplied by 1500. The number is the trace length."
      - q: "You set Draw Debug Type to For One Frame. What does that give you?"
        choices: ["The trace is only run once per game", "The trace ignores all physics objects", "The trace runs on the render thread", "A debug line is drawn so you can see the trace while playing"]
        answer_index: 3
        explain: "Draw Debug Type lets you see a debug line for the trace in-game. For One Frame draws it for one frame, which is fine for a trace run on Tick."
      - q: "Your trace keeps hitting the player's own capsule. Which pin fixes this the way the source suggests?"
        choices: ["Trace Complex", "Actors to Ignore", "Ignore Self set to false", "Trace Channel set to Camera"]
        answer_index: 1
        explain: "The Actors to Ignore pin takes an array of actors that the trace skips. You must list each actor to ignore."
      - q: "You only want to hit WorldDynamic objects, not physics cubes. What does the source recommend?"
        choices: ["Line Trace For Objects with WorldDynamic in the Object Types array", "Multi Line Trace By Channel", "Set every cube to Hidden in Game", "Use a Sphere Overlap instead"]
        answer_index: 0
        explain: "Line Trace For Objects only returns hits that match the Object Types you list with a Make Array node. In the example the physics cubes no longer return a hit."
      - q: "A Multi Line Trace By Channel passes through an overlap-only window and reaches a blocking cube. What do you get?"
        choices: ["Only the window", "Only the cube", "The window and the cube", "Nothing, because the window stops the trace"]
        answer_index: 2
        explain: "A multi trace returns all overlap hits up to and including the first blocking hit. Nothing after the blocking hit is returned."
      - q: "Why is a Blueprint Interface the right tool for FocusedActor, instead of casting to BP_Chest?"
        choices: ["Different classes like a chest and a lever can share one Interact function and be treated the same", "Interfaces are faster than every other node", "Casting is not allowed inside components", "Interfaces can add variables to any actor"]
        answer_index: 0
        explain: "An interface lets completely different objects share one function. You call Interact on any of them without knowing the exact class. Interfaces cannot add variables."
      - q: "Which of these can you NOT do inside a Blueprint Interface asset?"
        choices: ["Add a function with inputs and outputs", "Give an input a default value", "Add a Component", "Reorder the input parameters"]
        answer_index: 2
        explain: "Interfaces cannot add variables, edit graphs or add Components. They only define function signatures."
    flavors:
      _default: {why: "Look-at interaction is the base for doors, chests, NPCs and pickups in most first and third person games."}
      gameplay_design: {why: "The prompt text is where interaction feel begins.", do: "Return a different prompt when the chest is already open."}
      level_design: {why: "You will place many interactables and must know why one does not respond.", do: "Test what happens when a cube with Visibility set to Overlap stands in front of the chest."}

  - id: PQ73
    rank: 2
    difficulty: adept
    track: programming
    subjects: [blueprint, damage, health, gameplay]
    required_for_majors: []
    taster_for_majors: []
    adjacent_for: [gameplay_design]
    required_spine: false
    elective: true
    title: Point and radial damage with damage types
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Game/Damage/ApplyRadialDamage"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Game/Damage/ApplyPointDamage"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Game/Damage/ApplyDamage"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Game/Damage/OnTakeAnyDamage"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Game/Damage/OnTakePointDamage"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Game/Damage/OnTakeRadialDamage"
    checklist:
      - "Make two Blueprint classes with parent DamageType: DT_Fire and DT_Explosion."
      - "Make an Actor Component BP_HealthComponent with Health (Float, default 100). On Begin Play bind the owner's OnTakeAnyDamage event and subtract Damage. Print the Damage Type class name and the Damage Causer."
      - "Also bind OnTakePointDamage. Print the Hit Location and Bone Name so you can see where the hit landed."
      - "Make BP_Target (a cube with the health component). Place three of them at 100, 300 and 600 units from a marker."
      - "Make BP_Grenade. On overlap with the player, call Apply Radial Damage with Base Damage 50, Damage Radius 400, DT_Explosion, Damage Causer Self, then Destroy Actor. Test with Do Full Damage on and off."
      - "In the character, on a Fire input action, Line Trace forward and call Apply Point Damage on the Hit Actor with the Hit Result, Hit From Direction and DT_Fire."
      - "Add a Branch in the health component: if Damage Type is DT_Fire, multiply damage by 2. Kill (Destroy) the owner at 0 Health."
    done_when: "One screenshot of the BP_HealthComponent graph with both bound damage events, and one PIE screenshot of the Output Log after one grenade and one shot, showing the damage type names and which targets took damage."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Apply Radial Damage hits only actors that meet which condition?"
        choices: ["Have a Health variable", "Are of class Character", "Are tagged Damageable", "Are inside the radius and have components that block the Visibility channel"]
        answer_index: 3
        explain: "The node hurts actors within the radius, but it will only hit components that block the Visibility channel. It also skips the Damage Causer."
      - q: "What does the Damage Prevention Channel input do on Apply Radial Damage?"
        choices: ["Selects which actors receive double damage", "Blocks damage to a victim if something between the origin and the victim blocks traces on that channel", "Chooses the collision channel of the explosion mesh", "Limits damage to one actor per frame"]
        answer_index: 1
        explain: "Damage is not applied to a victim if there is something between the origin and the victim that blocks traces on that channel. This is how walls give cover."
      - q: "Apply Radial Damage returns a Boolean. What does True mean?"
        choices: ["Damage was applied to at least one actor", "The Damage Causer was destroyed", "All actors in the radius were damaged", "The explosion effect was spawned"]
        answer_index: 0
        explain: "The return value is true if damage was applied to at least one actor."
      - q: "Which input exists on Apply Point Damage but NOT on the generic Apply Damage node?"
        choices: ["Damage Type Class", "Event Instigator", "Hit Info", "Base Damage"]
        answer_index: 2
        explain: "Apply Point Damage takes Hit From Direction and Hit Info, the collision or trace result that describes the hit. Apply Damage has no hit information."
      - q: "A grenade thrown by the player explodes. Which actor should be the Damage Causer and which the Instigator?"
        choices: ["Causer: the player controller; Instigator: the grenade", "Causer: the grenade; Instigator: the controller responsible for the damage", "Both should be the grenade", "Both should be the player character"]
        answer_index: 1
        explain: "Per the docs, the Damage Causer is the actor that actually caused the damage (the grenade). The Event Instigator is the controller responsible (the player who threw it)."
      - q: "You want one event that fires for any kind of damage on an actor. Which event do you bind?"
        choices: ["On Take Any Damage", "On Take Point Damage", "On Take Radial Damage", "On Component Hit"]
        answer_index: 0
        explain: "On Take Any Damage is called when the actor is damaged in any way. The Point and Radial events are called only for their own damage kind."
      - q: "Apply Point Damage returns a float. What is it?"
        choices: ["The distance to the target", "The Base Damage you passed in", "The time the damage was applied", "The actual damage that ended up being applied to the actor"]
        answer_index: 3
        explain: "The return value is the actual damage that was applied to the actor. This can differ from Base Damage."
      - q: "Your BP_Grenade sits inside the blast radius of its own explosion. What happens to it?"
        choices: ["It takes full damage", "It takes damage only if Do Full Damage is on", "It is not damaged and does not block damage, because it is the Damage Causer", "It blocks damage to actors behind it"]
        answer_index: 2
        explain: "The Damage Causer input says: this actor will not be damaged and it will not block damage."
    flavors:
      _default: {why: "Real games need damage that knows where it came from, what kind it was and who caused it. Point and radial damage give you all three."}
      gameplay_design: {why: "Damage types are the hook for resistances, weak points and status effects.", do: "Add DT_Poison that deals 5 damage per second for 3 seconds with a looping timer."}

  - id: PQ74
    rank: 2
    difficulty: adept
    track: programming
    subjects: [blueprint, save-game, async, data]
    required_for_majors: []
    taster_for_majors: []
    adjacent_for: [gameplay_design]
    required_spine: false
    elective: true
    title: "Save slots: async, exists, delete"
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/saving-and-loading-your-game-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/SaveGame/AsyncSaveGametoSlot"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/SaveGame/AsyncLoadGamefromSlot"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/SaveGame/DoesSaveGameExist"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/SaveGame/DeleteGameinSlot"
    checklist:
      - "Make SG_Profile (parent SaveGame) with SaveVersion (Integer, default 1), PlayerName (String), and an array of S_InventoryItem or an array of Names if you did not do PQ71."
      - "Make a Blueprint Function Library BFL_Save with a function GetSlotName (input Slot Index) that returns Profile_ plus the index."
      - "In the Game Instance, add SaveToSlot (input Index). Create Save Game Object of SG_Profile, fill it, then Async Save Game to Slot. On Completed print Success and the slot name."
      - "Add LoadFromSlot (input Index). First call Does Save Game Exist. If false print No save in slot. Else Async Load Game from Slot; on Completed cast to SG_Profile and copy the data back."
      - "Add DeleteSlot (input Index) that calls Delete Game in Slot and prints the returned Boolean."
      - "Bind keys 1, 2, 3 to save to slots 0, 1, 2 and Shift+1, 2, 3 to load. Bind Delete to delete slot 0. Play, save to two slots, delete one, and try loading both."
      - "Open the project's Saved/SaveGames folder in Windows Explorer and look at the .sav files."
    done_when: "One screenshot of the LoadFromSlot graph with Does Save Game Exist and Async Load Game from Slot, one screenshot of the Saved/SaveGames folder with your .sav files, and one Output Log screenshot showing a successful load and a failed load of a deleted slot."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Why does Epic recommend Async Save Game to Slot over Save Game to Slot?"
        choices: ["It compresses the file", "It avoids a framerate hitch and possible certification problems on some platforms", "It can save to more than one slot at once", "Synchronous saving is deprecated"]
        answer_index: 1
        explain: "Async saving prevents a sudden hitch that players notice and that can be a certification issue on some platforms. Synchronous saving is still fine for small data or from a menu."
      - q: "Async Save Game to Slot has two execution outputs. When are the output data pins valid?"
        choices: ["Right after the first pin fires", "Always, because the object is created first", "Only if you promote the object to a variable", "Only after the Completed pin fires"]
        answer_index: 3
        explain: "Execution continues from the top pin at once and from the second pin when the save is complete. The output pins are not valid until the second pin has executed."
      - q: "Why can you use the output of Create Save Game Object without a Cast To node?"
        choices: ["Save games never need casting", "The output pin changes its type to match the Save Game Class input", "The engine always returns SG_Profile", "The node is a macro"]
        answer_index: 1
        explain: "Create Save Game Object changes its output pin type to match the class you choose in the Save Game Class input, so you can use it directly."
      - q: "Load Game from Slot returns which type?"
        choices: ["A base SaveGame object that you cast to your class", "Your custom class directly", "A String path", "A Boolean only"]
        answer_index: 0
        explain: "Load returns a base SaveGame object. You then cast it back to your custom SaveGame class to read the data."
      - q: "When would Save Game to Slot (synchronous) be an acceptable choice per the source?"
        choices: ["When auto-saving during heavy combat", "When saving large data every frame", "When the data is small or you save from a pause screen or menu", "Never; it is removed in UE5"]
        answer_index: 2
        explain: "Synchronous saving is sufficient for small SaveGame formats and for saving while paused or in a menu."
      - q: "Delete Game in Slot returned False. What does the source tell you to do to know why?"
        choices: ["Call it again with User Index 1", "Restart the editor", "Use Does Save Game Exist to tell a delete failure from a file that never existed", "Check the Success pin of Async Save"]
        answer_index: 2
        explain: "Delete returns true only if a file was actually deleted. Use Does Save Game Exist to distinguish a delete failure from the file not existing."
      - q: "On a development PC, where do saved game files go and what extension do they use?"
        choices: ["Content/SaveGames, .uasset", "Config/Saves, .ini", "Binaries/Win64, .bin", "Saved/SaveGames, .sav"]
        answer_index: 3
        explain: "On development platforms the files use the .sav extension and appear in the project's Saved\\SaveGames folder. Consoles vary."
      - q: "What does the source warn about doing at the same time on some platforms?"
        choices: ["Saving and loading at the same time", "Saving while the game is paused", "Loading two different classes", "Using User Index 0"]
        answer_index: 0
        explain: "Both async nodes say: some platforms may not support trying to load and save at the same time. Wait for Completed before starting the other."
    flavors:
      _default: {why: "Multiple slots, async saving and safe deleting are what separates a demo save system from a shippable one."}
      gameplay_design: {why: "Slot design decides if players can experiment without fear.", do: "Add an auto-save slot that is written every time the player picks up an item."}

