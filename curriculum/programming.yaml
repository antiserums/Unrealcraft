        answer_index: 0
        explain: "Setting a timer to less than or equal to 0 seconds clears it if it is set. This is the same as calling Clear Timer."
      - q: "While a timer is paused, what happens to its elapsed and remaining time?"
        choices: ["Both reset to 0", "Elapsed keeps growing", "They stay the same until you unpause", "Remaining becomes -1"]
        answer_index: 2
        explain: "Pausing prevents the call, but the elapsed and remaining times stay the same while paused. Unpause resumes from there."
      - q: "Get Timer Remaining Time returns -1. What does that mean per the timers page?"
        choices: ["The timer is looping", "The timer handle is not valid", "One second is left", "The timer is paused"]
        answer_index: 1
        explain: "GetTimerRemaining, GetTimerElapsed and GetTimerRate return -1 if the timer handle is invalid."
      - q: "What does Max Once Per Frame do on Set Timer by Event?"
        choices: ["Limits all timers to one per frame", "Runs the event on the next tick only", "For looping timers, executes only once even if the timer would expire several times in the current frame", "Disables looping"]
        answer_index: 2
        explain: "For looping timers, it controls whether to execute only once when the timer would otherwise expire multiple times in one frame, for example after a hitch."
      - q: "Is Timer Active by Handle returns True when?"
        choices: ["A timer exists for the handle and is active (not paused)", "Any timer in the world is running", "The handle was ever used", "The timer has finished"]
        answer_index: 0
        explain: "It returns true if a timer exists and is active for the given handle. The timers page adds that IsTimerActive means active and not paused."
      - q: "You want to change a running timer's rate from 1.0 to 0.5 seconds. What does the source say you must do?"
        choices: ["Call Set Timer Rate on the handle", "Pause it, change the rate, unpause", "Rates cannot change once set, so destroy the actor", "Call SetTimer again with the same handle, which clears it and creates a new timer with the new rate"]
        answer_index: 3
        explain: "A timer's rate cannot be changed directly. Call SetTimer with its handle to clear it and create a new timer that differs only in rate."
    flavors:
      _default: {why: "Cooldowns, buffs, respawns and waves are all timers. Handles let you pause, read and cancel them safely."}
      gameplay_design: {why: "Reading remaining time is how you show cooldown rings and buff bars.", do: "Feed Get Timer Remaining Time into a Progress Bar percent."}

  - id: PQ78
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [blueprint, enhanced-input, mapping-contexts, input]
    required_spine: false
    required: false
    title: Swap Input Mapping Contexts at runtime
    brief: "In the Enhanced Input system, an Input Action is one thing the player can do, such as Honk, and an Input Mapping Context is a list that says which keys trigger which actions. You can add and remove contexts while the game runs, so the same keys can do different things when the player is walking, driving or in a menu. In this quest you make a vehicle context and a menu context and switch them at the right moments."
    time_min: 70
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/enhanced-input-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Input/AddMappingContext"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Input/RemoveMappingContext"
    checklist:
      - "Open a project made from the Third Person template, or create one. Find the default Input Mapping Context that already exists in the template. Make two new ones named IMC_Vehicle and IMC_Menu."
      - "Make the Input Actions IA_Honk (Boolean), IA_Steer (Axis1D) and IA_MenuBack (Boolean). In IMC_Vehicle, map A and D to IA_Steer and add the Negate modifier on A, and map H to IA_Honk. In IMC_Menu, map Escape to IA_MenuBack."
      - "Make a Pawn Blueprint named BP_Car. On Possessed, get the Enhanced Input Local Player Subsystem from the controller and call Add Mapping Context with IMC_Vehicle and Priority 1. On Unpossessed, call Remove Mapping Context."
      - "Make BP_CarTrigger. On overlap, it makes the player possess BP_Car, which means the player takes control of it. Also let the player press a key to possess the character again."
      - "Make a Player Controller Blueprint and set it in the GameMode of the template, or use the one your project already has. In it, add IMC_Menu with Priority 10 when a menu opens, and remove it when the menu closes. A simple Widget Blueprint with one line of text that you show with a key press is enough as the menu. Also map Escape in the default context, so that you can see which context wins."
      - "Add the IA_Steer and IA_Honk events in BP_Car. Print the Action Value of IA_Steer while you press A and D. Try the Started, Triggered and Completed pins on IA_Honk."
      - "Press Play. Enter the car, steer, honk, open the menu, press Escape, close the menu, and leave the car."
    done_when: "Send one screenshot of IMC_Vehicle that shows the key mappings with the Negate modifier on A, and one screenshot of the BP_Car graph with Add Mapping Context on Possessed and Remove Mapping Context on Unpossessed."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Two mapping contexts map the same key to different Input Actions. Which one is used?"
        choices: ["The one with the highest priority; the others are ignored", "The one added first", "Both actions fire", "The one whose asset name comes first alphabetically"]
        answer_index: 0
        explain: "When contexts collide on an input, the context with the highest priority is considered and the others ignored. Higher priority mappings that consume input block lower ones."
      - q: "Why does the source recommend a separate mapping context for vehicle actions?"
        choices: ["Vehicles need a different input device", "Adding it when entering and removing when exiting prevents inappropriate actions and input collisions", "Contexts cannot hold more than 10 actions", "The character context is read-only"]
        answer_index: 1
        explain: "Mutually exclusive contexts ensure inappropriate Input Actions cannot run and the same key never triggers the wrong action."
      - q: "You call Remove Mapping Context for a context that was never added. What happens?"
        choices: ["An error is printed", "All contexts are removed", "It is safe; the call does nothing", "The player loses input until restart"]
        answer_index: 2
        explain: "The Remove Mapping Context page says it is safe to call even if the context is not applied."
      - q: "What is the Target of Add Mapping Context in Blueprint?"
        choices: ["The Game Instance", "The Enhanced Input Subsystem Interface (the local player's subsystem)", "The Pawn", "The Input Action asset"]
        answer_index: 1
        explain: "Target is Enhanced Input Subsystem Interface. You apply contexts to a local player through its Enhanced Input Local Player Subsystem."
      - q: "Which Input Action value type should IA_Steer use for a left/right value from A and D?"
        choices: ["Boolean", "Axis3D (vector)", "Text", "Axis1D (float)"]
        answer_index: 3
        explain: "Boolean is for on/off. Axis1D is a float, Axis2D is a 2D vector and Axis3D is a full vector."
      - q: "To make the A key give a negative steering value, which Input Modifier does the source use?"
        choices: ["Swizzle Input Axis Values", "Dead Zone", "Negate", "Smooth"]
        answer_index: 2
        explain: "Negate makes some keys register as negative. Swizzle moves a value to another axis, which is used for W and S in the WASD example."
      - q: "Which trigger state fires when the user lets go of a key before a Press and Hold time is reached?"
        choices: ["Triggered", "Completed", "Ongoing", "Canceled"]
        answer_index: 3
        explain: "Canceled means the triggering was canceled, for example when a user releases a button before a Press and Hold action can trigger."
      - q: "What is the order of processing for a raw key value in Enhanced Input?"
        choices: ["Modifiers change the raw value first, then Triggers decide if the Action activates", "Trigger, then Modifier, then Action", "The Action reads the key directly", "Triggers run only in C++"]
        answer_index: 0
        explain: "Input Modifiers are pre-processors that alter raw values before they go to Input Triggers. Triggers then decide whether the Action activates."
    flavors:
      _default: {why: "Vehicles, menus, ladders and cutscenes all need different controls. Swapping contexts is the clean way to do it."}
      gameplay_design: {why: "Context priority is how you stop a menu key from also firing a weapon.", do: "Add a hold trigger to IA_Honk and use the Ongoing pin to grow a horn sound."}

  - id: PQ79
    rank: 2
