    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/remote-procedure-calls-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/replicated-object-execution-order-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-owner-and-owning-connection-in-unreal-engine"
    checklist:
      - "In a C++ Character class add UFUNCTION(Server, Reliable, WithValidation) void ServerFire(int32 Ammo). Write ServerFire_Implementation and ServerFire_Validate (return false when Ammo < 0)."
      - "Add UFUNCTION(NetMulticast, Unreliable) void MulticastFireFX(). In its _Implementation spawn a sound or particle at the actor."
      - "Add UFUNCTION(Client, Reliable) void ClientShowHit(). In its _Implementation print a message on screen."
      - "In ServerFire_Implementation call MulticastFireFX and ClientShowHit. Bind ServerFire to an input key on the owning client."
      - "In a Blueprint child add a Custom Event Multicast_Cheer. In Details set Replicates to Multicast, Unreliable. Call it from a second key."
      - "Test with 2 players, Play As Listen Server. Press both keys in the client window. Note which window plays the FX and which window shows the hit message."
      - "Call ServerFire with Ammo = -1 from the client and watch what happens to that client."
    done_when: "A screenshot of the header with the three UFUNCTION lines, and a screenshot of both PIE windows after the client fired. Add 2 sentences about what happened with Ammo = -1."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What is the main intended use of RPCs according to the page?"
        choices: ["Transient or cosmetic events like sounds, particles and animations", "Replacing all replicated properties", "Saving the game", "Loading levels"]
        answer_index: 0
        explain: "RPCs are one-way calls with no return value. Their primary use is unreliable, transient gameplay events such as playing sounds, spawning particles and performing animations."
      - q: "A Server RPC is called on a client, but the actor is owned by a different client. What happens?"
        choices: ["It runs on the server anyway", "It runs on the other client", "It is dropped", "It runs locally"]
        answer_index: 2
        explain: "The execution matrix shows a Server RPC called from a client whose actor's owning connection is a different client is Dropped. Server RPCs must be called from the owning client."
      - q: "A NetMulticast RPC is called from a client. Where does it execute?"
        choices: ["On the server and all clients", "Only on the invoking client", "Only on the server", "It is dropped"]
        answer_index: 1
        explain: "NetMulticast RPCs are designed to be called from the server. Called from a client, a multicast only executes locally on that client."
      - q: "What is the default reliability of an RPC, and why should Reliable be used with care?"
        choices: ["Unreliable by default; Reliable needs more bandwidth and blocks later RPCs until acknowledged", "Reliable by default; Unreliable costs more bandwidth", "Both are equal", "Reliable by default; there is no cost"]
        answer_index: 0
        explain: "RPCs are unreliable by default. A Reliable RPC is re-sent until acknowledged and all later RPC executions are suspended until then, so it uses extra bandwidth. Use it sparingly."
      - q: "A Server RPC has WithValidation and the _Validate function returns false. What happens to the caller?"
        choices: ["The RPC runs anyway with a warning", "The invoking client is disconnected", "The RPC is queued for later", "Only the return value is ignored"]
        answer_index: 1
        explain: "The validation function runs first on the server. If inputs fail validation, the invoking client is disconnected from the server. If they pass, the implementation runs."
      - q: "Which RPC type from C++ is NOT available in Blueprint?"
        choices: ["Server", "Client", "Remote", "NetMulticast"]
        answer_index: 2
        explain: "The page says Remote RPCs are not currently exposed to Blueprints. Server, Client and Multicast can be set in a Custom Event's Replicates setting."
      - q: "Two reliable RPCs are called on the same actor, RPC_A then RPC_B. What does the engine guarantee on the receiving machine?"
        choices: ["Nothing about their order", "RPC_B executes first", "Only one of them arrives", "RPC_A executes before RPC_B"]
        answer_index: 3
        explain: "The execution-order page says reliable RPCs on the same actor keep their call order on the receiving machine. Across different actors there is no order guarantee."
      - q: "In one frame you call a reliable RPC and also change a replicated property. In what order does the client process them?"
        choices: ["Property first, then RPC", "Random order", "Only the property arrives", "RPC first, then the property update"]
        answer_index: 3
        explain: "RPCs are executed first and property updates are applied second. Unreliable multicasts are the exception: they are queued last and run after the property updates."
    flavors:
      _default: {why: "RPCs are how a client asks the server to do something and how the server tells clients to show effects."}
      programming: {why: "Knowing the execution matrix saves hours of 'why did my event not fire' debugging.", do: "Make the multicast reliable and write one line on when that is a mistake."}

