    xp: 60
    verify_type: writeup
    quiz:
      - q: "What is the value of Time in Set Timer by Event that clears an existing timer instead of setting it?"
        choices: ["Any value less than or equal to 0", "Exactly 1.0", "Any value above 60", "Only a negative value"]
        answer_index: 0
        explain: "The node says setting a timer to <= 0 seconds clears it if it is set. The timers page says the same for SetTimer."
      - q: "The actor that owns a running timer is destroyed. What happens to the timer?"
        choices: ["It keeps firing on a null object", "It moves to the Game Instance", "It fires one last time", "It is cancelled automatically and the handle becomes invalid"]
        answer_index: 3
        explain: "Timers are cancelled if the object they call on is destroyed before the time is up."
      - q: "A timer is paused. What happens to its elapsed and remaining time?"
        choices: ["Both reset to zero", "They stay the same while paused", "Remaining keeps counting down", "Elapsed keeps counting up"]
        answer_index: 1
        explain: "Pausing stops the function call but keeps elapsed and remaining unchanged. Unpause resumes from there."
      - q: "For a valid running timer, what is elapsed plus remaining equal to?"
        choices: ["The frame time", "Zero", "The timer rate", "The world time"]
        answer_index: 2
        explain: "The docs state the sum of elapsed and remaining time should equal the rate of the timer."
      - q: "Get Timer Remaining Time is called with an invalid handle. What comes back?"
        choices: ["0", "The rate", "An error dialog", "-1"]
        answer_index: 3
        explain: "GetTimerRate, GetTimerElapsed and GetTimerRemaining return -1 when the handle is not valid."
      - q: "You call Set Timer by Event again with the same event while its timer is still running. Result?"
        choices: ["The existing timer is reset with the new parameters", "A second timer runs in parallel", "The call is ignored", "The game asserts"]
        answer_index: 0
        explain: "The node description says setting an existing timer resets that timer with updated parameters."
      - q: "Where in the frame does the world timer manager tick, according to the tick group table?"
        choices: ["Before Pre Physics", "During Physics", "After Post Physics, together with latent actions and camera updates", "After rendering"]
        answer_index: 2
        explain: "The table lists processing latent actions, ticking the timer manager and updating cameras after TG_PostPhysics and before TG_PostUpdateWork."
      - q: "What does Max Once Per Frame do on a looping timer?"
        choices: ["Limits the timer to 60 fps", "Runs the event once even if the timer would expire several times in one frame", "Pauses the timer on slow frames", "Doubles the rate"]
        answer_index: 1
        explain: "On a long frame a short looping timer could expire several times. This option runs it only once in that frame."
    flavors:
      _default: {why: "Timers replace per-frame polling with scheduled work, which is cheaper and easier to reason about."}
      gameplay_design: {why: "Damage-over-time, cooldowns and delayed starts are all timers.", do: "Add a cooldown to a player ability with a timer handle and show the remaining time."}
      tech_art: {why: "Effects that pulse or retry do not need Tick.", do: "Drive a material parameter pulse from a looping timer instead of Tick."}

