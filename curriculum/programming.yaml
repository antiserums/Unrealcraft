        choices: ["Macros are compiled by the Content Browser", "Macros are expanded into the graphs that use them, like collapsed nodes, at compile time", "Macros run in C++", "Macro Libraries are read-only"]
        answer_index: 1
        explain: "Macros are auto-expanded into the graphs that reference them during compiling, so the library itself is not compiled."
      - q: "You edit a macro in the library. When does a Blueprint that uses it see the change?"
        choices: ["Immediately, at runtime", "Never, you must re-add the node", "Only after restarting the editor", "When that Blueprint is recompiled"]
        answer_index: 3
