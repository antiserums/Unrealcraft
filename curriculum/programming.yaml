    title: "TArray, TMap and TSet: pick the right container"
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/array-containers-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/map-containers-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/set-containers-in-unreal-engine"
    checklist:
      - "Make a C++ actor `AContainerLab`. In BeginPlay, build a `TArray<FString>` with Emplace, then Sort it with a predicate that sorts by string length."
      - "Use Find to get an index, and FindByPredicate to get a pointer. Log both results with UE_LOG. Also log what Find returns for a missing value."
      - "Remove one element with RemoveAt and one with RemoveAllSwap. Log the array after each removal so you can see the order change."
      - "Make a `TMap<int32, FString>`. Add three entries, then Add again with an existing key. Log Num() before and after."
      - "Use Find (pointer check), FindRef and FindOrAdd on a key that does not exist. Log each result and the Num() after."
      - "Make a `TSet<FString>`, Add a duplicate, and log Num(). Mark the TMap as `UPROPERTY(EditAnywhere)` and edit it from the Details panel in `BP_ContainerLab`."
    done_when: "Screenshot of the Output Log showing the sorted array, the Find results (including the missing one), the map counts after the duplicate key, and the set count after the duplicate. Also a screenshot of the map being edited in the Details panel."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "When should you prefer Emplace over Add on a TArray?"
        choices: ["Never, Add is always faster", "For non-trivial types like FString, because Emplace builds the element in place and avoids a temporary", "Only when the array is empty", "Only for arrays of pointers"]
        answer_index: 1
        explain: "Add copies or moves an instance in; Emplace constructs it from the arguments. The rule of thumb is Add for trivial types, Emplace otherwise. Emplace is never less efficient."
      - q: "You sort by length with Sort and three equal-length strings change relative order. Why?"
        choices: ["Sort is unstable (a quicksort); use StableSort to keep the relative order", "The predicate was wrong", "TArray cannot sort strings", "Sort always reverses equal elements"]
        answer_index: 0
        explain: "Sort is implemented as a quicksort and is not stable. StableSort (a merge sort) guarantees the relative order of equivalent elements."
      - q: "What does TArray::Find return when the element is not there?"
        choices: ["0", "-2", "INDEX_NONE", "It asserts"]
        answer_index: 2
        explain: "Find and the IndexOf functions return the special INDEX_NONE value when nothing is found. FindByPredicate returns nullptr."
      - q: "Why use RemoveAtSwap instead of RemoveAt?"
        choices: ["It keeps the order of remaining elements", "It is faster because it does not shuffle later elements down, but the order is not preserved", "It frees the memory of the array", "It removes all matching elements"]
        answer_index: 1
        explain: "Normal removal shuffles the following elements down so there are no holes. The Swap variants skip that overhead but do not guarantee the order of the remaining elements."
      - q: "You call Add on a TMap with a key that already exists. What happens?"
        choices: ["The map now has two pairs with that key", "The call fails and returns false", "The new pair replaces the old one", "It asserts"]
        answer_index: 2
        explain: "TMap keys are unique. Adding a pair with an existing key replaces the old pair. Only TMultiMap stores both."
      - q: "Which lookup on a TMap never adds an element and works on a const map, but returns a copy?"
        choices: ["FindOrAdd", "operator[]", "Find", "FindRef"]
        answer_index: 3
        explain: "FindRef returns a copy of the value, or a default-constructed value if the key is missing, and does not create an element. FindOrAdd is non-const only and adds a new element."
      - q: "Why is operator[] on a TMap risky when you are not sure the key exists?"
        choices: ["It adds the key silently", "It asserts if the map does not contain the key", "It returns a null pointer", "It reorders the map"]
        answer_index: 1
        explain: "You should always check that the map contains the key before using operator[]; if it does not, it asserts. Find does the check and the lookup in one step."
      - q: "What must a type support to be used as a TMap key or TSet element with the default KeyFuncs?"
        choices: ["GetTypeHash and operator==", "operator< only", "A copy constructor only", "Being a UObject"]
        answer_index: 0
        explain: "TMap and TSet are hashing containers. The default KeyFuncs use operator== for equality and the non-member GetTypeHash function for hashing."
    flavors:
      _default: {why: "Choosing the right container decides how fast and how safe your gameplay code is."}
      programming: {why: "Every inventory, registry or lookup in C++ is a TArray, TMap or TSet.", do: "Use Reserve on the array and the map before filling them, and log GetSlack() on the array."}
      tech_art: {why: "Tool code that groups assets or meshes lives on these containers too.", do: "Build a TMap<FName, TArray<AActor*>> that groups actors by tag."}

