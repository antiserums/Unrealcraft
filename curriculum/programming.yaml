      tech_art: {why: "Tool libraries for artists should not slow down every gameplay Blueprint.", do: "Put your editor utility libraries in a Tools namespace and check the Imports list of one gameplay Blueprint."}

  - id: PQ69
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [blueprint, inheritance, parent-class, data-only, architecture]
    required_spine: false
    required: false
    title: Parent and child Blueprints
    brief: "A child Blueprint is a Blueprint made from another Blueprint, called its parent. The child gets all the variables, components and functions of the parent, and it can override a function, which means it replaces it with its own version. This lets one base Blueprint hold the shared logic while each child only changes what is different. In this quest you build a vehicle parent with three children and test what a child can and cannot change."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-class-assets-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-best-practices-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-blueprint-classes-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-variables-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/compiler-overview-for-blueprints-visual-scripting-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Make an Actor Blueprint named BP_Vehicle with a Static Mesh. Add a float variable named TopSpeed that is Instance Editable, a float variable named Secret that is Private, and a function named Honk that prints Honk. Also add a local macro named FlashLights that toggles a Point Light."
      - "Create BP_PoliceCar and BP_FireTruck as children of BP_Vehicle. In BP_PoliceCar, override Honk so that it first calls the parent Honk and then prints Siren. In BP_FireTruck, try to override FlashLights and note what the editor offers you."
      - "In BP_FireTruck, try to add a Get node for Secret. Write one line that says what happens and why."
      - "Create BP_Taxi as a child of BP_Vehicle and change only TopSpeed and the mesh. Do not add any nodes. Open it and notice the compact Data-Only editor. Then add one variable and watch it become a full Blueprint."
      - "Place one of each vehicle in the level. In the Level Blueprint, add an event for the H key that uses Get All Actors of Class with BP_Vehicle and calls Honk on all of them. Watch each child answer in its own way."
      - "In BP_Vehicle, change the type of TopSpeed from float to integer and compile. Open the children. Write one line that says what the compiler did to the instances placed in the level."
    done_when: "Send a screenshot of the Honk override in BP_PoliceCar with the Parent call, a screenshot in Play mode with all three prints, and your two lines."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What does choosing a Parent Class do for a new Blueprint?"
        choices: ["It copies the parent's graphs into the new asset", "It links the two assets for streaming", "It makes the new Blueprint inherit the parent's properties and behaviour", "It locks the parent from editing"]
        answer_index: 2
        explain: "The child inherits from the parent. Any class, including other Blueprint classes, can be a parent."
      - q: "A child Blueprint changes only default values and adds no nodes, variables or components. What is it called?"
        choices: ["A Macro Library", "A Data-Only Blueprint", "A Level Blueprint", "A Child Actor"]
        answer_index: 1
        explain: "Data-Only Blueprints contain only inherited items and are edited in a compact property editor. Adding code or variables converts them to a full Blueprint."
      - q: "You want children to change what a behaviour does (siren instead of horn). Function or macro?"
        choices: ["Macro, because macros expand in place", "Either, they behave the same", "Event Dispatcher", "Function, because functions can be overridden in child Blueprints"]
        answer_index: 3
        explain: "Best practices says functions can be overridden in children; macros cannot, because they are pasted into the graph at compile time."
      - q: "Which can hold a latent node such as Delay?"
        choices: ["A Macro", "A Function", "Both", "Neither"]
        answer_index: 0
        explain: "One of the biggest differences: latent nodes are allowed in macros but not in functions."
      - q: "A variable is marked Private in the parent. What does that mean for a derived Blueprint?"
        choices: ["The child can still change it freely", "The child cannot modify it", "The child cannot exist", "The variable becomes instance editable"]
        answer_index: 1
        explain: "The variable Private property says the variable is not modified by derived Blueprints."
      - q: "The docs say Level Blueprints are best for what kind of work?"
        choices: ["Reusable behaviour placed many times", "Shared function libraries", "Networking", "One-off, level-specific logic such as opening a door after a boss dies"]
        answer_index: 3
        explain: "Level Blueprints are specific to their level. Blueprint Classes are the way to get reusable behaviour."
      - q: "New Subclass in Convert Selection to Blueprint Class is only available when?"
        choices: ["When exactly one actor is selected", "When several actors are selected", "Only for Static Mesh Actors", "Only inside a sublevel"]
        answer_index: 0
        explain: "New Subclass needs a single actor. It creates a subclass of that actor's class and keeps its property changes."
      - q: "After you compile a parent class that changed its variables, what does the compiler do to the placed instances?"
        choices: ["Deletes them", "Leaves them with old data until the level reloads", "Re-instances every object of the class and copies the old values to the new ones", "Marks them dirty only"]
        answer_index: 2
        explain: "The compiler overview describes re-instancing: it finds all instances, spawns new ones and copies the properties across."
    flavors:
      _default: {why: "Inheritance lets one base Blueprint carry shared logic while children only change what differs."}
      gameplay_design: {why: "Enemy and item families are cleaner as parent-child sets than as copies.", do: "Make three enemy children of one BP_EnemyBase that differ only by defaults."}
      level_design: {why: "Data-only children give you variants of a prop without new logic.", do: "Create two Data-Only variants of a door with different speeds."}

  - id: PQ70
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [blueprint, timers, tick, performance, architecture]
    required_spine: false
    required: false
    title: Timers instead of Tick
    brief: "Event Tick runs every frame, even when nothing needs to happen. A timer is different: it calls an event after a set time, once or again and again, and costs nothing between calls. Each timer gives you a handle, a value that you keep so you can pause or stop that timer later. In this quest you build a gas room that damages the player, first with Tick and then with timers, and you compare the cost of the two versions."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/gameplay-timers-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/SetTimerbyEvent"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/ClearandInvalidateTimerbyHandle"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/PauseTimerbyHandle"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/GetTimerRemainingTimebyHandle"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Actor/Tick/SetActorTickEnabled"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-ticking-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make an Actor Blueprint named BP_GasRoom with a Box Collision. For version 1, on Tick, check if the player is inside and apply 1 damage per second with the help of Delta Seconds. Place 20 copies, open stat game, and note the tick cost."
      - "For version 2, turn off Start with Tick Enabled in Class Defaults. On begin overlap, call Set Timer by Event with Time 1.0 and Looping on, connect it to a custom event named DamageTick, and store the handle in a variable. On end overlap, call Clear and Invalidate Timer by Handle."
      - "Add an event for the P key that calls Pause Timer by Handle, and an event for the O key that unpauses it. While the timer is paused, use another timer to print Get Timer Remaining Time by Handle each second, and confirm that the value does not change."
      - "Add a delayed start: a 3-second Set Timer by Event that does not loop and that starts the damage loop. Set its Initial Start Delay Variance to 0.5. Spawn 20 rooms and watch them start at different moments."
      - "Make BP_Spawner. It uses a looping timer to try to find a BP_GasRoom every 1 second, and it clears its own timer when it finds one. Destroy a room while its timer is running and check the log for errors."
      - "Write three lines: the difference in stat game between the two versions, why a timer that is not cleared is not a leak when the actor dies, and one case where Tick is still the right tool."
    done_when: "Send two screenshots of stat game (one of the tick version and one of the timer version), a screenshot of the BP_GasRoom graph with the Set Timer and Clear nodes, and your three lines."
    xp: 60
    verify_type: writeup
    quiz:
      - q: "What is the value of Time in Set Timer by Event that clears an existing timer instead of setting it?"
        choices: ["Any value less than or equal to 0", "Exactly 1.0", "Any value above 60", "Only a negative value"]
        answer_index: 0
        explain: "The node says setting a timer to <= 0 seconds clears it if it is set. The timers page says the same for SetTimer."
      - q: "The actor that owns a running timer is destroyed. What happens to the timer?"
        choices: ["It keeps firing on a null object", "It moves to the Game Instance", "It fires one last time", "It is cancelled automatically and the handle becomes invalid"]
        answer_index: 3
        explain: "Timers are cancelled if the object they call on is destroyed before the time is up."
      - q: "A timer is paused. What happens to its elapsed and remaining time?"
        choices: ["Both reset to zero", "They stay the same while paused", "Remaining keeps counting down", "Elapsed keeps counting up"]
        answer_index: 1
        explain: "Pausing stops the function call but keeps elapsed and remaining unchanged. Unpause resumes from there."
      - q: "For a valid running timer, what is elapsed plus remaining equal to?"
        choices: ["The frame time", "Zero", "The timer rate", "The world time"]
        answer_index: 2
        explain: "The docs state the sum of elapsed and remaining time should equal the rate of the timer."
      - q: "Get Timer Remaining Time is called with an invalid handle. What comes back?"
        choices: ["0", "The rate", "An error dialog", "-1"]
        answer_index: 3
        explain: "GetTimerRate, GetTimerElapsed and GetTimerRemaining return -1 when the handle is not valid."
      - q: "You call Set Timer by Event again with the same event while its timer is still running. Result?"
        choices: ["The existing timer is reset with the new parameters", "A second timer runs in parallel", "The call is ignored", "The game asserts"]
        answer_index: 0
        explain: "The node description says setting an existing timer resets that timer with updated parameters."
      - q: "Where in the frame does the world timer manager tick, according to the tick group table?"
        choices: ["Before Pre Physics", "During Physics", "After Post Physics, together with latent actions and camera updates", "After rendering"]
        answer_index: 2
        explain: "The table lists processing latent actions, ticking the timer manager and updating cameras after TG_PostPhysics and before TG_PostUpdateWork."
      - q: "What does Max Once Per Frame do on a looping timer?"
        choices: ["Limits the timer to 60 fps", "Runs the event once even if the timer would expire several times in one frame", "Pauses the timer on slow frames", "Doubles the rate"]
        answer_index: 1
        explain: "On a long frame a short looping timer could expire several times. This option runs it only once in that frame."
    flavors:
      _default: {why: "Timers replace per-frame polling with scheduled work, which is cheaper and easier to reason about."}
      gameplay_design: {why: "Damage-over-time, cooldowns and delayed starts are all timers.", do: "Add a cooldown to a player ability with a timer handle and show the remaining time."}
      tech_art: {why: "Effects that pulse or retry do not need Tick.", do: "Drive a material parameter pulse from a looping timer instead of Tick."}

  - id: PQ71
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [blueprint, structs, arrays, inventory]
    required_spine: false
    required: false
    title: "Inventory: a struct in an array"
    brief: "A struct (Structure) is a custom data type that groups several values under one name, for example the name, count and weight of an item. If you put structs in an Array, you get a list of items. Almost every inventory, quest log and loadout system is built this way. In this quest you make an item struct and an inventory component that can add items, remove items and report the total weight."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-struct-variables-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-arrays?application_version=4.27"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/structs-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Right-click in the Content Browser and choose Blueprints, then Structure. Name it S_InventoryItem. Add the fields ItemName (Name), Count (Integer), Weight (Float) and Icon (Texture 2D soft reference)."
      - "Make an Actor Component named BP_InventoryComponent. Add a variable named Items with the type S_InventoryItem and set its container to Array."
      - "Add a function named AddItem with the inputs Name and Count. Loop through the Items array. If an ItemName matches, use Set Members in Struct to raise only Count. If nothing matches, use Make S_InventoryItem and Add the new item to the array."
      - "Add a function named RemoveItem with the input Name. Find the index of the item and lower its Count. Use Remove Index when Count reaches 0. Return a Boolean named Success."
      - "Add a pure function named GetTotalWeight. It loops through Items, uses a Break node on each struct to read its fields, and adds up Count * Weight."
      - "Add BP_InventoryComponent to the character Blueprint of the template, BP_ThirdPersonCharacter. On Begin Play, call AddItem three times and use one of the names twice. Print the Length of Items and the total weight."
      - "Select each Break S_InventoryItem node and click Hide Unconnected Pins in the Details panel, so that the graph stays clean."
    done_when: "Send one screenshot of the S_InventoryItem structure asset with its four fields, one screenshot of the AddItem function graph that shows Set Members in Struct, and one screenshot of the Output Log in Play mode that shows the item count and the total weight."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "You want to change only the Count field of an inventory struct and leave the other fields as they are. Which node is made for this?"
        choices: ["Make Struct", "Set Members in Struct", "Break Struct", "Split Struct Pin"]
        answer_index: 1
        explain: "Set Members in Struct changes only the members you expose in the Details panel. Members that are not exposed are not changed."
      - q: "How do you choose which fields appear as pins on a Set Members in Struct node?"
        choices: ["Right-click the node and pick Add Pin", "Drag a wire into the node for each field", "Edit the struct asset and mark the field as Editable", "Select the node and tick the checkboxes in the Details panel"]
        answer_index: 3
        explain: "Select the node. The Details panel shows a checkbox for each possible member. Only ticked members become pins."
      - q: "Where do you create a custom struct asset like S_InventoryItem?"
        choices: ["Project Settings > Engine > Structs", "Blueprint Editor > Add Variable > New Struct", "Content Browser right-click > Blueprints > Structure", "Window > Developer Tools > Struct Editor"]
        answer_index: 2
        explain: "The page says: right-click in the Content Browser, then under Blueprints pick Structure. You then add variables and defaults in the Structure window."
      - q: "You split the struct pin on a node but now want a single struct pin again. What do you do?"
        choices: ["Right-click a split pin and pick Recombine Struct Pin", "Delete the node and add it again", "Add a Make Struct node in front of it", "Compile the Blueprint; split pins reset on compile"]
        answer_index: 0
        explain: "Right-click any of the new pins and select Recombine Struct Pin. Both input and output pins can be split and recombined."
      - q: "A Break S_InventoryItem node shows many pins, but you only use Count. What is the clean way to hide the rest?"
        choices: ["Click Hide Unconnected Pins in the Details panel", "Use Split Struct Pin instead", "Set the other fields to private in the struct asset", "Collapse the node into a macro"]
        answer_index: 0
        explain: "The Details panel of a Break node has a Hide Unconnected Pins button. Pins without a connection are hidden. You can show one again with its (As pin) property."
      - q: "Which of these is a struct you have already used in Blueprints, even before making your own?"
        choices: ["Integer", "Boolean", "Actor Reference", "Transform"]
        answer_index: 3
        explain: "Vectors, Rotators and Transforms are struct variables. A Transform holds a Location vector, a Rotation rotator and a Scale vector, so structs can nest."
      - q: "Your Items array has 4 entries. RemoveItem calls Remove Index on index 1. Which is true afterwards?"
        choices: ["Index 1 is now empty but still counted", "The array has 3 entries and later indices moved down", "The array still has 4 entries, the removed one is None", "Remove Index only works on the last item"]
        answer_index: 1
        explain: "Remove Index removes the item and the remaining index numbers update to close the gap. The Length becomes 3."
      - q: "In the C++ side, why does a Break node appear for a UStruct in Blueprint?"
        choices: ["Every USTRUCT gets a Break node automatically", "The struct is marked NoExport", "The struct has at least one BlueprintReadOnly or BlueprintReadWrite property", "The struct has a UFUNCTION"]
        answer_index: 2
        explain: "Break appears if at least one property is BlueprintReadOnly or BlueprintReadWrite. Make appears for any UStruct tagged BlueprintType. Structs cannot have UFunctions."
    flavors:
      _default: {why: "A struct in an array is the base shape of almost every inventory, quest log and loadout system."}
      gameplay_design: {why: "You can tune item data in the struct defaults without touching the graph.", do: "Add a MaxStack field and stop AddItem from going over it."}

  - id: PQ72
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [blueprint, traces, interfaces, interaction]
    required_spine: false
    required: false
    title: Look-at interaction with a line trace
    brief: "A line trace is an invisible straight line that Unreal shoots through the level to find the first object it hits. If you shoot it forward from the camera, you know what the player is looking at. Most first and third person games use this for doors, chests, NPCs and pickups. In this quest you build a component that traces every frame, remembers the object in focus if it can be used, and calls Interact on it when the player presses a key."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-a-single-line-trace-raycast-by-channel-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/traces-with-raycasts-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-a-single-line-trace-raycast-by-object-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-a-multi-line-trace-raycast-by-channel-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-interface-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make a Blueprint Interface named BPI_Interactable with two functions: Interact with an Actor input named Instigator, and GetPrompt with a Text output."
      - "Make an Actor Component named BP_InteractComponent. On Event Tick, run Line Trace By Channel from the camera location to the camera location + forward vector * 300. While you test, set Draw Debug Type to For One Frame so that you can see the line."
      - "Use a Break node on the Hit Result. Store the Hit Actor in a variable named FocusedActor, but only if it implements BPI_Interactable (check this with Does Implement Interface). Clear the variable when the trace hits nothing."
      - "Add the character that owns the component to the Actors to Ignore of the trace, so that the trace does not hit the player."
      - "Make BP_Chest and BP_Lever, and make both implement BPI_Interactable. Interact opens the chest or flips the lever, and GetPrompt returns a text such as Open or Pull."
      - "Add the component to the character Blueprint of the template. Add an interact key to the character, for example a keyboard event for the E key or an Input Action that you map to E, and call Interact (Message) on FocusedActor from it. On each tick where FocusedActor is valid, show the prompt on the screen with Print String."
      - "Place both actors and a plain cube in the level. Press Play and confirm that the cube gives no prompt and that both actors respond."
    done_when: "Send one screenshot of the BP_InteractComponent graph with the Line Trace By Channel node and the Does Implement Interface check, and one screenshot in Play mode with the debug line and a prompt printed while you look at the chest."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Line Trace By Channel returns what?"
        choices: ["Every object along the line", "The first object the trace hits", "Only objects with the Interactable tag", "The closest object within a sphere"]
        answer_index: 1
        explain: "A single Line Trace By Channel performs a collision trace along a line and returns the first object it hits. Use a Multi trace to get more hits."
      - q: "In the official example, how is the End point of the trace built?"
        choices: ["Camera location + camera forward vector * 1500", "Actor location + actor up vector * 1500", "Player Start location + 1500 on X", "Mouse world position"]
        answer_index: 0
        explain: "The example takes the camera's world location, then adds Get Forward Vector (from the camera rotation) multiplied by 1500. The number is the trace length."
      - q: "You set Draw Debug Type to For One Frame. What does that give you?"
        choices: ["The trace is only run once per game", "The trace ignores all physics objects", "The trace runs on the render thread", "A debug line is drawn so you can see the trace while playing"]
        answer_index: 3
        explain: "Draw Debug Type lets you see a debug line for the trace in-game. For One Frame draws it for one frame, which is fine for a trace run on Tick."
      - q: "Your trace keeps hitting the player's own capsule. Which pin fixes this the way the source suggests?"
        choices: ["Trace Complex", "Actors to Ignore", "Ignore Self set to false", "Trace Channel set to Camera"]
        answer_index: 1
        explain: "The Actors to Ignore pin takes an array of actors that the trace skips. You must list each actor to ignore."
      - q: "You only want to hit WorldDynamic objects, not physics cubes. What does the source recommend?"
        choices: ["Line Trace For Objects with WorldDynamic in the Object Types array", "Multi Line Trace By Channel", "Set every cube to Hidden in Game", "Use a Sphere Overlap instead"]
        answer_index: 0
        explain: "Line Trace For Objects only returns hits that match the Object Types you list with a Make Array node. In the example the physics cubes no longer return a hit."
      - q: "A Multi Line Trace By Channel passes through an overlap-only window and reaches a blocking cube. What do you get?"
        choices: ["Only the window", "Only the cube", "The window and the cube", "Nothing, because the window stops the trace"]
        answer_index: 2
        explain: "A multi trace returns all overlap hits up to and including the first blocking hit. Nothing after the blocking hit is returned."
      - q: "Why is a Blueprint Interface the right tool for FocusedActor, instead of casting to BP_Chest?"
        choices: ["Different classes like a chest and a lever can share one Interact function and be treated the same", "Interfaces are faster than every other node", "Casting is not allowed inside components", "Interfaces can add variables to any actor"]
        answer_index: 0
        explain: "An interface lets completely different objects share one function. You call Interact on any of them without knowing the exact class. Interfaces cannot add variables."
      - q: "Which of these can you NOT do inside a Blueprint Interface asset?"
        choices: ["Add a function with inputs and outputs", "Give an input a default value", "Add a Component", "Reorder the input parameters"]
        answer_index: 2
        explain: "Interfaces cannot add variables, edit graphs or add Components. They only define function signatures."
    flavors:
      _default: {why: "Look-at interaction is the base for doors, chests, NPCs and pickups in most first and third person games."}
      gameplay_design: {why: "The prompt text is where interaction feel begins.", do: "Return a different prompt when the chest is already open."}
      level_design: {why: "You will place many interactables and must know why one does not respond.", do: "Test what happens when a cube with Visibility set to Overlap stands in front of the chest."}

