  - id: PQ83
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [cpp, interfaces, blueprint-interop]
    required_spine: false
    required: false
    title: A C++ interface that Blueprints can implement
    brief: "An interface is a list of functions that different classes agree to provide. With an interface, actors that have nothing else in common can respond to the same call, and the caller does not need to cast to each class. In Unreal you can declare an interface in C++ and let both C++ classes and Blueprints implement it. In this quest you write such an interface, implement it once in C++ and once in a Blueprint, and call it from a trigger zone."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/interfaces-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open a C++ project, or create one from the Third Person template with C++ selected. You need an IDE such as Visual Studio to compile. Use the C++ Class Wizard with the class type Unreal Interface to create ReactToTrigger. You get two classes: UReactToTrigger (the UINTERFACE) and IReactToTrigger."
      - "Mark the UINTERFACE with Blueprintable. In the I-class, add UFUNCTION(BlueprintCallable, BlueprintNativeEvent) bool ReactToTrigger();."
      - "Make a C++ actor named ATrapActor that inherits from AActor and IReactToTrigger. Implement ReactToTrigger_Implementation so that it writes a log line and returns true."
      - "Make a Blueprint actor named BP_PointsPickup. Add the ReactToTrigger interface in its Class Settings and implement the event in the Blueprint."
      - "Make ATriggerZone with a box that detects overlaps. On overlap, check Implements<UReactToTrigger>() on the other actor and call IReactToTrigger::Execute_ReactToTrigger(OtherActor)."
      - "Also try Cast<IReactToTrigger>(OtherActor) on both actors, and log which one returns null."
    done_when: "Send a screenshot of the interface header, and a screenshot in Play mode where the log shows both the C++ trap and the Blueprint pickup reacting through Execute_, and the Cast result for the Blueprint actor."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "In a C++ interface, which class holds the functions that implementers inherit?"
        choices: ["The U-prefixed UINTERFACE class", "The I-prefixed class", "Both classes hold copies", "The generated.h class"]
        answer_index: 1
        explain: "The U-prefixed class is an empty class for the reflection system. The I-prefixed class contains all interface functions and is the one you inherit from."
      - q: "What is required for a Blueprint to implement your C++ interface?"
        choices: ["The Blueprintable specifier, and every non-static function must be BlueprintNativeEvent or BlueprintImplementableEvent", "The BlueprintType specifier only", "All functions must be virtual", "The interface must inherit from AActor"]
        answer_index: 0
        explain: "Blueprintable is required, and interfaces cannot be exposed to Blueprint if they contain anything other than BlueprintImplementableEvent and BlueprintNativeEvent functions."
      - q: "A plain virtual C++ function in the interface (no UFUNCTION). Where can it be used?"
        choices: ["In Blueprint and C++", "Only in Blueprint", "Nowhere, it must be a UFUNCTION", "Only in C++; it is not visible to Blueprint and cannot be in a Blueprintable interface"]
        answer_index: 3
        explain: "C++-only interface functions must be virtual, are not visible to Blueprint, and cannot be used in Blueprintable interfaces."
      - q: "How do you implement a BlueprintNativeEvent interface function in C++?"
        choices: ["Override it with the same name and the virtual keyword", "Mark it override in the UINTERFACE class", "Define a function with the same name plus an _Implementation suffix", "Implement it in the U-prefixed class"]
        answer_index: 2
        explain: "To implement a BlueprintNativeEvent in C++, create a function with the same name and an additional _Implementation suffix."
      - q: "From C++, what is the safe way to call an interface event that may be implemented in Blueprint?"
        choices: ["Cast to the I-class and call the function", "Call the _Implementation function directly", "Use the static Execute_ wrapper", "Call it through the UINTERFACE class"]
        answer_index: 2
        explain: "The Execute_ static wrapper, generated by the reflection system, works for interfaces implemented in C++ or Blueprint. The _Implementation wrapper calls only the C++ version."
      - q: "Cast<IReactToTrigger>(Actor) returns null for a Blueprint that implements the interface. Why?"
        choices: ["The Blueprint is not compiled", "Cast<> never works with interfaces", "The Actor must be an APawn", "Blueprint-implemented interfaces do not exist in the C++ version of the object, so Cast<> only works for C++ implementations"]
        answer_index: 3
        explain: "The templated Cast<> works only if the interface is implemented in a C++ class. Interfaces implemented in Blueprint do not exist in the C++ object, so Cast<> returns null."
      - q: "Which type safely stores both the object and the interface pointer?"
        choices: ["TScriptInterface", "TWeakObjectPtr", "TSubclassOf", "FScriptDelegate"]
        answer_index: 0
        explain: "TScriptInterface holds a reference to an object that implements an interface; GetObject returns the object and GetInterface returns the interface pointer."
      - q: "Why does the doc suggest an interface for traps, enemies and point awards?"
        choices: ["They all derive from AActor", "They share needed functionality but have no common parent other than UObject", "Interfaces make them faster", "Blueprint cannot use inheritance"]
        answer_index: 1
        explain: "Traps derive from AActor, enemies from APawn or ACharacter, point awards from UDataAsset. An interface enforces the shared function without a shared base class."
    flavors:
      _default: {why: "Interfaces let unrelated actors respond to the same call without casting to each one."}
      programming: {why: "This is the C++ side of the Interact interface pattern you used in Blueprint.", do: "Add a second interface function with BlueprintImplementableEvent and note that you cannot override it in C++."}
      gameplay_design: {why: "Designers can implement your C++ interface in any Blueprint without touching code.", do: "Implement the interface in three different Blueprint actors."}

  - id: PQ84
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [cpp, subsystems, architecture]
    required_spine: false
    required: false
    title: A Game Instance Subsystem for stats
    brief: "A subsystem is a class that Unreal creates and destroys for you together with a bigger object, such as the Game Instance, which lives as long as the game runs. It is a clean place for systems that the whole game uses, such as stats, and Blueprints can reach it without a cast. In this quest you write a Game Instance Subsystem that counts resources and use it from C++ and from a Blueprint."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/programming-subsystems-in-unreal-engine"
    backup_url: null
    checklist:
      - "Open a C++ project, or create one from the Third Person template with C++ selected. You need an IDE such as Visual Studio to compile. Create a C++ class named UStatsSubsystem that inherits from UGameInstanceSubsystem."
      - "Override Initialize(FSubsystemCollectionBase&) and Deinitialize(). Write a log line in both, so that you can see when they run."
      - "Add UFUNCTION(BlueprintCallable) void IncrementResourceStat(FName Resource) and UFUNCTION(BlueprintPure) int32 GetResourceStat(FName Resource) const. Store the values in a TMap<FName, int32>."
      - "In a C++ actor, get the subsystem with the line GetGameInstance()->GetSubsystem<UStatsSubsystem>(). Then increment a stat on BeginPlay."
      - "In a Blueprint, right-click in the graph and search for 'Stats Subsystem'. Use the node that Unreal generated for you (no cast is needed) to read the stat and print it."
      - "Stop Play In Editor and start it again. Confirm in the log that Deinitialize ran and that Initialize then ran again."
    done_when: "Send a screenshot of the subsystem header, a screenshot of the Blueprint graph that uses the subsystem node without a cast, and a screenshot of the Output Log that shows Initialize, Deinitialize and the stat value."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which base class do you inherit for a subsystem that lives as long as the Game Instance?"
        choices: ["UEngineSubsystem", "UEditorSubsystem", "UGameInstanceSubsystem", "ULocalPlayerSubsystem"]
        answer_index: 2
        explain: "The doc lists four lifetimes: Engine, Editor, GameInstance and LocalPlayer, each with its own base class."
      - q: "When is Initialize() called on a Game Instance subsystem?"
        choices: ["When UGameInstance initializes", "When the first actor calls it", "When the module loads", "When the level opens"]
        answer_index: 0
        explain: "After UGameInstance is created, the subsystem instance is created; when UGameInstance initializes, Initialize() is called; on shutdown, Deinitialize() is called."
      - q: "Why does the doc prefer a subsystem over adding functions to a custom UGameInstance?"
        choices: ["Subsystems run faster", "Subsystems avoid overriding engine classes and avoid adding API to an already busy class", "UGameInstance cannot be subclassed", "Subsystems replicate automatically"]
        answer_index: 1
        explain: "Reasons listed include saving programming time, avoiding overriding engine classes, and not adding more API to a busy class, plus Blueprint and Python exposure."
      - q: "How do Blueprints access your subsystem?"
        choices: ["Cast the Game Instance to the subsystem", "Only through a Blueprint Function Library you write", "They cannot; subsystems are C++ only", "Through auto-generated context-aware nodes that do not require casting"]
        answer_index: 3
        explain: "Subsystems are automatically exposed to Blueprints with smart nodes that understand context and do not require casting. You control the API with UFUNCTION markup."
      - q: "For an Engine subsystem, when does Initialize() run relative to its module?"
        choices: ["Before the module's Startup", "At the same time as Startup", "After the module's Startup function returns", "Only when GEngine is first used"]
        answer_index: 2
        explain: "When the Engine subsystem's module loads, it initializes after the module's Startup() has returned, and deinitializes after Shutdown() has returned."
      - q: "How do you get a LocalPlayer subsystem in C++?"
        choices: ["GEngine->GetEngineSubsystem<T>()", "GEditor->GetEditorSubsystem<T>()", "LocalPlayer->GetSubsystem<T>()", "GameInstance->GetSubsystem<T>()"]
        answer_index: 2
        explain: "Each lifetime has its accessor: GEngine for engine, GEditor for editor, GameInstance->GetSubsystem for game instance, LocalPlayer->GetSubsystem for local player."
      - q: "Why are subsystems especially useful for plugins?"
        choices: ["The plugin user does not need setup code; the subsystem is instanced and initialized at a known time", "Plugins cannot contain other classes", "Subsystems are the only way to load plugins", "They avoid the need for a .uplugin file"]
        answer_index: 0
        explain: "With subsystems, the user just adds the plugin and you know exactly when it will be instanced and initialized, so no wiring instructions are needed."
      - q: "What happens to the subsystem after Deinitialize() when the Game Instance shuts down?"
        choices: ["It is kept alive until the editor closes", "It is saved to disk", "It is moved to the Engine subsystems", "Its reference is dropped and it is garbage collected if nothing else references it"]
        answer_index: 3
        explain: "At that point the reference to the subsystem is dropped, and it is garbage-collected if there are no more references to it."
    flavors:
      _default: {why: "Subsystems are the clean home for game-wide systems, with free Blueprint access."}
      programming: {why: "This replaces the 'put everything in Game Instance' habit.", do: "Add a second subsystem of type ULocalPlayerSubsystem and compare where each shows in the Blueprint context menu."}
