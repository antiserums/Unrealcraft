      programming: {why: "Packaging runs the full Build, Cook, Stage, Package pipeline through UAT. Reading its errors is a core coder skill.", do: "Open the Output Log during packaging and find the line that runs BuildCookRun. Copy that line into your writeup."}
      gameplay_design: {why: "Playtesters need a build, not your Editor. A clean Development build is the fastest way to share a level.", do: "Send the staging folder to one friend and ask for one line of feedback on the first 60 seconds of play."}

