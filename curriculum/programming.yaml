      - q: "Where does the Compiler Results panel usually appear when it opens automatically?"
        choices: ["In a separate window", "At the top of the Details panel", "At the bottom of the current Graph panel", "Inside the Content Browser"]
        answer_index: 2
        explain: "Generally the panel appears at the bottom of the current Graph panel."
      - q: "Which two logs does the packaging page say also show compiler messages, warnings and errors during packaging?"
        choices: ["Compiler Results and Details", "Output Log and Message Log", "Visual Logger and Gameplay Debugger", "Crash Reporter and Stats"]
        answer_index: 1
        explain: "The Output Log shows real-time messages including compiler messages. The Message Log stores important errors and warnings, for example under Packaging Results."
