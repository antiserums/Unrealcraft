        choices: ["Project Settings > Engine > Structs", "Blueprint Editor > Add Variable > New Struct", "Content Browser right-click > Blueprints > Structure", "Window > Developer Tools > Struct Editor"]
        answer_index: 2
        explain: "The page says: right-click in the Content Browser, then under Blueprints pick Structure. You then add variables and defaults in the Structure window."
