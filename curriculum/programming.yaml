      gameplay_design: {why: "One prompt-and-use contract works for every interactable in the game.", do: "Add a fourth interactable that returns a different prompt without touching the player code."}
      level_design: {why: "Level props can answer the player without knowing who asks.", do: "Place three interactables in a small room and check every prompt reads well."}

