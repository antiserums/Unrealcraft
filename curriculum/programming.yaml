    specializations: [programming]
    subjects: [cpp, structs, enums, reflection]
    required_spine: false
    required: false
    title: A USTRUCT and a UENUM that Blueprint can use
    brief: "A struct groups several values into one data type, and an enum is a list of named choices, such as Common, Rare and Epic. In Unreal C++ you mark them with the macros USTRUCT and UENUM so that the engine knows about them. If you also add BlueprintType, you can use them in Blueprints. In this quest you write one enum and one struct in C++ and use both in a Blueprint."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/structs-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/metadata-specifiers-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-uproperties"
    checklist:
      - "Open a C++ project, or create one from the Third Person template with C++ selected. You need an IDE such as Visual Studio to compile. Add a header file named ItemTypes.h. It does not need a class. You can use the Class Wizard with the parent None, or create the file by hand."
      - "Declare UENUM(BlueprintType) enum class EItemRarity : uint8 with the values Common, Rare and Epic. Give Epic the text UMETA(DisplayName=\"Legendary\"), which changes the name shown in the editor. Add one more value and mark it with UMETA(Hidden)."
      - "Declare USTRUCT(BlueprintType) struct FItemRow. Put GENERATED_BODY() on its first line. Then add these UPROPERTY fields: FName Id, int32 Stack and EItemRarity Rarity. Mark each of them with EditAnywhere, BlueprintReadWrite."
      - "On a C++ actor named AItemChest, add a UPROPERTY of the type TArray<FItemRow> named Items. Compile, and make a Blueprint named BP_ItemChest from the actor."
      - "In BP_ItemChest, fill in two rows of Items in the Details panel. In the Event Graph, use the Make ItemRow and Break ItemRow nodes and print the Rarity of one row. Blueprint shows the struct name without the F at the start."
      - "Check the dropdown of the enum in the editor. The DisplayName should show, and the Hidden value should not show."
    done_when: "Send a screenshot of the header with the UENUM and the USTRUCT, and a screenshot of BP_ItemChest that shows the rows in the Details panel and a Break ItemRow node with the Rarity pin."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Where must GENERATED_BODY() go inside a USTRUCT?"
        choices: ["As the first line of the struct definition", "As the last line, after all members", "Above the USTRUCT macro", "Anywhere, the order does not matter"]
        answer_index: 0
        explain: "The docs say to include the GENERATED_BODY() macro as the first line of the definition."
      - q: "A teammate wants a UStruct to hold a UFUNCTION and be garbage collected like a UObject. What is true?"
        choices: ["Both work if the struct has BlueprintType", "Neither works: UStructs are not managed by GC and cannot have UFunctions", "GC works but UFunctions do not", "UFunctions work but GC does not"]
        answer_index: 1
        explain: "UStruct supports UProperty, but is not managed by the Garbage Collection system and cannot provide the functionality of a UFunction."
      - q: "Why would you pick a UStruct over a UObject for simple data?"
        choices: ["A UStruct can be spawned in the world", "A UStruct replicates on its own", "A UStruct is faster to create than a UObject with the same data layout", "A UStruct can be a Blueprint parent class"]
        answer_index: 2
        explain: "The docs state that a UStruct is faster to create than a UObject with the same data layout, and that structs are best for simple data types."
      - q: "Which struct specifier makes the struct usable as a variable type in Blueprints?"
        choices: ["Atomic", "NoExport", "Blueprintable", "BlueprintType"]
        answer_index: 3
        explain: "BlueprintType exposes the struct as a type that can be used for variables in Blueprints. Atomic and NoExport control serialization and code generation."
      - q: "When does a Break node appear for your USTRUCT in Blueprint?"
        choices: ["Always, for every USTRUCT", "Only if at least one property is BlueprintReadOnly or BlueprintReadWrite", "Only if the struct has the Atomic specifier", "Only if you write the Break function yourself"]
        answer_index: 1
        explain: "Make appears for any BlueprintType UStruct. Break appears if the struct has at least one BlueprintReadOnly or BlueprintReadWrite property, with one output pin per such property."
      - q: "How do you attach metadata to a single enum value?"
        choices: ["Put UMETA(...) after the value, before the comma", "Put meta=(...) inside the UENUM macro", "Put UPROPERTY(...) above the value", "Put UMETA(...) before the value name"]
        answer_index: 0
        explain: "Enum values use the top-level keyword UMETA, and it is specified after the value it modifies, before the separating comma."
      - q: "Which UMETA tag makes an enum value not appear in the Editor?"
        choices: ["Experimental", "Bitflags", "Hidden", "DisplayName"]
        answer_index: 2
        explain: "Hidden means the value will not appear in the Editor. DisplayName changes the shown text; Bitflags is an enum-level tag for bitmask use."
      - q: "You mark a UENUM with meta=(Bitflags). What does that enable?"
        choices: ["The enum becomes replicated", "Integer UPROPERTY variables with the Bitmask metadata can use it as flags", "The enum values become hidden in the editor", "The enum gains a custom tooltip"]
        answer_index: 1
        explain: "Bitflags indicates the enum can be used as flags by integer UPROPERTY variables set up with the Bitmask Metadata Specifier. Only bits 0 to 31 are shown in the property editor."
    flavors:
      _default: {why: "Structs and enums are how you shape data in C++ so both code and Blueprint can read it."}
      programming: {why: "Most data-driven systems start with a clean USTRUCT and UENUM.", do: "Add a second struct that contains a TArray of the first one, and check Make and Break still work."}
      gameplay_design: {why: "Designers edit these rows in the Details panel; good names and DisplayNames make tuning easier.", do: "Give every enum value a DisplayName a designer would understand."}

  - id: PQ80
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [cpp, containers, tarray, tmap]
    required_spine: false
    required: false
    title: "TArray, TMap and TSet: pick the right container"
    brief: "Unreal C++ has three main container types. TArray is an ordered list, TMap stores pairs of a key and a value, and TSet stores unique values with no order. Each one is fast at different things, so the choice affects how fast and how safe your gameplay code is. In this quest you try the main functions of all three and write the results to the log."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/array-containers-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/map-containers-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/set-containers-in-unreal-engine"
    checklist:
      - "Open a C++ project, or create one from the Third Person template with C++ selected. You need an IDE such as Visual Studio to compile. Make a C++ actor named AContainerLab and place it in a level. In BeginPlay, build a TArray<FString> and add items with Emplace. Then Sort it with a predicate (a small function that compares two items) that sorts by the length of the string."
      - "Use Find to get the index of an item, and FindByPredicate to get a pointer to an item. Log both results with UE_LOG. Also log what Find returns for a value that is not in the array."
      - "Remove one element with RemoveAt and one with RemoveAllSwap. Log the array after each removal, so that you can see how the order changes."
      - "Make a TMap<int32, FString>. Add three entries, and then call Add again with a key that already exists. Log Num() before and after."
      - "On a key that does not exist, use Find (and check the pointer it returns), FindRef and FindOrAdd. Log each result and log Num() after them."
      - "Make a TSet<FString>, Add the same value twice, and log Num(). Then mark the TMap with UPROPERTY(EditAnywhere), make a Blueprint child of the actor named BP_ContainerLab, and edit the map from its Details panel."
    done_when: "Send a screenshot of the Output Log that shows the sorted array, the Find results (also the one for the missing value), the map counts after the duplicate key, and the set count after the duplicate. Also send a screenshot of the map being edited in the Details panel."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "When should you prefer Emplace over Add on a TArray?"
        choices: ["Never, Add is always faster", "For non-trivial types like FString, because Emplace builds the element in place and avoids a temporary", "Only when the array is empty", "Only for arrays of pointers"]
        answer_index: 1
        explain: "Add copies or moves an instance in; Emplace constructs it from the arguments. The rule of thumb is Add for trivial types, Emplace otherwise. Emplace is never less efficient."
      - q: "You sort by length with Sort and three equal-length strings change relative order. Why?"
        choices: ["Sort is unstable (a quicksort); use StableSort to keep the relative order", "The predicate was wrong", "TArray cannot sort strings", "Sort always reverses equal elements"]
        answer_index: 0
        explain: "Sort is implemented as a quicksort and is not stable. StableSort (a merge sort) guarantees the relative order of equivalent elements."
      - q: "What does TArray::Find return when the element is not there?"
        choices: ["0", "-2", "INDEX_NONE", "It asserts"]
        answer_index: 2
        explain: "Find and the IndexOf functions return the special INDEX_NONE value when nothing is found. FindByPredicate returns nullptr."
      - q: "Why use RemoveAtSwap instead of RemoveAt?"
        choices: ["It keeps the order of remaining elements", "It is faster because it does not shuffle later elements down, but the order is not preserved", "It frees the memory of the array", "It removes all matching elements"]
        answer_index: 1
        explain: "Normal removal shuffles the following elements down so there are no holes. The Swap variants skip that overhead but do not guarantee the order of the remaining elements."
      - q: "You call Add on a TMap with a key that already exists. What happens?"
        choices: ["The map now has two pairs with that key", "The call fails and returns false", "The new pair replaces the old one", "It asserts"]
        answer_index: 2
        explain: "TMap keys are unique. Adding a pair with an existing key replaces the old pair. Only TMultiMap stores both."
      - q: "Which lookup on a TMap never adds an element and works on a const map, but returns a copy?"
        choices: ["FindOrAdd", "operator[]", "Find", "FindRef"]
        answer_index: 3
        explain: "FindRef returns a copy of the value, or a default-constructed value if the key is missing, and does not create an element. FindOrAdd is non-const only and adds a new element."
      - q: "Why is operator[] on a TMap risky when you are not sure the key exists?"
        choices: ["It adds the key silently", "It asserts if the map does not contain the key", "It returns a null pointer", "It reorders the map"]
        answer_index: 1
        explain: "You should always check that the map contains the key before using operator[]; if it does not, it asserts. Find does the check and the lookup in one step."
      - q: "What must a type support to be used as a TMap key or TSet element with the default KeyFuncs?"
        choices: ["GetTypeHash and operator==", "operator< only", "A copy constructor only", "Being a UObject"]
        answer_index: 0
        explain: "TMap and TSet are hashing containers. The default KeyFuncs use operator== for equality and the non-member GetTypeHash function for hashing."
    flavors:
      _default: {why: "Choosing the right container decides how fast and how safe your gameplay code is."}
      programming: {why: "Every inventory, registry or lookup in C++ is a TArray, TMap or TSet.", do: "Use Reserve on the array and the map before filling them, and log GetSlack() on the array."}
      tech_art: {why: "Tool code that groups assets or meshes lives on these containers too.", do: "Build a TMap<FName, TArray<AActor*>> that groups actors by tag."}

  - id: PQ81
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [cpp, delegates, events]
    required_spine: false
    required: false
    title: Three kinds of delegates in C++
    brief: "A delegate is a variable that holds a link to a function, so that one piece of code can call a function in another object without knowing its class. Unreal C++ has three main kinds: a single delegate calls one function, a multicast delegate calls many, and a dynamic multicast delegate can also be used from Blueprints. This is how C++ systems talk to each other without depending on each other. In this quest you declare and use all three kinds in one actor."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/delegates-and-lambda-functions-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/multicast-delegates-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/dynamic-delegates-in-unreal-engine"
    checklist:
      - "Open a C++ project, or create one from the Third Person template with C++ selected. You need an IDE such as Visual Studio to compile. Make a C++ actor named AAlarmActor. In its header, declare a single delegate with DECLARE_DELEGATE_OneParam(FOnAlarmMessage, FString), and add a member variable of that type."
      - "In BeginPlay, bind the delegate to a member function with BindUObject and call it with ExecuteIfBound. Then call Unbind and call ExecuteIfBound again. Log that nothing happened the second time."
      - "Declare a multicast delegate with DECLARE_MULTICAST_DELEGATE_OneParam(FOnAlarmLevel, int32). Add two listeners, one with AddUObject and one with AddLambda, and then call Broadcast. Write a log line from both listeners."
      - "Declare DECLARE_DYNAMIC_MULTICAST_DELEGATE_OneParam(FOnAlarmTriggered, int32, Level) and add a member of that type marked with UPROPERTY(BlueprintAssignable), so that Blueprints can bind to it."
      - "Make a Blueprint named BP_Alarm from the actor. In the Blueprint, bind an event to OnAlarmTriggered and print the Level. Trigger the Broadcast from a timer or from a key press."
      - "Also bind the dynamic delegate from C++, in a second actor. Use AddDynamic to bind it to a function that is marked with UFUNCTION."
    done_when: "Send a screenshot of the header with the three DECLARE_ macros, and a screenshot in Play mode where the Blueprint event and the C++ log both react to the same Broadcast."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Which delegate type can be serialized and found by function name, and is exposed to Blueprint with BlueprintAssignable?"
        choices: ["Single delegate", "Multicast delegate", "Dynamic delegate", "Raw delegate"]
        answer_index: 2
        explain: "Dynamic delegates are the UObject, serializable kind; their functions can be found by name. They are slower than regular delegates."
      - q: "You bind a single delegate with BindRaw, then the target object is deleted. What does the doc warn?"
        choices: ["The delegate unbinds itself", "Calling Execute or ExecuteIfBound is unsafe because raw pointers keep no reference", "ExecuteIfBound safely returns false", "Raw bindings are not allowed on single delegates"]
        answer_index: 1
        explain: "BindRaw uses a raw C++ pointer with no reference, so executing after deleting the target is unsafe. BindUObject and BindSP keep a weak reference and are safe with ExecuteIfBound."
      - q: "What happens if you call Execute() on a single delegate that is not bound?"
        choices: ["Nothing, it returns silently", "An assertion is triggered", "It binds a default function", "It returns nullptr"]
        answer_index: 1
        explain: "Execute runs without checking bindings, and calling it before binding triggers an assertion. Use IsBound first or ExecuteIfBound for void delegates."
      - q: "Is it safe to call Broadcast() on a multicast delegate with nothing bound?"
        choices: ["Yes, it is always safe", "No, it asserts like Execute", "Only for dynamic multicast delegates", "Only if the delegate has a return value"]
        answer_index: 0
        explain: "The docs say it is always safe to call Broadcast even if nothing is bound. The only care needed is when a delegate is used to initialize output variables."
      - q: "Which is a limitation of multicast delegates compared to single delegates?"
        choices: ["They cannot be copied", "They cannot be used with structs", "Their functions cannot use return values", "They cannot bind UObject members"]
        answer_index: 2
        explain: "Multicast delegate signatures are not allowed to use a return value. Otherwise they share most features of single delegates."
      - q: "Two listeners are bound to a multicast delegate. In what order does Broadcast call them?"
        choices: ["The order they were added", "Reverse order of adding", "Alphabetical by function name", "The order is not defined"]
        answer_index: 3
        explain: "The execution order of bound functions when calling Broadcast is not defined and may not be the order the functions were added."
      - q: "How do you bind a UFUNCTION to a dynamic multicast delegate from C++?"
        choices: ["AddDynamic(UserObject, FuncName)", "AddUObject(UserObject, &Class::Func)", "BindLambda", "AddRaw(this, &Class::Func)"]
        answer_index: 0
        explain: "AddDynamic is the helper macro for dynamic multicast delegates; it generates the function name string automatically. BindDynamic is the single-delegate version."
      - q: "What limit does the delegate system place on payload variables and function parameters?"
        choices: ["Up to two payloads, up to four parameters", "Up to four payloads, up to eight parameters", "Unlimited payloads, up to four parameters", "No payloads on any delegate"]
        answer_index: 1
        explain: "Delegate signatures support up to four payload variables and up to eight function parameters. All types except dynamic delegates support payload variables."
    flavors:
      _default: {why: "Delegates are how C++ systems talk without knowing about each other."}
      programming: {why: "Dynamic multicast delegates are the C++ side of Blueprint event dispatchers.", do: "Add a UDELEGATE(BlueprintAuthorityOnly) specifier to the dynamic delegate and note what changes in the Blueprint bind node."}
      gameplay_design: {why: "BlueprintAssignable events are what designers hook into from Blueprint.", do: "Bind the same event from two different Blueprints and see both fire."}

  - id: PQ82
