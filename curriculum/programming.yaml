    title: How character movement replicates
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/understanding-networked-movement-in-the-character-movement-component-for-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-role-and-remote-role-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-network-emulation-in-unreal-engine"
    checklist:
      - "Play the Third Person template with 2 players, Play As Listen Server, and network emulation Bad on Everyone. Move the client character and watch it in the server window."
      - "In BP_ThirdPersonCharacter print Get Local Role each second. Confirm which window is the autonomous proxy, the authority and the simulated proxy for that character."
      - "Make BP_Rock, an Actor with a Static Mesh, Replicates on. Move it with a Timeline on Begin Play, but only on the Authority pin. Play and note whether the client sees it move; then turn Replicate Movement on and compare."
      - "In BP_ThirdPersonCharacter set Max Walk Speed to 3000 on Begin Play only when Has Authority is false. Play with emulation on and describe what the server does to the client pawn."
      - "Read the Movement Replication Summary table on the page. Draw the 9 steps as a small diagram on paper or in a drawing tool, with three columns: autonomous proxy, server, simulated proxy."
      - "Write 3 sentences: why ServerMove is an unreliable RPC, and what ClientAdjustPosition does."
    done_when: "A photo or screenshot of your 9-step diagram, plus a screenshot of the client window after the speed change. Add your 3 sentences."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which component provides replicated walking, falling, swimming and flying by default?"
        choices: ["Character Movement Component on ACharacter", "Floating Pawn Movement", "Projectile Movement", "Rotating Movement"]
        answer_index: 0
        explain: "UCharacterMovementComponent comes pre-attached to ACharacter. Its default movement modes are built to replicate by default."
      - q: "Why is ACharacter not just a Pawn with a Character Movement Component added?"
        choices: ["Because Pawns cannot have components", "Because ACharacter is faster to render", "Because Pawns cannot be possessed", "Because ACharacter overrides replicated variables and functions the movement component needs for replication"]
        answer_index: 3
        explain: "ACharacter and UCharacterMovementComponent are designed together. ACharacter overrides several replicated variables and functions to support replication in the movement component."
      - q: "On the owning client, what does the character do after PerformMovement each tick?"
        choices: ["It waits for the server before moving", "It records an FSavedMove_Character, queues it, and sends a condensed ServerMove RPC", "It sends its full mesh transform to all clients", "It calls a multicast RPC"]
        answer_index: 1
        explain: "The autonomous proxy moves locally, builds an FSavedMove_Character, queues it in SavedMoves, combines similar moves and sends the condensed data to the server with a ServerMove RPC."
      - q: "The server's end position does not match the client's reported position. What does the server send?"
        choices: ["A new pawn", "A ClientAdjustPosition correction", "Nothing; the client wins", "A Destroy call"]
        answer_index: 1
        explain: "The server reproduces the move with PerformMovement and compares positions. If they match it confirms the move; otherwise it sends a ClientAdjustPosition RPC and the client replays its saved moves."
      - q: "How do simulated proxies on other clients learn where a character is?"
        choices: ["The server replicates the ReplicatedMovement structure and network smoothing cleans up the motion", "They receive every ServerMove RPC", "They run the same input locally", "They ask the owning client directly"]
        answer_index: 0
        explain: "The server sends its location, rotation and state to simulated proxies by replicating the ReplicatedMovement structure. Simulated proxies apply it directly, with network smoothing for visual cleanup."
      - q: "Why is ServerMove an unreliable RPC?"
        choices: ["Because movement is not important", "Because unreliable RPCs are faster to compile", "Because reliable calls that frequent could overflow the reliable buffer and disconnect the player; the saved-move buffer already resends lost data", "Because the server does not run movement"]
        answer_index: 2
        explain: "ServerMove is called very often. As reliable RPCs it could overflow the reliable function buffer and force a disconnect. The saved-move system already resubmits lost moves and discards moves that are too old."
      - q: "Why does the server compute movement delta time from its own timestamps and not the client's?"
        choices: ["Client clocks are always wrong", "The client sends no timestamp", "To save bandwidth", "So a client cannot speed-hack by speeding up its local game clock"]
        answer_index: 3
        explain: "Most calculations use the server's timestamps instead of the client's to prevent clients from hacking their speed by speeding up the local game clock."
      - q: "Which role runs PerformMovement first, in response to real player input?"
        choices: ["Simulated Proxy", "Authority", "Autonomous Proxy", "None; the server does it"]
        answer_index: 2
        explain: "Step 1 of the summary: the owning client controls the autonomous proxy locally and PerformMovement runs the movement logic there. The server later reproduces it from the ServerMove."
    flavors:
      _default: {why: "Prediction and correction are why your own character feels instant while others lag slightly."}
      programming: {why: "Any custom movement mode must fit into this saved-move cycle or it will rubber-band.", do: "Find MaxSimulationIterations in the component defaults and write one line on what it limits."}

