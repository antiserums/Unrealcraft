  - id: PQ38
    rank: 1
    difficulty: apprentice
    specializations: [programming]
    subjects: [blueprint, construction-script, events, lifecycle]
    required_spine: false
    required: false
    title: Construction Script vs BeginPlay
    brief: "A Blueprint Actor has two places where setup logic can run. The Construction Script runs in the editor each time the Actor is placed or changed, so you see its result before you press Play. Event BeginPlay runs only when the game starts or when the Actor is spawned during play. Putting logic in the wrong one causes strange bugs. In this quest you use both and see when each one runs."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/construction-script-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/events-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-actor-lifecycle"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-variables-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Make a Blueprint named BP_Post with a Static Mesh. Add an Integer variable named Count with a default of 3, and make it Instance Editable so you can change it on each placed copy."
      - "In the Construction Script, add a loop that runs Count times. In each pass, use Add Static Mesh Component, and place the meshes 150 units apart."
      - "Place BP_Post in the level. Change Count in the Details panel and watch the meshes update in the editor, before you press Play."
      - "Add Event BeginPlay and make it print Hello. Add Event End Play and make it print the End Play Reason. Press Play and then stop."
      - "Add an Instance Editable Linear Color variable and turn on Expose on Spawn for it. In the Level Blueprint, use Spawn Actor from Class with BP_Post and set the color on the spawn node."
      - "Write down which script ran in the editor and which one ran only in Play."
    done_when: "Send a screenshot of the editor viewport that shows BP_Post rebuilt after you changed Count (without pressing Play), and a screenshot of the Output Log that shows the BeginPlay and End Play messages."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "When does the Construction Script run?"
        choices: ["Every frame", "When an instance of the Blueprint Class is created, after the Components list", "Only when the game starts", "Only when the actor is destroyed"]
        answer_index: 1
        explain: "The Construction Script runs following the Components list when an instance of a Blueprint Class is created. This lets the instance do its own setup."
      - q: "Which Blueprint type has no Construction Script?"
        choices: ["Actor Blueprint Class", "Character Blueprint Class", "Pawn Blueprint Class", "Level Blueprint"]
        answer_index: 3
        explain: "Only Blueprint Classes contain Construction Scripts. Level Blueprints do not have them."
      - q: "An actor is spawned after the game already started. When does it get Event BeginPlay?"
        choices: ["Never", "At the next level reset", "Immediately after spawning", "Only if it has a Construction Script"]
        answer_index: 2
        explain: "BeginPlay fires for all Actors when the game starts, and any Actor spawned later has it called immediately."
      - q: "In the spawn path of the Actor lifecycle, in which order do these happen?"
        choices: ["BeginPlay, then OnConstruction, then PostInitializeComponents", "OnConstruction, then PostInitializeComponents, then BeginPlay", "PostInitializeComponents, then OnConstruction, then BeginPlay", "They all run at the same time"]
        answer_index: 1
        explain: "OnConstruction (where Blueprint components are created and variables initialized) comes first, then component initialization, then BeginPlay."
      - q: "What does Event End Play give you that Event Destroyed does not?"
        choices: ["An End Play Reason enum, and Destroyed is planned for deprecation", "The Delta Seconds", "The Other Actor", "The Hit Location"]
        answer_index: 0
        explain: "End Play outputs an End Play Reason enum. The Destroyed event will be deprecated, since its role moved into EndPlay."
      - q: "What does Expose on Spawn do for a variable?"
        choices: ["Makes the variable appear as a pin on the Spawn Actor from Class node", "Runs the Construction Script twice", "Makes the variable private", "Replicates it to clients"]
        answer_index: 0
        explain: "With Expose on Spawn, the option to set the value is added to the Spawn Actor from Class node, so you can set it when the actor spawns."
    flavors:
      _default: {why: "Editor-time setup and play-time logic live in different scripts. Putting code in the wrong one causes strange bugs."}
      tech_art: {why: "Construction Scripts are the base of most procedural props and placement tools.", do: "Add a Boolean that switches the mesh, and see it update in the editor."}
      level_design: {why: "Actors that build themselves make blockouts faster.", do: "Make a fence actor whose length follows a Count value."}

  - id: PQ39
    rank: 1
    difficulty: apprentice
    specializations: [programming]
    subjects: [actors, lifecycle, blueprint]
    required_spine: false
    required: false
    title: Birth and death of an actor
    brief: "Every Actor goes through the same steps in its life: it is constructed, then BeginPlay runs, and when it is removed EndPlay runs. If you know this order, you can explain most bugs where a value is still empty when you try to use it. In this quest you build a small test Actor that prints a message at each step, and you read the order in the Output Log."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-actor-lifecycle"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/actors-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/spawning-actors-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Actor/DestroyActor"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make a Blueprint Actor named BP_LifeProbe with a Static Mesh that is a cube. On Event BeginPlay, add a Print String that prints the actor name plus 'BeginPlay'."
      - "Add Event End Play. Make it print the actor name plus 'EndPlay' and also the End Play Reason."
      - "In the Construction Script, add a Print String that prints 'Construct'. Drag BP_LifeProbe into the level and watch the message appear before you press Play."
      - "In the Level Blueprint, add an event for key 1 that uses Spawn Actor from Class to spawn BP_LifeProbe at the player location. Add an event for key 2 that calls Destroy Actor on the last probe you spawned."
      - "Press Play. Press 1 and then 2. Read the Output Log and note the order of the messages: Construct, BeginPlay, EndPlay."
      - "Spawn a probe and stop Play In Editor (PIE) while the probe is still alive. Check the log: End Play fires again, and this time the reason is End Play in Editor."
    done_when: "Send a screenshot of the Output Log that shows the Construct, BeginPlay and EndPlay messages in order for one spawned probe, and a second EndPlay line with the End Play in Editor reason."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "An actor is spawned during play. In which order do these three happen?"
        choices: ["OnConstruction, BeginPlay, PostInitializeComponents", "PostInitializeComponents, OnConstruction, BeginPlay", "OnConstruction, PostInitializeComponents, BeginPlay", "BeginPlay, OnConstruction, PostInitializeComponents"]
        answer_index: 2
        explain: "The Spawning path runs ExecuteConstruction (OnConstruction, where Blueprint components and variables are set up), then PreInitializeComponents, InitializeComponent, PostInitializeComponents, and finally BeginPlay."
      - q: "What does Destroy do to an actor right away?"
        choices: ["It frees its memory immediately", "It marks it pending kill and removes it from the level's actor list; memory is freed later by garbage collection", "It only hides the actor", "It deletes the Blueprint asset"]
        answer_index: 1
        explain: "Destroy marks the actor pending kill and removes it from the level's array of actors. The memory is de-allocated on the next garbage collection cycle."
      - q: "Which of these does NOT call EndPlay on an actor?"
        choices: ["Play in Editor ends", "A streaming level containing the actor is unloaded", "The actor is selected in the Outliner", "An explicit call to Destroy"]
        answer_index: 2
        explain: "EndPlay is called by Destroy, when PIE ends, on level transitions, when a streaming level unloads, when the lifetime expires, and on application shutdown. Selecting an actor does nothing to its lifecycle."
      - q: "You want cleanup logic to run when an actor is destroyed AND when the level changes. Where does the documentation tell you to put it?"
        choices: ["EndPlay", "OnDestroyed", "BeginDestroy", "Tick"]
        answer_index: 0
        explain: "OnDestroyed is a legacy response to Destroy only. Epic recommends moving that logic to EndPlay, which is also called by level transitions and other game cleanup."
      - q: "In the Play in Editor path, how do actors get into the play world?"
        choices: ["They are loaded from disk like a packaged game", "They are copied (duplicated) from the Editor world, then initialized like loaded actors", "They are all re-spawned by the Level Blueprint", "They are streamed from the Content Browser"]
        answer_index: 1
        explain: "In PIE, actors are duplicated from the Editor into a new World (PostDuplicate is called), and then they follow the same initialization steps as the Load From Disk path."
      - q: "What does 'Deferred Spawn' allow?"
        choices: ["Spawning without any components", "Spawning on a background thread", "Skipping BeginPlay forever", "Setting properties on a valid but incomplete actor before its construction script runs"]
        answer_index: 3
        explain: "SpawnActorDeferred lets you do setup on the actor after PostActorCreated. FinishSpawning then continues at ExecuteConstruction. Expose on Spawn properties use this path."
    flavors:
      _default: {why: "Knowing when BeginPlay, Construction and EndPlay run stops most 'why is my value empty' bugs."}
      gameplay_design: {why: "Spawn and destroy timing decides when a designer's setup values are usable.", do: "Add an Expose on Spawn variable to the probe and print it in BeginPlay."}
      tech_art: {why: "Tool actors rely on the Construction Script running in the editor, not BeginPlay.", do: "Move the 'Construct' print to BeginPlay and note which one still shows in the editor."}

  - id: PQ40
    rank: 1
    difficulty: apprentice
    specializations: [programming]
    subjects: [components, scene-components, blueprint]
    required_spine: false
    required: false
    title: Build an actor from components
    brief: "An Actor is built from components, which are parts such as a mesh, a light or a collision box. The components form a tree: when one component is the child of another, it moves together with its parent. Every Actor you will ever make is a tree like this, so you need to be able to read and build it. In this quest you build a lantern from several components and test how the parent and child links behave."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/components-window-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/components-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/actors-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make a Blueprint Actor named BP_Lantern and keep the default Scene root. Add a Static Mesh Component for the pole, a second Static Mesh for the lamp head, and a Point Light."
      - "In the Components window, drag the lamp head onto the pole so that it becomes a child of the pole. Then drag the Point Light onto the lamp head."
      - "Select the pole and move it in the viewport. Confirm that the head and the light move with it. Then move only the head and confirm that only the light follows."
      - "Select each component, press F2, and rename them to Pole, Head and Light. Check the new names in the My Blueprint panel."
      - "Add a Rotating Movement Component. Press Play and see the lantern spin. Notice that this component has no transform in the viewport, which means it has no position of its own."
      - "Add a Box Component named Trigger. In the Details panel, click Add Event and pick On Component Begin Overlap. Make it print a string when the player walks into the box."
    done_when: "Send a screenshot of the Components window of BP_Lantern that shows the hierarchy with Pole, then Head, then Light, plus the Rotating Movement and Trigger components. Also send a screenshot in Play mode with the overlap message on screen."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Which statement about an actor's transform is correct?"
        choices: ["The actor stores its own location and the components copy it", "The actor's location, rotation and scale come from its root component", "Every component stores the actor's transform", "Only Primitive Components can give an actor a transform"]
        answer_index: 1
        explain: "Actors do not store transform data. The transform of the actor's Root Component (a Scene Component) is used instead."
      - q: "A Rotating Movement Component has no position in the world. Which component family is it in?"
        choices: ["Primitive Component", "Scene Component", "Actor Component (no transform)", "Child Actor Component"]
        answer_index: 2
        explain: "Actor Components (UActorComponent) are for abstract behaviors such as movement or inventory. They have no transform, so no location or rotation in the world."
      - q: "What is the difference between a Scene Component and a Primitive Component?"
        choices: ["A Primitive Component is a Scene Component that also has geometry to render or collide with", "A Scene Component can render meshes, a Primitive Component cannot", "A Primitive Component has no transform", "There is no difference; the names are aliases"]
        answer_index: 0
        explain: "Scene Components have a transform but no geometry (spring arms, cameras, audio). Primitive Components are Scene Components with geometric representation, like meshes and collision shapes."
      - q: "You move a parent component in the Blueprint viewport. What happens to its children?"
        choices: ["Nothing; each component moves alone", "They are detached", "They move with the parent, because transforms propagate down to all child components", "They snap back to the root"]
        answer_index: 2
        explain: "Transforming, rotating or scaling a parent component propagates the change to all of its child components."
      - q: "How can you quickly rename a component in the Components window?"
        choices: ["Double-click the viewport", "Select it and press F2", "Right-click and choose Compile", "Press Delete and add it again"]
        answer_index: 1
        explain: "The docs say you can quickly rename a component by selecting it in the Components window and pressing F2. The Variable Name field in Details also works."
      - q: "Which of these can you drag from the Content Browser straight into the Components window to make a component?"
        choices: ["A Material", "A Level", "A Texture", "A Static Mesh"]
        answer_index: 3
        explain: "Dragging assets into the Components window works for Static Meshes, Sound Cues, Skeletal Meshes and Particle Systems."
    flavors:
      _default: {why: "Every actor you will ever write is a tree of components. Learn to read and build that tree."}
      tech_art: {why: "Tools often add and arrange components from the Construction Script.", do: "Add the Head mesh from the Construction Script with Add Static Mesh Component and attach it to Pole."}
      gameplay_design: {why: "Designers place actors, not components; a clean hierarchy makes placement predictable.", do: "Expose the light color as an instance-editable variable."}

