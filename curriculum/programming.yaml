        answer_index: 0
        explain: "In Class Defaults, click plus on Supported Classes and add for example Static Mesh Actor. Then the action shows only for that class."
      - q: "Your Scripted Action function has an input. What happens when you run it?"
        choices: ["The action is hidden", "The Editor opens a small window asking you to enter the input value", "The input uses its default value silently", "The function fails to compile"]
        answer_index: 1
        explain: "Inputs on the function or Custom Event make the editor pop up a window to enter the values each time you run the action."
      - q: "Why can editor-only Blueprint classes use more Editor Scripting nodes than a normal Actor Blueprint?"
        choices: ["They compile faster", "They run on the render thread", "Functions from Editor-type modules are only available to editor-only classes, because they cannot work at runtime", "They have a larger memory budget"]
        answer_index: 2
        explain: "Operations that change assets or the editor UI cannot run in a packaged game. So functions from Editor modules are only exposed to editor-only classes like Editor Utility Blueprints."
