      - "In the Components window, drag the lamp head onto the pole so it becomes a child of the pole. Drag the Point Light onto the lamp head."
      - "Select the pole and move it in the viewport. Confirm the head and the light move with it. Move the head alone and confirm only the light follows."
      - "Rename the components with F2: Pole, Head, Light. Check the new names in the My Blueprint panel."
      - "Add a Rotating Movement Component. Play and see the lantern spin. Note that this component has no transform in the viewport."
