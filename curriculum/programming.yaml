# Unrealcraft — Programming specialization, all ranks. IDs PQ1…
# Difficulty tiers: novice (rank 0) · apprentice (1) · adept (2) · expert (3) · master (4).
# Every URL was checked against the live UE 5.8 docs when written.

quests:
  - id: PQ31
    rank: 1
    difficulty: apprentice
    specializations: [programming]
    subjects: [blueprint, variables, containers]
    required_spine: false
    required: false
    title: "Arrays, Sets and Maps"
    brief: "A container is a variable that holds many values instead of one. Unreal has three kinds: an Array is an ordered list where each item has a number called its index, a Set is a group where every item must be different, and a Map stores pairs made of a key and a value, so you can look up a value by its key. Almost every gameplay system stores lists of things, so you will use these all the time. In this quest you make one of each and print what is inside them."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-arrays?application_version=4.27"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-sets?application_version=4.27"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-maps?application_version=4.27"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/array-nodes?application_version=4.27"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-variables-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Make an Actor Blueprint named BP_Containers and place it in the level. Add a String variable named Names. Click the Variable Type icon next to the type and pick the Array container, so the variable holds a list of Strings."
      - "Click Compile. Then open Class Defaults and add 4 default items to Names (for example Apple, Banana, Cherry, Date)."
      - "Add a second String variable and turn it into a Set (the { } option in the same container menu). Try to add the same item twice and read the warning that appears."
      - "Add a Map variable with a String key and an Integer value, and name it Scores. Add 3 key-value pairs in the defaults."
      - "On Event BeginPlay, add a For Each Loop node that goes through Names. Use Print String to print each item together with its index."
      - "Use the Find node on Scores with one key, and print the value it returns. Then use Contains Item on the Set and print the result."
      - "Press Play. Read the Output Log and check the order of the printed items and their index numbers."
    done_when: "Send one screenshot of the My Blueprint panel that shows the three container variables (Array, Set, Map) with their type icons, and one screenshot of the Output Log with the printed items and index numbers."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "You add five items to an Array. What is the index of the first item?"
        choices: ["1", "0", "5", "-1"]
        answer_index: 1
        explain: "Array indices are zero-based. The first item is index 0 and the fifth item is index 4."
      - q: "An Array holds N items. What does the Length node return, and which indices are valid?"
        choices: ["N, valid indices 0 to N-1", "N-1, valid indices 1 to N", "N, valid indices 1 to N", "N+1, valid indices 0 to N"]
        answer_index: 0
        explain: "Length returns N, the number of items. Valid indices run from 0 to N-1."
      - q: "What is special about the key of an item in a Set?"
        choices: ["The key is the item's index in the Set", "The key is a separate String you choose", "The key is the item itself", "Sets do not have keys"]
        answer_index: 2
        explain: "In a Set the value of an item is also the key used to find it. This is why items in a Set must be unique."
      - q: "In a Blueprint Map, which of these is allowed?"
        choices: ["Two entries with the same key", "A key of one type and a second key of another type", "Editing the Map defaults before compiling", "Two entries with the same value"]
        answer_index: 3
        explain: "Duplicate values are allowed, but keys must be unique and all keys must have the same type. You must compile before you can edit the defaults."
      - q: "You want to know if an Array holds a value, but you do not need its position. Which node fits?"
        choices: ["Find Item", "Contains Item", "Get", "Last Index"]
        answer_index: 1
        explain: "Contains Item returns True or False and does not return the index. Find Item returns the index of the first match."
      - q: "You call Remove Index on index 1 of a five-item Array. What happens to the other items?"
        choices: ["Index 1 becomes empty and the others keep their numbers", "The Array is cleared", "The remaining index numbers update to close the gap", "The item is moved to the end"]
        answer_index: 2
        explain: "Remove Index removes the item and all remaining index numbers update to close the gap."
    flavors:
      _default: {why: "Almost every gameplay system stores lists of things. Picking the right container keeps the code simple and fast."}
      gameplay_design: {why: "Inventories, spawn lists and score tables are all containers.", do: "Build a tiny inventory as a Map of item name to count."}
      tech_art: {why: "Tool scripts often loop over many assets or actors.", do: "Fill an Array with all actors of a class and print their names."}

  - id: PQ32
    rank: 1
    difficulty: apprentice
    specializations: [programming]
    subjects: [blueprint, casting, communication]
    required_spine: false
    required: false
    title: Cast To, and when it fails
    brief: "A reference to an Actor is often general: Unreal only knows that it is some Actor. A Cast To node asks if that Actor is really a more specific Blueprint class. If it is, you can use the functions of that class. If it is not, the cast fails and the Cast Failed pin runs instead. In this quest you make the player character cast the Actors it touches, and you see both the success and the failure."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/casting-quick-start-guide-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-communication-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-communication-usage-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make a Blueprint named BP_RotateActor with a Static Mesh that uses a cube mesh, such as SM_Cube from the folder LevelPrototyping/Meshes of the template. On Event Tick, call AddActorLocalRotation with Z = 2.0, and put it behind a Branch node that reads a Boolean variable named CanRotate."
      - "Add a function named OverlappedPlayer with a Boolean input named Begin Overlap. Inside the function, use that input to set CanRotate."
      - "Open the character Blueprint of the template, BP_ThirdPersonCharacter, and add a Sphere Collision component with Radius 200. Add the events OnComponentBeginOverlap and OnComponentEndOverlap for it."
      - "Drag from the Other Actor pin and add a Cast To BP_RotateActor node. From the As BP Rotate Actor pin, call OverlappedPlayer. Pass True on the begin overlap event and False on the end overlap event."
      - "Connect a Print String node to the Cast Failed pin, so you can see when the cast does not work. Place BP_RotateActor and one plain cube in the level."
      - "Press Play and walk near both objects. The cube from BP_RotateActor should spin, and the plain cube should print the failed message."
    done_when: "Send a screenshot of the character graph that shows the Cast To node with the Cast Failed pin in use, and a screenshot in Play mode with the actor spinning near the player."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "In simple words, what does a Cast node ask an object?"
        choices: ["Are you a special version of that class, and if so let me access you", "Do you exist in the level", "Can you send me an event later", "What is your index in the level"]
        answer_index: 0
        explain: "A Cast tries to convert a reference to a more specific class. If it works you get access to that class. If not, the cast fails and you disregard the request."
      - q: "Your project uses a different Character Blueprint than the one you Cast To. What happens?"
        choices: ["The cast still works because both are Characters", "The cast fails, so you cannot reach that class's functions", "The engine crashes", "The player is converted to the cast class"]
        answer_index: 1
        explain: "The docs give this example: if the player is not using the Flying Character Blueprint, Cast To Flying Blueprint fails and you cannot execute the flying command."
      - q: "What do you need before you can cast?"
        choices: ["An Event Dispatcher on the target", "An Interface on both Blueprints", "The Level Blueprint open", "A reference to the Actor you want to cast"]
        answer_index: 3
        explain: "Casting requires a reference to the Actor. You take that reference and try to convert it to a specific class."
      - q: "Which relationship does casting use between your working Actor and the target?"
        choices: ["One-to-many", "Many-to-many", "One-to-one", "No relationship, it is global"]
        answer_index: 2
        explain: "Casting, like direct communication, is one-to-one between your working Actor and your target Actor."
      - q: "In the quick start, which pin of On Component Begin Overlap do you drag from to Cast To BP_RotateActor?"
        choices: ["Overlapped Component", "Other Comp", "Other Actor", "Sweep Result"]
        answer_index: 2
        explain: "Other Actor holds the Actor that entered the sphere. You drag from that pin and choose the Cast To node."
      - q: "You have Cat, Dog and Bird Blueprints that all come from an Animal Blueprint. Which is a listed case for casting?"
        choices: ["Bind all animals to one event", "Access one specific child Blueprint such as Cast To Cat", "Share a variable across all animals", "Make the animals talk to the Level Blueprint"]
        answer_index: 1
        explain: "The docs list accessing a specific Child Blueprint (Cast to Cat, Cast to Dog or Cast to Bird) as a use case for casting."
    flavors:
      _default: {why: "Casting is the first tool most people reach for. Knowing when it fails saves hours of debugging."}
      gameplay_design: {why: "Most trigger and pickup logic starts with a cast on Other Actor.", do: "Make a second actor type and show that the cast fails for it."}
      level_design: {why: "Level scripting often needs to check what entered a trigger.", do: "Use the cast in a Trigger Volume to open a door only for the player."}

  - id: PQ33
    rank: 1
    difficulty: apprentice
    specializations: [programming]
    subjects: [blueprint, references, variables]
    required_spine: false
    required: false
    title: Object reference or class reference
    brief: "A variable can point to one real object that exists in the level, or it can point to a class, which is the recipe used to create new objects. The first is called an Object Reference and the second a Class Reference. They have different icons and pin colors, and mixing them up is a common mistake. In this quest you use an Object Reference to switch one placed lamp on and off, and a Class Reference to spawn new lamps."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/direct-actor-communication-quick-start-guide-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-variables-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/referencing-assets-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/spawning-actors-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make an Actor Blueprint named BP_Lamp with a Static Mesh component that uses a cylinder, and a Point Light component. Place BP_Lamp in the level. Epic's guide uses a ceiling light Blueprint from the Starter Content, which current engine versions no longer include."
      - "In the character Blueprint of the template, BP_ThirdPersonCharacter, add a variable named LampReference. Set its type to BP Lamp and choose Object Reference. Enable Instance Editable, which lets you set the value on the character placed in the level."
      - "Add an event for the F key. Use a Flip Flop node and Set Visibility to turn the Point Light of the lamp on and off through LampReference."
      - "Select the character in the level. In the Details panel, open the Lamp Reference dropdown and pick the lamp you placed. Press Play and press F."
      - "Add a second variable named LampClass. Set its type to BP Lamp and choose Class Reference. Set its default value to BP_Lamp."
      - "Add an event for the G key. Use Spawn Actor from Class with LampClass, and spawn the lamp at the player location plus 200 units forward."
      - "Compare the icons of the two variables and the colors of their pins. Write one sentence that says what each variable holds."
    done_when: "Send a screenshot of the graph that shows both variables in use (one Object Reference and one Class Reference). Add one sentence that explains the difference in your own words."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Direct Actor communication needs one thing before it can work. What is it?"
        choices: ["An Interface on the target", "A reference to the target Actor", "A Cast Failed pin", "A Macro Library"]
        answer_index: 1
        explain: "Direct communication requires a reference to the target Actor so you can access it from your working Actor."
      - q: "Why is Instance Editable enabled on LampReference in the quick start?"
        choices: ["So the variable can be read from C++", "So the lamp spawns at BeginPlay", "So you can pick the placed lamp in the Details panel of the character instance", "So the variable replicates"]
        answer_index: 2
        explain: "After making the variable Instance Editable, you select the character in the level and set Lamp Reference in its Details panel."
      - q: "A variable is set to Private. What changes for other Blueprints?"
        choices: ["They can still read it but not set it", "They can only access it after a cast", "Nothing changes; Private only hides it in the Details panel", "They cannot access the variable at all"]
        answer_index: 3
        explain: "With Private checked, another Blueprint that spawns the Actor cannot access that variable from the Return Value."
      - q: "What is a hard reference between object A and object B?"
        choices: ["A points to B by a string path and loads it later", "A and B share the same memory", "A refers to B and causes B to load when A loads", "A can only see B after BeginPlay"]
        answer_index: 2
        explain: "A hard reference makes object B load when object A loads. A soft reference stores an indirect path and you load it manually."
      - q: "What does a soft class reference (TSoftClassPtr) point to?"
        choices: ["The UClass of the asset, not an instance", "An instance of an Actor in the level", "A texture on disk", "A string that is never loaded"]
        answer_index: 0
        explain: "TSoftClassPtr works like TSoftObjectPtr but refers to the UClass for the asset instead of an instance."
      - q: "When spawning an Actor with no Template, what is used to set the new Actor's starting values?"
        choices: ["The class default object (CDO)", "The nearest placed Actor of that class", "The Level Blueprint", "The last spawned Actor"]
        answer_index: 0
        explain: "If no template Actor is given, the class default object (CDO) initializes the spawned Actor."
    flavors:
      _default: {why: "Pin color and icon tell you if you hold a thing or a recipe for a thing. Mixing them up is a common bug."}
      gameplay_design: {why: "Spawners hold class references; triggers hold object references.", do: "Make a spawner actor with an Instance Editable class reference and spawn it on a key."}
      tech_art: {why: "Editor tools often take a class to spawn many copies.", do: "Spawn 5 lamps in a row from the class reference in a loop."}

  - id: PQ34
    rank: 1
    difficulty: apprentice
    specializations: [programming]
    subjects: [blueprint, interfaces, communication]
    required_spine: false
    required: false
    title: One Interact interface, many actors
    brief: "A Blueprint Interface is a list of function names with no code inside. Any Blueprint can add the interface and then give its own answer to those functions. This lets very different Actors, such as a lamp and a door, respond to the same call, and the caller does not need to know which kind of Actor it is talking to. In this quest you make one Interact interface, add it to two Actors, and call it from the player character."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/interface-quick-start-guide-in-unreal-engine?application_version=5.5"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-communication-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-interface-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/implementing-blueprint-interfaces-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Create a Blueprint Interface named BPI_Interact with one function named Interact. Click Compile and save it."
      - "Make an Actor Blueprint named BP_Lamp with a Static Mesh component that uses a cylinder, and a Point Light component. Add a custom event named ToggleLight that uses Flip Flop and Set Visibility on the Point Light to turn the light on and off."
      - "In BP_Lamp, open Class Settings and add BPI_Interact under Implemented Interfaces. Then add Event Interact to the graph and make it call ToggleLight."
      - "Make a Blueprint named BP_Door with two Static Mesh components named Frame and Door. Add a custom event named OpenDoor that uses a Timeline named TM_Door, with an Alpha value that goes from 0 to 1. Use a Lerp node to turn the door Yaw to 90."
      - "Add BPI_Interact to BP_Door in the same way. Implement Event Interact there and make it call OpenDoor."
      - "In the character Blueprint of the template, BP_ThirdPersonCharacter, add a Sphere Collision component with Radius 200. On its begin overlap event, call Interact (Message) and connect Other Actor to the Target pin."
      - "Place BP_Lamp, BP_Door and a plain cube in the level. Press Play and walk near all three. Nothing should happen at the plain cube, because it does not use the interface."
    done_when: "Send a screenshot of the Class Settings panel of one actor that shows BPI_Interact under Implemented Interfaces, and a screenshot in Play mode with the door open and the lamp toggled."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which of these can a Blueprint Interface NOT do?"
        choices: ["Define a function with inputs and outputs", "Be implemented by many Blueprints", "Have a Replicates option in Class Settings", "Add new variables"]
        answer_index: 3
        explain: "Blueprint Interfaces cannot add new variables, edit graphs or add Components. They hold function signatures only."
      - q: "You call Interact (Message) on an Actor that does not implement BPI_Interact. What happens?"
        choices: ["The Blueprint fails to compile", "The call fails silently", "The Actor is destroyed", "The engine adds the interface automatically"]
        answer_index: 1
        explain: "The Message version can be called on any object. If the object does not implement the interface, the call fails silently. It is also slower than the Object and Interface versions."
      - q: "Where do you add an interface to an existing Blueprint?"
        choices: ["In the Event Graph right-click menu", "In Project Settings", "In Class Settings, under Interfaces > Implemented Interfaces > Add", "In the Content Browser context menu of the Blueprint"]
        answer_index: 2
        explain: "Open the Blueprint, click Class Settings, then add the interface in the Implemented Interfaces list. Then Compile and Save."
      - q: "The docs prefer an Interface over casting for a door, window and car that all open. Why?"
        choices: ["Interfaces are the only way to open doors", "The same function call works on all classes without casting to each one", "Casting cannot be used on Actors", "Interfaces run on the server only"]
        answer_index: 1
        explain: "With an interface you call the same function on every class. With casting you would need a cast for each class."
      - q: "What performance risk does casting have that an interface avoids?"
        choices: ["Loading an Actor that casts to another Actor also loads that Actor into memory, which can cascade", "Casting uses more CPU every frame", "Casting disables Nanite", "Casting cannot be used in packaged builds"]
        answer_index: 0
        explain: "An Actor that casts to another Actor loads that Actor too. Without care this causes a cascade of loads. Interfaces avoid that link."
      - q: "How do you start implementing an interface function in a Blueprint that implements it?"
        choices: ["Right-click the function under My Blueprint > Interfaces and choose Implement event or Open Graph", "Drag the interface asset into the graph", "Add a Custom Event with the same name", "Cast to the interface first"]
        answer_index: 0
        explain: "Interface functions appear under My Blueprint > Interfaces. Double-click or right-click them to open the graph or implement the event."
    flavors:
      _default: {why: "Interfaces let very different actors answer the same call. This is how a clean interaction system starts."}
      gameplay_design: {why: "One Use key, many results: doors, levers, pickups.", do: "Add a third actor that reacts to Interact in a new way."}
      level_design: {why: "Level scripts can call Interact on anything without knowing its type.", do: "Trigger Interact from a Level Blueprint trigger on the door."}

  - id: PQ35
    rank: 1
    difficulty: apprentice
    specializations: [programming]
    subjects: [blueprint, event-dispatchers, communication]
    required_spine: false
    required: false
    title: One event, many listeners
    brief: "An Event Dispatcher is a way for one Actor to announce that something happened, without knowing who is listening. Other Actors bind to the dispatcher, which means they sign up to be told, and they all react when it is called. This keeps Actors independent: the boss does not need to know about the doors. In this quest one trigger box announces that a boss died, and a door and several alarm lights react at the same time."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/event-dispatchers-and-delegates-quick-start-guide-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/event-dispatchers-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/binding-and-unbinding-events-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-dispatcher-events-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/calling-event-dispatchers-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make a Blueprint named BP_BossDied with a Box Collision component. Set its scale to 4, 4, 2 and turn off Hidden in Game so you can see the box while you play. Add an Event Dispatcher named OnBossDied."
      - "On the OnComponentBeginOverlap event of the box, add the Call OnBossDied node. Place BP_BossDied in the level."
      - "Make a Blueprint named BP_BossDoor with a Frame mesh and a Door mesh. Add a custom event named OpenDoor that uses a Timeline named TM_Door to rotate the door to Yaw 90."
      - "In BP_BossDoor, add an Instance Editable variable named BossDiedReference with the type BP_BossDied Object Reference. On BeginPlay, use Bind Event to OnBossDied and connect a custom event named BossDied that calls OpenDoor."
      - "Make an Actor Blueprint named BP_AlarmLight with a Point Light component. Give the light a red color and turn off Visible on it, so the light starts off. Add an Instance Editable variable named BossDiedReference with the type BP_BossDied Object Reference. On BeginPlay, use Assign OnBossDied on that reference, and make the new event call Toggle Visibility on the Point Light. Epic's guide uses an explosion Blueprint from the Starter Content here, which current engine versions no longer include."
      - "Place the door and 3 alarm lights in the level. On each one, set BossDiedReference to the BP_BossDied you placed. Press Play and walk into the box."
      - "Extra: on one alarm light, add an Unbind All Events node after it reacts. Walk into the box a second time. The other lights switch off again, and this one stays on because it no longer listens."
    done_when: "Send a screenshot of the BP_BossDoor graph that shows Bind Event to OnBossDied, and a screenshot in Play mode with the door open and the alarm lights on at the same time."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What relationship do Event Dispatchers use?"
        choices: ["One-to-one", "Many-to-one only", "They only work inside one Blueprint", "One-to-many"]
        answer_index: 3
        explain: "One working Actor triggers the Event Dispatcher and many listening Actors are notified."
      - q: "You Call an Event Dispatcher but nothing is bound to it. What happens?"
        choices: ["A compile error", "The call has no effect", "All actors in the level react", "The Level Blueprint receives it"]
        answer_index: 1
        explain: "Calling the Event Dispatcher has no effect if there are no events bound to it. Each dispatcher keeps a list of bound events."
      - q: "The same Bind Event node runs three times for the same event. How many times is that event in the list?"
        choices: ["Three", "Zero", "One", "Depends on the Target pin"]
        answer_index: 2
        explain: "Each event can be bound only once, even if the Bind Event node is executed multiple times."
      - q: "What does the Assign option do?"
        choices: ["Creates a Bind Event node and a matching custom event, already wired", "Only calls the dispatcher", "Removes all bound events", "Creates an event with no binding"]
        answer_index: 0
        explain: "Assign creates a Bind Event node and a corresponding Event node wired together. The quick start uses it for the explosion."
      - q: "Inside a Blueprint Class, what is the Target pin of a Bind node set to, and what does that mean?"
        choices: ["Self, so the event list changes for every instance of the class", "The Level Blueprint, so only the level reacts", "None, so you must always connect an instance", "The player, so only the player is notified"]
        answer_index: 0
        explain: "In the Blueprint Class the Target is Self, so the event list is changed for the class and every instance. In the Level Blueprint you must connect a specific instance."
      - q: "An event node created from the dispatcher's Event option is placed in the graph but never connected to a Bind node. What happens on Call?"
        choices: ["It fires like any event", "It fires once", "It never triggers", "It fires only in the Level Blueprint"]
        answer_index: 2
        explain: "Without a Bind node, that event will never be triggered when the Call node is executed."
    flavors:
      _default: {why: "Dispatchers remove hard links between actors. The boss does not need to know about the doors."}
      gameplay_design: {why: "Score, death and checkpoint events fan out to UI, sound and level logic.", do: "Bind a Print String in the Level Blueprint to the same OnBossDied."}
      level_design: {why: "One trigger can open many doors and lights without wiring each one.", do: "Bind two more actors of different types to the same dispatcher."}

  - id: PQ36
    rank: 1
    difficulty: apprentice
    specializations: [programming]
    subjects: [blueprint, functions, libraries]
    required_spine: false
    required: false
    title: A Blueprint Function Library
    brief: "A Blueprint Function Library is an asset that holds helper functions that any Blueprint in your project can call. It is the right place for small tools, such as a piece of math, that do not belong to one Actor. Without it, people copy the same nodes into many Blueprints. In this quest you make a library with two functions and call them from an Actor."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-function-libraries-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/functions-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-best-practices-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. In the Content Browser, create a new asset by choosing Blueprints, then Blueprint Function Library. Name it BFL_Utils."
      - "Add a function named DistanceXY with two Vector inputs and one Float output. Mark it as Pure, which means it only returns a value and changes nothing. Build the math from the two inputs."
