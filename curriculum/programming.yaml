    verify_type: screenshot
    quiz:
      - q: "Set Game Paused returns a Boolean. What does it mean?"
        choices: ["Whether the pause or unpause was successful", "Whether the game is currently paused", "Whether a pause menu exists", "Whether input is blocked"]
        answer_index: 0
        explain: "The return value says whether the game was successfully paused or unpaused. To read the current state, use Is Game Paused."
      - q: "With Set Input Mode UI Only, what happens to input events bound inside the focused widget's graph?"
        choices: ["They are called as normal", "They are not called", "They are called twice", "They are sent to the Player Controller instead"]
        answer_index: 1
        explain: "The UI Only page notes: any bound Input Events in the widget will not be called. Only the UI widgets themselves respond."
      - q: "In Game And UI mode, who gets the input first, and who gets a chance after?"
        choices: ["The player controller first, then the UI", "Both at the same time", "Only the UI, always", "The UI first; if it does not handle it, player input and the player controller get a chance"]
        answer_index: 3
        explain: "Game And UI lets the UI respond first, and if the UI does not handle the input, player input / player controller gets a chance."
      - q: "Which input is on Set Input Mode Game And UI but NOT on Set Input Mode UI Only?"
        choices: ["Player Controller", "In Widget to Focus", "Hide Cursor During Capture", "Flush Input"]
        answer_index: 2
        explain: "Game And UI has Player Controller, In Widget to Focus, In Mouse Lock Mode, Hide Cursor During Capture and Flush Input. UI Only lacks Hide Cursor During Capture."
      - q: "Which node needs only a Player Controller and Flush Input, with no widget?"
        choices: ["Set Input Mode UI Only", "Set Input Mode Game And UI", "Set Input Mode Game Only", "Set Game Paused"]
        answer_index: 2
        explain: "Game Only sets up a mode where only player input / the player controller responds, so no widget to focus is needed."
      - q: "Your GameOver state should let the camera keep moving while a button works. Which mode fits?"
        choices: ["Game Only", "UI Only", "Game And UI", "Set Game Paused true"]
        answer_index: 2
        explain: "Game And UI lets the UI handle clicks and still passes unhandled input to the player controller. Pausing would stop the camera."
