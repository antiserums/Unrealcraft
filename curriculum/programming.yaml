        choices: ["Every component of the actor, one by one", "The actor's Root Component, to the parent actor (optionally at a socket)", "Only the actor's collision", "The actor's Blueprint class"]
        answer_index: 1
        explain: "Attach Actor To Actor attaches the RootComponent of the actor to the supplied parent actor, optionally at a named socket."
