    title: Relevancy and dormancy
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-relevancy-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-network-dormancy-in-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/networking-overview-for-unreal-engine"
    checklist:
      - "Make BP_Beacon (Actor, Replicates on) with a Static Mesh that has collision. In Class Defaults > Replication set Net Cull Distance Squared to 90000 (3 m squared)."
      - "Spawn one BP_Beacon at runtime on the server. Play with 2 players and walk the client away from it. Note the distance where it disappears on the client, and check it still exists in the server window."
      - "Turn on Always Relevant on BP_Beacon and repeat. Then turn on Only Relevant To Owner and repeat again."
      - "Make BP_Sign (Actor, Replicates on) with a replicated string Message and a text render updated in OnRep. Set Net Dormancy to Initial in Class Defaults, place it in the level."
      - "Add a key on the server that sets Message with a normal Set node. Observe the client. Then call Flush Net Dormancy on the sign before the Set and observe again."
      - "Write 4 sentences: what relevancy does to a dynamic actor on the client, what dormancy does instead, and which of your two actors is a good candidate for each."
    done_when: "Two screenshots: the client window with the beacon gone while the server window still shows it, and the BP_Sign Class Defaults with Net Dormancy set. Add your 4 sentences."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What happens to a dynamically spawned replicated actor on a client when it stops being relevant?"
        choices: ["It is hidden but kept", "It is destroyed on that client", "It is frozen", "It becomes dormant"]
        answer_index: 1
        explain: "Relevancy is per connection. Dynamically spawned, replicated actors are destroyed on the client when they are no longer relevant; that is why the example actor disappears."
      - q: "Which property makes an actor relevant for every connection, even overriding Only Relevant To Owner?"
        choices: ["bNetUseOwnerRelevancy", "NetCullDistanceSquared", "bRelevantForNetworkReplays", "bAlwaysRelevant"]
        answer_index: 3
        explain: "bAlwaysRelevant marks the actor always relevant for replication and overrides bOnlyRelevantToOwner."
      - q: "Your replicated actor has no collision on its root component. What does the relevancy logic do?"
        choices: ["It is not relevant for the connection", "It is always relevant", "It uses the owner's relevancy", "It crashes"]
        answer_index: 0
        explain: "The base AActor logic marks an actor not relevant if it is hidden, or if it has no root component or the root has collision disabled."
      - q: "What does NetCullDistanceSquared hold?"
        choices: ["The distance in meters", "The number of clients", "The square of the maximum distance from the client viewport where the actor is relevant", "The update rate"]
        answer_index: 2
        explain: "NetCullDistanceSquared is the square of the maximum distance from the client's viewport at which this actor is relevant and replicates. It is used when distance-based relevancy is enabled."
      - q: "Which function forces an actor to be relevant when it is not by default?"
        choices: ["IsNetRelevantFor", "FlushNetDormancy", "ForceNetRelevant", "GetNetConnection"]
        answer_index: 2
        explain: "AActor::ForceNetRelevant forces the actor to be network relevant. IsNetRelevantFor is the check the net driver runs; overriding it needs caution."
      - q: "Why is dormancy called one of the most impactful server optimizations?"
        choices: ["It reduces client render cost", "Dormant actors are skipped when the NetDriver gathers and compares replicated actors each update", "It compresses packets", "It removes the actor from memory"]
        answer_index: 1
        explain: "Each net update the NetDriver gathers relevant actors and compares their properties. Dormant actors are not added to that list, saving server CPU, especially with many rarely changing actors."
      - q: "A dormant actor's replicated property is changed without waking it. What is the risk?"
        choices: ["Nothing; it replicates normally", "The client crashes", "The actor becomes always relevant", "The change is not sent and may be lost when the actor wakes"]
        answer_index: 3
        explain: "While dormant the actor is not considered for replication, so changes are not sent and might be lost. Call FlushNetDormancy, ForceNetUpdate or SetNetDormancy(DORM_Awake) before changing properties."
      - q: "How do dormant actors differ from non-relevant actors on the client?"
        choices: ["Dormant actors still exist on server and client; non-relevant dynamic actors are destroyed on the client", "Both are destroyed on the client", "Dormant actors are destroyed; non-relevant ones stay", "There is no difference"]
        answer_index: 0
        explain: "The dormancy page says dormant actors still exist on both server and client although their channel closes, unlike relevancy where dynamic replicated actors are destroyed on the client."
    flavors:
      _default: {why: "Relevancy and dormancy are the two main dials for keeping server cost and bandwidth low."}
      programming: {why: "A level with 2000 replicated props needs dormancy or the server tick will not survive.", do: "Set DORM_DormantAll in a C++ constructor and wake it with SetNetDormancy from a key press."}

