    checklist:
      - "Create a new Blueprint Class with parent Actor Component. Name it BPC_Health. Add variables MaxHealth (float, 100) and Health (float)."
      - "In BPC_Health on Event Begin Play, set Health = MaxHealth. Add a function ApplyDamage(Amount) that lowers Health, clamps at 0, and prints the owner's name plus Health. Use Get Owner for the name."
      - "Add BPC_Health to BP_ThirdPersonCharacter and to a new BP_Barrel actor. Make MaxHealth instance editable and set the barrel to 30."
      - "In BP_Barrel on key press K: Get Component by Class (BPC_Health) and call ApplyDamage 10. Play and watch the two actors keep separate Health values."
      - "In BPC_Health add an event dispatcher OnDied. Broadcast it when Health reaches 0. In BP_Barrel bind it and destroy the barrel."
