    quiz:
      - q: "Why is an Actor Component (not a Scene Component) the right base for BPC_Health?"
        choices: ["Health needs a transform", "Health is an abstract behavior with no physical location", "Only Actor Components can have variables", "Scene Components cannot be added to characters"]
        answer_index: 1
        explain: "Actor Components are most useful for abstract behaviors like movement, inventory or attribute management. They do not have any location or rotation in the world."
      - q: "Two actors use the same component class. Why do they keep different Health values?"
        choices: ["Because components in an actor are instanced: each actor instance gets its own component instances", "Because the variable is marked Transient", "Because Blueprint copies the component on every tick", "They do not; components are shared between actors"]
        answer_index: 0
        explain: "Unlike sub-objects in general, components created inside an actor are instanced. Each actor instance gets unique instances of its components, like each car gets its own wheels."
      - q: "By default, does a new Actor Component tick every frame?"
        choices: ["Yes, always", "Yes, but only in PIE", "No; ticking must be enabled, and leaving it off gives a slight performance boost", "Only if it has a mesh"]
        answer_index: 2
        explain: "By default Actor Components do not update. You must enable ticking (bCanEverTick and the tick function) to run code each frame. Leaving it off saves a little performance."
      - q: "The Components page says everything the player sees or hears is ultimately the work of a component. Why?"
        choices: ["Because actors cannot exist without a mesh", "Because components are the only way to render meshes and images, implement collision, and play audio", "Because Blueprints can only run inside components", "Because the level is itself a component"]
        answer_index: 1
