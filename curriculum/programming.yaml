  - id: PQ76
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [blueprint, levels, streaming, travel]
    required_spine: false
    required: false
    title: "Level transitions: Open Level vs streaming"
    brief: "There are two ways to bring the player into new content. Open Level closes the current level and loads another one, and almost everything is reset except the Game Instance, an object that lives as long as the game runs. Level streaming loads an extra level, called a sublevel, into the level you are already in, without a restart. Which one you choose decides your loading times and what data survives. In this quest you build portals that use Open Level, a trigger that streams a room in and out, and a score that survives the trip."
    time_min: 80
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Game/OpenLevel_byName"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Game/OpenLevel_byObjectReference"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Game/LoadStreamLevel_byName"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Game/GetCurrentLevelName"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/loading-and-unloading-levels-using-blueprints-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/travelling-in-multiplayer-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make three levels: L_Hub, L_Arena and L_ArenaStream, which is a small room. Put a floor and a Player Start in L_Hub and in L_Arena."
      - "Make a Blueprint with Game Instance as the parent and set it as the Game Instance Class in Project Settings, under Maps & Modes, or use the one your project already has. Add a String variable named LastLevel and an Integer variable named Score to it."
      - "Make BP_Portal with a Box Collision and an editable variable named Level of the type Soft Object Reference to World. On overlap with the player, store the result of Get Current Level Name (with Remove Prefix String on) in LastLevel, and then call Open Level (by Object Reference)."
      - "Make BP_ReturnPortal and place it in L_Arena. On overlap with the player, it reads LastLevel from the Game Instance and calls Open Level (by Name) with LastLevel as the Level Name and the text fromArena in the Options pin. Options are extra text that is passed to the level that opens. To see them arrive, open the GameMode Blueprint that L_Hub uses, and on Begin Play print its Options String variable."
      - "In the Levels window, add L_ArenaStream as a sublevel of L_Arena. Make BP_Streamer. On overlap it calls Load Stream Level (by Name) with Make Visible After Load on, and on end overlap it calls Unload Stream Level."
      - "Add 10 to Score before each transition. Print Score on Begin Play of each level, to prove that the Game Instance survives Open Level."
      - "Press Play in L_Hub. Go to the arena, walk into the streamer, and come back through the return portal."
    done_when: "Send one screenshot of the BP_Portal graph with Open Level (by Object Reference) and the write to the Game Instance, one screenshot of the Levels window of L_Arena with the sublevel, and one screenshot of the Output Log in Play mode that shows Score printed after the return trip."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What does the Absolute input on Open Level do?"
        choices: ["Loads the level from an absolute file path", "If true the options are reset; if false options from the current level are carried over", "Forces a blocking load", "Skips the loading screen"]
        answer_index: 1
        explain: "Absolute true resets the travel options. Absolute false carries over options from the current level."
      - q: "What is the difference between Open Level (by Name) and Open Level (by Object Reference)?"
        choices: ["Only one of them can pass Options", "By Object Reference streams instead of travels", "By Name works only in packaged builds", "By Name takes a Name; by Object Reference takes a soft object reference to the level"]
        answer_index: 3
        explain: "Both travel to another level with Absolute and Options. One takes the level Name; the other takes a softobject Level pin."
      - q: "Get Current Level Name has a Remove Prefix String input. Why would you turn it on?"
        choices: ["To strip streaming- or editor-added prefixes from the name", "To make the name lower case", "To remove the folder path", "To return the level's display name"]
        answer_index: 0
        explain: "The pin removes any streaming- or editor-added prefixes, so the name you store matches the real level name (for example in PIE)."
      - q: "You call Load Stream Level (by Name) twice quickly for the same level. What happens?"
        choices: ["The level loads twice", "The second call has no effect while the first is still loading", "An error stops the game", "The level is unloaded"]
        answer_index: 1
        explain: "The node says: calling again before it finishes has no effect."
      - q: "In the streaming example, which two options are turned on for the Load Stream Level node?"
        choices: ["Absolute and Options", "Async and Priority", "Make Visible After Load and Should Block on Load", "Replicate and Persist"]
        answer_index: 2
        explain: "The guide toggles Make Visible After Load and Should Block on Load to true, and promotes Level Name to an editable variable."
      - q: "What is the main difference between seamless and non-seamless travel?"
        choices: ["Seamless is non-blocking; non-seamless is a blocking call", "Seamless only works in single player", "Non-seamless keeps all actors", "Seamless needs no map at all"]
        answer_index: 0
        explain: "Seamless travel is a non-blocking operation. Non-seamless blocks, and clients disconnect and reconnect to the server."
      - q: "Why does seamless travel use a transition map?"
        choices: ["To show a loading video", "To reset the Game Instance", "Because a world must always be loaded, so a small map bridges the old and new map without both in memory", "To compile shaders"]
        answer_index: 2
        explain: "There must always be a world loaded. Big maps should not both sit in memory, so a small transition map is loaded between them."
      - q: "Which of these is a case where a non-seamless travel MUST happen, per the source?"
        choices: ["Every map change on a listen server", "Any travel with Absolute true", "Any travel that passes Options", "Loading a map for the first time"]
        answer_index: 3
        explain: "Non-seamless travel must occur when loading a map for the first time, when a client first connects to a server, and when ending a multiplayer game to start a new one."
    flavors:
      _default: {why: "Knowing when to travel and when to stream decides your loading times and what data survives."}
      level_design: {why: "Portals and streaming volumes are your tools for pacing between spaces.", do: "Add a second streamed room and check the Levels window shows which one is loaded."}
      gameplay_design: {why: "Score, inventory and progress must survive a level change.", do: "Move one more variable into the Game Instance and prove it survives."}

