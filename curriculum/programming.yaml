        answer_index: 0
        explain: "The page lists accessing null objects, writing to objects that do not exist, corrupted data, stack overflows and out-of-memory as common causes."
      - q: "Which log verbosity is printed in the editor log but NOT in the console?"
        choices: ["Warning", "Display", "Error", "Log"]
        answer_index: 3
        explain: "The verbosity table says Log is printed in the editor log but not in the console. Warning, Display and Error go to both."
      - q: "How do you stop a Launcher editor build from sending unattended bug reports to Epic?"
        choices: ["Delete the Saved folder", "Editor Preferences > Privacy > Bug Reports > Don't Send", "Disable the Output Log", "Set Include Crash Reporter to false"]
