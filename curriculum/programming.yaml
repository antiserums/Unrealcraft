    specializations: [programming]
    subjects: [actors, spawning, garbage-collection, performance, blueprint]
    required_spine: false
    required: false
    title: Reuse instead of spawn
    brief: "Spawning and destroying many Actors every second, such as bullets, takes time and can make the game stutter. Object pooling is the standard fix: you spawn a fixed number of Actors once, hide them, and then reuse them instead of creating new ones. In this quest you first shoot bullets the simple way, then build a pool of 30 bullets, and compare the two versions with the stat game command."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-object-handling-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-actor-lifecycle"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Actor/SetLifeSpan"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/coder-06-create-a-respawning-pickup-item-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make a Blueprint named BP_Bullet with a small sphere mesh and a Projectile Movement Component. On BeginPlay, call Set Life Span with 2.0 so that the bullet destroys itself after 2 seconds."
