      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/asserts-in-unreal-engine"
    checklist:
      - "Open your project's Saved/Logs folder. Open the newest .txt log. Find three lines with Warning or Error and write down what they say."
      - "Open the Saved/Crashes folder (make it happen if empty: in BP_Debug, get an invalid object from an empty array and call a function on it in a loop, or use a null reference in C++ with check())."
      - "Open one crash folder and find the callstack text and the log copy inside."
      - "Open Editor Preferences > Privacy > Bug Reports and read the options. Do not change them unless you want to."
      - "Open Project Settings > Project > Packaging > Advanced and find Include Crash Reporter. Leave it as it is."
      - "Write 5 lines: what crashed, which function is at the top of the callstack, and where you found the report."
    done_when: "A short writeup with the three log lines, the top of the crash callstack, and the folder path where you found the crash report."
    xp: 55
    verify_type: writeup
    quiz:
      - q: "Where does the editor store crash reports on your machine?"
        choices: ["Content/Crashes", "The project's Saved/Crashes folder", "Config/Crashes", "The Engine Binaries folder"]
        answer_index: 1
        explain: "Editor crash reports are stored in the project's Saved/Crashes folder (or under AppData/Local/[Project]/Saved/Crashes for a user)."
      - q: "What is the difference between an assert (check) and an ensure?"
        choices: ["An ensure crashes; a check only logs", "A check halts the program; an ensure reports to the crash reporter but keeps running", "They are the same", "An ensure only works in Shipping builds"]
        answer_index: 1
        explain: "check halts execution when false. ensure reports to the crash reporter and writes to the log, but does not stop the program."
      - q: "By default, is the Crash Report Client included in a packaged game?"
        choices: ["Yes, always", "Yes, but only in Shipping", "No; you enable Include Crash Reporter in Packaging settings", "No, and it cannot be added"]
        answer_index: 2
        explain: "By default it is not included. Enable Include Crash Reporter under Project > Packaging > Advanced, or set IncludeCrashReporter=True in DefaultGame.ini."
      - q: "Which of these is listed as a common cause of a crash?"
        choices: ["Accessing null objects", "Too many Print Strings", "A missing Key on Print String", "A disabled breakpoint"]
        answer_index: 0
        explain: "The page lists accessing null objects, writing to objects that do not exist, corrupted data, stack overflows and out-of-memory as common causes."
      - q: "Which log verbosity is printed in the editor log but NOT in the console?"
        choices: ["Warning", "Display", "Error", "Log"]
        answer_index: 3
        explain: "The verbosity table says Log is printed in the editor log but not in the console. Warning, Display and Error go to both."
      - q: "How do you stop a Launcher editor build from sending unattended bug reports to Epic?"
        choices: ["Delete the Saved folder", "Editor Preferences > Privacy > Bug Reports > Don't Send", "Disable the Output Log", "Set Include Crash Reporter to false"]
        answer_index: 1
        explain: "The page says to open Editor Preferences, go to Privacy > Bug Reports, and select Don't Send."
