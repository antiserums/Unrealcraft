  - id: PQ50
    rank: 1
    difficulty: apprentice
    specializations: [programming]
    subjects: [source-control, perforce, git, team]
    required_spine: false
    required: false
    title: Source control inside the Editor
    brief: "Source control, which the Editor now calls revision control, is a system that keeps every version of the project files and lets a team work on one project without overwriting each other. Unreal assets cannot be merged like text, so the Editor lets you check out a file, which locks it for you while you edit it, and then submit your change. Teams depend on this, and the Editor has the buttons built in. The documentation page still uses the older name Source Control for menus that are now named Revision Control. In this quest you look at the revision control settings and either do a real check out and submit, or describe the workflow in writing."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-source-control-in-the-unreal-editor"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/source-control-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-perforce-as-source-control-for-unreal-engine"
    community_urls: []
    checklist:
      - "Open any project, or create one from the Third Person template. Open Edit > Editor Preferences, then Loading & Saving, and find the Source Control section (named Revision Control in newer versions). Read each option and note which ones are on by default."
      - "Click the Revision Control button in the bottom right corner of the editor window and choose Connect to Revision Control. The documentation page calls this the Source Control icon. In the login dialog, look at the list of providers (Perforce, Subversion, and Git if its plugin is enabled)."
      - "If you have a server (for example Perforce or a Git repo), pick the provider, enter its settings, and click Accept Settings. If you do not have one, close the dialog without connecting and continue with the writing part."
      - "If you have a connection: right-click an asset in the Content Browser and use Check Out, then change the asset and save it. After that, open the Revision Control menu again, choose Submit Content, and write a short description. The documentation page lists this as File > Submit to Source Control."
      - "If you have no connection: read the sections Checking Out, Submitting, Syncing and Deleting Files on the documentation page. Write 5 lines that describe that workflow in your own words."
      - "Open Edit > Project Settings and look for the check-out indicator on the config file. Note why config files cannot be checked back in from the Editor."
    done_when: "Send a screenshot of the revision control login dialog that shows your provider list. Also send either a screenshot of a successful Submit dialog or your 5 lines about the workflow."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Why does the Editor lock (check out) an asset while you edit it?"
        choices: ["Because .uasset and .umap files are binary and cannot be merged in a text merge tool", "Because assets are too large to copy", "Because the license requires it", "Because only one user can open the Editor at a time"]
        answer_index: 0
        explain: "Assets are binary files. They cannot be merged like text. So the Editor locks the file (Check Out) so other users cannot edit it at the same time."
      - q: "Where are the Editor's source control options such as Add New Files when Modified?"
        choices: ["Edit > Project Settings > Source Control", "Window > Source Control", "Edit > Editor Preferences > Loading & Saving > Source Control", "File > Source Control Settings"]
        answer_index: 2
        explain: "The page says these options are under Editor Preferences > Loading & Saving > Source Control."
      - q: "Which menu option scans your project for changed assets and opens the Submit Files dialog?"
        choices: ["File > Save All", "File > Submit to Source Control", "Edit > Check In Everything", "Window > Changelists"]
        answer_index: 1
        explain: "Submit to Source Control in the File menu scans the project and Engine for changed assets and shows the Submit Files dialog where you enter a description."
      - q: "How do you get changes that other people made, from inside the Editor?"
        choices: ["Restart the Editor", "Right-click files or folders in the Content Browser and choose Sync", "Press Ctrl+S on the level", "Use File > Refresh All"]
        answer_index: 1
        explain: "Right-click files or folders in the Content Browser and select Sync. You can also sync in an external tool, but the page recommends closing the Editor first."
      - q: "After you delete an asset that is in source control, what does the Editor usually leave behind?"
        choices: ["An empty folder", "A backup copy in Saved", "A hidden asset called a Redirector", "Nothing; the file is gone"]
        answer_index: 2
        explain: "The file is generally replaced by a hidden asset called a Redirector. You can clean these up with Fix Up Redirectors in Folders."
      - q: "You checked out a config (.ini) file from Project Settings. How do you check it back in?"
        choices: ["Click Check In in Project Settings", "Use File > Submit to Source Control", "Use an external tool like P4V or TortoiseSVN, because the Editor cannot check these files in", "Restart the Editor and it checks in automatically"]
        answer_index: 2
        explain: "The page says there is currently no way to check config files back in via the Editor. You need an external tool such as P4V or TortoiseSVN."
    flavors:
      _default: {why: "Teams live or die by source control. The Editor has it built in, so learn the buttons before you join a team."}
      programming: {why: "You will submit both code and binary assets. Knowing which files the Editor can handle and which need an external tool prevents lost work.", do: "Read the Perforce page section on which project folders to add first (Config, Content, Source) and write down the list."}
      level_design: {why: "Levels are binary .umap files. Check Out before you edit, or a teammate may be locked out.", do: "Check out your level, move one actor, save, and submit with a description that says what you changed."}

