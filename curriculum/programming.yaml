    title: Blueprint Namespaces for libraries
    brief: "By default the editor loads every Function Library and Macro Library in the project when it starts, which becomes slow in big projects. A Blueprint Namespace is a group name, such as Project.Combat, that you give to a library. A Blueprint then loads only the namespaces that it imports. In this quest you put two libraries into namespaces and see how a Blueprint imports them."
