        explain: "AssetActionUtility is for Assets selected in the Content Browser. ActorActionUtility is for Actors selected in the Level Viewport or World Outliner."
      - q: "A Custom Event in your Editor Utility Blueprint does not appear as a Scripted Action. What is the most likely cause?"
        choices: ["The event has no inputs", "The Blueprint is not saved to the Plugins folder", "Call In Editor is not checked on the Custom Event node", "Custom Events are never allowed as Scripted Actions"]
        answer_index: 2
        explain: "Call In Editor must be checked. New functions get it automatically, but for a Custom Event you have to check it yourself."
