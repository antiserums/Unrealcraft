    required_spine: false
    required: false
    title: A Blueprint Macro Library
    brief: "A macro is a small group of nodes that you save under one name and reuse, like a function. Unlike a function, a macro can have more than one output exec pin, and it can hold nodes that wait, such as Delay. A Blueprint Macro Library is an asset that stores macros so that many Blueprints can use them. In this quest you make a library with two macros and use them in an Actor."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-macro-library-in-unreal-engine"
