    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Game/IsGamePaused"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Input/SetInputModeUIOnly"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Input/SetInputModeGameAndUI"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Input/SetInputModeGameOnly"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/umg-ui-designer-quick-start-guide-in-unreal-engine"
    checklist:
      - "Make an Enum E_GameFlow with Playing, Paused, GameOver. Add a GameFlow variable of that type to your Player Controller BP_FlowController and set it as the default controller in the GameMode."
      - "Make Widget Blueprints WBP_PauseMenu (Resume and Quit buttons) and WBP_GameOver (Restart button)."
      - "In BP_FlowController add a function SetFlow (input New State). Use a Switch on E_GameFlow. Playing: Set Game Paused false, Set Input Mode Game Only, hide cursor. Paused: create WBP_PauseMenu, Add to Viewport, Set Game Paused true, Set Input Mode UI Only with the menu as In Widget to Focus, show cursor."
      - "GameOver: create WBP_GameOver, Set Input Mode Game And UI, show cursor, keep the game running so the camera still moves."
      - "Bind a Pause input action. Use Is Game Paused to decide whether to call SetFlow Playing or Paused. Set the action to execute when paused in the input action node details."
      - "Wire Resume to SetFlow Playing and Remove from Parent. Wire Restart to Open Level with the current level name."
      - "Play. Pause, move the mouse, click Resume. Then trigger GameOver and confirm the camera still moves but the button works."
    done_when: "One screenshot of the SetFlow function graph with the Switch on E_GameFlow and the three input mode nodes, and one PIE screenshot with the pause menu open and the cursor visible."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Set Game Paused returns a Boolean. What does it mean?"
        choices: ["Whether the pause or unpause was successful", "Whether the game is currently paused", "Whether a pause menu exists", "Whether input is blocked"]
        answer_index: 0
        explain: "The return value says whether the game was successfully paused or unpaused. To read the current state, use Is Game Paused."
      - q: "With Set Input Mode UI Only, what happens to input events bound inside the focused widget's graph?"
        choices: ["They are called as normal", "They are not called", "They are called twice", "They are sent to the Player Controller instead"]
        answer_index: 1
        explain: "The UI Only page notes: any bound Input Events in the widget will not be called. Only the UI widgets themselves respond."
      - q: "In Game And UI mode, who gets the input first, and who gets a chance after?"
        choices: ["The player controller first, then the UI", "Both at the same time", "Only the UI, always", "The UI first; if it does not handle it, player input and the player controller get a chance"]
        answer_index: 3
        explain: "Game And UI lets the UI respond first, and if the UI does not handle the input, player input / player controller gets a chance."
      - q: "Which input is on Set Input Mode Game And UI but NOT on Set Input Mode UI Only?"
        choices: ["Player Controller", "In Widget to Focus", "Hide Cursor During Capture", "Flush Input"]
        answer_index: 2
        explain: "Game And UI has Player Controller, In Widget to Focus, In Mouse Lock Mode, Hide Cursor During Capture and Flush Input. UI Only lacks Hide Cursor During Capture."
      - q: "Which node needs only a Player Controller and Flush Input, with no widget?"
        choices: ["Set Input Mode UI Only", "Set Input Mode Game And UI", "Set Input Mode Game Only", "Set Game Paused"]
        answer_index: 2
        explain: "Game Only sets up a mode where only player input / the player controller responds, so no widget to focus is needed."
      - q: "Your GameOver state should let the camera keep moving while a button works. Which mode fits?"
        choices: ["Game Only", "UI Only", "Game And UI", "Set Game Paused true"]
        answer_index: 2
        explain: "Game And UI lets the UI handle clicks and still passes unhandled input to the player controller. Pausing would stop the camera."
      - q: "Which library owns the Set Input Mode nodes?"
        choices: ["Gameplay Statics", "Widget Blueprint Library", "Kismet System Library", "Player Controller"]
        answer_index: 1
        explain: "The three Set Input Mode nodes list Target is Widget Blueprint Library. Set Game Paused and Is Game Paused are on Gameplay Statics."
      - q: "The UMG quick start creates the HUD widget and stores it. Why does it promote the Create Widget result to a variable?"
        choices: ["Widgets cannot be added to the viewport otherwise", "To make the widget replicate", "To stop garbage collection of the level", "So the HUD can be accessed later, for example to hide it while paused"]
        answer_index: 3
        explain: "The guide keeps a HUD Reference so you can call functions or set properties later, for example hide the HUD while the game is paused."
    flavors:
      _default: {why: "Every game has a flow: playing, paused, over. Getting input modes right is what makes menus feel solid."}
      gameplay_design: {why: "Pause and game-over screens are the most seen UI in your game.", do: "Add a Settings state that opens from the pause menu and returns to Paused, not Playing."}

  - id: PQ76
    rank: 2
    difficulty: adept
