      - q: "When does the Construction Script run?"
        choices: ["Every frame", "When an instance of the Blueprint Class is created, after the Components list", "Only when the game starts", "Only when the actor is destroyed"]
        answer_index: 1
        explain: "The Construction Script runs following the Components list when an instance of a Blueprint Class is created. This lets the instance do its own setup."
      - q: "Which Blueprint type has no Construction Script?"
        choices: ["Actor Blueprint Class", "Character Blueprint Class", "Pawn Blueprint Class", "Level Blueprint"]
        answer_index: 3
        explain: "Only Blueprint Classes contain Construction Scripts. Level Blueprints do not have them."
      - q: "An actor is spawned after the game already started. When does it get Event BeginPlay?"
        choices: ["Never", "At the next level reset", "Immediately after spawning", "Only if it has a Construction Script"]
        answer_index: 2
        explain: "BeginPlay fires for all Actors when the game starts, and any Actor spawned later has it called immediately."
      - q: "In the spawn path of the Actor lifecycle, in which order do these happen?"
        choices: ["BeginPlay, then OnConstruction, then PostInitializeComponents", "OnConstruction, then PostInitializeComponents, then BeginPlay", "PostInitializeComponents, then OnConstruction, then BeginPlay", "They all run at the same time"]
        answer_index: 1
