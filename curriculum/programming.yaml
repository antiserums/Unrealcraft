        choices: ["The Editor Startup Map loads", "The game shows a black screen", "Packaging fails with an error", "The first map in the Content folder loads"]
        answer_index: 1
        explain: "Every project must set a Game Default Map before packaging. If it is not set, the project displays a black screen when launched."
      - q: "Put the packaging build operations in the right order."
        choices: ["Cook, Build, Package, Stage", "Stage, Cook, Build, Package", "Build, Cook, Stage, Package", "Package, Build, Cook, Stage"]
        answer_index: 2
        explain: "Build compiles code, Cook converts assets for the platform, Stage copies them to the staging directory, and Package bundles them into distributable files."
      - q: "Which build configuration is the default if you do not change it?"
        choices: ["Shipping", "Debug", "Test", "Development"]
        answer_index: 3
        explain: "Unreal Engine defaults to the Development configuration unless you change it. Development still gives you the in-game console."
      - q: "You want the final build for players, with console commands and stats disabled. Which configuration?"
        choices: ["Shipping", "Development", "DebugGame", "Test"]
        answer_index: 0
        explain: "Shipping disables console commands, stats and profiling tools not meant for end users, and enables all optimizations. It is the configuration for distribution."
      - q: "Where do you start packaging for Windows from inside the Editor?"
        choices: ["File > Package Project", "Platforms menu in the main toolbar > Windows > Package Project", "Edit > Project Settings > Packaging > Package Now", "Window > Project Launcher > Build"]
        answer_index: 1
        explain: "In the main toolbar click the Platforms menu, select Windows, and under Content Management choose Package Project. Then you pick the staging directory."
      - q: "After packaging, where do you find the Pak files?"
        choices: ["In the project's Saved folder", "Next to the .exe in the staging root", "In the staging directory under [Project Name] > Content > Paks", "Inside the .exe"]
        answer_index: 2
        explain: "The page says the Pak files can be found in the staging directory under [Project Name] > Content > Paks."
