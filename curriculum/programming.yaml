    title: "Level transitions: Open Level vs streaming"
    time_min: 80
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Game/OpenLevel_byName"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Game/OpenLevel_byObjectReference"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Game/LoadStreamLevel_byName"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Game/GetCurrentLevelName"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/loading-and-unloading-levels-using-blueprints-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/travelling-in-multiplayer-in-unreal-engine"
    checklist:
      - "Make three levels: L_Hub, L_Arena and L_ArenaStream (a small room). Put a Player Start in L_Hub and L_Arena."
      - "In your Game Instance add a variable LastLevel (String) and Score (Integer)."
      - "Make BP_Portal with a Box Collision and an editable Level (Soft Object Reference to World). On overlap with the player, store Get Current Level Name (Remove Prefix String on) in LastLevel, then Open Level (by Object Reference)."
      - "Make BP_ReturnPortal that calls Open Level (by Name) with LastLevel and passes Options text ?fromArena. Read Get Game Mode > Options in the hub GameMode Begin Play and print it."
      - "Add L_ArenaStream as a sublevel of L_Arena in the Levels window. Make BP_Streamer that calls Load Stream Level (by Name) on overlap with Make Visible After Load on, and Unload Stream Level on end overlap."
      - "Add 10 to Score before each transition. Print Score on Begin Play of each level to prove the Game Instance survives Open Level."
      - "Play from L_Hub. Go to the arena, walk into the streamer, come back through the return portal."
    done_when: "One screenshot of the BP_Portal graph with Open Level (by Object Reference) and the Game Instance write, one screenshot of the Levels window of L_Arena with the sublevel, and a PIE Output Log screenshot showing Score printed after the return trip."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What does the Absolute input on Open Level do?"
        choices: ["Loads the level from an absolute file path", "If true the options are reset; if false options from the current level are carried over", "Forces a blocking load", "Skips the loading screen"]
        answer_index: 1
        explain: "Absolute true resets the travel options. Absolute false carries over options from the current level."
      - q: "What is the difference between Open Level (by Name) and Open Level (by Object Reference)?"
        choices: ["Only one of them can pass Options", "By Object Reference streams instead of travels", "By Name works only in packaged builds", "By Name takes a Name; by Object Reference takes a soft object reference to the level"]
        answer_index: 3
        explain: "Both travel to another level with Absolute and Options. One takes the level Name; the other takes a softobject Level pin."
      - q: "Get Current Level Name has a Remove Prefix String input. Why would you turn it on?"
        choices: ["To strip streaming- or editor-added prefixes from the name", "To make the name lower case", "To remove the folder path", "To return the level's display name"]
        answer_index: 0
        explain: "The pin removes any streaming- or editor-added prefixes, so the name you store matches the real level name (for example in PIE)."
      - q: "You call Load Stream Level (by Name) twice quickly for the same level. What happens?"
        choices: ["The level loads twice", "The second call has no effect while the first is still loading", "An error stops the game", "The level is unloaded"]
        answer_index: 1
        explain: "The node says: calling again before it finishes has no effect."
      - q: "In the streaming example, which two options are turned on for the Load Stream Level node?"
        choices: ["Absolute and Options", "Async and Priority", "Make Visible After Load and Should Block on Load", "Replicate and Persist"]
        answer_index: 2
        explain: "The guide toggles Make Visible After Load and Should Block on Load to true, and promotes Level Name to an editable variable."
      - q: "What is the main difference between seamless and non-seamless travel?"
        choices: ["Seamless is non-blocking; non-seamless is a blocking call", "Seamless only works in single player", "Non-seamless keeps all actors", "Seamless needs no map at all"]
        answer_index: 0
