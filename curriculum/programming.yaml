    title: Replicated properties with conditions
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/replicate-actor-properties-in-unreal-engine"
    backup_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/networking-overview-for-unreal-engine"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/replicated-object-execution-order-in-unreal-engine"
    checklist:
      - "In a C++ project make a class ANetCrate (parent Actor). In the constructor set bReplicates = true."
      - "Add UPROPERTY(ReplicatedUsing=OnRep_Health) int32 Health and UPROPERTY(Replicated) int32 SecretCode. Include Net/UnrealNetwork.h in the .cpp."
      - "Override GetLifetimeReplicatedProps. Call Super, then DOREPLIFETIME(ANetCrate, Health) and DOREPLIFETIME_CONDITION(ANetCrate, SecretCode, COND_OwnerOnly)."
      - "Write OnRep_Health(int32 LastHealth) with a UE_LOG that prints the old and the new value."
      - "Add a Server-only function DamageCrate that lowers Health by 10. Call it from a key press through a Blueprint child BP_NetCrate, but only on the Authority pin of Switch Has Authority."
      - "Set Play In Editor to 2 players, Play As Listen Server. Press the key in the server window. Check the Output Log of the client for the OnRep line with old and new values."
      - "Write 3 sentences: why SecretCode never reaches the second client, and what NotReplicated would be for."
    done_when: "One screenshot of NetCrate.cpp showing GetLifetimeReplicatedProps with both macros, and one of the Output Log with the OnRep_Health line printed on a client. Add your 3 sentences."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Which specifier makes a property replicate AND call a function on the client each time it arrives?"
        choices: ["Replicated", "NotReplicated", "ReplicatedUsing", "Transient"]
        answer_index: 2
        explain: "ReplicatedUsing needs a RepNotify function named OnRep_ something. It is called on clients when the property is replicated. Replicated alone only copies the value."
      - q: "You added UPROPERTY(Replicated) to a property, but clients never get the value. Which step did you most likely skip?"
        choices: ["Marking the property BlueprintReadWrite", "Making the property public", "Adding a Tick function", "Adding a DOREPLIFETIME line in GetLifetimeReplicatedProps"]
        answer_index: 3
        explain: "The page's steps are: add the specifier, set bReplicates = true in the constructor, then override GetLifetimeReplicatedProps and add DOREPLIFETIME for the property. Without the macro the property is not registered."
      - q: "A property uses DOREPLIFETIME_CONDITION with COND_OwnerOnly. Who receives it?"
        choices: ["Only the actor's owner", "Every connected client", "Every connection except the owner", "Only the server"]
        answer_index: 0
        explain: "COND_OwnerOnly only replicates to the actor's owner. COND_SkipOwner is the opposite: it goes to every connection except the owner."
      - q: "By default, when does a registered replicated property send an update?"
        choices: ["Every tick", "Only when its value has changed", "Only when the actor spawns", "Every second"]
        answer_index: 1
        explain: "Every replicated property only replicates on the condition that it has changed. Unchanged properties do not use bandwidth."
      - q: "What does the NotReplicated specifier mainly help with?"
        choices: ["Turning off replication for a whole actor", "Marking a member inside a replicated struct so that member is not sent", "Stopping RPCs on the actor", "Making a property client-only"]
        answer_index: 1
        explain: "The page says it may not seem useful at first, but it is helpful to set a property inside a replicated struct to not replicate."
      - q: "You declare OnRep_Health(int32 LastHealth). What value does the engine put in LastHealth?"
        choices: ["The new value", "Always zero", "The server's tick count", "The previous value of the replicated property"]
        answer_index: 3
        explain: "If the RepNotify has a parameter of the same type as the property, the replication system passes the previous value of the property automatically."
      - q: "In Blueprint, which action automatically calls a variable's RepNotify?"
        choices: ["Any macro that takes the variable by reference", "Reading the variable with a Get node", "A Set node on the replicated variable", "Compiling the Blueprint"]
        answer_index: 2
        explain: "In Blueprint, a Set node on a replicated property calls its RepNotify. Macros and functions that take the property by reference generally do not call it, even if they change the value."
      - q: "Why does the page warn against using COND_Custom for every property?"
        choices: ["They cost more time and cannot change per connection", "Custom conditions do not work in packaged builds", "They only work in Blueprint", "They replicate every tick"]
        answer_index: 0
        explain: "Custom replication conditions take more resources and time, and they are decided per actor, not per connection. So they cannot use state that changes per connection."
    flavors:
      _default: {why: "Replication conditions are how you send less data and keep private values private."}
      programming: {why: "Most multiplayer bugs are a missing DOREPLIFETIME or a wrong condition; you must be able to read this code.", do: "Add a third property with DOREPLIFETIME_CONDITION_NOTIFY and REPNOTIFY_Always, and explain in one line when its OnRep fires."}

