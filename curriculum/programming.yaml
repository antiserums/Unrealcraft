    title: Read a crash report and its log
    brief: "When Unreal crashes, it saves a crash report. The report holds a callstack, which is the list of functions that were running at the moment of the crash, and a copy of the log. Unreal also writes a log file every time it runs, with warnings and errors. These files already tell you where things went wrong, so you only have to open them. In this quest you read a log, find a crash report, and write down what it says."
