  - id: PQ107
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [profiling, memory, unreal-insights]
    required_spine: false
    required: false
    title: Hunt a leak with Memory Insights
    brief: "A memory leak is memory that the game takes and never gives back. You do not see it until the game runs out of memory and crashes. Memory Insights is the part of Unreal Insights that records every allocation (each time memory is taken) and shows which code made it and when. In this quest you write an actor that holds on to a lot of memory, record a memory trace, and find that actor in the results."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/memory-insights-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/trace-in-unreal-engine-5"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-insights-in-unreal-engine"
    checklist:
      - "Use a C++ project, or create one from the Third Person template with C++ selected. You need an IDE such as Visual Studio to compile. Make a C++ actor named ALeakyCache that allocates a large TArray in BeginPlay and does not free it until EndPlay."
      - "Start UnrealInsights.exe from the folder Engine/Binaries/Win64 before you run the game."
      - "Run your project from a command prompt, with the memory trace channel active from the start of the process. To do this, add the argument -trace=default,memory to the command line, for example: UnrealEditor.exe YourProject.uproject -game -trace=default,memory"
      - "Load a level with 20 ALeakyCache actors and wait a moment. Then open a different level and stop the session."
      - "Open the .utrace file and select Menu > Memory Insights. Read the Total Allocated Memory graph."
      - "In the Investigation panel, run a Memory Leaks query. Put the markers A and B around the first level, and the marker C after the level change."
      - "Group the result by Alloc Callstack and find the allocation of your ALeakyCache."
    done_when: "Send a screenshot of Memory Insights with the Total Allocated Memory graph and the query result table that shows your ALeakyCache callstack. Write one sentence that says what you would change."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "You attached Insights after the game had already started. Why is there no allocation data?"
        choices: ["Memory Insights only works in Shipping", "The memory channel must be active from the start of the process", "You must use stat Memory first", "The trace file was too small"]
        answer_index: 1
        explain: "Recording requires the memory trace channel from the beginning; a late-connect session cannot start tracing allocation events."
      - q: "Which build configuration must a packaged project use for memory tracing?"
        choices: ["Shipping", "Test", "Development", "DebugGame only"]
        answer_index: 2
        explain: "The page says a packaged project must be packaged in Development mode for a memory trace."
      - q: "Which graph colour shows the total allocated memory?"
        choices: ["Blue", "Yellow", "Green", "Orange"]
        answer_index: 0
        explain: "Total Allocated Memory is blue, Live Allocation Count is yellow, and Alloc/Free event counts are green/orange."
      - q: "Which query rule finds allocations made between A and B that are not freed until after C?"
        choices: ["Growth", "Short Living Allocs", "Memory Leaks", "Decline"]
        answer_index: 2
        explain: "Memory Leaks uses A, B and C; it is useful when memory should have been released, for example at a level transition."
      - q: "Which rule helps find allocations that could have been stack allocations?"
        choices: ["Long Living Allocs", "Before", "Active Alloc", "Short Living Allocs"]
        answer_index: 3
        explain: "Short Living Allocs shows allocations made after A and freed before B, meaning temporary allocations."
      - q: "What do the LLM-prefixed graphs use as their data source?"
        choices: ["Detailed per-allocation callstacks", "The Session Frontend profiler", "Stat Memory output", "The Low-Level Memory tracking runtime with per-frame granularity"]
        answer_index: 3
        explain: "LLM graphs come from the Low-Level Memory tracker, start a few seconds after the session begins, and are per frame."
      - q: "Which panel shows if callstack symbols were resolved, cached or failed?"
        choices: ["Modules", "LLM Tags", "Timing", "Investigation"]
        answer_index: 0
        explain: "The Modules panel lists symbols as Discovered, Cached, Resolved and Failed, with failed items in red."
      - q: "Which grouping preset shows allocations by their Class name?"
        choices: ["Heap", "Tags", "Class Name", "Address (4k Page)"]
        answer_index: 2
        explain: "The Class Name preset breaks down allocations by class; Asset (Package) uses package and asset metadata."
    flavors:
      _default: {why: "Memory bugs are silent until the game crashes; Memory Insights shows who allocated what and when."}
      programming: {why: "Leak queries with A/B/C markers find memory that should have gone away at a level change.", do: "Also run a Growth Vs Decline query between the two levels and note the biggest positive group."}
      tech_art: {why: "Render targets and textures show up under LLM tags.", do: "Toggle the RenderTargets LLM tag and read its size at the busiest moment."}

  - id: PQ108
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [profiling, hitches, stat-unit]
    required_spine: false
    required: false
    title: Which thread is the bottleneck?
    brief: "Unreal does its work for each frame on several threads: the Game thread runs gameplay logic, the Draw (render) thread prepares what to draw, and the GPU draws it. A frame is only as fast as the slowest of them, which is called the bottleneck. Before you optimise anything, you must know which one is late. In this quest you read the stat Unit numbers in two tests and decide for each test if it is limited by the CPU or by the GPU."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/introduction-to-performance-profiling-and-configuration-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/stat-commands-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Make a test level with an actor named BP_HeavyTick that runs a big loop on Tick. Add a switch, for example a key press in the Level Blueprint, that spawns 50 of them."
      - "In the viewport menu, enable Show FPS. Then open Stat, then Engine, and enable FPS and Unit."
      - "Run stat Unit and stat UnitGraph. Read the values Frame, Game, Draw, GPU and RHIT before you spawn the actors and after."
      - "Run stat Hitches and stat DumpHitches. Set t.HitchFrameTimeThreshold and cause a spike. Find the HITCH line in the Output Log."
      - "Now replace the heavy actors with 500 high-poly meshes and repeat the test. For the mesh, you can make a Sphere with a very high subdivision level in Modeling Mode, with Nanite turned off. Compare which thread time grows."
      - "Write a short table with these columns: test, Frame ms, Game ms, Draw ms, GPU ms, and your verdict (CPU-bound or GPU-bound)."
    done_when: "Send a screenshot of stat Unit and stat UnitGraph in the heavy tick test, a screenshot of a HITCH log line, and your table with the verdict (CPU-bound or GPU-bound) for both tests."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "Frame time is 33 ms and Game time is 32 ms. What is the likely bottleneck?"
        choices: ["The GPU", "The game thread", "The RHI thread", "Vsync"]
        answer_index: 1
        explain: "If Frame time is close to Game time, the game thread is likely the bottleneck. Close to Draw means the render thread."
      - q: "Why is GPU time in stat Unit often close to Frame time even when the GPU is not the problem?"
        choices: ["The GPU is always the bottleneck", "It includes load time", "It is measured in different units", "GPU time is synced to the frame"]
        answer_index: 3
        explain: "GPU time is synced to the frame, so it will likely be similar to Frame time; the same is said for RHIT."
      - q: "What does stat UnitGraph add?"
        choices: ["A graph of the stat unit data", "Memory per thread", "A list of tick functions", "Network stats"]
        answer_index: 0
        explain: "UnitGraph shows a graph of the stat unit data; use stat Raw to see unfiltered data."
      - q: "Which console variable defines the time that counts as a hitch?"
        choices: ["r.HitchThreshold", "g.HitchLimit", "stat.HitchTime", "t.HitchFrameTimeThreshold"]
        answer_index: 3
        explain: "stat Hitches and stat DumpHitches use t.HitchFrameTimeThreshold to decide what is a hitch and write it to the log."
      - q: "Vsync is on and both CPU and GPU can produce frames faster than the monitor shows them. The app is:"
        choices: ["CPU-bound", "GPU-bound", "Display-bound", "Memory-bound"]
        answer_index: 2
        explain: "The page calls this display-bound: neither CPU nor GPU is the limit, the monitor is."
      - q: "What is a processing spike?"
        choices: ["A slow average framerate", "Any frame above 60 FPS", "A crash from out of memory", "A sudden brief increase in CPU or GPU time in a frame"]
        answer_index: 3
        explain: "A processing spike is a sudden, brief increase in the time the CPU or GPU spends in a frame; it shows as a hitch."
      - q: "The docs say to profile with stat Unit in which kind of build?"
        choices: ["A debug build", "A non-debug build", "Only a Shipping build", "Only in Simulate mode"]
        answer_index: 1
        explain: "To find the bottleneck, launch the game in a non-debug build and enter stat unit."
      - q: "Why can a profiler making the game slightly slower be a good thing?"
        choices: ["Hitting targets with the profiler on means you have spare resources without it", "It hides hitches", "It disables the GPU", "It is not a good thing"]
        answer_index: 0
        explain: "Profiling uses the same CPU, RAM and disk, so meeting the target with a profiler attached means you surpass it in normal play."
    flavors:
      _default: {why: "Before you optimise anything, you must know which thread is late."}
      programming: {why: "stat Unit is the first question; Insights is the second. Never skip the first.", do: "Add a console command that toggles stat Unit and stat UnitGraph together."}
      tech_art: {why: "A Draw or GPU bound scene is your job; a Game bound scene is not.", do: "Repeat the mesh test with Nanite on and off and note the Draw and GPU columns."}

  - id: PQ109
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [profiling, blueprint, cpp, unreal-insights]
    required_spine: false
    required: false
    title: Measure Blueprint against C++
    brief: "Blueprint code runs slower than C++ code, but in most cases the difference is too small to matter. It matters mainly in heavy loops and when many actors tick every frame. For this reason you should measure before you convert anything to C++, because slow Blueprint logic is often a design problem and not a language problem. In this quest you run the same heavy loop in Blueprint, in C++ and on a timer, and compare the three numbers in Unreal Insights."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/coding-in-unreal-engine-blueprint-vs-cplusplus"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/common-memory-and-cpu-performance-considerations-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-the-timers-and-counters-tabs-in-unreal-insights-for-unreal-engine"
    checklist:
      - "Open a C++ project, or create one from the Third Person template with C++ selected. You need an IDE such as Visual Studio to compile. Make BP_MathWorker. On Tick, it loops 10,000 times and adds up vector distances. Spawn 20 of them."
      - "Make AMathWorkerCpp, which runs the same loop in its C++ Tick. Spawn 20 of them in a second test."
      - "Run the game with -trace=default,AssetLoadTime -statnamedevents, so that the Blueprint names show in Insights."
      - "Record a trace for each test. In Timing Insights, with the Game Frame mode, compare the timers of the Game thread."
      - "Rewrite BP_MathWorker so that the loop runs on a Timer every 0.5 s and not on Tick. Measure again."
      - "Use Blueprint Header View to generate a .h file from BP_MathWorker, and compare it with your C++ class."
      - "Write down the three numbers (Blueprint tick, C++ tick, Blueprint timer) and your rule for when to convert."
    done_when: "Send a screenshot of the Timers panel for the Blueprint test and for the C++ test with the timer rows visible. Add your three numbers and a rule of two sentences for when you would convert Blueprint to C++."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "Why is C++ faster than Blueprint at a basic level?"
        choices: ["Blueprint has no loops", "C++ compiles to machine code; Blueprint runs bytecode on a virtual machine", "C++ runs on the GPU", "Blueprint is single threaded and C++ is not"]
        answer_index: 1
        explain: "Blueprint compiles to bytecode executed by a VM, which adds script overhead. Machine code runs directly on the CPU."
      - q: "The page says BP vs C++ performance differences are usually:"
        choices: ["Huge in every project", "Zero", "Only visible on mobile", "Insignificant and context dependent"]
        answer_index: 3
        explain: "Differences are usually insignificant; they matter most in tight loops, large data sets, many ticking instances, and low-level code."
      - q: "Which is NOT listed as a case where C++ performance matters most?"
        choices: ["Tick-dependent classes with many instances", "Tight loops heavy on processing", "A menu button click handler", "Systems that process large data sets"]
        answer_index: 2
        explain: "Occasional UI logic is not a hot path. The listed cases are loops, large data, many ticking instances, low-level code and multi-threading."
      - q: "You have a slow Blueprint. What does the page say to do first?"
        choices: ["Profile with Unreal Insights and fix the biggest bottlenecks", "Rewrite it in C++", "Disable Tick on everything", "Turn on nativization"]
        answer_index: 0
        explain: "Profile with Unreal Insights and optimise the most significant bottlenecks before you consider converting to C++."
      - q: "Which advantage belongs to Blueprint, not C++?"
        choices: ["Multi-threading support", "Access to lower-level engine functionality", "A safer memory model designed to avoid crashes", "Easier text diff and merge"]
        answer_index: 2
        explain: "Blueprint was designed with a safe memory model. Threading, low-level access and text diffs are C++ strengths."
      - q: "How does Blueprint Header View help a conversion?"
        choices: ["It converts the whole Blueprint to C++ automatically", "It generates a .h with declarations; you still write the .cpp by hand", "It compiles Blueprint to native code", "It exports the graph as an image"]
        answer_index: 1
        explain: "It generates a header with variable and function declarations. The function bodies must be converted manually."
      - q: "What command line argument shows Blueprint names in Insights timers?"
        choices: ["-bpnames", "-verbosebp", "-trace=blueprint", "-statnamedevents"]
        answer_index: 3
        explain: "With Asset Load Time tracking on, adding -statnamedevents displays Blueprint names; they are hidden by default because there are many."
      - q: "Instead of checking a variable on every Tick, what does the performance page suggest?"
        choices: ["A setter that fires a callback only when the value changes", "A faster Tick group", "Checking every other frame with a bool", "Moving the check to the Construction Script"]
        answer_index: 0
        explain: "Wrap the change in a custom setter and call an event only when the value changes; the logic then runs only on change."
    flavors:
      _default: {why: "Measure before you convert. Most Blueprint slowness is a design problem, not a language problem."}
      programming: {why: "Knowing the real cost of the VM overhead stops both fear and laziness.", do: "Try one more variant: the BP loop moved into a BlueprintCallable C++ function library."}
      gameplay_design: {why: "You can keep scripting in Blueprint if you avoid Tick-heavy loops.", do: "Replace one Tick check in your own project with an event or timer."}

  - id: PQ110
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [garbage-collection, memory, uobject]
    required_spine: false
    required: false
    title: Garbage collection without hitches
    brief: "Garbage collection (GC) is the engine system that finds objects that nothing uses any more and frees their memory. It runs from time to time, and when it has a lot to clean it can cause a short hitch. It also only knows about references that are marked with UPROPERTY, so other pointers can end up pointing at objects that are gone. In this quest you cause GC spikes, tune a setting, and test which kinds of C++ pointer are safe after an object is destroyed."
    time_min: 75
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-object-handling-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/common-memory-and-cpu-performance-considerations-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/incremental-garbage-collection-in-unreal-engine"
    checklist:
      - "Open a C++ project, or create one from the Third Person template with C++ selected. You need an IDE such as Visual Studio for the C++ steps. Make BP_Churn. In a loop, it spawns 500 small actors and destroys them 2 seconds later."
      - "Run stat GC and stat UnitGraph in PIE. Watch for the spike when the collector runs."
      - "Open Project Settings and go to Engine, then Garbage Collection. Lower Time Between Purging Pending Kill Objects and compare the size of the spike."
      - "In a C++ class, hold one object in a raw pointer and one object in a TObjectPtr that is marked with UPROPERTY. Destroy the object and log both pointers."
      - "Replace the raw pointer with a TWeakObjectPtr, and check IsValid after the destroy."
      - "Add a Collect Garbage call at a loading screen or at a level change, and confirm that the spike moves to that moment."
      - "Write down the size of the spike before and after the tuning, and which pointer became null."
    done_when: "Send a screenshot of stat GC with the spike in the UnitGraph, a screenshot of the Garbage Collection settings that you changed, and a short note with your numbers before and after and the result of the raw pointer compared with the UPROPERTY pointer."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "How does the collector decide which UObjects to delete?"
        choices: ["Reference counting on each pointer", "It searches the reference graph from the root set; unreached objects are removed", "Objects older than 60 seconds", "Only objects with Destroy called"]
        answer_index: 1
        explain: "The engine builds a reference graph from the root set. Any UObject not found in that search is unneeded and removed."
      - q: "A UObject* stored only in a raw C++ pointer is destroyed. What happens to your pointer?"
        choices: ["It is set to null automatically", "The compiler refuses raw pointers", "It keeps the object alive", "It is not nulled and it does not keep the object alive"]
        answer_index: 3
        explain: "Only UPROPERTY references and UE containers are known to the engine. Raw pointers are neither nulled nor do they prevent GC."
      - q: "You want a pointer that does not keep the object alive but can be checked for validity. Use:"
        choices: ["TWeakObjectPtr", "A raw pointer", "TSharedPtr", "A static pointer"]
        answer_index: 0
        explain: "TWeakObjectPtr does not prevent GC, can be queried for validity, and becomes null when the object is destroyed."
      - q: "Why do actors placed in a level not need your own UPROPERTY reference to stay alive?"
        choices: ["Actors are never collected", "The Level references them, and the Level links back to the root set", "Actors are in the root set", "Their components hold them"]
        answer_index: 1
        explain: "Actors are usually referenced by the Level they belong to, which links back to the root set. Components are referenced by their actor."
      - q: "Shortening Time Between Purging Pending Kill Objects helps hitches because:"
        choices: ["It disables clustering", "It skips reachability analysis", "GC runs on another thread", "Fewer unreachable objects pile up before each pass, so each cleanup is smaller"]
        answer_index: 3
        explain: "Collecting more often means fewer objects to clean up at once, avoiding the hitch from many actors dying together."
      - q: "What is a downside of large GC clusters?"
        choices: ["All items in the cluster are unhashed and deleted in the same frame, which can hitch", "Reachability is slower", "Clusters cannot contain actors", "They disable Blueprint clustering"]
        answer_index: 0
        explain: "Clusters make reachability faster, but a big cluster is prepared for deletion in one frame, which can cause a hitch."
      - q: "When is manually calling Collect Garbage a good idea?"
        choices: ["Every frame in Tick", "Never", "During a loading screen, or before a large allocation that would otherwise crash or hitch", "Only in Shipping"]
        answer_index: 2
        explain: "Manual GC is appropriate when spikes are tolerable, such as a loading screen, or before a big allocation that you tested as risky."
      - q: "What does incremental reachability analysis change?"
        choices: ["It removes the need for UPROPERTY", "It makes GC fully thread safe", "It runs GC on the GPU", "It splits the reachability phase across several frames with a per-frame soft time limit"]
        answer_index: 3
        explain: "Reachability is spread over multiple frames with a configurable time limit; the page notes it is not fully thread safe and needs TObjectPtr properties."
    flavors:
      _default: {why: "GC spikes are the most common cause of 'random' hitches; knowing the rules prevents them and crashes."}
      programming: {why: "Ownership rules decide both leaks and dangling pointers in Unreal C++.", do: "Try Actor Clustering Enabled with bCanBeInCluster on your churn actors and compare stat GC."}
      gameplay_design: {why: "Spawning and destroying many things creates GC spikes you will feel in play tests.", do: "Note where in your loop a loading screen could hide a manual Collect Garbage."}
