        choices: ["Window menu of the Blueprint Editor", "Edit > Editor Preferences", "The Details panel", "Right-click in the graph"]
        answer_index: 0
        explain: "The panel is not always open by default. You can find it in the Window menu of the Blueprint Editor. It also opens by itself when a compile gives errors or warnings."
      - q: "What extra information does a successful compile show in the results list?"
