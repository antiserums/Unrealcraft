      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/SetTimerbyEvent"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/ClearandInvalidateTimerbyHandle"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/PauseTimerbyHandle"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Utilities/Time/GetTimerRemainingTimebyHandle"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Actor/Tick/SetActorTickEnabled"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/actor-ticking-in-unreal-engine"
    checklist:
      - "Make BP_GasRoom (Actor) with a Box Collision. Version 1: on Tick, if the player is inside, apply 1 damage per second using Delta Seconds. Open stat game and note the tick cost with 20 copies placed."
      - "Version 2: turn off Start with Tick Enabled in Class Defaults. On begin overlap, Set Timer by Event (Time 1.0, Looping) to a custom event DamageTick and store the handle. On end overlap, Clear and Invalidate Timer by Handle."
      - "Add a key P that calls Pause Timer by Handle and key O that unpauses. While paused, print Get Timer Remaining Time by Handle each second using another timer and confirm it does not change."
      - "Add a delayed start: a 3-second non-looping Set Timer by Event that starts the damage loop, with Initial Start Delay Variance 0.5. Spawn 20 rooms and watch them start at different moments."
      - "Make BP_Spawner that keeps trying to find a BP_GasRoom every 1 second with a looping timer and clears itself when it succeeds. Destroy a room while its timer runs and check the log for errors."
      - "Write three lines: the stat game difference between versions, why a timer that is not cleared is not a leak when the actor dies, and one case where Tick is still the right tool."
