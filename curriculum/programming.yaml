    title: Blueprint Namespaces for libraries
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-namespaces-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-function-libraries-in-unreal-engine"
    checklist:
      - "Create two Blueprint Function Libraries: BFL_Combat (functions ComputeDamage, RollCrit) and BFL_Debug (functions DrawHitMarker, LogHit). Compile and save both."
      - "Open BFL_Combat, click Class Settings and in Blueprint Options set Blueprint Namespace to Project.Combat. Do the same for BFL_Debug with Project.Debug. Try a namespace containing # and read the validation message."
      - "In the Content Browser search for BlueprintNamespace=Combat and screenshot the result. Hover a library asset and read the namespace in its tooltip."
      - "Make BP_Enemy (Actor). In its Class Settings set Blueprint Namespace to Project.Combat. Compile, save and restart the editor. Reopen BP_Enemy and check Class Settings > Imports: which namespaces are imported?"
      - "In BP_Enemy's Event Graph, right-click and search for DrawHitMarker. Select it. Check Imports again and note that Project.Debug was auto-imported."
      - "Open Edit > Project Settings > Editor > Blueprint Project Settings > Experimental and add Project.Combat to Namespaces to Always Include. Write two lines: who this affects and why you would (or would not) commit that setting."
    done_when: "Screenshots of the Content Browser search, the Imports section of BP_Enemy after selecting the Debug function, and your two lines."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "What problem do Blueprint Namespaces solve?"
        choices: ["Name clashes between two functions", "Slow Blueprint opening, because all function and macro libraries load at startup", "Network replication of functions", "Packaging size"]
        answer_index: 1
        explain: "The engine loads every Function Library and Macro Library asset at initialization. Namespaces defer loading until they are needed."
      - q: "Where do you assign a Blueprint Namespace to an asset?"
        choices: ["Class Settings > Blueprint Options > Blueprint Namespace", "In the Content Browser rename dialog", "In Project Settings > Packaging", "On each function's Details"]
        answer_index: 0
        explain: "The docs set the namespace in the Blueprint Options category of Class Settings and then Compile and Save."
      - q: "A Blueprint has namespace Project.Combat. What happens with libraries in the same namespace when it opens?"
        choices: ["They are unloaded", "They must be imported by hand each session", "They are renamed", "They are automatically imported when the editor initializes"]
        answer_index: 3
        explain: "Shared library assets set to the same namespace are auto-imported when the Blueprint editor initializes for that Blueprint."
      - q: "You pick a non-imported type in the pin type selector. What does the editor do?"
        choices: ["Refuses the selection", "Opens Project Settings", "Loads the type's package and adds its namespace to the Blueprint's import set", "Only shows a warning"]
        answer_index: 2
        explain: "Selecting a non-imported type implicitly imports its namespace into the Blueprint's explicit import set."
      - q: "Adding a namespace to Namespaces to Always Include in Project Settings affects whom?"
        choices: ["All users sharing the project through source control", "Only your local editor", "Only packaged builds", "Only the Level Blueprint"]
        answer_index: 0
        explain: "Project Settings apply to the whole project and every user. Editor Preferences apply only to your local instance."
      - q: "What is the effect of removing an import from a Blueprint?"
        choices: ["A big editor slowdown", "The functions stop compiling", "The library asset is deleted", "No performance cost, but you lose the type and action menu filtering for that namespace"]
        answer_index: 3
        explain: "The docs say removing an import has no negative performance effect; only the filtering behaviour for that namespace is lost."
      - q: "Which characters does the namespace field reject?"
        choices: ["Dots", "Letters", "Characters such as # and ,", "Numbers"]
        answer_index: 2
        explain: "The editor validates the string and rejects incompatible characters like # and comma. Dots are used to build nested names."
      - q: "Which assets should get a namespace to gain the load-time benefit?"
        choices: ["Levels and materials", "Shared Function Libraries and Macro Libraries", "Only Level Blueprints", "Textures"]
        answer_index: 1
        explain: "The feature targets shared library assets, which otherwise load on every editor start regardless of use."
    flavors:
      _default: {why: "Big projects open Blueprints faster when libraries are grouped into namespaces and loaded on demand."}
      tech_art: {why: "Tool libraries for artists should not slow down every gameplay Blueprint.", do: "Put your editor utility libraries in a Tools namespace and check the Imports list of one gameplay Blueprint."}

  - id: PQ69
    rank: 2
    difficulty: adept
    track: programming
    subjects: [blueprint, inheritance, parent-class, data-only, architecture]
    required_for_majors: []
    taster_for_majors: []
    adjacent_for: [gameplay_design, level_design]
    required_spine: false
    elective: true
    title: Parent and child Blueprints
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-class-assets-in-unreal-engine"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-best-practices-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/creating-blueprint-classes-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-variables-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/compiler-overview-for-blueprints-visual-scripting-in-unreal-engine"
    checklist:
      - "Make BP_Vehicle (Actor) with a Static Mesh, variables TopSpeed (float, instance editable) and Secret (float, Private), and a function Honk that prints Honk. Add a macro FlashLights (local) that toggles a Point Light."
      - "Create BP_PoliceCar and BP_FireTruck as children of BP_Vehicle. In BP_PoliceCar override Honk to print Siren, and add a call to the parent Honk first. In BP_FireTruck, try to override FlashLights. Note what the editor offers."
      - "In BP_FireTruck try to Get Secret. Write one line on what happens and why."
      - "Create BP_Taxi as a child of BP_Vehicle and change only TopSpeed and the mesh. Do not add nodes. Open it and notice the compact Data-Only editor. Add one variable and watch it become a full Blueprint."
      - "Place one of each, press H to call Honk on all vehicles found with Get All Actors of Class BP_Vehicle. Watch each child answer differently."
      - "Change the type of TopSpeed in BP_Vehicle from float to integer, compile, and open the children. Write one line on what the compiler did to the placed instances."
    done_when: "Screenshot of the BP_PoliceCar Honk override with the Parent call, a PIE screenshot with all three prints, and your two lines."
    xp: 60
    verify_type: screenshot
    quiz:
      - q: "What does choosing a Parent Class do for a new Blueprint?"
        choices: ["It copies the parent's graphs into the new asset", "It links the two assets for streaming", "It makes the new Blueprint inherit the parent's properties and behaviour", "It locks the parent from editing"]
        answer_index: 2
        explain: "The child inherits from the parent. Any class, including other Blueprint classes, can be a parent."
      - q: "A child Blueprint changes only default values and adds no nodes, variables or components. What is it called?"
        choices: ["A Macro Library", "A Data-Only Blueprint", "A Level Blueprint", "A Child Actor"]
        answer_index: 1
        explain: "Data-Only Blueprints contain only inherited items and are edited in a compact property editor. Adding code or variables converts them to a full Blueprint."
      - q: "You want children to change what a behaviour does (siren instead of horn). Function or macro?"
        choices: ["Macro, because macros expand in place", "Either, they behave the same", "Event Dispatcher", "Function, because functions can be overridden in child Blueprints"]
        answer_index: 3
        explain: "Best practices says functions can be overridden in children; macros cannot, because they are pasted into the graph at compile time."
      - q: "Which can hold a latent node such as Delay?"
        choices: ["A Macro", "A Function", "Both", "Neither"]
        answer_index: 0
        explain: "One of the biggest differences: latent nodes are allowed in macros but not in functions."
      - q: "A variable is marked Private in the parent. What does that mean for a derived Blueprint?"
        choices: ["The child can still change it freely", "The child cannot modify it", "The child cannot exist", "The variable becomes instance editable"]
        answer_index: 1
        explain: "The variable Private property says the variable is not modified by derived Blueprints."
      - q: "The docs say Level Blueprints are best for what kind of work?"
        choices: ["Reusable behaviour placed many times", "Shared function libraries", "Networking", "One-off, level-specific logic such as opening a door after a boss dies"]
        answer_index: 3
        explain: "Level Blueprints are specific to their level. Blueprint Classes are the way to get reusable behaviour."
      - q: "New Subclass in Convert Selection to Blueprint Class is only available when?"
        choices: ["When exactly one actor is selected", "When several actors are selected", "Only for Static Mesh Actors", "Only inside a sublevel"]
        answer_index: 0
        explain: "New Subclass needs a single actor. It creates a subclass of that actor's class and keeps its property changes."
      - q: "After you compile a parent class that changed its variables, what does the compiler do to the placed instances?"
        choices: ["Deletes them", "Leaves them with old data until the level reloads", "Re-instances every object of the class and copies the old values to the new ones", "Marks them dirty only"]
        answer_index: 2
        explain: "The compiler overview describes re-instancing: it finds all instances, spawns new ones and copies the properties across."
    flavors:
      _default: {why: "Inheritance lets one base Blueprint carry shared logic while children only change what differs."}
      gameplay_design: {why: "Enemy and item families are cleaner as parent-child sets than as copies.", do: "Make three enemy children of one BP_EnemyBase that differ only by defaults."}
      level_design: {why: "Data-only children give you variants of a prop without new logic.", do: "Create two Data-Only variants of a door with different speeds."}

