      - "Mark the UINTERFACE with `Blueprintable`. In the I-class add `UFUNCTION(BlueprintCallable, BlueprintNativeEvent) bool ReactToTrigger();`."
      - "Make a C++ actor `ATrapActor` that inherits from AActor and IReactToTrigger, and implement `ReactToTrigger_Implementation` to log and return true."
      - "Make a Blueprint actor `BP_PointsPickup` that adds the ReactToTrigger interface in Class Settings and implements the event in Blueprint."
