  - id: PQ85
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [cpp, modules, build-system, ubt]
    required_spine: false
    required: false
    title: A second runtime module with its own Build.cs
    brief: "A module is a separate block of C++ code inside a project, with its own folder and its own Build.cs file that tells the build tool what the module needs. A new project has one module. When you split the code into more modules, it stays separated and builds faster as the project grows. In this quest you add a second runtime module by hand and create a class inside it."
    time_min: 90
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-modules"
    backup_url: null
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/how-to-make-a-gameplay-module-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/module-properties-in-unreal-engine"
    checklist:
      - "Use a C++ project, or create one from the Third Person template with C++ selected. You need an IDE such as Visual Studio to compile. In the Source folder of the project, create a folder named GameCore with two subfolders named Private and Public."
      - "Add the file GameCore.Build.cs with a class that derives from ModuleRules. Put Core, CoreUObject and Engine in PrivateDependencyModuleNames."
      - "Add the file Private/GameCoreModule.cpp. It contains #include \"Modules/ModuleManager.h\" and the line IMPLEMENT_MODULE(FDefaultModuleImpl, GameCore);."
      - "Register the module in the Modules list of the .uproject file with the Type Runtime. Then add \"GameCore\" to PublicDependencyModuleNames in the Build.cs file of the primary module."
      - "Generate the project files again: right-click the .uproject file and choose Generate Visual Studio project files. Then compile."
      - "In the editor, add a new C++ Actor class. Pick GameCore (Runtime) in the module dropdown, set Class Type to Public, and name the class ModuleActorBase. Make BP_ModuleActor from it and place it in the level."
    done_when: "Send screenshots of the Source folder tree with both modules, the contents of GameCore.Build.cs, the Modules list in the .uproject file, and the New C++ Class dialog with GameCore (Runtime) selected."
    xp: 65
    verify_type: screenshot
    quiz:
      - q: "What does Unreal Build Tool read to decide how to compile your project?"
        choices: ["The IDE solution file", "The Target.cs and Build.cs files", "The .ini config files", "The Content folder"]
        answer_index: 1
        explain: "UBT builds according to Target.cs files and the Build.cs files in your modules, and ignores the generated IDE solution."
      - q: "A module folder has code but no Build.cs. What happens?"
        choices: ["UBT compiles it as part of the primary module", "The editor creates a Build.cs automatically", "It compiles but cannot be loaded", "UBT does not discover the module"]
        answer_index: 3
        explain: "Every module must have a Build.cs file, or UBT will not discover it."
      - q: "When should a dependency go in PublicDependencyModuleNames instead of Private?"
        choices: ["When you use the module's classes in a public .h file", "When the module is large", "When you only use it in .cpp files", "Always; Private is only for plugins"]
        answer_index: 0
        explain: "Public dependencies are for modules used in public headers so dependent modules can include your headers. Private dependencies are preferred where possible for faster compile times."
      - q: "What do the Private and Public folders in a module control?"
        choices: ["The C++ access specifiers of the classes inside", "Whether the code is shipped", "Which headers other modules that depend on this one can see", "Nothing, they are just for organization"]
        answer_index: 2
        explain: "They have no relation to C++ private/public. A header in Public is exposed to modules that depend on this one; a header in Private is only visible inside the module."
      - q: "Which macro and class give the simplest module implementation?"
        choices: ["IMPLEMENT_MODULE with FDefaultModuleImpl", "UCLASS with UObject", "IMPLEMENT_PRIMARY_GAME_MODULE with AActor", "DECLARE_MODULE with IModuleInterface"]
        answer_index: 0
        explain: "You call IMPLEMENT_MODULE after the includes and provide FDefaultModuleImpl, an empty class that extends IModuleInterface."
      - q: "You changed a Build.cs file. What should you do before compiling?"
        choices: ["Nothing extra", "Regenerate the IDE project files", "Delete the Binaries folder", "Restart the computer"]
        answer_index: 1
        explain: "Generate the solution files any time you modify a Build.cs file or move source files between folders, for example by right-clicking the .uproject and choosing Generate Project Files."
      - q: "The editor cannot find C++ classes from a plugin at startup. What does the doc suggest?"
        choices: ["Set the module's LoadingPhase to PreDefault", "Change the module Type to Editor", "Move the plugin to the engine folder", "Add the module to PrivateDependencyModuleNames"]
        answer_index: 0
        explain: "Most gameplay modules use the Default loading phase, but if the editor frequently fails to find C++ classes in a plugin, try setting the loading phase to PreDefault."
      - q: "Two modules are in the same LoadingPhase and one must start before the other. What should you do?"
        choices: ["Rely on alphabetical order", "List them in the right order in the .uproject", "Use LoadModule or LoadModuleChecked in C++ during StartupModule", "Give the first one a lower Type"]
        answer_index: 2
        explain: "Loading order within a LoadingPhase is not deterministic. Use LoadModule / LoadModuleChecked in C++ to guarantee one loads before another."
    flavors:
      _default: {why: "Modules keep code separated and cut build times as a project grows."}
      programming: {why: "Knowing Build.cs and module layout unblocks plugins, editor-only code and faster compiles.", do: "Make the second module Type Editor and see what changes in a packaged build."}
      tech_art: {why: "Tool code belongs in an Editor module so it never ships.", do: "Read the Type field options and note which one an editor tool should use."}

  - id: PQ86
    rank: 2
    difficulty: adept
    specializations: [programming]
    subjects: [cpp, live-coding, iteration, workflow]
    required_spine: false
    required: false
    title: "Live Coding v2: reinstancing and preloaded modules"
    brief: "Live Coding compiles your C++ changes and patches them into the editor while it is still running, so you do not need to restart. It cannot patch every kind of change safely. Reinstancing is the feature that replaces existing objects when the layout of a class changes, for example when you add a variable. If you know what Live Coding can and cannot patch, you avoid crashes and lost time. In this quest you look at the Live Coding settings and test several kinds of change."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-live-coding-to-recompile-unreal-engine-applications-at-runtime"
    backup_url: null
    checklist:
      - "Open a C++ project, or create one from the Third Person template with C++ selected. You need an IDE such as Visual Studio to compile. Open Editor Preferences and go to General, then Live Coding. Take a screenshot of the General section and of the Modules section."
      - "Add the primary module of the project, or a second module if the project has one, to Preload Named Modules. Restart the editor and note the difference in startup time."
      - "Place an actor based on C++ in the level. If you have none, add an Actor class with Tools, then New C++ Class, give it a float UPROPERTY(EditAnywhere) with a default value set in the constructor, and build. In the .cpp file, change the default value in the constructor. Press Ctrl+Alt+F11 to start Live Coding, and check if the placed instance updates."
      - "Now change the same default value in the .h file instead. Run Live Coding again and compare the result."
      - "Add a completely new UFUNCTION and a new UPROPERTY to the class. Run Live Coding with Enable Reinstancing on, and confirm that the new property shows in the Details panel."
      - "Open the Live Coding console and take a screenshot of the log from a successful patch."
    done_when: "Send screenshots of the Live Coding preferences and of the Live Coding console after a successful build. Add a short text that says which change of the default value updated the placed instance (.h or .cpp) and why."
    xp: 55
    verify_type: screenshot
    quiz:
      - q: "Which keyboard shortcut starts a Live Coding build?"
        choices: ["Ctrl+Shift+B", "F7", "Ctrl+Alt+F11", "Ctrl+F5"]
        answer_index: 2
        explain: "Press Ctrl+Alt+F11 in either your IDE or Unreal Engine to start a Live Coding build; a notification shows the build status."
      - q: "You change a default value in the constructor in the .cpp and Live Code. Placed instances do not change. Why?"
        choices: ["Live Coding failed silently", "Constructor values in the .cpp do not update existing instances; changing them in the .h file does", "Defaults can never change with Live Coding", "You must restart PIE first"]
        answer_index: 1
        explain: "The doc states values set in the constructor in the .cpp will not update existing instances, but changes in the .h file take place."
      - q: "What does Object Reinstancing do?"
        choices: ["Deletes all placed actors", "Replaces existing object instances so large structural code changes can take effect", "Restarts the editor", "Compiles Blueprints"]
        answer_index: 1
        explain: "Object Reinstancing replaces existing instances throughout the application and editor so they take on structural changes compiled through Live Coding."
      - q: "With Reinstancing disabled, what kind of change is likely to crash?"
        choices: ["Changing a variable value", "A minor edit inside an existing function", "Adding new functions or new sets of variables", "Changing a log message"]
        answer_index: 2
        explain: "Small changes still work, but large-scale changes like new functions, new variables or big refactors behave unpredictably without reinstancing and usually crash."
      - q: "If Enable Live Coding is turned off, what does the editor use to compile?"
        choices: ["Nothing; compiling is disabled", "Hot Reload", "Unreal Build Tool in a separate window", "Blueprint nativization"]
        answer_index: 1
        explain: "When Live Coding is disabled, Unreal Editor falls back to Hot Reload. Live Coding is significantly faster and more flexible."
      - q: "What is the trade-off of preloading many modules for Live Coding?"
        choices: ["Faster iteration on those modules, but slower editor or game start", "Smaller build size", "No trade-off, it is always better", "It disables reinstancing"]
        answer_index: 0
        explain: "Preloading makes Live Coding faster for those modules, but the more modules you preload, the longer the editor or game takes to start. Avoid preloading Engine modules unless editing engine source."
      - q: "Where is Live Coding NOT available?"
        choices: ["In the editor", "During Play In Editor", "Attached to a packaged desktop build", "When launching on consoles and mobile devices"]
        answer_index: 3
        explain: "Live Coding works in the editor, in PIE, and attached to a packaged desktop build, but not when launching on consoles and mobile devices."
      - q: "Your code caches pointers to objects that get reinstanced. What should you use?"
        choices: ["Raw pointers, they update automatically", "ReloadReinstancingCompleteDelegate and ReloadCompleteDelegate to update or invalidate them", "Disable Live Coding", "TSubclassOf instead of pointers"]
        answer_index: 1
        explain: "With reinstancing enabled, code that holds pointers to reinstanceable objects must use these delegates to update pointers or invalidate caches."
    flavors:
      _default: {why: "Knowing what Live Coding can and cannot patch saves crashes and lost time."}
      programming: {why: "Reinstancing rules explain most 'why did my change not apply' moments.", do: "Write a one-line rule for your team: which edits need a full rebuild."}
      gameplay_design: {why: "Designers iterating on C++-backed actors benefit from fast, safe patches.", do: "Time a full rebuild versus a Live Coding patch of the same edit."}

