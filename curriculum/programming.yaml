      - "Open Edit > Project Settings > Maps & Modes. Set Game Default Map to your playable level."
      - "In Project Settings > Packaging > Project, confirm Build Configuration is Development."
      - "In the main toolbar open Platforms > Windows. Check that Binary Configuration shows Use Project Setting (Development)."
      - "Click Package Project. Pick or create an empty staging folder (for example D:\\Builds\\MyGame). Wait for Packaging Complete."
