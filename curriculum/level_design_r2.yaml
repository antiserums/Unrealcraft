    backup_url: TODO_URL
    backup_search: "unreal engine 5 key pickup locked door blueprint level design gating"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-03-open-doors-with-keys-in-unreal-engine"
    checklist:
      - "Make BP_Key: a mesh plus sphere trigger (BP-02 filter). On pickup, set a HasKey boolean on the player (Cast to your character or use an interface), then Destroy Actor."
      - "Make BP_LockedDoor: on player overlap, check HasKey. If true, play the BP-03 Timeline. If false, show feedback (Print String, a red light, or a sound)."
      - "Place the door so the player sees it locked BEFORE they find the key."
      - "Put the key where getting it is a small detour, not a hidden-object hunt."
      - "Test for soft locks: can the key fall out of reach, or can the player get stuck behind the door?"
    done_when: "PIE clip (under 30 s) showing locked feedback, key pickup and door opening, plus the door's graph screenshot."
    xp: 100
    verify_type: screenshot
    quiz:
      - q: "Why should the player see the locked door before finding the key?"
        choices: ["It loads faster", "The key then has a known purpose and the player knows where to go back to", "Keys can't spawn before doors", "It's required for NavMesh"]
        answer_index: 1
        explain: "Show the lock first, then the key. Picking up the key then means something."
      - q: "The player walks into the locked door and nothing happens. What's missing?"
        choices: ["Locked feedback, so the player knows it's a lock and not a bug", "A second key", "More lights everywhere", "A Level Streaming volume"]
        answer_index: 0
        explain: "A message, a sound or a red light tells them it's locked."
      - q: "What is a soft lock?"
        choices: ["A door with no collision", "A save file", "A state where the player can't progress without restarting", "A key with a timer"]
        answer_index: 2
        explain: "A key stuck behind a closed door or knocked off a ledge are classic soft locks."
      - q: "Where should the door check for the key?"
        choices: ["On Event Tick, every frame", "In the Construction Script", "In World Settings", "When the player overlaps the door, by reading the player's HasKey"]
        answer_index: 3
        explain: "Check on interaction. Nothing needs to run until the player arrives."
      - q: "Which R2 quests does this build on?"
        choices: ["Only Q1", "BP-02 for filtered pickups and BP-03 or BP-04 for opening the door", "None", "The Programming capstone"]
        answer_index: 1
        explain: "Lock and key combines filtered triggers, a Timeline door and actor communication."
    flavors:
      _default: {why: "Lock and key is the simplest way to make the player take a route in a set order."}
      level_design: {why: "Gating is how you control the order players see your spaces in.", do: "Mark the lock and the key on your beat chart so tension builds between them."}
      gameplay_design: {why: "A key is the smallest possible progression system."}

