  - id: R2-LD-05
    needs_others: true          # hidden and not required until the server has enough members
    rank: 2
    track: blueprint
    subjects: [playtesting, observation, feedback]
    required_for_majors: [level_design]
    taster_for_majors: []
    adjacent_for: [gameplay_design]
    required_spine: false
    elective: false
    title: "Run one peer playtest"
    time_min: 45
    official_url: TODO_URL
    backup_url: TODO_URL
    backup_search: "how to run a playtest silent observation level design notes"
    checklist:
      - "Find one peer (a #playtest post or voice channel). Get them your level: screenshare PIE or send a zip."
      - "Brief them only with what a real player would know: controls and the goal. Nothing about the route."
      - "Watch silently. Use a notes template: time, where, what they did, what they said, hesitations or backtracks."
      - "If they ask for help, answer \"What would you try?\" and note the question."
      - "After they finish, ask 3 open questions: What were you trying to do? Where did you get stuck? What stood out?"
      - "Write your top 3 issues, ranked by how often they happened and how much they blocked progress."
    done_when: "Writeup: filled notes template plus your ranked top 3 issues."
    xp: 60
    verify_type: writeup
    quiz:
      - q: "Your tester stops and asks \"Where do I go?\" What do you say?"
        choices: ["Point at the exit", "\"What would you try?\" Then write down where they got lost.", "Take their mouse", "End the test"]
        answer_index: 1
        explain: "Every explanation you give is a problem you won't see. Record the question."
      - q: "What goes in playtest notes?"
        choices: ["What the player did, where, and when, plus their exact words", "Your fixes only", "Your opinion of the tester", "Nothing, just remember it"]
        answer_index: 0
        explain: "Record what you observed first. Decide fixes afterward."
      - q: "What do you tell the tester before they start?"
        choices: ["The full route", "Where the key is", "Controls and the goal, like a real player would get", "Which parts are unfinished and why"]
        answer_index: 2
        explain: "Pre-explaining hides the problems you're testing for."
      - q: "Which follow-up question is best?"
        choices: ["\"Did you like it?\"", "\"Wasn't the gate cool?\"", "\"Would you buy this?\"", "\"What were you trying to do when you turned back?\""]
        answer_index: 3
        explain: "Open, specific questions get you useful answers. Leading questions get polite ones."
      - q: "The tester misses the lever and you think it's obvious. Next step?"
        choices: ["Assume they're wrong", "Treat it as a readability issue and try light, framing or a landmark", "Remove the lever", "Add a tutorial popup first"]
        answer_index: 1
        explain: "Fix the space first. Text prompts are a last resort."
    flavors:
      _default: {why: "You can't playtest your own level. You already know where everything is."}
      level_design: {why: "Watching one stranger play teaches more than an hour of reviewing it yourself.", do: "Mark every hesitation on your top-down sketch. Clusters show you what to fix."}
      gameplay_design: {why: "Same protocol for testing a loop. Watch what players do, not what they say."}

