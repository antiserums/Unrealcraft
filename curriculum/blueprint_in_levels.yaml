  - id: LDQ29
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [gating, pickups, doors, blueprint]
    required_spine: false
    required: true
    title: "Lock and key"
    brief: "Lock and key is a simple design pattern: the player finds a locked door, then finds a key, then comes back and opens the door. It is the simplest way to make the player visit places in a set order. A soft lock is a situation where the player can no longer finish the level, for example because the key is out of reach. In this quest you build a key and a locked door in Blueprint, place them well, and test for soft locks."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-02-create-a-key-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 key pickup locked door blueprint level design gating"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-03-open-doors-with-keys-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Make an Actor Blueprint named BP_Key from a mesh and a Sphere Collision. In its On Component Begin Overlap event, compare Other Actor with Get Player Pawn and use a Branch, so that only the player can pick it up. When the player picks it up, set a boolean (true or false) variable named HasKey on the player. To reach the player, use Cast to BP_ThirdPersonCharacter and add the HasKey variable to that Blueprint. Then call Destroy Actor."
      - "Make an Actor Blueprint named BP_LockedDoor with a door mesh and a Box Collision. When the player overlaps it, check HasKey. If it is true, open the door: the simplest way is to hide the door mesh and turn off its collision, and a nicer way is a Timeline that rotates the door. If it is false, show feedback, such as a Print String, a red light, or a sound."
      - "Place the door so that the player sees it locked BEFORE they find the key."
      - "Put the key in a place where getting it is a small detour. It should not be a search for a hidden object."
      - "Test for soft locks. Can the key fall out of reach? Can the player get stuck behind the door?"
    done_when: "Send three screenshots from PIE that show the locked feedback, the key pickup and the door opening, and a screenshot of the door's graph. A short video clip (30 seconds or less) also works in place of the three screenshots."
    xp: 100
    verify_type: screenshot
    quiz:
      - q: "Why should the player see the locked door before finding the key?"
        choices: ["The level loads faster when the door comes first in the Outliner", "The key then has a known purpose and the player knows where to go back to", "Keys can't spawn before doors, because the door creates the key on BeginPlay", "It's required before the NavMesh can build"]
        answer_index: 1
        explain: "Show the lock first, then the key. Picking up the key then means something."
      - q: "The player walks into the locked door and nothing happens. What's missing?"
        choices: ["Locked feedback, so the player knows it's a lock and not a bug", "A second key, so the player has a spare one for this door and the next", "More lights in every room, so the door is brighter", "A Level Streaming volume around the door"]
        answer_index: 0
        explain: "A message, a sound or a red light tells them it's locked."
      - q: "What is a soft lock?"
        choices: ["A door with no collision that the player can walk through", "A save file that can only be loaded one time", "A state where the player can't progress without restarting", "A key with a timer that runs out after a short while"]
        answer_index: 2
        explain: "A key stuck behind a closed door or knocked off a ledge are classic soft locks."
      - q: "Where should the door check for the key?"
        choices: ["On Event Tick, every frame, by searching the whole level for the key", "In the Construction Script, before the game starts", "In World Settings, with a key list", "When the player overlaps the door, by reading the player's HasKey"]
        answer_index: 3
        explain: "Check on interaction. Nothing needs to run until the player arrives."
      - q: "The key is a pickup with a sphere trigger. Why do you compare Other Actor with the player pawn before you set HasKey?"
        choices: ["Because overlap events only work when a Branch node comes right after them in the Event Graph", "Because anything can overlap the trigger, and only the player should be able to pick up the key", "Because the key would not be visible in the level without it", "Because Destroy Actor needs it as an input"]
        answer_index: 1
        explain: "A physics object or an AI character can also touch the trigger. The filter makes sure that only the player picks up the key."
    flavors:
      _default: {why: "Lock and key is the simplest way to make the player take a route in a set order."}
      level_design: {why: "Gating is how you control the order players see your spaces in.", do: "Mark the lock and the key on your beat chart so tension builds between them."}
      gameplay_design: {why: "A key is the smallest possible progression system."}

  - id: LDQ30
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [navigation, navmesh, ai]
    required_spine: false
    required: true
    title: "NavMesh walk test"
    brief: "A NavMesh, short for navigation mesh, is a map of the floor areas where AI characters can walk. Unreal builds it for you inside a Nav Mesh Bounds Volume. If the NavMesh has gaps, AI characters cannot cross them, and it is better to find this out now than later during a fight. In this quest you show the NavMesh on a route through a level, send a simple AI walker along it, and fix one gap."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/basic-navigation-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 nav mesh bounds volume ai move to beginner"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/navigation-system-in-unreal-engine"
    checklist:
      - "Open any level that has a floor, some steps or ramps and at least one doorway. The level of the Third Person template works, and so does a level you built yourself. Pick a route from one end of the level to the other. Place a Nav Mesh Bounds Volume in the level and scale it until it covers your whole route."
      - "Press P in the viewport to show the navigation. Walkable areas turn green. Note the gaps at doors, stairs and ledges."
      - "Create a Character Blueprint named BP_Walker and place it in the level. On BeginPlay, use an AI MoveTo node to send it to a Target Point at the end of your route. Add a Print String to both On Success and On Fail."
      - "Start PIE and watch it walk. Fix one spot where the green area breaks: widen a door, lower a step, or add a ramp."
      - "If your doors move, open Project Settings, go to Navigation Mesh, and set Runtime Generation to Dynamic. Then test the walker again with a door closed."
    done_when: "Send a screenshot of your route with the navigation shown (P), and a note that says which gap you fixed."
    xp: 80
    verify_type: screenshot
    quiz:
      - q: "Which key toggles the navigation display in the viewport?"
        choices: ["N", "F8", "P", "G"]
        answer_index: 2
        explain: "P shows the NavMesh. Green means AI can walk there."
      - q: "Why is there a gap in the green along every wall?"
        choices: ["The navmesh is pulled in by the agent radius so AI doesn't clip into walls", "It is a bug in the navmesh preview that goes away when you rebuild the level", "Lumen blocks the green color close to a wall", "The walls are too dark for the navmesh"]
        answer_index: 0
        explain: "Tight doorways can close up completely. That's a metrics issue."
      - q: "AI MoveTo goes straight to On Fail. What do you check first?"
        choices: ["Whether the material of the pawn has finished compiling", "Whether the pawn and the destination are both on the green navmesh", "Whether the post process settings of the level hide the pawn from view", "Whether the HUD is on screen"]
        answer_index: 1
        explain: "No path, no move. Also check the pawn is possessed by an AI Controller (placed Characters are by default)."
      - q: "A closed door should block AI, and opening it should let them through. What's needed?"
        choices: ["Nothing, because the navmesh never changes after the level has been built and saved", "Delete the navmesh and place a new one each time the door moves", "A Level Blueprint that moves the AI through the door by hand", "Runtime Generation set to Dynamic so the navmesh rebuilds around moving obstacles"]
        answer_index: 3
        explain: "By default the navmesh is static and built in the editor."
      - q: "Why does a level designer do this walk test early?"
        choices: ["To learn C++ before the AI is added", "To build a boss fight for the end of the level in the same step", "To check the route works for AI before building encounters later", "To make the lighting build work"]
        answer_index: 2
        explain: "Encounter spaces in later quests need AI that can actually get to the player."
    flavors:
      _default: {why: "If AI can't walk your level, you find out now instead of during an encounter."}
      level_design: {why: "The navmesh shows you whether AI can actually use your layout.", do: "Keep P on while you adjust doorways and stairs."}
      gameplay_design: {why: "Enemy behaviour depends on AI being able to reach the player."}
      programming: {why: "The navmesh is the data your AI code will query."}

  - id: LDQ31
    needs_others: true          # hidden and not required until the server has enough members
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [playtesting, observation, feedback]
    required_spine: false
    required: true
    title: "Run one peer playtest"
    brief: "A playtest is when another person plays your level while you watch. You cannot test your own level well, because you already know where everything is. The most useful thing you can do during a playtest is to stay silent and write down what happens. In this quest you run one playtest with a peer, take notes, and list the three biggest problems in order."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/playing-and-simulating-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "how to run a playtest silent observation level design notes"
    checklist:
      - "Pick a level that you built. If you have none, build a small one first: three rooms in a row, joined by doorways, with a clear goal in the last room. Find one person to play it, such as another learner, a friend or a family member. Give them your level: let them play at your computer, or share your screen and let them tell you what to do."
      - "Tell them only what a real player would know: the controls and the goal. Say nothing about the route."
      - "Watch silently. Use a notes template with these fields: time, where, what they did, what they said, and hesitations or backtracks (moments when they stop or go back)."
      - "If they ask for help, answer \"What would you try?\" and note the question."
      - "After they finish, ask 3 open questions: What were you trying to do? Where did you get stuck? What stood out?"
      - "Write your top 3 issues. Rank them by how often they happened and how much they blocked progress."
    done_when: "Send a writeup with your filled notes template and your ranked top 3 issues."
    xp: 60
    verify_type: writeup
    quiz:
      - q: "Your tester stops and asks \"Where do I go?\" What do you say?"
        choices: ["\"The exit is over there.\" Then point at it on the screen.", "\"What would you try?\" Then write down where they got lost.", "\"Let me show you.\" Then take their mouse for a moment.", "\"That's all for today.\" Then end the test."]
        answer_index: 1
        explain: "Every explanation you give is a problem you won't see. Record the question."
      - q: "What goes in playtest notes?"
        choices: ["What the player did, where, and when, plus their exact words", "The fixes that you plan to make, and nothing about the player", "Your opinion of the tester and how well they play games", "Nothing. You just remember it"]
        answer_index: 0
        explain: "Record what you observed first. Decide fixes afterward."
      - q: "What do you tell the tester before they start?"
        choices: ["The full route through the level, from start to exit", "Where the key is and which door it opens", "Controls and the goal, like a real player would get", "Which parts are unfinished and why they are not done yet"]
        answer_index: 2
        explain: "Pre-explaining hides the problems you're testing for."
      - q: "Which follow-up question is best?"
        choices: ["\"Did you like the level, or did you not like it?\"", "\"Wasn't the gate cool?\"", "\"Would you buy this?\"", "\"What were you trying to do when you turned back?\""]
        answer_index: 3
        explain: "Open, specific questions get you useful answers. Leading questions get polite ones."
      - q: "The tester misses the lever and you think it's obvious. Next step?"
        choices: ["Assume they're wrong and keep the lever as it is for the next tester", "Treat it as a readability issue and try light, framing or a landmark", "Remove the lever and open the gate for the player", "Add a tutorial popup first"]
        answer_index: 1
        explain: "Fix the space first. Text prompts are a last resort."
    flavors:
      _default: {why: "You can't playtest your own level. You already know where everything is."}
      level_design: {why: "Watching one stranger play teaches more than an hour of reviewing it yourself.", do: "Mark every hesitation on your top-down sketch. Clusters show you what to fix."}
      gameplay_design: {why: "Same protocol for testing a loop. Watch what players do, not what they say."}

  - id: LDQ32
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [capstone, beats, blueprint, playtesting, metrics]
    required_spine: false
    required: true
    capstone: true
    title: "CAPSTONE: Beats & playtest"
    brief: "Level design works in a loop: you plan the level, build it, test it with another person, and then change it. This quest takes you through the whole loop once. You plan three beats (parts of a level that each have their own job), build one small level from the plan, run a playtest, and change at least one thing because of what you saw."
    time_min: 120
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-designer-quick-start-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 level design blockout pacing playtest iteration"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/playing-and-simulating-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. First write a beat chart: a table with the rows Intro, Tension and Payoff, and for each row the location, the player goal, what the player does, and an intensity from 1 to 5. Then build a level named L_Beats_01 from it, with each beat in its own space. If you already have a beat chart of your own, you can use it."
      - "Include at least 2 different Blueprint interactions. For example, build a key that the player picks up to unlock a door, and a lever that opens a gate."
      - "Build to the metrics of your character. Before you build, test in PIE how high the character can jump, how wide a gap it can cross and how steep a ramp it can walk, and write the numbers down. Every gap, ledge and door in the level should fit these numbers."
      - text: "Run one playtest with one other person. Tell them only the controls and the goal, watch silently, and write down where they stop, go back or ask for help."
        needs_others: true
      - text: "Change at least one thing based on the playtest. Then update the beat chart so that it matches what you built."
        needs_others: true
    done_when: "Send a writeup with a short video clip (30 seconds or less) that shows the 3 beats, or three screenshots with one per beat. Add the final beat chart, your metrics numbers, your playtest notes, and 2 to 3 lines on what you changed and why. A peer or a mentor must approve it."
    done_when_solo: "Writeup with: a PIE clip (60 s or less) through all 3 beats; the final beat chart; a link to the metrics sheet; and 2–3 lines on what you would test with a player. Approved by a mentor."
    xp: 200
    verify_type: writeup
    quiz:
      - q: "What counts as 2 Blueprint interacts for this capstone?"
        choices: ["Two copies of the same door, placed in two different rooms of the level", "Two different interactions, like a key-locked door and a lever-driven gate", "Two Print String nodes that fire when the player is near", "One door that is opened twice"]
        answer_index: 1
        explain: "They must be different mechanics, each doing a job in a beat."
      - q: "Your playtester got lost in the tension beat. What does the work you send need?"
        choices: ["Nothing, because playtests are optional for this capstone", "A new level that replaces the one the tester played", "The notes, what you changed in response, and an updated beat chart", "A longer clip that shows the whole level two times, from start to end"]
        answer_index: 2
        explain: "The capstone is about iterating. Show the change and why you made it."
      - q: "How long can the video clip that you send be?"
        choices: ["30 seconds or less", "5 minutes", "Any length", "10 seconds exactly"]
        answer_index: 0
        explain: "Short clips get reviewed. If your level takes longer to play, cut between the beats, or send one screenshot per beat."
      - q: "A reviewer spots a gap the character can't clear. Which document should have prevented it?"
        choices: ["The beat chart", "The playtest notes", "The engine release notes", "The metrics sheet"]
        answer_index: 3
        explain: "Gaps and ledges come from your measured metrics, with margin."
      - q: "Who approves this capstone?"
        choices: ["The Quartermaster automatically", "A peer or mentor, after the quiz", "Nobody", "Epic Games"]
        answer_index: 1
        explain: "This capstone is checked with the quiz plus the work you send, approved by a person."
    flavors:
      _default: {why: "Plan it, build it, test it with someone else, change it. That's how level design works."}
      level_design: {why: "The first time you plan, build, test and revise a whole level yourself.", do: "Keep the before/after of your playtest change. It's the best part of the turn-in."}
      gameplay_design: {why: "The same loop you'll run on your Rank 2 core loop capstone."}

  # ------------ Level Design electives (Rank 2) ------------
  - id: LDQ21
    rank: 2
    difficulty: adept
    specializations: [gameplay_design, level_design, programming]
    subjects: [blueprint, platforms, timelines]
    required: false
    title: "Moving platforms"
    brief: "A moving platform is a floor piece that travels between two points, and the player can ride on it. It is a common part of platform games and a good use of a Timeline, the Blueprint node that changes a value smoothly over time. In this quest you build a platform that moves back and forth without stopping, and you test that the player stays on it."
    time_min: 30
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-06-puzzles-moving-platforms-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 moving platform blueprint timeline loop"
    checklist: ["Open any project, or create one from the Third Person template, and work in any level. Build an Actor Blueprint named BP_Platform with a Static Mesh for the floor piece.", "Add two Vector variables named PointA and PointB and turn on Instance Editable for both, so that you can set them on each copy in the level.", "In the Event Graph, add a Timeline with one float track that goes from 0 to 1 and back to 0, and turn on Loop. Connect BeginPlay to Play. On Update, use a Lerp (Vector) node from PointA to PointB with the track as Alpha, and connect the result to Set Relative Location on the mesh.", "Ride the platform in PIE and check that you do not slide off."]
    done_when: "Send a short video clip (30 seconds or less) that shows you riding the platform, or two screenshots from PIE that show you on the platform at two different positions. Also send a screenshot of the graph."
    xp: 25
    verify_type: screenshot
    quiz:
      - q: "What does a Timeline node do in a Blueprint?"
        choices: ["It waits a fixed time and then fires once", "It changes a value smoothly over time", "It records the game to a video file", "It lists the events of the level in order"]
        answer_index: 1
        explain: "A Timeline plays a curve and gives out its value on every frame. That smooth value is what moves the platform."
      - q: "Why do you turn on Instance Editable for PointA and PointB?"
        choices: ["So the platform can move while the game is paused", "So the variables are saved in the Timeline", "So the player can change them during the game", "So you can set them on each copy in the level"]
        answer_index: 3
        explain: "Instance Editable shows a variable in the Details panel of each placed copy. Every platform in the level can then have its own two points."
      - q: "The float track of the Timeline goes from 0 to 1 and back to 0. Why does it go back to 0?"
        choices: ["So the platform returns to PointA before the loop starts again", "So the platform stops at PointB and waits there for the player", "So the Timeline can be compiled", "So the platform moves twice as fast"]
        answer_index: 0
        explain: "The track value is the Alpha between the two points. Going back to 0 brings the platform back to PointA, so the loop repeats without a jump."
      - q: "Your platform moves from PointA to PointB and back once, and then stops. What did you forget?"
        choices: ["To add a Static Mesh", "To connect BeginPlay to Play", "To turn on Loop in the Timeline", "To make PointB a Vector"]
        answer_index: 2
        explain: "Without Loop the Timeline plays one time and ends. With Loop on, it starts again each time it reaches the end, so the platform never stops."
      - q: "Which output pin of the Timeline runs the movement on every frame while it plays?"
        choices: ["Finished", "Update", "Play", "Stop"]
        answer_index: 1
        explain: "Update fires on every frame while the Timeline plays. Finished fires only once at the end, and Play and Stop are inputs."
      - q: "The Lerp (Vector) node goes from PointA to PointB. What does it return when Alpha is 0.5?"
        choices: ["PointA, because Alpha is still below 1", "PointB, because Alpha is already above 0", "The sum of PointA and PointB, divided by Alpha", "The point halfway between PointA and PointB"]
        answer_index: 3
        explain: "Lerp blends between two values. Alpha 0 gives PointA, Alpha 1 gives PointB, and 0.5 gives the point in the middle."
      - q: "Where do you connect the result of the Lerp (Vector) node?"
        choices: ["To Set Relative Location on the mesh", "To the Play pin of the Timeline node", "To the Set node of the PointA variable", "To Event BeginPlay"]
        answer_index: 0
        explain: "Set Relative Location moves the mesh to the blended position. Because it runs on every Update, the floor piece travels smoothly."
      - q: "What do you check when you ride the platform in Play in Editor?"
        choices: ["That the platform is hidden in the game", "That the Timeline has two float tracks", "That you do not slide off the platform", "That the platform falls when you step on it"]
        answer_index: 2
        explain: "A moving platform only works if the player travels with it. The test is to stand on it and see that the character stays on."

  - id: LDQ22
    rank: 2
    difficulty: adept
    specializations: [gameplay_design, level_design, programming]
