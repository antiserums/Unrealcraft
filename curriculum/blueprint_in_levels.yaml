      - q: "Which of these is a good warning for a fire trap?"
        choices: ["A sound that plays only after the player has already been hurt by the fire", "A text that appears on the screen after the player dies", "A trap that is the same colour as the floor around it", "Flames and scorch marks the player sees while walking toward it"]
        answer_index: 3
        explain: "A warning must come before the damage. Something the player can see on the way to the trap lets them choose to avoid it."

  - id: LDQ23
    rank: 2
    difficulty: adept
    specializations: [gameplay_design, level_design, programming]
    subjects: [blueprint, checkpoints, respawn]
    required: false
    title: "Checkpoint and respawn"
    brief: "A checkpoint is a place that the game remembers, so that the player returns there after they die or fall and does not have to start the level again. To respawn means to appear again in the level. In this quest you build a checkpoint trigger that saves a position, and you make a fall send the player back to it."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/module-6-creating-level-checkpoints-and-kill-volumes-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 checkpoint respawn kill z blueprint"
    checklist: ["Open a project made from the Third Person template, or create one. Your character is then BP_ThirdPersonCharacter. Add a checkpoint trigger that stores a respawn transform. A transform is the location and rotation where the player will appear again. Make an Actor Blueprint named BP_Checkpoint with a Box Collision. When the player overlaps it, cast Other Actor to your character and store the transform of the checkpoint in a Transform variable named RespawnTransform on the character.", "Make a fall send the player back. Kill Z, the height in the World Settings below which actors are destroyed, removes the character and does not bring it back, so build your own kill volume above that height. Make an Actor Blueprint named BP_KillZone with a large Box Collision under the level. When the player overlaps it, cast Other Actor to your character and call Set Actor Transform with RespawnTransform, which moves the player back to the last checkpoint."]
    done_when: "Send a short video clip (30 seconds or less) that shows you reaching the checkpoint, falling, and appearing at the checkpoint again. Three screenshots from PIE of these three moments also work."
    xp: 30
    verify_type: screenshot
    quiz:
      - q: "What is a checkpoint in a level?"
        choices: ["A place that ends the level and loads the next one when the player reaches it", "A place where the player gets more health and loses all enemies", "A place where the game is paused", "A place the game remembers, so the player returns there after a fall"]
        answer_index: 3
        explain: "A checkpoint saves progress inside a level. After dying or falling, the player continues from there and not from the start."
      - q: "What does it mean to respawn?"
        choices: ["To appear again in the level", "To leave the level for the main menu", "To load a different level", "To save the game to a file"]
        answer_index: 0
        explain: "To respawn is to appear again in the level. In this quest the player appears again at the last checkpoint."
      - q: "What does the RespawnTransform variable on the character store?"
        choices: ["The health that the character had at the last checkpoint", "The location and rotation where the player will appear again", "The number of checkpoints that the player has touched in the level", "The speed of the character"]
        answer_index: 1
        explain: "A transform holds a location and a rotation. The checkpoint writes its own transform into this variable when the player touches it."
      - q: "What is Kill Z?"
        choices: ["A Blueprint node that restarts the level when the player falls out of it", "A volume that you drag from the Place Actors panel", "The height in the World Settings below which actors are destroyed", "A key that removes the selected actor"]
        answer_index: 2
        explain: "Kill Z is a height value in the World Settings. Any actor that falls below it is destroyed."
      - q: "Why can you not use Kill Z alone to send the player back to a checkpoint?"
        choices: ["It removes the character and does not bring it back", "It only works on static meshes", "It only works in the editor, not in the game", "It moves the character to the start of the level"]
        answer_index: 0
        explain: "Kill Z destroys the character. To move the player back, you need your own logic that runs before the character reaches that height."
      - q: "Where do you place the large Box Collision of BP_KillZone?"
        choices: ["Around the checkpoint, at the same height", "Above the level, in the sky, far over the Kill Z height", "Below the Kill Z height", "Under the level, above the Kill Z height"]
        answer_index: 3
        explain: "A falling player must touch your kill zone before reaching Kill Z. So the box sits under the level but above that height."
      - q: "Which node moves the player back to the last checkpoint?"
        choices: ["Destroy Actor with the player as Target", "Set Actor Transform with RespawnTransform", "Apply Damage with the player as Damaged Actor", "Add to Viewport"]
        answer_index: 1
        explain: "Set Actor Transform places the character at the stored transform. Because the checkpoint saved it, the player lands at the last checkpoint."
      - q: "You touch a checkpoint, fall, and appear at the wrong place. What do you check first?"
        choices: ["That the level has a Sky Light", "That the kill zone has a mesh that is visible to the player during play", "That the checkpoint stores its transform in RespawnTransform on overlap", "That Kill Z is set to 0 in the World Settings"]
        answer_index: 2
        explain: "The kill zone only moves the player to whatever RespawnTransform holds. If the checkpoint never wrote its transform into the variable, the old value is used."

  - id: LDQ24
    rank: 2
    difficulty: adept
    specializations: [gameplay_design, level_design, programming]
    subjects: [umg, hud, prompts]
    required: false
    title: "Simple HUD prompt"
    brief: "A HUD prompt is a short text on the screen that tells the player what they can do, such as \"Press E to open\". In Unreal you build screen elements as Widget Blueprints, and their names often start with WBP_. In this quest you make a widget with one line of text and show it only while the player is near an object they can use."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-04-player-hud-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 umg press e to interact prompt widget"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/umg-ui-designer-quick-start-guide-in-unreal-engine"
    checklist: ["Open any project, or create one from the Third Person template. Make a Widget Blueprint named WBP_Prompt: in the Content Browser click Add, then User Interface, then Widget Blueprint, and choose User Widget. Open it, drag a Text widget from the Palette into the designer, and type a single line such as Press E to use.", "Make an interactable, which is an object the player can use: an Actor Blueprint named BP_Interactable with a cube mesh and a Box Collision that is larger than the cube. Place it in the level. Show the widget on Begin Overlap when the player is near it, and hide it on End Overlap. To do this, on Begin Overlap call Create Widget with the class WBP_Prompt, store the result in a variable, and call Add to Viewport. On End Overlap, call Remove from Parent on that variable."]
    done_when: "Send a screenshot of the prompt showing in PIE."
    xp: 25
    verify_type: screenshot
    quiz:
      - q: "What is a HUD prompt?"
        choices: ["A sound that plays when the player is near an object they can use", "A short text on the screen that tells the player what they can do", "A menu that pauses the game", "A light that marks an object in the level"]
        answer_index: 1
        explain: "A HUD prompt is a short on-screen text such as Press E to open. It tells the player that an action is possible right now."
      - q: "As which kind of asset do you build screen elements in Unreal Engine?"
        choices: ["Level Instances", "Material Instances", "Widget Blueprints", "Data Assets"]
        answer_index: 2
        explain: "Screen elements are built as Widget Blueprints. Their names often start with WBP_, as in WBP_Prompt."
      - q: "How do you create a new Widget Blueprint in the Content Browser?"
        choices: ["Click Add, then User Interface, then Widget Blueprint", "Click Add, then Blueprint Class, then pick Actor as the parent class", "Click Add, then Material, then rename it", "Click Add, then Level"]
        answer_index: 0
        explain: "Widget Blueprints are in the User Interface group of the Add menu. You then choose User Widget as the parent."
      - q: "Inside the Widget Blueprint, where do you take the Text widget from?"
        choices: ["From the Outliner", "From the Place Actors panel", "From the Details panel", "From the Palette"]
        answer_index: 3
        explain: "The Palette lists the widgets you can use. You drag a Text widget from it into the designer and type your line."
      - q: "Which two nodes show the prompt on the screen when the player comes near?"
        choices: ["Create Widget, then Add to Viewport", "Spawn Actor from Class, then Play", "Remove from Parent, then Create Widget", "Print String, then Add to Viewport"]
        answer_index: 0
        explain: "Create Widget makes a widget from the class WBP_Prompt. Add to Viewport then puts that widget on the screen."
      - q: "Which node hides the prompt when the player walks away?"
        choices: ["Destroy Actor", "Remove from Parent", "Add to Viewport", "Set Actor Transform"]
        answer_index: 1
        explain: "Remove from Parent takes the widget off the screen. You call it on End Overlap."
      - q: "Why do you store the result of Create Widget in a variable?"
        choices: ["So the text can be translated into other languages", "So the widget is saved to disk when the player leaves the level", "So the widget is created again on every frame", "So you can remove the same widget later on End Overlap"]
        answer_index: 3
        explain: "End Overlap needs to know which widget to remove. The variable keeps a reference to the widget that Begin Overlap created."
      - q: "Why is the Box Collision of BP_Interactable larger than the cube?"
        choices: ["So the cube can be pushed around by the player", "So the cube is easier to see from far away in a dark level", "So the prompt shows while the player is near the cube", "So the cube blocks the camera"]
        answer_index: 2
        explain: "The overlap must start before the player touches the cube. A larger box gives a zone around the object where the prompt is shown."

  - id: LDQ25
    rank: 2
    difficulty: adept
    specializations: [gameplay_design, level_design, programming]
    subjects: [blueprint, puzzles, physics]
    required: false
    title: "Switch puzzle with cubes"
    brief: "A pressure plate is a switch on the floor that is active only while something stands on it. Together with a physics cube that the player can push, it makes a classic small puzzle: put the cube on the plate to keep a gate open. In this quest you build the plate and the gate, and you decide which objects are allowed to press the plate."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-05-puzzles-switches-and-cubes-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 pressure plate cube puzzle blueprint"
    checklist: ["Open any project, or create one from the Third Person template. Make a gate: an Actor Blueprint named BP_Gate with a cube mesh and two custom events. Open hides the mesh and turns off its collision, and Close shows the mesh and turns its collision on again. Place it in the level.", "Build a pressure plate that opens the gate only while a physics cube sits on it. Make an Actor Blueprint named BP_PressurePlate with a flat mesh and a Box Collision just above it. Add an Instance Editable variable named Gate of type BP_Gate. Place the plate, and pick the gate with the eyedropper in the Details panel.", "In BP_PressurePlate, on Begin Overlap, call Open on the gate, and on End Overlap, call Close.", "For the cube, place a cube mesh, set its Mobility to Movable, and turn on Simulate Physics and Generate Overlap Events in its Details panel. Without Generate Overlap Events the plate does not notice the cube.", "Filter the plate so that only the cube counts, or only the player counts. One way is to give the cube an Actor Tag such as Cube, and check Actor Has Tag on Other Actor before you open the gate. Decide which one counts, and say why."]
    done_when: "Send a short video clip (30 seconds or less), or two screenshots from PIE, that show the puzzle before and after it is solved. Add one line that says what the plate reacts to and why."
    xp: 30
    verify_type: screenshot
    quiz:
      - q: "What is a pressure plate?"
        choices: ["A switch on the floor that is active only while something stands on it", "A switch on the wall that stays on for the rest of the level after one press", "A floor piece that moves between two points in a loop", "A volume that damages anything inside it"]
        answer_index: 0
        explain: "A pressure plate works only while it is pressed. When the object leaves, the plate turns off again."
      - q: "What does the Open event of BP_Gate do?"
        choices: ["It destroys the gate actor and spawns an open one", "It moves the gate to another level that is not loaded", "It hides the mesh and turns off its collision", "It plays a sound at the gate and nothing else"]
        answer_index: 2
        explain: "With the mesh hidden and its collision off, the player can walk through. Close shows the mesh and turns the collision on again."
      - q: "How does a placed pressure plate know which gate to open?"
        choices: ["It always opens the gate that is nearest to it when the level starts", "It opens every gate in the level at the same time", "It reads the name of the gate from the Outliner", "You pick the gate in its Instance Editable variable named Gate"]
        answer_index: 3
        explain: "The variable Gate is of type BP_Gate and is Instance Editable. In the Details panel of the placed plate you pick the gate with the eyedropper."
      - q: "The plate calls Open on Begin Overlap and Close on End Overlap. What happens when the cube is pushed off the plate?"
        choices: ["The gate stays open", "The gate closes", "The cube is destroyed", "The plate is hidden"]
        answer_index: 1
        explain: "Leaving the Box Collision fires End Overlap, which calls Close. The gate is open only while something sits on the plate."
      - q: "Which settings make the cube a physics cube that the player can push?"
        choices: ["Mobility set to Static and Cast Shadow turned on", "Mobility set to Stationary and Hidden in Game turned on", "Mobility set to Movable and Simulate Physics turned on", "Mobility set to Static and Simulate Physics turned off"]
        answer_index: 2
        explain: "Only a Movable mesh can simulate physics. With Simulate Physics on, the cube reacts when the character pushes it."
      - q: "The cube sits on the plate, but the gate does not open. What do you check first on the cube?"
        choices: ["That Generate Overlap Events is turned on", "That its material is set to a bright color", "That it is named Cube in the Outliner", "That its scale is 1 on all three axes"]
        answer_index: 0
        explain: "Without Generate Overlap Events the cube does not fire overlap events. The plate then does not notice the cube at all."
      - q: "How can the plate react only to the cube and not to the player?"
        choices: ["Make the Box Collision of the plate smaller than the capsule of the player", "Turn off the collision of the player for the whole level", "Place the plate far from the start of the level", "Give the cube an Actor Tag and check Actor Has Tag on Other Actor"]
        answer_index: 3
        explain: "The tag marks the cube. The plate checks Other Actor with Actor Has Tag and only calls Open when the tag is there."
      - q: "If only the cube counts, what must the player do to pass the gate?"
        choices: ["Stand on the plate and wait until the gate opens", "Push the cube onto the plate and leave it there", "Jump over the plate and run to the gate at once", "Touch the gate two times"]
        answer_index: 1
        explain: "The gate is open only while the cube sits on the plate. The player solves the puzzle by moving the cube there and then walking through."

  - id: LDQ26
    rank: 2
    difficulty: adept
    specializations: [gameplay_design, level_design, programming]
    subjects: [audio, feedback, blueprint]
    required: false
    title: "Sound on interact"
    brief: "Sound tells the player that their action worked, or that it did not. A door that makes one sound when it opens and a different sound when it is locked is much easier to understand. In this quest you add two sounds to a simple door."
    time_min: 20
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/BlueprintAPI/Audio/PlaySoundatLocation"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 play sound at location blueprint door sound"
    checklist: ["Open a project made from the Third Person template, or create one. Make an Actor Blueprint named BP_SoundDoor with a cube mesh in the shape of a door, a Box Collision, and an Instance Editable boolean (true or false) variable named IsLocked. If you already have a door or lever Blueprint, you can use that instead.", "On the Begin Overlap event of the Box Collision, add a Branch on IsLocked. After each output of the Branch, add a Play Sound at Location node. Pick a sound in its Sound pin and connect Get Actor Location to its Location pin. If you have no sound files, the engine has a few short sounds, for example CompileSuccess and CompileFailed. If they do not show in the list, click the settings icon of the list and turn on Show Engine Content. You can also add an Audio Component and call Play on it.", "Use one sound for when the door is locked and a different sound for when it opens. Place two copies in the level, one locked and one not, and test both in PIE."]
    done_when: "Send a screenshot of the graph that shows both sound nodes. A screenshot has no audio, so if you can, also send a short video clip (30 seconds or less) with sound."
    xp: 15
    verify_type: screenshot
    quiz:
      - q: "Why do you add sound to an interaction such as opening a door?"
        choices: ["It makes the door open faster than a door without sound", "It replaces the need for a door mesh and an open animation in the level", "It tells the player that their action worked, or that it did not", "It stops other sounds in the level"]
        answer_index: 2
        explain: "Sound is feedback. One sound for opening and a different sound for locked lets the player understand the result at once."
      - q: "Which node plays a sound at a place in the level?"
        choices: ["Add to Viewport", "Play Sound at Location", "Set Relative Location", "Apply Damage"]
        answer_index: 1
        explain: "Play Sound at Location plays the sound you pick in its Sound pin at the position given in its Location pin."
      - q: "What do you connect to the Location pin so that the sound comes from the door?"
        choices: ["Get Actor Location", "Get Player Controller", "Event BeginPlay", "The IsLocked variable"]
        answer_index: 0
        explain: "Get Actor Location returns the position of the door actor. The sound then plays from the door and not from somewhere else."
      - q: "What does the Branch on IsLocked do in the door graph?"
        choices: ["It plays both sounds at the same time", "It locks the door for the rest of the game", "It repeats the sound until the player leaves the trigger of the door", "It chooses one of two paths, each with its own sound"]
        answer_index: 3
        explain: "A Branch runs its True output or its False output. One output plays the locked sound and the other plays the open sound."
      - q: "Why is the IsLocked variable Instance Editable?"
        choices: ["So the sound can be changed by the player during the game", "So one copy in the level can be locked and another one not", "So the door is saved as a Level Instance with its own sounds", "So the Branch node can be compiled"]
        answer_index: 1
        explain: "Instance Editable lets you set the variable on each placed copy. You place two doors, one locked and one not, and test both sounds."
      - q: "The engine sounds CompileSuccess and CompileFailed do not show in the sound list. What do you do?"
        choices: ["Restart the editor and open the sound list again after the project has loaded", "Import them from the Epic website into your Content folder", "Click the settings icon of the list and turn on Show Engine Content", "Enable the Water plugin"]
        answer_index: 2
        explain: "These sounds are part of the engine content, which is hidden by default. Show Engine Content makes them appear in the list."
      - q: "What is another way to play a sound from the door Blueprint?"
        choices: ["Add an Audio Component and call Play on it", "Add a Box Collision and call Open on it", "Add a Timeline and turn on Loop", "Add a Text widget and call Add to Viewport"]
        answer_index: 0
        explain: "An Audio Component is a sound source that is part of the actor. Calling Play on it starts its sound."
      - q: "Why should you also send a short video clip with sound, if you can?"
        choices: ["A clip shows the nodes more clearly", "A clip is smaller than a screenshot", "A clip proves that the project was saved", "A screenshot has no audio"]
        answer_index: 3
        explain: "The graph screenshot shows that both sound nodes exist, but nobody can hear a picture. A clip with sound proves that the two sounds play."
