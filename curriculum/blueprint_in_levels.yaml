    checklist: ["Open any project, or create one from the Third Person template, and open any level, for example the level of the template. Add one trap to it, such as spikes or fire. The quick way is a Pain Causing Volume: drag one from the Place Actors panel, under Volumes, and set Damage Per Sec in its Details panel. The other way is a Blueprint with a Box Collision that calls Apply Damage on the Other Actor when something overlaps it. Your character only loses health if its Blueprint handles Event AnyDamage.", "Warn the player. Make the trap visible before it hurts them."]
    done_when: "Send a screenshot of the trap, and add one line that says how the player is warned."
