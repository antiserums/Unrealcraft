    backup_search: "unreal engine 5 pressure plate cube puzzle blueprint"
    checklist: ["Build a pressure plate that opens a gate only while a physics cube sits on it. Make an Actor Blueprint named BP_PressurePlate with a flat mesh and a Box Collision just above it. On Begin Overlap, open the gate, and on End Overlap, close it again. For the cube, place a cube mesh, set its Mobility to Movable, and turn on Simulate Physics and Generate Overlap Events in its Details panel. Without Generate Overlap Events the plate does not notice the cube.", "Filter the plate so that only the cube counts, or only the player counts. One way is to give the cube an Actor Tag such as Cube, and check Actor Has Tag on Other Actor before you open the gate. Decide which one counts, and say why."]
    done_when: "Send two screenshots from PIE that show the puzzle before and after it is solved, and add one line that says what the plate reacts to and why. A short GIF also works, and you can paste a link to a longer video."
    xp: 30
