    required: false
    title: "Traps and damage volumes"
    brief: "A trap is a place in the level that hurts the player, such as spikes or fire. Unreal has a damage system for this: the Apply Damage node sends damage to an actor, and a Pain Causing Volume is a ready-made volume that damages anything inside it. A fair trap can be seen before it hurts. In this quest you add one trap to a level and make sure the player gets a warning."
