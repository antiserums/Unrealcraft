# Unrealcraft — Level Design, Rank 2 ("Adept": can make a thing play)
# Rank 2 has two tracks: materials and blueprint. Level Design fully requires only the blueprint side
# (Blueprint-in-levels). The shared BP quests (R2-BP-*) also count for gameplay_design and programming.
# URL prefix: https://dev.epicgames.com/documentation/en-us/unreal-engine/
# Verified slugs only (see VERIFIED_URLS.md). Backup videos are TODO_URL until a human picks a dated UE5+ video.
# Work in UC_Sandbox. Suggested level for this rank: L_Beats_01 in /Content/UC/Maps.

quests:
  # ------------ Shared blueprint track (level_design, gameplay_design, programming) ------------
  - id: GDQ1
    rank: 2
    difficulty: adept
    specializations: [level_design, gameplay_design, programming]
    subjects: [blueprint, components, construction-script, variables]
    required_spine: false
    required: true
    title: "Actor Blueprint anatomy"
    brief: "An Actor Blueprint is a reusable object that you build once and can place in a level many times. It is made of components (its parts, such as a mesh and a light), variables (values you can change), and two graphs. The Construction Script runs in the editor each time you change the actor, and the Event Graph runs while the game is playing. In this quest you build a lamp Blueprint and give every copy in the level its own color and height."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-class-assets-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 actor blueprint components construction script instance editable variables"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-variables-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/events-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Create an Actor Blueprint named BP_Lamp in the folder /Content/UC/Blueprints (create the folder if it does not exist yet). Add a Static Mesh component and a Point Light component under the root component. Give the Static Mesh component any mesh, for example a cylinder from the engine's basic shapes."
      - "Add a variable of type Linear Color named LightColor and a variable of type Float named Height. Tick Instance Editable (the eye icon) on both, so that you can change them on each copy in the level."
      - "Open the Construction Script. Set the color of the light from LightColor, and set the relative Z location of the mesh from Height."
      - "Place 3 copies of the lamp in the level. Give each one a different color and height in the Details panel, and watch them update without pressing Play."
      - "Open the Event Graph. On the BeginPlay event, use a Print String node to print the name of the lamp, so that you can see the part that runs during the game."
    done_when: "Send a screenshot of the 3 placed lamps with different values, and a screenshot of the Construction Script graph."
    xp: 80
    verify_type: screenshot
    quiz:
      - q: "When does the Construction Script run?"
        choices: ["Only during play, once on every frame, and never while you are working in the editor", "In the editor when the actor is placed, moved or edited, and again when it spawns", "Only when you compile the C++ code of the project and restart the editor", "Only on BeginPlay, one time for each level"]
        answer_index: 1
        explain: "That's why it's good for previewing setup in the editor. Gameplay logic goes in the Event Graph."
      - q: "What does ticking Instance Editable on a variable do?"
        choices: ["Makes it replicate from the server to every client in a network game", "Lets you set a different value on each placed copy in the Details panel", "Makes it read-only, so that no Blueprint can change it during play", "Saves it to disk when the game is closed"]
        answer_index: 1
        explain: "Each instance in the level can then override the Blueprint's default."
      - q: "You want a door's open width to show in the editor before you press Play. Where does that logic go?"
        choices: ["Event Tick of the door Blueprint", "The Level Blueprint of the map", "The Construction Script", "The Project Settings window"]
        answer_index: 2
        explain: "The Construction Script reruns on edit, so the preview updates as you change values."
      - q: "What is the root component?"
        choices: ["The component at the top of the hierarchy; the other components are positioned relative to it", "Whatever component was added last in the Components panel; it is drawn on top of the others", "The Event Graph of the Blueprint; all other graphs are called from it when the game starts", "A hidden debug mesh that the editor adds to every actor"]
        answer_index: 0
        explain: "Moving the root moves everything attached to it."
      - q: "You change a variable's default in the Blueprint. Which placed copies update?"
        choices: ["None of them, until you restart the editor and load the level again", "Only the first one that you placed in the level", "All of them, including the ones where you already overrode the value", "The ones that haven't overridden that value in Details"]
        answer_index: 3
        explain: "An overridden instance value wins over the class default. The reset arrow in Details clears the override."
    flavors:
      _default: {why: "Most things you build later start as an Actor Blueprint like this one."}
      level_design: {why: "Instance Editable variables let you drop 10 copies and tune each one without editing the graph.", do: "Expose the numbers you'd want to tweak per placement, like height, color and delay."}
      gameplay_design: {why: "Exposed variables are your tuning knobs. Designers tweak them without touching the graph."}
      programming: {why: "Later a C++ UPROPERTY will show up in Details the same way these variables do."}

  - id: GDQ2
    rank: 2
    difficulty: adept
    specializations: [level_design, gameplay_design, programming]
    subjects: [blueprint, collision, overlap, triggers]
    required_spine: false
    required: true
    title: "Trigger volumes and overlap events"
    brief: "An overlap happens when one object enters the space of another without being blocked by it. A trigger is an invisible shape that fires an event when something overlaps it, and this is how the world notices the player. Anything can overlap a trigger, so you must check who entered. In this quest you build a trigger zone that reacts only to the player, and you also try the same idea in the Level Blueprint."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/trigger-volume-actors-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 trigger box overlap event cast to character only player"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/collision-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/events-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Create an Actor Blueprint named BP_TriggerZone with a Box Collision component as its root. Add a Vector variable named BoxSize, give it a default value such as 200, 200, 100, and turn on Instance Editable. In the Construction Script, call Set Box Extent on the Box Collision and connect BoxSize to it. Now you can change the size of the box on each copy in the level from the Details panel."
      - "Add the On Component Begin Overlap event. Compare Other Actor with Get Player Pawn and connect the result to a Branch node, so that only the player continues."
      - "Add the On Component End Overlap event with the same filter. After the filter, add a Print String node with the text \"left zone\"."
      - "Push a physics cube (a cube with Simulate Physics turned on) into the zone. Confirm that nothing fires."
      - "Also place a Trigger Box from the editor in the level, and handle its overlap once in the Level Blueprint. This way you have seen both ways to do it."
    done_when: "Send a screenshot of the overlap graph with the filter, and a PIE screenshot that shows the print only fired for the player."
    xp: 80
    verify_type: screenshot
    quiz:
      - q: "Your trigger fires when a physics cube rolls in. How do you make it player-only?"
        choices: ["Delete the cube from the level, and every other physics object that could roll into the trigger", "Check that Other Actor equals Get Player Pawn (or Cast To your character) before continuing", "Turn off collision on the trigger, so only the player can enter it", "Use Event Tick instead and measure the distance to the cube"]
        answer_index: 1
        explain: "Filter on Other Actor. Anything can overlap a box."
      - q: "What has to be true for Begin Overlap to fire between the trigger and the player's capsule?"
        choices: ["Both have Generate Overlap Events on, and the trigger is set to Overlap the player's object type (neither ignores the other)", "Both must be set to Block each other, and Simulation Generates Hit Events must be on for both the trigger and the capsule", "The trigger must be visible in game, with Hidden in Game turned off, and the capsule must be visible as well", "The player must be jumping or falling when the capsule first touches the trigger"]
        answer_index: 0
        explain: "If either side ignores the other's channel, or has overlap events off, no event fires. Both blocking gives a hit, not an overlap."
      - q: "Which event would you use to close a door after the player walks away?"
        choices: ["Event BeginPlay", "On Component Hit", "On Component End Overlap", "Construction Script"]
        answer_index: 2
        explain: "End Overlap fires when the overlapping actor leaves the collision."
      - q: "Why build the trigger into a Blueprint instead of using a Trigger Box plus the Level Blueprint?"
        choices: ["Trigger Boxes don't work in UE5, so a Blueprint is the only way left", "The Level Blueprint is C++ only, so you cannot add overlap events to it", "It renders faster, because the trigger is drawn together with the door", "The logic travels with the actor, so every copy you place already works"]
        answer_index: 3
        explain: "Level Blueprint logic is stuck in one level. A Blueprint actor is reusable."
      - q: "Where can you quickly handle a placed Trigger Box's overlap without making a new Blueprint?"
        choices: ["The Level Blueprint, with the Trigger Box selected", "World Settings, under the Game Mode section", "The Material Editor, with the Trigger Box material open", "The Content Drawer"]
        answer_index: 0
        explain: "Select it in the level, open the Level Blueprint, right-click and add its overlap event. Fine for one-offs."
    flavors:
      _default: {why: "Overlaps are how the world notices the player."}
      level_design: {why: "Almost every scripted moment in a level starts with a trigger.", do: "Size the trigger to where the player actually walks, not to the whole room."}
      gameplay_design: {why: "Zones, pickups and hazards are all overlaps with a filter."}
      programming: {why: "The same collision rules apply in C++. Learn the settings here where they're easy to see."}

  - id: GDQ3
    rank: 2
    difficulty: adept
    specializations: [level_design, gameplay_design, programming]
    subjects: [blueprint, timelines, animation-curves]
    required_spine: false
    required: true
    title: "Timelines: a door that moves smoothly"
    brief: "A Timeline is a Blueprint node that changes a value smoothly over a set time, following a curve that you draw. It is the quickest way to make things move smoothly, such as a door that swings open. A Lerp node mixes two values, so a Timeline that goes from 0 to 1 can move the door from closed to open. In this quest you build a door that opens when the player comes near and closes again when the player leaves."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/timelines-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 timeline door open lerp rotator play reverse"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/opening-doors-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Create an Actor Blueprint named BP_Door. Add a Static Mesh component with a cube that you scale to the shape of a door. Add a Box Collision component that is larger than the door, so that the player touches it before reaching the door. If you already have a door Blueprint of your own, you can use that instead."
      - "In the Event Graph, add a Timeline named TL_Open with one float track that goes from 0 to 1 over 1.0 s. Ease the curve: right-click the keys and choose Auto."
      - "Connect the output of the track to a Lerp (Rotator) or Lerp (Vector) node. Connect the result of the Lerp to Set Relative Rotation or Set Relative Location on the door mesh."
      - "Add the events On Component Begin Overlap and On Component End Overlap for the Box Collision. In each one, compare Other Actor with Get Player Pawn and connect the result to a Branch node, so that only the player continues. Connect Begin Overlap to the Play input of the Timeline, and End Overlap to the Reverse input."
      - "Make the variable OpenAngle (or OpenOffset) Instance Editable, so that each door can open in a different way."
      - "Start PIE. Step into the trigger and out again when the door is halfway through its motion. The door should reverse from where it is and not snap."
    done_when: "Send a short video clip (30 seconds or less), or two screenshots from PIE, that show the door opening and reversing halfway. Also send a screenshot of the Timeline curve and the graph."
    xp: 80
    verify_type: screenshot
    quiz:
      - q: "Why use a Timeline for a door instead of Event Tick?"
        choices: ["Tick can't move actors or components, so a Timeline is the only way to change a rotation during play", "A Timeline plays a curve over a set time, can reverse, and only runs while it's playing", "Timelines run on the GPU, so they cost nothing on the game thread", "Tick is removed in UE5 and replaced by Timelines"]
        answer_index: 1
        explain: "You get easing, Play/Reverse and no per-frame cost when the door is idle."
      - q: "The player steps out while the door is half open. Which input gives a smooth close?"
        choices: ["Play from Start", "Stop", "Set New Time to 0", "Reverse"]
        answer_index: 3
        explain: "Reverse runs back from the current position. Play from Start or Set New Time would snap."
      - q: "Your float track goes 0 to 1. How do you turn that into door movement?"
        choices: ["Use it as the Alpha of a Lerp between closed and open, then set the relative rotation or location", "Plug it straight into Destroy Actor, so the closed door is removed and an open one takes its place", "Multiply it by Delta Seconds and add the result to the door's scale on every frame", "Connect it to Print String and read the angle from the log"]
        answer_index: 0
        explain: "A 0–1 track as a Lerp alpha is the reusable pattern. Change the end values, keep the curve."
      - q: "You try to add a Timeline inside a Blueprint function and can't. Why?"
        choices: ["A plugin is missing, and Timelines stay hidden until it is on", "Functions are C++ only, so no Blueprint node can be added there", "Timelines run over time, so they only live in the Event Graph", "You need a Level Blueprint for every Timeline"]
        answer_index: 2
        explain: "Functions must finish in one call. Put the Timeline in the Event Graph and call it with a custom event."
      - q: "Designers say the door is too slow. What's the cleanest fix?"
        choices: ["Add a Delay before the Timeline so the door starts later", "Shorten the Timeline length, or use Set Play Rate from an exposed variable", "Scale the door mesh down so it has less distance to travel each time it opens", "Run it on Tick and add a larger angle on every frame"]
        answer_index: 1
        explain: "Play Rate from an Instance Editable variable lets each door have its own speed."
    flavors:
      _default: {why: "Timelines are the quickest way to make things move smoothly in Blueprint."}
      level_design: {why: "Doors, lifts and bridges that ease in and out feel intentional. Snapping looks broken.", do: "Expose speed and distance so you can tune each door during a playtest."}
      gameplay_design: {why: "The curve controls the feel. Ease-in and ease-out matter as much as timing."}
      animation: {why: "Same idea as a curve in Sequencer, driven by gameplay instead."}

  - id: GDQ4
    rank: 2
    difficulty: adept
    specializations: [level_design, gameplay_design, programming]
    subjects: [blueprint, communication, interfaces, references]
    required_spine: false
    required: true
    title: "Actors talking: direct references vs Blueprint Interfaces"
    brief: "Sooner or later one actor has to tell another actor to do something, for example a lever that opens a gate. One way is a direct reference: the lever stores a link to one exact type of actor. Another way is a Blueprint Interface, a list of function names that many different Blueprints can share, so the lever can send the same message to a gate, a lamp or a platform. In this quest you build the lever both ways and see what happens when the link is missing."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-communication-usage-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 blueprint interface lever opens gate direct reference vs interface"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-interface-in-unreal-engine"
    checklist:
      - "Open any project, or create one from the Third Person template. Create two Actor Blueprints. BP_Gate has a cube mesh and a custom event named Open that hides the mesh and turns off its collision. BP_Lever has a small mesh and a Box Collision. Version A: in BP_Lever, add an Instance Editable variable named Target of type BP_Gate (Object Reference). When the player overlaps the Box Collision of the lever, call the Open event of the gate."
      - "Place a lever and a gate in the level. Select the lever, and in the Details panel use the eyedropper next to Target to pick the gate. Test it in PIE."
      - "Version B: create a Blueprint Interface named BPI_Activatable with a function named Activate. Implement it on BP_Gate and on a second Actor Blueprint that you make now, such as a lamp with a Point Light that switches on, or a platform that moves."
      - "Change the type of the lever's Target variable to Actor, and call Activate (Message) on it. Point one lever at the gate and another lever at the lamp."
      - "Leave the Target of one lever empty and press Play. Read the Accessed None error in the Message Log. Then add an Is Valid check before the call, so that an empty Target does not cause an error."
    done_when: "Send a screenshot of both lever graphs, and a short video clip (30 seconds or less) or two PIE screenshots that show one lever opening the gate and another lever switching the lamp."
    xp: 100
    verify_type: screenshot
    quiz:
      - q: "How does a lever with a direct reference know which gate to open?"
        choices: ["It searches the whole level on every frame until it finds the gate nearest to it", "An Instance Editable variable on the placed lever is set to that gate in Details", "Gates register themselves with every lever automatically on BeginPlay", "Through a list in the Project Settings"]
        answer_index: 1
        explain: "The eyedropper on an Instance Editable object reference links the two placed actors."
      - q: "What's the main benefit of a Blueprint Interface here?"
        choices: ["It's faster to render, because the lever and the gate are drawn together in one pass", "It removes collision between the lever and anything it activates", "The lever can activate any actor that implements it without knowing its class", "It works only in C++, so designers can't break it"]
        answer_index: 2
        explain: "Gates, lamps and platforms can each respond to Activate in their own way."
      - q: "You send an interface message to an actor that doesn't implement the interface. What happens?"
        choices: ["The editor crashes when the message is sent", "Nothing. The call is ignored without an error", "The Blueprint fails to compile until you fix it", "The actor is destroyed at the end of the frame"]
        answer_index: 1
        explain: "That's what makes messages safe for mixed targets. If nothing happens, check the target implements the interface."
      - q: "Your log says Accessed None trying to read Target. What's wrong?"
        choices: ["The reference variable is empty on that placed lever", "The material of the gate is missing or has not compiled", "Lumen is off in the Project Settings", "The Timeline of the gate is too long"]
        answer_index: 0
        explain: "Set it in Details, and guard the call with Is Valid so a missing link fails quietly."
      - q: "A lever needs to announce \"pulled\" to any number of listeners that bind to it. Which tool fits?"
        choices: ["A Cast", "A Construction Script", "A Level Streaming volume", "An Event Dispatcher"]
        answer_index: 3
        explain: "Dispatchers are one-to-many: listeners bind, the lever calls the dispatcher once."
    flavors:
      _default: {why: "Sooner or later one actor has to tell another to do something."}
      level_design: {why: "Levers, buttons and pressure plates wired to doors are the core of puzzle and gating work.", do: "Build one interface like BPI_Activatable and reuse it for every switch in your levels."}
      gameplay_design: {why: "Interfaces let you add new interactables without changing the ones you already have."}
      programming: {why: "Coupling and dependencies: the same tradeoffs you'll weigh in C++."}

  # ------------ Level Design side ------------
  - id: LDQ27
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [planning, pacing, beat-chart]
    required_spine: false
    required: true
    title: "Beat chart: three beats on one page"
    brief: "A beat is one part of a level that has its own job, such as a calm start, a moment of pressure, or a reward. A beat chart is a small table that describes each beat before you build anything. Planning on one page first saves hours of rebuilding later. In this quest you write a beat chart with three beats and sketch the route, all before you open the editor."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-designer-quick-start-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "level design beat chart pacing intro tension payoff"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-designer-quick-start-in-unreal-engine"
    checklist:
      - "Before you open the editor, make a table on one page with 3 rows: Intro, Tension and Payoff."
      - "Give the table these columns: location, player goal, what the player does (the mechanic), what they see first, the feeling you want, and intensity (from 1 to 5)."
      - "Mark where each Blueprint interaction will be placed. Plan at least two, for example a trigger that starts something, a door that opens, or a lever that opens a gate."
      - "Draw a simple top-down sketch of the route. A photo of a paper drawing or any drawing tool is fine."
      - "Read the page once more as if you had never seen the idea. Check that every beat has a goal and a mechanic, and that the intensity changes from beat to beat. Keep the page: when you build the level, you can compare the result with this plan."
    done_when: "Send a writeup with the beat chart (as a table or an image) and the top-down sketch."
    xp: 60
    verify_type: writeup
    quiz:
      - q: "In a beat chart, what is a beat?"
        choices: ["A music track that plays in one part of the level", "One section where the player's goal or feeling shifts", "A single mesh that is used many times in the level", "A frame of animation"]
        answer_index: 1
        explain: "Each beat has a job: teach, pressure, or reward."
      - q: "Why plan the beats on one page before building?"
        choices: ["Epic requires a beat chart before you can make a level", "Changing a line of text is cheaper than rebuilding a blockout", "It improves the frame rate of the finished level on slow machines", "It generates the level for you"]
        answer_index: 1
        explain: "One page forces you to decide what each space is for."
      - q: "Which is a good payoff beat?"
        choices: ["Another corridor that looks the same as the last three", "A loading screen that hides the next part of the level", "Opening the gate you've seen since the intro, onto a view or reward", "A dead end with no reward and nothing that explains why it is there"]
        answer_index: 2
        explain: "Payoff pays back the tension: something earned, seen or reached."
      - q: "Your intensity column reads 5, 5, 5. What's the problem?"
        choices: ["No contrast. Tension only works if there's a lower beat before it", "Nothing. A higher number is always better, so three fives is a strong chart", "The level is too short. It needs at least five beats", "The numbers must add up to 10"]
        answer_index: 0
        explain: "Pacing needs rises and rests. Flat intensity feels like noise."
      - q: "What does NOT belong in a beat chart row?"
        choices: ["The goal of the player in that beat", "The mechanic that the beat uses", "The feeling that the beat is meant to give", "Texture resolutions and material names"]
        answer_index: 3
        explain: "Beat charts cover player experience. Asset details go elsewhere."
    flavors:
      _default: {why: "Planning on one page first saves hours of rebuilding."}
      level_design: {why: "Beats are the difference between a level and a set of rooms.", do: "Write each beat's goal as one sentence the player would understand."}
      gameplay_design: {why: "Same tool, used for pacing a loop instead of a space."}
      cinematics: {why: "A beat chart works like a shot list for an interactive scene."}

  - id: LDQ28
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [metrics, documentation, character-movement]
    required_spine: false
    required: true
    title: "Metrics sheet you can share"
    brief: "Metrics are the numbers that describe what the player character can do, such as how high it jumps and how steep a slope it can walk. A metrics sheet is a shared document that lists these numbers together with the sizes of doors, corridors and stairs that fit them. When everyone builds from the same sheet, spaces fit the first time. In this quest you read the character settings, measure the real limits in a test level, and write them in a sheet that you can share."
    time_min: 50
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/movement-components-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 level design metrics gym jump height character movement"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-a-character-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-01-project-setup-and-level-blockout-in-unreal-engine"
    checklist:
      - "Open a project made from the Third Person template, or create one. Open the character Blueprint BP_ThirdPersonCharacter. From the Capsule and Character Movement components, write down the capsule radius and half-height, Max Walk Speed, Jump Z Velocity, Max Step Height and Walkable Floor Angle."
      - "Build a small metrics gym, which is a test level for measuring the character. Create a new level named L_MetricsGym and build it from cubes: ledges every 25 cm up to 250 cm, gaps every 50 cm, and ramps at 30°, 45° and 50°. If you already have a level like this, you can use it."
      - "Start PIE and record the real numbers: the highest ledge you can jump onto, the widest gap you can jump over, and the steepest ramp you can walk up."
      - "Add rules for spaces: door width and height, corridor width (for 1 player and for 2 players), cover height, and stair step size."
      - "Put everything in a sheet, such as a spreadsheet or a document. Write the engine version at the top. Paste the sheet as text into your proof, or take a screenshot of it."
    done_when: "Send your metrics sheet as text or as a screenshot, and a screenshot of your metrics gym."
    xp: 60
    verify_type: writeup
    quiz:
      - q: "Where do you read Max Walk Speed and Jump Z Velocity?"
        choices: ["World Settings, under the Game Mode section of the level you are testing", "The Character Movement component on your character Blueprint", "Project Settings, then Input, next to the jump key", "The GameState"]
        answer_index: 1
        explain: "Character Movement holds walking, jumping and falling settings."
      - q: "The default Third Person capsule has a half-height of 96. How tall is the capsule?"
        choices: ["96 cm", "48 cm", "192 cm", "960 cm"]
        answer_index: 2
        explain: "Half-height is measured from the center, so double it. Check your own template's values."
      - q: "What does Max Step Height control?"
        choices: ["The tallest ledge the character walks up without jumping", "The highest point the character can reach with one jump", "The height of the camera above the floor", "The size of each step on a stair mesh"]
        answer_index: 0
        explain: "Anything taller needs a jump. Size stairs and curbs with this in mind."
      - q: "Why measure jump distance in a metrics gym instead of calculating it?"
        choices: ["Math is banned in level design, so every number in the sheet has to come from a test in the editor", "Air control, gravity and friction all affect it, so testing gives the number players actually get", "The gym is required before the project can be packaged", "It's faster to render than a full level"]
        answer_index: 1
        explain: "Test in PIE and record what works, then leave some margin."
      - q: "Why make the sheet shareable?"
