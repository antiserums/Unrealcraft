# Unrealcraft — Level Design, Rank 2 ("Adept": can make a thing play)
# Rank 2 has two tracks: materials and blueprint. Level Design fully requires only the blueprint side
# (Blueprint-in-levels). The shared BP quests (R2-BP-*) also count for gameplay_design and programming.
# URL prefix: https://dev.epicgames.com/documentation/en-us/unreal-engine/
# Verified slugs only (see VERIFIED_URLS.md). Backup videos are TODO_URL until a human picks a dated UE5+ video.
# Work in UC_Sandbox. Suggested level for this rank: L_Beats_01 in /Content/UC/Maps.

quests:
  # ------------ Shared blueprint track (level_design, gameplay_design, programming) ------------
  - id: GDQ1
    rank: 2
    difficulty: adept
    specializations: [level_design, gameplay_design, programming]
    subjects: [blueprint, components, construction-script, variables]
    required_spine: false
    required: true
    title: "Actor Blueprint anatomy"
    brief: "An Actor Blueprint is a reusable object that you build once and can place in a level many times. It is made of components (its parts, such as a mesh and a light), variables (values you can change), and two graphs. The Construction Script runs in the editor each time you change the actor, and the Event Graph runs while the game is playing. In this quest you build a lamp Blueprint and give every copy in the level its own color and height."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-class-assets-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 actor blueprint components construction script instance editable variables"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-variables-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/events-in-unreal-engine"
    checklist:
      - "Create an Actor Blueprint named BP_Lamp in the folder /Content/UC/Blueprints. Add a Static Mesh component and a Point Light component under the root component."
      - "Add a variable of type Linear Color named LightColor and a variable of type Float named Height. Tick Instance Editable (the eye icon) on both, so that you can change them on each copy in the level."
      - "Open the Construction Script. Set the color of the light from LightColor, and set the relative Z location of the mesh from Height."
      - "Place 3 copies of the lamp in the level. Give each one a different color and height in the Details panel, and watch them update without pressing Play."
      - "Open the Event Graph. On the BeginPlay event, use a Print String node to print the name of the lamp, so that you can see the part that runs during the game."
    done_when: "Send a screenshot of the 3 placed lamps with different values, and a screenshot of the Construction Script graph."
    xp: 80
    verify_type: screenshot
    quiz:
      - q: "When does the Construction Script run?"
        choices: ["Only every frame during play", "In the editor when the actor is placed, moved or edited, and again when it spawns", "Only when you compile C++", "Only on BeginPlay"]
        answer_index: 1
        explain: "That's why it's good for previewing setup in the editor. Gameplay logic goes in the Event Graph."
      - q: "What does ticking Instance Editable on a variable do?"
        choices: ["Makes it replicate", "Lets you set a different value on each placed copy in the Details panel", "Makes it read-only", "Saves it to disk"]
        answer_index: 1
        explain: "Each instance in the level can then override the Blueprint's default."
      - q: "You want a door's open width to show in the editor before you press Play. Where does that logic go?"
        choices: ["Event Tick", "A Level Blueprint", "The Construction Script", "Project Settings"]
        answer_index: 2
        explain: "The Construction Script reruns on edit, so the preview updates as you change values."
      - q: "What is the root component?"
        choices: ["The component at the top of the hierarchy; the other components are positioned relative to it", "Whatever component was added last", "The Event Graph", "A hidden debug mesh"]
        answer_index: 0
        explain: "Moving the root moves everything attached to it."
      - q: "You change a variable's default in the Blueprint. Which placed copies update?"
        choices: ["None until you restart", "Only the first one", "All of them, including ones you already overrode", "The ones that haven't overridden that value in Details"]
        answer_index: 3
        explain: "An overridden instance value wins over the class default. The reset arrow in Details clears the override."
    flavors:
      _default: {why: "Most things you build later start as an Actor Blueprint like this one."}
      level_design: {why: "Instance Editable variables let you drop 10 copies and tune each one without editing the graph.", do: "Expose the numbers you'd want to tweak per placement, like height, color and delay."}
      gameplay_design: {why: "Exposed variables are your tuning knobs. Designers tweak them without touching the graph."}
      programming: {why: "Later a C++ UPROPERTY will show up in Details the same way these variables do."}

  - id: GDQ2
    rank: 2
    difficulty: adept
    specializations: [level_design, gameplay_design, programming]
    subjects: [blueprint, collision, overlap, triggers]
    required_spine: false
    required: true
    title: "Trigger volumes and overlap events"
    brief: "An overlap happens when one object enters the space of another without being blocked by it. A trigger is an invisible shape that fires an event when something overlaps it, and this is how the world notices the player. Anything can overlap a trigger, so you must check who entered. In this quest you build a trigger zone that reacts only to the player, and you also try the same idea in the Level Blueprint."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/trigger-volume-actors-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 trigger box overlap event cast to character only player"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/collision-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/events-in-unreal-engine"
    checklist:
      - "Create an Actor Blueprint named BP_TriggerZone with a Box Collision component as its root. Add a Vector variable named BoxSize, give it a default value such as 200, 200, 100, and turn on Instance Editable. In the Construction Script, call Set Box Extent on the Box Collision and connect BoxSize to it. Now you can change the size of the box on each copy in the level from the Details panel."
      - "Add the On Component Begin Overlap event. Compare Other Actor with Get Player Pawn and connect the result to a Branch node, so that only the player continues."
      - "Add the On Component End Overlap event with the same filter. After the filter, add a Print String node with the text \"left zone\"."
      - "Push a physics cube (a cube with Simulate Physics turned on) into the zone. Confirm that nothing fires."
      - "Also place a Trigger Box from the editor in the level, and handle its overlap once in the Level Blueprint. This way you have seen both ways to do it."
    done_when: "Send a screenshot of the overlap graph with the filter, and a PIE screenshot that shows the print only fired for the player."
    xp: 80
    verify_type: screenshot
    quiz:
      - q: "Your trigger fires when a physics cube rolls in. How do you make it player-only?"
        choices: ["Delete the cube", "Check that Other Actor equals Get Player Pawn (or Cast To your character) before continuing", "Turn off collision on the trigger", "Use Event Tick instead"]
        answer_index: 1
        explain: "Filter on Other Actor. Anything can overlap a box."
      - q: "What has to be true for Begin Overlap to fire between the trigger and the player's capsule?"
        choices: ["Both have Generate Overlap Events on, and the trigger is set to Overlap the player's object type (neither ignores the other)", "Both must Block each other", "The trigger must be visible in game", "The player must be jumping"]
        answer_index: 0
        explain: "If either side ignores the other's channel, or has overlap events off, no event fires. Both blocking gives a hit, not an overlap."
      - q: "Which event would you use to close a door after the player walks away?"
        choices: ["Event BeginPlay", "On Component Hit", "On Component End Overlap", "Construction Script"]
        answer_index: 2
        explain: "End Overlap fires when the overlapping actor leaves the collision."
      - q: "Why build the trigger into a Blueprint instead of using a Trigger Box plus the Level Blueprint?"
        choices: ["Trigger Boxes don't work in UE5", "The Level Blueprint is C++ only", "It renders faster", "The logic travels with the actor, so every copy you place already works"]
        answer_index: 3
        explain: "Level Blueprint logic is stuck in one level. A Blueprint actor is reusable."
      - q: "Where can you quickly handle a placed Trigger Box's overlap without making a new Blueprint?"
        choices: ["The Level Blueprint, with the Trigger Box selected", "World Settings", "The Material Editor", "The Content Drawer"]
        answer_index: 0
        explain: "Select it in the level, open the Level Blueprint, right-click and add its overlap event. Fine for one-offs."
    flavors:
      _default: {why: "Overlaps are how the world notices the player."}
      level_design: {why: "Almost every scripted moment in a level starts with a trigger.", do: "Size the trigger to where the player actually walks, not to the whole room."}
      gameplay_design: {why: "Zones, pickups and hazards are all overlaps with a filter."}
      programming: {why: "The same collision rules apply in C++. Learn the settings here where they're easy to see."}

  - id: GDQ3
    rank: 2
    difficulty: adept
    specializations: [level_design, gameplay_design, programming]
    subjects: [blueprint, timelines, animation-curves]
    required_spine: false
    required: true
    title: "Timelines: a door that moves smoothly"
    brief: "A Timeline is a Blueprint node that changes a value smoothly over a set time, following a curve that you draw. It is the quickest way to make things move smoothly, such as a door that swings open. A Lerp node mixes two values, so a Timeline that goes from 0 to 1 can move the door from closed to open. In this quest you build a door that opens when the player comes near and closes again when the player leaves."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/timelines-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 timeline door open lerp rotator play reverse"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/opening-doors-in-unreal-engine"
    checklist:
      - "Open BP_Door (from quest SQ9, or make a new one). Add a Timeline named TL_Open with one float track that goes from 0 to 1 over 1.0 s. Ease the curve: right-click the keys and choose Auto."
      - "Connect the output of the track to a Lerp (Rotator) or Lerp (Vector) node. Connect the result of the Lerp to Set Relative Rotation or Set Relative Location on the door mesh."
      - "Use the filtered overlap events from quest GDQ2. Connect Begin Overlap to the Play input of the Timeline, and End Overlap to the Reverse input."
      - "Make the variable OpenAngle (or OpenOffset) Instance Editable, so that each door can open in a different way."
      - "Start PIE. Step into the trigger and out again when the door is halfway through its motion. The door should reverse from where it is and not snap."
    done_when: "Send two or three screenshots from PIE, or a short GIF, that show the door opening and reversing halfway. Also send a screenshot of the Timeline curve and the graph."
    xp: 80
    verify_type: screenshot
    quiz:
      - q: "Why use a Timeline for a door instead of Event Tick?"
        choices: ["Tick can't move actors", "A Timeline plays a curve over a set time, can reverse, and only runs while it's playing", "Timelines run on the GPU", "Tick is removed in UE5"]
        answer_index: 1
        explain: "You get easing, Play/Reverse and no per-frame cost when the door is idle."
      - q: "The player steps out while the door is half open. Which input gives a smooth close?"
        choices: ["Play from Start", "Stop", "Set New Time to 0", "Reverse"]
        answer_index: 3
        explain: "Reverse runs back from the current position. Play from Start or Set New Time would snap."
      - q: "Your float track goes 0 to 1. How do you turn that into door movement?"
        choices: ["Use it as the Alpha of a Lerp between closed and open, then set the relative rotation or location", "Plug it straight into Destroy Actor", "Multiply it by Delta Seconds", "Connect it to Print String"]
        answer_index: 0
        explain: "A 0–1 track as a Lerp alpha is the reusable pattern. Change the end values, keep the curve."
      - q: "You try to add a Timeline inside a Blueprint function and can't. Why?"
        choices: ["A plugin is missing", "Functions are C++ only", "Timelines run over time, so they only live in the Event Graph", "You need a Level Blueprint"]
        answer_index: 2
        explain: "Functions must finish in one call. Put the Timeline in the Event Graph and call it with a custom event."
      - q: "Designers say the door is too slow. What's the cleanest fix?"
        choices: ["Add a Delay", "Shorten the Timeline length, or use Set Play Rate from an exposed variable", "Scale the mesh", "Run it on Tick"]
        answer_index: 1
        explain: "Play Rate from an Instance Editable variable lets each door have its own speed."
    flavors:
      _default: {why: "Timelines are the quickest way to make things move smoothly in Blueprint."}
      level_design: {why: "Doors, lifts and bridges that ease in and out feel intentional. Snapping looks broken.", do: "Expose speed and distance so you can tune each door during a playtest."}
      gameplay_design: {why: "The curve controls the feel. Ease-in and ease-out matter as much as timing."}
      animation: {why: "Same idea as a curve in Sequencer, driven by gameplay instead."}

  - id: GDQ4
    rank: 2
    difficulty: adept
    specializations: [level_design, gameplay_design, programming]
    subjects: [blueprint, communication, interfaces, references]
    required_spine: false
    required: true
    title: "Actors talking: direct references vs Blueprint Interfaces"
    brief: "Sooner or later one actor has to tell another actor to do something, for example a lever that opens a gate. One way is a direct reference: the lever stores a link to one exact type of actor. Another way is a Blueprint Interface, a list of function names that many different Blueprints can share, so the lever can send the same message to a gate, a lamp or a platform. In this quest you build the lever both ways and see what happens when the link is missing."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-communication-usage-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 blueprint interface lever opens gate direct reference vs interface"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/blueprint-interface-in-unreal-engine"
    checklist:
      - "Version A: in BP_Lever, add an Instance Editable variable named Target of type BP_Gate (Object Reference). When the player interacts with the lever, call the Open event of the gate."
      - "Place a lever and a gate in the level. Select the lever, and in the Details panel use the eyedropper next to Target to pick the gate. Test it in PIE."
      - "Version B: create a Blueprint Interface named BPI_Activatable with a function named Activate. Implement it on BP_Gate and on a second actor, such as a lamp or a platform."
      - "Change the type of the lever's Target variable to Actor, and call Activate (Message) on it. Point one lever at the gate and another lever at the lamp."
      - "Leave the Target of one lever empty and press Play. Read the Accessed None error in the Message Log. Then add an Is Valid check before the call, so that an empty Target does not cause an error."
    done_when: "Send a screenshot of both lever graphs, and two PIE screenshots or a short GIF that show one lever opening the gate and another lever switching the lamp."
    xp: 100
    verify_type: screenshot
    quiz:
      - q: "How does a lever with a direct reference know which gate to open?"
        choices: ["It searches the whole level every frame", "An Instance Editable variable on the placed lever is set to that gate in Details", "Gates register themselves automatically", "Through Project Settings"]
        answer_index: 1
        explain: "The eyedropper on an Instance Editable object reference links the two placed actors."
      - q: "What's the main benefit of a Blueprint Interface here?"
        choices: ["It's faster to render", "It removes collision", "The lever can activate any actor that implements it without knowing its class", "It works only in C++"]
        answer_index: 2
        explain: "Gates, lamps and platforms can each respond to Activate in their own way."
      - q: "You send an interface message to an actor that doesn't implement the interface. What happens?"
        choices: ["The editor crashes", "Nothing. The call is ignored without an error", "It fails to compile", "The actor is destroyed"]
        answer_index: 1
        explain: "That's what makes messages safe for mixed targets. If nothing happens, check the target implements the interface."
      - q: "Your log says Accessed None trying to read Target. What's wrong?"
        choices: ["The reference variable is empty on that placed lever", "The gate's material is missing", "Lumen is off", "The Timeline is too long"]
        answer_index: 0
        explain: "Set it in Details, and guard the call with Is Valid so a missing link fails quietly."
      - q: "A lever needs to announce \"pulled\" to any number of listeners that bind to it. Which tool fits?"
        choices: ["A Cast", "A Construction Script", "A Level Streaming volume", "An Event Dispatcher"]
        answer_index: 3
        explain: "Dispatchers are one-to-many: listeners bind, the lever calls the dispatcher once."
    flavors:
      _default: {why: "Sooner or later one actor has to tell another to do something."}
      level_design: {why: "Levers, buttons and pressure plates wired to doors are the core of puzzle and gating work.", do: "Build one interface like BPI_Activatable and reuse it for every switch in your levels."}
      gameplay_design: {why: "Interfaces let you add new interactables without changing the ones you already have."}
      programming: {why: "Coupling and dependencies: the same tradeoffs you'll weigh in C++."}

  # ------------ Level Design side ------------
  - id: LDQ27
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [planning, pacing, beat-chart]
    required_spine: false
    required: true
    title: "Beat chart: three beats on one page"
    brief: "A beat is one part of a level that has its own job, such as a calm start, a moment of pressure, or a reward. A beat chart is a small table that describes each beat before you build anything. Planning on one page first saves hours of rebuilding later. In this quest you write a beat chart with three beats, sketch the route, and post both before you open the editor."
    time_min: 40
    official_url: TODO_URL
    backup_url: TODO_URL
    backup_search: "level design beat chart pacing intro tension payoff"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-designer-quick-start-in-unreal-engine"
    checklist:
      - "Before you open the editor, make a table on one page with 3 rows: Intro, Tension and Payoff."
      - "Give the table these columns: location, player goal, what the player does (the mechanic), what they see first, the feeling you want, and intensity (from 1 to 5)."
      - "Mark where each Blueprint interaction from quests GDQ2 to GDQ4 will be placed."
      - "Draw a simple top-down sketch of the route. A photo of a paper drawing or any drawing tool is fine."
      - "Post it in the thread where you send your work before you build. You will compare it with the finished level in quest LDQ32."
    done_when: "Send a writeup with the beat chart (as a table or an image) and the top-down sketch."
    xp: 60
    verify_type: writeup
    quiz:
      - q: "In a beat chart, what is a beat?"
        choices: ["A music track", "One section where the player's goal or feeling shifts", "A single mesh", "A frame of animation"]
        answer_index: 1
        explain: "Each beat has a job: teach, pressure, or reward."
      - q: "Why plan the beats on one page before building?"
        choices: ["Epic requires it", "Changing a line of text is cheaper than rebuilding a blockout", "It improves frame rate", "It generates the level"]
        answer_index: 1
        explain: "One page forces you to decide what each space is for."
      - q: "Which is a good payoff beat?"
        choices: ["Another identical corridor", "A loading screen", "Opening the gate you've seen since the intro, onto a view or reward", "An unexplained dead end"]
        answer_index: 2
        explain: "Payoff pays back the tension: something earned, seen or reached."
      - q: "Your intensity column reads 5, 5, 5. What's the problem?"
        choices: ["No contrast. Tension only works if there's a lower beat before it", "Nothing, higher is better", "The level is too short", "The numbers must add up to 10"]
        answer_index: 0
        explain: "Pacing needs rises and rests. Flat intensity feels like noise."
      - q: "What does NOT belong in a beat chart row?"
        choices: ["The player's goal", "The mechanic used", "The intended feeling", "Texture resolutions and material names"]
        answer_index: 3
        explain: "Beat charts cover player experience. Asset details go elsewhere."
    flavors:
      _default: {why: "Planning on one page first saves hours of rebuilding."}
      level_design: {why: "Beats are the difference between a level and a set of rooms.", do: "Write each beat's goal as one sentence the player would understand."}
      gameplay_design: {why: "Same tool, used for pacing a loop instead of a space."}
      cinematics: {why: "A beat chart works like a shot list for an interactive scene."}

  - id: LDQ28
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [metrics, documentation, character-movement]
    required_spine: false
    required: true
    title: "Metrics sheet you can share"
    brief: "Metrics are the numbers that describe what the player character can do, such as how high it jumps and how steep a slope it can walk. A metrics sheet is a shared document that lists these numbers together with the sizes of doors, corridors and stairs that fit them. When everyone builds from the same sheet, spaces fit the first time. In this quest you read the character settings, measure the real limits in a test level, and write them in a sheet that you can share."
    time_min: 50
    official_url: TODO_URL
    backup_url: TODO_URL
    backup_search: "unreal engine 5 level design metrics gym jump height character movement"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/setting-up-a-character-in-unreal-engine"
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-01-project-setup-and-level-blockout-in-unreal-engine"
    checklist:
      - "Open your character Blueprint. From the Capsule and Character Movement components, write down the capsule radius and half-height, Max Walk Speed, Jump Z Velocity, Max Step Height and Walkable Floor Angle."
      - "Use the metrics gym level L_MetricsGym from quest LDQ11, or build a small gym in a new level with that name. It needs ledges every 25 cm up to 250 cm, gaps every 50 cm, and ramps at 30°, 45° and 50°."
      - "Start PIE and record the real numbers: the highest ledge you can jump onto, the widest gap you can jump over, and the steepest ramp you can walk up."
      - "Add rules for spaces: door width and height, corridor width (for 1 player and for 2 players), cover height, and stair step size."
      - "Put everything in a sheet that you can share, such as a spreadsheet or a document. Write the engine version at the top and share the link."
    done_when: "Send the link to your metrics sheet, and a screenshot of your metrics gym."
    xp: 60
    verify_type: writeup
    quiz:
      - q: "Where do you read Max Walk Speed and Jump Z Velocity?"
        choices: ["World Settings", "The Character Movement component on your character Blueprint", "Project Settings → Input", "The GameState"]
        answer_index: 1
        explain: "Character Movement holds walking, jumping and falling settings."
      - q: "The default Third Person capsule has a half-height of 96. How tall is the capsule?"
        choices: ["96 cm", "48 cm", "192 cm", "960 cm"]
        answer_index: 2
        explain: "Half-height is measured from the center, so double it. Check your own template's values."
      - q: "What does Max Step Height control?"
        choices: ["The tallest ledge the character walks up without jumping", "Maximum jump height", "Camera height", "Stair mesh size"]
        answer_index: 0
        explain: "Anything taller needs a jump. Size stairs and curbs with this in mind."
      - q: "Why measure jump distance in a metrics gym instead of calculating it?"
        choices: ["Math is banned", "Air control, gravity and friction all affect it, so testing gives the number players actually get", "The gym is required to package", "It's faster to render"]
        answer_index: 1
        explain: "Test in PIE and record what works, then leave some margin."
      - q: "Why make the sheet shareable?"
        choices: ["For XP only", "It must be in C++", "So you don't need to test", "So everyone building for the character uses the same numbers and kit pieces fit"]
        answer_index: 3
        explain: "A metrics sheet is a team document. It becomes part of your Rank 4 kit handoff."
    flavors:
      _default: {why: "If you know the character's numbers, you build spaces that fit the first time."}
      level_design: {why: "Metrics are your contract with the character. Every gap and ledge depends on them.", do: "Put margins in the sheet (for example, gaps 50 cm under max jump), not just the limits."}
      gameplay_design: {why: "If you change jump or speed, every level's metrics change too. This sheet shows the cost."}
      animation: {why: "Step height and ledge heights set which traversal animations you'll need."}

  - id: LDQ29
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [gating, pickups, doors, blueprint]
    required_spine: false
    required: true
    title: "Lock and key"
    brief: "Lock and key is a simple design pattern: the player finds a locked door, then finds a key, then comes back and opens the door. It is the simplest way to make the player visit places in a set order. A soft lock is a situation where the player can no longer finish the level, for example because the key is out of reach. In this quest you build a key and a locked door in Blueprint, place them well, and test for soft locks."
    time_min: 60
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-02-create-a-key-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 key pickup locked door blueprint level design gating"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-03-open-doors-with-keys-in-unreal-engine"
    checklist:
      - "Make BP_Key from a mesh and a sphere trigger that uses the player filter from quest GDQ2. When the player picks it up, set a boolean (true or false) variable named HasKey on the player. To reach the player, use Cast to your character or an interface. Then call Destroy Actor."
      - "Make BP_LockedDoor. When the player overlaps it, check HasKey. If it is true, play the Timeline from quest GDQ3. If it is false, show feedback, such as a Print String, a red light, or a sound."
      - "Place the door so that the player sees it locked BEFORE they find the key."
      - "Put the key in a place where getting it is a small detour. It should not be a search for a hidden object."
      - "Test for soft locks. Can the key fall out of reach? Can the player get stuck behind the door?"
    done_when: "Send three screenshots from PIE that show the locked feedback, the key pickup and the door opening, and a screenshot of the door's graph. A short GIF of less than 30 seconds also works in place of the three screenshots."
    xp: 100
    verify_type: screenshot
    quiz:
      - q: "Why should the player see the locked door before finding the key?"
        choices: ["It loads faster", "The key then has a known purpose and the player knows where to go back to", "Keys can't spawn before doors", "It's required for NavMesh"]
        answer_index: 1
        explain: "Show the lock first, then the key. Picking up the key then means something."
      - q: "The player walks into the locked door and nothing happens. What's missing?"
        choices: ["Locked feedback, so the player knows it's a lock and not a bug", "A second key", "More lights everywhere", "A Level Streaming volume"]
        answer_index: 0
        explain: "A message, a sound or a red light tells them it's locked."
      - q: "What is a soft lock?"
        choices: ["A door with no collision", "A save file", "A state where the player can't progress without restarting", "A key with a timer"]
        answer_index: 2
        explain: "A key stuck behind a closed door or knocked off a ledge are classic soft locks."
      - q: "Where should the door check for the key?"
        choices: ["On Event Tick, every frame", "In the Construction Script", "In World Settings", "When the player overlaps the door, by reading the player's HasKey"]
        answer_index: 3
        explain: "Check on interaction. Nothing needs to run until the player arrives."
      - q: "Which earlier quests does this build on?"
        choices: ["Only SQ1", "GDQ2 for filtered pickups and GDQ3 or GDQ4 for opening the door", "None", "The Programming capstone"]
        answer_index: 1
        explain: "Lock and key combines filtered triggers, a Timeline door and actor communication."
    flavors:
      _default: {why: "Lock and key is the simplest way to make the player take a route in a set order."}
      level_design: {why: "Gating is how you control the order players see your spaces in.", do: "Mark the lock and the key on your beat chart so tension builds between them."}
      gameplay_design: {why: "A key is the smallest possible progression system."}

  - id: LDQ30
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [navigation, navmesh, ai]
    required_spine: false
    required: true
    title: "NavMesh walk test"
    brief: "A NavMesh, short for navigation mesh, is a map of the floor areas where AI characters can walk. Unreal builds it for you inside a Nav Mesh Bounds Volume. If the NavMesh has gaps, AI characters cannot cross them, and it is better to find this out now than later during a fight. In this quest you show the NavMesh on your route, send a simple AI walker along it, and fix one gap."
    time_min: 45
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/basic-navigation-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 nav mesh bounds volume ai move to beginner"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/navigation-system-in-unreal-engine"
    checklist:
      - "Place a Nav Mesh Bounds Volume in the level and scale it until it covers your whole route."
      - "Press P in the viewport to show the navigation. Walkable areas turn green. Note the gaps at doors, stairs and ledges."
      - "Create a Character Blueprint named BP_Walker and place it in the level. On BeginPlay, use an AI MoveTo node to send it to a Target Point at the end of your route. Add a Print String to both On Success and On Fail."
      - "Start PIE and watch it walk. Fix one spot where the green area breaks: widen a door, lower a step, or add a ramp."
      - "If your doors move, open Project Settings, go to Navigation Mesh, and set Runtime Generation to Dynamic. Then test the walker again with a door closed."
    done_when: "Send a screenshot of your route with the navigation shown (P), and a note that says which gap you fixed."
    xp: 80
    verify_type: screenshot
    quiz:
      - q: "Which key toggles the navigation display in the viewport?"
        choices: ["N", "F8", "P", "G"]
        answer_index: 2
        explain: "P shows the NavMesh. Green means AI can walk there."
      - q: "Why is there a gap in the green along every wall?"
        choices: ["The navmesh is pulled in by the agent radius so AI doesn't clip into walls", "A bug", "Lumen blocks it", "Walls are too dark"]
        answer_index: 0
        explain: "Tight doorways can close up completely. That's a metrics issue."
      - q: "AI MoveTo goes straight to On Fail. What do you check first?"
        choices: ["The material", "Whether the pawn and the destination are both on the green navmesh", "Post process settings", "The HUD"]
        answer_index: 1
        explain: "No path, no move. Also check the pawn is possessed by an AI Controller (placed Characters are by default)."
      - q: "A closed door should block AI, and opening it should let them through. What's needed?"
        choices: ["Nothing, the navmesh never changes", "Delete the navmesh", "A Level Blueprint", "Runtime Generation set to Dynamic so the navmesh rebuilds around moving obstacles"]
        answer_index: 3
        explain: "By default the navmesh is static and built in the editor."
      - q: "Why does a level designer do this at Rank 2?"
        choices: ["To learn C++", "To build a boss", "To check the route works for AI before Rank 3 encounters", "It's needed for lighting"]
        answer_index: 2
        explain: "Encounter spaces at Rank 3 need AI that can actually get to the player."
    flavors:
      _default: {why: "If AI can't walk your level, you find out now instead of during an encounter."}
      level_design: {why: "The navmesh shows you whether AI can actually use your layout.", do: "Keep P on while you adjust doorways and stairs."}
      gameplay_design: {why: "Enemy behaviour depends on AI being able to reach the player."}
      programming: {why: "The navmesh is the data your AI code will query."}

  - id: LDQ31
    needs_others: true          # hidden and not required until the server has enough members
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [playtesting, observation, feedback]
    required_spine: false
    required: true
    title: "Run one peer playtest"
    brief: "A playtest is when another person plays your level while you watch. You cannot test your own level well, because you already know where everything is. The most useful thing you can do during a playtest is to stay silent and write down what happens. In this quest you run one playtest with a peer, take notes, and list the three biggest problems in order."
    time_min: 45
    official_url: TODO_URL
    backup_url: TODO_URL
    backup_search: "how to run a playtest silent observation level design notes"
    checklist:
      - "Find one peer, for example with a post in #playtest or in a voice channel. Give them your level: share your screen while you run PIE, or send a zip file."
      - "Tell them only what a real player would know: the controls and the goal. Say nothing about the route."
      - "Watch silently. Use a notes template with these fields: time, where, what they did, what they said, and hesitations or backtracks (moments when they stop or go back)."
      - "If they ask for help, answer \"What would you try?\" and note the question."
      - "After they finish, ask 3 open questions: What were you trying to do? Where did you get stuck? What stood out?"
      - "Write your top 3 issues. Rank them by how often they happened and how much they blocked progress."
    done_when: "Send a writeup with your filled notes template and your ranked top 3 issues."
    xp: 60
    verify_type: writeup
    quiz:
      - q: "Your tester stops and asks \"Where do I go?\" What do you say?"
        choices: ["Point at the exit", "\"What would you try?\" Then write down where they got lost.", "Take their mouse", "End the test"]
        answer_index: 1
        explain: "Every explanation you give is a problem you won't see. Record the question."
      - q: "What goes in playtest notes?"
        choices: ["What the player did, where, and when, plus their exact words", "Your fixes only", "Your opinion of the tester", "Nothing, just remember it"]
        answer_index: 0
        explain: "Record what you observed first. Decide fixes afterward."
      - q: "What do you tell the tester before they start?"
        choices: ["The full route", "Where the key is", "Controls and the goal, like a real player would get", "Which parts are unfinished and why"]
        answer_index: 2
        explain: "Pre-explaining hides the problems you're testing for."
      - q: "Which follow-up question is best?"
        choices: ["\"Did you like it?\"", "\"Wasn't the gate cool?\"", "\"Would you buy this?\"", "\"What were you trying to do when you turned back?\""]
        answer_index: 3
        explain: "Open, specific questions get you useful answers. Leading questions get polite ones."
      - q: "The tester misses the lever and you think it's obvious. Next step?"
        choices: ["Assume they're wrong", "Treat it as a readability issue and try light, framing or a landmark", "Remove the lever", "Add a tutorial popup first"]
        answer_index: 1
        explain: "Fix the space first. Text prompts are a last resort."
    flavors:
      _default: {why: "You can't playtest your own level. You already know where everything is."}
      level_design: {why: "Watching one stranger play teaches more than an hour of reviewing it yourself.", do: "Mark every hesitation on your top-down sketch. Clusters show you what to fix."}
      gameplay_design: {why: "Same protocol for testing a loop. Watch what players do, not what they say."}

  - id: LDQ32
    rank: 2
    difficulty: adept
    specializations: [level_design]
    subjects: [capstone, beats, blueprint, playtesting, metrics]
    required_spine: false
    required: true
    capstone: true
    title: "CAPSTONE: Beats & playtest"
    brief: "This quest brings together the earlier quests of this group: the beat chart, the metrics sheet, the Blueprint interactions and the peer playtest. Level design works in a loop: you plan the level, build it, test it with another person, and then change it. In this quest you build one small level with three beats, run a playtest, and change at least one thing because of what you saw."
    time_min: 120
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/level-designer-quick-start-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 level design blockout pacing playtest iteration"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/playing-and-simulating-in-unreal-engine"
    checklist:
      - "Build a level named L_Beats_01 from your beat chart from quest LDQ27. It needs an intro, a tension beat and a payoff, each in its own space."
      - "Include at least 2 different Blueprint interactions. For example, use lock and key (from quest LDQ29) and a lever and gate that use an interface (from quest GDQ4)."
      - "Build to your metrics sheet from quest LDQ28. Every gap, ledge and door should match a number on it."
      - text: "Run one peer playtest. Follow the same steps as in quest LDQ31."
        needs_others: true
      - text: "Change at least one thing based on the playtest. Then update the beat chart so that it matches what you built."
        needs_others: true
    done_when: "Send a writeup with a PIE clip of 60 s or less that goes through all 3 beats, the final beat chart, a link to the metrics sheet, your playtest notes, and 2 to 3 lines on what you changed and why. A peer or a mentor must approve it."
    done_when_solo: "Writeup with: a PIE clip (60 s or less) through all 3 beats; the final beat chart; a link to the metrics sheet; and 2–3 lines on what you would test with a player. Approved by a mentor."
    xp: 200
    verify_type: writeup
    quiz:
      - q: "What counts as 2 Blueprint interacts for this capstone?"
        choices: ["Two copies of the same door", "Two different interactions, like a key-locked door and a lever-driven gate", "Two Print Strings", "One door opened twice"]
        answer_index: 1
        explain: "They must be different mechanics, each doing a job in a beat."
      - q: "Your playtester got lost in the tension beat. What does the turn-in need?"
        choices: ["Nothing, playtests are optional", "A new level", "The notes, what you changed in response, and an updated beat chart", "A longer clip"]
        answer_index: 2
        explain: "The capstone is about iterating. Show the change and why you made it."
      - q: "How long can the PIE clip be?"
        choices: ["60 s or less", "5 minutes", "Any length", "10 s exactly"]
        answer_index: 0
        explain: "Short clips get reviewed. If your level takes longer, cut between beats."
      - q: "A reviewer spots a gap the character can't clear. Which document should have prevented it?"
        choices: ["The beat chart", "The playtest notes", "The engine release notes", "The metrics sheet"]
        answer_index: 3
        explain: "Gaps and ledges come from your measured metrics, with margin."
      - q: "Who approves this capstone?"
        choices: ["The Quartermaster automatically", "A peer or mentor, after the quiz", "Nobody", "Epic Games"]
        answer_index: 1
        explain: "Rank 2 verification is quiz plus artifact, approved by a person."
    flavors:
      _default: {why: "Plan it, build it, test it with someone else, change it. That's how level design works."}
      level_design: {why: "The first time you plan, build, test and revise a whole level yourself.", do: "Keep the before/after of your playtest change. It's the best part of the turn-in."}
      gameplay_design: {why: "The same loop you'll run on your Rank 2 core loop capstone."}

  # ------------ Level Design electives (Rank 2) ------------
  - id: LDQ21
    rank: 2
    difficulty: adept
    specializations: [gameplay_design, level_design, programming]
    subjects: [blueprint, platforms, timelines]
    required: false
    title: "Moving platforms"
    brief: "A moving platform is a floor piece that travels between two points, and the player can ride on it. It is a common part of platform games and a good use of a Timeline, the Blueprint node that changes a value smoothly over time. In this quest you build a platform that moves back and forth without stopping, and you test that the player stays on it."
    time_min: 30
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-06-puzzles-moving-platforms-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 moving platform blueprint timeline loop"
    checklist: ["Build an Actor Blueprint named BP_Platform with a Static Mesh for the floor piece. Add two Vector variables named PointA and PointB and turn on Instance Editable for both, so that you can set them on each copy in the level. In the Event Graph, add a Timeline with one float track that goes from 0 to 1 and back to 0, and turn on Loop. Connect BeginPlay to Play. On Update, use a Lerp (Vector) node from PointA to PointB with the track as Alpha, and connect the result to Set Relative Location on the mesh.", "Ride the platform in PIE and check that you do not slide off."]
    done_when: "Send two screenshots from PIE that show you riding the platform at two different positions, and a screenshot of the graph. A short GIF also works, and you can paste a link to a longer video."
    xp: 25
    verify_type: screenshot
    quiz: []

  - id: LDQ22
    rank: 2
    difficulty: adept
    specializations: [gameplay_design, level_design, programming]
    subjects: [blueprint, hazards, damage]
    required: false
    title: "Traps and damage volumes"
    brief: "A trap is a place in the level that hurts the player, such as spikes or fire. Unreal has a damage system for this: the Apply Damage node sends damage to an actor, and a Pain Causing Volume is a ready-made volume that damages anything inside it. A fair trap can be seen before it hurts. In this quest you add one trap and make sure the player gets a warning."
    time_min: 30
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-07-traps-and-damage-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 trap damage volume blueprint apply damage"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/pain-causing-volume-actor-in-unreal-engine"
    checklist: ["Add one trap to your level, such as spikes or fire. The quick way is a Pain Causing Volume: drag one from the Place Actors panel, under Volumes, and set Damage Per Sec in its Details panel. The other way is a Blueprint with a Box Collision that calls Apply Damage on the Other Actor when something overlaps it. Your character only loses health if its Blueprint handles Event AnyDamage.", "Warn the player. Make the trap visible before it hurts them."]
    done_when: "Send a screenshot of the trap, and add one line that says how the player is warned."
    xp: 25
    verify_type: screenshot
    quiz: []

  - id: LDQ23
    rank: 2
    difficulty: adept
    specializations: [gameplay_design, level_design, programming]
    subjects: [blueprint, checkpoints, respawn]
    required: false
    title: "Checkpoint and respawn"
    brief: "A checkpoint is a place that the game remembers, so that the player returns there after they die or fall and does not have to start the level again. To respawn means to appear again in the level. In this quest you build a checkpoint trigger that saves a position, and you make a fall send the player back to it."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/module-6-creating-level-checkpoints-and-kill-volumes-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 checkpoint respawn kill z blueprint"
    checklist: ["Add a checkpoint trigger that stores a respawn transform. A transform is the location and rotation where the player will appear again. Make an Actor Blueprint named BP_Checkpoint with a Box Collision. When the player overlaps it, cast Other Actor to your character and store the transform of the checkpoint in a Transform variable named RespawnTransform on the character.", "Make a fall send the player back. Kill Z, the height in the World Settings below which actors are destroyed, removes the character and does not bring it back, so build your own kill volume above that height. Make an Actor Blueprint named BP_KillZone with a large Box Collision under the level. When the player overlaps it, cast Other Actor to your character and call Set Actor Transform with RespawnTransform, which moves the player back to the last checkpoint."]
    done_when: "Send three screenshots from PIE that show you reaching the checkpoint, falling, and standing at the checkpoint again after the respawn. A short GIF also works, and you can paste a link to a longer video."
    xp: 30
    verify_type: screenshot
    quiz: []

  - id: LDQ24
    rank: 2
    difficulty: adept
    specializations: [gameplay_design, level_design, programming]
    subjects: [umg, hud, prompts]
    required: false
    title: "Simple HUD prompt"
    brief: "A HUD prompt is a short text on the screen that tells the player what they can do, such as \"Press E to open\". In Unreal you build screen elements as Widget Blueprints, and their names often start with WBP_. In this quest you make a widget with one line of text and show it only while the player is near an object they can use."
    time_min: 40
    official_url: "https://dev.epicgames.com/documentation/en-us/unreal-engine/designer-04-player-hud-in-unreal-engine"
    backup_url: TODO_URL
    backup_search: "unreal engine 5 umg press e to interact prompt widget"
    extra_urls:
      - "https://dev.epicgames.com/documentation/en-us/unreal-engine/umg-ui-designer-quick-start-guide-in-unreal-engine"
    checklist: ["Make a Widget Blueprint named WBP_Prompt: in the Content Browser click Add, then User Interface, then Widget Blueprint, and choose User Widget. Open it, drag a Text widget from the Palette into the designer, and type a single line such as Press E to use.", "Show the widget on Begin Overlap when the player is near an interactable (an object the player can use), and hide it on End Overlap. In the Blueprint of the interactable, on Begin Overlap call Create Widget with the class WBP_Prompt, store the result in a variable, and call Add to Viewport. On End Overlap, call Remove from Parent on that variable."]
    done_when: "Send a screenshot of the prompt showing in PIE."
    xp: 25
    verify_type: screenshot
    quiz: []

  - id: LDQ25
    rank: 2
    difficulty: adept
    specializations: [gameplay_design, level_design, programming]
    subjects: [blueprint, puzzles, physics]
    required: false
    title: "Switch puzzle with cubes"
    brief: "A pressure plate is a switch on the floor that is active only while something stands on it. Together with a physics cube that the player can push, it makes a classic small puzzle: put the cube on the plate to keep a gate open. In this quest you build the plate and the gate, and you decide which objects are allowed to press the plate."
